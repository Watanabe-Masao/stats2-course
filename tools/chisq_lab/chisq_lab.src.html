<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カイ二乗検定ラボ</title>
<style>
/*@LABKIT_CSS@*/
:root{--c3:var(--data-3)}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.card{overflow-wrap:anywhere}
.grid input{width:5.4em;font-size:16px;min-height:40px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:right}
.grid td,.grid th{padding:3px 4px;border-bottom:0;vertical-align:middle}
.grid th{font-weight:400;font-size:13px;color:var(--mut)}
.hit{color:var(--ng);font-weight:700}
</style></head><body>
<h1>🧪 カイ二乗検定ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>

<div id="m-gof" class="mode">
 <p class="mut" style="margin:0">適合度：観測度数 O が、決めた比率どおりか。期待度数 E＝総数×比率、χ²＝Σ(O−E)²÷E。自由度＝区分の数−1−データから推定した母数の数。</p>
 <div class="row ctl"><label>区分の数 <select id="gk" data-key="k"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>α <select id="galpha" data-key="alpha"><option value="0.1">10%</option><option value="0.05" selected>5%</option><option value="0.01">1%</option></select></label></div>
 <div class="row ctl"><label>推定した母数 <select id="gm" data-key="m"><option value="0" selected>0個</option><option value="1">1個</option><option value="2">2個</option></select></label></div>
 <table class="grid ctl" id="gtab"></table>
 <div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
 <div class="res key" id="gbar"></div>
 <div class="card res key" id="gsum"></div>
 <div class="res det" id="gplot"></div>
 <div class="res det" id="gdet"></div>
</div>

<div id="m-indep" class="mode">
 <p class="mut" style="margin:0">独立性：クロス集計表の2つの分類に関係があるか。独立なら期待度数 E＝行計×列計÷総計で、どの行も割合（帯の区切り）がそろう。自由度＝(行の数−1)×(列の数−1)。</p>
 <div class="row ctl"><label>行 <select id="ir" data-key="r"><option selected>2</option><option>3</option></select></label><label>列 <select id="ic" data-key="c"><option selected>2</option><option>3</option></select></label><label>α <select id="ialpha" data-key="alpha"><option value="0.1">10%</option><option value="0.05" selected>5%</option><option value="0.01">1%</option></select></label></div>
 <table class="grid ctl" id="itab"></table>
 <div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
 <div class="res key" id="iband"></div>
 <div class="card res key" id="isum"></div>
 <div class="res det" id="iplot"></div>
 <div class="res det" id="idet"></div>
</div>

<script>
/*@LABCFG@*/
/*@LABKIT_JS@*/
const $=LK.$,esc=LK.esc;
const W=340;
const f=(v,d=4)=>{if(!isFinite(v))return "—";const r=+v.toFixed(d);return String(Object.is(r,-0)?0:r);};
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const ci of c)s+=ci/++y;return -t+Math.log(2.5066282746310005*s/x);}
function gammp(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,s=1/a,d=s;for(let n=0;n<1000;n++){ap++;d*=x/ap;s+=d;if(Math.abs(d)<Math.abs(s)*3e-15)break;}return s*Math.exp(-x+a*Math.log(x)-lgam(a));}
 let b=x+1-a,c=1/1e-300,d=1/b,h=d;for(let i=1;i<1000;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-15)break;}return 1-Math.exp(-x+a*Math.log(x)-lgam(a))*h;}
const chiCdf=(q,k)=>gammp(k/2,q/2);
function inv(cdf,p,lo,hi){for(let i=0;i<200;i++){const m=(lo+hi)/2;if(cdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
const r3=v=>Math.round(v*1000)/1000,g3=v=>v.toFixed(3);
const chiCrit=(k,a)=>r3(inv(x=>chiCdf(x,k),1-a,0,k+60*Math.sqrt(2*k)+60));   // 数表と同じ3桁の上側の点
const COLS=["var(--acc)","var(--acc2)","var(--c3)"];
const num=v=>{const x=Number(v);return isFinite(x)&&x>=0?x:0;};

function vlines(lines,X,x0,x1,top,base){let s="";const placed=[];lines.forEach(t=>{const x=Math.max(x0,Math.min(x1,t.x)),lx=X(x),near=t.label&&placed.some(p=>Math.abs(p-lx)<40),ly=near?top-15:top-3;if(t.label&&!near)placed.push(lx);s+=`<line x1="${lx}" y1="${top}" x2="${lx}" y2="${base}" stroke="${t.col}" stroke-dasharray="${t.dash||"4 3"}" stroke-width="1.5"/><text x="${lx}" y="${ly}" font-size="10.5" text-anchor="${lx>W*0.75?"end":lx<W*0.25?"start":"middle"}" fill="${t.col}">${esc(t.label)}</text>`;});return s;}
// χ² 分布と棄却域（右側）
function chiPlot(k,stat,hi){const H=150,L=12,R=W-12,base=H-26,top=26,xmax=Math.max(8,Math.ceil(Math.max(hi,stat,k+4*Math.sqrt(2*k))*1.08)),X=x=>L+x/xmax*(R-L);
 const pdf=x=>Math.exp((k/2-1)*Math.log(x)-x/2-k/2*Math.log(2)-lgam(k/2));let mx=0;const pts=[];for(let i=1;i<=200;i++){const x=xmax*i/200,y=pdf(x);pts.push([x,y]);if(isFinite(y)&&i>4&&y>mx)mx=y;}mx*=1.15;const Y=y=>base-Math.min(y,mx)/mx*(base-top);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="χ²(${k}) の分布と棄却域">`;
 const a=Math.min(hi,xmax);let p=`M${X(a).toFixed(1)} ${base}`;for(let i=0;i<=60;i++){const x=a+(xmax-a)*i/60;p+=` L${X(x).toFixed(1)} ${Y(pdf(Math.max(x,1e-6))).toFixed(1)}`;}s+=`<path d="${p} L${X(xmax).toFixed(1)} ${base} Z" fill="var(--acc2)" fill-opacity=".45"/>`;
 s+=`<path d="${pts.map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join("")}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;
 s+=`<line x1="${L}" y1="${base}" x2="${R}" y2="${base}" stroke="var(--fg)" stroke-opacity=".5"/>`;
 const step=xmax>40?10:xmax>16?5:xmax>8?2:1;for(let x=0;x<=xmax+1e-9;x+=step)s+=`<text x="${X(x)}" y="${base+14}" font-size="10" text-anchor="middle" fill="var(--fg)">${x}</text>`;
 s+=vlines([{x:stat,label:`χ²＝${f(stat,2)}`,col:"var(--fg)",dash:"2 2"},{x:hi,label:g3(hi),col:"var(--acc)"}],X,0,xmax,top,base);
 return s+`</svg><div class="legend mut"><span><i class="sw" style="background:var(--acc2);opacity:.5"></i>棄却域</span><span><i class="sw" style="background:var(--acc)"></i>χ²(${k}) と境目（数表の点）</span></div>`;}

// ---- 適合度
let gO=[26,14,22,18,0,0],gW=[1,1,1,1,1,1];
function gBuild(){const k=+$("gk").value;let h=`<tr><th>区分</th><th>観測 O</th><th>比率</th></tr>`;for(let i=0;i<k;i++)h+=`<tr><td>${i+1}</td><td><input type="number" min="0" step="1" inputmode="numeric" id="go${i}" value="${gO[i]}" aria-label="区分${i+1}の観測度数"></td><td><input type="number" min="0" step="any" inputmode="decimal" id="gw${i}" value="${gW[i]}" aria-label="区分${i+1}の比率"></td></tr>`;
 $("gtab").innerHTML=h;for(let i=0;i<k;i++){$("go"+i).oninput=e=>{gO[i]=num(e.target.value);gRender();};$("gw"+i).oninput=e=>{gW[i]=num(e.target.value);gRender();};}}
function gVals(){const k=+$("gk").value,a=+$("galpha").value,m=+$("gm").value,O=gO.slice(0,k),Wt=gW.slice(0,k),n=O.reduce((s,x)=>s+x,0),ws=Wt.reduce((s,x)=>s+x,0)||1,E=Wt.map(w=>n*w/ws),C=O.map((o,i)=>E[i]>0?(o-E[i])**2/E[i]:0),chi2=C.reduce((s,x)=>s+x,0),df=Math.max(1,k-1-m),crit=chiCrit(df,a),p=1-chiCdf(chi2,df),emin=Math.min(...E);
 const o={k,alpha:a,m,n,O,E,C,chi2,df,crit,p,decision:chi2>crit?"棄却する":"棄却しない",emin,nsmall:E.filter(e=>e<5).length};E.forEach((e,i)=>o["e"+(i+1)]=e);return o;}
function gRender(){const G=gVals(),mx=Math.max(1,...G.O,...G.E),H=130,L=30,R=W-6,base=H-22,top=8,bw=(R-L)/G.k,Y=v=>base-v/mx*(base-top);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="観測度数と期待度数">`;
 [0,mx/2,mx].forEach(v=>s+=`<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${f(v,0)}</text>`);
 G.O.forEach((o,i)=>{const x=L+i*bw,w=Math.min(22,bw/2-4);s+=`<rect x="${(x+bw/2-w-1).toFixed(1)}" y="${Y(o).toFixed(1)}" width="${w}" height="${(base-Y(o)).toFixed(1)}" rx="3" fill="var(--acc)"><title>区分${i+1} 観測 ${o}</title></rect><rect x="${(x+bw/2+1).toFixed(1)}" y="${Y(G.E[i]).toFixed(1)}" width="${w}" height="${(base-Y(G.E[i])).toFixed(1)}" rx="3" fill="var(--mut)" fill-opacity=".55"><title>区分${i+1} 期待 ${f(G.E[i],2)}</title></rect><text x="${x+bw/2}" y="${base+14}" font-size="10.5" text-anchor="middle" fill="var(--fg)">${i+1}</text>`;});
 $("gbar").innerHTML=s+`</svg><div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>観測 O</span><span><i class="sw" style="background:var(--mut);opacity:.55"></i>期待 E</span></div>`;
 $("gsum").innerHTML=`<div>総数 ${G.n}、期待度数 E＝${G.E.map(e=>f(e,2)).join("・")}</div><div>χ²＝Σ(O−E)²÷E＝<b>${f(G.chi2,3)}</b>　自由度＝${G.k}−1${G.m?`−${G.m}`:""}＝<b>${G.df}</b></div><div>境目 ${g3(G.crit)}（上側${G.alpha*100}%）　p 値＝<b>${f(G.p)}</b>　→ H₀（比率どおり）を <b>${G.decision}</b></div>${G.nsmall?`<div class="hit">期待度数が5未満の区分が ${G.nsmall} つある。χ² 近似は粗い（区分をまとめる）。</div>`:""}<div class="mut">χ² には割合ではなく件数を入れる。比率が同じでも件数が10倍なら χ² も10倍。</div>`;
 $("gplot").innerHTML=chiPlot(G.df,G.chi2,G.crit);
 $("gdet").innerHTML=`<table><tr><th>区分</th><th>O</th><th>E</th><th>(O−E)²÷E</th></tr>${G.O.map((o,i)=>`<tr><td>${i+1}</td><td>${o}</td><td>${f(G.E[i],2)}</td><td>${f(G.C[i],3)}</td></tr>`).join("")}</table>`;}
LK.register("gof",{name:"適合度",
 init(){gBuild();$("gk").onchange=()=>{gBuild();gRender();};["galpha","gm"].forEach(id=>$(id).onchange=gRender);gRender();},
 apply(s){if(s.k!==undefined)$("gk").value=String(s.k);if(s.alpha!==undefined)$("galpha").value=String(s.alpha);if(s.m!==undefined)$("gm").value=String(s.m);if(s.o)s.o.forEach((v,i)=>gO[i]=v);if(s.w)s.w.forEach((v,i)=>gW[i]=v);gBuild();gRender();},
 render:gRender,
 value(key){const G=gVals(),v=G[key];return {v,text:typeof v==="string"?v:f(v)};}});

// ---- 独立性
let iT=[[30,20,0],[20,30,0],[0,0,0]];
function iBuild(){const r=+$("ir").value,c=+$("ic").value;let h=`<tr><th></th>${[...Array(c)].map((_,j)=>`<th>列${j+1}</th>`).join("")}</tr>`;for(let i=0;i<r;i++)h+=`<tr><th>行${i+1}</th>${[...Array(c)].map((_,j)=>`<td><input type="number" min="0" step="1" inputmode="numeric" id="it${i}${j}" value="${iT[i][j]}" aria-label="行${i+1}列${j+1}"></td>`).join("")}</tr>`;
 $("itab").innerHTML=h;for(let i=0;i<r;i++)for(let j=0;j<c;j++)$("it"+i+j).oninput=e=>{iT[i][j]=num(e.target.value);iRender();};}
function iVals(){const r=+$("ir").value,c=+$("ic").value,a=+$("ialpha").value,T=iT.slice(0,r).map(row=>row.slice(0,c)),rs=T.map(row=>row.reduce((s,x)=>s+x,0)),cs=[...Array(c)].map((_,j)=>T.reduce((s,row)=>s+row[j],0)),n=rs.reduce((s,x)=>s+x,0)||1;
 const E=T.map((row,i)=>row.map((_,j)=>rs[i]*cs[j]/n)),C=T.map((row,i)=>row.map((o,j)=>E[i][j]>0?(o-E[i][j])**2/E[i][j]:0)),chi2=C.flat().reduce((s,x)=>s+x,0),df=(r-1)*(c-1),crit=chiCrit(df,a),p=1-chiCdf(chi2,df),flat=E.flat();
 const o={r,c,alpha:a,T,rs,cs,n,E,C,chi2,df,crit,p,decision:chi2>crit?"棄却する":"棄却しない",emin:Math.min(...flat),nsmall:flat.filter(e=>e<5).length};E.forEach((row,i)=>row.forEach((e,j)=>o[`e${i+1}${j+1}`]=e));return o;}
// 帯グラフ：行ごとの割合を100%の横帯で並べる。最後の帯は全体（独立なら各行がこれにそろう）
function band(I){const rows=I.T.map((row,i)=>({name:`行${i+1}`,v:row,t:I.rs[i]})).concat([{name:"全体",v:I.cs,t:I.n}]),L=40,R=W-8,bh=22,gap=10,top=6,H=top+rows.length*(bh+gap)+16;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="行ごとの割合の帯グラフ">`;
 let acc=0;const cut=I.cs.slice(0,-1).map(v=>(acc+=v)/I.n);
 rows.forEach((rw,i)=>{const y=top+i*(bh+gap)+(i===rows.length-1?4:0);let x=L;s+=`<text x="${L-6}" y="${y+bh/2+4}" font-size="11" text-anchor="end" fill="var(--fg)">${rw.name}</text>`;
  rw.v.forEach((v,j)=>{const w=rw.t>0?v/rw.t*(R-L):0;if(w>0){s+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0,w-2).toFixed(1)}" height="${bh}" rx="3" fill="${COLS[j]}"${i===rows.length-1?' fill-opacity=".7"':""}><title>${rw.name}・列${j+1}：${v}（${f(rw.t?v/rw.t*100:0,1)}%）</title></rect>`;if(w>34)s+=`<text x="${(x+w/2-1).toFixed(1)}" y="${y+bh/2+4}" font-size="10.5" text-anchor="middle" fill="#fff">${f(v/rw.t*100,0)}%</text>`;}x+=w;});});
 const yb=top+(rows.length-1)*(bh+gap)+bh+4;cut.forEach(q=>{const x=L+q*(R-L);s+=`<line x1="${x.toFixed(1)}" y1="${top-2}" x2="${x.toFixed(1)}" y2="${yb+2}" stroke="var(--fg)" stroke-dasharray="3 3" stroke-width="1.2"/>`;});
 s+=`<text x="${L}" y="${H-2}" font-size="10" fill="var(--mut)">0%</text><text x="${R}" y="${H-2}" font-size="10" text-anchor="end" fill="var(--mut)">100%</text>`;
 return s+`</svg><div class="legend mut">${I.cs.map((_,j)=>`<span><i class="sw" style="background:${COLS[j]}"></i>列${j+1}</span>`).join("")}<span>点線＝全体の区切り（独立ならどの行もここにそろう）</span></div>`;}
function iRender(){const I=iVals();$("iband").innerHTML=band(I);
 $("isum").innerHTML=`<div>総計 ${I.n}　期待度数 E₁₁＝${f(I.rs[0],0)}×${f(I.cs[0],0)}÷${I.n}＝${f(I.E[0][0],2)}　最小の E＝${f(I.emin,2)}</div><div>χ²＝<b>${f(I.chi2,3)}</b>　自由度＝(${I.r}−1)×(${I.c}−1)＝<b>${I.df}</b>　境目 ${g3(I.crit)}</div><div>p 値＝<b>${f(I.p)}</b>　→ H₀（独立）を <b>${I.decision}</b></div>${I.nsmall?`<div class="hit">期待度数が5未満のセルが ${I.nsmall} つある。χ² 近似は粗い。</div>`:""}<div class="mut">棄却しても「関連がある」まで。どちらが原因かは言えない。どの向きの関連かは帯（行ごとの割合）で見る。</div>`;
 $("iplot").innerHTML=chiPlot(I.df,I.chi2,I.crit);
 $("idet").innerHTML=`<table><tr><th>セル</th><th>O</th><th>E</th><th>(O−E)²÷E</th></tr>${I.T.map((row,i)=>row.map((o,j)=>`<tr><td>行${i+1}列${j+1}</td><td>${o}</td><td>${f(I.E[i][j],2)}</td><td>${f(I.C[i][j],3)}</td></tr>`).join("")).join("")}</table>`;}
LK.register("indep",{name:"独立性",
 init(){iBuild();["ir","ic"].forEach(id=>$(id).onchange=()=>{iBuild();iRender();});$("ialpha").onchange=iRender;iRender();},
 apply(s){if(s.r!==undefined)$("ir").value=String(s.r);if(s.c!==undefined)$("ic").value=String(s.c);if(s.alpha!==undefined)$("ialpha").value=String(s.alpha);if(s.t)s.t.forEach((row,i)=>row.forEach((v,j)=>iT[i][j]=v));iBuild();iRender();},
 render:iRender,
 value(key){const I=iVals(),v=I[key];return {v,text:typeof v==="string"?v:f(v)};}});

LK.start("indep");
window.__LAB__={LK,gVals,iVals,chiCdf,chiCrit,setG:(o,w)=>{o.forEach((v,i)=>gO[i]=v);if(w)w.forEach((v,i)=>gW[i]=v);gBuild();gRender();},setT:t=>{t.forEach((row,i)=>row.forEach((v,j)=>iT[i][j]=v));iBuild();iRender();}};
</script>
</body></html>
