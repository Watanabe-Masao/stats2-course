id: LAB-ts
name: 時系列ラボ
slug: ts                         # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: ts_lab.src.html             # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [ratio.html, growth.html, ma.html]   # 旧版 補講05-T の3つのラボ（増減率・平均成長率・移動平均と自己相関）をまとめた
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予測と照らし合わせられる値（build が検査する）
  - key: ratio
    name: 増減を重ねる
    purpose: 2回の増減率は足さず倍率を掛ける。指数（最初＝100）も出す
    set: [x0, r1, r2]
    values: [total, x2, naive]     # total＝全体の増減率（%）
  - key: growth
    name: 平均成長率
    purpose: 倍率の幾何平均だけが実際の最後の値を再現する。算術平均の線と比べる
    set: [m, rates]
    values: [gmean, amean, final]  # gmean＝幾何平均による平均成長率（%）
  - key: ma
    name: 移動平均
    purpose: 中央・後方の移動平均、窓の幅、計算できる時点
    set: [series, k, type]
    values: ["ma:1", "ma:2", "ma:3", "ma:4", count]
  - key: acf
    name: 自己相関
    purpose: k 日ずらした自分自身との相関。曜日の波はラグ7、トレンドは全ラグを正に寄せる。棒を押すと、そのラグの組（その日と k 日後）の散布図が出て、棒の高さと点の並び方がつながる
    set: [wave, trend, lag]
    values: ["r:1", "r:7", peak, lag]
  - key: contrib
    name: 寄与度
    purpose: 部門の増減額÷全体の前期。足すと全体の増減率
    set: [a0, a1, b0, b1]
    values: [total, cA, cB, rateA]
data: 増減は最初の値と2回の率（%）。平均成長率は最初＝100。移動平均は月別数量 10,14,12,18,16・月別売上 20,26,23,29,32・日販4週間（固定の乱数 seed 11）。自己相関は日販56日（曜日の波×2＋トレンド×0.25×日＋小さなゆらぎ）
presets:
  s1-ratio:
    mode: ratio
    set: {x0: 80, r1: 25, r2: -10}
    task: 80パックが25%増えて、その後10%減った。全体では何%増えたか。
    predict: {type: number, key: total, label: "全体の増減率", unit: "%"}
    expect: 12.5
    why: 1.25×0.90＝1.125。2回目の基準は増えた後の100なので、25−10＝15%にはならない。1回目を＋20%、2回目を−20%にして元に戻らないことも確かめる。
  s1-growth:
    mode: growth
    set: {m: 4, rates: "25,-10,20,-20"}
    task: 4期の増減率が ＋25%、−10%、＋20%、−20% だった。平均して毎期何%ずつ増えたか（幾何平均）。
    predict: {type: number, key: gmean, label: "平均成長率", unit: "%"}
    expect: 1.943
    why: 累計倍率は 1.25×0.9×1.2×0.8＝1.08。その4乗根から1を引いて約1.94%。算術平均の3.75%で4回増やすと、実際の108より大きくなる。
  s2-ma:
    mode: ma
    set: {series: day, k: 3, type: center}
    task: 日販4週間で、窓を3点から7点に広げると曜日の上下がどう変わるかを見る。次に「後方」にして、最新の日まで計算できるかを確かめる。
  s4-acf:
    mode: acf
    modes: [acf, ma]
    task: 曜日の波を0〜10、トレンドを0〜10に動かし、自己相関のどのラグが高くなるかを見る。棒を押して、ラグ7 とラグ3 の散布図（その日と k 日後の組）を比べる。次に「移動平均」で日販を7点でならす。
  s5-same:
    mode: growth
    set: {m: 2, rates: "10,10"}
    task: 2期とも＋10% のとき、最後の値と、算術平均・幾何平均の平均成長率を読む。次の版（＋30%・−10%）と比べる。
  s5-spread:
    mode: growth
    set: {m: 2, rates: "30,-10"}
    task: ＋30%・−10%（率の算術平均は前の版と同じ＋10%）のとき、最後の値を読む。前の版の最後の値との差を、倍率の平均からのずれと結びつける。
  s5-up:
    mode: growth
    set: {m: 2, rates: "50,-20"}
    task: ＋50% のあと −20% のとき、最後の値と平均成長率を読む。途中の値は倍率から計算する。次の版（順番を入れ替えた −20%・＋50%）と比べる。
  s5-down:
    mode: growth
    set: {m: 2, rates: "-20,50"}
    task: −20% のあと ＋50% のとき、最後の値と平均成長率を読む。途中の値は倍率から計算し、前の版と、同じ数・違う数を分ける。
  s5-mix:
    mode: acf
    set: {wave: 10, trend: 10}
    task: 曜日の波も右上がりの傾向も大きく入れた日販で、ラグ6・7・8 の自己相関の棒を比べる。ラグ7 が、となりより飛び出しているかを見る。次に傾向のつまみを小さく（たとえば3に）して、ラグ7 の棒がどう変わるかを見る。
  s6-cal:
    mode: contrib
    set: {a0: 18, a1: 18, b0: 22, b1: 22}
    task: A を土日、B を平日とみる（単位は百万円）。前年3月は土日9日×200万円＝18、平日22日×100万円＝22 で始まる。今年の3月（土日10日・平日21日）に、1日あたりの売上を前年のままとして当てはめた値を自分で計算し、A今期・B今期をその値に動かす。全体の増減率と、土日・平日の寄与度を読む。
used_by: [U05T]
tests:
  - node tools/test_labs.js            # 全部の版：エラー・380px・ライト／ダーク・予測の前に結果が隠れる・予測の答え＝ラボの値・埋め込み
  - node tools/ts_lab/check.js         # 本文の値（12.5%・6.07%・14.67・寄与度 6/−2、自己相関はラグ7が最大）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
