id: LAB-sample
name: 標本ラボ
slug: sample                     # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: sample_lab.src.html         # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 2
replaces_legacy: [frame.html]   # 旧版 教科書03 の「抽出枠」ラボの機能を含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: rand
    name: 無作為に取る
    purpose: x̄ は取り直すと変わり μ のまわりにばらつく。n＝100 は全数調査
    set: [n]
    values: [varies]             # 毎回変わる／毎回同じ
  - key: frame
    name: 名簿の漏れ
    purpose: 抽出枠の偏りは n を増やしても消えない（x̄ は名簿内の平均に集まる）
    set: [m, n]
    values: [approach, frameMean]   # approach＝名簿内の平均が μ より低い／ほぼμ／高い
  - key: resp
    name: 自分から回答
    purpose: 自発的な回答の偏り。偏りの強さ0と比べる
    set: [k]
    values: [direction, respMean]   # respMean＝返事の平均が集まる所（返事の確率で重みを付けた平均）
  - key: space
    name: 標本空間
    purpose: 試行・標本空間・事象・余事象（確率の言葉）
    set: [ev]
    values: [prob]
data: 固定の乱数（seed 3）で作る100店の廃棄率。μ＝2.542%、最小1.4%、最大3.8%。漏れ20%の名簿内の平均 2.364%、自分から回答（強さ6）の集まる所 2.171%
# 段階ごとの使い方（本文では {{lab:LAB-sample@名前}}）。問題ごとの使い方は problems/*.yaml の lab に書く。
presets:
  s1-rand:
    mode: rand
    set: {n: 10}
    task: n＝10 のまま「10回続けて」を押すと、x̄ は毎回同じか、変わるか。
    predict: {type: choice, key: varies, label: "x̄ は", options: [毎回同じ, 毎回変わる]}
    expect: 毎回変わる
    why: x̄ は選んだ店で決まる統計量なので、取り直すたびに変わり μ のまわりに散らばる。n を100にすると全数調査になり、毎回 μ と一致する。
  s2-frame:
    mode: frame
    set: {m: 20, n: 10}
    task: 漏れ20%のまま n を10→60に増やして「20回取り直す」を押す。x̄ の平均は μ（2.54%）に近づくか。
    predict: {type: choice, key: approach, label: "x̄ の平均は", options: [μより低い, ほぼμ, μより高い]}
    expect: μより低い
    why: 名簿に載っていない店（廃棄率が高め）は選ばれないので、x̄ は名簿内の平均（2.36%）に集まる。n を増やしても μ には近づかない。
  s4-bias:
    mode: frame
    modes: [frame, resp]
    task: 「名簿の漏れ」と「自分から回答」を順に動かし、上の表のどの場面がどちらの偏りに当たるかを考える。
  s5-rand:
    mode: rand
    set: {n: 10}
    task: n を 10 → 50 → 90 → 100 と増やして「10回続けて」を押し、x̄ のばらつき（標準偏差）がどう小さくなるかを見る。
  s6-free:
    mode: rand
    modes: [rand, frame, resp]
    task: 自分の設計や考え方を、3つのモードで確かめる（無作為なら μ のまわりに集まるか、偏りがあればどちらにずれるか）。
used_by: [U03]
tests:
  - node tools/test_labs.js            # out/labs の全部：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値・埋め込み
  - node tools/sample_lab/check.js     # 無作為≒μ、全数＝μ、漏れ・自発回答はずれる（本文の 2.54・−0.18・2.17）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
