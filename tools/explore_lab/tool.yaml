id: LAB-explore
name: 探究ラボ
slug: explore                    # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: explore_lab.src.html        # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: []              # 新しく作ったラボ（発展・創造の探究用。答えの照合はしない）
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: sandbox
    name: データを動かす
    purpose: 2店×120日の架空データ（曜日・天気・キャンペーン・店の改装・台風と大口注文の日を含む）を、見る値・分け方・絞り方・図を選んで動かす。散布図（横軸を選ぶ・群ごとの相関）とクロス集計（行ごとの割合の帯グラフ）も描ける。群ごとの日数・平均・中央値・標準偏差と、試したことの記録を出す。予想と照合しない
    set: [value, group, filter, chart, second]   # second＝散布図の横軸・クロス集計の列
    values: [diff]
data: 固定の乱数（seed 20261029）で作る架空の2店×120日。客数は店・週末・天気・キャンペーン・B店の61日目からの改装で変わり、キャンペーンは週末に多い（群が混ざる）。A店42日目は台風、B店89日目は大口注文
presets:
  s6-camp:
    mode: sandbox
    set: {value: sales, group: camp, filter: all, chart: box}
    task: 「キャンペーンの日は売上が高い。だからキャンペーンは効いている」と言えるか。分け方・絞り方・図を変えて、差が何によって生まれているかを探る。
  s6-cross:
    mode: sandbox
    set: {value: sales, group: camp, filter: all, chart: cross, second: week}
    task: キャンペーンの有無と平日／週末は独立か。偏りがあると、売上の比べ方にどう効くか。分け方と列を切り替えて探る。
  s6-scatter:
    mode: sandbox
    set: {value: sales, group: store, filter: all, chart: scatter, second: cust}
    task: 売上と客数・客単価・日付の散布図を、店で色分けして見る。全体の相関と店ごとの相関、特別な日の点の効き方を比べる。
  s6-reg:
    mode: sandbox
    set: {value: sales, group: half, filter: B, chart: scatter, second: cust}
    task: 客数から売上を1本の直線で予測してよいか。店・前半／後半で分け、特別な日を除いて、点の並び方を比べる。
  s6-adjust:
    mode: sandbox
    set: {value: sales, group: camp, filter: weekday, chart: box}
    task: キャンペーンの効果は、何をそろえれば言えるか。平日だけ・週末だけ・店だけに絞り、分け方や図を変えて、そろえる条件で差がどう変わるかを見る。
  s6-design:
    mode: sandbox
    set: {value: sales, group: camp, filter: all, chart: cross, second: week}
    task: キャンペーンの日は売上が高いが、キャンペーンは週末に多い。この観察データで言えることと言えないことを分け、効果を確かめるならどの日にキャンペーンをするかをどう決めるかを考える。
  s6-free:
    mode: sandbox
    task: 自分で問いを立て、見る値・分け方・絞り方・図を選んで動かす。統計で言えることと、自分の解釈を分けて書く。
used_by: [U05, U27, U28, U29, U30, U32]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・埋め込み
  - node tools/explore_lab/check.js      # データの仕組み（キャンペーンの差が、平日だけに絞ると小さくなる）
checked:
  browser_380px: 2026-10-29
  notion_iphone: null
