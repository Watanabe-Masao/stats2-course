<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探究ラボ</title>
<style>
/*@LABKIT_CSS@*/
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.card{overflow-wrap:anywhere}
.ctl label{margin-right:6px}
.log{font-size:13px;margin:4px 0;padding-left:1.2em}
.log li{margin:2px 0}
.qs{font-size:13px;line-height:1.6}
</style></head><body>
<h1>🧪 探究ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>

<div id="m-sandbox" class="mode">
 <p class="mut" style="margin:0">2店の120日分のデータ（架空）。何を見るか・どう分けるか・どこに絞るか・どの図で見るかを自分で決める。答えは1つではない。統計で言えることと、自分の解釈を分けて考える。</p>
 <div class="row ctl"><label>見る値 <select id="xv" data-key="value"><option value="sales">売上（万円）</option><option value="cust">客数（人）</option><option value="ticket">客単価（円）</option></select></label></div>
 <div class="row ctl"><label>分ける <select id="xg" data-key="group"><option value="none">分けない</option><option value="camp">キャンペーン</option><option value="week">平日／週末</option><option value="weather">天気</option><option value="store">店</option><option value="half">前半／後半</option></select></label></div>
 <div class="row ctl"><label>絞る <select id="xf" data-key="filter"><option value="all">全部の日</option><option value="weekday">平日だけ</option><option value="weekend">週末だけ</option><option value="A">A店だけ</option><option value="B">B店だけ</option><option value="noevent">特別な日を除く</option></select></label></div>
 <div class="row ctl"><label>図 <select id="xc" data-key="chart"><option value="box">箱ひげ図</option><option value="dots">点</option><option value="hist">ヒストグラム</option><option value="time">日付の順</option><option value="scatter">散布図</option><option value="cross">クロス集計</option></select></label></div>
 <div class="row ctl" id="xsrow"><label>横軸・列 <select id="xs" data-key="second"><option value="cust">客数</option><option value="ticket">客単価</option><option value="sales">売上</option><option value="day">日付</option><option value="week">平日／週末</option><option value="weather">天気</option><option value="camp">キャンペーン</option><option value="store">店</option></select></label></div>
 <div class="res key" id="xplot"></div>
 <div class="card res key" id="xsum"></div>
 <div class="card res det" id="xlog"></div>
 <div class="card res det qs" id="xq"></div>
</div>

<script>
/*@LABCFG@*/
/*@LABKIT_JS@*/
const $=LK.$,esc=LK.esc;
const f=(v,d=1)=>{if(typeof v!=="number"||!isFinite(v))return "—";const r=+v.toFixed(d);return String(Object.is(r,-0)?0:r);};
const W=340;
// ---- データ（固定の乱数で毎回同じ。架空）
function rng(s){let seed=s;return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function normal(r){let u=0,v=0;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const DAYS=(()=>{const r=rng(20261029),out=[];
 for(const st of ["A","B"])for(let d=0;d<120;d++){const wk=(d%7===5||d%7===6),u=r(),weather=u<0.6?"晴れ":u<0.85?"曇り":"雨",camp=r()<(wk?0.6:0.15);
  let cust=(st==="A"?620:450)+(wk?160:0)+(weather==="晴れ"?40:weather==="雨"?-110:0)+(camp?45:0)+(st==="B"&&d>=60?90:0)+normal(r)*45;
  let ticket=(st==="A"?510:530)+(wk?30:0)+(camp?-15:0)+normal(r)*25;
  let ev="";if(st==="A"&&d===41){cust*=0.45;ev="台風";}if(st==="B"&&d===88){ticket+=900;ev="大口注文";}
  cust=Math.round(cust);ticket=Math.round(ticket);out.push({st,d,wk,weather,camp,cust,ticket,sales:cust*ticket/10000,ev});}
 return out;})();
const GROUPS={none:{name:"全体",of:()=>"全体"},camp:{name:"キャンペーン",of:x=>x.camp?"あり":"なし"},week:{name:"平日／週末",of:x=>x.wk?"週末":"平日"},weather:{name:"天気",of:x=>x.weather},store:{name:"店",of:x=>x.st+"店"},half:{name:"前半／後半",of:x=>x.d<60?"前半":"後半"}};
const ORDER={"全体":0,"なし":0,"あり":1,"平日":0,"週末":1,"晴れ":0,"曇り":1,"雨":2,"A店":0,"B店":1,"前半":0,"後半":1};
const FILT={all:()=>true,weekday:x=>!x.wk,weekend:x=>x.wk,A:x=>x.st==="A",B:x=>x.st==="B",noevent:x=>!x.ev};
const FNAME={all:"全部の日",weekday:"平日だけ",weekend:"週末だけ",A:"A店だけ",B:"B店だけ",noevent:"特別な日を除く"};
const VNAME={sales:"売上（万円）",cust:"客数（人）",ticket:"客単価（円）"};
const COL=["var(--acc)","var(--acc2)","#2a9d8f"];
const med=s=>{const n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;};
function stats(v){const s=[...v].sort((a,b)=>a-b),n=s.length,h=Math.floor(n/2),m=v.reduce((a,b)=>a+b,0)/n;
 const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(n-1));const q1=med(s.slice(0,h)),q3=med(s.slice(n-h));
 return {n,mean:m,median:med(s),sd,q1,q3,min:s[0],max:s[n-1],s};}
function cur(){const vk=$("xv").value,g=$("xg").value,fk=$("xf").value,ch=$("xc").value,rows=DAYS.filter(FILT[fk]);
 const by={};rows.forEach(x=>{const k=GROUPS[g].of(x);(by[k]=by[k]||[]).push(x);});
 const keys=Object.keys(by).sort((a,b)=>(ORDER[a]??9)-(ORDER[b]??9));
 const st=keys.map(k=>({k,rows:by[k],S:stats(by[k].map(x=>x[vk]))}));
 return {vk,g,fk,ch,rows,st};}
const LOG=[];
function render(){const C=cur(),all=C.rows.map(x=>x[C.vk]),lo0=Math.min(...all),hi0=Math.max(...all),pad=(hi0-lo0)*0.04,lo=lo0-pad,hi=hi0+pad,X=v=>16+(v-lo)/(hi-lo)*(W-32),dec=C.vk==="sales"?1:0;
 let s="";
 if(C.ch==="box"||C.ch==="dots"){const rh=46;s=`<svg viewBox="0 0 ${W} ${C.st.length*rh+26}" width="${W}" role="img" aria-label="群ごとの図">`;
  C.st.forEach((g,i)=>{const y=i*rh+28,c=COL[i%3],S=g.S;s+=`<text x="2" y="${y-14}" font-size="12" font-weight="700" fill="var(--fg)">${esc(g.k)}（${S.n}日）</text>`;
   if(C.ch==="box"){s+=`<line x1="${X(S.min)}" y1="${y}" x2="${X(S.max)}" y2="${y}" stroke="${c}" stroke-width="1.5"/><rect x="${X(S.q1)}" y="${y-9}" width="${Math.max(1,X(S.q3)-X(S.q1))}" height="18" rx="3" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="2"/><line x1="${X(S.median)}" y1="${y-9}" x2="${X(S.median)}" y2="${y+9}" stroke="${c}" stroke-width="3"/><path d="M${X(S.mean)} ${y+11} l-4 7 h8 z" fill="${c}"/>`;}
   else g.rows.forEach((x,j)=>{s+=`<circle cx="${X(x[C.vk])}" cy="${y-8+((j*37)%17)}" r="2.6" fill="${x.ev?"var(--ng)":c}" fill-opacity=".7"/>`;});});
  s+=ticks(lo,hi,C.st.length*rh+20,X)+`</svg><div class="legend mut">${C.ch==="box"?"<span>箱＝Q₁〜Q₃、太線＝中央値、▲＝平均、線＝最小〜最大</span>":"<span>点＝1日。赤＝特別な日（台風・大口注文）</span>"}</div>`;}
 else if(C.ch==="hist"){const bins=12,w=(hi-lo)/bins,H=70;s="";C.st.forEach((g,i)=>{const cnt=Array(bins).fill(0);g.rows.forEach(x=>cnt[Math.min(bins-1,Math.floor((x[C.vk]-lo)/w))]++);const mx=Math.max(...cnt,1),c=COL[i%3];
   s+=`<svg viewBox="0 0 ${W} ${H+18}" width="${W}" role="img" aria-label="ヒストグラム"><text x="2" y="12" font-size="12" font-weight="700" fill="var(--fg)">${esc(g.k)}（${g.S.n}日）</text>`;
   cnt.forEach((n,b)=>{const h=n/mx*(H-18);s+=`<rect x="${X(lo+b*w)}" y="${H-h}" width="${Math.max(1,X(lo+(b+1)*w)-X(lo+b*w)-1)}" height="${h}" fill="${c}" fill-opacity=".7"/>`;});
   s+=`<line x1="16" y1="${H}" x2="${W-16}" y2="${H}" stroke="var(--line)"/>`+(i===C.st.length-1?ticks(lo,hi,H+14,X):"")+`</svg>`;});}
 else if(C.ch==="scatter"){const sk=$("xs").value,num=["cust","ticket","sales","day"].includes(sk)?sk:"cust",gx=x=>num==="day"?x.d+1:x[num],xs=C.rows.map(gx),xlo=Math.min(...xs),xhi=Math.max(...xs),H=170,XX=v=>30+(v-xlo)/((xhi-xlo)||1)*(W-46),Y=v=>H-8-(v-lo)/(hi-lo)*(H-16);
  s=`<svg viewBox="0 0 ${W} ${H+20}" width="${W}" role="img" aria-label="散布図">`;C.st.forEach((g,i)=>g.rows.forEach(x=>{s+=`<circle cx="${XX(gx(x))}" cy="${Y(x[C.vk])}" r="2.6" fill="${x.ev?"var(--ng)":COL[i%3]}" fill-opacity=".7"/>`;}));
  const r=corr(C.rows.map(gx),C.rows.map(x=>x[C.vk]));s+=`<line x1="30" y1="${H}" x2="${W-16}" y2="${H}" stroke="var(--line)"/><line x1="30" y1="8" x2="30" y2="${H}" stroke="var(--line)"/><text x="${W-16}" y="${H+15}" font-size="11" text-anchor="end" fill="var(--mut)">${esc({cust:"客数",ticket:"客単価",sales:"売上",day:"日付"}[num])}（${f(xlo,0)}〜${f(xhi,0)}）</text></svg><div class="legend mut">${C.st.map((g,i)=>`<span><i class="sw" style="background:${COL[i%3]}"></i>${esc(g.k)}（r＝${f(corr(g.rows.map(gx),g.rows.map(x=>x[C.vk])),2)}）</span>`).join("")}<span>全体 r＝${f(r,2)}</span></div>`;}
 else if(C.ch==="cross"){const sk=$("xs").value,cat=["week","weather","camp","store"].includes(sk)?sk:"week",col=x=>GROUPS[cat].of(x),cols=[...new Set(C.rows.map(col))].sort((a,b)=>(ORDER[a]??9)-(ORDER[b]??9));
  s=`<table><tr><th>${esc(GROUPS[C.g].name)}＼${esc(GROUPS[cat].name)}</th>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th>計</th></tr>${C.st.map(g=>`<tr><td>${esc(g.k)}</td>${cols.map(c=>`<td>${g.rows.filter(x=>col(x)===c).length}</td>`).join("")}<td>${g.rows.length}</td></tr>`).join("")}</table>`;
  s+=`<svg viewBox="0 0 ${W} ${C.st.length*30+10}" width="${W}" role="img" aria-label="帯グラフ">`+C.st.map((g,i)=>{let x0=70,h="";cols.forEach((c,j)=>{const w=g.rows.filter(x=>col(x)===c).length/g.rows.length*(W-86);h+=`<rect x="${x0}" y="${i*30+6}" width="${w}" height="20" fill="${COL[j%3]}" fill-opacity=".75" stroke="var(--bg)"/>`;x0+=w;});return `<text x="2" y="${i*30+20}" font-size="12" fill="var(--fg)">${esc(g.k)}</text>`+h;}).join("")+`</svg><div class="legend mut">${cols.map((c,j)=>`<span><i class="sw" style="background:${COL[j%3]}"></i>${esc(c)}</span>`).join("")}<span>行ごとの割合</span></div>`;}
 else{const H=150,Y=v=>H-8-(v-lo)/(hi-lo)*(H-16),T=d=>16+d/119*(W-32);s=`<svg viewBox="0 0 ${W} ${H+18}" width="${W}" role="img" aria-label="日付の順">`;
  C.st.forEach((g,i)=>{g.rows.forEach(x=>{s+=`<circle cx="${T(x.d)}" cy="${Y(x[C.vk])}" r="2.4" fill="${x.ev?"var(--ng)":COL[i%3]}" fill-opacity=".7"/>`;});});
  s+=`<line x1="16" y1="${H}" x2="${W-16}" y2="${H}" stroke="var(--line)"/>`+[0,30,60,90,119].map(d=>`<text x="${T(d)}" y="${H+14}" font-size="10" text-anchor="middle" fill="var(--mut)">${d+1}日</text>`).join("")+`</svg><div class="legend mut">${C.st.map((g,i)=>`<span><i class="sw" style="background:${COL[i%3]}"></i>${esc(g.k)}</span>`).join("")}<span>赤＝特別な日</span></div>`;}
 $("xplot").innerHTML=s;$("xsrow").style.display=(C.ch==="scatter"||C.ch==="cross")?"":"none";
 $("xsum").innerHTML=`<div class="mut">${esc(VNAME[C.vk])}・${esc(GROUPS[C.g].name)}で分ける・${esc(FNAME[C.fk])}</div><table><tr><th>群</th><th>日数</th><th>平均</th><th>中央値</th><th>標準偏差</th></tr>${C.st.map(g=>`<tr><td>${esc(g.k)}</td><td>${g.S.n}</td><td>${f(g.S.mean,dec)}</td><td>${f(g.S.median,dec)}</td><td>${f(g.S.sd,dec)}</td></tr>`).join("")}</table>${C.st.length===2?`<div>平均の差（${esc(C.st[1].k)}−${esc(C.st[0].k)}）：<b>${f(C.st[1].S.mean-C.st[0].S.mean,dec)}</b></div>`:""}`;
 const key=[C.vk,C.g,C.fk,C.ch,$("xs").value].join("|");if(LOG[LOG.length-1]?.key!==key){const CN={box:"箱ひげ図",dots:"点",hist:"ヒストグラム",time:"日付の順",scatter:"散布図",cross:"クロス集計"},SN=$("xs").options[$("xs").selectedIndex].text;LOG.push({key,t:`${VNAME[C.vk]}を${GROUPS[C.g].name==="全体"?"分けずに":GROUPS[C.g].name+"で分けて"}・${FNAME[C.fk]}・${CN[C.ch]}${C.ch==="scatter"||C.ch==="cross"?"（"+SN+"）":""}${C.st.length===2?`（差 ${f(C.st[1].S.mean-C.st[0].S.mean,dec)}）`:""}`});if(LOG.length>12)LOG.shift();}
 $("xlog").innerHTML=`<div class="lk-ft">試したこと（このページを閉じると消える）</div><ol class="log">${LOG.map(l=>`<li>${esc(l.t)}</li>`).join("")}</ol>`;
 $("xq").innerHTML=`<div class="lk-ft">考えるための問い（答えは1つではない）</div><div>・いま見えている差は、何と何の差か。ほかに同時に違っているものはないか。</div><div>・分け方や絞り方を変えると、差はどう変わったか。変わらなかったものは何か。</div><div>・統計で言えること（この日数・このデータで）と、自分の解釈（理由の見立て・判断）を分けて書く。</div><div>・解釈を確かめるには、次にどんなデータを、どう集めればよいか。</div>`;}
function corr(a,b){const n=a.length,ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;let sab=0,saa=0,sbb=0;for(let i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2;}return sab/Math.sqrt(saa*sbb);}
function ticks(lo,hi,y,X){const r=hi-lo,st=r>600?200:r>200?50:r>60?20:r>25?10:5;let h="";for(let t=Math.ceil(lo/st)*st;t<=hi;t+=st)h+=`<text x="${X(t)}" y="${y}" font-size="11" text-anchor="middle" fill="var(--mut)">${t}</text>`;return h;}
LK.register("sandbox",{name:"データを動かす",
 init(){["xv","xg","xf","xc","xs"].forEach(id=>$(id).onchange=render);render();},
 apply(s){LOG.length=0;if(s.value)$("xv").value=s.value;if(s.group)$("xg").value=s.group;if(s.filter)$("xf").value=s.filter;if(s.chart)$("xc").value=s.chart;if(s.second)$("xs").value=s.second;render();},
 render,
 value(key){const C=cur();if(key==="diff"&&C.st.length===2){const v=C.st[1].S.mean-C.st[0].S.mean;return {v,text:f(v)};}return {v:null,text:"—"};}});
LK.start("sandbox");
window.__LAB__={LK,DAYS,cur,stats};
</script>
</body></html>
