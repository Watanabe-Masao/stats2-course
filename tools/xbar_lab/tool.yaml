id: LAB-xbar
name: 標本平均ラボ
slug: xbar                       # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: xbar_lab.src.html           # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [sim_clt.html, unb.html]   # 旧版 教科書18 の「n を4倍で SE が半分」を se、「n−1 で割る s² の平均は σ²」を unb に含む。中心極限定理（形が正規に近づく）は U19
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: se
    name: 平均のぶれ
    purpose: 1個の分布（σ）と n 個の平均の分布（SE＝σ÷√n）を重ねる。中心は μ のまま、n を4倍で SE は半分。「200回取り直す」で実際のぶれも見る（固定の乱数）
    set: [mu, sd, n]
    values: [se, var, sdsum, varsum, ratio, se4]
  - key: prop
    name: 比率のぶれ
    purpose: 標本比率 p̂ の SE＝√(p(1−p)÷n)、±2SE、目標の SE に必要な人数
    set: [p, n, e]                # e：目標の SE
    values: [se, var, margin, nFor, nWorst]
  - key: unb
    name: 不偏分散
    purpose: 2〜6個の母集団から戻しながら n 個取る全標本で、n で割る分散 v と n−1 で割る s² の平均を σ² と比べる
    set: [vals, n]
    values: [sigma2, meanV, meanS2, ratio, meanM, varM, count]
data: スライダーと値の入力で決める（データの読み込みなし）。「200回取り直す」は正規分布の母集団から固定の乱数（seed 11）で作る
presets:
  s1-se:
    mode: se
    set: {mu: 50, sd: 12, n: 36}
    task: 商品1個の重さは平均50g・標準偏差12g。36個の平均重量の標準誤差（SE）は何gか。
    predict: {type: number, key: se, label: "SE", unit: "g"}
    expect: 2
    why: 12÷√36＝12÷6＝2g。1個ずつのばらつき12gはそのまま。n を9にすると4g、144にすると1g。n を4倍で SE は半分。
  s1-unb:
    mode: unb
    set: {vals: "1,3,5", n: 2}
    task: 3つの値 1・3・5（母分散 σ²＝8/3≒2.667）から、戻しながら2個取る標本は9通り。n で割る分散 v を9通り平均するといくつか（小数で）。
    predict: {type: number, key: meanV, label: "v の平均"}
    expect: 1.3333
    why: (n−1)/n×σ²＝1/2×8/3≒1.333 で、σ² の半分しかない。n−1 で割る s² なら平均はちょうど 2.667。n を3・4と増やすと v の不足は小さくなる。
  s3-free:
    mode: se
    modes: [se, prop, unb]
    task: 解いてから、問題が聞いていること（平均のぶれか、比率のぶれか、分散の割り方か）に合うモードで確かめる。
  s4-free:
    mode: se
    modes: [se, prop]
    task: 自分の売場の数字（1客の購入額の標準偏差と客数、購入率と調べる人数）を入れ、平均や比率がどれだけぶれるかを読む。
  s5-free:
    mode: unb
    modes: [unb, se]
    task: 「不偏分散」で n を2→3→4と変え、v の平均が (n−1)/n×σ² になることを確かめる（発展1）。「平均のぶれ」で「200回取り直す」を押し、取り直した x̄ の標準偏差が SE に近いことを見る（発展2）。
  s6-free:
    task: 自分の課題の数字で、モードを切り替えて確かめる（平均のぶれ、比率のぶれ、不偏分散）。
used_by: [U18]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値・埋め込み
  - node tools/xbar_lab/check.js         # 本文の値（SE 4・2・1、0.04、σ²/n＝4、v の平均 4/3・s² の平均 8/3、必要人数 625）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
