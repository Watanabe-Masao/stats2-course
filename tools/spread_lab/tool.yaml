id: LAB-spread
name: 散らばりラボ
slug: spread                     # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: spread_lab.src.html         # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [sigma.html, unb.html]   # 旧版 教科書07 の「偏差平方和の近道」（dev モードの式）と「n か n−1 か」（unb モード）をまとめた。sim_mean.html の散らばり倍率は dev モードの b 倍に含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: dev
    name: 偏差と分散
    purpose: 偏差の線、偏差平方和、n と n−1 の分散、標準偏差、CV。b 倍・a を足す変換
    set: [data, b, a]
    values: [ss, v, s2, s, sdn, cv, mean]   # v＝n で割る分散、s2＝不偏分散、s＝√s2、sdn＝√v
  - key: cv
    name: 変動係数
    purpose: 平均の違う2つのばらつきを、標準偏差÷平均で比べる
    set: [mP, sP, mQ, sQ]
    values: [cvP, cvQ, bigger]
  - key: unb
    name: n か n−1 か
    purpose: 母集団 2,4,6,8,10 から取れる全部の標本で、n で割る分散と n−1 で割る分散の平均を母分散 8 と比べる
    set: [n]
    values: [av, as2, ratio, bias]   # av＝n で割る分散の平均、ratio＝av÷8、bias＝母分散より小さい／等しい／大きい
  - key: gini
    name: ジニ係数
    purpose: 4店の売上のローレンツ曲線とジニ係数
    set: [sales]
    values: [gini, area]
data: 売場B 4,7,10,13,16／売場A 8〜12。2,4,6／1,3,5,7／X 0,5,5,5,10／Y 0,0,5,10,10／気温 18,20,22／来店数 20〜28／投信B −4,4,12。母集団 2,4,6,8,10（母分散8）から取れる全部の標本（5ⁿ 通り）を数え上げる（乱数なし）
presets:
  s1-dev:
    mode: dev
    set: {data: B}
    task: 売場Bの5日間 4, 7, 10, 13, 16 個の不偏分散（n−1 で割る）はいくつか。
    predict: {type: number, key: s2, label: "不偏分散"}
    expect: 22.5
    why: 偏差 −6, −3, 0, 3, 6 を2乗して足すと90。n−1＝4 で割って22.5。n で割ると18。標準偏差は √22.5≒4.74個。
  s1-scale:
    mode: dev
    set: {data: B, b: 2}
    task: 売場Bの5日間の販売数を全部2倍にすると、不偏分散（もとは22.5）はいくつになるか。予想したら、a（足す数）も動かしてみる。
    predict: {type: number, key: s2, label: "2倍したあとの不偏分散"}
    expect: 90
    why: 偏差がどれも2倍になり、2乗するので分散は4倍の90。標準偏差は2倍。a を足しても全部が同じだけずれるので、偏差も分散も変わらない。
  s4-cv:
    mode: cv
    modes: [cv, gini]
    task: 平均と標準偏差を動かして、標準偏差が大きくても CV が小さくなる組み合わせを作る。次に「ジニ係数」で、売上が1店に集まるほど係数がどうなるかを見る。
  s5-unb:
    mode: unb
    task: n を2から6まで動かし、n で割る分散の平均が母分散8のどれだけになるか（(n−1)/n 倍）を確かめる。
  s6-free:
    task: 自分の店の数字で、散らばりの数の選び方を4つのモードで確かめる（偏差と分散、変動係数、n か n−1 か、ジニ係数）。
used_by: [U07]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値・埋め込み
  - node tools/spread_lab/check.js       # 本文の値（偏差平方和90・分散18・不偏分散22.5、n で割る分散の平均＝(n−1)/n×8、ジニ係数0.4）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
