id: LAB-survey
name: 標本調査ラボ
slug: survey                     # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: survey_lab.src.html         # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [sim_strat.html, frame.html]   # 旧版 教科書31 の「層の割合と重み付き平均」を strat に、「抽出枠の漏れは n を増やしても残る」を bias（回答率の違い）に含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予測と照らし合わせられる値（build が検査する）
  - key: strat
    name: 層化と重み
    purpose: 2つの層から同じ数ずつ調べたとき、層の平均を母集団での割合で重み付けした平均と、そのまま平均した値を、帯（幅＝割合・高さ＝平均）で比べる
    set: [w, m1, m2]                    # w＝層1の割合、m1・m2＝層の平均
    values: [weighted, naive, gap]
  - key: design
    name: 抽出法を比べる
    purpose: 10地域×10店の格子（色の濃さ＝売上指数）から10店を単純無作為・層化（地域ごとに1店）・集落（1地域を全部）・系統（名簿の同じ位置）で選ぶ。地域の差・並び順の差・店ごとの差を動かすと、4つの方法の推定値のばらつき（ヒストグラム）と標準誤差がいっしょに変わる。固定の乱数（seed 31・53）
    set: [d, p, s, show]                # d＝地域の差、p＝並び順の差、s＝店ごとの差、show＝格子に描く方法
    values: [srs, strat, clus, sys, best, rClus, rSys, rStrat, cClus, cSys, cStrat]   # c… は単純無作為と比べて「大きい」（1.1倍より上）・「小さい」（0.9倍より下）・「ほぼ同じ」
  - key: bias
    name: 消えない偏り
    purpose: 賛成・反対で回答率が違うと、集まった答えの割合が本当の値からずれる。回答数 n を10倍ずつ増やすと区間の幅は狭くなるが、ずれは残る。偏り・標準誤差・総合誤差 √(偏り²＋標準誤差²)
    set: [p, r1, r0, n]
    values: [est, bias, se, rmse, covers, lo, hi]
  - key: alloc
    name: 配分の仕方
    purpose: 2つの層への振り分けを、比例配分（層の大きさ）とネイマン配分（大きさ×標準偏差）で比べ、単純無作為・比例・ネイマンの標準誤差を棒で並べる
    set: [w1, s1, s2, dm, n]
    values: [n1p, n1n, seP, seN, seS]
  - key: multi
    name: 多段抽出
    purpose: 地域→店→客と段を重ねて選ぶ。選ばれる確率は各段の確率の掛け算、重みはその逆数
    set: [A, a, B, b, C, c]
    values: [prob, weight, total]
data: 10地域×10店の売上指数＝50＋地域の差×（地域ごとの固定の値）＋並び順の差×（名簿の位置−4.5）＋店ごとの差×（固定の並び）。乱数は固定（seed 31・53）。ほかはスライダーで決める
presets:
  s1-strat:
    mode: strat
    set: {w: 0.3, m1: 150, m2: 40}
    task: 全200店のうち駅前の店60店・郊外の店140店。各層10店ずつ調べると平均売上は駅前150万円・郊外40万円。全店の平均売上の推定は（万円）？
    predict: {type: number, key: weighted, label: "全店の平均", unit: "万円"}
    expect: 73
    why: 0.3×150＋0.7×40＝73。調べた20店をそのまま平均すると95 で、数の少ない駅前の店を重く見すぎる。
  s1-design:
    mode: design
    set: {d: 1, p: 0, s: 1, show: clus}
    task: 地域ごとに売上の水準が違う（地域の差1）。1つの地域を選んでその10店を全部調べる方法（集落）の推定値のばらつきは、10店を単純無作為に選ぶときと比べてどうなるか。
    predict: {type: choice, key: cClus, label: "単純無作為と比べて", options: [大きい, ほぼ同じ, 小さい]}
    expect: 大きい
    why: 1地域しか見ないので、どの地域を引いたかがそのまま推定値に出る。地域の差を0 にすると、単純無作為とほぼ同じになる。
  s3-rule:
    mode: design
    steps:
      - label: 地域の差0・集落
        set: {d: 0, p: 0, s: 1, show: clus}
        task: 地域による違いがなく、どの地域にも大小の店がでたらめに混ざっているとき、集落抽出（1地域を全部）の標準誤差は単純無作為と比べてどうなるか。
        predict: {type: choice, key: cClus, label: "単純無作為と比べて", options: [大きい, ほぼ同じ, 小さい]}
        expect: ほぼ同じ
        why: どの地域も全体と同じような店の混ざり方なので、1地域でも全体の縮図に近い。
      - label: 地域の差0・層化
        set: {show: strat}
        task: 同じ地域の差0 で、層化（地域ごとに1店）の標準誤差は単純無作為と比べてどうなるか。
        predict: {type: choice, key: cStrat, label: "単純無作為と比べて", options: [大きい, ほぼ同じ, 小さい]}
        expect: ほぼ同じ
        why: 層の間に違いがなければ、層に分けても取り除くものがない。層化が得をするのは、層の間に違いがあるときだけ。
      - label: 地域の差2・集落
        set: {d: 2, show: clus}
        task: 地域の差を2 にする。集落の標準誤差は単純無作為と比べてどうなるか。記録で層化の欄と見比べる。
        predict: {type: choice, key: cClus, label: "単純無作為と比べて", options: [大きい, ほぼ同じ, 小さい]}
        expect: 大きい
        why: 地域の間の違いが、集落ではそのまま推定値のばらつきに入る。層化はちょうど逆に、その違いを取り除く。
    law:
      title: 式で説明する
      lines:
        - 集落抽出の推定値のばらつき ＝ 集落ごとの平均がどれだけ違うか（集落の間のばらつき）
        - 層化抽出の推定値のばらつき ＝ 層の中のばらつきだけ（層の間の違いは入らない）
        - 集落の中が似ている（＝集落の間が違う）ほど集落は損、層化は得
        - 層化（比例配分）の分散 ≒ Σ(N_h/N)²×S_h²÷n_h（S_h² は層 h の中の分散。層の平均どうしの違いは入らない）
      text: 同じ「地域で分ける」でも、全部の地域から少しずつ取る（層化）か、いくつかの地域を丸ごと取る（集落）かで、地域の違いが誤差に入るかどうかが逆になる。
      limit: 集落抽出は、調べる場所が少なくて安く済む。同じ費用でより多くの店を調べられるなら、ばらつきが大きくても集落を選ぶことがある。費用と精度のどちらを取るかは統計の外の判断。
  s3-free:
    mode: design
    modes: [strat, design, bias, alloc, multi]
    task: 解いてから、問題が聞いていること（重み・抽出法の比べ方・偏り・配分・多段の確率）に合うモードで確かめる。
  s4-free:
    mode: strat
    modes: [strat, design, bias, alloc, multi]
    task: 自分の店のアンケートや売場調査の数字（層の大きさ・平均・回答率など）を入れて、推定の仕方と誤差を確かめる。
  s5-alloc:
    mode: alloc
    set: {w1: 0.5, s1: 40, s2: 10, dm: 20, n: 100}
    task: 大きさが同じ2つの層（割合0.5 ずつ）に100人を振り分ける。層1の標準偏差40・層2の標準偏差10 で、比例配分とネイマン配分の振り分けと標準誤差を比べる。分散に比例させて配ったらどうなるかは、本文の式で自分で計算する。
  s5-n:
    mode: design
    set: {d: 1, p: 0, s: 1, show: clus}
    task: 地域ごとに売上の水準が違う10地域×10店で、10店を調べる。集落（1地域を全部）の標準誤差は単純無作為の何倍か。同じ精度を単純無作為で出すには、何店あれば足りるか。地域の差を0 にするとどうなるか。
  s6-tablet:
    mode: bias
    set: {p: 0.65, r1: 0.3, r0: 0.3, n: 600}
    task: 「賛成」を「満足」と読みかえる。本当の満足を0.65 にしたまま、満足の人の回答率が不満の人の何倍なら、集まった答えが客ごとに直したタブレットの割合に近くなるか。回答率の高さを変えて、比が同じなら同じになるかも見る。
  s6-store:
    mode: design
    set: {d: 0, p: 0, s: 1, show: clus}
    task: 地域を「店」、店を「客」と読みかえる。1つの単位を丸ごと調べる方法（集落）で、単位の間の違い（地域の差）を0 から2 まで上げる。丸ごと調べる数が多くても、推定値のばらつきが大きいのはどんなときか。
used_by: [U31]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予測の前に結果が隠れる・予測の答え＝ラボの値・埋め込み
  - node tools/survey_lab/check.js       # 本文の値（80・125、58、層化がいちばん小さい、偏り0.167、ネイマン60人、確率0.004）
checked:
  browser_380px: 2026-10-29
  notion_iphone: null
