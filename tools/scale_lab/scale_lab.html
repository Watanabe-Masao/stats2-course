<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>尺度ラボ</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#5d6670;--line:#d0d7de;--card:#f6f8fa;--acc:#0b63c9;--acc2:#b0306f;--ok:#1a7f37;--ng:#cf222e;--q:#c4501b}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6edf3;--mut:#a3adb8;--line:#3d444d;--card:#252525;--acc:#4c9bff;--acc2:#e06aa8;--ok:#3fb950;--ng:#f85149;--q:#f0883e}}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1 1 45%;padding:7px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
input[type=range]{width:130px}
select{font-size:14px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.big{font-size:18px;font-weight:700}
button.act{padding:7px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
button.sub{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
button:disabled{opacity:.45}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right}
td:first-child,th:first-child{text-align:left}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
.bar{height:14px;border-radius:3px;background:var(--acc);display:inline-block;vertical-align:middle}
.bar.b{background:var(--acc2)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px;font-size:13px;background:var(--card)}
svg{max-width:100%;height:auto;display:block}
</style></head><body>
<h1>🧪 尺度ラボ</h1>
<div class="tabs" id="tabs"></div>

<div id="m-judge" class="mode">
 <p class="mut" style="margin:0">データを1つ出す。4つの質問に上から答え、「はい」になった所で止める。止めてから答えを見る。</p>
 <div class="card"><div class="mut">このデータの尺度は？</div><div class="big" id="jitem"></div></div>
 <div class="card" id="jq"></div>
 <div class="row"><button class="act" id="jnext">次のデータ</button><span class="mut" id="jscore"></span></div>
</div>

<div id="m-unit" class="mode">
 <p class="mut" style="margin:0">同じ2つの値を、別の単位で表し直す。「差」と「何倍（B÷A）」は単位を変えると変わるか。先に予想してから動かす。</p>
 <div class="row"><label>データ <select id="ukind"><option value="temp">気温</option><option value="wt">重さ</option><option value="year">年</option></select></label></div>
 <div class="row"><label>A <input type="range" id="ua"><b id="uav"></b></label><label>B <input type="range" id="ub"><b id="ubv"></b></label></div>
 <div class="card"><table id="utab"></table></div>
 <div class="card" id="usum"></div>
</div>

<div id="m-likert" class="mode">
 <p class="mut" style="margin:0">5段階の満足度（各100人）。ふつうは 1〜5 点をつけて平均するが、「段階の間隔は等しい」は仮定にすぎない。両端の段階につける点を変えると、どちらの店が上になるか。</p>
 <div id="lbars"></div>
 <div class="row"><label>「とても満足」の点 <input type="range" id="l5" min="4.1" max="8" step="0.1" value="5"><b id="l5v"></b></label></div>
 <div class="row"><label>「とても不満」の点 <input type="range" id="l1" min="-3" max="1.9" step="0.1" value="1"><b id="l1v"></b></label></div>
 <div class="card"><table id="ltab"></table></div>
 <div class="card" id="lsum"></div>
 <div class="row"><button class="sub" id="lreset">1〜5点に戻す</button></div>
</div>

<div id="m-bin" class="mode">
 <p class="mut" style="margin:0">20人の客の年齢。階級（年代）にまとめると、何が見えなくなるか。</p>
 <div class="row"><label>まとめ方 <select id="bw"><option value="1">まとめない（1歳ごと）</option><option value="5">5歳ごと</option><option value="10" selected>10歳ごと（年代）</option></select></label></div>
 <div id="bplot"></div>
 <div class="card" id="bsum"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const MODES=[["judge","尺度を判定"],["unit","単位を変える"],["likert","満足度の平均"],["bin","階級にまとめる"]];
const tabs=$("tabs");
MODES.forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.m=k;b.onclick=()=>show(k);tabs.appendChild(b);});
function show(k){document.querySelectorAll(".mode").forEach(d=>d.style.display="none");$("m-"+k).style.display="block";
 tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===k));}
const SCALES=["名義","順序","間隔","比例"];
const CALC=["＝ ≠ だけ。代表値は最頻値。平均・何倍は意味がない","大小まで。代表値は中央値・最頻値。平均は等間隔とみなす仮定が要る。何倍は意味がない","差まで。平均・差は意味がある。何倍は意味がない","比まで。平均も何倍も意味がある"];

// ---- 尺度を判定
const ITEMS=[
 ["店番",0,"番号は区別のためのラベル。305番店と306番店に順番や差の意味はない"],
 ["血液型（A・B・O・AB）",0,"区別するためのラベル。順番も差もない"],
 ["JANコード",0,"商品を区別する番号。足しても平均しても意味がない"],
 ["満足度（不満・普通・満足）",1,"順番には意味があるが、「不満→普通」と「普通→満足」の間隔が等しいとは限らない"],
 ["売上ランキングの順位",1,"1位と2位の売上差と、2位と3位の売上差は同じとは限らない"],
 ["鮮度ランク（A・B・C）",1,"順番はあるが、ランクの間隔は決まっていない"],
 ["気温（℃）",2,"10℃と20℃の差は、20℃と30℃の差と同じ意味。ただし0℃は「温度が無い」ではない"],
 ["西暦",2,"年の差には意味があるが、西暦0年は「時間が無い」ではない"],
 ["時刻（何時何分）",2,"時刻の差（経過時間）には意味があるが、0時は「時間が無い」ではない"],
 ["販売個数",3,"0個は「売れていない」。20個は10個の2倍と言える（離散型）"],
 ["重さ（kg）",3,"0kgは「重さが無い」。単位をgに変えても何倍は変わらない（連続型）"],
 ["売上金額",3,"0円は「売上が無い」。前年比のように比で比べられる"],
 ["待ち時間（分）",3,"0分は「待っていない」。10分は5分の2倍と言える（連続型）"],
 ["来店客数",3,"0人は「来ていない」。数え上げる量（離散型）"]];
const QS=["区別するためのラベルだけ？","順番に意味はあるが、間隔はそろっていない？","差に同じ意味があるが、0が「無い」ではない？","0が「無い」を表し、何倍と言える？"];
let jOrder=[],jPos=-1,jStep=0,jDone=false,jRight=0,jTotal=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function jNext(){if(jPos<0||jPos>=jOrder.length-1){jOrder=shuffle([...ITEMS.keys()]);jPos=0;}else jPos++;jStep=0;jDone=false;jRender();}
function jRender(){const it=ITEMS[jOrder[jPos]];$("jitem").textContent=it[0];
 let h="";for(let k=0;k<jStep;k++)h+=`<div class="mut">質問${k+1}：${QS[k]} → いいえ</div>`;
 if(!jDone){h+=`<div><b>質問${jStep+1}：${QS[jStep]}</b></div><div class="row"><button class="act" id="jy">はい</button><button class="sub" id="jn"${jStep===3?" disabled":""}>いいえ</button></div>`;}
 else{const pick=jStep,ans=it[1],ok=pick===ans;
  h+=`<div>質問${pick+1}：${QS[pick]} → はい</div><div class="big">あなたの判定：${SCALES[pick]}尺度</div>`+
   `<div class="${ok?"ok":"ng"}">${ok?"◯ 正しい":"✕ 正しくは "+SCALES[ans]+"尺度"}</div><div>${it[2]}</div>`+
   `<div class="mut">${SCALES[ans]}尺度で意味のある計算：${CALC[ans]}</div>`;}
 $("jq").innerHTML=h;$("jscore").textContent=jTotal?`${jTotal}問中 ${jRight}問 正解`:"";
 if(!jDone){$("jy").onclick=()=>{jDone=true;jTotal++;if(jStep===ITEMS[jOrder[jPos]][1])jRight++;jRender();};
  $("jn").onclick=()=>{if(jStep<3){jStep++;jRender();}};}}
$("jnext").onclick=jNext;

// ---- 単位を変える
const KINDS={
 temp:{min:-10,max:40,a:10,b:20,unit:"℃",scale:2,units:[["摂氏（℃）",x=>x],["絶対温度（K）",x=>x+273.15],["華氏（℉）",x=>x*1.8+32]]},
 wt:{min:0,max:50,a:10,b:20,unit:"kg",scale:3,units:[["キログラム（kg）",x=>x],["グラム（g）",x=>x*1000],["ポンド（lb）",x=>x/0.45359237]]},
 year:{min:1990,max:2030,a:2010,b:2020,unit:"年",scale:2,units:[["西暦",x=>x],["2000年を0とした年",x=>x-2000],["1900年を0とした年",x=>x-1900]]}};
function fmt(v){return Math.abs(v)>=100?v.toFixed(1):v.toFixed(2);}
function ratio(a,b){return Math.abs(a)<1e-9?null:b/a;}
function uSetup(){const k=KINDS[$("ukind").value];for(const id of ["ua","ub"]){$(id).min=k.min;$(id).max=k.max;$(id).step=1;}$("ua").value=k.a;$("ub").value=k.b;uRender();}
function uRender(){const k=KINDS[$("ukind").value],a=+$("ua").value,b=+$("ub").value;$("uav").textContent=a+k.unit;$("ubv").textContent=b+k.unit;
 let h="<tr><th>単位</th><th>差 B−A</th><th>B÷A</th></tr>";const rs=[];
 k.units.forEach(([n,f])=>{const A=f(a),B=f(b),r=ratio(A,B);rs.push(r);h+=`<tr><td>${n}<div class="mut">A＝${fmt(A)}　B＝${fmt(B)}</div></td><td>${fmt(B-A)}</td><td>${r===null?"—（0で割れない）":r.toFixed(3)}</td></tr>`;});
 $("utab").innerHTML=h;
 const valid=rs.filter(r=>r!==null),same=valid.length===rs.length&&valid.every(r=>Math.abs(r-valid[0])<1e-9);
 $("usum").innerHTML=(same?`<div class="ok">何倍（B÷A）は、どの単位でも同じ。</div><div>0が「無い」を表す比例尺度なので、何倍と言える。</div>`:
  `<div class="ng">何倍（B÷A）が単位によって変わる。</div><div>0の位置が単位ごとに違う（間隔尺度）ので、「B は A の何倍」には意味がない。差は単位の換算（×1.8 など）を除けば同じ情報を表す。</div>`)+
  `<div class="mut">${SCALES[k.scale]}尺度：${CALC[k.scale]}</div>`;}
$("ukind").onchange=uSetup;["ua","ub"].forEach(id=>$(id).addEventListener("input",uRender));

// ---- 満足度の平均
const LV=["とても不満","不満","普通","満足","とても満足"];
const ST={A:[0,0,60,40,0],B:[20,10,0,10,60]};
function lscores(){return [+$("l1").value,2,3,4,+$("l5").value];}
function lmean(c,s){let t=0,n=0;c.forEach((k,i)=>{t+=k*s[i];n+=k;});return t/n;}
function lmedian(c){const n=c.reduce((a,b)=>a+b,0);const at=r=>{let cum=0;for(let i=0;i<5;i++){cum+=c[i];if(cum>=r)return i;}};const lo=at(Math.floor((n+1)/2)),hi=at(Math.ceil((n+1)/2));return [lo,hi];}
function ltop(c){return (c[3]+c[4])/c.reduce((a,b)=>a+b,0);}
function lRender(){const s=lscores();$("l5v").textContent=s[4].toFixed(1)+"点";$("l1v").textContent=s[0].toFixed(1)+"点";
 let h='<div class="card"><table><tr><th>段階（点）</th><th>A店</th><th>B店</th></tr>';
 for(let i=4;i>=0;i--)h+=`<tr><td>${LV[i]}（${s[i].toFixed(1)}）</td><td><span class="bar" style="width:${ST.A[i]*0.9}px"></span> ${ST.A[i]}</td><td><span class="bar b" style="width:${ST.B[i]*0.9}px"></span> ${ST.B[i]}</td></tr>`;
 $("lbars").innerHTML=h+"</table></div>";
 const mA=lmean(ST.A,s),mB=lmean(ST.B,s),dA=lmedian(ST.A),dB=lmedian(ST.B),tA=ltop(ST.A),tB=ltop(ST.B);
 const win=(x,y)=>Math.abs(x-y)<1e-9?"同じ":x>y?"A店":"B店";
 const med=d=>d[0]===d[1]?LV[d[0]]:LV[d[0]]+"と"+LV[d[1]]+"の間";
 $("ltab").innerHTML=`<tr><th>比べ方</th><th>A店</th><th>B店</th></tr>`+
  `<tr><td>平均点<div class="mut">上：${win(mA,mB)}</div></td><td>${mA.toFixed(2)}</td><td>${mB.toFixed(2)}</td></tr>`+
  `<tr><td>中央値<div class="mut">上：${win(dA[0],dB[0])}</div></td><td>${med(dA)}</td><td>${med(dB)}</td></tr>`+
  `<tr><td>「満足」以上の割合<div class="mut">上：${win(tA,tB)}</div></td><td>${Math.round(tA*100)}%</td><td>${Math.round(tB*100)}%</td></tr>`;
 const flipped=mA>mB+1e-9;
 $("lsum").innerHTML=(flipped?`<div class="ng">平均点では A店が上になった。</div>`:`<div>平均点では ${win(mA,mB)}${win(mA,mB)==="同じ"?"":"が上"}。</div>`)+
  `<div>中央値と「満足」以上の割合は、点のつけ方を変えても変わらない（順番しか使わないから）。平均点は、段階の間隔をどう置くかという<b>仮定</b>で結果が変わる。</div>`;}
["l1","l5"].forEach(id=>$(id).addEventListener("input",lRender));$("lreset").onclick=()=>{$("l1").value=1;$("l5").value=5;lRender();};

// ---- 階級にまとめる
const AGES=[22,24,27,29,31,33,34,36,38,39,41,43,45,47,48,52,55,58,61,69];
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
function bClasses(w){const m=new Map();AGES.forEach(a=>{const lo=Math.floor(a/w)*w;m.set(lo,(m.get(lo)||0)+1);});return [...m.entries()].sort((x,y)=>x[0]-y[0]);}
function bClassMean(w){if(w===1)return mean(AGES);let t=0;bClasses(w).forEach(([lo,n])=>{t+=n*(lo+w/2);});return t/AGES.length;}
function bRender(){const w=+$("bw").value,cls=bClasses(w);
 const W=340,H=96,lo=20,hi=70,X=v=>12+(v-lo)/(hi-lo)*(W-24);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="年齢の点と階級">`;
 if(w>1)cls.forEach(([c],i)=>{s+=`<rect x="${X(c)}" y="8" width="${X(c+w)-X(c)-1}" height="50" fill="var(--acc)" opacity="${i%2?0.10:0.18}"/>`;});
 AGES.forEach((a,i)=>{const x=w>1?X(Math.floor(a/w)*w+w/2):X(a);const y=w>1?52-(cls.findIndex(c=>c[0]===Math.floor(a/w)*w)>=0?AGES.filter((b,j)=>j<i&&Math.floor(b/w)===Math.floor(a/w)).length*6:0):40;
  s+=`<circle cx="${x}" cy="${y}" r="3.4" fill="var(--acc2)"/>`;});
 for(let t=20;t<=70;t+=10)s+=`<text x="${X(t)}" y="78" font-size="10" text-anchor="middle" fill="var(--mut)">${t}</text>`;
 s+=`<line x1="12" y1="62" x2="${W-12}" y2="62" stroke="var(--line)"/></svg>`;
 $("bplot").innerHTML=s+'<div class="mut">点＝1人。まとめると、同じ階級の人は階級の真ん中に重なって見える。</div>';
 const chips=w===1?AGES.map(a=>`<span class="chip">${a}</span>`).join(""):cls.map(([c,n])=>`<span class="chip">${c}〜${c+w-1}歳：${n}人</span>`).join("");
 const thirty=AGES.filter(a=>a>=30&&a<40);
 $("bsum").innerHTML=`<div>${chips}</div><div>区別できる値：<b>${w===1?new Set(AGES).size:cls.length}</b> 種類（元は ${new Set(AGES).size} 種類）</div>`+
  `<div>平均：元のデータ <b>${mean(AGES).toFixed(2)}</b> 歳／${w===1?"同じ":"階級の真ん中で計算 <b>"+bClassMean(w).toFixed(2)+"</b> 歳"}</div>`+
  (w===10?`<div class="mut">30代の ${thirty.join("・")} 歳は、全員「30代」になり、31歳と39歳の差は見えない。年代は「順番のある区分」として扱うことになる。</div>`:"");}
$("bw").onchange=bRender;

jNext();uSetup();lRender();bRender();show("judge");
window.__LAB__={ITEMS,KINDS,ST,lmean,lmedian,ltop,AGES,bClassMean,ratio};
</script>
</body></html>
