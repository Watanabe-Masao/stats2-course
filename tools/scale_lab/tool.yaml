id: LAB-scale
name: 尺度ラボ
slug: scale                      # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: scale_lab.src.html          # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 2
replaces_legacy: [scale.html]   # 旧版 教科書04 の「℃とKで何倍が変わる」ラボの機能を含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: judge
    name: 尺度を判定
    purpose: 4つの質問に上から答えて尺度を決める（15件）。間違えたら「どこで取り違えたか」を返す
    set: [item, items]           # item＝最初に出すデータ、items＝この順に出すデータ（ITEMS の名前）
    values: []
  - key: unit
    name: 単位を変える
    purpose: 気温（℃・K・℉）・重さ・売上金額・年で、差と何倍が単位で変わるかを見る
    set: [kind, a, b]
    values: ["ratio:0", "ratio:1", "ratio:2", "diff:0", "diff:1", "diff:2"]
  - key: likert
    name: 満足度の平均
    purpose: 段階につける点を変えると平均の順位は入れ替わるが、中央値と割合は変わらない
    set: [s1, s5]
    values: [meanA, meanB, winner]
  - key: bin
    name: 階級にまとめる
    purpose: 年齢を年代にまとめると区別できる値が減り、平均も近似になる
    set: [w]
    values: [classMean, rawMean]
  - key: code
    name: 数字のラベル
    purpose: 名義に振る数字で平均が変わる。2値なら平均から割合を逆算できるが、3値以上では読めない
    set: [pair, n2]
    values: [mean, prop]
data: 満足度 A店[0,0,60,40,0]・B店[20,10,0,10,60]（とても不満→とても満足）。年齢20人（平均41.6歳）
# 段階ごとの使い方（本文では {{lab:LAB-scale@名前}}）。問題ごとの使い方は problems/*.yaml の lab に書く。
presets:
  s1-temp:
    mode: unit
    set: {kind: temp, a: 10, b: 20}
    unlock: [kind]               # 本文の手順2で「重さ」「売上金額」に切り替えるので、予想のあとは選べるようにする
    task: 10℃と20℃を、絶対温度（K）で表すと B÷A は何倍になるか。
    predict: {type: number, key: "ratio:1", label: "K で B÷A", unit: "倍"}
    expect: 1.035
    why: 単位を変えると0の位置が動くので、何倍の値が変わる（℃では2倍、Kでは約1.035倍）。
  s1-exA:
    mode: judge
    set: {items: [店番, 満足度（不満・普通・満足）, 気温（℃）, 販売個数]}
    task: 例題Aの4つを、4つの質問に上から答えて判定し直す。表を見ずに、どの質問で止まるかを確かめる。
  s2-judge:
    mode: judge
    task: 10問続けて判定する。間違えたら「どこで取り違えたか」を読み、どの質問で「はい／いいえ」を取り違えたかを書く。
  s4-judge:
    mode: judge
    modes: [judge, bin]
    task: 転用の表の場面のデータを思い浮かべながら判定する。終わったら「階級にまとめる」で、年齢を年代にまとめると何が起きるかも見る。
  s5-unit:
    mode: unit
    set: {kind: temp, a: 10, b: 20}
    task: 気温・重さ・売上金額・年を切り替え、「何倍が単位で変わる換算」と「変わらない換算」の式の違いを見つける。
  s6-free:
    task: 自分の判定や設計を、5つのモードで確かめる。
used_by: [U04]
tests:
  - node tools/test_labs.js            # out/labs の全部：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値
  - node tools/scale_lab/check.js      # 本文に書いた値（2.000/1.035/1.360、3.40/3.80/3.26、41.6/41.5、1.80）
checked:
  browser_380px: 2026-10-27
  notion_iphone: 2026-10-28   # 表示・動作を確認。埋め込み用の小さい表示は試験ページで確認
