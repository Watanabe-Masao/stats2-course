id: LAB-prob
name: 確率ラボ
slug: prob                       # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: prob_lab.src.html           # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [union.html]    # 旧版 教科書10 の「重なりを動かす」を area モードに含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: dice
    name: サイコロで A・B
    purpose: サイコロ1回の事象 A・B を選び、どの目が A・B・両方に入るかを色で見る。P(A∪B) は重なりを1回引く
    set: [a, b]                  # even／odd／ge4／le3／le2／m3／six／one／ge5
    values: [union, inter, pa, pb, none, excl]   # 小数。excl：はい／いいえ
  - key: area
    name: 確率を面積で
    purpose: P(A)・P(B)・P(A∩B) から、Aだけ・両方・Bだけ・どちらでもない を帯の長さで見る
    set: [a, b, ab]              # すべて %
    values: [union, none, aonly, bonly, one, lo, hi, excl]   # %。lo・hi＝P(A∩B) が取れる範囲
  - key: atleast
    name: 少なくとも1回
    purpose: 1回の確率 p＝分子/分母 を n 回くり返すとき、少なくとも1回＝1−(1−p)ⁿ。p×n との違い
    set: [a, b, n]
    values: [atleast, none, naive]   # 小数
data: スライダーと選択欄で値を決める（データの読み込みなし）
presets:
  s1-dice:
    mode: dice
    set: {a: even, b: ge4}
    task: サイコロを1回投げる。A＝偶数、B＝4以上。「A または B」の確率は（小数で）？
    predict: {type: number, key: union, label: "P(A∪B)（小数）"}
    expect: 0.6667
    why: A＝{2,4,6}、B＝{4,5,6}。4と6は両方に入るので、3/6＋3/6−2/6＝4/6＝2/3。足すだけだと 6/6＝1 になり、4と6を2回数えてしまう。
  s1-area:
    mode: area
    set: {a: 30, b: 20, ab: 0}
    task: P(A)＝30%、P(B)＝20%、重なり P(A∩B)＝0%（排反）のとき、P(A∪B) は何%か。
    predict: {type: number, key: union, label: "P(A∪B)", unit: "%"}
    expect: 50
    why: 重なりがない（排反）ので、そのまま足して 30＋20＝50%。重なりを増やすと、増やした分だけ P(A∪B) が減る。
  s3-free:
    mode: area
    modes: [area, dice]
    task: 解いてから、「確率を面積で」で P(A)・P(B)・P(A∩B) を問題に合わせ、帯の長さで答えを確かめる。重なりは取れる範囲（くわしく）が決まっていることも見る。
  s4-area:
    mode: area
    modes: [area, atleast]
    task: 自分の売場の数字（ある商品を買う割合・別の商品を買う割合・両方買う割合）を入れ、「どちらか一方でも買う」「どちらも買わない」を読む。
  s5-area:
    mode: area
    modes: [area, atleast]
    task: P(A) と P(B) を決めて重なりを最小から最大まで動かし、P(A∪B) がどこまで動くかを見る（発展2）。「少なくとも1回」で回数を増やし、p×回数 が1を超えても正しい確率は1を超えないことを見る。
  s6-free:
    task: 自分の課題の数字で、3つのモード（サイコロで A・B、確率を面積で、少なくとも1回）を確かめる。
used_by: [U10]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値・埋め込み
  - node tools/prob_lab/check.js         # 本文の値（2/3、11/36、91/216、0.7・0.3、60%・40%、0.651）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
