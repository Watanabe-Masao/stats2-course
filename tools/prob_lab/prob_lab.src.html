<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>確率ラボ</title>
<style>
/*@LABKIT_CSS@*/
.die{display:flex;gap:6px;justify-content:center;margin:8px 0}
.die div{width:46px;height:46px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:var(--card);position:relative}
.die .a{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.die .b{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 22%,var(--card))}
.die .ab{border-color:var(--fg);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--acc) 35%,var(--card)) 0 6px,color-mix(in srgb,var(--acc2) 35%,var(--card)) 6px 12px)}
.legend span{margin-right:10px;font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
</style></head><body>
<h1>🧪 確率ラボ</h1>
<div id="lk-task"></div>
<div class="tabs" id="tabs"></div>

<div id="m-dice" class="mode">
 <p class="mut" style="margin:0">サイコロ1回。事象 A と B を選ぶと、6つの目のうちどれが入るかが色で出る。「または」は重なりを1回だけ数える。</p>
 <div class="row ctl"><label>A <select id="da" data-key="a"></select></label><label>B <select id="db" data-key="b"></select></label></div>
 <div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
 <div class="res key" id="dplot"></div>
 <div class="card res key" id="dsum"></div>
</div>

<div id="m-area" class="mode">
 <p class="mut" style="margin:0">P(A)・P(B)・P(A∩B) を決めると、全体（100%）が「Aだけ」「両方」「Bだけ」「どちらでもない」に分かれる。</p>
 <input type="range" id="ra" min="0" max="100" step="1" value="50" data-name="P(A)" data-unit="%">
 <input type="range" id="rb" min="0" max="100" step="1" value="40" data-name="P(B)" data-unit="%">
 <input type="range" id="rab" min="0" max="100" step="1" value="20" data-name="P(A∩B)" data-unit="%">
 <div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
 <div class="res key" id="rplot"></div>
 <div class="card res key" id="rsum"></div>
</div>

<div id="m-atleast" class="mode">
 <p class="mut" style="margin:0">1回で起きる確率 p の試行を n 回くり返す（毎回の結果は互いに影響しない）。「少なくとも1回」は 1−(1回も起きない確率)。</p>
 <input type="range" id="ta" min="1" max="9" step="1" value="1" data-name="p の分子">
 <input type="range" id="tb" min="2" max="10" step="1" value="6" data-name="p の分母">
 <input type="range" id="tn" min="1" max="10" step="1" value="2" data-name="回数 n">
 <div class="lk-wait card mut">予想を決めると、ここに結果が出る。</div>
 <div class="res key" id="tplot"></div>
 <div class="card res key" id="tsum"></div>
</div>

<script>
/*@LABCFG@*/
/*@LABKIT_JS@*/
const $=LK.$,esc=LK.esc;
const W=340;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(a,b)=>{if(a===0)return "0";const g=gcd(a,b);return b/g===1?String(a/g):`${a/g}/${b/g}`;};
const d3=v=>String(+v.toFixed(3)),pc=v=>String(+(v*100).toFixed(1))+"%";

// ---- サイコロで A・B
const EV={even:["偶数",[2,4,6]],odd:["奇数",[1,3,5]],ge4:["4以上",[4,5,6]],le3:["3以下",[1,2,3]],le2:["2以下",[1,2]],m3:["3の倍数",[3,6]],six:["6の目",[6]],one:["1の目",[1]],ge5:["5以上",[5,6]]};
function dVals(){const A=EV[$("da").value][1],B=EV[$("db").value][1],inter=A.filter(x=>B.includes(x)),uni=[...new Set([...A,...B])].sort();
 return {A,B,inter,uni,pa:A.length/6,pb:B.length/6,inter_p:inter.length/6,union:uni.length/6,none:1-uni.length/6,excl:inter.length===0?"はい":"いいえ"};}
function dRender(){const D=dVals();
 $("dplot").innerHTML=`<div class="die">${[1,2,3,4,5,6].map(k=>{const a=D.A.includes(k),b=D.B.includes(k);return `<div class="${a&&b?"ab":a?"a":b?"b":""}">${k}</div>`;}).join("")}</div><div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>A だけ</span><span><i class="sw" style="background:var(--acc2)"></i>B だけ</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--acc) 0 3px,var(--acc2) 3px 6px)"></i>両方（重なり）</span></div>`;
 $("dsum").innerHTML=`<div>A＝{${D.A.join(",")}}、B＝{${D.B.join(",")}}、重なり A∩B＝{${D.inter.join(",")||"なし"}}</div><div>P(A∪B)＝${D.A.length}/6＋${D.B.length}/6−${D.inter.length}/6＝<b>${frac(D.uni.length,6)}</b>（≒${d3(D.union)}）</div><div class="mut">${D.inter.length?`重なり ${D.inter.length} 個を2回数えた分を1回引く。`:"重なりがない（排反）ので、そのまま足せる。"} どちらも起きない確率＝1−${frac(D.uni.length,6)}＝${frac(6-D.uni.length,6)}。</div>`;}
LK.register("dice",{name:"サイコロで A・B",
 init(){const opts=Object.entries(EV).map(([k,[n,s]])=>`<option value="${k}">${n} {${s.join(",")}}</option>`).join("");$("da").innerHTML=opts;$("db").innerHTML=opts;$("da").value="even";$("db").value="ge4";$("da").onchange=dRender;$("db").onchange=dRender;dRender();},
 apply(s){if(s.a)$("da").value=s.a;if(s.b)$("db").value=s.b;dRender();},
 render:dRender,
 value(key){const D=dVals(),v={union:D.union,inter:D.inter_p,pa:D.pa,pb:D.pb,none:D.none,excl:D.excl}[key];return key==="excl"?{v,text:v}:{v,text:d3(v)};}});

// ---- 確率を面積で
function rVals(){let a=+$("ra").value,b=+$("rb").value,ab=+$("rab").value;const lo=Math.max(0,a+b-100),hi=Math.min(a,b);ab=Math.min(hi,Math.max(lo,ab));
 const uni=a+b-ab;return {a,b,ab,lo,hi,union:uni,none:100-uni,aonly:a-ab,bonly:b-ab,one:a+b-2*ab,excl:ab===0?"はい":"いいえ"};}
function rRender(){const R=rVals();if(+$("rab").value!==R.ab)LK.setRange("rab",R.ab);
 const x=v=>10+v/100*(W-20),H=96;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="確率を面積で表した帯">`;
 const seg=[[0,R.aonly,"var(--acc)","Aだけ"],[R.aonly,R.ab,"url(#hatch)","両方"],[R.a,R.bonly,"var(--acc2)","Bだけ"],[R.union,R.none,"var(--card)","どちらも×"]];
 s+=`<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="var(--acc)"/><rect x="4" width="4" height="8" fill="var(--acc2)"/></pattern></defs>`;
 seg.forEach(([st,w,c,t])=>{if(w<=0)return;s+=`<rect x="${x(st)}" y="14" width="${x(st+w)-x(st)}" height="34" fill="${c}" fill-opacity="${c.startsWith("var(--card")?1:.55}" stroke="var(--line)"/>`;if(w>=9)s+=`<text x="${(x(st)+x(st+w))/2}" y="35" font-size="11" text-anchor="middle" fill="var(--fg)" font-weight="700">${w}%</text>`;});
 s+=`<line x1="${x(0)}" y1="56" x2="${x(R.a)}" y2="56" stroke="var(--acc)" stroke-width="3"/><text x="${x(0)}" y="70" font-size="11" fill="var(--fg)">A ${R.a}%</text>`;
 s+=`<line x1="${x(R.aonly)}" y1="78" x2="${x(R.aonly+R.b)}" y2="78" stroke="var(--acc2)" stroke-width="3"/><text x="${x(R.aonly)}" y="92" font-size="11" fill="var(--fg)">B ${R.b}%</text></svg>`;
 $("rplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>Aだけ</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--acc) 0 3px,var(--acc2) 3px 6px)"></i>両方</span><span><i class="sw" style="background:var(--acc2)"></i>Bだけ</span></div>`;
 $("rsum").innerHTML=`<div>P(A∪B)＝${R.a}＋${R.b}−${R.ab}＝<b>${R.union}%</b>　どちらも起きない＝100−${R.union}＝<b>${R.none}%</b></div><div class="mut">P(A∩B) が取れる範囲は ${R.lo}〜${R.hi}%（両方の部分は A にも B にも入るので、どちらよりも大きくなれない。全体は100%を超えない）。${R.ab===0?"重なり0＝排反。":""}</div>`;}
LK.register("area",{name:"確率を面積で",
 init(){["ra","rb","rab"].forEach(id=>LK.stepper($(id),rRender));rRender();},
 apply(s){if(s.a!==undefined)LK.setRange("ra",s.a);if(s.b!==undefined)LK.setRange("rb",s.b);if(s.ab!==undefined)LK.setRange("rab",s.ab);rRender();},
 render:rRender,
 value(key){const R=rVals(),v=R[key];return key==="excl"?{v,text:v}:{v,text:v+"%"};}});

// ---- 少なくとも1回
function tVals(){let a=+$("ta").value,b=+$("tb").value;if(a>=b)a=b-1;const n=+$("tn").value,p=a/b,none=Math.pow(1-p,n);return {a,b,n,p,none,atleast:1-none,naive:n*p};}
function tRender(){const T=tVals();if(+$("ta").value!==T.a)LK.setRange("ta",T.a);
 const H=150,X=k=>34+(k-0.5)*(W-44)/T.n,Y=v=>H-22-Math.min(v,1.2)/1.2*(H-36),bw=Math.min(26,(W-44)/T.n*0.6);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="回数と少なくとも1回の確率"><line x1="30" y1="${Y(0)}" x2="${W-8}" y2="${Y(0)}" stroke="var(--line)"/><line x1="30" y1="${Y(1)}" x2="${W-8}" y2="${Y(1)}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="26" y="${Y(1)+4}" font-size="10" text-anchor="end" fill="var(--mut)">1</text><text x="26" y="${Y(0)+4}" font-size="10" text-anchor="end" fill="var(--mut)">0</text>`;
 for(let k=1;k<=T.n;k++){const v=1-Math.pow(1-T.p,k),nv=k*T.p;s+=`<rect x="${X(k)-bw/2}" y="${Y(v)}" width="${bw}" height="${Y(0)-Y(v)}" rx="3" fill="var(--acc)" fill-opacity="${k===T.n?.85:.45}"/><circle cx="${X(k)}" cy="${Y(nv)}" r="3.5" fill="none" stroke="var(--acc2)" stroke-width="2"/><text x="${X(k)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${k}</text>`;}
 s+=`</svg>`;
 $("tplot").innerHTML=s+`<div class="legend mut"><span><i class="sw" style="background:var(--acc)"></i>少なくとも1回（正しい）</span><span><i class="sw" style="border:2px solid var(--acc2)"></i>p×回数（誤り）</span></div>`;
 const bn=T.b-T.a,num=Math.pow(T.b,T.n)-Math.pow(bn,T.n),den=Math.pow(T.b,T.n);
 $("tsum").innerHTML=`<div>1回も起きない＝(${T.b-T.a}/${T.b})^${T.n}＝${frac(Math.pow(bn,T.n),den)}　→　少なくとも1回＝1−${frac(Math.pow(bn,T.n),den)}＝<b>${frac(num,den)}</b>（≒${d3(T.atleast)}）</div><div class="mut">${T.a}/${T.b}×${T.n}＝${d3(T.naive)} とすると、2回以上起きる場合を何度も数えてしまう${T.naive>1?"（1を超えて確率にならない）":""}。</div>`;}
LK.register("atleast",{name:"少なくとも1回",
 init(){["ta","tb","tn"].forEach(id=>LK.stepper($(id),tRender));tRender();},
 apply(s){if(s.b!==undefined)LK.setRange("tb",s.b);if(s.a!==undefined)LK.setRange("ta",s.a);if(s.n!==undefined)LK.setRange("tn",s.n);tRender();},
 render:tRender,
 value(key){const T=tVals(),v=T[key];return {v,text:d3(v)};}});

LK.start("dice");
window.__LAB__={LK,dVals,rVals,tVals};
</script>
</body></html>
