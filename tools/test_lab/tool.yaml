id: LAB-test
name: 検定の考え方ラボ
slug: test                       # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: test_lab.src.html           # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [sim_test.html]   # 旧版 教科書24 の「x̄・σ・n で z と p 値、μ₁ で検出力、α と両側／片側」を z と power に含む。多重検定（旧版の「誤解と条件」の文）を multi にした
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予測と照らし合わせられる値（build が検査する）
  - key: z
    name: z 検定と p 値
    purpose: H₀：μ＝μ₀ のもとで z＝(x̄−μ₀)÷(σ÷√n) と p 値（両側・右片側・左片側）を出し、棄却域の境目（数表の 1.645・1.96・2.576 など）と比べる
    set: [side, alpha, xbar, mu0, sigma, n]   # side：two／upper／lower。alpha：0.1／0.05／0.01
    values: [se, z, p, crit, decision]        # decision：「棄却する」／「棄却しない」
  - key: power
    name: 検出力と過誤
    purpose: 本当の平均 μ₁ のときの検出力 1−β と β、x̄ の棄却の境目、検出力0.8 に必要な n。H₀ と本当の分布を重ねて描く。くわしくに n ごとの検出力の表
    set: [side, alpha, mu0, mu1, sigma, n]    # side：two／upper
    values: [se, shift, power, beta, xcrit, n80]
  - key: multi
    name: 何度も検定
    purpose: H₀ が正しい検定を k 回行ったとき、どれかが有意になる確率 1−(1−α)ᵏ と、1000組のシミュレーション（固定の乱数 seed 53）。α÷k の調整も切り替える
    set: [alpha, k, bonf]
    values: [level, fwer, sim]
data: スライダーと選択欄で決める（データの読み込みなし）。棄却域の境目は2級の数表の値。p 値と検出力は標準正規分布の累積から計算する
presets:
  s1-z:
    mode: z
    set: {side: two, alpha: 0.05, xbar: 103.8, mu0: 100, sigma: 8, n: 16}
    task: 従来の平均100・σ＝8。16人の平均が103.8。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0574
    why: z＝3.8÷2＝1.9、p＝2×(1−Φ(1.9))≒0.057。0.05 より大きいので H₀ を棄却しない。右片側なら p≒0.029 で棄却する（片側か両側かは調べる前に決める）。
  s1-power:
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 104, sigma: 10, n: 25}
    task: 本当の平均が104のとき、25人・両側5%の検定で H₀（μ＝100）を棄却できる確率（検出力）は（小数で）？
    predict: {type: number, key: power, label: "検出力 1−β"}
    expect: 0.516
    why: 本当の z の中心は 4÷2＝2。境目1.96を超える確率は約0.52。約半分は差を見逃す（β≒0.48）。n を100にすると約0.98。
  s3-free:
    mode: z
    modes: [z, power, multi]
    task: 解いてから、問題が聞いていること（p 値と判断か、検出力と過誤か、何度も検定することか）に合うモードで確かめる。
  s4-free:
    mode: z
    modes: [z, power, multi]
    task: 自分の売場の数字（基準の平均、施策後の平均、σ、人数）を入れ、p 値と、その人数で差を見つけられる確率を読む。
  s3-rule:
    mode: power
    steps:
      - label: n＝25・差4・α5%
        set: {side: two, alpha: 0.05, mu0: 100, mu1: 104, sigma: 10, n: 25}
        task: 本当の平均104、σ＝10、25人、両側5%。検出力は（小数で）？
        predict: {type: number, key: power, label: "検出力"}
        expect: 0.516
        why: 本当の z の中心は 4÷2＝2。境目1.96 をやっと超える位置なので、約半分。
      - label: n＝100（4倍）
        set: {n: 100}
        task: 人数だけを4倍の100人にする。検出力は（小数で）？
        predict: {type: number, key: power, label: "検出力"}
        expect: 0.9793
        why: SE が半分の1になり、中心が2から4へ。人数を4倍にすると中心が2倍になる。
      - label: n＝100・差2（半分）
        set: {mu1: 102}
        task: 100人のまま、本当の差を半分の2（μ₁＝102）にする。検出力は（小数で）？
        predict: {type: number, key: power, label: "検出力"}
        expect: 0.516
        why: 1つ目と同じ値に戻った。差を半分にしても、人数を4倍にすれば中心は同じ2。
      - label: n＝25・差4・α1%
        set: {alpha: 0.01, mu1: 104, n: 25}
        task: 1つ目の条件に戻し、有意水準だけを1%にする。検出力は（小数で）？
        predict: {type: number, key: power, label: "検出力"}
        expect: 0.2823
        why: 境目が2.576 に外へ動き、中心2 の山の大半が内側に入る。
    law:
      title: 式で説明する
      lines:
        - 本当の z の中心 ＝ (μ₁−μ₀)÷(σ÷√n) ＝ Δ×√n÷σ
        - 検出力 ≒ P(Z ＞ 境目 − Δ×√n÷σ)
        - Δ を半分にしても、√n が2倍（n が4倍）なら中心は同じ
      text: 検出力は「差 Δ」「人数 n」「ばらつき σ」が Δ×√n÷σ の形でまとめて効き、境目（α）で決まる。だから必要な人数は n≒((境目＋0.84)×σ÷Δ)² と見積もれる（発展2）。
      limit: σ を知らずに s で代わりにする（t 検定）と、少ない n では境目が外へ動き、検出力はこの見積もりより低くなる。店ごとの効果がばらばら（平均だけでは語れない）なときも、この式の外。
  s5-free:
    mode: power
    modes: [power, multi]
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 105, sigma: 20, n: 25}
    task: 「検出力と過誤」で μ₁ を100から110まで動かし、検出力の立ち上がり方を見る。「何度も検定」で k を15にし、調整なしと α÷k の調整を切り替える。
  s6-free:
    task: 自分の課題の数字で、モードを切り替えて確かめる（z 検定と p 値、検出力と過誤、何度も検定）。
  rel-pvalue-alpha-tour:   # 解説付き再生（#95）。関係「p値 と 有意水準 を比べる」から開く（#48 の U24）
    mode: z
    tour:
      steps:
        - title: 同じ所
          text: どちらも、帰無仮説が正しいとしたときの確率。従来の平均100・σ＝12・36人で平均104.2 なら、z＝**2.1**、両側の p 値は **0.036**。有意水準5%（境目1.96）と比べて、p 値の方が小さいので棄却する。
          set: {side: two, alpha: 0.05, xbar: 104.2, mu0: 100, sigma: 12, n: 36}
        - title: 違う所（有意水準はデータの前に決める）
          text: 同じデータで、有意水準を1%（境目2.576）にすると、p 値 0.036 は1%より大きく、棄却しない。有意水準は判断の線で、データを見る前に決める数。
          set: {alpha: 0.01}
        - title: 違う所（p 値はデータから出る）
          text: 有意水準を5%に戻し、別の36人で平均が102.6 だったとする。z＝**1.3**、p 値は **0.194** に変わり、棄却しない。p 値は標本ごとに変わる数。
          set: {alpha: 0.05, xbar: 102.6}
  rel-pvalue-alpha-free:   # 確かめる（自由に動かす。関係「p値 と 有意水準 を比べる」）
    mode: z
    set: {side: two, alpha: 0.05, xbar: 104.2, mu0: 100, sigma: 12, n: 36}
    task: 平均と人数を動かして p 値の変わり方を見る。有意水準を5%・1% と切り替え、同じ p 値でも判断が変わるのを確かめる。
  rel-type1-type2-tour:   # 解説付き再生（#95）。関係「第1種の過誤 と 第2種の過誤 を比べる」から開く（#48 の U24）
    mode: power
    tour:
      steps:
        - title: 同じ所
          text: どちらも、棄却域で決まる判定の誤り。従来の平均100・σ＝12・36人、両側5% で、母平均が103.6 のときを考える。第1種の過誤の確率は有意水準の0.05、第2種の過誤の確率 β は **0.56**（検出力 0.44）。
          set: {side: two, alpha: 0.05, mu0: 100, mu1: 103.6, sigma: 12, n: 36}
        - title: 違う所（片方を減らすと、もう片方が増える）
          text: 有意水準を1%にすると、第1種の過誤は0.01 に減るが、境目が外へ動き、β は **0.78** に増える。
          set: {alpha: 0.01}
        - title: 違う所（両方を減らすには n）
          text: 有意水準5%のまま、人数を4倍の144人にすると、標準誤差が半分になり、β は **0.05** まで下がる。第1種の過誤は0.05 のまま。
          set: {alpha: 0.05, n: 144}
  rel-type1-type2-free:   # 確かめる（自由に動かす。関係「第1種の過誤 と 第2種の過誤 を比べる」）
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 103.6, sigma: 12, n: 36}
    task: 有意水準を5%・1% と切り替え、β の変わり方を見る。次に人数を動かして、有意水準を変えずに β を0.2 以下にするには何人要るかを探す。
used_by: [U24]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予測の前に結果が隠れる・予測の答え＝ラボの値・埋め込み
  - node tools/test_lab/check.js         # 本文の値（z＝2.2・p≒0.028、検出力0.516、1−0.95²⁰）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
