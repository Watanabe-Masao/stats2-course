id: LAB-ratio
name: 割合ラボ
slug: ratio                      # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: ratio_lab.src.html          # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [ratio.html]    # 旧版 教科書01 の「増減率を重ねる」（＋20%→−20%）を chain モードに含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予測と照らし合わせられる値（build が検査する）
  - key: base
    name: 割合と基準量
    purpose: 割合＝部分÷基準量 を、割合・基準量・部分のどれについても解く
    set: [find, part, base, rate]
    values: [rate, base, part]        # rate は %
  - key: chain
    name: 増減を重ねる
    purpose: 2回の増減は倍率を掛ける。元に戻すのに必要な率も出す
    set: [x0, r1, r2]
    values: [total, final, mid, back]  # total・back は %
  - key: point
    name: "%とポイント"
    purpose: 割合どうしの差（ポイント）と、前を基準にした変化（%）
    set: [p1, p2]
    values: [pt, rel]
  - key: eq
    name: 式の変形
    purpose: a×x＋b＝c を x について解く（両辺に同じ操作）
    set: [a, b, c]
    values: [x]
  - key: margin
    name: 原価率・値入率
    purpose: 売価と原価から、売価基準の率（原価率・値入率＝値入額÷売価）と原価基準の率（マークアップ率）
    set: [price, cost]
    values: [costRate, margin, markup]   # すべて %
data: スライダーで値を決める（データの読み込みなし）
presets:
  s1-base:
    mode: base
    set: {find: base, part: 600, rate: 75}
    task: 原価600円が「売価の75%」になるように売価を決める。売価はいくらか。
    predict: {type: number, key: base, label: "売価", unit: "円"}
    expect: 800
    why: 「売価の75%」なので基準量は売価。0.75×売価＝600 から、売価＝600÷0.75＝800円。600×1.25＝750円 は「原価の125%」で、基準が違う。
  s1-chain:
    mode: chain
    set: {x0: 1000, r1: 30, r2: -30}
    task: 1,000円の売価を30%上げてから30%下げる。最初と比べて全体で何%か。
    predict: {type: number, key: total, label: "全体の増減率", unit: "%"}
    expect: -9
    why: 1,000×1.3＝1,300円、1,300×0.7＝910円。倍率 1.3×0.7＝0.91 で9%減。下げるときの基準は上げた後の1,300円。
  s4-margin:
    mode: margin
    modes: [margin, base]
    task: 売価と原価を動かし、原価率・値入率（値入額÷売価）とマークアップ率（値入額÷原価）がどう違うかを見る。次に「割合と基準量」で、粗利率から必要な売上を逆算する。
  s5-chain:
    mode: chain
    modes: [chain]
    set: {x0: 1000, r1: 10, r2: 10}
    task: 1,000円を10%増やしてから、さらに10%増やす。全体で何%増か。2回目の率を動かして、足し算（10＋2回目）とのずれを見る。
  s5-point:
    mode: point
    modes: [point]
    set: {p1: 20, p2: 30}
    task: 購入率が20% から30% になった。ポイントの差と、前を基準にした % の変化を読む。前の値を小さくすると、同じポイント差でも % の変化はどうなるか。
  s6-free:
    mode: base
    modes: [base]
    set: {find: rate, part: 300, base: 1500}
    task: レシート300枚、分母はセンサーの通過1,500回。購入率を読む。分母を1,000にすると購入率はいくつか。分母を動かして、購入率がどの範囲になりうるかを見る。
used_by: [U01]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予測の前に結果が隠れる・予測の答え＝ラボの値・埋め込み
  - node tools/ratio_lab/check.js        # 本文の値（売価1,000円、960円、−1%、20%・2ポイント、x＝5、値入率30%）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
