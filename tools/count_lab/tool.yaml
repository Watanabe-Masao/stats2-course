id: LAB-count
name: 数え方ラボ
slug: count                      # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: count_lab.src.html          # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 3                       # 2：共通部品に移した（slug は旧版と同じ）。3：条件付きで数えるモードを足した
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予測と照らし合わせられる値（build が検査する）
  - key: list
    name: 並べて数える
    purpose: n 人から r 人。役割を区別する（順列）・しない（組合せ）を書き出して比べる
    set: [n, r, role]           # role：あり／なし
    values: [perm, comb, count]
  - key: pascal
    name: パスカル
    purpose: ₙCᵣ＝ₙ₋₁Cᵣ₋₁＋ₙ₋₁Cᵣ、段の合計 2ⁿ、その段から作る二項分布の確率の合計
    set: [n, r, p]
    values: [c, left, right, rowsum, psum]
  - key: multi
    name: 重複を許す
    purpose: n 種類から r 個、同じ種類を何度でも。順番あり nʳ、順番なし ₙ₊ᵣ₋₁Cᵣ
    set: [n, r]
    values: [pow, h, comb]
  - key: path
    name: 道順
    purpose: 格子の最短経路＝→ と ↑ の並べ方
    set: [a, b]
    values: [paths]
  - key: der
    name: 完全順列
    purpose: 全員が他人の物を受け取る数と確率。1/e に近づく
    set: [n]
    values: [d, all, p]
  - key: cond
    name: 条件付き
    purpose: 特定の1人を含む・少なくとも1人・2人が隣り合う・ちょうど k 個（超幾何）。直接数えるか、反対を引く
    set: [kind, n, r, m, k]     # kind：include／atleast／adjacent／hyper。m は印（女性・不良など）の数
    values: [count, total, prob]
data: スライダーで値を決める（データの読み込みなし）
presets:
  s1-list:
    mode: list
    set: {n: 5, r: 2, role: なし}
    unlock: [role]
    task: 5人からレジと品出しを1人ずつ選ぶと20通り。役割のない当番2人を選ぶだけなら何通りか。
    predict: {type: number, key: comb, label: "役割なしの選び方", unit: "通り"}
    expect: 10
    why: 「レジA・品出しB」と「レジB・品出しA」は同じ組 {A, B}。どの組も 2!＝2 回ずつ数えているので 20÷2＝10。役割を「区別する」に切り替えると、帯1本に2通りずつ並ぶ。
  s1-exp:
    mode: list
    set: {n: 4, r: 3, role: あり}
    unlock: [role]
    task: 4人から3人を、役割（1番・2番・3番）を決めて選ぶ。何通りか。
    predict: {type: number, key: perm, label: "役割ありの選び方", unit: "通り"}
    expect: 24
    why: 4×3×2＝24。色の帯1本（同じ3人の組）に 3!＝6 通りずつ並ぶので、役割なしなら 24÷6＝4。
  s2-pascal:
    mode: pascal
    set: {n: 7, r: 3}
    task: パスカルの三角形の7段目で ₇C₃ を選ぶ。上の段のどの2つの数の和か。₇C₃ はいくつか。
    predict: {type: number, key: c, label: "₇C₃"}
    expect: 35
    why: ₇C₃＝₆C₂＋₆C₃＝15＋20＝35。特定の1人を含む選び方（15）と含まない選び方（20）の和。
  s3-free:
    mode: cond
    modes: [cond, list, pascal]
    task: 解いてから、「条件付き」で条件を問題に合わせ、太枠（条件を満たすもの）の数と式を比べる。「パスカル」で数をタップすると、特定の1人を含む・含まないに分かれる。
  s4-path:
    mode: path
    modes: [path, list]
    task: → を3個、↑ を2個並べる並べ方が、「5歩のうち → にする3歩を選ぶ」ことと同じだと確かめる。くわしくで書き出しを見る。
  s5-more:
    mode: pascal
    modes: [pascal, multi, der]
    task: 「パスカル」で段の合計と二項分布の確率の合計（発展1）、「重複を許す」で ● と ｜ の並べ方（発展2）、「完全順列」で 1/e への近づき方（発展3）を見る。
  s6-free:
    task: 自分の式を小さい例で確かめる。「並べて数える」の書き出しや「道順」の書き出しで、式と書き出しの数が一致するか見る。
  rel-perm-comb-tour:   # 解説付き再生（#95）。関係「順列 → 組合せ（移る）」から開く。関係のページには予測がないので、数は単元の問題と重なってもよい（同じページで予測させない）。最後の「つまり」は build が関係の gist から足す
    mode: list
    tour:
      steps:
        - title: 役割を区別して並べる
          text: 6人から2人を、**役割を区別して**並べる。1人目は6通り、2人目は残りの5通りで、6×5＝**30 通り**。
          set: {n: 6, r: 2, role: あり}
        - title: 同じ組をまとめる
          text: 区別したときの帯1本（A→B と B→A）が、役割を区別しないと **1つの組 {A,B}** になる。どの組も 2!＝2 回ずつ数えていたので、30÷2＝**15 通り**。
          set: {role: なし}
        - title: 3人なら 3! で割る
          text: 3人を選ぶと、1つの組の中の並べ方は **3!＝6 通り**。順列 120 通りを 6 で割ると、組合せは **20 通り**。
          frames: [{r: 3, role: あり}, {r: 3, role: なし}]
  rel-perm-fact-tour:   # 解説付き再生（#95）。関係「順列 → 階乗（移る）」から開く。r を n まで増やす
    mode: list
    tour:
      steps:
        - title: 1人ずつ並べる
          text: 4人から何人かを**役割を区別して**並べる。1人なら 4 通り、2人なら 4×3＝**12 通り**。
          set: {n: 4, r: 1, role: あり}
          frames: [{r: 2}]
        - title: 全員を並べる
          text: 選ぶ人数を増やす。3人で 4×3×2＝**24 通り**。4人目は残った1人に決まり、選ぶ余地がない（×1）ので、全員を並べても **24 通り**のまま。全員を並べる ₄P₄ は **4!**。
          frames: [{r: 3}, {r: 4}]
  rel-perm-comb-contrast-tour:   # 解説付き再生（#95）。関係「順列 と 組合せ を比べる」から開く。同じ所 → 違う所 → だから
    mode: list
    tour:
      steps:
        - title: 同じ所
          text: どちらも **6人から3人を取り出す**数で、取り出す3人の組は同じ **20 組**。
          set: {n: 6, r: 3, role: なし}
        - title: 違う所
          text: 役割（1番・2番・3番）を**区別する**と、1つの組の中の並べ方 3!＝6 通りを別々に数えるので、20×6＝**120 通り**。
          set: {role: あり}
        - title: だから
          text: 迷ったら、**選んだ2人を入れ替えて、別の結果になるか**を見る。委員長と副委員長を入れ替えると別の決め方（順列）、委員どうしを入れ替えても同じ（組合せ）。
  rel-perm-free:   # 関係「順列 → 組合せ」「順列 と 組合せ を比べる」から開く「確かめる」（予測なし）
    mode: list
    set: {n: 5, r: 3, role: あり}
    task: 人数と選ぶ人数を動かし、役割を区別する・しないを切り替える。帯1本の並べ方の数が「選ぶ人数の階乗」になり、順列をそれで割ると組合せになるかを見る。選ぶ人数を全員に合わせると、順列は人数の階乗になる。
used_by: [U09]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予測の前に結果が隠れる・予測の答え＝ラボの値・埋め込み
  - node tools/count_lab/check.js        # 本文の値（₅P₂＝20・₅C₂＝10、₇C₃＝15＋20、₇C₄＝35、₄C₂ の段、完全順列 9/24、条件付き 10・34・48・7/15）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
