<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数え方ラボ</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#5d6670;--line:#d0d7de;--card:#f6f8fa;--acc:#0b63c9;--acc2:#b0306f;--ok:#1a7f37;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6edf3;--mut:#a3adb8;--line:#3d444d;--card:#252525;--acc:#4c9bff;--acc2:#e06aa8;--ok:#3fb950;--hl:#4a4220}}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px;font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1 1 30%;padding:7px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0}
label{font-size:14px;display:flex;align-items:center;gap:6px}
input[type=range]{width:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;padding:1px 7px;margin:2px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:13px}
.grp{padding:4px 6px;border-radius:8px;margin:4px 0;border-left:5px solid var(--acc);background:var(--card)}
.grp:nth-child(even){border-left-color:var(--acc2)}
.grp b{display:inline-block;min-width:76px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.flex{display:flex;flex-wrap:wrap}
button.act{padding:7px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
button.sub{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
.tri{display:flex;flex-direction:column;align-items:center;gap:3px;margin:6px 0}
.tri div{display:flex;gap:3px}
.cell{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:12px;cursor:pointer;padding:0}
.cell.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.cell.par{border:2px solid var(--acc2);background:var(--hl)}
.cell.mir{border:2px dashed var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
.big{font-size:18px;font-weight:700}
.legend span{margin-right:10px;font-size:12px}
svg{max-width:100%;height:auto}
.mono{font-family:ui-monospace,Menlo,monospace}
</style></head><body>
<h1>🧮 数え方ラボ</h1>
<div class="tabs" id="tabs"></div>

<div id="m-list" class="mode">
 <div class="row">
  <label>人数 n <input type="range" id="ln" min="2" max="6" value="5"><b id="lnv">5</b></label>
  <label>選ぶ数 r <input type="range" id="lr" min="1" max="4" value="2"><b id="lrv">2</b></label>
 </div>
 <div class="row">
  <label><input type="checkbox" id="lrole" checked> 役割（順番）を区別する</label>
  <label><input type="checkbox" id="lhide"> 予想してから表示</label>
 </div>
 <div id="lhidebox" class="card" style="display:none">何通りになるか予想を書いてから → <button class="act" id="lshow">表示する</button></div>
 <div id="lbody"><div class="card" id="lsum"></div><div id="llist"></div></div>
</div>

<div id="m-pascal" class="mode">
 <p class="mut" style="margin:0">数字をタップすると、その数がどこから来るかを表示します。</p>
 <div class="legend mut"><span>■ 選んだ数</span><span style="color:var(--acc2)">□ 足し合わせる2つ</span><span>┅ 対称な数</span></div>
 <div class="tri" id="ptri"></div>
 <div class="card" id="pinfo"></div>
</div>

<div id="m-multi" class="mode">
 <div class="row">
  <label>種類 n <input type="range" id="mn" min="2" max="5" value="3"><b id="mnv">3</b></label>
  <label>選ぶ個数 r <input type="range" id="mr" min="1" max="6" value="2"><b id="mrv">2</b></label>
 </div>
 <div class="card" id="msum"></div>
 <div id="mlist"></div>
</div>

<div id="m-path" class="mode">
 <div class="row">
  <label>右へ <input type="range" id="pa" min="1" max="5" value="3"><b id="pav">3</b>歩</label>
  <label>上へ <input type="range" id="pb" min="1" max="4" value="2"><b id="pbv">2</b>歩</label>
 </div>
 <div id="psvg"></div>
 <div class="row"><button class="act" id="pnew">別の道を表示</button><button class="sub" id="pall">全部書き出す</button></div>
 <div class="card" id="psum"></div>
 <div id="plist" class="flex"></div>
</div>

<div id="m-der" class="mode">
 <p class="mut" style="margin:0">n人がプレゼントを持ち寄って無作為に配り直す。<b>全員が自分以外の物</b>を受け取る確率は？</p>
 <div class="row"><label>人数 n <input type="range" id="dn" min="2" max="10" value="4"><b id="dnv">4</b></label></div>
 <div class="card" id="dsum"></div>
 <div class="row"><button class="act" id="dsim">1000回配り直す</button><button class="sub" id="dreset">実験をリセット</button></div>
 <div class="card" id="dexp"><span class="mut">ボタンを押すと、実際に配り直した結果の割合を表示します（押すたびに少し揺れます）。</span></div>
 <table id="dtab"></table>
</div>

<script>
const DEFAULT="list";
const MODES=[["list","並べて数える"],["pascal","パスカル"],["multi","重複を許す"],["path","道順"],["der","完全順列"]];
const $=id=>document.getElementById(id);
const cc=(n,r)=>`<sub>${n}</sub>C<sub>${r}</sub>`;
const pp=(n,r)=>`<sub>${n}</sub>P<sub>${r}</sub>`;
function C(n,r){if(r<0||r>n)return 0;r=Math.min(r,n-r);let x=1;for(let i=1;i<=r;i++)x=x*(n-r+i)/i;return Math.round(x);}
function fact(n){let x=1;for(let i=2;i<=n;i++)x*=i;return x;}
const fmt=x=>x.toLocaleString("ja-JP");

// tabs
const tabs=$("tabs");
MODES.forEach(([k,name])=>{const b=document.createElement("button");b.textContent=name;b.dataset.m=k;b.onclick=()=>show(k);tabs.appendChild(b);});
function show(k){document.querySelectorAll(".mode").forEach(d=>d.style.display="none");$("m-"+k).style.display="block";
 tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===k));}

// ---- list
let revealed=true;
function perms(arr,r){const out=[],used=arr.map(()=>false),cur=[];(function rec(){if(cur.length===r){out.push(cur.slice());return;}
 for(let i=0;i<arr.length;i++){if(!used[i]){used[i]=true;cur.push(arr[i]);rec();cur.pop();used[i]=false;}}})();return out;}
function renderList(changed){
 const n=+$("ln").value; $("lr").max=Math.min(4,n); let r=Math.min(+$("lr").value,n); $("lr").value=r;
 $("lnv").textContent=n;$("lrv").textContent=r;
 if(changed&&$("lhide").checked)revealed=false;
 if(!$("lhide").checked)revealed=true;
 $("lhidebox").style.display=revealed?"none":"block"; $("lbody").style.display=revealed?"block":"none";
 const role=$("lrole").checked;
 const L="ABCDEF".slice(0,n).split("");
 const ps=perms(L,r); const groups=new Map();
 ps.forEach(p=>{const k=p.slice().sort().join("");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);});
 const keys=[...groups.keys()].sort();
 const P=ps.length, Cn=keys.length, rf=fact(r);
 const prod=[];for(let i=0;i<r;i++)prod.push(n-i);
 $("lsum").innerHTML=
  `<div${role?' class="big"':''}>順列 ${pp(n,r)} ＝ ${prod.join("×")} ＝ ${fmt(P)} 通り</div>`+
  `<div${!role?' class="big"':''}>組合せ ${cc(n,r)} ＝ ${fmt(P)} ÷ ${r}! ＝ ${fmt(P)} ÷ ${rf} ＝ ${fmt(Cn)} 通り</div>`+
  `<div class="mut">色の帯1本が「同じ組」。役割を区別すると、1つの組の中に ${r}!＝${rf} 通りの並べ方がある。</div>`;
 let h="";
 if(role){keys.forEach(k=>{h+=`<div class="grp"><b>{${k.split("").join(",")}}</b>`+groups.get(k).map(p=>`<span class="chip">${p.join("→")}</span>`).join("")+`</div>`;});}
 else{h='<div class="flex">'+keys.map(k=>`<span class="chip">{${k.split("").join(",")}}</span>`).join("")+"</div>";}
 $("llist").innerHTML=h;
}
["ln","lr","lrole"].forEach(id=>$(id).addEventListener("input",()=>renderList(true)));
$("lhide").addEventListener("change",()=>renderList(true));
$("lshow").onclick=()=>{revealed=true;renderList(false);};

// ---- pascal
const ROWS=8; let sel=[5,2];
function renderPascal(){
 let h="";for(let n=0;n<=ROWS;n++){h+="<div>";for(let r=0;r<=n;r++){
  let c="cell";const [sn,sr]=sel;
  if(n===sn&&r===sr)c+=" sel";else if(sn>0&&n===sn-1&&(r===sr-1||r===sr)&&sr>0&&sr<sn)c+=" par";else if(n===sn&&r===sn-sr)c+=" mir";
  h+=`<button class="${c}" data-n="${n}" data-r="${r}">${C(n,r)}</button>`;}h+="</div>";}
 $("ptri").innerHTML=h;
 $("ptri").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=[+b.dataset.n,+b.dataset.r];renderPascal();});
 const [n,r]=sel; let t;
 if(r===0||r===n){t=`${cc(n,r)} ＝ 1：${r===0?"誰も選ばない":"全員を選ぶ"}選び方は1通りだけ。`;}
 else{const a=C(n-1,r-1),b=C(n-1,r);
  t=`<div class="big">${cc(n,r)} ＝ ${a} ＋ ${b} ＝ ${C(n,r)}</div>`+
  `<div>・特定の1人（Aさん）を<b>含む</b>選び方：残り${n-1}人から${r-1}人 → ${cc(n-1,r-1)}＝${a}</div>`+
  `<div>・Aさんを<b>含まない</b>選び方：残り${n-1}人から${r}人 → ${cc(n-1,r)}＝${b}</div>`+
  (r*2===n?`<div>・この段のちょうど真ん中（左右対称の軸）</div>`:`<div>・対称：${cc(n,r)}＝${cc(n,n-r)}（選ばない${n-r}人を選ぶのと同じ）</div>`);}
 let s=0;for(let k=0;k<=n;k++)s+=C(n,k);
 t+=`<div class="mut">この段の合計 ＝ ${s} ＝ 2<sup>${n}</sup>（1人ずつ「選ぶ・選ばない」の2択）</div>`;
 $("pinfo").innerHTML=t;
}

// ---- multi
const NAMES=["あん","クリーム","メロン","カレー","チョコ"];
function comps(n,r){const out=[];const cur=[];(function rec(i,left){if(i===n-1){cur.push(left);out.push(cur.slice());cur.pop();return;}
 for(let k=left;k>=0;k--){cur.push(k);rec(i+1,left-k);cur.pop();}})(0,r);return out;}
function renderMulti(){
 const n=+$("mn").value,r=+$("mr").value;$("mnv").textContent=n;$("mrv").textContent=r;
 const H=C(n+r-1,r), list=comps(n,r);
 $("msum").innerHTML=`<div class="big">重複を許す組合せ ＝ ${cc(n+r-1,r)} ＝ ${fmt(H)} 通り</div>`+
 `<div>● を ${r} 個、仕切り ｜ を ${n-1} 本並べる。並ぶ ${n+r-1} か所のうち ● にする ${r} か所を選ぶ。</div>`+
 `<div class="mut">比べる：順番を区別して重複可 → ${n}<sup>${r}</sup>＝${fmt(n**r)} 通り／重複なし・順番なし → ${r<=n?cc(n,r)+"＝"+C(n,r)+" 通り":"選べない（r＞n）"}</div>`;
 const show=list.slice(0,60);
 let h=show.map(v=>{const bar=v.map(k=>"●".repeat(k)).join("｜");const nm=v.map((k,i)=>k?`${NAMES[i]}×${k}`:"").filter(Boolean).join("・");
  return `<div class="grp"><span class="mono">${bar||"｜"}</span>　<span class="mut">${nm}</span></div>`;}).join("");
 if(list.length>60)h+=`<p class="mut">ほか ${list.length-60} 通り（表示は60通りまで）</p>`;
 $("mlist").innerHTML=h;
}

// ---- path
let curPath=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newPath(){const a=+$("pa").value,b=+$("pb").value;curPath=shuffle(Array(a).fill("R").concat(Array(b).fill("U")));}
function renderPath(){
 const a=+$("pa").value,b=+$("pb").value;$("pav").textContent=a;$("pbv").textContent=b;
 if(!curPath||curPath.filter(x=>x==="R").length!==a||curPath.length!==a+b)newPath();
 const s=48,pad=14,W=a*s+pad*2,Hh=b*s+pad*2;
 let g=`<svg viewBox="0 0 ${W} ${Hh}" width="${W}" role="img" aria-label="格子の道順">`;
 for(let i=0;i<=a;i++)g+=`<line x1="${pad+i*s}" y1="${pad}" x2="${pad+i*s}" y2="${pad+b*s}" stroke="var(--line)" stroke-width="1.5"/>`;
 for(let j=0;j<=b;j++)g+=`<line x1="${pad}" y1="${pad+j*s}" x2="${pad+a*s}" y2="${pad+j*s}" stroke="var(--line)" stroke-width="1.5"/>`;
 let x=0,y=0,pts=[`${pad},${pad+b*s}`];curPath.forEach(d=>{if(d==="R")x++;else y++;pts.push(`${pad+x*s},${pad+(b-y)*s}`);});
 g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
 g+=`<circle cx="${pad}" cy="${pad+b*s}" r="6" fill="var(--ok)"/><circle cx="${pad+a*s}" cy="${pad}" r="6" fill="var(--acc2)"/>`;
 g+=`<text x="${pad+4}" y="${pad+b*s-8}" font-size="11" fill="var(--fg)">S</text><text x="${pad+a*s-14}" y="${pad+14}" font-size="11" fill="var(--fg)">G</text></svg>`;
 $("psvg").innerHTML=g;
 const arrows=curPath.map(d=>d==="R"?"→":"↑").join("");
 $("psum").innerHTML=`<div>今の道：<span class="mono big">${arrows}</span></div>`+
 `<div class="big">最短の道順 ＝ ${cc(a+b,a)} ＝ ${fmt(C(a+b,a))} 通り</div>`+
 `<div>→ を ${a} 個、↑ を ${b} 個並べる。${a+b} 歩のうち → にする ${a} 歩を選ぶ（＝ ${cc(a+b,b)}）。</div>`;
}
function allPaths(){const a=+$("pa").value,b=+$("pb").value;const out=[];(function rec(s,r,u){if(r===0&&u===0){out.push(s);return;}
 if(r>0)rec(s+"→",r-1,u);if(u>0)rec(s+"↑",r,u-1);})("",a,b);
 const show=out.slice(0,70);$("plist").innerHTML=show.map(p=>`<span class="chip">${p}</span>`).join("")+(out.length>70?`<p class="mut">ほか ${out.length-70} 通り</p>`:"")+`<p class="mut" style="width:100%">全 ${out.length} 通り</p>`;}

// ---- derangement
const D=[1,0];for(let n=2;n<=10;n++)D[n]=(n-1)*(D[n-1]+D[n-2]);
let simT=0,simOK=0;
function renderDer(){
 const n=+$("dn").value;$("dnv").textContent=n;
 const p=D[n]/fact(n);
 let terms=[];for(let k=0;k<=Math.min(n,4);k++)terms.push((k%2?"−":(k?"＋":""))+`1/${k}!`);
 $("dsum").innerHTML=`<div class="big">全員が他人の物：${fmt(D[n])} 通り ／ 全 ${fmt(fact(n))} 通り</div>`+
 `<div>確率 ＝ ${p.toFixed(4)}　　1/e ＝ ${(1/Math.E).toFixed(4)}</div>`+
 `<div class="mut">包除原理：確率 ＝ ${terms.join(" ")}${n>4?" … "+(n%2?"−":"＋")+"1/"+n+"!":""}。n が大きくなると 1/e に近づく。</div>`;
 let t="<tr><th>n</th><th>全員が他人の物</th><th>確率</th></tr>";
 for(let k=2;k<=10;k++)t+=`<tr${k===n?' style="background:var(--hl)"':""}><td>${k}</td><td>${fmt(D[k])}</td><td>${(D[k]/fact(k)).toFixed(4)}</td></tr>`;
 $("dtab").innerHTML=t;
}
function sim(){const n=+$("dn").value;for(let t=0;t<1000;t++){const a=shuffle([...Array(n).keys()]);let ok=true;for(let i=0;i<n;i++)if(a[i]===i){ok=false;break;}if(ok)simOK++;simT++;}
 $("dexp").innerHTML=`<div>実験：${fmt(simT)} 回中 ${fmt(simOK)} 回 → 割合 <b>${(simOK/simT).toFixed(4)}</b></div><div class="mut">理論値 ${(D[n]/fact(n)).toFixed(4)}。回数を増やすほど近づくが、ぴったり一致するとは限らない。</div>`;}
function resetSim(){simT=0;simOK=0;$("dexp").innerHTML='<span class="mut">ボタンを押すと、実際に配り直した結果の割合を表示します（押すたびに少し揺れます）。</span>';}

["mn","mr"].forEach(id=>$(id).addEventListener("input",renderMulti));
["pa","pb"].forEach(id=>$(id).addEventListener("input",()=>{$("plist").innerHTML="";renderPath();}));
$("pnew").onclick=()=>{newPath();renderPath();};$("pall").onclick=allPaths;
$("dn").addEventListener("input",()=>{resetSim();renderDer();});$("dsim").onclick=sim;$("dreset").onclick=resetSim;

if(DEFAULT==="list"){$("lhide").checked=true;revealed=false;}
renderList(false);renderPascal();renderMulti();renderPath();renderDer();show(DEFAULT);
</script>
</body></html>
