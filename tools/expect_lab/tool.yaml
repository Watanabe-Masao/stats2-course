id: LAB-expect
name: 期待値ラボ
slug: expect                     # 公開サイトでのフォルダ名（URL の一部。変えるとリンクが切れる）
kind: simulator
src: expect_lab.src.html         # 共通部品（tools/labkit）を差し込んで build/labs.py が out/labs/ に作る
version: 1
replaces_legacy: [sim_expect.html]   # 旧版 教科書13 の「aX＋b を動かす」を lin モードに含む
modes:   # ラボと原本の約束。set＝場面の版で渡せる値、values＝予想と照らし合わせられる値（build が検査する）
  - key: dist
    name: 分布と期待値
    purpose: 値ごとの確率から、期待値（重心）・E(X²)・分散・標準偏差。最後の値の確率は合計100%になるよう自動で決まる
    set: [xs, p, unit, name]      # xs："0,1,2" のような値の並び。p：各値の確率（%）の並び（最後は残りで決まる）
    values: [mean, ex2, var, sd]
  - key: lin
    name: aX＋b
    purpose: Y＝aX＋b の期待値・分散・標準偏差。b はばらつきに効かず、a は標準偏差を |a| 倍にする
    set: [xs, p, unit, name, a, b, yunit]
    values: [ey, vy, sdy, ex, vx]
  - key: sum
    name: 和と差
    purpose: E(X±Y)＝E(X)±E(Y)、V(X±Y)＝V(X)＋V(Y)±2Cov(X,Y)。差でも分散は足す
    set: [ex, ey, vx, vy, cov]
    values: [esum, ediff, vsum, vdiff, sdsum, sddiff]
  - key: total
    name: n 人の合計
    purpose: 独立な n 人分の合計。期待値・分散は n 倍、標準偏差は √n 倍（標準偏差を n 倍するのは誤り）
    set: [n, mu, var, unit]
    values: [etot, vtot, sdtot, naive, sdmean]
  - key: joint
    name: 同時分布
    purpose: 2つの 0/1 の量の同時確率から、周辺確率・E(XY)・共分散・独立か
    set: [p11, p10, p01, nameX, nameY]   # % 。どちらもしない は残りで決まる
    values: [px, py, exy, cov, corr, indep, vx]   # vx：V(X)＝P(X＝1)(1−P(X＝1))
data: スライダーと選択欄で値を決める（データの読み込みなし）
presets:
  s1-dist:
    mode: dist
    set: {xs: "0,1,2", p: [20, 50, 30], unit: 個, name: 買う個数}
    task: 1人の客が買う個数は、0個 20%・1個 50%・2個 30%。1人あたり平均何個買うか（期待値）。
    predict: {type: number, key: mean, label: "E(X)", unit: "個"}
    expect: 1.1
    why: 0×0.2＋1×0.5＋2×0.3＝1.1個。確率で重みを付けた平均で、分布の重心（▲）の位置。1.1個を買う客はいないが、100人なら約110個。
  s1-var:
    mode: dist
    set: {xs: "0,2", p: [45, 55], unit: 個, name: 売場Bで買う個数}
    unlock: [xs]
    task: 売場Bでは、0個 45%・2個 55%（1個はいない）。期待値は売場Aと同じ1.1個。分散はいくつか（売場Aは0.49）。
    predict: {type: number, key: var, label: "V(X)"}
    expect: 0.99
    why: E(X²)＝4×0.55＝2.2、V＝2.2−1.1²＝0.99。期待値は同じでも、値が期待値から離れた所に分かれていると分散は大きい。
  s3-free:
    mode: dist
    modes: [dist, lin, sum]
    task: 解いてから、「分布と期待値」で確率を問題に合わせて答えを確かめる。aX＋b は「aX＋b」、和・差の分散は「和と差」で確かめる。
  s4-total:
    mode: total
    modes: [total, lin, sum]
    set: {n: 300, mu: 1.1, var: 0.49, unit: 個}
    task: 自分の売場の数字（1人あたりの期待値・分散と来店数）を入れ、合計の見込みと、その標準偏差を読む。人数を増やすと、標準偏差がどう増えるかを見る。
  rel-indep-tour:   # 解説付き再生（#95）。関係「独立 → 共分散（導出）」。周辺の確率（50%・40%）は同じまま、両方の確率だけ変える
    mode: joint
    tour:
      decimals: 3
      steps:
        - title: 独立
          text: 両方＝20%＝50%×40%。独立なら E(XY)＝E(X)E(Y) で **共分散は0**。
          set: {p11: 20, p10: 30, p01: 20, nameX: 弁当, nameY: お茶}
          focus: cov
        - title: 一緒に起きやすい
          text: 両方を30%にする（XとYの割合は同じ）。一緒に起きやすいと**共分散は正**。
          set: {p11: 30, p10: 20, p01: 10}
          focus: cov
        - title: 一緒に起きにくい
          text: 両方を10%にすると**共分散は負**。0でないので独立ではない。
          set: {p11: 10, p10: 40, p01: 30}
          focus: cov
  rel-varcov-tour:   # 解説付き再生（#95）。関係「分散 → 共分散（一般化）」。Y を X と同じにすると Cov(X, X)＝V(X)
    mode: joint
    tour:
      decimals: 3
      steps:
        - title: 2つのずれの積
          text: 共分散は **X と Y のずれの積**の平均。弁当とお茶なら Cov＝0.1。
          set: {p11: 30, p10: 20, p01: 10, nameX: 弁当, nameY: お茶}
          focus: cov
        - title: Y を X と同じに
          text: Y＝X にすると **Cov(X, X)＝V(X)**＝0.25。分散は共分散の特別な場合。
          set: {p11: 50, p10: 0, p01: 0, nameY: 弁当}
          focus: var
  s5-free:
    mode: joint
    modes: [joint, total, dist]
    task: 「同時分布」で、共分散を0にすると P(両方)＝P(X＝1)P(Y＝1) になる（0/1 の量では無相関なら独立）ことを確かめる。「n 人の合計」で、1人あたりの平均のぶれが人数とともに小さくなるのを見る。
  s6-free:
    task: 自分の課題の数字で、モードを切り替えて確かめる（分布と期待値、aX＋b、和と差、n 人の合計、同時分布）。
used_by: [U13]
tests:
  - node tools/test_labs.js              # 全部の版：エラー・380px・ライト／ダーク・予想の前に結果が隠れる・予想の答え＝ラボの値・埋め込み
  - node tools/expect_lab/check.js       # 本文の値（1.1・1.7・0.49・0.7、0.99、270円・140円、15・11、330個・147・12.1、Cov 0.1）
checked:
  browser_380px: 2026-10-28
  notion_iphone: null
