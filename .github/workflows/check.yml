name: check
# 全部の確認は PR と main への取り込みでだけ走らせる。ブランチの途中は build/check_changed.py で範囲だけ確かめる。
# 時間のほとんどはラボの版のブラウザテストなので、6台に分けて並行に走らせる（1台の中では同時に2つ走らせない）。
# 段ごとの時間は各ジョブの概要（Summary）に表で出る（#129）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# 読むだけ（書き込む権限を持たせない）
permissions:
  contents: read
# 同じ PR に新しいコミットが来たら、古いコミットの確認だけ取り消す（マージの判断は最新のコミットの結果で行うため）。
# main への取り込みと手動の実行は取り消さない（main の確認は1回ずつ最後まで走らせる）。
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # sync_schema.py が元の版を読むとき（回数の制限を避ける）
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # ブラウザの依存（フォントなど）は Ubuntu のパッケージの置き場から取る。置き場の名前が引けない時間があった
      # （2026-11-11 の夜、1時間半ほど全部の段がここで落ちた）ので、失敗したら 60 秒おいて 3 回までやり直す
      - if: steps.pw.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "ブラウザの依存の取得に失敗（$i 回目）"; sleep 60; done; exit 1
      - if: steps.pw.outputs.cache-hit == 'true'
        run: for i in 1 2 3; do npx playwright install-deps chromium && exit 0; echo "ブラウザの依存の取得に失敗（$i 回目）"; sleep 60; done; exit 1
      - run: build/check_all.sh
        env: {PART: base}
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # ブラウザの依存（フォントなど）は Ubuntu のパッケージの置き場から取る。置き場の名前が引けない時間があった
      # （2026-11-11 の夜、1時間半ほど全部の段がここで落ちた）ので、失敗したら 60 秒おいて 3 回までやり直す
      - if: steps.pw.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "ブラウザの依存の取得に失敗（$i 回目）"; sleep 60; done; exit 1
      - if: steps.pw.outputs.cache-hit == 'true'
        run: for i in 1 2 3; do npx playwright install-deps chromium && exit 0; echo "ブラウザの依存の取得に失敗（$i 回目）"; sleep 60; done; exit 1
      - run: build/check_all.sh
        env: {PART: labs, SHARD: "${{ matrix.shard }}/6"}
