# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "17": 単元番号の文字。「抽出枠の漏れ（17）」は初学「2｜意味をつかむ」の {{unit:U17}} へのリンクに置き換えた
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（大規模店・小規模店、ネットで1万人）に置き換えた
  混同注意: 「層化＝全ての層から、集落＝いくつかの集団を丸ごと、1万人でも自己選択なら偏りは消えない」は例題Aの後の warn・key 部品に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「層の割合 w を動かす」は例題Aのラボ、「抽出枠の漏れは標本を増やしても残る」はラボの「消えない偏り」と発展1にした）
  答えの読み方: 「全店の平均売上は約80万円。層化して重みを正しく付けると…」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
