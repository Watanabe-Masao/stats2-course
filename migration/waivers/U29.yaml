# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "81": 旧版の「『81%の予測が正解』という意味ではない」は、例題Aの後の warn 部品（「予測が81%当たる」ではない）と、復習の言葉にする練習・問題 Q-U29-023 の誤解①に言い換えて残した
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（広告1回あたりの来店の増え方、6回の予測）に置き換えた
  よくある間違い: 「R² は予測が当たる割合ではない」「範囲外の予測は外挿」は例題Aの後の warn 部品に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「残差の2乗和が最小になる直線」を、自分で直線を引いて正方形の面積を小さくする実験の題材にした）
  答えの読み方: 「広告1回ごとに平均0.9百人多い傾向、因果とは限らない、検定は30へ」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
