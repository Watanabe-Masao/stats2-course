# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」に置き換えた。「N個の中からn個を無作為に選ぶ」場面は初学3の「式を言葉で読む」に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた
  混同注意: 「無作為＝適当ではない」「標本が大きい≠偏りがない」は、初学2の問い・key 部品と、復習の「取り違えやすい言葉」に残した
  答えの読み方: 例題Aの後の key 部品（ここが一番大事）に「誰に結論を広げたいか／誰を選べたか」「無作為化では埋まらない」として残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
