# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "05": 見出しの「補講 05-T」は単元へのリンク（{{unit:U05T}}）に置き換えた
phrases:
  「平均」と「中央値」: 復習の「取り違えやすい言葉」の開閉に、見出しを「平均と中央値」として同じ内容（合計を保つ・半数ずつに分ける位置）を残した
  「単純平均」と「重み付き平均」: 同上（「単純平均と重み付き平均」）
  「算術平均」と「幾何平均」: 同上（「算術平均と幾何平均」）
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U06.yaml の difficulty から自動で付く（旧版の問1は Q-U06-003 として残した）
  問2（中）: 旧版の問2（2店の客単価）は、計算の流れを穴埋めにした例題B（Q-U06-001）に移した
  問3（やや難）: 旧版の問3（1, 2, 2, 3, 22）は、自力で解く例題C（Q-U06-002）に移した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「外れ値にすると平均は大きく動くが中央値はほとんど動かない」は観察と説明の答えに含めた）
