# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "05": 旧版の「ヒストグラム（05）」は単元への参照。新しい原本では {{unit:U05}} のメンションで書く（番号を直接書かない）
phrases:
  0.6827（約68%）: 表の4桁 Φ(1)＝0.8413・Φ(−1)＝0.1587 を引くと 0.6826 になる。例題Aは4桁の表どおり 0.6826（約68%）とし、5桁で引いた 0.68268（4桁なら0.6827）を補足行に残した
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」に置き換えた。「〇〇以上」「〇〇の間」の語は入口の補足行に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例「σ を変えたら」は実験の操作に残した）
  答えの読み方: 例題Aの後の key 部品（ここが一番大事）に「3日に2日」「40〜50日に1日」「ヒストグラムで確かめる」として残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
