# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "29": 単元番号の文字。「29・30でも使います」「29〜32の方法」は、例題Aの後の key 部品と応用「この先で使う」の {{unit:U29}}・{{unit:U30}}・{{unit:U32}} のリンクに置き換えた
phrases:
  "x̄, ȳ": 「x̄・ȳ」として初学「3｜式の構造を読む」の表に残した
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（広告回数と来店者数、気温とアイス、客数と客単価）に置き換えた
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「外れ値1つの影響」を、点を指で動かす実験の題材にした）
  混同注意: 「相関≠因果、r は傾きではない、r＝0 でも曲線の関係」は例題Aの後の warn 部品に残した
  答えの読み方: 「強い正の直線関係だが、広告を増やせば来店が増えるとは言えない」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
