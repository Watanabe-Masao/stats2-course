# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "22": 単元番号の文字。「効果の大きさは区間推定（22）で示す」は例題Aの後の key 部品で {{unit:U22}} のリンクに置き換えた
  "27": 単元番号の文字。「4段階は25〜27・30・32でも同じ」は応用「この先で使う」の U25・U26・U27 へのリンクに置き換えた
phrases:
  "H0: μ＝μ₀": 下付き文字の H₀ で書き、初学「3｜式の構造を読む」の表に「H₀：μ＝μ₀」として残した
  "H0を棄却": H₀ を棄却、として例題A・手順・問題の答えに残した
  "H1: μ≠μ₀": 「H₁：μ≠μ₀」として初学「3｜式の構造を読む」の表に残した
  この流れを使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（施策後の客単価）に置き換えた
  よくある誤解: 「p 値は H₀ が正しい確率ではない」「棄却しない≠差がない」「有意≠大きい」は例題Aの後の warn・key 部品、応用「使えない例と比べる」、問題 Q-U24-023 の誤解に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「n・α を変えて検出力を見る」を実験の題材にした）
  答えの読み方: 「棄却なら〜と言える、棄却しないなら〜とは言えない」は応用の判断の手順5と、復習の言葉にする練習に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
