# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "17": 単元番号の文字。「17・31で母集団・標本・偏りを確認」は、応用「この先で使う」の {{unit:U31}} と、つまずいたら戻る（前提の単元）に置き換えた
  "18": 単元番号の文字。「分散の意味07/18、F分布20、検定24」は、初学1の前提チェックの {{unit:U07}}・{{unit:U20}}・{{unit:U24}} のリンクに置き換えた
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（3つの施策を同時に比べる）、初学2の3つ目の問いに置き換えた
  よくある間違い: 「t 検定を3回くり返さない」「有意でなくても同じとは言えない」は例題Aの後の warn 部品と、応用「使えない例と比べる」、Q-U32-023 の誤解に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）と、応用の「法則を見つける」（F は何で決まるか）に置き換えた（旧版の「s を2倍→F が1/4」を法則を見つけるの3段目にした）
  答えの読み方: 「各2店では偶然の範囲を超えるとは言えない。店舗数を増やすと自由度が増え差を検出しやすい」は例題Aの後の key 部品と Q-U32-011 に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
