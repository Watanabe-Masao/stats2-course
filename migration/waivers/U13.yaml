# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U13.yaml の difficulty から自動で付く。旧版の問1（X＝0,1 の期待値と分散）は、計算の流れを穴埋めにした例題B（Q-U13-001）に移した。問1は旧版の復習の1問（2X＋3）を使った
  問2（中）: 旧版の問2（支払額 200X＋50）は、自力で解く例題C（Q-U13-002）に移した。問2は旧版の問3（和と差の分散）を使った
  問3（やや難）: 問3はくじの期待値と標準偏差（Q-U13-005）を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた。旧版の例文（b を増やすと平均だけ上がり標準偏差は変わらない、a を2倍にすると標準偏差も2倍）は、例題Cのラボ（aX＋b）の一言と本文の式の読みに残した
