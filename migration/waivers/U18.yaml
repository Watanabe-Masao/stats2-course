# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "19": 旧版の「19・20へ進む」は単元への参照。新しい原本では {{unit:U19}}・{{unit:U20}} のメンションで書く（番号を直接書かない）
  "22": 旧版の「信頼区間（22）や検定（24）」は単元への参照。応用の「この先で使う」に {{unit:U22}}・{{unit:U24}} のメンションで書いた
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」に置き換えた。「n個の平均（または比率）が取り直すとどれくらいぶれるか」はゴールと初学2の問いに残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の2つ目のラボ「n−1 で割る s² の平均は σ²」を実験の題材にした）
  混同注意: 「SD は1個ずつのばらつき、SE は平均のぶれ」「36個集めたら商品のばらつきが2gになったではない」は、例題Aの後の key 部品と復習の練習に残した
  答えの読み方: 「精度を2倍にしたければ n は4倍」「比率の SE 0.04 は ±8ポイント程度の目安」は、例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
