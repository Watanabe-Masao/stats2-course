# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（売価と販売数の符号が単回帰と重回帰で逆になる）に置き換えた
  出力表（分散分析表）: 「分散分析表」の語は初学の式の表・例題・復習の図・問題 Q-U30-001 とラボの「分散分析表」モードに残した。括弧の言い換えはしない
  よくある間違い: 「F が有意でも全部の係数が有意とは限らない」「R² ではなく調整済み R² で比べる」は例題の後の warn 部品と問題 Q-U30-023 の誤解の選択肢、応用の「法則を見つける」に残した
  答えの読み方: 「約6割を説明、全体は偶然とは言いにくい、係数ごとは t で確かめる」は復習の図の読み方と Q-U30-001 の答えに残した
  動かしたら書く: 予想してから結果を見るラボ（初学の s1-coef・s1-dummy）と、応用の「法則を見つける」に置き換えた（旧版の「相関を上げると単回帰の傾きがずれる」は s1-coef の符号の逆転と「多重共線性」モードにした）
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
