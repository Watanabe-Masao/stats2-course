# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（50百円・購入率20%にどれくらいの幅をつけるか）に置き換えた
  よくある誤解: 「μ が95%の確率で区間に入るではない」「個々の客の95%がこの範囲ではない」は、例題Aの後の warn 部品に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「σ・n・信頼係数で誤差幅と30本の区間が変わる」を実験の題材にした）
  答えの読み方: 「母平均は48〜52百円程度（95%信頼）、誤差幅を半分にするには4倍の400人」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
