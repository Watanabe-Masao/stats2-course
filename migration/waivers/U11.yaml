# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U11.yaml の difficulty から自動で付く（旧版の問1 雨の日の傘は Q-U11-003 として残した）
  問2（中）: 旧版の問2（赤3青2を戻さず）は、計算の流れを穴埋めにした例題B（Q-U11-001）に移した。問2は旧版の復習の1問（条件なしの2回目）を使った
  問3（やや難）: 旧版の問3（独立の判定）は、自力で解く例題C（Q-U11-002）に移した。問3は「戻す・戻さないのどちらで独立か」を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「雨の日と晴れの日の購入率を同じにすると、P(購入｜雨)＝P(購入) になり独立になった」は説明の例に残した）
