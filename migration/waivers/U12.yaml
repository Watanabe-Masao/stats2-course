# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U12.yaml の difficulty から自動で付く。旧版の問1（工場A・Bの全体の不良率）は、計算の流れを穴埋めにした例題B（Q-U12-001）に移した。問1は旧版の復習の1問（検出されなかった品）を使った
  問2（中）: 旧版の問2（不良品が工場Bである確率）は、自力で解く例題C（Q-U12-002）に移した。問2は旧版の問3（不良率10%）を使った
  問3（やや難）: 問3は旧版の応用の「再検査で確率を更新する」（Q-U12-005）を使った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「誤検出率を5%→1%に下げると、事後確率は約27%から約65%に大きく上がった」は説明の例に残した）
