# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  「分散」と「標準偏差」: 復習の「取り違えやすい言葉」の開閉に、見出しを「分散と標準偏差」として同じ内容（単位が個²と個）を残した
  「標本分散」と「不偏分散」: 同上（「標本分散と不偏分散」）
  「標準偏差」と「変動係数」: 同上（「標準偏差と変動係数」）
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U07.yaml の difficulty から自動で付く（旧版の問1・問2は Q-U07-003・004 として残した）
  問2（中）: 同上
  問3（やや難）: 旧版の問3（商品P・Q の変動係数）は、自力で解く例題C（Q-U07-002）に移した。問3は「範囲が同じでも散らばりは違う」問題を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「散らばり倍率を2倍にすると標準偏差は約2倍、分散は約4倍。同じ数を足しても分散は変わらない」は観察と説明の答えに含めた）
