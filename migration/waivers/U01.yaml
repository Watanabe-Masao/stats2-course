  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「＋20%→−20% にすると 1.2×0.8＝0.96 で、元より4%少なくなった」は説明の例に残した）
