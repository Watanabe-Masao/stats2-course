# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "1.0": 例題Aの t は「1」と書いた（小数で書く必要がない。ラボの予想の答えも1）
  "07": 単元番号の文字。「つまずいたら戻る」は単元リンク（{{unit:U16}}・{{unit:U18}}）と、末尾の「前提の単元」に置き換えた
  "22": 単元番号の文字。「22〜26の手法へ進む」は応用「この先で使う」の単元リンク（U22・U24・U25・U27）に置き換えた
phrases:
  "1.0": 上の数値と同じ
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（σ が分からないので s で代用する場面）に置き換えた
  よくある間違い: 「分母に s をそのまま入れて t＝0.25 としない」「確率点は左側累積」は、例題Aの後の warn 部品に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「自由度を動かすと形と確率点が変わる」を実験の題材にした）
  答えの読み方: 「2百円の差は SE のちょうど1つ分。16店では偶然でも十分起こる。n を増やす」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
