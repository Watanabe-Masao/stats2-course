# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U15.yaml の difficulty から自動で付く。旧版の問1（分布を選ぶ）は、応用の問題（Q-U15-020）に移した。問1は旧版の復習の1問（ちょうど1件）を使った
  問2（中）: 旧版の問2（返品1件以下）は、計算の流れを穴埋めにした例題B（Q-U15-001）に移した。問2は30分間に2件以上（Q-U15-004）を新しく作った
  問3（やや難）: 旧版の問3（ポアソン近似）は、自力で解く例題C（Q-U15-002）に移した。問3は2日間の返品0件（Q-U15-005）を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「時間 t を2倍にすると λ も2倍になり、0件の確率は e⁻² から e⁻⁴ に下がった」は説明の例に残した）
