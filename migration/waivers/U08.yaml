# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "43": 旧版の「約43日に1回」は 1÷0.0228≒43.9 の切り捨てだったので、四捨五入した「約44日に1回」に直した（Q-U08-022・転用の読み取りの例）
phrases:
  「標準化」と「正規化（正規分布にする）」: 復習の「取り違えやすい言葉」の開閉に、見出しを「標準化と正規化（正規分布にする）」として同じ内容を残した
  「外れ値」と「誤り」: 同上（「外れ値と誤り」）
  「z得点」と「指数（基準＝100）」: 同上（「z得点と指数（基準＝100）」）
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U08.yaml の difficulty から自動で付く（旧版の問1は Q-U08-003 として残した）
  問2（中）: 旧版の問2（数学と英語）は、計算の流れを穴埋めにした例題B（Q-U08-001）に移した。問2は「z から値へ」（旧版の復習の1問）にした
  問3（やや難）: 旧版の問3（外れ値の柵）は、自力で解く例題C（Q-U08-002）に移した。問3は「珍しく悪い日」を比べる問題を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「σ を20に広げると同じ70でも z＝1 になり、珍しさが下がった」はラボの課題と観察の答えに含めた）
