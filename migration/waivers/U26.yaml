# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "0.0016": 旧版の「SE＝√0.0016＝0.04」は、例題Aで「SE＝√(0.2×0.8÷100)＝0.04」と途中を省かずに書いた
  "0.0124": 旧版の「p≈0.0124」は、例題Aで数表の Φ(2.5)＝0.9938 から「p＝2×0.0062≒0.012」とした。ラボの s1-p1 の答え（0.0124）に残した
  "22": 単元番号の文字。「区間推定（22・23）」は例題Aの後の warn 部品で {{unit:U22}}・{{unit:U23}} のリンクに置き換えた
  "23": 単元番号の文字。上と同じ
phrases:
  "p̂₁, p̂₂": 「p̂₁・p̂₂」として初学「3｜式の構造を読む」の表に残した
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（購入率・2店の比較・袋詰めのばらつき）に置き換えた
  はい/いいえ: 応用「判断の手順」1の「はい／いいえの割合なら比率」に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の確認問題「各200人なら有意」を実験の題材にした）
  混同注意: 「検定の SE は H₀ の値、区間推定の SE は p̂」は例題Aの後の warn 部品に残した
  答えの読み方: 「差がないではなく、この人数では差があるとは言えない」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
