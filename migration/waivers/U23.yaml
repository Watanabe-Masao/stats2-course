# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "22": 単元番号の文字。「20・22、対応の有無は25へ」は初学1の前提チェックの単元リンク（U20・U22）と、応用「この先で使う」のリンク（U24・U25・U26）に置き換えた
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（袋詰めのばらつき・同じ店の前後の差）に置き換えた
  よくある間違い: 「大きい点で割ると下限」「分母を逆にすると上下が入れ替わる」「s²±◯ では作れない」は、例題Aの後の warn 部品に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「Welch と等分散で自由度がどう変わるか」を実験の題材にした）
  答えの読み方: 「10回ではばらつきの推定はかなり不確か（約2〜13、7倍の幅）、回数を増やす」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
