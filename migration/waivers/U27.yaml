# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（チラシと購入・曜日ごとの来店）に置き換えた
  よくある間違い: 「χ² に割合を入れない」「期待度数5未満では近似が悪い」「チラシが購入の原因とまでは言えない」は、例題Aの後の warn 部品と応用「使えない例と比べる」に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「セルの件数を動かすと E・χ²・p 値が変わる」を、割合を保って件数を変える実験の題材にした）
  答えの読み方: 「チラシの種類と購入には関連がある」「Aの購入率60%、Bは40%。方向は表の比率で確認する」は、例題Aの結論と key 部品・帯グラフに残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
