# 旧版から意図して文字どおりには残さなかった項目と理由
numbers:
  "1.125": 旧版の自力問題「二項平均40・SD4 の P(X≧45)」は、平均40・標準偏差4 になる二項分布 B(n, p) がない（np＝40・np(1−p)＝16 から n＝66.7 で整数にならない）。例題B（Q-U19-001）を B(400, 0.1)（平均40・標準偏差6）に作り直し、44.5 以上・z＝0.75 で同じ連続修正の流れを残した
  "44": 同上（44.5 は Q-U19-001 の答えに残した）
phrases:
  np, √np(1−p): 初学3の記号の表で「np・√(np(1−p))｜二項の平均50・標準偏差5」と書いた
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」に置き換えた。「n が大きく1つずつ足すのが大変なとき」は入口の問いに残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「歪んだ母集団でも n を増やすと正規曲線に重なる」を実験の題材にした）
  混同注意: 「大数の法則＝平均の値、中心極限定理＝分布の形」「n＝30 なら何でも正規という一律ルールはない」は、例題Aの後の key 部品と初学2の問いに残した
  答えの読み方: 「約86%の確率で55人以内、55個だと約14%で足りない」は例題Aの後の key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
