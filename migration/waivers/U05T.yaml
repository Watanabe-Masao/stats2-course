  「指数」と「実数」: 同上（「指数と実数」）
  「トレンド」と「予測」: 同上（「トレンドと予測」）
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U05T.yaml の difficulty から自動で付く
  問2（中）: 同上
  問3（やや難）: 同上
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「実際の推移を再現するのは幾何平均の線だけ」は観察の答えに、「窓を3日→7日にすると曜日の波が消えた」は復習のラボの確かめた結果に含めた）
