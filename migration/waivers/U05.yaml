# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  「度数」「相対度数」「累積度数」: 復習の「取り違えやすい言葉」の開閉に、見出しを「度数・相対度数・累積度数」として同じ内容（9日・0.45・13日）を残した
  「ヒストグラム」と「棒グラフ」: 同上（「ヒストグラムと棒グラフ」として、面積と高さの違いを残した）
  「外れ値」と「異常値」: 同上。旧版の見出しは「異常値」だが中身は「誤った値（入力ミスなど）」だったので、見出しを中身に合わせて「外れ値と誤った値」にした
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U05.yaml の difficulty から自動で付く
  問2（中）: 同上（旧版の問2の9個のデータは例題C Q-U05-002 に移し、問2は8日の来店客数で新しく作った）
  問3（やや難）: 同上
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「外れ値にすると平均は大きく動くが中央値はほとんど動かない」は観察と説明の答えに含めた）
  個々の値も残したい: 初学2の問いを「データが少なく、1つ1つの値も残したい」と言い換えた（幹葉図の例 12, 15, 21 はそのまま）
  真ん中と散らばり・外れ値を手早く比べたい: 初学2の問いを「真ん中と散らばり・飛び抜けた値を、手早く比べたい」と言い換えた（外れ値という言葉は初学3で定義してから使う）
