# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  ここが一番大事: 枠の見出しは components.yaml の key 部品が自動で付ける
  まとめ（3行）: 枠の見出しは components.yaml の summary 部品が自動で付ける
  問1（易）: 問題の番号と難度は problems/U14.yaml の difficulty から自動で付く。旧版の問1（コイン3回で表2回）は、計算の流れを穴埋めにした例題B（Q-U14-001）に移した。問1は旧版の復習の1問（少なくとも1人）を使った
  問2（中）: 旧版の問2（n＝5、p＝0.2）は、自力で解く例題C（Q-U14-002）に移した。問2は旧版の問3（少なくとも2人）を使った
  問3（やや難）: 問3は抜き取り検査の合格の確率（Q-U14-005）を新しく作った
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の例文「n を大きくすると棒グラフの山が右へ動き、左右対称に近づいた」は観察の答えに残した）
