# 旧版から意図して文字どおりには残さなかった項目と理由
phrases:
  この式を使う場面: 単元の冒頭（ゴール）と初学0「入口の問い」（16店の売上指数・同じ店の前後・別々の2店）に置き換えた
  よくある間違い: 「同じ店舗の前後を別々の2群として計算しない」「σ既知の z の基準1.96を t にそのまま使わない」は、例題Aの後の warn 部品と応用「使えない例と比べる」に残した
  動かしたら書く: 「予想→操作→観察→説明→ラボなしで解く」の5段の実験手順（初学5）に置き換えた（旧版の「自由度を下げると基準値が大きくなる」を実験の題材にした）
  答えの読み方: 「16店舗では平均が100と異なるとは言えない」「効果がないと証明されたわけではない、店舗数を増やして再確認」は、例題Aの結論と key 部品に残した
  計算・根拠: 旧版の記入欄（自分の結論／計算・根拠）は、教材に書き込まない方針のため置かない。記録は個人用の学習記録に書く
