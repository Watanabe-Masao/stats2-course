# 旧版（Notion）のうち、新しい構造に取り込むまで残しているもの。ここが削除の管理表。
#   - build が毎回、各項目の状態（まだ参照あり／削除の候補／アーカイブ済み／削除済み）を出す
#   - 削除は下の「削除の判定」の6条件と承認のあと、アーカイブを経て行い、deleted: に日付を書く
#   - deleted の項目の文字列・ID が原本や生成物に残っていると build が止まる（消し忘れ・戻し忘れの検出）
#   - 全部の項目が deleted になったら、最終ゴール6「旧版がすべて削除されている」の完了
#
# 削除の判定（渡辺さん 2026-11-17）：削除してよい＝6条件がすべて「確認済み」＋対象ごとの明示的な削除承認（approved）。
#   build が見るのは「原本・生成物から旧版を参照していない」（② の一部）と require の検査（① の一部）だけ。build が通っても「削除の候補」で、削除してよいではない。
#   checks の6条件（state は 未確認／確認済み／問題あり。確認済みには evidence（何で確かめたか・日付）を書く）：
#     content   ① 内容の移行：旧版の必要な情報が新版にある（件数だけでなく、内容・数式・成立条件も照合）
#     refs      ② 参照の移行：ほかの Notion ページ・DB・教材から旧版を参照していない（リンク先も正常）
#     readback  ③ 公開内容の一致：新版を Notion から読み戻し、生成物と内容・ID・関係を照合した
#     function  ④ 機能の代替：旧版で行っていた検索・閲覧・問題参照などが新版でできる
#     backup    ⑤ 復元できる：削除の前に、復元に要るデータと関係を保存した
#     deps      ⑥ 依存がない：自動化・API・同期・外部リンクなど、旧版の ID に依存する処理がない
#   進め方は二段階：6条件がそろい承認を得たら、まずアーカイブ（archived: 日付。旧版（削除予定）の下へ移す・閲覧だけにする）し、
#   参照や同期に問題がないことを確かめてから削除（deleted: 日付）する。build は、6条件・承認・アーカイブのない deleted を止める
#   （2026-11-17 より前に削除した LEG-confirm-q は、この決まりの前の記録として除く）。
#
# 条件：
#   absent    原本（content/・templates/・publish/notion.yaml）と生成物（out/notion）にあってはならない文字列
#             notion: の ID も自動で absent に入る（notion: は Notion の旧版ページ・DB。type と title は「旧版（削除予定）」ページの子として並べるため）
#   require   名前で決めた検査
#             terms_defined：terms.yaml の全部の用語に definition がある
#             term_pages_unlinked：publish/notion.yaml の terms:（旧版の用語ページへの対応）が空
items:
  - id: LEG-confirm-q
    name: 理解確認・問題集（確認問題・記述式）
    notion:
      - {id: 5d5f0ed128d84534a4a4f3e2ccd73bbe, type: database, title: 理解確認・問題集}
      - {id: 404b7cd539a181d4b9c0df2d5bee856a, type: page, title: Q05-T1}   # 旧教材から外に出した6ページ
      - {id: 404b7cd539a181b18875eb800ab69d60, type: page, title: Q05-T2}
      - {id: 404b7cd539a1814490abe645a8c86d8a, type: page, title: Q05-T3}
      - {id: 404b7cd539a18174b8fae262afc7bf31, type: page, title: Q05-T4}
      - {id: 404b7cd539a181e5bdf6e870c5715b80, type: page, title: Q30}
      - {id: 404b7cd539a18172851de744700b91ec, type: page, title: Q32}
    replaced_by: 原本の問題（content/problems）
    absent: ["REF-Q-"]
    when: 最初のブランチ（cleanup-home）
    deleted: 2026-10-29   # 33単元を公開し直し、取得して照合が通ってから削除（#50）
  - id: LEG-pq-db
    name: 本番形式問題（15問）
    notion: [{id: da3b5947153c4ae59304e308a9b1e9e2, type: database, title: 本番形式問題}]
    replaced_by: 原本の問題に取り込む（本番形式の5択）
    absent: ["REF-PQ-DB"]
    when: W0 の後の小さなブランチ
    checks:   # 2026-11-17（#51）
      content: {state: 確認済み, evidence: "独立な確かめ（2026-11-17）：旧版15行を1つずつ取り込んだ問題（Q-U03-025・U05-025〜029・U05T-024・U06-024〜026・U07-024〜026・U08-024〜025）と照合。数・選択肢・正解は15問とも一致。抜けていた ①-08 の「層化抽出の平均も同じ考え方」は Q-U06-026 の答えに足した。説明の直しは #469 の意図した修正（U06-024・026・U07-025）"}
      refs: {state: 確認済み, evidence: "Notion の被リンク0（list_page_backlinks、2026-11-17）。原本・生成物の参照0（build の absent）。残るのは migration/old の旧版ページの写し（移行の記録で、たどるリンクではない）"}
      readback: {state: 未確認}
      function: {state: 確認済み, evidence: "解く・読む：各単元の応用「本番形式で解く」（正解・誤りの理由・ラボか図つき）。正誤・次回復習の記録：旧版は15行とも未着手・解いた回数0で移す記録がなく、記録は個人用の学習記録で行う（#54）。段階・範囲表No での絞り込み：15問とも ① データの記述で、単元の並びで代わる"}
      backup: {state: 確認済み, evidence: "publish/legacy-backup/LEG-pq-db/（DB の型とビュー・15行の属性・15ページの本文。fetch・query の返り値を機械で切り出し、2026-11-17）。個人の記録は入っていない"}
      deps: {state: 未確認, note: "処理からの参照は0（DB とデータソースの ID を stats2-course・knowledge-net・stats2-labs・GitHub Actions で検索、2026-11-17）。残り：Notion の DB の自動化・ボタンは API から見えないので、渡辺さんが Notion の画面（DB の右上の ⚡）で無いことを確かめる"}
  - id: LEG-confusion
    name: 混同しやすい概念｜図で比べる（比較13組）
    notion: [{id: 406b7cd539a1813095c5c41c64477e81, type: page, title: 混同しやすい概念｜図で比べる}]
    replaced_by: 関係データの「対比」と、そこから生成する比較
    absent: ["REF-CONFUSION"]
    when: 該当する単元の段階が終わったとき（遅くとも W5）
    checks:
      content: {state: 未確認}
      refs: {state: 未確認}
      readback: {state: 未確認}
      function: {state: 未確認}
      backup: {state: 未確認}
      deps: {state: 未確認}
  - id: LEG-term-db
    name: 統計用語辞典（114行）
    notion: [{id: da48813bf8b74e69824967eb3c68399c, type: database, title: 統計用語辞典}]
    replaced_by: 原本の概念データ（terms.yaml を広げたもの）と、ネットワークの画面
    require: [terms_defined, term_pages_unlinked]
    when: W5 の終わり
    checks:
      content: {state: 未確認}
      refs: {state: 未確認}
      readback: {state: 未確認}
      function: {state: 未確認}
      backup: {state: 未確認}
      deps: {state: 未確認}
  - id: LEG-reference
    name: 公式・用語リファレンス
    notion: [{id: 405b7cd539a1818f9198f683d487c86d, type: page, title: 公式・用語リファレンス}]
    replaced_by: 単元の「忘れたら」をネットワークの画面の分類（unit.yaml の recall_group）へ
    absent: ["legacy_reference"]
    when: W5 の終わり
    checks:
      content: {state: 未確認}
      refs: {state: 未確認}
      readback: {state: 未確認}
      function: {state: 未確認}
      backup: {state: 未確認}
      deps: {state: 未確認}
