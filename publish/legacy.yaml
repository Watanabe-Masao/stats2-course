      backup: {state: 確認済み, evidence: "publish/legacy-backup/LEG-pq-db/（DB の型とビュー・15行の属性・15ページの本文。fetch・query の返り値を機械で切り出し、2026-11-17）。個人の記録は入っていない"}
      deps: {state: 確認済み, evidence: "処理からの参照0（DB とデータソースの ID を stats2-course・knowledge-net・stats2-labs・GitHub Actions で検索、2026-11-17）。Notion の DB の自動化なし・接続なし（渡辺さんが Notion の画面で確認、2026-11-18）"}
