# 旧版（Notion）のうち、新しい構造に取り込むまで残しているもの。ここが削除の管理表。
#   - build が毎回、各項目の状態（まだ参照あり／削除の候補／アーカイブ済み／削除済み）を出す
#   - 削除は下の「削除の判定」の6条件と承認のあと、アーカイブを経て行い、deleted: に日付を書く
#   - deleted の項目の文字列・ID が原本や生成物に残っていると build が止まる（消し忘れ・戻し忘れの検出）
#   - 全部の項目が deleted になったら、最終ゴール6「旧版がすべて削除されている」の完了
#
# 削除の判定（渡辺さん 2026-11-17）：削除してよい＝6条件がすべて「確認済み」＋対象ごとの明示的な削除承認（approved）。
#   build が見るのは「原本・生成物から旧版を参照していない」（② の一部）と require の検査（① の一部）だけ。build が通っても「削除の候補」で、削除してよいではない。
#   checks の6条件（state は 未確認／確認済み／問題あり。確認済みには evidence（何で確かめたか・日付）を書く）：
#     content   ① 内容の移行：旧版の必要な情報が新版にある（件数だけでなく、内容・数式・成立条件も照合）
#     refs      ② 参照の移行：ほかの Notion ページ・DB・教材から旧版を参照していない（リンク先も正常）
#     readback  ③ 公開内容の一致：新版を Notion から読み戻し、生成物と内容・ID・関係を照合した
#     function  ④ 機能の代替：旧版で行っていた検索・閲覧・問題参照などが新版でできる
#     backup    ⑤ 復元できる：削除の前に、復元に要るデータと関係を保存した
#     deps      ⑥ 依存がない：自動化・API・同期・外部リンクなど、旧版の ID に依存する処理がない
#   進め方は二段階：6条件がそろい承認を得たら、まずアーカイブ（archived: 日付。旧版（削除予定）の下へ移す・閲覧だけにする）し、
#   参照や同期に問題がないことを確かめてから削除（deleted: 日付）する。build は、6条件・承認・アーカイブのない deleted を止める
#   （2026-11-17 より前に削除した LEG-confirm-q は、この決まりの前の記録として除く）。
#
# 条件：
#   absent    原本（content/・templates/・publish/notion.yaml）と生成物（out/notion）にあってはならない文字列
#             notion: の ID も自動で absent に入る（notion: は Notion の旧版ページ・DB。type と title は「旧版（削除予定）」ページの子として並べるため）
#   require   名前で決めた検査
#             terms_defined：terms.yaml の全部の用語に definition がある
#             term_pages_unlinked：publish/notion.yaml の terms:（旧版の用語ページへの対応）が空
