      readback: {state: 確認済み, evidence: "取り込んだ15問がある6単元（U03・U05・U05T・U06・U07・U08）を Notion から読み戻し、生成物と照合して一致（notion_compare。U03・U05・U05T・U07・U08 は 2026-11-17、U06 は答えを足して入れ直した後の 2026-11-18）"}
