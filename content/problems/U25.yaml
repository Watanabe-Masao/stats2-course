  answer: SE＝5÷√6≒2.041、t≒**2.45**、自由度5。境目は2.571 なので H₀ を**棄却しない**（p≒0.058）。σ が分からず s を使うので、境目は正規の1.96 ではなく t(5) の2.571。n が小さいほど差は大きい。
  checks:
    - 'abs(5/math.sqrt(6) - 2.041) < 0.0005 and abs(5/(5/math.sqrt(6)) - 2.45) < 0.005 and 1.96 < 5/(5/math.sqrt(6)) < 2.571'
    - 'abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(5/(5/math.sqrt(6)),5)) - 0.058) < 0.0005'
  lab:
    id: LAB-ttest
    mode: one
    set: {side: two, alpha: 0.05, xbar: 105, mu0: 100, s: 5, n: 6}
    task: 6店の平均105・s＝5、基準100。両側5%の t の境目は（小数で）？
    predict: {type: number, key: crit, label: "境目 t"}
    expect: 2.5706
    why: 約2.571。t≒2.45 は1.96 は超えるが、この境目には届かない。

- id: Q-U25-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 平均の t 検定について、正しいものはどれか。
  choices:
    - 母標準偏差が分からないときも、両側5%の境目には1.96 を使う。
    - 同じ店の施策前後の売上は、前と後を別々の2群として t 検定する。
    - 2群のばらつきも人数も大きく違うときは、ウェルチの t 検定を使うのがよい。
    - t 検定で H₀ を棄却できなければ、2群の平均は等しいと結論できる。
    - 自由度が大きくなるほど、t 分布の境目は1.96 から離れていく。
  correct: 3
  answer: ウェルチは各群の s² をそのまま使い、自由度も近似で調整する。等分散を仮定すると、ばらつきの大きい群の人数が少ないときに SE を小さく見積もり、差を言いすぎる（応用の問1では等分散で p≒0.044、ウェルチで p≒0.11）。
  misconceptions:
    1: σ が分からず s を使うと t 分布になり、境目は自由度で決まる（自由度15なら2.131）
    2: 同じ店の前後は対応あり。1店ごとの差を取り、差の1標本 t 検定にする
    4: 棄却しないのは「差があるとは言えない」で、等しいことの証明ではない
    5: 自由度が大きくなると t 分布は正規に近づき、境目は1.96 に近づく
  checks:
    - 'abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(6/math.sqrt(37*(1/12+1/8)),18)) - 0.044) < 0.0005 and abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(6/math.sqrt(9/12+81/8),8.0473)) - 0.11) < 0.005'
  lab:
    id: LAB-ttest
    mode: two
    set: {method: pooled, side: two, alpha: 0.05, x1: 68, s1: 3, n1: 12, x2: 62, s2: 9, n2: 8}
    task: 店A（12日・平均68・s＝3）と店B（8日・平均62・s＝9）を、等分散を仮定して検定。H₀ をどうするか（このあとウェルチに切り替えて比べる）。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: 等分散では p≒0.044 で棄却するが、ウェルチでは p≒0.11 で棄却しない。ばらつきの違いを無視すると差を言いすぎる。

