# 単元U25の問題。id は変えない（個人の解答記録がこの id を指す）。
# t 分布の累積は数値積分で照合：(lambda x,k: 0.5+sum(...))(x, 自由度)
- id: Q-U25-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    同じ25店で、新しい陳列の前後の売上の差 D を取ると、平均は2万円、差の標準偏差は5万円だった。「前後で売上が変わった」と言えるかを両側5%で検定せよ。（t(24) の0.975点は2.064）

    H₀：差の平均＝□。SE＝□÷√□＝□、t＝□÷□＝□、自由度□。|t|□2.064 なので H₀ を□。
  answer_title: 答え（埋めてから開く）
  answer: H₀：差の平均＝**0**。SE＝5÷√25＝**1**、t＝2÷1＝**2.0**、自由度**24**。|t|**＜**2.064 なので H₀ を**棄却しない**（p≒0.057）。「前後で売上が変わったとは言えない」。差の95%信頼区間 −0.064〜4.064（{{unit:U23}}）が0を含むことと一致する。
  checks:
    - '5/math.sqrt(25) == 1 and 2/1 == 2 and 25-1 == 24 and 2 < 2.064 and abs(2-2.064 + 0.064) < 1e-9 and abs(2+2.064 - 4.064) < 1e-9'
    - 'abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2,24)) - 0.057) < 0.0005'
  lab:
    id: LAB-ttest
    mode: paired
    set: {side: two, alpha: 0.05, dbar: 2, sd: 5, n: 25}
    task: 同じ25店の前後の差は平均2万円、差の標準偏差5万円。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0569
    why: t＝2、自由度24で p≒0.057。5%をわずかに超えるので棄却しない。差の区間が0を含むのと同じ判断。

- id: Q-U25-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 店A（10日、平均30万円・s₁＝2）と店B（20日、平均25万円・s₂＝8）の1日の売上の平均に差があるかを、ウェルチの t 検定（両側5%）で調べよ。SE＝√(s₁²÷n₁＋s₂²÷n₂)、自由度≒23.3、t の0.975点≒2.067。
  answer: SE＝√(4÷10＋64÷20)＝√3.6≒1.897、t＝5÷1.897≒**2.64**。|t|＞2.067 なので H₀ を**棄却**（p≒0.015）。「2店の平均に差があると言える」。等分散を仮定すると SE≒2.59・t≒1.93・自由度28 で棄却しない（p≒0.064）。ばらつきも日数も違うので、ウェルチを使う。
  checks:
    - 'abs(math.sqrt(4/10+64/20) - 1.897) < 0.0005 and abs(5/math.sqrt(3.6) - 2.64) < 0.005 and abs((0.4+3.2)**2/(0.4**2/9+3.2**2/19) - 23.3) < 0.05 and 5/math.sqrt(3.6) > 2.067'
    - 'abs(math.sqrt((9*4+19*64)/28*(1/10+1/20)) - 2.59) < 0.005 and abs(5/math.sqrt((9*4+19*64)/28*(1/10+1/20)) - 1.93) < 0.005 and abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(5/math.sqrt(3.6),23.279)) - 0.015) < 0.0005'
    - 'abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(5/math.sqrt((9*4+19*64)/28*(1/10+1/20)),28)) - 0.064) < 0.0005 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.067,23.279) - 0.975) < 0.0005'
  lab:
    id: LAB-ttest
    mode: two
    set: {method: welch, side: two, alpha: 0.05, x1: 30, s1: 2, n1: 10, x2: 25, s2: 8, n2: 20}
    task: 店A（10日・平均30・s＝2）と店B（20日・平均25・s＝8）。ウェルチの t 検定（両側5%）で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: t≒2.64、p≒0.015。方法を「等分散を仮定」に変えると t≒1.93・p≒0.064 で棄却しない。

