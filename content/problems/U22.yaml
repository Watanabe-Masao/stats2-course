# 単元U22の問題。id は変えない（個人の解答記録がこの id を指す）。
# t の点は問題文に数表の値として書く。答えにだけ出る点は、密度の数値積分（中点則4000分割）で左側累積を出して照合する
- id: Q-U22-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    1日の来店客数の母標準偏差は12人と分かっている。36日の平均は100人だった。母平均の95%信頼区間を求め、誤差幅を半分にするには日数を何倍にすればよいか答えよ。

    SE＝□÷√□＝□。誤差幅＝1.96×□＝□。区間は □〜□。誤差幅を半分にするには日数を □ 倍。
  answer_title: 答え（埋めてから開く）
  answer: SE＝12÷√36＝**2**。誤差幅＝1.96×2＝**3.92**。区間は **96.08〜103.92**。誤差幅を半分にするには日数を **4倍**（144日）。
  checks:
    - '12/math.sqrt(36) == 2 and abs(1.96*2 - 3.92) < 1e-12 and abs(100-3.92 - 96.08) < 1e-9 and abs(100+3.92 - 103.92) < 1e-9 and 36*4 == 144'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: z, level: 0.95, xbar: 100, s: 12, n: 36, d: 1}
    task: σ＝12、36日の平均100人。母平均の95%信頼区間の下の端は？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: 96.08
    why: SE＝2、誤差幅3.92。100−3.92＝96.08。n を144にすると SE は1、誤差幅は1.96 で半分。

- id: Q-U22-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 新商品の試食をした200人のうち60人が購入した。購入率の95%信頼区間を求めよ。
  answer: p̂＝60÷200＝0.3、SE＝√(0.3×0.7÷200)≒0.0324、誤差幅＝1.96×0.0324≒**0.0635**。区間は **0.2365〜0.3635**（約24%〜36%）。np̂＝60、n(1−p̂)＝140 で十分大きい。
  checks:
    - '60/200 == 0.3 and abs(math.sqrt(0.21/200) - 0.0324) < 0.00005 and abs(1.96*math.sqrt(0.21/200) - 0.0635) < 0.00005 and abs(0.3-1.96*math.sqrt(0.21/200) - 0.2365) < 0.00005 and abs(0.3+1.96*math.sqrt(0.21/200) - 0.3635) < 0.00005 and 200*0.7 == 140'
  lab:
    id: LAB-ci
    mode: prop
    set: {level: 0.95, x: 60, n: 200, d: 0.03}
    task: 200人中60人が購入。購入率の95%信頼区間の誤差幅は（小数で）？
    predict: {type: number, key: margin, label: "誤差幅"}
    expect: 0.0635
    why: 1.96×√(0.21÷200)≒0.0635。区間は約0.237〜0.364。n を800にすると誤差幅は約0.032で半分。

- id: Q-U22-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: σ＝10 が分かっていて、100人の平均が50だった。母平均の99%信頼区間を求め、95%信頼区間（48.04〜51.96）と比べよ。（99%の z の点は2.576）
  answer: SE＝1、誤差幅＝2.576×1＝2.576、区間は **47.424〜52.576**。95%より**広い**。外す確率を5%から1%に減らす代わりに、区間が長くなる。
  checks:
    - 'abs(50-2.576 - 47.424) < 1e-9 and abs(50+2.576 - 52.576) < 1e-9'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: z, level: 0.99, xbar: 50, s: 10, n: 100, d: 1}
    task: σ＝10、n＝100、x̄＝50。99%信頼区間の下の端は？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: 47.424
    why: 誤差幅は2.576で、95%の1.96より長い。90%にすると1.645で短くなる。

- id: Q-U22-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 16店の客単価の平均は52百円、データの標準偏差 s は8百円（σ は分からない）。母平均の95%信頼区間を求めよ。（t(15) の0.975点は2.131）
  answer: SE＝8÷√16＝2、誤差幅＝2.131×2＝**4.262**。区間は **47.738〜56.262**。1.96を使うと 48.08〜55.92 で狭すぎる（σ を知らないのに z を使った誤り）。
  checks:
    - '8/math.sqrt(16) == 2 and abs(2.131*2 - 4.262) < 1e-9 and abs(52-4.262 - 47.738) < 1e-9 and abs(52+4.262 - 56.262) < 1e-9 and abs(52-1.96*2 - 48.08) < 1e-9 and abs(52+1.96*2 - 55.92) < 1e-9'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: t, level: 0.95, xbar: 52, s: 8, n: 16, d: 1}
    task: 16店、x̄＝52、s＝8（σ 不明）。95%信頼区間の誤差幅は（小数で）？
    predict: {type: number, key: margin, label: "誤差幅"}
    expect: 4.2629
    why: t(15) の点約2.131×SE 2＝約4.26。灰色の z で作った区間（±3.92）より長い。

- id: Q-U22-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 客単価の母標準偏差は10百円と分かっている。母平均の95%信頼区間の誤差幅を1百円以下にするには、何人調べればよいか。
  answer: 1.96×10÷√n≦1 より √n≧19.6、n≧19.6²＝384.16、切り上げて **385人**。誤差幅を0.5にするには4倍の約1537人が要る。
  checks:
    - 'abs((1.96*10/1)**2 - 384.16) < 1e-9 and math.ceil((1.96*10/1)**2) == 385 and math.ceil((1.96*10/0.5)**2) == 1537'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: z, level: 0.95, xbar: 50, s: 10, n: 100, d: 1}
    task: σ＝10。95%の誤差幅を1以下にする最小の n は？
    predict: {type: number, key: nFor, label: "必要な n"}
    expect: 385
    why: (1.96×10÷1)²＝384.16 を切り上げて385。目標の誤差幅を0.5にすると1537。

- id: Q-U22-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 500人に聞いたところ100人が「知っている」と答えた。認知率の95%信頼区間を求めよ。
  answer: p̂＝0.2、SE＝√(0.2×0.8÷500)≒0.0179、誤差幅≒**0.0351**。区間は **0.165〜0.235**（約16.5%〜23.5%）。
  checks:
    - 'abs(math.sqrt(0.16/500) - 0.0179) < 0.00005 and abs(1.96*math.sqrt(0.16/500) - 0.0351) < 0.00005 and abs(0.2-1.96*math.sqrt(0.16/500) - 0.165) < 0.0005 and abs(0.2+1.96*math.sqrt(0.16/500) - 0.235) < 0.0005'
  lab:
    id: LAB-ci
    mode: prop
    set: {level: 0.95, x: 100, n: 500, d: 0.03}
    task: 500人中100人。認知率の95%信頼区間の上の端は（小数で）？
    predict: {type: number, key: hi, label: "区間の上の端"}
    expect: 0.2351
    why: 0.2＋1.96×√(0.16÷500)≒0.235。下の端は約0.165。

- id: Q-U22-011
  stage: S2
  format: written
  powers: [P3]
  prompt: 「この95%信頼区間に母平均が入る確率は95%」という説明は正しいか。同じ手順で区間を100回作ったとき、母平均を含む区間はおよそ何本か。
  answer: 母平均は動かない定数なので、できあがった1本の区間について「入る確率95%」とは言えない（含むか含まないかのどちらか）。95%は作り方の性質で、100回作れば**およそ95本**が母平均を含む。
  no_checks: 95本は信頼係数95%をそのまま本数にした値で、計算した数ではない
  lab:
    id: LAB-ci
    mode: cover
    set: {kind: z, level: 0.95, n: 25, sigma: 10}
    task: 同じ作り方で95%信頼区間を1000回作る。μ を含む区間はどれくらいか。
    predict: {type: choice, key: coverLabel, label: "μ を含む区間は", options: [約95%が含む, 95%より少ない]}
    expect: 約95%が含む
    why: 約95%が含み、残りは外れる。外れた区間も、作った時点ではどれが外れかは分からない。

- id: Q-U22-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 9店で調べた客数の増加の平均は23人、s は3人（σ は分からない）。母平均の95%信頼区間を、t（{{unit:U20}}）を使って求めよ。誤って1.96を使った区間と比べよ。（t(8) の0.975点は2.306）
  answer: SE＝3÷√9＝1。t：23±2.306 → **20.694〜25.306**。1.96：23±1.96 → 21.04〜24.96 で狭すぎる。n＝9 では t の点が1.96よりかなり大きい。
  checks:
    - '3/math.sqrt(9) == 1 and abs(23-2.306 - 20.694) < 1e-9 and abs(23+2.306 - 25.306) < 1e-9 and abs(23-1.96 - 21.04) < 1e-9 and abs(23+1.96 - 24.96) < 1e-9'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: t, level: 0.95, xbar: 23, s: 3, n: 9, d: 1}
    task: 9店、x̄＝23、s＝3（σ 不明）。95%信頼区間の下の端は（小数で）？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: 20.694
    why: 23−2.306×1＝20.694。灰色の z で作った区間は1.96しか引かないので狭い。

- id: Q-U22-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 満足率を調査する。95%信頼区間の誤差幅を3ポイント（0.03）以下にしたい。満足率の見当がつかないとき、何人に聞けばよいか。
  answer: p が分からないときは p(1−p) が最大の p＝0.5 で見積もる。n≧1.96²×0.25÷0.03²≒1067.1、切り上げて **1068人**。満足率が0.2くらいと分かっていれば 1.96²×0.16÷0.0009≒682.95 → 683人で済む。
  checks:
    - 'abs(1.96**2*0.25/0.03**2 - 1067.1) < 0.05 and math.ceil(1.96**2*0.25/0.03**2) == 1068 and abs(1.96**2*0.16/0.03**2 - 682.95) < 0.005 and math.ceil(1.96**2*0.16/0.03**2) == 683'
  lab:
    id: LAB-ci
    mode: prop
    set: {level: 0.95, x: 50, n: 100, d: 0.03}
    task: 誤差幅0.03以下。p が分からず p＝0.5 とするときの人数は？
    predict: {type: number, key: nWorst, label: "必要な人数"}
    expect: 1068
    why: 1.96²×0.25÷0.0009≒1067.1 → 1068人。誤差幅を0.02にすると2401人。

- id: Q-U22-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: σ＝10、n＝100 で、95%信頼区間の誤差幅は1.96。99%信頼区間にすると誤差幅は何倍になるか。99%で誤差幅を1.96のままにするには、n をおよそ何倍にすればよいか。（99%の z の点は2.576）
  answer: 誤差幅は 2.576 で、2.576÷1.96≒**1.31倍**。誤差幅を戻すには SE を 1÷1.31 にする必要があり、n は (2.576÷1.96)²≒**1.73倍**（約173人）。
  checks:
    - 'abs(2.576/1.96 - 1.31) < 0.005 and abs((2.576/1.96)**2 - 1.73) < 0.005 and round(100*(2.576/1.96)**2) == 173'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: z, level: 0.99, xbar: 50, s: 10, n: 100, d: 1}
    task: σ＝10、n＝100。99%信頼区間の誤差幅は？
    predict: {type: number, key: margin, label: "誤差幅"}
    expect: 2.576
    why: 2.576×1＝2.576。n を173にすると誤差幅は約1.96 に戻る。

- id: Q-U22-022
  stage: S3
  format: written
  powers: [P3]
  prompt: 5店のデータで、σ が分からないので s を使い、x̄±1.96×s÷√5 で「95%信頼区間」を作った。この作り方で何度も区間を作ると、母平均を含む割合は95%になるか。どう直せばよいか。
  answer: '**95%より少なくなる**（理論上は約88%）。s も標本ごとにぶれるので、1.96では幅が足りない。t(4) の点（2.776）を使えば95%になる。'
  checks:
    - 'abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.96,4)*2-1 - 0.88) < 0.005 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.776,4) - 0.975) < 5e-4'
  lab:
    id: LAB-ci
    mode: cover
    set: {kind: zs, level: 0.95, n: 5, sigma: 10}
    task: n＝5 で「s を使って z」の区間を1000回作る。μ を含む区間はどれくらいか。
    predict: {type: choice, key: coverLabel, label: "μ を含む区間は", options: [約95%が含む, 95%より少ない]}
    expect: 95%より少ない
    why: 含む割合は9割を下回る。作り方を「s を使って t」に変えると約95%に戻る。n を100にすると z でもほぼ95%。

- id: Q-U22-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 母平均の95%信頼区間について、正しいものはどれか。
  choices:
    - 求めた区間に母平均が含まれる確率は95%である。
    - 標本の個々の値の95%が、この区間に含まれる。
    - 同じ方法で区間を何度も作ると、そのうちおよそ95%の区間が母平均を含む。
    - 99%信頼区間にすると、区間は95%より狭くなる。
    - 標本の大きさを4倍にすると、区間の幅はおよそ4分の1になる。
  correct: 3
  answer: 95%は区間の作り方の性質。n を4倍にすると幅は √4＝2 で割った半分になる。
  misconceptions:
    1: 母平均は定数なので、求めた1本の区間について確率95%とは言えない
    2: 母平均についての幅で、個々の値の範囲ではない（個々の値はもっと広く散らばる）
    4: 確率点が1.96から2.576に大きくなるので、区間は広くなる
    5: 幅は 1÷√n に比例するので、4倍で半分
  checks:
    - 'math.sqrt(4) == 2'
  lab:
    id: LAB-ci
    mode: cover
    set: {kind: t, level: 0.95, n: 10, sigma: 10}
    task: n＝10、「s を使って t」で95%信頼区間を1000回作る。μ を含む区間はどれくらいか。
    predict: {type: choice, key: coverLabel, label: "μ を含む区間は", options: [約95%が含む, 95%より少ない]}
    expect: 約95%が含む
    why: t の点を使えば、σ が分からなくても約95%が含む。1本ずつの区間は長さも位置も違う。

- id: Q-U22-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 店頭アンケートで1200人中840人が「満足」と答えた。満足率の95%信頼区間を求め、前年の満足率68%と比べよ。
  answer: p̂＝0.7、SE＝√(0.7×0.3÷1200)≒0.0132、誤差幅≒0.0259、区間は **0.674〜0.726**（約67%〜73%）。前年の68%は区間の**中**なので、上がったとは言い切れない。
  checks:
    - '840/1200 == 0.7 and abs(math.sqrt(0.21/1200) - 0.0132) < 0.00005 and abs(1.96*math.sqrt(0.21/1200) - 0.0259) < 0.00005 and abs(0.7-1.96*math.sqrt(0.21/1200) - 0.674) < 0.0005 and abs(0.7+1.96*math.sqrt(0.21/1200) - 0.726) < 0.0005'
  lab:
    id: LAB-ci
    mode: prop
    set: {level: 0.95, x: 840, n: 1200, d: 0.03}
    task: 1200人中840人が満足。満足率の95%信頼区間の下の端は（小数で）？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: 0.6741
    why: 0.7−0.0259≒0.674。前年の0.68 は区間の中。

- id: Q-U22-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 25日分の客単価の平均は1200円、s は150円（σ は分からない）。母平均の95%信頼区間を求めよ。（t(24) の0.975点は2.064）
  answer: SE＝150÷√25＝30、誤差幅＝2.064×30＝**61.92**、区間は **1138.08〜1261.92円**（約1140〜1260円）。
  checks:
    - '150/math.sqrt(25) == 30 and abs(2.064*30 - 61.92) < 1e-9 and abs(1200-61.92 - 1138.08) < 1e-9 and abs(1200+61.92 - 1261.92) < 1e-9'
  lab:
    id: LAB-ci
    mode: mean
    set: {kind: t, level: 0.95, xbar: 1200, s: 150, n: 25, d: 1}
    task: 25日、x̄＝1200円、s＝150円（σ 不明）。95%信頼区間の誤差幅は（小数で）？
    predict: {type: number, key: margin, label: "誤差幅"}
    expect: 61.917
    why: t(24) の点約2.064×30≒61.9円。z なら 1.96×30＝58.8円で、少し狭すぎる。

- id: Q-U22-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 購入率はおよそ20%と分かっている。95%信頼区間の誤差幅を±2ポイント（0.02）以下にするには、何人の来店客を調べればよいか。p＝0.5 で見積もった場合と比べよ。
  answer: n≧1.96²×0.2×0.8÷0.02²≒1536.6、切り上げて **1537人**。p＝0.5 なら 1.96²×0.25÷0.0004≒2401人。見当がつく分だけ、少ない人数で済む。
  checks:
    - 'abs(1.96**2*0.16/0.02**2 - 1536.6) < 0.05 and math.ceil(1.96**2*0.16/0.02**2) == 1537 and abs(1.96**2*0.25/0.02**2 - 2401) < 1e-6'
  lab:
    id: LAB-ci
    mode: prop
    set: {level: 0.95, x: 20, n: 100, d: 0.02}
    task: p̂＝0.2 を使って、誤差幅0.02以下にする人数は？
    predict: {type: number, key: nFor, label: "必要な人数"}
    expect: 1537
    why: 1.96²×0.16÷0.0004≒1536.6 → 1537人。p＝0.5 とすると2401人。

- id: Q-U22-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 20人中2人が返品した（p̂＝0.1）。p̂±1.96√(p̂(1−p̂)÷n) で95%信頼区間を作るとどうなるか。ウィルソンの区間（中心 (p̂＋z²÷2n)÷(1＋z²÷n)）と比べよ。
  answer: SE＝√(0.09÷20)≒0.067、誤差幅≒0.131 で、区間は **−0.031〜0.231**。下の端が0未満で、比率としておかしい。ウィルソンの区間は約 **0.028〜0.301** で、0〜1 に収まり、中心は約0.164 と0.5側に寄る。np̂＝2 と小さいので、近似の式は使わない方がよい。
