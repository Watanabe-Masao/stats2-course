# 単元U05Tの問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U05T-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    例題Aのいちご（80→100→90パック）で、2週間の平均成長率を求める。

    期間の数＝□、累計倍率＝□、平均倍率＝√□≒□、平均成長率＝約□%
  answer_title: 答え（埋めてから開く）
  answer: 期間の数＝**2**（3時点で2期間）、累計倍率＝**1.125**、平均倍率＝√1.125≒**1.0607**、平均成長率＝約**6.07%**。確かめ：80×1.0607×1.0607≒90。算術平均の7.5%で2回増やすと 80×1.075²＝92.45 になり、90を再現しない。
  checks:
    - 'abs(1.125**0.5 - 1.0607) < 0.0001 and abs(80*1.0607**2 - 90) < 0.01 and abs(80*1.075**2 - 92.45) < 1e-9'
  lab:
    id: LAB-ts
    mode: growth
    set: {m: 2, rates: "25,-10"}
    task: 80→100→90（＋25%、−10%）の2期間の平均成長率は何%か。
    predict: {type: number, key: gmean, label: "平均成長率", unit: "%"}
    expect: 6.066
    why: 幾何平均の線（青の点線）は2期後にちょうど実際の90に届く。算術平均の線（7.5%）は92.45まで行ってしまう。

- id: Q-U05T-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P2]
  prompt: 月別数量 10, 14, 12, 18, 16（1〜5月）の中央3点移動平均を、計算できる月すべてについて求めよ。1月と5月はなぜ計算できないか。
  answer_title: 答え（解いてから開く）
  answer: 2月 (10＋14＋12)÷3＝**12**、3月 (14＋12＋18)÷3≒**14.67**、4月 (12＋18＋16)÷3≒**15.33**。1月は前の月、5月は次の月のデータがないので計算できない。今が4月末なら5月の値はまだ無いので、4月の中央移動平均は確定できない。
  checks:
    - 'Fraction(10+14+12, 3) == 12 and abs((14+12+18)/3 - 14.67) < 0.005 and abs((12+18+16)/3 - 15.33) < 0.005'
  lab:
    id: LAB-ts
    mode: ma
    set: {series: qty, k: 3, type: center}
    task: 月別数量 10, 14, 12, 18, 16 の中央3点移動平均で、4月の値はいくつか。
    predict: {type: number, key: "ma:3", label: "4月の移動平均"}
    expect: 15.33
    why: (12＋18＋16)÷3。「後方」に切り替えると、5月まで計算できる代わりに、値が後ろ（新しい月）にずれる。

- id: Q-U05T-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 200個が250個になり、その後200個に戻った。それぞれの増減率は？
  answer: 200→250：50÷200＝**＋25%**。250→200：−50÷250＝**−20%**。同じ50個の変化でも基準が違うので率は違う。
  checks:
    - 'Fraction(50, 200) == Fraction(25, 100) and Fraction(-50, 250) == Fraction(-20, 100)'
  lab:
    id: LAB-ts
    mode: ratio
    set: {x0: 200, r1: 25, r2: -20}
    task: 200個が25%増え、その後20%減った。全体の増減率は何%か。
    predict: {type: number, key: total, label: "全体の増減率", unit: "%"}
    expect: 0
    why: 1.25×0.8＝1.0 で元の200個に戻る。率の数字（25と20）が違っても、基準が違うので元に戻ることがある。

- id: Q-U05T-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 1期目に＋20%、2期目に−20%だった。累計の増減率と、1期あたりの平均成長率を求めよ（√0.96≒0.980）。
  answer: 累計倍率 1.2×0.8＝0.96 → **−4%**。平均倍率 √0.96≒0.980 → 平均成長率 約**−2.0%**。算術平均の0%ではない。
  checks:
    - 'abs(1.2*0.8 - 0.96) < 1e-12 and abs(0.96**0.5 - 0.980) < 0.001'
  lab:
    id: LAB-ts
    mode: ratio
    set: {x0: 100, r1: 20, r2: -20}
    task: 100が20%増え、その後20%減った。全体の増減率は何%か。
    predict: {type: number, key: total, label: "全体の増減率", unit: "%"}
    expect: -4
    why: 2回目の20%減は、増えた後の120を基準にするので24減る。率を足すと0%だが、実際は96。

- id: Q-U05T-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P2]
  prompt: 月別売上 20, 26, 23, 29, 32 の中央3点移動平均を、計算できる月すべてについて求めよ。
  answer: 2月 (20＋26＋23)÷3＝**23**、3月 (26＋23＋29)÷3＝**26**、4月 (23＋29＋32)÷3＝**28**。上下はあるが、ならすと増加傾向が見える。
  checks:
    - 'Fraction(20+26+23, 3) == 23 and Fraction(26+23+29, 3) == 26 and Fraction(23+29+32, 3) == 28'
  lab:
    id: LAB-ts
    mode: ma
    set: {series: sales, k: 3, type: center}
    task: 月別売上 20, 26, 23, 29, 32 の中央3点移動平均で、4月の値はいくつか。
    predict: {type: number, key: "ma:3", label: "4月の移動平均"}
    expect: 28
    why: 元の値は上がったり下がったりするが、移動平均は23→26→28と一方向に増える。ならすと傾向が見える。

- id: Q-U05T-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 売上が3年で 100→121 になった（3時点で2期間）。平均成長率は？
  answer: 累計倍率 1.21、2期間なので √1.21＝1.1 → **10%**。
  checks:
    - 'abs(1.21**0.5 - 1.1) < 1e-12'
  lab:
    id: LAB-ts
    mode: growth
    set: {m: 2, rates: "0,21"}
    task: 1年目0%、2年目＋21%で100→121になった。平均成長率は何%か。
    predict: {type: number, key: gmean, label: "平均成長率", unit: "%"}
    expect: 10
    why: 途中の伸び方が違っても、最初と最後と期間の数が同じなら平均成長率は同じ（毎年10%なら100→110→121）。算術平均は10.5%で、121を再現しない。

- id: Q-U05T-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P2, P1]
  prompt: 四半期の売上が 80, 92, 100, 110（万円）だった。(a) 最初の80を100とする指数を求めよ。(b) 最後の期の増減率は何%か。指数の差（ポイント）と同じか。
  answer: (a) 100、92÷80×100＝**115**、100÷80×100＝**125**、110÷80×100＝**137.5**。　(b) 110÷100−1＝**＋10%**。指数の差は 137.5−125＝12.5ポイントで、増減率とは違う（指数の差は最初の80を基準にした差、増減率は直前の100を基準にした率）。
  checks:
    - 'Fraction(92*100, 80) == 115 and Fraction(100*100, 80) == 125 and Fraction(110*100, 80) == Fraction(275, 2)'
    - 'Fraction(110, 100) - 1 == Fraction(1, 10) and Fraction(275, 2) - 125 == Fraction(25, 2)'
  figure:
    type: line
    caption: 最初の80を100とした指数。最後の期は 125→137.5 で12.5ポイント増だが、増減率は 110÷100−1＝10%
    title: 売上の指数（最初＝100）
    series:
      - {label: 指数（80＝100）, values: [100, 115, 125, 137.5]}
    labels: [1期, 2期, 3期, 4期]
    note: 指数の差（ポイント）は最初の時点を基準にした差。前期からの増減率とは分母が違う。

- id: Q-U05T-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P2, P3]
  prompt: 来店客から無作為に200人を選んで調べると、会員の割合は去年10%、今年12%だった。(a) 何%増、何ポイント増か。(b) 今年の12%は、母数か統計量か。
  answer: (a) (12−10)÷10＝**20%増**、12−10＝**2ポイント増**（割合どうしの差はポイントで言う。{{unit:U01}}）。　(b) 選んだ200人（標本）から計算したので**統計量**（{{unit:U03}}）。来店客全体の会員の割合（母数）とは限らない。
  checks:
    - 'Fraction(12 - 10, 10) == Fraction(20, 100) and 12 - 10 == 2'
  figure:
    type: bars
    caption: 会員の割合が10%から12%へ。差は2ポイント、去年を基準にした増減率は20%
    title: 会員の割合（200人を調べた結果）
    bars: [[去年, 10], [今年, 12]]
    unit: '%'
    note: 割合どうしの差は「2ポイント増」、去年の割合を基準にすると「20%増」。どちらで言ったかを書く。

- id: Q-U05T-020
  stage: S3
  tag: 寄与度
  format: written
  powers: [P2, P3]
  prompt: A部門 60→66、B部門 40→38（合計 100→104）。全体の増減率と各部門の寄与度は？
  answer: 全体：4÷100＝**＋4%**。A：(66−60)÷100＝**＋6ポイント**、B：(38−40)÷100＝**−2ポイント**。合計＋4で全体と一致する。A部門自体の増減率（6÷60＝10%）とは別物。
  checks:
    - 'Fraction(104-100, 100) == Fraction(4, 100) and Fraction(66-60, 100) == Fraction(6, 100) and Fraction(38-40, 100) == Fraction(-2, 100) and Fraction(6, 60) == Fraction(10, 100)'
  lab:
    id: LAB-ts
    mode: contrib
    set: {a0: 60, a1: 66, b0: 40, b1: 38}
    task: A部門 60→66、B部門 40→38。A部門の寄与度は何ポイントか。
    predict: {type: number, key: cA, label: "Aの寄与度", unit: "ポイント"}
    expect: 6
    why: 寄与度の分母は全体の前期（100）。A部門自体の増減率（分母60で10%）とは違う。A・Bの寄与度を足すと全体の＋4%になる。

- id: Q-U05T-021
  stage: S3
  tag: 比べる相手
  format: written
  powers: [P3]
  prompt: 今年11月の売上は100万円、12月は130万円だった。前年12月は127万円。「12月は前月比30%増で絶好調」と言ってよいか。
  answer: 前月比は 130÷100−1＝**＋30%** だが、12月は毎年売上が増える季節。前年同月比は 130÷127−1≒**＋2.4%** で、季節の波をそろえると伸びは小さい。季節の波がある商品は前年同月比で判断する。
  checks:
    - 'Fraction(130, 100) - 1 == Fraction(3, 10) and abs(130/127 - 1 - 0.024) < 0.001'
  figure:
    type: bars
    caption: 前月（11月）と比べると30%増だが、前年の同じ12月と比べると約2.4%増
    title: 売上（万円）
    bars: [[前年12月, 127], [今年11月, 100], [今年12月, 130]]
    unit: ''
    note: 12月は毎年増える季節。季節の波をそろえるには、前年の同じ月と比べる。

- id: Q-U05T-022
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: いちごの販売数が 80→100→90 パックと変化した。時系列の計算について、正しい記述はどれか。
  choices:
    - 増減率＋25%と−10%を足した＋15%が、2週間全体の増減率である。
    - 3時点のデータの平均成長率は、累計倍率の3乗根から1を引いて求める。
    - 平均成長率は、各期の倍率の幾何平均から1を引いて求める。
    - 中央3点移動平均は、最新の週まで計算できる。
    - 80を100とした指数112.5は、80に112.5を足した値を表す。
  correct: 3
  answer: 成長は倍率が掛け算で重なるので、同じ倍率を期間の数だけ掛けて最後の値を再現する幾何平均を使う。√1.125≒1.0607 で約6.07%。
  misconceptions:
    1: 率は基準が毎回違うので足せない。倍率 1.25×0.9＝1.125 で12.5%増
    2: 3時点なら変化の区間は2つ。累計倍率の2乗根（平方根）をとる
    4: 中央移動平均は次の時点の値が要るので、最新の時点は計算できない（後方移動平均なら計算できる）
    5: 指数112.5は「基準の1.125倍」という意味。80×1.125＝90
  checks:
    - 'abs(1.125**0.5 - 1.0607) < 0.0001 and 80*Fraction(1125, 1000) == 90'
  figure:
    type: line
    caption: 実際の 80→100→90 と、毎週同じ倍率（約6.07%）で80から90へ届く線（幾何平均）
    title: いちごの販売数（パック）
    series:
      - {label: 実際, values: [80, 100, 90]}
    labels: [先々週, 先週, 今週]
    geom: true

- id: Q-U05T-023
  stage: S3
  tag: 繰り返しを探す
  difficulty: 3
  format: written
  powers: [P3]
  prompt: 56日の日販の自己相関を計算したら、ラグ1が0.10、ラグ7が0.75だった。何が言えて、何がまだ言えないか（相関は {{unit:U28}}）。
  answer: 7日ずらすと似た動きになる、つまり**7日間隔の繰り返し（曜日の波）がありそう**と言える。ただし曜日が原因と確定したわけではなく、棒が高いだけで有意とも断定できない。独立を仮定した検定をそのまま当てると、標準誤差やp値が不適切になりうる。
  no_checks: 答えの数は問題文の自己相関の値と、ずらす日数（ラグ）の名前で、計算した数ではない
  lab:
    id: LAB-ts
    mode: acf
    set: {wave: 10, trend: 0}
    task: 曜日の波がある56日の日販。自己相関の棒がいちばん高いのはどのラグか。
    predict: {type: choice, key: peak, label: "いちばん高いのは", options: [ラグ1, ラグ7, ラグ14]}
    expect: ラグ7
    why: 7日ずらすと同じ曜日どうしが重なるので相関が高い。曜日の波を0にすると、ラグ7の山は消える。

- id: Q-U05T-030
  stage: S4
  tag: 投資
  format: written
  powers: [P2, P3]
  prompt: ある投資信託の値動きは、3年間で＋50%、−20%、＋10%だった。年平均のリターン（平均成長率）は何%か。算術平均と比べよ。
  answer: 累計倍率 1.5×0.8×1.1＝1.32、3期間なので 1.32^(1/3)≒1.097 → 年平均 約**9.7%**。算術平均は (50−20＋10)÷3≒13.3% で、実際より大きく見える。率のばらつきが大きいほど差が開く。
  checks:
    - 'abs(1.5*0.8*1.1 - 1.32) < 1e-12 and abs(1.32**(1/3) - 1.097) < 0.001 and abs((50-20+10)/3 - 13.3) < 0.04'
  lab:
    id: LAB-ts
    mode: growth
    set: {m: 3, rates: "50,-20,10"}
    task: 3年間で＋50%、−20%、＋10%。年平均の成長率（幾何平均）は何%か。
    predict: {type: number, key: gmean, label: "年平均", unit: "%"}
    expect: 9.696
    why: 算術平均の13.3%で3年増やすと実際の132より大きくなる。投資の「年率」は幾何平均で言う。

- id: Q-U05T-031
  stage: S4
  tag: 物価指数
  format: written
  powers: [P1, P3]
  prompt: 物価指数（基準年＝100）が125から150になった。何%上がったか。何ポイント上がったか。
  answer: 150÷125−1＝**20%上がった**。指数の差は 150−125＝**25ポイント**。「25%上がった」と言うと誤り（25%は基準年から見た差）。
  checks:
    - 'Fraction(150, 125) - 1 == Fraction(20, 100) and 150 - 125 == 25'
  figure:
    type: line
    caption: 指数が125→150。差は25ポイント、125を基準にした上昇率は20%
    title: 物価指数（基準年＝100）
    series:
      - {label: 物価指数, values: [100, 125, 150]}
    labels: [基準年, 前年, 今年]
    zero: true
    note: ポイントは指数どうしの差、上昇率は前年の指数を分母にした割合。

- id: Q-U05T-032
  stage: S4
  tag: 仕事へ
  difficulty: 3
  format: written
  powers: [P2, P3]
  prompt: 4週間（28日）の日販に後方7日移動平均を使うと、何日分の値が計算できるか。中央7日移動平均と比べて、毎朝の確認に向くのはどちらか。
  answer: 後方7日は過去6日分が要るので、最初の6日は計算できず **22日分**。最新の日まで計算できるので毎朝の確認に向く。中央7日は前後3日ずつ要るので、最新の3日が計算できない。ただし後方は変化に約3日遅れて反応する。
  checks:
    - '28 - (7 - 1) == 22 and 28 - 2*3 == 22 and (7 - 1)//2 == 3'
  lab:
    id: LAB-ts
    mode: ma
    set: {series: day, k: 7, type: trail}
    task: 28日の日販に後方7日移動平均を使うと、何日分の値が計算できるか。
    predict: {type: number, key: count, label: "計算できる日数", unit: "日"}
    expect: 22
    why: 中央に切り替えても22日分だが、計算できない日が「最初の6日」から「最初と最後の3日ずつ」に変わる。毎朝最新日まで見たいなら後方。

- id: Q-U05T-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P2, P1]
  prompt: 系列 10, 14, 12 に、α＝0.5 の指数平滑 Sₜ＝αxₜ＋(1−α)Sₜ₋₁（S₁＝10）を当てはめる。S₂ と S₃ を求めよ。
  answer: S₂＝0.5×14＋0.5×10＝**12**、S₃＝0.5×12＋0.5×12＝**12**。2期目の急な増加（14）は半分だけ取り込まれ、3期目の減少（12）でも平滑値は動かない。
  checks:
    - '0.5*14 + 0.5*10 == 12 and 0.5*12 + 0.5*12 == 12'
  figure:
    type: line
    caption: 元の系列 10, 14, 12 と、α＝0.5 の指数平滑 10, 12, 12
    title: 指数平滑（α＝0.5）
    series:
      - {label: 元の値, values: [10, 14, 12]}
    labels: [1期, 2期, 3期]
    smooth: 0.5
