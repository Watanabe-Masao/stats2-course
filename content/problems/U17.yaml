# 単元U17の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U17-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    店舗台帳の200店から20店を単純無作為抽出する。① 各店が選ばれる確率は？ ② 自分の店と隣の店の2店が、どちらも選ばれる確率は？

    ① n÷N＝20÷200＝□　② 自分の店が選ばれ（20÷200）、残り199店から19店のうちに隣の店が入る（19÷199）：□×□＝□
  answer_title: 答え（埋めてから開く）
  answer: ① **0.1**（どの店も同じ）。② 0.1×19/199＝380÷39800≒**0.0095**（約1%）。2店とも入る確率は、0.1×0.1＝0.01 より少し小さい（戻さずに選ぶので、1店が入ると残りの枠が減る）。
  checks:
    - 'math.isclose(20/200, 0.1) and math.isclose(0.1*19/199, 380/39800) and abs(380/39800 - 0.0095) < 0.00005 and 380/39800 < 0.01'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 200, n: 20, m: 0}
    task: 200店から20店を単純無作為抽出する。特定の2店がどちらも選ばれる確率は（小数で）？
    predict: {type: number, key: pair, label: "2店とも入る確率"}
    expect: 0.0095
    why: 20/200×19/199≒0.0095。1店が入ると残りの枠が19に減るので、0.1×0.1＝0.01 より少し小さい。

- id: Q-U17-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 5店の1日の廃棄数は 3・5・7・9・11 個（平均7個）。この5店から2店を単純無作為抽出して平均（標本平均 x̄）を出す。選び方は何通りあり、x̄ はいくつからいくつまでの値になるか。全部の選び方の x̄ を平均するといくつか。
  answer_title: 答え（解いてから開く）
  answer: 選び方は ₅C₂＝**10通り**。x̄ は最小 (3＋5)÷2＝**4**、最大 (9＋11)÷2＝**10**。10通りの x̄（4・5・6・7・6・7・8・8・9・10）の平均は 70÷10＝**7** で、5店の平均 μ と一致する。どの2店を引くかで x̄ は変わるが、平均すると μ に当たる。
  checks:
    - 'comb(5,2) == 10 and (3+5)/2 == 4 and (9+11)/2 == 10 and 4+5+6+7+6+7+8+8+9+10 == 70 and (3+5+7+9+11)/5 == 7'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "3,5,7,9,11", n: 2, c: 11, tol: 1}
    task: 5店の値 3・5・7・9・11 から2店を選ぶ。選び方は何通りか。
    predict: {type: number, key: count, label: "選び方", unit: "通り"}
    expect: 10
    why: ₅C₂＝10通りで、どれも確率0.1。x̄ は4〜10に散らばるが、10通りの x̄ の平均は μ＝7 に一致する。

- id: Q-U17-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 会員名簿の1200人から60人を単純無作為抽出してアンケートを送る。各会員が選ばれる確率（抽出率）は？
  answer: 60÷1200＝**0.05**（5%）。名簿のどの会員も同じ確率で選ばれる。
  checks:
    - 'math.isclose(60/1200, 0.05)'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 1200, n: 60, m: 0}
    task: 名簿1200人から60人を単純無作為抽出する。各会員が選ばれる確率は（小数で）？
    predict: {type: number, key: pi, label: "選ばれる確率"}
    expect: 0.05
    why: n÷N＝60÷1200＝0.05。名簿の人数や選ぶ人数を変えても、名簿の中では全員が同じ確率になる。

- id: Q-U17-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 4人の点数は 2・4・6・8 点（平均5点）。2人を単純無作為抽出して平均を出すとき、標本平均 x̄ が6点以上になる確率は？
  answer: 選び方は ₄C₂＝6通りで、x̄ は 3・4・5・5・6・7。6点以上は2通りなので **1/3**（約0.333）。6通りの x̄ の平均は 30÷6＝5 で μ と一致する。
  checks:
    - 'comb(4,2) == 6 and 3+4+5+5+6+7 == 30 and math.isclose(2/6, 1/3) and abs(1/3 - 0.333) < 0.0005'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "2,4,6,8", n: 2, c: 6, tol: 1}
    task: 4人の点数 2・4・6・8 から2人を選ぶ。x̄ が6以上になる確率は（小数で）？
    predict: {type: number, key: pge, label: "P(x̄≧6)"}
    expect: 0.3333
    why: 6通りのうち (4,8) と (6,8) の2通り。どの標本も同じ確率 1/6 なので 2÷6。n を3にすると x̄ は μ＝5 の近くに集まる。

- id: Q-U17-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 30店の名簿から5店を選ぶ。1店選ぶたびに名簿に戻して（復元抽出）選ぶと、同じ店が2回以上選ばれる確率は？ 調査では戻さずに選ぶ（非復元抽出）のが普通なのはなぜか。
  answer: 重複しない確率は (30×29×28×27×26)÷30⁵≒0.704。重複が起きる確率は 1−0.704≒**0.296**（約30%）。戻して選ぶと、同じ店を2回調べて実際には4店分の情報しか得られないことが3回に1回ほど起きる。戻さずに選べば重複はなく、5店分の情報が必ず得られる。
  checks:
    - 'abs(30*29*28*27*26/30**5 - 0.704) < 0.0005 and abs(1-30*29*28*27*26/30**5 - 0.296) < 0.0005'
  lab:
    id: LAB-srs
    mode: repl
    set: {N: 30, n: 5}
    task: 30店の名簿から5店を、戻して選ぶ。同じ店が2回以上選ばれる確率は（小数で）？
    predict: {type: number, key: pDup, label: "重複の確率"}
    expect: 0.2963
    why: 1−(30×29×28×27×26)÷30⁵≒0.296。N を300にすると約0.03に下がる。名簿が大きければ、戻す・戻さないの差は小さい。

- id: Q-U17-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 取引先台帳の500社から25社を単純無作為抽出して聞き取りをする。台帳には、今月から取引を始めた20社がまだ載っていない。① 台帳の各社が選ばれる確率は？ ② 新しい20社が選ばれる確率は？ ③ 結果を「全取引先520社」の結論にしてよいか。
  answer: ① 25÷500＝**0.05**。② 台帳に無いので **0**。③ 結論を言えるのは台帳の500社まで。新しい20社は性質が違うかもしれないので、別に調べるか、台帳を直してから選ぶ。
  checks:
    - 'math.isclose(25/500, 0.05) and 500+20 == 520'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 500, n: 25, m: 20}
    task: 台帳500社から25社を単純無作為抽出する。台帳に載る各社が選ばれる確率は（小数で）？
    predict: {type: number, key: pi, label: "選ばれる確率"}
    expect: 0.05
    why: 25÷500＝0.05。名簿の外の20社は0のまま。n を増やしても、台帳の漏れは埋まらない。

- id: Q-U17-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 3人の点数は 4・6・11 点。2人を単純無作為抽出したときの標本平均 x̄ を、すべての選び方について求めよ。x̄ の平均は母集団の平均と一致するか。
  answer: 選び方は3通りで、x̄ は (4＋6)÷2＝5、(4＋11)÷2＝7.5、(6＋11)÷2＝8.5。x̄ の平均は 21÷3＝**7**、母集団の平均も (4＋6＋11)÷3＝**7** で一致する。どの x̄ も μ とは違うが、選び方全体で平均すると μ になる。
  checks:
    - '(4+6)/2 == 5 and (4+11)/2 == 7.5 and (6+11)/2 == 8.5 and (5+7.5+8.5)/3 == 7 and (4+6+11)/3 == 7'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "4,6,11", n: 2, c: 8, tol: 1}
    task: 3人の点数 4・6・11 から2人を選ぶ。3通りの x̄ を平均するといくつか。
    predict: {type: number, key: meanmean, label: "x̄ の平均"}
    expect: 7
    why: x̄ は 5・7.5・8.5 で、平均は7。母集団の平均 μ＝7 と一致する（標本平均は μ の不偏推定量）。どの1つの x̄ も μ とは限らない。

- id: Q-U17-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 10店のうち3店が赤字。4店を単純無作為抽出したとき、赤字店がちょうど1店入る確率は？（戻さずに選ぶので超幾何分布、{{unit:U15}}）
  answer: ₃C₁×₇C₃÷₁₀C₄＝3×35÷210＝**0.5**。単純無作為抽出は「4店の組み合わせ210通りが同じ確率」なので、場合の数で数えられる。
  checks:
    - 'comb(3,1)*comb(7,3) == 105 and comb(10,4) == 210 and math.isclose(105/210, 0.5)'
  lab:
    id: LAB-pois
    mode: hyper
    set: {N: 10, K: 3, n: 4, k: 1}
    task: 10店のうち赤字3店。4店を戻さず選ぶとき、赤字店がちょうど1店入る確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝1)"}
    expect: 0.5
    why: 3×35÷210＝0.5。単純無作為抽出の確率は、どの組み合わせも同じ確率であることから場合の数で出せる。

- id: Q-U17-020
  stage: S3
  format: written
  powers: [P3]
  prompt: 400人の会員から20人に話を聞く。次のうち単純無作為抽出はどれか。(a) 名簿に1〜400の番号を振り、乱数で20個の番号を選ぶ (b) 店頭で声をかけやすそうな客20人 (c) 開店から先着20人 (d) 応募してきた人から20人。単純無作為抽出のとき、各会員が選ばれる確率は？
  answer: 単純無作為抽出は **(a)** だけ。(b) は担当者の好み、(c) は来る時間、(d) は回答したい気持ちで選ばれやすさが変わる。(a) の各会員の確率は 20÷400＝**0.05**。
  checks:
    - 'math.isclose(20/400, 0.05)'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 400, n: 20, m: 0}
    task: 400人の名簿から乱数で20人を選ぶ。各会員が選ばれる確率は（小数で）？
    predict: {type: number, key: pi, label: "選ばれる確率"}
    expect: 0.05
    why: 20÷400＝0.05 で全員同じ。担当者が「偏らないよう気をつけて」選んでも、全員の確率が決まっていなければ無作為とは言えない。

- id: Q-U17-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 知りたいのは地域の全120店。手元の加盟店名簿には100店しか載っていない。名簿から10店を無作為に選んで調べた結果を、全120店について言えるか。名簿が母集団を覆う割合は？
  answer: 覆う割合は 100÷120≒**0.833**（約83%）。名簿の外の20店は選ばれようがないので、結果は「名簿の100店」についての結論。外の20店が名簿の店と似ている根拠がなければ、全120店には広げられない。
  checks:
    - 'abs(100/120 - 0.833) < 0.0005 and 120-100 == 20'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 100, n: 10, m: 20}
    task: 全120店のうち名簿に載るのは100店。名簿が全体を覆う割合は（小数で）？
    predict: {type: number, key: cover, label: "覆う割合"}
    expect: 0.8333
    why: 100÷120≒0.83。n を増やしても覆う割合は変わらない。名簿の漏れは、選び方ではなく名簿を直すことで減らす。

- id: Q-U17-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 50店から5店を単純無作為抽出する。系列のA店・B店について、① 2店とも選ばれる確率 ② 少なくとも一方が選ばれる確率 を求めよ。
  answer: ① 5/50×4/49＝20÷2450≒**0.0082**。② どちらも選ばれない確率は ₄₈C₅÷₅₀C₅＝(45×44)÷(50×49)＝1980÷2450≒0.808。少なくとも一方は 1−0.808≒**0.192**。それぞれ0.1ずつなので「足して0.2」に近いが、両方入る分だけ少ない。
  checks:
    - 'abs(5/50*4/49 - 0.0082) < 0.00005 and math.isclose(comb(48,5)/comb(50,5), 1980/2450) and abs(1980/2450 - 0.808) < 0.0005 and abs(1-1980/2450 - 0.192) < 0.0005'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 50, n: 5, m: 0}
    task: 50店から5店を単純無作為抽出する。特定の2店のうち少なくとも一方が選ばれる確率は（小数で）？
    predict: {type: number, key: either, label: "少なくとも一方"}
    expect: 0.1918
    why: 1−(45×44)÷(50×49)≒0.192。0.1＋0.1 から「両方入る」約0.008を引いた値と同じ（加法定理）。

- id: Q-U17-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 標本調査と単純無作為抽出について、正しいものはどれか。
  choices:
    - 標本の大きさを大きくすれば、抽出枠（名簿）の漏れによる偏りもなくなる。
    - 単純無作為抽出では、抽出枠から大きさ n の標本を選ぶどの組み合わせも、同じ確率で選ばれる。
    - 担当者が偏らないように気をつけて選べば、無作為抽出といえる。
    - 全数調査であれば、測定や記録の誤りも含めて誤差はない。
    - 抽出率 n/N が小さいと、名簿の各単位が選ばれる確率は単位ごとに異なる。
  correct: 2
  answer: 単純無作為抽出は「大きさ n のどの組み合わせも等しい確率」で選ぶ方法。その結果、名簿の各単位の選ばれる確率もすべて n/N になる。
  misconceptions:
    1: n を増やして小さくなるのはぶれだけ。名簿の外の単位は何人選んでも入らない
    3: 気をつけても、人が選ぶと好みや手間が入る。乱数などで確率を決める
    4: 全数調査でも、測り間違い・記入漏れ・未回答などの誤差は残る
    5: 単純無作為抽出なら、抽出率に関係なく各単位の確率は等しく n/N
  checks:
    - 'comb(5,2) == 10 and math.isclose(1/comb(5,2), 0.1)'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "3,5,7,9,11", n: 2, c: 11, tol: 1}
    task: 5店から2店を単純無作為抽出する。10通りの組み合わせのうち、ある1つの組み合わせが選ばれる確率は（小数で）？
    predict: {type: number, key: pEach, label: "1つの組み合わせの確率"}
    expect: 0.1
    why: 10通りがどれも同じ確率 1/10。だから各店の選ばれる確率も、その店を含む4通り分の 4/10＝2/5＝n/N になる。

- id: Q-U17-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 本部が40店から4店を単純無作為抽出して覆面調査を行う。自分の担当する2店のうち、少なくとも1店が調査される確率は？
  answer: 2店とも外れる確率は ₃₈C₄÷₄₀C₄＝(36×35)÷(40×39)＝1260÷1560≒0.808。少なくとも1店は 1−0.808≒**0.192**（約19%）。1店あたりは 4÷40＝0.1。
  checks:
    - 'math.isclose(comb(38,4)/comb(40,4), 1260/1560) and abs(1-1260/1560 - 0.192) < 0.0005 and math.isclose(4/40, 0.1)'
  lab:
    id: LAB-srs
    mode: incl
    set: {N: 40, n: 4, m: 0}
    task: 40店から4店を単純無作為抽出する。特定の2店のうち少なくとも1店が選ばれる確率は（小数で）？
    predict: {type: number, key: either, label: "少なくとも1店"}
    expect: 0.1923
    why: 1−(36×35)÷(40×39)≒0.192。担当が3店・4店と増えると確率も上がるが、どの店も1店あたりは0.1のまま。

- id: Q-U17-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1日500枚のレシートから20枚を抜き出して点検する。1枚抜くたびに元に戻して（復元抽出で）選ぶと、同じレシートを2回以上引く確率は？
  answer: 1−(500×499×…×481)÷500²⁰≒**0.32**（約32%）。500枚もあっても、20枚引けば3回に1回ほど重複が起きる。点検では戻さずに選ぶ。
  checks:
    - 'abs(1-math.prod(1-i/500 for i in range(20)) - 0.32) < 0.005'
  lab:
    id: LAB-srs
    mode: repl
    set: {N: 500, n: 20}
    task: 500枚から20枚を戻して選ぶ。同じレシートが2回以上出る確率は（小数で）？
    predict: {type: number, key: pDup, label: "重複の確率"}
    expect: 0.3196
    why: 1−(500×499×…×481)÷500²⁰≒0.32。「500枚もあれば重複しない」と思いがちだが、組（ペア）の数が多いので重複は起きやすい（誕生日の問題と同じ形）。

- id: Q-U17-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 6店の棚卸の差異は 1・2・2・3・4・6 個（平均3個）。3店だけを単純無作為抽出して平均を出す。標本平均 x̄ が4個以上になって「差異が多い」と判断してしまう確率は？
  answer: 選び方は ₆C₃＝20通り。x̄≧4 になるのは (2,4,6)・(2,4,6)・(3,4,6) の3通りで **3/20＝0.15**。全店の平均は3個でも、どの3店を引くかで15%の確率で「4個以上」と出る。
  checks:
    - 'comb(6,3) == 20 and (2+4+6)/3 == 4 and (3+4+6)/3 > 4 and math.isclose(3/20, 0.15) and (1+2+2+3+4+6)/6 == 3'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "1,2,2,3,4,6", n: 3, c: 4, tol: 1}
    task: 6店の値 1・2・2・3・4・6 から3店を選ぶ。x̄ が4以上になる確率は（小数で）？
    predict: {type: number, key: pge, label: "P(x̄≧4)"}
    expect: 0.15
    why: 20通りのうち3通り。同じ値（2が2店）も別の店として数える。標本から言えることには、選び方による偶然のぶれが必ず入る。

- id: Q-U17-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 5店の値 3・5・7・9・11（母集団の標準偏差 σ＝√8）から2店を単純無作為抽出する。10通りの x̄ の標準偏差を求め、σ÷√n×√((N−n)/(N−1)) と比べよ。
  answer: x̄ は 4・5・6・7・6・7・8・8・9・10 で、平均7からのずれの2乗の平均は 30÷10＝3、標準偏差は **√3≒1.73**。式は √8÷√2×√(3/4)＝2×0.866≒**1.73** で一致する。√((N−n)/(N−1)) が有限母集団修正。
  checks:
    - '9+4+1+0+1+0+1+1+4+9 == 30 and abs(math.sqrt(3) - 1.73) < 0.005 and math.isclose(math.sqrt(8)/math.sqrt(2)*math.sqrt(3/4), math.sqrt(3)) and abs(math.sqrt(3/4) - 0.866) < 0.0005'
  lab:
    id: LAB-srs
    mode: enum
    set: {vals: "3,5,7,9,11", n: 2, c: 11, tol: 1}
    task: 5店の値 3・5・7・9・11 から2店を選ぶ。10通りの x̄ の標準偏差は（小数で）？
    predict: {type: number, key: sdmean, label: "x̄ の標準偏差"}
    expect: 1.7321
    why: √3≒1.73。σ÷√n だけなら2になるが、戻さずに選ぶので √((N−n)/(N−1))＝0.866 倍に小さくなる。n＝N（全数）では0。
