# 単元U05の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U05-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1]
  prompt: |-
    例題Aの表で、「30〜40」の行を自分で埋める（20日の売上、10万円ごとの階級）。

    度数＝□日、相対度数＝□、累積相対度数＝□
  answer_title: 答え（埋めてから開く）
  answer: 度数＝**5日**（30, 31, 33, 35, 38）、相対度数＝5÷20＝**0.25**、累積相対度数＝0.65＋0.25＝**0.90**（40万円未満の日が9割）。
  checks:
    - 'sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if 30 <= x < 40) == 5'
    - 'Fraction(5, 20) == Fraction(25, 100) and Fraction(65, 100) + Fraction(25, 100) == Fraction(90, 100)'
  figure:
    type: hist
    caption: 20日の売上を10万円ごとに数えたヒストグラム。30〜40の棒（色付き）は5日。下に累積相対度数
    data: [12, 15, 18, 19, 21, 22, 22, 24, 25, 26, 27, 28, 29, 30, 31, 33, 35, 38, 42, 55]
    start: 10
    width: 10
    mark: 2
    cumulative: true
    axis_label: 売上（万円）

- id: Q-U05-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P2]
  prompt: 9個のデータ 3, 5, 6, 7, 8, 9, 10, 12, 30 の中央値・Q₁・Q₃・IQRを求め、外れ値候補を答えよ（Q₁・Q₃は中央値を除いた下半分・上半分の中央値とする）。
  answer_title: 答え（解いてから開く）
  answer: 中央値＝**8**（5番目）。Q₁＝(5＋6)÷2＝**5.5**、Q₃＝(10＋12)÷2＝**11**、IQR＝**5.5**。上の柵は 11＋1.5×5.5＝19.25 なので**30が外れ値候補**。
  checks:
    - 'statistics.median([3,5,6,7,8,9,10,12,30]) == 8 and statistics.median([3,5,6,7]) == 5.5 and statistics.median([9,10,12,30]) == 11'
    - '11 - 5.5 == 5.5 and 11 + 1.5*5.5 == 19.25'
  lab:
    id: LAB-dist
    mode: box
    set: {data: nine}
    task: 9個のデータ（3〜30）の上の柵はいくつか。
    predict: {type: number, key: hi, label: "上の柵（Q₃＋1.5×IQR）"}
    expect: 19.25
    why: 柵は真ん中の半分（Q₁〜Q₃）だけで決まる。30は柵の外なので外れ値候補。最大値を動かしても柵は動かない。

- id: Q-U05-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 例題Aの表で、売上が30万円未満の日の割合はいくらか。
  answer: '**0.65（65%）**。「20〜30」の行の累積相対度数を読む。'
  checks:
    - 'Fraction(4+9, 20) == Fraction(65, 100)'
  lab:
    id: LAB-dist
    mode: hist
    set: {data: sales, w: 10}
    task: 20日の売上で、30万円未満の日の割合（累積相対度数）はいくらか。
    predict: {type: number, key: "below:30", label: "30万円未満の割合"}
    expect: 0.65
    why: 10〜20 の4日と 20〜30 の9日で13日。13÷20＝0.65。表の累積の列はこの「足していった割合」。

- id: Q-U05-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 8日の来店客数（人）は 47, 49, 51, 52, 55, 58, 60, 120 だった。中央値・Q₁・Q₃・IQR を求め、外れ値候補があれば答えよ（Q₁・Q₃は下半分・上半分の中央値とする）。
  answer: 中央値＝(52＋55)÷2＝**53.5**。Q₁＝(49＋51)÷2＝**50**、Q₃＝(58＋60)÷2＝**59**、IQR＝**9**。上の柵は 59＋1.5×9＝72.5 なので**120人の日が外れ値候補**。下の柵は 50−13.5＝36.5 で、下に外れた日はない。
  checks:
    - 'statistics.median([47,49,51,52,55,58,60,120]) == 53.5 and statistics.median([47,49,51,52]) == 50 and statistics.median([55,58,60,120]) == 59'
    - '59 - 50 == 9 and 59 + 1.5*9 == 72.5 and 50 - 1.5*9 == 36.5'
  lab:
    id: LAB-dist
    mode: box
    set: {data: visits}
    task: 8日の来店客数で、上の柵（Q₃＋1.5×IQR）はいくつか。
    predict: {type: number, key: hi, label: "上の柵"}
    expect: 72.5
    why: 120人は柵の外。平均（61.5人）は120人に引っ張られて中央値（53.5人）よりかなり大きい。

- id: Q-U05-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 「0〜5」に10個、「5〜15」に10個のデータがある。ヒストグラムで2つの棒の高さは同じにしてよいか。また、箱ひげ図で中央値が同じ2つの店は、同じ分布と言えるか。
  answer: |-
    **同じにしてはいけない**。階級の幅が違うので、高さは度数密度（度数÷幅）にする：10÷5＝2 と 10÷10＝1。こうすると面積（高さ×幅）がどちらも10で、度数を正しく表す。

    **同じ分布とは言えない**。中央値が同じでも、散らばり・裾の向き・山の数は違うことがある。
  checks:
    - 'Fraction(10, 5) == 2 and Fraction(10, 10) == 1 and 2*5 == 10 and 1*10 == 10'
  figure:
    type: hist
    caption: 幅の違う階級では、高さを度数密度（度数÷幅）にする。面積がどちらも10になり、度数を正しく表す
    classes: [[0, 5, 10], [5, 15, 10]]
    density: true
    note: 高さを度数（どちらも10）にすると、幅の広い「5〜15」の面積が2倍に見えてしまう。

- id: Q-U05-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1]
  prompt: 階級「0以上10未満」が度数4、「10以上30未満」が度数6のヒストグラムを描く。それぞれの棒の高さ（度数密度）はいくらか。
  answer: 4÷10＝**0.4**、6÷20＝**0.3**。幅の広い階級を高さ6にすると、面積が実際より大きく見えてしまう。
  checks:
    - 'Fraction(4, 10) == Fraction(4, 10) and Fraction(6, 20) == Fraction(3, 10)'
  lab:
    id: LAB-dist
    mode: dens
    set: {classes: "0-10:4,10-30:6"}
    task: 「10以上30未満」（度数6）の棒の高さ（度数密度）はいくつか。
    predict: {type: number, key: "dens:1", label: "10〜30 の高さ"}
    expect: 0.3
    why: 度数密度＝度数÷幅＝6÷20。「高さ＝度数」に切り替えると、幅20の棒の面積が度数の20倍になってしまう。

- id: Q-U05-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P2, P1]
  prompt: 40人のテストの点の度数分布は、0〜20点：4人、20〜40点：10人、40〜60点：14人、60〜80点：8人、80〜100点：4人だった。(a) 40〜60点の相対度数 (b) 60点未満の人の割合 を求めよ。
  answer: (a) 14÷40＝**0.35**。　(b) (4＋10＋14)÷40＝28÷40＝**0.7（70%）**。
  checks:
    - '4+10+14+8+4 == 40 and Fraction(14, 40) == Fraction(35, 100) and Fraction(4+10+14, 40) == Fraction(7, 10)'
  figure:
    type: hist
    caption: 40人の点数のヒストグラム。40〜60点（色付き）が14人。60点未満の累積相対度数は0.70
    classes: [[0, 20, 4], [20, 40, 10], [40, 60, 14], [60, 80, 8], [80, 100, 4]]
    mark: 2
    cumulative: true
    axis_label: 点

- id: Q-U05-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P2, P3]
  prompt: 学年300人のうち無作為に選んだ40人のテストの点の度数分布は、0〜20点：4人、20〜40点：10人、40〜60点：14人、60〜80点：8人、80〜100点：4人だった。(a) 中央値はどの階級に入るか。(b) テストの点は何尺度として扱うことが多いか。(c) 40人の平均点は、母数か統計量か。
  answer: (a) 小さい順に20番目と21番目の平均。累積度数は 4 → 14 → 28 なので、20番目も21番目も**40〜60点**の階級に入る。　(b) **間隔尺度**として扱うことが多い（0点が「学力が無い」ではない。{{unit:U04}}）。　(c) 40人（標本）から計算したので**統計量**（{{unit:U03}}）。
  checks:
    - '4+10 == 14 and 14+14 == 28 and 14 < 20 <= 28 and 14 < 21 <= 28'
  figure:
    type: hist
    caption: 40人の点数。累積度数は4→14→28なので、20番目と21番目は40〜60点の階級（色付き）に入る
    classes: [[0, 20, 4], [20, 40, 10], [40, 60, 14], [60, 80, 8], [80, 100, 4]]
    mark: 2
    axis_label: 点
    note: 中央値の位置（20番目と21番目）は、累積度数が20を超える最初の階級で探す。

- id: Q-U05-020
  stage: S3
  tag: 店舗の比較
  format: written
  powers: [P3]
  prompt: 5店舗の日販を箱ひげ図で並べた。C店だけ箱が長く、上のひげも長い。C店について何が言えるか。
  answer: C店は日販の散らばりが大きく、特に売上の多い日の側に裾が伸びている。日によって売上が大きく変わる（天候・イベントの影響が大きい）可能性がある。発注量を決めるときは、平均だけでなく散らばりも考える必要がある。
  lab:
    id: LAB-dist
    mode: cmp
    task: C店のひげが長く伸びているのは、上（売上の多い側）と下（売上の少ない側）のどちらか。
    predict: {type: choice, key: tail, label: "ひげが長いのは", options: [上（売上の多い側）, 下（売上の少ない側）]}
    expect: 上（売上の多い側）
    why: C店はQ₃からひげの端までが、Q₁からひげの端までより長い。売上の多い日が他店より大きく伸びる。中央値は5店ともほぼ同じなので、中央値だけ比べると見落とす。

- id: Q-U05-021
  stage: S3
  tag: 図の限界
  format: written
  powers: [P3]
  prompt: X店とY店の売上の箱ひげ図は、最小・Q₁・中央値・Q₃・最大がすべて同じだった。「2店の売上の分布は同じ」と言ってよいか。
  no_checks: 答えの「5つの数」は箱ひげ図に描く数の個数で、計算した数ではない
  answer: '**言えない**。箱ひげ図は5つの数しか描かないので、山の数（単峰か二峰か）や、値がどこに固まっているかは分からない。ヒストグラムやドット図（1つ1つの値）で形を確かめる。'
  lab:
    id: LAB-dist
    mode: shape
    set: {dots: false}
    task: 5つの数がまったく同じX店とY店。2店の売上は「同じ分布」と言えるか。
    predict: {type: choice, key: sameDist, label: "同じ分布と", options: [言える, 言えない]}
    expect: 言えない
    why: 「中身を見る」で1つ1つの値を出すと、Y店は真ん中に1日もなく2つのかたまりに分かれている。箱ひげ図からは山の数が分からない。

- id: Q-U05-022
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 20日の売上（12, 15, 18, 19, 21, 22, 22, 24, 25, 26, 27, 28, 29, 30, 31, 33, 35, 38, 42, 55 万円）を、10万円ごとの階級のヒストグラムと箱ひげ図で表した。正しい記述はどれか。
  choices:
    - ヒストグラムの棒の高さは、階級の幅が違っても度数のままでよい。
    - 箱ひげ図から、売上の山が1つか2つかが分かる。
    - 55万円はQ₃＋1.5×IQRを超えるので、入力の誤りとして削除する。
    - 右に裾が長いので、平均は中央値より大きくなっている。
    - 四分位範囲は、最大値と最小値の差である。
  correct: 4
  answer: 大きい値の側に少数が伸びる分布では、平均が大きい値に引っ張られる。平均 552÷20＝27.6 は中央値 26.5 より大きい。
  misconceptions:
    1: 幅が違うときは度数密度（度数÷幅）にして、面積で度数を表す
    2: 箱ひげ図は5つの数しか描かないので、山の数は分からない。山の数はヒストグラムで見る
    3: 外れ値候補は「飛び抜けている」という目安。誤りと決めつけず、理由（イベントなど）を確かめる
    5: 四分位範囲は Q₃−Q₁（真ん中50%の幅）。最大値−最小値は範囲
  checks:
    - 'Fraction(552, 20) == Fraction(276, 10) and Fraction(276, 10) > Fraction(265, 10)'
  figure:
    type: hist
    caption: 20日の売上は右に裾が長い。平均27.6は中央値26.5より大きい（下の箱ひげ図の太線が中央値）
    data: [12, 15, 18, 19, 21, 22, 22, 24, 25, 26, 27, 28, 29, 30, 31, 33, 35, 38, 42, 55]
    start: 10
    width: 10
    axis_label: 売上（万円）
    box: [12, 15, 18, 19, 21, 22, 22, 24, 25, 26, 27, 28, 29, 30, 31, 33, 35, 38, 42, 55]

- id: Q-U05-023
  stage: S3
  tag: 平均か中央値か
  difficulty: 3
  format: written
  powers: [P2, P3]
  prompt: 例題Aの20日の売上で、平均と中央値を比べよ。「典型的な1日の売上」を1つの数で言うなら、どちらが向いているか。
  answer: 平均は 552÷20＝**27.6万円**、中央値は**26.5万円**。右に裾が長く、55万円の日に引っ張られて平均＞中央値になっている。「典型的な1日」を言うなら、外れた値に引っ張られにくい**中央値**が向く（詳しくは {{unit:U06}}）。
  checks:
    - 'Fraction(552, 20) == Fraction(276, 10) and Fraction(26+27, 2) == Fraction(265, 10)'
  lab:
    id: LAB-dist
    mode: box
    set: {data: sales}
    task: 20日の売上の平均はいくつか（中央値は26.5）。
    predict: {type: number, key: mean, label: "平均", unit: "万円"}
    expect: 27.6
    why: 最大値を42（外れ値でない値）まで下げると、平均は26.95まで下がる。外れた1日が平均を押し上げている。

- id: Q-U05-024
  stage: S3
  tag: 階級の幅
  format: written
  powers: [P1, P3]
  prompt: 例題Aの20日の売上を、階級の幅を5万円にして描き直す。いちばん度数が多い階級はどこか。幅10万円のときと比べて何が言えるか。
  answer: 幅5万円では**25〜30**（25, 26, 27, 28, 29 の5日）がいちばん多い。幅10万円では 20〜30 がいちばん多かった。階級の幅や区切り方で山の位置の見え方が変わるので、ヒストグラムから「いちばん多い値」を言うときは、幅を変えて確かめる。
  checks:
    - 'sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if 25 <= x < 30) == 5'
    - 'max(sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if a <= x < a+5) for a in range(10, 60, 5)) == 5'
  lab:
    id: LAB-dist
    mode: hist
    set: {data: sales, w: 5}
    unlock: [w]
    task: 階級の幅を5万円にすると、いちばん度数が多い階級はどこか。
    predict: {type: choice, key: modeClass, label: "いちばん多い階級", options: [20〜25, 25〜30, 30〜35]}
    expect: 25〜30
    why: 幅10では「20〜30」の9日がまとまって見えたが、幅5では25〜30に5日、20〜25に4日と分かれる。幅を10・20にも切り替えて比べる。

- id: Q-U05-030
  stage: S4
  tag: 客単価
  format: written
  powers: [P3]
  prompt: ある店の客単価（円）の度数分布は、0〜1,000円：12人、1,000〜2,000円：30人、2,000〜3,000円：10人、3,000〜4,000円：26人、4,000〜5,000円：8人だった。「平均客単価を見れば、典型的な客が分かる」と言ってよいか。
  answer: '**言えない**。山が2つ（1,000〜2,000円と3,000〜4,000円）ある二峰の分布で、単身客と家族客のように性質の違う客が混ざっている可能性がある。平均はその間の、どちらの客にも少ない値になりやすい。客層ごとに分けて見る。'
  no_checks: 答えの階級の数は問題文の度数分布表の値で、計算した数ではない
  figure:
    type: hist
    caption: 客単価は1,000〜2,000円と3,000〜4,000円に山が2つ。性質の違う客が混ざっているサイン
    classes: [[0, 1000, 12], [1000, 2000, 30], [2000, 3000, 10], [3000, 4000, 26], [4000, 5000, 8]]
    axis_label: 客単価（円）
    note: 平均はこの2つの山の間に来やすく、どちらの客にも当てはまらない値になりうる。

- id: Q-U05-031
  stage: S4
  tag: 品質管理
  format: written
  powers: [P1, P3]
  prompt: 製品10個の重さ（g）は 98, 99, 100, 100, 101, 101, 102, 102, 103, 110 だった。四分位数と柵を求め、外れ値候補があればどう扱うか答えよ（Q₁・Q₃は下半分・上半分の中央値とする）。
  answer: Q₁＝**100**、中央値＝(101＋101)÷2＝**101**、Q₃＝**102**、IQR＝2。柵は 100−3＝97 と 102＋3＝105 なので、**110gが外れ値候補**。削除する前に、計量の誤りか、本当に重い製品か（詰めすぎ・異物）を確かめ、原因を記録する。
  checks:
    - 'statistics.median([98,99,100,100,101]) == 100 and statistics.median([98,99,100,100,101,101,102,102,103,110]) == 101 and statistics.median([101,102,102,103,110]) == 102'
    - '102 - 100 == 2 and 100 - 1.5*2 == 97 and 102 + 1.5*2 == 105'
  figure:
    type: boxplot
    caption: 製品10個の重さ。柵（点線）の外の110gが外れ値候補
    rows:
      - {label: 製品の重さ（g）, data: [98, 99, 100, 100, 101, 101, 102, 102, 103, 110]}
    fence: true
    step: 5
    note: 外れ値候補は「原因を調べる合図」。削除するかどうかは原因で決める。

- id: Q-U05-032
  stage: S4
  tag: 仕事へ
  difficulty: 3
  format: written
  powers: [P3]
  prompt: 7日間の日販（万円）は、1日目から順に 20, 22, 25, 27, 30, 34, 38 だった。これをヒストグラムにすると、何が分からなくなるか。代わりに何で見るか。
  answer: ヒストグラムは「どの値が何日あったか」だけを表すので、**日ごとに増えている順番（増加の傾向）が消える**。推移は日付の順に並べた折れ線グラフで見る（{{unit:U05T}}）。
  figure:
    type: bars
    caption: 日付の順に並べると、日販が毎日増えていることが分かる。ヒストグラムにすると、この順番は消える
    title: 7日間の日販（①〜⑦は日付の順）
    bars: [[①, 20], [②, 22], [③, 25], [④, 27], [⑤, 30], [⑥, 34], [⑦, 38]]
    unit: ""
    note: ヒストグラムでは、各階級に何日あったかしか分からず、日付の順番（毎日増えていること）は消える。
  no_checks: 答えに新しい数はない（図の注の日数は問題文の値から数えたもの）

- id: Q-U05-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P2, P1]
  prompt: スタージェスの公式 k≒1＋log₂n で、例題Aの20日分（n＝20）の階級の数の目安を求めよ。データの範囲（55−12）から、階級の幅をいくつにするとよいか。
  answer: 1＋log₂20≒1＋4.32＝**5.32**なので、階級は**5個**前後。範囲は 55−12＝43 で、43÷5≒8.6 なので、切りのよい**10万円**幅にする（10〜60で5個の階級）。
  checks:
    - 'abs(math.log2(20) - 4.32) < 0.01 and abs(1 + math.log2(20) - 5.32) < 0.01'
    - '55 - 12 == 43 and abs(43/5 - 8.6) < 1e-9 and len(range(10, 60, 10)) == 5'
  lab:
    id: LAB-dist
    mode: hist
    set: {data: sales, w: 10}
    unlock: [w]
    task: 10万円の幅で20日の売上を分けると、階級はいくつになるか。
    predict: {type: number, key: nbins, label: "階級の数", unit: "個"}
    expect: 5
    why: スタージェスの目安（約5個）と合う。幅5なら10個、幅20なら3個になる。切り替えて形の見え方を比べる。
