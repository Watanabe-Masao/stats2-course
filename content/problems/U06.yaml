# 単元U06の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U06-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    A店は客20人で平均客単価3,000円、B店は客80人で平均客単価2,000円。2店を合わせた客1人あたりの平均を求める。

    A店の売上合計＝20×3,000＝□円、B店の売上合計＝80×□＝□円、全体の平均＝(□＋□)÷□＝□円
  answer_title: 答え（埋めてから開く）
  answer: A店 20×3,000＝**60,000**円、B店 80×**2,000**＝**160,000**円、全体の平均＝(60,000＋160,000)÷**100**＝220,000÷100＝**2,200円**。(3000＋2000)÷2＝2,500円は、客数の違い（重み）を無視した誤り。式で書くと x̄_w＝Σwᵢxᵢ÷Σwᵢ（wᵢ は客数）。
  checks:
    - '20*3000 == 60000 and 80*2000 == 160000 and Fraction(60000+160000, 100) == 2200 and Fraction(3000+2000, 2) == 2500'
  lab:
    id: LAB-center
    mode: wmean
    set: {nA: 20, xA: 3000, nB: 80, xB: 2000}
    task: A店は客20人で平均3,000円、B店は客80人で平均2,000円。2店を合わせた客1人あたりの平均は何円か。
    predict: {type: number, key: wmean, label: "全体の平均", unit: "円"}
    expect: 2200
    why: 棒の幅が客数。客の多いB店（2,000円）に引き寄せられて2,200円になる。2つの平均を足して2で割った2,500円（点線）は、客数が同じときしか正しくない。

- id: Q-U06-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 1, 2, 2, 3, 22 の平均・中央値・最頻値を求め、「典型的な値」を伝えるならどれを使うか説明せよ。
  answer_title: 答え（解いてから開く）
  answer: 平均**6**（合計30÷5）、中央値**2**、最頻値**2**。22が平均を引っ張り、5つのうち4つが平均より小さい。典型的な値を伝えるなら中央値（または最頻値）が向く。ただし合計（30）や予算を扱うなら平均が必要。
  checks:
    - 'Fraction(30, 5) == 6 and statistics.median([1,2,2,3,22]) == 2 and statistics.mode([1,2,2,3,22]) == 2 and sum(1 for x in [1,2,2,3,22] if x < 6) == 4'
  lab:
    id: LAB-center
    mode: mm
    set: {data: skew5}
    task: 1, 2, 2, 3, 22 の平均はいくつか。予想したら、平均と中央値の位置を図で比べる。
    predict: {type: number, key: mean, label: "平均"}
    expect: 6
    why: 合計30÷5＝6。5つのうち4つが6より小さい。中央値（2）は22の大きさに関係なく真ん中の値。

- id: Q-U06-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 3, 5, 5, 7, 10 の平均・中央値・最頻値を求めよ。
  answer: 合計30÷5＝**平均6**、3番目の**中央値5**、2回出る**最頻値5**。
  checks:
    - 'Fraction(3+5+5+7+10, 5) == 6 and statistics.median([3,5,5,7,10]) == 5 and statistics.mode([3,5,5,7,10]) == 5'
  lab:
    id: LAB-center
    mode: mm
    set: {data: five}
    task: 3, 5, 5, 7, 10 の中央値はいくつか。
    predict: {type: number, key: median, label: "中央値"}
    expect: 5
    why: 5個（奇数）なので3番目の値。平均6は10に少し引っ張られて中央値より右にある。

- id: Q-U06-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 2, 2, 3, 4, 9 の平均と中央値を求め、違いが出る理由を説明せよ。
  answer: 平均＝20÷5＝**4**、中央値＝3番目の**3**。9という大きな値が平均を引き上げるが、中央値は順番の真ん中なので9の大きさに影響されない（外れ値の影響の違い）。
  checks:
    - 'Fraction(2+2+3+4+9, 5) == 4 and statistics.median([2,2,3,4,9]) == 3'
  lab:
    id: LAB-center
    mode: mm
    set: {data: q06}
    task: 2, 2, 3, 4, 9 の平均はいくつか。予想したら、9を −／＋ で動かして平均と中央値の動きを比べる。
    predict: {type: number, key: mean, label: "平均"}
    expect: 4
    why: 合計20÷5＝4。9を大きくすると平均だけが上がり、中央値は3のまま。

- id: Q-U06-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 6日間の来店数（人）は 12, 15, 15, 18, 20, 40 だった。平均・中央値・最頻値を求め、「ふだんの日の来店数」として報告するならどれを使うか説明せよ。
  answer: 平均＝120÷6＝**20人**、中央値＝3番目と4番目の平均 (15＋18)÷2＝**16.5人**、最頻値＝**15人**。40人の日（催事など）が平均を引き上げ、6日のうち5日が平均以下。ふだんの日は中央値（16.5人）で伝え、6日間の合計（120人）や人員計画には平均を使う。
  checks:
    - 'sum([12,15,15,18,20,40]) == 120 and Fraction(120, 6) == 20 and statistics.median([12,15,15,18,20,40]) == Fraction(33,2) and statistics.mode([12,15,15,18,20,40]) == 15 and sum(1 for x in [12,15,15,18,20,40] if x <= 20) == 5'
  lab:
    id: LAB-center
    mode: mm
    set: {data: six}
    task: 6日間の来店数 12, 15, 15, 18, 20, 40 の中央値は何人か。
    predict: {type: number, key: median, label: "中央値", unit: "人"}
    expect: 16.5
    why: 6個（偶数）なので3番目（15）と4番目（18）の平均。40を動かしても中央値は16.5のまま。

- id: Q-U06-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 100円の商品を10個、200円の商品を30個売った。1個あたりの平均単価は？
  answer: (10×100＋30×200)÷40＝7,000÷40＝**175円**。150円は個数を無視した誤り。
  checks:
    - '10*100 + 30*200 == 7000 and Fraction(7000, 40) == 175 and Fraction(100+200, 2) == 150'
  lab:
    id: LAB-center
    mode: wmean
    set: {nA: 10, xA: 100, nB: 30, xB: 200}
    task: 100円の商品が10個、200円の商品が30個売れた。1個あたりの平均単価は何円か。
    predict: {type: number, key: wmean, label: "平均単価", unit: "円"}
    expect: 175
    why: 個数で重みを付けると、たくさん売れた200円の側に寄る。単純平均の150円は、10個と30個を同じ重さで扱っている。

- id: Q-U06-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P1, P2]
  prompt: 例題Aの10人の購入額 1, 1, 2, 2, 2, 3, 3, 4, 5, 17（千円）の第1四分位数 Q₁・第3四分位数 Q₃ を求めよ（中央値を除いた下半分・上半分の中央値）。17千円は外れ値候補か（{{unit:U05}} の柵）。
  answer: 下半分 1, 1, 2, 2, 2 の中央値 **Q₁＝2**、上半分 3, 3, 4, 5, 17 の中央値 **Q₃＝4**。IQR＝4−2＝2、上の柵＝4＋1.5×2＝7。17は7より大きいので**外れ値候補**。中央値（Q₂）の2.5と合わせて、真ん中の半分の客は2〜4千円に入る。
  checks:
    - 'statistics.median([1,1,2,2,2]) == 2 and statistics.median([3,3,4,5,17]) == 4 and 4 - 2 == 2 and 4 + Fraction(3,2)*2 == 7 and 17 > 7'
  figure:
    type: boxplot
    caption: 10人の購入額の箱ひげ図。箱は Q₁＝2 から Q₃＝4、柵（点線）の外の17が外れ値候補
    rows:
      - {label: 購入額（千円）, data: [1, 1, 2, 2, 2, 3, 3, 4, 5, 17]}
    fence: true
    mean: true
    step: 5
    note: 四分位数は中央値の仲間。中央値と同じく、端の値の大きさに影響されにくい。平均（▲）は17に引っ張られて箱の右端に来る。

- id: Q-U06-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P3, P1]
  prompt: ある会社の社員から無作為に9人を選び、年収（万円）を調べると 300, 350, 400, 400, 450, 500, 550, 700, 1500 だった。(a) 平均と中央値はいくつか。どちらが大きいか。(b) この平均は母数か統計量か。
  answer: (a) 合計5150÷9≒**572.2万円**、中央値は5番目の**450万円**。1500万円の1人が平均を引き上げ、**平均の方が大きい**（9人中7人が平均より少ない）。　(b) 選んだ9人（標本）から計算したので**統計量**（{{unit:U03}}）。社員全体の平均年収（母数）とは限らない。
  checks:
    - 'sum([300,350,400,400,450,500,550,700,1500]) == 5150 and abs(5150/9 - 572.2) < 0.05 and statistics.median([300,350,400,400,450,500,550,700,1500]) == 450 and sum(1 for x in [300,350,400,400,450,500,550,700,1500] if x < 5150/9) == 7'
  lab:
    id: LAB-center
    mode: mm
    set: {data: income}
    task: 9人の年収 300〜1500万円で、平均と中央値はどちらが大きいか。
    predict: {type: choice, key: bigger, label: "大きいのは", options: [平均, 中央値, 同じ]}
    expect: 平均
    why: 1500万円の1人が平均を右に引っ張る（約572万円）。中央値は5番目の450万円。

- id: Q-U06-020
  stage: S3
  tag: 度数表
  format: written
  powers: [P1, P2]
  prompt: 階級「0〜10」が2人、「10〜20」が5人、「20〜30」が3人。平均の近似値は？
  answer: 階級値（真ん中の値）5, 15, 25 を使う。(5×2＋15×5＋25×3)÷10＝160÷10＝**16**。各階級の値が真ん中に集まっていると見なした近似なので、元データの平均とは少しずれることがある。
  checks:
    - '5*2 + 15*5 + 25*3 == 160 and Fraction(160, 10) == 16'
  lab:
    id: LAB-center
    mode: freq
    set: {f1: 2, f2: 5, f3: 3}
    task: 階級 0〜10 が2人、10〜20 が5人、20〜30 が3人。平均の近似値はいくつか。
    predict: {type: number, key: amean, label: "近似平均"}
    expect: 16
    why: 階級値×度数の合計160÷10人。度数を変えると、人数の多い階級の側に近似平均が寄る（これも重み付き平均）。

- id: Q-U06-021
  stage: S3
  tag: 店舗の平均
  format: written
  powers: [P3, P1]
  prompt: A店は客200人で平均客単価1,000円、B店は客50人で平均客単価2,000円だった。本部の資料に「2店の平均客単価は1,500円」とあった。この数字は正しいか。
  answer: 1,500円は (1,000＋2,000)÷2 の単純平均で、客数の違いを無視している。客1人あたりの平均は (200×1,000＋50×2,000)÷250＝300,000÷250＝**1,200円**。客の多いA店に重みがかかる。「店の平均の平均」が知りたい場合（店ごとの比較）でなければ、売上合計÷客数で出す。
  checks:
    - 'Fraction(1000+2000, 2) == 1500 and 200*1000 + 50*2000 == 300000 and Fraction(300000, 250) == 1200'
  lab:
    id: LAB-center
    mode: wmean
    set: {nA: 200, xA: 1000, nB: 50, xB: 2000}
    task: A店は客200人で平均1,000円、B店は客50人で平均2,000円。客1人あたりの平均は何円か。
    predict: {type: number, key: wmean, label: "全体の平均", unit: "円"}
    expect: 1200
    why: 客の多いA店の1,000円に引き寄せられる。B店の客数を200人に増やすと、単純平均の1,500円と一致する。

- id: Q-U06-022
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: ある店の客の購入額の分布は、山が1つで右に裾が長かった。代表値について、正しい記述はどれか。
  choices:
    - 平均・中央値・最頻値は必ず一致する。
    - 右に裾が長いので、平均は中央値より小さくなりやすい。
    - 最頻値＜中央値＜平均 の順に並びやすい。
    - 購入額の最も大きい客の値をさらに大きくすると、中央値が最も大きく動く。
    - 最頻値は必ず1つに決まる。
  correct: 3
  answer: 右の長い裾の大きな値が平均を右に引っ張るので、平均がいちばん大きくなりやすい。最頻値は山の頂上、中央値はその間に来ることが多い。
  misconceptions:
    1: 一致するのは左右対称で山が1つのとき（の目安）
    2: 平均は裾の向き（右）に引っ張られるので、中央値より大きくなりやすい
    4: 最大の値を大きくして動くのは平均。中央値は順番の真ん中なので動かない
    5: 同じ回数の値が複数あれば最頻値も複数ある
  no_checks: 答えに新しい数はない
  lab:
    id: LAB-center
    mode: shape
    set: {skew: 6}
    task: 山が1つで右に裾が長い分布。平均・中央値・最頻値はどの順に並ぶか。
    predict: {type: choice, key: order, label: "並び", options: [最頻値＜中央値＜平均, 平均＜中央値＜最頻値, ほぼ等しい]}
    expect: 最頻値＜中央値＜平均
    why: 平均は長い裾の側に引っ張られる。裾の向きを−にすると並びが逆になり、0（左右対称）では3つが重なる。

- id: Q-U06-023
  stage: S3
  tag: 売れ筋
  format: written
  powers: [P3, P1]
  prompt: 婦人靴の先月の販売足数は、23.0cm が4足、23.5cm が9足、24.0cm が12足、24.5cm が7足、25.0cm が3足だった。来月の発注で「いちばん多く仕入れるサイズ」を決めるには、どの代表値を使うか。平均を使うと何が困るか。
  answer: 一番多く売れたサイズを知りたいので**最頻値**を使い、**24.0cm** を最も多く仕入れる。平均は (23.0×4＋23.5×9＋24.0×12＋24.5×7＋25.0×3)÷35＝838÷35≒**23.94cm** で、売っていないサイズになる。中央値（18番目）も24.0cm。合計の足数（35足）の見込みには平均ではなく合計を使う。
  checks:
    - '4+9+12+7+3 == 35 and 23.0*4 + 23.5*9 + 24.0*12 + 24.5*7 + 25.0*3 == 838 and abs(838/35 - 23.94) < 0.005 and 4+9 < 18 <= 4+9+12'
  figure:
    type: bars
    caption: サイズ別の販売足数。最も多いのは24.0cm（最頻値）。平均の23.94cmというサイズはない
    title: 婦人靴の販売足数（足）
    bars: [[23.0cm, 4], [23.5cm, 9], [24.0cm, 12], [24.5cm, 7], [25.0cm, 3]]
    unit: ""
    note: 売れ筋（最も多く出る値）は最頻値。平均は「間の値」になり、実在するサイズとは限らない。

- id: Q-U06-030
  stage: S4
  tag: 成長率の平均
  format: written
  powers: [P3, P1]
  prompt: 売上が1年目に＋20%、2年目に−20%だった。1年あたりの平均成長率は何%か（√0.96≒0.980）。増減率の算術平均と比べよ。
  answer: 倍率 1.2×0.8＝0.96 なので、算術平均の0%ではなく、1年あたり √0.96−1≒**−2.0%**（倍率の**幾何平均**）。100→110→121 のように毎年1.1倍なら平均成長率は10%。倍率の平均は掛けて累乗根をとる（{{unit:U05T}}）。
  checks:
    - 'abs(1.2*0.8 - 0.96) < 1e-12 and abs(0.96**0.5 - 0.980) < 0.0005 and (20-20)/2 == 0 and abs(100*1.1 - 110) < 1e-9'
    - 'abs(110*1.1 - 121) < 1e-9 and abs(121**0.5/100**0.5 - 1.1) < 1e-12'
  lab:
    id: LAB-ts
    mode: growth
    set: {m: 2, rates: "20,-20"}
    task: ＋20%、−20% の2期間の平均成長率は何%か（幾何平均）。
    predict: {type: number, key: gmean, label: "平均成長率", unit: "%"}
    expect: -2.020
    why: 1.2×0.8＝0.96 の平方根から1を引いて約−2.0%。算術平均の0%の線では、2期後に元の100に戻ってしまい、実際の96を再現しない。

- id: Q-U06-031
  stage: S4
  tag: 待ち時間
  format: written
  powers: [P3, P1]
  prompt: 病院の受付で9人の待ち時間（分）を測ると 10, 12, 12, 15, 15, 15, 18, 20, 95 だった。待合室の掲示に「待ち時間の目安」を出すなら、どの代表値を使うか。平均を使う場面はあるか。
  answer: 平均＝212÷9≒**23.6分** だが、95分の1人に引っ張られ、9人中8人が平均より短い。目安には**中央値15分**（最頻値も15分）を使う。一方、1日の延べ待ち時間や受付の人員計画には平均（×人数）を使う。95分は外れ値候補なので、原因（検査待ちなど）も確かめる。
  checks:
    - 'sum([10,12,12,15,15,15,18,20,95]) == 212 and abs(212/9 - 23.6) < 0.05 and statistics.median([10,12,12,15,15,15,18,20,95]) == 15 and statistics.mode([10,12,12,15,15,15,18,20,95]) == 15 and sum(1 for x in [10,12,12,15,15,15,18,20,95] if x < 212/9) == 8'
  figure:
    type: boxplot
    caption: 9人の待ち時間。箱は12〜19分に集まり、95分が柵の外（外れ値候補）
    rows:
      - {label: 待ち時間（分）, data: [10, 12, 12, 15, 15, 15, 18, 20, 95]}
    fence: true
    mean: true
    step: 10
    note: 中央値（箱の中の線）は15分。平均（▲）は95分に引っ張られて箱の外まで右に出る。

- id: Q-U06-032
  stage: S4
  tag: 速さの平均
  format: written
  powers: [P3, P1]
  prompt: 配送車が倉庫から120km先の店まで時速60kmで行き、帰りは時速40kmで戻った。往復の平均の速さは時速何kmか。(60＋40)÷2＝50 でよいか。
  answer: 行きは120÷60＝2時間、帰りは120÷40＝3時間。往復240kmを5時間で走ったので 240÷5＝**時速48km**。50は時間の違いを無視した誤り（遅い帰りの方が長く走っている）。同じ距離を進むときの速さの平均は**調和平均** 2÷(1/60＋1/40)＝48。
  checks:
    - 'Fraction(120,60) == 2 and Fraction(120,40) == 3 and Fraction(240, 5) == 48 and Fraction(60+40, 2) == 50 and Fraction(2, Fraction(1,60)+Fraction(1,40)) == 48'
  figure:
    type: bars
    caption: 同じ120kmでも、帰り（時速40km）は3時間かかり、行き（時速60km）の2時間より長い
    title: 120km にかかった時間（時間）
    bars: [[行き, 2], [帰り, 3]]
    unit: ""
    note: 平均の速さ＝全体の距離÷全体の時間。時間の長い帰りの速さに引き寄せられる。

- id: Q-U06-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P1, P2]
  prompt: 例題Aの10人の購入額 1, 1, 2, 2, 2, 3, 3, 4, 5, 17（千円）で、両端から10%ずつ（1人ずつ）除いた10%トリム平均を求めよ。平均・中央値と比べよ。
  answer: 1と17を除いた 1, 2, 2, 2, 3, 3, 4, 5 の平均＝22÷8＝**2.75千円**。平均4千円より中央値2.5千円に近く、17千円の影響をほとんど受けない。
  checks:
    - 'sum([1,2,2,2,3,3,4,5]) == 22 and Fraction(22, 8) == Fraction(275, 100)'
  lab:
    id: LAB-center
    mode: mm
    set: {data: buy10}
    task: 10人の購入額の両端を1人ずつ除いた10%トリム平均はいくつか。
    predict: {type: number, key: trim, label: "10%トリム平均", unit: "千円"}
    expect: 2.75
    why: 最大の17を大きくしても、トリム平均は除かれる側なので変わらない（くわしくの式で確かめる）。平均は動き、中央値は動かない。
