# 単元U07の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U07-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    売場Aの5日間の販売数は 8, 9, 10, 11, 12 個（平均10個）。不偏分散・標準偏差・変動係数を求め、例題Aの売場Bと比べる。

    偏差＝−2, −1, 0, 1, 2、偏差平方和＝□、不偏分散 s²＝□÷4＝□、標準偏差 s＝√□≒□個、CV＝□÷10≒□
  answer_title: 答え（埋めてから開く）
  answer: 偏差平方和＝4＋1＋0＋1＋4＝**10**、s²＝10÷4＝**2.5**、s＝√2.5≒**1.58個**、CV≒**0.16**。売場B（偏差平方和90、s²＝22.5、s≒4.74個、CV≒0.47）の偏差平方和は売場Aの9倍で、標準偏差は3倍。平均が同じでも、売場Bは毎日の販売数が大きく上下する。
  checks:
    - 'sum((x-10)**2 for x in [8,9,10,11,12]) == 10 and Fraction(10,4) == Fraction(5,2) and abs(2.5**0.5 - 1.58) < 0.005 and abs(1.58/10 - 0.16) < 0.005'
    - 'Fraction(90,10) == 9 and abs(22.5**0.5/2.5**0.5 - 3) < 1e-12'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: A}
    task: 売場Aの5日間 8, 9, 10, 11, 12 個の不偏分散はいくつか。
    predict: {type: number, key: s2, label: "不偏分散"}
    expect: 2.5
    why: 偏差 −2〜2 を2乗して足すと10、4で割って2.5。売場B（22.5）の9分の1で、標準偏差は3分の1。

- id: Q-U07-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 商品Pは日販の平均100個・標準偏差10個、商品Qは平均20個・標準偏差4個。相対的にばらつきが大きいのはどちらか。
  answer_title: 答え（解いてから開く）
  answer: CV は P＝10÷100＝**0.10**、Q＝4÷20＝**0.20**。標準偏差だけなら P のほうが大きいが、平均に対する**相対的なばらつきは Q のほうが大きい**。
  checks:
    - 'Fraction(10,100) == Fraction(1,10) and Fraction(4,20) == Fraction(1,5)'
  lab:
    id: LAB-spread
    mode: cv
    set: {mP: 100, sP: 10, mQ: 20, sQ: 4}
    task: 商品Pは平均100個・標準偏差10個、商品Qは平均20個・標準偏差4個。相対的にばらつきが大きいのはどちらか。
    predict: {type: choice, key: bigger, label: "CVが大きいのは", options: [P, Q, 同じ]}
    expect: Q
    why: 標準偏差は P の10個の方が大きいが、平均で割ると P は0.10、Q は0.20。Q の平均を100にすると、CV は0.04まで下がる。

- id: Q-U07-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 2, 4, 6 の平均・偏差平方和・不偏分散・標準偏差（不偏分散の平方根）を求めよ。
  answer: 平均**4**、偏差平方和 4＋0＋4＝**8**、不偏分散 8÷2＝**4**、標準偏差**2**。（n で割る分散は 8÷3≒2.67）
  checks:
    - 'Fraction(2+4+6, 3) == 4 and (2-4)**2 + (4-4)**2 + (6-4)**2 == 8 and Fraction(8,2) == 4 and abs(8/3 - 2.67) < 0.005'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: t3}
    task: 2, 4, 6 の不偏分散はいくつか。
    predict: {type: number, key: s2, label: "不偏分散"}
    expect: 4
    why: 偏差 −2, 0, 2 を2乗して足すと8、n−1＝2 で割って4。標準偏差は2。

- id: Q-U07-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 1, 3, 5, 7 の偏差平方和、n で割る分散、不偏分散を求めよ。また、全てのデータを2倍にすると不偏分散はどうなるか。
  answer: 平均4、偏差平方和 9＋1＋1＋9＝**20**、n で割る分散＝**5**、不偏分散＝20÷3≒**6.67**。2倍にすると偏差も2倍、2乗するので分散は**4倍**（標準偏差は2倍）。
  checks:
    - 'sum((x-4)**2 for x in [1,3,5,7]) == 20 and Fraction(20,4) == 5 and abs(20/3 - 6.67) < 0.005 and sum((2*x-8)**2 for x in [1,3,5,7]) == 80'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: t4}
    task: 1, 3, 5, 7 の n で割る分散はいくつか。予想したら b を2にして、分散が何倍になるかも見る。
    predict: {type: number, key: v, label: "n で割る分散"}
    expect: 5
    why: 偏差平方和20を4で割って5。b＝2 にすると偏差平方和は80になり、分散は4倍の20。

- id: Q-U07-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: X は 0, 5, 5, 5, 10、Y は 0, 0, 5, 10, 10。どちらも平均5・範囲（最大−最小）10 だが、散らばりは同じと言えるか。それぞれの偏差平方和と不偏分散で比べよ。
  answer: X の偏差平方和は 25＋0＋0＋0＋25＝**50**、不偏分散 50÷4＝**12.5**。Y は 25＋25＋0＋25＋25＝**100**、不偏分散**25**。範囲は同じでも、Y は端に値が集まっていて散らばりは X の2倍。範囲は両端の2つしか見ないので、真ん中の値の散らばり方の違いが分からない。
  checks:
    - 'sum((x-5)**2 for x in [0,5,5,5,10]) == 50 and sum((x-5)**2 for x in [0,0,5,10,10]) == 100 and Fraction(50,4) == Fraction(25,2) and Fraction(100,4) == 25 and 10-0 == 10'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: ry}
    task: Y（0, 0, 5, 10, 10）の偏差平方和はいくつか。予想したら X に切り替えて比べる。
    predict: {type: number, key: ss, label: "偏差平方和"}
    expect: 100
    why: どの点も平均5から離れているので、偏差平方和は X（50）の2倍。範囲（10）は同じでも散らばりは違う。

- id: Q-U07-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 4, 7, 10, 13, 16 の偏差平方和を「計算の近道」Σx²−(Σx)²÷n で求めよ。
  answer: Σx²＝16＋49＋100＋169＋256＝590、(Σx)²÷n＝50²÷5＝500。590−500＝**90**（表で求めた値と一致）。
  checks:
    - '16+49+100+169+256 == 590 and Fraction(50**2, 5) == 500 and 590 - 500 == 90'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: B}
    task: 4, 7, 10, 13, 16 の偏差平方和はいくつか（くわしくの式に「近道」の計算が出る）。
    predict: {type: number, key: ss, label: "偏差平方和"}
    expect: 90
    why: 偏差の2乗を足しても、Σx²−(Σx)²÷n で計算しても90。平均が割り切れないデータでは近道の方が計算しやすい。

- id: Q-U07-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P1, P2]
  prompt: 3日間の最高気温は 18, 20, 22℃ で、不偏分散は4、標準偏差は2℃だった。華氏（°F＝1.8×℃＋32）に直すと、平均・標準偏差・不偏分散はいくつになるか。
  answer: 平均は 1.8×20＋32＝**68°F**。32を足しても散らばりは変わらず、1.8倍した分だけ変わるので、標準偏差は 1.8×2＝**3.6°F**、不偏分散は 1.8²×4＝**12.96**。
  checks:
    - 'Fraction(18+20+22, 3) == 20 and sum((x-20)**2 for x in [18,20,22]) == 8 and Fraction(8,2) == 4'
    - 'abs(1.8*20 + 32 - 68) < 1e-9 and abs(1.8*2 - 3.6) < 1e-9 and abs(1.8**2*4 - 12.96) < 1e-9'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: temp, b: 1.8, a: 32}
    task: 18, 20, 22℃ を華氏（1.8倍して32を足す）にしたとき、標準偏差（√不偏分散）は何°Fか。
    predict: {type: number, key: s, label: "標準偏差", unit: "°F"}
    expect: 3.6
    why: 32を足しても散らばりは変わらない。1.8倍したので標準偏差も1.8倍（2→3.6）、分散は1.8²倍（4→12.96）。

- id: Q-U07-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P3, P1]
  prompt: ある店で、無作為に選んだ5日間の来店数は 20, 22, 24, 26, 28 人だった。この店のふだんの日の来店数の散らばり（母分散）を推定したい。(a) 不偏分散はいくつか。(b) n で割らずに n−1 で割るのはなぜか。(c) この不偏分散は母数か統計量か。
  answer: (a) 平均24、偏差平方和 16＋4＋0＋4＋16＝40、不偏分散 40÷4＝**10**（n で割ると8）。　(b) 平均を標本から計算しているので、n で割ると母分散を平均的に小さく見積もるから。　(c) 選んだ5日（標本）から計算したので**統計量**（{{unit:U03}}）。母分散の推定値として使う。
  checks:
    - 'Fraction(20+22+24+26+28, 5) == 24 and sum((x-24)**2 for x in [20,22,24,26,28]) == 40 and Fraction(40,4) == 10 and Fraction(40,5) == 8'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: visit}
    task: 無作為に選んだ5日の来店数 20, 22, 24, 26, 28 人の不偏分散はいくつか。
    predict: {type: number, key: s2, label: "不偏分散"}
    expect: 10
    why: 偏差平方和40を n−1＝4 で割って10。母分散の推定に使うので n−1 で割る（n で割ると8）。

- id: Q-U07-020
  stage: S3
  tag: 変動係数
  format: written
  powers: [P3, P1]
  prompt: メロンの日販は平均3,000円・標準偏差600円、みかんは平均300円・標準偏差90円だった。「メロンの方が売上のぶれが大きいので発注が難しい」と言ってよいか。
  answer: 標準偏差だけならメロンが大きいが、平均の大きさが10倍違う。CV はメロン 600÷3,000＝**0.2**、みかん 90÷300＝**0.3**。平均に対する相対的なぶれはみかんの方が大きいので、「発注が難しい（相対的にぶれる）」のはみかんと言える。金額のぶれそのもの（±何円）を言うなら標準偏差を使う。
  checks:
    - 'Fraction(600,3000) == Fraction(1,5) and Fraction(90,300) == Fraction(3,10) and Fraction(3000,300) == 10'
  lab:
    id: LAB-spread
    mode: cv
    set: {mP: 3000, sP: 600, mQ: 300, sQ: 90}
    task: P＝メロン（平均3,000円・標準偏差600円）、Q＝みかん（平均300円・標準偏差90円）。みかんの CV はいくつか。
    predict: {type: number, key: cvQ, label: "みかんの CV"}
    expect: 0.3
    why: 90÷300＝0.3。メロンの0.2より大きい。標準偏差の大小と CV の大小は逆になることがある。

- id: Q-U07-021
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3, P1]
  prompt: 5日間の販売数 x₁, …, x₅ の分散（不偏分散）を s² とする。変換と散らばりについて、正しい記述はどれか。
  choices:
    - 全データに3を足すと、分散も3増える。
    - 全データを2倍すると、標準偏差は4倍になる。
    - 全データを2倍して3を足すと、分散は4倍になる。
    - 分散の単位は元のデータと同じである。
    - 偏差の合計は、データによって正にも負にもなる。
  correct: 3
  answer: 2倍すると偏差が2倍になり、2乗するので分散は4倍。3を足しても全部が同じだけずれるので偏差は変わらない。
  misconceptions:
    1: 全部に同じ数を足しても偏差は変わらないので、分散は変わらない
    2: 標準偏差は2倍（分散が4倍）
    4: 分散の単位は元の2乗（個²）。元の単位に戻したのが標準偏差
    5: 偏差の合計はどんなデータでも必ず0
  checks:
    - 'sum((2*x+3 - 23)**2 for x in [4,7,10,13,16]) == 4*90 and sum(x-10 for x in [4,7,10,13,16]) == 0'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: B, b: 2, a: 3}
    task: 売場Bの販売数（不偏分散22.5）を全部2倍して3を足すと、不偏分散はいくつか。
    predict: {type: number, key: s2, label: "不偏分散"}
    expect: 90
    why: 2倍で4倍の90。3を足しても変わらない。a だけを動かして、分散が変わらないことも確かめる。

- id: Q-U07-022
  stage: S3
  tag: ジニ係数
  format: written
  powers: [P1, P2]
  prompt: 4店の売上が 1, 1, 2, 6（合計10）。ローレンツ曲線の点と、ジニ係数を求めよ。
  answer: |-
    累積の店割合 0.25, 0.5, 0.75, 1 に対し、累積売上割合は 0.1, 0.2, 0.4, 1.0。

    曲線の下の面積を台形で足す：0.25×{(0＋0.1)＋(0.1＋0.2)＋(0.2＋0.4)＋(0.4＋1.0)}÷2＝0.25×2.4÷2＝**0.3**。

    ジニ係数＝2×(0.5−0.3)＝**0.4**。
  checks:
    - 'Fraction(25,100)*((0+Fraction(1,10))+(Fraction(1,10)+Fraction(2,10))+(Fraction(2,10)+Fraction(4,10))+(Fraction(4,10)+1))/2 == Fraction(3,10) and 2*(Fraction(1,2)-Fraction(3,10)) == Fraction(2,5)'
    - 'Fraction(1,10)+Fraction(3,10)+Fraction(6,10)+Fraction(14,10) == Fraction(24,10)'
  lab:
    id: LAB-spread
    mode: gini
    set: {sales: "1,1,2,6"}
    task: 4店の売上 1, 1, 2, 6 のジニ係数はいくつか。
    predict: {type: number, key: gini, label: "ジニ係数"}
    expect: 0.4
    why: 曲線の下の面積は0.3。対角線の下（0.5）との差0.2を2倍して0.4。4店を同じ売上にすると0になる。

- id: Q-U07-023
  stage: S3
  tag: n か n−1 か
  format: written
  powers: [P3]
  prompt: 母分散8の母集団から大きさ2の標本を何度も取り、そのたびに n で割る分散を計算する。その平均は母分散8と比べてどうなるか。また、1回の標本でも必ずそうなるか。
  answer: 平均すると母分散より**小さく**なる（(n−1)/n＝1/2 倍の4）。平均を標本から計算するので、標本の値は標本平均の近くに寄って見え、偏差平方和が小さめになるから。ただし1回の標本では、n で割っても母分散より大きくなることもある。だから「平均して」母分散に当たるよう n−1 で割る（不偏分散の平均はちょうど8）。
  checks:
    - 'Fraction(2-1,2)*8 == 4'
  lab:
    id: LAB-spread
    mode: unb
    set: {n: 2}
    task: 母集団 2, 4, 6, 8, 10（母分散8）から大きさ2の標本を取る全25通りで、n で割る分散の平均は母分散より大きいか小さいか。
    predict: {type: choice, key: bias, label: "母分散と比べて", options: [小さい, 等しい, 大きい]}
    expect: 小さい
    why: n で割る分散の平均は4（母分散の半分）、n−1 で割るとちょうど8。n を大きくすると差は縮むが、(n−1)/n 倍は残る。

- id: Q-U07-030
  stage: S4
  tag: 投資のリスク
  format: written
  powers: [P3, P1]
  prompt: 投資信託Aの3年間の年リターンは 2, 4, 6%、投資信託Bは −4, 4, 12% だった。どちらも平均4%。リスク（ばらつき）を標準偏差（不偏分散の平方根）で比べよ。
  answer: A は偏差平方和 4＋0＋4＝8、不偏分散4、標準偏差**2%**。B は偏差平方和 64＋0＋64＝128、不偏分散64、標準偏差**8%**。平均が同じでも、B は年によって大きく上下する（リスクが4倍）。投資では標準偏差を「リスク」と呼ぶ。
  checks:
    - 'sum((x-4)**2 for x in [2,4,6]) == 8 and sum((x-4)**2 for x in [-4,4,12]) == 128 and Fraction(128,2) == 64 and 64**0.5 == 8 and Fraction(-4+4+12, 3) == 4'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: fundB}
    task: 投資信託Bの年リターン −4, 4, 12% の標準偏差（√不偏分散）は何%か。
    predict: {type: number, key: s, label: "標準偏差", unit: "%"}
    expect: 8
    why: 偏差 −8, 0, 8 を2乗して足すと128、2で割って64、平方根8%。A（2, 4, 6%）の4倍。

- id: Q-U07-031
  stage: S4
  tag: CVが使えない例
  format: written
  powers: [P3]
  prompt: 都市Xの冬の日平均気温は平均2℃・標準偏差3℃、都市Yは平均20℃・標準偏差3℃だった。CV を計算すると X は1.5、Y は0.15 になる。「X の気温は Y の10倍ばらつく」と言ってよいか。
  answer: 言えない。摂氏の0℃は「量がない」点ではない（決め方しだいで動く）ので、平均で割った CV に意味がない。華氏で表すと平均も CV も変わってしまう。気温のばらつきは標準偏差で比べ、X も Y も**3℃で同じ**と言う。CV は売上・個数・重さのように0に意味がある正の量で使う（比例尺度、{{unit:U04}}）。
  checks:
    - 'Fraction(3,2) == Fraction(15,10) and Fraction(3,20) == Fraction(15,100) and Fraction(3,2)/Fraction(3,20) == 10'
  lab:
    id: LAB-spread
    mode: cv
    set: {mP: 2, sP: 3, mQ: 20, sQ: 3}
    task: P＝都市X（平均2℃・標準偏差3℃）、Q＝都市Y（平均20℃・標準偏差3℃）。X の CV はいくつか。計算してから、意味がある数かを考える。
    predict: {type: number, key: cvP, label: "X の CV"}
    expect: 1.5
    why: 計算では1.5になるが、平均の2℃は0℃の決め方しだいで変わる。平均を0に近づけると CV はいくらでも大きくなる。摂氏の気温では標準偏差（どちらも3℃）で比べる。

- id: Q-U07-032
  stage: S4
  tag: 安全在庫
  format: written
  powers: [P3, P1]
  prompt: 例題の売場A（平均10個・標準偏差約1.58個）と売場B（平均10個・標準偏差約4.74個）で、「平均＋標準偏差の2倍」を1日の発注量の目安にする。それぞれ何個か。
  answer: 売場Aは 10＋2×1.58≒**13.16個**、売場Bは 10＋2×4.74≒**19.49個**（√22.5≒4.743 で計算）。平均が同じでも、ばらつきの大きい売場Bは約6個多く用意しないと欠品しやすい。2倍で足りるかは、欠品と廃棄のどちらを避けたいかで決める（{{unit:U16}} の正規分布で目安の確率が分かる）。
  checks:
    - 'abs(10 + 2*2.5**0.5 - 13.16) < 0.005 and abs(10 + 2*22.5**0.5 - 19.49) < 0.005 and abs((19.49 - 13.16) - 6) < 0.5'
  figure:
    type: bars
    caption: 平均＋標準偏差の2倍。平均は同じ10個でも、ばらつきの大きい売場Bは約19.49個を見込む
    title: 1日の発注量の目安（個）
    bars: [[売場A, 13.16], [売場B, 19.49]]
    decimals: 2
    unit: ""
    note: 平均だけで発注すると、ばらつきの大きい売場ほど欠品しやすい。

- id: Q-U07-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P1, P2]
  prompt: 母集団 2, 4, 6, 8, 10（母分散8）から大きさ3の標本を取る全125通りで、n で割る分散を平均するといくつになるか。(n−1)/n×σ² の式で求めよ。
  answer: (3−1)/3×8＝16/3≒**5.33**。n−1 で割る不偏分散なら平均は8。n＝2 のときの4（＝1/2×8）より母分散に近づくが、まだ小さい。
  checks:
    - 'Fraction(2,3)*8 == Fraction(16,3) and abs(16/3 - 5.33) < 0.005 and 5**3 == 125'
  lab:
    id: LAB-spread
    mode: unb
    set: {n: 3}
    task: 大きさ3の標本の全125通りで、n で割る分散の平均はいくつか。
    predict: {type: number, key: av, label: "n で割る分散の平均"}
    expect: 5.333
    why: (n−1)/n＝2/3 倍で約5.33。n を6まで動かすと、2/3→5/6 と母分散8に近づく。
