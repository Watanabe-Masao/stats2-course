- id: Q-U11-040
  stage: S5
  tag: 独立の対称性
  format: written
  powers: [P1, P3]
  prompt: 100人の表で、A かつ B が6人、A で B でないが14人、A でなく B が24人、どちらでもないが56人。P(B｜A) と P(B)、P(A｜B) と P(A) をそれぞれ比べよ。
  answer: P(B｜A)＝6÷20＝0.3、P(B)＝30÷100＝0.3 で等しい。P(A｜B)＝6÷30＝**0.2**、P(A)＝20÷100＝0.2 で等しい。一方が成り立てばもう一方も成り立つ（独立は対称）。
  checks:
    - 'Fraction(6,20) == Fraction(30,100) and Fraction(6,30) == Fraction(20,100)'
  lab:
    id: LAB-prob
    mode: table
    set: {a: 6, b: 14, c: 24, d: 56}
    task: A かつ B 6人、A で非B 14人、非A で B 24人、どちらでもない56人。P(A｜B) は何%か。
    predict: {type: number, key: condAB, label: "P(A｜B)", unit: "%"}
    expect: 20
    why: 6÷30＝20%＝P(A)。P(B｜A)＝6÷20＝30%＝P(B) も成り立つ。独立はどちら向きに見ても同じ。
