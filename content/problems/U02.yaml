  stage: S3
  tag: 1から n までの和
  format: written
  powers: [P1, P2]
  prompt: Σi（i＝1 から 5 まで）を書き下して求め、n(n＋1)÷2 の公式と一致することを確かめよ。
  answer: 1＋2＋3＋4＋5＝**15**。公式 5×6÷2＝**15** と一致する。
  checks:
    - 'sum(range(1,6)) == 15 and Fraction(5*6, 2) == 15'
  lab:
    id: LAB-sigma
    mode: sum
    set: {data: [1, 2, 3, 4, 5]}
    task: 1, 2, 3, 4, 5 の合計 Σx はいくつか。
    predict: {type: number, key: sum, label: "Σx"}
    expect: 15
    why: 1＋2＋3＋4＋5＝15＝5×6÷2。平均3（真ん中の値）×個数5 とも同じ。
