# 単元U15の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U15-001
  stage: S1
  concepts: [TERM-poisson]
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    1日に平均3件の返品がある（ポアソン分布）。ある日に返品が1件以下の確率は？（e⁻³≒0.0498）

    P(0)＝e⁻³×3⁰÷0!＝□、P(1)＝e⁻³×3¹÷1!＝□。1件以下＝□＋□＝□
  answer_title: 答え（埋めてから開く）
  answer: P(0)＝**0.0498**、P(1)＝0.0498×3＝**0.1494**。合計 **0.199**（約20%）。
  checks:
    - 'abs(math.exp(-3) - 0.0498) < 0.00005 and abs(0.0498*3 - 0.1494) < 1e-9 and abs(0.0498+0.1494 - 0.199) < 0.0005 and abs(4*math.exp(-3) - 0.199) < 0.0005'
  lab:
    id: LAB-pois
    mode: pois
    set: {unit: 日, rate: 3, t: 1, k: 1, kind: le}
    task: 1日に平均3件の返品。ある日に返品が1件以下の確率は（小数で）？
    predict: {type: number, key: le, label: "P(X≦1)"}
    expect: 0.1991
    why: 0件0.0498＋1件0.1494≒0.199。平均3件なので、1件以下で済む日は5日に1日くらい。

- id: Q-U15-002
  stage: S1
  concepts: [REL-binom-poisson, TERM-poisson]
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 不良率0.2%の商品を1000個検品する。不良がちょうど2個の確率を、ポアソン近似で求めよ（e⁻²≒0.135）。
  answer_title: 答え（解いてから開く）
  answer: 二項分布 B(1000, 0.002) は n が大きく p が小さいので、λ＝np＝**2** のポアソン分布で近似できる。P(2)＝e⁻²×2²÷2!＝0.135×2＝**0.271**。
  checks:
    - 'math.isclose(1000*0.002, 2) and abs(math.exp(-2)*4/2 - 0.271) < 0.0005 and math.isclose(0.135*2, 0.27) and abs(comb(1000,2)*0.002**2*0.998**998 - 0.271) < 0.0005'
  lab:
    id: LAB-pois
    mode: approx
    set: {n: 1000, p: 0.002, k: 2}
    task: B(1000, 0.002) をポアソン分布で近似する。ちょうど2個の確率（ポアソン）は（小数で）？
    predict: {type: number, key: poi, label: "ポアソンの P(X＝2)"}
    expect: 0.2707
    why: λ＝np＝2、e⁻²×4÷2≒0.2707。二項分布の正確な値0.2709とほとんど同じ。p を0.2のように大きくすると差が開く。

- id: Q-U15-003
  stage: S1
  concepts: [TERM-poisson]
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 1時間平均2件で、1時間にちょうど1件の確率は？
  answer: e⁻²×2÷1!＝0.135×2＝**0.271**。
  checks:
    - 'abs(2*math.exp(-2) - 0.271) < 0.0005 and math.isclose(0.135*2, 0.27)'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 2, t: 1, k: 1, kind: eq}
    task: 1時間に平均2件。ちょうど1件の確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝1)"}
    expect: 0.2707
    why: e⁻²×2¹÷1!≒0.271。λ＝2 では1件と2件がちょうど同じ確率になる。

- id: Q-U15-004
  stage: S1
  concepts: [TERM-poisson]
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 1時間に平均2件の問い合わせがある。30分間に2件以上来る確率は？
  answer: 30分なので λ＝1。P(0)＝e⁻¹≒0.368、P(1)＝e⁻¹×1≒0.368。2件以上＝1−0.368−0.368≒**0.264**。
  checks:
    - 'abs(math.exp(-1) - 0.368) < 0.0005 and abs(1-2*math.exp(-1) - 0.264) < 0.0005'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 2, t: 0.5, k: 2, kind: ge}
    task: 1時間に平均2件。30分間に2件以上来る確率は（小数で）？
    predict: {type: number, key: ge, label: "P(X≧2)"}
    expect: 0.2642
    why: λ＝2×0.5＝1。1−e⁻¹−e⁻¹≒0.264。λ を2のまま計算すると0.594になり、2倍以上に見積もってしまう。

- id: Q-U15-005
  stage: S1
  concepts: [TERM-poisson, TERM-indep]
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 1日に平均3件の返品がある（ポアソン分布、日ごとに独立）。「2日間の返品が0件」の確率と、「1日0件の日が2日続く」確率をそれぞれ求めて比べよ。
  answer: 2日間は λ＝6 なので e⁻⁶≒**0.0025**。1日0件は e⁻³≒0.0498、2日続くのは 0.0498²≒**0.0025**。同じになる。区間を足すと λ も足せる（ポアソン分布の和）。
  checks:
    - 'abs(math.exp(-6) - 0.0025) < 0.00005 and math.isclose(math.exp(-3)**2, math.exp(-6)) and abs(0.0498**2 - 0.0025) < 0.00005'
  lab:
    id: LAB-pois
    mode: pois
    set: {unit: 日, rate: 3, t: 2, k: 0, kind: eq}
    task: 1日に平均3件の返品。2日間で返品が0件の確率は（小数で）？
    predict: {type: number, key: p0, label: "P(X＝0)"}
    expect: 0.0025
    why: λ＝3×2＝6、e⁻⁶≒0.0025。1日0件（e⁻³）を2回掛けても同じ。区間を延ばすと0件はどんどん起きにくくなる。

- id: Q-U15-010
  stage: S2
  concepts: [TERM-poisson]
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 1時間に平均4人がレジに並ぶ。15分間に1人も並ばない確率は？
