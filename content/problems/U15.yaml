  lab:
    id: LAB-pois
    mode: hyper
    set: {N: 20, K: 2, n: 4, k: 0}
    task: 20個中2個が不良、戻さず4個。不良が0個（見逃し）の確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝0)"}
    expect: 0.6316
    why: 3060÷4845≒0.632。抜く数 n を8にすると約0.37まで下がる。

- id: Q-U15-032
  stage: S4
  concepts: [TERM-poisson]
