    mode: pois
    set: {unit: 日, rate: 0.5, t: 7, k: 0, kind: eq}
    task: 1日に平均0.5件、7日間で0件の確率は（小数で）？
    predict: {type: number, key: p0, label: "P(X＝0)"}
    expect: 0.0302
    why: λ＝3.5、e⁻³·⁵≒0.030。偶然かどうかの判断は検定の単元で正式に扱う。

- id: Q-U15-040
  stage: S3
  concepts: [REL-poisson-expo, TERM-expo]
  tag: 待ち時間
  format: written
  powers: [P1, P3]
  prompt: 問い合わせは1時間に平均2件（ポアソン分布）。今から次の問い合わせまで30分以上待つ確率は？ 待ち時間の平均は？
  answer: 30分以上待つ＝30分間に0件。λ＝1 なので e⁻¹≒**0.368**。待ち時間の平均は 1/2時間＝**30分**。
  checks:
    - 'abs(math.exp(-1) - 0.368) < 0.0005 and math.isclose(60/2, 30)'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 2, t: 0.5, k: 0, kind: eq}
    task: 1時間に平均2件。30分間に0件（＝30分以上待つ）確率は（小数で）？
    predict: {type: number, key: p0, label: "P(X＝0)"}
    expect: 0.3679
    why: 待ち時間が t を超える＝t の間に0件。e^(−λt) で、時間を延ばすと指数的に小さくなる（指数分布）。
