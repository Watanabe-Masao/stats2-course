  powers: [P1, P2]
  prompt: 10個中2個が不良。戻さずに3個取り出すとき、不良がちょうど1個の確率は？
  answer: ₂C₁×₈C₂÷₁₀C₃＝2×28÷120＝56÷120＝**7/15**（約0.467）。母集団 N が大きければ二項分布とほぼ同じになる。
  checks:
    - 'comb(2,1)*comb(8,2) == 56 and comb(10,3) == 120 and Fraction(56,120) == Fraction(7,15) and abs(7/15 - 0.467) < 0.0005'
  lab:
    id: LAB-pois
    mode: hyper
    set: {N: 10, K: 2, n: 3, k: 1}
    task: 10個中2個が不良、戻さず3個。不良がちょうど1個の確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝1)"}
    expect: 0.4667
    why: 56÷120＝7/15。戻す（二項）と0.384で、箱が小さいと差が大きい。N を100倍にすると二項に近づく。

- id: Q-U15-023
  stage: S3
  concepts: [TERM-poisson]
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 1時間あたりの問い合わせ件数が平均2件のポアソン分布に従うとき、正しいものはどれか。
  choices:
    - 分散は4である。
    - 30分間の件数も平均2件である。
    - 30分間の件数の平均と分散はどちらも1である。
    - 1時間の件数は多くても2件までである。
    - 実際の件数の平均と分散が等しければ、ポアソン分布に従うと証明できる。
  correct: 3
  answer: 30分なら λ＝1。ポアソン分布では平均＝分散＝λ なので、どちらも1。
  misconceptions:
    1: ポアソン分布の分散は λ そのもの（2）。2乗しない
    2: λ は区間の長さに比例するので30分は1
    4: ポアソン分布の件数に上限はない
    5: 平均＝分散は手がかりの1つで、証明にはならない
  checks:
    - 'math.isclose(2*0.5, 1)'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 2, t: 0.5, k: 1, kind: eq}
    task: 1時間に平均2件。30分間の件数の分散はいくつか。
    predict: {type: number, key: var, label: "分散"}
    expect: 1
    why: λ＝2×0.5＝1。ポアソン分布は平均＝分散＝λ。

- id: Q-U15-030
  stage: S4
  concepts: [TERM-poisson]
  tag: レジの応援基準
  format: written
  powers: [P1, P3]
  prompt: 夕方のレジには15分間に平均3人が来る（ポアソン分布）。5人以上来たら応援を呼ぶ基準にすると、応援が要る15分は全体のどれくらいか。
  answer: λ＝3。P(0〜4人)＝e⁻³×(1＋3＋4.5＋4.5＋3.375)≒0.815。5人以上＝1−0.815≒**0.185**（約18%）。15分の5回に1回くらいは応援が要る。
  checks:
    - 'abs(math.exp(-3)*(1+3+4.5+4.5+3.375) - 0.815) < 0.0005 and abs(1-math.exp(-3)*(1+3+4.5+4.5+3.375) - 0.185) < 0.0005'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 12, t: 0.25, k: 5, kind: ge}
    task: 15分間に平均3人（1時間に12人）。5人以上来る確率は（小数で）？
    predict: {type: number, key: ge, label: "P(X≧5)"}
    expect: 0.1847
    why: λ＝3、1−(0〜4人)≒0.185。基準を6人以上にすると約0.084まで下がる。

