  answer: 超幾何：₁₈C₄÷₂₀C₄＝3060÷4845≒**0.632**。二項（p＝0.1）：0.9⁴≒0.656。戻さない方が見逃しはやや少ない。1個以上見つかる確率は 1−0.632≒0.368。
