  checks:
    - 'math.isclose(4*0.25, 1) and abs(math.exp(-1) - 0.368) < 0.0005'
  lab:
    id: LAB-pois
    mode: pois
    set: {rate: 4, t: 0.25, k: 0, kind: eq}
    task: 1時間に平均4人。15分間に0人の確率は（小数で）？
    predict: {type: number, key: p0, label: "P(X＝0)"}
    expect: 0.3679
    why: λ＝4×0.25＝1、e⁻¹≒0.368。15分の3回に1回くらいは誰も並ばない。

- id: Q-U15-011
  stage: S2
  concepts: [TERM-geom]
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 当たりの確率が0.2のくじを、当たるまで引く。3回目で初めて当たる確率と、当たるまでの平均回数は？
  answer: 1回目・2回目がはずれ、3回目が当たり：0.8²×0.2＝**0.128**。平均は 1/p＝**5回**。
  checks:
    - 'math.isclose(0.8**2*0.2, 0.128) and math.isclose(1/0.2, 5)'
  lab:
    id: LAB-pois
    mode: geom
    set: {p: 0.2, r: 1, k: 3}
    task: 当たり確率0.2。3回目で初めて当たる確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝3)"}
    expect: 0.128
    why: はずれ0.8を2回、当たり0.2を1回で 0.128。平均は5回だが、1回目で当たる（0.2）のがいちばん起きやすい。

- id: Q-U15-012
  stage: S2
  concepts: [REL-binom-poisson, TERM-binom, TERM-poisson]
  label: 約1か月後の問
  format: written
  powers: [P1, P3]
  prompt: 1日200人の来店客のうち、各客が1%の確率で特定の商品を返品する。返品が0件になる確率を、二項分布（{{unit:U14}}）とポアソン近似でそれぞれ求めて比べよ。
  answer: 二項：0.99²⁰⁰≒**0.134**。ポアソン：λ＝200×0.01＝2、e⁻²≒**0.135**。ほぼ同じ。n が大きく p が小さいので近似がよく合う。
  checks:
    - 'abs(0.99**200 - 0.134) < 0.0005 and math.isclose(200*0.01, 2) and abs(math.exp(-2) - 0.135) < 0.0005'
  lab:
    id: LAB-pois
    mode: approx
    set: {n: 200, p: 0.01, k: 0}
    task: B(200, 0.01)。返品が0件になる確率（二項の正確な値）は（小数で）？
    predict: {type: number, key: bin, label: "二項の P(X＝0)"}
    expect: 0.134
    why: 0.99²⁰⁰≒0.134。ポアソン近似 e⁻²≒0.135 との差は0.001ほど。

- id: Q-U15-020
  stage: S3
  concepts: [TERM-poisson, TERM-binom, TERM-geom, REL-binom-geom-contrast]
  tag: 分布を選ぶ
  format: written
  powers: [P3]
  prompt: 次の数え方に合う分布は？　(a) 1日に届く苦情の件数　(b) 10人中の購入者数　(c) 初めて当たりが出るまでのくじの回数。(c) で当たりの確率が0.1なら、平均何回か。
  answer: (a) **ポアソン分布**、(b) **二項分布**、(c) **幾何分布**。(c) の平均は 1/0.1＝**10回**。
  checks:
    - 'math.isclose(1/0.1, 10)'
  lab:
    id: LAB-pois
    mode: geom
    set: {p: 0.1, r: 1, k: 10}
    task: (c) 当たり確率0.1のくじを当たるまで引く。平均何回か。
    predict: {type: number, key: mean, label: "平均回数", unit: "回"}
    expect: 10
    why: 幾何分布の平均は 1/p＝10回。ただし10回までに当たる確率は約65%で、10回を超えることも3回に1回以上ある。

- id: Q-U15-021
  stage: S3
  concepts: [TERM-negbinom, TERM-indep]
  tag: 負の二項分布
  format: written
  powers: [P1, P3]
  prompt: 成功率0.5で、2回目の成功がちょうど3回目の試行で起きる確率は？
  answer: 最初の2回で成功1回（どちらか ₂C₁＝2通り）、3回目に成功。2×0.5²×0.5＝**0.25**。
  checks:
    - 'comb(2,1) == 2 and math.isclose(2*0.5**2*0.5, 0.25)'
  lab:
    id: LAB-pois
    mode: geom
    set: {p: 0.5, r: 2, k: 3}
    task: 成功率0.5。2回目の成功がちょうど3回目に起きる確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝3)"}
    expect: 0.25
    why: 3回目は必ず成功。前の2回のどちらで1回成功するかが2通りで、2×0.5³＝0.25。

- id: Q-U15-022
  stage: S3
  concepts: [TERM-hyper]
  tag: 戻さずに取り出す
