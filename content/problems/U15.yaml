  prompt: 1日に平均0.5件のクレームがある。1週間（7日）でクレームが0件になる確率は？ 「先週は0件だったので改善した」と言えるか。
  answer: λ＝0.5×7＝3.5、e⁻³·⁵≒**0.030**（約3%）。改善がなくても0件は約3%で起きる。めったに起きないので改善の手がかりにはなるが、1週間だけで断定せず、続く週も見る。
