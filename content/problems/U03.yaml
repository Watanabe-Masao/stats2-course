# 単元U03の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U03-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1]
  prompt: |-
    ある市の全世帯3万世帯の平均通信費を知るため、600世帯を無作為に選んで調べた。平均は8,200円だった。

    母集団＝□（大きさ N＝□）、標本＝□（大きさ n＝□）、8,200円は□（記号□）、知りたい本当の平均は□（記号□）
  answer_title: 答え（埋めてから開く）
  answer: 母集団＝**市の全世帯**（N＝30,000）、標本＝**選んだ600世帯**（n＝600）、8,200円は**統計量**（x̄）、知りたい本当の平均は**母数**（μ・分からない）。
  checks:
    - '30000 > 600'

- id: Q-U03-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P3]
  prompt: 次のうち母数はどれか。「① 調べた30人の平均年齢」「② 全社員の本当の平均年齢」「③ 調べた30人の年齢の標準偏差」。選んだ理由も書く。
  answer_title: 答え（解いてから開く）
  answer: "**②**。母集団（全社員）の値なので母数。①③は調べた30人（標本）から計算した統計量。平均だけでなく標準偏差も、標本から計算すれば統計量になる。"

- id: Q-U03-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: ある県の全世帯のうち500世帯を調べ、1世帯あたりの平均の食費を計算した。母集団と標本はそれぞれ何か。
  answer: 母集団＝**その県の全世帯**、標本＝**調べた500世帯**。500世帯の平均食費は統計量。

- id: Q-U03-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P3]
  prompt: 本部のPOSデータから、先月の全店・全取引の平均客単価を計算した。知りたいのが「先月の全取引の平均」なら、この値は母数か統計量か。
  answer: "**母数**。知りたい全体（先月の全取引）を全部使って計算した**全数調査**なので、標本から推し量る必要がない。ただし「来月の客単価」を知りたいなら、先月のデータは推測の材料（標本のような役割）になる。**何を知りたいか**で答えが変わる。"

- id: Q-U03-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 全従業員の残業時間を知るため、自分から回答してくれた20人の平均を出した。母集団・標本・統計量を答え、この平均だけでは分からないことを1つ挙げる。
  answer: |-
    母集団＝**全従業員**、標本＝**回答した20人**、統計量＝**20人の平均残業時間**。

    分からないこと（例）：自分から回答した人は残業が多い（少ない）人に偏っているかもしれない。人数が多くても、選ばれ方が偏っていれば全体の推測は崩れる。期間や「残業」の定義も確認が必要。

- id: Q-U03-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P3]
  prompt: スーパーの全来店客のうち、ある日の午前中に来た客120人にアンケートし、満足と答えた割合は75%だった。この75%は母数か統計量か。また、この数字を全来店客の満足度とみなすときの注意点を1つ挙げる。
  answer: "**統計量**（標本比率 p̂）。注意点：午前中の客だけなので、午後や休日の客と満足度が違うかもしれない（時間帯の偏り）。"

- id: Q-U03-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P2]
  prompt: 無作為に選んだ5店の廃棄率は 2.1%、2.8%、2.4%、3.0%、2.2% だった。平均を求め、それが母数か統計量かを答える。
  answer: (2.1＋2.8＋2.4＋3.0＋2.2)÷5＝12.5÷5＝**2.5%**。5店（標本）から計算したので**統計量 x̄**。全店の本当の平均 μ とは限らない。
  checks:
    - 'Fraction(21+28+24+30+22, 50) == Fraction(5, 2)'

- id: Q-U03-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P1, P2]
  prompt: (a) 5店（A〜E）から無作為に2店を選ぶ。選び方は何通りで、A店が選ばれる確率はいくつか。　(b) 選んだ2店の廃棄率の中央値は、母数か統計量か。　(c) サイコロを1回振る試行の標本空間を書け。
  answer: (a) ₅C₂＝**10通り**。A店を含む選び方は残り4店から1店で4通りなので、**4/10＝2/5**。　(b) 標本から計算したので**統計量**（平均以外の要約も統計量）。　(c) **{1, 2, 3, 4, 5, 6}**。統計の「標本」とは別の言葉。
  checks:
    - 'comb(5,2) == 10 and Fraction(comb(4,1), comb(5,2)) == Fraction(2,5)'

- id: Q-U03-020
  stage: S3
  format: written
  powers: [P3]
  prompt: 会員アプリの利用者だけにアンケートを送り、「全来店客の満足度」を調べようとした。何が問題か。
  answer: 調べたい母集団（全来店客）と、標本を選ぶ元の名簿（アプリ会員）がずれている。アプリを使わない客は選ばれる可能性がなく、満足度が違えば結果が偏る（**抽出枠の偏り**）。ラボの「名簿の漏れ」で、漏れを増やしたときのずれを確かめられる。

- id: Q-U03-021
  stage: S3
  format: written
  powers: [P3]
  prompt: ネットに投稿された口コミ5,000件の平均評価は4.6だった。この4.6は母数か統計量か。「5,000件もあるので全利用者の評価とみなせる」は正しいか。
  answer: "**統計量**。口コミは**自分から投稿した人**だけの評価で、とても満足した人や不満のあった人が投稿しやすい。件数が多くても選ばれ方の偏りは消えないので、全利用者の評価とはみなせない（ラボの「自分から回答」）。"

- id: Q-U03-022
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 会員100万人から無作為に2,000人を選んで満足度を調べたところ、「満足」と答えたのは62%だった。正しい記述はどれか。
  choices:
    - 62%は母数である。
    - 62%は統計量で、別の2,000人を選び直すと値が変わりうる。
    - 選んだ2,000人が母集団である。
    - 無作為に選んだので、62%は会員全体の満足割合と必ず一致する。
    - 回答者が多いほど、選び方に関係なく62%は正確になる。
  correct: 2
  answer: 2,000人（標本）から計算した値なので統計量。標本を選び直せば値は変わる。
  misconceptions:
    1: 母数は会員100万人全体の割合で、普通は分からない
    3: 母集団は会員100万人。2,000人は標本
    4: 無作為でも標本ごとにばらつく。一致する保証はなく、どれくらいずれうるかは信頼区間で示す
    5: 人数を増やしても、選び方が偏っていればずれは消えない
  checks:
    - '2000 < 1000000'

- id: Q-U03-023
  stage: S3
  tag: 記号を読む
  format: written
  powers: [P1]
  prompt: ある検定の問題文に「n＝25、x̄＝3.2、s＝1.1、帰無仮説の母平均 μ₀＝3.0」とある。それぞれは標本から計算した値か、母集団についての値か。
  answer: n は標本の大きさ。x̄ と s は**標本から計算した統計量**。μ₀ は**母平均について仮に置いた値（母数の側）**で、データから計算したものではない。ギリシャ文字は母数の側、上に記号が付いたものや s は標本の側、と読める。

- id: Q-U03-024
  stage: S3
  tag: 確率へ
  format: written
  powers: [P1]
  prompt: サイコロを1回振る。「偶数が出る」事象と「4以上が出る」事象を、標本空間の一部として書き、それぞれの確率を求めよ。
  answer: 標本空間 {1, 2, 3, 4, 5, 6}。偶数＝**{2, 4, 6}**、4以上＝**{4, 5, 6}**。どの目も同じくらい出るなら、どちらも 3/6＝**1/2**。詳しくは {{unit:U10}}。
  checks:
    - 'Fraction(3, 6) == Fraction(1, 2)'

- id: Q-U03-030
  stage: S4
  format: written
  powers: [P1]
  prompt: 1,000個のロットから20個を抜き取って検査したところ、1個が不良だった。母集団・標本・統計量（不良率）を答えよ。
  answer: 母集団＝**ロットの1,000個**、標本＝**抜き取った20個**、統計量＝**標本の不良率 1/20＝5%**。ロット全体の不良率（母数）が5%とは限らない。
  checks:
    - 'Fraction(1, 20) == Fraction(5, 100)'

- id: Q-U03-031
  stage: S4
  format: written
  powers: [P2, P3]
  prompt: 池の魚の数を知りたい。50匹を捕まえて印を付けて放し、後日40匹を捕まえたら、そのうち8匹に印があった。池の魚はおよそ何匹か。この方法が当たるための条件を1つ挙げる。
  answer: 2回目の標本で印の割合は 8/40＝1/5。池全体でも印の付いた50匹が1/5なら、全体は 50÷(1/5)＝**約250匹**。条件（例）：印の付いた魚と付いていない魚が同じように捕まる（よく混ざる・捕まりやすさに差がない）、その間に魚の出入りがない。
  checks:
    - '50*40//8 == 250'

- id: Q-U03-032
  stage: S4
  tag: 仕事へ
  format: written
  powers: [P3]
  prompt: 「売れ筋上位20品目の値入率」を、全品目の値入率の推測に使ってよいか。
  answer: "**使えない**。売れ筋だけを選んでいるので、全品目の中の偏った一部（標本の選ばれ方が偏っている）。全品目の値入率を知るなら、全品目で計算するか、品目を無作為に選ぶ。"

- id: Q-U03-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P2]
  prompt: N＝1,000 の母集団から n＝100 を戻さずに選ぶ。有限母集団修正の係数 (N−n)/(N−1) はおよそいくつか。標本平均の分散は、戻して選ぶ場合の何倍になるか。
  answer_title: 答え
  answer: 900÷999≒**0.901**。標本平均の分散は約0.90倍（標準偏差は √0.901≒0.95倍）になる。母集団に比べて標本が小さいほど係数は1に近く、修正はほとんど要らない。
  checks:
    - 'abs((1000-100)/(1000-1) - 0.901) < 0.001 and abs(math.sqrt(900/999) - 0.95) < 0.005'
