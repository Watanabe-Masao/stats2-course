# 単元U24の問題。id は変えない（個人の解答記録がこの id を指す）。
# Φ(z)＝0.5*(1+math.erf(z/math.sqrt(2)))
- id: Q-U24-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    新商品の導入で、客単価が従来の100百円より**上がった**かを調べる（下がることは考えない）。σ＝12百円、36人の平均は104百円。有意水準5%で検定せよ。（Φ(2)＝0.9772、右片側5%の境目は1.645）

    H₀：μ＝□、H₁：μ □ 100。SE＝□÷√□＝□、z＝(□−100)÷□＝□。p 値＝1−Φ(□)＝□。p □ 0.05 なので H₀ を □。
  answer_title: 答え（埋めてから開く）
  answer: H₀：μ＝**100**、H₁：μ **＞** 100（右片側）。SE＝12÷√36＝**2**、z＝(104−100)÷2＝**2**。p 値＝1−0.9772＝**0.0228**。p ≦ 0.05 なので H₀ を**棄却**。「客単価は上がったと言える（有意水準5%）」。
  checks:
    - '12/math.sqrt(36) == 2 and (104-100)/2 == 2 and abs(1-0.9772 - 0.0228) < 1e-9 and abs(0.5*(1+math.erf(2/math.sqrt(2))) - 0.9772) < 0.00005'
  lab:
    id: LAB-test
    mode: z
    set: {side: upper, alpha: 0.05, xbar: 104, mu0: 100, sigma: 12, n: 36}
    task: μ₀＝100、σ＝12、36人の平均104。右片側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0228
    why: z＝2、右側の面積は約0.023。両側にすると2倍の約0.046 で、どちらでも5%以下。

- id: Q-U24-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: H₀ が誤っているのに棄却しなかったのは、第何種の過誤か。ある検定の、指定した本当の値での検出力が0.8なら、β はいくつか。α を5%に決めたら β も5%になるか。
  answer: '**第2種の過誤**。β＝1−0.8＝**0.2**。α は正しい H₀ を棄却する確率で、β は本当の値・n・σ で決まる別の量なので、α＝5% から β＝5% とは言えない。'
  checks:
    - 'abs(1-0.8 - 0.2) < 1e-12'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 105.6, sigma: 10, n: 25}
    task: μ₀＝100、本当の μ₁＝105.6、σ＝10、25人、両側5%。第2種の過誤の確率 β は（小数で）？
    predict: {type: number, key: beta, label: "β"}
    expect: 0.2005
    why: 本当の z の中心は 5.6÷2＝2.8。境目1.96を超える確率（検出力）が約0.80、見逃す確率 β が約0.20。

- id: Q-U24-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 従来の平均100・σ＝10。25人の平均が103だった。両側5%で、平均が変わったかを検定せよ。（Φ(1.5)＝0.9332）
  answer: SE＝2、z＝(103−100)÷2＝1.5。p 値＝2×(1−0.9332)＝**0.1336**。0.05 より大きいので H₀ を**棄却しない**。「平均が変わったとは言えない」。変わっていないことの証明ではない。
  checks:
    - '10/math.sqrt(25) == 2 and (103-100)/2 == 1.5 and abs(2*(1-0.9332) - 0.1336) < 1e-9'
  lab:
    id: LAB-test
    mode: z
    set: {side: two, alpha: 0.05, xbar: 103, mu0: 100, sigma: 10, n: 25}
    task: μ₀＝100、σ＝10、25人の平均103。両側5%で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却しない
    why: z＝1.5、p≒0.13。偶然でもこれくらいのずれは13%ほど起こる。

- id: Q-U24-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 従来の平均100・σ＝10、25人の平均が103.6。① 両側 ② 右片側（上がったかだけを見る）で、それぞれ p 値を求めて5%で判断せよ。片側か両側かは、いつ決めるべきか。（Φ(1.8)＝0.9641）
  answer: z＝3.6÷2＝1.8。① 両側 p＝2×0.0359＝**0.0718** → 棄却しない。② 右片側 p＝**0.0359** → 棄却する。片側か両側かで結論が変わるので、**データを見る前に**決める。結果を見てから片側に変えると、第1種の過誤が増える。
  checks:
    - '3.6/2 == 1.8 and abs(1-0.9641 - 0.0359) < 1e-9 and abs(2*0.0359 - 0.0718) < 1e-9'
  lab:
    id: LAB-test
    mode: z
    set: {side: upper, alpha: 0.05, xbar: 103.6, mu0: 100, sigma: 10, n: 25}
    task: μ₀＝100、σ＝10、25人の平均103.6。右片側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0359
    why: 右側だけの面積で約0.036。両側に切り替えると約0.072 で5%を超える。

- id: Q-U24-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 20の売場について、それぞれ「施策の前後で差がない」を5%で検定した。本当はどの売場でも差がないとき、少なくとも1つが偶然「有意」になる確率はいくつか（検定は独立とする）。
  answer: 1−0.95²⁰≒**0.64**。どこにも差がなくても、約64%の確率で1つ以上「有意」が出る。有意な売場だけを報告すると誤る。1回ずつ 0.05÷20＝0.0025 で判断すれば、全体の誤りを約5%に抑えられる。
  checks:
    - 'abs(1-0.95**20 - 0.64) < 0.005 and 0.05/20 == 0.0025 and abs(1-(1-0.0025)**20 - 0.05) < 0.002'
  lab:
    id: LAB-test
    mode: multi
    set: {alpha: 0.05, k: 20, bonf: false}
    task: 本当は差がない検定を5%で20回。どれかが有意になる確率は（小数で）？
    predict: {type: number, key: fwer, label: "どれかが有意になる確率"}
    expect: 0.6415
    why: 1−0.95²⁰≒0.64。「α÷k で判断」に切り替えると約0.049 に下がる。

- id: Q-U24-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 例題A（z＝2.2、両側 p≒0.028）を、有意水準1%で判断するとどうなるか。両側1%の境目は2.576。
  answer: '|z|＝2.2＜2.576（p＝0.028＞0.01）なので、1%では H₀ を**棄却しない**。同じデータでも α で結論が変わるので、α は調べる前に決める。'
  checks:
    - '2.2 < 2.576 and 0.028 > 0.01'
  lab:
    id: LAB-test
    mode: z
    set: {side: two, alpha: 0.01, xbar: 104.4, mu0: 100, sigma: 10, n: 25}
    task: 例題Aの数で、有意水準1%（両側）。H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却しない
    why: 境目が2.576 に広がり、z＝2.2 は内側。α を5%に戻すと棄却する。

- id: Q-U24-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 従来の平均100・σ＝10。本当の平均が104のとき、両側5%の検定の検出力を、n＝100 で求めよ。（Φ(2.04)＝0.9793）
  answer: SE＝1、本当の z の中心は (104−100)÷1＝4。検出力≒P(Z＞1.96−4)＝Φ(2.04)≒**0.979**（反対側はほぼ0）。n＝25 の約0.52 から大きく上がる。
  checks:
    - '10/math.sqrt(100) == 1 and (104-100)/1 == 4 and abs(4-1.96 - 2.04) < 1e-9 and abs(0.5*(1+math.erf(2.04/math.sqrt(2))) - 0.9793) < 0.00005'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 104, sigma: 10, n: 100}
    task: μ₀＝100、μ₁＝104、σ＝10、n＝100、両側5%。検出力は（小数で）？
    predict: {type: number, key: power, label: "検出力"}
    expect: 0.9793
    why: 中心4が境目1.96を大きく超え、ほとんど見逃さない。n＝25 では約0.52。

- id: Q-U24-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: σ＝10 が分かっていて、100人の平均50から作った母平均の95%信頼区間（{{unit:U22}}）は48.04〜51.96。H₀：μ＝52 を両側5%で検定するとどうなるか。区間との関係も述べよ。
  answer: SE＝1、z＝(50−52)÷1＝−2、|z|＝2＞1.96 で H₀ を**棄却**（p≒0.046）。52 は区間の外にある。「95%信頼区間に入らない値」は「両側5%で棄却される値」と一致する。
  checks:
    - '(50-52)/1 == -2 and abs(2*(1-0.5*(1+math.erf(2/math.sqrt(2)))) - 0.046) < 0.0005 and 52 > 51.96'
  lab:
    id: LAB-test
    mode: z
    set: {side: two, alpha: 0.05, xbar: 50, mu0: 52, sigma: 10, n: 100}
    task: x̄＝50、μ₀＝52、σ＝10、n＝100。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0455
    why: z＝−2、p≒0.046。μ₀ を51 にすると z＝−1、区間の中なので棄却しない。

- id: Q-U24-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: σ＝10。本当の差が4あるとき、両側5%・検出力0.8 で見つけるには何人必要か。n≒((1.96＋0.84)×σ÷差)² で見積もれ。
  answer: ((1.96＋0.84)×10÷4)²＝(2.8×2.5)²＝**49**。ちょうど49人では検出力は約0.80（0.7995）でわずかに届かないので、**50人**にする。
  checks:
    - 'abs(((1.96+0.84)*10/4)**2 - 49) < 1e-9 and abs(0.5*(1+math.erf((4/(10/7)-1.96)/math.sqrt(2))) - 0.7995) < 0.0001'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 104, sigma: 10, n: 25}
    task: μ₀＝100、μ₁＝104、σ＝10、両側5%。検出力0.8 に必要な最小の n は？
    predict: {type: number, key: n80, label: "必要な n"}
    expect: 50
    why: n＝49 で約0.7995、50 で約0.807。表の0.84 を使った見積もり49 は、ちょうど境目。

- id: Q-U24-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 例題Aと同じ設定（μ₀＝100、σ＝10、n＝25）で、本当の平均が104のとき、両側1%の検定の検出力はいくつか。両側5%（約0.52）と比べて何が言えるか。（両側1%の境目は2.576、Φ(−0.576)＝0.2823）
  answer: 本当の z の中心は2。検出力≒P(Z＞2.576−2)＝1−Φ(0.576)＝Φ(−0.576)≒**0.28**。α を5%から1%に下げると、第1種の過誤は減るが、検出力は約0.52から0.28に下がり、第2種の過誤（β≒0.72）が増える。
  checks:
    - 'abs(2.576-2 - 0.576) < 1e-9 and abs(0.5*(1+math.erf(-0.576/math.sqrt(2))) - 0.2823) < 0.00005 and abs(1-0.2823 - 0.72) < 0.005'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.01, mu0: 100, mu1: 104, sigma: 10, n: 25}
    task: μ₁＝104、n＝25、両側1%。検出力は（小数で）？
    predict: {type: number, key: power, label: "検出力"}
    expect: 0.2823
    why: 境目が2.576 に広がり、本当の中心2 の山の大半が内側に入る。α と β は片方を減らすともう片方が増える。

- id: Q-U24-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 10個の指標を比べるとき、全体の誤り（どれかが偶然有意になる確率）を5%程度に抑えたい。1回ずつの検定をいくつの有意水準で行えばよいか。そのとき全体の誤りはいくつか（検定は独立とする）。
  answer: 0.05÷10＝**0.005** で判断する（ボンフェローニ）。全体の誤りは 1−(1−0.005)¹⁰≒**0.049**。調整しないと 1−0.95¹⁰≒0.40 になる。
  checks:
    - '0.05/10 == 0.005 and abs(1-0.995**10 - 0.049) < 0.0005 and abs(1-0.95**10 - 0.40) < 0.005'
  lab:
    id: LAB-test
    mode: multi
    set: {alpha: 0.05, k: 10, bonf: true}
    task: 10回の検定を α÷10 で判断する。どれかが偶然有意になる確率は（小数で）？
    predict: {type: number, key: fwer, label: "どれかが有意になる確率"}
    expect: 0.0489
    why: 1−0.995¹⁰≒0.049。調整を外すと約0.40。

- id: Q-U24-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 仮説検定について、正しいものはどれか。
  choices:
    - p 値が0.03 なら、帰無仮説が正しい確率は3%である。
    - 帰無仮説を棄却できなかったので、帰無仮説が正しいことが示された。
    - 有意水準を小さくすると、第1種の過誤の確率は小さくなるが、第2種の過誤の確率は大きくなる。
    - データを見てから、有意になる方の片側検定を選ぶのは問題ない。
    - 統計的に有意な差は、実務的にも必ず大きな差である。
  correct: 3
  answer: 棄却の境目が外に動くので、正しい H₀ を棄却しにくくなる一方、本当の差も見逃しやすくなる。例題Aの設定で α を5%から1%にすると、検出力は約0.52 から0.28 に下がる。
  misconceptions:
    1: p 値は H₀ が正しいと仮定したときのデータの珍しさで、H₀ が正しい確率ではない
    2: 棄却しないのは「差があるとは言えない」で、H₀ の証明ではない（検出力が低いだけかもしれない）
    4: 片側か両側かはデータを見る前に決める。後から選ぶと第1種の過誤が増える
    5: n が大きいと小さな差でも有意になる。大きさは区間で示す
  checks:
    - 'abs(0.5*(1+math.erf(-0.576/math.sqrt(2))) - 0.28) < 0.005'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 104, sigma: 10, n: 25}
    task: μ₁＝104、n＝25、両側5%。検出力は（小数で）？（α を1%に変えて比べる）
    predict: {type: number, key: power, label: "検出力"}
    expect: 0.516
    why: 約0.52。α を1%にすると約0.28 に下がり、β が増える。

- id: Q-U24-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 従来の客単価は1000円・σ＝300円。キャンペーン中の100人の平均は1060円。客単価が変わったかを両側5%で検定し、結論を報告の文で書け。（Φ(2)＝0.9772）
  answer: SE＝300÷√100＝30、z＝60÷30＝2、p＝2×(1−0.9772)＝**0.0456**。|z|＞1.96 で H₀ を棄却。「キャンペーン中の客単価は変わったと言える（有意水準5%）。差は約60円、95%信頼区間は約1001〜1119円」。
  checks:
    - '300/math.sqrt(100) == 30 and 60/30 == 2 and abs(2*(1-0.9772) - 0.0456) < 1e-9 and abs(1060-1.96*30 - 1001) < 1 and abs(1060+1.96*30 - 1119) < 1'
  lab:
    id: LAB-test
    mode: z
    set: {side: two, alpha: 0.05, xbar: 1060, mu0: 1000, sigma: 300, n: 100}
    task: μ₀＝1000、σ＝300、100人の平均1060。両側5%で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: z＝2 で境目1.96をわずかに超える（p≒0.046）。50人なら z≒1.41 で棄却しない。

- id: Q-U24-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1万人のデータで、客単価の平均が従来の1000円から1006円になった（σ＝300円）。両側5%で検定すると有意になるか。この結果を施策の判断にどう使うか。（Φ(2)＝0.9772）
  answer: SE＝300÷√10000＝3、z＝6÷3＝2、p≒**0.0456** で有意。ただし差は6円（0.6%）しかなく、施策の費用に見合うかは別に判断する。n が大きいと小さな差でも有意になる。
  checks:
    - '300/math.sqrt(10000) == 3 and 6/3 == 2 and abs(2*(1-0.9772) - 0.0456) < 1e-9 and 6/1000 == 0.006'
  lab:
    id: LAB-test
    mode: z
    set: {side: two, alpha: 0.05, xbar: 1006, mu0: 1000, sigma: 300, n: 10000}
    task: μ₀＝1000、σ＝300、1万人の平均1006。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0455
    why: SE が3円しかないので、6円の差でも z＝2。有意かどうかと、差が大きいかどうかは別。

- id: Q-U24-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: σ＝300円。施策で客単価が本当に100円上がるとき、16店で両側5%の検定をすると、差を見つけられる確率（検出力）はいくつか。（Φ(−0.627)＝0.2654）
  answer: SE＝300÷4＝75、本当の z の中心＝100÷75≒1.333。検出力≒P(Z＞1.96−1.333)＝Φ(−0.627)≒**0.27**。7割以上の確率で見逃すので、「有意差なし」でも効果がないとは言えない。
  checks:
    - '300/math.sqrt(16) == 75 and abs(100/75 - 1.333) < 0.0005 and abs(1.96-100/75 - 0.627) < 0.0005 and abs(0.5*(1+math.erf(-0.627/math.sqrt(2))) - 0.2654) < 0.0001'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 1000, mu1: 1100, sigma: 300, n: 16}
    task: σ＝300、本当の差100円、16店、両側5%。検出力は（小数で）？
    predict: {type: number, key: power, label: "検出力"}
    expect: 0.2659
    why: 約0.27。検出力0.8 にするには71店が要る（「必要な n」を見る）。

- id: Q-U24-040
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 検出力曲線で、本当の平均 μ₁ が μ₀ と同じ（H₀ が正しい）とき、両側5%の検定の「検出力」はいくつになるか。なぜか。
  answer: '**0.05**（＝α）。H₀ が正しいときに棄却する確率は、第1種の過誤の確率そのものだから。μ₁ が μ₀ から離れるほど、検出力は α から1 に近づく。'
  checks:
    - 'abs(2*(1-0.5*(1+math.erf(1.96/math.sqrt(2)))) - 0.05) < 0.0005'
  lab:
    id: LAB-test
    mode: power
    set: {side: two, alpha: 0.05, mu0: 100, mu1: 100, sigma: 10, n: 25}
    task: μ₁＝μ₀＝100、両側5%。「検出力」（棄却する確率）は（小数で）？
    predict: {type: number, key: power, label: "棄却する確率"}
    expect: 0.05
    why: 約0.05。H₀ が正しいときに棄却するのは第1種の過誤。μ₁ を少しずつ動かすと、検出力が0.05 から上がっていく。
