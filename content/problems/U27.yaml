# 単元U27の問題。id は変えない（個人の解答記録がこの id を指す）。
# χ² の上側の点は数値積分の χ² CDF で照合する：
# (lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)
- id: Q-U27-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    4つの売場の来店者数は、どこも同じ割合（各1/4）のはずだという。80人を調べると 26・14・22・18 人だった。有意水準5%で、売場ごとの割合は同じと言えるか検定せよ。（自由度3の χ² の上側5%点は7.815）

    期待度数は 80×□＝□（どの売場も）。χ²＝(□−20)²÷20＋(14−20)²÷20＋(22−20)²÷20＋(18−20)²÷20＝□。自由度＝□−1＝□。χ² □ 7.815 なので H₀ を □。
  answer_title: 答え（埋めてから開く）
  answer: 期待度数は 80×**1/4**＝**20**。χ²＝(**26**−20)²÷20＋36÷20＋4÷20＋4÷20＝80÷20＝**4**。自由度＝**4**−1＝**3**。χ² **＜** 7.815 なので H₀ を**棄却しない**（p≒0.26）。「売場ごとの割合が違うとは言えない」。
  checks:
    - '80/4 == 20 and ((26-20)**2+(14-20)**2+(22-20)**2+(18-20)**2)/20 == 4 and 4 < 7.815 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(7.815,3) - 0.95) < 0.0005'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 4, m: 0, o: [26, 14, 22, 18], w: [1, 1, 1, 1]}
    task: 4つの売場で 26・14・22・18 人、どこも同じ割合のはず。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 4
    why: 期待度数20、ずれの2乗の和80÷20＝4。自由度3の点7.815 に届かない。同じ χ²＝4 でも、自由度1なら棄却、自由度3なら棄却しない。

- id: Q-U27-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 旧パッケージは200人中50人、新パッケージは200人中70人が購入した。パッケージと購入は独立か、有意水準5%で検定せよ（自由度1の χ² の上側5%点は3.841）。期待度数も示せ。
  answer: 列計は購入120・なし280、総計400。期待度数は購入 200×120÷400＝**60**、なし **140**（両方の行で同じ）。χ²＝(10²÷60)×2＋(10²÷140)×2≒3.333＋1.429＝**4.76**。4.76＞3.841（p≒0.029）で独立を**棄却**。「パッケージと購入には関連がある」。購入率は旧25%・新35%。
  checks:
    - '200*120/400 == 60 and 200*280/400 == 140 and abs(2*100/60+2*100/140 - 4.76) < 0.005 and abs(1-math.erf(math.sqrt(4.7619/2)) - 0.029) < 0.0005 and 50/200 == 0.25 and 70/200 == 0.35'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[50, 150], [70, 130]]}
    task: 旧200人中50人購入、新200人中70人購入。5%で H₀（独立）をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: χ²≒4.76 が3.841 を超える。帯グラフで、新の「購入」の帯が全体の区切りより長い。

- id: Q-U27-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 3色の商品は 2：1：1 の割合で売れると見込んでいた。120個の販売は 赤54・青36・白30 個だった。見込みどおりかを有意水準5%で検定せよ（自由度2の χ² の上側5%点は5.991）。
  answer: 期待度数は 赤60・青30・白30。χ²＝36÷60＋36÷30＋0＝0.6＋1.2＝**1.8**、自由度2。1.8＜5.991 で H₀ を**棄却しない**（p≒0.41）。「見込みの割合と違うとは言えない」。
  checks:
    - '120*2/4 == 60 and 120/4 == 30 and abs(36/60+36/30 - 1.8) < 1e-9 and 1.8 < 5.991 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(5.991,2) - 0.95) < 0.0005'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 3, m: 0, o: [54, 36, 30], w: [2, 1, 1]}
    task: 見込み 2：1：1、120個で 54・36・30。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 1.8
    why: 期待度数は60・30・30。比率の欄に 2・1・1 と入れれば、合計が1でなくても割合として扱われる。

- id: Q-U27-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 2つの店で支払い方法を100人ずつ調べた。A店は 現金30・カード40・スマホ30、B店は 現金20・カード40・スマホ40。店と支払い方法は独立か、有意水準5%で検定せよ（自由度2の χ² の上側5%点は5.991）。
  answer: 列計は 現金50・カード80・スマホ70、総計200。期待度数は各店で 25・40・35。χ²＝(25÷25＋0＋25÷35)×2≒(1＋0.714)×2＝**3.43**、自由度＝(2−1)(3−1)＝**2**。3.43＜5.991 で独立を**棄却しない**（p≒0.18）。「店によって支払い方法が違うとは言えない」。
  checks:
    - '100*50/200 == 25 and 100*80/200 == 40 and 100*70/200 == 35 and abs((25/25+25/35)*2 - 3.43) < 0.005 and (2-1)*(3-1) == 2 and abs(1-(lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(3.4286,2) - 0.18) < 0.005'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 3, t: [[30, 40, 30], [20, 40, 40]]}
    task: A店 30・40・30、B店 20・40・40。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 3.4286
    why: 期待度数は 25・40・35。カードの列はずれがなく、現金とスマホのずれだけが χ² に効く。自由度は2。

- id: Q-U27-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 新しい接客を試した10人中3人、従来の10人中8人が購入した（新の購入なしは7人、従来は2人）。χ² を計算すると5.05 で、自由度1の点3.841 を超える。この結論をそのまま使ってよいか。期待度数を求めて答えよ。
  answer: 列計は購入11・なし9、総計20。期待度数は 購入 10×11÷20＝5.5、なし **4.5**（両方の行で同じ）。期待度数が5未満のセルがあり、χ² 近似は粗い。少ない件数のときは直接計算する方法（フィッシャーの正確検定）を使うと p≒0.07 で、5%では棄却できない。結論が変わりうるので、そのまま使わない。
  checks:
    - '10*11/20 == 5.5 and 10*9/20 == 4.5 and abs(2.5**2*(2/5.5+2/4.5) - 5.05) < 0.005 and abs(sum(comb(11,k)*comb(9,10-k) for k in (0,1,2,3,8,9,10))/comb(20,10) - 0.07) < 0.001'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[3, 7], [8, 2]]}
    task: 新 3・7、従来 8・2（各10人）。いちばん小さい期待度数は（小数で）？
    predict: {type: number, key: emin, label: "最小の期待度数"}
    expect: 4.5
    why: 4.5 は目安の5より小さい。ラボの χ²≒5.05・p≒0.025 は近似の値で、件数が少ないと当てにならない。

- id: Q-U27-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 平日5日の来店客200人の内訳は 月48・火35・水42・木30・金45 人だった。曜日によって偏りがあるかを、有意水準5%で検定せよ（自由度4の χ² の上側5%点は9.488）。
  answer: 期待度数は各40。χ²＝(64＋25＋4＋100＋25)÷40＝218÷40＝**5.45**、自由度4。5.45＜9.488 で H₀ を**棄却しない**（p≒0.24）。「曜日による偏りがあるとは言えない」。
  checks:
    - '200/5 == 40 and (8**2+5**2+2**2+10**2+5**2) == 218 and 218/40 == 5.45 and 5.45 < 9.488 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(9.488,4) - 0.95) < 0.0005'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 5, m: 0, o: [48, 35, 42, 30, 45], w: [1, 1, 1, 1, 1]}
    task: 平日5日で 48・35・42・30・45 人。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 5.45
    why: 期待度数40、ずれの2乗の和218÷40＝5.45。木曜の少なさがいちばん効く（100÷40＝2.5）。

- id: Q-U27-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: '{{unit:U26}} の例題（A店100人中20人、B店100人中30人が購入）を2×2 の表にして χ² を求めよ。2つの比率の差の z≒−1.633 とどう関係するか（自由度1の χ² の上側5%点は3.841）。'
  answer: 列計は購入50・なし150、総計200。期待度数は 購入25・なし75（両方の行で同じ）。χ²＝(25÷25)×2＋(25÷75)×2≒2＋0.667＝**2.667**。z²＝1.633²≒2.667 と同じ。3.841（＝1.96²）に届かないので棄却しない。2×2 の表の χ² 検定と、2つの比率の両側 z 検定は同じ結論になる。
  checks:
    - '100*50/200 == 25 and 100*150/200 == 75 and abs(2*25/25+2*25/75 - 2.667) < 0.0005 and abs((0.1/math.sqrt(0.25*0.75*0.02))**2 - 2.667) < 0.0005 and abs(1.96**2 - 3.8416) < 1e-9'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[20, 80], [30, 70]]}
    task: A店 20・80、B店 30・70。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 2.6667
    why: z≒−1.633 の2乗と同じ2.667。p≒0.10 も z 検定と一致する。

- id: Q-U27-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 新しいパッケージを100人に見せると60人が「新しい方が好き」と答えた。好みは半々（50対50）と違うか。① 適合度の χ² ② 比率の z（{{unit:U26}}）で求め、両者の関係を述べよ。（Φ(2)＝0.9772）
  answer: ① 期待度数50・50、χ²＝100÷50＋100÷50＝**4**、自由度1。② SE＝√(0.5×0.5÷100)＝0.05、z＝0.1÷0.05＝**2**。z²＝4＝χ²。p 値はどちらも 2×(1−0.9772)≒**0.046** で、5%で棄却する。
  checks:
    - '100/50+100/50 == 4 and math.sqrt(0.25/100) == 0.05 and abs(0.1/0.05 - 2) < 1e-9 and abs(2*(1-0.9772) - 0.046) < 0.0005 and abs(1-math.erf(math.sqrt(4/2)) - 0.0455) < 0.0001'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 2, m: 0, o: [60, 40], w: [1, 1]}
    task: 50対50 のはずが 60 と 40。p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0455
    why: χ²＝4（自由度1）の上側の確率は、z＝2 の両側の確率と同じ約0.046。

- id: Q-U27-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 100日間の1日の不良品の数を数えると、0個35日・1個38日・2個19日・3個以上8日だった（3個以上はすべて3個とすると平均は1.0）。平均をデータから推定した λ＝1 のポアソン分布（{{unit:U15}}）に合うかを、適合度の χ² で検定する。期待度数はおよそ 36.8・36.8・18.4・8.0 で、χ²≒0.147。自由度はいくつか。5%で判断せよ（自由度2の上側5%点は5.991、自由度3は7.815）。
  answer: 区分は4つ、λ をデータから推定したので自由度＝4−1−1＝**2**。0.147＜5.991 で H₀ を**棄却しない**。「ポアソン分布に合わないとは言えない」。推定した母数を引き忘れると自由度3・境目7.815 になり、ずれに甘くなる。
  checks:
    - '(38*1+19*2+8*3)/100 == 1.0 and abs(100*math.exp(-1) - 36.8) < 0.05 and abs(100*math.exp(-1)/2 - 18.4) < 0.05 and abs(100*(1-2.5*math.exp(-1)) - 8.0) < 0.05 and abs(sum((o-e)**2/e for o,e in zip([35,38,19,8],[100*math.exp(-1),100*math.exp(-1),50*math.exp(-1),100*(1-2.5*math.exp(-1))])) - 0.147) < 0.0005 and 4-1-1 == 2'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 4, m: 1, o: [35, 38, 19, 8], w: [0.3679, 0.3679, 0.1839, 0.0803]}
    task: 4区分、λ をデータから推定。比べる境目（上側5%点）は（小数で）？
    predict: {type: number, key: crit, label: "境目"}
    expect: 5.991
    why: 自由度＝4−1−1＝2 なので5.991。「推定した母数」を0個にすると自由度3・境目7.815 になる。棒グラフでは観測と期待がほぼ重なる。

- id: Q-U27-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 3つの年代（各100人）に好きな商品A・B・Cを1つ選んでもらった。若年 50・30・20、中年 40・35・25、高年 25・35・40。年代と好みは独立か、有意水準5%で検定せよ（自由度4の χ² の上側5%点は9.488）。
  answer: 列計は A115・B100・C85、総計300。期待度数は各年代で 38.33・33.33・28.33。χ²≒**16.41**、自由度＝(3−1)(3−1)＝**4**。16.41＞9.488（p≒0.0025）で独立を**棄却**。「年代と好みには関連がある」。帯グラフで、若年はA、高年はCが多い。
  checks:
    - 'abs(100*115/300 - 38.33) < 0.005 and abs(100*85/300 - 28.33) < 0.005 and abs(sum((o-e)**2/e for row in [[50,30,20],[40,35,25],[25,35,40]] for o,e in zip(row,[115/3,100/3,85/3])) - 16.41) < 0.005 and (3-1)*(3-1) == 4 and abs(1-(lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(16.4079,4) - 0.0025) < 0.0002'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 3, c: 3, t: [[50, 30, 20], [40, 35, 25], [25, 35, 40]]}
    task: 3年代×3商品の表。5%で H₀（独立）をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: χ²≒16.41 が9.488 を大きく超える。帯の区切りが年代ごとに大きくずれている。

- id: Q-U27-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 例題A（チラシA 30・20、B 20・30）と割合は同じで、各500人（A 300・200、B 200・300）だったときの χ² を求めよ。また、例題Aの表を割合（%）にして 60・40・40・60 を件数のように計算すると χ² はいくつになり、なぜ誤りか。
  answer: 各500人：期待度数250、χ²＝(50²÷250)×4＝**40**。割合が同じでも件数が10倍なら χ² も10倍。%を件数として計算すると、総計200・期待度数50 となり χ²＝(10²÷50)×4＝**8** になる。実際の件数（100人）と違う数で計算しているので誤り。χ² には必ず件数を入れる。
  checks:
    - '500*500/1000 == 250 and 50**2/250*4 == 40 and 100*100/200 == 50 and 10**2/50*4 == 8'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[300, 200], [200, 300]]}
    task: 各500人で A 300・200、B 200・300。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 40
    why: 例題Aの10倍の件数で χ² も10倍。帯グラフの形は例題Aとまったく同じ。

- id: Q-U27-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: カイ二乗検定について、正しいものはどれか。
  choices:
    - 独立性の検定では、期待度数を「行計×列計÷総計」で求める。
    - 2×3 のクロス集計表の独立性の検定の自由度は5である。
    - χ² の値は、件数の代わりに割合（%）を入れて計算してもよい。
    - 独立性の検定で棄却されれば、行の分類が列の分類の原因であると言える。
    - 期待度数が小さいセルが多いほど、χ² 分布による近似はよくなる。
  correct: 1
  answer: 独立なら P(行かつ列)＝P(行)×P(列) なので、期待度数＝総計×(行計÷総計)×(列計÷総計)＝行計×列計÷総計。例題Aでは 50×50÷100＝25。
  misconceptions:
    2: 自由度は (行の数−1)×(列の数−1)＝1×2＝2。セルの数−1 ではない
    3: 割合では件数の多さが消える。割合が同じでも件数が10倍なら χ² は10倍
    4: 棄却しても関連があるまで。原因かどうかは言えない
    5: 期待度数が小さい（目安5未満）と近似は粗くなる
  checks:
    - '50*50/100 == 25 and (2-1)*(3-1) == 2'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[30, 20], [20, 30]]}
    task: 例題Aの表。行1列1の期待度数は（小数で）？
    predict: {type: number, key: e11, label: "E₁₁"}
    expect: 25
    why: 50×50÷100＝25。帯グラフの点線（全体の区切り）が50%の位置にある。

- id: Q-U27-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 2店で満足度（満足・ふつう・不満）を100人ずつ聞いた。A店 60・30・10、B店 45・35・20。店と満足度は独立か、有意水準5%で検定し、結論を報告の文で書け（自由度2の χ² の上側5%点は5.991）。
  answer: 列計は 105・65・30、総計200。期待度数は各店 52.5・32.5・15。χ²≒**5.86**、自由度2。5.86＜5.991（p≒0.053）でわずかに届かず、独立を**棄却しない**。「店によって満足度の分布が違うとは言えない（有意水準5%）。ただし B店は不満が20%と A店の2倍で、境目に近い。人数を増やして確かめる」。
  checks:
    - '100*105/200 == 52.5 and 100*65/200 == 32.5 and 100*30/200 == 15 and abs(sum((o-e)**2/e for row in [[60,30,10],[45,35,20]] for o,e in zip(row,[52.5,32.5,15])) - 5.86) < 0.005 and 5.86 < 5.991 and abs(1-(lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(5.8608,2) - 0.053) < 0.0005'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 3, t: [[60, 30, 10], [45, 35, 20]]}
    task: A店 60・30・10、B店 45・35・20。p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0534
    why: χ²≒5.86、p≒0.053。わずかに5%を超える。いちばん効いているのは「不満」の列。

- id: Q-U27-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 3台のレジは同じように使われるはずだが、150人の利用は 62・48・40 人だった。使われ方に偏りがあるか、有意水準5%で検定せよ（自由度2の χ² の上側5%点は5.991）。
  answer: 期待度数は各50。χ²＝(144＋4＋100)÷50＝**4.96**、自由度2。4.96＜5.991（p≒0.084）で H₀ を**棄却しない**。「偏りがあるとは言えない」。入口に近いレジ1が多めに見えるが、150人では偶然の範囲。
  checks:
    - '150/3 == 50 and (12**2+2**2+10**2)/50 == 4.96 and 4.96 < 5.991 and abs(1-(lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(4.96,2) - 0.084) < 0.0005'
  lab:
    id: LAB-chisq
    mode: gof
    set: {alpha: 0.05, k: 3, m: 0, o: [62, 48, 40], w: [1, 1, 1]}
    task: 3台で 62・48・40 人。5%で H₀（均等）をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却しない
    why: χ²＝4.96 は5.991 に届かない（p≒0.084）。同じ割合で300人なら χ²＝9.92 で棄却する。

- id: Q-U27-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 会員200人のうち120人、非会員150人のうち60人が翌月もまた来店した。会員かどうかと再来店は独立か、5%で検定せよ（自由度1の χ² の上側5%点は3.841）。結果から「会員にすれば再来店が増える」と言えるか。
  answer: 列計は 再来店180・なし170、総計350。期待度数は 会員 102.86・97.14、非会員 77.14・72.86。χ²≒**13.73**＞3.841（p≒0.0002）で独立を**棄却**。再来店率は 会員60%・非会員40%。ただし言えるのは「関連がある」まで。もともと来店の多い客が会員になっている可能性があり、「会員にすれば増える」とは言えない。
  checks:
    - 'abs(200*180/350 - 102.86) < 0.005 and abs(150*170/350 - 72.86) < 0.005 and abs(sum((o-e)**2/e for o,e in zip([120,80,60,90],[200*180/350,200*170/350,150*180/350,150*170/350])) - 13.73) < 0.005 and 120/200 == 0.6 and 60/150 == 0.4'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 2, c: 2, t: [[120, 80], [60, 90]]}
    task: 会員 120・80、非会員 60・90。χ² は（小数で）？
    predict: {type: number, key: chi2, label: "χ²"}
    expect: 13.7255
    why: χ²≒13.73 で強い関連。ただし関連は原因を示さない。帯の区切りのずれは、どちらが原因でも同じように出る。

- id: Q-U27-040
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 2×2 の表では、行計と列計が決まっていると、1つのセルを決めれば残りの3つは決まる。3×3 の表では、自由に決められるセルはいくつか。それが独立性の検定の自由度と一致することを確かめよ。
  answer: 各行の最後のセルは行計から、最後の行は列計から決まるので、自由に決められるのは (3−1)×(3−1)＝**4** セル。自由度 (行−1)(列−1)＝4 と一致する。2×3 なら (2−1)×(3−1)＝2。
  checks:
    - '(3-1)*(3-1) == 4 and (2-1)*(3-1) == 2 and (2-1)*(2-1) == 1'
  lab:
    id: LAB-chisq
    mode: indep
    set: {alpha: 0.05, r: 3, c: 3, t: [[50, 30, 20], [40, 35, 25], [25, 35, 40]]}
    task: 3×3 の表。独立性の検定の自由度は？
    predict: {type: number, key: df, label: "自由度"}
    expect: 4
    why: (3−1)×(3−1)＝4。行や列を2に減らすと、自由度は2や1になる。
