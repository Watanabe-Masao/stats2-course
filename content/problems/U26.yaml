# 単元U26の問題。id は変えない（個人の解答記録がこの id を指す）。
# Φ(z)＝0.5*(1+math.erf(z/math.sqrt(2)))
- id: Q-U26-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    新しいパッケージを試すと、400人中220人が「こちらが好き」と答えた。好みは半々（p₀＝0.5）と違うと言えるか。両側5%で検定せよ。（Φ(2)＝0.9772）

    p̂＝□÷□＝□。SE＝√(□×□÷400)＝□。z＝(□−0.5)÷□＝□。p 値＝2×(1−Φ(□))＝□。p □ 0.05 なので H₀ を □。
  answer_title: 答え（埋めてから開く）
  answer: p̂＝220÷400＝**0.55**。SE＝√(0.5×0.5÷400)＝**0.025**。z＝(0.55−0.5)÷0.025＝**2**。p 値＝2×(1−0.9772)＝**0.0456**。p ≦ 0.05 なので H₀ を**棄却**。「好みは半々とは違う（新しい方が好まれる）と言える」。SE には p̂＝0.55 ではなく H₀ の0.5 を使う。
  checks:
    - '220/400 == 0.55 and math.sqrt(0.5*0.5/400) == 0.025 and abs((0.55-0.5)/0.025 - 2) < 1e-9 and abs(2*(1-0.9772) - 0.0456) < 1e-9 and abs(0.5*(1+math.erf(2/math.sqrt(2))) - 0.9772) < 0.00005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: two, alpha: 0.05, x: 220, n: 400, p0: 0.5}
    task: 400人中220人、基準 p₀＝0.5。両側の z は（小数で）？
    predict: {type: number, key: z, label: "z"}
    expect: 2
    why: SE＝√(0.25÷400)＝0.025、z＝0.05÷0.025＝2。p≒0.046 で5%以下。

- id: Q-U26-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 例題A②と同じ比率で、A店は200人中40人、B店は200人中60人が購入した。両側5%で、購入率に差があるかを検定し、例題A②と結論を比べよ。（Φ(2.31)＝0.9896）
  answer: p̄＝100÷400＝0.25、SE＝√(0.25×0.75×(1÷200＋1÷200))＝√0.001875≒0.0433、z＝(0.2−0.3)÷0.0433≒**−2.31**。|z|＞1.96（p≒0.021）で H₀ を**棄却**。比率は同じでも人数が増えると SE が小さくなり、同じ10ポイントの差が有意になる。各100人の例題A②は「差があるとは言えない」だった。
  checks:
    - '(40+60)/400 == 0.25 and abs(math.sqrt(0.25*0.75*(1/200+1/200)) - 0.0433) < 0.00005 and abs(-0.1/math.sqrt(0.001875) + 2.31) < 0.005 and abs(2*(1-0.9896) - 0.021) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p2
    set: {side: two, alpha: 0.05, x1: 40, n1: 200, x2: 60, n2: 200}
    task: A店200人中40人、B店200人中60人。両側5%で「差がない」をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: z≒−2.31、p≒0.021。各100人に戻すと z≒−1.63 で棄却しない。

- id: Q-U26-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: これまでの不良率は5%。新しい工程で400個を調べると28個が不良だった。不良率が**上がった**かを右片側5%で検定せよ（右片側5%の境目は1.645、Φ(1.84)＝0.9671）。
  answer: p̂＝28÷400＝0.07。SE＝√(0.05×0.95÷400)≒0.0109、z＝0.02÷0.0109≒**1.84**。z＞1.645（p≒0.033）で H₀ を**棄却**。「不良率は上がったと言える（有意水準5%）」。
  checks:
    - '28/400 == 0.07 and abs(math.sqrt(0.05*0.95/400) - 0.0109) < 0.00005 and abs(0.02/math.sqrt(0.05*0.95/400) - 1.84) < 0.005 and abs(1-0.9671 - 0.033) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: upper, alpha: 0.05, x: 28, n: 400, p0: 0.05}
    task: 400個中28個が不良、基準5%。右片側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0332
    why: z≒1.84、右側の面積は約0.033。両側にすると約0.066 で5%を超える。片側か両側かは先に決める。

- id: Q-U26-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 袋詰めの重さの分散の基準は σ₀²＝4（g²）。機械を替えて16袋を測ると、不偏分散は s²＝7 だった。ばらつきが**大きくなった**かを右片側5%で検定せよ（χ²(15) の上側5%点は24.996）。前提も1つ書け。
  answer: χ²＝(16−1)×7÷4＝**26.25**（自由度15）。26.25＞24.996 なので H₀ を**棄却**（p≒0.035）。「ばらつきは大きくなったと言える」。前提：重さが正規分布に従うこと。正規分布から外れると、この検定は当てにならない。
  checks:
    - '15*7/4 == 26.25 and 26.25 > 24.996 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(24.996,15) - 0.95) < 0.0005'
  lab:
    id: LAB-ptest
    mode: var
    set: {side: upper, alpha: 0.05, n: 16, s2: 7, v0: 4}
    task: 基準 σ₀²＝4、16袋の s²＝7。右片側5%で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: χ²＝26.25 が境目24.996 を超える（p≒0.035）。s²＝6 にすると χ²＝22.5 で棄却しない。

- id: Q-U26-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 店Aの13日分の売上の不偏分散は900、店Bの11日分は400（千円²）。2店の売上のばらつきが違うかを両側5%で F 検定せよ（F(12, 10) の上側2.5%点は3.621）。{{unit:U23}} の分散の比の区間（約0.62〜7.59）との関係も述べよ。
  answer: F＝900÷400＝**2.25**（自由度12, 10）。2.25＜3.621 なので H₀ を**棄却しない**（p≒0.21）。「ばらつきが違うとは言えない」。分散の比の95%区間が1を含むことと、両側5%で「比＝1」を棄却しないことは一致する。
  checks:
    - '900/400 == 2.25 and 2.25 < 3.621 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.621,12,10) - 0.975) < 0.0005'
  lab:
    id: LAB-ptest
    mode: ratio
    set: {side: two, alpha: 0.05, n1: 13, s1: 900, n2: 11, s2: 400}
    task: 店A（13日、s²＝900）と店B（11日、s²＝400）。両側5%で H₀（ばらつきが同じ）をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却しない
    why: F＝2.25 は上側の点3.621 より小さい（p≒0.21）。分散が2倍以上違って見えても、10日ほどでは偶然の範囲。

- id: Q-U26-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 例年の来店客の会員率は30%。今月100人中40人が会員だった。会員率が変わったかを両側5%で検定せよ。検定の SE と、区間推定の SE（p̂ で作る）をそれぞれ求めよ。（Φ(2.18)＝0.9854）
  answer: 検定の SE＝√(0.3×0.7÷100)≒**0.0458**、z＝0.1÷0.0458≒**2.18**、p≒0.029 で H₀ を**棄却**。区間推定の SE＝√(0.4×0.6÷100)≒**0.049**。検定は「H₀ が正しいとしたら」なので p₀＝0.3 を使い、区間は「本当の比率はどこか」なので p̂＝0.4 を使う。
  checks:
    - 'abs(math.sqrt(0.21/100) - 0.0458) < 0.00005 and abs(0.1/math.sqrt(0.0021) - 2.18) < 0.005 and abs(2*(1-0.9854) - 0.029) < 0.0005 and abs(math.sqrt(0.24/100) - 0.049) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: two, alpha: 0.05, x: 40, n: 100, p0: 0.3}
    task: 100人中40人、基準 p₀＝0.3。検定の SE は（小数で）？
    predict: {type: number, key: se, label: "検定の SE"}
    expect: 0.0458
    why: √(0.3×0.7÷100)≒0.0458。「くわしく」の区間推定の SE（p̂ で作る）は約0.049。

- id: Q-U26-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: キャンペーンAは1000人中200人、Bは1000人中240人が購入した。差は4ポイント。両側5%で、購入率に差があるかを検定せよ。（Φ(2.16)＝0.9846）
  answer: p̄＝440÷2000＝0.22、SE＝√(0.22×0.78×(1÷1000＋1÷1000))≒0.0185、z＝−0.04÷0.0185≒**−2.16**。|z|＞1.96（p≒0.031）で H₀ を**棄却**。人数が多いと、4ポイントの差でも有意になる。差が実務上大きいかは別に判断する。
  checks:
    - '440/2000 == 0.22 and abs(math.sqrt(0.22*0.78*0.002) - 0.0185) < 0.00005 and abs(-0.04/math.sqrt(0.22*0.78*0.002) + 2.16) < 0.005 and abs(2*(1-0.9846) - 0.031) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p2
    set: {side: two, alpha: 0.05, x1: 200, n1: 1000, x2: 240, n2: 1000}
    task: A 1000人中200人、B 1000人中240人。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0308
    why: z≒−2.16、p≒0.031。各100人（20人と24人）なら z≒−0.68 で、とても有意にならない。

- id: Q-U26-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: コインを20回投げて表が15回。表の確率は0.5 と違うかを、① 正規近似の z で ② 二項分布（{{unit:U14}}）で直接、両側5%で調べよ。P(X≧15)＝0.0207（X〜B(20, 0.5)）、Φ(2.24)＝0.9875。
  answer: ① SE＝√(0.25÷20)≒0.1118、z＝0.25÷0.1118≒**2.24**、p≒**0.025** → 棄却。② 両側 p＝2×0.0207＝**0.041** → 棄却。結論は同じだが、n＝20 では正規近似の p 値は小さめに出る。np₀＝10 と境目に近い。
  checks:
    - 'abs(math.sqrt(0.25/20) - 0.1118) < 0.00005 and abs(0.25/math.sqrt(0.0125) - 2.24) < 0.005 and abs(2*(1-0.9875) - 0.025) < 1e-9 and abs(sum(comb(20,i) for i in range(15,21))/2**20 - 0.0207) < 0.00005 and abs(2*0.0207 - 0.041) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: two, alpha: 0.05, x: 15, n: 20, p0: 0.5}
    task: 20回中15回、p₀＝0.5。正規近似の z は（小数で）？
    predict: {type: number, key: z, label: "z"}
    expect: 2.2361
    why: z≒2.24、p≒0.025。「くわしく」の二項分布の p 値は約0.041。人数が少ないと、近似の p 値は直接計算とずれる。

- id: Q-U26-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 新旧のレジで1回の処理時間を16回ずつ測ると、旧レジの不偏分散は2.5、新レジは1（秒²）だった。① 両側5%（F(15, 15) の上側2.5%点2.862）② 「新レジの方がばらつきが小さい」を示したいので右片側5%（σ_旧²＞σ_新²、上側5%点2.403）で、それぞれ検定せよ。どちらを使うかはいつ決めるか。
  answer: F＝2.5÷1＝**2.5**（自由度15, 15）。① 2.5＜2.862 → **棄却しない**（p≒0.086）。② 2.5＞2.403 → **棄却**（p≒0.043）。片側か両側かで結論が変わるので、**データを見る前に**決める。
  checks:
    - '2.5/1 == 2.5 and 2.5 < 2.862 and 2.5 > 2.403 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(2.862,15,15) - 0.975) < 0.0005 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(2.403,15,15) - 0.95) < 0.0005'
  lab:
    id: LAB-ptest
    mode: ratio
    set: {side: two, alpha: 0.05, n1: 16, s1: 2.5, n2: 16, s2: 1}
    task: 旧レジ s²＝2.5、新レジ s²＝1（各16回）。両側5%で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却しない
    why: F＝2.5 は上側2.5%点2.862 より小さい（p≒0.086）。右片側に切り替えると境目は2.403 で棄却する。

- id: Q-U26-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 部品の長さの分散は σ₀²＝9（mm²）だった。新しい機械で21個を作ると、不偏分散は4.5。ばらつきが**小さくなった**と言えるか、左片側5%で検定せよ（χ²(20) の下側5%点は10.851）。
  answer: χ²＝20×4.5÷9＝**10**（自由度20）。10＜10.851 なので H₀ を**棄却**（p≒0.032）。「ばらつきは小さくなったと言える」。左片側では、χ² が**下側**の点より小さいときに棄却する。
  checks:
    - '20*4.5/9 == 10 and 10 < 10.851 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(10.851,20) - 0.05) < 0.0005 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(10,20) - 0.032) < 0.0005'
  lab:
    id: LAB-ptest
    mode: var
    set: {side: lower, alpha: 0.05, n: 21, s2: 4.5, v0: 9}
    task: σ₀²＝9、21個の s²＝4.5。左片側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0318
    why: χ²＝10 は左側の境目10.851 より小さく、左側の面積は約0.032。

- id: Q-U26-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 不良率5%の工程で30個を調べると4個が不良。不良率が上がったかを右片側5%で調べたい。正規近似の z を使ってよいか。二項分布で直接計算した P(X≧4)＝0.0608 を使うと結論はどうなるか（X〜B(30, 0.05)）。
  answer: np₀＝30×0.05＝**1.5** で5より小さく、正規近似は使えない（近似の z≒2.09・p≒0.018 では誤って棄却してしまう）。二項分布の p 値は**0.0608**＞0.05 なので**棄却しない**。「不良率が上がったとは言えない」。
  checks:
    - 'abs(30*0.05 - 1.5) < 1e-12 and abs(sum(comb(30,i)*0.05**i*0.95**(30-i) for i in range(4,31)) - 0.0608) < 0.00005 and abs((4/30-0.05)/math.sqrt(0.05*0.95/30) - 2.09) < 0.005 and abs(1-0.5*(1+math.erf(2.0943/math.sqrt(2))) - 0.018) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: upper, alpha: 0.05, x: 4, n: 30, p0: 0.05}
    task: 30個中4個、基準5%、右片側。二項分布で直接計算した p 値は（小数で）？
    predict: {type: number, key: pexact, label: "二項分布の p 値"}
    expect: 0.0608
    why: P(X≧4)≒0.061 で棄却しない。正規近似の p 値（約0.018）は小さすぎる。np₀＝1.5 では近似が崩れる。

- id: Q-U26-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 比率・分散の検定について、正しいものはどれか。
  choices:
    - 1つの比率の検定では、標準誤差を観測した比率 p̂ で計算する。
    - 2つの比率の差の検定（H₀：p₁＝p₂）では、2群を合わせた比率で標準誤差を作る。
    - 母分散の検定統計量 (n−1)s²÷σ₀² は、標準正規分布に従う。
    - 分散の比の両側検定では、上側の点と比べるだけでよく、下側を考える必要はない。
    - 比率の検定で棄却できなかったので、2つの比率は等しいことが示された。
  correct: 2
  answer: 「差がない」と仮定するので、2群は同じ比率 p̄＝(x₁＋x₂)÷(n₁＋n₂) を持つとして SE を作る。A店100人中20人・B店100人中30人なら p̄＝0.25、SE≒0.0612。
  misconceptions:
    1: 検定の SE は H₀ の p₀ で作る。p̂ で作るのは区間推定
    3: 正規母集団なら自由度 n−1 の χ² 分布に従う
    4: 両側では下側の点（＝1÷F(n₂−1, n₁−1) の上側の点）も使う。大きい方の s² を分子に置けば上側だけ見ればよいが、そのときは α÷2 の点と比べる
    5: 棄却しないのは「差があるとは言えない」。人数を増やすと有意になることもある
  checks:
    - '(20+30)/200 == 0.25 and abs(math.sqrt(0.25*0.75*0.02) - 0.0612) < 0.00005'
  lab:
    id: LAB-ptest
    mode: p2
    set: {side: two, alpha: 0.05, x1: 20, n1: 100, x2: 30, n2: 100}
    task: A店100人中20人、B店100人中30人。H₀ のもとでの合わせた比率 p̄ は（小数で）？
    predict: {type: number, key: pool, label: "p̄"}
    expect: 0.25
    why: (20＋30)÷200＝0.25。SE はこの p̄ で作る。「くわしく」の区間推定の SE（各群の p̂）と比べる。

- id: Q-U26-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: キャンペーンAは500人中90人、Bは500人中60人が購入した。両側5%で購入率の差を検定し、{{unit:U23}} で作った差の95%区間（0.016〜0.104）と合わせて報告の文を書け。（Φ(2.66)＝0.9961）
  answer: p̄＝150÷1000＝0.15、SE＝√(0.15×0.85×(1÷500＋1÷500))≒0.0226、z＝0.06÷0.0226≒**2.66**、p≒0.008 で H₀ を**棄却**。「Aの購入率はBより高いと言える（有意水準5%）。差は6ポイント、95%区間は約1.6〜10.4ポイント」。
  checks:
    - '150/1000 == 0.15 and abs(math.sqrt(0.15*0.85*0.004) - 0.0226) < 0.00005 and abs(0.06/math.sqrt(0.15*0.85*0.004) - 2.66) < 0.005 and abs(2*(1-0.9961) - 0.008) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p2
    set: {side: two, alpha: 0.05, x1: 90, n1: 500, x2: 60, n2: 500}
    task: A 500人中90人、B 500人中60人。両側の z は（小数で）？
    predict: {type: number, key: z, label: "z"}
    expect: 2.6568
    why: z≒2.66、p≒0.008。差の区間が0を含まないことと一致する。

- id: Q-U26-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 内容量の標準偏差の基準は2g（σ₀²＝4）。25袋を測ると標準偏差 s＝2.6g だった。ばらつきが基準より大きいかを右片側5%で検定し、品質管理の報告を書け（χ²(24) の上側5%点は36.415）。
  answer: s²＝6.76、χ²＝24×6.76÷4＝**40.56**（自由度24）。40.56＞36.415 で H₀ を**棄却**（p≒0.019）。「内容量のばらつきは基準より大きいと言える。機械の調整を検討する」。分散で計算すること（s をそのまま入れない）に注意。
  checks:
    - 'abs(2.6**2 - 6.76) < 1e-9 and abs(24*6.76/4 - 40.56) < 1e-9 and 40.56 > 36.415 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(36.415,24) - 0.95) < 0.0005'
  lab:
    id: LAB-ptest
    mode: var
    set: {side: upper, alpha: 0.05, n: 25, s2: 6.76, v0: 4}
    task: σ₀²＝4、25袋の s²＝6.76。右片側5%で H₀ をどうするか。
    predict: {type: choice, key: decision, label: "H₀ を", options: [棄却する, 棄却しない]}
    expect: 棄却する
    why: χ²＝40.56 が境目36.415 を超える（p≒0.019）。

- id: Q-U26-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 例年の満足率は60%。今年250人に聞くと135人が満足だった。満足率が変わったかを両側5%で検定し、結論を書け。「下がった」かを先に決めて左片側で調べていたら、結論はどうなったか。（Φ(1.94)＝0.9738）
  answer: p̂＝0.54、SE＝√(0.6×0.4÷250)≒0.031、z＝−0.06÷0.031≒**−1.94**。両側 p＝2×(1−0.9738)≒**0.052**＞0.05 → **棄却しない**（「変わったとは言えない」）。左片側なら p≒0.026 で棄却し「下がったと言える」。どちらで調べるかは、データを見る前に決めておく。
  checks:
    - '135/250 == 0.54 and abs(math.sqrt(0.24/250) - 0.031) < 0.00005 and abs(-0.06/math.sqrt(0.24/250) + 1.94) < 0.005 and abs(2*(1-0.9738) - 0.052) < 0.0005 and abs(1-0.9738 - 0.026) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p1
    set: {side: two, alpha: 0.05, x: 135, n: 250, p0: 0.6}
    task: 250人中135人、基準 p₀＝0.6。両側の p 値は（小数で）？
    predict: {type: number, key: p, label: "p 値"}
    expect: 0.0528
    why: z≒−1.94、p≒0.053。わずかに5%を超える。左片側に切り替えると約0.026。

- id: Q-U26-040
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 例題A②（A店100人中20人、B店100人中30人）の z≒−1.633 を2乗するといくつか。これは2×2 の表の χ² 検定（{{unit:U27}}）の統計量と一致する。自由度1の χ² の上側5%点3.841 と比べて結論を述べよ。
  answer: z²≒1.633²≒**2.667**。2.667＜3.841（＝1.96²）なので棄却しない。両側の z 検定と2×2 の表の χ² 検定は同じ結論になる（p≒0.10）。
  checks:
    - 'abs((0.1/math.sqrt(0.25*0.75*0.02))**2 - 2.667) < 0.0005 and abs(1.96**2 - 3.8416) < 1e-9 and abs(math.erf(math.sqrt(3.841/2)) - 0.95) < 0.0005'
  lab:
    id: LAB-ptest
    mode: p2
    set: {side: two, alpha: 0.05, x1: 20, n1: 100, x2: 30, n2: 100}
    task: A店100人中20人、B店100人中30人。z² は（小数で）？（「くわしく」に出る）
    predict: {type: number, key: chi2, label: "z²"}
    expect: 2.6667
    why: z²＝(−1.633)²≒2.667。自由度1の χ² の点3.841 は1.96² と同じ。
