# 単元U29の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U29-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    4日間のチラシの枚数 x（百枚）と売上 y（万円）は (1,2)(2,3)(3,6)(4,7)。回帰直線を求め、x＝3 の予測値と残差を出せ。

    x̄＝□、ȳ＝□。偏差の積の和＝□、x の偏差平方和＝□。b＝□÷□＝□、a＝□−□×□＝□。x＝3 の予測 ŷ＝□、残差＝6−□＝□。
  answer_title: 答え（埋めてから開く）
  answer: x̄＝**2.5**、ȳ＝**4.5**。偏差の積の和＝(−1.5)(−2.5)＋(−0.5)(−1.5)＋0.5×1.5＋1.5×2.5＝**9**、x の偏差平方和＝**5**。b＝9÷5＝**1.8**、a＝4.5−1.8×2.5＝**0**。ŷ＝1.8x。x＝3 の予測 ŷ＝**5.4**、残差＝6−5.4＝**0.6**。
  checks:
    - '(1+2+3+4)/4 == 2.5 and (2+3+6+7)/4 == 4.5 and abs(sum((x-2.5)*(y-4.5) for x,y in [(1,2),(2,3),(3,6),(4,7)]) - 9) < 1e-12 and sum((x-2.5)**2 for x in (1,2,3,4)) == 5 and 9/5 == 1.8 and abs(4.5-1.8*2.5) < 1e-12 and abs(1.8*3 - 5.4) < 1e-12 and abs(6-5.4 - 0.6) < 1e-12'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,2 2,3 3,6 4,7", px: 3}
    task: 4点 (1,2)(2,3)(3,6)(4,7) に最小二乗で直線を引く。傾き b は（小数で）？
    predict: {type: number, key: b, label: "傾き b"}
    expect: 1.8
    why: b＝9÷5＝1.8、a＝0。点を1つ動かすと、直線は (x̄, ȳ) を通ったまま傾きが変わる。

- id: Q-U29-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 例題Aの回帰直線 ŷ＝2.3＋0.9x で、広告4回の週の来店者数は6（百人）だった。予測値と残差を求めよ。また、残差の標準偏差を √(SSE÷(n−2)) で求めるとき、n−2 で割るのはなぜか（SSE＝1.9）。
  answer: ŷ＝2.3＋0.9×4＝**5.9**、残差＝6−5.9＝**0.1**。s_e＝√(1.9÷3)≒**0.796**。直線を決めるのに切片 a と傾き b の**2つ**をデータから推定したので、残差の自由度は n−2 になる。
  checks:
    - 'abs(2.3+0.9*4 - 5.9) < 1e-12 and abs(6-5.9 - 0.1) < 1e-12 and abs(math.sqrt(1.9/3) - 0.796) < 0.0005'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,3 2,5 3,4 4,6 5,7", px: 4}
    task: 例題Aの5点で、広告4回のときの予測値 ŷ は（小数で）？
    predict: {type: number, key: yhat, label: "ŷ（百人）"}
    expect: 5.9
    why: 2.3＋0.9×4＝5.9。実際は6 なので残差は0.1。表で残差の合計が0 になることも見る。

- id: Q-U29-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 5店の広告費 x（万円）と売上 y（万円）について、x̄＝10、ȳ＝50、Σ(x−x̄)²＝40、Σ(x−x̄)(y−ȳ)＝120 だった。回帰直線を求め、広告費12万円の店の売上を予測せよ。
  answer: b＝120÷40＝**3**、a＝50−3×10＝**20**。ŷ＝20＋3x。x＝12 のとき ŷ＝20＋36＝**56**（万円）。広告費が1万円多い店は、売上が平均3万円多い傾向。
  checks:
    - '120/40 == 3 and 50-3*10 == 20 and 20+3*12 == 56 and sum((x-10)**2 for x in (6,8,10,12,14)) == 40 and sum((x-10)*(y-50) for x,y in [(6,39),(8,42),(10,52),(12,54),(14,63)]) == 120 and (39+42+52+54+63)/5 == 50'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "6,39 8,42 10,52 12,54 14,63", px: 12}
    task: x̄＝10、ȳ＝50、Σ(x−x̄)²＝40、偏差の積の和120 の5店。広告費12万円の予測 ŷ は？
    predict: {type: number, key: yhat, label: "ŷ（万円）"}
    expect: 56
    why: b＝3、a＝20 で ŷ＝20＋3×12。ラボの5点はこの集計に合わせた例。

- id: Q-U29-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 5日間の x と y は (1,2)(2,1)(3,4)(4,3)(5,5)。相関係数は r＝0.8（{{unit:U28}}）。回帰直線と決定係数 R² を求め、R² と r の関係を確かめよ。
  answer: x̄＝3、ȳ＝3、偏差の積の和＝8、x の偏差平方和＝10 → b＝**0.8**、a＝3−0.8×3＝**0.6**。残差は 0.6, −1.2, 1.0, −0.8, 0.4 で SSE＝**3.6**、SST＝10 → R²＝1−3.6÷10＝**0.64**＝0.8²。単回帰では R² は r の2乗に等しい。
  checks:
    - 'sum((x-3)*(y-3) for x,y in [(1,2),(2,1),(3,4),(4,3),(5,5)]) == 8 and abs(8/10 - 0.8) < 1e-12 and abs(3-0.8*3 - 0.6) < 1e-12 and abs(sum((y-0.6-0.8*x)**2 for x,y in [(1,2),(2,1),(3,4),(4,3),(5,5)]) - 3.6) < 1e-9 and abs(1-3.6/10 - 0.64) < 1e-12 and abs(0.8**2 - 0.64) < 1e-12'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,2 2,1 3,4 4,3 5,5", px: 3}
    task: 5点 (1,2)(2,1)(3,4)(4,3)(5,5) の回帰直線。決定係数 R² は（小数で）？
    predict: {type: number, key: r2, label: "R²"}
    expect: 0.64
    why: SSE＝3.6、SST＝10 で R²＝1−0.36。相関係数の2乗と一致する。

- id: Q-U29-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 例題Aの回帰直線 ŷ＝2.3＋0.9x で、広告を20回にした週の来店者数を予測するといくつになるか。この予測をそのまま使ってよいか。切片 a＝2.3（広告0回の予測）についてはどうか。
  answer: ŷ＝2.3＋0.9×20＝**20.3**（百人）。しかし観測した広告回数は1〜5回で、20回は範囲の外（**外挿**）。直線の関係がそこまで続く保証はなく（来店は頭打ちになるかもしれない）、そのまま使わない。切片も x＝0 の予測で範囲外なので、「広告なしなら230人」と言い切らない。
  checks:
    - 'abs(2.3+0.9*20 - 20.3) < 1e-12'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,3 2,5 3,4 4,6 5,7", px: 20}
    task: 例題Aの5点（広告1〜5回）の直線で、広告20回の予測値 ŷ は（小数で）？
    predict: {type: number, key: yhat, label: "ŷ（百人）"}
    expect: 20.3
    why: 計算はできるが、◇は観測した範囲（薄い帯）のはるか外。点を1つ動かすだけで20回の予測は大きく変わる。

- id: Q-U29-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 例題B（(1,2)(2,3)(3,6)(4,7)、ŷ＝1.8x）で、売上 y が6万円になる日のチラシ枚数 x を予測したい。① ŷ＝1.8x を x について解く方法 ② x を y で回帰した直線 x̂＝x̄＋b_xy(y−ȳ)（b_xy＝偏差の積の和÷y の偏差平方和）を使う方法、で x を求め、どちらを使うべきか答えよ。（y の偏差平方和は17）
  answer: ① x＝6÷1.8≒**3.333**。② b_xy＝9÷17≒0.529、x̂＝2.5＋0.529×(6−4.5)≒**3.294**。y から x を予測するなら **②**。回帰直線は「予測される側」の縦のずれを最小にするので、向きを変えると別の直線になる（2つの係数の積 1.8×0.529≒0.953 が r²）。
  checks:
    - 'abs(6/1.8 - 3.333) < 0.0005 and abs(9/17 - 0.529) < 0.0005 and abs(2.5+9/17*1.5 - 3.294) < 0.0005 and sum((y-4.5)**2 for y in (2,3,6,7)) == 17 and abs(1.8*9/17 - 0.953) < 0.0005'
  lab:
    id: LAB-reg
    mode: dir
    set: {data: "1,2 2,3 3,6 4,7"}
    task: 4点 (1,2)(2,3)(3,6)(4,7)。x を y で回帰したときの係数 b_xy は（小数で）？
    predict: {type: number, key: byx, label: "b_xy"}
    expect: 0.5294
    why: 9÷17≒0.529。y を x で回帰した傾き1.8 の逆数（約0.556）ではない。点を動かして一直線にそろえると、2本の直線が重なる。

- id: Q-U29-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: ある回帰で、y の偏差平方和 SST＝30、残差平方和 SSE＝7.5、傾きは正だった。決定係数 R² と相関係数 r を求めよ。直線で説明できた平方和 SSR はいくつか。
  answer: R²＝1−7.5÷30＝**0.75**。SSR＝30−7.5＝**22.5**。傾きが正なので r＝＋√0.75≒**0.866**。
  checks:
    - '1-7.5/30 == 0.75 and 30-7.5 == 22.5 and abs(math.sqrt(0.75) - 0.866) < 0.0005 and abs(sum((y-5.5)**2 for y in (3.5,2.5,6.5,5.5,9.5)) - 30) < 1e-12 and abs(sum((y-1-1.5*x)**2 for x,y in [(1,3.5),(2,2.5),(3,6.5),(4,5.5),(5,9.5)]) - 7.5) < 1e-12'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,3.5 2,2.5 3,6.5 4,5.5 5,9.5", px: 3}
    task: SST＝30、SSE＝7.5 になる5点。決定係数 R² は（小数で）？
    predict: {type: number, key: r2, label: "R²"}
    expect: 0.75
    why: 1−7.5÷30。正方形（残差の2乗）の合計が y のばらつき全体の4分の1 残っている。

- id: Q-U29-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 5店の売場面積 x（m²）と客単価 y（百円）で、x̄＝50、ȳ＝30、x の標準偏差10、y の標準偏差5、相関係数 r＝0.6（{{unit:U28}}）。回帰直線を求め、面積60m² の店の客単価を予測せよ。
  answer: b＝r×s_y÷s_x＝0.6×5÷10＝**0.3**、a＝30−0.3×50＝**15**。ŷ＝15＋0.3x、x＝60 のとき ŷ＝15＋18＝**33**（百円）。R²＝0.36 なので、予測のずれは大きい。
  checks:
    - '0.6*5/10 == 0.3 and abs(30-0.3*50 - 15) < 1e-12 and abs(15+0.3*60 - 33) < 1e-12 and abs(0.6**2 - 0.36) < 1e-12 and sum((x-50)*(y-30) for x,y in [(40,31),(40,23),(50,30),(60,37),(60,29)]) == 120'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "40,31 40,23 50,30 60,37 60,29", px: 60}
    task: x̄＝50、ȳ＝30、s_x＝10、s_y＝5、r＝0.6 になる5店。面積60m² の予測 ŷ は？
    predict: {type: number, key: yhat, label: "ŷ（百円）"}
    expect: 33
    why: b＝0.6×5÷10、a＝30−b×50。同じ x＝60 の2店（37 と 29）の真ん中を直線が通る。

- id: Q-U29-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 例題Aの5点に、店長が目分量で直線 ŷ＝1＋1.2x を引いた。この直線の残差平方和と残差の合計を求め、最小二乗の直線（残差平方和1.9）と比べよ。
  answer: 予測 2.2, 3.4, 4.6, 5.8, 7.0、残差 0.8, 1.6, −0.6, 0.2, 0。残差平方和＝0.64＋2.56＋0.36＋0.04＋0＝**3.6**（最小二乗の1.9 より大きい）。残差の合計は**2**で0 にならない（直線が (x̄, ȳ)＝(3, 5) を通らず、全体に下にずれている）。
  checks:
    - 'abs(sum((y-1-1.2*x)**2 for x,y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) - 3.6) < 1e-9 and abs(sum(y-1-1.2*x for x,y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) - 2) < 1e-9 and abs(1+1.2*3 - 4.6) < 1e-12'
  lab:
    id: LAB-reg
    mode: line
    set: {data: "1,3 2,5 3,4 4,6 5,7", m: 1.2, c: 1}
    task: 例題Aの5点に直線 ŷ＝1＋1.2x。この直線の残差平方和は（小数で）？
    predict: {type: number, key: sseUser, label: "残差平方和"}
    expect: 3.6
    why: 3.6 で最小二乗の1.9 より大きい。切片を上げ、傾きを下げると近づく。

- id: Q-U29-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 値引き率 x（%）と販売数 y（十個）が (1,2)(2,5)(3,7)(4,8)(5,8.5)。回帰直線は ŷ＝1.3＋1.6x、R²≒0.91。残差を求めて並べ、直線のあてはめでよいか判断せよ。
  answer: 残差は −0.9, 0.5, 0.9, 0.3, −0.8（−＋＋＋−）で**山形**。R² は0.91 と高いが、値引きを増やすほど伸びが鈍る曲がりがあり、直線では表しきれない。とくに x＝6 以上への外挿は過大な予測になる。
  checks:
    - 'abs(sum((x-3)*(y-6.1) for x,y in [(1,2),(2,5),(3,7),(4,8),(5,8.5)])/10 - 1.6) < 1e-9 and abs(6.1-1.6*3 - 1.3) < 1e-9 and abs(1-sum((y-1.3-1.6*x)**2 for x,y in [(1,2),(2,5),(3,7),(4,8),(5,8.5)])/sum((y-6.1)**2 for y in (2,5,7,8,8.5)) - 0.91) < 0.005 and abs(2-1.3-1.6 + 0.9) < 1e-9 and abs(8.5-1.3-8 + 0.8) < 1e-9'
  lab:
    id: LAB-reg
    mode: resid
    set: {data: "1,2 2,5 3,7 4,8 5,8.5"}
    task: 値引き率と販売数の5点に直線を引く。残差プロットの形はどれか。
    predict: {type: choice, key: shape, label: "残差の形", options: [山形, 谷形, ばらばら]}
    expect: 山形
    why: 両端が−、真ん中が＋の山形。R² が高くても曲がりがある。点を直線に乗るよう動かすと「ばらばら」に変わる。

- id: Q-U29-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: Q-U29-003 の5店（x̄＝10、ȳ＝50）で、回帰直線を求めずに、広告費10万円の店の予測値を答えよ。理由も述べよ。
  answer: '**50**（万円）。最小二乗の直線は a＝ȳ−b x̄ なので、x＝x̄ を入れると ŷ＝a＋b x̄＝ȳ。直線は必ず平均の点 (x̄, ȳ) を通る。'
  checks:
    - '20+3*10 == 50'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "6,39 8,42 10,52 12,54 14,63", px: 10}
    task: Q-U29-003 の5店（x̄＝10、ȳ＝50）。広告費10万円の予測値 ŷ は？
    predict: {type: number, key: yhat, label: "ŷ（万円）"}
    expect: 50
    why: x＝x̄ なら ŷ＝ȳ。点をどう動かしても、直線は○（平均の点）を通る。

- id: Q-U29-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 最小二乗法による単回帰について、正しいものはどれか。
  choices:
    - 決定係数 R² が0.8 なら、この式による予測の80%が当たる。
    - y を x で回帰した直線を x について解くと、x を y で回帰した直線と一致する。
    - 単回帰では、決定係数 R² は相関係数 r の2乗に等しい。
    - 観測した x の範囲の外でも、R² が高ければ予測は信頼できる。
    - 残差の合計は、残差平方和と同じく最小になるように選ばれるので、正の値になる。
  correct: 3
  answer: R²＝1−SSE÷SST は単回帰で r² と一致する。例題Aでは r＝0.9、R²＝0.81。
  misconceptions:
    1: R² は y のばらつきのうち直線で説明できる割合で、当たる確率ではない
    2: 縦のずれを最小にするか横のずれを最小にするかで直線が違う。一致するのは r＝±1 のときだけ
    4: 範囲の外への予測（外挿）は直線が続く保証がなく、R² とは関係ない
    5: 残差の合計は必ず0 になる（直線が (x̄, ȳ) を通るため）
  checks:
    - 'abs(0.9**2 - 0.81) < 1e-12 and abs(1-1.9/10 - 0.81) < 1e-12'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,3 2,5 3,4 4,6 5,7", px: 3}
    task: 例題Aの5点（r＝0.9）の回帰直線。決定係数 R² は（小数で）？
    predict: {type: number, key: r2, label: "R²"}
    expect: 0.81
    why: 1−1.9÷10＝0.81＝0.9²。点を動かしても R² と r² はいつも一致する。

- id: Q-U29-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 5日間の最高気温 x（℃）とアイスの売上 y（万円）は (20,30)(22,34)(24,33)(26,38)(28,40)。回帰直線を求め、25℃の日の売上を予測せよ。40℃の日の予測はどう扱うか。
  answer: x̄＝24、ȳ＝35、偏差の積の和48、x の偏差平方和40 → b＝**1.2**、a＝35−1.2×24＝**6.2**。25℃では ŷ＝6.2＋30＝**36.2**（万円）。40℃は観測した20〜28℃の外（外挿）なので、この式では予測しない（暑すぎると客足が落ちるかもしれない）。
  checks:
    - 'sum((x-24)*(y-35) for x,y in [(20,30),(22,34),(24,33),(26,38),(28,40)]) == 48 and abs(48/40 - 1.2) < 1e-12 and abs(35-1.2*24 - 6.2) < 1e-9 and abs(6.2+1.2*25 - 36.2) < 1e-9'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "20,30 22,34 24,33 26,38 28,40", px: 25}
    task: 気温20〜28℃の5日。25℃の日の売上の予測 ŷ は（小数で）？
    predict: {type: number, key: yhat, label: "ŷ（万円）"}
    expect: 36.2
    why: 6.2＋1.2×25。予測する x を40 に動かすと◇が範囲の外に出て「外挿」と表示される。

- id: Q-U29-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 5店の売場面積 x（百m²）と月の売上 y（百万円）は (2,10)(3,15)(4,13)(5,18)(6,19)。回帰直線は ŷ＝6.6＋2.1x。各店の残差を求め、「面積のわりに売れていない」店を答えよ。
  answer: 予測 10.8, 12.9, 15, 17.1, 19.2、残差 −0.8, 2.1, −2, 0.9, −0.2。いちばん小さいのは x＝4 の店（残差**−2**）で、面積から見込む売上より2百万円少ない。逆に x＝3 の店は＋2.1 で、面積のわりに売れている。
  checks:
    - 'sum((x-4)*(y-15) for x,y in [(2,10),(3,15),(4,13),(5,18),(6,19)]) == 21 and abs(15-2.1*4 - 6.6) < 1e-9 and abs(13-6.6-2.1*4 + 2) < 1e-9 and abs(15-6.6-2.1*3 - 2.1) < 1e-9'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "2,10 3,15 4,13 5,18 6,19", px: 4}
    task: 面積2〜6（百m²）と売上の5店。いちばん小さい残差は（小数で）？
    predict: {type: number, key: emin, label: "最小の残差"}
    expect: -2
    why: x＝4 の店が −2。「くわしく」の表で残差の並びを見る。その店を上に動かすと、直線も少し持ち上がる。

- id: Q-U29-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: Q-U29-030 の気温と売上の回帰で、SSE＝6.4、SST＝64 だった。決定係数と残差の標準偏差 s_e＝√(SSE÷(n−2)) を求め、報告の文を書け。
  answer: R²＝1−6.4÷64＝**0.9**。s_e＝√(6.4÷3)≒**1.46**（万円）。「20〜28℃の5日では、気温が1℃高い日は売上が平均1.2万円多い傾向（R²＝0.9）。予測のずれの目安は±1.5万円ほど。5日分なので傾きは不確かで、範囲外の気温には使わない」。
  checks:
    - '1-6.4/64 == 0.9 and abs(math.sqrt(6.4/3) - 1.46) < 0.005 and abs(sum((y-6.2-1.2*x)**2 for x,y in [(20,30),(22,34),(24,33),(26,38),(28,40)]) - 6.4) < 1e-9 and sum((y-35)**2 for y in (30,34,33,38,40)) == 64'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "20,30 22,34 24,33 26,38 28,40", px: 25}
    task: 気温と売上の5日の回帰。残差の標準偏差 s_e は（小数で）？
    predict: {type: number, key: se, label: "s_e（万円）"}
    expect: 1.4606
    why: √(6.4÷3)≒1.46。自由度は5−2＝3。点を1つ大きく外すと s_e が大きくなり、予測のずれの目安が広がる。

- id: Q-U29-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 例題Aの回帰（SST＝10、SSE＝1.9、n＝5）の分散分析表を作り、F＝SSR÷(SSE÷(n−2)) を求めよ。傾きの標準誤差 s_e÷√Σ(x−x̄)² を使った t＝b÷(標準誤差) の2乗と比べよ。
  answer: SSR＝10−1.9＝8.1（自由度1）、SSE＝1.9（自由度3）、SST＝10（自由度4）。F＝8.1÷(1.9÷3)≒**12.789**。傾きの標準誤差＝√(1.9÷3)÷√10≒0.252、t＝0.9÷0.252≒3.58、t²≒12.79 で F と一致する（{{unit:U30}}）。
  checks:
    - 'abs(10-1.9 - 8.1) < 1e-12 and abs(8.1/(1.9/3) - 12.789) < 0.0005 and abs(math.sqrt(1.9/3)/math.sqrt(10) - 0.252) < 0.0005 and abs(0.9/(math.sqrt(1.9/3)/math.sqrt(10)) - 3.58) < 0.005 and abs((0.9/(math.sqrt(1.9/3)/math.sqrt(10)))**2 - 8.1/(1.9/3)) < 1e-9'
  lab:
    id: LAB-reg
    mode: fit
    set: {data: "1,3 2,5 3,4 4,6 5,7", px: 3}
    task: 例題Aの回帰。F＝SSR÷(SSE÷(n−2)) は（小数で）？（「くわしく」の表に出る）
    predict: {type: number, key: f, label: "F"}
    expect: 12.7895
    why: 8.1÷(1.9÷3)≒12.79。点を直線から離すと SSE が増え、F は小さくなる。
