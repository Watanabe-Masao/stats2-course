    predict: {type: number, key: rStrat, label: "層化÷単純無作為", unit: "倍"}
    expect: 0.295
    why: 層の間の違いが大きいほど層化は得をする。集落（約3.2倍）とは正反対。

- id: Q-U31-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: チェーンの客単価を調べる。全店の25%を占める大型店と75%の小型店から、同じ8店ずつ調べると、客単価の平均は大型店120百円、小型店60百円だった。チェーン全体の客単価を推定し、報告の文を書け。
  answer: 0.25×120＋0.75×60＝30＋45＝**75百円**。そのまま平均すると (120＋60)÷2＝90百円で、大型店を重く見すぎる。「チェーン全体の客単価は約75百円と推定される（大型・小型を店数の割合で重み付け）。大型店120百円・小型店60百円で、店の種類による差が大きい」。
  checks:
    - '0.25*120+0.75*60 == 75 and (120+60)/2 == 90'
  lab:
    id: LAB-survey
    mode: strat
    set: {w: 0.25, m1: 120, m2: 60}
    task: 大型店（全体の0.25）の客単価120、小型店（0.75）の客単価60。全体の推定は（百円）？
    predict: {type: number, key: weighted, label: "全体の客単価", unit: "百円"}
    expect: 75
    why: 帯の面積の合計を全体の幅でならすと75。そのまま平均の90 とは15 ずれる。

- id: Q-U31-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 店内アンケートで「不満がある」と答えた人の割合を調べる。本当は客の30%が不満を持っているが、不満のある人の回答率は0.2、ない人の回答率は0.5 だった。① 集まった答えの「不満」の割合はいくつか。② この結果を「不満は少ない」と報告するのは何が問題か。
  answer: ① 不満で答えるのは 0.3×0.2＝0.06、不満なしで答えるのは 0.7×0.5＝0.35。集まった割合は 0.06÷0.41≒**0.146**（本当の0.3 の半分以下）。② 不満のある人ほど答えないという**無回答の偏り**があり、回答を何人集めても消えない。回答率の違いを確かめる（答えなかった人への追加調査、ほかの記録と比べる）までは、「回答者の中では」と書いて範囲を限る。
  checks:
    - 'abs(0.3*0.2+0.7*0.5 - 0.41) < 1e-12 and abs(0.06/0.41 - 0.146) < 0.0005'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.3, r1: 0.2, r0: 0.5, n: 400}
    task: 本当の「不満」の割合0.3、不満のある人の回答率0.2・ない人の回答率0.5。集まった「不満」の割合は（小数で）？
    predict: {type: number, key: est, label: "集まった不満の割合"}
    expect: 0.1463
    why: 不満のある人ほど答えないので、集まった答えは半分以下に。区間（約0.11〜0.18）も本当の0.3 を含まない。

- id: Q-U31-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 本部が客の声を集める。12地域から3地域、選んだ地域の8店から2店、選んだ店の100人の客から10人を選ぶ。ある客が選ばれる確率と重みを求めよ。店によって客が100人と300人に違う場合、各店10人ずつ選ぶと何が起きるか。
  answer: 確率＝3/12×2/8×10/100＝0.25×0.25×0.1＝**0.00625**、重み＝1÷0.00625＝**160**人。客が300人の店から10人を選ぶと、その店の客が選ばれる確率は0.25×0.25×10/300 に下がり、重みは480人になる。重みを付けずに集計すると、小さな店の客の意見を重く見すぎる。
  checks:
    - 'abs(3/12*2/8*10/100 - 0.00625) < 1e-12 and abs(1/0.00625 - 160) < 1e-9 and abs(1/(3/12*2/8*10/300) - 480) < 1e-9'
  lab:
    id: LAB-survey
    mode: multi
    set: {A: 12, a: 3, B: 8, b: 2, C: 100, c: 10}
    task: 地域12から3、店8から2、客100から10 を選ぶ。1人が代表する人数（重み）は？
    predict: {type: number, key: weight, label: "重み", unit: "人"}
    expect: 160
    why: 0.25×0.25×0.1 の逆数。1店の客を300 にすると重みは480 に変わる。

- id: Q-U31-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 例題C の調査（本当の賛成率0.5、回答率は賛成0.6・反対0.3）で、偏りは約0.167。総合誤差 √(偏り²＋標準誤差²) を、回答数400人のときに求めよ（標準誤差は √(p̂(1−p̂)÷n)、p̂≒0.667）。n をいくら増やしても、総合誤差はいくつより小さくならないか。
  answer: 標準誤差＝√(0.667×0.333÷400)≒0.0236。総合誤差＝√(0.1667²＋0.0236²)≒**0.168**。n を増やすと標準誤差は0 に近づくが、総合誤差は偏りの**0.167 より小さくならない**。n を増やすより、回答率の差を小さくする（答えやすくする・追加で聞く）ほうが効く。
  checks:
    - 'abs(math.sqrt((2/3)*(1/3)/400) - 0.0236) < 0.00005 and abs(math.sqrt((1/6)**2+(2/3)*(1/3)/400) - 0.168) < 0.0005 and abs(1/6 - 0.167) < 0.0005'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.5, r1: 0.6, r0: 0.3, n: 400}
    task: 400人のとき、総合誤差 √(偏り²＋標準誤差²) は（小数で）？
    predict: {type: number, key: rmse, label: "総合誤差"}
    expect: 0.1683
    why: 偏り0.167 がほとんどを占める。n を1万にしても0.1667 までしか下がらない。
