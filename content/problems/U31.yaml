- id: Q-U31-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 標本調査について、正しいものはどれか。
  choices:
    - 回答数を十分に増やせば、無回答による偏りも小さくなる。
    - 層化抽出では、層の中が似ていて層の間の違いが大きいほど、推定の精度が上がる。
    - 集落抽出では、集落の中の個体が互いに似ているほど、推定の精度が上がる。
    - 系統抽出は、名簿の並びにどんな周期があっても単純無作為抽出と同じ精度になる。
    - 各層から同じ数を選んだ層化抽出では、集めた値をそのまま平均すれば母平均の推定になる。
  correct: 2
