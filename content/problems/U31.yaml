# 単元U31の問題。id は変えない（個人の解答記録がこの id を指す）。
# 偏りのある回答：集まった割合＝p×r1÷(p×r1＋(1−p)×r0)（p＝本当の割合、r1・r0＝回答率）
- id: Q-U31-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    ある地域の店は、平均売上100万円の層が30%、平均売上40万円の層が70%を占める。各層から同じ5店ずつ調べた結果が、この平均どおりだった。全店の平均売上を推定せよ。

    全体の平均＝□×100＋□×40＝□万円。調べた10店をそのまま平均すると (100＋40)÷2＝□ で、□の層を重く見すぎる。
  answer_title: 答え（埋めてから開く）
  answer: 全体の平均＝**0.3**×100＋**0.7**×40＝30＋28＝**58**万円。そのまま平均すると **70** で、店の数が少ない**平均100万円**の層を重く見すぎる。各層から同じ数を選んだら、母集団での割合で重みを付け直す。
  checks:
    - '0.3*100+0.7*40 == 58 and (100+40)/2 == 70'
  lab:
    id: LAB-survey
    mode: strat
    set: {w: 0.3, m1: 100, m2: 40}
    task: 層1（割合0.3）の平均100、層2（割合0.7）の平均40。全体の平均の推定は？
    predict: {type: number, key: weighted, label: "全体の平均"}
    expect: 58
    why: 帯の面積を全体の幅でならした高さが58。2つの層の割合が同じ0.5 のときだけ、そのまま平均と一致する。

- id: Q-U31-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: ある施策への本当の賛成率は0.5。アンケートに答えてくれる割合（回答率）は、賛成の人が0.6、反対の人が0.3 だった。① 集まった答えの賛成率はいくつか。② 回答数を400人から1万人に増やすと、①のずれは小さくなるか。
  answer: ① 答える賛成の人は 0.5×0.6＝0.3、反対の人は 0.5×0.3＝0.15。集まった賛成率は 0.3÷(0.3＋0.15)≒**0.667**（本当より約0.167 高い）。② **小さくならない**。n を増やすと標準誤差（400人で約0.024）は1万人で約0.005 に縮むが、回答率の違いによるずれ（非標本誤差）は残る。「自信を持って間違える」ことになる。
  checks:
    - 'abs(0.5*0.6/(0.5*0.6+0.5*0.3) - 0.667) < 0.0005 and abs(0.5*0.6/(0.5*0.6+0.5*0.3) - 0.5 - 0.167) < 0.0005 and abs(math.sqrt((2/3)*(1/3)/400) - 0.024) < 0.0005 and abs(math.sqrt((2/3)*(1/3)/10000) - 0.005) < 0.0005'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.5, r1: 0.6, r0: 0.3, n: 400}
    task: 本当の賛成率0.5、賛成者の回答率0.6・反対者の回答率0.3。集まった答えの賛成率は（小数で）？
    predict: {type: number, key: est, label: "集まった賛成率"}
    expect: 0.6667
    why: 賛成の人のほうが2倍答えやすいので、集まった答えは賛成に寄る。n を1万にすると区間は細くなるが、本当の0.5 からは離れたまま。

- id: Q-U31-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 10地域から2地域を選び、選んだ地域ごとに15店から3店を選び、選んだ店ごとに200人の客から20人を選ぶ（各段は単純無作為）。① この方法の名前は何か。② ある客が選ばれる確率と、集計での重み（1人が代表する人数）を求めよ。
  answer: ① **多段抽出**（3段）。② 確率＝2/10×3/15×20/200＝0.2×0.2×0.1＝**0.004**。重み＝1÷0.004＝**250**人。調べるのは 2×3×20＝120人で、全体 10×15×200＝30000人を代表する（120×250＝30000）。
  checks:
    - 'abs(2/10*3/15*20/200 - 0.004) < 1e-12 and abs(1/0.004 - 250) < 1e-9 and 2*3*20 == 120 and 10*15*200 == 30000 and 120*250 == 30000'
  lab:
    id: LAB-survey
    mode: multi
    set: {A: 10, a: 2, B: 15, b: 3, C: 200, c: 20}
    task: 地域10から2、店15から3、客200から20 を選ぶ。1人が代表する人数（重み）は？
    predict: {type: number, key: weight, label: "重み", unit: "人"}
    expect: 250
    why: 確率0.2×0.2×0.1＝0.004 の逆数。どの客も確率が同じなので、集計はそのまま平均してよい。

- id: Q-U31-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 地域ごとの売上の違いが大きい市で、10地域×10店から10店を調べる。A：地域ごとに1店ずつ選ぶ。B：10地域から1地域を選び、その10店を全部調べる。それぞれの方法の名前と、推定値のばらつきが小さいのはどちらかを、理由とともに答えよ。
  answer: A は**層化抽出**（地域が層）、B は**集落抽出**（地域が集落）。ばらつきが小さいのは **A（層化）**。層化は全部の地域から取るので地域の違いが誤差に入らない。集落は1地域しか見ないので、どの地域を引いたかがそのまま推定値に出る。地域の中の店が似ているほど、1地域を全部調べても情報は増えない。
  no_checks: 数の計算を含まない（方法の区別と理由）
  lab:
    id: LAB-survey
    mode: design
    set: {d: 2, p: 0, s: 1, show: clus}
    task: 地域の差2（地域ごとの違いが大きい）。4つの方法のうち、推定値のばらつきがいちばん小さいのは？
    predict: {type: choice, key: best, label: "いちばん小さい", options: [単純無作為, 層化, 集落, 系統]}
    expect: 層化
    why: 層化の標準誤差は単純無作為の約0.3倍、集落は約3.2倍。同じ「地域で分ける」でも結果は正反対になる。

- id: Q-U31-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 100店の名簿が、地域ごとに「売上の高い順」に10店ずつ並んでいる。無作為な開始点から10店おきに選ぶ系統抽出をすると、どんな標本になりやすいか。単純無作為抽出と比べて推定値のばらつきはどうなるか。どう直せばよいか。
  answer: 10店おきに選ぶと、どの地域でも**名簿の同じ順位**（全部1位、全部10位など）の店ばかりになる。名簿の周期（10店）と間隔が重なるので、推定値は「どの順位を引いたか」で大きく変わり、ばらつきは単純無作為より**大きくなる**（ラボの設定で約2.9倍）。並び順を無作為に混ぜてから選ぶ、間隔を周期とずらす、層化（地域ごと）にして各層の中で無作為に選ぶ、などで直す。
  checks:
    - 'abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(0,2,1)[3] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(0,2,1)[0] - 2.93) < 0.005 and abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(0,2,1)[2] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(0,2,1)[0] - 0.311) < 0.005'
  lab:
    id: LAB-survey
    mode: design
    set: {d: 0, p: 2, s: 1, show: sys}
    task: 地域の差0、並び順の差2（名簿が地域ごとに売上順）。系統抽出の標準誤差は単純無作為の何倍か（小数で）？
    predict: {type: number, key: rSys, label: "系統÷単純無作為", unit: "倍"}
    expect: 2.9302
    why: 系統抽出で選べる標本は「1位の10店」「2位の10店」…の10通りしかない。並び順の差がそのまま推定値のばらつきになる。

- id: Q-U31-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 層1（全体の20%、標準偏差30）と層2（80%、標準偏差5）に、合わせて100人を振り分ける。① 比例配分 ② ネイマン配分（層の割合×層の標準偏差に比例）で、層1に何人を配るか。
  answer: ① 比例配分：100×0.2＝**20人**（層2に80人）。② ネイマン配分：層1は 0.2×30＝6、層2は 0.8×5＝4 なので、100×6÷(6＋4)＝**60人**（層2に40人）。ばらつきの大きい層1に多く配ると、全体の標準誤差が小さくなる（比例配分で約1.41、ネイマン配分で1）。
  checks:
    - '100*0.2 == 20 and abs(100*(0.2*30)/(0.2*30+0.8*5) - 60) < 1e-9 and abs(math.sqrt(0.04*900/20+0.64*25/80) - 1.41) < 0.005 and abs(math.sqrt(0.04*900/60+0.64*25/40) - 1) < 1e-9'
  lab:
    id: LAB-survey
    mode: alloc
    set: {w1: 0.2, s1: 30, s2: 5, dm: 40, n: 100}
    task: 層1（割合0.2・標準偏差30）、層2（割合0.8・標準偏差5）、全体100人。ネイマン配分で層1に配る人数は？
    predict: {type: number, key: n1n, label: "層1の人数", unit: "人"}
    expect: 60
    why: 比例配分なら20人。層1は人数こそ少ないが、ばらつきが6倍あるので、多めに調べたほうが全体の推定が安定する。

- id: Q-U31-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 例題C の調査（本当の賛成率0.5、賛成者の回答率0.6・反対者の回答率0.3）で、回答を1万人集めた。集まった賛成率は約0.667、95%信頼区間（{{unit:U22}}）は約0.657〜0.676 になる。この区間は本当の賛成率0.5 を含むか。区間の幅が狭いことは、何を保証して何を保証しないか。
  answer: '**含まない**。区間の幅（標本誤差）は n が大きいので狭いが、回答率の違いによる偏り（約0.167）は区間に入っていない。区間は「たまたまの選ばれ方によるぶれ」の大きさだけを表し、調べ方の偏りがないことは保証しない。'
  checks:
    - 'abs(2/3 - 1.96*math.sqrt((2/3)*(1/3)/10000) - 0.657) < 0.0005 and abs(2/3 + 1.96*math.sqrt((2/3)*(1/3)/10000) - 0.676) < 0.0005 and abs(2/3-0.5 - 0.167) < 0.0005'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.5, r1: 0.6, r0: 0.3, n: 10000}
    task: 1万人の回答。95%区間は本当の賛成率0.5 を含むか。
    predict: {type: choice, key: covers, label: "区間は0.5 を", options: [含む, 含まない]}
    expect: 含まない
    why: 区間は0.657〜0.676 と細い。n を100人に戻すと区間は広がるが、真ん中は0.667 のまま。

- id: Q-U31-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 400人の回答で賛成率は0.6、比率の95%信頼区間（{{unit:U22}}）は 0.6±1.96×√(0.6×0.4÷400)＝約0.552〜0.648。ところが本当の賛成率は0.5 で、賛成者の回答率は0.6、反対者は0.4 だった。偏り（集まった値−本当の値）はいくつか。区間の作り方のどこに、この偏りが入っていないか。
  answer: 集まった賛成率は 0.5×0.6÷(0.5×0.6＋0.5×0.4)＝0.6 で、偏りは **0.1**。区間の式 √(p̂(1−p̂)÷n) は、無作為に選ばれた標本のぶれだけを表す。回答率が賛否で違うこと（非標本誤差）は式に入っていないので、区間は本当の0.5 を含まない。
  checks:
    - 'abs(0.5*0.6/(0.5*0.6+0.5*0.4) - 0.6) < 1e-12 and abs(0.6-1.96*math.sqrt(0.6*0.4/400) - 0.552) < 0.0005 and abs(0.6+1.96*math.sqrt(0.6*0.4/400) - 0.648) < 0.0005 and abs(0.6-0.5 - 0.1) < 1e-12'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.5, r1: 0.6, r0: 0.4, n: 400}
    task: 本当の賛成率0.5、賛成者の回答率0.6・反対者0.4、400人。偏り（集まった値−本当の値）は（小数で）？
    predict: {type: number, key: bias, label: "偏り"}
    expect: 0.1
    why: 回答率の差が0.6 と0.4 でも、集まった答えは0.1 ずれる。区間の幅（約±0.048）より大きい。

- id: Q-U31-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 2店で満足度を調べる。A店の客は100人、B店は400人。各店から20人ずつ選ぶと、満足と答えた割合はA店80%、B店50%だった。① この選び方の名前は何か。② 2店全体の満足の割合を推定せよ。③ 40人の回答をそのまま集計すると何%になり、どこがずれるか。
  answer: ① 店を層とした**層化抽出**（各層から同じ数）。② 店の客数の割合で重み付け：100÷500＝0.2、400÷500＝0.8 なので 0.2×80＋0.8×50＝**56%**。③ そのまま集計すると (16＋10)÷40＝**65%**。A店の客は1人で5人分、B店の客は1人で20人分を代表するのに、同じ重みで数えているため、満足度の高い小さな店を重く見すぎる。
  checks:
    - '100/500 == 0.2 and 0.2*80+0.8*50 == 56 and (16+10)/40 == 0.65 and 100/20 == 5 and 400/20 == 20'
  lab:
    id: LAB-survey
    mode: strat
    set: {w: 0.2, m1: 80, m2: 50}
    task: A店（全体の0.2）の満足80%、B店（0.8）の満足50%。2店全体の満足の割合の推定は（%）？
    predict: {type: number, key: weighted, label: "全体の満足", unit: "%"}
    expect: 56
    why: 帯の幅が客数の割合。そのまま平均（65%）とのずれは、小さな店を重く見すぎた分。

- id: Q-U31-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: Q-U31-010 の2つの層（割合0.2・標準偏差30 と 割合0.8・標準偏差5、層の平均の差40）で、100人を調べる。標準誤差を ① 単純無作為 ② 比例配分の層化 ③ ネイマン配分の層化 で比べよ。①は √((0.2×30²＋0.8×5²＋0.2×0.8×40²)÷100) で求める。
  answer: ① √((180＋20＋256)÷100)＝√4.56≒**2.14**。② √(0.2²×30²÷20＋0.8²×5²÷80)＝√2≒**1.41**。③ √(0.2²×30²÷60＋0.8²×5²÷40)＝√1＝**1**。層化は「層の平均の違い（0.2×0.8×40²）」をばらつきから取り除くので、比例配分でも単純無作為より小さい。ばらつきの大きい層に多く配ると（ネイマン）さらに小さくなる。
  checks:
    - 'abs(0.2*900+0.8*25+0.2*0.8*1600 - 456) < 1e-9 and abs(math.sqrt(4.56) - 2.14) < 0.005 and abs(math.sqrt(0.04*900/20+0.64*25/80) - math.sqrt(2)) < 1e-9 and abs(math.sqrt(2) - 1.41) < 0.005 and abs(math.sqrt(0.04*900/60+0.64*25/40) - 1) < 1e-9'
  lab:
    id: LAB-survey
    mode: alloc
    set: {w1: 0.2, s1: 30, s2: 5, dm: 40, n: 100}
    task: 同じ2つの層、100人。ネイマン配分の標準誤差は（小数で）？
    predict: {type: number, key: seN, label: "ネイマン配分の標準誤差"}
    expect: 1
    why: 単純無作為の約2.14、比例配分の約1.41 より小さい。層の平均の差を0 にすると、単純無作為と比例配分の差は小さくなる。

- id: Q-U31-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 回答率がちょうど50%の調査があった。本当の賛成率は0.4 で、賛成の人も反対の人も同じく半分が答えた。集まった答えの賛成率は偏るか。「回答率が低いから信用できない」という意見に、どう答えるか。
  answer: 賛成で答えるのは 0.4×0.5＝0.2、反対で答えるのは 0.6×0.5＝0.3、集まった賛成率は 0.2÷0.5＝**0.4** で**偏らない**（偏り0）。回答率の低さそのものではなく、**答える人と答えない人で意見が違うこと**が偏りを生む。ただし、実際に答えない人の意見は分からないので、回答率が低いと「偏っていないか」を確かめる手がかりが減る。
  checks:
    - 'abs(0.4*0.5/(0.4*0.5+0.6*0.5) - 0.4) < 1e-12 and 0.4*0.5+0.6*0.5 == 0.5'
  lab:
    id: LAB-survey
    mode: bias
    set: {p: 0.4, r1: 0.5, r0: 0.5, n: 400}
    task: 本当の賛成率0.4、賛成者も反対者も回答率0.5。偏り（集まった値−本当の値）は（小数で）？
