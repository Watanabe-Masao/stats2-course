    3: 集落の中が似ていると、集落を丸ごと調べても情報が増えず、精度は下がる
    4: 名簿の周期と間隔が重なると、同じ位置の個体ばかり選ばれ、ばらつきが大きくなる
    5: 母集団での層の割合で重み付けし直す。そのまま平均すると、小さい層を重く見すぎる
  checks:
    - 'abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[1] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[0] - 0.295) < 0.0005 and abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[2] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((7*j*j+3*k*k+5*j*k+2*j+k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[0] - 3.18) < 0.005'
  lab:
