# 単元U21の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U21-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    4日分の来店客数（百人）は 3, 5, 7, 9。母平均と母分散を推定する。

    x̄＝□÷4＝□。偏差は □, □, □, □、2乗和＝□。v＝□÷4＝□、s²＝□÷3≒□。母分散の推定値には □ を使う。
  answer_title: 答え（埋めてから開く）
  answer: x̄＝24÷4＝**6**。偏差は −3, −1, 1, 3、2乗和＝9＋1＋1＋9＝**20**。v＝20÷4＝**5**、s²＝20÷3≒**6.67**。母分散の推定値には不偏な **s²≒6.67** を使う。
  checks:
    - '(3+5+7+9)/4 == 6 and (3-6)**2+(5-6)**2+(7-6)**2+(9-6)**2 == 20 and 20/4 == 5 and abs(20/3 - 6.67) < 0.005 and 3+5+7+9 == 24'
  lab:
    id: LAB-est
    mode: calc
    set: {vals: "3,5,7,9"}
    task: データ 3, 5, 7, 9。n−1 で割る不偏分散 s² は（小数で）？
    predict: {type: number, key: s2, label: "s²"}
    expect: 6.6667
    why: 偏差の2乗和20を3で割って約6.67。n で割る v は5で、平均して σ² の3/4倍に小さく偏る。

- id: Q-U21-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 母分散 σ²＝12 の正規母集団から n＝4 の標本を何度も取り直す。n で割る v の平均（期待値）と、n−1 で割る s² の平均はそれぞれいくつか。v の偏りはいくつか。
  answer: E[v]＝(n−1)÷n×σ²＝3÷4×12＝**9**、E[s²]＝**12**。v の偏りは 9−12＝**−3**（小さめ）。s² は不偏。
  checks:
    - '3/4*12 == 9 and 9-12 == -3'
  lab:
    id: LAB-est
    mode: var
    set: {sigma2: 12, n: 4}
    task: σ²＝12、n＝4。n で割る v の平均（期待値）は？
    predict: {type: number, key: meanV, label: "E[v]"}
    expect: 9
    why: (n−1)/n×σ²＝3/4×12＝9。2000回取り直した v の平均も9に近い。s² の平均は12。

- id: Q-U21-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1, P3]
  prompt: 母平均 μ を推定するのに「標本平均＋1」を使う。この推定量は不偏か。n を増やしてもずれが消えないとき、一致か。σ＝10、n＝25 のとき MSE はいくつか。
  answer: 期待値が μ＋1 なので**不偏ではない**（偏り1）。n を増やしても1ずれたままなので**一致でもない**。MSE＝分散＋偏り²＝(10÷√25)²＋1²＝4＋1＝**5**。標本平均の MSE は4。
  checks:
    - '(10/math.sqrt(25))**2 + 1**2 == 5 and (10/math.sqrt(25))**2 == 4'
  lab:
    id: LAB-est
    mode: comp
    set: {sigma: 10, n: 25, b: 1}
    task: σ＝10、n＝25 で「標本平均＋1」の MSE は？
    predict: {type: number, key: mseShift, label: "MSE"}
    expect: 5
    why: SE は2で分散4、偏り1の2乗を足して5。n を100にすると 1＋1＝2 で、偏りの1だけはいつまでも残る。

- id: Q-U21-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: σ＝10 の母集団から n＝100 の標本を取り、μ を「最初の1個の値」で推定する。この推定量は不偏か、一致か。標本平均の標準誤差と比べよ。
  answer: 最初の1個の期待値は μ なので**不偏**。ただし広がりは n によらず σ＝**10** のままで、n を増やしても μ に近づかないので**一致ではない**。標本平均の SE は 10÷√100＝**1** で10分の1。不偏でも、データを使わない推定量は良くない。
  checks:
    - '10/math.sqrt(100) == 1'
  lab:
    id: LAB-est
    mode: comp
    set: {sigma: 10, n: 100, b: 0}
    task: σ＝10、n＝100。標本平均の標準誤差 SE は？
    predict: {type: number, key: seMean, label: "標本平均の SE"}
    expect: 1
    why: 10÷10＝1。最初の1個の広がりは10のまま。どちらも中心は μ（不偏）だが、ばらつきが10倍違う。

- id: Q-U21-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 母分散 σ²＝10 の正規母集団から n＝5 の標本を取る。n で割る v の期待値と偏りを求めよ。n を大きくすると偏りはどうなるか。
  answer: E[v]＝4÷5×10＝**8**、偏り＝8−10＝**−2**（＝−σ²÷n）。n を大きくすると −σ²÷n は0に近づくので、v は不偏ではないが**一致**する。
  checks:
    - '4/5*10 == 8 and 8-10 == -2 and -10/5 == -2'
  lab:
    id: LAB-est
    mode: var
    set: {sigma2: 10, n: 5}
    task: σ²＝10、n＝5。n で割る v の偏り（期待値−σ²）は？
    predict: {type: number, key: biasV, label: "v の偏り"}
    expect: -2
    why: −σ²÷n＝−2。n を50にすると −0.2 で、偏りは n とともに小さくなる（一致）。

- id: Q-U21-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 5日分の欠品数は 1, 3, 5, 7, 9。平均の推定値と、n で割る v・n−1 で割る s² を求めよ。母分散の推定にはどちらを使うか。
  answer: x̄＝25÷5＝**5**。偏差の2乗和＝16＋4＋0＋4＋16＝40、v＝40÷5＝**8**、s²＝40÷4＝**10**。母分散の推定には不偏な **s²＝10** を使う。
  checks:
    - '(1+3+5+7+9) == 25 and 25/5 == 5 and 16+4+0+4+16 == 40 and 40/5 == 8 and 40/4 == 10'
  lab:
    id: LAB-est
    mode: calc
    set: {vals: "1,3,5,7,9"}
    task: データ 1, 3, 5, 7, 9。n で割る v は？
    predict: {type: number, key: v, label: "v"}
    expect: 8
    why: 偏差の2乗和40を5で割って8。n−1 で割ると10。

- id: Q-U21-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 正規母集団（σ＝10）から n＝25 の標本を取り、μ を推定する。標本平均と中央値はどちらも不偏。標本平均の標準誤差を求め、中央値と比べてどちらが有効か答えよ（中央値の標準誤差は、n が大きいとき標本平均の約 √(π/2) 倍）。
  answer: 標本平均の SE＝10÷√25＝**2**。中央値は約 2×√(π/2)≒**2.5**。どちらも不偏なので、分散の小さい**標本平均の方が有効**。
  checks:
    - '10/math.sqrt(25) == 2 and abs(2*math.sqrt(math.pi/2) - 2.5) < 0.01'
  lab:
    id: LAB-est
    mode: comp
    set: {sigma: 10, n: 25, b: 0}
    task: σ＝10、n＝25。標本平均の SE は？
    predict: {type: number, key: seMean, label: "標本平均の SE"}
    expect: 2
    why: 10÷5＝2。2000回取り直した中央値の SE は約2.5。正規分布なら、平均の方が中央値よりばらつきが小さい。

- id: Q-U21-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 来店客100人のうち X 人が買った。購入率 p を p̂＝X÷100 で推定する。X は二項分布（{{unit:U14}}）B(100, p) に従う。p̂ は不偏か。p＝0.2 のとき p̂ の標準誤差（{{unit:U18}}）は？ n を増やすとどうなるか。
  answer: E[X]＝np なので E[p̂]＝np÷n＝p で**不偏**。SE＝√(0.2×0.8÷100)＝**0.04**。n を増やすと √(p(1−p)÷n) が0に近づくので**一致**する。
  checks:
    - 'abs(math.sqrt(0.2*0.8/100) - 0.04) < 1e-12'
  lab:
    id: LAB-xbar
    mode: prop
    set: {p: 0.2, n: 100}
    task: p＝0.2、n＝100。p̂ の標準誤差は（小数で）？
    predict: {type: number, key: se, label: "SE(p̂)"}
    expect: 0.04
    why: √(0.16÷100)＝0.04。n を400にすると0.02で半分。p̂ は不偏で、n とともに p に近づく。

- id: Q-U21-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 母分散 σ²＝10 の正規母集団から n＝5 を取る。s² の分散は 2σ⁴÷(n−1)、v の分散は 2(n−1)σ⁴÷n²。s² と v の MSE を求め、MSE で比べるとどちらが良いか答えよ。
  answer: s² は不偏なので MSE＝分散＝2×100÷4＝**50**。v は分散 2×4×100÷25＝32、偏り −2 で、MSE＝32＋4＝**36**。MSE で比べると**偏りのある v の方が小さい**。「不偏」と「MSE が小さい」は別の基準。
  checks:
    - '2*100/4 == 50 and 2*4*100/25 == 32 and 32+(-2)**2 == 36'
  lab:
    id: LAB-est
    mode: var
    set: {sigma2: 10, n: 5}
    task: σ²＝10、n＝5。n で割る v の MSE は？
    predict: {type: number, key: mseV, label: "MSE(v)"}
    expect: 36
    why: 分散32＋偏り²4＝36。s² の MSE は50。v の分布は少し左にずれるが、広がりが小さい。

- id: Q-U21-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 本当の満足率は0.5。満足の人は60%、不満の人は20%がアンケートに答える。回答者の満足率は何に近づくか。回答を1000人から5000人に増やすと偏りは減るか。
  answer: 回答者の満足率 → 0.5×0.6÷(0.5×0.6＋0.5×0.2)＝0.3÷0.4＝**0.75**。偏り＝**0.25**。回答を増やすと SE は小さくなるが、偏り0.25は**減らない**。
  checks:
    - 'abs(0.5*0.6/(0.5*0.6+0.5*0.2) - 0.75) < 1e-12 and abs(0.5*0.6+0.5*0.2 - 0.4) < 1e-12'
  lab:
    id: LAB-est
    mode: self
    set: {p: 0.5, r1: 0.6, r0: 0.2, n: 1000}
    task: 本当の満足率0.5、回答率は満足60%・不満20%。回答者の満足率が落ち着く先は？
    predict: {type: number, key: target, label: "落ち着く先"}
    expect: 0.75
    why: 満足の人が3倍答えやすいので0.75。n を5000にしても0.75に落ち着く。回答率をそろえると0.5に戻る。

- id: Q-U21-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 正規母集団（σ＝10）から n＝50 を取る。μ の推定に標本平均と中央値のどちらを使うか。標本平均の SE を求め、中央値の SE（約 √(π/2) 倍）と比べて答えよ。
  answer: 標本平均の SE＝10÷√50≒**1.41**、中央値は約 1.41×√(π/2)≒**1.77**。どちらも不偏なので、ばらつきの小さい**標本平均**を使う（有効）。中央値で同じ精度を出すには約 π/2≒1.57倍のデータが要る。ただし外れ値が混ざるデータでは中央値の方が安定することがある。
  checks:
    - 'abs(10/math.sqrt(50) - 1.41) < 0.005 and abs(10/math.sqrt(50)*math.sqrt(math.pi/2) - 1.77) < 0.005 and abs(math.pi/2 - 1.57) < 0.005'
  lab:
    id: LAB-est
    mode: comp
    set: {sigma: 10, n: 50, b: 0}
    task: σ＝10、n＝50。標本平均の SE は（小数で）？
    predict: {type: number, key: seMean, label: "標本平均の SE"}
    expect: 1.4142
    why: 10÷√50≒1.414。中央値の分布はそれより一回り広い。n を変えても、比はおよそ1.25倍（分散で1.57倍）のまま。

- id: Q-U21-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 推定量の性質について、正しいものはどれか。
  choices:
    - 不偏推定量で求めた推定値は、母数に一致する。
    - n で割る標本分散 v は不偏ではないが、一致性をもつ。
    - 標本の大きさを十分大きくすれば、回答者の自己選択による偏りもなくなる。
    - 不偏分散 s² が σ² に不偏なので、s も σ に不偏である。
    - 2つの推定量のうち、不偏な方がいつも平均二乗誤差（MSE）が小さい。
  correct: 2
  answer: E[v]＝(n−1)σ²÷n で偏りは −σ²÷n。n を大きくすると偏りもばらつきも0に近づくので一致する。n＝5 なら期待値は σ² の0.8倍。
  misconceptions:
    1: 不偏は「取り直したときの平均が母数に一致する」という性質で、1回の推定値が当たる保証ではない
    3: 自己選択の偏りは集め方から来るので、n を増やしても消えない
    4: 平方根を取ると平均がずれ、s は平均すると σ より小さい
    5: MSE＝分散＋偏り²。正規母集団の分散では、偏りのある v の方が s² より MSE が小さい
  checks:
    - '4/5 == 0.8'
  lab:
    id: LAB-est
    mode: var
    set: {sigma2: 10, n: 5}
    task: n＝5 のとき、v の期待値は σ² の何倍か（(n−1)/n）。
    predict: {type: number, key: ratio, label: "(n−1)/n"}
    expect: 0.8
    why: 4/5＝0.8。n を50にすると0.98で、1に近づく（一致）。

- id: Q-U21-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 6日分の売上（万円）は 12, 15, 9, 14, 10, 18。ふだんの1日の売上の平均と分散を推定し、平均の標準誤差も求めよ。
  answer: x̄＝78÷6＝**13**。偏差 −1, 2, −4, 1, −3, 5 の2乗和＝1＋4＋16＋1＋9＋25＝56、s²＝56÷5＝**11.2**、s≒3.35。平均の SE＝s÷√6≒**1.37**万円。報告するときは「6日・n−1 で割った値」も添える。
  checks:
    - '12+15+9+14+10+18 == 78 and 78/6 == 13 and 1+4+16+1+9+25 == 56 and abs(56/5 - 11.2) < 1e-12 and abs(math.sqrt(11.2) - 3.35) < 0.005 and abs(math.sqrt(11.2)/math.sqrt(6) - 1.37) < 0.005'
  lab:
    id: LAB-est
    mode: calc
    set: {vals: "12,15,9,14,10,18"}
    task: 6日の売上 12, 15, 9, 14, 10, 18。不偏分散 s² は（小数で）？
    predict: {type: number, key: s2, label: "s²"}
    expect: 11.2
    why: 偏差の2乗和56を5で割って11.2。平均の SE は√(11.2÷6)≒1.37。

- id: Q-U21-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 店頭アンケートで、本当の満足率が0.4、満足の人の回答率60%・不満の人20% とする。2000人分の回答で満足率を推定するとき、偏りと標準誤差はそれぞれどれくらいか。どちらが推定を大きくずらしているか。
  answer: 落ち着く先＝0.4×0.6÷(0.4×0.6＋0.6×0.2)＝0.24÷0.36≒0.667、偏り≒**0.267**。SE＝√(0.667×0.333÷2000)≒**0.011**。ずれのほとんどは**偏り**で、回答数をいくら増やしても直らない。回答率をそろえる工夫が先。
  checks:
    - 'abs(0.24/0.36 - 0.667) < 0.0005 and abs(0.24/0.36-0.4 - 0.267) < 0.0005 and abs(math.sqrt((2/3)*(1/3)/2000) - 0.011) < 0.0005 and abs(0.4*0.6+0.6*0.2 - 0.36) < 1e-12'
  lab:
    id: LAB-est
    mode: self
    set: {p: 0.4, r1: 0.6, r0: 0.2, n: 2000}
    task: 本当の満足率0.4、回答率は満足60%・不満20%、回答2000人。偏り（落ち着く先−0.4）は（小数で）？
    predict: {type: number, key: bias, label: "偏り"}
    expect: 0.2667
    why: 落ち着く先は約0.667で、偏りは約0.267。SE は約0.011 で、偏りの25分の1ほど。

- id: Q-U21-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1日の販売数の標準偏差は14個。明日の仕入れの基準に、「直近7日の平均」と「昨日1日の値」のどちらを使うか。どちらも平均は同じ（不偏）とみて、ばらつきで比べよ。
  answer: 7日平均の SE＝14÷√7≒**5.29**個、昨日1日の値は**14**個。どちらも不偏だが、7日平均の方がばらつきが小さく有効。ただし曜日で売れ方が違うなら、同じ曜日の平均を使うなど分布をそろえる。
  checks:
    - 'abs(14/math.sqrt(7) - 5.29) < 0.005'
  lab:
    id: LAB-est
    mode: comp
    set: {sigma: 14, n: 7, b: 0}
    task: σ＝14、n＝7。標本平均の SE は（小数で）？
    predict: {type: number, key: seMean, label: "標本平均の SE"}
    expect: 5.2915
    why: 14÷√7≒5.29。最初の1個（昨日だけ）の広がりは14のまま。

- id: Q-U21-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 正規母集団（σ²＝100、σ＝10）から n＝5 を取る。s² の期待値は100。s の期待値は c₄σ で、n＝5 なら c₄≒0.940。s の期待値を求め、s が σ に不偏かを答えよ。
  answer: E[s]≒0.940×10＝**9.40**。σ＝10 より小さいので、s は σ に**不偏ではない**。s² が不偏でも、平方根を取ると平均が小さめにずれる。
  checks:
    - 'abs(math.sqrt(2/4)*math.exp(math.lgamma(2.5)-math.lgamma(2)) - 0.940) < 0.0005 and abs(0.940*10 - 9.40) < 1e-9'
  lab:
    id: LAB-est
    mode: var
    set: {sigma2: 100, n: 5}
    task: σ²＝100、n＝5。s の期待値 E[s] は（小数で）？
    predict: {type: number, key: meanS, label: "E[s]"}
    expect: 9.4
    why: c₄σ≒0.940×10＝9.40。n を50にすると c₄≒0.995 で、ずれは小さくなる。
