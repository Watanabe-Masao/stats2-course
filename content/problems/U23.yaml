  checks:
    - 'abs(math.sqrt(0.18*0.82/500+0.12*0.88/500) - 0.0225) < 0.00005 and abs(1.96*math.sqrt(0.18*0.82/500+0.12*0.88/500) - 0.0441) < 0.00005 and abs(0.06-1.96*math.sqrt(0.18*0.82/500+0.12*0.88/500) - 0.016) < 0.0005 and abs(0.06+1.96*math.sqrt(0.18*0.82/500+0.12*0.88/500) - 0.104) < 0.0005 and 90/500 == 0.18 and 60/500 == 0.12'
  lab:
