- id: Q-U23-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 区間推定について、正しいものはどれか。
  choices:
    - 母分散の95%信頼区間は、s² を中心に左右同じ幅になる。
    - 母分散の区間の下限は、(n−1)s² を χ² の小さい方の点で割って求める。
    - 同じ人の前後のデータは、1人ごとの差を取り、差の平均の t 区間を作る。
    - 2群それぞれの95%信頼区間が重なれば、2群の差の区間は必ず0を含む。
    - 比率の差の信頼区間では、2群を合わせた比率で標準誤差を作る。
  correct: 3
  answer: 対応のあるデータは差 D を1つのデータとみて、D̄ ± t(n−1)×s_D÷√n。n＝10、s²＝4 の母分散の区間は約1.89〜13.33 で、s² の左右で幅が違う。
  misconceptions:
    1: χ² が左右対称でないので、区間も s² の左右で幅が違う
    2: 小さい点で割ると大きくなるので上限。下限は大きい点で割る
    4: 区間が少し重なっていても、差の区間が0を含まないことはある。差の区間を作って判断する
    5: 区間では各群の p̂ を使う。合わせた比率は「差がない」と仮定する検定で使う
  checks:
    - 'abs(36/19.023 - 1.89) < 0.005 and abs(36/2.700 - 13.33) < 0.005'
  lab:
    id: LAB-two
    mode: var
    set: {level: 0.95, n: 10, s2: 4}
    task: n＝10、s²＝4。母分散の95%信頼区間の上の端は（小数で）？
    predict: {type: number, key: hi, label: "区間の上の端"}
    expect: 13.3314
    why: 36÷2.700≒13.33。下の端は約1.89 で、s²＝4 との距離が左右で大きく違う。

