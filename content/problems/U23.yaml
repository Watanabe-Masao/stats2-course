- id: Q-U23-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 店A（12日、平均68・s₁＝3）と店B（8日、平均62・s₂＝9）の平均の差の95%信頼区間を、① 等分散を仮定して（t(18) の0.975点2.101）② ウェルチで（自由度≒8.0、t の点≒2.304）求め、どちらを使うべきか答えよ。
  answer: ① 合わせた分散＝(11×9＋7×81)÷18＝37、SE＝√(37×(1÷12＋1÷8))≒2.776、区間は約 **0.167〜11.833**（0を含まない）。② SE＝√(9÷12＋81÷8)≒3.298、区間は約 **−1.60〜13.60**（0を含む）。ばらつきが3倍違い、ばらつきの大きいBの方が日数が少ないので、等分散を仮定すると SE を小さく見積もってしまう。**ウェルチ**を使い、「差があるとは言えない」とする。
  checks:
    - '(11*9+7*81)/18 == 37 and abs(math.sqrt(37*(1/12+1/8)) - 2.776) < 0.0005 and abs(6-2.101*math.sqrt(37*(1/12+1/8)) - 0.167) < 0.0005 and abs(6+2.101*math.sqrt(37*(1/12+1/8)) - 11.833) < 0.0005'
    - 'abs(math.sqrt(9/12+81/8) - 3.298) < 0.0005 and abs(6-2.304*math.sqrt(9/12+81/8) + 1.60) < 0.005 and abs(6+2.304*math.sqrt(9/12+81/8) - 13.60) < 0.005 and abs((9/12+81/8)**2/((9/12)**2/11+(81/8)**2/7) - 8.0) < 0.05 and 9/3 == 3'
  lab:
    id: LAB-two
    mode: diff
    set: {method: welch, x1: 68, s1: 3, n1: 12, x2: 62, s2: 9, n2: 8}
    task: 68（s＝3、12日）と62（s＝9、8日）。ウェルチの95%信頼区間の下の端は（小数で）？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: -1.5968
    why: SE≒3.30、自由度≒8.05、t の点≒2.30 で、区間は約 −1.60〜13.60。「等分散を仮定」に切り替えると約0.17〜11.83 で0を含まなくなる。

