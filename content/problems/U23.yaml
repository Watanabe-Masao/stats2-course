# 単元U23の問題。id は変えない（個人の解答記録がこの id を指す）。
# t・χ²・F の点は問題文に数表の値として書く
- id: Q-U23-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    レジ1回の処理時間を16回測ると、不偏分散は s²＝9（秒²）だった。母分散の95%信頼区間と、母標準偏差の95%信頼区間を求めよ。（χ²(15) の0.025点は6.262、0.975点は27.488）

    (n−1)s²＝□×□＝□。下限＝□÷27.488≒□、上限＝□÷6.262≒□。標準偏差の区間は √□〜√□ ≒ □〜□ 秒。
  answer_title: 答え（埋めてから開く）
  answer: (n−1)s²＝15×9＝**135**。下限＝135÷27.488≒**4.911**、上限＝135÷6.262≒**21.559**。標準偏差の区間は約 **2.216〜4.643 秒**。s²＝9 は区間の真ん中より下限側にある。
  checks:
    - '15*9 == 135 and abs(135/27.488 - 4.911) < 0.0005 and abs(135/6.262 - 21.559) < 0.0005 and abs(math.sqrt(135/27.488) - 2.216) < 0.0005 and abs(math.sqrt(135/6.262) - 4.643) < 0.0005'
  lab:
    id: LAB-two
    mode: var
    set: {level: 0.95, n: 16, s2: 9}
    task: n＝16、s²＝9。母分散の95%信頼区間の上の端は（小数で）？
    predict: {type: number, key: hi, label: "区間の上の端"}
    expect: 21.558
    why: 135÷6.262≒21.56。下の端は約4.91。標準偏差なら平方根を取って約2.22〜4.64秒。

- id: Q-U23-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 同じ25店で、施策の前後の売上の差 D を取ると、平均は2万円、差の標準偏差は5万円だった。差の平均の95%信頼区間を求め、施策の効果があると言えるか答えよ。（t(24) の0.975点は2.064）
  answer: SE＝5÷√25＝1。2±2.064×1 → **−0.064〜4.064**。区間が**0を含む**ので、差があるとは言えない（効果がないとも言い切れない）。
  checks:
    - '5/math.sqrt(25) == 1 and abs(2-2.064 + 0.064) < 1e-9 and abs(2+2.064 - 4.064) < 1e-9'
  lab:
    id: LAB-two
    mode: paired
    set: {dbar: 2, sd: 5, n: 25}
    task: 25店の前後差の平均2万円、差の標準偏差5万円。差の平均の95%信頼区間の下の端は（小数で）？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: -0.0639
    why: 2−2.064≒−0.064 で、わずかに0未満。区間は0を含む。店を36にすると SE は約0.83 になり、0を含まなくなる。

- id: Q-U23-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: キャンペーンAは200人中60人、Bは200人中40人が購入した。購入率の差 p̂_A−p̂_B の95%信頼区間を求め、0を含むか答えよ。
  answer: p̂_A＝0.3、p̂_B＝0.2、差0.1。SE＝√(0.3×0.7÷200＋0.2×0.8÷200)＝√0.00185≒0.0430、誤差幅≒0.0843。区間は **0.0157〜0.1843** で、**0を含まない**。Aの方が購入率が高いと言える。
  checks:
    - 'abs(0.3*0.7/200+0.2*0.8/200 - 0.00185) < 1e-12 and abs(math.sqrt(0.00185) - 0.0430) < 0.00005 and abs(1.96*math.sqrt(0.00185) - 0.0843) < 0.00005 and abs(0.1-1.96*math.sqrt(0.00185) - 0.0157) < 0.00005 and abs(0.1+1.96*math.sqrt(0.00185) - 0.1843) < 0.00005'
  lab:
    id: LAB-two
    mode: prop2
    set: {x1: 60, n1: 200, x2: 40, n2: 200}
    task: 200人中60人と200人中40人。購入率の差の95%信頼区間の下の端は（小数で）？
    predict: {type: number, key: lo, label: "区間の下の端"}
    expect: 0.0157
    why: 0.1−0.0843≒0.016。わずかに0より上。人数が各100人なら区間は0を含む。

- id: Q-U23-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: A地区16店の客単価の平均は52百円・s₁＝8、B地区16店は48百円・s₂＝6。等分散を仮定して、平均の差の95%信頼区間を求めよ。（t(30) の0.975点は2.042）
  answer: 合わせた分散 s²＝(15×64＋15×36)÷30＝50、SE＝√(50×(1÷16＋1÷16))＝√6.25＝2.5。誤差幅＝2.042×2.5＝**5.105**。区間は **−1.105〜9.105** で0を含む。2店数が同じなので、ウェルチでも SE は同じ2.5。
  checks:
    - '(15*64+15*36)/30 == 50 and math.sqrt(50*(1/16+1/16)) == 2.5 and abs(2.042*2.5 - 5.105) < 1e-9 and abs(4-5.105 + 1.105) < 1e-9 and abs(4+5.105 - 9.105) < 1e-9 and math.sqrt(64/16+36/16) == 2.5'
  lab:
    id: LAB-two
    mode: diff
    set: {method: pooled, x1: 52, s1: 8, n1: 16, x2: 48, s2: 6, n2: 16}
    task: 等分散を仮定。52（s＝8、16店）と48（s＝6、16店）の差の95%信頼区間の誤差幅は（小数で）？
    predict: {type: number, key: margin, label: "誤差幅"}
    expect: 5.1057
    why: t(30) の点約2.042×SE 2.5≒5.11。ウェルチに切り替えても SE は2.5、自由度が約27.8 になるだけ。

