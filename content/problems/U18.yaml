# 単元U18の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U18-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    母分散が100の母集団から、独立に25個取って平均 x̄ を出す。x̄ の分散と標準誤差は？ n を100にすると標準誤差は何倍か。

    x̄ の分散＝σ²÷n＝100÷25＝□、SE＝√□＝□。n＝100 なら SE＝√(100÷100)＝□ で、□倍
  answer_title: 答え（埋めてから開く）
  answer: x̄ の分散は **4**、SE は **2**。n＝100 なら SE は **1** で **1/2倍**（n を4倍にすると SE は半分）。母分散100（σ＝10）は n を変えても10のまま。
  checks:
    - '100/25 == 4 and math.sqrt(4) == 2 and math.sqrt(100/100) == 1 and math.isclose(1/2, 0.5) and math.sqrt(100) == 10'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 0, sd: 10, n: 25}
    task: 標準偏差10（母分散100）の母集団から25個。x̄ の分散はいくつか。
    predict: {type: number, key: var, label: "x̄ の分散"}
    expect: 4
    why: σ²÷n＝100÷25＝4、SE は √4＝2。n を100にすると分散1・SE1。分散は n に反比例、SE は √n に反比例。

- id: Q-U18-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 来店客の30%がポイントカードを出す店で、400人を調べてポイントカードを出す割合 p̂ を出す。p̂ の標準誤差は？ p̂ はおよそどの範囲に入るか（±2SE）。
  answer_title: 答え（解いてから開く）
  answer: SE＝√(0.3×0.7÷400)＝√0.000525≒**0.023**（約2.3ポイント）。±2SE は ±0.046 で、p̂ はおよそ **25.4%〜34.6%** に入る。p̂ も「出す＝1・出さない＝0」の平均なので、σ²＝p(1−p)＝0.21 の平均のぶれとして計算できる。
  checks:
    - 'abs(0.3*0.7/400 - 0.000525) < 1e-12 and abs(math.sqrt(0.000525) - 0.023) < 0.0005 and abs(2*math.sqrt(0.000525) - 0.046) < 0.0005 and abs(0.3-0.0458 - 0.254) < 0.0005 and abs(0.3+0.0458 - 0.346) < 0.0005 and math.isclose(0.3*0.7, 0.21)'
  lab:
    id: LAB-xbar
    mode: prop
    set: {p: 0.3, n: 400, e: 0.02}
    task: 比率 p＝0.3、400人で調べる。p̂ の標準誤差は（小数で）？
    predict: {type: number, key: se, label: "SE(p̂)"}
    expect: 0.0229
    why: √(0.3×0.7÷400)≒0.023。n を1600にすると半分の約0.011。p を0.5に近づけると SE は大きくなる。

- id: Q-U18-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 1日の来店客1人の購入額は標準偏差2000円。16人の平均購入額の標準誤差は？
  answer: 2000÷√16＝2000÷4＝**500円**。
  checks:
    - '2000/math.sqrt(16) == 500'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 1000, sd: 2000, n: 16}
    task: 1人の購入額の標準偏差は2000円。16人の平均の標準誤差は何円か。
    predict: {type: number, key: se, label: "SE", unit: "円"}
    expect: 500
    why: 2000÷√16＝500円。1人ずつのばらつき2000円は変わらない。人数を64人にすると250円。

- id: Q-U18-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 標準偏差10の母集団から25個取ると、平均の標準誤差は2。標準誤差を1にするには何個、0.5にするには何個必要か。
  answer: SE＝10÷√n。SE＝1 なら √n＝10 で **n＝100**、SE＝0.5 なら √n＝20 で **n＝400**。SE を半分にするたびに n は4倍要る。
  checks:
    - '10/math.sqrt(25) == 2 and 10/math.sqrt(100) == 1 and 10/math.sqrt(400) == 0.5 and 100/25 == 4 and 400/100 == 4'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 0, sd: 10, n: 100}
    task: 標準偏差10の母集団から100個取る。平均の標準誤差はいくつか。
    predict: {type: number, key: se, label: "SE"}
    expect: 1
    why: 10÷√100＝1。25個の2から半分になるのに4倍の個数が要る。n を400にすると0.5。

- id: Q-U18-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 商品1個の重さは平均50g・標準偏差12gで、1個ずつ独立とする。36個を1箱に詰めたとき、① 箱の中身の合計の重さの平均と標準偏差 ② 36個の平均重量の平均と標準偏差（SE）を求め、比べよ。
  answer: ① 合計の平均は 36×50＝**1800g**、分散は 36×144＝5184、標準偏差は **72g**（12×√36）。② 平均は **50g**、標準偏差は 72÷36＝**2g**（12÷√36）。合計は n 倍、平均は合計を n で割るので、標準偏差は σ×√n と σ÷√n になる（{{unit:U13}} の和の分散）。
  checks:
    - '36*50 == 1800 and 36*144 == 5184 and math.sqrt(5184) == 72 and 12*math.sqrt(36) == 72 and 72/36 == 2 and 12/math.sqrt(36) == 2'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 50, sd: 12, n: 36}
    task: 1個の重さは平均50g・標準偏差12g。36個の合計の標準偏差は何gか。
    predict: {type: number, key: sdsum, label: "合計の標準偏差", unit: "g"}
    expect: 72
    why: 分散が36倍の5184で、標準偏差は 12×6＝72g。平均にすると36で割って2g。合計のぶれは大きくなるが、平均のぶれは小さくなる。

- id: Q-U18-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 新商品を試した客のうち「また買う」と答える割合が p＝0.5 だとする。100人に聞いたときの p̂ の標準誤差は？ 400人なら？
  answer: 100人：√(0.5×0.5÷100)＝**0.05**（5ポイント）。400人：√(0.25÷400)＝**0.025**。人数を4倍にすると SE は半分。p＝0.5 のとき p(1−p) が最大なので、SE も最大になる。
  checks:
    - 'math.isclose(math.sqrt(0.25/100), 0.05) and math.isclose(math.sqrt(0.25/400), 0.025) and math.isclose(0.5*0.5, 0.25)'
  lab:
    id: LAB-xbar
    mode: prop
    set: {p: 0.5, n: 100, e: 0.02}
    task: 比率 p＝0.5、100人に聞く。p̂ の標準誤差は（小数で）？
    predict: {type: number, key: se, label: "SE(p̂)"}
    expect: 0.05
    why: √(0.25÷100)＝0.05。p を0.2にすると0.04、0.1にすると0.03。同じ人数でも、p が0.5に近いほどぶれは大きい。

- id: Q-U18-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 3つの値 2・4・9（母分散 σ²＝26/3≒8.67）から、戻しながら2個取る標本は9通り。各標本で n−1 で割る不偏分散 s² を出し、9通りの平均を求めよ。n で割る分散 v の平均とも比べよ。
  answer: s² の平均は **8.67**（σ² と一致）、v の平均は **4.33**（σ² の (n−1)/n＝1/2）。1つ1つの s² は0になったり大きくなったりするが、平均すると σ² に当たる。これが不偏分散の「不偏」。
  checks:
    - 'abs(((2-5)**2+(4-5)**2+(9-5)**2)/3 - 26/3) < 1e-12 and abs(26/3 - 8.67) < 0.005 and abs(26/3/2 - 4.33) < 0.005'
  lab:
    id: LAB-xbar
    mode: unb
    set: {vals: "2,4,9", n: 2}
    task: 3つの値 2・4・9 から戻しながら2個取る9通りで、不偏分散 s² の平均は（小数で）？
    predict: {type: number, key: meanS2, label: "s² の平均"}
    expect: 8.6667
    why: σ²＝26/3≒8.67 とちょうど一致する。n で割る v の平均は半分の4.33。n−1 で割るのは、x̄ から測った偏差が小さく出る分を補うため。

- id: Q-U18-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 1袋の内容量は平均500g・標準偏差10gの正規分布に従う。25袋の平均 x̄ が496g以下になる確率は？（x̄ も正規分布に従う。正規分布の確率は {{unit:U16}}、Φ(2)＝0.9772）
  answer: SE＝10÷√25＝2。z＝(496−500)÷2＝−2。P(x̄≦496)＝1−0.9772＝**0.0228**（約2%）。1袋なら z＝−0.4 で約34% あるが、25袋の平均が4gも下がることはめったにない。
  checks:
    - '10/math.sqrt(25) == 2 and (496-500)/2 == -2 and abs(1-0.9772 - 0.0228) < 1e-9 and (496-500)/10 == -0.4 and abs(0.5*(1+math.erf(-0.4/math.sqrt(2))) - 0.34) < 0.005'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 500, sd: 2, a: 494, b: 496, kind: le}
    task: 25袋の平均 x̄ は平均500g・標準偏差（SE）2g の正規分布。x̄ が496g以下になる確率は（小数で）？
    predict: {type: number, key: p, label: "P(x̄≦496)"}
    expect: 0.0228
    why: z＝−2 で約2.3%。標準偏差を1袋の10にすると約34%。平均の分布は、1個の分布より ÷√n だけ細い。

- id: Q-U18-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: ある店の1日の売上は平均50万円・標準偏差10万円で、日ごとに独立とする。① ある1日の売上は、平均からおよそどれくらいずれるか ② 30日間の1日平均売上は、平均からおよそどれくらいずれるか。それぞれ標準偏差か標準誤差かを言って答えよ。
  answer: ① 1日ずつのずれは**標準偏差**の **10万円**。② 30日平均のずれは**標準誤差** 10÷√30≒**1.83万円**。聞かれているのが「1つの値」か「平均」かで使う数が変わる。
  checks:
    - 'abs(10/math.sqrt(30) - 1.83) < 0.005'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 50, sd: 10, n: 30}
    task: 1日の売上は平均50万円・標準偏差10万円。30日間の1日平均売上の標準誤差は（万円・小数で）？
    predict: {type: number, key: se, label: "SE", unit: "万円"}
    expect: 1.8257
    why: 10÷√30≒1.83万円。1日ずつの標準偏差10万円とは別もの。「先月の平均売上が2万円下がった」は、SE の1倍ほどで、偶然でも起こりうる大きさ。

- id: Q-U18-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 購入率を調べたい。p がどれくらいか分からないので p＝0.5 として、標本比率 p̂ の標準誤差を0.02以下にするには何人に聞けばよいか。
  answer: √(0.25÷n)≦0.02 より n≧0.25÷0.0004＝**625人**。p が分からないときは、SE が最大になる p＝0.5 で計算すれば、本当の p が何でも SE は0.02以下になる。
  checks:
    - 'math.isclose(0.25/0.02**2, 625) and math.isclose(math.sqrt(0.25/625), 0.02)'
  lab:
    id: LAB-xbar
    mode: prop
    set: {p: 0.5, n: 100, e: 0.02}
    task: p＝0.5 のとき、SE(p̂) を0.02以下にする人数は何人か。
    predict: {type: number, key: nFor, label: "必要な人数", unit: "人"}
    expect: 625
    why: 0.25÷0.02²＝625人。目標の SE を0.01にすると2500人（4倍）。p＝0.2 が分かっていれば 0.16÷0.0004＝400人で済む。

- id: Q-U18-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 商品Aは1個の重さの標準偏差が12g、商品Bは24g。商品Aは36個の平均で標準誤差2gになる。商品Bで同じ標準誤差2gにするには何個の平均が必要か。
  answer: 24÷√n＝2 より √n＝12、**n＝144個**。標準偏差が2倍なら、同じ精度に必要な個数は4倍（2²倍）。
  checks:
    - '12/math.sqrt(36) == 2 and 24/math.sqrt(144) == 2 and 144/36 == 4'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 50, sd: 24, n: 144}
    task: 1個の標準偏差が24gの商品で、144個の平均の標準誤差は何gか。
    predict: {type: number, key: se, label: "SE", unit: "g"}
    expect: 2
    why: 24÷12＝2g。ばらつきの大きい商品ほど、平均を安定させるのに多くの個数が要る（σ² に比例）。

- id: Q-U18-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 母平均 μ・母分散 σ² の母集団から独立に取った大きさ n の標本について、正しいものはどれか。
  choices:
    - 標本の大きさ n を4倍にすると、標本平均の標準誤差は1/4になる。
    - 標本の大きさを大きくすると、データ1個1個の標準偏差も小さくなる。
    - 標本平均の期待値は母平均 μ に等しく、分散は σ²/n である。
    - 偏差の2乗和を n で割った標本分散の期待値は、母分散 σ² に等しい。
    - 標本比率 p̂ の分散は p(1−p) である。
  correct: 3
  answer: E(x̄)＝μ、V(x̄)＝σ²/n。独立なら分散は足せて（nσ²）、n で割ると n² で割ることになるから。
  misconceptions:
    1: SE は σ/√n なので、n を4倍にすると1/2。1/4になるのは分散
    2: 1個1個のばらつき σ は n に関係ない。小さくなるのは平均のぶれ
    4: n で割ると平均して (n−1)/n×σ² で小さめ。n−1 で割る不偏分散なら σ²
    5: p̂ は n 人の平均なので、分散は p(1−p)/n
  checks:
    - 'math.isclose(1/math.sqrt(4), 0.5)'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 50, sd: 12, n: 36}
    task: σ＝12 の母集団から36個。標本平均の分散 σ²/n はいくつか。
    predict: {type: number, key: var, label: "x̄ の分散"}
    expect: 4
    why: 144÷36＝4（SE は2）。n を144にすると分散は1で1/4、SE は1で1/2。

- id: Q-U18-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1客あたりの購入額は標準偏差1200円。1日400客の店で、その日の客単価（平均購入額）の標準誤差は？ 「客単価が前日より50円下がった」は、偶然のぶれで起こりうるか。
  answer: SE＝1200÷√400＝**60円**。2日の客単価の差の標準偏差は √(60²＋60²)≒85円で、50円の差はその1倍にも届かない。偶然のぶれで十分起こりうるので、1日の差だけで「下がった」と判断しない。
  checks:
    - '1200/math.sqrt(400) == 60 and abs(math.sqrt(60**2+60**2) - 85) < 0.5 and 50 < math.sqrt(60**2+60**2)'
  lab:
    id: LAB-xbar
    mode: se
    set: {mu: 1000, sd: 1200, n: 400}
    task: 1客の購入額の標準偏差は1200円。400客の平均（客単価）の標準誤差は何円か。
    predict: {type: number, key: se, label: "SE", unit: "円"}
    expect: 60
    why: 1200÷20＝60円。客数が100の小さな店なら120円で、客単価はもっと大きく上下する。

- id: Q-U18-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 試食した150人に聞くと、新商品の「おいしい」率が60%だった。本当の率も0.6だとすると、150人の p̂ の標準誤差は？ 別の日に同じ150人規模で聞いたら、p̂ はおよそどの範囲に入るか（±2SE）。
  answer: SE＝√(0.6×0.4÷150)＝√0.0016＝**0.04**。±2SE で **52%〜68%** くらい。日によって10ポイント近く違っても、偶然のぶれの範囲。
  checks:
    - 'math.isclose(0.6*0.4/150, 0.0016) and math.isclose(math.sqrt(0.0016), 0.04) and math.isclose(0.6-0.08, 0.52) and math.isclose(0.6+0.08, 0.68)'
  lab:
    id: LAB-xbar
    mode: prop
    set: {p: 0.6, n: 150, e: 0.02}
    task: 比率 p＝0.6、150人。p̂ の標準誤差は（小数で）？
    predict: {type: number, key: se, label: "SE(p̂)"}
    expect: 0.04
    why: √(0.24÷150)＝0.04。±2SE で ±8ポイント。600人に聞けば ±4ポイントになる。

- id: Q-U18-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1袋の内容量は平均500g・標準偏差4gの正規分布。毎朝16袋を抜き取って平均を測り、平均が498g以下なら機械を調整する。機械が正常（平均500g）でも調整してしまう確率は？（Φ(2)＝0.9772）
  answer: SE＝4÷√16＝1。z＝(498−500)÷1＝−2。1−0.9772＝**0.0228**（約2%、50日に1日ほど）。1袋だけで判断すると z＝−0.5 で約31%も「調整」になってしまう。平均で見るから基準を厳しくできる。
  checks:
    - '4/math.sqrt(16) == 1 and (498-500)/1 == -2 and abs(1-0.9772 - 0.0228) < 1e-9 and abs(0.5*(1+math.erf(-0.5/math.sqrt(2))) - 0.31) < 0.005 and 40 < 1/0.0228 < 50'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 500, sd: 1, a: 495, b: 498, kind: le}
    task: 16袋の平均 x̄ は平均500g・標準偏差（SE）1g の正規分布。x̄ が498g以下になる確率は（小数で）？
    predict: {type: number, key: p, label: "P(x̄≦498)"}
    expect: 0.0228
    why: z＝−2 で約2.3%。標準偏差を1袋の4gにすると約31%。平均で判断すると、正常なのに調整する空振りが減る。

- id: Q-U18-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 3つの値 1・2・6（母分散 σ²＝14/3）から、戻しながら3個取る標本は27通り。n で割る分散 v の平均は、σ² の何倍になるか。
  answer: v の平均は (n−1)/n×σ²＝2/3×14/3＝28/9≒**3.11**。σ²≒4.67 の **2/3倍**。n−1 で割る s² なら平均は4.67。n が大きいほど (n−1)/n は1に近づき、差は小さくなる。
  checks:
    - 'abs(((1-3)**2+(2-3)**2+(6-3)**2)/3 - 14/3) < 1e-12 and math.isclose(2/3*14/3, 28/9) and abs(28/9 - 3.11) < 0.005 and abs(14/3 - 4.67) < 0.005 and 3**3 == 27'
  lab:
    id: LAB-xbar
    mode: unb
    set: {vals: "1,2,6", n: 3}
