# 単元U16の問題。id は変えない（個人の解答記録がこの id を指す）。
# 検算の Φ(z) は 0.5*(1+math.erf(z/math.sqrt(2)))
- id: Q-U16-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    卵1個の重さは平均60g・標準偏差4gの正規分布に従う。52g以上66g以下の卵の割合は？（Φ(1.5)＝0.9332、Φ(−2)＝0.0228）

    52g → z＝(52−60)÷4＝□、66g → z＝(66−60)÷4＝□。割合＝Φ(□)−Φ(□)＝□
  answer_title: 答え（埋めてから開く）
  answer: z は **−2** と **1.5**。割合＝0.9332−0.0228＝**0.9104**（約91%）。左右で z の大きさが違うので、±1σ・±2σ の決まった割合は使えない。
  checks:
    - '(52-60)/4 == -2 and (66-60)/4 == 1.5 and abs(0.9332-0.0228 - 0.9104) < 1e-9'
    - 'abs(0.5*(1+math.erf(1.5/math.sqrt(2))) - 0.9332) < 0.00005 and abs(0.5*(1+math.erf(-2/math.sqrt(2))) - 0.0228) < 0.00005'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 60, sd: 4, a: 52, b: 66, kind: between}
    task: 卵の重さは平均60g・標準偏差4gの正規分布。52g以上66g以下の割合は（小数で）？
    predict: {type: number, key: p, label: "P(52≦X≦66)"}
    expect: 0.9104
    why: z は −2 と 1.5。Φ(1.5)−Φ(−2)≒0.910。左右で z が違うときは、両端それぞれの Φ を引く。

- id: Q-U16-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: バスは15分おきに来る。時刻表を見ずにでたらめな時刻にバス停へ行くと、待ち時間は0分から15分の一様分布になる。5分以上待つ確率と、待ち時間の平均は？
  answer_title: 答え（解いてから開く）
  answer: 一様分布 U(0, 15) の高さは 1÷15。5分以上は幅10なので 10÷15＝**2/3**（約0.667）。平均は (0＋15)÷2＝**7.5分**。
  checks:
    - 'math.isclose(10/15, 2/3) and abs(2/3 - 0.667) < 0.0005 and math.isclose((0+15)/2, 7.5)'
  lab:
    id: LAB-cont
    mode: unif
    set: {unit: 分, a: 0, b: 15, c: 5, d: 15}
    task: 待ち時間は0分から15分の一様分布。5分以上待つ確率は（小数で）？
    predict: {type: number, key: p, label: "P(X≧5)"}
    expect: 0.6667
    why: 幅10÷全体15≒0.667。一様分布では、確率は区間の幅に比例する。平均は真ん中の7.5分。

- id: Q-U16-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: X が平均50・標準偏差5の正規分布 N(50, 5²) に従うとき、60 の z得点は？ また P(X≦60) は？（Φ(2)＝0.9772）
  answer: z＝(60−50)÷5＝**2**。P(X≦60)＝Φ(2)＝**0.9772**。
  checks:
    - '(60-50)/5 == 2 and abs(0.5*(1+math.erf(2/math.sqrt(2))) - 0.9772) < 0.00005'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 50, sd: 5, a: 40, b: 60, kind: le}
    task: X は N(50, 5²)。60 を標準化した z（z_b）はいくつか。
    predict: {type: number, key: zb, label: "60 の z"}
    expect: 2
    why: (60−50)÷5＝2。N(50, 5²) の「5²」は分散なので、標準偏差は5。分散25で割ると z＝0.4 と間違える。

- id: Q-U16-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: X が一様分布 U(2, 8) に従うとき、P(3≦X≦5) は？ X の平均と分散は？
  answer: 高さは 1÷(8−2)＝1/6。幅2なので P＝2÷6＝**1/3**。平均 (2＋8)÷2＝**5**、分散 (8−2)²÷12＝**3**。
  checks:
    - 'math.isclose(2/6, 1/3) and (2+8)/2 == 5 and (8-2)**2/12 == 3'
  lab:
    id: LAB-cont
    mode: unif
    set: {a: 2, b: 8, c: 3, d: 5}
    task: X は U(2, 8)。P(3≦X≦5) は（小数で）？
    predict: {type: number, key: p, label: "P(3≦X≦5)"}
    expect: 0.3333
    why: 幅2÷全体の幅6＝1/3。高さ1/6×幅2 と同じ。区間が全体のどこにあっても、幅が同じなら確率は同じ。

- id: Q-U16-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 問い合わせは1時間に平均2件（ポアソン分布）で、次の問い合わせまでの待ち時間は平均0.5時間の指数分布になる。① 次まで1時間を超えて待つ確率は？ ② すでに30分待った。そこからさらに1時間を超えて待つ確率は？
  answer: ① λ＝2、P(待ち＞1)＝e⁻²≒**0.135**。② すでに待った時間に関係なく、その先の確率は同じ **0.135**（無記憶性）。e^(−2×1.5)÷e^(−2×0.5)＝e⁻² と計算しても同じ。
  checks:
    - 'abs(math.exp(-2) - 0.135) < 0.0005 and math.isclose(math.exp(-2*1.5)/math.exp(-2*0.5), math.exp(-2)) and math.isclose(1/0.5, 2)'
  lab:
    id: LAB-cont
    mode: expo
    set: {unit: 時間, mean: 0.5, t: 1, s: 0.5}
    task: 待ち時間は平均0.5時間の指数分布。すでに0.5時間待ったとき、さらに1時間を超えて待つ確率は（小数で）？
    predict: {type: number, key: cond, label: "P(さらに1時間超)"}
    expect: 0.1353
    why: 待つ前の P(待ち＞1)＝e⁻²≒0.135 と同じ。「もうすぐ来るはず」とはならない。s を動かしても変わらない。

- id: Q-U16-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 弁当の重さは平均400g・標準偏差8gの正規分布に従う。390g 未満の弁当の割合は？（Φ(1.25)＝0.8944）
  answer: z＝(390−400)÷8＝−1.25。Φ(−1.25)＝1−Φ(1.25)＝1−0.8944＝**0.1056**（約11%）。
  checks:
    - '(390-400)/8 == -1.25 and abs(1-0.8944 - 0.1056) < 1e-9 and abs(0.5*(1+math.erf(-1.25/math.sqrt(2))) - 0.1056) < 0.00005'
  lab:
