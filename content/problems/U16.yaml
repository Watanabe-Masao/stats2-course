    predict: {type: number, key: x, label: "境目の点数", unit: "点"}
    expect: 76.45
    why: 上側5%の z＝1.645 を、値＝μ＋z×σ で元の点数に戻す。確率から値を求めるときは、標準化を逆にたどる。

- id: Q-U16-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 問い合わせは1時間に平均3件（ポアソン分布、{{unit:U15}}）。次の問い合わせまで20分以上待つ確率を、① ポアソン分布の「20分間に0件」と ② 指数分布の待ち時間 の2通りで求めて比べよ。
  answer: ① 20分は1/3時間なので λ＝1、P(0件)＝e⁻¹≒**0.368**。② 待ち時間の平均は1÷3時間＝20分、P(待ち＞20分)＝e^(−20÷20)＝e⁻¹≒**0.368**。同じになる。「t より長く待つ」と「t の間に0件」は同じ出来事。
  checks:
    - 'math.isclose(3*(20/60), 1) and abs(math.exp(-1) - 0.368) < 0.0005 and math.isclose(60/3, 20)'
  lab:
    id: LAB-cont
    mode: expo
    set: {unit: 分, mean: 20, t: 20, s: 0}
    task: 待ち時間は平均20分の指数分布。20分以上待つ確率は（小数で）？
    predict: {type: number, key: pgt, label: "P(待ち＞20)"}
    expect: 0.3679
    why: e⁻¹≒0.368。平均と同じ時間より長く待つのは約37%で、半分より少ない。平均より短く待つことの方が多い。

- id: Q-U16-020
  stage: S3
  format: written
  powers: [P3]
  prompt: 次の量に合う分布は？ (a) 1袋のポテトチップスの重さ (b) 次の客がレジに来るまでの時間 (c) 止まった時計の秒針が指す位置（0〜60秒）。(c) で秒針が0秒から10秒の間にある確率は？
