  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 手元の正規分布表は「z 以上になる確率（上側確率）」で、z＝1.5 の欄に 0.0668 と書いてある。標準正規分布で P(−1.5≦Z≦1.5) は？
  answer: 上側も下側も 0.0668（左右対称）。内側＝1−2×0.0668＝**0.8664**。表が「z 以下」か「z 以上」か「0 から z まで」かを、まず確かめる。
  checks:
