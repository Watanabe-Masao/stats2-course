    predict: {type: number, key: p, label: "P(X≦390)"}
    expect: 0.1056
    why: z＝−1.25。表は正の z しかないことが多いので、左右対称を使って 1−Φ(1.25)。連続分布なので「未満」と「以下」は同じ。

- id: Q-U16-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 試験の点数は平均60点・標準偏差10点の正規分布に従う。上位5%に入るには何点以上が必要か。（上側5%の z は1.645）
  answer: 点数＝60＋1.645×10＝**76.45**。約76.5点以上。
  checks:
    - 'math.isclose(60+1.645*10, 76.45) and abs(0.5*(1+math.erf(1.645/math.sqrt(2))) - 0.95) < 0.0005'
  lab:
    id: LAB-cont
    mode: q
    set: {mu: 60, sd: 10, p: 5, side: upper}
