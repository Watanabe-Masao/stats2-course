- id: Q-U16-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 製品の重さは平均500g・標準偏差3gの正規分布に従う。規格は494g以上506g以下。規格外になる割合は？ 標準偏差を2gに下げると、規格外の割合はどうなるか。（Φ(2)＝0.9772、Φ(3)＝0.9987）
  answer: 規格の端は z＝±2。規格外＝2×(1−0.9772)＝**0.0456**（約4.6%）。標準偏差2gなら z＝±3 で 2×(1−0.9987)＝**0.0026**（約0.3%）。ばらつきを減らすと規格外は大きく減る。
  checks:
    - '(506-500)/3 == 2 and abs(2*(1-0.9772) - 0.0456) < 1e-9 and (506-500)/2 == 3 and abs(2*(1-0.9987) - 0.0026) < 1e-9'
    - 'abs(2*(1-0.5*(1+math.erf(2/math.sqrt(2)))) - 0.0455) < 0.00005 and abs(2*(1-0.5*(1+math.erf(3/math.sqrt(2)))) - 0.0027) < 0.00005'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 500, sd: 3, a: 494, b: 506, kind: out}
    task: 重さは平均500g・標準偏差3gの正規分布。494g未満か506gを超える割合は（小数で）？
    predict: {type: number, key: p, label: "規格外の割合"}
    expect: 0.0455
    why: z＝±2 の外側で約4.6%（表の4桁で計算すると0.0456）。σ を2に下げると約0.3%になる。平均をずらすより、ばらつきを減らす方が効くことが多い。

- id: Q-U16-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 連続型の確率分布について、正しいものはどれか。
  choices:
    - 確率密度関数 f(x) の値は確率なので、1を超えることはない。
    - 連続型の確率変数 X では P(X＝a)＝0 なので、P(X≦a)＝P(X＜a) である。
    - どんなデータも、標準化すれば正規分布になる。
    - 指数分布の平均は、率 λ に等しい。
    - 一様分布 U(0, 10) の分散は 10÷12 である。
  correct: 2
  answer: 1点ちょうどの確率は幅0の面積なので0。「以下」と「未満」は同じ確率になる。
  misconceptions:
    1: f(x) は高さで、確率は面積。σ が小さい正規分布では高さが1を超える
    3: 標準化は目盛りを付け替えるだけで、分布の形（歪み）は変わらない
    4: 指数分布の平均は 1/λ。λ は1単位あたりの件数
    5: 分散は (b−a)²÷12＝100÷12。2乗を忘れない
  checks:
    - 'math.isclose((10-0)**2/12, 100/12)'
  lab:
    id: LAB-cont
    mode: dens
    set: {sd: 0.2, x: 0, w: 0}
    task: 標準偏差0.2の正規分布で、x＝0 ちょうど（幅0）の確率はいくつか。
    predict: {type: number, key: p, label: "P(X＝0)"}
    expect: 0
    why: 幅0の面積は0。高さ f(0)≒1.99 は1を超えているが、確率ではない。幅を少し広げると、確率≒高さ×幅 になる。

