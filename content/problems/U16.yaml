- id: Q-U16-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: レジの待ち時間は平均3分の指数分布に従うとする。5分を超えて待つ客の割合は？ 平均より長く待つ客は半分より多いか少ないか。
  answer: λ＝1/3、e^(−5/3)≒**0.189**（約19%）。平均3分より長く待つ割合は e⁻¹≒0.368 で、**半分より少ない**（多くの客は平均より短く済むが、ときどき長く待つ客が平均を引き上げる）。
