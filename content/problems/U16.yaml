    id: LAB-cont
    mode: expo
    set: {unit: 分, mean: 3, t: 5, s: 0}
    task: 待ち時間は平均3分の指数分布。5分を超えて待つ割合は（小数で）？
    predict: {type: number, key: pgt, label: "P(待ち＞5)"}
    expect: 0.1889
    why: e^(−5/3)≒0.189。t を3（平均）にすると0.368で、半分より少ない。右に長い裾があるので、平均は中央値（約2.1分）より大きい。

- id: Q-U16-040
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: バスが15分おきに来るとき、でたらめな時刻に行ったときの待ち時間 U(0, 15) の分散と標準偏差は？
  answer: 分散＝(15−0)²÷12＝**18.75**、標準偏差＝√18.75≒**4.33分**。幅が2倍になると分散は4倍、標準偏差は2倍。
  checks:
    - 'math.isclose(15**2/12, 18.75) and abs(math.sqrt(18.75) - 4.33) < 0.005 and math.isclose(30**2/12, 4*18.75) and 15**2 == 225'
  lab:
    id: LAB-cont
    mode: unif
    set: {unit: 分, a: 0, b: 15, c: 0, d: 15}
    task: 待ち時間は U(0, 15)。分散はいくつか。
    predict: {type: number, key: var, label: "分散"}
    expect: 18.75
    why: (b−a)²÷12＝225÷12。12で割るのは、一様分布の平均からの距離の2乗を平均するとこうなるから（発展2）。
