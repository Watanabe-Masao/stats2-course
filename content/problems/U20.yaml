- id: Q-U20-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 自由度9のカイ二乗分布の、下側2.5%点（0.025点）と上側2.5%点（0.975点）を表から引き、平均9からの距離を比べよ。表は χ²(9) で 0.025点2.700、0.975点19.023。
  answer: 下側 **2.700**（平均から6.3）、上側 **19.023**（平均から約10）。右に長い形なので、上側の点の方が遠い。z や t のように「平均±同じ幅」にはならない。
  checks:
    - 'abs(9-2.700 - 6.3) < 1e-9 and abs(19.023-9 - 10) < 0.05 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(2.700,9)-0.025) < 5e-4 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(19.023,9)-0.975) < 5e-4'
  lab:
    id: LAB-tcf
    mode: chi
    set: {n: 10, s2: 8, sigma2: 8}
    task: 自由度9のカイ二乗分布。下側2.5%点は（小数で）？
    predict: {type: number, key: lo, label: "χ²(9) の0.025点"}
    expect: 2.7004
    why: 約2.700。上側2.5%点は19.023。平均9から見ると、下は6.3、上は約10離れている。

- id: Q-U20-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 25日分の平均は104、基準は100。① 過去の記録から σ＝10 が分かっている場合（{{unit:U16}} の z）と、② σ が分からずデータの s＝10 を使う場合で、両側5%の判断を比べよ。（t(24) の0.975点は2.064）
  answer: どちらも分母は 10÷√25＝2、値は (104−100)÷2＝**2**。① z＝2＞1.96 で**基準を超える**。② t＝2＜2.064 で**基準以内**。同じ数でも、σ を知っているかで判断が分かれる。
  checks:
    - '10/math.sqrt(25) == 2 and (104-100)/2 == 2 and 2 > 1.96 and 2 < 2.064'
  lab:
    id: LAB-tcf
    mode: tstat
    set: {xbar: 104, mu0: 100, s: 10, n: 25}
    task: 25日の平均104、s＝10、基準100。両側5%の t の点（自由度24）は？
    predict: {type: number, key: tcrit, label: "t(24) の0.975点"}
    expect: 2.0639
    why: 約2.064で、t＝2 はわずかに内側。σ＝10 が分かっていれば点は1.96で、2 は外側になる。

- id: Q-U20-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 新しいレジの10日分の処理時間の不偏分散は16、古いレジの8日分は4（単位は分²）。新しいレジの方がばらつきが大きいかを調べる。F の値と自由度を求め、上側5%点と比べよ。（F(9, 7) の上側5%点は3.677）
  answer: F＝16÷4＝**4**、自由度（分子 **9**、分母 **7**）。4＞3.677 なので、新しいレジのばらつきは**大きい**と判断する。分子は「大きいと疑う方」、自由度は分子・分母の順に書く。
  checks:
    - '16/4 == 4 and 10-1 == 9 and 8-1 == 7 and 4 > 3.677 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.677,9,7)-0.95) < 5e-4'
  lab:
    id: LAB-tcf
    mode: f
    set: {s1: 16, n1: 10, s2: 4, n2: 8}
    task: 新レジ10日 s₁²＝16、旧レジ8日 s₂²＝4。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 4
    why: 16÷4＝4。F(9, 7) の上側5%点3.677を超える。F 以上になる確率は約0.04。

- id: Q-U20-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 自由度20の t 分布で、表には1.725と2.086がある。片側5%と両側5%の点はそれぞれどちらで、左側累積のいくつの点か。t＝1.9 のとき、片側と両側で判断はどう変わるか。
  answer: 片側5%は0.95点の **1.725**、両側5%は0.975点の **2.086**。t＝1.9 は片側なら**超える**、両側なら**基準以内**。どちらで調べるかは、データを見る前に決めておく。
  checks:
    - 'abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.725,20)-0.95) < 5e-4 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.086,20)-0.975) < 5e-4 and 1.725 < 1.9 < 2.086'
  lab:
    id: LAB-tcf
    mode: t
    set: {df: 20, side: one, alpha: 0.05, t: 1.9}
    task: 自由度20、片側（上側）5%の t の点は？
    predict: {type: number, key: tcrit, label: "t(20) の0.95点"}
    expect: 1.7247
    why: 約1.725。両側に切り替えると2.086。t＝1.9 は片側なら外側、両側なら内側。

- id: Q-U20-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 21日分の売上の不偏分散は150、去年の分散は100（単位は万円²）。ばらつきが去年より大きくなったかを、上側5%で調べよ。（χ²(20) の上側5%点は31.410）
  answer: Q＝20×150÷100＝**30**、自由度 **20**。30＜31.410 なので、ばらつきが大きくなったとは**言えない**。Q 以上になる確率は約0.07で、5%にわずかに届かない。
  checks:
    - '20*150/100 == 30 and 30 < 31.410 and abs(1-(lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(30,20) - 0.0699) < 5e-4'
  lab:
    id: LAB-tcf
    mode: chi
    set: {n: 21, s2: 150, sigma2: 100}
    task: 21日、s²＝150、去年の σ²＝100。Q＝(n−1)s²÷σ² は？
    predict: {type: number, key: q, label: "Q"}
    expect: 30
    why: 20×1.5＝30。上側5%点31.410に届かない。分散が1.5倍でも、20日ほどでは偶然の範囲。

- id: Q-U20-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: t 分布・カイ二乗分布・F 分布について、正しいものはどれか。
  choices:
    - t 分布は自由度が小さいほど裾が薄く、両側5%の点は1.96より小さい。
    - σ が分からないとき、t＝(x̄−μ₀)÷(s÷√n) は自由度 n の t 分布に従う。
    - 自由度が大きくなると、t 分布は標準正規分布に近づく。
    - カイ二乗分布は左右対称なので、下側2.5%点と上側2.5%点は平均から同じ距離にある。
    - F＝s₁²÷s₂² の点は、分子と分母の自由度を入れ替えても同じ値を使える。
  correct: 3
  answer: 自由度が大きいと s が σ にほぼ一致するので、t は z と同じ分布に近づく。自由度100の0.975点は約1.984で1.96に近い。
  misconceptions:
    1: 逆。自由度が小さいほど裾が厚く、点は1.96より大きい
    2: 自由度は n−1。平均を使って偏差を作るので1つ減る
    4: χ² は0以上で右に長い。上側の点の方が平均から遠い
    5: F(a, b) と F(b, a) は別の分布で、点も違う
  checks:
    - 'abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.984,100)-0.975) < 5e-4'
  lab:
    id: LAB-tcf
    mode: t
    set: {df: 100, side: two, alpha: 0.05, t: 1}
    task: 自由度100、両側5%の t の点は？
    predict: {type: number, key: tcrit, label: "t(100) の0.975点"}
    expect: 1.984
    why: 約1.984で、1.96とほとんど同じ。自由度を4にすると2.776で、差は大きい。

- id: Q-U20-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 陳列替えの前後で、9店それぞれの1日の売上の差（後−前）を出すと、差の平均は3万円、差の標準偏差 s は4.5万円だった。効果があったかを両側5%で判断せよ。（t(8) の0.975点は2.306）
  answer: 差を1つのデータとみて、SE＝4.5÷√9＝1.5、t＝(3−0)÷1.5＝**2**、自由度 **8**。2＜2.306 なので、効果があったとは**言えない**。9店では、差3万円は偶然でも起こる。
  checks:
    - '4.5/math.sqrt(9) == 1.5 and (3-0)/1.5 == 2 and 9-1 == 8 and 2 < 2.306'
  lab:
    id: LAB-tcf
    mode: tstat
    set: {xbar: 3, mu0: 0, s: 4.5, n: 9}
    task: 9店の前後差の平均3万円、差の s＝4.5万円、基準0。t の値は？
    predict: {type: number, key: t, label: "t"}
    expect: 2
    why: SE＝1.5、t＝2。t(8) の点2.306に届かない。店数を16にすると SE は約1.13、t は約2.67 で超える。

- id: Q-U20-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 内容量の標準偏差は規格で σ＝2g。16個を測ると s＝3g だった。ばらつきが規格より大きいかを、上側5%で調べよ。（χ²(15) の上側5%点は24.996）
  answer: Q＝15×3²÷2²＝15×9÷4＝**33.75**、自由度 **15**。33.75＞24.996 なので、ばらつきは規格より**大きい**と判断する。標準偏差で与えられたら、2乗して分散にしてから入れる。
  checks:
    - '15*3**2/2**2 == 33.75 and 33.75 > 24.996 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(24.996,15)-0.95) < 5e-4'
  lab:
    id: LAB-tcf
    mode: chi
    set: {n: 16, s2: 9, sigma2: 4}
    task: 16個、s²＝9、規格の σ²＝4。Q＝(n−1)s²÷σ² は？
    predict: {type: number, key: q, label: "Q"}
    expect: 33.75
    why: 15×9÷4＝33.75。上側5%点24.996を大きく超える。s と σ を2乗せずに入れると 15×3÷2＝22.5 になり、判断が変わってしまう。

- id: Q-U20-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 店Aの13日分の売上の不偏分散は900、店Bの11日分は400（単位は千円²）。2店の日々のばらつきが違うかを、大きい方を分子にして上側5%点と比べよ。（F(12, 10) の上側5%点は2.913）
