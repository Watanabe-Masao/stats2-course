# 単元U20の問題。id は変えない（個人の解答記録がこの id を指す）。
# 確率点は問題文に数表の値として書く。答えにだけ出る点は、密度の数値積分（中点則4000分割）で左側累積を出して照合する
# 式の中の (lambda x,k: …) は t(k) の P(T≦x)、(lambda q,k: …) は χ²(k) の P(Q≦q)、(lambda x,a,b: …) は F(a,b) の P(F≦x)
- id: Q-U20-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    25日分の1日の売上の平均は12万円、データの標準偏差 s は5万円。基準の平均10万円と違うかを、両側5%で調べる。（t(24) の0.975点は2.064）

    SE＝□÷√□＝□。t＝(□−10)÷□＝□、自由度□。|t| と2.064を比べると □
  answer_title: 答え（埋めてから開く）
  answer: SE＝5÷√25＝**1**。t＝(12−10)÷1＝**2**、自由度 **24**。2＜2.064 なので、**基準以内**（偶然の範囲）。σ が分かっていて1.96と比べるなら超えていた。s を使う分だけ基準が厳しくなる。
  checks:
    - '5/math.sqrt(25) == 1 and (12-10)/1 == 2 and 25-1 == 24 and 2 < 2.064 and 2 > 1.96'
  lab:
    id: LAB-tcf
    mode: tstat
    set: {xbar: 12, mu0: 10, s: 5, n: 25}
    task: 25日の平均12万円、s＝5万円、基準10万円。t の値は？
    predict: {type: number, key: t, label: "t"}
    expect: 2
    why: SE＝5÷5＝1、t＝2。t(24) の点2.064にわずかに届かない。1.96なら超えていたので、z と t の違いで判断が変わる例。

- id: Q-U20-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 商品の内容量の分散は、製造の基準では σ²＝8（g²）。10個を測ると不偏分散 s²＝12 だった。Q＝(n−1)s²÷σ² と自由度を求め、χ² の上側5%点と比べよ。（χ²(9) の上側5%点は16.919）
  answer: Q＝9×12÷8＝**13.5**、自由度 **9**。13.5＜16.919 なので、ばらつきが基準より大きいとは**言えない**。χ²(9) の平均は自由度と同じ9なので、13.5 はやや大きいが珍しくはない。
  checks:
    - '(10-1)*12/8 == 13.5 and 13.5 < 16.919 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(16.919,9)-0.95) < 5e-4'
  lab:
    id: LAB-tcf
    mode: chi
    set: {n: 10, s2: 12, sigma2: 8}
    task: 10個、s²＝12、基準の σ²＝8。Q＝(n−1)s²÷σ² は？
    predict: {type: number, key: q, label: "Q"}
    expect: 13.5
    why: 9×12÷8＝13.5。上側5%点16.919より小さい。Q 以上になる確率は約0.14で、10回に1回以上は起こる大きさ。

- id: Q-U20-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 36日分の1日の売上の平均は104万円、s は12万円。基準100万円との差について、標準誤差・t の値・自由度を求め、両側5%で判断せよ。（t(35) の0.975点は2.030）
  answer: SE＝12÷√36＝**2**、t＝(104−100)÷2＝**2**、自由度 **35**。2＜2.030 なので**基準以内**。わずかに届かない。
  checks:
    - '12/math.sqrt(36) == 2 and (104-100)/2 == 2 and 36-1 == 35 and 2 < 2.030'
  lab:
    id: LAB-tcf
    mode: tstat
    set: {xbar: 104, mu0: 100, s: 12, n: 36}
    task: 36日の平均104万円、s＝12万円。平均の標準誤差 SE は何万円か。
    predict: {type: number, key: se, label: "SE", unit: "万円"}
    expect: 2
    why: 12÷√36＝2万円。t＝2 で、t(35) の点2.030にわずかに届かない。n を49にすると SE は約1.71、t は約2.33 で超える。

- id: Q-U20-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 店Aの11日分の売上の不偏分散は18、店Bの13日分は9（単位は万円²）。2店のばらつきが違うかを F＝s₁²÷s₂² で調べる。F の値と自由度を求め、上側5%点と比べよ。（F(10, 12) の上側5%点は2.753）
  answer: F＝18÷9＝**2**、自由度（分子 **10**、分母 **12**）。2＜2.753 なので、ばらつきが違うとは**言えない**。分散が2倍でも、10日ほどのデータでは偶然の範囲。
  checks:
    - '18/9 == 2 and 11-1 == 10 and 13-1 == 12 and 2 < 2.753 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(2.753,10,12)-0.95) < 5e-4'
  lab:
    id: LAB-tcf
    mode: f
    set: {s1: 18, n1: 11, s2: 9, n2: 13}
    task: 店A 11日 s₁²＝18、店B 13日 s₂²＝9。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 2
    why: 18÷9＝2。F(10, 12) の上側5%点2.753より小さい。自由度を逆にした F(12, 10) の点は2.913で別の値。

- id: Q-U20-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 10店のデータで、σ が分からないので s を使って t＝2.1 を出した。担当者は「1.96を超えたので差がある」と判断した。正しい基準の点（t(9) の0.975点）は2.262。判断はどう変わるか。正規の点との差はいくつか。
  answer: s を使ったので基準は t(9) の **2.262**。2.1＜2.262 なので、差があるとは**言えない**（偶然の範囲）。正規の点との差は 2.262−1.96＝**0.302**。n が小さいほどこの差は大きく、1.96と比べると差を見つけすぎる。
  checks:
    - 'abs(2.262-1.96 - 0.302) < 1e-9 and 1.96 < 2.1 < 2.262'
  lab:
    id: LAB-tcf
    mode: t
    set: {df: 9, side: two, alpha: 0.05, t: 2.1}
    task: 自由度9、両側5%の t の点は？
    predict: {type: number, key: tcrit, label: "t(9) の0.975点"}
    expect: 2.2622
    why: 約2.262で、1.96より0.3ほど大きい。t＝2.1 はその内側。自由度を30にすると点は2.042で、2.1 は外側になる。

