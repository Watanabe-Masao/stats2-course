# 単元U30の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U30-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    20日分の販売数量を、売価と客数の2変数で重回帰した（n＝20、k＝2）。回帰平方和 SSR＝180、残差平方和 SSE＝120。R²、自由度調整済み R²、F を求めよ。（F(2, 17) の上側5%点は3.592）

    SST＝□＋□＝□。R²＝□÷□＝□。調整済み R²＝1−(1−□)×□÷□≒□。平均平方：回帰 □÷□＝□、残差 □÷□≒□。F＝□÷□＝□。
  answer_title: 答え（埋めてから開く）
  answer: SST＝180＋120＝**300**。R²＝180÷300＝**0.6**。調整済み R²＝1−0.4×19÷17≒**0.553**。平均平方：回帰 180÷2＝**90**、残差 120÷17≒**7.06**。F＝90÷7.059≒**12.75**（自由度2, 17）。5%点3.592 を大きく超えるので「係数はすべて0」を棄却する。販売数量のばらつきの約6割を2変数で説明でき、モデル全体は偶然とは言いにくい。
  checks:
    - '180+120 == 300 and 180/300 == 0.6 and abs(1-0.4*19/17 - 0.553) < 0.0005 and 180/2 == 90 and abs(120/17 - 7.06) < 0.005 and abs(90/(120/17) - 12.75) < 1e-9 and abs(1-0.4*19/17 - 0.5529) < 0.00005 and abs(120/17 - 7.059) < 0.0005'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.592,2,17) - 0.95) < 0.0005'
  lab:
    id: LAB-mreg
    mode: anova
    set: {n: 20, k: 2, ssr: 180, sse: 120}
    task: n＝20、k＝2、SSR＝180、SSE＝120 の回帰。F は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 12.75
    why: 平均平方は回帰90・残差約7.06。F＝12.75 は5%点3.592 を大きく超える。SSE を大きくすると F も R² も下がる。

- id: Q-U30-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: n＝20 の重回帰（説明変数 k＝3）で、ある変数の係数は0.6、標準誤差は0.2 だった。「係数＝0」を両側5%で検定し、95%信頼区間を求めよ。（t(16) の0.975点は2.120）
  answer: t＝0.6÷0.2＝**3**、自由度 20−3−1＝**16**。|3|＞2.120 なので「係数＝0」を**棄却**する（p≒0.0085）。95%信頼区間は 0.6±2.120×0.2＝**0.176〜1.024** で0を含まない（棄却と対応）。p 値は「係数が0である確率」ではない。
  checks:
    - 'abs(0.6/0.2 - 3) < 1e-12 and 20-3-1 == 16 and abs(0.6-2.120*0.2 - 0.176) < 1e-9 and abs(0.6+2.120*0.2 - 1.024) < 1e-9 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.120,16) - 0.975) < 0.0005 and abs(2*(1-(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(3,16)) - 0.0085) < 0.0001'
  lab:
    id: LAB-mreg
    mode: tval
    set: {b: 0.6, se: 0.2, n: 20, k: 3}
    task: 係数0.6・標準誤差0.2・n＝20・k＝3。95%信頼区間の下限は（小数で）？
    predict: {type: number, key: lo, label: "下限"}
    expect: 0.176
    why: 0.6−2.120×0.2＝0.176。区間が0を含まないことと、両側5%で棄却することは同じ。標準誤差を0.3 にすると区間が0を含む。

- id: Q-U30-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 例題Aの重回帰 ŷ＝40−x₁＋3x₂（x₁＝売価、x₂＝客数）で、売価12・客数6 の店の販売数を予測せよ。実際は45 だった。残差は？　また、売価・客数・週末ダミー D を使った式 ŷ＝40−x₁＋3x₂＋6D で、売価10・客数4 の週末（D＝1）の予測と、実際の51 との残差は？
  answer: ŷ＝40−12＋3×6＝**46**、残差＝45−46＝**−1**。週末の式では ŷ＝40−10＋12＋6＝**48**、残差＝51−48＝**3**。D の係数6 は「同じ売価・客数の平日と比べて、週末は6多い」。
  checks:
    - '40-12+3*6 == 46 and 45-46 == -1 and 40-10+3*4+6 == 48 and 51-48 == 3'
  lab:
    id: LAB-mreg
    mode: coef
    set: {x1: 12, x2: 6}
    task: ŷ＝40−x₁＋3x₂ の8店。売価12・客数6 の予測 ŷ は？
    predict: {type: number, key: yhat, label: "ŷ"}
    expect: 46
    why: 40−12＋18＝46。この店（12, 6, 45）の点をドラッグすると、係数と予測がいっしょに変わる。

- id: Q-U30-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 30日のデータで、説明変数2つのモデル A は R²＝0.47、説明変数4つのモデル B は R²＝0.50 だった。それぞれの自由度調整済み R² を求め、どちらを選ぶか答えよ。
  answer: A：1−0.53×29÷27≒**0.431**。B：1−0.50×29÷25＝**0.42**。R² は B が高いが、調整済み R² は A の方が高いので **A** を選ぶ。変数を足すと R² は必ず上がるか同じなので、数の違うモデルは調整済み R² で比べる。
  checks:
    - 'abs(1-0.53*29/27 - 0.431) < 0.0005 and abs(1-0.50*29/25 - 0.42) < 1e-12'
  lab:
    id: LAB-mreg
    mode: anova
    set: {n: 30, k: 4, ssr: 50, sse: 50}
    task: n＝30、説明変数4つ、R²＝0.5（SSR＝SSE＝50）。自由度調整済み R² は（小数で）？
    predict: {type: number, key: adjr2, label: "調整済み R²"}
    expect: 0.42
    why: 1−0.5×29÷25＝0.42。k を2 に減らすと、同じ R² でも調整済み R² は上がる。

- id: Q-U30-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 説明変数 x₁ と x₂ の相関が r＝0.9 のとき、分散拡大要因 VIF＝1÷(1−r²) はいくつか。係数の標準誤差は、相関0 のときの約何倍か（√VIF）。このとき、予測と係数の解釈のどちらが危ないか。
  answer: VIF＝1÷(1−0.81)＝1÷0.19≒**5.26**、標準誤差は √5.26≒**2.29倍**。2つの変数が一緒に動くので、どちらの効果かを分けにくく、係数は標本ごとに大きくぶれる（符号が逆になることもある）。一方、2つを合わせた効果（b₁＋b₂）や予測は安定している。危ないのは**係数の解釈**。
  checks:
    - 'abs(1/(1-0.9**2) - 5.26) < 0.005 and abs(math.sqrt(1/(1-0.81)) - 2.29) < 0.005 and abs(1-0.81 - 0.19) < 1e-12'
  lab:
    id: LAB-mreg
    mode: colin
    set: {r: 0.9, n: 30}
    task: x₁ と x₂ の相関0.9、30店。分散拡大要因 VIF は（小数で）？
    predict: {type: number, key: vif, label: "VIF"}
    expect: 5.2632
    why: 1÷(1−0.81)≒5.26。点が斜めに伸び、b₁ だけ見るとぶれが大きいが、b₁＋b₂ のぶれは小さい。相関を0 に戻して比べる。

- id: Q-U30-010
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 例題Aの8店で、売価 x₁ だけで販売数 y を回帰すると傾きは＋1.38、客数 x₂ も入れた重回帰では売価の係数は −1 だった。「売価の効果はプラスかマイナスか」と聞かれたら、どう答えるか。
  answer: どちらも誤りではなく、**そろえている条件が違う**。単回帰の＋1.38 は「売価の高い店は販売数も多い」という全体の傾向で、売価と一緒に動く客数の効果（相関0.90）が混ざっている。重回帰の −1 は「客数が同じ店どうしでは、売価が1高いと販売数が1少ない」。ただし −1 は t≒−1.27 で、8店では0と区別できない。どちらも観察データなので、値上げの因果の効果とは言い切れない。
  checks:
    - 'abs(-1/0.787 + 1.27) < 0.005 and abs((sum(x*y for x,y in [(8,39),(9,43),(10,44),(10,49),(11,45),(12,45),(12,49),(13,47)])-85*361/8)/(sum(x*x for x in (8,9,10,10,11,12,12,13))-85**2/8) - 1.38) < 0.005'
  lab:
    id: LAB-mreg
    mode: coef
    set: {x1: 10, x2: 5}
    task: 例題Aの8店。売価 x₁ だけの単回帰の傾きは（小数で）？
    predict: {type: number, key: bs, label: "単回帰の傾き"}
    expect: 1.3774
    why: ＋1.38。重回帰の −1 と符号が逆。客数の多い店（赤い点）ほど売価も高いので、x₁ だけで見ると客数の効果が混ざる。

- id: Q-U30-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 25日のデータで3つの説明変数の重回帰をした。R²＝0.4 だった（SST＝100、SSR＝40、SSE＝60）。F を求め、「係数はすべて0」を5%で検定せよ。（F(3, 21) の上側5%点は3.072）
  answer: 平均平方：回帰 40÷3≒13.33、残差 60÷21≒2.857。F＝13.33÷2.857≒**4.67**（自由度3, 21）。3.072 を超えるので**棄却**する。ただし、どの変数が効いているかは係数ごとの t で見る。R² は0.4 なので、説明できるのは4割。
  checks:
    - 'abs((40/3)/(60/21) - 4.67) < 0.005 and abs(40/3 - 13.33) < 0.005 and abs(60/21 - 2.857) < 0.0005 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.072,3,21) - 0.95) < 0.0005'
  lab:
    id: LAB-mreg
    mode: anova
    set: {n: 25, k: 3, ssr: 40, sse: 60}
    task: n＝25、k＝3、SSR＝40、SSE＝60。F は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 4.6667
    why: (40÷3)÷(60÷21)≒4.67。R² が0.4 と高くなくても、モデル全体としては偶然とは言いにくい。

- id: Q-U30-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 12日のデータで2つの説明変数の重回帰をした。ある係数は −1.2、標準誤差は0.4。95%信頼区間を求め、「係数＝0」を両側5%で判断せよ（{{unit:U25}} の t 検定と同じ考え方）。（t(9) の0.975点は2.262）
  answer: 自由度 12−2−1＝9。t＝−1.2÷0.4＝**−3**、|t|＞2.262 で**棄却**。区間は −1.2±2.262×0.4＝**−2.105〜−0.295**（0を含まない）。平均の t 検定と同じく「推定値÷標準誤差」を t の点と比べる。違うのは自由度で、推定した係数の数（切片を含め k＋1 個）だけ減る。
  checks:
    - '12-2-1 == 9 and abs(-1.2/0.4 + 3) < 1e-12 and abs(-1.2-2.262*0.4 + 2.105) < 0.0005 and abs(-1.2+2.262*0.4 + 0.295) < 0.0005 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.262,9) - 0.975) < 0.0005'
  lab:
    id: LAB-mreg
    mode: tval
    set: {b: -1.2, se: 0.4, n: 12, k: 2}
    task: 係数 −1.2・標準誤差0.4・n＝12・k＝2。95%信頼区間の上限は（小数で）？
    predict: {type: number, key: hi, label: "上限"}
    expect: -0.2952
    why: −1.2＋2.262×0.4≒−0.295。上限も負なので0を含まない。標準誤差を0.6 にすると区間が0をまたぐ。

- id: Q-U30-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 平日4日・週末4日の客数 x と販売数 y を、週末ダミー D（週末＝1）を入れて重回帰すると ŷ＝14＋2x＋4D だった。週末の販売数の平均は平日より8 多い。① D の係数4 と平均の差8 の違いを説明せよ。② 平日・土曜・日曜の3つに分けたいとき、ダミー変数はいくつ入れるか。
  answer: ① D の係数4 は「**同じ客数**で比べた週末と平日の差」。週末は客数も平均2 多く、その分（傾き2×2＝4）が平均の差8 に混ざっている。② 基準（平日）を除いて**2つ**（土曜ダミー・日曜ダミー）。3つ全部入れると、和が常に1 になり切片と重なって係数が決まらない。
  checks:
    - '14+2*4.5 == 23 and 14+2*6.5+4 == 31 and 31-23 == 8 and 2*(6.5-4.5) == 4 and 8-4 == 4'
  lab:
    id: LAB-mreg
    mode: dummy
    set: {data: "3,0,20 4,0,22 5,0,24 6,0,26 5,1,28 6,1,30 7,1,32 8,1,34", inter: false}
    task: 平日4日・週末4日。週末の平均は平日より8多い。ダミー D の係数は（小数で）？
    predict: {type: number, key: bD, label: "D の係数"}
    expect: 4
    why: 同じ客数でそろえると差は4。残りの4 は「週末は客数が多い」ことによる差。

- id: Q-U30-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 客数とレシート件数（相関0.95）を両方入れた重回帰で、F 検定は有意なのに、どちらの係数も t 検定で有意にならなかった。VIF を求め、何が起きているかを説明せよ。どうすればよいか。
  answer: VIF＝1÷(1−0.95²)＝1÷0.0975≒**10.3**。2つがほとんど一緒に動くので、モデル全体では説明できても（F 有意）、どちらの効果かを分けられず、係数の標準誤差が約3.2倍（√10.3）に大きくなって t が小さくなる（**多重共線性**）。目的が予測ならそのままでもよい。係数を解釈したいなら、どちらか一方にする・2つを合わせた指標にする。
  checks:
    - 'abs(1/(1-0.95**2) - 10.3) < 0.05 and abs(1-0.95**2 - 0.0975) < 1e-12 and abs(math.sqrt(1/(1-0.95**2)) - 3.2) < 0.01'
  lab:
    id: LAB-mreg
    mode: colin
    set: {r: 0.95, n: 30}
    task: x₁ と x₂ の相関0.95、30店。VIF は（小数で）？
    predict: {type: number, key: vif, label: "VIF"}
    expect: 10.2564
    why: 1÷(1−0.9025)≒10.3。40回のうち、本当は正の係数が負になった回も出る。b₁＋b₂ の散らばりは小さいまま。

- id: Q-U30-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 20日のデータで、モデル A（説明変数2つ）は R²＝0.60、モデル B（説明変数5つ）は R²＝0.65 だった。どちらを選ぶか、自由度調整済み R² で答えよ。
  answer: A：1−0.40×19÷17≒**0.553**。B：1−0.35×19÷14≒**0.525**。B は R² が高いが、変数3つ分の割引で調整済み R² は A より低い。**A** を選ぶ。
  checks:
    - 'abs(1-0.40*19/17 - 0.553) < 0.0005 and abs(1-0.35*19/14 - 0.525) < 0.0005'
  lab:
    id: LAB-mreg
    mode: anova
    set: {n: 20, k: 5, ssr: 65, sse: 35}
    task: n＝20、説明変数5つ、R²＝0.65（SSR＝65、SSE＝35）。自由度調整済み R² は（小数で）？
    predict: {type: number, key: adjr2, label: "調整済み R²"}
    expect: 0.525
    why: 1−0.35×19÷14＝0.525。k を2 に、SSR を60 にすると A の0.553 になる。

- id: Q-U30-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 重回帰分析について、正しいものはどれか。
  choices:
    - 重回帰の係数は、ほかの説明変数の値に関係なく、その変数だけで y を回帰した傾きと等しい。
    - 説明変数を1つ加えると、決定係数 R² は小さくなることがある。
    - 説明変数を1つ加えても、決定係数 R² は小さくならない。
    - F 検定が有意なら、すべての係数が t 検定で有意である。
    - 平日・土曜・日曜の3区分は、切片のあるモデルにダミー変数を3つ入れて表す。
  correct: 3
  answer: 最小二乗は、使える変数が増えると残差平方和を下げられる（少なくとも同じにできる）ので、R² は下がらない。だから変数の数の違うモデルは自由度調整済み R² で比べる。でたらめな変数を足しても R² は上がる（ラボの「変数を足す」）。
  misconceptions:
    1: 重回帰の係数はほかの変数を一定にしたときの関係。単回帰の傾きとは違い、符号まで変わることがある
    2: R² は下がらない。下がることがあるのは自由度調整済み R²
    4: F はモデル全体の検定。多重共線性があると、全体は有意でも個々の係数は有意にならないことがある
    5: 3つ入れると和が常に1 で切片と重なる。基準を1つ除いて2つ入れる
  checks:
    - 'abs(0.7625-0.7624 - 0.0001) < 1e-9'
  lab:
    id: LAB-mreg
    mode: add
    set: {k: 1}
    task: 本物の説明変数1つに、でたらめな変数を1つ足した。R² はどうなったか。
    predict: {type: choice, key: r2up, label: "R² は", options: [上がる, 変わらない, 下がる]}
    expect: 上がる
    why: わずかでも上がる。調整済み R² は下がる。足す数を増やして両方の線を見比べる。

- id: Q-U30-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 8店の売場面積 x₁（百㎡）・駐車台数 x₂（台）で売上 y（百万円）を重回帰した。結果は ŷ＝10＋3x₁＋0.5x₂、標準誤差は x₁ が1.0、x₂ が0.553、R²＝0.942。① 各係数の t を t(5) の0.975点2.571 と比べよ。② 面積7・駐車10台 の新店の予測は？ ③ 報告の文を書け。
  answer: ① 面積：t＝3÷1.0＝**3**（＞2.571 で0と言えない）。駐車：t＝0.5÷0.553≒**0.90**（0と区別できない）。② ŷ＝10＋21＋5＝**36**（百万円）。③「駐車台数をそろえると、面積が100㎡広い店は売上が平均3百万円多い傾向がある（8店、有意水準5%）。駐車台数の効果は、この店数では0と区別できない。面積と駐車台数は相関が強く（0.90）、それぞれの効果を分けるには店数が足りない」。
  checks:
    - 'abs(3/1.0 - 3) < 1e-12 and abs(0.5/0.553 - 0.90) < 0.005 and 10+3*7+0.5*10 == 36 and sum((y-10-3*a-0.5*b) for a,b,y in [(4,2,21),(5,6,30),(5,4,26),(6,8,33),(7,6,36),(8,10,37),(8,8,39),(9,12,42)]) == 0 and sum(a*(y-10-3*a-0.5*b) for a,b,y in [(4,2,21),(5,6,30),(5,4,26),(6,8,33),(7,6,36),(8,10,37),(8,8,39),(9,12,42)]) == 0 and sum(b*(y-10-3*a-0.5*b) for a,b,y in [(4,2,21),(5,6,30),(5,4,26),(6,8,33),(7,6,36),(8,10,37),(8,8,39),(9,12,42)]) == 0'
  lab:
    id: LAB-mreg
    mode: coef
    set: {data: "4,2,21 5,6,30 5,4,26 6,8,33 7,6,36 8,10,37 8,8,39 9,12,42", names: "面積,駐車台数,売上", x1: 7, x2: 10}
    task: 8店の面積 x₁・駐車台数 x₂・売上 y。駐車台数の係数 b₂ は（小数で）？
    predict: {type: number, key: b2, label: "駐車台数の係数 b₂"}
    expect: 0.5
    why: 0.5。t は約0.90 で、0と区別できない。面積だけの単回帰の傾きは約3.82 で、駐車台数の効果が混ざって大きく出る。

- id: Q-U30-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 例題Aの8店（売価8〜13、客数3〜7）で作った ŷ＝40−x₁＋3x₂ を使い、売価20・客数5 の新商品の販売数を予測した。予測値は？　この予測をそのまま使ってよいか。
  answer: ŷ＝40−20＋15＝**35**。ただし売価20 は観測した8〜13 の範囲の外（**外挿**）。範囲の外でも同じ関係が続く保証はなく、この予測は当てにならない。「売価8〜13・客数3〜7 の範囲で作った式」と範囲を添えて使い、範囲を広げるなら小さく試してデータを集める。
  checks:
    - '40-20+3*5 == 35 and 20 > 13'
  lab:
    id: LAB-mreg
    mode: coef
    set: {x1: 20, x2: 5}
    task: 例題Aの式で、売価20・客数5 の予測 ŷ は？
    predict: {type: number, key: yhat, label: "ŷ"}
    expect: 35
    why: 計算はできるが、売価20 は8店のどれよりも高い。図の点の範囲（8〜13）の外を予測している。

- id: Q-U30-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 40店のデータで、来店客数・客単価・売場面積の3つで月の利益を重回帰した。SSR＝120、SSE＝180。R²・自由度調整済み R²・F を求め、報告の文を書け。（F(3, 36) の上側5%点は2.866）
  answer: R²＝120÷300＝**0.4**。調整済み R²＝1−0.6×39÷36＝**0.35**。F＝(120÷3)÷(180÷36)＝40÷5＝**8**（＞2.866）。「3つの指標で利益のばらつきの約4割（調整済みで35%）を説明でき、モデル全体は偶然とは言いにくい（有意水準5%）。どの指標が効いているかは係数ごとの t で確かめる。残りの約6割は、この3つでは説明できない」。
  checks:
    - '120/300 == 0.4 and abs(1-0.6*39/36 - 0.35) < 1e-12 and (120/3)/(180/36) == 8 and abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(2.866,3,36) - 0.95) < 0.0005'
  lab:
    id: LAB-mreg
    mode: anova
    set: {n: 40, k: 3, ssr: 120, sse: 180}
    task: n＝40、k＝3、SSR＝120、SSE＝180。F は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 8
    why: 40÷5＝8。R² は0.4 でも、40店あれば全体の F は大きい。n を10 にすると F は小さくなる。

- id: Q-U30-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 平日5日・週末5日の客数 x と販売数 y。平日は ŷ＝9＋2x、週末は ŷ＝10＋3x の直線にそれぞれぴったり並ぶ。交互作用を入れた重回帰で、週末の傾きはいくつか。客数4 と客数6 で、週末と平日の差はそれぞれいくつか。「週末の効果」を1つの数で言えるか。
  answer: 週末の傾きは **3**（平日2、交互作用の係数1）。客数4：(10＋12)−(9＋8)＝**5**、客数6：(10＋18)−(9＋12)＝**7**。差が客数によって変わるので、「週末の効果は◯」と1つの数では言えない。交互作用を入れない式の D の係数は、こうした差を1つにならした値にすぎない。
  checks:
    - '(10+3*4)-(9+2*4) == 5 and (10+3*6)-(9+2*6) == 7 and 3-2 == 1'
  lab:
    id: LAB-mreg
    mode: dummy
    set: {data: "2,0,13 3,0,15 4,0,17 5,0,19 6,0,21 4,1,22 5,1,25 6,1,28 7,1,31 8,1,34", inter: true}
    task: 平日は ŷ＝9＋2x、週末は ŷ＝10＋3x に並ぶ10日。交互作用ありで、週末の傾きは（小数で）？
    predict: {type: number, key: slope1, label: "週末の傾き"}
    expect: 3
    why: 平日2・週末3 で、2本の直線は平行でない。交互作用を外すと平行な2本になり、「週末の差」は1つの数（D の係数）にならされる。
