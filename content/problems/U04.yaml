# 単元U04の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U04-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1]
  prompt: |-
    次の4つの尺度と、平均・何倍を使ってよいか（◯・△・✕）を埋める。

    部門コード＝□尺度（平均□・何倍□）、鮮度ランクA/B/C＝□尺度（平均□・何倍□）、開店時刻＝□尺度（平均□・何倍□）、1日の来店客数＝□尺度（平均□・何倍□）
  answer_title: 答え（埋めてから開く）
  answer: |-
    部門コード＝**名義**（平均✕・何倍✕）、鮮度ランク＝**順序**（平均△：等間隔とみなすときだけ・何倍✕）、開店時刻＝**間隔**（平均◯・何倍✕：0時は「時間が無い」ではない）、来店客数＝**比例**（平均◯・何倍◯、離散型）。
  figure:
    type: ladder
    caption: 4つのデータを尺度の階段に置く。平均が意味を持つのは間隔・比例、何倍が言えるのは比例だけ
    items:
    - name: 部門コード
      scale: 0
      note: 平均✕・何倍✕
    - name: 鮮度ランクA/B/C
      scale: 1
      note: 平均△・何倍✕
    - name: 開店時刻
      scale: 2
      note: 平均◯・何倍✕
    - name: 1日の来店客数
      scale: 3
      note: 平均◯・何倍◯

- id: Q-U04-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P3]
  prompt: 店の売上が昨日の10万円から今日20万円になった。「2倍になった」と言ってよいか。気温が10℃から20℃になったときと何が違うかも書く。
  answer_title: 答え（解いてから開く）
  answer: "**言ってよい**。売上は0円が「売上が無い」を表す比例尺度なので、何倍に意味がある（円をドルに直しても2倍のまま）。気温℃は0℃が「温度が無い」ではない間隔尺度で、Kに直すと約1.035倍になるので、「2倍」は言えない。「10℃高い」と差で言う。"
  checks:
    - 'Fraction(20, 10) == 2'
  lab:
    id: LAB-scale
    mode: unit
    set: {kind: money, a: 10, b: 20}
    task: 昨日10万円・今日20万円の売上を、ドルに直すと B÷A は何倍か。
    predict: {type: number, key: "ratio:2", label: "ドルで B÷A", unit: "倍"}
    expect: 2
    why: 円→ドルは掛け算だけの換算で、0円はどの単位でも「売上が無い」。だから何倍はどの単位でも2倍のまま。

- id: Q-U04-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 「血液型（A・B・O・AB）」の尺度は何か。
  answer: "**名義尺度**。区別するためのラベルで、順番も差もない。"
  lab:
    id: LAB-scale
    mode: judge
    set: {item: 血液型（A・B・O・AB）}
    task: 血液型を、4つの質問に上から答えて判定する。続けて「次のデータ」で、ほかの名義尺度と見分ける練習をする。

- id: Q-U04-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P3]
  prompt: 売上ランキングの「1位・2位・3位」の尺度は何か。「1位と2位の差」と「2位と3位の差」は同じと言えるか。
  answer: "**順序尺度**。順番には意味があるが、1位と2位の売上差と、2位と3位の売上差が同じとは限らない。"
  lab:
    id: LAB-scale
    mode: judge
    set: {item: 売上ランキングの順位}
    task: 売上ランキングの順位を、4つの質問に上から答えて判定する。質問3（差に同じ意味があるか）で「いいえ」になる理由を確かめる。

- id: Q-U04-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 郵便番号・顧客満足の順位・気温（℃）・購入個数を分類し、それぞれ平均や「何倍」を使うときの注意点を1つずつ述べる。
  answer: |-
    - 郵便番号：名義。平均は意味がない。
    - 満足の順位：順序。平均を使うなら「順位の間隔は等しい」とみなす仮定を明示する。
    - 気温（℃）：間隔。差は比べられるが「何倍」は言えない。
    - 購入個数：比例（離散型）。平均も何倍も使える。
  figure:
    type: ladder
    caption: 郵便番号は名義、満足の順位は順序、気温℃は間隔、購入個数は比例。上の段ほど使える計算が増える
    items:
    - name: 郵便番号
      scale: 0
      note: 平均は意味がない
      ng: true
    - name: 顧客満足の順位
      scale: 1
      note: 平均は等間隔の仮定が要る
    - name: 気温（℃）
      scale: 2
      note: 差は◯・何倍✕
    - name: 購入個数
      scale: 3
      note: 平均◯・何倍◯（離散）

- id: Q-U04-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P3]
  prompt: 「去年の平均気温は10℃、今年は15℃だったので、今年は1.5倍暖かかった」という説明の誤りを指摘し、正しい言い方に直す。
  answer: 気温（℃）は間隔尺度で、0℃は「温度が無い」ではないため「何倍」とは言えない。正しくは「今年は去年より平均気温が**5℃高かった**」。
  checks:
    - '15 - 10 == 5'
  lab:
    id: LAB-scale
    mode: unit
    set: {kind: temp, a: 10, b: 15}
    task: 10℃と15℃。℃では15÷10＝1.5倍。絶対温度（K）で表すと B÷A は何倍か。
    predict: {type: number, key: "ratio:1", label: "K で B÷A", unit: "倍"}
    expect: 1.018
    why: 「1.5倍」は℃という単位を選んだから出た数字にすぎない。どの単位でも同じ情報を持つのは差（5℃）のほう。

- id: Q-U04-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P2, P1]
  prompt: 5つの店（店番101〜105）の、ある商品の販売個数は 12、15、9、20、14 個だった。(a) 販売個数の平均は何個か。(b) 最も多い店は最も少ない店の何倍売ったか。(c) 店番の平均103に意味はあるか。
  answer: "(a) (12＋15＋9＋20＋14)÷5＝70÷5＝**14個**。　(b) 20÷9≒**2.2倍**（販売個数は比例尺度なので何倍が言える）。　(c) **意味はない**。店番は名義尺度で、103は「真ん中の店」でも「標準の店」でもない。"
  checks:
    - 'Fraction(12+15+9+20+14, 5) == 14'
    - 'abs(20/9 - 2.2) < 0.03'
    - 'Fraction(101+102+103+104+105, 5) == 103'
  figure:
    type: bars
    caption: 5店の販売個数と平均14個。最大20個は最小9個の約2.2倍。店番は名前（名義尺度）なので、店番の平均103に意味はない
    title: 店番101〜105（①〜⑤）の販売個数
    bars:
    - - ①
      - 12
    - - ②
      - 15
    - - ③
      - 9
    - - ④
      - 20
    - - ⑤
      - 14
    unit: 個
    mean: true
    mark_extremes: true
    note: 店番は棒の名前（ラベル）で、量ではない。店番を足して平均した103は「真ん中の店」でも「標準の店」でもない。

- id: Q-U04-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P2, P3]
  prompt: 来店客から無作為に3人を選び、満足度（5段階）を聞く。(a) 3人の回答の並び方（1人目・2人目・3人目の回答の組）は全部で何通りか。(b) 回答した3人は母集団か標本か。(c) 満足度の尺度は何か。3人の回答をまとめるのに、仮定なしで使える代表値は何か。
  answer: "(a) 各人5通りで、同じ段階を何人が選んでもよいので 5³＝**125通り**（{{unit:U09}}の重複を許す数え方）。　(b) **標本**（母集団は来店客全体）。　(c) **順序尺度**。仮定なしで使える代表値は**中央値**（と最頻値）。平均は等間隔とみなす仮定が要る。"
  checks:
    - '5**3 == 125'
  figure:
    type: product
    caption: 1人ごとに5通りの答え方があり、3人なら 5×5×5＝125通り
    title: 3人それぞれが5段階のどれかを選ぶ
    factors:
    - - 1人目
      - 5
    - - 2人目
      - 5
    - - 3人目
      - 5
    note: 回答した3人は来店客全体（母集団）の標本。満足度は順序尺度なので、仮定なしで使える代表値は中央値（と最頻値）。

- id: Q-U04-020
  stage: S3
  tag: アンケート集計
  format: written
  powers: [P3]
  prompt: 「満足度（5段階）」の結果を店舗間で比べたい。平均点の比較と、「4以上の割合」の比較では何が違うか。
  no_checks: 答えの「2つ」は数え上げの語で、計算した数ではない
  answer: 平均点は「各段階の間隔が等しい」とみなす**仮定の上に立つ**。「4以上の割合」は**順序だけを使う**ので、仮定が少なくて済む。点のつけ方を変えると平均点の大小は入れ替わることがあるが、割合は変わらない。割合の比較は {{unit:U26}}、2つの店と回答の関係は {{unit:U27}} につながる。
  lab:
    id: LAB-scale
    mode: likert
    set: {s5: 4.1, s1: 1}
    task: 「とても満足」を5点ではなく4.1点として平均すると、平均点で上になるのはどちらの店か。
    predict: {type: choice, key: winner, label: "平均点で上になる店", options: [A店, B店, 同じ]}
    expect: A店
    why: 1〜5点なら B店（3.80）が上、4.1点にすると A店（3.40）が上。中央値と「満足」以上の割合（40%・70%）は変わらない。

- id: Q-U04-021
  stage: S3
  tag: 逆向きの問い
  format: written
  powers: [P1, P3]
  prompt: 本部の資料で「前年比○%」を使って比べてよい項目はどれか。売上金額・平均気温（℃）・来店客数・部門コード・鮮度ランクの平均。理由も書く。
  answer: "**売上金額と来店客数**。どちらも0が「無い」を表す比例尺度なので、比（前年比）に意味がある。平均気温℃は間隔尺度なので「前年差○℃」で比べる。部門コードは名義で比べる量ではない。鮮度ランクの平均は順序尺度に点をつけた値で、比にも差にも仮定が要る。"
  figure:
    type: ladder
    caption: 前年比（比）が使えるのは比例尺度の売上金額と来店客数だけ。気温℃は差で比べる
    items:
    - name: 部門コード
      scale: 0
      note: 比べる量ではない
      ng: true
    - name: 鮮度ランクの平均
      scale: 1
      note: 比にも差にも仮定が要る
      ng: true
    - name: 平均気温（℃）
      scale: 2
      note: 前年比✕・前年差◯
    - name: 売上金額
      scale: 3
      note: 前年比◯
    - name: 来店客数
      scale: 3
      note: 前年比◯

- id: Q-U04-022
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: データの種類と尺度について、正しい記述はどれか。
  choices:
    - 郵便番号は数字で表されているので、量的変数である。
    - 満足度（1〜5）の平均は、段階の間隔が等しいとみなす仮定のもとで解釈できる。
    - 気温20℃は気温10℃の2倍の暑さである。
    - 売上順位の「1位と2位の差」は、売上金額の差の大きさを表す。
    - 体重を整数のkgで記録すると、離散型の変数になる。
  correct: 2
  answer: 満足度は順序尺度。平均を使うには「各段階の間隔が等しい」という仮定が要り、その仮定のもとでなら平均を解釈できる。
  misconceptions:
    1: 数字で書かれていても区別のためのラベル（名義尺度）。「数字で書かれている」と「量である」を取り違えた
    3: 気温℃は間隔尺度で、0℃は「温度が無い」ではない。Kに直すと比は約1.035になる
    4: 順位は順序尺度で、順位の差は売上の差の大きさを表さない
    5: 丸めて記録しても、体重は途中の値も取れる連続型。「整数で表示」と「数え上げる量」を取り違えた
  figure:
    type: ladder
    caption: 選択肢のデータを尺度の階段に置く。満足度は順序尺度で、平均は等間隔の仮定のもとでだけ解釈できる（②が正しい）
    items:
    - name: ① 郵便番号
      scale: 0
      note: 数字でも量ではない
    - name: ② 満足度（1〜5）
      scale: 1
      note: 平均は仮定のもとで◯
    - name: ④ 売上順位
      scale: 1
      note: 差は売上の差ではない
    - name: ③ 気温℃
      scale: 2
      note: 「2倍の暑さ」✕
      ng: true
    - name: ⑤ 体重kg
      scale: 3
      note: 整数で記録しても連続型

- id: Q-U04-023
  stage: S3
  tag: 集計表を読む
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: アンケートの集計表に「性別（1＝男性、2＝女性）の平均 1.42」と出ていた。この数字に意味はあるか。あるなら、何と読めるか。
  answer: 性別は名義尺度なので、「平均の性別」には意味がない。ただし**2つの値しかない名義変数**は、平均が割合と1対1に対応する。1と2で記録しているので、平均−1＝0.42 が**女性の割合（42%）**と読める（0と1で記録すれば平均がそのまま割合）。3つ以上の値がある名義変数（店番など）では、このような読み方はできない。
  checks:
    - 'abs((1*0.58 + 2*0.42) - 1.42) < 1e-12'
  lab:
    id: LAB-scale
    mode: code
    set: {pair: "1,2", n2: 42}
    task: 男性を1、女性を2と記録した100人の「性別の平均」が1.42。女性の割合は何%か。
    predict: {type: number, key: prop, label: "女性の割合", unit: "%"}
    expect: 42
    why: 数字の振り方を変えると平均は変わるが、2つの値しかないなら割合は逆算できる。3つ以上の例も下で見る。

- id: Q-U04-024
  stage: S3
  tag: グラフへ
  format: written
  powers: [P3]
  prompt: 次の3つを集計して報告する。それぞれ合うグラフと代表値を選ぶ。(a) 部門別の売上構成　(b) 満足度（5段階）の回答　(c) 1日の来店客数（30日分）
  answer: "(a) 部門は名義 → **棒グラフ（構成比なら円グラフや帯グラフ）**、代表値は**最頻値**（最も売上の多い部門）。　(b) 順序 → 段階の順に並べた**棒グラフ**、代表値は**中央値**（と最頻値）。　(c) 比例・離散 → **ヒストグラム**や箱ひげ図、代表値は**平均と中央値**。詳しくは {{unit:U05}}・{{unit:U06}}。"
  figure:
    type: ladder
    caption: 名義は棒グラフ・円グラフと最頻値、順序は順に並べた棒グラフと中央値、比例はヒストグラムと平均・中央値
    items:
    - name: (a) 部門別の売上構成
      scale: 0
      note: 棒・円グラフ／最頻値
    - name: (b) 満足度（5段階）
      scale: 1
      note: 順に並べた棒グラフ／中央値
    - name: (c) 1日の来店客数
      scale: 3
      note: ヒストグラム／平均・中央値

- id: Q-U04-025
  stage: S3
  tag: 条件を判断する
  difficulty: 3
  format: written
  powers: [P2, P3]
  prompt: 会員データの年齢が「20代・30代…」の年代でしか残っていない。平均年齢を出せるか。出せるなら、どう計算し、どんな注意が要るか。
  answer: 年代の真ん中（20代なら25歳）をその階級の値として平均すれば、**近似値**は出せる。ただし同じ年代の中の違い（31歳と39歳）は消えているので、元の年齢の平均とはずれうる（ラボの例：元のデータ41.6歳、年代で計算41.5歳）。年代は順序尺度のように扱っているので、「何歳の人が何人」まで分かる元データがあれば、そちらを使う。
  checks:
    - 'Fraction(25*4 + 35*6 + 45*5 + 55*3 + 65*2, 20) == Fraction(83, 2)'
  lab:
    id: LAB-scale
    mode: bin
    set: {w: 10}
    task: 20人の年齢を年代（20代・30代…）にまとめ、各年代の真ん中（25歳・35歳…）で平均すると何歳か。
    predict: {type: number, key: classMean, label: "年代で計算した平均", unit: "歳", tol: 0.05}
    expect: 41.5
    why: 元のデータの平均は41.6歳。まとめると近い値は出るが、同じ年代の中の違いは消える。

- id: Q-U04-030
  stage: S4
  tag: 医療
  format: written
  powers: [P3]
  prompt: 患者の痛みを「0（痛みなし）〜10（想像できる最大の痛み）」で答えてもらう。治療前は6、治療後は3だった。「痛みが半分になった」と言ってよいか。
  answer: "**言えない**。0は「痛みなし」を表すが、段階の間隔が等しいとは限らない（6と3の間の差が、3と0の間の差と同じ痛みの量とは言えない）ので、順序尺度として扱うのが安全。「3段階下がった」「痛みが軽くなった」と言う。"
  figure:
    type: ladder
    caption: 痛みの0〜10は、0が「痛みなし」でも段階の間隔が等しいとは限らないので、順序尺度として扱う。「半分」とは言えない
    items:
    - name: 痛みの強さ（0〜10）
      scale: 1
      note: 6→3は「3段階下がった」。「半分」✕
    note: 0に「無い」の意味があっても、段階の間隔がそろっていなければ「半分」のような比は言えない。

- id: Q-U04-031
  stage: S4
  tag: スポーツ
  format: written
  powers: [P1]
  prompt: 陸上チームの記録表に、背番号・100mのタイム（秒）・大会の順位が並んでいる。それぞれの尺度と、チーム平均を出して意味があるものを答えよ。
  no_checks: 答えの「2位・3位」は順位の名前で、計算した数ではない
  answer: 背番号＝**名義**（平均は意味がない）、タイム＝**比例・連続**（0秒が「時間が無い」。平均にも何倍にも意味がある）、順位＝**順序**（平均は等間隔の仮定が要る。1位と2位のタイム差は、2位と3位の差と同じとは限らない）。意味のあるチーム平均は**タイム**。
  figure:
    type: ladder
    caption: 背番号は名義、順位は順序、100mのタイムは比例。意味のあるチーム平均はタイムだけ
    items:
    - name: 背番号
      scale: 0
      note: 平均は意味がない
      ng: true
    - name: 大会の順位
      scale: 1
      note: 平均は等間隔の仮定が要る
    - name: 100mのタイム（秒）
      scale: 3
      note: 平均◯・何倍◯（連続型）

- id: Q-U04-032
  stage: S4
  tag: 仕事へ
  difficulty: 3
  format: written
  powers: [P3]
  prompt: POSデータの列「店番・JAN・日時・数量・金額・会員ランク（ブロンズ／シルバー／ゴールド）」の尺度を判定し、集計で「合計」「平均」「前年比」を使ってよい列を答えよ。
  answer: |-
    - 店番・JAN：**名義**。数える（件数・構成比）だけ。合計・平均は意味がない。
    - 日時：**間隔**。差（経過時間）は意味があるが、合計や前年比は意味がない。時間帯ごとに数えるのはよい。
    - 数量・金額：**比例**。合計・平均・前年比のすべてに意味がある。
    - 会員ランク：**順序**。ランク別に数える、中央のランクを見る。点にして平均するなら仮定を明示する。
  figure:
    type: ladder
    caption: POSの列を尺度の階段に置く。合計・平均・前年比のすべてが使えるのは比例尺度の数量と金額だけ
    items:
    - name: 店番
      scale: 0
      note: 数えるだけ
    - name: JAN
      scale: 0
      note: 数えるだけ
    - name: 会員ランク
      scale: 1
      note: ランク別に数える・中央
    - name: 日時
      scale: 2
      note: 差（経過時間）◯・合計✕
    - name: 数量
      scale: 3
      note: 合計・平均・前年比◯
    - name: 金額
      scale: 3
      note: 合計・平均・前年比◯

- id: Q-U04-040
  stage: S5
  label: 確かめ問題
  format: written
  powers: [P2, P1]
  prompt: 3日間の最高気温が 10℃、15℃、20℃ だった。(a) ℃での平均を℉に直した値と、各日を℉に直してから平均した値は一致するか（℉＝1.8×℃＋32）。(b) 「20℃の日は10℃の日の2倍」は、℉で表しても2倍か。
  answer: "(a) ℃の平均は15℃ → 1.8×15＋32＝**59℉**。各日を℉にすると 50、59、68℉ で、平均は**59℉**。**一致する**（間隔尺度に許される変換 y＝ax＋b では、平均は同じ変換で移る）。　(b) 68÷50＝**1.36倍**で、2倍にならない。比は変換で保たれないので、間隔尺度では意味がない。"
  checks:
    - 'Fraction(10+15+20, 3) == 15 and 1.8*15 + 32 == 59.0'
    - '[1.8*t + 32 for t in (10, 15, 20)] == [50.0, 59.0, 68.0] and abs((50+59+68)/3 - 59) < 1e-12'
    - 'abs(68/50 - 1.36) < 1e-12'
  lab:
    id: LAB-scale
    mode: unit
    set: {kind: temp, a: 10, b: 20}
    task: 10℃と20℃を華氏（℉）で表すと、B÷A は何倍か。
    predict: {type: number, key: "ratio:2", label: "℉ で B÷A", unit: "倍"}
    expect: 1.36
    why: y＝1.8x＋32 のように足し算の入った変換では比が保たれない。差は 10℃→18℉ と、換算の分（×1.8）だけ変わる。

- id: Q-U04-013
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: ある日に売れた100件を部門で分けると、食品45・日用品25・衣料15・家電10・その他5 件だった。部門は名義尺度。① 円グラフにすると、食品の中心角は何度か。② 多い順に並べたパレート図で、上位2部門は全体の何%か。③ この部門の度数をヒストグラムで描いてはいけない理由を述べよ。
  answer: ① 45÷100×360＝**162°**。② (45＋25)÷100＝**70%**。③ 部門は質的データで、横軸に大小や間隔がない。棒を離して並べる棒グラフ（順番は自由）で表す。ヒストグラムは量的データを階級に分け、すき間なく並べて面積で度数を表す図。
  checks:
    - '45/100*360 == 162 and (45+25)/100 == 0.7 and 45+25+15+10+5 == 100'
  lab:
    id: LAB-graph
    mode: qual
    set: {kind: pie, n: [45, 25, 15, 10, 5]}
    task: 部門ごとの100件（食品45・日用品25・衣料15・家電10・その他5）。円グラフで食品の中心角は（度）？
    predict: {type: number, key: "angle:0", label: "中心角", unit: "°"}
    expect: 162
    why: 割合0.45×360°。図を棒・帯・パレート図に切り替えると、同じ数でも見えやすいことが変わる。
