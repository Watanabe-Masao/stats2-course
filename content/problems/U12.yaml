# 単元U12の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U12-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    商品の60%は工場A（不良率1%）、40%は工場B（不良率3%）で作る。全体の不良率は？

    工場Aで不良＝0.6×□＝□、工場Bで不良＝0.4×□＝□。全体の不良率＝□＋□＝□
  answer_title: 答え（埋めてから開く）
  answer: 0.6×**0.01**＝**0.006**、0.4×**0.03**＝**0.012**。0.006＋0.012＝**0.018（1.8%）**。これが全確率。
  checks:
    - 'Fraction(6,10)*Fraction(1,100) == Fraction(6,1000) and Fraction(4,10)*Fraction(3,100) == Fraction(12,1000) and Fraction(6,1000)+Fraction(12,1000) == Fraction(18,1000)'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 工場B, other: 工場A, event: 不良, prior: 40, sens: 3, fpr: 1, times: 1}
    task: 工場Bが40%（不良率3%）、工場Aが60%（不良率1%）。全体の不良率は何%か。
    predict: {type: number, key: total, label: "全体の不良率", unit: "%"}
    expect: 1.8
    why: 1000個なら工場Bが400個で不良12個、工場Aが600個で不良6個。合わせて18個で1.8%。原因ごとの経路を足すのが全確率。

- id: Q-U12-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 例題Bの工場で、不良品が1個見つかった。工場Bで作られた確率は？
  answer_title: 答え（解いてから開く）
  answer: 0.012÷0.018＝**2/3**（約66.7%）。作る量はAが多いが、不良率が高いBのほうが不良品の出どころとしては多い。
  checks:
    - 'Fraction(12,1000)/Fraction(18,1000) == Fraction(2,3) and abs(2/3*100 - 66.7) < 0.05'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 工場B, other: 工場A, event: 不良, prior: 40, sens: 3, fpr: 1, times: 1}
    task: 工場B 40%（不良率3%）、工場A 60%（不良率1%）。見つかった不良品が工場B製である確率は何%か。
    predict: {type: number, key: post, label: "P(工場B｜不良)", unit: "%"}
    expect: 66.6667
    why: 不良18個のうち工場B製が12個で、12÷18＝2/3。作る量（40%）より高いのは、工場Bの不良率が3倍だから。

- id: Q-U12-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 例題A（不良率2%・検出率90%・誤検出率5%）で、検出されなかった品が不良である確率は？
  answer: 1000個中、検出されないのは不良2個＋良品931個＝933個。2÷933≒**0.0021（約0.21%）**。検出されなければ、ほぼ良品と言える。
  checks:
    - '20 - 18 == 2 and 980 - 49 == 931 and 2 + 931 == 933 and abs(2/933 - 0.0021) < 0.00005 and abs(2/933*100 - 0.21) < 0.005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 2, sens: 90, fpr: 5, times: 1}
    task: 不良率2%・検出率90%・誤検出率5%。検出されなかった品のうち不良の割合は何%か。
    predict: {type: number, key: postNeg, label: "P(不良｜検出なし)", unit: "%"}
    expect: 0.2144
    why: 検出されないのは不良の見逃し2個と良品931個。2÷933≒0.21%。検出されなければ、元の2%よりさらに不良が少ない。

- id: Q-U12-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 不良率10%、検出率90%、良品の誤検出率5%のとき、検出された品が不良である確率は？ 例題（不良率2%）と比べよ。
  answer: 0.1×0.9＝0.09、0.9×0.05＝0.045。0.09÷(0.09＋0.045)＝**2/3**（約66.7%）。検品の性能は同じでも、事前の不良率が2%→10%に上がると事後確率は約27%→約67%に変わる。
  checks:
    - 'Fraction(1,10)*Fraction(9,10) == Fraction(9,100) and Fraction(9,10)*Fraction(5,100) == Fraction(45,1000) and Fraction(9,100)/(Fraction(9,100)+Fraction(45,1000)) == Fraction(2,3)'
    - 'abs(18/67*100 - 27) < 0.5 and abs(2/3*100 - 67) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 10, sens: 90, fpr: 5, times: 1}
    task: 不良率10%・検出率90%・誤検出率5%。検出された品が本当に不良である確率は何%か。
    predict: {type: number, key: post, label: "P(不良｜検出)", unit: "%"}
    expect: 66.6667
    why: 1000個なら不良100個から検出90個、良品900個から誤検出45個。90÷135＝2/3。元の割合を2%に戻すと約27%に下がる。

- id: Q-U12-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 例題Aで検出された67個を、同じ性能の検品にもう一度かける（1回目と2回目の誤りは独立とする）。2回とも検出された品が不良である確率は？
  answer: 不良18個のうち再検出 18×0.9＝16.2個、良品49個のうち再検出 49×0.05＝2.45個。16.2÷(16.2＋2.45)＝16.2÷18.65≒**0.869（約87%）**。1回目の事後確率（約27%）が2回目の事前確率になり、更新される。
  checks:
    - 'abs(18*0.9 - 16.2) < 1e-9 and abs(49*0.05 - 2.45) < 1e-9 and abs(16.2 + 2.45 - 18.65) < 1e-9 and abs(16.2/18.65 - 0.869) < 0.0005 and abs(16.2/18.65*100 - 87) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 2, sens: 90, fpr: 5, times: 2}
    task: 不良率2%・検出率90%・誤検出率5%の検品に2回かけ、2回とも検出された。本当に不良である確率は何%か。
    predict: {type: number, key: post, label: "P(不良｜2回とも検出)", unit: "%"}
    expect: 86.8633
    why: 1000個なら不良で2回とも検出 16.2個、良品で2回とも誤検出 2.45個。16.2÷18.65≒87%。良品が2回続けて引っかかるのはまれなので、事後確率が大きく上がる。

- id: Q-U12-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: ある地域では30%の日に雨が降る。雨の日の80%は前日の予報が「雨」、雨でない日の10%も予報が「雨」だった。予報が「雨」のとき、実際に雨が降る確率は？
  answer: 1000日なら、雨300日のうち予報「雨」240日、雨でない700日のうち予報「雨」70日。240÷(240＋70)＝240÷310≒**0.774（約77%）**。
  checks:
    - '1000*Fraction(3,10)*Fraction(8,10) == 240 and 1000*Fraction(7,10)*Fraction(1,10) == 70 and 240 + 70 == 310 and abs(240/310 - 0.774) < 0.0005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 雨, other: 雨でない, event: 雨予報, prior: 30, sens: 80, fpr: 10, times: 1}
    task: 雨の日30%、雨の日に予報「雨」80%、雨でない日に予報「雨」10%。予報「雨」のとき実際に雨の確率は何%か。
    predict: {type: number, key: post, label: "P(雨｜雨予報)", unit: "%"}
    expect: 77.4194
    why: 1000日なら 240÷(240＋70)≒77%。外れ予報（雨でないのに「雨」）は70日あり、予報の的中率は80%より低い。

- id: Q-U12-011
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P3]
  prompt: 客の30%が会員。会員の80%、非会員の40%がリピーター（月2回以上来店）である。リピーターのうち会員の割合は？（{{unit:U11}} の入口の問い）
  answer: 1000人なら、会員300人のうちリピーター240人、非会員700人のうちリピーター280人。240÷(240＋280)＝240÷520≒**0.46（約46%）**。会員の80%がリピーターでも、リピーターの80%が会員とは言えない。
  checks:
    - '1000*Fraction(3,10)*Fraction(8,10) == 240 and 1000*Fraction(7,10)*Fraction(4,10) == 280 and 240 + 280 == 520 and abs(240/520 - 0.46) < 0.005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 会員, other: 非会員, event: リピーター, prior: 30, sens: 80, fpr: 40, times: 1}
    task: 会員30%、会員のリピーター率80%、非会員のリピーター率40%。リピーターのうち会員は何%か。
    predict: {type: number, key: post, label: "P(会員｜リピーター)", unit: "%"}
    expect: 46.1538
    why: リピーター520人のうち会員240人で約46%。非会員が多いので、リピーター率が低くても人数では会員を上回る。

- id: Q-U12-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P1, P2]
  prompt: 検品の結果を1000個のクロス集計表にした。不良で検出18個、不良で検出なし2個、良品で検出49個、良品で検出なし931個。P(検出｜不良) と P(不良｜検出) をそれぞれ求めよ。（{{unit:U11}}）
  answer: P(検出｜不良)＝18÷20＝**0.9**（分母は不良品）。P(不良｜検出)＝18÷67≒**0.269**（分母は検出された品）。表の行で割るか列で割るかで、向きが変わる。
  checks:
    - 'Fraction(18,20) == Fraction(9,10) and 18 + 49 == 67 and abs(18/67 - 0.269) < 0.0005'
  lab:
    id: LAB-prob
    mode: table
    set: {a: 18, b: 2, c: 49, d: 931, nameA: 不良, nameB: 検出}
    task: 不良で検出18・不良で検出なし2・良品で検出49・良品で検出なし931。検出された品のうち不良は何%か。
    predict: {type: number, key: condAB, label: "P(不良｜検出)", unit: "%"}
    expect: 26.8657
    why: 分母は検出された 18＋49＝67個。18÷67≒26.9%。P(検出｜不良)＝18÷20＝90% とは分母が違う。

- id: Q-U12-020
  stage: S3
  tag: 元の割合が低い
  format: written
  powers: [P1, P3]
  prompt: 不良率0.5%の商品を、検出率90%・誤検出率5%の検品にかける。検出された品が不良である確率は？ 例題A（不良率2%）と比べよ。
  answer: 1000個なら不良5個から検出4.5個、良品995個から誤検出49.75個。4.5÷(4.5＋49.75)＝4.5÷54.25≒**0.083（約8%）**。元の割合が2%→0.5%に下がると、事後確率も約27%→約8%に下がる。
  checks:
    - 'abs(5*0.9 - 4.5) < 1e-9 and abs(995*0.05 - 49.75) < 1e-9 and abs(4.5 + 49.75 - 54.25) < 1e-9 and abs(4.5/54.25 - 0.083) < 0.0005 and abs(4.5/54.25*100 - 8) < 0.5 and abs(18/67*100 - 27) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 0.5, sens: 90, fpr: 5, times: 1}
    task: 不良率0.5%・検出率90%・誤検出率5%。検出された品が本当に不良である確率は何%か。
    predict: {type: number, key: post, label: "P(不良｜検出)", unit: "%"}
    expect: 8.2949
    why: 1000個なら 4.5÷(4.5＋49.75)≒8%。元の割合が小さいと、誤検出の個数が分母のほとんどを占める。

- id: Q-U12-021
  stage: S3
  tag: 再検査で更新
  format: written
  powers: [P1, P3]
  prompt: 不良率1%、検出率90%、誤検出率5%の検品で、1回目に検出された品を同じ検品にもう一度かけた（誤りは独立）。2回とも検出された品が不良である確率は？
  answer: 1000個なら不良10個のうち2回とも検出 10×0.9×0.9＝8.1個、良品990個のうち2回とも誤検出 990×0.05×0.05＝2.475個。8.1÷(8.1＋2.475)＝8.1÷10.575≒**0.766（約77%）**。1回だけなら 9÷(9＋49.5)≒15%。
  checks:
    - 'abs(10*0.9*0.9 - 8.1) < 1e-9 and abs(990*0.05*0.05 - 2.475) < 1e-9 and abs(8.1 + 2.475 - 10.575) < 1e-9 and abs(8.1/10.575 - 0.766) < 0.0005 and abs(8.1/10.575*100 - 77) < 0.5'
    - 'abs(990*0.05 - 49.5) < 1e-9 and abs(9/(9+49.5)*100 - 15) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 1, sens: 90, fpr: 5, times: 2}
    task: 不良率1%・検出率90%・誤検出率5%の検品で、2回とも検出された。本当に不良である確率は何%か。
    predict: {type: number, key: post, label: "P(不良｜2回とも検出)", unit: "%"}
    expect: 76.5957
    why: 8.1÷(8.1＋2.475)≒77%。「1回」に切り替えると約15%。誤検出が2回続く確率は 0.05×0.05＝0.0025 と小さい。

- id: Q-U12-022
  stage: S3
  tag: 結果と原因を見分ける
  format: written
  powers: [P1, P3]
  prompt: 届くメールの40%が迷惑メールで、迷惑メールの30%に「当選」という語が入っている。通常のメールでは2%に入っている。「当選」が入ったメールが迷惑メールである確率は？
  answer: 結果は「当選」が入っていること、原因は迷惑メールかどうか。1000通なら迷惑400通のうち「当選」120通、通常600通のうち「当選」12通。120÷(120＋12)＝120÷132≒**0.909（約91%）**。
  checks:
    - '1000*Fraction(4,10)*Fraction(3,10) == 120 and 1000*Fraction(6,10)*Fraction(2,100) == 12 and 120 + 12 == 132 and abs(120/132 - 0.909) < 0.0005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 迷惑メール, other: 通常, event: 「当選」, prior: 40, sens: 30, fpr: 2, times: 1}
    task: 迷惑メール40%、迷惑メールの30%・通常の2%に「当選」。「当選」が入ったメールが迷惑メールである確率は何%か。
    predict: {type: number, key: post, label: "P(迷惑｜当選)", unit: "%"}
    expect: 90.9091
    why: 120÷132≒91%。迷惑メールの30%にしか入っていなくても、通常のメールにはめったに入らない（2%）ので、入っていれば迷惑メールの見込みが高い。

- id: Q-U12-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 不良率2%の商品を、不良品の90%を検出し、良品の5%を誤って検出する検品にかける。正しいものはどれか。
  choices:
    - 検出された品の90%は不良である。
    - 検出されなかった品はすべて良品である。
    - 検出された品のうち不良は約27%で、多くは良品の誤検出である。
    - 不良率が10%になっても、検出された品のうち不良の割合は変わらない。
    - 誤検出率を下げても、検出された品のうち不良の割合は変わらない。
  correct: 3
  answer: 1000個なら検出は不良18個＋良品49個＝67個。18÷67≒27%。良品が多いので、誤検出率5%でも誤検出の方が多い。
  misconceptions:
    1: P(検出｜不良)＝90% と P(不良｜検出) の取り違え
    2: 不良20個のうち2個は見逃される（検出されなかった933個中2個）
    4: 元の割合（事前確率）が変わると事後確率も変わる。10%なら約67%
    5: 誤検出率を1%にすると、良品の誤検出が9.8個に減り、約65%に上がる
  checks:
    - '18 + 49 == 67 and abs(18/67*100 - 27) < 0.5 and 2 + 931 == 933 and abs(980*0.01 - 9.8) < 1e-9 and abs(18/(18+9.8)*100 - 65) < 0.5 and abs(2/3*100 - 67) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 2, sens: 90, fpr: 5, times: 1}
    task: 不良率2%・検出率90%・誤検出率5%。検出された品のうち不良は何%か。
    predict: {type: number, key: post, label: "P(不良｜検出)", unit: "%"}
    expect: 26.8657
    why: 18÷67≒27%。元の割合や誤検出率を動かすと事後確率が変わる（選択肢④⑤が誤りである理由）。

- id: Q-U12-030
  stage: S4
  tag: 仕入先のクレーム
  format: written
  powers: [P1, P3]
  prompt: ある商品の70%は仕入先A（不良率1%）、30%は仕入先B（不良率4%）から入る。不良品のクレームが1件来た。仕入先Bの品である確率は？
