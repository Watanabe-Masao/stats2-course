  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 仕入先B, other: 仕入先A, event: 不良, prior: 30, sens: 4, fpr: 1, times: 1}
    task: 仕入先Bが30%（不良率4%）、仕入先Aが70%（不良率1%）。不良品が仕入先Bの品である確率は何%か。
    predict: {type: number, key: post, label: "P(仕入先B｜不良)", unit: "%"}
    expect: 63.1579
    why: 不良19個のうちBが12個で約63%。「元の割合」を動かすと、Bの納品量が増えるほどクレームの出どころもBに寄る。

- id: Q-U12-031
  stage: S4
  tag: 販促メールの開封
  format: written
  powers: [P1, P3]
  prompt: 会員の5%が今月購入する。購入する会員の60%、購入しない会員の20%が販促メールを開封する。開封した会員のうち、購入する会員の割合は？ 「開封した人は購入しやすい」と言えるか。
  answer: 1000人なら購入50人のうち開封30人、非購入950人のうち開封190人。30÷(30＋190)＝30÷220≒**0.14（約14%）**。元の5%よりは高いので「購入しやすい」とは言えるが、開封者の多くは非購入者。
  checks:
    - 'abs(190/220*100 - 86) < 0.5 and abs(30/220/0.05 - 2.7) < 0.05'
    - '1000*Fraction(5,100)*Fraction(6,10) == 30 and 1000*Fraction(95,100)*Fraction(2,10) == 190 and 30 + 190 == 220 and abs(30/220 - 0.14) < 0.005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 購入, other: 非購入, event: 開封, prior: 5, sens: 60, fpr: 20, times: 1}
    task: 購入する会員5%、購入者の開封率60%、非購入者の開封率20%。開封者のうち購入者は何%か。
    predict: {type: number, key: post, label: "P(購入｜開封)", unit: "%"}
    expect: 13.6364
    why: 30÷220≒14%。元の購入率5%の約2.7倍だが、開封者の86%は購入しない。元の割合が小さいと事後確率も小さい。

- id: Q-U12-032
  stage: S4
  tag: 不正検知の警告
  format: written
  powers: [P1, P3]
  prompt: 取引の1%が不正。検知システムは不正の95%に警告を出すが、正常な取引の3%にも警告を出す。警告が出た取引のうち不正の割合は？ 警告を全部止める運用でよいか。
  answer: 10000件なら不正100件から警告95件、正常9900件から警告297件。95÷(95＋297)＝95÷392≒**0.24（約24%）**。警告の4件に3件は正常な取引なので、全部止めると正常な客に迷惑がかかる。確認の手順を挟む判断になる。
  checks:
    - 'abs(297/392 - 3/4) < 0.01'
    - '10000*Fraction(1,100)*Fraction(95,100) == 95 and 10000*Fraction(99,100)*Fraction(3,100) == 297 and 95 + 297 == 392 and abs(95/392 - 0.24) < 0.005'
  lab:
    id: LAB-prob
    mode: bayes
    set: {name: 不正, other: 正常, event: 警告, prior: 1, sens: 95, fpr: 3, times: 1}
    task: 不正1%、不正への警告率95%、正常への警告率3%。警告のうち不正は何%か。
    predict: {type: number, key: post, label: "P(不正｜警告)", unit: "%"}
    expect: 24.2347
    why: 95÷392≒24%。正常な取引が99%と多いので、3%の誤警告でも警告の多くを占める。

- id: Q-U12-040
  stage: S5
  tag: 事後を次の事前に
  format: written
  powers: [P1, P3]
  prompt: 例題Aで1回目に検出された品の不良率を約27%とし、これを事前確率にして同じ検品（検出率90%・誤検出率5%）にもう一度かける。また検出されたとき、不良である確率は？ 初学の問3（2回まとめて計算）と比べよ。
  answer: 0.27×0.9＝0.243、0.73×0.05＝0.0365。0.243÷(0.243＋0.0365)＝0.243÷0.2795≒**0.869（約87%）**。2回まとめて計算した結果（約87%）と同じ。事後確率を次の事前確率にして、順に更新できる。
  checks:
    - 'abs(0.27*0.9 - 0.243) < 1e-9 and abs(0.73*0.05 - 0.0365) < 1e-9 and abs(0.243 + 0.0365 - 0.2795) < 1e-9 and abs(0.243/0.2795 - 0.869) < 0.0005 and abs(16.2/18.65*100 - 87) < 0.5'
  lab:
    id: LAB-prob
    mode: bayes
    set: {prior: 27, sens: 90, fpr: 5, times: 1}
    task: 事前確率27%（1回目の事後確率）で、同じ検品にもう一度かけて検出された。不良である確率は何%か。
    predict: {type: number, key: post, label: "P(不良｜2回目も検出)", unit: "%"}
    expect: 86.941
    why: 0.243÷0.2795≒86.9%。元の割合2%で「同じ検査を2回」にした値（約86.9%）とほぼ同じ（27%は丸めた値なので少しずれる）。
