# 単元U08の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U08-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    数学は平均60点・標準偏差10点で75点、英語は平均70点・標準偏差5点で80点だった。クラスの中で相対的に良い成績はどちらか。

    数学 z＝(75−□)÷□＝□、英語 z＝(□−70)÷□＝□ → 相対的に良いのは□
  answer_title: 答え（埋めてから開く）
  answer: 数学 z＝(75−**60**)÷**10**＝**1.5**、英語 z＝(**80**−70)÷**5**＝**2**。点数の差は数学（15点）の方が大きいが、**英語の方が相対的に良い**。英語はふだんの点数の散らばりが小さいので、10点の差でも珍しい。
  checks:
    - 'Fraction(75-60, 10) == Fraction(3,2) and Fraction(80-70, 5) == 2 and 75-60 == 15'
  lab:
    id: LAB-z
    mode: z
    set: {mA: 60, sA: 10, xA: 75, mB: 70, sB: 5, xB: 80, nameA: 数学, nameB: 英語}
    task: 数学は平均60点・標準偏差10点で75点、英語は平均70点・標準偏差5点で80点。クラスの中で相対的に良いのはどちらか。
    predict: {type: choice, key: better, label: "相対的に良いのは", options: [数学, 英語, 同じ]}
    expect: 英語
    why: 数学は z＝1.5、英語は z＝2。点の差（15点と10点）は数学が大きいが、英語の標準偏差5で割ると標準偏差2つ分上になる。

- id: Q-U08-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: 箱ひげ図で Q₁＝10、Q₃＝14 のデータに 21 が含まれる。21 は外れ値候補か。また「外れ値候補だから削除してよい」と言えるか。
  answer_title: 答え（解いてから開く）
  answer: IQR＝4、上の柵＝14＋1.5×4＝20。21＞20 なので**外れ値候補**。ただし削除してよいとは**言えない**。入力ミス・別条件・本当にまれな出来事のどれかを確認し、除くなら理由と結果への影響を残す（{{unit:U05}}）。
  checks:
    - '14 - 10 == 4 and 14 + Fraction(3,2)*4 == 20 and 21 > 20 and 10 - Fraction(3,2)*4 == 4'
  lab:
    id: LAB-z
    mode: fence
    set: {q1: 10, q3: 14, x: 21}
    task: Q₁＝10、Q₃＝14 のデータで、21 は外れ値候補か。
    predict: {type: choice, key: isOut, label: "外れ値候補か", options: [はい, いいえ]}
    expect: はい
    why: 上の柵は 14＋1.5×4＝20。21 は柵の外。値を20にすると柵の内側に入る。候補になっても、削除する前に原因を確かめる。

- id: Q-U08-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 平均100・標準偏差20の分布で、130のz得点はいくらか。
  answer: (130−100)÷20＝**1.5**。
  checks:
    - 'Fraction(130-100, 20) == Fraction(3,2)'
  lab:
    id: LAB-z
    mode: z
    set: {mA: 100, sA: 20, xA: 130, mB: 100, sB: 20, xB: 100}
    task: 平均100・標準偏差20の分布（A）で、130 の z得点はいくつか。
    predict: {type: number, key: zA, label: "z得点"}
    expect: 1.5
    why: 平均より30大きく、30÷20＝1.5。平均より標準偏差1.5つ分上。

- id: Q-U08-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 平均30・標準偏差6の分布で、z＝−1.5 に当たる値は？
  answer: x＝μ＋zσ＝30＋(−1.5)×6＝**21**。z が負なので平均より小さい。
  checks:
    - '30 + Fraction(-3,2)*6 == 21'
  lab:
    id: LAB-z
    mode: inv
    set: {m: 30, s: 6, z: -1.5}
    task: 平均30・標準偏差6の分布で、z＝−1.5 に当たる値はいくつか。
    predict: {type: number, key: x, label: "値"}
    expect: 21
    why: 30＋(−1.5)×6＝21。z の式を x について解くと x＝平均＋z×標準偏差。

- id: Q-U08-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 店舗Cは日販の平均40万円・標準偏差8万円で、ある日は28万円だった。店舗Dは平均60万円・標準偏差5万円で、同じ日は52万円だった。その店にとって「珍しく悪い日」だったのはどちらか。
  answer: C：z＝(28−40)÷8＝**−1.5**、D：z＝(52−60)÷5＝**−1.6**。下がった金額は C（12万円）の方が大きいが、ふだんのばらつきで割ると **D の方が少し珍しく悪い**。ただし差は小さいので、どちらも「平均より標準偏差1.5つ分ほど下」と言うのが正確。
  checks:
    - 'Fraction(28-40, 8) == Fraction(-3,2) and Fraction(52-60, 5) == Fraction(-8,5) and 40-28 == 12'
  lab:
    id: LAB-z
    mode: z
    set: {mA: 40, sA: 8, xA: 28, mB: 60, sB: 5, xB: 52, nameA: 店舗C, nameB: 店舗D}
    task: 店舗C（平均40・標準偏差8）の28万円と、店舗D（平均60・標準偏差5）の52万円。店舗Dの z得点はいくつか。
    predict: {type: number, key: zB, label: "店舗Dの z"}
    expect: -1.6
    why: (52−60)÷5＝−1.6。店舗Cは −1.5。z が負の方が「平均より下」、|z| が大きい方が珍しい。

- id: Q-U08-010
  stage: S2
  label: 約1週間後の問
  format: written
  powers: [P1, P2]
  prompt: 通勤時間が平均45分・標準偏差12分の会社で、z＝2.5 の人と z＝−0.5 の人の通勤時間は何分か。
  answer: z＝2.5：45＋2.5×12＝**75分**。z＝−0.5：45＋(−0.5)×12＝**39分**。
  checks:
    - '45 + Fraction(5,2)*12 == 75 and 45 + Fraction(-1,2)*12 == 39'
  lab:
    id: LAB-z
    mode: inv
    set: {m: 45, s: 12, z: 2.5}
    task: 平均45分・標準偏差12分で、z＝2.5 の通勤時間は何分か。予想したら z を −0.5 にもする。
    predict: {type: number, key: x, label: "通勤時間", unit: "分"}
    expect: 75
    why: 45＋2.5×12＝75。z＝−0.5 なら 45−6＝39分。

- id: Q-U08-011
  stage: S2
  label: 計算練習
  format: written
  powers: [P1, P2]
  prompt: |-
    {{unit:U06}} の10人の購入額 1, 1, 2, 2, 2, 3, 3, 4, 5, 17（千円、平均4）で、m₂＝Σ(xᵢ−x̄)²÷n、m₃＝Σ(xᵢ−x̄)³÷n を求め、歪度 g₁＝m₃÷m₂^(3/2) の符号を言え。
  answer: 偏差は −3, −3, −2, −2, −2, −1, −1, 0, 1, 13。2乗の和202 → m₂＝**20.2**。3乗の和は −27−27−8−8−8−1−1＋0＋1＋2197＝2118 → m₃＝**211.8**。g₁＝211.8÷20.2^1.5≒**2.33**（**正**）。13の偏差だけで3乗が2197になり、右に飛び出た1人が歪度を大きく正にしている。
  checks:
    - 'sum((x-4)**2 for x in [1,1,2,2,2,3,3,4,5,17]) == 202 and sum((x-4)**3 for x in [1,1,2,2,2,3,3,4,5,17]) == 2118 and 13**3 == 2197'
    - 'abs(211.8/20.2**1.5 - 2.33) < 0.005'
  figure:
    type: hist
    caption: 10人の購入額（千円）。17千円の1人が右に飛び出し、歪度は正
    data: [1, 1, 2, 2, 2, 3, 3, 4, 5, 17]
    start: 0
    width: 2
    axis_label: 購入額（千円）
    note: 右に長い裾がある分布では、偏差の3乗の和が正になる。

- id: Q-U08-012
  stage: S2
  label: 約1か月後の問
  format: written
  powers: [P3, P1]
  prompt: 2, 4, 6（平均4・標準偏差2、n−1 で割った値）を z得点に直すとどうなるか。z＝(x−4)÷2 は「全部を b 倍して a を足す」形のどれに当たるか（{{unit:U07}}）。直したあとの平均と標準偏差はいくつか。
  answer: z は −1, 0, 1。z＝0.5x−2 なので b＝**0.5**、a＝**−2**。平均は 0.5×4−2＝**0**、標準偏差は 0.5×2＝**1**。足す数 a は散らばりを変えず、b 倍で標準偏差が b 倍になるので、どんなデータも標準化すると平均0・標準偏差1になる。
  checks:
    - '[Fraction(x-4, 2) for x in [2,4,6]] == [-1,0,1] and Fraction(1,2)*4 - 2 == 0 and Fraction(1,2)*2 == 1'
  lab:
    id: LAB-spread
    mode: dev
    set: {data: t3, b: 0.5, a: -2}
    task: 2, 4, 6 を0.5倍して2を引く（z得点に直す）と、標準偏差（√不偏分散）はいくつになるか。
    predict: {type: number, key: s, label: "標準偏差"}
    expect: 1
    why: 0.5倍で標準偏差は2→1、2を引いても変わらない。平均も4→0。これが「標準化すると平均0・標準偏差1」の理由。

- id: Q-U08-020
  stage: S3
  tag: 偏差値
  format: written
  powers: [P1, P2]
  prompt: 偏差値＝50＋10×z。平均62点・標準偏差8点の試験で74点。偏差値は？
  answer: z＝(74−62)÷8＝1.5。偏差値＝50＋10×1.5＝**65**。z＝2 なら偏差値70、z＝−1 なら40。平均50・標準偏差10になるよう変換した値。
  checks:
    - 'Fraction(74-62, 8) == Fraction(3,2) and 50 + 10*Fraction(3,2) == 65 and 50 + 10*2 == 70 and 50 - 10 == 40'
  lab:
    id: LAB-z
    mode: inv
    set: {m: 62, s: 8, z: 1.5}
    task: 平均62点・標準偏差8点の試験で74点（z＝1.5）。偏差値はいくつか。
    predict: {type: number, key: dev, label: "偏差値"}
    expect: 65
    why: 50＋10×1.5＝65。偏差値は z だけで決まるので、平均や標準偏差を変えても z が同じなら偏差値も同じ。

- id: Q-U08-021
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: あるデータを標準化（z＝(x−平均)÷標準偏差）した。標準化と分布の形について、正しい記述はどれか。
  choices:
    - 標準化すると、分布は正規分布になる。
    - 標準化したデータの平均は0、標準偏差は1になる。
    - z得点は元のデータと同じ単位をもつ。
    - 右に裾が長い分布の歪度は負になる。
    - 外れ値候補は、必ず削除してから分析する。
  correct: 2
  answer: 平均を引くと平均が0に、標準偏差で割ると標準偏差が1になる。目盛りが変わるだけで、分布の形（歪度・尖度）は変わらない。
  misconceptions:
    1: 標準化しても形は変わらない。正規分布になるわけではない
    3: 標準偏差で割るので単位は消える
    4: 右に裾が長いと歪度は正
    5: 外れ値候補は原因を確かめてから扱う。削除するなら理由と影響を記録する
  no_checks: 答えに新しい数はない
  lab:
    id: LAB-z
    mode: skew
    set: {skew: 6, std: true}
    task: 右に裾が長い分布を、標準化した目盛りで見る。歪度の符号はどうなるか。
    predict: {type: choice, key: g1sign, label: "歪度の符号", options: [正, ほぼ0, 負]}
    expect: 正
    why: 標準化しても形は同じなので、右に裾が長ければ歪度は正のまま。「標準化した目盛りで見る」を外しても棒の形は変わらない。

- id: Q-U08-022
  stage: S3
  tag: 珍しさ
  format: written
  powers: [P3, P1]
  prompt: 例題Aの店舗Aで、日販が正規分布に近いとき、z≧2（70万円以上）の日はどれくらいの割合か。何日に1回ほどか。
  answer: 標準正規分布で z≧2 は約**2.3%**（0.0228）。1÷0.0228≒44 なので、約**44日に1回**ほど。ただし日販が右に裾の長い分布（特売日だけ大きく売れる）なら、この割合は当てはまらない。
  checks:
    - 'abs(1 - (1 + math.erf(2/2**0.5))/2 - 0.0228) < 0.0001 and abs(1/0.0228 - 44) < 0.5'
  lab:
    id: LAB-z
    mode: normal
    set: {z: 2}
    task: 正規分布で z≧2 になる割合は何%か。
    predict: {type: number, key: pUp, label: "z≧2 の割合", unit: "%"}
    expect: 2.275
    why: 約2.3%。±2 の外側（上と下）を合わせると約4.6%、内側は約95%。z を3にすると上側は約0.13%。

- id: Q-U08-023
  stage: S3
  tag: 外れ値が隠れる
  format: written
  powers: [P3, P1]
  prompt: 10日間の返品数が 10, 10, 10, 10, 10, 10, 10, 10, 10, 30 だった。平均と標準偏差（n で割る）から 30 の z得点を求め、「|z|＞3 なら外れ値」とする規則で判定せよ。箱ひげ図の柵ではどうなるか。
  answer: 平均12、偏差は −2（9日）と18、偏差平方和 36＋324＝360、標準偏差 √(360÷10)＝**6**。z＝(30−12)÷6＝**3** で、「|z|＞3」には当たらない。30 自身が平均と標準偏差を引っ張り、自分の z を小さくしている（外れ値が隠れる）。柵では Q₁＝Q₃＝10、IQR＝0 で柵は10と10 なので、30 は**外れ値候補**。z の規則は外れ値に弱く、四分位数の柵は強い。
  checks:
    - 'Fraction(10*9+30, 10) == 12 and 9*(10-12)**2 + (30-12)**2 == 360 and (360/10)**0.5 == 6 and Fraction(30-12, 6) == 3'
    - 'statistics.median([10,10,10,10,10]) == 10 and 10 + Fraction(3,2)*0 == 10 and 30 > 10'
  lab:
    id: LAB-z
    mode: fence
    set: {q1: 10, q3: 10, x: 30}
    task: Q₁＝10、Q₃＝10（IQR＝0）のとき、30 は柵の外か。
    predict: {type: choice, key: isOut, label: "外れ値候補か", options: [はい, いいえ]}
    expect: はい
    why: IQR＝0 なので柵は10と10。30 は柵の外。z（＝3）では見逃すが、四分位数は30の大きさに引っ張られないので外れ値をとらえる。

- id: Q-U08-030
  stage: S4
  tag: 品質管理
  format: written
  powers: [P3, P1]
  prompt: 内容量500gの袋詰めで、実際の内容量は平均500g・標準偏差4g の正規分布に近い。488g 未満を不良とすると、不良はおよそ何%か。
  answer: z＝(488−500)÷4＝**−3**。標準正規分布で z≦−3 は約**0.13%**（1000袋に約1袋）。標準偏差が2倍の8g になると z＝−1.5 で約6.7% に増える。ばらつきを小さくすることが不良を減らす近道。
  checks:
    - 'Fraction(488-500, 4) == -3 and abs((1 + math.erf(-3/2**0.5))/2 - 0.00135) < 0.00001 and Fraction(488-500, 8) == Fraction(-3,2) and abs((1 + math.erf(-1.5/2**0.5))/2 - 0.0668) < 0.0001'
  lab:
    id: LAB-z
    mode: normal
    set: {z: -3}
    task: 正規分布で z≦−3 になる割合は何%か。
    predict: {type: number, key: pDown, label: "z≦−3 の割合", unit: "%"}
    expect: 0.135
    why: 約0.13%。z を −1.5 にすると約6.7%。標準偏差が大きいと同じ488g でも z が0に近づき、不良が増える。

- id: Q-U08-031
  stage: S4
  tag: 異常日の検知
  format: written
  powers: [P3]
  prompt: 小さい店A（日販の平均50万円・標準偏差10万円）は30万円、大きい店B（平均200万円・標準偏差40万円）は150万円の日があった。減った金額はBの50万円の方が大きい。その店にとってより異常な日はどちらか。
  answer: A：z＝(30−50)÷10＝**−2**、B：z＝(150−200)÷40＝**−1.25**。金額の減りは B の方が大きいが、その店のふだんのばらつきで見ると **A の方が異常**（|z| が大きい）。A の日は、天候・催事・入力ミスなどの原因を先に確かめる。
  checks:
    - 'Fraction(30-50, 10) == -2 and Fraction(150-200, 40) == Fraction(-5,4) and 200-150 == 50'
  lab:
    id: LAB-z
    mode: z
    set: {mA: 50, sA: 10, xA: 30, mB: 200, sB: 40, xB: 150, nameA: 店A, nameB: 店B}
    task: 店A（平均50・標準偏差10）の30万円と、店B（平均200・標準偏差40）の150万円。その店にとってより異常（|z| が大きい）なのはどちらか。
    predict: {type: choice, key: rare, label: "より異常なのは", options: [店A, 店B, 同じ]}
    expect: 店A
    why: 店Aは z＝−2、店Bは −1.25。金額ではなく、その店の標準偏差いくつ分下がったかで比べる。

- id: Q-U08-032
  stage: S4
  tag: 偏差値から点へ
  format: written
  powers: [P1, P2]
  prompt: 平均62点・標準偏差8点の試験で、偏差値60を取るには何点必要か。
  answer: 偏差値60 は z＝(60−50)÷10＝1。点数＝62＋1×8＝**70点**。
  checks:
    - 'Fraction(60-50, 10) == 1 and 62 + 1*8 == 70'
  lab:
    id: LAB-z
    mode: inv
    set: {m: 62, s: 8, z: 1}
    task: 平均62点・標準偏差8点で、偏差値60（z＝1）に当たる点数は何点か。
    predict: {type: number, key: x, label: "点数", unit: "点"}
    expect: 70
    why: 偏差値60 → z＝1 → 62＋8＝70点。標準偏差が大きい試験ほど、同じ偏差値に必要な点の差が大きい。

- id: Q-U08-040
  stage: S3
  label: 確かめ問題
  format: written
  powers: [P1, P3]
  prompt: 平均±2標準偏差の内側に入る割合は、チェビシェフの不等式では少なくとも何%、正規分布なら約何%か。
  answer: チェビシェフ：1−1/2²＝**75%以上**。正規分布：約**95.4%**。分布の形が正規分布に近いと仮定できれば、より強いことが言える。
  checks:
    - '1 - Fraction(1, 2**2) == Fraction(3,4) and abs(math.erf(2/2**0.5) - 0.954) < 0.001'
  lab:
    id: LAB-z
    mode: normal
    set: {z: 2}
    task: 正規分布で |z|≦2（±2 標準偏差の内側）の割合は何%か。
