# 単元U32の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U32-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    3つの陳列案を、各3店にくじで割り当てた。数量の増加は A：2, 4, 6　B：5, 7, 9　C：8, 10, 12。平均に差があるかを有意水準5%で判断せよ（F(2, 6) の上側5%点は5.143）。

    群の平均 □・□・□、全体の平均 □。群間の平方和＝3×(□)²＋3×(□)²＋3×(□)²＝□（自由度□）。群内の平方和＝□（自由度□）。F＝(□÷□)÷(□÷□)＝□。F □ 5.143 なので「平均はすべて同じ」を □。
  answer_title: 答え（埋めてから開く）
  answer: 群の平均 **4・7・10**、全体の平均 **7**。群間＝3×(−3)²＋3×0²＋3×3²＝**54**（自由度**2**）。群内＝各群 4＋0＋4＝8 が3群で **24**（自由度**6**）。F＝(54÷2)÷(24÷6)＝27÷4＝**6.75**。F **＞** 5.143 なので **棄却する**（p≒0.029）。少なくとも1組の平均が違う。
  checks:
    - '3*9+3*0+3*9 == 54 and 3*8 == 24 and (54/2)/(24/6) == 6.75 and 6.75 > 5.143'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(5.143,2,6) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(6.75,2,6) - 0.0291) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: b, kb: 1, kw: 1, rep: 1}
    task: 陳列3案（各3店）。A 2,4,6・B 5,7,9・C 8,10,12。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 6.75
    why: 群間の平均平方27 ÷ 群内の平均平方4。境目5.143 を超える。各2店の例題A（F＝4）より、群の平均のずれが大きく店も多い。

- id: Q-U32-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P3]
  prompt: 次の比べ方は、フィッシャーの3原則（無作為化・反復・局所管理）のどれが欠けているか。① 新しい陳列を、店長が「やる気のある店」10店に入れ、入れなかった店と比べた。② 2つの陳列案を、それぞれ1店ずつで試した。③ 規模がまちまちの20店で、規模を考えずにくじで2案に分けた（大きな誤りではないが、もっとよくできる）。
  answer: ① **無作為化**が欠けている。やる気のある店はもともと売上が高いかもしれず、その違いが効果に混ざる（交絡）。くじで決める。② **反復**が欠けている。1店ずつでは、店の違いと偶然のばらつきを分けられない。各案を複数の店で試す。③ **局所管理**を使うとよい。規模の近い店どうしで組にしてからくじを引くと、規模の差がばらつきに入らず、少ない店で差を見つけやすい。
  no_checks: 計算した数を含まない（原則の判断のみ）
  lab:
    id: LAB-doe
    mode: assign
    set: {method: random, tau: 3}
    task: 本当の効果は3。20店からくじで半分を選んで施策をする実験を500回くり返すと、推定した効果は？
    predict: {type: choice, key: biased, label: "推定は", options: [偏りあり, 偏りなし]}
    expect: 偏りなし
    why: くじなら規模の差が施策と無関係になり、推定の平均は本当の3 に近い。ただしヒストグラムの幅は広い。「大きい店を選ぶ」に切り替えると平均は約23 になる。

- id: Q-U32-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 4つの売場（各6店、合計24店）の分散分析で、群間の平方和は30、群内の平方和は60 だった。分散分析表を完成させ、有意水準5%で判断せよ（F(3, 20) の上側5%点は3.098）。
  answer: 自由度は群間 4−1＝**3**、群内 24−4＝**20**。平均平方は 30÷3＝**10**、60÷20＝**3**。F＝10÷3≒**3.33**＞3.098 なので **棄却する**（p≒0.040）。少なくとも1つの売場の平均が違う。
  checks:
    - '4-1 == 3 and 24-4 == 20 and 30/3 == 10 and 60/20 == 3 and abs(10/3 - 3.33) < 0.005 and 10/3 > 3.098'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.098,3,20) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.3333,3,20) - 0.04) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: four, kb: 1, kw: 1, rep: 1}
    task: 4つの売場（各6店）。群間の平方和30、群内の平方和60 になるデータ。F の値は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 3.3333
    why: (30÷3)÷(60÷20)＝10÷3。群の数が増えると、群間の自由度も増える。

- id: Q-U32-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P3]
  prompt: 例題Aの6店（A：1, 3　B：3, 5　C：5, 7）を、各店で5日ずつ数え、毎日同じ値だったとして30個のデータで分散分析した。F と境目はどうなるか（F(2, 27) の上側5%点は3.354）。この判断は正しいか。
  answer: 群間の平方和80、群内の平方和30、自由度2と27 で F＝(80÷2)÷(30÷27)＝**36**。境目3.354 を大きく超えて「棄却する」と出る。しかし**正しくない**。くじで割り当てた単位は店（6店）で、同じ店の5日は独立したデータではない。日を店として数えると、群内の自由度を多く数えすぎ、差を言いすぎる。店の単位（6店、F＝4）で判断する。
  checks:
    - '10*4+10*0+10*4 == 80 and 15*2 == 30 and abs((80/2)/(30/27) - 36) < 1e-9 and 36 > 3.354'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.354,2,27) - 0.95) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: ex, kb: 1, kw: 1, rep: 5}
    task: 例題Aの6店を、同じ値で5回ずつくり返して30個として数える。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 36
    why: 平方和はどちらも5倍だが、群内の自由度が3 から27 に増える。データは増えていない（同じ店をくり返しただけ）のに F だけが大きくなる。

- id: Q-U32-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 本当はどの施策も平均が同じ3群（各5店）で、A対B・A対C・B対C の t 検定をそれぞれ5%で行う。どれか1組でも偶然「有意」になる確率は、5% と比べてどうなるか。1−0.95³ と比べて述べよ。
  answer: 組の数は3。どれかが有意になる確率は5%より大きく、ラボの2000回の実験では約**0.12**。3回の検定が独立なら 1−0.95³≒**0.143** だが、同じデータを使い回すので独立ではなく、それより少し小さい。分散分析の F 検定なら、全体で約5% に保たれる。組ごとに比べるなら、0.05÷3≒**0.0167** のように基準を厳しくする。
  checks:
    - '3*2/2 == 3 and abs(1-0.95**3 - 0.143) < 0.0005 and abs(0.05/3 - 0.0167) < 0.00005'
  lab:
    id: LAB-doe
    mode: multi
    set: {k: 3, n: 5}
    task: 本当は平均が同じ3群（各5店）。組ごとの t 検定（5%）で、どれかが偶然有意になる割合は（小数で）？
    predict: {type: number, key: fwerT, label: "割合", tol: 0.02}
    expect: 0.119
    why: 約0.12。F 検定の割合は約0.05。群を6 にすると組は15、割合は約0.38 に増える。

- id: Q-U32-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 3案（各5店、合計15店）の分散分析で、全体の平方和は60、群間の平方和は30 だった。分散分析表を作り、有意水準5%で判断せよ（F(2, 12) の上側5%点は3.885）。
  answer: 群内＝60−30＝**30**。自由度は群間2、群内12、全体14。平均平方 30÷2＝**15**、30÷12＝**2.5**。F＝15÷2.5＝**6**＞3.885 なので**棄却する**（p≒0.016）。
  checks:
    - '60-30 == 30 and 3-1 == 2 and 15-3 == 12 and 30/2 == 15 and 30/12 == 2.5 and 15/2.5 == 6 and 6 > 3.885'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(3.885,2,12) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(6,2,12) - 0.016) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: five, kb: 1, kw: 1, rep: 1}
    task: 3案（各5店）。全体の平方和60・群間の平方和30 になるデータ。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 6
    why: 全体＝群間＋群内 なので群内は30。自由度で割ってから比べる。

- id: Q-U32-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 例題Aと同じ値の店をもう1組ずつ足し、各4店（A：1, 3, 1, 3　B：3, 5, 3, 5　C：5, 7, 5, 7）で分散分析した。F を求め、例題A（各2店、F＝4）と結論を比べよ（F(2, 9) の上側5%点は4.256）。
  answer: 群間の平方和32、群内の平方和12、自由度2 と9。F＝(32÷2)÷(12÷9)＝16÷1.333…＝**12**＞4.256 で**棄却する**（p≒0.003）。群の平均は同じ2・4・6 でも、独立した店が増えると群内の自由度が増え、偶然では説明しにくくなる。
  checks:
    - '4*4+4*0+4*4 == 32 and 6*2 == 12 and abs((32/2)/(12/9) - 12) < 1e-9 and 12 > 4.256'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(4.256,2,9) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(12,2,9) - 0.0029) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: rep, kb: 1, kw: 1, rep: 1}
    task: 例題Aの値で各4店。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 12
    why: 群間の平均平方16、群内の平均平方 12÷9≒1.33。Q-U32-004 と違い、ここは別々の店を4店ずつ用意した場合。

- id: Q-U32-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 施策A（1, 3）と C（5, 7）の2群だけを比べる。① 2群の t 検定（等分散、{{unit:U25}}）の t ② 一元配置の分散分析の F を求め、関係を述べよ（t(2) の0.975点は4.303）。
  answer: ① 合わせた分散 (2＋2)÷2＝2、SE＝√(2×(1÷2＋1÷2))＝√2≒1.414、t＝(6−2)÷1.414≒**2.83**、|t|＜4.303 で棄却しない。② 群間16、群内4、自由度1 と2、F＝16÷2＝**8**。**F＝t²**（2.83²＝8）で、F の境目も 4.303²≒18.51。2群なら分散分析と t 検定は同じ結論になる。
  checks:
    - '(2+2)/2 == 2 and abs(math.sqrt(2) - 1.414) < 0.0005 and abs(4/math.sqrt(2) - 2.83) < 0.005 and 2*4+2*4 == 16 and 16/2 == 8 and abs((4/math.sqrt(2))**2 - 8) < 1e-9 and abs(4.303**2 - 18.51) < 0.01'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: two, kb: 1, kw: 1, rep: 1}
    task: A（1, 3）と C（5, 7）の2群。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 8
    why: t＝2.83 の2乗。境目 F(1, 2)≒18.51 も t の点4.303 の2乗。

- id: Q-U32-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 4つの陳列案（各5店）で、本当はどれも平均が同じとき、すべての組を t 検定（5%）で比べると何組になり、どれかが偶然有意になる割合はどれくらいか。組ごとに比べるなら、各組の有意水準をいくつにすればよいか（ボンフェローニ）。
  answer: 組の数は 4×3÷2＝**6**。どれかが偶然有意になる割合は約**0.2**（ラボの2000回の実験で約0.199）。組ごとに比べるなら、各組を 0.05÷6≒**0.0083** で判断する。ただし基準を厳しくすると、本当の差も見逃しやすくなる。
  checks:
    - '4*3/2 == 6 and abs(0.05/6 - 0.0083) < 0.00005 and 1-0.95**6 > 0.2'
  lab:
    id: LAB-doe
    mode: multi
    set: {k: 4, n: 5}
    task: 本当は平均が同じ4群（各5店）。比べる組の数は？
    predict: {type: number, key: pairs, label: "組の数"}
    expect: 6
    why: 6組。どれかが偶然有意になる割合は約0.2、F 検定なら約0.05。

- id: Q-U32-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 店の数が違う3群 A：2, 4　B：4, 6, 8　C：7, 9 で分散分析をする。全体の平均を、群の平均の単純な平均にしてはいけない理由を述べ、F を求めて判断せよ（F(2, 4) の上側5%点は6.944）。
  answer: 全体の平均は全7店の平均 40÷7≒**5.714**（群の平均3・6・8 の単純な平均5.667 ではない）。店の数で重みを付ける。群間＝2×(3−5.714)²＋3×(6−5.714)²＋2×(8−5.714)²≒**25.43**、群内＝2＋8＋2＝**12**、自由度2 と4。F＝(25.43÷2)÷(12÷4)≒**4.24**＜6.944 なので棄却しない（p≒0.10）。
  checks:
    - 'abs(40/7 - 5.714) < 0.0005 and abs((3+6+8)/3 - 5.667) < 0.0005 and abs(2*(3-40/7)**2+3*(6-40/7)**2+2*(8-40/7)**2 - 25.43) < 0.005 and 2+8+2 == 12 and abs((2*(3-40/7)**2+3*(6-40/7)**2+2*(8-40/7)**2)/2/(12/4) - 4.24) < 0.005'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(6.944,2,4) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(4.2381,2,4) - 0.1) < 0.005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: uneq, kb: 1, kw: 1, rep: 1}
    task: A（2, 4）・B（4, 6, 8）・C（7, 9）。F の値は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 4.2381
    why: 全体の平均は店の数で重みを付けた40÷7。群間の平方和も、群ごとの店の数を掛けて足す。

- id: Q-U32-022
  stage: S3
  format: written
  powers: [P3]
  prompt: 規模が20〜58 と大きく違う20店で、新しい陳列の効果を調べる。① 20店からくじで10店を選ぶ ② 規模の近い2店ずつを組にして、組の中でくじを引く。どちらも偏りはないが、何が違うか。②を選んだら、分析で気をつけることは何か。
  answer: ②は**局所管理（ブロック化）**。規模の近い店どうしで比べるので、規模の差が推定のばらつきに入らず、①より推定のばらつきが**小さい**（同じ店数でも差を見つけやすい）。②で割り当てたら、組（ブロック）を考えた分析（対応のある比較など）を使い、単純な2群の比較を無条件に流用しない。
  no_checks: 計算した数を含まない（数は問題文の規模の範囲だけ）
  lab:
    id: LAB-doe
    mode: assign
    set: {method: block, tau: 3}
    task: 規模の近い2店ずつの組の中でくじを引く。推定した効果のばらつきは、くじで半分を選ぶときと比べて？
    predict: {type: choice, key: spread, label: "ばらつきは", options: [くじより小さい, くじと同じくらい, くじより大きい]}
    expect: くじより小さい
    why: くじで半分だとばらつき（標準偏差）は約5.4、組にすると約1.1。偏りはどちらもない。

- id: Q-U32-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 一元配置の分散分析について、正しいものはどれか。
  choices:
    - 分散分析は、各群の母分散が等しいかどうかを検定する方法である。
    - 3群の平均を比べるとき、2群ずつの t 検定を5%で3回くり返しても、全体の誤りは5%に保たれる。
    - F は、群間の平均平方を群内の平均平方で割った値で、群の平均のずれが大きいほど大きくなる。
    - F 検定で棄却されたら、すべての組の平均に差があると言える。
    - 1店で毎日数えた日のデータは、別々の店のデータとして数えてよい。
  correct: 3
  answer: 群間の平均平方は群の平均のずれ、群内の平均平方は群の中のばらつきを表す。例題Aでは 8÷2＝4。平均のずれだけを2倍にすると F は4倍の16 になる。
  misconceptions:
    1: 分散分析が調べるのは平均の差。群の分散が等しいことは前提
    2: くり返すと、どれかが偶然有意になる確率は5%より大きくなる（3群で約0.12）
    4: 棄却したら「少なくとも1組が違う」まで。どの組かは多重比較で調べる
    5: 同じ店の日どうしは独立でない。くじで割り当てた単位（店）で数える
  checks:
    - '8/2 == 4 and (4*16/2)/(6/3) == 16'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: ex, kb: 2, kw: 1, rep: 1}
    task: 例題Aで、群の平均のずれだけを2倍にした。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 16
    why: 群間の平方和は 2²＝4倍の64、群内は6 のまま。F＝(64÷2)÷(6÷3)＝16。

- id: Q-U32-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 3つのチラシ案を、12店にくじで4店ずつ割り当てた。数量の増加は A：10, 12, 11, 13　B：14, 15, 13, 16　C：12, 11, 13, 12。分散分析で判断し、報告の文を書け（F(2, 9) の上側5%点は4.256）。
  answer: 群の平均 11.5・14.5・12、全体の平均 152÷12≒12.67。群間≒**20.67**（自由度2）、群内＝5＋5＋2＝**12**（自由度9）。F＝(20.67÷2)÷(12÷9)≒**7.75**＞4.256 で**棄却する**（p≒0.011）。「チラシ3案の数量の平均には差がある（一元配置の分散分析、有意水準5%）。B 案の平均が最も高いが、どの組が違うかは多重比較で確かめる」。
  checks:
    - '(10+12+11+13)/4 == 11.5 and (14+15+13+16)/4 == 14.5 and (12+11+13+12)/4 == 12 and abs(152/12 - 12.67) < 0.005'
    - 'abs(4*(11.5-152/12)**2+4*(14.5-152/12)**2+4*(12-152/12)**2 - 20.67) < 0.005 and (2.25+0.25+0.25+2.25) == 5 and (0.25+0.25+2.25+2.25) == 5 and (0+1+1+0) == 2 and abs((20.6667/2)/(12/9) - 7.75) < 0.001'
    - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(4.256,2,9) - 0.95) < 0.0005 and abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(7.75,2,9) - 0.011) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: flyer, kb: 1, kw: 1, rep: 1}
    task: チラシ3案（各4店）。F の値は（小数で）？
    predict: {type: number, key: F, label: "F"}
    expect: 7.75
    why: 群間の平均平方≒10.33、群内の平均平方≒1.33。境目4.256 を超える。

- id: Q-U32-031
  stage: S4
  format: written
  powers: [P3]
  prompt: 「新しいレジを入れた10店は、入れていない10店より売上が平均で20 高い。新しいレジの効果は大きい」という報告が来た。新しいレジは売上の大きい店から順に入れていた。この報告の問題点と、効果を確かめる比べ方を述べよ。
  answer: 売上の大きい店から入れたので、店の規模の違いがレジの効果に混ざっている（**交絡**）。レジに効果がなくても、差は大きく出る。確かめるには、①これから入れる店をくじで決めて比べる（無作為化）②規模の近い店どうしで組にしてくじを引く（局所管理）③入れる前の売上をそろえて、前後の差で比べる、などがある。
  no_checks: 計算した数を含まない（数は問題文の値だけ）
  lab:
    id: LAB-doe
    mode: assign
    set: {method: choose, tau: 0}
    task: 本当の効果は0（効果なし）。大きい店から10店に施策をして500回実験すると、推定した効果は？
    predict: {type: choice, key: biased, label: "推定は", options: [偏りあり, 偏りなし]}
    expect: 偏りあり
    why: 効果がないのに、推定の平均は約20。規模の差がそのまま「効果」に見える。

- id: Q-U32-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 3つの陳列案を各3店で試した。数量の増加は A：20, 22, 24　B：24, 26, 28　C：26, 28, 30。① 分散分析で判断せよ（F(2, 6) の上側5%点は5.143）。② C 案は A 案より平均で6 多いが、C 案は棚の作り替えに1店あたり多くの手間がかかる。採用をどう決めるか。
  answer: ① 群の平均 22・26・28、全体の平均 76÷3≒25.33。群間＝**56**、群内＝**24**、F＝(56÷2)÷(24÷6)＝**7**＞5.143 で**棄却する**（p≒0.027）。② 統計で言えるのは「平均に差がある」と「差はどれくらいか（区間）」まで。数量の6の増加が手間と費用に見合うか、店ごとに棚を作り替えられるかは、統計の外で決める。B 案（＋4、手間が小さい）と比べる判断もある。
  checks:
    - '(20+22+24)/3 == 22 and (24+26+28)/3 == 26 and (26+28+30)/3 == 28 and abs(76/3 - 25.33) < 0.005'
    - 'abs(3*(22-76/3)**2+3*(26-76/3)**2+3*(28-76/3)**2 - 56) < 1e-9 and 3*8 == 24 and (56/2)/(24/6) == 7 and 7 > 5.143 and 28-22 == 6 and 26-22 == 4'
    - 'abs(1-(lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(7,2,6) - 0.027) < 0.0005'
  lab:
    id: LAB-doe
    mode: anova
    set: {data: promo, kb: 1, kw: 1, rep: 1}
    task: 陳列3案（各3店）。F の値は？
    predict: {type: number, key: F, label: "F"}
    expect: 7
    why: 群間の平均平方28、群内の平均平方4。採用するかは差の大きさと手間で決める。

- id: Q-U32-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 施策の効果が、小型店では＋4、大型店では0 だった。① 小型店と大型店が半分ずつ ② 小型店が8割、のとき、全店の平均の効果はそれぞれいくつか。「平均の効果」だけを報告すると何が消えるか。
  answer: ① 0.5×4＋0.5×0＝**2**。② 0.8×4＋0.2×0＝**3.2**。店の型の割合で平均の効果は変わる。平均の効果1つでは、「小型店で効き、大型店では効かない」こと（**交互作用**）が消える。導入するなら小型店から、という判断ができなくなる。
  checks:
    - '0.5*4+0.5*0 == 2 and abs(0.8*4+0.2*0 - 3.2) < 1e-12'
  lab:
    id: LAB-doe
    mode: inter
    set: {es: 4, el: 0, p: 0.8}
    task: 小型店の効果4、大型店の効果0、小型店の割合0.8。平均の効果は（小数で）？
    predict: {type: number, key: avg, label: "平均の効果"}
    expect: 3.2
    why: 0.8×4＋0.2×0。割合を0.5 にすると2。どちらの数も「どの店で効くか」を表さない。
