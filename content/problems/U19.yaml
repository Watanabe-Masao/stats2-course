# 単元U19の問題。id は変えない（個人の解答記録がこの id を指す）。
# 検算の Φ(z) は 0.5*(1+math.erf(z/math.sqrt(2)))、二項の累積は sum(comb(n,i)*p**i*(1-p)**(n-i) for i in range(k+1))
- id: Q-U19-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    1日400人の来店客が、それぞれ確率0.1でクーポンを使う（独立）。クーポン利用者が45人以上になる確率を、連続修正ありの正規近似で求めよ。（Φ(0.75)＝0.7734）

    平均 np＝□、標準偏差 √(np(1−p))＝√□＝□。「45人以上」は □ 以上として、z＝(□−40)÷6＝□。確率＝1−Φ(□)＝□
  answer_title: 答え（埋めてから開く）
  answer: 平均 **40**、標準偏差 √36＝**6**。「45人以上」は **44.5** 以上、z＝4.5÷6＝**0.75**。確率＝1−0.7734＝**0.2266**（約23%）。正確な二項の値は0.2237。
  checks:
    - 'math.isclose(400*0.1, 40) and math.isclose(400*0.1*0.9, 36) and math.sqrt(36) == 6 and math.isclose((44.5-40)/6, 0.75) and abs(1-0.7734 - 0.2266) < 1e-9'
    - 'abs(0.5*(1+math.erf(0.75/math.sqrt(2))) - 0.7734) < 0.00005 and abs(1-sum(comb(400,i)*0.1**i*0.9**(400-i) for i in range(45)) - 0.2237) < 0.00005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 400, p: 0.1, k: 45, kind: ge}
    task: B(400, 0.1) で45回以上になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≧45)"}
    expect: 0.2266
    why: 44.5 から上の面積で z＝0.75、約0.227。正確な値0.224と近い。修正なし（z＝5÷6）だと0.202で、ずれが大きい。

- id: Q-U19-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P3]
  prompt: レジの待ち時間は平均5分・標準偏差5分で、右に長い裾の分布（短い人が多く、ときどきとても長い）。25人の平均待ち時間 x̄ の標準誤差は？ x̄ が6分を超える確率を、中心極限定理で正規近似して求めよ。（Φ(1)＝0.8413）
  answer_title: 答え（解いてから開く）
  answer: SE＝5÷√25＝**1分**。中心極限定理で x̄ は近似的に N(5, 1²)。z＝(6−5)÷1＝1、P(x̄＞6)≒1−0.8413＝**0.1587**（約16%）。1人の待ち時間は正規分布ではないが、25人の平均は正規分布に近い。
  checks:
    - '5/math.sqrt(25) == 1 and (6-5)/1 == 1 and abs(1-0.8413 - 0.1587) < 1e-9'
  lab:
    id: LAB-clt
    mode: clt
    set: {shape: expo, n: 25}
    task: 待ち時間（平均5分・標準偏差5分）から25人の平均を取る。x̄ の標準誤差は何分か。
    predict: {type: number, key: se, label: "SE", unit: "分"}
    expect: 1
    why: 5÷√25＝1分。2000回取り直した x̄ の標準偏差も1分に近く、形は正規曲線にかなり近い（歪度 2÷5＝0.4）。n を1にすると母集団の右に長い形のまま。

- id: Q-U19-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 当たりの確率0.3のくじを100回引く。当たりの割合が p＝0.3 からずれる目安（標準誤差）は？ ±2SE の範囲は？
  answer: SE＝√(0.3×0.7÷100)＝√0.0021≒**0.046**。±2SE は ±0.092 で、割合はおよそ **0.21〜0.39** に入る。
  checks:
    - 'abs(math.sqrt(0.0021) - 0.046) < 0.0005 and abs(2*math.sqrt(0.0021) - 0.092) < 0.0005 and abs(0.3-0.0917 - 0.21) < 0.005 and abs(0.3+0.0917 - 0.39) < 0.005'
  lab:
    id: LAB-clt
    mode: lln
    set: {p: 0.3, N: 100}
    task: 当たりの確率0.3のくじを100回引く。割合のずれの目安 SE は（小数で）？
    predict: {type: number, key: se, label: "SE"}
    expect: 0.0458
    why: √(0.21÷100)≒0.046。回数を400回にすると0.023で半分。割合の線は ±2SE の帯の中を通ることが多い。

- id: Q-U19-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 1日200人の来店客がそれぞれ確率0.2で新商品を買う（独立）。購入者が50人以上になる確率を、連続修正ありの正規近似で求めよ。（Φ(1.68)＝0.9535）
  answer: 平均 200×0.2＝40、標準偏差 √(200×0.2×0.8)＝√32≒5.66。「50人以上」は49.5以上、z＝9.5÷5.66≒**1.68**。確率≒1−0.9535＝**0.0465**（約5%）。正確な値は0.0494。
  checks:
    - 'math.isclose(200*0.2, 40) and math.isclose(200*0.2*0.8, 32) and abs(math.sqrt(32) - 5.66) < 0.005 and abs((49.5-40)/math.sqrt(32) - 1.68) < 0.005 and abs(1-0.9535 - 0.0465) < 1e-9'
    - 'abs(0.5*(1+math.erf(1.68/math.sqrt(2))) - 0.9535) < 0.00005 and abs(1-sum(comb(200,i)*0.2**i*0.8**(200-i) for i in range(50)) - 0.0494) < 0.00005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 200, p: 0.2, k: 50, kind: ge}
    task: B(200, 0.2) で50回以上になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≧50)"}
    expect: 0.0465
    why: 49.5 から上で z≒1.68、約0.047。正確な値は0.049。p＝0.2 で分布が少し右に歪むので、右の裾は近似が少し小さめに出る。

- id: Q-U19-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: ある商品の1日の販売数は平均100個・標準偏差10個。分布の形は分からない。80個以下か120個以上になる日の割合は、多くても何%か。正規分布だと仮定するとどれくらいか。（Φ(2)＝0.9772）
  answer: 平均から 2σ 以上離れるので、チェビシェフの不等式で **1/2²＝1/4（25%）以下**。正規分布なら 2×(1−0.9772)＝**0.0456**（約5%）。形が分からないときの上限は粗く、実際に25%起きるという意味ではない。
  checks:
    - '(120-100)/10 == 2 and 1/2**2 == 0.25 and abs(2*(1-0.9772) - 0.0456) < 1e-9'
  lab:
    id: LAB-clt
    mode: cheb
    set: {k: 2}
    task: 平均から 2σ 以上離れる確率の、チェビシェフの上限は（小数で）？
    predict: {type: number, key: bound, label: "上限 1÷k²"}
    expect: 0.25
    why: 1÷2²＝0.25。正規分布なら0.0455で、上限よりずっと小さい。k を3にすると上限0.111、正規なら0.0027。

- id: Q-U19-010
  stage: S2
  format: written
  powers: [P1, P2]
  prompt: 当選率0.5のくじに100人が応募する。当選者が60人以上になる確率を、連続修正ありの正規近似で求めよ。（Φ(1.9)＝0.9713）
  answer: 平均50・標準偏差5。「60人以上」は59.5以上、z＝9.5÷5＝**1.9**。確率＝1−0.9713＝**0.0287**（約3%）。正確な値は0.0284。
  checks:
    - '(59.5-50)/5 == 1.9 and abs(1-0.9713 - 0.0287) < 1e-9 and abs(0.5*(1+math.erf(1.9/math.sqrt(2))) - 0.9713) < 0.00005 and abs(1-sum(comb(100,i)*0.5**100 for i in range(60)) - 0.0284) < 0.00005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 100, p: 0.5, k: 60, kind: ge}
    task: B(100, 0.5) で60回以上になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≧60)"}
    expect: 0.0287
    why: 59.5 から上で z＝1.9。「以上」は棒の左端 k−0.5 から数える。60＋0.5 にすると向きが逆。

- id: Q-U19-011
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: コインを投げて表の割合を調べる。400回投げたときの表の割合の標準誤差は？ 100回のときと比べると何倍か。
  answer: 400回：√(0.5×0.5÷400)＝**0.025**。100回なら0.05 なので **1/2倍**。回数を4倍にしても、ずれの目安は半分にしかならない。
  checks:
    - 'math.isclose(math.sqrt(0.25/400), 0.025) and math.isclose(math.sqrt(0.25/100), 0.05)'
  lab:
    id: LAB-clt
    mode: lln
    set: {p: 0.5, N: 400}
    task: 確率0.5で400回。割合のずれの目安 SE は（小数で）？
    predict: {type: number, key: se, label: "SE"}
    expect: 0.025
    why: √(0.25÷400)＝0.025。割合は0.5に近づくが、表の「回数」と200の差は回数を増やしても小さくならない（割合で見るから近づく）。

- id: Q-U19-012
  stage: S2
  format: written
  powers: [P1, P3]
  prompt: 20人の客がそれぞれ確率0.5で買う（独立）。購入者が12人以下になる確率を、二項分布（{{unit:U14}}）の正確な値と、連続修正ありの正規近似で求めて比べよ。（正確な値は0.8684、Φ(1.12)＝0.8686）
  answer: 平均10・標準偏差 √5≒2.236。12.5 以下として z＝2.5÷2.236≒**1.12**、近似は約 **0.868**。正確な値 **0.8684** とほぼ同じ。n＝20 でも p＝0.5 なら左右対称なので、近似はよく合う。
  checks:
    - 'abs(math.sqrt(5) - 2.236) < 0.0005 and abs(2.5/math.sqrt(5) - 1.12) < 0.005 and abs(sum(comb(20,i) for i in range(13))/2**20 - 0.8684) < 0.00005 and abs(0.5*(1+math.erf(1.12/math.sqrt(2))) - 0.8686) < 0.00005 and abs(0.5*(1+math.erf(2.5/math.sqrt(5)/math.sqrt(2))) - 0.868) < 0.0005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 20, p: 0.5, k: 12, kind: le}
    task: B(20, 0.5) で12回以下になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≦12)"}
    expect: 0.8682
    why: z＝2.5÷√5≒1.118 で約0.868。正確な値0.8684とほぼ同じ。p を0.1にすると、n＝20 では近似が大きくずれる。

- id: Q-U19-020
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 40人の客がそれぞれ確率0.05で返品する（独立）。返品が0件になる確率を、① 二項分布で正確に ② 連続修正ありの正規近似で求め、正規近似を使ってよいか判断せよ。
  answer: ① 0.95⁴⁰≒**0.129**。② 平均2・標準偏差 √1.9≒1.38、0.5 以下として z≒−1.09、近似は約0.138。np＝2 と小さく、分布が右に大きく歪んでいるので、正規近似は**使わない**方がよい（ポアソン近似 e⁻²≒0.135 の方が近い）。
  checks:
    - 'abs(0.95**40 - 0.129) < 0.0005 and math.isclose(40*0.05, 2) and abs(math.sqrt(1.9) - 1.38) < 0.005 and abs((0.5-2)/math.sqrt(1.9) + 1.09) < 0.005 and abs(0.5*(1+math.erf((0.5-2)/math.sqrt(1.9)/math.sqrt(2))) - 0.138) < 0.0005 and abs(math.exp(-2) - 0.135) < 0.0005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 40, p: 0.05, k: 0, kind: le}
    task: B(40, 0.05) で0回になる確率（正確な二項）は（小数で）？
    predict: {type: number, key: exact, label: "正確な P(X＝0)"}
    expect: 0.1285
    why: 0.95⁴⁰≒0.129。棒グラフは右に歪み、正規曲線と合わない。np（2）と n(1−p) の両方が十分大きいかを、近似の前に確かめる。

- id: Q-U19-021
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 購入率0.2の売場で、400人のうち100人以上が買う確率を、連続修正ありの正規近似で求めよ。（Φ(2.44)＝0.9927）
  answer: 平均80・標準偏差 √64＝8。99.5 以上として z＝19.5÷8≒**2.44**。確率≒1−0.9927＝**0.0073**（約0.7%）。正確な値は0.0086。
  checks:
    - 'math.isclose(400*0.2, 80) and math.isclose(400*0.2*0.8, 64) and abs(19.5/8 - 2.44) < 0.005 and abs(1-0.9927 - 0.0073) < 1e-9 and abs(0.5*(1+math.erf(2.44/math.sqrt(2))) - 0.9927) < 0.00005 and abs(1-sum(comb(400,i)*0.2**i*0.8**(400-i) for i in range(100)) - 0.0086) < 0.00005'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 400, p: 0.2, k: 100, kind: ge}
    task: B(400, 0.2) で100回以上になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≧100)"}
    expect: 0.0074
    why: z≒2.44 で約0.007。遠い裾では、二項の右の裾の方が少し厚く、近似が小さめに出る。

- id: Q-U19-022
  stage: S3
  format: written
  powers: [P1, P3]
  prompt: 待ち時間の分布は歪度2（右に長い裾）。標本平均 x̄ の歪度は 2÷√n になる。x̄ の歪度を0.25以下にするには、何人分の平均が必要か。
  answer: 2÷√n≦0.25 より √n≧8、**n≧64**。歪んだ母集団ほど、正規に近づくのに大きい n が要る。「n＝30 で十分」は、この母集団では歪度0.37 が残る。
  checks:
    - '2/math.sqrt(64) == 0.25 and abs(2/math.sqrt(30) - 0.37) < 0.005'
  lab:
    id: LAB-clt
    mode: clt
    set: {shape: expo, n: 64}
    task: 待ち時間（歪度2）から64人の平均を取る。x̄ の歪度は（小数で）？
    predict: {type: number, key: gmean, label: "x̄ の歪度"}
    expect: 0.25
    why: 2÷√64＝0.25。歪度を半分にするには n を4倍。「0か1」で p＝0.05 にすると母集団の歪度は約4.1で、もっと大きい n が要る。

- id: Q-U19-023
  stage: S3
  tag: 本番形式
  format: choice
  powers: [P3]
  prompt: 大数の法則と中心極限定理について、正しいものはどれか。
  choices:
    - 大数の法則により、標本平均の分布は n が大きくなると正規分布に近づく。
    - 中心極限定理により、n が大きければ母集団の分布も正規分布に近づく。
    - 独立同分布で分散が有限なら、n が大きいとき標本平均の分布は正規分布で近似できる。
    - n＝30 以上なら、どんな母集団でも正規近似は十分正確である。
    - 表が5回続いたコインは、大数の法則により次は裏が出やすい。
  correct: 3
  answer: これが中心極限定理。母集団の形によらず、x̄ の分布が N(μ, σ²/n) に近づく。
  misconceptions:
    1: 大数の法則は x̄ の「値」が μ に近づくこと。分布の形の話は中心極限定理
    2: 近づくのは x̄ の分布。母集団（1個ずつの値）の形は変わらない
    4: 歪みの強い母集団では n＝30 でも歪みが残る。一律の基準はない
    5: 1回ごとは独立で、確率は毎回0.5。割合が近づくのは、多くの回で薄まるから
  checks:
    - '5/math.sqrt(100) == 0.5'
  lab:
    id: LAB-clt
    mode: clt
    set: {shape: expo, n: 100}
    task: 待ち時間（平均5分・標準偏差5分）から100人の平均を取る。x̄ の標準誤差は何分か。
    predict: {type: number, key: se, label: "SE", unit: "分"}
    expect: 0.5
    why: 5÷√100＝0.5分。形は正規曲線とほぼ重なる。母集団を「山が2つ」にしても、n を大きくすると x̄ は山1つの正規分布になる。

- id: Q-U19-030
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 当選率0.1のキャンペーンに1000人が応募する。賞品が足りなくなる確率を5%以下にするには、賞品を何個用意すればよいか。正規近似（連続修正あり）で求めよ。（上側5%の z は1.645）
  answer: 平均100・標準偏差 √90≒9.49。k 個用意して足りる確率 P(X≦k)≒Φ((k＋0.5−100)÷9.49)≧0.95 より k＋0.5≧100＋1.645×9.49≒115.6、**k＝116個**。116個なら足りる確率は約96%、115個だと約95% にわずかに届かない。
  checks:
    - 'abs(math.sqrt(90) - 9.49) < 0.005 and abs(100+1.645*math.sqrt(90) - 115.6) < 0.05 and 116+0.5 >= 100+1.645*math.sqrt(90) > 115+0.5 and abs(0.5*(1+math.erf(16.5/math.sqrt(90)/math.sqrt(2))) - 0.96) < 0.005 and 0.5*(1+math.erf(15.5/math.sqrt(90)/math.sqrt(2))) < 0.95'
  lab:
    id: LAB-clt
    mode: bin
    set: {n: 1000, p: 0.1, k: 116, kind: le}
    task: B(1000, 0.1) で116回以下になる確率を、連続修正ありの正規近似で（小数で）。
    predict: {type: number, key: approx, label: "正規近似の P(X≦116)"}
    expect: 0.959
    why: z＝16.5÷√90≒1.74 で約0.959。k を115にすると0.949で5%をわずかに超えて足りなくなる。正確な二項でも116個が境目。

- id: Q-U19-031
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 1客の購入点数は平均8点・標準偏差6点で、1〜2点の客が多く、たまに大量に買う客がいる（右に歪む）。1日144客の平均購入点数が9点以上になる確率は？（Φ(2)＝0.9772）
  answer: SE＝6÷√144＝0.5点。中心極限定理で平均は近似的に N(8, 0.5²)。z＝(9−8)÷0.5＝2、確率≒1−0.9772＝**0.0228**（約2%）。1客の分布が歪んでいても、144客の平均なら正規近似が使える。
  checks:
    - '6/math.sqrt(144) == 0.5 and (9-8)/0.5 == 2 and abs(1-0.9772 - 0.0228) < 1e-9'
  lab:
    id: LAB-cont
    mode: norm
    set: {mu: 8, sd: 0.5, a: 9, b: 10, kind: ge}
    task: 144客の平均購入点数は近似的に平均8・標準偏差（SE）0.5 の正規分布。9点以上になる確率は（小数で）？
    predict: {type: number, key: p, label: "P(x̄≧9)"}
    expect: 0.0228
    why: z＝2 で約2.3%。平均購入点数が9点を超えた日は、偶然では50日に1日ほど。続くなら売場の変化を疑う。

- id: Q-U19-032
  stage: S4
  format: written
  powers: [P1, P3]
  prompt: 新しい売場の購入率は0.1くらいと見込まれる。最初の50人で出した購入率と、800人で出した購入率は、それぞれ p からどれくらいずれうるか（標準誤差）。
  answer: 50人：√(0.09÷50)≒**0.042**（±2SE で ±8ポイント）。800人：√(0.09÷800)≒**0.011**（±2ポイント）。最初の数十人の購入率は大きくぶれるので、早い段階で売場の良し悪しを決めない。
  checks:
    - 'abs(math.sqrt(0.09/50) - 0.042) < 0.0005 and abs(math.sqrt(0.09/800) - 0.011) < 0.0005 and abs(2*math.sqrt(0.09/50) - 0.08) < 0.005 and abs(2*math.sqrt(0.09/800) - 0.02) < 0.002'
  lab:
    id: LAB-clt
    mode: lln
    set: {p: 0.1, N: 800}
    task: 確率0.1で800回。割合のずれの目安 SE は（小数で）？
    predict: {type: number, key: se, label: "SE"}
    expect: 0.0106
    why: √(0.09÷800)≒0.011。N を50にすると0.042。割合の線は、最初は大きく揺れ、回数が増えるほど p のまわりに落ち着く。

- id: Q-U19-040
  stage: S5
  format: written
  powers: [P1, P3]
  prompt: 形の分からない分布で、平均から3σ以上離れる確率の上限をチェビシェフの不等式で求めよ。正規分布の場合と比べよ。（Φ(3)＝0.99865）
  answer: 上限は 1÷3²＝**1/9≒0.111**。正規分布なら 2×(1−0.99865)＝**0.0027**。上限は形を問わない保証なので、正規の値の40倍ほど大きい。
  checks:
    - 'abs(1/9 - 0.111) < 0.0005 and abs(2*(1-0.99865) - 0.0027) < 1e-9 and abs(0.5*(1+math.erf(3/math.sqrt(2))) - 0.99865) < 0.000005 and abs((1/9)/0.0027 - 40) < 2'
  lab:
    id: LAB-clt
    mode: cheb
    set: {k: 3}
    task: 平均から 3σ 以上離れる確率の、チェビシェフの上限は（小数で）？
    predict: {type: number, key: bound, label: "上限 1÷k²"}
    expect: 0.1111
    why: 1÷9≒0.111。正規なら0.0027。チェビシェフは「最悪でもこれ以下」で、ほとんどの分布では実際はずっと小さい。
