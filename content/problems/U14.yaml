# 単元U14の問題。id は変えない（個人の解答記録がこの id を指す）。
- id: Q-U14-001
  stage: S1
  label: 例題B（穴埋め）
  format: fill
  powers: [P1, P2]
  prompt: |-
    公平なコインを3回投げて、ちょうど2回表が出る確率は？

    並び1つの確率＝0.5²×0.5＝□。表が出る2回の選び方＝₃C₂＝□通り。ちょうど2回＝□×□＝□
  answer_title: 答え（埋めてから開く）
  answer: 並び1つは **0.125**、選び方は **3** 通り。₃C₂×0.5²×0.5＝3×0.125＝**0.375**。
  checks:
    - 'comb(3,2) == 3 and Fraction(1,2)**3 == Fraction(1,8) and 3*Fraction(1,8) == Fraction(375,1000)'
  lab:
    id: LAB-binom
    mode: path
    set: {n: 3, p: 0.5, k: 2}
    task: コインを3回投げ、ちょうど2回表（🛒を表とする）。確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝2)"}
    expect: 0.375
    why: 表表裏・表裏表・裏表表の3通り、どれも 0.5³＝0.125。3×0.125＝0.375。

- id: Q-U14-002
  stage: S1
  label: 例題C（自力）
  format: written
  powers: [P1, P2]
  prompt: n＝5、p＝0.2 のとき、ちょうど2回成功する確率と、期待値・分散を求めよ。
  answer_title: 答え（解いてから開く）
  answer: ₅C₂×0.2²×0.8³＝10×0.04×0.512＝**0.2048**。期待値 5×0.2＝**1**、分散 5×0.2×0.8＝**0.8**。
  checks:
    - 'comb(5,2) == 10 and math.isclose(0.2**2, 0.04) and math.isclose(0.8**3, 0.512) and math.isclose(10*0.04*0.512, 0.2048) and math.isclose(5*0.2, 1) and math.isclose(5*0.2*0.8, 0.8)'
  lab:
    id: LAB-binom
    mode: pmf
    set: {n: 5, p: 0.2, k: 2, kind: eq}
    task: n＝5、p＝0.2。ちょうど2回成功する確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝2)"}
    expect: 0.2048
    why: 10×0.04×0.512＝0.2048。平均は1回なので、いちばん起きやすいのは1回で、2回はその次。

- id: Q-U14-003
  stage: S1
  difficulty: 1
  format: written
  powers: [P1]
  prompt: 例題（n＝4、p＝0.25）で少なくとも1人買う確率は？
  answer: 1−0.75⁴＝1−0.3164＝**0.6836**（約68%）。
  checks:
    - 'abs(0.75**4 - 0.3164) < 0.00005 and abs(1-0.75**4 - 0.6836) < 0.00005'
  lab:
    id: LAB-binom
    mode: pmf
    set: {n: 4, p: 0.25, k: 1, kind: ge}
    task: n＝4、p＝0.25。少なくとも1人（1人以上）が買う確率は（小数で）？
    predict: {type: number, key: ge, label: "P(X≧1)"}
    expect: 0.6836
    why: 1人以上は「0人ではない」。1−0.75⁴＝0.6836。1〜4人の4本を足しても同じになる。

- id: Q-U14-004
  stage: S1
  difficulty: 2
  format: written
  powers: [P1, P2]
  prompt: 例題（n＝4、p＝0.25）で、少なくとも2人が買う確率は？
  answer: P(0人)＝0.75⁴＝0.3164、P(1人)＝0.4219。1−0.3164−0.4219＝**0.2617**（約26%）。
  checks:
    - 'abs(0.75**4 - 0.3164) < 0.00005 and abs(4*0.25*0.75**3 - 0.4219) < 0.00005 and abs(1-0.75**4-4*0.25*0.75**3 - 0.2617) < 0.00005'
  lab:
    id: LAB-binom
    mode: pmf
    set: {n: 4, p: 0.25, k: 2, kind: ge}
    task: n＝4、p＝0.25。少なくとも2人（2人以上）が買う確率は（小数で）？
    predict: {type: number, key: ge, label: "P(X≧2)"}
    expect: 0.2617
    why: 2人以上＝1−(0人＋1人)＝1−0.3164−0.4219＝0.2617。0人を引き忘れると0.5781になる。

- id: Q-U14-005
  stage: S1
  difficulty: 3
  format: written
  powers: [P1, P3]
  prompt: 不良率5%の製品から20個を抜き取り、不良が2個以下なら合格とする。合格する確率は？（各製品の不良は独立とする）
  answer: P(0)＝0.95²⁰≒0.3585、P(1)＝20×0.05×0.95¹⁹≒0.3774、P(2)＝190×0.05²×0.95¹⁸≒0.1887。合計≒**0.9245**（約92%）。平均は1個なので、2個以下はかなり起きやすい。
  checks:
    - 'abs(0.95**20 - 0.3585) < 0.00005 and abs(20*0.05*0.95**19 - 0.3774) < 0.00005 and comb(20,2) == 190 and abs(190*0.05**2*0.95**18 - 0.1887) < 0.00005 and abs(sum(comb(20,k)*0.05**k*0.95**(20-k) for k in range(3)) - 0.9245) < 0.00005 and math.isclose(20*0.05, 1) and abs(sum(comb(20,k)*0.1**k*0.9**(20-k) for k in range(3)) - 0.68) < 0.005'
  lab:
    id: LAB-binom
    mode: pmf
    set: {n: 20, p: 0.05, k: 2, kind: le}
    task: 不良率5%、20個抜き取り。不良が2個以下になる確率は（小数で）？
    predict: {type: number, key: le, label: "P(X≦2)"}
    expect: 0.9245
    why: 0個・1個・2個の3本を足して約0.92。p を0.1にすると合格の確率は約0.68に下がる。

