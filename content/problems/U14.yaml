  checks:
    - 'comb(6,2) == 15 and math.isclose(0.3**2, 0.09) and abs(0.7**4 - 0.2401) < 1e-12 and abs(15*0.09*0.2401 - 0.324) < 0.0005'
  lab:
    id: LAB-binom
    mode: pmf
    set: {n: 6, p: 0.3, k: 2, kind: eq}
    task: n＝6、p＝0.3。ちょうど2人が提示する確率は（小数で）？
    predict: {type: number, key: pk, label: "P(X＝2)"}
