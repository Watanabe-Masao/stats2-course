# 概念と概念の関係。id は変えない（ネットワークでは stats2:REL-…）。
# from・to は用語（概念）の id。別の教材の概念は「教材名:id」で書く（例 math:CON-…）。
# type：8種類。定義・矢印の読み方・該当例・該当しない例は docs/knowledge-net/schema/relation-types.yaml（どの教材も共通）。
#   前提には premise（learning：理解に必要な知識／mathematical：数学的な成立条件・定義に使う）を必ず書く。
#   変換には mode（exact：厳密／approximation：近似／limit：極限）と成立条件を必ず書く。「近い」と「等しい」を混ぜない。
#   導出には成立条件を必ず書く。前提が2つ以上なら関係ではなく導出（derivations.yaml）の点にする。
#   一般化と特殊化は同じ組を両方向に書かない（原則は一般化で書く）。
#   「前提をさかのぼる」でたどるのは前提・導出・一般化・特殊化・統合だけ。変換・対比・応用はたどらない。学ぶ順に要るもの（例：ポアソン分布を二項分布の極限として学ぶ）は、変換とは別に「前提」（premise: learning）で書く。
# basis：根拠（その関係を扱う単元 units、導出 derivation）。
relations:
  - id: REL-rv-expect
    from: TERM-rv
    to: TERM-expect
    version: 1
    type: 前提
    premise: mathematical
    description: 期待値は、確率変数のとる値とその確率から作る。
    basis: {units: [U13]}
  - id: REL-expect-var
    from: TERM-expect
    to: TERM-var
    version: 1
    type: 前提
    premise: mathematical
    description: 分散は「期待値からのずれ」の2乗の期待値。期待値がなければ測る基準がない。
    basis: {units: [U13]}
  - id: REL-fact-comb
    from: TERM-fact
    to: TERM-comb
    version: 1
    type: 前提
    premise: mathematical
    description: 組合せの数は、全部の並べ方 n! を、選んだ中と残した中の並べ方 k!・(n−k)! で割って求める。
    basis: {units: [U09]}
  - id: REL-comb-binom
    from: TERM-comb
    to: TERM-binom
    version: 1
    type: 前提
    premise: mathematical
    description: n 回のうちどの k 回が成功かの選び方 ₙCₖ 通りは、どれも同じ確率なので、その数だけ足し合わせる（掛ける）。
    basis: {units: [U14]}
  - id: REL-indep-binom
    from: TERM-indep
    to: TERM-binom
    version: 1
    type: 前提
    premise: mathematical
    description: 各回が独立なので、1通りの確率が掛け算 pᵏ(1−p)ⁿ⁻ᵏ で求まる。
    basis: {units: [U14]}
  - id: REL-binom-poisson
    from: TERM-binom
    to: TERM-poisson
    version: 1
    labs:
      - {id: LAB-pois, preset: rel-approx-tour, purpose: 平均3を保って n を 10→1000 にし、二項分布がポアソン分布に重なるまでを段ごとに見る}
      - {id: LAB-pois, preset: rel-approx, purpose: np を保って n を大きくすると、二項分布がポアソン分布に重なる}
    figures: [FIG-LAB-pois-rel-approx-tour-1, FIG-LAB-pois-rel-approx-tour-2, FIG-LAB-pois-rel-approx-tour-3]
    type: 変換
    mode: limit
    description: 二項分布で n を大きく、p を小さくして np＝λ を保つと、ポアソン分布に近づく。
    gist: めったに起きない事をたくさんの機会で数えると、回数の上限が効かなくなる。平均 λ だけで確率が出せる。   # つまり（#95）
    conditions: [n が大きい, p が小さい, np＝λ を一定に保つ]
    basis: {units: [U15]}
  - id: REL-binom-normal
    from: TERM-binom
    to: TERM-normal
    version: 1
    labs:
      - {id: LAB-binom, preset: rel-norm-tour, purpose: n を 10→100 にして棒が曲線に重なり、p が小さいとずれるのを段ごとに見る}
      - {id: LAB-binom, preset: s5-norm, purpose: n を大きくすると、棒が正規分布の曲線に重なる（p が小さいと崩れる）}
    figures: [FIG-LAB-binom-rel-norm-tour-1, FIG-LAB-binom-rel-norm-tour-2, FIG-LAB-binom-rel-norm-tour-3]
    type: 変換
    mode: approximation
    description: n が大きいと、二項分布は平均 np・分散 np(1−p) の正規分布で近似できる（正規近似）。
    gist: 回数が多いと、成功の数はなめらかな山の形になる。平均と標準偏差だけで、範囲の確率が出せる。   # つまり（#95）
    conditions: [np と n(1−p) がどちらも十分大きい（目安は5以上）, 整数の棒を曲線で近似するので、境目を0.5ずらす（連続修正）]
    basis: {units: [U14, U16]}
  - id: REL-binom-poisson-contrast
    from: TERM-binom
    to: TERM-poisson
    version: 1
    type: 対比
    description: 二項分布は回数に上限 n があり、分散 np(1−p) は平均 np より小さい。ポアソン分布は上限がなく、分散と平均が同じ λ。
    gist: 回数に上限がある数え方（二項）は、上限のない数え方（ポアソン）より散らばりが小さい。平均が同じでも外れ方が違う。   # つまり（#95）
    labs:
      - {id: LAB-pois, preset: rel-contrast-tour, purpose: 平均は同じ3のまま、回数の上限と分散の違いを段ごとに見る}
      - {id: LAB-pois, preset: rel-contrast, purpose: n・p を自分で動かし、二項とポアソンの棒の切れ方と広がりを比べる}
    figures: [FIG-LAB-pois-rel-contrast-tour-1, FIG-LAB-pois-rel-contrast-tour-2]
    basis: {units: [U15]}
  - id: REL-var-std
    from: TERM-var
    to: TERM-std
    version: 1
    type: 前提
    premise: mathematical
    description: 標準化では、分散の平方根（標準偏差）で割る。
    basis: {units: [U16]}
  - id: REL-expect-std
    from: TERM-expect
    to: TERM-std
    version: 1
    type: 前提
    premise: mathematical
    description: 標準化では、まず期待値（平均）を引く。
    basis: {units: [U16]}
  - id: REL-std-normal
    from: TERM-std
    to: TERM-normal
    version: 1
    labs:
      - {id: LAB-z, preset: s4-normal, purpose: 標準化すると、どの正規分布も同じ表で読める}
    type: 応用
    description: 正規分布に従う値を標準化すると標準正規分布 N(0, 1) になり、1つの表で確率が読める。
    conditions: [X が正規分布に従う]
    basis: {units: [U16]}
  - id: REL-clt-normal
    from: TERM-clt
    to: TERM-normal
    version: 1
    type: 応用
    description: 独立な要因の和や平均は、元の分布によらず正規分布に近づく。正規分布がよく使われる理由。
    conditions: [足し合わせる量が独立, 分散が有限, 個数が十分多い]
    basis: {units: [U19]}
  - id: REL-rv-dist
    from: TERM-rv
    to: TERM-dist
    version: 1
    type: 前提
    premise: mathematical
    description: 確率分布は、確率変数がとる値とその確率の対応。確率変数がなければ分布は作れない。
    basis: {units: [U13]}
  - id: REL-dist-expect
    from: TERM-dist
    to: TERM-expect
    version: 1
    type: 前提
    premise: mathematical
    description: 期待値は、確率分布の「値×確率」を全部足して作る。分布を1つの数に要約したもの。
    basis: {units: [U13]}
  - id: REL-var-sd
    from: TERM-var
    to: TERM-sd
    version: 1
    type: 前提
    premise: mathematical
    description: 標準偏差は分散の正の平方根。2乗した単位を元の単位に戻す。
    basis: {units: [U13]}
  - id: REL-var-cov
    from: TERM-var
    to: TERM-cov
    version: 1
    type: 一般化
    description: 分散は1つの変数のずれの2乗の期待値。2つの変数のずれの積に広げると共分散になる（Cov(X, X)＝V(X)）。
    gist: 分散は「1つの量が平均からどれだけずれるか」。共分散は「2つの量が一緒にずれるか」。同じものどうしの共分散が分散。   # つまり（#95）
    labs:
      - {id: LAB-expect, preset: rel-varcov-tour, purpose: Y を X と同じにすると、共分散が分散になるのを見る}
      - {id: LAB-expect, preset: s5-free, purpose: 同時確率を自分で動かし、共分散の符号と大きさを見る}
    figures: [FIG-LAB-expect-rel-varcov-tour-1, FIG-LAB-expect-rel-varcov-tour-2]
    basis: {units: [U13]}
  - id: REL-indep-cov
    from: TERM-indep
    to: TERM-cov
    version: 1
    labs:
      - {id: LAB-expect, preset: rel-indep-tour, purpose: X と Y の割合は同じまま、両方の確率だけを変えて共分散の符号を見る}
      - {id: LAB-expect, preset: s5-free, purpose: 独立なら共分散が0。0でも独立とは限らないことも確かめる}
    type: 導出
    description: 独立なら E(XY)＝E(X)E(Y) なので、共分散は0になる。逆（共分散0なら独立）は成り立たない。
    gist: お互いに影響しない2つの量は、一緒にずれる傾向がないので共分散は0。ただし共分散が0でも、影響し合っていることはある。   # つまり（#95）
    conditions: [X と Y が独立, 期待値が有限]
    figures: [FIG-LAB-expect-rel-indep-tour-1, FIG-LAB-expect-rel-indep-tour-2, FIG-LAB-expect-rel-indep-tour-3]
    basis: {units: [U13]}
  - id: REL-indep-geom
    from: TERM-indep
    to: TERM-geom
    version: 1
    type: 前提
    premise: mathematical
    description: 各回が独立なので、失敗が続いてから成功する確率が掛け算 (1−p)^(k−1)p で求まる。
    basis: {units: [U15]}
  - id: REL-binom-geom-contrast
    from: TERM-binom
    to: TERM-geom
    version: 1
    type: 対比
    description: 二項分布は回数 n を決めて成功の数を数える。幾何分布は成功を1回と決めて、そこまでの回数を数える。何を固定し、何を数えるかが逆。
    gist: 二項は「回数を決めて、当たりの数を数える」。幾何は「当たり1回を決めて、そこまでの回数を数える」。決める物と数える物が逆。   # つまり（#95）
    labs:
      - {id: LAB-pois, preset: rel-geom-contrast-tour, purpose: 二項（回数を決めて当たりを数える）と幾何（当たりを決めて回数を数える）を段ごとに並べる}
      - {id: LAB-pois, preset: rel-geom, purpose: タブで二項と幾何を切り替え、横軸が何を数えているかを比べる}
    figures: [FIG-LAB-pois-rel-geom-contrast-tour-1, FIG-LAB-pois-rel-geom-contrast-tour-2]
    basis: {units: [U15]}
  - id: REL-hyper-binom
    from: TERM-hyper
    to: TERM-binom
    version: 1
    labs:
      - {id: LAB-pois, preset: rel-hyper-tour, purpose: 割合0.3を保って箱を大きくし、補正 (N−n)/(N−1) が1に近づくのを段ごとに見る}
      - {id: LAB-pois, preset: rel-hyper, purpose: 集団を大きくすると、戻さない確率が戻す確率に近づく}
    type: 変換
    mode: limit
    description: 集団 N を大きくして当たりの割合 M/N を保つと、超幾何分布は二項分布 B(n, M/N) に近づく（戻すか戻さないかの違いが消える）。
    gist: 箱がとても大きければ、取り出して戻さなくても中身の割合はほとんど変わらない。戻しても戻さなくても同じとみなせる。   # つまり（#95）
    conditions: [N が取り出す数 n に比べて十分大きい, 当たりの割合 M/N を一定に保つ]
    figures: [FIG-LAB-pois-rel-hyper-tour-1, FIG-LAB-pois-rel-hyper-tour-2]
    basis: {units: [U15]}
  - id: REL-binom-hyper-contrast
    from: TERM-binom
    to: TERM-hyper
    version: 1
    type: 対比
    description: 二項分布は戻して取り出す（各回が独立で確率が一定）。超幾何分布は戻さずに取り出す（取るたびに確率が変わる）。分散は超幾何の方が二項分布の (N−n)/(N−1) 倍になる（小さくなる）。
    gist: 戻さずに取り出すと、取るたびに残りの割合が変わり、結果のぶれが小さくなる。小さな箱から多く取るほど差が大きい。   # つまり（#95）
    labs:
      - {id: LAB-pois, preset: rel-hyper-contrast-tour, purpose: 平均は同じまま、取る数を増やすと戻さない方の散らばりが小さくなるのを段ごとに見る}
      - {id: LAB-pois, preset: rel-hyper, purpose: 集団を大きくすると、戻さない確率が戻す確率に近づく}
    figures: [FIG-LAB-pois-rel-hyper-contrast-tour-1, FIG-LAB-pois-rel-hyper-contrast-tour-2, FIG-LAB-pois-rel-hyper-contrast-tour-3]
    basis: {units: [U15]}
  - id: REL-poisson-expo
    from: TERM-poisson
    to: TERM-expo
    version: 1
    labs:
      - {id: LAB-pois, preset: rel-expo-tour, purpose: t 時間に0件の確率が、次の1件まで t より長く待つ確率になることを段ごとに見る}
      - {id: LAB-pois, preset: s5-free, purpose: 0件の確率を時間を延ばして見ると、待ち時間の確率になる}
    type: 導出
    description: 一定の割合 λ で独立に起きる出来事では、一定時間の件数がポアソン分布、次に起きるまでの待ち時間が指数分布になる。
    gist: 同じ出来事を「一定時間に何件来るか」で見るとポアソン、「次の1件まで何分待つか」で見ると指数分布。見方が違うだけ。   # つまり（#95）
    conditions: [出来事が一定の割合 λ で起きる, 重ならない時間の件数が互いに独立]
    figures: [FIG-LAB-pois-rel-expo-tour-1, FIG-LAB-pois-rel-expo-tour-2]
    basis: {units: [U15, U16]}
  - id: REL-dist-pdf
    from: TERM-dist
    to: TERM-pdf
    version: 1
    type: 前提
    premise: mathematical
    description: 連続な確率変数の分布は、値ごとの確率では書けない（1点の確率が0）ので、確率密度関数の面積で表す。
    basis: {units: [U16]}
  - id: REL-pdf-normal
    from: TERM-pdf
    to: TERM-normal
    version: 1
    type: 前提
    premise: mathematical
    description: 正規分布は確率密度関数 f(x) で定義され、確率は曲線の下の面積で読む。
    basis: {units: [U16]}
  - id: REL-pdf-uniform
    from: TERM-pdf
    to: TERM-uniform
    version: 1
    type: 前提
    premise: mathematical
    description: 一様分布は、密度が一定の確率密度関数 1/(b−a) で定義される。
    basis: {units: [U16]}
  - id: REL-pdf-expo
    from: TERM-pdf
    to: TERM-expo
    version: 1
    type: 前提
    premise: mathematical
    description: 指数分布は、確率密度関数 λe^(−λx) で定義される。
    basis: {units: [U16]}
  - id: REL-sd-std
    from: TERM-sd
    to: TERM-std
    version: 1
    type: 前提
    premise: mathematical
    description: 標準化では、平均を引いたあと標準偏差で割り、単位のない「標準偏差いくつ分」にする。
    basis: {units: [U16]}
  - id: REL-geom-negbinom
    from: TERM-geom
    to: TERM-negbinom
    version: 1
    type: 一般化
    description: 幾何分布は「1回目の成功」まで待つ。待つ成功を r 回に広げると負の二項分布（r＝1 が幾何分布）。
    gist: 幾何は「最初の当たりまで」待つ。負の二項は「r 回目の当たりまで」待つ。r＝1 にすると幾何に戻る。   # つまり（#95）
    labs:
      - {id: LAB-pois, preset: rel-negbinom-tour, purpose: 待つ当たりを1回→3回に広げ、平均が r/p になるのを段ごとに見る}
      - {id: LAB-pois, preset: s5-free, purpose: p・r・k を自分で動かし、幾何（r＝1）と負の二項を比べる}
    figures: [FIG-LAB-pois-rel-negbinom-tour-1, FIG-LAB-pois-rel-negbinom-tour-2]
    basis: {units: [U15]}
  # ---- P1 骨格：W1（U09〜U12 数え上げ・確率）。#105
  - id: REL-fact-perm
    from: TERM-fact
    to: TERM-perm
    version: 1
    type: 前提
    premise: mathematical
    description: n 個から k 個を並べる順列の数は、階乗で n!÷(n−k)! と書ける。
    basis: {units: [U09]}
  - id: REL-perm-comb-contrast
    from: TERM-perm
    to: TERM-comb
    version: 1
    type: 対比
    description: どちらも n 個から k 個を取り出す数。順列は並べる順番を区別し、組合せは区別しない。組合せの数は、順列の数を k 個の並べ替え k! で割ったもの。
    gist: 順番が意味を持つ（1位・2位）なら順列、持たない（選ぶだけ）なら組合せ。同じ k 個の選び方が、順列では k! 通りに数えられる。
    basis: {units: [U09]}
  - id: REL-ss-event
    from: TERM-sample-space
    to: TERM-event
    version: 1
    type: 前提
    premise: mathematical
    description: 事象は標本空間の部分集合として決める。まず起こりうる結果の全体を決める。
    basis: {units: [U10]}
  - id: REL-event-complement
    from: TERM-event
    to: TERM-complement
    version: 1
    type: 前提
    premise: mathematical
    description: 余事象は、事象を標本空間の中で裏返したもの。
    basis: {units: [U10]}
  - id: REL-event-exclusive
    from: TERM-event
    to: TERM-exclusive
    version: 1
    type: 前提
    premise: mathematical
    description: 排反は2つの事象の関係（共通部分がない）として決める。
    basis: {units: [U10, U11]}
  - id: REL-event-prob
    from: TERM-event
    to: TERM-prob
    version: 1
    type: 前提
    premise: mathematical
    description: 確率は事象ごとに決める数。何についての確率か（事象）がないと決められない。
    basis: {units: [U10]}
  - id: REL-prob-addition
    from: TERM-prob
    to: TERM-addition
    version: 1
    type: 導出
    description: 確率の公理（排反なら足せる）から、重なりのある2つの事象でも、重なりを1回引けば和の確率が出る。
    gist: 2つの円が重なっているとき、面積を足すと重なりを2回数えてしまう。だから重なりを1回引く。
    conditions: [確率の公理（全体は1・排反な事象の確率は足せる）]
    basis: {units: [U10]}
  - id: REL-exclusive-addition
    from: TERM-exclusive
    to: TERM-addition
    version: 1
    type: 前提
    premise: learning
    description: 排反なら重なりが0なので、加法定理は単に足すだけになる。まず排反の場合で足し算を理解する。
    basis: {units: [U10]}
  - id: REL-prob-cond
    from: TERM-prob
    to: TERM-cond
    version: 1
    type: 前提
    premise: mathematical
    description: 条件付き確率は、両方が起こる確率を、条件の事象の確率で割って決める。
    basis: {units: [U11]}
  - id: REL-cond-multiplication
    from: TERM-cond
    to: TERM-multiplication
    version: 1
    type: 導出
    description: 条件付き確率の定義 P(B|A)＝P(A∩B)÷P(A) の両辺に P(A) を掛けると、P(A∩B)＝P(A)×P(B|A) になる。
    gist: 両方起こる確率は「まず A が起こり、そのうえで B も起こる」と2段に分けて掛ければよい。
    conditions: [P(A)＞0]
    basis: {units: [U11]}
  - id: REL-cond-indep
    from: TERM-cond
    to: TERM-indep
    version: 1
    type: 前提
    premise: learning
    description: 独立は「A が起きたと知っても B の確率が変わらない」こと。条件付き確率で読むと意味が分かる。
    basis: {units: [U11]}
  - id: REL-exclusive-indep-contrast
    from: TERM-exclusive
    to: TERM-indep
    version: 1
    type: 対比
    description: 排反は同時に起こらないこと、独立は互いの確率に影響しないこと。確率が0でない2つの事象が排反なら、一方が起きると他方は起こらないので、独立ではない。
    gist: 「同時に起きない」と「影響しない」は別のこと。むしろ排反なら、一方が起きたと分かれば他方は起きないと分かるので、強く影響し合っている。
    basis: {units: [U10, U11]}
  - id: REL-multiplication-total
    from: TERM-multiplication
    to: TERM-total-prob
    version: 1
    type: 前提
    premise: mathematical
    description: 全確率の公式の各項は、乗法定理で「場合の確率×その場合の条件付き確率」と書いたもの。
    basis: {units: [U12]}
  - id: REL-exclusive-total
    from: TERM-exclusive
    to: TERM-total-prob
    version: 1
    type: 前提
    premise: mathematical
    description: 起こり方を、重なりのない（排反な）場合に分けるから、各場合の確率を足して全体が出る。
    basis: {units: [U12]}
  - id: REL-total-bayes
    from: TERM-total-prob
    to: TERM-bayes
    version: 1
    type: 前提
    premise: mathematical
    description: ベイズの定理の分母（結果が起こる全体の確率）は、全確率の公式で求める。
    basis: {units: [U12]}
  - id: REL-cond-bayes
    from: TERM-cond
    to: TERM-bayes
    version: 1
    type: 前提
    premise: mathematical
    description: ベイズの定理は、条件付き確率 P(結果|原因) から P(原因|結果) を求める式。
    basis: {units: [U12]}
  - id: REL-cond-likelihood
    from: TERM-cond
    to: TERM-likelihood
    version: 1
    type: 前提
    premise: learning
    description: 尤度は「その原因のもとで、この結果が起こる条件付き確率」として読む。
    basis: {units: [U12]}
  - id: REL-prior-bayes
    from: TERM-prior
    to: TERM-bayes
    version: 1
    type: 前提
    premise: mathematical
    description: ベイズの定理は、事前確率に尤度を掛けて更新する。事前確率がないと始められない。
    basis: {units: [U12]}
  - id: REL-likelihood-bayes
    from: TERM-likelihood
    to: TERM-bayes
    version: 1
    type: 前提
    premise: mathematical
    description: 尤度は、データが原因の確率をどれだけ動かすかを決める。
    basis: {units: [U12]}
  - id: REL-bayes-posterior
    from: TERM-bayes
    to: TERM-posterior
    version: 1
    type: 前提
    premise: mathematical
    description: 事後確率はベイズの定理で求める確率。
    basis: {units: [U12]}
  - id: REL-prior-posterior
    from: TERM-prior
    to: TERM-posterior
    version: 1
    type: 変換
    mode: exact
    description: 事前確率に尤度を掛け、結果が起こる全体の確率（全確率）で割ると、事後確率になる。
    gist: データを見る前の見込みを、データの起こりやすさで重み付けし直したのが、データを見たあとの見込み。
    conditions: [尤度（各原因のもとで結果が起こる確率）が分かっている, 結果が起こる確率が0でない]
    basis: {units: [U12]}
  # ---- P1 骨格：W3（U17〜U23 標本分布・推定）。#105
  - id: REL-population-sample
    from: TERM-population
    to: TERM-sample
