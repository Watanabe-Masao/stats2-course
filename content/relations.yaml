    from: TERM-estimator
    to: TERM-bias
    version: 1
    type: 定める
    description: 偏りは、推定量の期待値と母数の差 E(θ̂)−θ。推定量が定義に直接出る。
    basis:
      units: [U17, U21]

  - id: REL-expect-bias
    from: TERM-expect
    to: TERM-bias
    version: 1
    type: 定める
    from_form: operation
    description: 偏りは、推定量の期待値と母数の差 E(θ̂)−θ。期待値が定義に直接出る。
    basis:
      units: [U17, U21]

  - id: REL-estimator-samplingerror
    from: TERM-estimator
    to: TERM-sampling-error
    version: 1
    type: 定める
    description: 標本誤差は、誤りなく測ったときの推定量と母数の差 θ̂−θ。推定量が定義に直接出る。
    basis:
      units: [U31]

  - id: REL-estimator-nonsampling
    from: TERM-estimator
    to: TERM-nonsampling-error
    version: 1
    type: 定める
    description: 非標本誤差は、実際に得た推定量の値と、同じ標本を誤りなく測ったときの推定量の値の差。推定量が定義に直接出る。
    basis:
      units: [U31]

  - id: REL-prob-random
    from: TERM-prob
    to: TERM-random-sampling
    version: 1
    type: 定める
    from_form: function
    description: 無作為抽出は、前もって決めた確率に従うくじで選ぶ手続き。確率が定義に直接出る。
    basis:
      units: [U17]

  - id: REL-prob-randomize
    from: TERM-prob
    to: TERM-randomize
    version: 1
    type: 定める
    from_form: function
    description: 無作為化は、前もって決めた確率に従うくじで群を割り当てる手続き。確率が定義に直接出る。
    basis:
      units: [U32]

  - id: REL-indep-confound
    from: TERM-indep
    to: TERM-confound
    version: 1
    type: 定める
    description: 交絡は、処理と別の要因が独立でない（群によって別の要因の分布が違う）ために、差が分けられないこと。独立が定義に直接出る（影響の部分は統計の外の判断）。
    basis:
      units: [U32]
  - id: REL-frame-samplingerror
    from: TERM-frame
    to: TERM-sampling-error
    version: 1
    type: 定める
    description: 標本誤差は、誤りなく測った推定量の値と、抽出枠の上の母数 θ_F の差。抽出枠が定義に直接出る。
    basis:
      units:
      - U31

  - id: REL-statistic-rv
    from: TERM-statistic
    to: TERM-rv
    version: 1
    type: 一種
    description: 統計量は、標本の関数として作る確率変数の1つ（分からない母数を含まないもの）。
    basis:
      units: [U03, U18]

  - id: REL-hist-pdf
    from: TERM-hist
    to: TERM-pdf
    version: 1
    type: 推定する
    properties: [CLM-30]
    description: ヒストグラム（相対度数÷階級の幅）で、母集団の分布の確率密度関数を推し量る。言えるのは f そのものではなく、決めた階級ごとの f の平均について：柱の高さはその不偏推定量で、相対度数は n を大きくすると各階級の確率に近づく（④-30）。
    basis:
      units: [U05, U13]

  - id: REL-datavar-acf
    from: TERM-data-var
    to: TERM-acf
    version: 1
    type: 定める
    description: 自己相関は、ラグ k の自己共分散を、系列のデータの分散で割った値。データの分散が定義に直接出る。
    basis:
      units: [U05T]
