    to: TERM-adjr2
    version: 1
    type: 比べる
    axis: 説明変数を足したときに下がりうるか（説明変数の数で補正するか）
    same: どちらも、回帰式が目的変数のばらつきをどれだけ説明するかを1つの数で表す
    differ: 決定係数は、同じデータで説明変数を足して最小二乗で当てはめ直すと下がらない（切片を含むとき 0〜1）。自由度調整済み決定係数は、説明変数の数 k の分を自由度で補正するので、足した変数の t 値の絶対値が1より小さいときは下がり、負にもなる
    description: 決定係数は説明変数を足すと下がらない。自由度調整済み決定係数は、変数の数で補正するので下がりうる。説明変数の数が違う式どうしを比べるときは、自由度調整済みを使う。
    gist: 決定係数は、説明変数を足すだけで上がる（下がらない）。自由度調整済みは変数の数の分を差し引くので、役に立たない変数を足すと下がる。
    basis:
      units: [U30]
