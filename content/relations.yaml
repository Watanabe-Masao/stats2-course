  - id: REL-dev-resid-contrast
    from: TERM-dev
    to: TERM-resid
    type: 比べる
    differ: 偏差は目的変数の平均 ȳ を引き、説明変数を使わない。残差は回帰式の予測値 ŷᵢ を引き、説明変数の値ごとに基準が変わる。切片を含む回帰式を最小二乗で当てはめると、残差の2乗和は偏差の2乗和以下で、減った割合が決定係数。1つ1つの残差が偏差より小さいとは限らない
    same: どちらも1つの観測値から基準の値を引いたずれで、データ全体で足すと0になる（残差は、切片を含む回帰式を最小二乗で当てはめたとき）
    axis: 観測値から何を引いたずれか（全体の平均か、説明変数の値ごとの回帰式の予測値か）
    description: どちらも観測値から基準の値を引いたずれ。偏差は平均を、残差は回帰式の予測値を引く。切片を含む回帰式を最小二乗で当てはめると、残差の2乗和は偏差の2乗和以下になる（その減った割合が決定係数）。
    gist: 偏差は「みんなの平均」からのずれ、残差は「その人の条件から見込んだ値」からのずれ。見込みが当たるほど残差は小さい。
    basis:
      units:
      - U07
      - U29
    version: 2
  - id: REL-resid-r2
    from: TERM-resid
    to: TERM-r2
    type: 定める
    description: 決定係数は、1から（残差の2乗和÷偏差の2乗和）を引いたもの。
    basis:
      units:
      - U29
    version: 2
  - id: REL-slr-extrap
    from: TERM-slr
    to: TERM-extrap
    type: 前提
    premise: learning
    description: 外挿は、回帰式をデータの範囲の外に使うこと。回帰式を知ってから、その使ってよい範囲を学ぶ。
