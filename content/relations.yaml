  - id: REL-var-mse
    from: TERM-var
    to: TERM-mse
    type: 前提
    premise: mathematical
    description: 平均二乗誤差は、推定量の分散と偏りの2乗の和。
    basis:
      units:
      - U21
    version: 1
  - id: REL-point-interval-contrast
    from: TERM-point-est
    to: TERM-interval-est
    type: 対比
    description: 点推定は1つの値で、区間推定は幅をもった区間で母数を推定する。区間推定は、推定がどれだけぶれるか（標準誤差）を幅で示す。
    gist: 「たぶん50」と1つの値で言うのが点推定、「45〜55のどこか」と幅で言うのが区間推定。幅があると、推定の確かさまで伝わる。
