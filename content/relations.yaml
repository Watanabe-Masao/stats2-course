    to: TERM-ci
    type: 前提
    premise: mathematical
    description: 母分散が分からないときの平均の信頼区間は、t 分布の値で作る。
    basis:
      units:
      - U22
    version: 1
  - id: REL-ratio-sampleprop
    from: TERM-ratio
    to: TERM-sample-prop
    type: 前提
    premise: mathematical
