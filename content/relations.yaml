      - U26
    version: 1
  - id: REL-teststat-reject
    from: TERM-test-stat
    to: TERM-reject
    type: 前提
    premise: mathematical
    description: 棄却域は、検定統計量のとる値の範囲として決める。
    basis:
      units:
      - U24
      - U25
    version: 1
  - id: REL-alpha-reject
    from: TERM-alpha
    to: TERM-reject
    type: 前提
    premise: mathematical
    description: 棄却域は、帰無仮説のもとで入る確率が有意水準になるように決める。
    basis:
      units:
      - U24
      - U25
    version: 1
  - id: REL-pvalue-alpha-contrast
    from: TERM-pvalue
    to: TERM-alpha
    type: 対比
    description: どちらも確率で、比べて帰無仮説を退けるか決める。有意水準はデータを見る前に決める基準、p値はデータから計算する値。p値が有意水準以下なら退ける。
    gist: 有意水準は前もって引いておく線、p値はデータが出した数。線より小さければ「偶然とは考えにくい」と判断する。
    basis:
      units:
      - U24
    version: 1
  - id: REL-h1-sides
    from: TERM-h1
    to: TERM-sides
    type: 前提
    premise: mathematical
    description: 片側か両側かは、対立仮説が差の向きを決めているかどうかで決まる。
    basis:
      units:
      - U24
    version: 1
  - id: REL-reject-sides
