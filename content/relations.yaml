      - U30
      - U32
    version: 2
  - id: REL-ms-anova
    from: TERM-ms
    to: TERM-anova
    type: 定める
    description: 分散分析の F 値は、群間の平均平方を群内の平均平方で割ったもの。
    basis:
      units:
      - U32
    version: 2
  - id: REL-test-anova
    from: TERM-anova
    to: TERM-test
    type: 一種
    description: 分散分析は、仮説検定の手順を3つ以上の群の平均に当てはめたもの。
    basis:
      units:
      - U32
    version: 2
  - id: REL-anova-multcomp
    from: TERM-anova
    to: TERM-multcomp
    type: 前提
    premise: learning
    description: 分散分析で「どこかに差がある」と分かったあと、どの群の間かを調べるのが多重比較。
    basis:
