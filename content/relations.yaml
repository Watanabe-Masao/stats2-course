    description: 不偏性は推定量の性質。
    basis:
      units:
      - U21
    version: 2
  - id: REL-estimator-consistency
    from: TERM-estimator
    to: TERM-consistency
    type: 定める
    description: 一致性は推定量の性質。
    basis:
      units:
      - U21
    version: 2
  - id: REL-unbiased-efficiency
    from: TERM-unbiased
    to: TERM-efficiency
    type: 定める
