    from: TERM-lln
    to: TERM-consistency
    type: 前提
    premise: learning
    description: 標本平均の一致性は大数の法則そのもの。一致性は、大数の法則を推定量一般に広げた考え。
    basis:
      units:
      - U19
      - U21
    version: 1
  - id: REL-point-interval-contrast
    from: TERM-point-est
    to: TERM-interval-est
    type: 比べる
    differ: 点推定は推定量の値1つで θ を示し、その値がどれだけ確かかは示さない。区間推定は信頼区間 [L, U] で θ を示し、区間が θ を含む確率の下限（信頼係数）で推定の確かさを言う。同じ作り方では、信頼係数を上げると区間は広くなる
    same: どちらも、標本から作るもので、分からない母数 θ の値を推定する手続き
    axis: 母数の値を、標本から何の形で示すか（1つの値か、区間か）
    description: 点推定は1つの値で、区間推定は幅をもった区間で母数を推定する。区間推定は、推定がどれだけばらつくか（標準誤差）を幅で示す。
    gist: 「たぶん50」と1つの値で言うのが点推定、「この作り方なら95%の確率で母数を含む区間として45〜55」と幅で言うのが区間推定。幅があると、推定の確かさまで伝わる。
