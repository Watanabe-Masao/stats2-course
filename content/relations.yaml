    description: 推定量は、母数を推定する目的で使う統計量。統計量は推定量を含む、より広いもの（検定統計量なども統計量）。
    gist: 標本から計算する値はみな統計量。そのうち「母数を当てる」ために使うと決めたものが推定量。
    basis:
      units:
      - U18
      - U21
    version: 1
  - id: REL-estimator-pointest
    from: TERM-estimator
    to: TERM-point-est
