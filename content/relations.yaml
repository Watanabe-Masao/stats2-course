    premise: learning
    description: 不偏分散で n−1 で割るのは、平均を使った分だけ自由に動ける値が1つ減るから。自由度の考えの入口。
    basis:
      units:
      - U18
      - U20
    version: 1
  - id: REL-normal-chi2
    from: TERM-normal
    to: TERM-chi2
