      - U20
    version: 1
  - id: REL-chi2-t
    from: TERM-chi2
    to: TERM-t
    type: 前提
    premise: mathematical
    description: t 分布は、標準正規分布の確率変数を、カイ二乗分布の確率変数を自由度で割った値の平方根で割った分布。
    basis:
      units:
      - U20
    version: 1
  - id: REL-chi2-f
    from: TERM-chi2
    to: TERM-f
    type: 前提
    premise: mathematical
    description: F 分布は、2つのカイ二乗分布の確率変数をそれぞれ自由度で割った比の分布。
    basis:
      units:
      - U20
    version: 1
  - id: REL-df-t
    from: TERM-df
    to: TERM-t
    type: 前提
    premise: mathematical
    description: t 分布の形は自由度で決まる。
    basis:
      units:
      - U20
    version: 1
  - id: REL-df-f
    from: TERM-df
    to: TERM-f
    type: 前提
    premise: mathematical
    description: F 分布の形は2つの自由度で決まる。
    basis:
      units:
      - U20
    version: 1
  - id: REL-t-normal
    from: TERM-t
    to: TERM-normal
    type: 変換
    mode: limit
    description: 自由度を大きくすると、t 分布は標準正規分布に近づく。
    gist: データが多いと、不偏分散で σ を置き換えたぶれがほとんど消える。だから t 分布の裾は細くなり、正規分布と見分けがつかなくなる。
    conditions:
    - 自由度を大きくする
    basis:
      units:
      - U20
      - U22
    version: 1
