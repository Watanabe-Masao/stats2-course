# 概念と概念の関係。id は変えない（ネットワークでは stats2:REL-…）。
# from・to は用語（概念）の id。別の教材の概念は「教材名:id」で書く（例 math:CON-…）。
# type：10種類（種類・材料は関係図の決まり：docs/relation-map.md）。定義・矢印の読み方・該当例・該当しない例は docs/knowledge-net/schema/relation-types.yaml（どの教材も共通）。
#   前提には premise（learning：理解に必要な知識／mathematical：数学的な成立条件・定義に使う）を必ず書く。
#   変換には mode（exact：厳密／approximation：近似／limit：極限）と成立条件を必ず書く。「近い」と「等しい」を混ぜない。
#   導出には成立条件を必ず書く。前提が2つ以上なら関係ではなく導出（derivations.yaml）の点にする。
#   一般化と特殊化は同じ組を両方向に書かない（原則は一般化で書く）。
#   「前提をさかのぼる」でたどるのは前提・導出・一般化・特殊化・統合だけ。変換・対比・応用はたどらない。学ぶ順に要るもの（例：ポアソン分布を二項分布の極限として学ぶ）は、変換とは別に「前提」（premise: learning）で書く。
# basis：根拠（その関係を扱う単元 units、導出 derivation）。
relations:
  - id: REL-expect-var
    from: TERM-expect
    to: TERM-var
    version: 2
    type: 定める
    to_form: operation
    from_form: operation
    description: 分散は「期待値からのずれ」の2乗の期待値。期待値がなければ測る基準がない。
    basis: {units: [U13]}
  - id: REL-fact-comb
    from: TERM-fact
    to: TERM-comb
    version: 1
    type: 前提
    premise: mathematical
    description: 組合せの数は、全部の並べ方 n! を、選んだ中と残した中の並べ方 k!・(n−k)! で割って求める。
    basis: {units: [U09]}
  - id: REL-comb-binom
    from: TERM-comb
    to: TERM-binom
    version: 3
    question: なぜ ₙCₖ を掛けるのか？   # このつながりで考える問い（#188 07c）
    focus: {formula: F-binom-pmf, parts: [0]}   # このつながりが効く式の部品（#188 07c）
    type: 定める
    description: 成功が k 回ある並びは、n 回のうちどの k 回を成功にするかの選び方の数 ₙCₖ 通りあり、どれも同じ確率なので、1つの並びの確率に ₙCₖ を掛ける。
    basis: {units: [U14]}
  - id: REL-indep-binom
    from: TERM-indep
    to: TERM-binom
    version: 2
    question: なぜ並び1つの確率を掛け算で出せるのか？   # このつながりで考える問い（#188 07c）
    focus: {formula: F-binom-pmf, parts: [1, 2]}   # このつながりが効く式の部品（#188 07c）
    type: 前提
    premise: learning
    description: 各回が独立なので、1通りの確率が掛け算 pᵏ(1−p)ⁿ⁻ᵏ で求まる。独立は、二項分布が成り立つ条件。
    basis: {units: [U14]}
  - id: REL-binom-poisson
    from: TERM-binom
    to: TERM-poisson
    version: 2
    question: めったに起きない事を、たくさんの機会で数えると？   # このつながりで考える問い（#188 07c）
    labs:
      - {id: LAB-pois, preset: rel-approx-tour, purpose: 平均3を保って n を 10→1000 にし、二項分布がポアソン分布に重なるまでを段ごとに見る}
      - {id: LAB-pois, preset: rel-approx, purpose: np を保って n を大きくすると、二項分布がポアソン分布に重なる}
    figures: [FIG-LAB-pois-rel-approx-tour-1, FIG-LAB-pois-rel-approx-tour-2, FIG-LAB-pois-rel-approx-tour-3]
    type: 移る
    operation: λ＞0 を決め、p＝λ/n（np＝λ）を保って n→∞ とする（各 k の確率が近づく）
    claim: CLM-3
    mode: limit
    description: 二項分布で n を大きく、p を小さくして np＝λ を保つと、ポアソン分布に近づく。
    gist: めったに起きない事をたくさんの機会で数えると、回数の上限が効かなくなる。平均 λ だけで確率をおよそ出せる。   # つまり（#95）
    stages:   # 開いたときの段（#188 04）
      origin: 二項分布 B(n, p)。回数 n と確率 p の2つで形が決まる。
      operation: 平均 np＝λ を保ったまま、n を大きく・p を小さくしていく。
      result: ポアソン分布 Po(λ)。λ 1つで形が決まる。
    chart:
      kind: pair
      a: {model: binom, n: 50, p: 0.06, label: 二項分布 n＝50・p＝0.06}
      b: {model: poisson, lambda: 3, label: ポアソン分布 λ＝3}
      note: どちらも平均は3回。n＝50 でも棒の高さはほとんど同じで、n を大きくするほど差が縮む。
    checks:   # 平均 np＝50×0.06＝3＝λ。差（全変動の距離）は n＝50 で 0.02 未満、n を大きくすると縮む
      - abs(50*0.06-3) < 1e-12
      - sum(abs(comb(50,k)*0.06**k*0.94**(50-k) - math.exp(-3)*3**k/math.factorial(k)) for k in range(51))/2 < 0.02
      - sum(abs(comb(200,k)*0.015**k*0.985**(200-k) - math.exp(-3)*3**k/math.factorial(k)) for k in range(41)) < sum(abs(comb(50,k)*0.06**k*0.94**(50-k) - math.exp(-3)*3**k/math.factorial(k)) for k in range(51))
    basis: {units: [U15]}
  - id: REL-binom-normal
    from: TERM-binom
    to: TERM-std-normal
    version: 2
    question: 回数を増やすと、形はどうなる？   # このつながりで考える問い（#188 07c）
    labs:
      - {id: LAB-binom, preset: rel-norm-tour, purpose: n を 10→100 にして棒が曲線に重なり、p が小さいとずれるのを段ごとに見る}
      - {id: LAB-binom, preset: s5-norm, purpose: n を大きくすると、棒が正規分布の曲線に重なる（p が小さいと崩れる）}
    figures: [FIG-LAB-binom-rel-norm-tour-1, FIG-LAB-binom-rel-norm-tour-2, FIG-LAB-binom-rel-norm-tour-3]
    type: 移る
    operation: p を固定して n→∞ とし、成功回数 X を標準化する（(X−np)/√(np(1−p))）
    claim: CLM-5a
    mode: limit
    description: 成功回数を標準化した量 (X−np)/√(np(1−p)) の分布は、n を大きくすると標準正規分布に近づく。有限の n では、二項分布を平均 np・分散 np(1−p) の正規分布で近似して使う（正規近似）。
    gist: 試行回数が多く、成功も失敗もある程度起きるなら、成功回数の分布はなめらかな山（正規分布）でよく近似できる。平均と標準偏差だけで、範囲の確率をおよそ出せる。   # つまり（#95）
    stages:
      origin: 二項分布 B(n, p)。0〜n の飛び飛びの棒。
      operation: 平均 np・分散 np(1−p) が同じ正規分布の曲線を重ねる。
      result: 標準化した量は標準正規分布へ近づく。有限の n では、正規分布 N(np, np(1−p)) のなめらかな山で近似して使う。
    chart:
      kind: normal
      n: 30
      p: 0.3
      note: 平均 9 回・標準偏差 約 2.5 回。np＝9 と n(1−p)＝21 がどちらも5以上なので、棒の頭が曲線に沿う。
    checks:
      - abs(30*0.3-9) < 1e-12 and abs(30*0.7-21) < 1e-12 and round(math.sqrt(30*0.3*0.7),1) == 2.5
    conditions:
      - text: np≧5 かつ n(1−p)≧5
        kind: 目安
        outside: この目安では正規近似を勧められない。二項分布の確率で直接求めるか、近似の精度を別に確かめる
        target: 二項分布の正規近似
        source:
          source: Emory大学 MATH 117
          locator: Approximating a Binomial Distribution with a Normal Curve（境目は教科書によって違うと注記）
    basis: {units: [U14, U16]}
  - id: REL-binom-sampleprop
    from: TERM-sample-prop
    to: TERM-binom
    version: 2
    question: 回数を割合に直すと、分布はどう変わる？   # このつながりで考える問い（#188 07c）
    type: 従う
    claim: CLM-31
    description: 成功の回数 X が二項分布 B(n, p) に従うとき、標本比率 p̂＝X÷n の分布は B(n, p) を横に 1/n に縮めたもの（n·p̂ が B(n, p) に従う）。平均は p、分散は p(1−p)÷n。
    gist: 回数を割合に直しても、分布の形は変わらず目盛りが縮むだけ。だから割合の標準偏差は、回数の標準偏差を n で割った大きさになる（分散なら n² で割る）。   # つまり（#95）
    basis: {units: [U14, U22]}
  - id: REL-binom-poisson-contrast
    from: TERM-binom
    to: TERM-poisson
    version: 2
    question: 回数に上限があると、何が違う？   # このつながりで考える問い（#188 07c）
    type: 比べる
    differ: 二項分布は回数に上限 n があり、分散 np(1−p) は平均 np より小さい（0＜p のとき）。ポアソン分布は上限がなく、分散と平均がどちらも λ
    same: どちらも、出来事が起きた回数（0以上の整数）の分布で、平均をそろえて（np＝λ）比べられる
    axis: 回数の上限と、分散と平均の関係
    description: 二項分布は回数に上限 n があり、分散 np(1−p) は平均 np より小さい。ポアソン分布は上限がなく、分散と平均が同じ λ。
    gist: 平均が同じなら、回数に上限がある数え方（二項）は、上限のない数え方（ポアソン）よりばらつきが小さく、外れ方が違う。   # つまり（#95）
    stages:
      same: どちらも起きた回数を数える分布。平均は同じにできる（np＝λ）。
      differ: 二項分布は回数に上限 n がある。ポアソン分布には上限がない。
      so: 二項分布の分散 np(1−p) は平均より小さく、ポアソン分布の分散は平均と同じ λ。だから二項分布の方がばらつきが小さい。
    chart:
      kind: pair
      a: {model: binom, n: 6, p: 0.5, label: 二項分布 n＝6・p＝0.5（上限6回）}
      b: {model: poisson, lambda: 3, label: ポアソン分布 λ＝3}
      note: どちらも平均は3回。二項分布は6回で切れ、ポアソン分布は7回以上も起こりうる。
    checks:   # 平均 6×0.5＝3＝λ。分散 1.5 は平均 3 より小さい。ポアソンの7回以上の確率は0より大きい
      - abs(6*0.5-3) < 1e-12 and 6*0.5*0.5 < 3 and 1-sum(math.exp(-3)*3**k/math.factorial(k) for k in range(7)) > 0.03
    labs:
      - {id: LAB-pois, preset: rel-contrast-tour, purpose: 平均は同じ3のまま、回数の上限と分散の違いを段ごとに見る}
      - {id: LAB-pois, preset: rel-contrast, purpose: n・p を自分で動かし、二項とポアソンの棒の切れ方と広がりを比べる}
    figures: [FIG-LAB-pois-rel-contrast-tour-1, FIG-LAB-pois-rel-contrast-tour-2]
    basis: {units: [U15]}
  - id: REL-std-normal
    from: TERM-normal
    to: TERM-std-normal
    version: 2
    labs:
      - {id: LAB-z, preset: s4-normal, purpose: 標準化すると、どの正規分布も同じ表で読める}
    figures: [FIG-U16-concept, FIG-U16-stdnormal]
    type: 移る
    claim: CLM-2
    gist: どの正規分布も、平均を引いて標準偏差で割れば同じ形（標準正規分布）になる。だから表は1つでよい。
    reversible: true
    operation: TERM-std
    mode: exact
    description: 正規分布 N(μ, σ²) に従う値を標準化（(X−μ)/σ）すると、標準正規分布 N(0, 1) に従う。逆に Z から μ＋σZ に戻せる。だから1つの表で、どの正規分布の確率も読める。
    basis: {units: [U16]}
  - id: REL-clt-normal
    from: TERM-sample-mean
    to: TERM-std-normal
    version: 2
    type: 従う
    theorem: TERM-clt
    claim: CLM-6b
    description: 独立に同じ分布に従う n 個の標本平均を標準化した量 √n(X̄−μ)/σ の分布は、元の分布によらず、n を大きくすると標準正規分布に近づく（中心極限定理）。
    basis: {units: [U19]}
  - id: REL-rv-dist
    from: TERM-rv
    to: TERM-dist
    version: 3
    type: 定める
    description: 確率分布は、確率変数がとる値と、それぞれの値をとる確率の対応。確率変数がなければ分布は作れない。
    basis: {units: [U13]}
  - id: REL-dist-expect
    from: TERM-dist
    to: TERM-expect
    version: 2
    type: 定める
    to_form: operation
    description: 期待値は、確率分布の「値×確率」を全部足して作る。分布を1つの数に要約したもの。
    basis: {units: [U13]}
  - id: REL-var-sd
    from: TERM-var
    to: TERM-sd
    version: 2
    type: 定める
    to_form: operation
    from_form: operation
    description: 標準偏差は分散の正の平方根。2乗した単位を元の単位に戻す。
    basis: {units: [U13]}
  - id: REL-var-cov
    from: TERM-var
    to: TERM-cov
    version: 2
    type: 特別な場合
    to_form: operation
    from_form: operation
    fix_text: 共分散 Cov(X, Y) で Y＝X とすると Cov(X, X)＝V(X)（分散）
    fix: equal
    description: 分散は1つの変数のずれの2乗の期待値。2つの変数のずれの積に広げると共分散になる（Cov(X, X)＝V(X)）。
    gist: 分散は「1つの量が平均からどれだけずれるか」。共分散は「2つの量が一緒にずれるか」。同じものどうしの共分散が分散。   # つまり（#95）
    labs:
      - {id: LAB-expect, preset: rel-varcov-tour, purpose: Y を X と同じにすると、共分散が分散になるのを見る}
      - {id: LAB-expect, preset: s5-free, purpose: 同時確率を自分で動かし、共分散の符号と大きさを見る}
    figures: [FIG-LAB-expect-rel-varcov-tour-1, FIG-LAB-expect-rel-varcov-tour-2]
    basis: {units: [U13]}
  - id: REL-indep-cov
    from: TERM-indep
    to: TERM-uncorr
    version: 2
    labs:
      - {id: LAB-expect, preset: rel-indep-tour, purpose: X と Y の割合は同じまま、両方の確率だけを変えて共分散の符号を見る}
      - {id: LAB-expect, preset: s5-free, purpose: 独立なら共分散が0。0でも独立とは限らないことも確かめる}
    type: 導ける
    claim: CLM-13
    description: X と Y が独立なら E(XY)＝E(X)E(Y) なので Cov(X, Y)＝0、つまり無相関。逆（無相関なら独立）は一般には成り立たない。
    gist: お互いに影響しない2つの量は、一緒にずれる傾向がないので共分散は0。ただし共分散が0でも、影響し合っていることはある。   # つまり（#95）
    figures: [FIG-LAB-expect-rel-indep-tour-1, FIG-LAB-expect-rel-indep-tour-2, FIG-LAB-expect-rel-indep-tour-3]
    basis: {units: [U13]}
  - id: REL-indep-geom
    from: TERM-indep
    to: TERM-geom
    version: 2
    type: 前提
    premise: learning
    description: 各回が独立なので、失敗が続いてから成功する確率が掛け算 (1−p)^(k−1)p で求まる。独立は、幾何分布が成り立つ条件。
    basis: {units: [U15]}
  - id: REL-binom-geom-contrast
    from: TERM-binom
    to: TERM-geom
    version: 2
    question: 何を数えているかが、どう違う？   # このつながりで考える問い（#188 07c）
    type: 比べる
    differ: 二項分布は試行の回数 n を決めて、成功の回数を数える（上限 n）。幾何分布は成功を1回と決めて、そこまでの試行の回数を数える（上限なし）
    same: どちらも、成功確率 p が毎回同じで独立な試行のくり返しから、ある回数を数える分布
    axis: 何を決めて、何を数えるか
    description: 二項分布は回数 n を決めて成功の数を数える。幾何分布は成功を1回と決めて、そこまでの回数を数える。何を固定し、何を数えるかが逆。
    gist: 二項は「回数を決めて、当たりの数を数える」。幾何は「当たり1回を決めて、そこまでの回数を数える」。決める物と数える物が逆。   # つまり（#95）
    labs:
      - {id: LAB-pois, preset: rel-geom-contrast-tour, purpose: 二項（回数を決めて当たりを数える）と幾何（当たりを決めて回数を数える）を段ごとに並べる}
      - {id: LAB-pois, preset: rel-geom, purpose: タブで二項と幾何を切り替え、横軸が何を数えているかを比べる}
    figures: [FIG-LAB-pois-rel-geom-contrast-tour-1, FIG-LAB-pois-rel-geom-contrast-tour-2]
    basis: {units: [U15]}
  - id: REL-hyper-binom
    from: TERM-hyper
    to: TERM-binom
    version: 2
    question: 箱を大きくすると、戻さない取り方はどう近づく？   # このつながりで考える問い（#188 07c）
    labs:
      - {id: LAB-pois, preset: rel-hyper-tour, purpose: 割合0.3を保って箱を大きくし、補正 (N−n)/(N−1) が1に近づくのを段ごとに見る}
      - {id: LAB-pois, preset: rel-hyper, purpose: 箱を大きくすると、戻さないときの分布が二項分布（戻すとき）に近づく}
    type: 移る
    operation: 取り出す数 n を固定し、当たりの割合 M/N→p を保って N→∞ とする
    claim: CLM-4
    mode: limit
    description: 取り出す数 n を固定し、当たりの割合 M/N を保って集団 N を大きくすると、超幾何分布は二項分布 B(n, M/N) に近づく（戻すか戻さないかの違いが消える）。N が n に比べて十分大きければ、二項分布で代えてよい（数の目安は出典がないので書かない）。
    gist: 箱がとても大きければ、取り出して戻さなくても中身の割合はほとんど変わらない。戻しても戻さなくても同じとみなせる。   # つまり（#95）
    figures: [FIG-LAB-pois-rel-hyper-tour-1, FIG-LAB-pois-rel-hyper-tour-2]
    basis: {units: [U15]}
  - id: REL-binom-hyper-contrast
    from: TERM-binom
    to: TERM-hyper
    version: 2
    question: 戻さずに取ると、何が変わる？   # このつながりで考える問い（#188 07c）
    type: 比べる
    differ: 二項分布は各回が独立で確率が一定。超幾何分布は取るたびに残りの割合が変わり、分散が二項分布の (N−n)/(N−1) 倍になる
    same: 取る数 n と当たりの割合が同じなら、当たりの数の平均はどちらも np
    axis: 取り出し方（戻すか、戻さないか）
    description: 二項分布は戻して取り出す（各回が独立で確率が一定）。超幾何分布は戻さずに取り出す（取るたびに確率が変わる）。超幾何分布の分散は、二項分布の分散の (N−n)/(N−1) 倍（2 個以上取れば 1 より小さい）。
    gist: 戻さずに取り出すと、取った結果によって残りの割合が変わり、結果のばらつきが小さくなる。小さな箱から多く取るほど差が大きい。   # つまり（#95）
    stages:
      same: 当たりの数を数える。取る数 n と当たりの割合が同じなら、平均はどちらも np。
      differ: 戻して取る（毎回同じ確率）か、戻さずに取る（取るたびに残りの割合が変わる）か。
      so: 戻さない方がばらつきが小さい。分散は二項分布の分散の (N−n)/(N−1) 倍になる。
    chart:
      kind: pair
      a: {model: binom, n: 10, p: 0.3, label: 戻す（二項分布 n＝10・p＝0.3）}
      b: {model: hyper, n: 10, total: 20, success: 6, label: 戻さない（20個のうち当たり6個から10個）}
      note: どちらも平均は3個。戻さない方が3個の近くに集まり、山が細い。
    checks:   # 平均 10×0.3＝10×6/20＝3。分散は 2.1 と 2.1×(20−10)/(20−1)。3個の確率は戻さない方が高い
      - abs(10*0.3-3) < 1e-12 and abs(10*6/20-3) < 1e-12
      - comb(6,3)*comb(14,7)/comb(20,10) > comb(10,3)*0.3**3*0.7**7
      - abs(sum((k-3)**2*comb(6,k)*comb(14,10-k)/comb(20,10) for k in range(7)) - 2.1*10/19) < 1e-9
    labs:
      - {id: LAB-pois, preset: rel-hyper-contrast-tour, purpose: 平均は同じまま、取る数を増やすと戻さない方のばらつきが小さくなるのを段ごとに見る}
      - {id: LAB-pois, preset: rel-hyper, purpose: 箱を大きくすると、戻さないときの分布が二項分布（戻すとき）に近づく}
    figures: [FIG-LAB-pois-rel-hyper-contrast-tour-1, FIG-LAB-pois-rel-hyper-contrast-tour-2, FIG-LAB-pois-rel-hyper-contrast-tour-3]
    basis: {units: [U15]}
  - id: REL-dist-pdf
    from: TERM-dist
    to: TERM-pdf
    version: 4
    type: 定める
    description: 確率密度関数は、確率分布のうち区間の確率を積分で表せるもの（連続な確率変数の分布）について使う関数で、その定義に確率分布を使う。離散の分布には密度はない（すべての確率分布に密度があるわけではない）。
