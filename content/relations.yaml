    description: どちらも観測値から何かを引いたずれ。偏差は平均を、残差は回帰式の予測値を引く。回帰式が使えると、残差は偏差より小さくなる（その減り方が決定係数）。
    gist: 偏差は「みんなの平均」からのずれ、残差は「その人の条件から見込んだ値」からのずれ。見込みが当たるほど残差は小さい。
