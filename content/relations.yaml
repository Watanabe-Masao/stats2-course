      - U08
    version: 1
  - id: REL-sd-kurt
    from: TERM-sd
    to: TERM-kurt
    type: 前提
    premise: mathematical
    description: 尖度は、偏差を標準偏差で割った値の4乗の平均（から3を引くこともある）。
    basis:
      units:
      - U08
    version: 1
  - id: REL-mean-geomean-contrast
    from: TERM-mean
    to: TERM-geomean
    type: 対比
    description: 算術平均は値を足して個数で割り、幾何平均は値を掛けて個数の乗根をとる。伸び率のように掛け算で積み重なる量の平均は、幾何平均で求める。
    gist: 1年目に2倍、2年目に半分になったら、元に戻っている。足し算の平均（1.25倍）では合わず、掛け算の平均（1倍）が合う。
    basis:
      units:
      - U05T
      - U06
    version: 1
  - id: REL-mean-ma
    from: TERM-mean
    to: TERM-ma
