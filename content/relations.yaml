    premise: learning
    description: 2群を合わせてよいのは、帰無仮説（割合が等しい）のもとで計算するから。
    basis:
      units:
      - U26
    version: 1
  - id: REL-crosstab-indeptest
    from: TERM-crosstab
    to: TERM-indep-test
    type: 定める
    description: 独立性検定は、クロス集計表の度数から行う。
    basis:
