      - U23
      - U25
    version: 1
  - id: REL-t-welch
    from: TERM-t
    to: TERM-welch
    type: 前提
    premise: mathematical
    description: ウェルチの t 検定は、2群の平均の差を t 分布（自由度を近似で決める）で調べる。
    basis:
      units:
      - U23
      - U25
    version: 1
  - id: REL-pairedt-welch-contrast
    from: TERM-paired-t
    to: TERM-welch
    type: 対比
    description: どちらも2つの平均の差を t 分布で調べる。対応のある t 検定は同じ対象の前後の差を1つの列として扱い、ウェルチの t 検定は別々の2群を、分散が違ってもよいとして比べる。
    gist: 同じ人の前と後なら、差を1人ずつ取って比べる（対応あり）。別の人たちの2群なら、群ごとのばらつきの違いも込みで比べる（ウェルチ）。データの取り方で方法が決まる。
    basis:
      units:
      - U23
      - U25
    version: 1
