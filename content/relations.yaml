      units:
      - U05
    version: 1
  - id: REL-iqr-outlier
    from: TERM-iqr
    to: TERM-outlier
    type: 前提
    premise: mathematical
    description: 箱ひげ図では、箱から四分位範囲の1.5倍より外の値を外れ値の目安にする。
    basis:
      units:
      - U05
      - U08
    version: 1
  - id: REL-range-iqr-contrast
    from: TERM-range
    to: TERM-iqr
    type: 対比
    description: どちらもデータの広がり。範囲は最大値と最小値だけで決まるので外れ値1つで大きく変わる。四分位範囲は真ん中の半分の広がりなので、外れ値の影響を受けにくい。
    gist: 範囲は「いちばん端どうしの距離」、四分位範囲は「真ん中の半分の幅」。極端な1人がいると範囲だけが大きく変わる。
    basis:
      units:
      - U07
    version: 1
  - id: REL-freqtable-hist
    from: TERM-freqtable
    to: TERM-hist
    type: 前提
    premise: mathematical
    description: ヒストグラムは度数分布表を図にしたもの。
    basis:
      units:
      - U05
    version: 1
  - id: REL-sd-cv
