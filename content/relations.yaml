      - U19
    version: 1
  - id: REL-lln-clt
    from: TERM-lln
    to: TERM-clt
    type: 前提
    premise: learning
    description: 大数の法則（平均が母平均に近づく）を知ってから、近づくときのぶれの形（正規分布）を学ぶ。
