    claim: CLM-9
    description: T が自由度 ν の t 分布に従うとき、T² は自由度 (1, ν) の F 分布に従う。
    gist: t 分布に従う量を2乗すると、F 分布（分子の自由度1）に従う。だから、F 統計量が t 統計量の2乗になる場面（2群の一元配置分散分析とプールした t 検定など）では、両側の t 検定と F 検定は同じ判定になる。
