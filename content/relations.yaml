    version: 2
  - id: REL-expect-expected
    from: TERM-expect
    to: TERM-expected
    type: 定める
    to_form: number
    from_form: operation
    description: 期待度数は、帰無仮説のもとで各欄に入ると見込む数（総数×その欄の確率。確率が決まらないときは推定した確率）。名前は似ているが、確率変数の平均（期待値）を度数に当てはめたもの。
    basis:
      units:
      - U13
      - U27
    version: 2
  - id: REL-expected-gof
    from: TERM-expected
    to: TERM-gof
    type: 定める
    from_form: number
    description: 適合度検定は、観測度数と期待度数のずれから統計量を作る。
    basis:
      units:
      - U27
    version: 2
  - id: REL-expected-indeptest
    from: TERM-expected
    to: TERM-indep-test
    type: 定める
    from_form: rv
    description: 独立性検定は、観測度数と期待度数のずれから統計量を作る。
    basis:
      units:
      - U27
    version: 2
  - id: REL-ratio-point
    from: TERM-ratio
    to: TERM-point
    type: 定める
    description: パーセントポイントは、% で表した2つの割合の差。割合が定義に直接出る。
    basis:
      units:
      - U01
      - U05T
    version: 2
  - id: REL-population-parameter
    from: TERM-population
    to: TERM-parameter
    type: 定める
    description: 母数は、母集団の個体の値の全体から決まる数。母集団が定義に直接出る。
    basis:
      units:
      - U03
    version: 2
  - id: REL-parameter-estimator
    from: TERM-parameter
    to: TERM-estimator
    type: 定める
    description: 推定量は、母数 θ を推定する目的で使う統計量。母数が定義に直接出る。
    basis:
      units:
      - U03
      - U21
    version: 2
  - id: REL-scale-qual
    from: TERM-scale
    to: TERM-qual
    type: 定める
    description: 質的変数は、名義尺度か順序尺度の値をとる変数。尺度が定義に直接出る。
    basis:
      units:
      - U04
    version: 2
  - id: REL-scale-quant
    from: TERM-scale
    to: TERM-quant
    type: 定める
    description: 量的変数は、間隔尺度か比例尺度の値をとる変数。尺度が定義に直接出る。
    basis:
      units:
      - U04
    version: 2
  - id: REL-qual-quant-contrast
    from: TERM-qual
    to: TERM-quant
    type: 比べる
    differ: 質的変数は名義尺度か順序尺度で、値は分類を表し、数字で書いても値どうしの足し算・引き算に意味がない。度数・割合で要約し、順序尺度なら大小の順で中央値まで言える。量的変数は間隔尺度か比例尺度で、値は数量を表し、差に意味がある（比例尺度なら比も）ので、平均・分散で要約できる
    same: どちらも個体の1つ1つに値を1つ対応させる変数で、調べた個体の値を並べるとデータの列になる
    axis: 尺度の段階（値が分類か数量か）と、それで意味をもつ計算・要約
    description: 質的変数は分類を、量的変数は数量を表す。量的変数は平均や分散を計算できるが、質的変数は度数や割合で要約する。
    gist: 「何の種類か」を表すのが質的、「どれだけか」を表すのが量的。数字で書いてあっても、背番号のように分類なら質的。
    basis:
      units:
      - U04
    version: 2
  - id: REL-freqtable-mode
    from: TERM-freqtable
    to: TERM-mode
    type: 前提
    premise: learning
    description: 度数分布では、度数が最大の階級の値（階級値）を最頻値とする。
    basis:
      units:
      - U04
      - U06
    version: 1
  - id: REL-median-mean-contrast
    from: TERM-median
    to: TERM-mean
    type: 比べる
    differ: 平均はすべての値の和から決まるので、外れ値1つで大きく動く。中央値は並び順だけで決まるので、外れ値の影響を受けにくい。右に裾が長い分布では、平均が中央値より大きくなることが多い（いつもではない）
    same: どちらもデータの中心（代表値）を元の単位の1つの数で表す
    axis: 何で中心を決めるか（値の並び順か、値の和か）
    description: どちらもデータの中心を表す。平均はすべての値を足すので外れ値に引っ張られ、中央値は並び順だけで決まるので外れ値の影響を受けにくい。右に裾が長い分布では平均が中央値より大きくなることが多い（いつもではない）。
    gist: 年収のように一部にとても大きな値があると、平均は上に引っ張られる。「ふつうの人」に近いのは中央値のほう。
    basis:
      units:
      - U06
    version: 2
  - id: REL-mean-dev
    from: TERM-mean
    to: TERM-dev
    type: 定める
    description: 偏差は値から平均を引いたもの。
    basis:
      units:
      - U02
      - U07
    version: 2
  - id: REL-dev-var
    from: TERM-dev
    to: TERM-data-var
    type: 定める
    description: 分散は偏差の2乗の平均。
    basis:
      units:
      - U07
    version: 2
  - id: REL-median-quantile
    from: TERM-median
    to: TERM-quantile
    type: 特別な場合
    fix_text: 量的なデータでは、分位点の割合 p を 0.5 にすると中央値（線形補間で位置を 1＋p(n−1) 番目とする決め方では、n が奇数でも偶数でも一致する）
    fix: param_value
    description: 分位点は、中央値（真ん中＝50%の位置）を、ほかの割合の位置に広げたもの。
    gist: 中央値は、ちょうど真ん中（50%）の位置の分位点。分位点の割合を0.5に決めたものが中央値。
    basis:
      units:
      - U06
    version: 2
  - id: REL-quantile-quartile
    from: TERM-quantile
    to: TERM-quartile
    type: 比べる
    differ: この教材の四分位数は、中央値と、その下と上の半分それぞれの中央値で決める。分位点（線形補間）は 1＋p(n−1) 番目の値を前後の値の比例で埋める。第2四分位数はどちらでも中央値に一致するが、第1・第3四分位数は p＝0.25・0.75 の分位点と違うことがある（1〜10 の10個では Q₁＝3、0.25 の分位点は 3.25）
    same: どちらも、データを小さい順に並べたときの、決めた割合の位置（四分位数は 25%・50%・75%）の値
    axis: 割合の位置の値の決め方
    description: 四分位数は、25%・50%・75%の位置の分位点。
    gist: 四分位数も分位点も「小さい順に並べて、決めた割合の位置の値」。ただし真ん中以外の決め方には流儀があり、同じデータでも値が少し違うことがある。
    basis:
      units:
      - U05
      - U06
    version: 2
  - id: REL-quartile-iqr
    from: TERM-quartile
    to: TERM-iqr
    type: 定める
    description: 四分位範囲は、第3四分位数と第1四分位数の差。
    basis:
      units:
      - U05
      - U07
    version: 2
  - id: REL-quartile-boxplot
    from: TERM-quartile
    to: TERM-boxplot
    type: 定める
    description: 箱ひげ図は、最小値・四分位数 Q₁・Q₂・Q₃・最大値の5つの数を箱とひげで表した図。四分位数が定義に直接出る。
    basis:
      units:
      - U05
    version: 2
  - id: REL-iqr-outlier
    from: TERM-iqr
    to: TERM-outlier
    type: 定める
    description: 箱ひげ図では、箱から四分位範囲の1.5倍より外の値を外れ値の目安にする。
    basis:
      units:
      - U05
      - U08
    version: 2
  - id: REL-range-iqr-contrast
    from: TERM-range
    to: TERM-iqr
    type: 比べる
    differ: 範囲は最大値と最小値だけで決まるので、外れ値1つで大きく変わる。四分位範囲は真ん中の半分の幅なので、外れ値の影響を受けにくい
    same: どちらもデータの広がりを、2つの値の差として元の単位の1つの数で表す
    axis: 広がりをどの2つの値の差で測るか（両端か、真ん中の半分の両端か）
    description: どちらもデータの広がり。範囲は最大値と最小値だけで決まるので外れ値1つで大きく変わる。四分位範囲は真ん中の半分の広がりなので、外れ値の影響を受けにくい。
    gist: 範囲は「いちばん端どうしの距離」、四分位範囲は「真ん中の半分の幅」。極端な1人がいると範囲だけが大きく変わる。
    basis:
      units:
      - U07
    version: 2
  - id: REL-freqtable-hist
    from: TERM-freqtable
    to: TERM-hist
    type: 定める
    description: ヒストグラムは、度数分布表の各階級の上に、面積が相対度数に等しい柱を並べた図。度数分布表が定義に直接出る。
    basis:
      units:
      - U05
    version: 2
  - id: REL-sd-cv
    from: TERM-unbvar
    to: TERM-cv
    type: 定める
    description: 変動係数は、不偏分散の平方根を平均で割ったもの（単元 U07 の求め方。#310）。不偏分散が定義に直接出る。
    basis:
      units:
      - U07
    version: 2
  - id: REL-std-outlier
    from: TERM-std
    to: TERM-outlier
    type: 前提
    premise: learning
    description: 標準化した値（z）の大きさで、外れ値かどうかの目安を立てることもある。
    basis:
      units:
      - U08
    version: 1
  - id: REL-sd-skew
    from: TERM-data-sd
    to: TERM-skew
    type: 定める
    description: 歪度は、偏差を標準偏差で割った値の3乗の平均。
    basis:
      units:
      - U08
    version: 2
  - id: REL-sd-kurt
    from: TERM-data-sd
    to: TERM-kurt
    type: 定める
    description: 尖度は、偏差を標準偏差で割った値の4乗の平均（から3を引くこともある）。
    basis:
      units:
      - U08
    version: 2
  - id: REL-mean-geomean-contrast
    from: TERM-mean
    to: TERM-geomean
    type: 比べる
    differ: 算術平均は値の和を n で割る。幾何平均は正の値の積の n 乗根で、倍率（1＋伸び率）のように掛け算で積み重なる量では、幾何平均の倍率を n 回掛けると全体の倍率に戻る（2倍と半分なら幾何平均は1倍、算術平均は1.25倍）。正の値では幾何平均は算術平均以下（等しいのは全部の値が同じとき）
    same: どちらも n 個の値を1つの代表の値にまとめる
    axis: 値を足して平均するか、掛けて平均するか
    description: 算術平均は値を足して個数で割り、幾何平均は値を掛けて個数の乗根をとる。倍率（1＋伸び率）のように掛け算で積み重なる量の平均は、幾何平均で求める。
    gist: 1年目に2倍、2年目に半分になったら、元に戻っている。足し算の平均（1.25倍）では合わず、掛け算の平均（1倍）が合う。
    basis:
      units:
      - U05T
      - U06
    version: 2
  - id: REL-mean-ma
    from: TERM-mean
    to: TERM-ma
    type: 定める
    description: 移動平均は、窓に入る連続した値の平均を、窓を1期ずつずらして求めた値の列。平均が定義に直接出る。
    basis:
      units:
      - U05T
    version: 2
  - id: REL-corr-acf
    from: TERM-corr
    to: TERM-acf
    type: 前提
    premise: learning
    description: 自己相関は、相関係数を学んでから学ぶ（どちらも偏差の積の和を、ばらつきで割って −1〜1 にそろえる。ただし自己相関は平均と割る数を系列全体でとるので、ずらした組の相関係数とは一般に一致しない）。
    basis:
      units:
      - U05T
    version: 2
  # ---- P1 骨格：W5（U28〜U32 相関・回帰・調査・実験）と U14 のベルヌーイ分布。#105
  - id: REL-rv-bernoulli
    from: TERM-rv
    to: TERM-bernoulli
    type: 前提
    premise: learning
    description: ベルヌーイ分布は、0か1をとる確率変数の分布。確率変数として値の出方を見ると読みやすい。
    basis:
      units:
      - U14
    version: 2
  - id: REL-bernoulli-binom
    from: TERM-bernoulli
    to: TERM-binom
    figures: [FIG-U14-concept]
    type: 特別な場合
    fix_text: 二項分布 B(n, p) の n を 1 にすると、ベルヌーイ分布 Bern(p) と同じものになる
    fix: param_value
    description: 二項分布は、独立なベルヌーイ試行を n 回くり返したときの成功の数の分布。n＝1 の二項分布がベルヌーイ分布。
    gist: 1回の当たり外れがベルヌーイ分布。それを n 回くり返して当たりの数を数えると二項分布になる。
    basis:
      units:
      - U14
    version: 2
    question: 1回の試行から、分布はどう生まれる？   # このつながりで考える問い（#188 07c）
  - id: REL-scatter-corr
