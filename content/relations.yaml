    basis: {units: [U10]}
  - id: REL-event-exclusive
    from: TERM-event
    to: TERM-exclusive
    version: 2
    type: 定める
    description: 排反は2つの事象の関係（共通部分がない）として決める。
    basis: {units: [U10, U11]}
  - id: REL-exclusive-addition
    from: TERM-exclusive
    to: TERM-addition
    version: 1
    type: 前提
    premise: learning
    description: 排反なら重なりが0なので、加法定理は単に足すだけになる。まず排反の場合で足し算を理解する。
    basis: {units: [U10]}
  - id: REL-prob-cond
    from: TERM-prob
    to: TERM-cond
    version: 2
    type: 定める
    from_form: function
    description: 条件付き確率は、両方が起こる確率を、条件の事象の確率で割って決める。
    basis: {units: [U11]}
  - id: REL-cond-indep
    from: TERM-cond
    to: TERM-indep
    version: 1
    type: 前提
    premise: learning
    description: 独立は「A が起きたと知っても B の確率が変わらない」こと。条件付き確率で読むと意味が分かる。
    basis: {units: [U11]}
  - id: REL-exclusive-indep-contrast
    from: TERM-exclusive
    to: TERM-indep
    version: 2
    type: 比べる
    differ: 排反は A∩B＝∅ で、確率によらず集合だけで決まる。独立は P(A∩B)＝P(A)P(B) で、確率で決まる。どちらの確率も0でない2つの事象が排反なら、P(A∩B)＝0 だが P(A)P(B)＞0 なので、独立ではない
    same: どちらも、2つの事象の組について、その2つがどう関わるかを言う性質
    axis: 2つの事象の関わりを、集合の重なりで言うか、確率の掛け算で言うか
    description: 排反は同時に起こらないこと、独立は互いの確率に影響しないこと。どちらも確率が0でない2つの事象が排反なら、一方が起きると他方は起こらないので、独立ではない。
    gist: 「同時に起きない」と「影響しない」は別のこと。むしろ排反なら、一方が起きたと分かれば他方は起きないと分かるので、強く影響し合っている。
    basis: {units: [U10, U11]}
  - id: REL-multiplication-total
    from: TERM-multiplication
    to: TERM-total-prob
    version: 2
    type: 導ける
    claim: CLM-34
    gist: 起こり方を重ならない場合に分け、「その場合になる確率×その場合で起こる確率」を全部足すと、全体の確率になる。各項が乗法定理の形。
    description: 全確率の公式の各項は、乗法定理で「場合の確率×その場合の条件付き確率」と書いたもの。
    basis: {units: [U12]}
  - id: REL-total-bayes
    from: TERM-total-prob
    to: TERM-bayes
    version: 2
    type: 前提
    premise: learning
    description: ベイズの定理の分母（結果が起こる全体の確率）は、全確率の公式で求める。学ぶ順の前提知識（M6 で ⑥ に照らす。#295）。
    basis: {units: [U12]}
  - id: REL-cond-bayes
    from: TERM-cond
    to: TERM-bayes
    version: 2
    type: 前提
    premise: learning
    description: ベイズの定理は、条件付き確率 P(結果|原因) から P(原因|結果) を求める式。学ぶ順の前提知識（M6 で ⑥ に照らす。#295）。
    basis: {units: [U12]}
  - id: REL-cond-likelihood
    from: TERM-likelihood
    to: TERM-cond
    version: 2
    type: 一種
    description: 尤度は、原因（仮説）H のもとで観測した結果 D が起こる条件付き確率 P(D|H)。D を固定し、H を替えて比べるときの呼び名。
    basis: {units: [U12]}
  - id: REL-prior-posterior
    from: TERM-prior
    to: TERM-posterior
    version: 2
    type: 移る
    operation: 尤度 P(D|H) を掛け、結果 D が起こる確率 P(D) で割る（P(H|D)＝P(D|H)P(H)/P(D)）
    theorem: TERM-bayes
    mode: exact
    description: 事前確率に尤度を掛け、結果が起こる全体の確率（全確率）で割ると、事後確率になる。
    gist: データを見る前の見込みを、データの起こりやすさで重み付けし直したのが、データを見たあとの見込み。
    basis: {units: [U12]}
