    same: どちらも、独立に同じ分布に従う標本の標本平均 X̄ について、n を大きくしたときのふるまいを言う定理
    differ: 大数の法則は、X̄ そのものが平均 μ に近づく（ずれは0に縮む）と言う。中心極限定理は、ずれを √n 倍に拡大して σ で割った √n(X̄−μ)/σ の分布が、（分散が有限で正なら）元の分布によらず標準正規分布に近づくと言う
    description: 大数の法則は標本平均が平均に近づくこと、中心極限定理はそのずれの分布の形が正規分布に近づくことを言う。
    gist: n を大きくすると、標本平均は平均に近づき（大数の法則）、近づくときのずれ方は釣鐘の形になる（中心極限定理）。
