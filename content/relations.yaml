    version: 1
  - id: REL-slr-mreg
    from: TERM-slr
    to: TERM-mreg
    type: 特別な場合
    fix_text: 重回帰分析の説明変数の個数 k を1にすると、1つの説明変数 x で y を表す直線 ŷ＝b₀＋b₁x を最小二乗法で求める単回帰と同じものになる
    fix: count
    description: 単回帰は、重回帰分析の説明変数の個数を1にしたもの。
    gist: 身長だけで体重を見込むのが単回帰、身長と年齢と運動量で見込むのが重回帰。手掛かりを増やしても、考え方（残差を小さく）は同じ。
    basis:
