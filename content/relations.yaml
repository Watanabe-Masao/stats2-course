    description: 連続修正は、二項分布を正規分布で近似するときに使う。離散の棒を連続の幅に置き換える考え。
    basis:
      units:
      - U19
    version: 1
  - id: REL-var-unbvar
    from: TERM-var
    to: TERM-unbvar
    type: 前提
    premise: mathematical
    description: 不偏分散は分散の計算で割る数を n から n−1 にしたもの。
