    to: TERM-welch
    type: 比べる
    differ: 対応のある t 検定は、同じ対象の対の差 Dᵢ を1つの標本として扱い（対に共通する個体の効果が差で打ち消される）、t(n−1) で棄却域を決める。ウェルチの t 検定は、独立な2群を母分散が等しいと仮定せずに比べ、自由度を近似で決めた t 分布で棄却域を決める
    same: どちらも「2つの母平均が等しい」という帰無仮説を、平均の差を標準誤差で割った t の形の統計量で調べる仮説検定
    axis: 2つの平均の差を調べるときの、データの取り方とばらつきの扱い
    description: どちらも2つの平均の差を t 分布で調べる。対応のある t 検定は同じ対象の前後の差を1つの列として扱い、ウェルチの t 検定は別々の2群を、分散が違ってもよいとして比べる。
    gist: 同じ人の前と後なら、差を1人ずつ取って比べる（対応あり）。別の人たちの2群なら、群ごとのばらつきの違いも込みで比べる（ウェルチ）。データの取り方で方法が決まる。
    basis:
      units:
      - U23
      - U25
    version: 2
  # ---- P1 骨格：W4（U24〜U27 検定）。#105
  - id: REL-sampdist-test
    from: TERM-sampdist
    to: TERM-test
    type: 前提
    premise: learning
    description: 検定は、統計量の標本分布を使って「このデータは仮説のもとで起こりにくいか」を測る。
    basis:
      units:
      - U24
    version: 1
  - id: REL-h0-h1
    from: TERM-h0
    to: TERM-h1
    type: 定める
    description: 対立仮説は、帰無仮説を棄却したときに採る仮説として決める。
    basis:
      units:
      - U24
    version: 2
  - id: REL-h0-teststat
    from: TERM-h0
    to: TERM-test-stat
    type: 定める
    description: 検定統計量は、帰無仮説のもとでの分布が分かるように作る。
    basis:
      units:
      - U24
      - U25
      - U26
    version: 2
  - id: REL-teststat-pvalue
    from: TERM-test-stat
    to: TERM-pvalue
    type: 定める
    to_form: rv
    description: p値は、検定統計量が観測した値より極端になる確率。
    basis:
      units:
      - U24
      - U26
    version: 2
  - id: REL-teststat-reject
    from: TERM-test-stat
    to: TERM-reject
    type: 定める
    description: 棄却域は、検定統計量のとる値の範囲として決める。
    basis:
      units:
      - U24
      - U25
    version: 2
  - id: REL-pvalue-alpha-contrast
    from: TERM-pvalue
    to: TERM-alpha
    type: 比べる
    differ: 有意水準はデータを見る前に決める数（第1種の過誤の確率の上限）。p値は検定統計量の観測値から計算する値で、標本を取り直すと変わる（確率変数の値）
    same: どちらも帰無仮説のもとでの確率の大きさで、2つを比べて帰無仮説を棄却するかを決める
    axis: いつ・何から決まるか
    from_form: number
    description: どちらも確率で、比べて帰無仮説を棄却するか決める。有意水準はデータを見る前に決める基準、p値はデータから計算する値。p値が有意水準以下なら棄却する。
    gist: 有意水準は前もって引いておく線、p値はデータが出した数。線より小さければ「偶然とは考えにくい」と判断する。
    basis:
      units:
      - U24
    version: 2
  - id: REL-type1-alpha
    from: TERM-type1
    to: TERM-alpha
    type: 定める
    from_form: number
    description: 有意水準は、第1種の過誤が起こる確率の上限として決める。
    basis:
      units:
      - U24
    version: 2
  - id: REL-type1-type2-contrast
    from: TERM-type1
    to: TERM-type2
    type: 比べる
    differ: 第1種の過誤は、帰無仮説が正しいのに棄却する誤り。第2種の過誤は、帰無仮説が誤っているのに棄却しない誤り。同じ検定統計量・同じ標本の大きさで、棄却域を今の棄却域の一部に狭めると、第1種の過誤の確率は上がらず、第2種の過誤の確率は下がらない（ふつうは上がる）
    same: どちらも検定の判定の誤りで、棄却域から決まる事象（とその確率）
    axis: 帰無仮説が正しいか誤っているか と、判定（棄却する・しない）の組
    to_form: event
    from_form: event
    description: 第1種の過誤は正しい帰無仮説を棄却する誤り、第2種の過誤は誤った帰無仮説を棄却しない誤り。同じ検定統計量・同じデータの数で、棄却域を狭めて第1種を減らすと、第2種は減らない（ふつうは増える）。
    gist: 「無実の人を有罪にする」のが第1種、「犯人を見逃す」のが第2種。片方を厳しくすると、もう片方が起こりやすくなる。
    basis:
      units:
      - U24
    version: 2
  - id: REL-type2-power
    from: TERM-type2
    to: TERM-power
    type: 定める
    from_form: number
    description: 検出力は1から第2種の過誤の確率を引いたもの。
    basis:
      units:
      - U24
    version: 2
  - id: REL-test-pairedt
    from: TERM-paired-t
    to: TERM-test
    type: 一種
    description: 対応のある t 検定は、仮説検定の手順を差の平均に当てはめたもの。
    basis:
      units:
      - U25
    version: 2
  - id: REL-test-welch
    from: TERM-welch
    to: TERM-test
    type: 一種
    description: ウェルチの t 検定は、仮説検定の手順を2群の平均の差に当てはめたもの。
    basis:
