    basis:
      units:
      - U05
      - U06
    version: 1
  - id: REL-quartile-iqr
    from: TERM-quartile
    to: TERM-iqr
    type: 前提
    premise: mathematical
    description: 四分位範囲は、第3四分位数と第1四分位数の差。
    basis:
      units:
      - U05
      - U07
    version: 1
  - id: REL-quartile-boxplot
    from: TERM-quartile
    to: TERM-boxplot
    type: 前提
    premise: mathematical
