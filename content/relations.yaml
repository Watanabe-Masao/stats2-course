    type: 前提
    premise: mathematical
    description: 母数は母集団の性質を表す値。
    basis:
      units:
      - U03
    version: 1
  - id: REL-parameter-statistic-contrast
    from: TERM-parameter
    to: TERM-statistic
    type: 対比
    description: 母数は母集団の値でふつうは分からない。統計量は標本から計算する値で、標本を取り直すたびに変わる。統計量で母数を推定する。
    gist: 母数は「本当の値（分からない）」、統計量は「手元のデータから出した値（取り直すと変わる）」。手元の値から本当の値を推し量るのが推定。
    basis:
      units:
      - U03
    version: 1
  - id: REL-parameter-estimator
    from: TERM-parameter
    to: TERM-estimator
    type: 前提
    premise: learning
    description: 推定量は、母数を推定するためのもの。何を推定するか（母数）を先に知る。
    basis:
      units:
      - U03
      - U21
    version: 1
  - id: REL-scale-qual
    from: TERM-scale
    to: TERM-qual
    type: 前提
    premise: learning
    description: 名義尺度・順序尺度のデータが質的変数になる。
    basis:
      units:
      - U04
    version: 1
  - id: REL-scale-quant
    from: TERM-scale
    to: TERM-quant
    type: 前提
    premise: learning
    description: 間隔尺度・比例尺度のデータが量的変数になる。
    basis:
      units:
      - U04
    version: 1
  - id: REL-qual-quant-contrast
    from: TERM-qual
    to: TERM-quant
    type: 対比
    description: 質的変数は分類を、量的変数は数量を表す。量的変数は平均や分散を計算できるが、質的変数は度数や割合で要約する。
    gist: 「何の種類か」を表すのが質的、「どれだけか」を表すのが量的。数字で書いてあっても、背番号のように分類なら質的。
    basis:
      units:
      - U04
    version: 1
  - id: REL-sigma-mean
    from: TERM-sigma
    to: TERM-mean
    type: 前提
    premise: mathematical
    description: 平均は総和記号で（1/n）Σ xᵢ と書く。
    basis:
      units:
      - U02
      - U06
    version: 1
  - id: REL-quant-mean
    from: TERM-quant
    to: TERM-mean
    type: 前提
    premise: mathematical
    description: 平均は値を足して求めるので、量的変数で使う。
    basis:
      units:
      - U04
      - U06
    version: 1
  - id: REL-quant-median
    from: TERM-quant
    to: TERM-median
    type: 前提
    premise: mathematical
    description: 中央値は値を小さい順に並べて求めるので、順序のある値で使う。
    basis:
      units:
      - U04
      - U06
    version: 1
  - id: REL-freqtable-mode
    from: TERM-freqtable
    to: TERM-mode
    type: 前提
    premise: learning
    description: 度数分布では、度数が最大の階級の値（階級値）を最頻値とする。
    basis:
      units:
      - U04
      - U06
    version: 1
  - id: REL-median-mean-contrast
    from: TERM-median
    to: TERM-mean
    type: 対比
    description: どちらもデータの中心を表す。平均はすべての値を足すので外れ値に引っ張られ、中央値は並び順だけで決まるので外れ値の影響を受けにくい。右に裾が長い分布では平均が中央値より大きくなる。
    gist: 年収のように一部にとても大きな値があると、平均は上に引っ張られる。「ふつうの人」に近いのは中央値のほう。
    basis:
      units:
      - U06
    version: 1
  - id: REL-mean-expect
    from: TERM-mean
    to: TERM-expect
    type: 一般化
    description: 期待値は、データの平均を確率の重みの平均に広げたもの。データの平均は、各値に「出た割合」の重みを付けた期待値と見られる。
    gist: データの平均は「出た値を出た割合で重み付けした平均」。期待値はその割合を確率に置き換えたもので、何度もくり返したときの平均の行き先。
    basis:
      units:
      - U06
      - U13
    version: 1
