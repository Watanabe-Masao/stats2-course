    description: 切片を含む単回帰を最小二乗で当てはめると、決定係数は相関係数の2乗に等しい。
    gist: 単回帰では、相関係数を2乗すると、y のばらつきのうち直線で説明できる割合（決定係数）になる。r＝0.9 なら 81%。
