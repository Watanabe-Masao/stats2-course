    type: 前提
    premise: mathematical
    description: 層化抽出は、層の中で無作為抽出を行う。
    basis:
      units:
      - U31
    version: 1
  - id: REL-random-cluster
    from: TERM-random-sampling
    to: TERM-cluster-sampling
    type: 前提
    premise: mathematical
    description: 集落抽出は、集落を無作為に選ぶ。
    basis:
      units:
      - U31
    version: 1
  - id: REL-random-systematic
    from: TERM-random-sampling
    to: TERM-systematic-sampling
    type: 前提
    premise: mathematical
    description: 系統抽出は、最初の1人を無作為に選ぶ。
    basis:
