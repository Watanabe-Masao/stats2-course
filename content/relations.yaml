  - id: REL-random-multistage
    from: TERM-random-sampling
    to: TERM-multistage-sampling
    type: 前提
    premise: mathematical
    description: 多段抽出は、各段で無作為抽出を行う。
    basis:
      units:
      - U31
    version: 1
  - id: REL-strat-cluster-contrast
    from: TERM-strat-sampling
    to: TERM-cluster-sampling
    type: 対比
    description: どちらも母集団をグループに分ける。層化抽出はすべての層から少しずつ選び、集落抽出は選んだ集落の全員を調べる。層は中が似た者どうし、集落は中にいろいろな人がいる分け方がよい。
    gist: 層化は「どのグループからも少しずつ」、集落は「選んだグループは全員」。層化は精度を上げる工夫、集落は手間を減らす工夫。
    basis:
      units:
      - U31
    version: 1
  - id: REL-sample-samplingerror
    from: TERM-sample
    to: TERM-sampling-error
    type: 前提
    premise: mathematical
    description: 標本誤差は、一部だけを調べることで生じるずれ。
    basis:
      units:
      - U31
    version: 1
  - id: REL-samplingerror-se-contrast
    from: TERM-sampling-error
    to: TERM-se
    type: 対比
    description: 標本誤差は、標本を選ぶことで結果が真の値からずれる現象そのもの。標準誤差は、そのずれがくり返しでどれくらいの大きさになるかを測る数（推定量の標準偏差）。
    gist: 標本誤差は「一部だけ見たせいで起きるずれ」、標準誤差は「そのずれのふつうの大きさ」。標準誤差で標本誤差の大きさを見積もる。
    basis:
      units:
      - U18
      - U31
    version: 1
  - id: REL-sampling-nonsampling-contrast
    from: TERM-sampling-error
    to: TERM-nonsampling-error
    type: 対比
    description: 標本誤差は標本を大きくすると小さくなる。非標本誤差（無回答・回答の誤り・枠の不備）は標本を大きくしても減らず、偏りになりやすい。
    gist: 人数を増やせば減るずれ（標本誤差）と、人数を増やしても減らないずれ（非標本誤差）がある。後ろのほうは調べ方を変えないと直らない。
    basis:
      units:
      - U31
    version: 1
  - id: REL-frame-nonsampling
    from: TERM-frame
    to: TERM-nonsampling-error
    type: 前提
    premise: learning
    description: 抽出枠の不備は、非標本誤差の代表的な原因の1つ。
    basis:
      units:
      - U31
    version: 1
  - id: REL-random-randomize-contrast
    from: TERM-random-sampling
    to: TERM-randomize
    type: 対比
    description: 無作為抽出は「誰を調べるか」をくじで選ぶ（結果を母集団に広げるため）。無作為化は「誰にどの処理をするか」をくじで割り当てる（処理の効果を他の要因と分けるため）。
    gist: 無作為抽出は「調べる人を選ぶくじ」、無作為化は「調べる人を組に分けるくじ」。前者で一般化でき、後者で因果を言える。
    basis:
      units:
      - U17
      - U32
    version: 1
  - id: REL-confound-randomize
    from: TERM-confound
    to: TERM-randomize
    type: 前提
    premise: learning
    description: 無作為化は、交絡する要因を群の間でそろえるために行う。交絡を知ってから、その断ち方を学ぶ。
    basis:
      units:
      - U32
    version: 1
  - id: REL-confound-spurious
    from: TERM-confound
    to: TERM-spurious
    type: 前提
    premise: learning
    description: 擬相関の多くは、交絡する第3の要因から生まれる。
    basis:
      units:
      - U28
      - U32
    version: 1
