  - id: REL-mean-cv
    from: TERM-mean
    to: TERM-cv
    type: 前提
    premise: mathematical
    description: 変動係数は標準偏差を平均で割ったもの。
    basis:
      units:
      - U07
    version: 1
  - id: REL-std-outlier
    from: TERM-std
    to: TERM-outlier
