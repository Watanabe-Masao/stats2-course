id: U29
number: "29"
title: 単回帰・最小二乗・残差
domain: D7
reference_section: ⑦ 相関・回帰
prev: U28
next: U30
prereq: [U02, U07, U28]
used_by: [U30, U32]
terms: [TERM-ols, TERM-regcoef, TERM-resid, TERM-r2, TERM-extrap]
labs: [LAB-reg]
goal: 散布図に最小二乗で回帰直線を引き（残差の2乗の合計を最小にする）、傾き・切片・予測値・残差・決定係数 R² を求めて読み、外挿・残差の形・回帰の向きの落とし穴を、点を動かして確かめながら説明できる。
stage_goals:
  S1: 「最小二乗の直線は残差の〜を最小にする」「R²＝0.81 は予測が当たる割合ではなく〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、回帰直線・予測値・残差・R² を計算し、傾きを単位つきで読める。間違えた所だけ初学に戻る。
  S3: 問題文に「外挿」「残差プロット」とは書いていない。**予測の向きを決め、最小二乗で直線を求め、残差の形と範囲を確かめ、因果と書かずに使い方を書く**。
  S4: 気温と売上・面積と売上・広告と来店のように、場面が違っても「直線 → 残差 → R² → 範囲内で使う」の形は同じ。
  S5: 統計検定の枠の外。回帰の分散分析表と F、残差の読み方、回帰の向きと平均への回帰から、1本の直線で何が消えるかを考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 例題の回帰直線・残差・R² を計算し、点を動かして直線と残差の変わり方を説明できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 向き・残差の形・外挿を判断して回帰を使えた
  S4: 売場の2つの指標で予測式を作り、範囲と残差を添えて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
