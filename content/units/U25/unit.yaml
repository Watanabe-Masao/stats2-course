    caption: 右の裾を拡大した図。σ の代わりに s を使った t は自由度15の t 分布（実線）に従い、標準正規分布（点線）より裾が重い。両側5%の境目は、正規なら1.96、t(15) なら2.131 で外側へ動く。t＝2.0 は1.96 は超えるが2.131 は超えないので、正規なら棄却、t(15) では棄却しない
    spec:
      type: dist
      family: t
      df: 15
      ticks: [1, 3, 1]
      mark_mean: false
      shade: [{outside: [-2.131, 2.131]}]
      marks: [{x: 1.96, label: "正規 1.96"}, {x: 2.0, label: "t＝2.0"}, {x: 2.131, label: "t(15) 2.131"}]
      label: t(15)
      overlay: {family: normal, mu: 0, sigma: 1, label: 標準正規分布}
      lines: ["t＝2.0 は正規の1.96 より外、t(15) の2.131 より内"]
