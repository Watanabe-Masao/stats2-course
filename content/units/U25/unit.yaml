    caption: σ の代わりに s を使った t は、自由度15の t 分布（実線）に従い、標準正規分布（点線）より裾が重い。両側5%の境目は1.96 ではなく2.131。t＝2.0 は正規なら棄却域に入るが、t(15) では入らない
    spec:
      type: dist
      family: t
      df: 15
      ticks: [-4, 4, 1]
      mark_mean: false
      shade: [{outside: [-2.131, 2.131]}]
      marks: [{x: 2.0, label: "観測 t＝2.0"}, {x: 2.131, label: "t(15) 2.131"}]
      label: t(15)
      overlay: {family: normal, mu: 0, sigma: 1, label: 標準正規分布}
      lines: ["両側5%の点　t(15) 2.131　／　正規 1.96"]
