title: 平均の t 検定
domain: D6
reference_section: ⑥ 検定
prev: U24
next: U26
prereq: [U20, U23, U24]
used_by: [U26, U32]
terms: [TERM-t, TERM-df, TERM-test-stat, TERM-reject, TERM-paired-t, TERM-welch]
labs: [LAB-ttest]
goal: 1つの集団と基準値・同じ対象の前後・別々の2群というデータの取り方から、1標本の t・差の t・ウェルチの t を選び、自由度に合った t の点で判断できる。
stage_goals:
  S1: 「σ が分からないので1.96 ではなく t(15) の2.131 と比べる。なぜなら〜」「同じ店の前後は差を取る。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、1標本・対応あり・2群の t を計算し、自由度に合った点で判断できる。間違えた所だけ初学に戻る。
  S3: 問題文に「対応あり」「ウェルチ」とは書いていない。**データの取り方から検定を選び、自由度に合った t の点で判断し、「〜と言える／〜とは言えない」で結ぶ**。
  S4: 内容量・新旧レジ・2店の客単価のように、場面が違っても「差 ÷ 標準誤差 を t の点と比べる」形は同じ。
  S5: 2級には直接出ない。t 分布が正規に近づく様子、ウェルチの自由度、t 検定に必要な数、正規分布が仮定できないとき。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 1標本・対応あり・ウェルチの t 検定を行い、t の点を使う理由と差を取る理由を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: データの取り方から検定を選び、ウェルチと等分散の違いを説明できた
  S4: 売場の比較を、t 検定の結論と差の大きさに分けて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
