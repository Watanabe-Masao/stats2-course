id: U19
number: "19"
title: 大数の法則・中心極限定理
domain: D4
reference_section: ④ 標本分布
prev: U18
next: U20
prereq: [U14, U16, U18]
used_by: [U20, U22, U25, U26]
terms: [TERM-lln, TERM-clt, TERM-cc, TERM-binom, TERM-normal, TERM-sample-mean]
labs: [LAB-clt]
goal: 「平均の値が μ に近づく」（**大数の法則**）と「平均の分布の形が正規に近づく」（**中心極限定理**）を区別し、二項分布の確率を連続修正つきの正規近似で求め、近似してよい条件を確かめられる。
stage_goals:
  S1: 「55人以下は約86%。なぜなら〜」「30人の平均の分布は左右対称に近い。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、2つの法則の違いを言い、二項の正規近似を連続修正つきで計算できる。間違えた所だけ初学に戻る。
  S3: 問題文に「中心極限定理を使え」とは書いていない。**平均の値の話か確率の話かを決め、np・歪み・独立を確かめ、連続修正の向きを図で決めてから計算する**。
  S4: 賞品の用意・平均購入点数・新売場の購入率のように、場面が違っても「たくさん足すと正規に近づく」形は同じ。
  S5: 統計検定の枠の外。チェビシェフの不等式と大数の法則の証明、正規に近づく速さ、分散が無限の場合、ポアソンの正規近似。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 二項の正規近似を連続修正つきで計算し、2つの法則の違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 近似してよい条件を確かめ、使えない場面を見分けられた
  S4: 売場の用意数や判断の時期を、正規近似と SE で説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
