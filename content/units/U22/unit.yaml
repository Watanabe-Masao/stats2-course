id: U22
number: "22"
title: 平均・割合の信頼区間
domain: D5
reference_section: ⑤ 推定
prev: U21
next: U23
prereq: [U16, U18, U20, U21]
used_by: [U23, U24, U26, U31]
terms: [TERM-ci, TERM-conf-level, TERM-se, TERM-t, TERM-ratio]
labs: [LAB-ci]
goal: 母平均・母比率の信頼区間を **推定値 ± 確率点 × 標準誤差** で作り（σ が分からなければ t）、95%の意味を「作り方の性質」として正しく言い、必要な人数を誤差幅から逆算できる。
stage_goals:
  S1: 「母平均の95%信頼区間は48.04〜51.96。なぜなら〜」「95%は μ が入る確率ではない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、平均と割合の区間を作り、95%の意味と、幅を半分にする n を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「z を使え」とは書いていない。**平均か割合かを決め、σ が分かるかで z か t かを選び、前提を確かめてから区間を作り、正しく読む**。
  S4: 客単価・満足率・調査人数・前年との比較のように、場面が違っても「推定値 ± 確率点 × 標準誤差」の形は同じ。
  S5: 2級には直接出ない。ウィルソンの区間、区間と検定の対応、母分散の区間、ベイズの信用区間。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 平均と割合の95%信頼区間を作り、95%の意味を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: z と t を使い分け、必要な人数を逆算し、誤った読み方を見分けられた
  S4: 売場の数字を幅つきで報告し、前年の値と比べられた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
