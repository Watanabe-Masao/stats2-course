  - '[sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if a <= x < a+10) for a in (10,20,30,40,50)] == [4,9,5,1,1]'
  - 'Fraction(4,20) == Fraction(20,100) and Fraction(9,20) == Fraction(45,100) and Fraction(13,20) == Fraction(65,100) and Fraction(18,20) == Fraction(90,100) and Fraction(19,20) == Fraction(95,100)'
  - 'Fraction(26+27, 2) == Fraction(53,2) and Fraction(21+22, 2) == Fraction(43,2) and Fraction(31+33, 2) == 32'
  - 'Fraction(32) - Fraction(43,2) == Fraction(21,2) and Fraction(3,2)*Fraction(21,2) == Fraction(63,4)'
  - 'Fraction(43,2) - Fraction(63,4) == Fraction(23,4) and 32 + Fraction(63,4) == Fraction(191,4)'
  - 'Fraction(552, 20) == Fraction(276, 10)'
  # 幹葉図の例、表の相対度数
  - 'Fraction(9, 20) == Fraction(45, 100)'
  # 発展：四分位数の別の求め方（線形補間）
  - 'abs((21 + 0.75*(22-21)) - 21.75) < 1e-9 and abs((31 + 0.25*(33-31)) - 31.5) < 1e-9 and 1 + 0.25*19 == 5.75 and 1 + 0.75*19 == 15.25'
  # 発展：スタージェスの公式（n＝20）
