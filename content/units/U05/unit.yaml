id: U05
number: "05"
title: 度数分布・ヒストグラム・箱ひげ図
domain: D1
reference_section: ① データの記述
prev: U04
next: U06
prereq: [U04, U03]
used_by: [U05T, U06, U07, U08]
terms: [TERM-freqtable, TERM-hist, TERM-boxplot, TERM-quartile, TERM-iqr, TERM-outlier, TERM-median]
labs: [LAB-dist]
goal: たくさんの数字を度数分布表・ヒストグラム・箱ひげ図にまとめ、**分布の形（どこに集まり、どちらに裾が伸びるか）と外れ値を、図から理由つきで読み取れる**。
stage_goals:
  S1: 「20日の売上は20万円台に集まり、右に裾が伸び、55万円は外れ値候補。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに四分位数と柵を計算でき、図の使い分けを言える。間違えた所だけ初学に戻る。
  S3: 問題文に「ヒストグラムを描け」とは書いていない。**何を比べたいか（形・真ん中・散らばり・外れ値）から図と数を自分で選ぶ**。
  S4: 品質管理・客単価・時系列でも、「形を見る図」と「5つの数で比べる図」の使い分けと、それぞれで見えないものは同じ。
  S5: 統計検定の枠の外。四分位数の求め方の違い、階級の数の目安、なめらかな分布の描き方、外れ値の別の基準から、統計の考え方がなぜその形なのかを考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 20日の売上の形と外れ値を、理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 比べたいことに合わせて図を選び、その図で言えないことも書けた
  S4: 別の場面のデータで、形・散らばり・外れ値を読み、扱い方を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
