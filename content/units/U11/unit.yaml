id: U11
number: "11"
title: 条件付き確率・独立・乗法則
domain: D2
reference_section: ② 確率
prev: U10
next: U12
prereq: [U10]
used_by: [U12, U13, U14, U27]
terms: [TERM-cond, TERM-indep, TERM-exclusive, TERM-event]
labs: [LAB-prob]
goal: 「〇〇だと分かったうえで」の確率を、**分母が変わることから求められ**、続けて起こる確率を掛け継いで計算し、2つの出来事が独立かどうか判定できる。
stage_goals:
  S1: 「1回目が赤なら2回目は1/4。なぜなら〜」「雨の日の購入率と晴れの日の購入率が違うので独立ではない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、条件付き確率・乗法定理・独立の判定を使い分けて解ける。間違えた所だけ初学に戻る。
  S3: 問題文に「条件付き確率を求めよ」とは書いていない。**「〇〇の中で」「〇〇のうち」「〇〇だったとき」から分母を自分で決め、P(A｜B) と P(B｜A) を取り違えない**。
  S4: クロス集計・抽選・検品・販促の効果のように、場面が違っても「条件で分母を変える」「条件で割合が変わるかを見る」は同じ形で使える。
  S5: 2級には直接出ない。くじ引きの公平さ、独立の対称性、条件付き独立とシンプソンのパラドックス、マルコフ連鎖。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 戻さずに2回引く確率を掛け継いで求め、分母が変わる理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 分母を自分で決め、P(A｜B) と P(B｜A) を区別できた
  S4: 売場のクロス集計で、条件ごとの割合と独立を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
