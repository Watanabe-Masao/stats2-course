  # 前提チェック
  - 'Fraction(12,40) == Fraction(3,10) and Fraction(2,5)*Fraction(1,2) == Fraction(1,5) and Fraction(5,10)+Fraction(4,10)-Fraction(2,10) == Fraction(7,10)'
  # 実験：晴れの日の購入率、ラボなしで
