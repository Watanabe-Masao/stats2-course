title: 仮説検定の考え方
domain: D6
reference_section: ⑥ 検定
prev: U23
next: U25
prereq: [U16, U18, U22]
used_by: [U25, U26, U27, U30, U32]
terms: [TERM-h0, TERM-h1, TERM-test-stat, TERM-pvalue, TERM-alpha, TERM-reject, TERM-sides, TERM-type1, TERM-type2, TERM-power]
labs: [LAB-test]
goal: 「差がないと仮定したら今回の結果はどれくらい珍しいか」で判断する検定の手順（仮説・α・両側／片側→統計量→p 値→結論）を踏み、p 値・2種類の過誤・検出力を正しく読める。
stage_goals:
  S1: 「p＝0.028 は H₀ が正しい確率ではなく〜」「α を小さくすると β は〜。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、z 検定の4つの手順を踏み、p 値と過誤・検出力を説明できる。間違えた所だけ初学に戻る。
  S3: 問題文に「片側」とは書いていない。**示したいことから H₀・H₁・両側／片側を決め、α を先に置き、p 値で判断し、「〜と言える／〜とは言えない」で結ぶ**。
  S4: 施策の評価・購入率・多くの売場の比較・少ない店での試行のように、場面が違っても「仮説→統計量→p 値→結論」の形は同じ。
  S5: 統計検定の枠の外。検出力曲線、必要な人数の計算、多重比較、p 値の分布。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: z 検定で p 値を出して判断し、p 値と過誤の意味を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 両側／片側と α を先に決め、結論を正しい言い方で書けた
  S4: 施策の評価を、有意かどうかと差の大きさ・検出力を分けて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
