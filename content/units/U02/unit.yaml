checks:
  # 記号の読み方・例題A：2, 4, 6
  - 'sum([2,4,6]) == 12 and Fraction(12,3) == 4 and sum(x*x for x in [2,4,6]) == 56 and 12**2 == 144 and sum((x-4)**2 for x in [2,4,6]) == 8'
  - '[(x-4)**2 for x in [2,4,6]] == [4,0,4] and [x*x for x in [2,4,6]] == [4,16,36]'
  - 'math.factorial(4) == 24 and 4*3*2*1 == 24'
  # 実験：3, 5, 10
  - 'Fraction(3+5+10, 3) == 6 and [x-6 for x in [3,5,10]] == [-3,-1,4] and sum(x-6 for x in [3,5,10]) == 0'
  # 実験のラボなしで：1, 2, 9
  - 'Fraction(1+2+9, 3) == 4 and [x-4 for x in [1,2,9]] == [-3,-2,5] and sum(x-4 for x in [1,2,9]) == 0'
  # 前提チェック
  - '3 + 5 + 7 == 15 and 2*3 + 1 == 7 and 3**2 == 9 and 4*3*2*1 == 24'
  # 計算ルール（2, 4, 6）
  - '3*12 == 36 and 12 + 3*1 == 15 and 3*5 == 15 and 56 - 3*4**2 == 8 and 3*4**2 == 48'
  # 転用の読み取り：n＝5・r＝2
  - '5*4 == 20 and Fraction(20, math.factorial(2)) == 10 and math.comb(5,2) == 10'
  # 初学のラボ s1-sum（例題と別の数）
  - '4+9+49 == 62 and (2+3+7)**2 == 144'
  # 発展
  - '2*4+2*6+4*6 == 44 and 144 == 56+2*44'
  - 'sum([2,2,8,8]) == sum([2,4,4,10]) == 20 and sum(x*x for x in [2,2,8,8]) == sum(x*x for x in [2,4,4,10]) == 136 and 136-4*5**2 == 36'
  - '3**2+(-3)**2 == 18 and (3-3)**2 == 0 and 3*(-3) == -9 and 18-0/2 == 18'
  - '(lambda xs: sum(x*x for x in xs)-3*(sum(xs)/3)**2)([100000001.0,100000002.0,100000003.0]) == 0.0 and (lambda xs: sum((x-sum(xs)/3)**2 for x in xs))([100000001.0,100000002.0,100000003.0]) == 2.0 and (lambda xs: sum(x*x for x in xs)-3*(sum(xs)/3)**2)([1.0,2.0,3.0]) == 2.0'
  # 創造
  - 'fact(7) == 5040 and 5040/12 == 420 and comb(7,3) == 35 and 7 < 12 < 35 and 3*4 == 12 and 12-7 == 5'
