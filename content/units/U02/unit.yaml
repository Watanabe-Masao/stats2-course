id: U02
number: "02"
title: 関数・総和記号・階乗
domain: D0
reference_section: ② 確率
prev: U01
next: U03
prereq: [U01]
used_by: [U06, U07, U09, U13, U29]
terms: [TERM-sigma, TERM-fact, TERM-dev]
labs: [LAB-sigma]
goal: 統計の式に出てくる関数 f(x)・添字 xᵢ・Σ（全部足す）・n!（階乗）を、**具体的な足し算・掛け算に書き下して計算できる**。
stage_goals:
  S1: 「Σx² と (Σx)² は違う。なぜなら〜」「偏差の合計は0。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、Σx・Σx²・偏差平方和・n!・f(x) を書き下して計算できる。間違えた所だけ初学に戻る。
  S3: 問題文に「書き下せ」とは書いていない。**記号を見たら、何を何回足すか・掛けるかを自分で書き下してから計算する**。Σの計算ルールで式を変形できる。
  S4: 表計算の関数（SUM・SUMSQ・FACT）、平均・分散・組合せ・期待値・回帰の式でも、「書き下してから計算する」形は同じ。
  S5: 2級には直接出ない。1からnまでの和の公式、Π（総積）と対数、二重のΣ、階乗の大きさ。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→限界を書く**の順に進める。
evidence:
  S1: 2, 4, 6 で Σx²・(Σx)²・偏差平方和を書き下し、違いを理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 記号を書き下してから計算し、Σの計算ルールで式を変形できた
  S4: 表計算の関数や統計の式を、Σ・階乗で読めた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 記号の読み方・例題A：2, 4, 6
  - 'sum([2,4,6]) == 12 and Fraction(12,3) == 4 and sum(x*x for x in [2,4,6]) == 56 and 12**2 == 144 and sum((x-4)**2 for x in [2,4,6]) == 8'
  - '[(x-4)**2 for x in [2,4,6]] == [4,0,4] and [x*x for x in [2,4,6]] == [4,16,36]'
  - 'math.factorial(4) == 24 and 4*3*2*1 == 24'
  # 実験：3, 5, 10
  - 'Fraction(3+5+10, 3) == 6 and [x-6 for x in [3,5,10]] == [-3,-1,4] and sum(x-6 for x in [3,5,10]) == 0'
  # 実験のラボなしで：1, 2, 9
  - 'Fraction(1+2+9, 3) == 4 and [x-4 for x in [1,2,9]] == [-3,-2,5] and sum(x-4 for x in [1,2,9]) == 0'
  # 前提チェック
  - '3 + 5 + 7 == 15 and 2*3 + 1 == 7 and 3**2 == 9 and 4*3*2*1 == 24'
  # 計算ルール（2, 4, 6）
  - '3*12 == 36 and 12 + 3*1 == 15 and 3*5 == 15 and 56 - 3*4**2 == 8 and 3*4**2 == 48'
  # 発展：1からnまでの和、階乗の大きさ
  - 'sum(range(1,101)) == 5050 and 100*101//2 == 5050 and math.factorial(10) == 3628800 and math.factorial(52) > 10**67'
  # 発展：Π と対数（1.1, 1.2）
  - 'abs(1.1*1.2 - 1.32) < 1e-12 and abs(math.log(1.32) - (math.log(1.1) + math.log(1.2))) < 1e-12'
  # 二重のΣ
  - 'sum(i*j for i in [1,2] for j in [1,2,3]) == 18 and sum([1,2])*sum([1,2,3]) == 18'
  # 転用の読み取り：n＝5・r＝2
  - '5*4 == 20 and Fraction(20, math.factorial(2)) == 10 and math.comb(5,2) == 10'
