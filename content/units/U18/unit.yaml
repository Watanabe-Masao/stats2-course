  # 初学のラボ s1-se（16個）と、発展の警告の例
  - '12/math.sqrt(16) == 3 and 12/math.sqrt(64) == 1.5'
  - '1500/math.sqrt(900) == 50 and abs(math.sqrt(50**2+50**2) - 71) < 0.5 and abs(100/math.sqrt(50**2+50**2) - 1.4) < 0.05'
  - 'math.isclose(0.25/0.025**2, 400) and math.isclose(0.16/0.025**2, 256)'
