  # 発展：まとまりの効き方
  - '1500/math.sqrt(400) == 75 and math.isclose(1+(20-1)*0.05, 1.95) and abs(math.sqrt(1.95) - 1.40) < 0.005 and abs(75*math.sqrt(1.95) - 105) < 0.5 and 20*20 == 400'
