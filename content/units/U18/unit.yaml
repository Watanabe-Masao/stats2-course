id: U18
number: "18"
title: 標本平均・標本分散の性質
domain: D4
reference_section: ④ 標本分布
prev: U17
next: U19
prereq: [U13, U17, U07]
used_by: [U19, U20, U21, U22, U24, U31]
terms: [TERM-sampdist, TERM-se, TERM-statistic, TERM-unbvar, TERM-var, TERM-sample-mean]
labs: [LAB-xbar]
goal: n 個の平均や比率が、取り直すたびにどれくらいぶれるか（**標準誤差 σ÷√n・√(p(1−p)÷n)**）を出し、1個ずつのばらつき（標準偏差）と区別できる。母分散の推定に n−1 で割る理由を説明できる。
stage_goals:
  S1: 「36個の平均のぶれは2g。なぜなら〜」「1個ずつのばらつきは12gのまま。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、平均と比率の標準誤差を出し、標準偏差との違いと n−1 で割る理由を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「標準誤差」とは書いていない。**聞かれているのが「1つの値」か「平均・比率」かを決め、n と σ（または p）と独立を確かめてから計算する**。
  S4: 客単価・アンケート・抜き取り・月の平均売上のように、場面が違っても「平均の差を SE と比べる」形は同じ。
  S5: 統計検定の枠の外。n−1 の理由、シミュレーション、正規母集団での x̄ と s² の独立、比率と二項分布。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 平均と比率の標準誤差を出し、標準偏差との違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 1つの値か平均かを見分け、必要な人数・個数を逆算できた
  S4: 売場の平均・比率の差を、SE と比べて説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 前提チェック
  - '4+4 == 8 and math.sqrt(36) == 6 and 12/math.sqrt(9) == 4'
  # 例題A
  - '12/math.sqrt(9) == 4 and 12/math.sqrt(36) == 2 and 12/math.sqrt(144) == 1 and math.isclose(0.2*0.8/100, 0.0016) and math.isclose(math.sqrt(0.0016), 0.04) and math.isclose(2*0.04, 0.08)'
  # 入口：1g は SE（2g）の半分
  - 'math.isclose(51-50, 1) and math.isclose(1/(12/math.sqrt(36)), 0.5)'
  # 実験：(1,5) の v と s²、(n−1)/n
  - '(1-3)**2+(5-3)**2 == 8 and 8/2 == 4 and 8/1 == 8 and math.isclose((2-1)/2, 0.5) and math.isclose((4-1)/4, 0.75)'
  # 図を再現：幅1/6
  - 'math.isclose(2/12, 1/6)'
  # 転用の読み取り・仕事の場面
  - '1200/math.sqrt(400) == 60 and 1200/math.sqrt(100) == 120 and math.isclose(math.sqrt(0.6*0.4/150), 0.04) and 4/math.sqrt(16) == 1'
  - 'math.isclose(0.05/2, 0.025) and math.isclose(0.25/0.025**2, 400) and math.isclose(0.16/0.025**2, 256)'
  # 創造：内容量の上乗せ
  - 'abs(1.96*2 - 3.9) < 0.05 and abs(1.96*1 - 2) < 0.05'
