id: U18
number: "18"
title: 標本平均・標本分散の性質
domain: D4
recall_group: 標本分布・極限
prev: U17
next: U19
prereq: [U13, U17, U07]
used_by: [U19, U20, U21, U22, U24, U31]
terms: [TERM-sampdist, TERM-se, TERM-statistic, TERM-unbvar, TERM-var, TERM-sample-mean]
labs: [LAB-xbar]
concepts_linked: true
goal: n 個の平均や比率が、取り直すたびにどれくらいばらつくか（**標準誤差 σ÷√n・√(p(1−p)÷n)**）を出し、1個ずつのばらつき（標準偏差）と区別できる。母分散の推定に n−1 で割る理由を説明できる。
stage_goals:
  S1: 「36個の平均のばらつきは2g。なぜなら〜」「1個ずつのばらつきは12gのまま。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、平均と比率の標準誤差を出し、標準偏差との違いと n−1 で割る理由を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「標準誤差」とは書いていない。**聞かれているのが「1つの値」か「平均・比率」かを決め、n と σ（または p）と独立を確かめてから計算する**。
  S4: 客単価・アンケート・抜き取り・月の平均売上のように、場面が違っても「平均の差を SE と比べる」形は同じ。
  S5: 統計検定の枠の外。なぜ n−1 で割るのか、「平均±標準誤差」の書き方で何が消えるか、値どうしが似ていると σ÷√n がどう崩れるかを、自分の言葉で説明できる。興味のある節を1つ選べばよい。
  S6: 答えが1つに決まらない探究。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えることと解釈を切り分ける**。解釈は2つ以上並べ、正解を決めない。
evidence:
  S1: 平均と比率の標準誤差を出し、標準偏差との違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 1つの値か平均かを見分け、必要な人数・個数を逆算できた
  S4: 売場の平均・比率の差を、SE と比べて説明できた
  S5: 1つ選んで、なぜそうなるかを説明した（任意）
  S6: 探究か課題を1つ行い、統計で言えることと解釈を分けて書いた（任意）
