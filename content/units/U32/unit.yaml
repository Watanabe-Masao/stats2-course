id: U32
number: "32"
title: 実験計画・分散分析
domain: D8
reference_section: ⑧ 調査と実験
prev: U31
prereq: [U07, U20, U24, U25]
used_by: []
terms: [TERM-randomize, TERM-confound, TERM-anova, TERM-ms, TERM-f, TERM-df, TERM-multcomp]
labs: [LAB-doe]
goal: 計算の前に比べ方を設計し（無作為化・反復・局所管理）、交絡を見抜き、3つ以上の群の平均の差を一元配置の分散分析（群間と群内の平方和・平均平方・F）で判断し、統計の結論と採用の判断を分けて書ける。
stage_goals:
  S1: 「施策をくじで割り当てるのは〜を防ぐため」「F は群の平均のずれを〜と比べた量」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、3原則を言い、分散分析表を作って F で判断できる。間違えた所だけ初学に戻る。
  S3: 問題文に「交絡」とは書いていない。**比べ方と割り当てた単位を確かめ、交絡を疑い、分散分析表を作り、F で判断し、どの組かは比べた数を考えて言う**。
  S4: チラシ案・陳列案・新しいレジ・多くの売場のように、場面が違っても「割り当てを設計し、群間と群内を比べる」形は同じ。
  S5: 統計検定の枠の外。交互作用、なぜくじで割り当てるのか、前提が崩れると何が揺れるか、比べた組の数から、平均の差1つで何が消えるかを考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 3原則と交絡を説明し、例題の分散分析表を作って F で判断できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 割り当ての問題と多重比較を判断し、分散分析で結論を書けた
  S4: 施策の比較を、設計・分散分析・採用の判断に分けて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
