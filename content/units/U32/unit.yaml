id: U32
number: "32"
title: 実験計画・分散分析
domain: D8
recall_group: 調査・実験
prev: U31
prereq: [U07, U20, U24, U25]
used_by: []
terms: [TERM-randomize, TERM-confound, TERM-anova, TERM-ms, TERM-f, TERM-df, TERM-multcomp]
labs: [LAB-doe]
goal: 計算の前に比べ方を設計し（無作為化・反復・局所管理）、交絡を見抜き、3つ以上の群の平均の差を一元配置の分散分析（群間と群内の平方和・平均平方・F）で判断し、統計の結論と採用の判断を分けて書ける。
stage_goals:
  S1: 「施策をくじで割り当てるのは〜を防ぐため」「F は群の平均のずれを〜と比べた量」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、3原則を言い、分散分析表を作って F で判断できる。間違えた所だけ初学に戻る。
  S3: 問題文に「交絡」とは書いていない。**比べ方と割り当てた単位を確かめ、交絡を疑い、分散分析表を作り、F で判断し、どの組かは比べた数を考えて言う**。
  S4: チラシ案・陳列案・新しいレジ・多くの売場のように、場面が違っても「割り当てを設計し、群間と群内を比べる」形は同じ。
  S5: 統計検定の枠の外。群の平均以外を真ん中にすると平方和が分かれない理由、F が同じでも「どの群がずれたか」が消えること、くじで割り当てても店どうしが影響し合うと崩れる前提、店の数が群で違うと等分散の崩れが効くこと。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。規模の組でくじを引いた実験を、**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に読み、組を無視した分散分析と組の中の差を比べ、次の実験の組の作り方を選ぶ。
evidence:
  S1: 3原則と交絡を説明し、例題の分散分析表を作って F で判断できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 割り当ての問題と多重比較を判断し、分散分析で結論を書けた
  S4: 施策の比較を、設計・分散分析・採用の判断に分けて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
figures:
  - id: FIG-U32-concept
    caption: 3つの陳列（各3店）の売上の増加。太い線が群の平均と全体の平均のずれ（群間）、細い点線が各店と群の平均のずれ（群内）
    spec:
      type: dev
      grand: true
      step: 1
      title: 全体の平方和を、群間と群内に分ける
      rows:
        - {label: 陳列 A, data: [4, 5, 6]}
        - {label: 陳列 B, data: [6, 7, 8]}
        - {label: 陳列 C, data: [8, 9, 10]}
  - id: FIG-U32-randomize
    caption: 同じ100店。無作為抽出は、調べる店をくじで選ぶ。無作為化は、全部の店をくじで2つの群に分ける
    spec:
      type: grid
      rows: 10
      cols: 10
      title: くじで「誰を調べるか」を決めるか、「誰にどの処理をするか」を決めるか
      panels:
        - {label: 無作為抽出, pick: srs}
        - {label: 無作為化, pick: half, rest: true}
      row_label: 1升が1店。左は塗った升が調べる店（10店）。右は濃い升が施策の群、薄い升が施策なしの群（50店ずつ）
      note: 無作為抽出は、標本から母集団へ広げるためのくじ。無作為化は、群の違いに、処理の前からの性質の差が一方に偏って混ざらないようにするくじ
concepts_linked: true
