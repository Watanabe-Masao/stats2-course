id: U12
number: "12"
title: 全確率・ベイズの定理
domain: D2
reference_section: ② 確率
prev: U11
next: U13
prereq: [U11, U10]
used_by: [U13]
terms: [TERM-bayes, TERM-prior, TERM-likelihood, TERM-cond]
labs: [LAB-prob]
goal: 「検品で引っかかった品が本当に不良である確率は？」のように、結果から原因を逆にたどる確率を、**全確率で分母を作って求められ**、元の割合（事前確率）が結果を大きく変えることを説明できる。
stage_goals:
  S1: 「検出率が90%でも、引っかかった品の不良率は約27%。なぜなら〜」を、1000個で数えた内訳を使って自分の言葉で言えれば完了。
  S2: 資料を見ずに、1000で数える方法と式の両方で、全確率とベイズの定理を使える。間違えた所だけ初学に戻る。
  S3: 問題文に「ベイズの定理を使え」とは書いていない。**「〇〇だったとき、それが△△である確率」から、結果と原因を見分け、3つの割合（元の割合・該当→結果・非該当→結果）を問題文から拾う**。
  S4: 仕入先・販促メール・不正検知・予報のように、場面が違っても「元の割合×結果が出る率を経路ごとに出し、目当て÷全経路」は同じ形で使える。
  S5: 2級には直接出ない。事後確率を次の事前確率にする更新、オッズと尤度比、元の割合を無視する誤り、ベイズ統計。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 1000個で数えて事後確率を出し、検出率と違う理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から原因・結果と3つの割合を拾い、P(結果｜原因) と P(原因｜結果) を区別できた
  S4: 売場や業務の場面で、引っかかったもののうち本当に当てはまる割合を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
