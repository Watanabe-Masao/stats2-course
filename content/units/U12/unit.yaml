id: U12
number: "12"
title: 全確率・ベイズの定理
domain: D2
recall_group: 確率
prev: U11
next: U13
prereq: [U11, U10]
used_by: [U13]
terms: [TERM-bayes, TERM-prior, TERM-likelihood, TERM-cond, TERM-posterior, TERM-total-prob]
labs: [LAB-prob]
concepts_linked: true
goal: 「検品で引っかかった品が本当に不良である確率は？」のように、結果から原因を逆にたどる確率を、**全確率で分母を作って求められ**、元の割合（事前確率）が結果を大きく変えることを説明できる。
stage_goals:
  S1: 「検出率が90%でも、引っかかった品の不良率は約27%。なぜなら〜」を、1000個で数えた内訳を使って自分の言葉で言えれば完了。
  S2: 資料を見ずに、1000で数える方法と式の両方で、全確率とベイズの定理を使える。間違えた所だけ初学に戻る。
  S3: 問題文に「ベイズの定理を使え」とは書いていない。**「〇〇だったとき、それが△△である確率」から、結果と原因を見分け、3つの割合（元の割合・該当→結果・非該当→結果）を問題文から拾う**。
  S4: 仕入先・販促メール・不正検知・予報のように、場面が違っても「元の割合×結果が出る率を経路ごとに出し、目当て÷全経路」は同じ形で使える。
  S5: 統計検定の枠の外。なぜ結果が出るすべての道すじで割るのか、検出率1つの数で何が消えるか、2回の検査が独立でないと更新がどう狂うかを、自分の言葉で説明できる。興味のある節を1つ選べばよい。
  S6: 答えが1つに決まらない探究。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えることと解釈を切り分ける**。解釈は2つ以上並べ、正解を決めない。
evidence:
  S1: 1000個で数えて事後確率を出し、検出率と違う理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から原因・結果と3つの割合を拾い、P(結果｜原因) と P(原因｜結果) を区別できた
  S4: 売場や業務の場面で、引っかかったもののうち本当に当てはまる割合を説明できた
  S5: 1つ選んで、なぜそうなるかを説明した（任意）
  S6: 探究か課題を1つ行い、統計で言えることと解釈を分けて書いた（任意）
figures:
  - id: FIG-U12-concept
    caption: 不良率2%・検出率90%・誤検出率5%の検品を1000個で数える樹形図。検出ありは 18＋49＝67個（全確率）。そのうち不良は 18÷67≒27%（事後確率）で、誤検出の 49個が多数を占める。
    spec:
      type: count_tree
      n: 1000
      prior: 0.02
      sens: 0.9
      fpr: 0.05
status: drafted
version: 1
