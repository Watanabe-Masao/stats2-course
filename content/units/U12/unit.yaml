  - '1000*Fraction(2,100) == 20 and 1000 - 20 == 980 and 20*Fraction(90,100) == 18 and 980*Fraction(5,100) == 49 and 18 + 49 == 67'
  - 'Fraction(2,100)*Fraction(90,100) == Fraction(18,1000) and Fraction(98,100)*Fraction(5,100) == Fraction(49,1000) and Fraction(18,1000)+Fraction(49,1000) == Fraction(67,1000)'
  - 'abs(18/67 - 0.269) < 0.0005 and abs(18/67*100 - 26.9) < 0.05 and abs(18/67*100 - 27) < 0.5'
  # 前提チェック
  - 'Fraction(2,100)*1000 == 20 and Fraction(2,100)*Fraction(90,100) == Fraction(18,1000) and Fraction(2,5)*Fraction(1,4) + Fraction(3,5)*Fraction(2,4) == Fraction(2,5)'
  # 実験：誤検出率を1%に
  - '980*Fraction(1,100) == Fraction(98,10) and abs(18/(18+9.8)*100 - 64.7) < 0.05 and abs(18/(18+9.8)*100 - 65) < 0.5'
  # 応用：元の割合0.5%（1000個で 5個・995個）
  - 'abs(5*0.9 - 4.5) < 1e-12 and abs(995*0.05 - 49.75) < 1e-12'
  # 発展：オッズ
  - 'Fraction(90,100)/Fraction(5,100) == 18 and Fraction(2,98)*18 == Fraction(36,98) and Fraction(36,36+98) == Fraction(18,67)'
  # 復習：図の再現（見逃し・正しく通過）
  - '20 - 18 == 2 and 980 - 49 == 931'
  # 転用の読み取り：販促メール
  - 'abs(0.05*0.6/(0.05*0.6+0.95*0.2)*100 - 14) < 0.5 and abs(0.2*0.6/(0.2*0.6+0.8*0.2)*100 - 43) < 0.5 and abs(0.05*0.6/(0.05*0.6+0.95*0.05)*100 - 39) < 0.5'
  # 創造：再検査
  - 'abs(16.2/18.65*100 - 87) < 0.5 and abs(49*0.05 - 2.45) < 1e-9 and abs(18*0.1 - 1.8) < 1e-9 and 67 - 18 == 49'
