id: U28
number: "28"
title: 共分散・相関係数と散布図
domain: D7
reference_section: ⑦ 相関・回帰
prev: U27
next: U29
prereq: [U07, U13]
used_by: [U29, U30, U32]
terms: [TERM-scatter, TERM-dev, TERM-cov, TERM-corr, TERM-partial-corr, TERM-spurious]
labs: [LAB-corr]
goal: 散布図を平均の十字で4つに分けて偏差の積の符号を読み、共分散と相関係数を計算し、単位・外れ値・層・範囲・共通の原因で r がどう変わるかを、点を動かして確かめながら説明できる。
stage_goals:
  S1: 「右上と左下に点が多いと r は正。なぜなら〜」「r＝0 でも関係がないとは言えない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、共分散と相関係数を計算し、単位を変えたときの変化を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「擬相関」とは書いていない。**散布図の形を確かめ、r を計算し、外れ値・層・範囲・共通の原因を疑い、因果と書かずに結論を書く**。
  S4: 広告費と売上・客数と客単価・気温と売上のように、場面が違っても「散布図 → r → 落とし穴を確かめる」形は同じ。
  S5: 統計検定の枠の外。偏相関の読み方、相関行列、順位の相関から、相関という1つの数で何が消えるかを考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 例題の共分散と r を計算し、点を動かして r の変わり方を説明できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 外れ値・層・範囲・偏相関を判断し、因果と区別して書けた
  S4: 売場の2つの指標の関係を、散布図と r で報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
