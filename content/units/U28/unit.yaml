    spec:
      type: scatter
      show: cov
      unbiased: true
      title: 平均の十字で分けると、偏差の積の符号が見える
      points: [[1, 3], [2, 5], [3, 4], [4, 6], [5, 7]]
      x: {label: 広告回数 x, lo: 1, hi: 5, step: 1}
      y: {label: 来店者数 y（百人）, lo: 3, hi: 7, step: 1}
      note: 十字の線の上の点（2, 5）（3, 4）は、偏差の積が0で、長方形にならない
