id: U07
number: "07"
title: 分散・標準偏差・変動係数
domain: D1
recall_group: 要約（代表値・ばらつき）
prev: U06
next: U08
prereq: [U06, U02]
used_by: [U08, U13, U18, U21, U28, U29, U32]
terms: [TERM-dev, TERM-data-var, TERM-var, TERM-unbvar, TERM-data-sd, TERM-sd, TERM-cv, TERM-iqr, TERM-mean, TERM-range]
labs: [LAB-spread]
goal: 「どちらが安定している？」と聞かれたとき、**分散・標準偏差でばらつきを数で示し、平均の大きさが違うものは変動係数で比べられる**。n で割るか n−1 で割るかを目的で選べる。
stage_goals:
  S1: 「売場AもBも平均10個だが、Bは±5個ほどばらつく。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに偏差平方和・分散・標準偏差・変動係数を計算し、n と n−1 の使い分けを言える。間違えた所だけ初学に戻る。
  S3: 問題文に「変動係数を使え」とは書いていない。**何のばらつきを、何と比べたいか（単位・平均の大きさ・記述か推定か）から指標を自分で選ぶ**。
  S4: 品質管理・投資・気温・所得でも、「ばらつきは偏差の2乗で測る」「平均が違えば相対的に比べる」「偏りはジニ係数で見る」は同じ形で使える。
  S5: 統計検定の枠の外。なぜずれを2乗するか、標準偏差で何が消えるか、合わせたばらつきが和にならないとき。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 売場A・Bのばらつきを分散・標準偏差で比べ、理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 目的からばらつきの指標を選び、その指標で言えないことも書けた
  S4: 別の場面のデータで、ばらつき・相対的なばらつき・偏りを説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
concepts_linked: true
status: drafted
version: 1
figures:
  - id: FIG-U07-cov
    caption: 売場A（横）と売場C（縦）の同じ日の販売数。平均の点からの偏差の積を長方形にした。同じ向きに動く5日では、長方形がみな正の側に来る
    spec:
      type: scatter
      show: cov
      title: 2つの量が一緒に動く分は、偏差の積の平均（共分散）で測る
      points: [[8, 18], [9, 19], [10, 20], [11, 21], [12, 22]]
      x: {label: 売場A（個）, lo: 8, hi: 12, step: 2}
      y: {label: 売場C（個）, lo: 18, hi: 22, step: 2}
      note: 売場A を A 自身と組にすると、偏差の積の平均は A の分散になる
  - id: FIG-U07-spread
    caption: 売場A・Bの5日間の販売数。点線の長さが偏差（値−平均）。平均は同じ10個でも、Bは点線が長く、偏差平方和は9倍
    spec:
      type: dev
      rows:
        - {label: 売場A（個）, data: [8, 9, 10, 11, 12]}
        - {label: 売場B（個）, data: [4, 7, 10, 13, 16]}
      step: 2
      note: 偏差を足すとどちらも0。2乗して足すと、ばらつきの違いが数になる。
checks:
  # 発展：A と C を合わせた10日の偏差平方和の分かれ方
  - 'sum((x-15)**2 for x in [8,9,10,11,12,18,19,20,21,22]) == 270 and 5*(10-15)**2 + 5*(20-15)**2 == 250 and 10 + 10 + 250 == 270 and 10 + 5*(10-15)**2 == 135 and sum(abs(x-15) for x in [8,9,10,11,12,18,19,20,21,22]) == 50 and 6 + 6 + 5*5 + 5*5 == 62'
  # 発展：商品X・Y（平均10・分散4）、2店の合計の分散（同じ向き8・逆の向き0）
  - 'statistics.pvariance([9,9,9,9,14]) == 4 and statistics.pvariance([6,11,11,11,11]) == 4 and statistics.mean([9,9,9,9,14]) == 10 and statistics.pvariance([26,28,30,32,34]) == 8 and statistics.pvariance([30,30,30,30,30]) == 0 and statistics.pvariance([8,9,10,11,12]) == 2'
  # 説明してみる：商品P・Q
  - 'statistics.mean([18]*7 + [30]) == 19.5 and statistics.mean([21]*7 + [9]) == 19.5 and abs(statistics.pstdev([18]*7 + [30]) - 3.97) < 0.005 and abs(19.5 + 2*statistics.pstdev([18]*7 + [30]) - 27.4) < 0.05 and abs(27.4 - 21 - 6.4) < 1e-9'
  # 創造：CV と偶然の目安
  - 'abs(20/196 - 0.10) < 0.005 and Fraction(12, 100) == Fraction(12, 100) and Fraction(6, 25) == Fraction(24, 100) and 14*14 == 196 and 10*10 == 100 and 5*5 == 25 and abs(1/14 - 0.07) < 0.005 and abs(20/14 - 1.43) < 0.005 and Fraction(12, 10) == Fraction(6, 5)'
  - 'abs((400-196)/196**2 - 0.0053) < 0.0001 and Fraction(144-100, 100**2) == Fraction(44, 10000) and abs((36-25)/25**2 - 0.018) < 0.0005 and abs(1.2**2 - 1.44) < 1e-9'
  # 例題A：売場B
  - 'sum([4,7,10,13,16]) == 50 and Fraction(50,5) == 10 and [x-10 for x in [4,7,10,13,16]] == [-6,-3,0,3,6] and sum((x-10)**2 for x in [4,7,10,13,16]) == 90'
  - 'Fraction(90,5) == 18 and Fraction(90,4) == Fraction(45,2) and abs(22.5**0.5 - 4.74) < 0.005 and abs(4.74/10 - 0.47) < 0.005'
  # 売場A
  - 'sum((x-10)**2 for x in [8,9,10,11,12]) == 10 and Fraction(10,4) == Fraction(5,2) and abs(2.5**0.5 - 1.58) < 0.005 and abs(1.58/10 - 0.16) < 0.005 and Fraction(90,10) == 9'
  # 実験：2倍で4倍、ラボなしで5を足す
  - 'sum((2*x-20)**2 for x in [4,7,10,13,16]) == 360 and Fraction(360,4) == 90 and sum(((x+5)-15)**2 for x in [4,7,10,13,16]) == 90'
  # 前提チェック
  - 'Fraction(2+4+6, 3) == 4 and (-3)**2 == 9 and 25**0.5 == 5'
  # 実験の観察：b＝3 で分散9倍
  - 'Fraction(22.5)*9 == Fraction(405,2) and abs(90**0.5 - 9.49) < 0.005'
  # 復習：近道
  - '16+49+100+169+256 == 590 and Fraction(50**2, 5) == 500 and 590 - 500 == 90'
  # 変換：円→千円
  - 'Fraction(1,1000)**2 == Fraction(1,1000000)'
