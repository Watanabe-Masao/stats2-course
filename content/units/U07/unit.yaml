id: U07
number: "07"
title: 分散・標準偏差・変動係数
domain: D1
reference_section: ① データの記述
prev: U06
next: U08
prereq: [U06, U02]
used_by: [U08, U18, U21]
terms: [TERM-dev, TERM-var, TERM-unbvar, TERM-sd, TERM-cv, TERM-iqr]
labs: [LAB-spread]
goal: 「どちらが安定している？」と聞かれたとき、**分散・標準偏差で散らばりを数で示し、平均の大きさが違うものは変動係数で比べられる**。n で割るか n−1 で割るかを目的で選べる。
stage_goals:
  S1: 「売場AもBも平均10個だが、Bは±5個ほどぶれる。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに偏差平方和・分散・標準偏差・変動係数を計算し、n と n−1 の使い分けを言える。間違えた所だけ初学に戻る。
  S3: 問題文に「変動係数を使え」とは書いていない。**何の散らばりを、何と比べたいか（単位・平均の大きさ・記述か推定か）から指標を自分で選ぶ**。
  S4: 品質管理・投資・気温・所得でも、「散らばりは偏差の2乗で測る」「平均が違えば相対的に比べる」「偏りはジニ係数で見る」は同じ形で使える。
  S5: 2級には直接出ない。n−1 で割る理由（期待値）、標準偏差の偏り、平均絶対偏差、チェビシェフの不等式、ジニ係数の流儀。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 売場A・Bの散らばりを分散・標準偏差で比べ、理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 目的から散らばりの指標を選び、その指標で言えないことも書けた
  S4: 別の場面のデータで、散らばり・相対的なばらつき・偏りを説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
figures:
  - id: FIG-U07-spread
    caption: 売場A・Bの5日間の販売数。点線の長さが偏差（値−平均）。平均は同じ10個でも、Bは点線が長く、偏差平方和は9倍
    spec:
      type: dev
      rows:
        - {label: 売場A（個）, data: [8, 9, 10, 11, 12]}
        - {label: 売場B（個）, data: [4, 7, 10, 13, 16]}
      step: 2
      note: 偏差を足すとどちらも0。2乗して足すと、散らばりの違いが数になる。
checks:
  # 例題A：売場B
  - 'sum([4,7,10,13,16]) == 50 and Fraction(50,5) == 10 and [x-10 for x in [4,7,10,13,16]] == [-6,-3,0,3,6] and sum((x-10)**2 for x in [4,7,10,13,16]) == 90'
  - 'Fraction(90,5) == 18 and Fraction(90,4) == Fraction(45,2) and abs(22.5**0.5 - 4.74) < 0.005 and abs(4.74/10 - 0.47) < 0.005'
  # 売場A
  - 'sum((x-10)**2 for x in [8,9,10,11,12]) == 10 and Fraction(10,4) == Fraction(5,2) and abs(2.5**0.5 - 1.58) < 0.005 and abs(1.58/10 - 0.16) < 0.005 and Fraction(90,10) == 9'
  # 実験：2倍で4倍、ラボなしで5を足す
  - 'sum((2*x-20)**2 for x in [4,7,10,13,16]) == 360 and Fraction(360,4) == 90 and sum(((x+5)-15)**2 for x in [4,7,10,13,16]) == 90'
  # 前提チェック
  - 'Fraction(2+4+6, 3) == 4 and (-3)**2 == 9 and 25**0.5 == 5'
  # 実験の観察：b＝3 で分散9倍
  - 'Fraction(22.5)*9 == Fraction(405,2) and abs(90**0.5 - 9.49) < 0.005'
  # 復習：近道
  - '16+49+100+169+256 == 590 and Fraction(50**2, 5) == 500 and 590 - 500 == 90'
  # 変換：円→千円
  - 'Fraction(1,1000)**2 == Fraction(1,1000000)'
  # 発展1：E[v]＝(n−1)/n×σ²（2,4,6,8,10、n＝2）
  - 'Fraction(sum((x-6)**2 for x in [2,4,6,8,10]), 5) == 8 and Fraction(1,2)*8 == 4'
  # 発展3：平均絶対偏差（売場B）、発展4：チェビシェフ
  - 'Fraction(6+3+0+3+6, 5) == Fraction(18,5) and 1 - Fraction(1, 2**2) == Fraction(3,4) and 1 - Fraction(1, 3**2) == Fraction(8,9)'
