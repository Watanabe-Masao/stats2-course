id: U06
number: "06"
title: 平均・中央値・最頻値・分位点
domain: D1
reference_section: ① データの記述
prev: U05T
next: U07
prereq: [U05, U05T]
used_by: [U07, U13]
terms: [TERM-median, TERM-mode, TERM-quartile, TERM-outlier, TERM-geomean, TERM-expect]
labs: [LAB-center]
goal: 「代表的な値はいくつ？」と聞かれたとき、**分布の形と目的（典型的な値か、合計か）に合わせて平均・中央値・最頻値を選び**、件数の違うグループは重み付き平均でまとめられる。
stage_goals:
  S1: 「10人の購入額は平均4千円だが、典型的な客は2〜3千円。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに3つの代表値と重み付き平均を計算し、どれを使うかを理由つきで言える。間違えた所だけ初学に戻る。
  S3: 問題文に「中央値を使え」とは書いていない。**何を伝えたいか（典型値・合計・売れ筋）と分布の形から、代表値を自分で選ぶ**。
  S4: 年収・待ち時間・客単価・速さでも、「典型値は中央値、合計は平均、売れ筋は最頻値」「件数が違えば重みを付ける」「率や速さは平均の種類を選ぶ」は同じ形で使える。
  S5: 2級には直接出ない。平均と中央値が「何を最小にする値か」、トリム平均、期待値とのつながり、分位点の求め方の違い、3つの平均の大小。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 10人の購入額の3つの代表値を求め、どれを使うかを理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 目的と分布の形から代表値を選び、その代表値で言えないことも書けた
  S4: 別の場面のデータで、代表値と平均の種類を選んで説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 例題A：10人の購入額
  - 'sum([1,1,2,2,2,3,3,4,5,17]) == 40 and Fraction(40,10) == 4 and statistics.median([1,1,2,2,2,3,3,4,5,17]) == 2.5 and statistics.mode([1,1,2,2,2,3,3,4,5,17]) == 2'
  - 'sum(1 for x in [1,1,2,2,2,3,3,4,5,17] if x < 4) == 7 and 4*10 == 40'
  # 実験：17を40に、ラボなしで17を7に
  - 'Fraction(40 - 17 + 40, 10) == Fraction(63,10) and Fraction(40 - 17 + 7, 10) == 3 and statistics.median([1,1,2,2,2,3,3,4,5,7]) == 2.5'
  # 前提チェック
  - 'sorted([7,3,9,1]) == [1,3,7,9] and Fraction(3+7, 2) == 5 and 2+4+6+8 == 20'
  # 復習：分位点（10人の購入額）
  - 'statistics.median([1,1,2,2,2]) == 2 and statistics.median([3,3,4,5,17]) == 4'
  # 応用：年収600万円の言い直し（数値は問題文のみ）、度数表は問題側
  # 発展1：平均は二乗の和、中央値は絶対値の和を最小にする（1,2,2,3,22）
  - 'min(range(0,30), key=lambda c: sum((x-c)**2 for x in [1,2,2,3,22])) == 6 and min(range(0,30), key=lambda c: sum(abs(x-c) for x in [1,2,2,3,22])) == 2'
  - 'sum((x-6)**2 for x in [1,2,2,3,22]) == 322 and sum((x-2)**2 for x in [1,2,2,3,22]) == 402 and sum(abs(x-2) for x in [1,2,2,3,22]) == 22 and sum(abs(x-6) for x in [1,2,2,3,22]) == 32'
  # 発展3：期待値（重み付き平均）
  - 'abs(0*0.2 + 1*0.5 + 2*0.3 - 1.1) < 1e-12'
  # 発展4：分位点の線形補間（1,1,2,2,2,3,3,4,5,17 の25%点）
  - 'abs(1 + 0.25*9 - 3.25) < 1e-12 and abs(2 + 0.25*(2-2) - 2) < 1e-12 and abs(3 + 0.75*(4-3) - 3.75) < 1e-12'
  # 発展5：3つの平均（2と8）
  - '(2+8)/2 == 5 and (2*8)**0.5 == 4 and Fraction(2, Fraction(1,2)+Fraction(1,8)) == Fraction(16,5)'
