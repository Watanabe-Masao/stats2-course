  - 'abs(0.135+0.271+0.271 - 0.677) < 1e-9 and abs(1-0.677 - 0.323) < 1e-9 and abs(1-5*math.exp(-2) - 0.323) < 0.0005 and abs(math.exp(-2)*100 - 14) < 0.5 and abs((1-5*math.exp(-2))*100 - 32) < 0.5'
  # 前提チェック
  - 'abs(math.exp(-2) - 0.135) < 0.0005 and fact(3) == 6 and math.isclose(10*0.3, 3)'
  # 実験：2時間で0件
  - 'abs(math.exp(-4) - 0.018) < 0.0005 and math.isclose(math.exp(-2)**2, math.exp(-4))'
  # 分布の早見・応用：負の二項
