id: U15
number: "15"
title: ポアソン分布・離散分布の判断
domain: D3
reference_section: ③ 確率分布
prev: U14
next: U16
prereq: [U14, U02, U09]
used_by: [U16, U27]
terms: [TERM-poisson, TERM-geom, TERM-hyper, TERM-binom, TERM-expect]
labs: [LAB-pois]
goal: 「何を数えているか」から、**二項・ポアソン・幾何・超幾何の中で使う分布を選べ**、「1時間に何件」の確率をポアソン分布で求められる。
stage_goals:
  S1: 「30分なら λ は1。なぜなら〜」「平均2件でも3件以上は約32%ある。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、何を数えているかで分布を選び、ポアソン・幾何・超幾何の確率と平均を求められる。間違えた所だけ初学に戻る。
  S3: 問題文に分布の名前は書いていない。**「n 回中」「1時間に」「初めて〜まで」「戻さずに」の言葉から、何を固定して何を数えるかを決め、分布を選ぶ**。
  S4: レジの応援基準・クレームの件数・抜き取り検査・待ち時間のように、場面が違っても「何を固定し、何を数えるか」で分布を決める形は同じ。
  S5: 統計検定の枠の外。待ち時間の指数分布、ポアソン分布の和、超幾何の補正、平均と分散の比べ方（過分散）。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: λ を区間に合わせ、0件・k 件以上の確率を求め、平均と違う理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から数えているものを見抜き、4つの分布を使い分けられた
  S4: 売場や検査の場面で、分布を選んで k 件以上・0件の確率を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
concepts_linked: true
status: drafted
version: 1
figures:
  - id: FIG-U15-concept
    caption: ポアソン分布（λ＝2）。1時間に平均2件。1件と2件がいちばん高く、右に裾が伸びる。▲の平均と分散はどちらも2。
    spec:
      type: dist
      family: poisson
      lam: 2
      kmax: 6
      unit: 件
      decimals: 2
      note: 上限はないが、6件より多い確率はごく小さい。平均 λ が大きくなると山が右へ動き、左右対称に近づく。
