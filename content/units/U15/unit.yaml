  # 転用の読み取り
  - 'abs(math.exp(-3) - 0.05) < 0.001 and abs(1-math.exp(-3)*(1+3+4.5+4.5+3.375) - 0.18) < 0.005 and abs(comb(18,4)/comb(20,4) - 0.63) < 0.005'
  # 発展：待ち時間の平均・ポアソンの和
  - 'math.isclose(60/2, 30) and math.isclose(math.exp(-3)*math.exp(-3), math.exp(-6))'
