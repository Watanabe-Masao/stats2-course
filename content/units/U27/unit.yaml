id: U27
number: "27"
title: 適合度・独立性のカイ二乗検定
domain: D6
reference_section: ⑥ 検定
prev: U26
next: U28
prereq: [U20, U24, U26]
used_by: [U28, U32]
terms: [TERM-gof, TERM-indep-test, TERM-expected, TERM-crosstab, TERM-chi2, TERM-df]
labs: [LAB-chisq]
goal: 件数の表から H₀ のもとでの期待度数（独立性は行計×列計÷総計、適合度は総数×比率）を作り、χ²＝Σ(O−E)²÷E を正しい自由度の点と比べて判断し、関連の向きを帯グラフ（行ごとの割合）で読める。
stage_goals:
  S1: 「期待度数は行計×列計÷総計。なぜなら独立なら〜」「χ² に割合を入れないのは〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、独立性・適合度の期待度数と自由度を出して χ² 検定ができる。間違えた所だけ初学に戻る。
  S3: 問題文に「独立性の検定」とは書いていない。**何の検定かを決め、件数で期待度数を作り、自由度（推定した母数も）を決め、期待度数の小ささを確かめて判断する**。
  S4: 店×満足度・レジの利用・会員×再来店・不良数の分布のように、場面が違っても「H₀ ならこうなるはず」とのずれを χ² にまとめる形は同じ。
  S5: 統計検定の枠の外。自由度の意味、2×2 の χ² と比率の z²、少ない件数の直接計算、どのセルが効いているか。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 2×2 の表と適合度で χ² 検定を行い、期待度数の作り方と件数で計算する理由を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 独立性か適合度かと自由度を判断し、期待度数の小さいセルに気づけた
  S4: クロス集計表を帯グラフと χ² で報告し、因果と区別できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
