id: U21
number: "21"
title: 点推定・不偏性・一致性
domain: D5
reference_section: ⑤ 推定
prev: U20
next: U22
prereq: [U07, U17, U18]
used_by: [U22, U31]
terms: [TERM-estimator, TERM-point-est, TERM-unbiased, TERM-consistency, TERM-unbvar, TERM-bias, TERM-efficiency, TERM-mse]
labs: [LAB-est]
goal: 推定量（計算のルール）と推定値（計算した数）を区別し、**不偏性**・**一致性**・**有効性**と **MSE＝分散＋偏り²** で推定量の良さを比べ、集め方の偏りは n を増やしても消えないことを説明できる。
stage_goals:
  S1: 「母分散の推定には7（n−1 で割る）を使う。なぜなら〜」「最初の1個は不偏だが一致しない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、不偏性・一致性・MSE を言い、v と s² を計算して使い分けられる。間違えた所だけ初学に戻る。
  S3: 問題文に「不偏か一致か」とは書いていない。**推定する母数と推定量を書き、期待値で不偏かを、n を大きくしたときで一致かを確かめ、MSE で比べ、集め方の偏りを確かめる**。
  S4: 平均客数・購入率・売上のばらつき・アンケートのように、場面が違っても「何を推定し、何が推定をずらすか」の形は同じ。
  S5: 統計検定の枠の外。MSE の分解と最小 MSE、s の偏り、有限母集団修正、最尤推定。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: v と s² を計算し、不偏性と一致性の違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 推定量の性質を確かめ、MSE と集め方の偏りで判断できた
  S4: 売場の推定値を、推定量・n・集め方とともに説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
