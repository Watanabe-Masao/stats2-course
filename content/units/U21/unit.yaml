    caption: 的の中心が母数、点が取り直した推定値。偏り（点の集まりの中心のずれ）とばらつき（点の散らばり）を分けて見る。MSE は両方を合わせた外れ方
    spec:
      type: targets
      items:
        - {label: ① 偏り小・ばらつき小, bias: 0, spread: 0, note: 不偏・MSE 小}
        - {label: ② 偏り大・ばらつき小, bias: 1, spread: 0, note: 不偏でない}
        - {label: ③ 偏り小・ばらつき大, bias: 0, spread: 1, note: 不偏・MSE 大}
        - {label: ④ 偏り大・ばらつき大, bias: 1, spread: 1, note: 不偏でない・MSE 大}
