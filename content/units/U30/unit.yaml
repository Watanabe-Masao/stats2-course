id: U30
number: "30"
title: 重回帰・係数の検定・決定係数
domain: D7
reference_section: ⑦ 相関・回帰
prev: U29
next: U31
prereq: [U20, U24, U29]
used_by: [U32]
terms: [TERM-mreg, TERM-dummy, TERM-r2, TERM-adjr2, TERM-ms, TERM-multicol, TERM-se]
labs: [LAB-mreg]
goal: 説明変数を2つ以上使う重回帰の係数を「ほかの変数を一定にしたとき」と読み、係数の t 検定・決定係数・自由度調整済み決定係数・F 検定で確かさと全体の当てはまりを判断し、ダミー変数・多重共線性・外挿の落とし穴を、点を動かして確かめながら説明できる。
stage_goals:
  S1: 「重回帰の売価の係数 −1 は、客数を〜としたとき」「R² ではなく調整済み R² で比べるのは〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、出力表から係数・t・R²・調整済み R²・F を読み、条件を付けて結論を書ける。間違えた所だけ初学に戻る。
  S3: 問題文に「多重共線性」「調整済み」とは書いていない。**係数を条件付きで読み、t で確かさ、F と調整済み R² で全体を見て、説明変数どうしの相関と範囲を確かめ、因果と書かずに結論を書く**。
  S4: 面積と駐車台数・客数と週末・売価と客数・客数と客単価のように、場面が違っても「条件をそろえて読む → t → F と調整済み R² → 範囲の中で使う」の形は同じ。
  S5: 統計検定の枠の外。交互作用・多重共線性・「ほかを一定に」の意味・自由度から、係数という1つの数で何が消え、前提が崩れると何が揺れるかを考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざったデータから自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 出力表から係数を条件付きで読み、t・R²・調整済み R²・F を計算できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 多重共線性・ダミー変数・モデルの比べ方を判断して重回帰を読めた
  S4: 売場の指標で重回帰の結果を、条件・確かさ・範囲を添えて報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
