id: U23
number: "23"
title: 分散・2群の推定
domain: D5
reference_section: ⑤ 推定
prev: U22
next: U24
prereq: [U20, U22]
used_by: [U25, U26, U28]
terms: [TERM-chi2, TERM-f, TERM-ci, TERM-paired-t, TERM-welch, TERM-df]
labs: [LAB-two]
goal: 母分散・平均の差（独立／対応あり）・比率の差・分散の比の信頼区間を、「何の区間か」で χ²・t・正規・F を選んで作り、差の区間は0、比の区間は1を含むかで読める。
stage_goals:
  S1: 「母分散の区間は1.89〜13.33。s²±◯ にならないのは〜」「同じ店の前後は差を取る。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、母分散・対応ありの差・比率の差の区間を作り、0（比なら1）を含むかで読める。間違えた所だけ初学に戻る。
  S3: 問題文に「対応あり」とは書いていない。**何の区間かを決め、対応の有無とばらつきの違いを確かめ、χ²・F は大きい点で下限を作り、0か1を含むかで読む**。
  S4: 施策前後・2地区・2つのキャンペーン・2店のばらつきのように、場面が違っても「差・比の区間が0（1）を含むか」の形は同じ。
  S5: 2級には直接出ない。ばらつきの推定に要る n、相関係数の区間、等分散の検定を先にしない理由、比率の差の区間と検定の違い。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 母分散と対応ありの差の区間を作り、χ² の点の使い方と差を取る理由を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 対応の有無・ウェルチと等分散を判断し、区間が0か1を含むかで読めた
  S4: 売場の比較を、差や比の区間で報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
