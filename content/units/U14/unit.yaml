checks:
  # 例題A：n＝4、p＝0.25
  - 'comb(4,1) == 4 and math.isclose(0.25*0.75**3, 0.10546875) and abs(0.25*0.75**3 - 0.105) < 0.0005 and math.isclose(4*0.25*0.75**3, 0.421875) and abs(0.421875 - 0.422) < 0.0005'
  - '4*Fraction(1,4) == 1 and 4*Fraction(1,4)*Fraction(3,4) == Fraction(3,4) and abs(math.sqrt(0.75) - 0.87) < 0.005 and abs(0.75**4 - 0.32) < 0.005'
  # 前提チェック
  - 'comb(4,1) == 4 and comb(5,2) == 10 and math.isclose(0.25*0.75, 0.1875)'
  # 実験：n＝20 で山は5人
  - '20*Fraction(1,4) == 5 and max(range(21), key=lambda k: comb(20,k)*0.25**k*0.75**(20-k)) == 5'
  # 応用：少なくとも1人を90%以上にする人数
  - 'abs(0.75**8 - 0.1) < 0.0005 and 1-0.75**8 < 0.9 and 1-0.75**9 > 0.9'
  # 発展：正規近似
  - 'math.isclose(100*0.5, 50) and math.isclose(math.sqrt(100*0.25), 5) and math.isclose((59.5-50)/5, 1.9)'
  # 転用の読み取り
  - 'abs(0.9**20 - 0.12) < 0.005 and abs(20*0.1*0.9**19 - 0.27) < 0.005 and abs(1-0.98**50 - 0.64) < 0.005 and math.isclose(22*0.9, 19.8) and abs(22*0.9**21*0.1 + 0.9**22 - 0.34) < 0.005'
  # 実験の答え：n＝20 の平均・分散
  - 'math.isclose(20*0.25*0.75, 3.75)'
  # 課題B
  - 'abs(1-0.98**50 - 0.64) < 0.005'
