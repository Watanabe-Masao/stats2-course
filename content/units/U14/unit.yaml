id: U14
number: "14"
title: 二項分布・ベルヌーイ分布
domain: D3
reference_section: ③ 確率分布
prev: U13
next: U15
prereq: [U09, U11, U13]
used_by: [U15, U16, U19, U22, U26]
terms: [TERM-binom, TERM-indep, TERM-rv, TERM-expect, TERM-var]
labs: [LAB-binom]
goal: 「n 人のうちちょうど k 人が買う確率は？」を**二項分布で求め**、平均 np・分散 np(1−p) が言え、二項分布が使える4つの条件を確かめられる。
stage_goals:
  S1: 「ₙCₖ を掛けるのは並び方の数だから。なぜなら〜」「平均1人でも、0人の確率は約32%ある。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、4つの条件を確かめ、「ちょうど」「以下」「以上」「少なくとも1回」を式で求められる。間違えた所だけ初学に戻る。
  S3: 問題文に「二項分布」とは書いていない。**「n 回（n 人）」「〜する確率 p」「互いに影響しない」から二項分布と見抜き、「以上」「以下」は余事象を使うか決める**。
  S4: クーポンの利用・抜き取り検査・予約の来店・品切れの日数のように、場面が違っても「回数を決めて、成功の回数を数える」は同じ形で使える。
  S5: 統計検定の枠の外。正規分布での近似、ポアソン分布での近似、超幾何分布との違い、n を逆算する設計。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: ちょうど k 回の確率を並び方の数×1つの並びの確率で求め、理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から n・p・k を拾い、4つの条件と「以上・以下」の求め方を決められた
  S4: 売場や検査の場面で、k 人以上・1人もいない確率と平均 np を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
