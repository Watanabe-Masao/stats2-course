  - 'abs(0.9**20 - 0.12) < 0.005 and abs(20*0.1*0.9**19 - 0.27) < 0.005 and abs(1-0.98**50 - 0.64) < 0.005 and math.isclose(22*0.9, 19.8) and abs(22*0.9**21*0.1 + 0.9**22 - 0.34) < 0.005'
