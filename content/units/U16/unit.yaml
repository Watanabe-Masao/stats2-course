id: U16
number: "16"
title: 連続分布・正規分布・標準化
domain: D3
reference_section: ③ 確率分布
prev: U15
next: U17
prereq: [U08, U13, U15]
used_by: [U18, U19, U20, U22, U24, U28]
terms: [TERM-normal, TERM-pdf, TERM-std, TERM-uniform, TERM-expo]
labs: [LAB-cont]
goal: 重さ・時間・人数のような量が「〇〇以上」「〇〇の間」になる確率を**曲線の下の面積として読み**、正規分布は標準化して表で、一様・指数分布は式で求められる。
stage_goals:
  S1: 「高さは確率ではない。なぜなら〜」「120人を超える日は約2.3%。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、標準化して正規分布の確率を出し、±1σ・±2σ・±3σ の割合と、一様・指数分布の確率と平均を言える。間違えた所だけ初学に戻る。
  S3: 問題文に分布の名前や表の向きは書いていないことがある。**量の性質から分布を選び、求めるのが確率か値かを決め、表がどの面積を載せているかを確かめて**から計算する。
  S4: 発注数・内容量・規格・待ち時間のように、場面が違っても「基準の値を z に直して面積を読む」か「面積から z を決めて値に戻す」かの形は同じ。
  S5: 統計検定の枠の外。確率がなぜ面積か、標準化でなぜ1つの表で済むか、平均と標準偏差で分布の形が消えること（平均±2σ に95% は正規分布のときだけ）を、自分の言葉で説明できる。興味のある節を1つ選べばよい。
  S6: 答えが1つに決まらない探究。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えることと解釈を切り分ける**。解釈は2つ以上並べ、正解を決めない。
evidence:
  S1: 標準化して区間の確率を求め、面積と高さの違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 量の性質から正規・一様・指数を選び、表の向きを確かめて確率や値を出せた
  S4: 発注や品質の場面で、z と面積を使って基準を説明できた
  S5: 1つ選んで、なぜそうなるかを説明した（任意）
  S6: 探究か課題を1つ行い、統計で言えることと解釈を分けて書いた（任意）
concepts_linked: true
status: drafted
version: 1
figures:
  - id: FIG-U16-concept
    caption: 平均100・標準偏差10 の正規分布（例題A）。90〜110 に約68%、80〜120 の外側に合わせて約5%。確率は高さではなく面積。
    spec:
      type: dist
      family: normal
      mu: 100
      sigma: 10
      ticks: [70, 130, 10]
      shade:
        - {from: 90, to: 110, label: 約68%}
        - {outside: [80, 120], label: 合わせて約5%}
      note: 平均±標準偏差に約68%、±2標準偏差に約95%。この割合は正規分布のときだけ。
checks:
  # 発展：対数正規（σ＝1）を同じ平均・標準偏差にそろえたときの割合・平均＋2σ の外
  - 'abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+2*math.sqrt((math.e-1)*math.e))) - 0.963) < 0.0005 and math.exp(0.5)-2*math.sqrt((math.e-1)*math.e) < 0 and abs(1-statistics.NormalDist().cdf(2) - 0.023) < 0.0005 and abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+math.sqrt((math.e-1)*math.e))) - 0.91) < 0.005 and 80+2*12 == 104 and abs(1-statistics.NormalDist().cdf(1.96) - 0.025) < 0.0005'
  - 'Fraction(400+20) == 420 and math.isclose(math.sqrt(8**2+6**2), 10) and Fraction(1,12) == Fraction(1,12)'
  # 創造：平日と週末が混ざった日販（平日5日 N(60, 8²)・週末2日 N(100, 10²)）
  - 'abs((5*60+2*100)/7 - 71.4) < 0.05 and abs(math.sqrt((5*64+2*100)/7 + 5/7*(60-500/7)**2 + 2/7*(100-500/7)**2) - 20.0) < 0.05 and abs(500/7 + 1.645*math.sqrt((5*64+2*100)/7 + 5/7*(60-500/7)**2 + 2/7*(100-500/7)**2) - 104) < 0.5 and abs(1-statistics.NormalDist(100,10).cdf(104) - 0.34) < 0.005 and abs(100+1.645*10 - 116) < 0.5 and abs(60+1.645*8 - 73) < 0.5'
  # Φ(z)＝0.5*(1+math.erf(z/math.sqrt(2)))
  # 入口・前提チェック・一様と指数の例
  - 'math.isclose(100*1.2, 120) and (120-100)/10 == 2 and math.sqrt(25) == 5 and math.isclose(3*0.1, 0.3) and math.isclose(3/10, 0.3) and abs(math.exp(-2) - 0.135335) < 5e-7'
  # 例題A
  - 'abs(0.5*(1+math.erf(1/math.sqrt(2))) - 0.8413) < 0.00005 and abs(1-0.8413 - 0.1587) < 1e-9 and abs(0.8413-0.1587 - 0.6826) < 1e-9 and abs(0.68268 - 0.6827) < 0.00005 and abs(0.5*(1+math.erf(2/math.sqrt(2))) - 0.9772) < 0.00005 and abs(1-0.9772 - 0.0228) < 1e-9'
  - 'abs(0.5*(1+math.erf(1/math.sqrt(2))) - 0.84134) < 0.000005 and abs(0.5*(1+math.erf(-1/math.sqrt(2))) - 0.15866) < 0.000005 and abs(0.84134-0.15866 - 0.68268) < 1e-9'
  - 'abs(math.erf(1/math.sqrt(2)) - 0.683) < 0.0005 and abs(math.erf(1.96/math.sqrt(2)) - 0.95) < 0.0005 and abs(math.erf(2/math.sqrt(2)) - 0.954) < 0.0005 and abs(math.erf(3/math.sqrt(2)) - 0.997) < 0.0005'
  - 'abs(0.6827 - 2/3) < 0.02 and 40 < 1/0.0228 < 50'
  # 実験：μ±2σ
  - 'abs(0.9772-0.0228 - 0.9544) < 1e-9 and (40-50)/5 == -2 and (60-50)/5 == 2'
  # 復習の練習（誤った説明の数）：f(100)≒0.04
  - 'abs(1/(10*math.sqrt(2*math.pi)) - 0.04) < 0.001 and (120-100)/100 == 0.2'
  # 転用の読み取り
  - 'abs(1.645*12 - 20) < 0.3 and abs(80+1.645*12 - 100) < 0.3 and abs(0.5*(1+math.erf(-1/math.sqrt(2))) - 0.16) < 0.002 and abs(0.5*(1+math.erf(-2/math.sqrt(2))) - 0.02) < 0.003 and abs(math.exp(-5/3) - 0.19) < 0.002 and abs(math.exp(-1) - 0.37) < 0.003'
  # 発展：U(0,1) の分散、正規分布の和
  - 'math.isclose(1/3 - 0.25, 1/12) and 400+20 == 420 and math.sqrt(8**2+6**2) == 10'
  # 創造：内容量の上乗せ
  - 'abs(1.96*2 - 3.9) < 0.05 and abs(1.96*1 - 2) < 0.05'
