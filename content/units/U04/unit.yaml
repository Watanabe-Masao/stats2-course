id: U04
number: "04"
title: データの種類・測定尺度
domain: D1
reference_section: ① データの記述
prev: U03
next: U05
prereq: [U03]
used_by: [U05, U06, U26, U27]
terms: [TERM-qual, TERM-quant, TERM-scale, TERM-mode, TERM-median]
labs: [LAB-scale]
goal: データを見て尺度（名義・順序・間隔・比例）と種類（質的・量的、離散・連続）を判定し、**「平均してよいか」「何倍と言えるか」「どの代表値・グラフを使うか」を理由つきで決められる**。
stage_goals:
  S1: 「20℃は10℃の2倍暑い、とは言えない。なぜなら〜」を自分の言葉で1文にできれば完了。
  S2: 資料を見ずに4つの質問を言え、尺度を判定できる。間違えた所だけ初学に戻る。
  S3: 問題文に「尺度」とは書いていない。**計算する前に「この計算はこのデータで意味があるか」を自分で確かめる**。
  S4: 医療・教育・スポーツ・データベースでも、「0は無いを表すか」「順番だけか」という同じ問いで判断できる。
  S5: 2級には直接出ない。尺度を「許される変換」で定義し直す見方や、対数の尺度、機械学習での扱いとのつながり。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→限界を書く**の順に進める。
evidence:
  S1: 「20℃は10℃の2倍ではない」理由を1文で書けた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 計算の前に尺度を確かめ、使えない計算を指摘できた
  S4: 別の分野のデータの尺度と、使ってよい計算を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # ラボ（単位を変える）：10℃と20℃
  - 'Fraction(20, 10) == 2 and abs((20+273.15)/(10+273.15) - 1.035) < 0.001 and abs((20*1.8+32)/(10*1.8+32) - 1.36) < 1e-9'
  - '(20*1.8+32) - (10*1.8+32) == 18.0'
  # 西暦2020年と1010年、2010年と2020年
  - 'Fraction(2020, 1010) == 2 and abs(2020/2010 - 1.005) < 0.001 and Fraction(2020-2000, 2010-2000) == 2 and abs((2020-1900)/(2010-1900) - 1.091) < 0.001'
  # 重さは単位を変えても比は同じ
  - 'Fraction(20*1000, 10*1000) == Fraction(20, 10)'
  # 去年10℃、今年15℃
  - '15 - 10 == 5 and Fraction(15, 10) == Fraction(3, 2)'
  # ラボ（満足度の平均）：A店 [0,0,60,40,0]、B店 [20,10,0,10,60]
  - 'Fraction(60*3 + 40*4, 100) == Fraction(34, 10) and Fraction(20*1 + 10*2 + 10*4 + 60*5, 100) == Fraction(38, 10)'
  - 'abs((20*1 + 10*2 + 10*4 + 60*4.1)/100 - 3.26) < 1e-9 and Fraction(20*(-1) + 10*2 + 10*4 + 60*5, 100) == Fraction(34, 10)'
  - 'Fraction(40, 100) == Fraction(2, 5) and Fraction(10+60, 100) == Fraction(7, 10)'
  # ラボ（階級にまとめる）：20人の年齢
  - 'sum([22,24,27,29,31,33,34,36,38,39,41,43,45,47,48,52,55,58,61,69]) == 832 and Fraction(832, 20) == Fraction(416, 10)'
  - 'Fraction(25*4 + 35*6 + 45*5 + 55*3 + 65*2, 20) == Fraction(415, 10)'
  # 有限の例：店番305の平均、前年比110%
  - 'Fraction(110, 100) == Fraction(11, 10)'
  # 発展：マグニチュード1の差はエネルギー約32倍、「満足」以上・「不満」以下の割合
  - 'abs(10**1.5 - 31.6) < 0.1 and Fraction(20+10, 100) == Fraction(3, 10)'
