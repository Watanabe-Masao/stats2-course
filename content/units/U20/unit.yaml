id: U20
number: "20"
title: 標準誤差・t分布・カイ二乗分布・F分布
domain: D4
reference_section: ④ 標本分布
prev: U19
next: U21
prereq: [U16, U18, U19]
used_by: [U22, U23, U24, U25, U26, U27, U30, U32]
terms: [TERM-se, TERM-t, TERM-chi2, TERM-f, TERM-df]
labs: [LAB-tcf]
goal: σ が分からず s を使う平均は **t**、分散は **χ²**、2つの分散の比は **F** というように、調べたいものと統計量から分布と自由度を決め、確率点（左側累積）を引いて基準と比べられる。
stage_goals:
  S1: 「t＝1、自由度15。基準2.131より小さいので偶然の範囲。なぜなら〜」「σ を知らないので1.96ではなく t の点を使う。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、z・t・χ²・F の統計量と自由度を書き、t 値を計算して表の点と比べられる。間違えた所だけ初学に戻る。
  S3: 問題文に「t 分布を使え」とは書いていない。**平均か・分散か・分散の比かを決め、σ が分かっているかを確かめ、自由度と両側／片側を決めて、左側累積のどの点かを書いてから比べる**。
  S4: 施策前後の差・新店の客単価・内容量のばらつき・2店のばらつきのように、場面が違っても「何で割って、どの分布の点と比べるか」の形は同じ。
  S5: 統計検定の枠の外。3つの分布の作り方（正規の2乗和と比）、t² と F の関係、正規でない母集団での頑健さ、自由度の意味。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: t 値を計算して t の点と比べ、z と t の違いを1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 平均・分散・分散の比で分布を選び、自由度と両側／片側を決められた
  S4: 売場の差やばらつきを、t・χ²・F の点で説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
