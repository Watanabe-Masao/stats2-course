checks:
  # 確率点は数表の値。検算は密度の数値積分（中点則4000分割）で左側累積を出して照合する
  # 式の中の (lambda x,k: …) は t(k) の P(T≦x)、(lambda q,k: …) は χ²(k) の P(Q≦q)、(lambda x,a,b: …) は F(a,b) の P(F≦x)
  # 前提チェック
  - '12/math.sqrt(36) == 2 and (54-50)/2 == 2 and ((2-4)**2+0+(6-4)**2)/(3-1) == 4'
  # 例題A
  - '8/math.sqrt(16) == 2 and (52-50)/2 == 1 and 16-1 == 15 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.131,15)-0.975) < 5e-4 and 8/math.sqrt(64) == 1 and (52-50)/8 == 0.25'
  # 実験
  - 'abs(0.5+math.atan(12.706)/math.pi-0.975) < 5e-4 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.776,4)-0.975) < 5e-4 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.042,30)-0.975) < 5e-4 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.980,120)-0.975) < 5e-4'
  - 'abs(2.042-1.96-0.082) < 1e-9 and abs(1.980-1.96-0.020) < 1e-9 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.725,20)-0.95) < 5e-4'
  # 復習の図・早見
  - 'abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.646,1000)-0.95) < 5e-4 and abs(0.5*(1+math.erf(1.645/math.sqrt(2)))-0.95) < 5e-4 and abs(0.5*(1+math.erf(1.96/math.sqrt(2)))-0.975) < 5e-4'
  - 'abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(2.700,9)-0.025) < 5e-4 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(19.023,9)-0.975) < 5e-4'
  # 転用の読み取り
  - 'abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.201,11)-0.975) < 5e-4 and abs(6/math.sqrt(12) - 1.73) < 0.005 and abs(2.5/(6/math.sqrt(12)) - 1.44) < 0.005 and abs((lambda q,k: sum(math.exp((k/2-1)*math.log(q*(i+0.5)/4000)-q*(i+0.5)/8000-k/2*math.log(2)-math.lgamma(k/2)) for i in range(4000))*q/4000)(19.675,11)-0.95) < 5e-4 and abs(11*30/20 - 16.5) < 1e-9'
  # 発展
  # χ²(1) の左側累積は erf(√(q/2))
  - 'abs(1.96**2 - 3.84) < 0.005 and abs(math.erf(math.sqrt(3.841/2))-0.95) < 5e-4'
  # 創造
  - '(2*4)**2 == 64 and 2/(8/math.sqrt(64)) == 2 and abs(2.131*8/math.sqrt(16) - 4.26) < 0.005'
  # 初学のラボ s1-df（自由度6）
  - 'abs(sum(math.gamma(3.5)/(math.sqrt(6*math.pi)*math.gamma(3))*(1+((i+.5)*2.447/20000)**2/6)**(-3.5) for i in range(20000))*2.447/20000 - 0.475) < 0.0005'
  # 発展：t＝2.1 の自由度9と30、s² の分散
  - 'abs(2*(0.5-sum(math.gamma(5)/(math.sqrt(9*math.pi)*math.gamma(4.5))*(1+((i+.5)*2.1/20000)**2/9)**(-5) for i in range(20000))*2.1/20000) - 0.065) < 0.0005'
  - 'abs(2*(0.5-sum(math.gamma(15.5)/(math.sqrt(30*math.pi)*math.gamma(15))*(1+((i+.5)*2.1/20000)**2/30)**(-15.5) for i in range(20000))*2.1/20000) - 0.044) < 0.0005'
  - 'abs(2/9 - 0.22) < 0.005 and abs(2/9+6/10 - 0.82) < 0.005 and abs((2/9+6/10)/(2/9) - 3.7) < 0.005 and abs(1.96**2 - 3.841) < 0.001'
  # 創造：8店の差
  - 'sum([7,6,8,5,-1,0,-2,1])/8 == 3 and abs(math.sqrt(108/7) - 3.93) < 0.005 and abs(math.sqrt(108/7)/math.sqrt(8) - 1.39) < 0.005 and abs(3/(math.sqrt(108/7)/math.sqrt(8)) - 2.16) < 0.005'
  - 'sum([7,6,8,5])/4 == 6.5 and abs(6.5/(math.sqrt(5/3)/2) - 10.1) < 0.05 and abs(2.131*8/math.sqrt(16) - 4.26) < 0.005'
