id: U05T
number: "05-T"
title: 時系列：変化・平均・繰返しを読む
domain: D1
reference_section: ① データの記述
prev: U05
next: U06
prereq: [U05, U01]
used_by: [U06, U28]
terms: [TERM-ratio, TERM-point, TERM-geomean, TERM-ma, TERM-acf, TERM-corr]
labs: [LAB-ts]
goal: 売上の「増えた・減った」を、**基準（分母）・期間の数・時間の順番をはっきりさせて説明でき**、増減率の重ね方、平均成長率（幾何平均）、移動平均、自己相関を使い分けられる。
stage_goals:
  S1: 「25%増えて10%減ったら12.5%増。なぜなら〜」を自分の言葉で言えれば完了。T1〜T3は {{unit:U06}} の平均の後、T4（自己相関）は {{unit:U28}} の相関の後に読むとよい。
  S2: 資料を見ずに、増減を倍率で重ね、平均成長率と移動平均を計算できる。間違えた所だけ初学に戻る。
  S3: 問題文に「幾何平均を使え」とは書いていない。**何を基準に、何期間で、何を知りたいかを自分で確かめてから計算を選ぶ**。
  S4: 物価・投資・人口・感染者数でも、「率は掛けて重ねる」「平均成長率は幾何平均」「移動平均でならす」は同じ形で使える。
  S5: 統計検定の枠の外。対数で見る成長率、季節調整、指数平滑、自己相関と検定の注意、移動平均とフィルタのつながり。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 増減率を倍率で重ね、平均成長率を幾何平均で求めて、理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 基準・期間・目的から計算を選び、その計算で言えないことも書けた
  S4: 別の場面の時系列で、率の重ね方と平均・ならし方を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 例題A：80→100→90
  - 'Fraction(100, 80) == Fraction(125, 100) and Fraction(90, 100) == Fraction(9, 10) and Fraction(125,100)*Fraction(9,10) == Fraction(1125, 1000)'
  - '100*Fraction(100,80) == 125 and 100*Fraction(90,80) == Fraction(1125,10)'
  - 'Fraction(12,10)*Fraction(8,10) == Fraction(96,100)'
  # 平均成長率：√1.125、算術平均7.5%
  - 'abs(1.125**0.5 - 1.0607) < 0.0001 and abs(80*1.0607**2 - 90) < 0.01 and abs(80*1.075**2 - 92.45) < 1e-9 and (25-10)/2 == 7.5'
  # 4期：25,−10,20,−20
  - 'abs(1.25*0.9*1.2*0.8 - 1.08) < 1e-12 and abs(1.08**0.25 - 1 - 0.0194) < 0.0001 and (25-10+20-20)/4 == 3.75 and abs(100*1.0375**4 - 115.87) < 0.01'
  # 移動平均：10,14,12,18,16
  - 'Fraction(10+14+12, 3) == 12 and abs((14+12+18)/3 - 14.67) < 0.005 and abs((12+18+16)/3 - 15.33) < 0.005'
  # 復習：＋10%と−10%、30%増と30%減
  - 'abs(1.1*0.9 - 0.99) < 1e-12 and abs(1.3*0.7 - 0.91) < 1e-12'
  # 言葉：10%→12% は20%増・2ポイント増
  - 'Fraction(12-10, 10) == Fraction(2, 10) and 12 - 10 == 2'
  # 日販28日の後方7日平均
  - '28 - (7 - 1) == 22'
  # 発展：対数で足す
  - 'abs(math.log(1.25) + math.log(0.9) - math.log(1.125)) < 1e-12 and abs(math.exp(math.log(1.125)/2) - 1.0607) < 0.0001'
  # 前提チェック、実験の「ラボなしで」
  - 'Fraction(100,80) == Fraction(125,100) and abs(1.21**0.5 - 1.1) < 1e-12 and abs(1.5*0.5 - 0.75) < 1e-12 and abs(0.75**0.5 - 0.866) < 0.001'
  # 発展3：指数平滑（α＝0.5、10,14,12）
  - '0.5*14 + 0.5*10 == 12 and 0.5*12 + 0.5*12 == 12'
