  # 発展：＋50%・−20% と −20%・＋50%
  - '100*1.5 == 150 and abs(150*0.8 - 120) < 1e-9 and 100*0.8 == 80 and 80*1.5 == 120 and abs(1.2**0.5 - 1.0954) < 0.0001 and 150+120 == 270 and 80+120 == 200'
  # 創造：曜日の数と値上げ
  - '9*200 + 22*100 == 4000 and 10*200 + 21*100 == 4100 and Fraction(4100-4000, 4000) == Fraction(25, 1000) and Fraction(2000-1800, 4000) == Fraction(5, 100) and Fraction(2100-2200, 4000) == Fraction(-25, 1000)'
  - 'abs(4100*1.03 - 4223) < 1e-9 and Fraction(4320, 4000) == Fraction(108, 100) and abs(4320/4223 - 1.023) < 0.0005 and 31 - 20 + 1 == 12'
  # 概念図：100→150→81、率の算術平均＋2%、幾何平均 −10%
  - 'Fraction(150, 100) == Fraction(3, 2) and abs(81/150 - 0.54) < 1e-12 and Fraction(50 - 46, 2) == 2 and abs(100*1.02**2 - 104.04) < 1e-9 and abs((81/100)**0.5 - 0.9) < 1e-12 and 100*0.9 == 90'
  # 例題A：80→100→90
  - 'Fraction(100, 80) == Fraction(125, 100) and Fraction(90, 100) == Fraction(9, 10) and Fraction(125,100)*Fraction(9,10) == Fraction(1125, 1000)'
  - '100*Fraction(100,80) == 125 and 100*Fraction(90,80) == Fraction(1125,10)'
  - 'Fraction(12,10)*Fraction(8,10) == Fraction(96,100)'
  # 平均成長率：√1.125、算術平均7.5%
  - 'abs(1.125**0.5 - 1.0607) < 0.0001 and abs(80*1.0607**2 - 90) < 0.01 and abs(80*1.075**2 - 92.45) < 1e-9 and (25-10)/2 == 7.5'
  # 4期：25,−10,20,−20
