id: U08
number: "08"
title: 標準化・外れ値・歪度
domain: D1
recall_group: 要約（代表値・ばらつき）
prev: U07
next: U09
prereq: [U07, U05]
used_by: [U16, U25]
terms: [TERM-std, TERM-sd, TERM-outlier, TERM-skew, TERM-kurt, TERM-normal]
labs: [LAB-z]
goal: 平均もばらつきも違う2つの値を、**z得点（平均から標準偏差いくつ分か）で同じ物差しに乗せて比べられ**、外れ値・歪度・尖度から分布の特徴を言葉で言える。
stage_goals:
  S1: 「店舗Aの70万円も店舗Bの90万円も z＝2 で同じくらい珍しい。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに z得点を求め、z から元の値に戻せ、歪度の符号を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「z得点を使え」とは書いていない。**何と何を、どの集団の中の位置として比べたいかから、z得点・柵・歪度を自分で選ぶ**。
  S4: 試験の偏差値・品質管理・検査値・異常日の検知でも、「平均を引いて標準偏差で割る」「|z| の大きさで珍しさを見る」「外れたら原因を確かめる」は同じ形で使える。
  S5: 統計検定の枠の外。その値を含めた z の上限、z から消える起きる割合、物差しの期間がずれたとき。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 2つの店の値を z得点で比べ、理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 目的から z得点・柵・歪度を選び、その指標で言えないことも書けた
  S4: 別の場面のデータで、標準化と外れ値の扱いを説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
figures:
  - id: FIG-U08-concept
    caption: 店舗A（平均50・標準偏差10）と店舗B（平均80・標準偏差5）の目盛りを、z の目盛りにそろえた。Aの70とBの90は、どちらも z＝2 に来る
    spec:
      type: zscale
      title: 標準化は、集団ごとの目盛りを z の目盛りにそろえる
      rows:
        - {label: 店舗A, mean: 50, sd: 10, x: 70}
        - {label: 店舗B, mean: 80, sd: 5, x: 90}
      marks: [0, 2]
      unit: 万円。
      note: 金額の差は20万円と10万円で違うが、その店の標準偏差で割ると、どちらも平均から標準偏差2つ分上
concepts_linked: true
status: drafted
version: 1
checks:
  # 概念図：店舗A・B の z＝2
  - 'Fraction(70-50, 10) == 2 and Fraction(90-80, 5) == 2'
  # 発展：5日のうち1日だけ大きい値の z は √(n−1)＝2 で頭打ち
  - 'statistics.mean([10,10,10,10,20]) == 12 and statistics.pstdev([10,10,10,10,20]) == 4 and Fraction(20-12, 4) == 2 and statistics.mean([10,10,10,10,110]) == 30 and statistics.pstdev([10,10,10,10,110]) == 40 and Fraction(110-30, 40) == 2 and 4**0.5 == 2 and 9**0.5 == 3'
  # 発展：上限 √(n−1)、n−1 で割ると (n−1)/√n
  - 'abs(statistics.stdev([10,10,10,10,20]) - 20**0.5) < 1e-9 and abs((20-12)/statistics.stdev([10,10,10,10,20]) - 4/5**0.5) < 1e-9 and abs(4/5**0.5 - 1.79) < 0.005'
  # 発展：2つの値のデータ（特売日の割合 p）で z＝√((1−p)/p)
  - 'statistics.mean([45]*16 + [75]*4) == 51 and statistics.pstdev([45]*16 + [75]*4) == 12 and Fraction(75-51, 12) == 2 and statistics.mean([45]*16 + [105]*4) == 57 and statistics.pstdev([45]*16 + [105]*4) == 24 and Fraction(105-57, 24) == 2 and statistics.mean([45]*18 + [75]*2) == 48 and statistics.pstdev([45]*18 + [75]*2) == 9 and Fraction(75-48, 9) == 3 and abs((0.8/0.2)**0.5 - 2) < 1e-9 and abs((0.9/0.1)**0.5 - 3) < 1e-9 and abs((0.5/0.5)**0.5 - 1) < 1e-9'
  # 発展：先月の物差し（100・10）で今月の115
  - 'Fraction(115-100, 10) == Fraction(3, 2) and 100 + 2*10 == 120'
  # 説明してみる：開店5日
  - 'statistics.mean([30,31,29,30,60]) == 36 and abs(statistics.pstdev([30,31,29,30,60]) - 12) < 0.05 and abs((60-36)/statistics.pstdev([30,31,29,30,60]) - 2.0) < 0.005'
  - 'statistics.mean([30,31,29,30]) == 30 and abs(statistics.pstdev([30,31,29,30]) - 0.71) < 0.005 and abs((60-30)/statistics.pstdev([30,31,29,30]) - 42) < 0.5'
  # 創造：4店の z と金額の差
  - 'Fraction(330-250, 40) == 2 and Fraction(190-150, 20) == 2 and Fraction(50-40, 5) == 2 and abs((153-120)/15 - 2.2) < 1e-9 and 80+40+10+33 == 163 and abs(80/163 - 0.49) < 0.005 and Fraction(80, 10) == 8 and 40+20+5+15 == 80 and Fraction(80,250) == Fraction(32,100) and abs(40/150 - 0.27) < 0.005 and Fraction(10,40) == Fraction(1,4) and Fraction(33,120) == Fraction(275,1000)'
  # 例題A：店舗A・B
  - 'Fraction(70-50, 10) == 2 and Fraction(90-80, 5) == 2 and 70-50 == 20 and 90-80 == 10'
  # 実験：標準偏差20で z＝1、ラボなしで平均80・標準偏差5 で 85
  - 'Fraction(70-50, 20) == 1 and Fraction(85-80, 5) == 1'
  # 前提チェック
  - 'Fraction(-6, 3) == -2'
  # 正規分布の目安（発展・応用）
  - 'abs((1 + math.erf(2/2**0.5))/2 - 0.9772) < 0.0001 and abs(math.erf(1/2**0.5) - 0.6827) < 0.0001 and abs(math.erf(2/2**0.5) - 0.9545) < 0.0001 and abs(math.erf(3/2**0.5) - 0.9973) < 0.0001'
  - 'abs(1/(1 - (1 + math.erf(2/2**0.5))/2) - 44) < 0.5'
