id: U08
number: "08"
title: 標準化・外れ値・歪度
domain: D1
reference_section: ① データの記述
prev: U07
next: U09
prereq: [U07, U05]
used_by: [U16, U25]
terms: [TERM-std, TERM-sd, TERM-outlier, TERM-skew, TERM-kurt, TERM-normal]
labs: [LAB-z]
goal: 平均もばらつきも違う2つの値を、**z得点（平均から標準偏差いくつ分か）で同じ物差しに乗せて比べられ**、外れ値・歪度・尖度から分布の特徴を言葉で言える。
stage_goals:
  S1: 「店舗Aの70万円も店舗Bの90万円も z＝2 で同じくらい珍しい。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに z得点を求め、z から元の値に戻せ、歪度の符号を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「z得点を使え」とは書いていない。**何と何を、どの集団の中の位置として比べたいかから、z得点・柵・歪度を自分で選ぶ**。
  S4: 試験の偏差値・品質管理・検査値・異常日の検知でも、「平均を引いて標準偏差で割る」「|z| の大きさで珍しさを見る」「外れたら原因を確かめる」は同じ形で使える。
  S5: 2級には直接出ない。チェビシェフの不等式との比較、標本歪度・尖度の補正、中央値を使う頑健な z、対数変換、管理図。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→限界を書く**の順に進める。
evidence:
  S1: 2つの店の値を z得点で比べ、理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 目的から z得点・柵・歪度を選び、その指標で言えないことも書けた
  S4: 別の場面のデータで、標準化と外れ値の扱いを説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 例題A：店舗A・B
  - 'Fraction(70-50, 10) == 2 and Fraction(90-80, 5) == 2 and 70-50 == 20 and 90-80 == 10'
  # 実験：標準偏差20で z＝1、ラボなしで平均80・標準偏差5 で 85
  - 'Fraction(70-50, 20) == 1 and Fraction(85-80, 5) == 1'
  # 前提チェック
  - 'Fraction(-6, 3) == -2'
  # 正規分布の目安（発展・応用）
  - 'abs((1 + math.erf(2/2**0.5))/2 - 0.9772) < 0.0001 and abs(math.erf(1/2**0.5) - 0.6827) < 0.0001 and abs(math.erf(2/2**0.5) - 0.9545) < 0.0001 and abs(math.erf(3/2**0.5) - 0.9973) < 0.0001'
  - 'abs(1/(1 - (1 + math.erf(2/2**0.5))/2) - 44) < 0.5'
  # 発展1：チェビシェフ
  - '1 - Fraction(1, 2**2) == Fraction(3,4)'
  # 発展3：頑健な z（中央値・MAD）
  - 'statistics.median([10,10,10,11,12,13,30]) == 11 and statistics.median([abs(x-11) for x in [10,10,10,11,12,13,30]]) == 1 and abs((30-11)/(1.4826*1) - 12.8) < 0.05'
  # 発展4：対数変換
  - 'abs(math.log10(1) - 0) < 1e-12 and abs(math.log10(10) - 1) < 1e-12 and abs(math.log10(100) - 2) < 1e-12 and abs(math.log10(1000) - 3) < 1e-12'
