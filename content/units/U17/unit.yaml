id: U17
number: "17"
title: 母集団・標本・無作為抽出
domain: D4
reference_section: ④ 標本分布
prev: U16
next: U18
prereq: [U03, U09, U10]
used_by: [U18, U21, U22, U31]
terms: [TERM-population, TERM-sample, TERM-frame, TERM-random-sampling, TERM-bias, TERM-sampdist]
labs: [LAB-srs]
goal: 「誰に結論を広げたいか（母集団）」と「誰を選べたか（抽出枠）」を分け、**単純無作為抽出で各単位が選ばれる確率 n÷N を出し**、標本平均が選び方によって変わることを説明できる。
stage_goals:
  S1: 「新店が選ばれる確率は0。なぜなら〜」「x̄ は選び方で変わるが、平均すると μ になる。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、母集団・抽出枠・標本を分け、包含確率と、小さな母集団の全標本の x̄ を出せる。間違えた所だけ初学に戻る。
  S3: 問題文に「抽出枠」とは書いていない。**名簿・台帳・会員・来店客など、選ぶときに使った一覧を探し、知りたい範囲とずれていないか、選び方に人の判断が入っていないかを先に確かめる**。
  S4: 覆面調査・棚卸の抜き取り・レシート点検・顧客アンケートのように、場面が違っても「枠から無作為に選ぶ」「選ばれる確率を決める」「選び方で結果がぶれる」の形は同じ。
  S5: 統計検定の枠の外。有限母集団修正、復元と非復元、確率が等しくない抽出（確率比例・層別）。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 母集団・抽出枠・標本を分けて書き、包含確率 n÷N と枠の外の確率0を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から抽出枠と選び方を見抜き、単純無作為抽出かどうかと結論の範囲を判断できた
  S4: 職場の抽出の場面で、選ばれる確率と結果のぶれを説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
# 例題の図（本文で {{fig:ID}}）。図の中の数は本文にある数だけを使う（build/figures.py）
figures:
  - id: FIG-U17-exA
    caption: 結論を広げたい全105店のうち、選べるのは台帳の100店だけ。台帳の外の新店5店は選ばれる確率が0
    spec:
      type: popsample
      pop: {label: 地域の全105店, size: N＝105（知りたい範囲）}
      sample: {label: 台帳の100店から選んだ10店, size: 台帳の各店が選ばれる確率 10÷100＝0.1, bias: 台帳に載らない新店5店は選ばれない（確率0）。結論を言えるのは台帳の100店まで}
      param: [全105店の本当の満足度の平均（分からない）]
      stat: [選んだ10店の満足度の平均（選び方で変わる）]
checks:
  # 前提チェック
  - 'comb(5,2) == 10 and math.isclose(1/10, 0.1)'
  # 例題A
  - 'math.isclose(10/100, 0.1) and 100+5 == 105'
  # 実験：n＝4 の x̄
  - 'sorted((35-x)/4 for x in [3,5,7,9,11]) == [6, 6.5, 7, 7.5, 8] and 3+5+7+9+11 == 35'
  # 転用の読み取り・発展
  - 'abs(1-math.prod(1-i/300 for i in range(5)) - 0.03) < 0.005 and math.isclose(comb(4,1)/comb(5,2), 2/5) and math.isclose(2/5, 0.4)'
  - 'abs(math.sqrt((5-2)/(5-1)) - 0.866) < 0.0005 and math.isclose(math.sqrt(8)/math.sqrt(2), 2)'
  - 'math.isclose(math.sqrt((10000-100)/(10000-1)), math.sqrt(9900/9999)) and abs(math.sqrt(9900/9999) - 0.995) < 0.0005 and math.isclose(100/10000, 0.01)'
