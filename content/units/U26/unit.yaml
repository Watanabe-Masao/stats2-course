id: U26
number: "26"
title: 割合・分散の検定
domain: D6
reference_section: ⑥ 検定
prev: U25
next: U27
prereq: [U14, U20, U24]
used_by: [U27, U32]
terms: [TERM-ratio, TERM-pool, TERM-chi2, TERM-f, TERM-test-stat, TERM-pvalue]
labs: [LAB-ptest]
goal: 1つの比率・2つの比率の差・母分散・分散の比の検定を、H₀ の値で SE や統計量を作り（比率は p₀・合わせた比率、ばらつきは χ²・F）、正規近似や正規母集団の前提を確かめて判断できる。
stage_goals:
  S1: 「検定の SE は p₀ で作る。区間の SE と違うのは〜」「2つの比率では合わせた比率を使う。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、比率（1つ・2つ）・母分散・分散の比の検定統計量を作り、結論を言える。間違えた所だけ初学に戻る。
  S3: 問題文に「χ² 検定」とは書いていない。**何の検定かを決め、H₀ の値で統計量を作り、正規近似や正規性の前提を確かめ、χ²・F は左右の点を別々に引いて判断する**。
  S4: キャンペーン比較・満足率・内容量のばらつき・2店のばらつきのように、場面が違っても「H₀ のもとでの珍しさ」で判断する形は同じ。
  S5: 統計検定の枠の外。正規近似が崩れるとき、z² と2×2 の表の χ²、分散の検定と正規性、対応のある比率。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: 比率の差の検定と母分散の検定を行い、SE に H₀ の値を使う理由を言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 何の検定か・両側か片側か・近似の前提を判断して検定できた
  S4: キャンペーンや品質のばらつきを、検定と区間で報告できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
