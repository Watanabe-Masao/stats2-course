id: U01
number: "01"
title: 割合・分数・式の変形
domain: D0
reference_section: ① データの記述
next: U02
prereq: []
used_by: [U05T, U02, U06, U07, U08]
terms: [TERM-ratio, TERM-point]
labs: [LAB-ratio]
goal: 「何%」と言われたとき、**何を基準（分母）にした割合かを言え**、基準量の逆算・増減の重ね合わせ・簡単な式の変形ができる。
stage_goals:
  S1: 「売価の80%が原価なら、基準量は売価。なぜなら〜」「20%上げて20%下げると4%減。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、割合・基準量・部分を求め、増減を倍率で重ね、1次式を解ける。間違えた所だけ初学に戻る。
  S3: 問題文に「基準量は〇〇」とは書いていない。**「何の何%か」「何に対する変化か」を自分で言ってから式を立てる**。
  S4: 統計の式（平均・z得点・変動係数・検定統計量）でも、売場の数字（粗利率・前年比・購入率）でも、「何で割っているか」を最初に確かめる形は同じ。
  S5: 2級には直接出ない。元に戻す率、割引の重ね方、比の平均の注意（シンプソンのパラドックス）、対数で見る増減。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→限界を書く**の順に進める。
evidence:
  S1: 基準量を言ってから売価を逆算し、増減の重ね方を理由つきで1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 基準量を自分で言い、% とポイントを使い分けられた
  S4: 統計の式と売場の数字で、分母が何かを言えた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 意味：30パック中6パック、20%増・減、10%→12%
  - 'Fraction(6, 30) == Fraction(1, 5) and 1 + Fraction(20,100) == Fraction(6,5) and 1 - Fraction(20,100) == Fraction(4,5) and 12 - 10 == 2 and Fraction(12-10, 10) == Fraction(1,5)'
  # 例題A：売価・20%上げて20%下げる
  - '800 / Fraction(80,100) == 1000 and 1000 * Fraction(6,5) == 1200 and 1200 * Fraction(4,5) == 960 and 800 * Fraction(6,5) == 960'
  - 'Fraction(6,5) * Fraction(4,5) == Fraction(96,100)'
  # 実験：元に戻す率
  - '1/Fraction(6,5) - 1 == Fraction(-1,6) and abs((1/1.2 - 1)*100 + 16.67) < 0.01'
  # 前提チェック
  - 'Fraction(2,10) == Fraction(20,100) and Fraction(3,4) * 100 == 75 and Fraction(15, 3) == 5'
  # 応用：前年比
  - 'Fraction(120,100) - 1 == Fraction(20,100) and 1 - Fraction(80,100) == Fraction(20,100)'
  # 発展：シンプソン（店A・B）
  - 'Fraction(18,100) > Fraction(50,300) and Fraction(10,200) > Fraction(2,50) and Fraction(18+10, 100+200) < Fraction(50+2, 300+50)'
  # 発展：10%増を7回
  - 'abs(1.1**7 - 1.949) < 0.001 and abs(math.log(2)/math.log(1.1) - 7.27) < 0.01'
  # 実験のラボなしで：25%上げて20%下げる
  - 'Fraction(125,100) * Fraction(4,5) == 1'
  # 使えない例：割引の重ね
  - 'Fraction(4,5) * Fraction(9,10) == Fraction(72,100)'
  # 転用の読み取り：売価1,000・原価700、購入率
  - 'Fraction(700,1000) == Fraction(70,100) and Fraction(300,1000) == Fraction(30,100) and abs(300/700*100 - 42.9) < 0.05 and Fraction(72,600) == Fraction(12,100)'
  # 課題B：10%値上げ→10%値下げ
  - 'Fraction(11,10) * Fraction(9,10) == Fraction(99,100) and 1000 * Fraction(99,100) == 990 and abs((1/1.1 - 1)*100 + 9.1) < 0.01 and 1000 * Fraction(11,10) * Fraction(91,100) == 1001'
