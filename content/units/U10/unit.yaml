id: U10
number: "10"
title: 事象・確率の公理・加法則
domain: D2
reference_section: ② 確率
prev: U09
next: U11
prereq: [U09, U01]
used_by: [U11, U12, U13, U14]
terms: [TERM-sample-space, TERM-event, TERM-complement, TERM-exclusive, TERM-indep]
labs: [LAB-prob]
goal: 「AまたはB」「少なくとも1回」の確率を、**重なりを二重に数えずに求められ**、排反と独立の違いを言える。
stage_goals:
  S1: 「AまたはBは重なりを1回引く。なぜなら〜」「少なくとも1回は 1−(1回もない)。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、加法定理・余事象・等確率の数え方を使い分けて解ける。間違えた所だけ初学に戻る。
  S3: 問題文に「加法定理を使え」とは書いていない。**「または」「かつ」「少なくとも」「どちらでもない」の言葉から、図を描いてどの部分を求めるかを自分で決める**。
  S4: 併買・会員とクーポン・品切れ・来店のように、場面が違っても「重なりを1回引く」「反対側から求める」は同じ形で使える。
  S5: 2級には直接出ない。3つの事象の包除原理、重なりの範囲（ボンフェローニの不等式）、誕生日問題、確率の公理。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に進める。
evidence:
  S1: サイコロの「または」を重なりを引いて求め、理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 言葉から求める部分を図で決め、排反か・独立かを区別できた
  S4: 売場の数字で「どちらか」「どちらも〜ない」「少なくとも1回」を求められた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
