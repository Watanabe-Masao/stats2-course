title: 事象・確率の公理・加法則
domain: D2
recall_group: 確率
prev: U09
next: U11
prereq: [U09, U01]
used_by: [U11, U12, U13, U14, U17]
terms: [TERM-sample-space, TERM-event, TERM-complement, TERM-exclusive, TERM-indep, TERM-prob, TERM-addition]
labs: [LAB-prob]
concepts_linked: true
goal: 「AまたはB」「少なくとも1回」の確率を、**重なりを二重に数えずに求められ**、排反と独立の違いを言える。
stage_goals:
  S1: 「AまたはBは重なりを1回引く。なぜなら〜」「少なくとも1回は 1−(1回もない)。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、加法定理・余事象・等確率の数え方を使い分けて解ける。間違えた所だけ初学に戻る。
  S3: 問題文に「加法定理を使え」とは書いていない。**「または」「かつ」「少なくとも」「どちらでもない」の言葉から、図を描いてどの部分を求めるかを自分で決める**。
  S4: 併買・会員とクーポン・品切れ・来店のように、場面が違っても「重なりを1回引く」「反対側から求める」は同じ形で使える。
  S5: 統計検定の枠の外。なぜ重なりを引くのか、2つの割合で何が消えるか、独立が崩れると「少なくとも1つ」がどちらへ動くかを、自分の言葉で説明できる。興味のある節を1つ選べばよい。
  S6: 答えが1つに決まらない探究。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えることと解釈を切り分ける**。解釈は2つ以上並べ、正解を決めない。
evidence:
  S1: サイコロの「または」を重なりを引いて求め、理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 言葉から求める部分を図で決め、排反か・独立かを区別できた
  S4: 売場の数字で「どちらか」「どちらも〜ない」「少なくとも1回」を求められた
  S5: 1つ選んで、なぜそうなるかを説明した（任意）
  S6: 探究か課題を1つ行い、統計で言えることと解釈を分けて書いた（任意）
