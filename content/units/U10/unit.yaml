  - 'Fraction(3,6) + Fraction(3,6) - Fraction(2,6) == Fraction(4,6) == Fraction(2,3) and Fraction(3,6)+Fraction(3,6) == 1'
  - 'Fraction(5,6)**2 == Fraction(25,36) and 1 - Fraction(25,36) == Fraction(11,36) and abs(11/36*100 - 30.6) < 0.05'
  # 入口：パンと牛乳
  - 'Fraction(40+30-10, 100) == Fraction(60,100) and 40 + 30 == 70 and 1 - Fraction(60,100) == Fraction(40,100)'
  # 前提チェック
  - 'Fraction(1,2) + Fraction(1,3) == Fraction(5,6) and 1 - Fraction(1,4) == Fraction(3,4) and Fraction(2,6) == Fraction(1,3)'
  # 実験：排反
  - '30 + 20 == 50 and 30 + 20 - 5 == 45'
  # 発展：包除原理・誕生日・重なりの範囲
  - 'len({2,4,6} | {3,6} | {5,6}) == 5 and Fraction(3+2+2-1-1-1+1, 6) == Fraction(5,6)'
  - 'abs(1 - math.prod((365-k)/365 for k in range(23)) - 0.507) < 0.001'
  - 'max(0, 50+60-100) == 10 and min(50,60) == 50 and 50+60-10 == 100 and 50+60-50 == 60'
  # 転用の表：3店で品切れ・5日の来店
  - 'abs(1 - 0.9**3 - 0.271) < 0.0005 and abs(1 - 0.8**5 - 0.672) < 0.0005'
  # 条件付き確率へ
  - 'Fraction(10,40) == Fraction(1,4)'
  # 発展3：組の数、課題B：販促
  - 'math.comb(23,2) == 253 and abs(0.7*0.8*0.5 - 0.28) < 1e-12 and abs(1 - 0.28 - 0.72) < 1e-12'
  # 転用の読み取り：重なりの範囲
  - 'max(0, 40+30-100) == 0 and min(40,30) == 30'
