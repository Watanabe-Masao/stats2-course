goal: 「何通りあるか」を数えるとき、**何を1通りとするか**を決め、順列・組合せ・重複を許す数え方を理由とともに選べる。
stage_goals:
  S1: 最後に「÷r! の意味」を自分の言葉で1文にできれば完了。
  S2: 資料を見ずに答え、答え合わせをして、間違えた所だけ初学に戻る。
  S3: 問題文に「順列」「組合せ」とは書いていない。**自分で数え方を選び、選んだ理由を1行で書く**。
  S4: 見た目が違う問題でも「n 個から r 個を、区別あり／なし、再使用あり／なしで選ぶ」という同じ形をしている。
  S5: 統計検定の枠の外。なぜ r! で割るのか、場合の数だけで何が消えるか、何を「1通り」とするかを変えると確率がどう変わるかを、自分の言葉で説明できる。興味のある節を1つ選べばよい。
  S6: 答えが1つに決まらない探究。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えることと解釈を切り分ける**。解釈は2つ以上並べ、正解を決めない。
evidence:
  S1: 「÷r! の意味」を1文で書けた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文に公式名がなくても数え方を選べた
  S4: 別の場面の共通構造を説明できた
  S5: 1つ選んで、なぜそうなるかを説明した（任意）
  S6: 探究か課題を1つ行い、統計で言えることと解釈を分けて書いた（任意）
