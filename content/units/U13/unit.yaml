id: U13
number: "13"
title: 確率変数・期待値・分散
domain: D2
reference_section: ② 確率
prev: U12
next: U14
prereq: [U06, U07, U02]
used_by: [U14, U15, U16, U18, U19, U28]
terms: [TERM-rv, TERM-dist, TERM-expect, TERM-var, TERM-sd, TERM-cov, TERM-indep]
labs: [LAB-expect]
goal: 「値」と「その確率」の一覧（確率分布）から、**1回あたりの平均（期待値）とばらつき（分散・標準偏差）を計算でき**、aX＋b や X＋Y にしたときの変化も求められる。
stage_goals:
  S1: 「期待値1.1個は、確率で重みを付けた平均で分布の重心。なぜなら〜」「定数を足しても分散は変わらない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、表に列を足して期待値・分散を出し、aX＋b と和・差の公式を使い分けて解ける。間違えた所だけ初学に戻る。
  S3: 問題文に「期待値を求めよ」とは書いていない。**「1人あたり」「平均して」「見込み」「ばらつき」の言葉から、期待値・分散のどれを求めるかを決め、確率の合計が1か、独立かを先に確かめる**。
  S4: 売上見込み・発注量・価格変更・2商品の合計のように、場面が違っても「値×確率を足す」「足した定数はばらつきに効かない」「合計の分散は足す」は同じ形で使える。
  S5: 2級には直接出ない。大数の法則、独立なら E(XY)＝E(X)E(Y)、無相関でも独立でない例、連続型の期待値。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→限界を書く**の順に進める。
evidence:
  S1: 表に列を足して期待値・分散・標準偏差を出し、期待値が重心である理由を1文で言えた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 問題文から求めるもの（期待値・分散）を決め、確率の合計と独立を確かめてから計算できた
  S4: 売場の数字で、合計の見込みとそのぶれ（標準偏差）を説明できた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
status: drafted
version: 1
checks:
  # 例題A：0個0.2・1個0.5・2個0.3
  - 'Fraction(2,10)+Fraction(5,10)+Fraction(3,10) == 1 and 0*Fraction(2,10)+1*Fraction(5,10)+2*Fraction(3,10) == Fraction(11,10) and 1*Fraction(5,10)+4*Fraction(3,10) == Fraction(17,10)'
  - 'Fraction(17,10) - Fraction(11,10)**2 == Fraction(49,100) and Fraction(121,100) == Fraction(11,10)**2 and math.isclose(math.sqrt(0.49), 0.7) and Fraction(5,10)*1 == Fraction(1,2) and 2*Fraction(3,10) == Fraction(6,10) and 4*Fraction(3,10) == Fraction(12,10)'
  # 100人で110個
  - '100*Fraction(11,10) == 110'
  # 前提チェック
  - 'Fraction(0*2+1*5+2*3, 10) == Fraction(11,10) and 1+4+9 == 14 and ((1-2)**2 + (3-2)**2)/2 == 1'
  # 実験：売場B
  - '4*Fraction(55,100) == Fraction(22,10) and Fraction(22,10) - Fraction(121,100) == Fraction(99,100) and 2*Fraction(55,100) == Fraction(11,10) and abs(math.sqrt(0.99) - 0.995) < 0.0005'
  # 応用：合計の期待値・分散
  - '300*Fraction(11,10) == 330 and abs(300*0.49 - 147) < 1e-9 and abs(math.sqrt(147) - 12.1) < 0.05 and abs(300*0.7 - 210) < 1e-9'
  # 発展：X と X² の共分散が0
  - 'Fraction(-1,3)+0+Fraction(1,3) == 0'
  # 復習：図の再現（±標準偏差の範囲）
  - 'Fraction(11,10)-Fraction(7,10) == Fraction(4,10) and Fraction(11,10)+Fraction(7,10) == Fraction(18,10)'
  # 転用：余裕の目安・人数4倍
  - 'abs(330 + 2*math.sqrt(147) - 354) < 0.5 and math.isclose(math.sqrt(4), 2)'
  # 発展：大数の法則
  - 'math.isclose(0.7/math.sqrt(100), 0.07) and math.isclose(0.7/math.sqrt(10000), 0.007)'
