id: U31
number: "31"
title: 標本調査・調査誤差・偏り
domain: D8
reference_section: ⑧ 調査・実験
prev: U30
next: U32
prereq: [U17, U18, U22]
used_by: [U32]
terms: [TERM-strat-sampling, TERM-cluster-sampling, TERM-systematic-sampling, TERM-multistage-sampling, TERM-sampling-error, TERM-nonsampling-error, TERM-frame, TERM-bias]
labs: [LAB-survey]
goal: 層化・集落・系統・多段抽出を区別して選ばれ方に合わせた重みで集計し、地域や店の違いで精度がどう変わるか、名簿の漏れや無回答の偏りが n を増やしても消えないことを、ラボで動かして説明できる。
stage_goals:
  S1: 「各層から同じ数を選んだら、母集団の割合で重みを付ける。なぜなら〜」「1万人の回答でも偏りは消えない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、4つの抽出法を区別し、層化の集計・多段の確率と重み・偏りのある回答の割合を計算できる。間違えた所だけ初学に戻る。
  S3: 問題文に「層化」「非標本誤差」とは書いていない。**選び方を見分け、選ばれる確率に合わせて重みを付け、精度を見積もり、確かめられない偏りを分けて報告する**。
  S4: 店の種類別の客単価・店内アンケート・本部の客の声・レジの記録のように、場面が違っても「選ばれ方に合わせて集計し、偏りを分けて書く」形は同じ。
  S5: 統計検定の枠の外。n を増やしても偏りが消えない理由、配分で精度が変わる理由、回答率という1つの数で消えるもの、重みとばらつきの関係を考える。興味のあるものを1つ選べばよい。
  S6: 統計検定の枠の外。要因の混ざった調査の状況から自分で問いを立てて動かし、**統計で言えること**と**自分の解釈**を分けて書く。答えは1つではない。
evidence:
  S1: 層化の重み付き平均を計算し、標本誤差と非標本誤差を区別して説明できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 抽出法・重み・精度・偏りを判断し、報告に書き分けられた
  S4: 職場の調査を、選ばれ方と偏りに分けて読めた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
