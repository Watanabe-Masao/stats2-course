id: U31
number: "31"
title: 標本調査・調査誤差・偏り
domain: D8
reference_section: ⑧ 調査・実験
prev: U30
next: U32
prereq: [U17, U18, U22]
used_by: [U32]
terms: [TERM-strat-sampling, TERM-cluster-sampling, TERM-systematic-sampling, TERM-multistage-sampling, TERM-sampling-error, TERM-nonsampling-error, TERM-frame, TERM-bias]
labs: [LAB-survey]
goal: 層化・集落・系統・多段抽出を区別して選ばれ方に合わせた重みで集計し、地域や店の違いで精度がどう変わるか、名簿の漏れや無回答の偏りが n を増やしても消えないことを、ラボで動かして説明できる。
stage_goals:
  S1: 「各層から同じ数を選んだら、母集団の割合で重みを付ける。なぜなら〜」「1万人の回答でも偏りは消えない。なぜなら〜」を自分の言葉で言えれば完了。
  S2: 資料を見ずに、4つの抽出法を区別し、層化の集計・多段の確率と重み・偏りのある回答の割合を計算できる。間違えた所だけ初学に戻る。
  S3: 問題文に「層化」「非標本誤差」とは書いていない。**選び方を見分け、選ばれる確率に合わせて重みを付け、精度を見積もり、確かめられない偏りを分けて報告する**。
  S4: 店の種類別の客単価・店内アンケート・本部の客の声・レジの記録のように、場面が違っても「選ばれ方に合わせて集計し、偏りを分けて書く」形は同じ。
  S5: 統計検定の枠の外。ネイマン配分が分散でなく標準偏差に比例する理由、「10店を調べた」という1つの数で消えるもの（選んだ単位の数と単位の中の似かた）、層化の重みに使う層の割合が古いときに残るずれ、重みが直すものと直さないもの。興味のあるものを1つ選べばよい。
  S6: 答えが1つに決まらない課題。くじで選んだ店が断り、代わりの店で聞いた調査の結果を、**問いを立てる→仮定を置く→方法を組む→小さな例で検証する→統計で言えること・言えないことを切り分ける**の順に考え、断った店の扱いと報告する数を選ぶ。
evidence:
  S1: 層化の重み付き平均を計算し、標本誤差と非標本誤差を区別して説明できた
  S2: 翌日・1週間後・1か月後に見ずに解けた
  S3: 抽出法・重み・精度・偏りを判断し、報告に書き分けられた
  S4: 職場の調査を、選ばれ方と偏りに分けて読めた
  S5: 1つ選んで理解を確かめた（任意）
  S6: 課題を1つ作り、検証まで行った（任意）
figures:
  - id: FIG-U31-concept
    caption: 10地域×10店（1行が1地域）から10店を選ぶ。層化はどの地域からも1店ずつ、集落は1つの地域の10店を全部選ぶ
    spec:
      type: grid
      title: 層化はどの地域からも少しずつ、集落は選んだ地域を全部
      rows: 10
      cols: 10
      panels:
        - {label: 層化抽出, pick: strat}
        - {label: 集落抽出, pick: cluster}
      row_label: 1行が1地域、1升が1店。塗った升が調べる店
      note: 層化では地域の違いが推定値のばらつきに入らず、集落ではどの地域を引いたかがそのまま推定値に出る
  - id: FIG-U31-error
    caption: 偏りが10ポイントの調べ方で、回答数を100人から1万人まで増やしたときの標準誤差と総合誤差（割合が0.5 前後、単位はポイント）
    spec:
      type: line
      zero: true
      title: 人数を増やすと標準誤差は縮むが、総合誤差は偏りより小さくならない
      labels: [100人, 400人, 1600人, 1万人]
      series:
        - {label: 総合誤差, values: [11.2, 10.3, 10.1, 10.0]}
        - {label: 標準誤差, values: [5, 2.5, 1.25, 0.5]}
        - {label: 偏り, values: [10, 10, 10, 10], show_values: false}
