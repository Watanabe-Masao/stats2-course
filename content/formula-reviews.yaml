  judgement: "成立条件の書き方を変えたことによるやり直し（#249。渡辺さん 2026-11-08 の決まり：分布は確率関数の式を基準の定義にし、成立条件を要件・仮定に分ける）。前回の記録（2026-11-04、b736245fa6eb56a5）からの差分だけを確かめた。TERM-binom で変わったのは basis_formula: F-binom-pmf・conditions.math の区分の形と要件の行・group だけで、conditions を origin/main の文に戻して指紋を計算し直すと b736245fa6eb56a5 にちょうど戻る（式の木・記号の表・parts・why・誤解・反例の文・契約・実験室の反例は前回と同じ）。要件の行「n は1以上の整数（教材では n＝0 を扱わない）・0≦p≦1」は記号の domain（n：min 1・整数、p：0〜1）と F-binom-mean・F-binom-var の範囲、実験室のつまみ（n 1〜30、p 0〜1）と一致する。一般には n＝0 でも X＝0 に確率1が集まる形で定義できるので、「教材では扱わない」と書いて外れたときを「この定義の二項分布として扱えない」としたのは正しい。4つの仮定（回数が決まっている・2値・同じ p・独立）は独立同分布のベルヌーイ試行の和が B(n, p) になるための十分条件で必要条件ではないので、claim「成功回数 X が B(n, p) に従う」と outside「保証できない（偶然に一致することはある）」は正しい。偶然に一致する例を並びの全部の書き出しと分数で確かめた：n＝3・p＝1/2 で P(000)＝1/8・P(100)＝1/4・P(010)＝1/8・P(001)＝0・P(110)＝0・P(101)＝1/8・P(011)＝1/4・P(111)＝1/8 とすると、周辺確率はどれも 1/2 で P(X₂＝X₃＝1)＝3/8≠1/4（独立でない）なのに、成功回数は 1/8・3/8・3/8・1/8 で B(3, 1/2) と同じ。n＝2 で周辺確率が同じなら独立になるしかなく、独立でないまま一致する例は n≧3 から。実験室 EXP-binom-p の反例の breaks（urn・streak は各回が独立、mix は同じ p・独立、fatigue は同じ p）はどれも仮定の行を指し、母数は要件の範囲の中に置いたまま仮定だけを崩していて、区分と食い違わない。このレビューで、区分（kind・claim・outside・terms）と basis_formula が版（fingerprint）に入っていないことが見つかったので、build/formulas.py の fingerprint に入れてから版を取り直した（区分を持たない概念の式の版は変わらない）"
