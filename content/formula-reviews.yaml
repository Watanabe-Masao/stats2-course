- formula: F-binom-pmf
  points:
  - モデルの仮定（独立・同じ p）と反例の実験の言い分
  judgement: 式は ₙCₖpᵏ(1−p)ⁿ⁻ᵏ（『統計学入門』6章、Casella & Berger (3.2.3)）、仮定は独立同分布のベルヌーイ試行（回数が固定・2値・p が同じ・独立）。反例の言い分は effects.py に頼らず、0/1 の並び 2ⁿ 通りを全部書き出し起き方の定義から並びの確率を分数で求めて確かめた（n＝1〜10、p は 0.05 刻みとテーマの p、崩す強さは定義の値と画面のつまみの両端）。戻さずに取るはどの回も周辺確率が当たりの割合で独立だけを崩し、平均は同じで散らばりが小さい。引きずられるは周辺確率 p のまま独立を崩し、日や時間で確率が違うはセットの中で確率のずれが共通で回どうしの共分散が d²。どちらも平均 np のまま散らばりが大きい。新しい疲れて確率が下がるは回ごとの確率が違い独立のまま（Σpᵢ＝np、分散 Σpᵢ(1−pᵢ)＝np(1−p)−Σ(pᵢ−p)²）で、散らばりが小さい。いずれも n＝1・p＝0・1（当たりが0個か全部）では二項分布と一致する。客の型が決まった割合で独立なら狭く（ポアソン二項分布）、客ごとに毎回でたらめに選ぶなら二項分布と同じ、という書き分けも列挙で確かめた。lab.ts（drawSet・mechanismMoments）と画面の比べる二項分布（戻さずに取るだけ当たりの割合）は文と同じ主張を指す。疲れての差は小さく、n＝10・p＝0.5 の 100 セットでは約2割の実験で逆の向きに見えるので、その注意を文に書いた
