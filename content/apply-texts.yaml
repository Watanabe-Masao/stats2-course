# 応用の課題の解き方の段の文（実験室の応用で、答えのあとに出す「解き方」。stats2-course #211）
# engine（knowledge-net の math-lab）は、段ごとに 文の型の id・穴の値・別の言い方だけを返す。文はここに書く。
# id・穴の名前・別の言い方・語は engine の表（docs/math-lab/contracts.json の apply_steps・apply_words）に合わせる（build が止める）。
# {名前} は engine が返す穴の値（数は見せる形）。words の穴（op・param）は値を言葉にする。式（TeX）は engine が数から作る。

words:
  op: {eq: ちょうど, ge: 以上, le: 以下, gt: より多い}
  param: {carry: 引きずる強さ, spread: ずれ幅 d, drop: ずれ幅 d}

steps:
  # 事象の確率（ちょうど・以上・以下・より多い）
  event.one: {title: 値を入れて計算する}
  event.sum:
    title: 棒の和の形にする
    text: "「{k} 回{op}」に入る棒を全部足す。"
    variants: {rest: {text: "「{k} 回{op}」の棒は {nin} 本。残りの {nrest} 本を 1 から引くほうが短い（確率の合計は 1）。"}}
  event.each: {title: 1本ずつの確率, text: どの棒も P(X＝k)＝ₙCₖ pᵏ(1−p)ⁿ⁻ᵏ に k を入れる。}
  event.total: {title: 合計}

  # 逆算：平均から p
  mean-to-p.goal: {title: 何を求めるか, text: "{n} 回の成功の回数 X の平均（期待値）を {mean} 回にする、1回の成功確率 p。"}
  mean-to-p.formula: {title: 大元の公式, text: 二項分布の平均は、回数 n×1回の成功確率 p。}
  mean-to-p.put: {title: 値を入れる}
  mean-to-p.calc: {title: 計算する, text: 両辺を n で割る。}
  mean-to-p.check: {title: 検証, text: 下の道具で n と p をこの値にすると、中心 n×p がこの値になる。}

  # 設計：割合の標準偏差を上限以下にする最小の n
  min-n-share-sd.goal: {title: 何を求めるか, text: "成功の割合 p̂（成功の回数 X を n で割った値）は、調べるたびにばらつく。そのばらつき（標準偏差）を {sd} 以下にする、いちばん少ない回数 n。"}
  min-n-share-sd.formula: {title: 大元の公式, text: 回数 X の分散は np(1−p)。割合は X を n で割るので、分散は n² で割る。標準偏差はその平方根。}
  min-n-share-sd.put: {title: 値を入れる}
  min-n-share-sd.calc: {title: 計算する, text: 両辺を2乗して √ を外し、n について解く。}
  min-n-share-sd.answer:
    title: 答え（整数に切り上げる）
    text: "回数は整数なので {n} 回。確かめ：{prev} 回では {sdPrev}（{sd} を超える）、{n} 回で {sdN}（{sd} 以下）。"
    variants: {one: {text: "回数は整数なので {n} 回。"}}

  # 反証：割合が同じ2つの「ちょうど k 回」
  compare-eq.goal: {title: 何を比べるか, text: "{an} 回中ちょうど {ak} 回と、{bn} 回中ちょうど {bk} 回。割合は同じでも、「ちょうどその回数」になる確率は同じとは限らない。"}
  compare-eq.formula: {title: 大元の公式}
  compare-eq.case: {title: "{n} 回中 {k} 回（n＝{n}・k＝{k}・p＝{p}）"}
  compare-eq.compare:
    title: 比較
    text: ほぼ同じ（0.9〜1.1 倍）。並びの数 ₙCₖ は増えるが、1つの並びの確率がそれ以上に小さくなる。
    variants:
      a: {text: "{an} 回中 {ak} 回の方が約 {r} 倍起きやすい。並びの数 ₙCₖ は増えるが、1つの並びの確率がそれ以上に小さくなる。"}
      b: {text: "{bn} 回中 {bk} 回の方が約 {r} 倍起きやすい。並びの数 ₙCₖ は増えるが、1つの並びの確率がそれ以上に小さくなる。"}

  # 評価：以上と、より多い の差
  boundary.goal: {title: 何を求めるか, text: "「{k} 回以上」と「{k} 回より多い」の確率の差（n＝{n}・p＝{p}）。"}
  boundary.diff: {title: 2つの違い, text: "「以上」は境目の {k} 回を含み、「より多い」は含まない。差は境目の棒1本。"}
  boundary.formula: {title: 大元の公式}
  boundary.calc: {title: "値を入れて計算する（n＝{n}・k＝{k}・p＝{p}）"}
  boundary.check: {title: グラフで検証, text: "下の道具で n＝{n}・p＝{p}・k＝{k} にすると、「{k} 回以上」{ge} と「{k1} 回以上」{gt} が出る。その差が境目の棒（ちょうど {k} 回）。"}

  # 評価：その結果になる人数の期待値
  expected-observers.goal:
    title: 何を求めるか
    text: "{people} 人がそれぞれ {n} 回挑戦したとき、「{k} 回{op}」になる人数の平均。"
    variants: {all: {text: "{people} 人がそれぞれ {n} 回挑戦したとき、「{n} 回とも成功」になる人数の平均。"}}
  expected-observers.one: {title: 1人の確率（大元の公式）, text: まず1人について、その結果になる確率を求める。}
  expected-observers.mean: {title: 人数の平均（大元の公式）, text: "起きる人数 Y は、{people} 人それぞれの「起きる・起きない」を数えたもの。人数 N と1人の確率 P の二項分布なので、平均は N×P。"}
  expected-observers.calc:
    title: 値を入れて計算する
    variants: {rare: {text: "1人では約 {inv} 人に1人の珍しさでも、{people} 人いれば平均で約 {mean} 人。"}}
  expected-observers.any: {title: 少なくとも1人いる確率}

  # 設計：割合のずれの目安を許す幅以内にするセット数
  sets-for-error.goal:
    title: 何を求めるか
    text: "何セットも実験して「{k} 回{op}」（n＝{n}・p＝{p}）になったセットの割合を数える。その割合と理論の確率とのずれの目安（±2 標準誤差）を {err} ポイント 以内にする、いちばん少ないセット数 N。"
    variants: {unit: {text: "何セットも実験して「{k} 回{op}」（n＝{n}・p＝{p}）になったセットの割合を数える。その割合と理論の確率とのずれの目安（±2 標準誤差）を {err} ポイント 以内にする、いちばん少ないセット数 N（{u} セット単位）。"}}
  sets-for-error.prob: {title: 理論の確率 P（大元の公式）}
  sets-for-error.se: {title: ずれの目安（大元の公式）, text: 1セットごとに「当てはまる・当てはまらない」の 0 か 1。割合はその平均なので、標準誤差は √(P(1−P)÷N)。}
  sets-for-error.put: {title: 値を入れる}
  sets-for-error.calc: {title: 計算する, text: 両辺を2で割り、2乗して √ を外し、N について解く。}
  sets-for-error.answer:
    title: 答え（整数に切り上げる）
    text: "{N} セット。確かめ：{prev} セットでは ±{sePrev} ポイント（{err} ポイント を超える）、{N} セットで ±{seN} ポイント（{err} ポイント 以内）。"
    variants: {unit: {title: "答え（{u} セット単位に切り上げる）"}}
  sets-for-error.none: {title: 求める, text: 理論の確率が 0 か 1 なので、ずれは起きない。1セットで足りる。}

  # 反証：平均が np でも二項分布と言えるか
  binom-judge.goal: {title: 何を確かめるか, text: 二項分布かどうかは平均だけでは決まらない。平均とばらつき（分散）の両方を、二項分布の式と比べる。}
  binom-judge.formula: {title: 大元の公式（二項分布）}
  binom-judge.put: {title: 値を入れる}
  binom-judge.judge:
    title: 比べて判断する
    text: "平均は同じでも、分散は二項分布の {r} 倍。二項分布とは言えない（毎回同じ確率・独立のどれかが崩れている）。"
    variants: {same: {text: 平均も分散も同じなので、この点では二項分布と言える。}}

  # 評価：分散の比が許す倍率に収まる最大の強さ
  max-strength.goal: {title: 何を求めるか, text: "分散が二項分布の {ratio} 倍以内なら近似してよいとする。そのときに許される、いちばん大きい{param}（{step} 刻み）。"}
  max-strength.next: {title: 1つ大きくしてみる, text: "{ratio} 倍を超える。"}
  max-strength.answer: {title: 答え, text: "{param} {x}（比 {r} 倍）。下の道具で強さを動かすと、比がこの値になる。"}

  # 変換：戻さずに取るときの最小の玉の数
  min-total.goal:
    title: 何を求めるか
    text: "箱から戻さずに {n} 個取ると、分散は戻して取るとき（二項分布）より小さくなる。小さくなっても {ratio} 倍以上にとどまる、いちばん少ない箱の中の玉の数 N。"
    variants: {unit: {text: "箱から戻さずに {n} 個取ると、分散は戻して取るとき（二項分布）より小さくなる。小さくなっても {ratio} 倍以上にとどまる、いちばん少ない箱の中の玉の数 N（{st} 個単位）。"}}
  min-total.formula: {title: 大元の公式（有限母集団修正）, text: 戻さないと取るたびに箱の中身が変わり、その分だけ分散が縮む。}
  min-total.put: {title: 値を入れる}
  min-total.calc: {title: 計算する, text: 両辺に N−1 を掛け、N を左にまとめて解く。}
  min-total.answer:
    title: 答え
    text: "{N} 個。確かめ：{prev} 個では {fp} 倍、{N} 個で {fN} 倍。取る数は箱の約 {share}。"
    variants: {unit: {title: "答え（{st} 個単位に切り上げる）"}}

  # 逆算：分散からずれ幅 d
  solve-spread.goal: {title: 何を求めるか, text: 日によって成功確率が p−d か p＋d に変わると、成功の回数の分散は二項分布より大きくなる。増えた分から、ずれ幅 d を逆に求める。}
  solve-spread.formula: {title: 大元の公式, text: 1日の中のばらつき（二項分布の分）に、日ごとの確率の違いの分が足される。}
  solve-spread.put: {title: 値を入れる}
  solve-spread.calc: {title: 計算する}
  solve-spread.check: {title: 検証, text: "確率は p−d＝{lo} と p＋d＝{hi} の日が半々。下の道具でずれ幅をこの値にすると、分散がこの値になる。"}

  # 評価：いちばん起こりやすい成功回数
  mode.goal: {title: 何を求めるか, text: "成功確率 {p} で {n} 回。いちばん起こりやすい成功の回数（確率がいちばん大きい棒）。"}
  mode.formula: {title: 大元の公式, text: P＝並びの数×1つの並びの確率。並びの数 ₙCₖ は真ん中（k＝n÷2）でいちばん多い。1つの並びの確率 pᵏ(1−p)ⁿ⁻ᵏ は、p が大きいと k が大きいほど大きい。その掛け算で決まる。}
  mode.calc: {title: "値を入れて計算する（n＝{n}・p＝{pv}）", text: "並びの数は {half} 回がいちばん多い（{c} 通り）が、1つの並びの確率は {k} 回の方がずっと大きい。"}
  mode.answer:
    title: 答え
    text: "{k} 回。確かめ：となりの棒より大きい（{km} 回 {pkm}・{kp} 回 {pkp}、{k} 回 {pk}）。目安は (n＋1)p＝{t} の整数の部分。"
    variants:
      upper: {text: "{k} 回。確かめ：となりの棒より大きい（{kp} 回 {pkp}、{k} 回 {pk}）。目安は (n＋1)p＝{t} の整数の部分。"}
      lower: {text: "{k} 回。確かめ：となりの棒より大きい（{km} 回 {pkm}、{k} 回 {pk}）。目安は (n＋1)p＝{t} の整数の部分。"}

  # 反証：±2SE の帯の中か
  within-band.goal: {title: 何を確かめるか, text: "理論の確率 {P} で {m} 回中 {x} 回（{obs}）。このずれが、実験のばらつき（標本変動）の範囲かどうか。"}
  within-band.formula: {title: 大元の公式, text: 同じ条件の実験をくり返すと、割合は理論のまわりを SE ほどばらつく。±2SE の帯の中なら、ばらつきとして説明できる。}
  within-band.put: {title: 値を入れる}
  within-band.band: {title: 帯を計算する}
  within-band.judge:
    title: 比べて判断する
    text: 帯の中なので、理論が間違いとは言えない（ばらつきで説明できる）。ただし1回の実験で理論が正しいとも証明できない。
    variants: {out: {text: 帯の外なので、ばらつきだけでは説明しにくい。理論か、実験の条件を疑う。}}

  # 変換：期待値の線形性
  linear-sum.goal: {title: 何を求めるか, text: "成功で {a} 円、失敗で {b} 円。成功確率 {p} で {n} 回くり返したときの、合計金額の期待値。"}
  linear-sum.formula: {title: 大元の公式（期待値の線形性）, text: 1回の値 W は、成功なら a、失敗なら b。合計の期待値は、1回の期待値を足したもの（独立でなくても成り立つ）。}
  linear-sum.put: {title: 値を入れる}
  linear-sum.calc: {title: 計算する}
  linear-sum.alt: {title: 別の見方で検証, text: E(X) は成功の回数の平均。成功の回数の平均 np を使っても同じ。期待値は線形なので、値を付け替えても平均から計算できる。}

  # 評価：2つの二項分布の分散
  compare-var.goal: {title: 何を比べるか, text: "A：n＝{an}・p＝{ap}、B：n＝{bn}・p＝{bp}。平均が同じでも、ばらつき（分散）は同じとは限らない。"}
  compare-var.formula: {title: 大元の公式, text: 1回の分散 p(1−p) を n 回分足す（各回は独立）。}
  compare-var.mean: {title: 平均}
  compare-var.var: {title: 分散}
  compare-var.compare:
    title: 比較
    text: ほぼ同じ。平均だけではばらつきは決まらない。p が 0.5 に近いほど1回の p(1−p) は大きいが、回数 n が多いほど足す数も増える。
    variants:
      a: {text: "A の方が大きい（{r} 倍）。平均だけではばらつきは決まらない。p が 0.5 に近いほど1回の p(1−p) は大きいが、回数 n が多いほど足す数も増える。"}
      b: {text: "B の方が大きい（{r} 倍）。平均だけではばらつきは決まらない。p が 0.5 に近いほど1回の p(1−p) は大きいが、回数 n が多いほど足す数も増える。"}

  # 値の表（期待値の実験室。#364）
  table-weight-for-mean.goal: {title: 何を求めるか, text: "{x} の重みだけを t とおき（ほかの重みはそのまま）、期待値をちょうど {mean} にする t を求める。"}
  table-weight-for-mean.formula: {title: 大元の公式, text: x は値、w はその値の重み。重みの比が確率なので、期待値は「値×重み」の和を重みの和で割った数（値×確率の和と同じ）。}
  table-weight-for-mean.put: {title: 値を入れる, text: "替える値の行のほかは、値×重み の和が {S}、重みの和が {W}。替える行の 値×t と t を足して、期待値を目標と等しくおく。"}
  table-weight-for-mean.calc: {title: 計算の過程, text: 両辺に分母を掛け、t の項を片側に集めて t を求める。}
  table-weight-for-mean.check: {title: 確かめる, text: 求めた t を重みに入れ直すと、期待値が目標になる。}
  table-mean-on-table.goal: {title: 何を確かめるか, text: 3つの表それぞれの期待値を求め、表の値の1つと同じになる表を探す。}
  table-mean-on-table.formula: {title: 大元の公式, text: x は値、w はその値の重み。期待値は「値×重み」の和を重みの和で割った数（値×確率の和）。}
  table-mean-on-table.means: {title: 3つの表の期待値}
  table-mean-on-table.judge: {title: 判断, text: "{name} だけ、期待値 {mu} が表の値の1つと同じ。ほかの2つは値と値の間に来る（1回では出ない値）。"}
  table-mean-mode.goal: {title: 何を確かめるか, text: "期待値 {mu} は表の値の1つ。1回引いたとき {mu} がいちばん出やすいかを、値ごとの確率で確かめる。"}
  table-mean-mode.formula: {title: 大元の公式, text: x は値、w はその値の重み。期待値は「値×重み」の和を重みの和で割った数。値ごとの確率は、その値の重み÷重みの和。}
  table-mean-mode.mean: {title: 期待値}
  table-mean-mode.probs: {title: 値ごとの確率}
  table-mean-mode.judge:
    title: 判断
    text: "{mu} の確率は {pmu} で、いちばん出やすいのは {mode}（{pmode}）。期待値は重心で、いちばん出やすい値とは別のもの。"
    variants:
      same: {text: "いちばん出やすいのも {mu}（{pmu}）。この表では一致するが、期待値が表の値でも、いちばん出やすい値と一致するとは限らない。"}
  table-min-var.goal: {title: 何を比べるか, text: "3つの表はどれも期待値 {mu}。毎回の結果がそろうかは、散らばり（分散）で比べる。"}
  table-min-var.formula: {title: 大元の公式, text: μ は期待値、x は値、w はその値の重み。分散は「(値−μ)²×重み」の和を重みの和で割った数（期待値からのずれの2乗の期待値）。}
  table-min-var.var: {title: 3つの表の分散}
  table-min-var.compare: {title: 選ぶ, text: "{name} の分散がいちばん小さい（次に小さい表の {r} 分の1）。毎回の結果をそろえたいなら {name}。"}

  # 崩した起き方の平均と分散
  mech.fatigue.probs: {title: 崩した起き方の確率, text: "回を追って確率が {first} から {last} へ下がる。i 回目の確率 pᵢ：{list}。各回は独立。"}
  mech.fatigue.formula: {title: 平均と分散（大元の公式：独立な 0/1 の和）}
  mech.fatigue.calc: {title: 値を入れて計算する, text: 確率の高い回と低い回が混ざると、1回ごとの p(1−p) が小さくなり、合計の分散は二項分布より小さい。}
  mech.mix: {title: 崩した起き方の分散（大元の公式）}
  mech.streak: {title: 崩した起き方の分散（大元の公式）}

  # 強さを変えたときの分散の比
  ratio.streak.formula: {title: 大元の公式（前の結果に引きずられる）, text: c は引きずる強さ。隣どうしの相関が c、2つ離れると c²…と積み重なる。}
  ratio.streak.calc: {title: "値を入れて計算する（c＝{c}・n＝{n}）"}
  ratio.mix: {title: 大元の公式（日によって確率が違う）}
  ratio.other: {title: 比を求める, text: "{key}＝{x} のとき。"}
