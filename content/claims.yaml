- id: CLM-45
  label: ④-45
  kind: 極限
  statement:
    text: 2群がそれぞれ独立に Bern(p₁)・Bern(p₂) に従う標本（大きさ n₁・n₂）で、2群が互いに独立、H₀：p₁＝p₂（共通の値 p は 0＜p＜1 で固定）が正しいとき、n₁, n₂ がともに→∞ で、プールした比率 p̄＝(n₁p̂₁＋n₂p̂₂)/(n₁＋n₂) で作った z＝(p̂₁−p̂₂)/√(p̄(1−p̄)(1/n₁＋1/n₂)) の分布は N(0, 1) に近づく
  premises:
