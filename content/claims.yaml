- id: CLM-19
  label: ④-19
  kind: 極限
  statement:
    text: X₁, …, Xₙ の標本比率 p̂ について、下の条件のもとで、n→∞ で (p̂−p)/√(p̂(1−p̂)/n) の分布は N(0, 1) に近づく。だから、各 p（固定）での p̂ ± z_{α/2}·√(p̂(1−p̂)/n) の被覆確率は、n→∞ で 1−α に近づく（有限の n では近似）。信頼係数（p についての被覆確率の下限）は、どの n でも 0 で、1−α には近づかない（X＝0 のとき区間は {0} なので、被覆確率は 1−(1−p)ⁿ 以下）
  premises:
    subjects:
    - TERM-sample-prop
  conclusion:
    subjects:
    - TERM-ci
    predicates:
    - TERM-conf-level
  conditions:
  - text: X₁, …, Xₙ が独立に同じ Bern(p) に従う
    kind: 仮定
    outside: 独立でない・同じ分布でないときは、この正規極限は保証されない
  - text: 0＜p＜1
    kind: 仮定
    outside: p が 0 か 1 なら p̂ は定数で、p̂(1−p̂)＝0 となり統計量が定まらず、この極限は保証されない
  - text: p は n によらず固定する
    kind: 仮定
    outside: p が n とともに変わる場合、この正規極限は保証されない
  grounds:
  - claim: CLM-6b
  - claim: CLM-20b
  - source:
      title: スルツキーの定理（p̂(1−p̂) → p(1−p) の平方根をとる所は連続写像定理）
      locator: 照合した2次資料：Stanford Stats 300b（2019年冬、J. Duchi）Lecture 1。p.4 Theorem 1（連続写像定理。g が P(X∈B)＝1 の集合 B で連続）、p.4 Theorem 2（Slutsky。(1) 定数への分布収束と確率収束は同値、(2) d(Xₙ,Yₙ)→0（確率）なら同じ極限）、p.5 その帰結（Xₙ→X（分布）・Yₙ→c（分布。(1) で確率と同じ）なら Xₙ＋Yₙ→X＋c、YₙXₙ→cX、c≠0 なら Xₙ/Yₙ→X/c）https://web.stanford.edu/class/stats300b/ScribeNotes/2019/lecture-01.pdf
    external: true
  - source:
      title: p̂ が 0 か 1 のとき分母は 0 になるが、その確率は n→∞ で 0 に近づくので、その場合の値をどう決めても極限は同じ（区間の幅は 0 になる。④ §8）
  teaching:
