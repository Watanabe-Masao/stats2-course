- id: CLM-28b
  label: ④-28b
  kind: 極限
  statement:
    text: n 個の観測が独立に k 個の区分に入り（区分の境目はデータを見る前に決める。どの区分の確率も正）、H₀ が正しく、m 個の母数を区分の度数から最尤法（または修正した最小カイ二乗法）で推定し、Cramér（1946、pp.477–479）の正則条件を満たすとき、Σ(O−E)²/E の分布は n→∞ で χ²(k−1−m) に近づく（教材では k−1−m≧1 の場合だけを扱う。適用の目安「期待度数が5以上」は、主張ではなく適合度検定（手続き）の条件。③ の 2。#278）。正則条件の中身（真の母数が内点・区分の確率が母数で微分でき、そのヤコビ行列の階数が m、など）は記憶によるもので、原典でも2次資料でも確かめていない。確定した条件に数えない
  premises:
    subjects:
    - TERM-expected
  conclusion:
    subjects:
    - TERM-test-stat
    predicates:
    - TERM-chi2
  grounds:
  - source:
      title: Cramér 1946（原典は未照合。2次資料で結論と頁まで確かめた）
    external: true
  - source:
      title: 区分の境目を前もって決め、生のデータ（区分する前の値）から最尤法で推定すると、極限は χ²(k−1−m)＋Σ_{j=1}^{m} λⱼZⱼ²（Z は独立に N(0, 1)、0≦λⱼ＜1、λ は未知の母数による）の形で、確率の大小の意味で χ²(k−1−m) と χ²(k−1) の間になり、分布によらない検定にならない（Chernoff・Lehmann 1954。原典は未照合）。境目をデータから決める場合は範囲外
      locator: 照合した2次資料：Cornell BU-503-M、core.ac.uk 85220922
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: D
      date: '2026-11-08'
      version: 525bbdb
    - method: 独立な確かめ
