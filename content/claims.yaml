      uses: [CLM-6b, CLM-20b]
      locator: 照合した2次資料：UC Berkeley Statistics 205A（2002年秋、J. Pitman）Lecture 14 Theorem 14.2（p.14-1。各 t で E e^{itXₙ}→φ(t) で、φ が t＝0 で連続なら、φ はある X の特性関数で Xₙ→X（分布））https://www.stat.berkeley.edu/~pitman/s205f02/lecture14/lecture14.pdf ・Stanford Stats 300b（2019年冬、J. Duchi）Lecture 1 p.3 Definition 0.3（分布収束の同値な定義：有界で連続な f について E f(Xₙ)→E f(X)）・p.5（Slutsky の帰結 YₙXₙ→cX）https://web.stanford.edu/class/stats300b/ScribeNotes/2019/lecture-01.pdf
    external: true
  - source:
      title: 重みが収束しなくてよい所の筋。n₁(k), n₂(k)→∞ を満たすどの列についても示す（どの列でも言えれば2重の極限も言える）。各群の標準化した平均を Aₖ・Bₖ（それぞれ中心極限定理で N(0, 1) に近づく。n₁(k) が単調に増えなくても、分布関数の各連続点での収束は受け継がれる）、重みを wₖ＝√(n₂/(n₁＋n₂))（＝√((1/n₁)/(1/n₁＋1/n₂))）∈[0, 1] とし、Zₖ＝wₖAₖ−√(1−wₖ²)Bₖ とする。2群の独立から、独立な確率変数の有界な関数の積の期待値は期待値の積（実部・虚部に分けて E(XY)＝E(X)E(Y) を当てる）なので、φ_{Zₖ}(t)＝E e^{itwₖAₖ}·E e^{−it√(1−wₖ²)Bₖ}。t を固めると、どの部分列にも wₖ→w となる部分列がある（wₖ は有界。ボルツァーノ＝ワイエルシュトラス）。そこでは √(1−wₖ²)→√(1−w²) で、定数 sₖ＝wₖt→wt について sₖAₖ→wtA（分布。スルツキー）なので E e^{isₖAₖ}→e^{−w²t²/2}（cos・sin は有界で連続）。もう一方も同じで、積は e^{−t²/2}。どの部分列にも φ_{Zₖ}(t)→e^{−t²/2} となる部分列があるので、数列として全体でも φ_{Zₖ}(t)→e^{−t²/2}。極限は t＝0 で連続な N(0, 1) の特性関数なので、Lévy の連続性定理で Zₖ→N(0, 1)（分布）
