- id: CLM-11
  label: ④-11
  kind: 推定量の性質
  statement:
    text: n≧2 で X₁, …, Xₙ が独立に同じ分布に従い、分散 σ² が有限のとき、すべての母数の値で E(s²)＝σ²
  premises:
