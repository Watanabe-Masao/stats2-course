- id: CLM-25
  label: ④-25
  kind: 従う
  statement:
    text: 単位時間あたりの平均件数が λ（λ＞0）のポアソン過程で、長さ t の区間の件数は Po(λt) に従い、時刻0から次に起きるまでの待ち時間 T は、平均 1/λ の指数分布に従う
  conclusion:
    predicates:
    - TERM-poisson
    - TERM-expo
  conditions:
  - text: 出来事が一定の割合 λ で起きる
    kind: 仮定
    outside: どちらの分布も使えるとは保証できない（時間帯で割合が変わるなら分けて見る）
  - text: 重ならない時間の件数が互いに独立
    kind: 仮定
    terms:
    - TERM-indep
    outside: どちらの分布も使えるとは保証できない
  teaching:
    conclusion: true
    proof: 範囲外
  gist: 同じ出来事を「一定時間に何件来るか」で見るとポアソン、「次の1件まで何分待つか」で見ると指数分布。見方が違うだけ。
  labs:
  - id: LAB-pois
