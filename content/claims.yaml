    kind: 仮定
    terms:
    - TERM-indep
    outside: E(s²)＝σ² とは保証できない（平均が違うと大きい側にずれ、相関があると一般にずれる（共分散の和が正なら小さい側に）。分散が違うと E(s²) は分散の平均になる）
  - text: 分散 σ² が有限
    kind: 仮定
    terms:
    - TERM-var
    outside: σ² が有限の値に定まらず、E(s²) も有限にならないので、不偏かどうかを言えない
