    - TERM-poisson
  grounds:
  - source:
      title: ₙCₖp_nᵏ(1−p_n)ⁿ⁻ᵏ＝(λᵏ/k!)·[n(n−1)…(n−k+1)/nᵏ]·(1−λ/n)ⁿ·(1−λ/n)^(−k)。[ ] と最後の因子は 1 に、(1−λ/n)ⁿ は e^(−λ) に近づく
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
