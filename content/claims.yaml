- id: CLM-28b
  label: ④-28b
  kind: 極限
  statement:
    text: 下の条件のもとで、Σ(O−E)²/E の分布は n→∞ で χ²(k−1−m) に近づく（教材では k−1−m≧1 の場合だけを扱う。適用の目安「期待度数が5以上」は、主張ではなく適合度検定（手続き）の条件。③ の 2。#278）
  premises:
    subjects:
    - TERM-expected
  conclusion:
    subjects:
    - TERM-test-stat
    predicates:
    - TERM-chi2
  conditions:
  - text: n 個の観測が独立に k 個の区分に入る
    kind: 仮定
    outside: 観測が独立でないと、χ²(k−1−m) に近づくとは保証されない
  - text: 区分の境目はデータを見る前に決める
    kind: 仮定
    outside: 境目をデータから決める場合は範囲外で、χ²(k−1−m) に近づくとは保証されない
  - text: H₀ のもとで、どの区分の確率も正
    kind: 仮定
    outside: 確率0の区分があると期待度数が0になり、この極限は保証されない
  - text: H₀ が正しい
    kind: 仮定
    outside: H₀ が誤りなら、χ²(k−1−m) に近づくとは保証されない（区分の確率が H₀ の族から外れていれば、統計量は n とともに確率的に大きくなる）
  - text: m 個の母数を、区分の度数から最尤法（または修正した最小カイ二乗法）で推定する（Cramér の定理が扱うのは、尤度方程式（修正した最小カイ二乗法の式と同じ）の解のうち、真の母数に確率収束するもの）
    kind: 仮定
    outside: 区分する前の生のデータから最尤法で推定すると、極限は χ²(k−1−m) と χ²(k−1) の間の分布になる（Chernoff・Lehmann 1954）
  - text: Cramér（1946、§30.3。定理の述べは pp.426–427）の条件を満たす：真の母数が、母数の取り得る区間 A の内点にあり、A の上で、区分の確率の和が1・どの区分の確率も正の定数より大きい（0 から離れている）・区分の確率が母数について連続な1階と2階の偏導関数を持つ・区分の確率を母数で微分した行列（k 行 m 列）の階数が m
    kind: 仮定
    outside: この条件が成り立たないと、この極限は保証されない（Cramér の定理は十分条件で、成り立たないときに極限が必ず崩れるとは言わない）
  grounds:
  - source:
      title: Cramér 1946 の §30.3 の定理（節は pp.423–434。定理の述べは pp.426–427、証明は pp.427–434）：区分の確率 p_i(α) が条件 (a)〜(d) を満たし、真の母数 α₀ が A の内点なら、修正した最小カイ二乗法（度数からの最尤法と同じ）の式の解で α₀ に確率収束するものがただ1つあり、それを入れた χ² 統計量は n→∞ で自由度 r−s−1 の χ² 分布に近づく（r は区分の数、s は母数の数）
      locator: 原典の本文で照らした：インターネットアーカイブの Digital Library of India のスキャンの OCR（https://archive.org/stream/in.ernet.dli.2015.149716/2015.149716.Mathematical-Methods-Of-Statistics_djvu.txt 。第30章は p.416 から、第32章は p.473 から。OCR の頁の割り付けは乱れていて、1頁ずれる余地がある）。条件 (c) は OCR が崩れていて「continuous derivatives … ∂α_j∂α_k」と読み、1階と2階の偏導関数と取った。前に書いていた pp.477–479 は第32章（推定量の分類）の頁で、誤りだった（#271 2026-11-19）
    external: true
  - source:
      title: 区分の境目を前もって決め、生のデータ（区分する前の値）から最尤法で推定すると、極限は χ²(k−1−m)＋Σ_{j=1}^{m} λⱼZⱼ²（Z は独立に N(0, 1)、0≦λⱼ＜1、λ は未知の母数による）の形で、確率の大小の意味で χ²(k−1−m) と χ²(k−1) の間になり、分布によらない検定にならない（Chernoff・Lehmann 1954。原典は未照合）。境目をデータから決める場合は範囲外
      locator: 照合した2次資料：Cornell BU-503-M、core.ac.uk 85220922
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
