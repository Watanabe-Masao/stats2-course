- id: CLM-29
  label: ④-29
  kind: 手続きの保証
  statement:
    text: 割り付けの前に値が決まっている共変量 Z（測っていないものを含む）について、完全無作為化（群の大きさ n₁・n₀（どちらも1以上）を先に決め、その大きさの割り付けを全部同じ確率で選ぶ）で割り付けると、各個体が処置群に入る確率がどれも n₁/(n₁＋n₀) で等しい（割り付けと独立に等確率で選んだ1個体の T と Z が独立）。だから2群の Z の平均の差の、割り付けについての期待値は 0 になる。Z を見ずに決めた確率でも、個体によって違えば、差の期待値は 0 になるとは限らない（n₁＝n₀＝1、Z₁＝0・Z₂＝10 で、個体1を処置群にする割り付けを確率 0.9、個体2を処置群にする割り付けを 0.1 で選ぶと、期待値は 0.9·(0−10)＋0.1·(10−0)＝−8。群の大きさを固定した割り付けの中では、測っていない Z も含めてどんな Z でも 0 にするには、各個体が処置群に入る確率が全部等しいことが要る（群の大きさが偶然で決まる割り付けには、この論法は使えない）。割り付けの全部が等確率である必要はない）。1回の割り付けで差が 0 になるとは限らない
  premises:
    subjects:
    - TERM-randomize
  conclusion:
    subjects:
    - TERM-randomize
    predicates:
    - TERM-indep
    - TERM-expect
  conditions:
  - text: 完全無作為化（群の大きさを先に決め、その大きさの割り付けを全部同じ確率で選ぶ）で割り付ける
    kind: 仮定
    outside: 各個体が処置群に入る確率が等しいとは限らない。確率が等しくても、各店を独立に0.5 で振るなど群の大きさが偶然で決まる割り付けには使えない
  grounds:
  - source:
      title: 完全無作為化では、各個体が処置群に入る確率がどれも n₁/(n₁＋n₀) で等しく、群の大きさが固定なので、各群の平均の期待値がどちらも Z の全体の平均に等しい。「交絡の原因にならない」はこの結果の解釈で、⑧ が扱う
  verification:
    math:
    - method: 独立な確かめ
      by: G
      date: '2026-11-08'
      version: a3d17e9
    external: なし
  version: 2   # 2026-11-26：概念の仮定の行を条件に移した（#532 C）
