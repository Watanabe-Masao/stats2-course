# 主張（製本 ④ の単位。原本へ移したもの。#287・#289）。id は ④ の番号（④-25 → CLM-25）。書き方は docs/authoring.md。
# 確かめの記録（verification）は、ここが正本（README の運用の決まり 6）。④ の §9 からは行を外す。
claims:
- id: CLM-1
  label: ④-1
  kind: 従う
  statement:
    text: 0≦p≦1 とし、X₁, …, Xₙ が独立に Bern(p) に従うとき、和 X₁＋…＋Xₙ は B(n, p) に従う（値は k＝0, 1, …, n）
  premises:
    subjects:
    - TERM-bernoulli
  conclusion:
    predicates:
    - TERM-binom
  grounds:
  - source:
      title: 和が k になる並びは ₙCₖ 通りで、どの並びの確率も（独立なので）pᵏ(1−p)ⁿ⁻ᵏ
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
- id: CLM-3
  label: ④-3
  kind: 極限
  statement:
    text: λ＞0 とし、X_n が B(n, λ/n)（n≧λ）に従うとき、n→∞ で、各 k＝0, 1, 2, … について P(X_n＝k) は e^(−λ)λᵏ/k! に近づく
  premises:
    subjects:
    - TERM-binom
  conclusion:
    predicates:
    - TERM-poisson
  grounds:
  - source:
      title: ₙCₖp_nᵏ(1−p_n)ⁿ⁻ᵏ＝(λᵏ/k!)·[n(n−1)…(n−k+1)/nᵏ]·(1−λ/n)ⁿ·(1−λ/n)^(−k)。[ ] と最後の因子は 1 に、(1−λ/n)ⁿ は e^(−λ) に近づく
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
- id: CLM-4
  label: ④-4
  kind: 極限
  statement:
    text: 取り出す数 n を固定し、M/N → p を保って N→∞ とすると、超幾何分布の確率関数は B(n, p) の確率関数に近づく
  premises:
    subjects:
    - TERM-hyper
  conclusion:
    predicates:
    - TERM-binom
  grounds:
  - source:
      title: 確率関数の各因子の極限
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
- id: CLM-5a
  label: ④-5a
  kind: 極限
  statement:
    text: X が B(n, p)（0＜p＜1 を固定）に従うとき、n→∞ で (X−np)/√(np(1−p)) の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-binom
  conclusion:
    predicates:
    - TERM-std-normal
  grounds:
  - claim: CLM-1
  - claim: CLM-6b
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: 未照合
  version: 1
- id: CLM-6a
  label: ④-6a
  kind: 従う
  statement:
    text: X₁, …, Xₙ が独立に N(μ, σ²)（σ＞0）に従うとき、標本平均 X̄ は N(μ, σ²/n) に従う
  premises:
    subjects:
    - TERM-sample-mean
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-normal
  conditions:
  - text: X₁, …, Xₙ が独立に同じ N(μ, σ²)（σ＞0）に従う
    kind: 仮定
    terms:
    - TERM-indep
    - TERM-normal
    outside: N(μ, σ²/n) に従うとは保証できない（正規でない母集団でも分散が有限なら、n が大きいとき標準化したものが N(0, 1) に近づく。CLM-6b）
  grounds:
  - source:
      title: 独立な正規分布の和は正規分布（再生性）
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
      by: L
      date: '2026-11-09'
      version: 02c937b
    external: 未照合
  version: 1
- id: CLM-6b
  label: ④-6b
  kind: 極限
  statement:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が 0＜σ²＜∞ のとき、n→∞ で √n(X̄−μ)/σ の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-sample-mean
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-std-normal
  conditions:
  - text: X₁, …, Xₙ が独立に同じ分布に従う
    kind: 仮定
    terms:
    - TERM-indep
    outside: 標準化した標本平均が標準正規分布に近づくとは保証できない
  - text: 分散 σ² が 0＜σ²＜∞
    kind: 仮定
    terms:
    - TERM-var
    outside: 近づくとは保証できない（裾の重い分布では近づかない）
  grounds:
  - source:
      title: 中心極限定理
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: 未照合
  version: 1
