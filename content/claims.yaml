- id: CLM-41
  label: ④-41
  kind: 等しい
  statement:
    text: n≧1 で、X₁, …, Xₙ が独立に同じ分布に従い、分散 σ² が有限のとき、標本平均の分散は V(X̄)＝σ²/n（標準偏差は σ/√n）
  premises:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-var
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-var
    - TERM-se
