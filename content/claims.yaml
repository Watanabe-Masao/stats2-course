  statement:
    text: n≧2 の正規母集団（σ＞0）の無作為標本で、H₀：μ＝μ₀ が正しいとき、t 統計量 (X̄−μ₀)/(s/√n)（s は n−1 で割る不偏分散の平方根）は t(n−1) に従う
  premises:
