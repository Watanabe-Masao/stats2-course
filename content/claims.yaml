  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
      by: L
      date: '2026-11-09'
      version: 02c937b
    external: なし
  version: 1
- id: CLM-10
  label: ④-10
  kind: 従う
  statement:
    text: n≧2 で X₁, …, Xₙ が独立に N(μ, σ²)（σ＞0）に従うとき、(n−1)s²/σ² は χ²(n−1) に従う（s² は不偏分散）
  premises:
    subjects:
    - TERM-unbvar
  conclusion:
    subjects:
    - TERM-unbvar
    predicates:
    - TERM-chi2
  conditions:
  - text: n≧2
    kind: 仮定
    outside: 不偏分散が定まらない
  - text: X₁, …, Xₙ が独立に同じ N(μ, σ²)（σ＞0）に従う
    kind: 仮定
    terms:
    - TERM-indep
    - TERM-normal
    outside: (n−1)s²/σ² がカイ二乗分布に従うとは保証できない（正規母集団でないと、一般には形が変わる）
  grounds:
  - source:
      title: Helmert の直交変換で Σ(Xᵢ−X̄)²/σ² を n−1 個の独立な N(0, 1) の2乗の和に書く（Cochran の定理）
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
      by: L
      date: '2026-11-09'
      version: 02c937b
    external: 未照合
  version: 1
