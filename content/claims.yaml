- id: CLM-25
  label: ④-25
  kind: 従う
  statement:
    text: 単位時間あたりの平均件数が λ（λ＞0）のポアソン過程で、長さ t の区間の件数は Po(λt) に従い、ある時刻（時刻0とする。どの時刻から測っても同じ）から次に起きるまでの待ち時間 T は、平均 1/λ の指数分布に従う
  conclusion:
    predicates:
    - TERM-poisson
    - TERM-expo
  conditions:
  - text: 重ならない時間の件数が互いに独立（出来事が互いに独立に起きる）
    kind: 仮定
    terms:
    - TERM-indep
    outside: ポアソン過程とは言えず、この主張は使えない。件数がからみ合う（1件起きると続けて起きやすい など）と、多くは長さ t の件数も Po(λt) から外れる（分散が平均より大きくなる）
  - text: 長さ t のどの時間の件数も、同じ Po(λt) に従う（起きる平均の割合 λ が一定。この教材ではここまでをポアソン過程の定義に含める）
    kind: 仮定
    outside: 時間帯で割合が変わると、どちらの分布も使えるとは保証できない（時間帯を分けて見る）
  teaching:
    conclusion: true
    proof: 範囲外
  gist: 同じ出来事を「一定時間に何件来るか」で見るとポアソン、「次の1件まで何分待つか」で見ると指数分布。見方が違うだけ。
  labs:
  - id: LAB-pois
    preset: rel-expo-tour
    purpose: t 時間に0件の確率が、次の1件まで t より長く待つ確率になることを段ごとに見る
  - id: LAB-pois
    preset: s5-free
    purpose: 0件の確率を時間を延ばして見ると、待ち時間の確率になる
  figures:
  - FIG-LAB-pois-rel-expo-tour-1
  - FIG-LAB-pois-rel-expo-tour-2
  grounds:
  - source:
      title: 前半はポアソン過程の定義（独立増分と件数の分布）から。後半は、前もって決めた時刻 s から測ると P(T＞t)＝P((s, s＋t] の件数が0)＝e^(−λt)（2つ目の条件で s によらない）。この定義から、短い時間 h に2件以上起きる確率は h に比べて無視できる（同時に2つは起きない）。逆に「割合が一定・独立・同時に2つ起きない」の3つから件数の分布を導くのは、定義とは別の話で、範囲の外（補足。2026-11-20 に定義の形を保つと決めた）。出来事が起きた時刻から次までの間隔も同じ指数分布になるが、それは前もって決めた時刻の話ではなく（強マルコフ性）、この主張の範囲の外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
