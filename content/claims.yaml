  - text: 共通の p は 0＜p＜1 で、n によらず固定
    kind: 仮定
    outside: p＝0 か 1 なら p̄(1−p̄)＝0 で z が定まらない。p が n とともに 0 に近づく場合は、標準正規分布に近づくとは保証されない
  - text: H₀（p₁＝p₂）が正しい
    kind: 仮定
    outside: 0 を中心にした標準正規分布に近づくとは言えない（差があれば |z| は n₁, n₂ とともに確率的に大きくなる。符号は差の向き）
  grounds:
