- id: CLM-5a
  label: ④-5a
  kind: 極限
  statement:
    text: X が B(n, p) に従うとき、下の条件のもとで、n→∞ で (X−np)/√(np(1−p)) の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-binom
  conclusion:
    predicates:
    - TERM-std-normal
  conditions:
  - text: 0＜p＜1
    kind: 仮定
    outside: p が 0 か 1 なら X は定数で np(1−p)＝0 となり、標準化した量が定まらないので、この極限は保証されない
  - text: p は n によらず固定する
    kind: 仮定
    outside: p が n とともに変わる場合、この正規極限は保証されない（np が正の定数に近づく場合はポアソン極限となる）
  grounds:
  - claim: CLM-1
  - claim: CLM-6b
  verification:
    math:
    - method: 独立な確かめ
      by: P
      date: '2026-11-09'
      version: 51a388a
    - method: 独立な確かめ
      by: '#307 の確かめ'
      date: '2026-11-18'
      version: de6bd04
    external: 2次資料
  version: 1
- id: CLM-6a
  label: ④-6a
  kind: 従う
  statement:
    text: X₁, …, Xₙ が独立に N(μ, σ²)（σ＞0）に従うとき、標本平均 X̄ は N(μ, σ²/n) に従う
  premises:
    subjects:
    - TERM-sample-mean
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-normal
  conditions:
  - text: X₁, …, Xₙ が独立に同じ N(μ, σ²)（σ＞0）に従う
    kind: 仮定
    terms:
    - TERM-indep
    outside: N(μ, σ²/n) に従うとは保証できない（正規でない母集団でも分散が有限なら、n が大きいとき標準化したものが N(0, 1) に近づく。中心極限定理）。独立でなければ X̄ の分散が σ²/n とは限らない
  grounds:
  - source:
      title: 独立な正規分布の和は正規分布（再生性）
      locator: 照合した2次資料：Penn State STAT 414 §26.1「Sums of Independent Normal Random Variables」の定理（互いに独立な正規確率変数の1次結合 Σcᵢ Xᵢ は N(Σcᵢμᵢ, Σcᵢ²σᵢ²) に従う）https://online.stat.psu.edu/stat414/book/export/html/785
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
      by: L
      date: '2026-11-09'
      version: 02c937b
    external: 2次資料
  version: 2   # 2026-11-26：概念の仮定の行の説明を外れたときの文に引き継いだ（#532 C）
- id: CLM-6b
  label: ④-6b
  kind: 極限
  statement:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が 0＜σ²＜∞ のとき、n→∞ で √n(X̄−μ)/σ の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-sample-mean
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-std-normal
  conditions:
  - text: X₁, …, Xₙ が独立に同じ分布に従う
    kind: 仮定
    terms:
    - TERM-indep
    outside: 標準化した標本平均が標準正規分布に近づくとは保証できない（正の相関があると X̄ の散らばりは σ/√n より大きく、N(μ, σ²/n) では幅を狭く見積もる。有限の母集団から戻さずに取ると、X̄ の分散は σ²/n より小さい）
  - text: 分散 σ² が 0＜σ²＜∞
    kind: 仮定
    terms:
    - TERM-var
    outside: 近づくとは保証できない。分散が有限でない分布（無限か、定義されない。例：コーシー分布は平均も分散もなく、X̄ の分布は n によらず元の分布と同じで、正規分布に近づかない）では σ が定まらない。σ²＝0 なら X は定数で、σ で割れない（裾が重くても分散が有限なら、この主張の条件を満たし近づく）
  grounds:
  - source:
      title: 中心極限定理
      locator: 照合した2次資料：HKUST の講義資料（URL の MATH5411）Chapter 2 §2.2 Theorem 2.2（印刷頁 p.36。iid で平均 µ・有限の分散 σ²＞0 なら (Sₙ−nµ)/(σ√n) は分布で N(0, 1) に近づく。Sₙ＝X₁＋…＋Xₙ は Theorem 2.4 で定義）https://www.math.hkust.edu.hk/~makchen/MATH5411/Chap2Sec2.pdf
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - by: AM
      date: '2026-11-22'
      method: 独立な確かめ
      version: 401712f
    external: 2次資料
  version: 2   # 2026-11-26：概念の仮定の行の説明を外れたときの文に引き継いだ（#532 C）
- id: CLM-7
  label: ④-7
  kind: 極限
  statement:
    text: T_k が t(k) に従うとき、k→∞ で T_k の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-t
  conclusion:
    predicates:
    - TERM-std-normal
  grounds:
  - claim: CLM-20b
  - source:
      title: t(k) の定義で T_k＝Z/√(V_k/k)（Z と V_k は独立、V_k は χ²(k)）と書き、V_k を独立な Zᵢ²（V(Zᵢ²)＝2 は有限）の和として表すと、大数の法則で V_k/k→1（確率）。T_k の分布は (Z, V_k) の分布だけで決まるので、Z と独立な1つの列 Z₁, Z₂, … で V_k＝Z₁²＋…＋Z_k² と表してよい
      uses: [CLM-20b]
  - source:
      title: スルツキーの定理
      locator: 照合した2次資料：Stanford Stats 300b（2019年冬、J. Duchi）Lecture 1。p.4 Theorem 1（連続写像定理。g が P(X∈B)＝1 の集合 B で連続）、p.4 Theorem 2（Slutsky。(1) 定数への分布収束と確率収束は同値、(2) d(Xₙ,Yₙ)→0（確率）なら同じ極限）、p.5 その帰結（Xₙ→X（分布）・Yₙ→c（分布。(1) で確率と同じ）なら Xₙ＋Yₙ→X＋c、YₙXₙ→cX、c≠0 なら Xₙ/Yₙ→X/c）https://web.stanford.edu/class/stats300b/ScribeNotes/2019/lecture-01.pdf
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: D
      date: '2026-11-08'
      version: 525bbdb
    - method: 独立な確かめ
      by: AD
