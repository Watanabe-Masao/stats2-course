# 主張（製本 ④ の単位。原本へ移したもの。#287・#289）。id は ④ の番号（④-25 → CLM-25）。書き方は docs/authoring.md。
# 確かめの記録（verification）は、ここが正本（README の運用の決まり 6）。④ の §9 からは行を外す。
claims:
- id: CLM-1
  label: ④-1
  kind: 従う
  statement:
    text: 0≦p≦1 とし、X₁, …, Xₙ が独立に Bern(p) に従うとき、和 X₁＋…＋Xₙ は B(n, p) に従う（値は k＝0, 1, …, n）
  premises:
    subjects:
    - TERM-bernoulli
  conclusion:
    predicates:
    - TERM-binom
  conditions:
  - text: n は決まった数（回数 n が決まっていて、結果によって変わらない）
    kind: 仮定
    outside: 回数が結果で変わる（成功するまで続ける など）と、成功回数は二項分布に従うとは言えない（偶然に一致することはある）
  - text: 各 Xᵢ は 0 か 1（結果が成功・失敗の2つ）で、P(Xᵢ＝1)＝p がどの i でも同じ（各回の成功確率 p が同じ）
    kind: 仮定
    outside: 回ごとに成功確率が違うと、成功回数は二項分布に従うとは言えない（各回が独立のままなら、B(n, p) の形にはならない。独立でもないときは偶然に一致することがある）
  - text: X₁, …, Xₙ が独立（各回が独立）
    kind: 仮定
    terms:
    - TERM-indep
    outside: 回どうしが影響し合うと、成功回数は二項分布に従うとは言えない（偶然に一致することはある）
  grounds:
  - source:
      title: 和が k になる並びは ₙCₖ 通りで、どの並びの確率も（独立なので）pᵏ(1−p)ⁿ⁻ᵏ
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    - method: 独立な確かめ
      by: AI
      date: '2026-11-20'
      version: 726d408
    - method: 独立な確かめ
      by: AI2
      date: '2026-11-20'
      version: fa0a89a
    external: なし
  version: 2
