# 主張（製本 ④ の単位。原本へ移したもの。#287・#289）。id は ④ の番号（④-25 → CLM-25）。書き方は docs/authoring.md。
# 確かめの記録（verification）は、ここが正本（README の運用の決まり 6）。④ の §9 からは行を外す。
claims:
- id: CLM-1
  label: ④-1
  kind: 従う
  statement:
    text: 0≦p≦1 とし、X₁, …, Xₙ が独立に Bern(p) に従うとき、和 X₁＋…＋Xₙ は B(n, p) に従う（値は k＝0, 1, …, n）
  premises:
    subjects:
    - TERM-bernoulli
  conclusion:
    predicates:
    - TERM-binom
  grounds:
  - source:
      title: 和が k になる並びは ₙCₖ 通りで、どの並びの確率も（独立なので）pᵏ(1−p)ⁿ⁻ᵏ
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
