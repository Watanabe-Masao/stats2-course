- id: CLM-44
  label: ④-44
  kind: 極限
  statement:
    text: 2群の観測がそれぞれ独立に同じ分布（平均 μ₁, μ₂、分散 0＜σ₁², σ₂²＜∞）に従い、2群が互いに独立で、H₀：μ₁＝μ₂ が正しいとき、n₁, n₂ がともに→∞ で（n₁/n₂ の比によらず）、ウェルチの t＝(X̄₁−X̄₂)/√(s₁²/n₁＋s₂²/n₂) の分布は N(0, 1) に近づく
  premises:
    subjects:
    - TERM-welch
  conclusion:
    subjects:
    - TERM-test-stat
    predicates:
    - TERM-std-normal
  conditions:
  - text: 各群の観測が独立に同じ分布に従い、2群が互いに独立
    kind: 仮定
    terms:
    - TERM-indep
    outside: 標準正規分布に近づくとは保証できない
  - text: 各群の分散が 0＜σ²＜∞
    kind: 仮定
    terms:
    - TERM-var
    outside: 近づくとは保証できない（分散が有限でない分布〔無限か、定義されない〕では、近づかない場合がある）
  - text: H₀（μ₁＝μ₂）が正しい
    kind: 仮定
    outside: 0 を中心にした標準正規分布に近づくとは言えない（差があれば |t| は n₁, n₂ とともに確率的に大きくなる。符号は差の向き）
  grounds:
  - claim: CLM-6b
  - claim: CLM-20b
  - source:
      title: 各群に中心極限定理を当て、2群の独立から特性関数の積で合わせると、(X̄₁−X̄₂)/√(σ₁²/n₁＋σ₂²/n₂) は N(0, 1) に近づく（2群の重み √((σ₁²/n₁)/(σ₁²/n₁＋σ₂²/n₂)) が収束しなくてよいので、n₁/n₂ の比の条件は要らない）。s₁², s₂² は大数の法則（Xᵢ に当てる）と Khinchin の大数の法則（Xᵢ² に当てる。下の行）と連続写像で σ₁², σ₂² に確率収束し、分母の比はその重みつき平均として1に確率収束する
      uses: [CLM-6b, CLM-20b]
      locator: 照合した2次資料：UC Berkeley Statistics 205A（2002年秋、J. Pitman）Lecture 14 Theorem 14.2（p.14-1。各 t で E e^{itXₙ}→φ(t) で、φ が t＝0 で連続なら、φ はある X の特性関数で Xₙ→X（分布））https://www.stat.berkeley.edu/~pitman/s205f02/lecture14/lecture14.pdf ・Stanford Stats 300b（2019年冬、J. Duchi）Lecture 1 p.3 Definition 0.3（分布収束の同値な定義：有界で連続な f について E f(Xₙ)→E f(X)）・p.5（Slutsky の帰結 YₙXₙ→cX）https://web.stanford.edu/class/stats300b/ScribeNotes/2019/lecture-01.pdf
    external: true
  - source:
      title: 重みが収束しなくてよい所の筋。n₁(k), n₂(k)→∞ を満たすどの列についても示す（どの列でも言えれば2重の極限も言える）。各群の標準化した平均を Aₖ・Bₖ（それぞれ中心極限定理で N(0, 1) に近づく。n₁(k) が単調に増えなくても、分布関数の各連続点での収束は受け継がれる）、重みを wₖ∈[0, 1] とし、Zₖ＝wₖAₖ−√(1−wₖ²)Bₖ とする。2群の独立から、独立な確率変数の有界な関数の積の期待値は期待値の積（実部・虚部に分けて E(XY)＝E(X)E(Y) を当てる）なので、φ_{Zₖ}(t)＝E e^{itwₖAₖ}·E e^{−it√(1−wₖ²)Bₖ}。t を固めると、どの部分列にも wₖ→w となる部分列がある（wₖ は有界。ボルツァーノ＝ワイエルシュトラス）。そこでは √(1−wₖ²)→√(1−w²) で、定数 sₖ＝wₖt→wt について sₖAₖ→wtA（分布。スルツキー）なので E e^{isₖAₖ}→e^{−w²t²/2}（cos・sin は有界で連続）。もう一方も同じで、積は e^{−t²/2}。どの部分列にも φ_{Zₖ}(t)→e^{−t²/2} となる部分列があるので、数列として全体でも φ_{Zₖ}(t)→e^{−t²/2}。極限は t＝0 で連続な N(0, 1) の特性関数なので、Lévy の連続性定理で Zₖ→N(0, 1)（分布）
      uses: [CLM-6b]
  - source:
      title: スルツキーの定理（s₁²＝s₂²＝0 で t が定まらない事象の確率は0に近づくので、結論は変わらない）
      locator: 照合した2次資料：Stanford Stats 300b（2019年冬、J. Duchi）Lecture 1。p.4 Theorem 1（連続写像定理。g が P(X∈B)＝1 の集合 B で連続）、p.4 Theorem 2（Slutsky。(1) 定数への分布収束と確率収束は同値、(2) d(Xₙ,Yₙ)→0（確率）なら同じ極限）、p.5 その帰結（Xₙ→X（分布）・Yₙ→c（分布。(1) で確率と同じ）なら Xₙ＋Yₙ→X＋c、YₙXₙ→cX、c≠0 なら Xₙ/Yₙ→X/c）https://web.stanford.edu/class/stats300b/ScribeNotes/2019/lecture-01.pdf
    external: true
  - source:
      title: s₁², s₂² の一致で大数の法則を Xᵢ² に当てるには V(Xᵢ²)＜∞（E Xᵢ⁴＜∞）が要る。仮定（0＜σ²＜∞）だけで言うには Khinchin の大数の法則（平均が有限なら標本平均は確率収束する）に頼る
      uses: [CLM-20b]
      locator: 照合した2次資料：Texas A&M（URL の STAT 614）2022年秋、Quan Zhou の講義資料 Lecture 15 Theorem 15.3「Khintchin's WLLN」（p.4。i.i.d. で平均 µ、E|X₁|＜∞ なら Sₙ/n→µ（確率））https://web.stat.tamu.edu/~quan/MathProb/STAT614_Unit15_QuanZhou.pdf 。Xᵢ² も独立に同じ分布に従い（Xᵢ の関数）、E|Xᵢ²|＝σ²＋μ²＜∞（σ² が有限なら μ も有限）なので、仮定から足りる
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: AA
      date: '2026-11-16'
      version: 80da9de
    - method: 独立な確かめ
      by: AD
      date: '2026-11-19'
      version: 1bc65aa
