- id: CLM-19
  label: ④-19
  kind: 極限
  statement:
    text: X₁, …, Xₙ が独立に Bern(p)（0＜p＜1 を固定）に従うとき、n→∞ で (p̂−p)/√(p̂(1−p̂)/n) の分布は N(0, 1) に近づく。だから、各 p（固定）での p̂ ± z_{α/2}·√(p̂(1−p̂)/n) の被覆確率は、n→∞ で 1−α に近づく（有限の n では近似）。信頼係数（p についての被覆確率の下限）は、どの n でも 0 で、1−α には近づかない（X＝0 のとき区間は {0} なので、被覆確率は 1−(1−p)ⁿ 以下）
  premises:
    subjects:
    - TERM-sample-prop
  conclusion:
    subjects:
    - TERM-ci
    predicates:
    - TERM-conf-level
  grounds:
  - claim: CLM-6b
  - claim: CLM-20b
  - source:
      title: スルツキーの定理（p̂(1−p̂) → p(1−p) の平方根をとる所は連続写像定理）
    external: true
  - source:
      title: p̂ が 0 か 1 のとき分母は 0 になるが、その確率は n→∞ で 0 に近づくので、その場合の値をどう決めても極限は同じ（区間の幅は 0 になる。④ §8）
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: D
      date: '2026-11-08'
      version: 525bbdb
    external: 未照合
  version: 1
- id: CLM-20b
  label: ④-20b
  kind: 推定量の性質
  statement:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が有限のとき、どの ε＞0 についても n→∞ で P(|X̄−μ|≧ε)→0（標本平均 X̄ は μ に確率収束する。一致）
  premises:
    subjects:
    - TERM-sample-mean
  conclusion:
    subjects:
    - TERM-sample-mean
    predicates:
    - TERM-consistency
  conditions:
  - text: X₁, …, Xₙ が独立に同じ分布に従う
    kind: 仮定
    terms:
    - TERM-indep
    outside: 標本平均が μ に近づくとは保証できない
  - text: 分散 σ² が有限
    kind: 仮定
    outside: この根拠（チェビシェフの不等式）による保証は使えない（平均が有限なら成り立つことが知られている：ヒンチンの大数の法則。教材の範囲外・未照合）
    terms:
    - TERM-var
  grounds:
  - source:
      title: V(X̄)＝σ²/n とチェビシェフの不等式 P(|X̄−μ|≧ε)≦σ²/(nε²)→0
  verification:
    math:
    - method: 独立な確かめ
      by: L
      date: '2026-11-09'
      version: 02c937b
    external: なし
  version: 1
