- id: CLM-36
  label: ④-36
  kind: 従う
  statement:
    text: g 群（g≧2、各群の大きさ nᵢ≧1、全体の大きさ n＞g）の観測が独立で、各群が同じ分散 σ²（σ＞0）の正規分布に従い、H₀：g 個の母平均がすべて等しい が正しいとき、F＝群間の平均平方÷群内の平均平方 は F(g−1, n−g) に従う
  premises:
    subjects:
    - TERM-anova
    - TERM-ms
  conclusion:
    subjects:
    - TERM-test-stat
    predicates:
    - TERM-f
  conditions:
  - text: 観測がすべて独立
    kind: 仮定
    terms:
    - TERM-indep
    outside: F(g−1, n−g) に従うとは保証できない
  - text: 各群が正規分布に従う
    kind: 仮定
    terms:
    - TERM-normal
    outside: F(g−1, n−g) に従うとは保証できない（F 分布の点で判定した有意水準 α が、本当の第1種の過誤の確率と合うとは限らない）
  - text: 各群の分散が等しい
    kind: 仮定
    outside: F(g−1, n−g) に従うとは保証できない
  - text: H₀ が正しい
    kind: 仮定
    outside: F(g−1, n−g) に従うとは保証できない（H₀ が誤りなら非心 F 分布になり、確率の大小の意味で大きい側にずれる）
  grounds:
  - source:
      title: 群間平方和/σ²・群内平方和/σ² が独立に χ²(g−1)・χ²(n−g) に従う（Cochran の定理）
      locator: 照合した2次資料：Penn State STAT 415 §13.3「Theoretical Results」。SSE の定理（第 i 群の X_ij が N(μ_i, σ²) に互いに独立に従うとき、SSE/σ² は χ²(n−m)。各群の (n_i−1)W_i²/σ² が χ²(n_i−1) で、独立なカイ二乗の和として）、SST の定理（H₀：μ_i がすべて等しいとき、SST/σ² は χ²(m−1)。その頁では証明を省いて述べている）、F の定理（X_ij が N(μ, σ²) のとき、SST と SSE は独立で〔証明を省く〕、F＝MST/MSE は F(m−1, n−m)。頁の定理の文では分母の自由度が「nm」と出ているが、証明の MSE＝SSE/(n−m) から n−m と読んだ）。m が群の数 g。照らしたのは結論で、title の Cochran の定理という道筋はその頁に出てこない（照らしていない）https://online.stat.psu.edu/stat415/book/export/html/823
    external: true
  - source:
      title: F 分布の定義
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
    math:
    - method: 独立な確かめ
      by: N
      date: '2026-11-09'
