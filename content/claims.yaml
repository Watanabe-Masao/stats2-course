  - text: X₁, …, Xₙ が独立に同じ分布に従う
    kind: 仮定
    terms:
    - TERM-indep
    outside: V(X̄)＝σ²/n とは保証できない（相関があると共分散の和の分だけずれる。分散がそろわないと Σσᵢ²/n² になる。正の相関があると V(X̄) は σ²/n より大きく、有限の母集団から戻さずに取ると小さい）
  - text: 分散 σ² が有限
    kind: 仮定
    outside: V(X̄) が有限の値に定まるとは保証できない
  grounds:
  - source:
      title: 独立なら分散は足せるので V(X₁＋…＋Xₙ)＝nσ²。X̄ は合計の 1/n 倍なので V(X̄)＝nσ²/n²＝σ²/n（根拠で使うのは、各 Xᵢ の分散が σ² で互いに無相関なこと）
  teaching:
    conclusion: true
    proof: 扱う
