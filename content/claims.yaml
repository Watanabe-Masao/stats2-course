- id: CLM-10
  label: ④-10
  kind: 従う
  statement:
    text: n≧2 で X₁, …, Xₙ が独立に N(μ, σ²)（σ＞0）に従うとき、(n−1)s²/σ² は χ²(n−1) に従う（s² は不偏分散）
  premises:
    subjects:
    - TERM-unbvar
  conclusion:
    subjects:
    - TERM-unbvar
    predicates:
    - TERM-chi2
  conditions:
  - text: X₁, …, Xₙ が独立に同じ N(μ, σ²)（σ＞0）に従う
    kind: 仮定
    terms:
    - TERM-indep
    - TERM-normal
    outside: (n−1)s²/σ² がカイ二乗分布に従うとは保証できない（正規母集団でないと、一般には形が変わる。裾の重い母集団では分散の推測が大きくずれ、正の相関があると s² は σ² を小さく見積もりやすい）
  grounds:
  - source:
      title: Helmert の直交変換で Σ(Xᵢ−X̄)²/σ² を n−1 個の独立な N(0, 1) の2乗の和に書く（Cochran の定理）
      locator: 照合した2次資料：Penn State STAT 414 §26.3「Sampling Distribution of Sample Variance」の定理（正規分布からの大きさ n の無作為標本で、1. X̄ と S² は独立、2. (n−1)S²/σ² は χ²(n−1) に従う。1 はその頁では証明を省いて述べている。照らしたのは結論で、頁の証明は積率母関数によるもので 1 を使う。title の Helmert の道筋は照らしていない）https://online.stat.psu.edu/stat414/book/export/html/787
    external: true
  teaching:
    conclusion: true
    proof: 範囲外
  verification:
