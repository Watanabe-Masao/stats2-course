- id: CLM-25
  label: ④-25
  kind: 従う
  statement:
    text: 単位時間あたりの平均件数が λ（λ＞0）のポアソン過程で、長さ t の区間の件数は Po(λt) に従い、時刻0から次に起きるまでの待ち時間 T は、平均 1/λ の指数分布に従う
  conclusion:
    predicates:
    - TERM-poisson
    - TERM-expo
  conditions:
  - text: 出来事が一定の割合 λ で起きる
    kind: 仮定
    outside: どちらの分布も使えるとは保証できない（時間帯で割合が変わるなら分けて見る）
  - text: 重ならない時間の件数が互いに独立
    kind: 仮定
    terms:
    - TERM-indep
    outside: どちらの分布も使えるとは保証できない
  teaching:
    conclusion: true
    proof: 範囲外
  gist: 同じ出来事を「一定時間に何件来るか」で見るとポアソン、「次の1件まで何分待つか」で見ると指数分布。見方が違うだけ。
  labs:
  - id: LAB-pois
    preset: rel-expo-tour
    purpose: t 時間に0件の確率が、次の1件まで t より長く待つ確率になることを段ごとに見る
  - id: LAB-pois
    preset: s5-free
    purpose: 0件の確率を時間を延ばして見ると、待ち時間の確率になる
  figures:
  - FIG-LAB-pois-rel-expo-tour-1
  - FIG-LAB-pois-rel-expo-tour-2
  grounds:
  - source:
      title: 前半はポアソン過程の定義（独立増分と件数の分布）から。後半は P(T＞t)＝P([0, t] の件数が0)＝e^(−λt)
  verification:
    math:
    - method: 独立な確かめ
      by: C
      date: '2026-11-08'
      version: dc2b65a
    external: なし
  version: 1
