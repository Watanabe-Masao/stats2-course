        text: 表が出るまでコインを投げ、k 回目なら 2^k 円。どの項も 2^k×(1/2)^k＝1 なので、上限を1つ上げるたびに期待値は1ずつ増え、上限をなくすと和が有限にならない。ここでは 40 回目で打ち切ったので期待値はあるが、画面で引ける回数では、平均はずっと手前で、まれな大当たりで跳ね上がる
