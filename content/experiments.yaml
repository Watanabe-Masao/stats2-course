                  choose:
                  - ask: 割合が同じなら、「ちょうどその回数」になる確率も同じ？
                    opts: [同じになる, 同じとは限らない, 回数が多いほど必ず大きい]
                    ok: 1
                    fb: [割合が同じでも、回数が違えば結果の候補の数も違う。同じになるとは限らない。, '', 「必ず」とは言えない。回数が多いと、結果の候補（0〜30 回）も増える。]
                - kind: formula
                  choose:
                  - todo: 「ちょうど k 回」の確率の式を選ぶ
                    math: true
                    opts: [P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ, E(X) = np, V(X) = np(1 − p)]
                    ok: 0
                    fb: ['', それは平均。この課題は「ちょうど k 回」の確率。, それは分散。]
                - kind: build
