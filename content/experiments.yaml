# 実験室の定義（#102・計画の 6「構想と、そこへ向かう骨格」の 1）。画面（knowledge-net）はこの定義を読むだけ。
# - 予想の答えは書かない（公開の JSON に出る。画面が理論のモデルから求める）
# - テーマ：計算は同じ二項分布で、並びの絵・成功の言葉・最初の p が変わる（「こういう時に使う」を場面で覚える）
# - 反例を実験する（counterexamples）：成り立つ条件を1つ崩した起き方（mechanism）で、二項分布の理論とのずれを見る。数は概念しだい（統計で言えることの境目）
experiments:
  - id: EXP-binom-p
    version: 1
    title: 二項分布 実験室
    question: 成功確率を上げると、成功回数の山はどう動く？
    links:
      concepts: [TERM-binom, TERM-expect]
      relations: [REL-indep-binom, REL-comb-binom, DER-binom-moments]
    model: binom
    vary:
      n: {min: 1, max: 30, step: 1}
      p: {min: 0, max: 1, step: 0.01}
    start: {n: 10, p: 0.5}
    compare: {p: 0.8}
    reason:
      title: 山の中心＝期待値 np
      concept: TERM-binom
      formula: 1
      steps:
        - 1回の成功は 0 か 1。1回の平均は p
        - 1回ずつの平均を n 回分足すと、全体の平均になる（期待値は独立でなくても足せる）
        - p を n 回足すと np。p を上げると中心は右へ動く
    themes:
      - {id: coin, name: コインの表, icon: 🪙, success: 表, failure: 裏, unit: 回, p: 0.5, story: コインを n 回投げて、表が出た回数を数える}
      - {id: shop, name: 来店客が買う, icon: 🛒, success: 買った, failure: 見ただけ, unit: 人, p: 0.25, story: 売場に n 人来て、買った人の数を数える}
      - {id: check, name: 検品で不良品, icon: 📦, success: 不良品, failure: 良品, unit: 個, p: 0.05, story: n 個を検品して、不良品の数を数える}
      - {id: shot, name: フリースロー, icon: 🏀, success: 入った, failure: 外れ, unit: 本, p: 0.7, story: n 本打って、入った本数を数える}
      - {id: dice, name: さいころの6, icon: 🎲, success: 6の目, failure: 6以外の目, unit: 回, p: 0.17, story: さいころを n 回振って、6 が出た回数を数える（6 の確率は 1/6＝約 0.17）}
      - {id: guess, name: 4択を当てずっぽう, icon: ✍️, success: 正解, failure: 不正解, unit: 問, p: 0.25, story: 4択を n 問当てずっぽうで答えて、正解の数を数える}
    counterexamples:   # 反例を実験する：成り立つ条件を1つ崩す。数は概念しだい
      - id: urn
        name: 箱から戻さずに取る
        breaks: 各回が独立
        mechanism: {kind: urn, total: 40}
        effect: {mean: same, spread: smaller}   # 言い分の向き。build が全部の n・p で確かめる（#118 層3）。公開の JSON には出さない
        concept: TERM-hyper
        text: 取った物を戻さないと、前に何が出たかで次の当たりの確率が変わる（独立でない）。前の結果を知らなければ、どの回も当たりの確率は同じ。箱の当たりの割合が同じ二項分布（戻す場合）と比べると、理論の平均は同じで、散らばりは小さくなる（2 個以上取り、当たりが0個でも全部でもないとき）。少ない回数の実験では、いつも小さく見えるとは限らない。戻さずに取るときは超幾何分布で考える。箱が小さいほどずれる
      - id: streak
        name: 前の結果に引きずられる
        breaks: 各回が独立
        mechanism: {kind: streak, carry: 0.3}
        effect: {mean: same, spread: larger}
        concept: TERM-indep
        text: 入ると次も入りやすく、外すと次も外しやすい（口コミ・連れ立ち・調子の波）。理論の平均は np のままでも、二項分布より山が広がる（2 回以上で、p が 0 でも 1 でもないとき）。実験の平均は np のまわりでゆれる。各回が独立でないときは、二項分布の式の分散を使えない
      - id: mix
        name: 日や時間で確率が違う
        breaks: 各回の成功確率 p が同じ・各回が独立
        mechanism: {kind: mix, spread: 0.2}
        effect: {mean: same, spread: larger}
        text: 買いやすい日と買いにくい日が混ざると、理論の平均は np のままでも山が広がる（2 回以上で、p が 0 でも 1 でもないとき。セットごとに確率が p−d か p＋d、ずれ幅 d は 0.2 と p・1−p の小さい方。実験の平均は np のまわりでゆれる）。確率のずれがセットの中で共通なので、各回は独立でなくなる。全体の p だけで二項分布を当てると、ばらつきを小さく見積もる。p が 0 か 1 ならずれ幅は 0 で、山の広がりは変わらない。なお、買いやすい客と買いにくい客がいつも同じ割合で来て、客どうしが独立なら、山は逆に少し狭くなる（客ごとの確率を毎回でたらめに選ぶだけなら二項分布と同じ）
      - id: fatigue
        name: 疲れて確率が下がる
        breaks: 各回の成功確率 p が同じ
        mechanism: {kind: fatigue, drop: 0.3}
        effect: {mean: same, spread: smaller}
        text: 最初は確率が高く、回を追って下がる（疲れ・集中が切れる）。各回は独立のまま、確率だけが回ごとに違う。理論の平均は np のままでも、山は二項分布より狭くなる（2 回以上で、p が 0 でも 1 でもないとき。確率は最初 p＋d、最後 p−d で、d は下がる幅と p・1−p の小さい方）。分散は各回の pᵢ(1−pᵢ) の合計で、確率がばらつくほど小さい。差は小さいので、少ない回数の実験では、いつも狭く見えるとは限らない（セットを増やすと見えてくる）。日や時間で確率が違う（山が広がる）とは向きが逆になる：確率のずれがセットの中で共通（日による）なら山は広がり、回ごとに違って各回が独立（疲れ）なら狭くなる
    # 入口「何を確かめたい？」に並べる問い（#161）。最初の問い（question）と反例（counterexamples）の間に並ぶ。form は問いの形（予測と観察の部品の組）
    # prob：確率の値を目盛り（prob_scale）で予想し、範囲に入ったセットの割合と理論を照らす。答えが目盛りの境目の近くにある問いは build が止める
    # 問いの形（#161）：spread（広がり）・prob（確率の値。free は学習者が結果を選ぶ）・conv（理論と実測）。位置は最初の問い、前提崩しは反例
    prob_scale: [0.5, 0.2, 0.05, 0.01, 0.001]
    questions:
      - id: spread
        form: spread
        title: 試行回数を増やすと分布はどう変わる？
        question: 回数を 10 回から 40 回にすると、成功の回数と割合の散らばりはどうなる？
        set: {n: 10, p: 0.5}
        to: {n: 40}
      - id: rare
        form: prob
        free: true
        title: 珍しい結果を調べる
        question: 結果を自分で選び、その確率を桁で予想する
        set: {n: 10, p: 0.7}
        events: [{op: eq, k: 10}]
      - id: pmf
        form: prob
        title: ちょうど k 回成功する確率を調べる
        question: 成功確率 30% で 10 回。「ちょうど 3 回」になる確率は？
        set: {n: 10, p: 0.3}
        events: [{op: eq, k: 3}]
      - id: exact
        form: prob
        title: ちょうど k 回と k 回以上を比べる
        question: 成功確率 50% で 10 回。「ちょうど 5 回」と「5 回以上」の確率は？
        set: {n: 10, p: 0.5}
        events: [{op: eq, k: 5}, {op: ge, k: 5}]
      - id: conv
        form: conv
        title: 回数を増やすと割合は理論に近づく？
        question: 10 回中 5 回以上になるセットの割合。セットを 100 倍にすると、理論とのずれの目安は？
        set: {n: 10, p: 0.5}
        events: [{op: ge, k: 5}]
    # テーマ体系（#163。渡辺さんの企画書「二項分布実験室」の 4. 実験テーマ体系）：まとまり（A〜F）の下に問い。
    # 問いの id は 概念-まとまり-番号（binom-A-01。企画書の B01〜B24 を置き換えた。変えない・消さない）。公開では教材名が付く（stats2:binom-A-01）。
    # concept は主概念（1つ）、related は関連概念（その問いを理解するのに実際に使う概念）。open は開く入口（shift・questions の id・break:反例の id）。
    # open のない問いは作成中（入口に並べるだけ）。finds は主な発見（予想の前には出さない）。
    # 開ける問いは predict（何を予想するか）・operate（何を操作するか）・judge（理解判定：何ができれば理解したとするか）を書く。
    # 実験の仕組み（問いの形）は共有してよいが、開く先（open）は問いごとに1つ。同じ画面を開くだけで別の問いを実現した扱いにしない（渡辺さん 2026-11-02）。
    # 主概念は実験室の所属ではなく、発見させたい性質で決める
    catalog:
      - id: A
        title: 分布の形と仕組み
        items:
          - id: binom-A-01
            title: 成功確率を変えると分布はどう動く？
            finds: 成功確率と分布の形の関係
            concept: TERM-binom
            predict: 成功確率を上げたとき、成功回数の山の頂点がどこへ動くか
            operate: 成功確率 p
            judge: 別の n・p で、山の頂点と平均が n×p のあたりに来ることを説明できる
            open: 'shift'
          - id: binom-A-02
            title: 試行回数を増やすと分布はどう変わる？
            finds: 成功回数と成功割合の散らばり
            concept: TERM-binom
            related: [TERM-sd]
            predict: 試行回数を増やしたとき、成功回数と成功割合の散らばりがどうなるか
            operate: 試行回数 n
            judge: 回数の散らばりは √n 倍に増え、割合の散らばりは 1/√n 倍に減ることを、別の n で説明できる
            open: 'spread'
          - id: binom-A-03
            title: なぜ中央付近の成功回数が起こりやすい？
            finds: 組合せ数と確率の関係
            concept: TERM-binom
            related: [TERM-comb]
          - id: binom-A-04
            title: 成功確率 50% なら必ず左右対称？
            finds: 対称性と非対称性
            concept: TERM-binom
      - id: B
        title: 事象と確率計算
        items:
          - id: binom-B-01
            title: ちょうど k 回成功する確率を調べる
            finds: 確率質量関数
            concept: TERM-binom
            related: [TERM-comb]
            predict: ちょうど k 回になる確率の桁
            operate: 成功回数 k
            judge: 別の n・p・k で、ちょうど k 回の確率を 並びの数 × pᵏ(1−p)ⁿ⁻ᵏ から見積もれる
            open: 'pmf'
          - id: binom-B-02
            title: k 回以上・以下の確率を調べる
            finds: 累積確率と事象の範囲
            concept: TERM-binom
            predict: 「ちょうど k 回」と「k 回以上」の確率の桁
            operate: 事象の範囲（ちょうど・以上・以下）
            judge: 以上・以下の確率は、ちょうどの確率の足し合わせで、境目を含むかで値が変わることを説明できる
            open: 'exact'
          - id: binom-B-03
            title: 補集合を使うと計算が簡単になる？
            finds: 補集合と確率の和
            concept: TERM-binom
            related: [TERM-complement]
          - id: binom-B-04
            title: 珍しい結果はどのくらい起こる？
            finds: 裾確率と稀な事象
            concept: TERM-binom
            predict: 自分で選んだ結果の確率の桁
            operate: 結果（k と、ちょうど・以上・以下）
            judge: 何セットに1回起きるかで、結果の珍しさを見積もれる
            open: 'rare'
      - id: C
        title: 理論と実験
        items:
          - id: binom-C-01
            title: 理論分布と実験結果は一致する？
            finds: 理論確率と実測割合
            concept: TERM-binom
          - id: binom-C-02
            title: 実験セット数を増やすと誤差はどう変わる？
            finds: 大数の法則
            concept: TERM-binom
            related: [TERM-lln]
            predict: セットを 100 倍にしたとき、理論とのずれの目安が何分の1になるか
            operate: 実験のセット数
            judge: ずれの目安はセット数の平方根に反比例して小さくなる（毎回必ず減るのではない）ことを説明できる
            open: 'conv'
          - id: binom-C-03
            title: 同じ実験を繰り返すと同じ結果になる？
            finds: 標本変動
            concept: TERM-binom
          - id: binom-C-04
            title: 珍しい結果を何セット試せば観察できる？
            finds: 少なくとも1回発生する確率
            concept: TERM-binom
            related: [TERM-complement, TERM-indep]
      - id: D
        title: 期待値・分散との接続
        items:
          - id: binom-D-01
            title: 成功回数の期待値はどこにある？
            finds: E(X)＝np
            concept: TERM-binom
            related: [TERM-expect]
          - id: binom-D-02
            title: 成功回数のばらつきは何で決まる？
            finds: V(X)＝np(1−p)
            concept: TERM-binom
            related: [TERM-var, TERM-indep]
          - id: binom-D-03
            title: 期待値が同じでも分布は違う？
            finds: 期待値だけでは分布を特定できない
            concept: TERM-expect   # 期待値という1つの数で何が消えるかを発見させる（二項分布は題材。渡辺さん 2026-11-02）
            related: [TERM-var, TERM-dist, TERM-binom]
            predict: 期待値が同じ2つの分布の形の違い
            operate: n と p（n×p を同じに保つ）
          - id: binom-D-04
            title: 成功回数と成功割合では何が違う？
            finds: 個数と割合の分散の違い
            concept: TERM-binom
            related: [TERM-var]
      - id: E
        title: 前提条件と反例
        items:
          - id: binom-E-01
            title: 成功確率が毎回違っても二項分布になる？
            finds: 成功確率一定の条件
            concept: TERM-binom
            predict: 回を追って確率が下がるとき、二項分布と比べた山の広がり
            operate: 起き方（回を追って確率が下がる）
            judge: 成功確率が回ごとに違うと二項分布にならず、散らばりが np(1−p) より小さくなることを、別の下がり方で説明できる
            open: 'break:fatigue'
          - id: binom-E-02
            title: 前回の結果が次回に影響すると？
            finds: 独立性の重要性
            concept: TERM-binom
            related: [TERM-indep]
            predict: 前の結果に引きずられるとき、二項分布と比べた山の広がり
            operate: 起き方（前の結果に引きずられる）
            judge: 独立が崩れると、平均は同じでも散らばりが大きくなることを説明できる
            open: 'break:streak'
          - id: binom-E-03
            title: 戻さずに抽出するとどうなる？
            finds: 超幾何分布との違い
            concept: TERM-binom
            related: [TERM-hyper]
            predict: 戻さずに取るとき、二項分布と比べた山の広がり
            operate: 起き方（箱から戻さずに取る）
            judge: 戻さずに取ると超幾何分布になり、散らばりが小さくなることを、箱の大きさを変えて説明できる
            open: 'break:urn'
          - id: binom-E-04
            title: 同じ平均成功確率でも結果は同じ？
            finds: 確率の異質性と分布の広がり
            concept: TERM-binom
            predict: 日によって確率が違うとき、二項分布と比べた山の広がり
            operate: 起き方（日や時間で確率が違う）
            judge: 平均の成功確率が同じでも、確率のずれがセットの中で共通だと散らばりが大きくなることを説明できる
            open: 'break:mix'
      - id: F
        title: 応用・発展
        items:
          - id: binom-F-01
            title: 購入人数を確率から予測できる？
            finds: 二項モデルによる人数の予測
            concept: TERM-binom
            related: [TERM-expect]
          - id: binom-F-02
            title: 不良品が一定数以上出る確率は？
            finds: 閾値とリスク評価
            concept: TERM-binom
          - id: binom-F-03
            title: 観測した成功回数から成功確率を推定する
            finds: 母比率の推定
            concept: TERM-binom
            related: [TERM-sample-prop]
          - id: binom-F-04
            title: 観測結果は偶然だけで説明できる？
            finds: 二項検定と p 値
            concept: TERM-binom
            related: [TERM-test]
    next:
      - {question: 成功確率を 20% に下げると、山の中心はどこ？ 形はどうなる？, set: {p: 0.2}}
      - {question: 回数を 30 回に増やすと、山の形はどうなる？, set: {n: 30}}
    points:
      - p を上げると、山の中心は右へ動く（中心は np）
      - 散らばり（分散）は np(1−p)。p＝0.5 でいちばん広い。分散を足し合わせられるのは各回が独立なとき
      - n を大きくすると、山は左右対称に近づく（正規分布へ）

  - id: EXP-expect-table
    version: 1
    title: 期待値 実験室
    question: 表を変えると、何度も引いたときの平均はどこへ行く？
    links:
      concepts: [TERM-expect]
    model: table   # 値の表（#119）：値と重みの表から1回ずつ引く。重みは合計で割って確率にする
    reason:
      title: 平均の行き先＝期待値
      concept: TERM-expect
      formula: 0
      steps:
        - 値ごとに「値×その確率」を出す
        - 全部を足すと、何度も引いたときの平均の行き着く先になる
        - 確率の重い値ほど、▲を自分の方へ引き寄せる（てんびんの支点＝重心）
    themes:
      - {id: dice, name: さいころ, icon: 🎲, values: [1, 2, 3, 4, 5, 6], start: [1, 1, 1, 1, 1, 1], compare: [1, 1, 1, 1, 1, 3], change: 6 の面を3倍出やすくする, story: ふつうのさいころ。どの目も同じ確率}
      - {id: basket, name: 買い上げ点数, icon: 🧺, unit: 点, values: [1, 2, 3, 4, 5], start: [40, 30, 15, 10, 5], compare: [30, 30, 20, 12, 8], change: まとめ買いで 1 点だけの客を減らす, story: レジを通った客が何点買ったか。1 点だけの客がいちばん多い}
      - {id: lottery, name: くじの賞金, icon: 🎟️, unit: 円, values: [0, 100, 1000], labels: [はずれ, "100", "1000"], start: [80, 18, 2], compare: [80, 14, 6], change: 1000円の当たりを 2 本から 6 本に, story: 100 本のくじ。はずれ 80 本・100円 18 本・1000円 2 本}
    points:
      - 期待値は「値×確率」の和。何度も引いたときの平均の行き先
      - 確率の重い値ほど期待値を自分の方へ引き寄せる（てんびんの支点）
      - 期待値は表の中の値として出るとは限らない（さいころの 3.5）
      - まれでも大きい値は期待値を大きく動かす。平均がなかなか落ち着かないこともある
    counterexamples:   # 反例を実験する：成り立つ条件を崩す。数は概念しだい
      - id: doubling
        name: 賞金が倍々のくじ
