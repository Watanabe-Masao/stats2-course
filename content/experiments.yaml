# 実験室の定義（#102・計画の 6「構想と、そこへ向かう骨格」の 1）。画面（knowledge-net）はこの定義を読むだけ。
# - 予想の答えは書かない（公開の JSON に出る。画面が理論のモデルから求める）
# - テーマ：計算は同じ二項分布で、並びの絵・成功の言葉・最初の p が変わる（「こういう時に使う」を場面で覚える）
# - 反例を実験する（counterexamples）：成り立つ条件を1つ崩した起き方（mechanism）で、二項分布の理論とのずれを見る。数は概念しだい（統計で言えることの境目）
experiments:
  - id: EXP-binom-p
    version: 1
    title: 二項分布 実験室
    question: 成功確率を上げると、成功回数の山はどう動く？
    links:
      concepts: [TERM-binom, TERM-expect]
      relations: [REL-indep-binom, REL-comb-binom, DER-binom-moments]
    model: binom
    vary:
      n: {min: 1, max: 30, step: 1}
      p: {min: 0, max: 1, step: 0.01}
    start: {n: 10, p: 0.5}
    compare: {p: 0.8}
    reason:
      title: 山の中心＝期待値 np
      concept: TERM-binom
      formula: 1
      steps:
        - 1回の成功は 0 か 1。1回の平均は p
        - n 回は独立なので、平均は足し合わせられる
        - p を n 回足すと np。p を上げると中心は右へ動く
    themes:
      - {id: coin, name: コインの表, icon: 🪙, success: 表, failure: 裏, unit: 回, p: 0.5, story: コインを n 回投げて、表が出た回数を数える}
      - {id: shop, name: 来店客が買う, icon: 🛒, success: 買った, failure: 見ただけ, unit: 人, p: 0.25, story: 売場に n 人来て、買った人の数を数える}
      - {id: check, name: 検品で不良品, icon: 📦, success: 不良品, failure: 良品, unit: 個, p: 0.05, story: n 個を検品して、不良品の数を数える}
      - {id: shot, name: フリースロー, icon: 🏀, success: 入った, failure: 外れ, unit: 本, p: 0.7, story: n 本打って、入った本数を数える}
      - {id: dice, name: さいころの6, icon: 🎲, success: "6", failure: 6以外, unit: 回, p: 0.17, story: さいころを n 回振って、6 が出た回数を数える（6 の確率は 1/6＝約 0.17）}
      - {id: guess, name: 4択を当てずっぽう, icon: ✍️, success: 正解, failure: 不正解, unit: 問, p: 0.25, story: 4択を n 問当てずっぽうで答えて、正解の数を数える}
    counterexamples:   # 反例を実験する：成り立つ条件を1つ崩す。数は概念しだい
      - id: urn
        name: 箱から戻さずに取る
        breaks: 各回の成功確率 p が同じ・各回が独立
        mechanism: {kind: urn, total: 40}
        concept: TERM-hyper
        text: 取った物を戻さないと、取るたびに残りの割合が変わる。二項分布より散らばりが小さくなる（超幾何分布）。箱が小さいほどずれる
      - id: streak
        name: 前の結果に引きずられる
        breaks: 各回が独立
        mechanism: {kind: streak, carry: 0.3}
        concept: TERM-indep
        text: 入ると次も入りやすく、外すと次も外しやすい（口コミ・連れ立ち・調子の波）。平均は近くても、二項分布より山が広がる
      - id: mix
        name: 人や時間で確率が違う
        breaks: 各回の成功確率 p が同じ
        mechanism: {kind: mix, spread: 0.2}
        text: 買いやすい日と買いにくい日が混ざると、平均は np のままでも山が広がる。全体の p だけで二項分布を当てると、ばらつきを小さく見積もる
    next:
      - {question: 成功確率を 20% に下げると、山の中心はどこ？ 形はどうなる？, set: {p: 0.2}}
      - {question: 回数を 30 回に増やすと、山の形はどうなる？, set: {n: 30}}
    points:
      - p を上げると、山の中心は右へ動く（中心は np）
      - 散らばりは np(1−p)。p＝0.5 でいちばん広い
      - n を大きくすると、山は左右対称に近づく（正規分布へ）

  - id: EXP-expect-table
    version: 1
    title: 期待値 実験室
    question: 表を変えると、何度も引いたときの平均はどこへ行く？
    links:
      concepts: [TERM-expect]
    model: table   # 値の表（#119）：値と重みの表から1回ずつ引く。重みは合計で割って確率にする
    reason:
      title: 平均の行き先＝期待値
      concept: TERM-expect
      formula: 0
      steps:
        - 値ごとに「値×その確率」を出す
        - 全部を足すと、何度も引いたときの平均の行き着く先になる
        - 確率の重い値ほど、▲を自分の方へ引き寄せる（てんびんの支点＝重心）
    themes:
      - {id: dice, name: さいころ, icon: 🎲, values: [1, 2, 3, 4, 5, 6], start: [1, 1, 1, 1, 1, 1], compare: [1, 1, 1, 1, 1, 3], change: 6 の面を3倍出やすくする, story: ふつうのさいころ。どの目も同じ確率}
      - {id: basket, name: 買い上げ点数, icon: 🧺, unit: 点, values: [1, 2, 3, 4, 5], start: [40, 30, 15, 10, 5], compare: [30, 30, 20, 12, 8], change: まとめ買いで 1 点だけの客を減らす, story: レジを通った客が何点買ったか。1 点だけの客がいちばん多い}
      - {id: lottery, name: くじの賞金, icon: 🎟️, unit: 円, values: [0, 100, 1000], labels: [はずれ, "100", "1000"], start: [80, 18, 2], compare: [80, 14, 6], change: 1000円の当たりを 2 本から 6 本に, story: 100 本のくじ。はずれ 80 本・100円 18 本・1000円 2 本}
    counterexamples:   # 反例を実験する：成り立つ条件を崩す。数は概念しだい
      - id: doubling
        name: 賞金が倍々のくじ
        breaks: 和（連続なら積分）が有限の値になる
        values: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912, 1073741824, 2147483648, 4294967296, 8589934592, 17179869184, 34359738368, 68719476736, 137438953472, 274877906944, 549755813888, 1099511627776]
        labels: ["2^1", "2^2", "2^3", "2^4", "2^5", "2^6", "2^7", "2^8", "2^9", "2^10", "2^11", "2^12", "2^13", "2^14", "2^15", "2^16", "2^17", "2^18", "2^19", "2^20", "2^21", "2^22", "2^23", "2^24", "2^25", "2^26", "2^27", "2^28", "2^29", "2^30", "2^31", "2^32", "2^33", "2^34", "2^35", "2^36", "2^37", "2^38", "2^39", "2^40"]
        weights: [549755813888, 274877906944, 137438953472, 68719476736, 34359738368, 17179869184, 8589934592, 4294967296, 2147483648, 1073741824, 536870912, 268435456, 134217728, 67108864, 33554432, 16777216, 8388608, 4194304, 2097152, 1048576, 524288, 262144, 131072, 65536, 32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 2]
        text: 表が出るまでコインを投げ、k 回目なら 2^k 円。どの項も 2^k×(1/2)^k＝1 なので、上限を1つ上げるたびに期待値は1ずつ増え、上限をなくすと和が有限にならない。ここでは 40 回目で打ち切ったので期待値はあるが、何度引いても平均はずっと手前で、まれな大当たりで跳ね上がる
