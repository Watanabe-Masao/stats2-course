                  - {text: '1 日 2 時間', role: noise, key: hours}
                  - {text: 'で、ボールは', role: text}
                  - {text: '7 号球', role: noise, key: ball}
                  - {text: 'を使う。部員はそれぞれ', role: text}
                  - {text: '10 本', role: info, key: n}
                  - {text: 'ずつ打ち、どの部員も 1 本ごとの成功確率は', role: text}
                  - {text: '70%', role: info, key: p}
                  - {text: 'で、', role: text}
                  - {text: '1 本ごとの結果は互いに影響しない', role: condition, key: indep}
                  - {text: 'し、', role: text}
                  - {text: '部員どうしの結果も互いに影響しない', role: condition, key: members}
                  - {text: 'とする。', role: text}
                  - {text: '10 本すべて成功', role: event, key: k}
                  - {text: 'する部員の人数は、', role: text}
                  - {text: '平均で何人になるか？', role: ask, key: q}
                info:
