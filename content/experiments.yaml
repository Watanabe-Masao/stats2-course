                  - {text: '3 回', role: info, key: k}
                  - {text: '以上」の値を使っていた。', role: text}
                  - {text: '確率は何ポイント高く見積もられた？', role: ask, key: q}
                info:
                  p: {word: 1回の成功確率, sym: p, of: p}
                  n: {word: 挑戦する回数, sym: n, of: n}
                  k: {word: 境目の回数, sym: k, of: k}
                formulas:
                  - {id: one, ref: binom.pmf, bind: {n: n, k: k, p: p}, word: ちょうど 3 回の確率}
