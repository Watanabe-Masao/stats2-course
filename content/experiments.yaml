                  choose:
                  - ask: ちょうどその回数になる確率は？
                    opts: [10 回中 3 回の方が起きやすい, ほぼ同じ, 30 回中 9 回の方が起きやすい]
                    ok: 0
                    fb: ['', 比が 1 から離れているかを見る。, 比 A ÷ B が 1 より大きいとき、どちらの確率が大きい？]
