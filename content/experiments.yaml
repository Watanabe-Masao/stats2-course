    links:
      concepts: [TERM-expect]
    model: table   # 値の表（#119）：値と重みの表から1回ずつ引く。重みは合計で割って確率にする
    reason:
      title: 平均の行き先＝期待値
      concept: TERM-expect
      formula: 0
      steps:
        - 値ごとに「値×その確率」を出す
        - 全部を足すと、何度も引いたときの平均の行き着く先になる
        - 確率の重い値ほど、▲を自分の方へ引き寄せる（てんびんの支点＝重心）
    spread_reason:   # 散らばりの考察（D-01。型の改訂6）。式は TERM-var の F-var-sum（値ごとの和。formula は式の番号）
      title: 散らばり＝分散
      concept: TERM-var
      formula: 2
      steps:
        - 値ごとに「(値−期待値)²×その確率」を出す。期待値から遠い値ほど、2乗で大きく効く
        - 全部を足すと分散。期待値からのずれの2乗を、確率で重み付けした平均
        - 期待値が同じでも、期待値から遠い値に確率がある表ほど分散が大きく、何度も引いた平均もなかなか落ち着かない
        - 期待値と分散がそろっても、分布の形（どの値にどれだけの確率があるか）まで決まるわけではない（U13 の発展「1つの数で何が消えるか」）
    themes:
      - {id: dice, name: さいころ, icon: 🎲, values: [1, 2, 3, 4, 5, 6], start: [1, 1, 1, 1, 1, 1], compare: [1, 1, 1, 1, 1, 3], change: 6 の面を3倍出やすくする, story: ふつうのさいころ。どの目も同じ確率,
          same_mean: {weights: [4, 1, 1, 1, 1, 4], change: 1 と 6 の面を4倍出やすくする}}
      - {id: basket, name: 買い上げ点数, icon: 🧺, unit: 点, values: [1, 2, 3, 4, 5], start: [40, 30, 15, 10, 5], compare: [30, 30, 20, 12, 8], change: まとめ買いで 1 点だけの客を減らす, story: レジを通った客が何点買ったか。1 点だけの客がいちばん多い,
          same_mean: {weights: [12, 70, 15, 2, 1], change: 2 点でまとめ割にして、2 点の客を増やす}}
      - {id: lottery, name: くじの賞金, icon: 🎟️, unit: 円, values: [0, 100, 1000], labels: [はずれ, "100", "1000"], start: [80, 18, 2], compare: [80, 14, 6], change: 1000円の当たりを 2 本から 6 本に, story: 100 本のくじ。はずれ 80 本・100円 18 本・1000円 2 本,
          same_mean: {weights: [71, 28, 1], change: 1000円の当たりを 1 本に、100円を 28 本に、はずれを 71 本にする}}
    points:
      - 期待値は「値×確率」の和。何度も引いたときの平均の行き先
      - 確率の重い値ほど期待値を自分の方へ引き寄せる（てんびんの支点）
      - 期待値は表の中の値として出るとは限らない（さいころの 3.5）
      - まれでも大きい値は期待値を大きく動かす。平均がなかなか落ち着かないこともある
    # テーマ体系（#119。渡辺さん 2026-11-11 に案で進めると決めた）：二項分布（binom-A〜F）と同じ形。主は発見させたい性質で決める（製本 ⑦ の 1）。
    # 問いの id は expect-まとまり-番号（変えない・消さない）。開けるのは A-01（今の流れ）だけで、ほかは問いの形と反例を足すときに open を書く
    catalog:
      - id: A
        title: 期待値の位置
        items:
          - id: expect-A-01
            title: 確率の重い値を増やすと、平均はどこへ動く？
            finds: 確率の重さと期待値の位置
            concept: TERM-expect
            predict: 表を変えたとき、何度も引いた平均がどこへ行くか（向きと値）
            operate: 値ごとの確率（テーマの表を変える）
            judge: 確率の重い値ほど期待値（重心）を自分の方へ引き寄せることを、値×確率の和で、別の表でも説明できる
            open: shift
          - id: expect-A-02
            title: 期待値は、実際に出る値？
            finds: 期待値と実際に出る値の違い
            concept: TERM-expect
            predict: 何度も引いた平均の行き先（値）と、その値が1回引いて出るか
            operate: 引く回数（表は変えない。テーマは選べる）
            judge: 期待値は値×確率の和で、分布の重心（てんびんの支点）なので、表の値の1つとは限らないことを、別の表（例：0円と100円が半々なら50円）でも説明できる
            open: support   # 表を変えない問い（#119。渡辺さん 2026-11-12）。「3.5 は出ない」は条件を崩す反例ではなく誤解を正す例なので、反例でなくこの問いで扱う
          - id: expect-A-03
            title: まれでも大きい当たりが1本あると？
            finds: まれで大きい値と期待値・中央値
            concept: TERM-expect
            related: [TERM-median]
      - id: B
        title: 理論と実験
        items:
          - id: expect-B-01
            title: 何度も引くと、平均は期待値に近づく？
            finds: 引く回数と平均のずれ
            concept: TERM-lln
            related: [TERM-expect]
          - id: expect-B-02
            title: 期待値がいくらでも大きくなるくじ
            finds: 和が有限でないときの平均
            concept: TERM-expect
      - id: C
        title: 変換と線形性
        items:
          - id: expect-C-01
            title: 全部の値を a 倍して b 足すと、期待値は？
            finds: E(aX＋b)＝aE(X)＋b
            concept: TERM-expect
      - id: D
        title: 期待値と散らばり
        items:
          - id: expect-D-01
            title: 2つの表、何度も引くと何が違う？   # 題で「期待値が同じ」と言わない（予測 1 の答えになる。独立なレビュー 2026-11-12）
            finds: 期待値だけでは決まらない散らばり
            # 主は期待値（見つけるのは「期待値という1つの数では散らばりが残る」＝期待値の限界。binom-D-03 の渡辺さん 2026-11-02 と同じ）。
            # ⑦ の未決 #345：関連の分散は学ぶ順で期待値より後。分散を主にすると問いの目的（分散という量の意味。U13 S1 の §5 が扱う）に変わるので、期待値のまま（2026-11-12）
            concept: TERM-expect
            related: [TERM-var]
            predict: 2つの表を何度も引いたときの平均の大小（予測は1つ。違い＝散らばりは観察で見つけ、考察で分散にする。渡辺さん 2026-11-12）
            operate: 引く回数（2つの表を同じ回数ずつ。表は変えない。テーマは選べる）
            judge: 期待値が同じでも値の散らばりは違いうるので、期待値だけでは表（分布）は決まらない。散らばりは、期待値を基準にしたずれの2乗の期待値（分散）で別に測ることを、別の表（例：さいころの目を両端に寄せた表）でも説明できる
            open: same-mean
      - id: E
        title: 応用
        items:
          - id: expect-E-01
            title: くじの値段は、いくらまでなら得？
            finds: 期待値で決める（と、決められないこと）
            concept: TERM-expect
