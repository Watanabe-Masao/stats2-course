                    choose:
                      - ask: 「3 回以上」の確率から「3 回より多い」の確率を引くと、残るのは？
                        opts: [ちょうど 3 回の棒1本, 2 回以下の棒, 何も残らない（同じ確率）]
                        ok: 0
                        fb: ['', 2 回以下はどちらにも入らない。, 「以上」は 3 回を含み、「より多い」は含まない。そこが違う。]
                  - kind: formula
                    choose:
