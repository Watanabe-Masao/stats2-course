          - id: binom-B-04
            title: 珍しい結果はどのくらい起こる？
            finds: 裾確率と稀な事象
            concept: TERM-binom
            predict: 自分で選んだ結果の確率の桁
            operate: 結果（k と、ちょうど・以上・以下）
            judge: 何セットに1回起きるかで、結果の珍しさを見積もれる
            open: 'rare'
            apply:
              kind: 評価
              task: バスケットボール部の部員50 人が、体育館でフリースローの練習をする。練習は1 日 2 時間で、ボールは7 号球を使う。部員はそれぞれ10 本ずつ打ち、どの部員も 1 本ごとの成功確率は70%で、1 本ごとの結果は互いに影響しないし、部員どうしの結果も互いに影響しないとする。10 本すべて成功する部員の人数は、平均で何人になるか？
              solve: {method: expected-observers, n: 10, p: 0.7, event: {op: ge, k: 10}, people: 50}
              answer: {type: number, unit: 人, tol: {abs: 0.03}}
              why: 1人では珍しいことも、たくさんの人や回数の中では起きるのがふつう。全体で何回起きうるかを見てから「珍しい」と言う。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                  - {text: 'バスケットボール部の部員', role: text}
