# 実験室の定義（#102・計画の 6「構想と、そこへ向かう骨格」の 1）。画面（knowledge-net）はこの定義を読むだけ。
# - 予測の答えは書かない（公開の JSON に出る。画面が理論のモデルから求める）
# - テーマ：計算は同じ二項分布で、並びの絵・成功の言葉・最初の p が変わる（「こういう時に使う」を場面で覚える）
# - 反例を実験する（counterexamples）：成り立つ条件を1つ崩した起き方（mechanism）で、二項分布の理論とのずれを見る。数は概念しだい（統計で言えることの境目）
experiments:
  - id: EXP-binom-p
    version: 1
    title: 二項分布 実験室
    question: 成功確率を上げると、成功回数の山はどう動く？
    links:
      concepts: [TERM-binom, TERM-expect]
      relations: [LRN-indep-binom, REL-comb-binom, DER-binom-moments, REL-binom-sampleprop]   # 割合のばらつき（A-02・C-02）は二項分布を n で割った分布（#171）
    model: binom
    vary:
      n: {min: 1, max: 30, step: 1}
      p: {min: 0, max: 1, step: 0.01}
    start: {n: 10, p: 0.5}
    compare: {p: 0.8}
    reason:
      title: 山の中心＝期待値 np
      concept: TERM-binom
      formula: 1
      steps:
        - 1回の成功は 0 か 1。1回の平均は p
        - 1回ずつの平均を n 回分足すと、全体の平均になる（期待値は独立でなくても足せる）
        - p を n 回足すと np。p を上げると中心は右へ動く
    themes:
      - {id: coin, name: コインの表, icon: 🪙, success: 表, failure: 裏, unit: 回, p: 0.5, story: コインを n 回投げて、表が出た回数を数える}
      - {id: shop, name: 来店客が買う, icon: 🛒, success: 買った, failure: 見ただけ, unit: 人, p: 0.25, story: 売場に n 人来て、買った人の数を数える}
      - {id: check, name: 検品で不良品, icon: 📦, success: 不良品, failure: 良品, unit: 個, p: 0.05, story: n 個を検品して、不良品の数を数える}
      - {id: shot, name: フリースロー, icon: 🏀, success: 入った, failure: 外れ, unit: 本, p: 0.7, story: n 本打って、入った本数を数える}
      - {id: dice, name: さいころの6, icon: 🎲, success: 6の目, failure: 6以外の目, unit: 回, p: 0.17, story: さいころを n 回振って、6 が出た回数を数える（6 の確率は 1/6＝約 0.17）}
      - {id: guess, name: 4択を当てずっぽう, icon: ✍️, success: 正解, failure: 不正解, unit: 問, p: 0.25, story: 4択を n 問当てずっぽうで答えて、正解の数を数える}
    counterexamples:   # 反例を実験する：成り立つ条件を1つ崩す。数は概念しだい
      - id: urn
        name: 箱から戻さずに取る
        breaks: 各回が独立
        mechanism: {kind: urn, total: 40}
        effect: {mean: same, spread: smaller}   # 言い分の向き。build が全部の n・p で確かめる（#118 層3）。公開の JSON には出さない
        concept: TERM-hyper
        text: 取った物を戻さないと、前に何が出たかで次の当たりの確率が変わる（独立でない）。前の結果を知らなければ、どの回も当たりの確率は同じ。箱の当たりの割合が同じ二項分布（戻す場合）と比べると、理論の平均は同じで、ばらつきは小さくなる（2 個以上取り、当たりが0個でも全部でもないとき）。少ない回数の実験では、いつも小さく見えるとは限らない。戻さずに取るときは超幾何分布で考える。箱が小さいほどずれる
      - id: streak
        name: 前の結果に引きずられる
        breaks: 各回が独立
        mechanism: {kind: streak, carry: 0.3}
        effect: {mean: same, spread: larger}
        concept: TERM-indep
        text: 入ると次も入りやすく、外すと次も外しやすい（口コミ・連れ立ち・調子の波）。理論の平均は np のままでも、二項分布より山が広がる（2 回以上で、p が 0 でも 1 でもないとき）。実験の平均は、実験ごとに np のまわりでばらつく。各回が独立でないときは、二項分布の式の分散を使えない
      - id: mix
        name: 日や時間で確率が違う
        breaks: 各回が独立   # 1回ごとに見れば確率は p のまま。崩れるのはセットの中の独立だけ（崩す条件は1つ。M8 の ⑦ の確かめ。#353・#352 の暫定 4）
        mechanism: {kind: mix, spread: 0.2}
        effect: {mean: same, spread: larger}
        concept: TERM-indep
        text: 買いやすい日と買いにくい日が混ざると、理論の平均は np のままでも山が広がる（2 回以上で、p が 0 でも 1 でもないとき）。セットごとに確率が p−d か p＋d（ずれ幅 d は 0.2 と p・1−p の小さい方）で、そのずれがセットの中の全部の回に共通なので、1回ごとに見れば確率は p でも、各回は独立でなくなる。全体の p だけで二項分布を当てると、ばらつきを小さく見積もる。実験の平均は、実験ごとに np のまわりでばらつく。p が 0 か 1 ならずれ幅は 0 で、山の広がりは変わらない
      - id: fatigue
        name: 疲れて確率が下がる
        breaks: 各回の成功確率 p が同じ
        mechanism: {kind: fatigue, drop: 0.3}
        effect: {mean: same, spread: smaller}
        text: 最初は確率が高く、回を追って下がる（疲れ・集中が切れる）。各回は独立のまま、確率だけが回ごとに違う。理論の平均は np のままでも、山は二項分布より狭くなる（2 回以上で、p が 0 でも 1 でもないとき。確率は最初 p＋d、最後 p−d で、最初から最後までに 2d 下がる。d は設定したずれ幅と p・1−p のうち最も小さい値）。分散は各回の pᵢ(1−pᵢ) の合計で、確率がばらつくほど小さい。差は小さいので、セット数が少ないと、いつも狭く見えるとは限らない（セットを増やすと見えてくる）。日や時間で確率が違う（山が広がる）とは向きが逆になる：確率のずれがセットの中で共通（日による）なら山は広がり、回ごとに違って各回が独立（疲れ）なら狭くなる
    # 入口「何を確かめたい？」に並べる問い（#161）。最初の問い（question）と反例（counterexamples）の間に並ぶ。form は問いの形（予測と観察の部品の組）
    # prob：確率の値を目盛り（prob_scale）で予測し、範囲に入ったセットの割合と理論を照らす。答えが目盛りの境目の近くにある問いは build が止める
    # 問いの形（#161）：spread（広がり）・prob（確率の値。free は学習者が結果を選ぶ）・conv（理論と実測）。位置は最初の問い、前提崩しは反例
    prob_scale: [0.5, 0.2, 0.05, 0.01, 0.001]
    questions:
      - id: spread
        form: spread
        title: 試行回数を増やすと分布はどう変わる？
        question: 回数を 10 回から 40 回にすると、成功の回数と割合のばらつきはどうなる？
        set: {n: 10, p: 0.5}
        to: {n: 40}
      - id: rare
        form: prob
        free: true
        title: 珍しい結果を調べる
        question: 結果を自分で選び、その確率を桁で予測する
        set: {n: 10, p: 0.7}
        events: [{op: eq, k: 10}]
      - id: pmf
        form: prob
        title: ちょうど k 回成功する確率を調べる
        question: 成功確率 30% で 10 回。「ちょうど 3 回」になる確率は？
        set: {n: 10, p: 0.3}
        events: [{op: eq, k: 3}]
      - id: exact
        form: prob
        title: ちょうど k 回と k 回以上を比べる
        question: 成功確率 50% で 10 回。「ちょうど 5 回」と「5 回以上」の確率は？
        set: {n: 10, p: 0.5}
        events: [{op: eq, k: 5}, {op: ge, k: 5}]
      - id: conv
        form: conv
        title: 回数を増やすと割合は理論に近づく？
        question: 10 回中 5 回以上になるセットの割合。10000 セット重ねると、割合のずれはどのくらいまで？   # 予測は見えている具体の数で（⑦ の 2。#372）。「ずれの目安」は観察で付ける名前
        set: {n: 10, p: 0.5}
        events: [{op: ge, k: 5}]
      # paths（並び）・repeat（くり返し）・mean（平均）・var（ばらつき）：#171 で作成中だった4問の入口
      - id: paths
        form: paths
        title: なぜ中央付近の成功回数が起こりやすい？
        question: コインを 6 回投げる。表が 6 回と表が 3 回、どちらが起こりやすい？
        set: {n: 6, p: 0.5}
        ks: [6, 3]
      - id: repeat
        form: repeat
        title: 理論分布と実験結果は一致する？
        question: 10 回中ちょうど 5 回成功するセットの割合。100 セットの実験をくり返すと、理論と一致する？
        set: {n: 10, p: 0.5}
        events: [{op: eq, k: 5}]
        sets: 100
      - id: mean
        form: mean
        title: 成功回数の期待値はどこにある？
        question: 成功確率 35% で 10 回。セットをくり返すと、成功回数の平均はいくつに近づく？
        set: {n: 10, p: 0.35}
      - id: var
        form: var
        title: 成功回数のばらつきは何で決まる？
        question: 回数 10 回のまま p を変える。成功回数の分散がいちばん大きい p は？
        set: {n: 10, p: 0.5}
        ps: [0.1, 0.3, 0.5, 0.7, 0.9]
    # テーマ体系（#163。渡辺さんの企画書「二項分布実験室」の 4. 実験テーマ体系）：まとまり（A〜F）の下に問い。
    # 問いの id は 概念-まとまり-番号（binom-A-01。企画書の B01〜B24 を置き換えた。変えない・消さない）。公開では教材名が付く（stats2:binom-A-01）。
    # concept は主概念（1つ）、related は関連概念（その問いを理解するのに実際に使う概念）。open は開く入口（shift・questions の id・break:反例の id）。
    # open のない問いは作成中（入口に並べるだけ）。finds は主な発見（予測の前には出さない）。
    # 開ける問いは predict（何を予測するか）・operate（何を操作するか）・judge（理解判定：何ができれば理解したとするか）を書く。
    # 実験の仕組み（問いの形）は共有してよいが、開く先（open）は問いごとに1つ。同じ画面を開くだけで別の問いを実現した扱いにしない（渡辺さん 2026-11-02）。
    # 主概念は実験室の所属ではなく、発見させたい性質で決める。2つの概念のつながりが主の問いは、関係（REL-…）を主にする（両端の概念から引ける）。
    # retired：重複などで使わない問い（id は消さず、入口に並べない。#169）
    catalog:
      - id: A
        title: 分布の形と仕組み
        items:
          - id: binom-A-01
            title: 成功確率を上げると、成功回数の山はどう動く？   # 開いた画面の問い（question）と同じ文に（UI レビュー「用語・文章」。#224）
            finds: 成功確率と分布の形の関係
            concept: TERM-binom
            predict: 成功確率を上げたとき、成功回数の山の頂点がどこへ動くか
            operate: 成功確率 p
            judge: 別の n・p で、p を上げると山の頂点が右へ動き、p が 0 や 1 に近いと山が片寄って端で切れることを説明できる   # 平均＝np は D-01 の発見（M8 の ⑦ の確かめ。#353）
            open: 'shift'
            apply:
              kind: 逆算
              task: 20 回の挑戦で、成功の回数の平均を 6 回にしたい。1回の成功確率 p を何 % にすればよい？
              solve: {method: mean-to-p, n: 20, mean: 6}
              answer: {type: number, unit: '%', percent: true, tol: {abs: 0}}
              why: ほしい平均（中心）が決まっていれば、平均＝回数×確率から、確率を逆に決められる。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                  - {text: '20 回', role: info, key: n}
                  - {text: 'の挑戦で、成功の回数の平均を ', role: text}
                  - {text: '6 回', role: info, key: e}
                  - {text: 'にしたい。', role: text}
                  - {text: '1回の成功確率 p を何 % にすればよい？', role: ask, key: q}
                info:
                  n: {word: 挑戦する回数, sym: n, of: n}
                  e: {word: 成功の回数の平均, sym: E, of: mean}
                formulas:
                  - {id: p, ref: binom.mean-p, bind: {E: e, n: n}, word: 1回の成功確率}
                steps:
                  - {kind: ask, short: p を求める, sum: 1回の成功確率 p を求める。}
                  - kind: info
                    short: 20 回・平均 6 回
                    sum: 挑戦する回数 20 回と、成功の回数の平均 6 回。
                    collect: {need: [n, e]}
                    choose:
                      - ask: 「平均 6 回」の意味として正しいのは？
                        opts: [20 回挑戦すれば、必ず 6 回成功する, 何度もくり返すと、成功の回数の平均が 6 回に近づく, 6 回より多く成功することはない]
                        ok: 1
                        fb: [期待値は「平均」。1セットだけ見ると、6 回より多いことも少ないこともある。, '', 平均が 6 回でも、7 回や 8 回成功するセットもある。]
                  - kind: formula
                    choose:
                      - todo: わかっている「回数」「平均」と、求める p をつなぐ式を選ぶ
                        math: true
                        opts: ['E(X) = np', 'V(X) = np(1 − p)', 'P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ']
                        ok: 0
                        fb: ['', それは分散（ばらつき）の式。この課題でわかっているのは平均。, それは「ちょうど k 回」になる確率の式。この課題は平均の話。]
                  - kind: build
                    rowQuiz:
                      p.div:
                        ask: 20 × p = 6 から、p だけを残すには？
                        opts: [両辺に 20 を掛ける, 両辺を 20 で割る, 両辺から 20 を引く]
                        ok: 1
                        fb: [掛けると 400p になり、p から離れる。, '', p には 20 が掛け算で付いている。引き算では外れない。]
                  - {kind: probe}
          - id: binom-A-02
            title: 試行回数を増やすと分布はどう変わる？
            finds: 成功回数と成功割合のばらつき
            concept: TERM-binom
            related: [TERM-sd]
            predict: 試行回数を増やしたとき、成功回数と成功割合のばらつきがどうなるか
            operate: 試行回数 n
            judge: 成功回数の標準偏差は √n に比例して増え、成功割合の標準偏差は 1/√n に比例して減ることを、別の n で説明できる
            open: 'spread'
            apply:
              kind: 設計
              task: 成功確率 30% の調査で、成功の割合の標準偏差を 0.08 以下にしたい。回数 n は最低いくつ要る？
              solve: {method: min-n-share-sd, p: 0.3, sd: 0.08}
              answer: {type: number, unit: 回, tol: {abs: 0}}
              why: 成功割合の標準偏差は試行回数の平方根に反比例する。標準偏差を半分にするには、試行回数を4倍にする。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                - {text: '成功確率 ', role: text}
                - {text: 30%, role: info, key: p}
                - {text: ' の調査で、成功の割合の標準偏差を ', role: text}
                - {text: 0.08 以下, role: info, key: s}
                - {text: にしたい。, role: text}
                - {text: 回数 n は最低いくつ要る？, role: ask, key: q}
                info:
                  p: {word: 成功確率, sym: p, of: p}
                  s: {word: 標準偏差の上限, sym: s, of: sd}
                formulas:
                - id: n
                  ref: share.sd-n
                  bind: {p: p, s: s}
                  word: 最低の回数
                steps:
                - {kind: ask, short: 最低の n, sum: 成功の割合の標準偏差が 0.08 以下になる、いちばん小さい回数 n を求める。}
                - kind: info
                  short: 30%・0.08 以下
                  sum: 成功確率 30% と、割合の標準偏差の上限 0.08。
                  collect:
                    need: [p, s]
                  choose:
                  - ask: 「成功の割合の標準偏差」が表すのは？
                    opts: [n 回のうち成功した割合が、くり返すたびにどれだけばらつくか, 成功の回数のばらつき, 成功確率 p の測りまちがい]
                    ok: 0
                    fb: ['', 回数ではなく割合（回数 ÷ n）のばらつき。, p は決まった値。ばらつくのは、実際に起きた割合。]
                - kind: relate
                  short: n が増えると小さくなる
                  sum: 回数 n を増やすほど、割合のばらつきは小さくなる。だから「最低いくつ」を求める。
                  choose:
                  - ask: 回数 n を増やすと、成功の割合の標準偏差は？
                    opts: [小さくなる, 大きくなる, 変わらない]
                    ok: 0
                    fb: ['', 大きくなるのは成功の回数のばらつき。割合（÷ n）のばらつきは小さくなる。, 回数を増やすほど、割合は p の近くに集まる。]
                - kind: formula
                  choose:
                  - todo: 割合の標準偏差と回数 n をつなぐ式を選ぶ
                    math: true
                    opts: [SD(割合) = √(p(1 − p)/n), SD(回数) = √(np(1 − p)), E(X) = np]
                    ok: 0
                    fb: ['', それは成功の回数の標準偏差。この課題は割合。, それは平均の式。この課題はばらつき。]
                - kind: build
                  rowQuiz:
                    n.ceil:
                      ask: 回数 n は整数。境目が小数のとき、条件を満たす最小の n は？
                      opts: [境目の小数を切り捨てた整数, 境目の小数を切り上げた整数, 境目を四捨五入した整数]
                      ok: 1
                      fb: [切り捨てると境目より小さくなり、標準偏差が上限を超える。, '', 四捨五入では、境目より小さくなることがある。]
                - {kind: probe}
          - id: binom-A-03
            title: なぜ中央付近の成功回数が起こりやすい？
            finds: 組合せ数と確率の関係
            concept: TERM-binom
            related: [TERM-comb]
            predict: 表が全部の回数と、半分の回数のどちらが起こりやすいか
            operate: 実験のセット数（並びの種類を数える）
            judge: 1つの並びの確率と並びの数 ₙCₖ を分けて、真ん中の回数が起こりやすい理由を説明できる
            open: 'paths'
            apply:
              kind: 評価
              task: 成功確率 80% で 13 回。成功の回数で、いちばん起こりやすいのは何回？
              solve: {method: mode, n: 13, p: 0.8}
              answer: {type: number, unit: 回, tol: {abs: 0}}
              why: いちばん起こりやすい回数は、並びの数と1つの並びの確率の掛け算がいちばん大きい所。p が 50% でないと真ん中からずれ、平均 np の近くに来る。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                - {text: '成功確率 ', role: text}
                - {text: 80%, role: info, key: p}
                - {text: ' で ', role: text}
                - {text: 13 回, role: info, key: n}
                - {text: 。, role: text}
                - {text: 成功の回数で、いちばん起こりやすいのは何回？, role: ask, key: q}
