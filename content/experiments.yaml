                  n: {word: 1人が打つ本数, sym: n, of: n}
                  p: {word: 1本の成功確率, sym: p, of: p}
                  k: {word: 成功してほしい本数, sym: k, of: event.k}
                  indep: {word: 1本ごとに影響しない}
                  members: {word: 部員どうしも影響しない}
                formulas:
                  - {id: one, ref: binom.pmf, bind: {n: n, k: k, p: p}, word: 1人の確率}
