                - {text: 3 回, role: info, key: ak}
                - {text: 」と「, role: text}
                - {text: 30 回, role: info, key: bn}
                - {text: '中 ', role: text}
                - {text: 9 回, role: info, key: bk}
                - {text: '」。成功確率はどちらも ', role: text}
                - {text: 30%, role: info, key: p}
                - {text: （p＝0.3）で、成功割合も 30%。, role: text}
                - {text: ちょうどその回数になる確率も同じくらい？, role: ask, key: q}
                info:
                  an: {word: 1つ目の回数, sym: n, of: a.n}
                  ak: {word: 1つ目の成功回数, sym: k, of: a.k}
                  bn: {word: 2つ目の回数, sym: n, of: b.n}
                  bk: {word: 2つ目の成功回数, sym: k, of: b.k}
                  p: {word: 成功確率, sym: p, of: a.p}
                formulas:
                - id: a
                  ref: binom.pmf
                  bind: {n: an, k: ak, p: p}
                  word: 1つ目の確率
                - id: b
                  ref: binom.pmf
                  bind: {n: bn, k: bk, p: p}
                  word: 2つ目の確率
                - id: r
                  ref: ratio
                  bind: {A: a, B: b}
                  word: 確率の比
                steps:
                - {kind: ask, short: 同じくらい？, sum: 「10 回中ちょうど 3 回」と「30 回中ちょうど 9 回」の確率が同じくらいかを比べる。}
                - kind: info
                  short: 10 回中 3 回・30 回中 9 回・30%
                  sum: 1つ目は 10 回中 3 回、2つ目は 30 回中 9 回。成功確率はどちらも 30%。
