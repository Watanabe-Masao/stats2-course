                    mark: k
                    todo: 課題の文で、その1人に起きてほしいことを押す
                    choose:
                      - ask: その1人が 10 本打つとき、何本成功した場合を考える？
                        opts: [7 本（70% だから）, 10 本, 1 本以上]
                        ok: 1
                        fb: [70% は1本ごとの確率。問いは「すべて成功」の場合。, '', 「すべて」なので、1 本以上ではなく 10 本とも。]
                  - kind: info
                    short: 10 本・70%・1本ごとに独立
                    sum: 1人が打つ本数 10 本、1本の成功確率 70%、1本ごとに影響しない（だから確率を掛け合わせられる）。
                    collect: {need: [n, p, indep], later: [people]}
                  - kind: relate
                    short: 50 × 1人の確率
                    sum: 50 人それぞれに「10 本すべて成功」が同じ確率で起きる。平均の人数は 50 × 1人の確率。平均には部員どうしの独立は要らないが、「少なくとも1人いる確率」を出すには要る。
                    mark: people
                    todo: 課題の文で、全体の人数を押す
                    choose:
                      - ask: 50 人全体では、平均の人数をどう考える？
                        opts: [50 人それぞれに「10 本すべて成功」が同じ確率で起きる。だから 50 × 1人の確率, 1 本の成功確率を使って、50 × 0.7, 全部の本数を使って、50 × 10 × 0.7]
                        ok: 0
                        fb: ['', 0.7 は「1 本」が入る確率。ほしいのは「10 本すべて」が入る人。, それは全員が打った本数のうち、入る本数の平均。聞かれているのは人数。]
                  - kind: formula
                    choose:
                      - ask: 1人が 10 本中 k 本成功する確率は、どの公式で求める？
                        math: true
                        opts: ['E(X) = np', 'V(X) = np(1 − p)', 'P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ']
                        ok: 2
                        fb: [それは成功する本数の平均。ほしいのは「ちょうど 10 本」になる確率。, それはばらつきの大きさ。ほしいのは確率。, '']
                      - ask: 「50 × 1人の確率」は、どの公式と同じ形？
                        math: true
                        opts: ['E(X) = np（n → 人数、p → 1人の確率）', 'V(X) = np(1 − p)', 'P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ']
                        ok: 0
                        fb: ['', それはばらつきの大きさ。ほしいのは平均の人数。, それは「ちょうど k 人」になる確率。ほしいのは平均。]
                  - kind: build
                    rowQuiz:
                      one.fail:
                        ask: 0.3<sup>0</sup> はいくつ？（失敗は 0 本）
                        opts: ['0', '0.3', '1']
                        ok: 2
                        fb: [0 乗は 0 ではない。「1 回も掛けない」ので 1 のまま。, 0.3 は 1 乗（1 回掛けた）とき。, '']
                    choose:
