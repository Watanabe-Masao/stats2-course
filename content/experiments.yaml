                        ok: 1
                        fb: [平均は毎回の結果ではない。0 人の日も 3 人の日もある。, '', 1.41 は割合ではなく人数。割合なら約 2.8%。]
      - id: C
        title: 理論と実験
        items:
          - id: binom-C-01
            title: 理論分布と実験結果は一致する？
            finds: 理論確率と実測割合
            concept: TERM-binom   # 主だった標本誤差と標準誤差の対比は、姿が違うので ⑤ の線にしなかった（#298）。標準誤差は骨格なので、説明のある二項分布を主にし、2つは関連にした
            related: [TERM-se, TERM-sampling-error]
            predict: 同じ条件の実験をくり返すと、実測の割合が理論と一致するか
            operate: 同じ条件の実験の回数
            judge: 実測の割合が実験ごとにばらつく理由を標本変動（SE）で説明し、ばらつきの目安と比べて理論を疑うかを判断できる
            open: 'repeat'
            apply:
              kind: 反証
              task: 理論では 20% で起きる事象を 100 回試したら、27 回起きた。この結果から「理論は間違っている」と言える？
              solve: {method: within-band, P: 0.2, m: 100, x: 27}
              answer: {type: choice, options: [言える, 言えない]}
              why: 理論どおりでも、実測の割合は ±2SE の幅くらいまではよくばらつく。その幅の中の結果だけでは、理論が間違っているとは言えない（正しいと証明されたわけでもない）。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                - {text: '理論では ', role: text}
                - {text: 20%, role: info, key: pr}
                - {text: ' で起きる事象を ', role: text}
                - {text: 100 回, role: info, key: m}
                - {text: 試したら、, role: text}
                - {text: 27 回, role: info, key: x}
                - {text: 起きた。, role: text}
                - {text: この結果から「理論は間違っている」と言える？, role: ask, key: q}
                info:
                  pr: {word: 理論の確率, sym: P, of: P}
                  m: {word: 試した回数, sym: m, of: m}
                  x: {word: 起きた回数, sym: x, of: x}
                formulas:
                - id: se
                  ref: share.se
                  bind: {P: pr, m: m}
                  word: 標準誤差
                - id: z
                  ref: share.z
                  bind: {x: x, m: m, P: pr, S: se}
                  word: ずれの大きさ
                steps:
                - {kind: ask, short: 理論を疑えるか, sum: 27 回が、理論 20% のもとでもたまたま起きるずれかを判断する。}
                - kind: info
                  short: 20%・100 回・27 回
                  sum: 理論の確率 20%、試した回数 100 回、起きた回数 27 回。
                  collect:
                    need: [pr, m, x]
                - kind: relate
                  short: たまたまのずれ
                  sum: 理論が正しくても、割合はぴったり 20% にはならない。ずれが標準誤差の 2 倍（±2SE）までなら、たまたまでもよく起きる。
                  choose:
                  - ask: 理論が正しいとき、100 回中の割合はいつもぴったり 20% になる？
                    opts: [なる, ならない。たまたまのずれがある, 27 回なら理論より多いので、理論は違う]
                    ok: 1
                    fb: [割合は試すたびにばらつく。, '', 理論より多くても、たまたまのずれの範囲かもしれない。ずれの大きさで判断する。]
                - kind: formula
                  choose:
                  - todo: 割合のずれの目安（標準誤差）の式を選ぶ
                    math: true
                    opts: [SE = √(P(1 − P)/m), V(X) = np(1 − p), E(X) = np]
                    ok: 0
                    fb: ['', それは回数の分散。割合のずれの目安は標準誤差。, それは平均。]
                  - todo: ずれが標準誤差の何個分かを測る式を選ぶ
                    math: true
                    opts: [z = |x/m − P| ÷ SE, z = |x − mP| ÷ SE, z = |x/m − P| ÷ SE²]
                    ok: 0
                    fb: ['', 回数のずれを、割合の標準誤差で割っている。割合どうし・回数どうしでそろえる。, SE² は分散。ずれは標準誤差そのもので測る。]
                - kind: build
                  rowQuiz:
                    z.diff:
                      ask: 理論とのずれは、どう測る？
                      opts: [起きた割合と理論の確率の差, 起きた回数と試した回数の差, 理論の確率そのもの]
                      ok: 0
                      fb: ['', 回数どうしの差では、試した回数が違うと比べられない。, ずれは、起きた割合が理論からどれだけ離れたか。]
                  choose:
                  - ask: 計算した z は 2 より？
                    opts: [大きい, 2 以下]
                    ok: 1
                    fb: [計算した z の値をもう一度見る。, '']
                  - ask: では「理論は間違っている」と言える？
                    opts: [言える, 言えない]
                    ok: 1
                    fb: [±2SE の中のずれは、理論が正しくてもたまたまよく起きる。, '']
                - kind: probe
                  todo: "n を 1 回にすると、1セット＝1回、m＝試した回数になる。p と m を課題の値に合わせ、起きた割合（起きた回数 ÷ 試した回数）がばらつきの目安 ±2SE の帯に入るかを読む"
                  hit: "帯（±2SE）の中なら、理論が正しくてもたまたま起きるずれ。"
          - id: binom-C-02
            title: 実験セット数を増やすと誤差はどう変わる？
            finds: ずれの目安の縮み方   # 判定（2SE の √m）と目標をそろえた（M8 の ⑦ の確かめ。#353）
            concept: TERM-binom   # 発見は大数の法則（ずれの目安が √m に反比例）。大数の法則に説明を書いたら主を TERM-lln に移す（#169）
            related: [TERM-lln, TERM-se]
            predict: セットを 100 倍にしたとき、理論とのずれの目安が何分の1になるか
            operate: 実験のセット数
            judge: セットを増やすと実測の割合は理論の確率に近づき（大数の法則）、ずれの目安（2SE）はセット数の平方根に反比例して小さくなること、ただし実際のずれは毎回必ず減るわけではないことを説明できる
            open: 'conv'
            apply:
              kind: 設計
              task: 成功確率 30% で 10 回の実験を何セットも行い、「4 回以上」になるセットの割合を理論と比べたい。ずれの目安（±2SE）を ±1 ポイント以内にするには、何セット要る？（100 セット単位で数える）
              solve: {method: sets-for-error, n: 10, p: 0.3, event: {op: ge, k: 4}, err: 0.01, unit: 100}
              answer: {type: number, unit: セット, tol: {abs: 0}}
              why: 理論とのずれの目安はセット数の平方根に反比例する。ほしい精度から、要るセット数を決められる。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                - {text: '成功確率 ', role: text}
                - {text: 30%, role: info, key: p}
                - {text: ' で ', role: text}
                - {text: 10 回, role: info, key: n}
                - {text: の実験を何セットも行い、「, role: text}
                - {text: 4 回以上, role: event, key: k}
                - {text: 」になるセットの割合を理論と比べたい。ずれの目安（±2SE）を ±, role: text}
                - {text: 1 ポイント以内, role: info, key: e}
                - {text: にするには、, role: text}
                - {text: 何セット要る？, role: ask, key: q}
                - {text: （, role: text}
                - {text: 100 セット単位, role: info, key: u}
                - {text: で数える）, role: text}
                info:
                  p: {word: 成功確率, sym: p, of: p}
                  n: {word: 1セットの回数, sym: n, of: n}
                  k: {word: セットに起きてほしいこと, sym: k, of: event.k}
                  e: {word: 許すずれ, sym: e, of: err}
                  u: {word: 数える単位, sym: u, of: unit}
                formulas:
                - id: q
                  ref: binom.ge
                  bind: {k: k, n: n, p: p}
                  word: 1セットで起きる確率
                - id: sets
                  ref: sets.n
                  bind: {P: q, e: e, u: u}
                  word: 要るセット数
                steps:
                - {kind: ask, short: 要るセット数, sum: 「4 回以上」のセットの割合のずれの目安を ±1 ポイント以内にする、セット数を求める。}
                - kind: unit
                  short: 1セット＝10 回
                  sum: 1つのセットは 10 回の実験。セットごとに「4 回以上」になったかを数える。
                  choose:
                  - ask: この課題で数える「1つ」は？
                    opts: [10 回の実験1回分（1セット）, 1回の挑戦, 100 セットのまとまり]
                    ok: 0
                    fb: ['', 数えるのは、セットごとに「4 回以上」になったか。, 100 セットは数える単位。1つ1つはセット。]
                - {kind: event, short: 4 回以上, mark: k, sum: そのセットで成功が 4 回以上になること。}
                - kind: info
                  short: 30%・10 回・±1 ポイント・100 セット単位
                  sum: 成功確率 30%、1セット 10 回、許すずれ ±1 ポイント、100 セット単位で数える。
                  collect:
                    need: [p, n, e, u]
                - kind: relate
                  short: セット数を増やすと
                  sum: セットの割合のずれの目安 2SE は、セット数の平方根に反比例して小さくなる。
                  choose:
                  - ask: セット数を 4 倍にすると、ずれの目安（2SE）は？
                    opts: [半分になる, 4 分の 1 になる, 変わらない]
                    ok: 0
                    fb: ['', SE はセット数の平方根に反比例する。4 倍の平方根は 2。, セット数を増やすほど、割合は理論の近くに集まる。]
                - kind: formula
                  choose:
                  - todo: 1セットで「4 回以上」になる確率の式を選ぶ
                    math: true
                    opts: [P(X ≥ k) = 1 − P(X ≤ k − 1), P(X ≥ k) = P(X = k), E(X) = np]
                    ok: 0
                    fb: ['', 「以上」は k 回の棒1本ではなく、k 回から n 回までの全部。, それは平均。]
                  - todo: セット数 N とずれの目安をつなぐ式を選ぶ
                    math: true
                    opts: [2SE = 2√(P(1 − P)/N)（P は1セットで起きる確率）, 2SE = 2√(p(1 − p)/N)（p は1回の成功確率）, V(X) = np(1 − p)]
                    ok: 0
                    fb: ['', 数えるのはセットごとに「4 回以上」になったか。1回の成功確率ではなく、1セットで起きる確率を使う。, それは1セットの成功回数の分散。この段はセットの割合のずれ。]
                - kind: build
                  rowQuiz:
                    q.le:
                      ask: P(X ≤ 3) に入る回数は？
                      opts: [0〜3 回, 1〜3 回, 0〜4 回]
                      ok: 0
                      fb: ['', 0 回も 3 回以下に入る。, 4 回は「4 回以上」の側。]
                    sets.ceil:
                      ask: 境目を 100 セット単位で数えるには？
                      opts: [100 の倍数に切り上げる, 100 の倍数に切り捨てる, 四捨五入する]
                      ok: 0
                      fb: ['', 切り捨てると境目より少なくなり、ずれが ±1 ポイントを超える。, 四捨五入では、境目より少なくなることがある。]
                - kind: probe
                  todo: "下のチップを課題の n・p・k に合わせ、N を求めたセット数にしてずれの目安を読む。次に 100 セット減らして比べる（境目の前後）"
          - id: binom-C-03
            title: 同じ実験を繰り返すと同じ結果になる？
            finds: 標本変動
            concept: TERM-binom
            retired: true   # C-01 と同じ発見（同じ条件でも実験ごとにばらつく）。C-01 の観察で扱う（#169）
          - id: binom-C-04
            title: 珍しい結果を何セット試せば観察できる？
            finds: 少なくとも1回発生する確率
            concept: TERM-complement
            related: [TERM-indep, TERM-binom]
      - id: D
        title: 期待値・分散との接続
        items:
          - id: binom-D-01
            title: 成功回数の期待値はどこにある？
            finds: E(X)＝np
            concept: TERM-binom
            related: [TERM-expect]
            predict: セットをくり返したとき、成功回数の平均がいくつに近づくか
            operate: 実験のセット数
            judge: 成功回数の平均が np に近づくことを、1回ごとの期待値 p の足し算（線形性）で説明できる
            open: 'mean'
            apply:
              kind: 変換
              task: 成功確率 30% の挑戦を 10 回する。成功すると 200 円もらえ、失敗すると 50 円払う。もらえる金額の合計の期待値は何円？
              solve: {method: linear-sum, n: 10, p: 0.3, a: 200, b: -50}
              answer: {type: number, unit: 円, tol: {abs: 0}}
              why: 合計＝200×（成功回数）−50×（失敗回数）。期待値は足し算と定数倍をそのまま通るので、成功回数の期待値 np から求められる。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                - {text: '成功確率 ', role: text}
                - {text: 30%, role: info, key: p}
                - {text: ' の挑戦を ', role: text}
                - {text: 10 回, role: info, key: n}
                - {text: 'する。成功すると ', role: text}
                - {text: 200 円, role: info, key: a}
                - {text: 'もらえ、失敗すると ', role: text}
                - {text: 50 円払う, role: info, key: b}
                - {text: 。, role: text}
                - {text: もらえる金額の合計の期待値は何円？, role: ask, key: q}
                info:
                  p: {word: 成功確率, sym: p, of: p}
                  n: {word: 挑戦する回数, sym: n, of: n}
                  a: {word: 成功1回の金額, sym: a, of: a}
                  b: {word: 失敗1回の金額, sym: b, of: b}
                formulas:
                - id: mean
                  ref: binom.mean
                  bind: {n: n, p: p}
                  word: 成功の回数の平均
                - id: total
                  ref: lin.sum
                  bind: {a: a, E: mean, b: b, n: n}
                  word: 合計の期待値
                steps:
                - {kind: ask, short: 合計の期待値, sum: 10 回でもらえる金額の合計の、期待値（平均）を求める。}
                - kind: info
                  short: 30%・10 回・200 円・50 円払う
                  sum: 成功確率 30%、10 回、成功で 200 円もらい、失敗で 50 円払う。
                  collect:
                    need: [p, n, a, b]
                - kind: relate
                  short: 期待値の線形性
                  sum: 合計は 200X − 50(n − X)。和の期待値は期待値の和なので、成功の回数の平均 E(X) だけで求められる。
                  choose:
                  - ask: 合計の期待値を出すのに、何円になる確率を全部求める必要はある？
                    opts: [ない。期待値は足し算と定数倍をそのまま通る, ある。期待値は分布から求める, 成功と失敗が独立なら要らない]
                    ok: 0
                    fb: ['', 分布から求めることもできるが、和の期待値は期待値の和なので、回数の平均だけで足りる。, 独立かどうかによらない。期待値の線形性はいつも成り立つ。]
                - kind: formula
                  choose:
                  - todo: 成功の回数の平均の式を選ぶ
                    math: true
                    opts: [E(X) = np, V(X) = np(1 − p), P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ]
                    ok: 0
                    fb: ['', それは分散。, それは棒1本の確率。]
                  - todo: 合計の期待値の式を選ぶ
                    math: true
                    opts: [E(Y) = aE(X) + b(n − E(X)), E(Y) = aE(X) + bE(X), E(Y) = aE(X)]
                    ok: 0
                    fb: ['', 失敗の回数の平均は E(X) ではない。, 失敗で払う分が入っていない。]
                - kind: build
                  rowQuiz:
                    total.fail:
                      ask: 失敗の回数の平均は？
                      opts: [n − E(X), E(X), n]
                      ok: 0
                      fb: ['', E(X) は成功の回数の平均。, n は全部の回数。成功した分を引く。]
                - kind: probe
                  todo: "下のチップを課題の n・p に合わせ、a（成功1回の値）と b（失敗1回の値）を課題の金額にして（払う分は負の数）、合計の値の平均を読む"
                  hit: "式で出した合計の期待値と、合計の値の平均が同じになった。"
          - id: binom-D-02
            title: 成功回数のばらつきは何で決まる？
            finds: V(X)＝np(1−p)
            concept: TERM-binom
            related: [TERM-var, TERM-indep]
            predict: 回数を決めたまま p を変えると、分散がいちばん大きいのはどの p か
            operate: 成功確率 p
            judge: 分散が np(1−p) で、p＝0.5 で最大・p と 1−p で同じになることを、1回の分散と独立な足し算で説明できる
            open: 'var'
            apply:
              kind: 評価
              task: A は 10 回・成功確率 60%、B は 20 回・成功確率 30%。成功回数の分散が大きいのはどちら？
              solve: {method: compare-var, a: {n: 10, p: 0.6}, b: {n: 20, p: 0.3}}
              answer: {type: choice, options: [A, ほぼ同じ, B]}
              why: 分散は np(1−p)。回数が多いほど大きく、p が 50% に近いほど大きい。回数と p の両方で比べる。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
                  - {text: 'A は ', role: text}
                  - {text: '10 回', role: info, key: an}
                  - {text: '・成功確率 ', role: text}
                  - {text: '60%', role: info, key: ap}
                  - {text: '、B は ', role: text}
                  - {text: '20 回', role: info, key: bn}
                  - {text: '・成功確率 ', role: text}
                  - {text: '30%', role: info, key: bp}
                  - {text: '。', role: text}
                  - {text: '成功回数の分散が大きいのはどちら？', role: ask, key: q}
                info:
                  an: {word: A の回数, sym: n, of: a.n}
                  ap: {word: A の成功確率, sym: p, of: a.p}
                  bn: {word: B の回数, sym: n, of: b.n}
                  bp: {word: B の成功確率, sym: p, of: b.p}
                formulas:
                  - {id: va, ref: binom.var, bind: {n: an, p: ap}, word: A の分散}
                  - {id: vb, ref: binom.var, bind: {n: bn, p: bp}, word: B の分散}
                steps:
                  - {kind: ask, short: 分散の大小, sum: A と B の、成功回数の分散の大きさを比べる。}
                  - kind: info
                    short: A 10 回・60%／B 20 回・30%
                    sum: A は 10 回・成功確率 60%、B は 20 回・成功確率 30%。
                    collect: {need: [an, ap, bn, bp]}
                    choose:
                      - ask: 分散が表すのは？
                        opts: [山の中心の位置, 山の広がり（ばらつき）, いちばん起こりやすい回数]
                        ok: 1
                        fb: [中心の位置は平均（期待値）。, '', それは最頻値（いちばん高い棒）。]
                  - kind: relate
                    short: 平均はどちらも 6 回
                    sum: 平均は A が 10 × 0.6 ＝ 6、B が 20 × 0.3 ＝ 6 で同じ。それでもばらつきは同じとは限らない。
                    choose:
                      - ask: A と B の成功回数の平均（np）は？
                        opts: [A 6 回・B 6 回, A 6 回・B 4 回, A 4 回・B 6 回]
                        ok: 0
                        fb: ['', B は 20 × 0.3 ＝ 6。, A は 10 × 0.6 ＝ 6。]
                  - kind: formula
                    choose:
                      - todo: ばらつき（分散）の式を選ぶ
                        math: true
                        opts: ['V(X) = np(1 − p)', 'E(X) = np', 'P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ']
                        ok: 0
                        fb: ['', それは平均の式。, それは棒1本の確率の式。]
                  - kind: build
                    choose:
                      - ask: 分散が大きいのはどちら？
                        opts: [A, ほぼ同じ, B]
                        ok: 2
                        fb: [A は 2.4、B は 4.2。, 2.4 と 4.2 は 1.75 倍違う。, '']
                  - {kind: probe}
          - id: binom-D-03
            title: 期待値が同じでも分布は違う？
            finds: 期待値だけでは分布を特定できない
            concept: TERM-expect   # 期待値という1つの数で何が消えるかを発見させる（二項分布は題材。渡辺さん 2026-11-02）
            related: [TERM-var, TERM-dist, TERM-binom]
            predict: 期待値が同じ2つの分布の形の違い
            operate: n と p（n×p を同じに保つ）
            retired: true   # 同じ発見は期待値の実験室の expect-D-01（期待値が同じくじは、同じくじ？）で扱う（#119・#273。渡辺さん 2026-11-11）
          - id: binom-D-04
            title: 成功回数と成功割合では何が違う？
            finds: 個数と割合の分散の違い
            concept: TERM-binom
            retired: true   # A-02 と同じ発見（回数と割合のばらつき）。A-02 の観察で扱う（#169）
            related: [TERM-var]
      - id: E
        title: 前提条件と反例
        items:
          - id: binom-E-01
            title: 成功確率が毎回違っても二項分布になる？
            finds: 成功確率一定の条件
            concept: TERM-binom
            predict: 回を追って確率が下がるとき、二項分布と比べた山の広がり
            operate: 起き方（回を追って確率が下がる）
            judge: 成功確率が回ごとに違うと二項分布にならず、ばらつきが np(1−p) より小さくなることを、別の下がり方で説明できる
