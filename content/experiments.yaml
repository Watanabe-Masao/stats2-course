      - id: B
        title: 事象と確率計算
        items:
          - id: binom-B-01
            title: ちょうど k 回成功する確率を調べる
            finds: ちょうど k 回の確率の決まり方   # 名前でなく性質（M8 の ⑦ の確かめ。#353・#352 の暫定 2）
            concept: TERM-binom
            related: [TERM-comb]
            predict: ちょうど k 回になる確率の桁
            operate: 成功回数 k
            judge: ちょうど k 回の確率が 並びの数 × 1つの並びの確率 pᵏ(1−p)ⁿ⁻ᵏ で決まることと、回数を増やすと同じ割合でも「ちょうどその回数」の確率は小さくなること（p が 0 でも 1 でもないとき）を、別の n・p・k で説明できる
            open: 'pmf'
            apply:
              kind: 反証
              task: 「10 回中 3 回」と「30 回中 9 回」。成功確率はどちらも 30%（p＝0.3）で、成功割合も 30%。ちょうどその回数になる確率も同じくらい？
              solve: {method: compare-eq, a: {n: 10, p: 0.3, k: 3}, b: {n: 30, p: 0.3, k: 9}}
              answer: {type: choice, options: [10 回中 3 回の方が起きやすい, ほぼ同じ, 30 回中 9 回の方が起きやすい]}
              why: 回数が増えると結果の候補が増え、ちょうど1つの値の確率は小さくなる。だから珍しさは「以上・以下」で見る。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
