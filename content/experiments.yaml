                        ok: 1
                        fb: [全体の人数はあとで使う。全体のことは、1人に何が起きるかが分かってから考える。, '', 1 本だけでは「10 本すべて」が決まらない。1人が 10 本打つ所まで見る。]
                  - kind: event
