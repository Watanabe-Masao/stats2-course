            operate: 事象の範囲（ちょうど・以上・以下）
            judge: 以上・以下の確率は、ちょうどの確率の足し合わせで、境目を含むかで値が変わることを説明できる
            open: 'exact'
            apply:
              kind: 評価
              task: 成功確率 30% で 10 回。報告に「3 回より多くなる確率」と書くはずが「3 回以上」の値を使っていた。確率は何ポイント高く見積もられた？
              solve: {method: boundary, n: 10, p: 0.3, k: 3}
              answer: {type: number, unit: ポイント, percent: true, tol: {abs: 0}}
              why: 「以上」と「より多い」の差は境目の棒1本。境目が山の高い所なら、取り違えると大きくずれる。
              walk:   # 解き方を組み立てる（#181・渡辺さんの「解法の段 骨格設計」）。式・記号の意味・計算の行と意味・値は engine が作る
                segments:
