                        math: true
                        opts: ['P(X = k) = ₙCₖ pᵏ(1 − p)ⁿ⁻ᵏ', 'E(X) = np', 'V(X) = np(1 − p)']
                        ok: 0
                        fb: ['', それは平均の式。棒1本の高さは出ない。, それは分散の式。]
                  - kind: build
                    rowQuiz:
