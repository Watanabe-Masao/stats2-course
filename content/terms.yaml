- id: TERM-dist
  name: 確率分布
  en: probability distribution
  definition: 確率変数がとる値と、それぞれの値をとる確率（連続なら確率密度）の対応。
  version: 1
  figures: [FIG-U13-concept]
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 値と確率の一覧を変えると、期待値（重心）がどう動くかを見る}
  principle: 起こりうる値を全部挙げ、確率を割り振ったもの。確率は0以上で、合計（連続なら面積）が1。期待値や分散は、分布を1つの数に要約したもの。
  formulas:
  - tex: '\sum_x p(x)=1'
    label: 確率の合計は1
    symbols:
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
      key: p
    - symbol: x
      meaning: X がとる値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "sum", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "p"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - どの値の確率も0以上
    - 全部の値の確率の合計が1（連続なら密度の面積が1）
    data:
    - データの相対度数の一覧は、分布の推定値。データが少ないと形が揺れる
  example: 1人が買う個数が 0個 0.2・1個 0.5・2個 0.3 なら、合計が1なので確率分布になっている。
  counterexample: 0個 0.2・1個 0.5・2個 0.4 は合計が 1.1 になるので、確率分布ではない。
  misconceptions:
  - misconception: 確率分布はグラフの形のこと
    correction: 中身は「値と確率の一覧」。棒グラフでも表でも、一覧が同じなら同じ分布
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(2,10)+Fraction(5,10)+Fraction(3,10)==1
  - Fraction(2,10)+Fraction(5,10)+Fraction(4,10)==Fraction(11,10)
- id: TERM-cov
  name: 共分散
  en: covariance
  definition: 2つの確率変数が、それぞれの期待値から同じ向きにずれるか逆向きにずれるかを、ずれの積の期待値で表した量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s5-free, purpose: 同時分布で共分散を0にすると独立になる場合を確かめる}
  principle: (X−μ_X)(Y−μ_Y) の期待値。同じ向きのずれが多いと正、逆向きが多いと負。和の分散に 2Cov として効く。
  formulas:
  - tex: '\mathrm{Cov}(X,Y)=E\big[(X-\mu_X)(Y-\mu_Y)\big]=E(XY)-E(X)E(Y)'
    symbols:
    - symbol: Cov(X, Y)
      meaning: X と Y の共分散
      key: Cov
    - symbol: E( )
      meaning: 期待値（値×確率を足す）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: Y
      meaning: 確率変数
      key: Y
      kind: rv
    - symbol: μ_X
      meaning: X の期待値
      key: muX
      concept: TERM-expect
      kind: param
      of: X
    - symbol: μ_Y
      meaning: Y の期待値
      key: muY
      concept: TERM-expect
      kind: param
      of: Y
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}, {"sym": "Y"}], "name": "Cov"}, {"op": "fn", "args": [{"op": "mul", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "muX"}]}, {"op": "sub", "args": [{"sym": "Y"}, {"sym": "muY"}]}]}], "name": "E"}, {"op": "sub", "args": [{"op": "fn", "args": [{"op": "mul", "args": [{"sym": "X"}, {"sym": "Y"}]}], "name": "E"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "fn", "args": [{"sym": "Y"}], "name": "E"}]}]}]}
  - tex: 'V(X+Y)=V(X)+V(Y)+2\,\mathrm{Cov}(X,Y)'
    label: 和の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: Cov( )
      meaning: 共分散（ずれの積の期待値）
      key: Cov
      concept: TERM-cov
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: Y
      meaning: 確率変数
      key: Y
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"sym": "X"}, {"sym": "Y"}]}], "name": "V"}, {"op": "add", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "fn", "args": [{"sym": "Y"}], "name": "V"}, {"op": "mul", "args": [{"num": 2}, {"op": "fn", "args": [{"sym": "X"}, {"sym": "Y"}], "name": "Cov"}]}]}]}
  conditions:
    math:
    - X・Y の分散が有限
    data:
    - 単位で値が変わる（円を千円にすると1000分の1）。関係の強さを比べるなら相関係数にする
    - 直線的な関係しか測らない
  example: X が 0・1 を確率 1/2 ずつとり Y＝X のとき、Cov(X, Y)＝V(X)＝1/2−(1/2)²＝1/4。
  counterexample: X が −1・0・1 を確率 1/3 ずつとり Y＝X² のとき、Y は X で決まるのに Cov(X, Y)＝0（無相関でも独立ではない）。
  misconceptions:
  - misconception: 共分散が0なら関係がない（独立）
    correction: 0なのは直線的な関係がないだけ。Y＝X² のように強い関係があっても0になる
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(1,2)-Fraction(1,2)**2==Fraction(1,4)
  - Fraction(-1,3)+0+Fraction(1,3)==0
- id: TERM-binom
  name: 二項分布
  en: binomial distribution
  definition: 成功確率 p の独立な試行を n 回くり返したときの、成功した回数の分布 B(n, p)。
  version: 1
  figures: [FIG-U14-concept, FIG-LAB-binom-def-tour-1, FIG-LAB-binom-def-tour-2, FIG-LAB-binom-def-tour-3]
  labs:
  - {id: LAB-binom, preset: def-tour, purpose: 1回の試行から、並び1つの確率×並びの数で式を組み立てる}
  - {id: LAB-binom, preset: s1-path, purpose: 並び方の数×1つの並びの確率を、予想してから確かめる}
  principle: 「どの k 回が成功か」の組合せ ₙCₖ と、その1通りの確率 pᵏ(1−p)ⁿ⁻ᵏ の積。成功回数は n 個の「成功1・失敗0」の和なので、期待値と分散が和から求まる。
  formulas:
  - tex: 'P(X=k)={}_nC_k\,p^k(1-p)^{n-k}'
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: k
      meaning: 成功の回数
      range: 0以上 n 以下の整数
      key: k
      kind: value
      domain: {min: 0, max: n, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    - symbol: ₙCₖ
      meaning: n 回から成功の k 回を選ぶ組合せの数
      key: comb
      concept: TERM-comb
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "n"}, {"sym": "k"}], "name": "comb"}, {"op": "pow", "args": [{"sym": "p"}, {"sym": "k"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"sym": "n"}, {"sym": "k"}]}]}]}]}
  - tex: 'E(X)=np'
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "mul", "args": [{"sym": "n"}, {"sym": "p"}]}]}
  - tex: 'V(X)=np(1-p)'
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "mul", "args": [{"sym": "n"}, {"sym": "p"}, {"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}]}]}
  conditions:
    math:
    - 回数 n が決まっている
    - 結果が成功・失敗の2つ
    - 各回の成功確率 p が同じ
    - 各回が独立
    data:
    - 客ごとの購入のように、互いに影響しない（口コミや連れ立ちがない）か、p が客や時間でほぼ同じかを確かめる
  example: 来店客10人がそれぞれ確率 0.3 で買う（互いに独立）なら、買う人数は B(10, 0.3)。期待値は3人、分散は2.1。
  counterexample: 箱から戻さずに取り出すと、各回の確率が変わり独立でもないので二項分布ではない（超幾何分布）。
  misconceptions:
  - misconception: ちょうど期待値 np 回になる確率が高い
    correction: np 回はいちばん起きやすい付近だが、その確率自体は小さいことが多い（n が大きいほど小さい）
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(10*0.3-3)<1e-12 and abs(10*0.3*0.7-2.1)<1e-12
- id: TERM-poisson
  name: ポアソン分布
  en: Poisson distribution
  definition: 一定の時間や範囲で、まれな出来事が平均 λ 回起きるときの、起きた回数の分布。
  version: 1
  figures: [FIG-U15-concept]
  labs:
  - {id: LAB-pois, preset: s1-pois, purpose: 平均件数 λ から、k 件の確率を読む}
  principle: 二項分布で n を大きく、p を小さくし、np＝λ を保ったときに行き着く形。期待値と分散がどちらも λ になる。
  formulas:
  - tex: 'P(X=k)=\dfrac{e^{-\lambda}\lambda^k}{k!}'
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 一定の範囲あたりの平均件数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    - symbol: k
      meaning: 起きた件数
      range: 0以上の整数
      key: k
      kind: value
      domain: {min: 0, integer: true}
    - symbol: e
      meaning: 自然対数の底（約2.718）
      key: e
      kind: const
    - symbol: k!
      meaning: k の階乗
      key: fact
      concept: TERM-fact
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "div", "args": [{"op": "mul", "args": [{"op": "pow", "args": [{"sym": "e"}, {"op": "neg", "args": [{"sym": "lambda"}]}]}, {"op": "pow", "args": [{"sym": "lambda"}, {"sym": "k"}]}]}, {"op": "fn", "args": [{"sym": "k"}], "name": "fact"}]}]}
  - tex: 'E(X)=V(X)=\lambda'
    label: 期待値と分散
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す）
      key: E
      concept: TERM-expect
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 一定の範囲あたりの平均件数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"sym": "lambda"}]}
  conditions:
    math:
    - 出来事が互いに独立に起きる
    - 同時に2つは起きない
    - 起きる平均の割合が一定
    data:
    - 時間帯や曜日で割合が変わらないか、分散が平均とほぼ同じかを確かめる（分散が大きければ当てはまっていない）
  example: 1時間に平均2件の問い合わせがあるとき、ある1時間に1件もない確率は e⁻²≒0.135。
  counterexample: 昼に集中する来店のように時間帯で割合が変わるなら、1日をまとめて1つのポアソン分布にしてはいけない。
  misconceptions:
  - misconception: まれな出来事なら何でもポアソン分布
    correction: 起きる割合が一定で、互いに独立に起きることが要る。連鎖して起きる出来事（クレームが続くなど）は当てはまらない
