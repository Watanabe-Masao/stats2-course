  conditions:
    math:
    - 戻さずに取り出す
    - どの n 個の組も同じ確率で選ばれる
    data:
    - 集団 N が取り出す数 n に比べて十分大きいと、二項分布 B(n, M/N) とほとんど同じになる
  example: 10個中3個が不良の箱から2個取り出して、2個とも不良の確率は C(3,2)÷C(10,2)＝3/45＝1/15。
  counterexample: 戻して取り出すと二項分布 B(2, 0.3) になり、2個とも不良の確率は 0.09。戻さないとき（1/15≒0.067）と違う。
