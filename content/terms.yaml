      key: x
      kind: index
    - symbol: a
      meaning: 区間の左端
      key: a
      kind: value
    - symbol: b
      meaning: 区間の右端
      key: b
      kind: value
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "fn", "args": [{"sym": "a"}, {"sym": "X"}, {"sym": "b"}], "name": "between"}], "name": "P"}, {"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x", "lower": {"sym": "a"}, "upper": {"sym": "b"}}]}
  - id: F-pdf-total
    label: 全体の面積は1
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ）
      key: f
    - symbol: x
      meaning: 積分で動かす値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - text: f(x) が0以上
      kind: 要件
      outside: 確率密度関数として扱えない
    - text: 全体の面積が1
      kind: 要件
      outside: 確率密度関数として扱えない
    data:
    - ヒストグラムを「相対度数÷階級の幅」で描くと、各階級での密度の平均の推定になる（f そのものに近づくには、f が連続な点で、幅→0 と n×幅→∞ を両方満たすように進める。④-30 の範囲外）
  example: 0〜10分に一様に来るバスで、3〜5分の間に来る確率は 2÷10＝0.2。
  counterexample: 0〜0.5 の一様分布の密度の高さは 2 で、1を超える。密度は確率ではないので1を超えてよい。
  misconceptions:
