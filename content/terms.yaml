- id: TERM-indep
  name: 独立
  en: independence
  definition: 一方が起きたかどうかで、もう一方の起こりやすさが変わらないこと。
  principle: P(A∩B)＝P(A)P(B)。確率変数なら同時の確率が積に分かれる。独立なら共分散は0になり、和の分散は分散の和になる。
  formula: P(A\cap B)=P(A)\,P(B)
  conditions:
  - 確率が決まった2つの事象（または確率変数）について言う
  example: さいころを2回投げると、1回目と2回目の目は独立。両方6になる確率は 1/6×1/6＝1/36。
  counterexample: 排反（同時に起きない）は独立ではない。P(A) と P(B) が0でなければ、排反なら P(A∩B)＝0 で P(A)P(B) と等しくない。
  checks:
  - Fraction(1,6)*Fraction(1,6)==Fraction(1,36)
