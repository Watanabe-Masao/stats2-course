- id: TERM-rv
  name: 確率変数
  en: random variable
  definition: 試行の結果に応じて値が決まり、どの値が出るかが確率で表される量。
  version: 1
  principle: 起こりうる値と、その確率の組（確率分布）で性質が決まる。1つの記録された値ではなく、記録する前の「値の出方」を扱う。
  formulas:
  - tex: P(X=x)=p(x),\quad \sum_x p(x)=1
    symbols:
    - symbol: X
      meaning: 確率変数（値の出方を表すもの）
    - symbol: x
      meaning: X がとりうる1つの値
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
  conditions:
    math:
    - 起こりうる値の範囲が決まっている
    - 各値の確率が0以上で、合計が1
    data:
    - 「記録する前の値の出方」として扱えるか（同じ仕組みでくり返し起きるか）を確かめる
  example: さいころの目 X は、1〜6 の値をそれぞれ確率 1/6 でとる。
  counterexample: 「今日の売上 120万円」という1つの記録は確率変数ではなく、実現した1つの値。
  misconceptions:
  - misconception: 確率変数は「でたらめな数」のこと
    correction: 値の出方に決まった確率（分布）がある量。でたらめさの中に規則がある
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - 6*Fraction(1,6)==1
