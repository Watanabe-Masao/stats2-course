- id: TERM-sampdist
  name: 標本分布
  en: sampling distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: 母集団から大きさ n の標本を取ることをくり返すとき、標本から計算する統計量を確率変数とみたときの確率分布
    terms: [TERM-statistic, TERM-dist]
  short: 同じ大きさの標本を何度も取ったときに、統計量がとる値の分布
  definition: 同じ大きさ n の標本を同じ取り方でくり返し取るとき、標本から計算する統計量がとる値の確率分布。
  version: 1
  principle: 手元の標本は1つでも、同じ取り方をしたら出ていた標本は他にもたくさんある。その全部について統計量（標本平均など）を計算して並べたものが標本分布で、1つの推定値がどれだけ当てにできるか（中心が母数とずれていないか・どれだけ散らばるか）は、この分布で決まる。標本分布の標準偏差が標準誤差。
  conditions:
    math:
    - text: 統計量と、標本の取り方（どの標本がどの確率で選ばれるか）が決まっている
      kind: 要件
      outside: 標本分布が1つに決まらない（同じ統計量でも、取り方が変われば分布が変わる）
    data:
    - 実際の調査では標本は1つだけなので、標本分布は見えない。取り方（無作為か・戻すか・n はいくつか）から、理論かくり返しのシミュレーションで考える
    - 選ばれ方の確率が分からない取り方（応募・声をかけやすい人）では、標本分布はあっても求められない
  example: 5店の廃棄数 3・5・7・9・11 個から2店を単純無作為抽出すると、標本平均は10通りの選び方ごとに 4・5・6・6・7・7・8・8・9・10 のどれかで、選び方1つずつが確率 1/10（6・7・8 は2通りずつなので 2/10）。この分布が標本平均の標本分布で、平均は母集団の平均と同じ7。
  counterexample: 同じ5店から2店を選ぶ「標本平均の標本分布」と言っても、戻して選ぶか戻さずに選ぶかを決めないと分布が決まらない。戻さずに選べば x̄ の標準偏差は √3≒1.73、戻して選べば √8÷√2＝2 で、散らばりが違う。
  misconceptions:
  - misconception: 標本分布は、手元の標本のデータのヒストグラム
    correction: 手元のデータの分布は標本の分布。標本分布は、標本をくり返し取ったときの統計量（標本平均など）の分布で、1つの標本からは直接は見えない
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - sorted((a + b) / 2 for a in [3, 5, 7, 9, 11] for b in [3, 5, 7, 9, 11] if a < b) == [4, 5, 6, 6, 7, 7, 8, 8, 9, 10]
  - sum([4, 5, 6, 6, 7, 7, 8, 8, 9, 10]) / 10 == 7
  - math.isclose(sum((v - 7) ** 2 for v in [4, 5, 6, 6, 7, 7, 8, 8, 9, 10]) / 10, 3) and math.isclose(math.sqrt(8) / math.sqrt(2), 2)
- id: TERM-se
  name: 標準誤差
  en: standard error
  category: 標本分布・極限
  forms: [number]
  basis:
    text: 推定量 θ̂ の標本分布の標準偏差 √V(θ̂)（例：独立に同じ分布に従う標本で、標本平均の標準誤差は σ/√n）
    terms: [TERM-estimator, TERM-sampdist, TERM-sd]
  short: 推定量の標本分布の標準偏差で、推定値がくり返しでどれだけばらつくかの大きさ
  definition: 推定量（標本平均など）の標本分布の標準偏差。推定値を取り直したら、どれくらいばらつくかの大きさ。独立に同じ分布から取るとき、標本平均なら σ÷√n。
  version: 1
  formulas:
  - id: F-se-mean
    label: 標本平均の標準誤差
    symbols:
    - symbol: SE( )
      meaning: 標準誤差（推定量の標本分布の標準偏差）
      key: SE
      concept: TERM-se
    - symbol: X̄
      meaning: 標本平均
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: σ
      meaning: 母標準偏差（1個の値 Xᵢ のばらつき）
      key: sigma
      concept: TERM-sd
      kind: param
      domain:
        min: 0
    - symbol: n
      meaning: 平均をとる個数（標本の大きさ）
      key: n
      kind: value
      domain:
        min: 1
        integer: true
    tree:
      op: eq
      args:
      - op: fn
        name: SE
        args:
        - sym: Xbar
      - op: div
        args:
        - sym: sigma
        - op: sqrt
          args:
          - sym: n
    parts:
    - path:
      - 1
      - 0
      name: 1個のばらつき
      meaning: 母標準偏差 σ。n を増やしても変わらない
    - path:
      - 1
      - 1
      name: √n
      meaning: 精度は √n で効く。標準誤差を半分にするには n を4倍にする
  principle: 標準偏差は1個1個の値のばらつき、標準誤差は推定値（平均や比率）のばらつき。推定量に偏りがなければ、手元の推定値と母数のずれは、たいてい標準誤差の数倍の中に収まるので、標準誤差は「1つの推定値をどれだけ当てにできるか」の物差しになる（偏りがあれば、ずれにその分が加わり、標準誤差には入らない）。標本平均の標準誤差は √V(X̄)＝σ÷√n で、σ が分からないときは不偏分散の平方根 s で置き換えた s÷√n（推定した標準誤差。これも標準誤差と呼ぶ）を使う。
  conditions:
    math:
    - text: 推定量の分散が有限
      kind: 要件
      outside: 標準誤差が定まらない
    - text: X₁, …, Xₙ は独立に同じ分布に従い、分散 σ² が有限
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（σ÷√n は標本平均の標準誤差とは限らない。値どうしに正の相関があると、本当の標準誤差はこれより大きい）
    data:
    - 「標準誤差」と書いた数が、σ（分かっている）で計算したか、標本の標準偏差で置き換えたかを確かめる。グラフのひげが標準偏差か標準誤差かを確かめる
  example: 購入額の標準偏差が 2000 円の客から独立に 16 人を選ぶと、平均購入額の標準誤差は 2000÷√16＝500 円。64 人なら 250 円で半分。
  counterexample: 多くの日を通した店の客単価（母平均）を、ある1日の客 400 人の平均で推し量る。同じ日の来店客は天気やセールで購入額がそろって動くので、400 人は独立でない。1200÷√400＝60 円を標準誤差にすると、日ごとの共通の動きの分が入らず、本当の標準誤差より小さく見積もる。
  misconceptions:
  - misconception: 標準誤差は、データ1個1個の誤差（測り間違い）の大きさ
    correction: 標準誤差は、平均や比率などの推定値が、標本を取り直したらどれだけ変わるかの大きさ。測り間違いがなくても、選び方の偶然で生じる
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - 2000 / math.sqrt(16) == 500 and 2000 / math.sqrt(64) == 250 and 1200 / math.sqrt(400) == 60
- id: TERM-lln
  name: 大数の法則
  en: law of large numbers
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-20b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が有限のとき、どの ε＞0 でも n→∞ で P(|X̄−μ|≧ε)→0（標本平均 X̄ は μ に確率収束する。④-20b）
    terms: [TERM-sample-mean]
  short: 標本の大きさを大きくすると、標本平均が母平均に近づくという法則
  definition: 同じ分布から独立に取った値の平均（標本平均）は、取る数を大きくすると、母平均の近くに入る確率が1に近づく、という定理。
  version: 1   # 2026-11-15 に説明を書いた（期待値の実験室 B-01 の主。#119）。①③④ の監査役の独立なレビューで直した
  principle: X₁, …, Xₙ が独立に同じ分布（平均 μ・分散 σ²）に従うとき、標本平均 X̄ の期待値は μ、分散は σ²/n。n を大きくすると X̄ の散らばりが小さくなり、どんな幅 ε を決めても、X̄ が μ から ε 以上離れる確率は 0 に近づく（チェビシェフの不等式で P(|X̄−μ|≧ε)≦σ²/(nε²)）。「必ずぴったり近づく」ではなく「離れる確率が小さくなる」という主張。
  conditions:
    math:   # 主張 CLM-20b（④-20b）の成立条件の写し。区分・文・外れたときは主張の側が正本（食い違わせない）
      - text: X₁, …, Xₙ が独立に同じ分布に従う
        kind: 仮定
        claim: 標本平均 X̄ が μ に確率収束する
        terms: [TERM-indep]
        outside: 標本平均が μ に近づくとは保証できない
      - text: 分散 σ² が有限
        kind: 仮定
        claim: 標本平均 X̄ が μ に確率収束する
        terms: [TERM-var]
        outside: この根拠（チェビシェフの不等式）による保証は使えない（平均が有限なら成り立つことが知られている：ヒンチンの大数の法則。教材の範囲外・未照合）
    data:
      - データで使うときは、取り方が独立で同じ（同じ条件の繰り返し・無作為抽出）と言えるかを確かめる
      - 分散がとても大きい（まれでも極端な値がある）と、平均が母平均の近くに入るのに要る数がとても大きくなる。ずれの目安 ±2σ/√n（中心極限定理による目安）で、要る数の大きさを見積もる
  example: さいころを n 回投げた目の平均は、n を大きくすると 3.5 の近くに入る確率が1に近づく。1 回の目の分散は 35/12 なので、n＝1000 なら平均のずれの目安（±2×標準誤差。中心極限定理による目安）は約 ±0.11。
  counterexample: 表が出るまでコインを投げ、k 回目に初めて表が出たら（確率 1/2ᵏ）2ᵏ 円もらうくじ（倍々のくじ。打ち切りなし）は、値×確率の項が 2ᵏ×(1/2)ᵏ＝1 でどれも 1 なので、期待値（項の和）が有限にならない。平均が有限という前提が満たされないので、この法則は使えない。引く回数を増やしても、平均は大きくなり続け、一つの値に落ち着かない（④ の範囲外・未照合）。
  misconceptions:
    - misconception: はずれが続いたら、平均を戻すために次は当たりやすくなる
      correction: 独立なら、次の1回の確率は前の結果で変わらない。平均が母平均に近づくのは、あとに続く多くの回が前のずれを薄めるからで、前のずれを打ち消す回が来るからではない
  sources:
    - source: 公式2級範囲表
      locator: 標本分布（大数の法則・中心極限定理）
  checks:
    - round(2*(35/12/1000)**0.5, 2) == 0.11
    - all(2**k*Fraction(1,2**k)==1 for k in range(1,30))
- id: TERM-clt
  name: 中心極限定理
  en: central limit theorem
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-6b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が 0＜σ²＜∞ のとき、n→∞ で √n(X̄−μ)/σ の分布は N(0, 1) に近づく（④-6b）
    terms: [TERM-sample-mean, TERM-std-normal]
  short: 独立に同じ分布から取った標本平均の分布は、n が大きいと正規分布に近づくという定理
  definition: 独立に同じ分布から取った値の標本平均は、分散が有限で0より大きければ、n を大きくすると、元の分布の形によらず、その分布を正規分布 N(μ, σ²/n) で近似できるようになる、という定理。
  version: 1
  principle: 標本平均のずれ X̄−μ そのものは0に縮む（大数の法則）。縮む幅 σ÷√n で割って見直した √n(X̄−μ)/σ の分布が、元の分布によらず標準正規分布に近づく、というのが中心極限定理。だから n が十分大きければ、X̄ を N(μ, σ²/n) とみなして確率を見積もる近似として使う（どれだけ大きければよいかを、定理は言わない）。近づく速さは主に元の分布の歪みで左右され（歪度が有限なら、X̄ の歪度は母集団の歪度÷√n）、歪んだ分布ほど大きな n が要る。
  conditions:
    math:
    - text: X₁, …, Xₙ が独立に同じ分布に従う
      kind: 仮定
      claim: CLM-6b
      terms: [TERM-indep]
      outside: ④-6b は保証されない（標準化した標本平均が標準正規分布に近づくとは限らない。同じ日・同じ時間帯の値がそろって動くと、X̄ の散らばりは σ÷√n より大きく、N(μ, σ²/n) では幅を狭く見積もる。有限の母集団から戻さずに取ると、散らばりは小さい）
    - text: 分散 σ² が 0＜σ²＜∞
      kind: 仮定
      claim: CLM-6b
      terms: [TERM-var]
      outside: ④-6b は保証されない（裾の重い分布では、n を増やしても正規分布に近づかない例がある）
    data:
    - 有限の n で X̄ を正規分布で近似してよいかは、主に元の分布の歪みで左右される（X̄ の歪度は母集団の歪度÷√n）。右に長い裾の分布で n が小さいと、X̄ の分布も右に歪み、正規分布では右側の確率を小さく、左側の確率を大きく見積もる
    - 元のデータのヒストグラムで、歪み・外れ値の大きさを見る。0か1の値なら、np と n(1−p) がどちらも十分大きいかを確かめる
    - 値を独立に取ったか（同じ日・同じ人の値がまとまっていないか）を確かめる
  example: 待ち時間（平均 5分・標準偏差 5分の指数分布。右に長い裾）でも、20人分の平均の分布は正規分布 N(5, 1.12²) とかなり重なる。歪度は 1人分の 2 から 2÷√20≒0.45 まで小さくなる。ただ裾ではまだずれ、7分を超える確率は正確には約 0.048、正規分布では約 0.037（右側を小さく見積もる）。
  counterexample: 同じ時刻に並んだ n 人の待ち時間を平均する。混んだ時刻なら全員長く、空いた時刻なら全員短いので、値どうしがそろって動き、独立でない。n を増やしても X̄ は「その時刻の混み具合」で決まる値に近づくだけで、X̄ の分布は混み具合の分布の形を残し、正規分布に近づくとは限らない。
  misconceptions:
  - misconception: n を大きくすると、データ1個1個の分布が正規分布に近づく
    correction: 正規分布に近づくのは、平均 X̄ の分布。待ち時間1人分の分布は、何人調べても右に長い裾のまま
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（大数の法則・中心極限定理）
  checks:
  - abs(5/math.sqrt(20) - 1.12) < 0.005 and abs(2/math.sqrt(20) - 0.45) < 0.005
- id: TERM-cc
  name: 連続修正
  en: continuity correction
  category: 標本分布・極限
  forms: [operation]
  basis:
    text: 整数値をとる確率変数 X の確率を、確率密度で表される分布に従う Y の確率で近似するとき、P(X≦k) を P(Y≦k＋0.5)、P(X≧k) を P(Y≧k−0.5) で近似する（境目を 0.5 ずらす）操作
    terms: [TERM-pdf]
  short: 離散分布を連続分布で近似するとき、区間の端を0.5ずらして近似をよくする工夫
  definition: 整数の値をとる確率変数の確率を、正規分布のような連続の分布で近似するとき、区間の端を 0.5 ずらす操作。P(X≦k) は k＋0.5 まで、P(X≧k) は k−0.5 から面積をとる。
  version: 1
  principle: 整数 k の確率は、連続の分布では k−0.5 から k＋0.5 までの幅1の面積に当たる（棒の幅を1とみる）。「k 以下」は k の棒の右端 k＋0.5 まで、「k 以上」は k の棒の左端 k−0.5 から面積をとると、端の棒を半分だけ落とすことがない。
  conditions:
    math:
    - text: 近似する確率変数 X は整数の値だけをとる（値の間隔が1）
      kind: 要件
      outside: 0.5 ずらす根拠がない（ずらす幅は値の間隔の半分）
    data:
    - 「以下・未満・以上・より大きい」を整数の範囲に直してから、ずらす向きを決める（X＜55 は X≦54 なので 54.5 まで）
  example: 当選率 0.5 で 100人が応募するとき、当選者 X が 58人以上の確率を正規分布で近似する。平均 50・標準偏差 5 で、57.5 からとると z＝1.5、1−Φ(1.5)≒0.0668。正確な二項分布の値 0.0666 とほとんど同じ。ずらさない z＝1.6 だと 0.0548 と小さく出る。
  counterexample: 0.5 点刻みの点数（0, 0.5, 1, …）の「3点以下」を近似するとき 0.5 ずらして 3.5 までとると、3.5 点の棒（3.25〜3.75）の半分を含んでしまう。値の間隔が1でないので、0.5 ずらす根拠がない（ずらすなら値の間隔の半分）。
  misconceptions:
  - misconception: 連続修正は、いつも 0.5 を足す
    correction: 向きは確率の向きで決まる。「k 以下」は k＋0.5、「k 以上」は k−0.5。「k 未満」は「k−1 以下」なので k−0.5
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（大数の法則・中心極限定理）
  checks:
  - (57.5-50)/5 == 1.5 and abs(1-0.5*(1+math.erf(1.5/math.sqrt(2))) - 0.0668) < 0.00005 and abs(sum(comb(100,k) for k in range(58,101))/2**100 - 0.0666) < 0.00005 and abs(1-0.5*(1+math.erf(1.6/math.sqrt(2))) - 0.0548) < 0.00005
- id: TERM-t
  name: t 分布
  en: t distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z が N(0, 1) に従い、V が χ²(k) に従い、Z と V が独立なとき、T＝Z/√(V/k) の分布を自由度 k の t 分布 t(k) とする（k は1以上の整数）
    terms: [TERM-chi2]
  short: 母分散を不偏分散で置き換えて標準化した標本平均が従う分布で、自由度が大きいと標準正規分布に近づく
  definition: 標準正規分布に従う Z と、それと独立に χ²(k) に従う V から作る T＝Z÷√(V÷k) が従う分布 t(k)。正規母集団で σ を不偏分散の平方根 s で置き換えて標準化した標本平均 (X̄−μ)÷(s÷√n) は t(n−1) に従う。
  version: 1
  principle: σ を s で置き換えると、分母も標本ごとにばらつくので、標準化した値は正規分布より外まで出やすい（裾が厚い）。だから同じ両側5%でも、t の点は 1.96 より外になる（t(4) で 2.776）。自由度が大きいと s がほぼ σ になり、t 分布は標準正規分布に近づく。
  conditions:
    math:
    - text: Z と V は独立
      kind: 要件
      outside: Z÷√(V÷k) は t(k) に従うとは限らない
    - text: k は1以上の整数
      kind: 要件
      outside: この作り方では t(k) を作れない（密度の式は正の実数の k でも使え、ウェルチの検定は整数でない自由度を使う）
    - text: 正規母集団からの無作為標本（n≧2・σ＞0）
      kind: 仮定
      claim: CLM-28a
      outside: ④-28a は保証されない（(X̄−μ)÷(s÷√n) は t(n−1) に従うとは限らない。n が大きければ中心極限定理で近くなるが、n が小さく歪んだ母集団ではずれる。似た値が続く〔正の相関〕と、s÷√n が X̄ のばらつきを小さく見積もり、|t| が大きく出やすい）
    data:
    - n が小さいときは、データに外れ値や強い歪みがないかを確かめる。n が小さいとき、t の点が当てになるのは、母集団が正規分布に近いとき
  example: 両側5%の点は、t(4) で 2.776、t(15) で 2.131、t(120) で 1.980。自由度が大きいほど標準正規の 1.96 に近づく。
  counterexample: V を Z から作る（k＝1 で V＝Z²）と、Z と V は独立でない。T＝Z÷|Z| は +1 か −1 しかとらず、t(1) に従わない。
  misconceptions:
  - misconception: データが少ないときは t、多いときは z を使う
    correction: t と z を分けるのは、σ が分かっているか（s で置き換えたか）。正規母集団で σ を s で置き換えた統計量は、n の大小によらず t 分布に従う。n が大きいときに z の点を使うのは近似
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - abs(sum((math.gamma(2.5)/(math.sqrt(4*math.pi)*math.gamma(2)))*(1+((i+.5)*2.776/20000)**2/4)**(-2.5) for i in range(20000))*2.776/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(8.0)/(math.sqrt(15*math.pi)*math.gamma(7.5))*(1+((i+.5)*2.131/20000)**2/15)**(-8.0) for i in range(20000))*2.131/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(60.5)/(math.sqrt(120*math.pi)*math.gamma(60.0))*(1+((i+.5)*1.98/20000)**2/120)**(-60.5) for i in range(20000))*1.98/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(3.0)/(math.sqrt(5*math.pi)*math.gamma(2.5))*(1+((i+.5)*2.571/20000)**2/5)**(-3.0) for i in range(20000))*2.571/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(5.0)/(math.sqrt(9*math.pi)*math.gamma(4.5))*(1+((i+.5)*2.262/20000)**2/9)**(-5.0) for i in range(20000))*2.262/20000 - 0.475) < 0.0005
- id: TERM-chi2
  name: カイ二乗分布
  en: chi-squared distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z₁, …, Z_k が独立に N(0, 1) に従うとき、Z₁²＋…＋Z_k² の分布を自由度 k のカイ二乗分布 χ²(k) とする（k は1以上の整数。独立は定義の要件）
    terms: [TERM-std-normal, TERM-df]
  short: 独立な標準正規分布の確率変数を2乗して足した値が従う分布
  definition: 独立に標準正規分布に従う k 個の確率変数を2乗して足した値が従う分布 χ²(k)。k を自由度と呼ぶ。正規母集団の不偏分散 s² を使った (n−1)s²÷σ² が χ²(n−1) に従うので、分散の推測に使う。
  version: 1
  principle: 2乗の和なので値は0以上で、右に長い裾をもつ。1つの Z² の期待値は1・分散は2なので、χ²(k) の期待値は k、分散は 2k。自由度が大きいと、和なので中心極限定理で正規分布に近づく。
  conditions:
    math:
    - text: Z₁, …, Z_k は独立で、どれも標準正規分布に従う
      kind: 要件
      outside: 2乗の和は χ²(k) に従うとは限らない（独立でない、またはどれかが N(0, 1) でない〔例：N(0, 4)〕と、裾の確率が変わる）
    - text: k は1以上の整数
      kind: 要件
      outside: この作り方（k 個の Z² の和）では χ²(k) を作れない
    - text: 正規母集団からの独立な標本（n≧2・σ＞0）
      kind: 仮定
      claim: CLM-10
      outside: ④-10 は保証されない（(n−1)s²÷σ² は χ²(n−1) に従うとは限らない。裾の重い母集団では、分散の推測が大きくずれる。似た値が続く〔正の相関〕と、s² は σ² を小さく見積もりやすい）
    data:
    - 分散の推測に使うときは、母集団が正規分布に近いか（外れ値・裾の重さ）を確かめる。平均の推測より、正規分布からのずれに弱い
  example: χ²(4) の期待値は 4、分散は 8。上側5%の点は約 9.49 で、4つの Z² の和が 9.49 を超えるのは 5%。
  counterexample: Z₂ を Z₁ と同じ値にする（Z₂＝Z₁）と、Z₁²＋Z₂²＝2Z₁² で、独立でない。2Z₁² が χ²(2) の上側5%の点 5.99 を超える確率は約 0.083 で、5% にならない。
  misconceptions:
  - misconception: カイ二乗分布の下側の点は、平均をはさんで上側の点と同じだけ離れている
    correction: 右に長い裾があり、左右対称ではない。χ²(9) の下側2.5%点は 2.700、上側2.5%点は 19.023 で、平均9からの距離は 6.3 と約10。下側と上側の点は別々に引く
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - abs(sum(0.25*((i+.5)*(9.49/20000))*math.exp(-((i+.5)*9.49/20000)/2) for i in range(20000))*9.49/20000 - 0.95) < 0.0005
  - abs(2*(1-0.5*(1+math.erf(math.sqrt(5.991/2)/math.sqrt(2)))) - 0.083) < 0.0005
  - abs(sum(((i+.5)*2.7/20000)**3.5*math.exp(-((i+.5)*2.7/20000)/2)/(2**4.5*math.gamma(4.5)) for i in range(20000))*2.7/20000 - 0.025) < 0.0005 and abs(19.023 - 9 - 10) < 0.05 and abs(9 - 2.7 - 6.3) < 1e-9
- id: TERM-f
  name: F 分布
  en: F distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: U が χ²(m)、V が χ²(n) に従い、U と V が独立なとき、(U/m)/(V/n) の分布を自由度 (m, n) の F 分布 F(m, n) とする（m・n は1以上の整数）
    terms: [TERM-chi2]
  short: 独立な2つのカイ二乗分布の確率変数を、それぞれ自由度で割った比が従う分布
  definition: 独立な χ²(m)・χ²(n) の確率変数を、それぞれ自由度で割った比が従う分布 F(m, n)。2つの正規母集団の分散が等しく、2つの標本が独立なら、2つの不偏分散の比 s₁²÷s₂² は F(n₁−1, n₂−1) に従うので、分散の比べに使う。
  version: 1
  principle: 比なので値は0以上で、右に長い裾をもつ。分子と分母を入れ替えると F(n, m) に従うので、F(m, n) の下側の点は F(n, m) の上側の点の逆数になる。t(k) に従う量の2乗は F(1, k) に従う（④-9）。
  conditions:
    math:
    - text: 分子と分母のカイ二乗の確率変数は独立
      kind: 要件
      outside: 比は F(m, n) に従うとは限らない
    - text: m・n は1以上の整数
      kind: 要件
      outside: この作り方では F(m, n) を作れない
    - text: 2つの標本は互いに独立で、それぞれ正規母集団からの無作為標本、母分散が等しい
      kind: 仮定
      claim: CLM-42
      outside: ④-42 は保証されない（裾の重い母集団では F の点が当てにならない。同じ店の前後のような対のデータで独立でないと、比の分布が変わる）
    data:
    - 分散の比を比べるときは、2つの母集団が正規分布に近いかを確かめる。外れ値が1つあると不偏分散が大きく動き、比も大きく動く
  example: 2店の売上の不偏分散が s₁²＝4（11日）、s₂²＝2（11日）なら F＝2。s₁² のほうが大きいかを片側で調べるなら、F(10, 10) の上側5%の点は約 2.98 なので、この比は基準の内側。
  counterexample: 分子と分母に同じカイ二乗の確率変数を使う（U＝V、m＝n）と、独立でなく、比はいつも1になる。F(m, m) に従わない。
  misconceptions:
  - misconception: F(m, n) と F(n, m) は同じ分布
    correction: 自由度の順番は分子・分母の順で、入れ替えると別の分布。F(m, n) の点の逆数が F(n, m) の反対側の点になる
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - 4/2 == 2 and abs(sum(math.gamma(10)/math.gamma(5)**2*((i+.5)*2.98/20000)**4/(1+(i+.5)*2.98/20000)**10 for i in range(20000))*2.98/20000 - 0.95) < 0.0005
- id: TERM-df
  name: 自由度
  en: degrees of freedom
  category: 標本分布・極限
  forms: [number]
  basis:
    text: n 個の値に k 個の互いに独立な1次の制約（例：偏差の和が0）があるとき、自由に動ける値の個数 n−k。t・カイ二乗・F 分布では、族を区別する正の整数の母数を同じ名前で呼ぶ
    terms: []
  short: 統計量を計算するときに自由に動ける値の個数で、t・カイ二乗・F 分布の形を決める
  definition: 統計量を計算するときに、自由に動ける値の個数。n 個の偏差は和が0になるので、自由に動けるのは n−1 個。t・カイ二乗・F 分布では、分布の形を決める母数も同じ名前で呼ぶ。
  version: 1
  principle: 標本平均 x̄ を計算に使うと「偏差の和が0」という制約が1つ入り、n−1 個の偏差が決まれば残りの1個は決まる。制約が増えるほど自由度は減る。自由度が小さいほど、s のばらつきが大きく、t 分布の裾は厚い。
  conditions:
    math:
    - text: 数える制約は1次の制約で、互いに独立（ほかの制約から導けない）
      kind: 要件
      outside: 自由度は n−（制約の数）にならない（同じ制約を2回数えると、自由度を小さく見積もる）
    data:
    - 何を推定に使ったかを書き出して数える（1群の平均は n−1、2群の平均は n₁＋n₂−2、回帰の直線は n−2）
  example: 5店の値 3・5・7・9・11（平均7）の偏差は −4・−2・0・2・4 で、和は0。4つの偏差が決まれば最後の1つは決まるので、自由度は4。
  counterexample: 平均 x̄ と合計 Σx の両方を計算に使ったので制約は2つ、と数えて5個の値の自由度を3とするのは誤り。合計は n×平均で、平均から導けるので、制約は1つで、自由度は4。
  misconceptions:
  - misconception: 自由度はいつも n−1
    correction: 推定に使った量の数で決まる。2群の平均を使えば n₁＋n₂−2、回帰の直線（切片と傾き）を使えば n−2
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - '[x-7 for x in [3,5,7,9,11]] == [-4,-2,0,2,4] and sum(x-7 for x in [3,5,7,9,11]) == 0'
- id: TERM-estimator
  name: 推定量
  en: estimator
  category: 推定
  forms: [rv]
  basis:
    text: 母数 θ を推定する目的で使う統計量 θ̂（標本 X₁, …, Xₙ の関数で、分からない母数を含まないもの。観測したあとの値は推定値と呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 母数を推定するために使う統計量（標本から値が決まる式）
  definition: 母数（母平均など）を推し量るために使う統計量 θ̂。標本の値だけから計算し、取り直すたびに値が変わりうる。観測したあとの1つの値を推定値と呼ぶ。
  version: 1
  principle: 同じ母数にも、推定量はいくつも作れる（標本平均・中央値・最初の1個）。どれがよいかは、1回の推定値が当たったかではなく、取り直したときの推定量の分布（偏り・ばらつき・平均二乗誤差）で比べる。
  conditions:
    math:
    - text: 値が標本の値と分かっている定数だけで決まる（分からない母数を含まない）
      kind: 要件
      outside: 推定量ではない（手元の標本から計算できない）
    data:
    - 推定値を報告するときは、どの推定量（式）で出したかを書く（平均か中央値か、n で割ったか n−1 で割ったか）
  example: 母平均 μ を推し量るのに、5個の値 48・52・47・55・50 から、標本平均 50.4・中央値 50・最初の1個 48 のどれも推定値として出せる。式が違えば推定量が違う。
  counterexample: 標本平均と母平均の中間 (X̄＋μ)÷2 は、μ を含むので手元の標本から計算できず、μ の推定量ではない。
  misconceptions:
  - misconception: 推定量と推定値は同じもの
    correction: 推定量は計算の式（取り直すと値が変わる確率変数）、推定値はその式に1回分の標本を入れて得た1つの値
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - sum([48,52,47,55,50])/5 == 50.4 and sorted([48,52,47,55,50])[2] == 50
- id: TERM-point-est
  name: 点推定
  en: point estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 標本の値を推定量 θ̂ に入れて得た1つの値（推定値）を、母数 θ の値の推定とする手続き
    terms: [TERM-estimator]
  short: 母数の値を、推定量から求めた1つの値で推定すること
  definition: 母数を1つの値（推定値）で推し量る手続き。決めておいた推定量に、標本の値を入れて得る。
  version: 1
  principle: 1つの値で言うので分かりやすいが、その値がどれだけ外れうるかは、推定値だけからは分からない。だから点推定には標準誤差を添えるか、区間推定で幅を示す。
  conditions:
    math:
    - text: 使う推定量（どの式で計算するか。データを見て選ぶ規則も含めて）が、標本を見る前に決まっている
      kind: 要件
      outside: 標本ごとに式が変わり、推定量として定まらない（点推定の手続きにならない）
    data:
    - 推定値と一緒に、標本の大きさと標準誤差を書く
  example: 25日の売上の平均 12万円を、1日の売上の母平均の点推定値とする。データの標準偏差 5万円から標準誤差 5÷√25＝1万円を添える。
  counterexample: 外れ値を除くか除かないかを、データを見て都合のよいほうに決めると、使った推定量が標本ごとに変わる。推定量が決まっていないので、推定値がどれだけ偏り、どれだけばらつくかを言えない。
  misconceptions:
  - misconception: 点推定値は、母数そのもの
    correction: 点推定値は、取り直すと変わる値の1つ。母数とはふつうずれていて、そのずれの大きさの目安が標準誤差
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 5/math.sqrt(25) == 1
- id: TERM-consistency
  name: 一致性
  en: consistency
  category: 推定
  forms: [property]
  basis:
    text: 標本の大きさ n ごとの母数 θ の推定量 θ̂ₙ が、モデルのすべての母数の値で（θ 以外の母数を含む）、どの ε＞0 についても n→∞ で P(|θ̂ₙ−θ|≧ε)→0 となること（θ̂ₙ は θ に確率収束する）
    terms: [TERM-estimator, TERM-prob]
  short: 標本の大きさを大きくすると、推定量が母数に近づいていく性質
  definition: 標本の大きさ n を大きくすると、推定量が母数のどれだけ近くにも入る確率が1に近づくこと。母数のどの値でも成り立つことを言う。
  version: 1
  principle: 一致は n を増やしたときの性質で、決まった n での偏りは問わない。偏りと分散がともに n とともに0に近づく推定量は一致する（平均二乗誤差が0に近づき、チェビシェフの不等式から）。正規母集団なら、n で割る標本分散 v は偏り −σ²÷n をもつが、偏りも分散も0に近づくので一致する。偏りが0に近づくだけでは一致とは限らない（ばらつきも縮むことが要る）。
  conditions:
    math:
    - text: 母数のどの値でも、どの ε＞0 についても n→∞ で P(|θ̂ₙ−θ|≧ε)→0
      kind: 要件
      outside: 一致とは言えない
    data:
    - 一致は n を限りなく大きくしたときの話で、手元の n で当てになるかは別に、偏りと標準誤差で確かめる
    - 取り方の偏りは、n を増やしても消えない。偏った取り方の推定量は一致しない
  example: 独立に同じ分布から取り、分散が有限なら、標本平均は母平均に一致する（④-20b）。σ＝10 で n を 5 から 50 にすると、標準誤差は 4.47 から 1.41 に縮む。
  counterexample: n 個取っても最初の1個 X₁ だけを使う推定量は、n をいくら増やしても標準誤差が σ のままで、母数の近くに入る確率は1に近づかない。一致しない（不偏ではある）。
  misconceptions:
  - misconception: 一致推定量なら、手元の n で偏りがない
    correction: 一致は n を増やしたときの性質。n で割る標本分散 v は一致するが、n＝5 では平均して σ² の 4/5 に小さく出る
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - abs(10/math.sqrt(5) - 4.47) < 0.005 and abs(10/math.sqrt(50) - 1.41) < 0.005 and (5-1)/5 == 0.8
- id: TERM-efficiency
  name: 有効性
  en: efficiency
  category: 推定
  forms: [property]
  basis:
    text: 同じ母数 θ の2つの不偏推定量 θ̂₁・θ̂₂ について、モデルのすべての母数の値で（θ 以外の母数を含む） V(θ̂₁)≦V(θ̂₂) のとき、θ̂₁ は θ̂₂ より有効という（分散の小さい不偏推定量ほどよいとする比べ方）
    terms: [TERM-unbiased, TERM-var]
  short: 不偏な推定量のうち、分散が小さい（ばらつきが小さい）ものほどよいとする性質
  definition: 同じ母数の2つの不偏推定量のうち、分散の小さいほうを「より有効」とする比べ方。
  version: 1
  principle: 不偏な推定量どうしなら、ばらつきの小さいほうが1回の推定値を当てにできる。正規母集団の母平均では、標本平均は中央値より有効で、n が大きいとき中央値の分散は標本平均の約 π/2≒1.57倍。
  conditions:
    math:
    - text: 比べる2つは、同じ母数の不偏推定量
      kind: 要件
      outside: 分散だけでは比べられない（偏りがあれば平均二乗誤差で比べる）
    - text: 母数のどの値でも分散の大小が同じ向き
      kind: 要件
      outside: どちらが有効とは言えない（母数の値によって入れ替わる）
    data:
    - 外れ値が混ざる裾の重いデータでは、中央値のほうが分散が小さいこともある。正規分布を前提にした「標本平均が有効」をそのまま当てはめない
  example: 正規母集団（σ＝10）から25個取ると、標本平均の標準誤差は 2、中央値の標準誤差はおよそ 2×√(π/2)≒2.51。標本平均のほうが有効。
  counterexample: 標本平均に 2 を足した X̄＋2 は、分散が標本平均と同じだが、偏りが 2 で不偏ではないので、有効の比べには入らない（分散が同じでも、偏りがあれば同じだけ良いとは言えない）。
  misconceptions:
  - misconception: 分散が小さい推定量ほど良い
    correction: 不偏な推定量どうしの比べでだけ、そう言える。偏りがあるものも含めて比べるなら、偏りの2乗も足した平均二乗誤差で比べる
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 10/math.sqrt(25) == 2 and abs(2*math.sqrt(math.pi/2) - 2.51) < 0.005 and abs(math.pi/2 - 1.57) < 0.005
- id: TERM-mse
  name: 平均二乗誤差（MSE）
  en: mean squared error
  category: 推定
  forms: [number]
  basis:
    text: 母数 θ の推定量 θ̂ について、E[(θ̂−θ)²]（推定量と母数のずれの2乗の期待値。母数の値ごとに決まる）
    terms: [TERM-estimator, TERM-expect]
  short: 推定量と母数のずれの2乗の期待値で、推定量の分散と偏りの2乗の和になる
  definition: 推定量と母数のずれの2乗の期待値 E[(θ̂−θ)²]。分散と偏りの2乗の和になり、偏りとばらつきを1つの物差しで比べられる。
  version: 1
  principle: 平均二乗誤差は 0 以上の値で、推定量の分散が無限なら無限大にもなる。偏りが少しあっても、分散がずっと小さければ平均二乗誤差は小さくなる。正規母集団の分散の推定で n＝5 なら、n で割る v は偏り −σ²÷5 をもつが、平均二乗誤差は不偏な s² より小さい。どちらを使うかは、偏りを許すかどうかの考え方で決まる。
  formulas:
  - id: F-mse-decomp
    label: 平均二乗誤差の分け方
    symbols:
    - symbol: MSE( )
      meaning: 平均二乗誤差（ずれの2乗の期待値）
      key: MSE
      concept: TERM-mse
    - symbol: θ̂
      meaning: 推定量
      key: thetahat
      concept: TERM-estimator
      kind: rv
    - symbol: V( )
      meaning: 分散（推定量のばらつき）
      key: V
      concept: TERM-var
    - symbol: b
      meaning: 推定量の偏り E(θ̂)−θ
      key: b
      concept: TERM-bias
      kind: value
    tree:
      op: eq
      args:
      - op: fn
        name: MSE
        args:
        - sym: thetahat
      - op: add
        args:
        - op: fn
          name: V
          args:
          - sym: thetahat
        - op: pow
          args:
          - sym: b
          - num: 2
    parts:
    - path:
      - 1
      - 0
      name: ばらつき
      meaning: 推定量が自分の平均のまわりでどれだけ散らばるか
    - path:
      - 1
      - 1
      name: 偏りの2乗
      meaning: 推定量の平均が母数からどれだけずれているか
  conditions:
    math:
    - text: 推定量の分散が有限
      kind: 仮定
      claim: CLM-43
      outside: ④-43 は保証されない（分散と偏りの2乗に分けられない）
    data:
    - 平均二乗誤差は母数の値ごとに決まる。2つの推定量は同じ母数の値で比べる（母数の値によって大小が入れ替わることがある）
    - 平均二乗誤差は母数の2乗の単位（分散の推定なら σ⁴ の単位）。母数の値が違う場面どうしの数を並べて比べない
  example: 正規母集団の分散 σ²＝4 を n＝5 で推し量ると、s² の平均二乗誤差は 2×16÷4＝8。v は分散 2×4×16÷25＝5.12 に偏り −0.8 の2乗 0.64 を足して 5.76 で、s² より小さい。
  counterexample: 「v の平均二乗誤差は 5.76」とだけ書いて、σ² の値を書かない。平均二乗誤差は σ⁴ に比例して母数の値ごとに違う（σ²＝1 なら 0.36）ので、母数の値なしの1つの数は、別の場面の推定量の平均二乗誤差と並べて比べられない（同じ σ² のもとでなら比べられる）。
  misconceptions:
  - misconception: 平均二乗誤差が小さい推定量は、偏りもばらつきも小さい
    correction: 平均二乗誤差は2つの和なので、偏りが大きくてもばらつきが小さければ小さくなりうる。偏りを許してよいかは、平均二乗誤差とは別に決める
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 2*16/4 == 8 and math.isclose(2*4*16/25, 5.12) and math.isclose(5.12 + 0.8**2, 5.76) and math.isclose(5.76/16, 0.36)
- id: TERM-ci
  name: 信頼区間
  en: confidence interval
  category: 推定
  forms: [random_set]
  basis:
    text: 母数 θ を区間で推定するために、標本から作る2つの統計量 L≦U でつくる区間 [L, U]（観測したあとの区間も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 標本から作る、母数を推定するための区間で、作り方ごとに母数を含む確率の下限（信頼係数）が決まる
  definition: 標本から計算で決まる2つの値 L≦U で作る区間 [L, U] で、分からない母数を含むように作ったもの。標本を取り直すと、区間の方が動く。
  version: 1
  principle: 区間の両端は標本から計算する統計量なので確率変数で、母数 θ は動かない。標本平均が正規分布に従い σ が分かるとき、x̄±1.96σ÷√n が μ を含む確率は 0.95 で、この下限が信頼係数。観測したあとの1本の区間は、μ を含むか含まないかのどちらかで、その1本に 0.95 の確率がつくのではない。
  conditions:
    math:
    - text: 両端 L≦U は標本だけから計算でき、分からない母数の値を使わない（統計量）
      kind: 要件
      outside: 分からない母数を使わないと計算できない区間は、標本から作る信頼区間にならない
    data:
    - 平均の区間 x̄±zσ÷√n は、標本平均が正規分布に従う（母集団が正規分布、または n が大きく中心極限定理が効く）ときの作り方。外れ値や強い歪みがあって n が小さいと、母数を含む割合は名目とずれうる
    - 取り方の偏りは区間の幅に入らない。偏った取り方の区間は、狭くても母数を外しうる
  example: σ＝10 が分かっていて、100人の平均が x̄＝50 なら、母平均の95%信頼区間は 50±1.96×10÷√100、つまり 48.04〜51.96。
  counterexample: データの95%が入る範囲 x̄±1.96s は、個々の値のばらつきを示す範囲で、母平均の信頼区間ではない。s＝10、n＝100 なら 30.4〜69.6 で、信頼区間の 48.04〜51.96 よりずっと広い。
  misconceptions:
  - misconception: 計算した区間 48.04〜51.96 に μ が95%の確率で入っている
    correction: μ は動かない決まった値。確率がつくのは区間の作り方で、取り直すと約95%の区間が μ を含む。できあがった1本は、含むか含まないかのどちらか
  - misconception: 95%信頼区間は、個々の客の95%が入る範囲
    correction: 信頼区間は母数（母平均）についての幅。n を増やすと √n に反比例して狭くなる。個々の値の範囲は n を増やしても狭くならない
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定）
  checks:
  - abs(50-1.96*10/math.sqrt(100) - 48.04) < 1e-9 and abs(50+1.96*10/math.sqrt(100) - 51.96) < 1e-9 and abs(50-1.96*10 - 30.4) < 1e-9 and abs(50+1.96*10 - 69.6) < 1e-9
- id: TERM-conf-level
  name: 信頼係数
  en: confidence level
  category: 推定
  forms: [number]
  basis:
    text: 信頼区間 [L, U] を作る方法について、モデルのすべての母数の値で（θ 以外の母数を含む）とった、区間が θ を含む確率 P(L≦θ≦U) の下限（これが 1−α のとき、信頼係数 1−α の信頼区間という。95% など）
    terms: [TERM-ci, TERM-prob]
  short: 信頼区間の作り方が、母数のどの値でも母数を含む確率の下限（95%など）
  definition: 信頼区間の作り方について、母数がどの値でも、区間が母数を含む確率がこれ以上になるという下限。95%・99% など。
  version: 1
  principle: 信頼係数 1−α は、標本を取る前の作り方の性質。同じ作り方で取り直すと、長い目で見て 1−α 以上の割合の区間が母数を含む。平均の区間で信頼係数を95%から99%に上げると、確率点が 1.96 から 2.576 になり、区間は約1.3倍に広がる。含む確率を上げる代わりに、区間は広く（ぼんやり）なる。
  conditions:
    math:
    - text: モデルのすべての母数の値で、区間が母数を含む確率が 1−α 以上
      kind: 要件
      outside: ある母数の値で 1−α を下回るなら、その作り方の信頼係数は 1−α とは言えない
    data:
    - 近似で作った区間（割合の p̂±z×√(p̂(1−p̂)÷n) など）では、含む確率は n が大きいとき 1−α に近づくだけで、n が小さいときや p が0・1に近いときは名目より低くなりうる
    - くり返しで確かめるときは、同じ作り方で区間を多数作り、母数を含む割合を数える
  example: σ が分かっている正規母集団から n＝25 を取り、x̄±1.96σ÷√n を1000回作ると、約950回が μ を含む。
  counterexample: σ が分からないのに、s と z の点 1.96 で n＝5 の区間 x̄±1.96s÷√5 を作ると、μ を含む確率は約88%で、95%に届かない。s が σ より小さく出る標本で区間が狭くなりすぎるため。t(4) の点 2.776 を使えば95%になる。
  misconceptions:
  - misconception: 信頼係数95%は、手元の1本の区間が母数を含む確率
    correction: 信頼係数は作り方の性質。手元の1本は母数を含むか含まないかのどちらかで、どちらかは分からない
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定・信頼係数）
  checks:
  - abs(2.576/1.96 - 1.31) < 0.005 and 1000*0.95 == 950
- id: TERM-paired-t
  name: 対応のある t 検定
  en: paired t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 同じ対象の2つの測定値の対 (Xᵢ, Yᵢ)（i＝1, …, n）の差 Dᵢ＝Xᵢ−Yᵢ について、H₀：差の母平均が 0 を、t＝D̄/(s_D/√n)（D̄・s_D² は差の標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 同じ対象の2つの測定値の差をとり、差の平均が0かどうかを t 分布で調べる方法
- id: TERM-welch
  name: ウェルチの t 検定
  en: Welch's t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 独立な2群の標本について、H₀：2つの母平均が等しい を、2群の母分散が等しいと仮定せずに、t＝(X̄₁−X̄₂)/√(s₁²/n₁＋s₂²/n₂)（X̄ⱼ・sⱼ² は群ごとの標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 2群の分散が等しいと仮定せずに、2群の平均の差を t 分布で調べる方法
- id: TERM-h0
  name: 帰無仮説
  en: null hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 母集団の分布（その母数）について置く仮説（真か偽かが決まる命題）で、データがそれと食い違うかを調べる対象にするもの。分布をただ1つに決める形（単純仮説。μ＝μ₀ など）か、決めた集まりに置く形（複合仮説）で立てる
    terms: [TERM-dist]
  short: 検定で「差がない・効果がない」などとして立て、データで棄却されるかを調べる仮説
- id: TERM-h1
  name: 対立仮説
  en: alternative hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 帰無仮説 H₀ が偽のときに母集団の分布がとりうるもの（の全部か一部）についての仮説で、H₀ を棄却したときに採るもの。ずれの向きを決める形（μ＞μ₀）と決めない形（μ≠μ₀）がある
    terms: [TERM-h0]
  short: 帰無仮説を棄却したときに採る仮説で、調べたい差や効果があるとするもの
- id: TERM-test-stat
  name: 検定統計量
  en: test statistic
  category: 検定
  forms: [rv]
  basis:
    text: 帰無仮説 H₀ を棄却するかを決めるために使う統計量 T（H₀ のもとでの T の分布が分かるか、近似できるように作る。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-h0]
  short: 帰無仮説のもとでの分布が分かるように作った統計量で、データのずれの大きさを1つの数にしたもの
- id: TERM-pvalue
  name: p値
  en: p-value
  category: 検定
  forms: [rv, number]
  basis:
    text: 検定統計量 T の観測値について、H₀ が正しいとしたとき T が観測値と同じかそれより極端な値（極端さの向きは前もって決める）をとる確率。H₀ が複合仮説なら H₀ の中での上限（T の関数とみると確率変数、観測したあとの値も p 値と呼ぶ）
    terms: [TERM-test-stat, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいとしたとき、観測した値か、それより極端な値が出る確率
- id: TERM-alpha
  name: 有意水準
  en: significance level
  category: 検定
  forms: [number]
  basis:
    text: 第1種の過誤の確率に、データを見る前に置く上限 α（5%・1% など）
    terms: [TERM-type1]
  short: 帰無仮説を棄却する基準の確率で、正しい帰無仮説を誤って棄却する確率の上限（5%など）
- id: TERM-reject
  name: 棄却域
  en: rejection region
  category: 検定
  forms: [event]
  basis:
    text: 検定統計量 T のとる値の集合 R で、T の観測値が R に入れば帰無仮説を棄却すると、データを見る前に決めたもの
    terms: [TERM-test-stat]
  short: 検定統計量がその範囲に入ったら帰無仮説を棄却すると、前もって決めた範囲
- id: TERM-sides
  name: 片側検定・両側検定
  en: one-sided and two-sided tests
  category: 検定
  forms: [procedure]
  basis:
    text: 仮説検定のうち、対立仮説 H₁ が母数のずれの向きを1つに決めるもの（片側検定）と、向きを決めないもの（両側検定）。棄却域はそれに合わせて置く（片側なら検定統計量の分布のその向きの端、両側ならふつう両端。ずれの向きによらず大きい値が出る統計量では、両側でも上側だけ）
    terms: [TERM-test, TERM-h1, TERM-reject]
  short: 対立仮説が母数のずれの向きを1つに決めるか（片側）、決めないか（両側）の違いで、棄却域の置き方はそれで決まる
- id: TERM-type1
  name: 第1種の過誤
  en: type I error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が正しいときに、検定統計量が棄却域に入る（H₀ を棄却する）という判定の誤り（事象）。その確率も同じ名前で呼ぶ（その確率は H₀ の中のどの分布かで変わり、有意水準はその上限）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいのに、誤って棄却してしまう誤り
- id: TERM-type2
  name: 第2種の過誤
  en: type II error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が誤っているとき（分布が H₀ の外にあるとき）に、検定統計量が棄却域に入らない（H₀ を棄却しない）という判定の誤り（事象）。その確率 β も同じ名前で呼ぶ（β は H₀ の外のどの分布かで変わる）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が誤っているのに、棄却されない誤り
- id: TERM-power
  name: 検出力
  en: power
  category: 検定
  forms: [number]
  basis:
    text: 帰無仮説 H₀ が誤っているときに H₀ を棄却する確率 1−β（β は第2種の過誤の確率。H₀ の外のどの分布かで値が変わる）
    terms: [TERM-type2]
  short: 帰無仮説が誤っているときに、正しく棄却される確率（1−第2種の過誤の確率）
- id: TERM-pool
  name: プールした比率
  en: pooled proportion
  category: 検定
  forms: [rv]
  basis:
    text: 2群の標本の大きさ n₁・n₂ と標本比率 p̂₁・p̂₂ から作る (n₁p̂₁＋n₂p̂₂)/(n₁＋n₂)（2群を合わせた標本の中で性質をもつものの割合。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-sample-prop]
  short: 2群の割合の差を検定するとき、帰無仮説（割合が等しい）のもとで2群を合わせて求めた割合
- id: TERM-expected
  name: 期待度数
  en: expected frequency
  category: 検定
  forms: [number, rv]
  basis:
    text: 帰無仮説 H₀ のもとでの各欄（区分）の度数 Oᵢ の期待値 n·pᵢ（n は総数、pᵢ は H₀ のもとでその欄に入る確率）。H₀ が確率を1つに決めないとき（独立性検定、母数を推定する適合度検定）は、pᵢ の代わりに度数から推定した p̂ᵢ を使った n·p̂ᵢ（その期待値の推定値）（独立性検定では 行の合計×列の合計÷総数）
    terms: [TERM-h0, TERM-expect]
  short: 帰無仮説（独立・決めた割合どおり）が正しいとしたとき、各欄に入ると見込まれる度数
- id: TERM-indep-test
  name: 独立性検定
  en: test of independence
  category: 検定
  forms: [procedure]
  basis:
    text: クロス集計表の2つの質的変数について、H₀：2つの変数は独立 を、統計量 Σ(O−E)²/E（O は観測度数、E は期待度数）で検定する仮説検定
    terms: [TERM-test, TERM-crosstab, TERM-indep, TERM-expected]
  short: クロス集計表の2つの変数が独立かどうかを、期待度数とのずれからカイ二乗分布で調べる検定
- id: TERM-gof
  name: 適合度検定
  en: goodness-of-fit test
  category: 検定
  forms: [procedure]
  basis:
    text: k 個の区分に入った観測度数 O₁, …, O_k について、H₀：各区分の確率が決めた値（または決めた分布の族から出る値）である を、統計量 Σ(Oᵢ−Eᵢ)²/Eᵢ（Eᵢ は期待度数）で検定する仮説検定
    terms: [TERM-test, TERM-expected]
  short: 観測した度数が、決めた理論の割合に合っているかを、カイ二乗分布で調べる検定
- id: TERM-crosstab
  name: クロス集計表
  en: cross tabulation
  category: 図表
  forms: [function]   # カテゴリの組 → 度数。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 値が分類（カテゴリ）である2つの変数 A・B（値がカテゴリであることは定義の要件。量的変数は階級に分ければ使える）について、A のカテゴリ a₁, …, a_r と B のカテゴリ b₁, …, b_c の組 (a_i, b_j) ごとに、その組の値をもつ個体の個数（度数）O_ij を数え、r 行 c 列に並べた表（行・列の合計と総数 n を添える。O_ij の総和は n）
  short: 2つの質的変数の組合せごとに度数を数えて並べた表
- id: TERM-scatter
  name: 散布図
  en: scatter plot
  category: 図表
  forms: [function]   # 個体 i → 点 (xᵢ, yᵢ)。同じ点の重なりも数えるので集合にしない。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 対になったデータ (x₁, y₁), …, (xₙ, yₙ)（同じ個体の2つの量的変数の値の組。x・y の値が数であることは定義の要件）を、横軸に x、縦軸に y をとった座標平面の n 個の点 (xᵢ, yᵢ) で表した図
  short: 2つの量的変数の値の組を、横軸と縦軸の座標の点で表した図
- id: TERM-partial-corr
  name: 偏相関係数
  en: partial correlation coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 3つの量的変数 x・y・z のデータについて、2つずつの相関係数 r_xy・r_xz・r_yz から求める r_xy・z＝(r_xy−r_xz r_yz)/√{(1−r_xz²)(1−r_yz²)}（r_xz²＜1 かつ r_yz²＜1 は定義の要件）
    terms: [TERM-corr]
  short: 第3の変数の影響を取り除いたあとの、2つの変数の相関係数
- id: TERM-spurious
  name: 擬相関
  en: spurious correlation
  category: 相関・回帰
  forms: [property]
  basis:
    text: 2つの変数の間に直接の因果の関係がないのに、両方に関係する第3の変数などのために、2つの変数の相関係数が0から離れて見えること
    terms: [TERM-corr]
  short: 2つの変数に直接の関係がないのに、共通の第3の変数などのために見かけ上あらわれる相関
- id: TERM-ols
  name: 最小二乗法
  en: least squares method
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式の係数を、データの残差の2乗の和 Σeᵢ² が最小になるように決める方法（最小にする係数が1つに決まることは、切片の列（すべて1）と説明変数の値の列が1次独立であること（単回帰では x が全部同じでないこと）で保たれる）
    terms: [TERM-resid]
  short: 残差の2乗の和が最小になるように、回帰式の係数を決める方法
- id: TERM-regcoef
  name: 回帰係数
  en: regression coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 目的変数 y を説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を最小二乗法で求めたときの、説明変数 x_j に掛かる係数 b_j（切片の列（すべて1）と説明変数の値の列が1次独立であることは定義の要件。そうでないと係数が1つに決まらない。単回帰では x が全部同じでないこと）
    terms: [TERM-ols]
  short: 回帰式で、説明変数が1増えたときに目的変数がどれだけ変わると見込むかを表す係数
- id: TERM-resid
  name: 残差
  en: residual
  category: 相関・回帰
  forms: [number]
  basis:
    text: データに当てはめた回帰式について、i 番目の観測値 yᵢ から、その説明変数の値での回帰式の予測値 ŷᵢ を引いた値 eᵢ＝yᵢ−ŷᵢ
  short: 観測した値から、回帰式で予測した値を引いた値
- id: TERM-r2
  name: 決定係数
  en: coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: 回帰式を当てはめたデータで、残差の2乗の和を目的変数の偏差の2乗の和で割り、1から引いた値 R²＝1−Σeᵢ²/Σ(yᵢ−ȳ)²（Σ(yᵢ−ȳ)²＞0 は定義の要件）
    terms: [TERM-resid, TERM-dev]
  short: 目的変数のばらつきのうち、回帰式で説明できる割合（切片を含む最小二乗では0〜1）
- id: TERM-extrap
  name: 外挿
  en: extrapolation
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式を、当てはめに使ったデータの説明変数の値の範囲の外の値に当てはめて、目的変数を予測すること
  short: 回帰式を、データのある範囲の外の説明変数の値に当てはめて予測すること
- id: TERM-mreg
  name: 重回帰分析
  en: multiple regression analysis
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 目的変数 y を k 個（k≧1）の説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を、最小二乗法で求める分析（名前の「重」は k≧2 の場合を指して使う）
    terms: [TERM-ols]
  short: 2つ以上の説明変数で目的変数を表す式を求める分析
- id: TERM-dummy
  name: ダミー変数
  en: dummy variable
  category: 相関・回帰
  forms: [function]
  basis:
    text: 質的変数の1つのカテゴリについて、そのカテゴリに当てはまる個体で1、当てはまらない個体で0をとる変数
    terms: [TERM-qual]
  short: 質的変数を回帰分析で使うため、当てはまれば1・当てはまらなければ0とした変数
- id: TERM-adjr2
  name: 自由度調整済み決定係数
  en: adjusted coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: k 個の説明変数の回帰式を n 個のデータに当てはめたとき（n−k−1≧1 は定義の要件）、決定係数 R² を全体の自由度 n−1 と残差の自由度 n−k−1 で補正した 1−(1−R²)(n−1)/(n−k−1)
    terms: [TERM-r2, TERM-df]
  short: 説明変数を増やすだけでは大きくならないように、自由度で補正した決定係数
- id: TERM-ms
  name: 平均平方
  en: mean square
  category: 検定
  forms: [rv]
  basis:
    text: 平方和をその自由度で割った値（群間・群内・回帰・残差などの平方和ごとに作る）
    terms: [TERM-df]
  short: 平方和をその自由度で割った値で、分散分析や回帰でばらつきの大きさを比べるのに使う
- id: TERM-multicol
  name: 多重共線性
  en: multicollinearity
  category: 相関・回帰
  forms: [property]
  basis:
    text: 重回帰分析で、説明変数どうしの間に強い1次の関係がある（ある説明変数が、ほかの説明変数の1次式でほぼ表せる）こと
    terms: [TERM-mreg]
  short: 重回帰分析で、説明変数どうしの相関が強く、回帰係数の推定が不安定になること
- id: TERM-strat-sampling
  name: 層化抽出
  en: stratified sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠（母集団）を重ならない層に分け、すべての層のそれぞれから、層ごとに先に決めた大きさの標本を無作為抽出で選ぶ手続き（母集団の値は、層の推定値を母集団で層が占める割合 N_h/N で重み付けて足して推定する）
    terms: [TERM-random-sampling]
  short: 母集団をいくつかの層に分け、各層から無作為に標本を選ぶ方法
- id: TERM-cluster-sampling
  name: 集落抽出
  en: cluster sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠（母集団）を集落（学校・地区・店など、要素の集まり）に分け、集落を単位にして無作為抽出で選び、選んだ集落の要素を全部調べる手続き
    terms: [TERM-random-sampling]
  short: 母集団を集落（学校・地区など）に分け、無作為に選んだ集落の全員を調べる方法
- id: TERM-systematic-sampling
  name: 系統抽出
  en: systematic sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠の名簿の並びで、抽出間隔 k を決め、最初の1つを1〜k 番目から等しい確率で選び、そこから k おきに選ぶ手続き
    terms: [TERM-random-sampling]
  short: 名簿の最初の1人を無作為に選び、そこから一定の間隔で選んでいく方法
- id: TERM-multistage-sampling
  name: 多段抽出
  en: multistage sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 母集団を大きさの違う単位の段（地域→店→客など）に分け、大きな単位から順に、各段で前の段で選んだ単位の中から無作為抽出で選ぶ手続き（各要素の選ばれる確率は、各段の、前の段で選ばれたという条件の下の確率の積。どの段の一覧も抽出枠になる）
    terms: [TERM-random-sampling]
  short: 大きな単位から順に、何段階かに分けて無作為に選んでいく方法
- id: TERM-sampling-error
  name: 標本誤差
  en: sampling error
  category: 調査・実験
  forms: [rv]
  basis:
    text: 選ばれた個体の集まり S が決まったあと、S の要素を誤りなく測ったときの推定量の値 θ̂*(S) と、抽出枠の上の母数 θ_F（抽出枠の全部を誤りなく調べたときの値）の差 θ̂*(S)−θ_F（どの標本が選ばれたかで値が決まる）
    terms: [TERM-estimator, TERM-frame]
  short: 母集団の一部（標本）だけを調べることで生じる、結果と真の値のずれ
- id: TERM-nonsampling-error
  name: 非標本誤差
  en: non-sampling error
  category: 調査・実験
  forms: [rv]
  basis:
    text: 実際に得たデータで求めた推定量の値 θ̂ と、母数 θ の差 θ̂−θ から、選んだ標本を誤りなく測ったときのずれを除いた部分 (θ̂−θ̂*(S))＋(θ_F−θ)（θ̂*(S) は選ばれた個体の集まり S の要素を誤りなく測ったときの推定量の値、θ_F は抽出枠の全部を誤りなく調べたときの値）。前の項は無回答・回答や記入の誤りなど測り方から、後ろの項は抽出枠と母集団のずれ（名簿の漏れなど）から来る。標本誤差 θ̂*(S)−θ_F と足すと θ̂−θ になる
    terms: [TERM-estimator, TERM-frame]
  short: 回答の誤り・無回答・抽出枠の不備など、標本を選ぶこと以外で生じるずれ
- id: TERM-randomize
  name: 無作為化
  en: randomization
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 実験で、各対象をどの処理の群に入れるかを、対象の性質や実験者の判断でなく、前もって決めた確率に従うくじ（乱数）で決める手続き。完全無作為化は、群の大きさを先に決め、その大きさの割り当てを全部同じ確率で選ぶ形
    terms: [TERM-prob]
  short: 実験で、対象をくじ引きのように処理の群へ割り当てること
- id: TERM-confound
  name: 交絡
  en: confounding
  category: 調査・実験
  forms: [property]
  basis:
    text: 処理（調べたい要因）T の群どうしで結果 Y を比べるとき、T と関係し（無作為に選んだ1個体の T と Z が独立でない）、Y にも影響する別の要因 Z があるために、比べた差に T の効果と Z の効果が混ざって分けられないこと（独立でないかは、割り当て・抽出の偶然まで含めた確率で見る。1回の割り当てで偶然に生じた群の差は含めない。Y への影響・効果は因果の見立てで、統計の外の判断を含む）
    terms: [TERM-indep]
  short: 調べたい要因と結果の両方に関係する別の要因があり、その効果を区別できなくなること
- id: TERM-anova
  name: 分散分析
  en: analysis of variance
  category: 検定
  forms: [procedure]
  basis:
    text: g 個の群の母平均がすべて等しいという H₀ を、F＝群間の平均平方÷群内の平均平方 で検定する仮説検定（教材の範囲は一元配置。g≧2 で定義でき、2級では主に g≧3 で使う）
    terms: [TERM-test, TERM-ms]
  short: 3つ以上の群の平均に差があるかを、群の間と群の中のばらつきの比（F 分布）で調べる方法
- id: TERM-multcomp
  name: 多重比較
  en: multiple comparisons
  category: 検定
  forms: [procedure]
  basis:
    text: 複数の帰無仮説（群の組ごとなど）をそれぞれ仮説検定するとき、正しい帰無仮説のうちどれか1つでも第1種の過誤を起こす確率（ファミリーワイズの誤り率）が決めた有意水準 α 以下になるように、各検定の基準を調整して判定する手続き（ボンフェローニの方法など）
    terms: [TERM-test, TERM-type1, TERM-alpha]
  short: 多くの群の組を検定するとき、全体として誤る確率が大きくならないように調整して比べる方法
- id: TERM-posterior
  name: 事後確率
  en: posterior probability
  category: 確率
  forms: [number]
  basis:
    text: 結果 D を見たあとの、原因・仮説 H の条件付き確率 P(H|D)
    terms: [TERM-cond]
  short: データ（結果）を見たあとで、ベイズの定理で更新した原因や仮説の確率
  definition: 結果（データ）D を見たあとの、原因や仮説 H の確率 P(H|D)。ベイズの定理で、事前確率を結果で更新して求める。
  version: 1
  principle: 事後確率は「事前確率×尤度」に比例する。新しい結果が、原因を決めたもとで前の結果と独立なら、今の事後確率を次の事前確率にして、もう一度更新できる。
  conditions:
    math:
      - text: 条件にするのは、観測した結果の全体 D（一部の結果だけを選んで条件にしない）
        kind: 要件
        outside: 事後確率にならない（観測したほかの結果を使わない、偏った更新になる）
    data:
      - 2回目の結果で更新するときは、1回目と2回目の結果が（原因を決めたもとで）独立かを確かめる。同じ人を同じ検査で測り直すと、誤りが繰り返されやすい
  example: 有病率 1%・感度 0.9・偽陽性 0.05 の検査で1回陽性なら、事後確率は 0.01×0.9÷0.0585≒0.154。
  counterexample: 同じ人に独立な検査を2回して陽性と陰性が1回ずつ出たのに、陽性だけで更新して約 0.154 とするのは事後確率ではない。両方の結果で更新すると約 0.019 になる。
  misconceptions:
    - misconception: 事後確率は、計算したら確定した値
      correction: 次の結果を見るたびに更新される。1回陽性で 0.154 でも、病気かどうかを決めたもとで独立なもう1回の検査でも陽性なら、約 0.766 になる
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.1538*0.9/(0.1538*0.9 + 0.8462*0.05) - 0.766) < 0.001 and abs(0.1538*0.1/(0.1538*0.1 + 0.8462*0.95) - 0.019) < 0.001
- id: TERM-mean
  name: 平均（算術平均）
  en: arithmetic mean
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 足すことに意味のある値（量的変数）のデータ x₁, …, xₙ（n≧1。量的変数であることは定義の要件）の値をすべて足し、個数 n で割った値 x̄＝(x₁＋…＋xₙ)/n
    terms: []
  short: データの値をすべて足し、データの個数で割った値
- id: TERM-prob
  name: 確率（確率の公理）
  en: probability (axioms)
  category: 確率
  forms: [function, number]
  basis:
    text: 標本空間の事象 A のそれぞれに数 P(A) を対応させる関数で、どの A でも P(A)≧0、P(Ω)＝1、互いに排反な事象 A₁, A₂, … では P(A₁∪A₂∪…)＝P(A₁)＋P(A₂)＋…（確率の公理）を満たすもの。その値 P(A) も確率と呼ぶ
    terms: [TERM-event, TERM-sample-space, TERM-exclusive]
  short: 事象の起こりやすさを0〜1の数で表したもので、全体は1、排反な事象では確率を足せる
  definition: 事象の起こりやすさを0から1の数で表したもの。事象 A の確率を P(A) と書く。どの事象でも0以上、全体（標本空間）は1、互いに排反な事象の和の確率はそれぞれの確率の和（確率の公理）。
  version: 1
  principle: 確率は、公理の3つ（0以上・全体が1・排反なら足せる）を満たす割り当てなら何でもよい。どの割り当てを使うかは、仮定（同様に確からしい・過去の割合・モデル）で決める。公理から、余事象の確率 1−P(A)、加法定理、空事象の確率0 などが導ける。
  formulas:
    - id: F-complement
      label: 余事象の確率
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: Aᶜ, meaning: A が起こらない事象（余事象。高校では Ā と書く）, key: Ac, kind: value, concept: TERM-complement}
        - {symbol: A, meaning: 事象, key: A, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: Ac}]}
          - op: sub
            args:
              - {num: 1}
              - {op: fn, name: P, args: [{sym: A}]}
  conditions:
    math:
      - text: 確率は同じ標本空間 Ω の事象に割り当てる
        kind: 要件
        outside: 確率を比べたり足したりできない（別々に決めた2つの Ω の事象の確率は、同じ公理の上にない。1つの Ω にまとめれば比べられる）
    data:
      - 結果が有限個で、どれも同じ確率で起きる（同様に確からしい）と言えるときだけ、P(A)＝（A の結果の数）÷（Ω の結果の数）で求められる。2個のさいころの「1と6の組（順序を区別しない）」のように、同じ確率でない結果を1つと数えると誤る
      - 確率の割り当て方（同様に確からしい・過去の割合・モデル）を書き、その仮定が場面に合うかを確かめる。過去の割合を使うときは、条件が変わっていないか
  example: ゆがみのないさいころで偶数の目が出る確率は、6通りのうち 3通りで 3/6＝1/2。
  counterexample: 明日の天気を Ω＝{晴れ, 雨, 曇り} とし、晴れ 0.6・雨 0.5・曇り 0 と割り当てると、合計が 1.1 で「全体は1」を満たさないので確率ではない。
  misconceptions:
    - misconception: 晴れか雨のどちらかなので、晴れの確率は 1/2
      correction: 結果が2つでも、同じ確率で起きるとは限らない。数の比で確率を出せるのは「同様に確からしい」と言えるときだけ
    - misconception: 確率 1/6 なら、6回投げると必ず1回出る
      correction: 確率は1回ごとの起こりやすさ。6回で1回も出ないことも (5/6)⁶≒0.33 の確率で起きる。回数を増やすと割合が 1/6 に近づく（大数の法則）
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - Fraction(3,6) == Fraction(1,2) and round((5/6)**6, 2) == 0.33 and 0.6+0.5+0 > 1
- id: TERM-addition
  name: 加法定理
  en: addition rule
  category: 確率
  forms: [proposition]
  claims: [CLM-32]
  basis:
    text: どの2つの事象 A・B についても P(A∪B)＝P(A)＋P(B)−P(A∩B)（④-32）
    terms: [TERM-prob, TERM-event]
  short: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から両方が起こる確率を引いたもの
  definition: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から、両方が起こる確率を引いたもの。P(A∪B)＝P(A)＋P(B)−P(A∩B)。
  version: 1
  principle: P(A)＋P(B) は、A と B の両方に入る結果（A∩B）を二重に数えている。その分を1回引くと、A∪B の確率になる。A と B が排反なら A∩B は空なので、ただ足すだけになる。
  formulas:
    - id: F-addition
      label: 和の確率
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: A∪B, meaning: A か B の少なくとも一方が起きる, key: AuB, kind: value}
        - {symbol: A, meaning: 事象, key: A, kind: value}
        - {symbol: B, meaning: 事象, key: B, kind: value}
        - {symbol: A∩B, meaning: A と B が両方起きる, key: AB, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: AuB}]}
          - op: sub
            args:
              - op: add
                args:
                  - {op: fn, name: P, args: [{sym: A}]}
                  - {op: fn, name: P, args: [{sym: B}]}
              - {op: fn, name: P, args: [{sym: AB}]}
      parts:
        - {path: [1, 0], name: 和, meaning: 2つの確率を足す。両方に入る結果を二重に数えている}
        - {path: [1, 1], name: 重なり, meaning: 二重に数えた両方の確率を1回引く}
  conditions:
    math:
      - text: A・B は同じ標本空間の上の、同じ確率 P の事象
        kind: 仮定
        claim: CLM-32
        outside: ④-32 は保証されない（この式で足し引きできない）
    data:
      - 重なり（両方に当てはまる人・品）を数えているかを確かめる。アンケートの「どちらかに当てはまる」を、2つの割合の和で出すと重なりの分だけ多くなる
  example: さいころで A＝{2, 4, 6}（偶数）、B＝{1, 2, 3}（3以下）なら、P(A∪B)＝3/6＋3/6−1/6＝5/6（A∩B＝{2}）。
  counterexample: 3つの事象 A・B・C のどれかが起こる確率を P(A)＋P(B)＋P(C)−P(A∩B)−P(B∩C)−P(A∩C) とすると、3つとも起こる部分を一度も数えない。2つの事象の式をそのまま3つに広げることはできない（3つの重なり P(A∩B∩C) を足し戻す）。
  misconceptions:
    - misconception: 「または」の確率はいつも足し算
      correction: 足すだけでよいのは排反のときだけ。重なりがあるときは、重なりの確率を引く
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - Fraction(3,6)+Fraction(3,6)-Fraction(1,6) == Fraction(5,6) and len({2,4,6}|{1,2,3}) == 5
- id: TERM-multiplication
  name: 乗法定理
  en: multiplication rule
  category: 確率
  forms: [proposition]
  claims: [CLM-33]
  basis:
    text: P(A)＞0 の事象 A とどの事象 B についても P(A∩B)＝P(A)P(B|A)（④-33）
    terms: [TERM-prob, TERM-cond, TERM-event]
  short: 2つの事象が両方起こる確率は、一方の確率と、それが起きたときの他方の条件付き確率の積
  definition: 2つの事象が両方起こる確率は、一方の確率と、それが起きたもとでの他方の条件付き確率の積。P(A∩B)＝P(A)P(B|A)。
  version: 1
  principle: 条件付き確率の定義 P(B|A)＝P(A∩B)÷P(A) の両辺に P(A) を掛けた形。「A の確率」に「A のうちで B も起きる割合」を掛ける。どちらを条件にしてもよく、P(A∩B)＝P(B)P(A|B) も成り立つ。A と B が独立なら（P(A)＞0 のとき）P(B|A)＝P(B) なので、P(A∩B)＝P(A)P(B) になる。
  formulas:
    - id: F-multiplication
      label: 両方の確率を順に掛ける
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: A∩B, meaning: A と B が両方起きる, key: AB, kind: value}
        - {symbol: A, meaning: 条件にする事象, key: A, kind: value}
        - {symbol: B|A, meaning: A を条件にした B（P( | ) の中だけの書き方）, key: BgA, kind: value, concept: TERM-cond}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: AB}]}
          - op: mul
            args:
              - {op: fn, name: P, args: [{sym: A}]}
              - {op: fn, name: P, args: [{sym: BgA}]}
      parts:
        - {path: [1, 0], name: 条件の確率, meaning: A が起きる確率}
        - {path: [1, 1], name: 条件付きの確率, meaning: A のうちで B も起きる割合}
  conditions:
    math:
      - text: A・B は同じ標本空間の上の、同じ確率 P の事象（P(A)＞0 は条件付き確率の要件）
        kind: 仮定
        claim: CLM-33
        outside: ④-33 は保証されない（違う確率の掛け算は、両方の確率にならない）
    data:
      - 2回目の確率が1回目の結果で変わるか（戻す・戻さない、売れたら棚から減る）を確かめる
  example: 赤玉 3 個・白玉 2 個の袋から戻さずに2回引き、2回とも赤の確率は 3/5×2/4＝3/10。
  counterexample: 会員の割合 0.4 は店 X、会員が買う割合 0.8 は店 Y の数を使うと、0.4×0.8＝0.32 で、店 X の「会員で買った人」の割合 0.2 と合わない。2つの確率が同じ P（同じ店の客）でないと、掛けても両方の確率にならない。
  misconceptions:
    - misconception: 戻さずに引くときも、2回とも赤は 3/5×3/5
      correction: 1回目に赤を引くと、袋は赤 2 個・白 2 個になる。2回目の赤は 2/4 で、3/5×2/4＝3/10（戻すときの 9/25 とは違う）。戻さずに引いた数の分布は超幾何分布になる
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - 'Fraction(3,5)*Fraction(2,4) == Fraction(3,10) and Fraction(3,5)**2 == Fraction(9,25) and abs(0.4*0.8 - 0.32) < 1e-12'
- id: TERM-total-prob
  name: 全確率の公式
  en: law of total probability
  category: 確率
  forms: [proposition]
  claims: [CLM-34]
  basis:
    text: 事象 A₁, …, A_k が互いに排反で合わせると Ω になり、どれも P(Aᵢ)＞0 のとき、どの事象 B についても P(B)＝Σ P(Aᵢ)P(B|Aᵢ)（④-34）
    terms: [TERM-prob, TERM-cond, TERM-event, TERM-exclusive]
  short: 起こり方を排反な場合に分け、場合ごとの確率×条件付き確率を足して全体の確率を求める式
  definition: 起こり方を、重なりも漏れもない場合に分け、場合ごとの「その場合の確率×その場合の条件付き確率」を足すと、全体の確率になる。2つの場合なら P(B)＝P(A)P(B|A)＋P(Aᶜ)P(B|Aᶜ)。
  version: 1
  principle: B が起きる結果は、場合分けの A₁, …, A_k のどれか1つにだけ入る。だから B を場合ごとの B∩Aᵢ に重なりなく分けて足せる（加法）。それぞれの P(B∩Aᵢ) は乗法定理で P(Aᵢ)P(B|Aᵢ)。場合ごとの条件付き確率を、その場合の起こりやすさで重みを付けて平均した形になる。
  formulas:
    - id: F-total-prob
      label: 2つの場合に分けて足す
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: B, meaning: 確率を求める事象, key: B, kind: value}
        - {symbol: A, meaning: 場合分けの一方, key: A, kind: value}
        - {symbol: Aᶜ, meaning: 場合分けのもう一方（A の余事象）, key: Ac, kind: value, concept: TERM-complement}
        - {symbol: B|A, meaning: A を条件にした B, key: BgA, kind: value, concept: TERM-cond}
        - {symbol: B|Aᶜ, meaning: Aᶜ を条件にした B, key: BgAc, kind: value, concept: TERM-cond}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: B}]}
          - op: add
            args:
              - op: mul
                args:
                  - {op: fn, name: P, args: [{sym: A}]}
                  - {op: fn, name: P, args: [{sym: BgA}]}
              - op: mul
                args:
                  - {op: fn, name: P, args: [{sym: Ac}]}
                  - {op: fn, name: P, args: [{sym: BgAc}]}
      parts:
        - {path: [1, 0], name: A の場合, meaning: A の確率×A のもとで B の確率}
        - {path: [1, 1], name: Aᶜ の場合, meaning: Aᶜ の確率×Aᶜ のもとで B の確率}
  conditions:
    math:
      - text: 場合分けの A₁, …, A_k は互いに排反で、合わせると Ω 全体になる（重なりも漏れもない。P(Aᵢ)＞0 は条件付き確率の要件。2つの場合の式は A と Aᶜ なので、いつも満たす）
        kind: 仮定
        claim: CLM-34
        outside: ④-34 は保証されない（重なりを2回数えたり、漏れた場合を数えなかったりして、足しても P(B) にならない）
    data:
      - 場合分けが「どの客もちょうど1つに入る」かを確かめる（会員・クーポン利用者のように重なる分け方は使えない）
  example: 検査で、病気の人（1%）が陽性になる確率 0.9、病気でない人（99%）が陽性になる確率 0.05 なら、陽性になる確率は 0.01×0.9＋0.99×0.05＝0.0585。
  counterexample: 客 100 人を「会員 40 人（20 人が買う）」と「クーポン利用者 30 人（18 人が買う）」に分けて 0.4×0.5＋0.3×0.6＝0.38 とすると、両方に入る 10 人（8 人が買う）を2回数え、どちらでもない 40 人（10 人が買う）を数えない。実際の購入率は (20＋18−8＋10)÷100＝0.40。
  misconceptions:
    - misconception: 場合ごとの条件付き確率を、そのまま平均すればよい（(0.9＋0.05)÷2）
      correction: 場合の起こりやすさで重みを付ける。病気の人は 1% しかいないので、0.475 ではなく 0.01×0.9＋0.99×0.05＝0.0585
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.01*0.9 + 0.99*0.05 - 0.0585) < 1e-12 and 20+18-8+10 == 40 and abs(0.4*0.5 + 0.3*0.6 - 0.38) < 1e-12 and abs((0.9+0.05)/2 - 0.475) < 1e-12
- id: TERM-bernoulli
  name: ベルヌーイ分布
  en: Bernoulli distribution
  category: 確率分布
  group: GRP-dist-count
  forms: [distribution]
  short: 1回の試行で、成功（1）を確率 p、失敗（0）を確率 1−p でとる分布
  definition: 値 1 を確率 p、値 0 を確率 1−p でとる確率変数の分布。成功を1、失敗を0と数えた1回の試行の結果の分布。
  version: 1
  principle: とる値が 0 と 1 の2つだけなので、確率 p 1つで分布が決まる。1回の成功の回数（0回か1回）とみると、n 回分を足したものが二項分布になる。
  formulas:
  - id: F-bernoulli-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: k
      meaning: X がとる値（成功なら1、失敗なら0）
      range: 0 か 1
      key: k
      kind: value
      domain: {min: 0, max: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "pow", "args": [{"sym": "p"}, {"sym": "k"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"num": 1}, {"sym": "k"}]}]}]}]}
  basis_formula: F-bernoulli-pmf
  conditions:
    math:
    - text: 0≦p≦1
      kind: 要件
      outside: 母数が範囲の外なら、この定義のベルヌーイ分布として扱えない
  example: 表が出る確率 0.5 の硬貨を1回投げ、表を1、裏を0とすると、X はベルヌーイ分布に従う。P(X＝1)＝0.5、P(X＝0)＝0.5。
  counterexample: さいころを1回投げた目そのもの（1〜6）は、値が2つでないのでベルヌーイ分布ではない。「6が出たら1、それ以外は0」と数え直せば、p＝1/6 のベルヌーイ分布になる。
  sources:
  - source: 公式2級範囲表
  checks:
  - 0.5**1*(1-0.5)**0 == 0.5 and 0.5**0*(1-0.5)**1 == 0.5
  - Fraction(1,6)**1*(1-Fraction(1,6))**0 == Fraction(1,6)
- id: TERM-sample-mean
  name: 標本平均
  en: sample mean
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ（n は1以上）から作る統計量 X̄＝(X₁＋…＋Xₙ)/n（観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic]
  short: 標本のデータの値を足し、データの個数で割った値
  definition: 標本の値 X₁, …, Xₙ を足して n で割った統計量 X̄。取り直すたびに値が変わりうり、その期待値は母平均 μ、分散は σ²÷n になる（独立に同じ分布から取るとき）。
  version: 1
  formulas:
  - id: F-xbar-expect
    label: 標本平均の期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（取り直したときの平均）
      key: E
      concept: TERM-expect
    - symbol: X̄
      meaning: 標本平均（n 個の値の平均）
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: μ
      meaning: 母平均（1個の値 Xᵢ の期待値）
      key: mu
      concept: TERM-expect
      kind: param
    tree:
      op: eq
      args:
      - op: fn
        name: E
        args:
        - sym: Xbar
      - sym: mu
  - id: F-xbar-var
    label: 標本平均の分散
    symbols:
    - symbol: V( )
      meaning: 分散（取り直したときのばらつき）
      key: V
      concept: TERM-var
    - symbol: X̄
      meaning: 標本平均（n 個の値の平均）
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: σ
      meaning: 母標準偏差（1個の値 Xᵢ のばらつき）
      key: sigma
      concept: TERM-sd
      kind: param
      domain:
        min: 0
    - symbol: n
      meaning: 平均をとる個数（標本の大きさ）
      key: n
      kind: value
      domain:
        min: 1
        integer: true
    tree:
      op: eq
      args:
      - op: fn
        name: V
        args:
        - sym: Xbar
      - op: div
        args:
        - op: pow
          args:
          - sym: sigma
          - num: 2
        - sym: n
    parts:
    - path:
      - 1
      - 0
      name: 1個の分散
      meaning: 1個の値のばらつき σ²。n を増やしても変わらない
    - path:
      - 1
      - 1
      name: 個数
      meaning: n 個を平均すると、大きい値と小さい値が打ち消し合い、分散は n 分の1になる
  principle: 平均すると、大きい値と小さい値が打ち消し合う。独立に取るなら、n 個の合計の分散は nσ² で、平均は合計を n で割るので分散は n² で割って σ²÷n。中心（期待値）は μ のまま動かず、幅だけが細くなる。n を4倍にしても幅（標準偏差）は半分にしかならない。
  conditions:
    math:
    - text: n は1以上の整数
      kind: 要件
      outside: 標本平均が定義されない（0 で割る）
    - text: X₁, …, Xₙ は、どれも期待値が μ
      kind: 仮定
      claim: CLM-20a
      outside: ④-20a は保証されない（E(X̄) は各 Xᵢ の期待値の平均で、μ とは限らない）
    - text: X₁, …, Xₙ は独立に同じ分布に従い、分散 σ² が有限
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（値どうしに相関があると、X̄ の分散は σ²÷n からずれる。正の相関なら大きく、有限の母集団から戻さずに取ると小さい）
    data:
    - 同じ日・同じ客・同じ機械の値のように、似た値どうしがまとまって入っていないかを確かめる（正の相関があると、X̄ の標準偏差は σ÷√n より大きい）
    - 有限の母集団から戻さずに取るなら、母集団の数 N が n より十分大きいかを確かめる（抽出率が大きいと、X̄ の標準偏差は σ÷√n より小さい。{{unit:U17}}）
    - 選ばれ方に偏りがあると、各 Xᵢ の期待値が母平均とずれる（偏り）。どう選んだかを確かめる
  example: 商品1個の重さが平均 50g・標準偏差 12g なら、独立な 36 個の平均重量は期待値 50g、分散 144÷36＝4、標準偏差 2g。
  counterexample: 1人の客を選び、その客の 10 回の購入額を「10個の値」として平均する。同じ客の値どうしは似ていて独立でない。どの客を選んでも、その客の 10 回の額がいつも同じになる極端な場合、X̄＝X₁ なので X̄ の分散は σ² のままで、σ²÷10 にならない。
  misconceptions:
  - misconception: n を増やすと、1個1個のばらつき（標準偏差）も小さくなる
    correction: 小さくなるのは平均 X̄ のばらつきだけ。1個の重さのばらつき 12g は、何個集めても 12g のまま
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - 144 / 36 == 4 and math.sqrt(4) == 2 and 12 ** 2 == 144
- id: TERM-sample-prop
  name: 標本比率
  en: sample proportion
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 各個体が性質をもてば1、もたなければ0とした標本 X₁, …, Xₙ の標本平均 p̂＝(X₁＋…＋Xₙ)/n（性質をもつ個数÷n）
    terms: [TERM-sample-mean]
  short: 標本の中で、ある性質をもつものの割合
  definition: 標本の中で、ある性質をもつもの（買った・不良など）の割合 p̂。性質をもてば1、もたなければ0とした値の標本平均で、取り直すたびに値が変わりうる。
  version: 1
  principle: 比率は 0 と 1 の値の平均なので、標本平均の決まりがそのまま使える。1人の値の期待値は p、分散は p(1−p) なので、独立に n 人を選ぶと p̂ の期待値は p、分散は p(1−p)÷n、標準誤差は √(p(1−p)÷n)。p が 0.5 のとき p(1−p) が最大の 0.25 になるので、p が分からないときは 0.5 で見積もると、必要な人数を少なく見積もらずに済む。
  conditions:
    math:
    - text: n は1以上の整数で、各 Xᵢ は 0 か 1
      kind: 要件
      outside: 標本比率が定義されない（0 と 1 以外の値の平均は割合ではない）
    - text: X₁, …, Xₙ は独立に同じ分布（性質をもつ確率 p）に従う
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（p̂ の分散は p(1−p)÷n とは限らない。同じ家族・同じ店の人をまとめて聞くと、似た答えが重なり、分散はこれより大きい。有限の母集団から戻さずに取ると小さい）
    data:
    - 「割合」の分母が何か（聞いた人数か、答えた人数か）を確かめる。分母が違えば別の p̂
  example: 来店客の購入率が p＝0.2 のとき、100人を調べた購入率 p̂ の分散は 0.2×0.8÷100＝0.0016、標準誤差は 0.04。
  counterexample: 5段階の満足度（1〜5点）の平均 3.6 を、5で割った 0.72 を「満足の比率」として √(p(1−p)÷n) に入れることはできない。値が 0 か 1 でないので、平均を5で割っても割合ではなく、0.72×0.28 は1人の値の分散にならない（3.6 をそのまま入れると 3.6×(1−3.6) は負になる）。
  misconceptions:
  - misconception: 比率の標準誤差は、p がいくつでも同じ人数なら同じ
    correction: p(1−p) は p＝0.5 で最大、0 や 1 に近いほど小さい。同じ 400 人でも、p＝0.5 なら標準誤差 0.025、p＝0.1 なら 0.015
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - math.isclose(0.2*0.8/100, 0.0016) and math.isclose(math.sqrt(0.0016), 0.04)
  - math.isclose(math.sqrt(0.25/400), 0.025) and math.isclose(math.sqrt(0.09/400), 0.015)
- id: TERM-interval-est
  name: 区間推定
  en: interval estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 信頼係数 1−α（名目）を決め、それに合わせて作った信頼区間を標本から求めて、母数 θ の値の範囲として示す手続き（作り方ごとの保証は、その手続きの成立条件で言う。近似の作り方では、1−α に近づくのは各母数の値ごと：④-19）
    terms: [TERM-conf-level, TERM-ci, TERM-parameter]
  short: 母数の値を、幅をもった区間で推定すること
  definition: 母数の値を、標本から作る区間で推定すること。信頼係数と区間の作り方を決め、標本から区間を求めて示す。
  version: 1
  principle: 点推定に、推定のばらつき（標準誤差）を幅で添える。平均・割合の区間はいつも「推定値 ± 確率点 × 標準誤差」の形で、信頼係数を上げると確率点が大きくなって広がり、n を増やすと標準誤差が √n に反比例して狭まる。誤差幅を d 以下にしたいときは、n＝(zσ÷d)² から必要な n を逆算できる。
  conditions:
    math:
    - text: 示す区間は、決めた信頼係数をもつ信頼区間の作り方（近似の作り方なら、その信頼係数に近づく作り方）で、標本から作る
      kind: 要件
      outside: その区間に「95%」などの信頼係数は付けられない
    data:
    - 作り方が信頼係数を保つ条件（平均の区間なら、標本平均が正規分布に従い、独立に同じ分布から取る）を、データの取り方と形で確かめる。外れると、示した信頼係数で母数を含むとは限らない
    - 取り方の偏りは区間の幅に入らない。n を増やして区間を狭くしても、偏りは残る
    - 日の売上のように共通の要因で値どうしが動くと、標準誤差を s÷√n で出した区間は狭すぎうる
  example: 400人中80人が購入したなら、p̂＝0.2、SE＝√(0.2×0.8÷400)＝0.02 で、購入率の95%信頼区間は 0.2±1.96×0.02、約 0.161〜0.239。σ＝10 で誤差幅を1にしたいなら、n＝(1.96×10÷1)²≒384.2 で、385人が要る。
  counterexample: 満足の人の6割、不満の人の2割しか答えないアンケートでは、客全体の満足率が0.5でも、回答者の満足率は0.75に近づく。2000人の回答で区間を作ると約 0.731〜0.769 と狭いが、0.5 を含まない。n を増やして狭くしても、取り方の偏りは消えない。
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定）
  checks:
  - abs(math.sqrt(0.2*0.8/400) - 0.02) < 1e-12 and abs(0.2-1.96*0.02 - 0.161) < 0.0005 and abs(0.2+1.96*0.02 - 0.239) < 0.0005 and abs((1.96*10/1)**2 - 384.2) < 0.05 and math.ceil((1.96*10/1)**2) == 385
  - abs(0.5*0.6/(0.5*0.6+0.5*0.2) - 0.75) < 1e-12 and abs(0.75-1.96*math.sqrt(0.75*0.25/2000) - 0.731) < 0.0005 and abs(0.75+1.96*math.sqrt(0.75*0.25/2000) - 0.769) < 0.0005
- id: TERM-test
  name: 仮説検定
  en: hypothesis testing
  category: 検定
  forms: [procedure]
  basis:
    text: 母集団の分布についての帰無仮説 H₀ と対立仮説 H₁ を立て、有意水準 α を前もって決め、H₀ が正しいときに検定統計量 T が入る確率が α 以下になる棄却域 R を（H₁ の向きに合わせて）選び、T の観測値が R に入れば H₀ を棄却し、入らなければ棄却しない手続き
    terms: [TERM-h0, TERM-h1, TERM-alpha, TERM-test-stat, TERM-reject]
  short: 母集団についての仮説を立て、その仮説のもとでデータが起こりにくいかどうかで、仮説を棄却するかを決める方法
- id: TERM-quantile
  name: 分位点
