# 用語＝概念。id は変えない（ネットワークでは stats2:TERM-…）。説明（definition など）がある用語は概念として検査し、ネットワーク用に書き出す。まだ説明のない用語の本文は旧版の用語辞典にある（publish/legacy.yaml）。
- id: TERM-perm
  name: 順列
  en: permutation
  category: 数学の道具
  forms: [number]
  basis:
    text: 異なる n 個のものから r 個（n・r は 0≦r≦n の整数。定義の要件）を取り出し、順番を区別して1列に並べる並べ方の数 ₙPᵣ（何も取り出さない r＝0 は1通り）
  short: 異なるものから順番を区別して並べる並べ方と、その数
  definition: 異なる n 個の中から r 個を取り出し、順番を区別して1列に並べる並べ方の数。ₙPᵣ と書く。
  version: 1
  principle: 1番目は n 通り、2番目は残りの n−1 通り……と、1つ置くたびに選べるものが1つ減る。r 番目まで掛けた n(n−1)…(n−r+1) が並べ方の数。n 個を全部並べて前の r 個だけを見ると、後ろの n−r 個の並べ替え (n−r)! 通りは同じ並べ方になるので、n! を (n−r)! で割っても同じ数になる。
  formulas:
    - id: F-perm-def
      label: 階乗で表す
      symbols:
        - {symbol: ₙPᵣ, meaning: n 個から r 個を取り出して並べる並べ方の数, key: perm, concept: TERM-perm}
        - {symbol: n, meaning: 全体の個数, key: n, kind: value, domain: {min: 0, integer: true}}
        - {symbol: r, meaning: 取り出して並べる個数, key: r, kind: value, domain: {min: 0, max: n, integer: true}}
        - {symbol: n!, meaning: 階乗（1からその数までを掛けた数）, key: fact, concept: TERM-fact}
      tree:
        op: eq
        args:
          - {op: fn, name: perm, args: [{sym: n}, {sym: r}]}
          - op: div
            args:
              - {op: fn, name: fact, args: [{sym: n}]}
              - {op: fn, name: fact, args: [{op: sub, args: [{sym: n}, {sym: r}]}]}
      parts:
        - {path: [1, 0], name: 全部の並べ方, meaning: n 個を全部1列に並べる並べ方の数}
        - {path: [1, 1], name: 残した中の並べ方, meaning: 取り出さずに残した n−r 個の並びは数えないので、その並べ方の数で割る}
  conditions:
    math:
      - n と r は整数で、0 ≦ r ≦ n
      - n 個はどれも区別できる
      - 同じものを2回使わない（取り出したものは戻さない）
    data:
      - 「順番を区別する」場面かを確かめる。役割（委員長・副委員長）・順位・並ぶ位置があれば順列、選ぶだけなら組合せで数える
      - 同じものを2回使える場面（暗証番号の数字など）かを確かめる
  example: 5人から委員長と副委員長を1人ずつ選ぶ選び方は ₅P₂＝5×4＝20 通り（5!÷3!＝120÷6＝20）。
  counterexample: 暗証番号のように同じ数字を何度使ってもよい4桁は、使った数字を除かないので ₁₀P₄＝5040 通りではなく 10⁴＝10000 通り。
  misconceptions:
    - misconception: ₅P₂＝5!÷2!（取り出す個数の階乗で割る）
      correction: 割るのは、取り出さずに残す 5−2＝3 個の並べ替え 3!。5!÷3!＝20 で、5!÷2!＝60 は 5人のうち3人を並べる数 ₅P₃
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - math.perm(5,2)==20==5*4 and math.factorial(5)//math.factorial(3)==20
    - math.perm(10,4)==5040 and 10**4==10000
    - math.factorial(5)//math.factorial(2)==60==math.perm(5,3)
- id: TERM-comb
  name: 組合せ
  en: combination
  category: 数学の道具
  forms: [number]
  basis:
    text: 異なる n 個のものから、順番を区別せずに r 個（n・r は 0≦r≦n の整数。定義の要件）を選ぶ選び方の数 ₙCᵣ（何も選ばない r＝0 は1通り）
  definition: n 個の中から、順番を区別せずに r 個を選ぶ選び方の数。ₙCᵣ と書く。
  version: 1
  principle: n 個を1列に並べる n! 通りのうち、選んだ r 個の中の並び（r! 通り）と、残した n−r 個の中の並び（(n−r)! 通り）は区別しないので、その分で割る。
  formulas:
  - id: F-comb-def
    label: 階乗で表す
    symbols:
    - symbol: ₙCᵣ
      meaning: n 個から r 個を選ぶ選び方の数
      key: comb
      concept: TERM-comb
    - symbol: n
      meaning: 全体の個数
      key: n
      kind: value
      domain: {min: 0, integer: true}
    - symbol: r
      meaning: 選ぶ個数
      key: r
      kind: value
      domain: {min: 0, max: n, integer: true}
    - symbol: n!
      meaning: 階乗（1からその数までを掛けた数）
      key: fact
      concept: TERM-fact
    tree: {"op": "eq", "args": [{"op": "fn", "name": "comb", "args": [{"sym": "n"}, {"sym": "r"}]}, {"op": "div", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "n"}]}, {"op": "mul", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "r"}]}, {"op": "fn", "name": "fact", "args": [{"op": "sub", "args": [{"sym": "n"}, {"sym": "r"}]}]}]}]}]}
    parts:
    - path: [1, 0]
      name: 全部の並べ方
      meaning: n 個を1列に並べる並べ方の数
    - path: [1, 1, 0]
      name: 選んだ中の並べ方
      meaning: 選んだ r 個は順番を区別しないので、その並べ方の数で割る
    - path: [1, 1, 1]
      name: 残した中の並べ方
      meaning: 残した n−r 個も順番を区別しないので、その並べ方の数で割る
  conditions:
    math:
    - n と r は整数で、0 ≦ r ≦ n
    - n 個はどれも区別できる
    - 同じものを2回選ばない（選んだものは戻さない）
    data:
    - 「順番を区別しない」選び方かを確かめる。役割（委員長・副委員長）や順位があるなら順列で数える
  example: 5人から2人の係を選ぶ選び方は ₅C₂＝5!÷(2!×3!)＝120÷12＝10 通り。
  counterexample: 5人から委員長と副委員長を1人ずつ選ぶときは役が違うので順番を区別する。10 通りではなく 5×4＝20 通り（順列）。
  misconceptions:
  - misconception: ₁₀C₃ と ₁₀C₇ は別の数
    correction: 選ぶ3人を決めることは、残す7人を決めることと同じ。ₙCᵣ＝ₙCₙ₋ᵣ で、どちらも120
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - math.comb(5,2)==10 and math.factorial(5)==120 and math.factorial(2)*math.factorial(3)==12 and 120//12==10
  - math.perm(5,2)==20 and 5*4==20
  - math.comb(10,3)==math.comb(10,7)==120
- id: TERM-sigma
  name: 総和記号（Σ）
  en: summation
  category: 数学の道具
  forms: [operation]
  basis:
    text: 指定した添え字の範囲にわたって、各項を足し合わせること。Σ はその書き方。有限和 Σ_{i=1}^{n} aᵢ＝a₁＋a₂＋…＋aₙ（上端が下端より小さいときは、足す項がないので和は0（空の和））。下端から順に書いた、項が無限に続く和 Σ_{i=m}^{∞} aᵢ は、部分和 Sₙ＝Σ_{i=m}^{n} aᵢ の n→∞ の極限で定め、その極限が有限の実数のときに値をもつ。集合にわたって足す和 Σₓ（期待値のように取り得る値の集合で足す。値が整数でも、順を決めて書いていなければこちら）は、絶対値の和が有限（絶対収束）のときに、足す順によらず1つの有限の値に定まる（項がすべて非負なら、そのまま足した和が有限であることと同じ）
  short: 指定した範囲の項をすべて足し合わせることを表す記号
  definition: 指定した添え字の範囲にわたって、各項を足し合わせること。Σ_{i=1}^{n} xᵢ は x₁＋x₂＋…＋xₙ。項が無限に続くときは、順に足した途中までの和（部分和）が近づく値で定め、値の集合で足す和は、足す順で値が変わらないとき（絶対収束）に定める。近づかなければ値をもたない。
  version: 2
  principle: 長い足し算を、どこから・どこまで・何を足すかの3つで短く書く約束。足す中身に掛け算や2乗があれば、各項で先に計算してから足す（Σxᵢ² は2乗してから足す、(Σxᵢ)² は足してから2乗する）。定数 c は Σ の外に出せて（Σcxᵢ＝cΣxᵢ）、足し算は分けられる（Σ(xᵢ＋yᵢ)＝Σxᵢ＋Σyᵢ）が、積や2乗は分けられない（Σxᵢyᵢ は ΣxᵢΣyᵢ ではない）。項が無限に続く和では、途中までの和が一定の値に近づくかを先に考え、近づく和どうしなら、定数倍を外に出すことと、和を分けることがそのまま使える。ただし、項を並べ替えて足してよいのは、絶対収束するときだけ。
  conditions:
    math:
    - text: 足す項と、添え字の範囲が決まっている
      kind: 要件
      outside: 和が決まらない（何をどこまで足すかが決まらない）
    - text: 項が無限に続くとき、下端から順に書いた和なら部分和が有限の値に収束し、集合にわたって足す和なら絶対収束する
      kind: 要件
      outside: 有限の値として定まらない（部分和が発散する、または足す順で値が変わる）
    data:
    - 表計算の SUM の範囲（どの行からどの行まで）が、式の Σ の下端・上端と合っているかを確かめる
  example: 販売数 2, 4, 6 個なら、Σxᵢ＝2＋4＋6＝12、Σxᵢ²＝4＋16＋36＝56、(Σxᵢ)²＝12²＝144。
  counterexample: 1−1/2＋1/3−1/4＋… は、下端から順に足せば ln 2（約0.693）に近づく。ところが絶対値の和 1＋1/2＋1/3＋… は有限にならないので、同じ項を集合にわたって足す和 Σₓ としては、足す順で値が変わり（正の項を2つ、負の項を1つの順に並べ替えると、ln 2 の1.5倍 約1.040 に近づく）、1つの値に定まらない。集合にわたって足す和は絶対収束する、という要件を外すと、和が定まらない。
  misconceptions:
  - misconception: Σc（c は定数）は c
    correction: 定数を n 回足すので Σ_{i=1}^{n} c＝nc。Σ(xᵢ＋1)＝Σxᵢ＋n で、Σxᵢ＋1 ではない
  - misconception: Σ(xᵢ×yᵢ) は (Σxᵢ)×(Σyᵢ) と同じ
    correction: 足し算は分けられるが、積は分けられない。x＝(1, 2)、y＝(3, 4) なら Σxᵢyᵢ＝3＋8＝11、(Σxᵢ)(Σyᵢ)＝3×7＝21
  - misconception: 項が無限に続く和は、項が0 に近づけば必ず有限の値になる
    correction: 項が0 に近づくことは、和が有限の値に近づくための必要な条件だが、それだけでは足りない。1＋1/2＋1/3＋… は項が0 に近づくのに、いくらでも大きくなる。1＋1/2＋1/4＋… は2 に近づく
  sources:
  - source: 公式2級範囲表
    locator: 数学的な準備（総和記号）
  checks:
  - 2+4+6 == 12 and 4+16+36 == 56 and 12**2 == 144 and 1*3+2*4 == 11 and (1+2)*(3+4) == 21
  - abs(sum((-1)**(k+1)/k for k in range(1, 200001)) - math.log(2)) < 1e-5 and abs(sum(1/(4*k-3)+1/(4*k-1)-1/(2*k) for k in range(1, 200001)) - 1.5*math.log(2)) < 1e-5 and abs(1.5*math.log(2) - 1.040) < 0.0005
  - abs(sum(1/2**k for k in range(60)) - 2) < 1e-12 and sum(1/k for k in range(1, 100001)) > 12 and sum(1/k for k in range(1, 1000001)) - sum(1/k for k in range(1, 100001)) > 2.3
- id: TERM-fact
  name: 階乗
  en: factorial
  category: 数学の道具
  forms: [number]
  basis_formula: F-fact-def
  definition: 1 から n までの整数をすべて掛けた数。n! と書く。0! は 1 と決める。
  version: 1
  principle: n 個のものを1列に並べる並べ方の数。先頭は n 通り、次は n−1 通り……と1つずつ減るので、それを全部掛け合わせる。
  formulas:
  - id: F-fact-def
    label: 1 から n までの積
    symbols:
    - symbol: n!
      meaning: n の階乗
      key: fact
      concept: TERM-fact
    - symbol: n
      meaning: 並べるものの個数
      key: n
      kind: value
      domain: {min: 0, integer: true}
    - symbol: i
      meaning: 掛ける数（1 から n まで動く）
      key: i
      kind: index
    tree: {"op": "eq", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "n"}]}, {"op": "prod", "var": "i", "lower": {"num": 1}, "upper": {"sym": "n"}, "args": [{"sym": "i"}]}]}
  conditions:
    math:
    - n は0以上の整数（0! は 1 と決める。何も並べない並べ方は1通り）
    data:
    - n が大きいとすぐに大きくなる（10! は 3628800）。計算では約分してから掛けると楽になる
  example: 3人を1列に並べる並べ方は 3!＝3×2×1＝6 通り。
  counterexample: 赤玉2個と白玉1個のように同じものを含む並べ方は 3!＝6 通りではない。赤どうしを区別しないので 6÷2!＝3 通り。
  misconceptions:
  - misconception: 0! は 0
    correction: 0! は 1。何も並べない並べ方は1通りで、ₙCₙ＝n!÷(n!×0!)＝1 とも合う
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - math.factorial(3)==6==3*2*1 and math.factorial(10)==3628800
  - math.factorial(3)//math.factorial(2)==3 and math.factorial(0)==1 and math.comb(4,4)==1
- id: TERM-population
  name: 母集団
  en: population
  category: データと変数
  forms: [event]
  basis:
    text: 調べたい性質をもつ対象（人・物・出来事）の全部の要素の集まり（要素の数 N。限りなく多いとみなすこともある）。推測統計で「母集団の分布」と言うときは、値が数の変数について、母集団から1つ無作為に取り出した要素の値（確率変数）の分布を指し、母集団そのものとは別のもの
  short: 調べたい対象の全体（知りたい性質をもつ人・物のすべて）
  definition: 調べたい性質をもつ対象（人・物・出来事）の全部の要素の集まり。結論を広げたい範囲で、要素の数を N と書く（限りなく多いとみなすこともある）。
  version: 1
  principle: 統計で答えたい問いは、母集団についての問い（全店の平均の満足度・全製品の不良率）。先に母集団を「いつの・どこの・何の」まで決めると、実際に選べた範囲（抽出枠）や調べた一部（標本）とのずれが見え、結論をどこまで広げてよいかが決まる。推測統計で値が数の変数について「母集団の分布」と言うときは、どの要素も同じ確率で1つ選んだときの、その要素の値の分布を指す。
  conditions:
    math:
    - text: どの要素が母集団に入るかが決まっていて、要素を1つずつ区別できる（範囲と時点を決める）
      kind: 要件
      outside: 母集団が定まらず、母集団の平均などの母数も定まらない
    data:
    - 「いつの・どこの・何の」を書き出す（今月開いた新店を含むか、退会した会員を含むか）。結論を言いたい範囲と、実際に選べた範囲（抽出枠）を並べて書く
  example: 本部が「地域の全105店の売場の満足度」を知りたいなら、母集団は全105店（N＝105）。台帳に載る100店ではない。
  counterexample: 「うちの店の来店客」を母集団にしても、どの期間の来店かを決めないと要素が決まらない（同じ人が何度も来る、日によって入れ替わる）。「10月の平日の来店1回ずつ」のように範囲と時点を決めると定まる。
  misconceptions:
  - misconception: 母集団は人の集まりのこと
    correction: 調べる対象の全部なら、物や出来事も母集団になる。1日のレシート全部・今月作った製品全部・10月の来店1回ずつ、など
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - 100 + 5 == 105
- id: TERM-sample
  name: 標本
  en: sample
  category: データと変数
  forms: [rv]
  basis:
    text: 母集団について調べるために（実際には抽出枠から）n 回選んだ個体（復元抽出では重なりうる）の、調べる変数の値を並べた組 X₁, …, Xₙ（どの個体が選ばれるかの偶然で値が決まる。選ばれた個体の集まり S は、標本の選ばれ方の結果として文の中で言う。n を標本の大きさと呼び、観測したあとの値 x₁, …, xₙ も同じ名前で呼ぶ）
    terms: [TERM-population]
  short: 母集団から、調べるために取り出した一部
  definition: 母集団について調べるために n 回選んだ要素（戻して選ぶなら同じ要素が重なりうる）の、調べる変数の値の組 X₁, …, Xₙ。どの要素が選ばれるかの偶然で値が決まる。n を標本の大きさと呼ぶ。
  version: 1
  principle: 標本は母集団の一部なので、選び方が変われば値も変わる。だから標本から計算した数（統計量）は、選び方の偶然で値が決まる確率変数で、母集団の数（母数）を推し量るときは、その偶然のばらつきもいっしょに考える。どの要素がどの確率で選ばれるかが決まっていれば（無作為抽出）、そのばらつきを確率で表せる。
  conditions:
    math:
    - text: 選んだのは母集団の要素で、X₁, …, Xₙ はその要素の値
      kind: 要件
      outside: その母集団の標本ではない（母集団の外の値が混ざると、標本から母集団の母数を推し量る土台がない）
    data:
    - 標本の大きさ n と、どの一覧（抽出枠）からどう選んだかを書く。選んだ数と、実際に答えた数（無回答を除いた数）を分ける
    - どの標本がどの確率で選ばれたかが分かる取り方（無作為抽出）かを確かめる。声をかけやすい人・応募した人のように確率が分からない取り方では、取り直したときの値の変わり方（標本分布）はあっても求められず、ばらつきや偏りの大きさを見積もれない
  example: 5店の1日の廃棄数 3・5・7・9・11 個から2店を選ぶとき、選び方は10通り。(3, 5) を選べば標本の値は 3 と 5 で標本平均は4、(9, 11) なら10。どれが出るかは選び方の偶然で決まる。
  counterexample: 地域の全店の満足度を知りたいのに、地域の店7店に隣の地区の店3店を混ぜて「10店の標本」とした。混ぜた3店は母集団の要素ではないので、この10個の値の組は地域の全店の標本ではない（10店の平均は、地域の全店の平均を推し量る数にならない）。
  misconceptions:
  - misconception: 標本の大きさ n は、標本を取った回数
    correction: n は1つの標本に入る要素の数。10店を選ぶ調査を3回くり返したら、大きさ10の標本が3つで、n＝30 ではない
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - comb(5, 2) == 10 and (3 + 5) / 2 == 4 and (9 + 11) / 2 == 10
- id: TERM-parameter
  name: 母数
  en: parameter
  category: データと変数
  forms: [number]
  basis:
    text: 母集団の性質を表す数 θ（母平均 μ・母分散 σ² など）。母集団の全部の要素の値から決まり、全数を調べない限り標本からは決まらないので、ふつうは分からない（母集団の分布を分布の族で表すときは、その族を区別する数（二項分布の p など）を同じ名前で呼ぶ）
    terms: [TERM-population]
  short: 母集団の性質を表す値（母平均・母分散など）で、ふつうは分からないので標本から推定する
  definition: 母集団の性質を表す数（母平均・母分散・母比率など）。母集団とどの性質かを決めれば、母集団の全部の値から1つに決まる数で、全部を調べない限り分からない。
  version: 1
  principle: 母集団とどの性質かを決めれば、母数の値は1つに決まり、どの標本を取っても変わらない。変わるのは標本から計算する統計量（標本平均など）の方。分からない母数を、標本から計算した統計量で推し量る（推定）・確かめる（検定）のが推測統計の形。分布の族で母集団を表すとき（二項分布の p、正規分布の μ・σ²）は、その分布を決める数を母数と呼ぶ。
  conditions:
    math:
    - text: どの母集団（いつの・どの範囲の集まりか）の、どの性質かが決まっている
      kind: 要件
      outside: 母数が定まらない（閉店で店の集まりが変われば、別の母集団の別の母数になる。「平均購入額」でも、1回の会計あたりか、1人の1か月の合計かが決まらないと、1つの数にならない）
    data:
    - 推し量りたい母数がどの母集団のものかを、標本の取り方といっしょに書く。取った標本が別の集団から来ていれば、推し量れるのはその集団の母数
  example: ある店の今月の全レシート1万枚の平均購入額が母平均 μ。そのうち100枚を選んだ平均は標本平均で、μ を推し量るために使う。μ は1つの決まった数だが、全部を集計しない限り分からない。
  counterexample: 「この店の客の平均購入額」は、1回の会計あたり（全レシートの平均）か、1人の1か月の購入額の平均かが決まらないと、母数にならない。同じ1万枚のレシートでも、常連が月に何度も来れば、2つの平均は違う値になる。
  misconceptions:
  - misconception: 母数も、標本を取り直すたびに変わる
    correction: 母集団とどの性質かを決めれば母数は変わらない。取り直すたびに変わるのは標本平均などの統計量
  - misconception: 母数は母集団の人数のこと
    correction: 母数は母平均・母分散・母比率など、母集団の分布を決める値。母集団の大きさは N と書いて区別する。母数は μ・σ・p のように書き、標本から計算する統計量は x̄・s・p̂ のように記号を付けて区別する
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - 100/10000 == 0.01
- id: TERM-statistic
  name: 統計量
  en: statistic
  category: データと変数
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ の値だけで値が数（実数1つ）に決まる関数 T＝t(X₁, …, Xₙ) として作る確率変数（分からない母数を含まないことと、値が数であることは定義の要件。観測したあとの値も同じ名前で呼ぶ。定義ではない補足：標本を取り直すたびに値が変わりうる。分からない母数を推し量る推定や、仮説を確かめる検定に使う）
    terms: [TERM-sample, TERM-rv]
  short: 標本のデータから計算して求める値（標本平均・標本分散など）
  definition: 標本の値だけから計算して1つの数に決まる量（標本平均・不偏分散など）。分からない母数を含まず、標本を取り直すたびに値が変わりうる。
  version: 1
  principle: 母数（母集団の平均など）は分からないので、手元の標本から計算できる量で推し量り、確かめる。計算に分からない母数が入ると、その量は手元のデータからは出せない。統計量は標本の偶然で値が変わる確率変数なので、取り直したときの分布（標本分布）を考えて、手元の1つの値をどれだけ当てにできるかを決める。
  conditions:
    math:
    - text: 値が標本の値だけで決まる（分からない母数を含まない）
      kind: 要件
      outside: 手元の標本から計算できないので、統計量ではない
    - text: 値が実数1つ
      kind: 要件
      outside: 統計量ではない（区間や数の組は、2つ以上の統計量から作る。信頼区間は統計量 L・U から作る）
    data:
    - 計算に使った値が全部手元にあるかを確かめる。母標準偏差 σ を過去の記録の値で置いたなら、その値を分かっているものとして扱ったことを書く
  example: 3店の売上 10・12・14 万円から計算した標本平均 12 万円と、最大−最小の 4 万円は、どちらも統計量。別の3店を選べば値は変わりうる。
  counterexample: 標本平均と母平均の差 x̄−μ は、母平均 μ が分からなければ標本から計算できないので、統計量ではない（検定で μ に仮説の値を入れたときは、その値の下で計算できる量になる）。
  misconceptions:
  - misconception: 統計量は、データから出した決まった1つの値
    correction: 手元のデータから出た値は、統計量がとった1つの値。統計量そのものは「どの標本を取ったか」で値が変わる確率変数で、その変わり方が推定や検定の土台になる
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - (10 + 12 + 14) / 3 == 12 and 14 - 10 == 4
- id: TERM-sample-space
  name: 標本空間
  en: sample space
  category: 確率
  forms: [event]
  basis:
    text: 1回の試行で起こりうる結果を、重なりなく漏れなく全部集めた集合 Ω
    terms: []
  short: 1回の試行で起こりうる結果を、すべて集めた集合
  definition: 1回の試行で起こりうる結果を、重なりなく漏れなく全部集めた集合。Ω と書く。
  version: 1
  principle: 確率を考える前に、「何が起こりうるか」の全体を決める。結果を1つずつ数え上げると、どの結果も Ω のちょうど1つの要素になる。確率は Ω の上の事象に割り当てるので、Ω の決め方で、同じ出来事の確率の計算のしかたが変わる。
  conditions:
    math:
      - text: 結果どうしは重ならず（1回の試行で2つの結果が同時に起きない）、起こりうる結果を全部含む
        kind: 要件
        outside: 標本空間として扱えない（重なりがあると確率を足すと二重に数え、漏れがあると全体の確率が1にならない）
    data:
      - 何を1つの結果とするかを先に決める。2個のさいころなら、区別して (1回目, 2回目) の36通りにすると、どれも同じ確率で起きると考えやすい
  example: さいころを1回投げるときの標本空間は Ω＝{1, 2, 3, 4, 5, 6}。
  counterexample: さいころの結果を「偶数の目」「3以下の目」の2つにすると、2 はどちらにも入って重なり、5 はどちらにも入らず漏れる。重なりも漏れもあるので標本空間にならない。
  misconceptions:
    - misconception: 標本空間の結果は、いつも同じ確率で起きる
      correction: 標本空間は「起こりうる結果の全体」を決めるだけ。同じ確率で起きるかは別の仮定（ゆがんださいころでも Ω は {1, …, 6}）
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - len({1,2,3,4,5,6}) == 6 and len([(a,b) for a in range(1,7) for b in range(1,7)]) == 36
- id: TERM-event
  name: 事象
  en: event
  category: 確率
  forms: [event]
  basis:
    text: 標本空間 Ω の部分集合（起こりうる結果のうち、注目するものの集まり）
    terms: [TERM-sample-space]
  short: 標本空間の中で、注目する結果を集めた部分集合
  definition: 標本空間の中で、注目する結果を集めた部分集合。A などと書き、その中のどれかの結果が出たとき「A が起きた」と言う。
  version: 1
  principle: 「偶数の目が出る」のような言葉の出来事を、結果の集まり {2, 4, 6} に置き換える。集まりにすると、「または」は和集合 A∪B、「かつ」は共通部分 A∩B、「起きない」は残り（余事象）として計算できる。
  conditions:
    math:
      - text: 事象は標本空間 Ω の部分集合（Ω 全体と、何も含まない空事象 ∅ も事象）
        kind: 要件
        outside: 事象として扱えない（Ω にない結果を含む集まりには確率を割り当てられない）
    data:
      - 言葉の出来事を、どの結果の集まりにするかを書き出して確かめる（「6 以外」「少なくとも1回」などは、集まりにすると数え漏れが見つかる）
  example: さいころで「偶数の目が出る」は A＝{2, 4, 6}、「3以下の目が出る」は B＝{1, 2, 3}。「偶数かつ3以下」は A∩B＝{2}。
  counterexample: さいころを1回投げる Ω＝{1, …, 6} で「1回目が6で2回目が1」は、2回分の結果の組なので Ω の部分集合ではなく、この Ω の事象ではない（2回投げの 36 通りの Ω を取れば事象になる）。
  misconceptions:
    - misconception: 事象は1つの結果のこと
      correction: 事象は結果の集まり。1つの結果だけの事象 {6} もあるが、「偶数」{2, 4, 6} のように複数の結果を含む事象もある
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - '{2,4,6} & {1,2,3} == {2}'
- id: TERM-frame
  name: 抽出枠
  en: sampling frame
  category: データと変数
  forms: [event]
  basis:
    text: 標本を選ぶ元にする、要素を1つずつ並べた一覧（名簿・台帳・地図の区画など）に載っている要素の集まり。母集団の要素の全部を1回ずつ含むとは限らず、漏れ・重複・対象外の要素を含むことがある
  short: 標本を選ぶときに使う、母集団の名簿や一覧
  definition: 標本を選ぶ元にする、要素を1つずつ並べた一覧（名簿・台帳・区画の地図など）。母集団と一致するとは限らない。
  version: 1
  principle: 無作為抽出が決めるのは、抽出枠の中での選ばれ方だけ。枠に載っていない要素は選ばれる確率が0で、枠に2回載っている要素は、ほかの要素より選ばれやすい。結論を広げられるのは枠が覆う範囲までで、枠と母集団のずれは、標本を大きくしても縮まない。
  conditions:
    math:
    - text: 枠の1つの項目を選ぶと、調べる要素（集落抽出では要素の集まり）が決まる
      kind: 要件
      outside: 項目を選んでも調べる要素が決まらないので、各要素の選ばれる確率が決まらない（抽出の一覧として使えない）
    data:
    - 枠が母集団を覆う割合（漏れ）を確かめる。台帳の更新日を見る（今月の新店が載っているか）
    - 同じ要素の重複（2回載っている要素は選ばれやすい）と、対象外の要素（選んだあとで外すと、調べる数が予定より減る）を確かめる
  example: 地域の全105店（母集団）を知りたいが、店舗台帳には100店しか載っていない。台帳が抽出枠で、母集団を覆う割合は 100÷105≒0.95。新店5店は選ばれる確率が0。
  counterexample: 電話番号の一覧から番号を選んで「住民1人」に聞く調査で、4人家族が1つの番号を共有している。家族の誰に聞くかを決めずに番号だけを選ぶと、聞く相手が1人に決まらない（電話に出た人になる）ので、住民1人ずつの選ばれる確率が決まらない。
  misconceptions:
  - misconception: 名簿から選んだなら、母集団から選んだのと同じ
    correction: 名簿（抽出枠）と母集団はずれることがある。名簿に載らない人（新しい会員・名簿の更新の漏れ）は選ばれず、その分は結論に入らない
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - abs(100 / 105 - 0.95) < 0.005
- id: TERM-random-sampling
  name: 無作為抽出
  en: random sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠の中から標本を選ぶとき、どの標本をどの確率で選ぶかを前もって決め（枠のどの要素も、抽出の単位が要素の集まりのときはその集まりを通して、選ばれる確率が0より大きい）、その確率に従うくじ（乱数）で選ぶ手続き。大きさ n のどの組み合わせも同じ確率で選ぶものを単純無作為抽出と呼び、そのとき各要素の選ばれる確率は n/N（N は枠の要素の数）
    terms: [TERM-frame, TERM-prob]
  short: 母集団のどの要素も決まった確率で選ばれるように、くじ引きのように標本を選ぶこと
  definition: 抽出枠のどの要素も0より大きい決まった確率で選ばれるように、前もって決めた確率に従うくじ（乱数）で標本を選ぶ手続き。大きさ n のどの組み合わせも同じ確率で選ぶものを単純無作為抽出と呼ぶ。
  version: 1
  formulas:
  - id: F-srs-incl
    label: 単純無作為抽出の包含確率
    symbols:
    - symbol: π
      meaning: 枠の1つの要素が標本に入る確率（包含確率。円周率の π とは別）
      key: incl
      concept: TERM-prob
      kind: value
    - symbol: n
      meaning: 選ぶ数（標本の大きさ）
      key: n
      kind: value
      domain:
        min: 0
        max: N
        integer: true
    - symbol: N
      meaning: 抽出枠の要素の数（母集団の数ではない）
      key: N
      kind: value
      domain:
        min: 1
        integer: true
    tree:
      op: eq
      args:
      - sym: incl
      - op: div
        args:
        - sym: n
        - sym: N
    parts:
    - path:
      - 1
      - 0
      name: 選ぶ数
      meaning: 選ぶ数が多いほど、どの要素も入りやすい
    - path:
      - 1
      - 1
      name: 枠の数
      meaning: 割るのは枠の数。枠に載らない要素は、どの組み合わせにも入らないので確率0
  principle: 選ぶ人の判断を外し、選ばれ方を確率で決める。確率で決まっているので、標本から計算した数が選び方でどれだけばらつくかを確率で言え、どの要素も選ばれうるので、結論を枠の全体に広げられる。単純無作為抽出では、大きさ n の組み合わせ（N 個から n 個を選ぶ NCn 通り）の全部が同じ確率なので、ある要素を含む組み合わせを数えると、各要素の入る確率は n÷N になる。
  conditions:
    math:
    - text: 枠のどの要素についても、選ばれる確率が選ぶ前に決まっていて、0 より大きい
      kind: 要件
      outside: 無作為抽出ではない（選ばれる確率が0の要素には結論を広げられず、確率が決まっていなければ、ばらつきを確率で言えない）
    - text: 大きさ n のどの組み合わせも同じ確率で選ぶ（単純無作為抽出）
      kind: 仮定
      claim: CLM-40
      outside: ④-40 は保証されない（各要素の入る確率は n÷N とは限らない。層ごとに抽出率を変える層別抽出などでは、要素ごとに違う）
    data:
    - 乱数・くじを使ったか、選ぶ人の判断（声をかけやすい・偏らないよう気をつけた）や本人の応募が入っていないかを確かめる
    - 選ぶ一覧（抽出枠）が母集団を覆っているかを別に確かめる。無作為に選んでも、枠の漏れは埋まらない
  example: 店舗台帳の100店から乱数で10店を選ぶ（単純無作為抽出）。台帳のどの店も選ばれる確率は 10÷100＝0.1。
  counterexample: 会員名簿の100人のうち、番号1〜50の人の中からだけ乱数で10人を選ぶ。乱数を使っていても、番号51〜100の人は選ばれる確率が0なので、名簿の100人からの無作為抽出ではない（結論は番号1〜50の人までしか言えない）。
  misconceptions:
  - misconception: 担当者が偏らないよう気をつけて選べば、無作為抽出と同じ
    correction: 無作為は「選ばれる確率が決まっている」こと。気をつけて選んでも、各要素の選ばれる確率は決まらず、選ぶ人の好み（声をかけやすさ・目立つ店）が入りうる
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - math.isclose(10 / 100, 0.1)
  - all(math.isclose(comb(N - 1, n - 1) / comb(N, n), n / N) for N in range(1, 12) for n in range(1, N + 1))
- id: TERM-bias
  name: バイアス（偏り）
  en: bias
  category: 調査・実験
  forms: [number]
  basis:
    text: 母数 θ の推定量 θ̂ について E(θ̂)−θ（E(θ̂) が存在するとき。母数の値ごとに決まる。期待値は、標本の選び方と、測り方・回答を含むデータの取り方の全体についてとる）。0 でなければ、推定値はくり返したときに平均として一方の向きにずれる。応募した人だけを調べるなど、選ばれ方の確率が分からない取り方でも、選ばれ方を確率のモデルで表せば偏りは定まるが、その確率が分からないので大きさを見積もれない
    terms: [TERM-estimator, TERM-expect]
  short: 調査や推定の結果が、真の値から一定の向きにずれること
  definition: 推定量 θ̂ の期待値と、推し量りたい母数 θ との差 E(θ̂)−θ。0 でなければ、同じ取り方をくり返したとき、推定値は平均として一方の向きにずれる。
  version: 1
  formulas:
  - id: F-bias-def
    label: 偏りの定義
    symbols:
    - symbol: b
      meaning: 推定量の偏り（バイアス）
      key: b
      concept: TERM-bias
      kind: value
    - symbol: E( )
      meaning: 期待値（くり返したときの平均。標本の選び方と、測り方・回答を含む取り方の全体について）
      key: E
      concept: TERM-expect
    - symbol: θ̂
      meaning: 標本から計算する推定量
      key: thetahat
      concept: TERM-estimator
      kind: rv
    - symbol: θ
      meaning: 推し量りたい母数（母集団の平均など）
      key: theta
      concept: TERM-parameter
      kind: param
    tree:
      op: eq
      args:
      - sym: b
      - op: sub
        args:
        - op: fn
          name: E
          args:
          - sym: thetahat
        - sym: theta
    parts:
    - path:
      - 1
      - 0
      name: くり返しの平均
      meaning: 同じ取り方をくり返したときの推定値の平均
    - path:
      - 1
      - 1
      name: 本当の値
      meaning: 推し量りたい母数。差が0なら、平均としてずれない
  principle: 偏りは、くり返したときの平均のずれで、1回の推定値の誤差とは別のもの。標本を大きくすれば小さくなる偶然のばらつきと違い、取り方（抽出枠の漏れ・無回答・応募した人だけの回答など）から来る偏りは、標本を大きくしても縮まない。だから、ばらつき（標準誤差）と偏りを分けて考える。
  conditions:
    math:
    - text: 推定量の期待値 E(θ̂) が存在する
      kind: 要件
      outside: 偏りが定まらない
    data:
    - 選ばれ方の確率が分からない取り方（自分から応募した人・回答した人だけ・枠の漏れ）では、偏りの向きを考えても大きさは見積もれない。誰が抜けているか、抜けた人の値は大きい側か小さい側かを書く
  example: 5店の廃棄数 3・5・7・9・11 個（母集団の平均 7）のうち、11個の店が台帳に載っていない。台帳の4店から2店を単純無作為抽出すると、標本平均の期待値は 4店の平均の6で、偏りは 6−7＝−1。2店を選んでも4店を全部調べても、偏りは −1 のまま。
  counterexample: 買った（1）・買わない（0）の客から2人を選び、「何人に1人が買うか」を 1÷（標本の購入率）で推し量る。2人とも買わない標本が0でない確率で出て 1÷0 になる。これを限りなく大きい値とみなしても、推定量の期待値は限りなく大きくなって存在せず、偏りが定まらない。
  misconceptions:
  - misconception: 標本を大きくすれば、取り方の偏りも小さくなる
    correction: 標本を大きくして小さくなるのは偶然のばらつき。台帳に載らない店や答えない人の分のずれ（取り方から来る偏り）は、何店・何人選んでも残る
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - (3 + 5 + 7 + 9) / 4 == 6 and (3 + 5 + 7 + 9 + 11) / 5 == 7
  - math.isclose(sum((a + b) / 2 for a, b in [(3, 5), (3, 7), (3, 9), (5, 7), (5, 9), (7, 9)]) / 6, 6)
- id: TERM-qual
  name: 質的変数
  en: qualitative variable
  category: データと変数
  forms: [function]
  basis:
    text: 個体（調べる対象の1つ1つ）ごとに値を1つ対応させる変数のうち、尺度が名義尺度か順序尺度のもの。値は分類（カテゴリ）を表し、数字で書いても値どうしの足し算・引き算に意味がない
    terms: [TERM-scale]
  short: 値が分類（性別・血液型など）を表し、そのままでは足したり平均したりできない変数
  definition: 個体ごとの値が分類（カテゴリ）を表す変数。尺度は名義尺度か順序尺度で、数字で書いても値どうしの足し算・引き算に意味がない。
  version: 1
  principle: 分類を表す値は、同じ分類に入る個体を数えて（度数・割合）要約する。順序尺度なら、大小の順を使って、真ん中の位置が1つの段階に決まるときは中央値まで言える。分類に数字を付けて平均しても、その数は付け方で変わるので、分類そのものの性質ではない（値が2つしかない分類だけは、0 と 1 を付けた平均が、1 を付けた分類の割合になる）。
  conditions:
    math:
    - text: 分類が互いに重ならず、どの個体もちょうど1つの分類に入る
      kind: 要件
      outside: 分類ごとの度数を足しても個体の数にならず、割合の合計が100%にならない（「よく買う売場」を複数選べるアンケート。1人が2つ選べば2回数えられる）
    data:
    - 数字のコード（部門コード・店番・JAN）は、数字でも質的。合計や平均を出さず、件数や構成比で集計する
    - 数量を区切って記録した値（年代・価格帯）は、元が量的でも、記録した後は順序のある分類として扱うことになる
  example: 売場の部門（総菜・青果・日配）や鮮度ランク（A・B・C）。部門ごとのレシート数や、鮮度ランク A の割合で要約する。鮮度ランクは順序があるので、真ん中の位置が1つのランクに決まれば、そのランクが中央値になる。
  counterexample: 部門コード 10・20・30 の3部門を足して3で割ると 20 になるが、「20 は真ん中の部門」という意味はない。コードを 1・2・3 に振り直すと平均は 2 になり、付け方だけで値が変わる。
  misconceptions:
  - misconception: 数字で記録されていれば量的変数
    correction: 値が分類を表すなら、数字で書いても質的変数。店番・郵便番号・部門コードの合計や平均には意味がない
  sources:
  - source: 公式2級範囲表
    locator: データの記述（データの種類）
  checks:
  - Fraction(10+20+30, 3) == 20 and Fraction(1+2+3, 3) == 2
- id: TERM-quant
  name: 量的変数
  en: quantitative variable
  category: データと変数
  forms: [function]
  basis:
    text: 個体（調べる対象の1つ1つ）ごとに値を1つ対応させる変数のうち、尺度が間隔尺度か比例尺度のもの。値は数量を表し、値どうしの差に意味がある（比例尺度なら比にも意味がある）
    terms: [TERM-scale]
  short: 値が数量（長さ・金額など）を表し、足したり平均したりできる変数
  definition: 個体ごとの値が数量を表す変数。尺度は間隔尺度か比例尺度で、値どうしの差に意味がある（比例尺度なら比にも意味がある）。数え上げる値（個数）は離散型、途中の値も取れる値（重さ・時間）は連続型。
  version: 1
  principle: 差に同じ意味があるので、値を足して平均を出し、平均からの差（偏差）でばらつきを測れる。何倍と言えるかは、0 が「その量が無い」を表す比例尺度かどうかで決まる。間隔尺度（気温℃・西暦）では、差は言えても比は単位の選び方で変わる。
  conditions:
    math:
    - text: すべての個体の値が、同じ単位・同じ測り方で記録されている
      kind: 要件
      outside: 値どうしの差や平均の意味がなくなる（kg と g が混ざった重さの列を平均すると、どちらの単位の量でもない数になる）
    data:
    - 比（何倍）を言うのは比例尺度（0 が「無い」を表す）のときだけ。間隔尺度（10℃と20℃は、℃ では2倍、K では約1.035倍）では差だけを言う
    - 順序のデータに点を付けても、段階の間隔が等しいとみなさない限り、平均の意味は付けた点で変わる。量的変数として扱うなら、その仮定を書く
    - 整数で記録した値でも、元が途中の値を取れる量なら連続型（体重を 65kg と丸めて書いても、体重は連続型）。表示の丸めで離散か連続かを決めない
  example: 販売個数（比例・離散）、商品の重さ（比例・連続）、気温℃（間隔・連続）。販売個数は「20個は10個の2倍」と言え、気温℃は「10℃高い」とだけ言える。
  counterexample: 満足度の5段階に 1〜5 点を付けて平均すると、ラボの A店は 3.40、B店は 3.80。「とても満足」だけを 4.1 点に付け直すと B店は 3.26 になり、大小が入れ替わる。段階の間隔が等しいと言えない順序のデータは、点を付けても量的変数にはならない。
  misconceptions:
  - misconception: 量的変数なら、何倍と言える
    correction: 何倍と言えるのは比例尺度だけ。間隔尺度（気温℃・西暦）は差だけに意味がある
  sources:
  - source: 公式2級範囲表
    locator: データの記述（データの種類）
  checks:
  - Fraction(60*3 + 40*4, 100) == Fraction(34, 10) and Fraction(20*1 + 10*2 + 10*4 + 60*5, 100) == Fraction(38, 10) and abs((20*1 + 10*2 + 10*4 + 60*4.1)/100 - 3.26) < 1e-9
  - abs((20+273.15)/(10+273.15) - 1.035) < 0.001
- id: TERM-scale
  name: 尺度
  en: level of measurement
  category: データと変数
  forms: [property]
  basis:
    text: 変数の値について、意味をもつ比べ方・計算で分けた4つの段階。名義尺度（同じか違うかだけ）、順序尺度（大小の順まで）、間隔尺度（差まで。0 の位置は決め方による）、比例尺度（比まで。0 が「無い」を表す）。上の段階は、下の段階の比べ方を全部含む
  short: データの値がもつ情報の段階で、名義・順序・間隔・比例の4つがある
  definition: 変数の値について、どの比べ方・計算に意味があるかで分けた段階。名義（同じか違うか）・順序（大小の順）・間隔（差）・比例（比）の4つで、上の段階は下の段階の比べ方を全部含む。
  version: 1
  principle: 数字で書かれていても、どの計算に意味があるかは、値の決め方（何を区別したか、順番、単位と 0 の位置）で決まる。決め方を変えても（店番の振り直し・段階への点の付け方・℃→℉・kg→g）結論が変わらない計算だけが、そのデータについて意味をもつ。名義は1対1の付け替え、順序は順番を保つ（大きい値ほど大きい値に移す）付け替え、間隔は y＝ax＋b（a＞0）、比例は y＝ax（a＞0）で変わらない結論を見る。
  conditions:
    math:
    - text: 値の決め方（何を区別するか・順番・単位と 0 の位置）が決まっている
      kind: 要件
      outside: 記録の仕方が決まらないと、尺度も決まらない。同じ年齢でも、1歳ごとに記録すれば比例尺度、年代（20代・30代）にまとめて記録すれば順の分かる分類になる
    - text: 比例尺度と言うには、0 が「その量が無い」ことを表す
      kind: 要件
      outside: 比は単位の選び方で変わり、意味をもたない間隔尺度になる（10℃と20℃は、K では約1.035倍、℉ では1.36倍）
    data:
    - 数字で書かれていることと、量であることを分ける。番号（店番・JAN）は数字でも名義
    - 順序のデータ（満足度の5段階）に点を付けて平均するときは、段階の間隔が等しいとみなす仮定を置いたことを書く
  example: 売場のデータで、店番は名義、鮮度ランクは順序、開店時刻は間隔、販売個数は比例。販売個数は「20個は10個の2倍」と言えるが、店番の平均（たとえば 305）には意味がなく、開店時刻は差（何時間後）だけが言える。
  counterexample: 10℃と20℃は、℃ では2倍だが、K では約1.035倍、℉ では1.36倍になる。0℃ が「温度が無い」ではない間隔尺度なので、「2倍暑い」とは言えない。kg と g で表した重さなら、どちらでも2倍のまま。
  misconceptions:
  - misconception: 4つの尺度は、それぞれ別の計算が使える
    correction: 上の段階は下の段階の比べ方を全部含む。比例尺度のデータでも、同じか違うか・大小・差を使ってよい。下の段階のデータに上の段階の計算（順序のデータの差・間隔のデータの比）を使うと、意味がなくなる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（データの種類）
  checks:
  - abs((20+273.15)/(10+273.15) - 1.035) < 0.001 and abs((20*1.8+32)/(10*1.8+32) - 1.36) < 1e-9 and Fraction(20*1000, 10*1000) == 2
- id: TERM-mode
  name: 最頻値
  en: mode
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データに現れる値のうち、現れる回数（度数）がいちばん多い値（いちばん多い値が2つ以上あれば、それぞれが最頻値。度数分布表から読むときは、度数がいちばん多い階級の階級値を同じ名前で呼ぶ）
    terms: []
  short: データの中でいちばん多く現れる値（度数分布では度数が最大の階級の階級値）
  definition: データの中でいちばん多く現れる値。度数がいちばん多い値が2つ以上あれば、それぞれが最頻値。度数分布表から読むときは、度数がいちばん多い階級の階級値を最頻値とする。
  version: 1
  principle: 値が同じか違うかを数えるだけで決まるので、名義尺度のデータ（部門・色）にも使える。いちばん多い値がどれかだけを見るので、ほかの値の大きさや外れ値には動かない。その代わり、度数の差がわずかだと少しの増減で入れ替わり、度数分布表から読むときは階級の分け方で変わる。
  conditions:
    math:
    - text: 度数分布表から読むときは、階級の分け方を決めてある
      kind: 要件
      outside: 同じデータでも、階級の幅や区切りを変えると最頻値（階級値）が変わる
    data:
    - 度数がいちばん多い値が2つ以上あると、最頻値も2つ以上になる（どれも最頻値）。1つの代表値として使うなら、いちばん多い値が1つだけかを確かめ、2つ以上ならそれを全部書く
    - 細かく測った連続の量（滞在時間を秒まで）では、ほとんどの値が1回ずつしか現れず、最頻値に意味がなくなる。階級にまとめ、その分け方と組にして書く
  example: 1日に売れた靴のサイズが、24.0 が3足、24.5 が7足、25.0 が5足、26.0 が2足なら、最頻値は 24.5。部門ごとのレシート数（総菜・青果・日配）のような名義のデータでも、いちばん多い部門が最頻値になる。
  counterexample: 来店客10人の滞在時間を秒まで測ると、同じ値が1つもなく、どの値も度数1なので、定義どおりに読むと10個の値が全部最頻値になり、代表値として何も絞れない。5分ごとの階級にまとめれば1つに決まることがあるが、区切りを変えると別の階級になりうる。
  misconceptions:
  - misconception: 最頻値は、半分以上の人がとった値
    correction: 最頻値はほかの値より多いだけで、半分に届かないことがふつう。靴の例では、24.5 は17足のうち7足
  sources:
  - source: 公式2級範囲表
    locator: データの記述（代表値）
  checks:
  - 3+7+5+2 == 17 and max([3, 7, 5, 2]) == 7 and 7 < 17/2
- id: TERM-median
  name: 中央値
  en: median
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 値に順序があるデータ x₁, …, xₙ（n≧1。順序があることは定義の要件）を小さい順に並べたとき、真ん中の位置の値（n が奇数なら (n＋1)/2 番目、偶数なら n/2 番目と n/2＋1 番目の2つの値の和の半分。偶数で真ん中の2つの値が違うときは、値が量的であることも要件で、順序だけのデータではこの定義では定まらない）
    terms: []
  short: データを小さい順に並べたとき、真ん中にくる値
  definition: 値に順序があるデータを小さい順に並べたとき、真ん中の位置の値。個数 n が奇数なら (n＋1)/2 番目の値、偶数なら n/2 番目と n/2＋1 番目の2つの値の平均。
  version: 1
  principle: 並べた位置だけで決まるので、端の値がどれだけ大きくなっても、並びの順が変わらない限り動かない。順序だけのデータでも、真ん中の位置に1つの値がくれば決まり、順番を保ったまま値の付け方を変えても（満足度の点の付け方）、真ん中にくる段階は変わらない。
  conditions:
    math:
    - text: 値に順序がある（順序尺度以上）
      kind: 要件
      outside: 並べる順が決まらないので、真ん中の位置もない（部門・店番。店番を小さい順に並べた真ん中は、番号の付け方で変わる）
    - text: n が偶数で、真ん中の2つの値が違うときは、値が量的である
      kind: 要件
      outside: 2つの値の平均が出せず、この定義では定まらない（満足度で「普通」と「満足」が真ん中の2つにくるとき）
    data:
    - 同じ値が多いデータ（段階の少ない満足度）では、中央値は回答が少し動いても変わらず、違いを見落とすことがある。各段階の割合もあわせて見る
  example: 5店の今日の廃棄個数が 3, 4, 5, 6, 40 なら、中央値は 5（平均は 11.6）。40個の店がもっと多く捨てても、中央値は 5 のまま。
  counterexample: 満足度（不満・普通・満足）を4人に聞き、普通・普通・満足・満足だったとき、真ん中の2つは「普通」と「満足」で、その平均はこの定義では決まらない。順序だけのデータに、2つの値を足して2で割る計算をすることになるから。
  misconceptions:
  - misconception: 中央値は外れ値にまったく動かない
    correction: 動かないのは、端の値の大きさが変わっても並びの順が変わらないとき。値が加わったり抜けたりして個数や並びが変われば、中央値も動く
  - misconception: 外れ値に強いので、中央値はいつも平均より良い代表値
    correction: 合計や予算を出すときは平均が要る（平均×個数＝合計）。中央値×個数は合計にならない。何に使うかで代表値を選ぶ
  sources:
  - source: 公式2級範囲表
    locator: データの記述（代表値）
  checks:
  - Fraction(3+4+5+6+40, 5) == Fraction(58, 5) and sorted([3, 4, 5, 6, 40])[2] == 5
- id: TERM-freqtable
  name: 度数分布表
  en: frequency table
  category: 図表
  forms: [function]   # 階級 → 度数。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 量的なデータ x₁, …, xₙ（n≧1。値が数であることは定義の要件）について、互いに重ならず、すべての値を含む区間（階級）c₁, …, c_k を小さい順に決め、各階級 c_j に入る値の個数（度数）f_j を階級の順に並べた表（f₁＋…＋f_k＝n。相対度数 f_j/n・累積度数を添えることが多い）
  short: データを階級に分け、各階級に入るデータの個数（度数）を並べた表
  definition: 量的なデータを、互いに重ならずすべての値を含む区間（階級）に分け、各階級に入る値の個数（度数）を階級の順に並べた表。相対度数（度数÷総数）や累積度数を添えることが多い。
  version: 1
  principle: 1つ1つの値を手放して「どの区間に何個」だけを残すことで、たくさんの値の集まり方（どこに多く、どちらに広がるか）が読めるようになる。その代わり、同じ階級の中の値の違いは消え、階級の幅と区切りの置き方で見え方が変わる。
  conditions:
    math:
    - text: 値が量的（数直線の上に並ぶ数）で、n≧1
      kind: 要件
      outside: 階級を数直線の上の区間として決められない。部門のような名義のデータは、分類ごとに数えた集計表にする（この表の形の度数分布表としては扱えない）
    data:
    - 境目の値をどちらの階級に入れるか（以上・未満）を表に書く。書かないと、同じデータから人によって違う表ができることがある
    - 階級の幅や区切りの位置を変えると、山の位置や数が違って見えることがある。形の結論は、2つ以上の区切り方で確かめる
    - 総数の違う2つのデータ（20日と30日）を比べるときは、度数ではなく相対度数で比べる
  example: 20日の売上を10万円ごとの「以上・未満」の階級に分けると、10〜20 が4日、20〜30 が9日、30〜40 が5日（30万円ちょうどの日はここに入る）、40〜50 が1日、50〜60 が1日で、合計20日。20万円台に集まり、大きい側に裾が伸びている。
  counterexample: 20日の売上の階級を「10〜20・20〜30…」とだけ書き、30万円ちょうどの日をどちらに入れるかを決めないと、「以上・未満」で数えた人は 20〜30 が9日・30〜40 が5日、「より大きく・以下」で数えた人は 20〜30 が10日・30〜40 が4日になり、同じデータから違う表ができる。
  misconceptions:
  - misconception: 度数分布表から、元のデータの平均がちょうど出せる
    correction: 階級の真ん中の値（階級値）で計算した平均は近似。同じ階級の中の値の違いが消えているので、元の値の平均とずれうる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（度数分布とヒストグラム）
  checks:
  - 4+9+5+1+1 == 20 and Fraction(9, 20) == Fraction(45, 100)
  - sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if 20 < x <= 30) == 10 and sum(1 for x in [12,15,18,19,21,22,22,24,25,26,27,28,29,30,31,33,35,38,42,55] if 30 < x <= 40) == 4
- id: TERM-hist
  name: ヒストグラム
  en: histogram
  category: 図表
  forms: [function, random_set]   # 基準はデータを固定した階段の関数。標本から作って密度を推定するとき（④-30・推定する）は偶然で決まる関数として同じ名前で呼ぶ（① の 3。#342）
  basis:
    text: 度数分布表（階級 c_j は有界で幅 w_j は 0＜w_j＜∞、隣り合う階級の境目が一致する。度数 f_j、総数 n）について、各階級の上に、面積がその階級の相対度数 f_j/n に等しい柱（高さ f_j/(n·w_j)）を隙間なく並べた図。x が c_j に入るとき h(x)＝f_j/(n·w_j)、どの階級にも入らないとき h(x)＝0 とする階段の関数として読め、すべての値が階級に入るとき柱の面積の合計は1になる（階級の幅がそろうとき、縦軸に度数をとって描くのは、縦の目盛りだけが違う同じ図）
    terms: [TERM-freqtable]
  short: 度数分布表の各階級の度数を、隙間のない柱の面積で表した図
  definition: 度数分布表の各階級の上に、面積がその階級の度数（相対度数）に比例する柱を、すき間なく並べた図。階級の幅がそろうときは、柱の高さを度数にして描いてよい。
  version: 1
  principle: 量的なデータの階級は数直線の上で隣り合っているので、柱をすき間なく並べ、面積で度数を表す。幅の違う階級が混ざるときは、高さを度数÷幅（度数密度）にしないと、幅の広い階級が多く見える。形（山の位置と数・裾の向き）を見る図で、1つ1つの値と、階級の中の値の違いは見えない。
  conditions:
    math:
    - text: どの階級も、両端の決まった区間である（幅が有限）
      kind: 要件
      outside: 「50以上」のように端の開いた階級は幅が決まらず、柱の高さ（度数÷幅）が決まらないので、そのままでは描けない
    data:
    - 名義のデータ（部門）は、柱をすき間なく並べると、並べた順に意味があるように見える。棒を離した棒グラフにする
    - 階級の幅を変えると、見える形が変わる。山が1つか2つか、裾がどちらに伸びるかは、幅を変えて確かめる
  example: 20日の売上の度数分布表から描くと、20〜30 の柱がいちばん高く、右（大きい側）に低い柱が続く。右に裾が伸びた形と読む。
  counterexample: 20日の売上を 10〜20・20〜30・30〜60 の3つの階級にまとめ、30〜60 の度数7をそのまま高さにすると、幅が3倍の柱の面積は 7×3＝21 で、20〜30 の柱（9）の2倍を超える。30〜60 の日数は 20〜30 より少ないのに、多いように見える。高さを 7÷3≒2.3（10万円あたりの日数）にすれば、面積が7日分になる（相対度数で描くなら、さらに20で割る）。
  misconceptions:
  - misconception: ヒストグラムと棒グラフは同じ図
    correction: 棒グラフは分類ごとの量を、棒を離して並べた図で、並べる順は自由。ヒストグラムは量を区切った階級の柱を、すき間なく並べた図で、柱の面積が度数を表す
  sources:
  - source: 公式2級範囲表
    locator: データの記述（度数分布とヒストグラム）
  checks:
  - 5+1+1 == 7 and 7*3 == 21 and 21 > 2*9 and abs(7/3 - 2.3) < 0.05
- id: TERM-boxplot
  name: 箱ひげ図
  en: box plot
  category: 図表
  forms: [number]   # 5つの数の組。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 量的なデータ（n≧2）の最小値・第1四分位数 Q₁・第2四分位数 Q₂（中央値）・第3四分位数 Q₃・最大値の5つの数を、1本の数直線の上に、Q₁ から Q₃ までの箱、箱の中の Q₂ の線、箱の両端から最小値と最大値までのひげで表した図（柵 Q₁−1.5(Q₃−Q₁)・Q₃＋1.5(Q₃−Q₁) の外の値を外れ値として点で分け、ひげを柵の内側のいちばん外の値までにした図も、同じ名前で呼ぶ）
    terms: [TERM-quartile]
  short: 最小値・第1四分位数・中央値・第3四分位数・最大値で、分布の位置と広がりを表した図
  definition: 最小値・第1四分位数・中央値・第3四分位数・最大値の5つの数を、1本の数直線の上に、Q₁ から Q₃ までの箱、箱の中の中央値の線、箱の両端から最小値・最大値までのひげで表した図。柵の外の値を外れ値として点で描き、ひげを柵の内側のいちばん外の値までにすることもある。
  version: 1
  principle: 5つの数だけを使うので、店舗別・月別のように多くの分布を並べて、真ん中（中央値）、真ん中のおよそ半分の広がり（箱の長さ）、偏り（中央値が箱のどちら寄りか・ひげの長さ）をすばやく比べられる。その代わり、山の数や、箱の中で値がどう集まっているかは見えない。
  conditions:
    math:
    - text: 値が量的で、四分位数が決まる（n≧2）
      kind: 要件
      outside: 5つの数が決まらず、箱ひげ図は描けない（順序だけのデータでは、半分の中央値が2つの段階の間になると定まらない）
    data:
    - ひげの端を最小値・最大値にしたか、柵の内側のいちばん外の値にしたかを図に添える。添えないと、同じデータのひげの長さが図によって違い、読む人が取り違える
    - 個数の少ないデータ（10個に満たない）では、四分位数が1つ2つの値で大きく動く。値の点を重ねて描く
    - 山が2つあるデータでも、箱は1つになる。形を見たいときは、ヒストグラムと並べる
  example: 20日の売上は、最小 12、Q₁ 21.5、中央値 26.5、Q₃ 32、最大 55。55 は上の柵 47.75 の外なので点で描き、ひげは 42 まで伸ばす。箱とひげはほぼ左右対称で、大きい側の裾は、柵の外の 55 の点に表れる。
  counterexample: A（10, 11, 11, 12, 28, 29, 29, 30）と B（10, 11, 11, 19, 21, 29, 29, 30）は、どちらも最小 10・Q₁ 11・中央値 20・Q₃ 29・最大 30 で、箱ひげ図はまったく同じになる。けれども A は 12 と 28 の間に値が1つもない2つの山で、B は真ん中にも値がある。箱ひげ図は、この違いを表さない。
  misconceptions:
  - misconception: 箱の中で、長いほうの側にデータが多い
    correction: 中央値で分けた箱の左右には、どちらも値のおよそ4分の1ずつが入る。長いほうは、値がまばらに散らばっているだけ
  sources:
  - source: 公式2級範囲表
    locator: データの記述（箱ひげ図）
  checks:
  - 26.5 - 21.5 < 32 - 26.5 and 42 - 32 > 21.5 - 12
  - sorted([10, 11, 11, 12, 28, 29, 29, 30])[1:3] == [11, 11] and (12+28)/2 == 20 and (19+21)/2 == 20 and sorted([10, 11, 11, 19, 21, 29, 29, 30])[5:7] == [29, 29]
- id: TERM-quartile
  name: 四分位数
  en: quartile
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データを小さい順に並べ、中央値を第2四分位数 Q₂、中央値より下の半分の中央値を第1四分位数 Q₁、上の半分の中央値を第3四分位数 Q₃ とする（n が奇数のときは、真ん中の値を両方の半分から除く。n≧2 で、値が量的であることは定義の要件）
    terms: [TERM-median]
  short: データを小さい順に並べて4等分する位置の値（第1・第2・第3四分位数）
  definition: データを小さい順に並べて、4等分する位置の値。中央値が第2四分位数 Q₂。この教材では、中央値より下の半分の中央値を第1四分位数 Q₁、上の半分の中央値を第3四分位数 Q₃ とする（n が奇数なら、真ん中の値はどちらの半分にも入れない）。
  version: 1
  principle: 並べた位置だけで決まるので、端の値（外れ値）が大きくなっても、並びの順が変わらない限り動かない（n が5以下だと、Q₁・Q₃ に最小値・最大値そのものが入ることがあり、この限りではない）。Q₁ から Q₃ までに、真ん中のおよそ半分の値が入る。決め方（真ん中の値を半分に入れるか、間を比例で埋めるか）には流儀があり、同じデータでも値が少し違うことがある。
  conditions:
    math:
    - text: 値が量的で、n≧2
      kind: 要件
      outside: n＝1 では下と上の半分がない。順序だけのデータでは、半分の中央値が2つの段階の間になると、平均が出せず定まらない
    data:
    - 表計算ソフトや電卓の四分位数は、決め方が教材と違うことがある（1＋p(n−1) 番目を線形補間で求める決め方では、1〜10 の10個の Q₁ は 3.25。この教材では 3）。補間で出した値は、この教材の四分位数ではないので、答えが少しずれたら決め方を確かめる
  example: 20日の売上では、下の半分10個（12〜26）の中央値が Q₁＝(21＋22)÷2＝21.5、上の半分10個（27〜55）の中央値が Q₃＝(31＋33)÷2＝32。
  counterexample: 7個のデータ 1, 2, 3, 4, 5, 6, 7 で、真ん中の 4 をどちらの半分にも入れないと Q₁ は 1, 2, 3 の中央値で 2、4 を両方の半分に入れると 1, 2, 3, 4 の中央値で 2.5。決め方を書かずに Q₁ の値を比べることはできない。
  misconceptions:
  - misconception: Q₁ と Q₃ の間には、ちょうど半分の値がある
    correction: およそ半分で、ちょうどとは限らない。同じ値が多いときや個数が少ないときは、半分からずれる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（箱ひげ図）
  checks:
  - (21+22)/2 == 21.5 and (31+33)/2 == 32 and (2+3)/2 == 2.5
  - 1 + 0.25*(10-1) == 3.25 and statistics.median([1, 2, 3, 4, 5]) == 3
- id: TERM-iqr
  name: 四分位範囲
  en: interquartile range
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 第3四分位数から第1四分位数を引いた値 Q₃−Q₁（真ん中の半分のデータの広がり）
    terms: [TERM-quartile]
  short: 第3四分位数から第1四分位数を引いた値で、真ん中の半分のデータの広がり
  definition: 第3四分位数から第1四分位数を引いた値 Q₃−Q₁。真ん中の半分（およそ半分。ちょうどとは限らない）の値が入る範囲の長さで、箱ひげ図の箱の長さ。
  version: 1
  principle: 個数がある程度あれば端の値を使わないので、外れ値1つで大きく変わる範囲（最大値−最小値）と違って、外れ値に左右されにくいばらつきの物差しになる。外れ値を決める柵の物差しに使えるのはこのため（物差しが外れ値自身で伸びない）。その代わり、外側の半分の値の散らばりは表さない。
  conditions:
    math:
    - text: 外れ値に左右されにくいと言うには、n≧6 で、飛び抜けた値が片側で全体の4分の1より少ない
      kind: 要件
      outside: n が5以下だと Q₁・Q₃ に最小値・最大値そのものが入ることがあり、飛び抜けた値が4分の1ほどになると Q₃ がその値の側に入り込む。どちらも、四分位範囲が端の値で伸びる
    data:
    - 2つのデータのばらつきを比べるときは、同じ決め方の四分位数で計算する
  example: 20日の売上では IQR＝32−21.5＝10.5（万円）。最大の 55 を 65 に直しても IQR は 10.5 のままだが、範囲は 55−12＝43 から 65−12＝53 に伸びる。
  counterexample: A（10, 20, 21, 22, 23, 24, 25, 40）と B（19, 20, 21, 22, 23, 24, 25, 26）は、どちらも Q₁＝20.5・Q₃＝24.5 で、IQR は 4。けれども範囲は A が 30、B が 7 で、A の端の値はずっと散らばっている。
  misconceptions:
  - misconception: IQR が同じなら、ばらつきも同じ
    correction: IQR が表すのは真ん中のおよそ半分の広がりだけ。外側の値の散らばりは IQR に出ないので、範囲や箱ひげ図のひげもあわせて見る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - 32 - 21.5 == 10.5 and 55 - 12 == 43 and 65 - 12 == 53
  - (20+21)/2 == 20.5 and (24+25)/2 == 24.5 and 40 - 10 == 30 and 26 - 19 == 7
- id: TERM-outlier
  name: 外れ値
  en: outlier
  category: 要約（代表値・ばらつき）
  forms: [property]
  basis:
    text: データの値のうち、決めた基準でほかの値から大きく離れているとみなすもの。この教材の基準は箱ひげ図の柵で、Q₁−1.5×(Q₃−Q₁) より小さいか、Q₃＋1.5×(Q₃−Q₁) より大きい値（z の大きさなどほかの判定は、外れ値の候補を見つける別の目安で、この定義の外）
    terms: [TERM-iqr]
  short: ほかのデータから大きく離れた値（箱ひげ図では、箱から四分位範囲の1.5倍より外の値など）
  definition: ほかの値から大きく離れているとみなす値。この教材では箱ひげ図の柵を基準にし、Q₁−1.5×IQR より小さい値か、Q₃＋1.5×IQR より大きい値を外れ値とする（本文では、誤りかどうかを確かめる前の値なので「外れ値候補」とも呼ぶ）。
  version: 1
  principle: 真ん中の半分の広がり（IQR）を物差しにして、その1.5倍より外を「飛び抜けている」とみなす。飛び抜けた値が少ないうちは、物差しに外れ値自身が入らないので、飛び抜けた値が大きいほど物差しも伸びて見つけにくくなる、ということが起きない。1.5 は慣習で決めた目安で、外れ値は「誤り」ではなく「理由を確かめる候補」。
  conditions:
    math:
    - text: 飛び抜けた値が、片側で全体の4分の1より少ない
      kind: 要件
      outside: Q₃（または Q₁）が飛び抜けた値の側に入り込み、IQR が伸びて柵が外へ逃げるので、飛び抜けた値が外れ値として見つからないことがある
    data:
    - z の大きさで決めるなど別の目安では、同じ値でも外れ値かどうかが違うことがある。どの基準で決めたかを添える
    - 外れ値を見つけたら、消す前に理由を確かめる（入力の誤りか、セールの日のような本当の値か）。本当の値なら残し、含めた結論と除いた結論を並べる
    - 大きい側に裾の長い分布（売上・所得）では、柵の外の値がふつうに出る。外れ値が多いときは、先に分布の形を見る
  example: 20日の売上では、柵が 21.5−15.75＝5.75 と 32＋15.75＝47.75 で、55 が外れ値。55 の日に何があったか（セール・イベント）を確かめる。
  counterexample: 8日の来店客数 47, 49, 51, 52, 55, 58, 60, 120 では、上の柵は 72.5 で、120人の日が外れ値になる。ところが 60人の日も 120人だった（週末が2日あった）とすると、Q₃＝(58＋120)÷2＝89、IQR＝39、上の柵は 147.5 に広がり、120人の2日はどちらも外れ値でなくなる。飛び抜けた日が増えるほど、柵の基準では見つけにくくなる。
  misconceptions:
  - misconception: 外れ値は誤りなので、消してから計算する
    correction: 外れ値は確かめる候補で、本当の値のこともある。理由を確かめずに消すと、セールの日のような大事な情報を捨てることになる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（箱ひげ図）
  checks:
  - 1.5*10.5 == 15.75 and 21.5 - 15.75 == 5.75 and 32 + 15.75 == 47.75 and 55 > 47.75
  - (49+51)/2 == 50 and (58+60)/2 == 59 and 59 + 1.5*9 == 72.5 and (58+120)/2 == 89 and 89 - 50 == 39 and 89 + 1.5*39 == 147.5
- id: TERM-ratio
  name: 割合
  en: ratio
  category: データと変数
  forms: [number]
  basis:
    text: もとにする量 B に対する、比べる量 A の比 A/B（B を1とみた A の大きさ。100倍すると百分率（%）。A が B の一部なら 0 以上 1 以下、前年比のように A が B より大きければ 1 を超える）。B＞0 は定義の要件
  short: 全体に対する部分の大きさを、全体を1（または100%）として表した値
  definition: もとにする量（全体）を1として、比べる量がどれだけにあたるかを表した値。100倍すると百分率（%）になる。
  version: 1
  principle: 割合は「何を全体（分母）にしたか」で決まる。同じ80人の購入でも、来店客400人に対してなら0.2、声をかけた100人に対してなら0.8。割合どうしを比べたり平均したりするときは、分母が何で、どれだけの大きさかを一緒に見る。
  conditions:
    math:
    - text: もとにする量 B が正（B＞0）
      kind: 要件
      outside: 割合が定まらない（0 で割ることになる）
    data:
    - 何を全体（分母）にしたかを書く。分母の違う割合を並べて比べない
    - 割合を合わせるときは、割合の平均ではなく、分子どうし・分母どうしを足してから割る
  example: 来店客400人のうち80人が買ったなら、購入率は 80÷400＝0.2（20%）。
  counterexample: 来店客が0人の日の購入率は、もとにする量が0なので、0 でも 1 でもなく定まらない。
  misconceptions:
  - misconception: 店ごとの割合を平均すれば、全体の割合になる
    correction: 店A が10人中5人（0.5）、店B が90人中9人（0.1）なら、割合の平均は0.3 だが、全体は 14÷100＝0.14。人数の違う店の割合は、人数で重みをつけて合わせる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（割合）
  checks:
  - 80/400 == 0.2 and 5/10 == 0.5 and 9/90 == 0.1 and (0.5+0.1)/2 == 0.3 and (5+9)/(10+90) == 0.14
- id: TERM-point
  name: パーセントポイント
  en: percentage point
  category: データと変数
  forms: [number]
  basis:
    text: 2つの割合 p₁・p₂ を百分率で表したときの差 p₂−p₁ を、その数で表したもの（単位はポイント。10% から 12% は 2 ポイント。前の割合を基準にした相対的な変化 (p₂−p₁)/p₁（p₁＞0 のとき。10% から 12% は 20% 増）とは別）
    terms: [TERM-ratio]
  short: 2つの割合（%）の差を、%どうしの引き算で表した数（単位はポイント）
  definition: 2つの割合を百分率で表したときの差を、その数で表したもの。単位はポイント。10% から 12% になれば 2 ポイント増。前の割合を基準にした変化（(12−10)÷10 で 20% 増）とは別のもの。
  version: 1
  principle: 割合どうしの変化には2つの言い方がある。差を見るならポイント（p₂−p₁）、前の割合を基準にした比を見るなら %（(p₂−p₁)÷p₁）。もとの割合が小さいほど、同じポイント差でも % の変化は大きくなる（1% から 2% は 1 ポイントで 100% 増、50% から 51% は 1 ポイントで 2% 増）。どちらで言ったかを書かないと、同じ数が違う大きさに読まれる。
  conditions:
    math:
    - text: 比べる2つの値 p₁・p₂ がどちらも割合（百分率で表す）
      kind: 要件
      outside: ポイントで表す意味がない（金額や人数の差は、そのまま円や人で言う）
    data:
    - 2つの割合の分母（何を全体にしたか）がそろっているかを確かめる。分母の違う割合の差は、ポイントで言っても比べられない
    - 報告では、ポイントの差と、もとの割合（または % の変化）を並べる
  example: 会員の割合が昨年20%、今年25%なら、差は 25−20＝5 ポイント。前年を基準にした変化は 5÷20＝0.25 で 25% 増。
  counterexample: 売上が100万円から120万円になったことを「20ポイント増」と言うのは誤り。比べている値が割合ではなく金額なので、差は20万円、変化は20%増と言う。
  misconceptions:
  - misconception: 10% から 12% は「2% 増」
    correction: 差は 2 ポイント。% で言うなら、前の10%を基準にして 2÷10＝20% 増
  sources:
  - source: 公式2級範囲表
    locator: データの記述（割合）
  checks:
  - 25-20 == 5 and 5/20 == 0.25 and 12-10 == 2 and 2/10 == 0.2 and (2-1)/1 == 1 and abs((51-50)/50 - 0.02) < 1e-12
- id: TERM-dev
  name: 偏差
  en: deviation
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ の各値 xᵢ から平均 x̄ を引いた値 xᵢ−x̄（平均からのずれ）
    terms: [TERM-mean]
  short: 1つのデータの値から平均を引いた値（平均からのずれ）
  definition: データの各値から平均を引いた値 xᵢ−x̄。その値が平均よりどれだけ大きいか（正）・小さいか（負）を表す。
  version: 1
  principle: 偏差を全部足すと必ず0になる（Σ(xᵢ−x̄)＝Σxᵢ−nx̄＝0）。平均より上のずれと下のずれがちょうど打ち消し合うので、偏差の合計や平均ではばらつきの大きさを測れない。そこで2乗して足す（偏差平方和）か、絶対値をとる。偏差はデータの単位をもつ（円の偏差は円）。
  conditions:
    math:
    - text: データが量で、平均 x̄ が定まる（n≧1）
      kind: 要件
      outside: 偏差が定まらない（カテゴリのデータには平均がない）
    data:
    - 偏差を平均からのずれとして読むのは、平均が代表値として使えるとき。外れ値が1つあると平均がそちらに引っぱられ、ほかの全部の値の偏差が同じ向きにずれるので、外れ値がないかを先に見る
  example: 販売数 2, 4, 6 個の平均は4。偏差は −2, 0, 2 で、合計は0。偏差の2乗の和（偏差平方和）は 4＋0＋4＝8。
  counterexample: 「来店客の年代」（20代・30代…）のようなカテゴリのデータには平均がないので、偏差は作れない。年代を数（20, 30, …）に置き換えれば計算はできるが、それは置き換えた数の偏差で、カテゴリの偏差ではない。
  misconceptions:
  - misconception: 偏差の平均を見れば、ばらつきの大きさが分かる
    correction: 偏差の平均はいつも0。ばらつきは偏差を2乗して平均する（分散）か、絶対値を平均して測る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - (2+4+6)/3 == 4 and (2-4)+(4-4)+(6-4) == 0 and 4+0+4 == 8
- id: TERM-var
  name: 分散
  en: variance
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-var-def
  definition: 確率変数が期待値からどれだけばらつくかを、ずれの2乗の期待値で表した量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s1-var, purpose: ずれの2乗の期待値として分散を組み立てる}
  principle: (X−μ)² の期待値。2乗するので向きが消え、大きなずれほど重く効く。単位は元の単位の2乗になる。
  formulas:
  - id: F-var-def
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: μ
      meaning: X の期待値 E(X)
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "fn", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "mu"}]}, {"num": 2}]}], "name": "E"}, {"op": "sub", "args": [{"op": "fn", "args": [{"op": "pow", "args": [{"sym": "X"}, {"num": 2}]}], "name": "E"}, {"op": "pow", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"num": 2}]}]}]}
  - id: F-var-linear
    label: 1次式の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 掛ける定数（2乗で効く）
      key: a
      kind: const
    - symbol: b
      meaning: 足す定数（ばらつきは変えない）
      key: b
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"sym": "X"}]}, {"sym": "b"}]}], "name": "V"}, {"op": "mul", "args": [{"op": "pow", "args": [{"sym": "a"}, {"num": 2}]}, {"op": "fn", "args": [{"sym": "X"}], "name": "V"}]}]}
  - id: F-var-sum
    label: 値ごとの和（離散）
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: x
      meaning: X がとりうる値
      key: x
      kind: index
    - symbol: μ
      meaning: X の期待値 E(X)
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    - symbol: p(x)
      meaning: X が x になる確率（重み。値が飛び飛びのとき。連続なら密度 f(x) に替え、和は積分 ∫(x−μ)²f(x)dx になる）
      range: 0以上1以下・合計1
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "sum", "args": [{"op": "mul", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "x"}, {"sym": "mu"}]}, {"num": 2}]}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}], "var": "x"}]}
  conditions:
    math:
    - text: 2乗の期待値 E(X²) が有限（このとき E(X) も有限になり、E((X−μ)²) が有限の値に定まる）
      kind: 要件
      outside: この定義の分散（有限の値）としては扱えない（∞ になるか定まらない）
    data:
    - 分布の側では、確率は小さくても極端な値をとる裾があると、分散は大きくなる（2乗で効く。裾が重いと、有限の値に定まらないこともある）。データから推し量るときは、標本の中の外れ値1つで値が大きく変わるので、分布の形も一緒に見る
  example: さいころの目の分散は 91÷6−3.5²＝35/12≒2.92。
  counterexample: X＋Y の分散は、独立（または共分散が0）でなければ V(X)＋V(Y) にならない。
  misconceptions:
  - misconception: 分散は「平均からのずれの平均」
    correction: ずれをそのまま平均すると0になる。2乗してから平均する
  - misconception: 分散と標準偏差は同じ単位
    correction: 分散は元の単位の2乗。元の単位で言うなら平方根の標準偏差
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(sum(i*i for i in range(1,7)),6)-Fraction(7,2)**2==Fraction(35,12)
  - abs(35/12-2.92)<0.005
  - sum(i*i for i in range(1,7))==91
- id: TERM-unbvar
  name: 不偏分散
  en: unbiased variance
  category: 要約（代表値・ばらつき）
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ（n≧2。n≧2 は定義の要件）から作る統計量 s²＝{(X₁−X̄)²＋…＋(Xₙ−X̄)²}/(n−1)（X̄ は標本平均。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-sample-mean]
  short: 偏差の2乗の和を n−1 で割った分散で、その期待値が母分散に一致する
  definition: 偏差の2乗の和を n−1 で割った分散 s²（n≧2）。母分散 σ² を推し量るのに使い、独立に同じ分布から取るなら、その期待値はちょうど σ² になる。
  version: 1
  principle: 偏差を、母平均 μ ではなく標本平均 x̄ から測ると、x̄ は標本そのものの真ん中なので、偏差の2乗の和は μ から測るより大きくはならない。独立に同じ分布から取るとき、その不足は平均して σ² 1つ分（偏差の2乗の和の期待値は (n−1)σ²）なので、n−1 で割るとちょうど補える。n で割った分散は、平均して σ² の (n−1)/n 倍に小さく出る。
  conditions:
    math:
    - text: n は2以上
      kind: 要件
      outside: n−1＝0 で割ることになり、定義されない
    - text: X₁, …, Xₙ は独立に同じ分布に従い、分散 σ² が有限
      kind: 仮定
      claim: CLM-11
      outside: ④-11 は保証されない（E(s²)＝σ² とは限らない）
    data:
    - 電卓・表計算の「分散」が n で割るか n−1 で割るかを確かめる（VAR.P は n、VAR.S は n−1）。n が大きければ差は小さいが、n が小さいと大きい
  example: 1・3・5 の3つの値を同じ確率でとる母集団（母分散は3で割って 8/3）から、戻しながら2個取る（2個は独立に同じ分布に従う）9通りで、(1, 5) の偏差の2乗の和は (1−3)²＋(5−3)²＝8。n で割ると 4、n−1 で割ると s²＝8。9通りの s² の平均は母分散 8/3 に一致し、n で割った値の平均はその半分の 4/3。
  counterexample: 標本が1個（n＝1）だと、偏差は 0 で、偏差の2乗の和を n−1＝0 で割ることになり、不偏分散は定義されない。1個の値からは、ばらつきは推し量れない。
  misconceptions:
  - misconception: 不偏分散 s² の平方根 s も、母標準偏差 σ を平均してずれずに推し量る
    correction: 不偏なのは s² だけ。√ は曲がっているので、s² の平均が σ² でも、s の平均は σ より小さい側にずれる（s がばらつくとき）
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - (1 - 3) ** 2 + (5 - 3) ** 2 == 8 and 8 / 2 == 4 and 8 / 1 == 8
  - math.isclose(sum(((a - (a + b) / 2) ** 2 + (b - (a + b) / 2) ** 2) for a in [1, 3, 5] for b in [1, 3, 5]) / 9, 8 / 3)
  - math.isclose(sum(((a - (a + b) / 2) ** 2 + (b - (a + b) / 2) ** 2) / 2 for a in [1, 3, 5] for b in [1, 3, 5]) / 9, 4 / 3)
- id: TERM-sd
  name: 標準偏差
  en: standard deviation
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-sd-def
  definition: 分散の正の平方根。ばらつきを元の単位で表す。
  version: 1
  principle: 分散は単位が2乗になるので、平方根をとって元の単位に戻す。期待値（平均）からの典型的なずれの大きさの目安。
  formulas:
  - id: F-sd-def
    symbols:
    - symbol: σ
      meaning: 標準偏差
      range: 0以上
      key: sigma
      kind: param
      of: X
      domain: {min: 0}   # σ＝√V(X) は0になりうる（0で割る式の側〔F-std-def〕が σ＞0 を持つ）
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値。単位は元の単位の2乗）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    tree: {"op": "eq", "args": [{"sym": "sigma"}, {"op": "sqrt", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}]}]}
  conditions:
    math:
    - text: 分散が有限
      kind: 要件
      outside: √V(X) が有限の値に定まらないので、この定義の標準偏差として扱えない
    data:
    - 分布の側では、確率は小さくても極端な値をとる裾があると、標準偏差は大きくなる（2乗が効く。裾が重いと、有限の値に定まらないこともある）。データから推し量るときは、標本の中の外れ値に強く引っ張られる。山が2つあるときや裾が長いときは、分布の形と一緒に見る
  example: さいころの目の標準偏差は √(35/12)≒1.71。
  counterexample: 標準偏差が同じでも、分布の形が違えば平均±1σ に入る割合は違う（正規分布で約68.3%、一様分布で約57.7%）。
  misconceptions:
  - misconception: 標準偏差は「平均からのずれの平均」
    correction: ずれの2乗の平均の平方根。ずれの大きさ（絶対値）の平均と同じか、それより大きくなる
  - misconception: 標準偏差と標準誤差は同じもの
    correction: 標準偏差は1つ1つの値のばらつき、標準誤差は推定値（標本平均など）のぶれ。n を増やすと標準誤差は小さくなるが、標準偏差はほぼ変わらない
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(math.sqrt(35/12)-1.71)<0.005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
  - abs(1/math.sqrt(3)-0.577)<0.0005
- id: TERM-cv
  name: 変動係数
  en: coefficient of variation
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 平均 x̄ が正の量的なデータ x₁, …, xₙ（n≧2）について、不偏分散の平方根 s＝√{Σ(xᵢ−x̄)²/(n−1)} を平均で割った値 s/x̄（x̄＞0・n≧2 は定義の要件）
    terms: [TERM-unbvar, TERM-mean]
  short: 標準偏差を平均で割った値で、平均の大きさが違うデータどうしのばらつきを比べるのに使う
  definition: 標準偏差を平均で割った値。平均の大きさが違うデータどうしのばらつきを、単位のない数で比べる。この教材では、標準偏差に不偏分散の平方根 s を使い、CV＝s÷x̄ とする。
  version: 1
  principle: 平均の大きい量ほど標準偏差も大きくなりやすいので、標準偏差を平均で割って「平均の何割ほどばらつくか」にそろえる。単位が消えるので、個数と金額のように単位の違うものも比べられる。全部を b 倍（b＞0）しても変わらないが、全部に同じ数を足すと平均だけが動くので変わる。
  conditions:
    math:
    - text: 平均が正
      kind: 要件
      outside: 平均が0なら割れず、負なら「平均の何割」にならない。この定義の変動係数としては扱えない（前年との差の金額のように、正にも負にもなる量）
    - text: n≧2（不偏分散の平方根を使う）
      kind: 要件
      outside: n＝1 では n−1 で割れず、標準偏差が決まらない
    data:
    - 単位に依らずに比べられるのは、0 が「その量が無い」を表す量（比例尺度）のとき。気温℃のような間隔尺度では、0 の置き方で平均が変わり、同じデータでも単位によって CV が変わる
    - 平均が正でも0に近いと、CV は極端に大きくなる。平均の小さい量の CV は、大きく出やすいことを覚えておく
    - 2つのデータの CV を比べるときは、同じ決め方の標準偏差（n で割るか n−1 で割るか）で計算する
  example: 高額商品は日販の平均50,000円・標準偏差5,000円で CV＝0.1、低額商品は平均200円・標準偏差40円で CV＝0.2。標準偏差は高額商品の方がずっと大きいが、平均に対する割合では、低額商品の方がばらつく。
  counterexample: 3日の最高気温 10℃, 15℃, 20℃ は、平均15・s＝5 で CV≒0.33。同じ3日を ℉ にすると 50, 59, 68 で、平均59・s＝9 で CV≒0.15。同じ気温なのに、単位で CV が半分以下になる。0 が「無い」でない量では、CV は単位に依らない物差しにならない。
  misconceptions:
  - misconception: CV が小さいほど、ばらつきが小さい
    correction: CV が表すのは平均に対する割合。高額商品の CV 0.1 は低額商品の 0.2 より小さいが、1日の売上は5,000円ほどぶれ、低額商品の40円よりずっと大きい。在庫や資金の手当ては、標準偏差そのものでも見る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - Fraction(5000, 50000) == Fraction(1, 10) and Fraction(40, 200) == Fraction(1, 5)
  - statistics.stdev([10, 15, 20]) == 5 and statistics.stdev([50, 59, 68]) == 9 and abs(5/15 - 0.33) < 0.005 and abs(9/59 - 0.15) < 0.005 and 10*1.8+32 == 50 and 20*1.8+32 == 68
- id: TERM-unbiased
  name: 不偏性
  en: unbiasedness
  category: 推定
  forms: [property]
  basis:
    text: 母数 θ の推定量 θ̂ について、モデルのすべての母数の値で（θ 以外の母数を含む） E(θ̂)＝θ が成り立つこと
    terms: [TERM-estimator, TERM-expect]
  short: 推定量の期待値が、推定したい母数と一致する性質
  definition: 推定量の期待値が、母数のどの値でも、推し量りたい母数に等しいこと（E(θ̂)＝θ）。取り直したときの平均として、上にも下にもずれない。
  version: 1
  principle: 不偏は偏り（E(θ̂)−θ）が0という、くり返しの平均の性質で、1回の推定値が当たるとは言わない。ばらつきは問わないので、不偏でもばらつきが大きい推定量は当てにならない。母平均の推定で、最初の1個 X₁ は不偏だが、n を増やしても良くならない。
  conditions:
    math:
    - text: 母数のどの値でも E(θ̂)＝θ（ある1つの値でだけ等しいのは不偏ではない）
      kind: 要件
      outside: 不偏とは言えない
    - text: 推定量の期待値 E(θ̂) が存在する
      kind: 要件
      outside: 不偏推定量として扱えない
    data:
    - 式が不偏でも、取り方の偏り（抽出枠の漏れ・無回答）があると推定値はずれる。式の性質と取り方を分けて確かめる
  example: 独立に同じ分布から取るとき、標本平均は母平均 μ の不偏推定量（④-20a）、n−1 で割る不偏分散 s² は母分散 σ² の不偏推定量（④-11）。
  counterexample: 標本を見ずにいつも 50 と答える推定量は、母平均がちょうど 50 のときだけ期待値が母平均に等しい。母平均が 60 なら偏りは −10 なので、不偏ではない。
  misconceptions:
  - misconception: 不偏推定量なら、推定値は母数に近い
    correction: 不偏は平均としてずれないことだけ。ばらつきが大きければ、1回の推定値は母数から遠いことがある（最初の1個 X₁ は不偏だが、標準誤差は σ のまま）
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 50 - 60 == -10
- id: TERM-std
  name: 標準化
  en: standardization
  category: 要約（代表値・ばらつき）
  forms: [operation]
  basis_formula: F-std-def
  definition: 確率変数から期待値を引き、標準偏差で割って、期待値0・標準偏差1 の確率変数に直すこと。
  version: 1
  principle: 1次の変換なので分布の形は変わらない。単位や大きさの違う量を「期待値から標準偏差いくつ分か」で比べられる。正規分布なら標準正規分布 N(0, 1) になり、1つの表で確率が読める。データの値を直す z得点は、同じ形をデータの平均・データの標準偏差で行うデータの標準化。
  formulas:
  - id: F-std-def
    symbols:
    - symbol: Z
      meaning: 標準化した値（期待値から標準偏差いくつ分か）
      key: Z
      kind: rv
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: μ
      meaning: X の期待値 E(X)
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    - symbol: σ
      meaning: X の標準偏差
      range: 0より大きい
      key: sigma
      concept: TERM-sd
      kind: param
      of: X
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"sym": "Z"}, {"op": "div", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "mu"}]}, {"sym": "sigma"}]}]}
  - id: F-std-mean
    label: 標準化した値の期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: Z
      meaning: 標準化した値（期待値から標準偏差いくつ分か）
      key: Z
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "Z"}], "name": "E"}, {"num": 0}]}
  - id: F-std-var
    label: 標準化した値の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: Z
      meaning: 標準化した値（期待値から標準偏差いくつ分か）
      key: Z
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "Z"}], "name": "V"}, {"num": 1}]}
  conditions:
    math:
    - text: 分散が有限で、標準偏差が0でない
      kind: 要件
      outside: σ で割れない（σ＝0）か σ が有限の値に定まらないので、標準化した値が定まらない
    data:
    - μ・σ は X 自身の分布のものを使う。別の分布の μ₀・σ₀ で割ると期待値 (μ−μ₀)÷σ₀・標準偏差 σ÷σ₀ になり、0・1 にならない。標本から求めた x̄・s で置き換えると、正規分布でも N(0, 1) に従うとは限らない
  example: 期待値 μ＝60・標準偏差 σ＝10 の確率変数 X を標準化した Z＝(X−60)÷10 は、期待値0・標準偏差1。X が 80 の値をとるとき、Z は 2。
  counterexample: 標準化しても分布の形は変わらない。右に裾の長い分布に従う確率変数を標準化しても、正規分布にはならない（平均1・標準偏差1の指数分布を標準化した Z＝X−1 は、P(Z≦−1)＝0 で、標準正規分布の約0.159 と違う）。
  misconceptions:
  - misconception: 正規分布に従う X̄ を、σ の代わりに標本の標準偏差 s で割って標準化しても、N(0, 1) に従う
    correction: s は標本ごとに偶然で変わるので、(X̄−μ)÷(s÷√n) は N(0, 1) ではなく t 分布に従う（正規母集団のとき。U20）。N(0, 1) に従うのは、X̄ 自身の標準偏差 σ÷√n（σ は分かっている）で割ったとき
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(statistics.NormalDist().cdf(-1) - 0.159) < 0.0005
  - (80-60)/10==2
- id: TERM-skew
  name: 歪度
  en: skewness
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ（データの標準偏差 √v＞0 は定義の要件。v はデータの分散）について、(xᵢ−x̄)/√v の3乗の平均 (1/n)Σ{(xᵢ−x̄)/√v}³
    terms: [TERM-data-sd]
  short: 分布の左右の非対称さを表す値で、右に裾が長いと多くは正になる
  definition: 分布の左右の非対称さを表す数。偏差をデータの標準偏差で割った値（標準化した値）を3乗して平均したもの。右に裾が長いと多くは正、左に裾が長いと多くは負になる。
  version: 1
  principle: 3乗すると符号が残り、平均から遠い値ほど大きく効くので、大きく離れた値がどちらの側に多いかが符号に出る。標準化してから3乗するので、単位や目盛りを変えても（正の数を掛ける・数を足す）値は変わらない。
  conditions:
    math:
    - text: データの標準偏差が正（値がすべて同じではない）
      kind: 要件
      outside: この定義の歪度としては扱えない（0 で割ることになる）
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義の歪度としては扱えない（段階に付けた点では、点の付け方しだいで値も符号も変わる）
    data:
    - 個数が少ないと、1つの外れ値で歪度が大きく動く。ヒストグラムや点の並びと一緒に見る
    - ソフトによっては、標本から母集団の歪度を推し量るための補正をしていて、値が少し違う
  example: 5日の販売数 2, 3, 3, 4, 13 は、平均5、偏差 −3, −2, −2, −1, 8。偏差の2乗の平均は16.4、3乗の平均は93.6 で、歪度は 93.6÷16.4^1.5≒1.41。右に飛び出した13個の日が、正の歪度を作っている。
  counterexample: 4, 7, 8, 11, 15, 15 は、平均10、偏差 −6, −3, −2, 1, 5, 5 で、偏差の3乗の和は −216−27−8＋1＋125＋125＝0、歪度は0。けれども、左には離れた値が1つ、右には同じ値が2つ並んでいて、左右対称ではない。歪度0 は「3乗の和が釣り合っている」だけで、形が左右対称とは限らない。
  misconceptions:
  - misconception: 歪度が正なら、平均は必ず中央値より大きい
    correction: 多くの場合はそうだが、いつもではない。歪度は3乗で遠い値を強く数え、平均と中央値の大小は別の数え方で決まるので、食い違うことがある
  sources:
  - source: 公式2級範囲表
    locator: データの記述（分布の形）
  checks:
  - Fraction(2+3+3+4+13, 5) == 5 and Fraction(9+4+4+1+64, 5) == Fraction(82, 5) and Fraction(-27-8-8-1+512, 5) == Fraction(468, 5) and abs(93.6/16.4**1.5 - 1.41) < 0.005
  - sum([4,7,8,11,15,15]) == 60 and sum((x-10)**3 for x in [4,7,8,11,15,15]) == 0
- id: TERM-kurt
  name: 尖度
  en: kurtosis
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ（データの標準偏差 √v＞0 は定義の要件。v はデータの分散）について、(xᵢ−x̄)/√v の4乗の平均 (1/n)Σ{(xᵢ−x̄)/√v}⁴（3を引かない決め方。正規分布では標準化した値の4乗の期待値が3で、正規分布から取った大きな標本の尖度は3に近づく）
    terms: [TERM-data-sd]
  short: 分布の裾の重さ（平均から遠い値がどれだけ出るか）を表す値
  definition: 分布の裾の重さ（平均から遠い値がどれだけ出るか）を表す数。標準化した値を4乗して平均したもの。この教材では3を引かない決め方。正規分布では、標準化した値の4乗の期待値が3で、正規分布から取った大きな標本の尖度は3に近づく。
  version: 1
  principle: 4乗するので、平均から遠い値ほど極端に大きく効き、遠い値が少しでもあると大きくなる。山のとがり具合より、主に裾の重さを表す。標準化してから4乗するので、単位や目盛りを変えても値は変わらない。
  conditions:
    math:
    - text: データの標準偏差が正（値がすべて同じではない）
      kind: 要件
      outside: この定義の尖度としては扱えない（0 で割ることになる）
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義の尖度としては扱えない（段階に付けた点では、点の付け方しだいで値が変わる）
    data:
    - ソフトは3を引いた「超過尖度」を出すことが多い（正規分布で0）。どちらの決め方かを確かめる
    - ソフトによっては、標本から母集団の尖度を推し量るための補正をしていて、値が少し違う
    - 個数が少ないと、1つの外れ値で尖度が大きく動く
  example: 1, 2, 3, 4, 5 は、偏差の2乗の平均が2、4乗の平均が (16＋1＋0＋1＋16)÷5＝6.8 で、尖度は 6.8÷2²＝1.7。遠い値のない、裾の軽い形。9, 10, 10, 10, 10, 10, 10, 11 は、2乗の平均0.25、4乗の平均0.25 で、尖度は 0.25÷0.25²＝4。ほとんどが真ん中にそろい、両端に1つずつ外れた値がある。
  counterexample: 7, 10, 10, 10, 10, 13 は、偏差が −3, 0, 0, 0, 0, 3 で、2乗の平均3、4乗の平均27、尖度は 27÷3²＝3 で、正規分布の母集団の値と同じ。けれども形は、真ん中の1か所と両端の2か所だけに値がある、正規分布とはまったく違う並び。尖度が3 でも、正規分布の形とは限らない。
  misconceptions:
  - misconception: 尖度が大きいほど、山がとがっている
    correction: 尖度は4乗で遠い値を強く数えるので、主に裾の重さを表す。真ん中の山の形が同じでも、裾に遠い値が1つ加わるだけで大きくなる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（分布の形）
  checks:
  - Fraction(16+1+0+1+16, 5) == Fraction(34, 5) and Fraction(34, 5) / 4 == Fraction(17, 10)
  - Fraction(2, 8) / Fraction(2, 8)**2 == 4 and Fraction(81*2, 6) / Fraction(9*2, 6)**2 == 3
- id: TERM-normal
  name: 正規分布
  en: normal distribution
  category: 確率分布
  group: GRP-dist-cont
  forms: [distribution]
  basis_excludes:
  - concept: TERM-expect
    kind: 1つの概念の中の式・性質
    text: 密度の μ が期待値に等しいことは、密度から導く正規分布の性質で、定義の構成要素ではない
  - concept: TERM-sd
    kind: 1つの概念の中の式・性質
    text: 密度の σ が標準偏差に等しいことは、密度から導く正規分布の性質で、定義の構成要素ではない
  definition: 確率密度が f(x) の式で表される連続分布 N(μ, σ²)。平均 μ を中心に左右対称な釣鐘の形になる。
  version: 2
  figures: [FIG-U16-concept]
  labs:
  - {id: LAB-cont, preset: s1-norm, purpose: 平均と標準偏差から、区間の確率を面積で読む}
  principle: 小さな独立の要因がたくさん足し合わさると、この形に近づく（中心極限定理）。μ と σ の2つで形が決まり、μ±σ に約68%、μ±2σ に約95% が入る。
  formulas:
  - id: F-normal-pdf
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ。面積が確率）
      key: f
      concept: TERM-pdf
    - symbol: x
      meaning: 値
      range: 実数全体
      key: x
      kind: value
    - symbol: X
      meaning: この密度に従う確率変数（μ・σ は X の期待値・標準偏差）
      key: X
      kind: rv
    - symbol: μ
      meaning: 平均（山の中心）
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    - symbol: σ
      meaning: 標準偏差（山の広がり）
      range: 0より大きい
      key: sigma
      concept: TERM-sd
      kind: param
      of: X
      domain: {min: 0, minOpen: true}
    - symbol: π
      meaning: 円周率
      key: pi
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}, {"op": "mul", "args": [{"op": "div", "args": [{"num": 1}, {"op": "mul", "args": [{"op": "sqrt", "args": [{"op": "mul", "args": [{"num": 2}, {"sym": "pi"}]}]}, {"sym": "sigma"}]}]}, {"op": "fn", "args": [{"op": "neg", "args": [{"op": "div", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "x"}, {"sym": "mu"}]}, {"num": 2}]}, {"op": "mul", "args": [{"num": 2}, {"op": "pow", "args": [{"sym": "sigma"}, {"num": 2}]}]}]}]}], "name": "exp"}]}]}
  basis_formula: F-normal-pdf
  conditions:
    math:
    - text: σ＞0（μ は実数）
      kind: 要件
      outside: 母数が範囲の外なら、この定義の正規分布として扱えない（σ＝0 では密度の式が定まらない）
    data:
    - ヒストグラムが左右対称で山が1つなのは手掛かりにすぎず、それだけでは正規分布と言えない（裾の重さなども見る）
    - 正規分布を前提にする方法は、データの分布が正規分布から外れると、結論を信頼しにくくなる
  example: 二項分布 B(100, 0.5) は、平均50・標準偏差5 の正規分布で近似できる。
  counterexample: 売上や所得のように右に裾が長いデータでは、平均±2σ の中の割合は95%前後でも（対数正規分布で約96.3%）、外に出る分はほぼ右側だけ（左 0%・右 約3.7%）。平均±1σ の中は約91%で、正規分布の約68.3%と大きく違う。
  misconceptions:
  - misconception: 左右対称で山が1つなら正規分布
    correction: 左右対称な山1つの分布はほかにもある（裾の重い分布など）。形の手掛かりと、正規分布であることは別
  - misconception: データはふつう正規分布になる
    correction: 正規分布に近づくのは、独立な要因が足し合わさるときなど。売上・所得など右に裾の長いデータは多い
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(math.erf(1/math.sqrt(2))-0.68)<0.005
  - abs(math.erf(2/math.sqrt(2))-0.95)<0.005
  - 100*0.5==50 and math.sqrt(100*0.5*0.5)==5
  - abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+2*math.sqrt((math.e-1)*math.e)))-0.963)<0.0005
  - math.exp(0.5)-2*math.sqrt((math.e-1)*math.e) < 0
  - abs(1-statistics.NormalDist().cdf(math.log(math.exp(0.5)+2*math.sqrt((math.e-1)*math.e)))-0.037)<0.0005
  - math.exp(0.5)-math.sqrt((math.e-1)*math.e) < 0 and abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+math.sqrt((math.e-1)*math.e)))-0.91)<0.005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
- id: TERM-expect
  name: 期待値
  en: expected value
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-expect-def
  definition: 確率変数がとる値を、その確率で重み付けした平均。
  version: 1
  table_workspace:
    formula: 0
    linear: 2
    tables:   # 表は実験室のテーマを指す（値・重みを2か所に書かない。build が写す。#119）
    - {experiment: EXP-expect-table, theme: dice, use: start}
    - {experiment: EXP-expect-table, theme: dice, use: compare}
    - {experiment: EXP-expect-table, theme: basket, use: start}
    - {experiment: EXP-expect-table, theme: lottery, use: start}
  figures: [FIG-U13-concept]
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 期待値が分布の重心になることを、予測してから確かめる}
  principle: 値×確率の和。同じ試行を何度もくり返したときの平均の行き着く先になる（大数の法則）。和の期待値は期待値の和（線形性）。
  formulas:
  - id: F-expect-def
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: x
      meaning: X がとりうる値
      key: x
      kind: index
    - symbol: p(x)
      meaning: X が x になる確率（重み）
      range: 0以上1以下・合計1
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "sum", "args": [{"op": "mul", "args": [{"sym": "x"}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}], "var": "x"}]}
  - id: F-expect-mu
    label: 記号 μ
    symbols:
    - symbol: μ
      meaning: X の期待値 E(X) を短く書く記号
      key: mu
      kind: param
      of: X
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    tree: {"op": "eq", "args": [{"sym": "mu"}, {"op": "fn", "args": [{"sym": "X"}], "name": "E"}]}
  - id: F-expect-linear
    label: 線形性
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 掛ける定数（単位の換算）
      key: a
      kind: const
    - symbol: b
      meaning: 足す定数（一律の上乗せ）
      key: b
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"sym": "X"}]}, {"sym": "b"}]}], "name": "E"}, {"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"op": "fn", "args": [{"sym": "X"}], "name": "E"}]}, {"sym": "b"}]}]}
  conditions:
    math:
    - text: 値の大きさ×確率の和（連続なら積分）が有限の値になる（絶対収束：Σ|x|p(x)＜∞、連続なら ∫|x|f(x)dx＜∞。このとき足す順序で値が変わらない）
      kind: 要件
      outside: 期待値が定まらない（足す順序で値が変わるか、∞ になる）ので、この定義の期待値としては扱えない
    data:
    - くり返しの平均として読むには、同じ条件の試行がくり返せること
  example: さいころの目の期待値は (1＋2＋…＋6)÷6＝3.5。
  counterexample: 期待値 3.5 の目は実際には出ない。期待値は「よく出る値」（最頻値）でも「真ん中の値」（中央値）でもない。
  misconceptions:
  - misconception: 期待値は実際に出る値
    correction: 何度もくり返したときの平均の行き着く先で、1回の結果としては出ないこともある
  - misconception: 期待値がいちばん出やすい値
    correction: いちばん出やすい値は最頻値。右に裾が長い分布では、期待値は最頻値より大きくなる
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - sum(range(1,7))/6==3.5
- id: TERM-geomean
  name: 幾何平均
  en: geometric mean
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: n 個の正の値 x₁, …, xₙ（正であることは定義の要件）を掛け合わせた積の n 乗根 (x₁x₂⋯xₙ)^(1/n)（伸び率なら、倍率 1＋伸び率 に当てはめる）
    terms: []
  short: n 個の正の値を掛け合わせて n 乗根をとった値で、倍率（1＋伸び率）の平均に使う
  definition: n 個の正の値を掛け合わせた積の n 乗根。伸び率の平均には、各期の倍率（1＋伸び率）の幾何平均を使い、そこから1を引いた値を平均成長率とする。
  version: 1
  principle: 倍率は掛け算で重なるので、「同じ倍率を n 回掛けると、実際の n 期分の累計倍率になる倍率」が、伸びの平均の意味をもつ。その倍率が幾何平均。率を足して n で割る算術平均は、倍率が全部同じなら幾何平均と等しく、違えば幾何平均より大きくなって、最後の値を再現しない。
  conditions:
    math:
    - text: どの値も正（倍率なら、どの期も伸び率が −100% より大きい）
      kind: 要件
      outside: 0 を含むと積が0になり、負の値を含むと n 乗根が定まらないことがある。幾何平均として扱えない
    data:
    - 平均成長率を言うときは、期間の数（時点の数ではない）を書く。3時点なら2期間
    - 長さの違う期間の伸び（3か月の伸びと1年の伸び）を混ぜて平均しない
  example: 3期の伸び率が ＋10%・＋30%・−20% なら、累計倍率は 1.1×1.3×0.8＝1.144、3乗根は約1.0459 で、平均成長率は約4.59%。率の算術平均（約6.67%）で3回増やすと、100は約121.36 になり、実際の114.4 より大きい。
  counterexample: 100 → 120 → 0（2期目に閉店）では、倍率は 1.2 と 0 で、積も幾何平均も0になり、平均成長率は −100% と出る。1期目の＋20% は表されない。途中で値が0になると、その次の期の倍率は0で割ることになり、求めることもできない。正の値という前提が崩れると、幾何平均は伸びの平均にならない。
  misconceptions:
  - misconception: 率を足して期間の数で割れば、毎期の平均の伸びになる
    correction: ＋100% のあと −50% なら、100 → 200 → 100 で元に戻っている。率の算術平均は＋25%だが、倍率 2×0.5＝1 の幾何平均は1で、平均成長率は0%
  sources:
  - source: 公式2級範囲表
    locator: データの記述（時系列データ）
  checks:
  - abs(1.1*1.3*0.8 - 1.144) < 1e-12 and abs((1.1*1.3*0.8)**(1/3) - 1.0459) < 0.0001 and abs(100*(1 + 0.2/3)**3 - 121.36) < 0.01 and Fraction(10+30-20, 3) == Fraction(20, 3)
  - 2*0.5 == 1 and Fraction(100-50, 2) == 25
  - 1.2*0 == 0 and (1.2*0)**(1/2) - 1 == -1
- id: TERM-ma
  name: 移動平均
  en: moving average
  category: 時系列
  forms: [function]
  basis:
    text: 等間隔の時点 t＝1, …, T の量的なデータ（時系列）x₁, …, x_T と窓の幅 m（1≦m≦T の整数）について、各時点 t で、窓に入る連続した m 個の値の平均（算術平均）M_t を、窓を1期ずつずらして求めた値の列（窓の置き方で、t を真ん中にする中央移動平均 M_t＝(x_{t−h}＋…＋x_{t＋h})/m（この定義では m＝2h＋1 が奇数のときだけで、偶数の m は後方で求める。偶数の m で両端を半分の重みにして中央に合わせる中心化移動平均も同じ名前で呼ぶが、算術平均の形ではない）と、t までの過去 m 期をとる後方移動平均 M_t＝(x_{t−m＋1}＋…＋x_t)/m を呼び分ける。窓が系列からはみ出す時点では求めない。値が量的で時点が等間隔であることは定義の要件）
    terms: [TERM-mean]
  short: 時系列で、一定期間の値の平均を1期ずつずらして求め、細かい変動をならしたもの
  definition: 時系列で、連続する m 個の値の平均を、窓を1期ずつずらしながら求めた値の列。時点 t を窓の真ん中に置く中央移動平均と、t までの過去 m 期をとる後方移動平均がある。
  version: 1
  principle: 窓の中の短い上下は平均で打ち消し合い、窓より長い変化（傾向）は残る。窓の幅を波の周期（曜日なら7日）にそろえると、その周期の波はちょうど消える。その代わり、窓が系列からはみ出す端の時点では求められない。後方移動平均は、直線の傾向に対しては (m−1)/2 期遅れた位置の値になり、段差のような急な変化には m−1 期かけて追いつく。
  conditions:
    math:
    - text: 時点が等間隔
      kind: 要件
      outside: 窓の中の値の間隔がそろわず、「m 期の平均」の意味が時点ごとに変わる（休業日を詰めて並べた日販では、7個の窓が7日とは限らない）。この定義の移動平均としては扱えない
    - text: 値が量的
      kind: 要件
      outside: 値を足して割る平均が意味をもたない（満足度の段階に付けた点など）。この定義の移動平均としては扱えない
    data:
    - 窓の幅は、消したい波の周期に合わせる（曜日の波なら7日）。周期と合わない窓では、波が弱まりながら残る
    - 毎朝の確認には、最新の日まで出せる後方移動平均。過去の傾向を読むには、遅れのない中央移動平均
  example: 週ごとの来店客数（百人）が 30, 36, 33, 39, 42 なら、中央3点移動平均は 2週目 33、3週目 36、4週目 38。上下をならすと、増えている傾向が見える。1週目と5週目は、前か後ろの週がないので求めない。
  counterexample: 平日が10、土日が20 の日販（月〜日に 10, 10, 10, 10, 10, 20, 20 のくり返し）を中央3点でならすと、金曜は約13.33、土曜と日曜は約16.67、月曜は約13.33、火〜木曜は10 で、曜日の波が残る。窓を7日にすると、どの日も (5×10＋2×20)÷7＝90÷7≒12.86 で波が消える。窓の幅が周期と合わないと、波は消えない。
  misconceptions:
  - misconception: 移動平均は上下をならすだけで、傾向の読み取りに遅れはない
    correction: 後方移動平均は過去の値だけで求めるので、傾向に対しては (m−1)/2 期遅れ（後方7日なら3日）、段差のような急な変化には m−1 期（後方7日なら6日）かけて追いつく
  - misconception: 移動平均は、何項でとっても季節の影響を消せる
    correction: 季節の周期（月次なら12か月、日次の曜日なら7日）と同じ長さで平均しないと、季節の影響が残る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（時系列データ）
  checks:
  - Fraction(30+36+33, 3) == 33 and Fraction(36+33+39, 3) == 36 and Fraction(33+39+42, 3) == 38
  - abs((10+10+20)/3 - 13.33) < 0.01 and abs((10+20+20)/3 - 16.67) < 0.01 and abs((5*10+2*20)/7 - 12.86) < 0.01 and (7-1)/2 == 3
- id: TERM-acf
  name: 自己相関
  en: autocorrelation
  category: 時系列
  forms: [number]
  basis:
    text: 等間隔の時点の量的なデータ（時系列）x₁, …, x_T（T≧2。値がすべて同じでないこと（データの分散＞0）は定義の要件）と、ずらす期間（ラグ）k（0≦k≦T−1 の整数）について、ラグ k の自己共分散 c_k＝(1/T)Σ_{t=1}^{T−k}(x_t−x̄)(x_{t+k}−x̄) を、系列のデータの分散 c₀＝(1/T)Σ_{t=1}^{T}(x_t−x̄)² で割った値 r_k＝c_k/c₀（x̄ は系列全体の平均。分子と分母の T は消えるので、r_k＝Σ_{t=1}^{T−k}(x_t−x̄)(x_{t+k}−x̄)/Σ_{t=1}^{T}(x_t−x̄)² と同じ値。r₀＝1、|r_k|≦1。平均と割る数を系列全体でとるので、ずらした対 (x_t, x_{t+k}) の相関係数とは一般に一致しない）
    terms: [TERM-data-var]
  short: 時系列で、ある時点の値と一定期間前の値が似ている度合いを、相関係数と同じ −1〜1 の数で表した値
  definition: 時系列で、k 期ずらした自分自身との似かたを、−1 から 1 の数で表した値（ラグ k の自己相関）。系列全体の平均からのずれを、時点 t と t＋k で掛けて足した和を、ずれの2乗の和で割って求める。
  version: 1
  principle: k 期前の値が平均より高いとき、今の値も高いことが多ければ正、低いことが多ければ負になる。曜日の波がある日販ではラグ7が高く、交互に上下する系列ではラグ1が負になる。平均と割る数を系列全体でとるので、ずらした組 (xₜ, xₜ₊ₖ) をそのまま並べた相関係数とは一般に違う値になる。
  conditions:
    math:
    - text: T≧2 で、値がすべて同じではない（ずれの2乗の和が正）
      kind: 要件
      outside: 割る数が0になり、自己相関は定まらない
    - text: 時点が等間隔
      kind: 要件
      outside: 「k 期ずらす」が時点ごとに違う長さになり、ラグの意味がなくなる（休業日を詰めた日販では、7個ずらしても7日前とは限らない）
    - text: 値が量的
      kind: 要件
      outside: 平均からのずれを掛け合わせる計算が意味をもたない（段階に付けた点など）。この定義の自己相関としては扱えない
    data:
    - 傾向（右上がり）がある系列では、自己相関が正に寄り、周期の波が見えにくい。前の時点との差をとって傾向を除いてから見る
    - ラグ k が系列の長さ T に近いと、掛け合わせる組が少なく、値が当てにならない
  example: 1, 2, 1, 2, 1, 2 の6個（平均1.5）では、ずれは −0.5 と 0.5 が交互に並ぶ。ずれの2乗の和は1.5。ラグ1の和は −0.25 が5組で −1.25 なので、自己相関は約 −0.83。ラグ2の和は 0.25 が4組で 1 なので、約 0.67。交互に上下する系列は、ラグ1が負、ラグ2が正になる。
  counterexample: 1, 2, 3, 4, 5, 6 では、1つずらした組 (1, 2), (2, 3), …, (5, 6) は一直線に並び、その組の相関係数は 1。ところがラグ1の自己相関は、系列全体の平均3.5 からのずれで計算するので 8.75÷17.5＝0.5 になる。自己相関は、ずらした組の相関係数とは別の量。
  misconceptions:
  - misconception: 自己相関が高いラグが見つかれば、その周期の原因も分かる
    correction: ラグ7が高いことから言えるのは、7日間隔で似た動きがくり返していることまで。曜日の客の来方か、7日ごとの特売か、原因は別に確かめる
  - misconception: 自己相関のある系列でも、独立を前提にした標準誤差や検定をそのまま使える
    correction: 自己相関があると観測どうしが独立でないので、独立を前提にした標準誤差や検定はそのまま使えない（ばらつきを小さく見積もりやすい）
  sources:
  - source: 公式2級範囲表
    locator: データの記述（時系列データ）
  checks:
  - 5*(-0.25) == -1.25 and 6*0.25 == 1.5 and abs(-1.25/1.5 + 0.833) < 0.001 and abs(4*0.25/1.5 - 0.667) < 0.001
  - (-2.5)*(-1.5)+(-1.5)*(-0.5)+(-0.5)*0.5+0.5*1.5+1.5*2.5 == 8.75 and sum((x-3.5)**2 for x in range(1, 7)) == 17.5 and 8.75/17.5 == 0.5
- id: TERM-corr
  name: 相関係数
  en: correlation coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 量的な2変数のデータ (x₁, y₁), …, (xₙ, yₙ)（n≧2。x と y のデータの標準偏差がどちらも0でないことは定義の要件）について、データの共分散を x と y のデータの標準偏差の積で割った値 r＝s_xy/(s_x·s_y)（割る数は分子と分母で消えるので、r＝Σ(xᵢ−x̄)(yᵢ−ȳ)/√{Σ(xᵢ−x̄)²·Σ(yᵢ−ȳ)²} と同じ値）
    terms: [TERM-data-cov, TERM-data-sd]
  short: 2つの量的変数の直線的な関係の強さと向きを、−1から1の数で表した値
  definition: 2つの量的変数の直線的な関係の強さと向きを、−1 から 1 の数で表した値。2つの変数の共分散を、それぞれの標準偏差の積で割って求める。
  version: 1
  principle: 平均からのずれの積を足すと、片方が平均より大きいときもう片方も大きい組が多いほど正、逆なら負になる。それぞれの標準偏差で割るので、単位や目盛りの取り方（円か千円か）によらない数になり、すべての点が右上がりの直線に乗るとき 1、右下がりの直線に乗るとき −1 になる。直線の関係だけを測るので、曲がった関係は0に近く出ることがある。
  conditions:
    math:
    - text: n≧2 で、x と y のどちらも、値がすべて同じではない（標準偏差が正）
      kind: 要件
      outside: 割る数が0になり、相関係数は定まらない
    data:
    - 先に散布図を描く。曲がった関係、外れ値1つ、性質の違う2つの群の混ざりで、相関係数は大きくも小さくもなる
    - 相関係数が大きくても、原因と結果の関係とは限らない（気温が、アイスの売上と水の売上の両方を動かす）
  example: 5日の気温（℃）20, 22, 24, 26, 28 とアイスの販売数 30, 34, 35, 40, 41 では、ずれの積の和は56、ずれの2乗の和は気温40・販売数82 で、相関係数は 56÷√(40×82)≒0.98。気温の高い日ほど多く売れる、強い右上がりの関係。
  counterexample: x が −2, −1, 0, 1, 2 で y＝x²（4, 1, 0, 1, 4）なら、y は x で完全に決まるのに、ずれの積の和は0で、相関係数は0。相関係数が0でも、関係がないとは限らない（直線でない関係は測れない）。
  misconceptions:
  - misconception: 相関係数が大きいほど、x が1増えたときの y の増え方（傾き）が大きい
    correction: 相関係数が表すのは、点が直線のまわりにどれだけまとまっているか。y＝0.1x の点は傾きが小さくても、すべて直線に乗るので相関係数は 1
  sources:
  - source: 公式2級範囲表
    locator: データの記述（相関係数）
  checks:
  - sum((a-24)*(b-36) for a, b in zip([20,22,24,26,28], [30,34,35,40,41])) == 56 and sum((a-24)**2 for a in [20,22,24,26,28]) == 40 and sum((b-36)**2 for b in [30,34,35,40,41]) == 82 and abs(56/(40*82)**0.5 - 0.98) < 0.005
  - sum(x*(x*x - 2) for x in [-2, -1, 0, 1, 2]) == 0
- id: TERM-complement
  name: 余事象
  en: complement
  category: 確率
  forms: [event]
  basis:
    text: 事象 A に対して、標本空間 Ω のうち A に入らない結果を全部集めた事象 Aᶜ＝Ω∖A
    terms: [TERM-event, TERM-sample-space]
  short: ある事象が起こらないという事象で、標本空間からその事象を除いた残り
  definition: 事象 A が起こらないという事象。標本空間 Ω から A の結果を除いた残りで、Aᶜ と書く（高校では Ā）。
  version: 1
  principle: A と Aᶜ は重ならず、合わせると Ω 全体になる。だから確率の公理から、余事象の確率は1から A の確率を引いたもの、P(Aᶜ)＝1−P(A)。「少なくとも1回」のように直接数えると場合が多い事象は、起こらない側を数えて1から引くと楽になる。
  conditions:
    math:
      - text: A は標本空間 Ω の事象で、Aᶜ はその同じ Ω に対して取る
        kind: 要件
        outside: 余事象が決まらない（Ω が違えば「残り」が違う）
    data:
      - 「起こらない」の中身を書き出して確かめる。「6 が少なくとも1回」の余事象は「6 が1回も出ない」で、「6 がちょうど1回」ではない
  example: さいころを3回投げて6が少なくとも1回出る確率は、1回も出ない確率 (5/6)³＝125/216 を1から引いて 1−125/216＝91/216。
  counterexample: さいころを2回投げて「6が少なくとも1回出る」の余事象を、1回投げの Ω＝{1, …, 6} で考えて「6以外の目」とすると誤る。2回投げの Ω（36通り）の残りを取ると「2回とも6以外」の 25 通りで、余事象は Ω を取り違えると変わる。
  misconceptions:
    - misconception: 「少なくとも1回」の余事象は「ちょうど1回」
      correction: 「少なくとも1回」に入らないのは「1回も起きない」だけ。ちょうど1回は「少なくとも1回」の中に入る
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - Fraction(5,6)**3 == Fraction(125,216) and 1 - Fraction(125,216) == Fraction(91,216)
    - 'len([(a,b) for a in range(1,7) for b in range(1,7) if a != 6 and b != 6]) == 25'
- id: TERM-exclusive
  name: 排反
  en: mutually exclusive
  category: 確率
  forms: [property]
  basis:
    text: 2つの事象 A・B が共通の結果を持たない（A∩B＝∅）こと
    terms: [TERM-event]
  short: 2つの事象が同時には起こらないこと（共通部分がない）
  definition: 2つの事象が同時には起こらないこと。共通部分がない（A∩B＝∅）。
  version: 1
  principle: 共通の結果がないので、A∪B の結果は A の結果と B の結果に重なりなく分かれる。だから確率の公理から P(A∪B)＝P(A)＋P(B) と足せる。重なりがあるときは、重なりを二重に数えないよう引く（加法定理）。
  conditions:
    math:
      - text: A・B は同じ標本空間 Ω の事象
        kind: 要件
        outside: 排反かどうかを決められない（別々に決めた2つの Ω の事象は比べられない。2回の試行も、36 通りのような1つの Ω にまとめれば比べられる）
    data:
      - 2つの出来事が「同時に起こりうるか」を、結果を書き出して確かめる。違う試行（1回目と2回目）の出来事は、ふつう排反ではなく、独立かどうかを考える
  example: さいころで A＝{1, 2}（2以下）と B＝{5, 6}（5以上）は共通の結果がないので排反。2以下か5以上の確率は 2/6＋2/6＝4/6＝2/3。
  counterexample: A＝{2, 4, 6}（偶数）と B＝{1, 2, 3}（3以下）は 2 を共有するので排反ではない。3/6＋3/6＝1 と足すと、2 を二重に数えて誤る（正しくは {1, 2, 3, 4, 6} で 5/6）。
  misconceptions:
    - misconception: 排反な2つの事象の確率を足すと、いつも1になる
      correction: 1になるのは、排反で、しかも合わせると Ω 全体になるとき（A と余事象）だけ。2以下 {1, 2} と5以上 {5, 6} は排反だが、足すと 2/3
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - 'len({1,2} & {5,6}) == 0 and Fraction(2,6)+Fraction(2,6) == Fraction(2,3)'
    - 'len({2,4,6} | {1,2,3}) == 5 and Fraction(3,6)+Fraction(3,6) == 1'
- id: TERM-indep
  name: 独立
  en: independence
  category: 確率
  forms: [property]
  basis_formula: F-indep-def
  definition: 一方が起きたかどうかで、もう一方の起こりやすさが変わらないこと。
  version: 1
  labs:
  - {id: LAB-expect, preset: s5-free, purpose: 'P(X＝x, Y＝y)＝P(X＝x)P(Y＝y) のとき、共分散が0になることを確かめる'}
  principle: P(A∩B)＝P(A)P(B)。これが独立の定義で、確率0の事象も含めて使える。「一方が起きたかどうかで、もう一方の起こりやすさが変わらない」（P(A|B)＝P(A)）は、P(B)＞0 のときのこの式の言い換え。P(B)＝0 のときは条件付き確率 P(A|B) が定まらないが、積の式では B はどんな事象 A とも独立になる。この式は定義として読むほかに、両辺を計算して比べれば、独立かどうかの判定にも使える。確率変数なら同時の確率が積に分かれる。独立なら共分散は0になり、和の分散は分散の和になる。
  formulas:
  - id: F-indep-def
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-prob
    - symbol: A
      meaning: 事象
      key: A
      kind: value
    - symbol: B
      meaning: 事象
      key: B
      kind: value
    - symbol: A∩B
      meaning: A と B が両方起きる
      key: AB
      kind: value
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "AB"}], "name": "P"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "A"}], "name": "P"}, {"op": "fn", "args": [{"sym": "B"}], "name": "P"}]}]}
  conditions:
    math:
    - text: A・B は、同じ標本空間の上の同じ確率 P で確率が決まった2つの事象（確率変数 X・Y の独立は、値の集合 C・D でつくる事象 {X∈C}・{Y∈D} のどの組も独立なこと）
      kind: 要件
      outside: この定義の独立として扱えない
    data:
    - データで「独立」と言うには、仕組み（別々のさいころ・別々の客）から言えるか、検定などで確かめる。相関が0でも独立とは限らない
  example: さいころを2回投げると、1回目と2回目の目は独立。両方6になる確率は 1/6×1/6＝1/36。
  counterexample: どちらの確率も0でない2つの事象は、排反（同時に起きない）なら独立ではない。P(A∩B)＝0 だが P(A)P(B)＞0 になるからである。
  misconceptions:
  - misconception: 排反なら独立
    correction: 排反は「同時に起きない」。一方が起きたらもう一方は起きないので、どちらの確率も0でなければ、むしろ強く関係している
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(1,6)*Fraction(1,6)==Fraction(1,36)
- id: TERM-cond
  name: 条件付き確率
  en: conditional probability
  category: 確率
  forms: [number]
  basis_formula: F-cond-def
  short: ある事象が起きたと分かったうえで、別の事象が起こる確率
  definition: 事象 A が起きたと分かったうえで、事象 B が起こる確率。P(B|A) と書き、両方の確率を A の確率で割った P(A∩B)÷P(A)。
  version: 1
  principle: A が起きたと分かると、起こりうる結果は A の中だけに絞られる。標本空間を A に取り直し、その中で B にも入る結果（A∩B）の割合を見る。だから両方の確率 P(A∩B) を、新しい全体 P(A) で割る。
  formulas:
    - id: F-cond-def
      label: 条件付き確率の定義
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: B|A, meaning: A を条件にした B（P( | ) の中だけの書き方。B|A という事象があるのではない）, key: BgA, kind: value}
        - {symbol: A∩B, meaning: A と B が両方起きる, key: AB, kind: value}
        - {symbol: A, meaning: 条件にする事象（起きたと分かっている）, key: A, kind: value}
        - {symbol: B, meaning: 確率を求める事象, key: B, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: BgA}]}
          - op: div
            args:
              - {op: fn, name: P, args: [{sym: AB}]}
              - {op: fn, name: P, args: [{sym: A}]}
      parts:
        - {path: [1, 0], name: 両方, meaning: A の中で B にも入る結果の確率}
        - {path: [1, 1], name: 新しい全体, meaning: 起きたと分かった A の確率で割り、A を全体として見直す}
  conditions:
    math:
      - text: 条件にする事象 A の確率は 0 より大きい（P(A)＞0）
        kind: 要件
        outside: 条件付き確率が定義されない（0 で割ることになる）
    data:
      - 「〜のうち」の分母が何かを確かめる。P(B|A)（A のうち B）と P(A|B)（B のうち A）は分母が違う
  example: 来店客 100 人のうち会員が 40 人、会員で買った人が 20 人なら、会員が買う確率は P(買う|会員)＝0.2÷0.4＝0.5。
  counterexample: さいころ1回で A＝「7の目」（どの結果も含まない A＝∅）とすると P(A)＝0 なので、「7の目が出たもとで偶数の確率」は 0 で割ることになり定義されない。
  misconceptions:
    - misconception: P(B|A) と P(A|B) は同じ
      correction: 分母が違う。会員 40 人のうち買った 20 人なら P(買う|会員)＝0.5、買った人が 50 人なら P(会員|買う)＝20÷50＝0.4
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - 'Fraction(20,100)/Fraction(40,100) == Fraction(1,2) and Fraction(20,50) == Fraction(2,5)'
- id: TERM-bayes
  name: ベイズの定理
  en: Bayes' theorem
  category: 確率
  forms: [proposition]
  claims: [CLM-23]
  basis:
    text: P(H)＞0・P(D)＞0 の事象 H・D について、P(H|D)＝P(D|H)P(H)/P(D)（④-23）
    terms: [TERM-cond, TERM-prob, TERM-event]
  short: 結果が分かったときに、その原因の確率を、条件付き確率を逆向きにして求める式
  definition: 結果 D が分かったときの原因 H の確率 P(H|D) を、逆向きの条件付き確率 P(D|H) と、H のもともとの確率 P(H) から求める式。P(H|D)＝P(D|H)P(H)÷P(D)。
  version: 1
  principle: 乗法定理で両方の確率を2通りに書くと、P(H)P(D|H)＝P(D)P(H|D)。これを P(H|D) について解いた形。分母の P(D) は全確率の公式で、原因ごとに足して求める。「原因 → 結果」の確率から「結果 → 原因」の確率へ向きを替える。
  formulas:
    - id: F-bayes
      label: 向きを替える
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: H|D, meaning: D を条件にした H（事後確率）, key: HgD, kind: value, concept: TERM-posterior}
        - {symbol: D|H, meaning: H を条件にした D（尤度）, key: DgH, kind: value, concept: TERM-likelihood}
        - {symbol: H, meaning: 原因・仮説（その確率 P(H) が事前確率）, key: H, kind: value}
        - {symbol: D, meaning: 観測した結果, key: D, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: HgD}]}
          - op: div
            args:
              - op: mul
                args:
                  - {op: fn, name: P, args: [{sym: DgH}]}
                  - {op: fn, name: P, args: [{sym: H}]}
              - {op: fn, name: P, args: [{sym: D}]}
      parts:
        - {path: [1, 0], name: 原因から結果, meaning: 尤度×事前確率（H でありかつ D が起きる確率）}
        - {path: [1, 1], name: 結果の全体, meaning: D が起きる確率（全確率の公式で原因ごとに足す）}
  conditions:
    math:
      - text: H・D は同じ確率 P の事象（P(D)＞0・P(H)＞0 は条件付き確率の要件）
        kind: 仮定
        claim: CLM-23
        outside: ④-23 は保証されない（違う集団の確率を組み合わせると、事後確率にならない）
    data:
      - 事前確率（有病率など）と尤度（検査の感度・偽陽性など）が、同じ集団について決めた数かを確かめる
  example: 病気の人が 1%、病気の人が陽性になる確率 0.9、病気でない人が陽性になる確率 0.05 の検査で、陽性の人が病気である確率は 0.01×0.9÷0.0585≒0.154。
  counterexample: 健診の受診者（有病率 1%）の陽性者に、病院に来た人の有病率 30% を事前確率として当てると、0.3×0.9÷(0.3×0.9＋0.7×0.05)≒0.885 となり、健診の受診者での 0.154 と大きく違う。事前確率と尤度が同じ集団の数でないと、事後確率にならない。
  misconceptions:
    - misconception: 検査の結果はその人のものなので、集団の有病率は関係ない
      correction: 同じ陽性でも、有病率 1% の集団なら病気である確率は約 0.154、30% の集団なら約 0.885。結果の読み方は事前確率で大きく変わる
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.01*0.9/(0.01*0.9 + 0.99*0.05) - 0.154) < 0.001 and abs(0.3*0.9/(0.3*0.9 + 0.7*0.05) - 0.885) < 0.001
- id: TERM-prior
  name: 事前確率
  en: prior probability
  category: 確率
  forms: [number]
  basis:
    text: 結果 D を見る前に、原因・仮説 H（事象）に割り当てる確率 P(H)
    terms: [TERM-prob, TERM-event]
  short: データ（結果）を見る前に、原因や仮説について持っている確率
  definition: 結果（データ）を見る前に、原因や仮説 H に割り当てておく確率 P(H)。
  version: 1
  principle: ベイズの定理は、事前確率を結果で更新して事後確率にする。同じ検査結果でも、事前確率が小さい（めったにない原因）ほど、事後確率は小さくとどまる。事前確率は、結果とは別の情報（過去の割合・集団の有病率など）で決める。
  conditions:
    math:
      - text: P(H) は D で条件付けない、同じ確率 P のもとでの H の確率
        kind: 要件
        outside: 事前確率にならない（同じ結果を2回使い、更新が二重になる）
    data:
      - 事前確率は、結果 D を見る前の情報（過去の割合・集団の有病率など）で決める。どの集団の割合を使ったかを書く（健診の受診者か、病院に来た人か）
  example: 健診の受診者で、ある病気の人の割合が 1% なら、検査をする前の事前確率は 0.01。
  counterexample: 陽性者の中での病気の割合 0.154（陽性で条件付けた数）を事前確率にして、同じ陽性でもう一度更新すると約 0.766 になる。1回の陽性を2回使った数で、事前確率の使い方として誤り。
  misconceptions:
    - misconception: 事前確率が分からないときは、1/2 にすれば中立
      correction: 1/2 も1つの決め方で、結果を大きく動かす。有病率 1% の検査で事前確率を 1/2 にすると、陽性のときの事後確率は約 0.947 になり、0.154 とまったく違う
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.5*0.9/(0.5*0.9 + 0.5*0.05) - 0.947) < 0.001
- id: TERM-likelihood
  name: 尤度
  en: likelihood
  category: 確率
  forms: [number]
  basis:
    text: 原因・仮説 H のもとで、観測した結果 D が起こる条件付き確率 P(D|H)（D を固定し、H を替えて比べる）
    terms: [TERM-cond]
  short: ある原因や仮説のもとで、実際に得られた結果が起こる確率
  definition: 原因や仮説 H のもとで、実際に観測した結果 D が起こる条件付き確率 P(D|H)。D を固定して、H を替えて比べる。
  version: 1
  principle: 観測した結果は1つに決まっているので、「どの原因のもとなら、この結果が起きやすいか」を比べる数になる。H を替えた尤度を足しても1になるとは限らない（H についての確率分布ではない）。ベイズの定理では、尤度が事前確率を重み付けして事後確率を作る。
  conditions:
    math:
      - text: 比べる尤度は、どれも同じ観測結果 D についての条件付き確率（D を観測した結果に固定し、H だけを替える）
        kind: 要件
        outside: 尤度として比べられない（D を替えると、別の問いの数になる）
    data:
      - 尤度の数（感度・偽陽性の率など）が、どの結果についての数かを確かめる（陽性になる確率か、陰性になる確率か）
  example: 陽性という結果について、病気のときの尤度は 0.9、病気でないときの尤度は 0.05。陽性は「病気」のもとで起きやすい（病気である確率が高いという意味ではない）。
  counterexample: 「病気のとき陽性になる確率 0.9」と「病気でないとき陰性になる確率 0.95」を並べて比べるのは、結果 D が陽性と陰性で違うので、尤度の比べ方ではない（陽性について比べるなら 0.9 と 0.05）。
  misconceptions:
    - misconception: 同じ結果について、原因ごとの尤度を足すと1になる
      correction: 足して1になるのは、同じ原因のもとで結果を替えたとき（陽性 0.9＋陰性 0.1）。原因を替えた 0.9＋0.05＝0.95 は1にならない
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.9 + 0.05 - 0.95) < 1e-12 and abs(0.9 + 0.1 - 1) < 1e-12
- id: TERM-rv
  name: 確率変数
  en: random variable
  category: 確率分布
  group: GRP-dist-base
  forms: [rv]
  basis:
    text: 試行の結果（標本空間の要素）の1つ1つに、実数を1つ対応させるもの。どの結果が起きるかで値が決まる
    terms: [TERM-sample-space]
  definition: 試行の結果に応じて値が決まり、どの値が出るかが確率で表される量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 値と確率の一覧を動かして、確率変数が「値の出方の規則」を持つことを見る}
  principle: 起こりうる値と、その確率の組（確率分布）で性質が決まる。1つの記録された値ではなく、記録する前の「値の出方」を扱う。
  formulas:
  - id: F-rv-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: x
      meaning: X がとる値
      key: x
      kind: value
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "x"}]}], "name": "P"}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}
  - {ref: F-dist-sum}   # 同じ式 Σp(x)=1 の元は確率分布（TERM-dist）。build が元の式を写し、defined_in を付ける（#118 D2）
  conditions:
    math:
    - text: 試行の結果ごとに、値が1つ決まる
      kind: 要件
      outside: 結果に値が1つに決まらなければ、確率変数として扱えない
    data:
    - 「記録する前の値の出方」として扱えるか（同じ仕組みでくり返し起きるか）を確かめる
  example: さいころの目 X は、1〜6 の値をそれぞれ確率 1/6 でとる。
  counterexample: 「今日の売上 120万円」という1つの記録は確率変数ではなく、実現した1つの値。
  misconceptions:
  - misconception: 確率変数は「でたらめな数」のこと
    correction: 値の出方に決まった確率（分布）がある量。でたらめさの中に規則がある
  - misconception: X と x は同じものを指す
    correction: 大文字 X は取り直すたびに値が変わる確率変数、小文字 x はその実際に出た値。P(X＝x) は「X が値 x をとる確率」
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
