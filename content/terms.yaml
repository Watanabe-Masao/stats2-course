- id: TERM-geom
  name: 幾何分布
  en: geometric distribution
  category: 確率分布
  group: GRP-dist-wait
  forms: [distribution]
  definition: 成功確率 p の独立な試行を、初めて成功するまで繰り返したときの試行回数の分布。
  version: 1
  labs:
  - {id: LAB-pois, preset: s3-free, purpose: 「成功するまで」のモードで、初めて成功する回の確率と平均を見る}
  principle: k−1 回続けて失敗してから成功する確率なので (1−p)^(k−1)p。毎回の確率が同じで独立なので、それまでの失敗は次の確率を変えない（無記憶性）。
  formulas:
  - id: F-geom-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: k
      meaning: 初めて成功した回（成功した回も数える）
      range: 1以上の整数
      key: k
      kind: value
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0より大きく1以下
      key: p
      kind: param
      domain: {min: 0, max: 1, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"sym": "k"}, {"num": 1}]}]}, {"sym": "p"}]}]}
  - id: F-geom-mean
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: p
      meaning: 1回の成功確率
      range: 0より大きく1以下
      key: p
      kind: param
      domain: {min: 0, max: 1, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "div", "args": [{"num": 1}, {"sym": "p"}]}]}
  - id: F-geom-var
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: p
      meaning: 1回の成功確率
      range: 0より大きく1以下
      key: p
      kind: param
      domain: {min: 0, max: 1, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "pow", "args": [{"sym": "p"}, {"num": 2}]}]}]}
  basis_formula: F-geom-pmf
  conditions:
    math:
    - text: 0＜p≦1
      kind: 要件
      outside: 母数が範囲の外なら、この定義の幾何分布として扱えない
    data:
    - 回を重ねるほど成功しやすくなる（慣れ・学習）や、しにくくなる場面には当てはまらない
    - 「失敗の回数」で数える流儀もある（期待値は (1−p)/p）。問題文の数え方を確かめる
  example: さいころで初めて6が出るまでの回数の期待値は 1÷(1/6)＝6回。
  counterexample: 期待値が6回でも、いちばん起きやすいのは1回目（確率 1/6）。6回目に初めて出る確率は (5/6)⁵×(1/6)≒0.067 と小さい。
  misconceptions:
  - misconception: 5回続けて外れたので、次は当たりやすい
    correction: 各回は独立なので、次の当たる確率は p のまま（無記憶性）
  - misconception: 幾何分布の期待値はいつも 1/p
    correction: 失敗の回数で数えると (1−p)/p。何を数えるかで式が変わる
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(1,1)/Fraction(1,6)==6
  - abs((5/6)**5*(1/6)-0.067)<0.0005
