      range: 0より大きく1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "div", "args": [{"num": 1}, {"sym": "p"}]}]}
  - tex: 'V(X)=\frac{1-p}{p^2}'
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: p
      meaning: 1回の成功確率
      range: 0より大きく1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "pow", "args": [{"sym": "p"}, {"num": 2}]}]}]}
  conditions:
    math:
    - 各回が独立
    - 成功確率 p が毎回同じ
    data:
    - 回を重ねるほど成功しやすくなる（慣れ・学習）や、しにくくなる場面には当てはまらない
    - 「失敗の回数」で数える流儀もある（期待値は (1−p)/p）。問題文の数え方を確かめる
  example: さいころで初めて6が出るまでの回数の期待値は 1÷(1/6)＝6回。
  counterexample: 期待値が6回でも、いちばん起きやすいのは1回目（確率 1/6）。6回目に初めて出る確率は (5/6)⁵×(1/6)≒0.067 と小さい。
  misconceptions:
  - misconception: 5回続けて外れたので、次は当たりやすい
    correction: 各回は独立なので、次の当たる確率は p のまま（無記憶性）
  - misconception: 幾何分布の期待値はいつも 1/p
    correction: 失敗の回数で数えると (1−p)/p。何を数えるかで式が変わる
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(1,1)/Fraction(1,6)==6
  - abs((5/6)**5*(1/6)-0.067)<0.0005
- id: TERM-negbinom
  name: 負の二項分布
  en: negative binomial distribution
  definition: 成功確率 p の独立な試行を、r 回目の成功が起きるまで繰り返したときの試行回数の分布。
  version: 1
  labs:
  - {id: LAB-pois, preset: s3-free, purpose: 「成功するまで」のモードで r を増やし、r＝1 の幾何分布から形が変わるのを見る}
  principle: k 回目に r 回目の成功が起きるのは、それまでの k−1 回にちょうど r−1 回成功し、k 回目に成功するとき。並び方の数 ₖ₋₁C_{r−1} を掛ける。r＝1 なら幾何分布。
  formulas:
  - tex: 'P(X=k)={}_{k-1}C_{r-1}\,p^r(1-p)^{k-r}\quad(k=r,r+1,\dots)'
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: k
      meaning: r 回目の成功が起きた回（成功した回も数える）
      key: k
      kind: value
      range: r 以上の整数
      domain: {min: r, integer: true}
    - symbol: r
      meaning: 待つ成功の回数
      key: r
      kind: param
      range: 1以上の整数
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      key: p
      kind: param
      range: 0より大きく1以下
      domain: {min: 0, max: 1}
    - symbol: ₖ₋₁C_{r−1}
      meaning: 前の k−1 回から成功の r−1 回を選ぶ組合せの数
      key: comb
      concept: TERM-comb
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "fn", "args": [{"op": "sub", "args": [{"sym": "k"}, {"num": 1}]}, {"op": "sub", "args": [{"sym": "r"}, {"num": 1}]}], "name": "comb"}, {"op": "pow", "args": [{"sym": "p"}, {"sym": "r"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"sym": "k"}, {"sym": "r"}]}]}]}]}
  conditions:
    math:
    - 各回が独立
    - 成功確率 p が毎回同じ
    data:
    - 「r 回成功するまで」を数える場面（3件成約するまでの訪問回数など）。回数を決めて成功の数を数えるなら二項分布
  example: 成功率0.5で、2回目の成功がちょうど3回目の試行で起きる確率は ₂C₁×0.5²×0.5＝0.25。
  counterexample: 回数 n を先に決めて成功の数を数えるなら二項分布。何を固定し、何を数えるかが逆になる。
  checks:
  - math.comb(2,1)*0.5**2*0.5==0.25
