      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: Y
      meaning: 確率変数
      key: Y
      kind: rv
    - symbol: μ_X
      meaning: X の期待値
      key: muX
      concept: TERM-expect
      kind: param
      of: X
    - symbol: μ_Y
      meaning: Y の期待値
      key: muY
      concept: TERM-expect
      kind: param
      of: Y
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}, {"sym": "Y"}], "name": "Cov"}, {"op": "fn", "args": [{"op": "mul", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "muX"}]}, {"op": "sub", "args": [{"sym": "Y"}, {"sym": "muY"}]}]}], "name": "E"}, {"op": "sub", "args": [{"op": "fn", "args": [{"op": "mul", "args": [{"sym": "X"}, {"sym": "Y"}]}], "name": "E"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "fn", "args": [{"sym": "Y"}], "name": "E"}]}]}]}
  - id: F-cov-varsum
    label: 和の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: Cov( )
      meaning: 共分散（ずれの積の期待値）
      key: Cov
      concept: TERM-cov
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: Y
      meaning: 確率変数
      key: Y
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"sym": "X"}, {"sym": "Y"}]}], "name": "V"}, {"op": "add", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "fn", "args": [{"sym": "Y"}], "name": "V"}, {"op": "mul", "args": [{"num": 2}, {"op": "fn", "args": [{"sym": "X"}, {"sym": "Y"}], "name": "Cov"}]}]}]}
  basis_formula: F-cov-def
  conditions:
    math:
    - text: X・Y の分散が有限
      kind: 要件
      outside: この教材の有限分散を前提とする共分散の定義域として扱えない（一般には共分散が存在する場合もある）
      terms:
      - TERM-var
    data:
    - 単位で値が変わる（円を千円にすると1000分の1）。関係の強さを比べるなら相関係数にする
    - 直線的な関係しか測らない
  example: X が 0・1 を確率 1/2 ずつとり Y＝X のとき、Cov(X, Y)＝V(X)＝1/2−(1/2)²＝1/4。
  counterexample: X が −1・0・1 を確率 1/3 ずつとり Y＝X² のとき、Y は X で決まるのに Cov(X, Y)＝0（無相関でも独立ではない）。
  misconceptions:
  - misconception: 共分散が0なら関係がない（独立）
    correction: 0なのは直線的な関係がないだけ。Y＝X² のように強い関係があっても0になる
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(1,2)-Fraction(1,2)**2==Fraction(1,4)
  - Fraction(-1,3)+0+Fraction(1,3)==0
- id: TERM-binom
  name: 二項分布
  en: binomial distribution
  category: 確率分布
  group: GRP-dist-count
  forms: [distribution]
  short: 同じ条件で成功・失敗をくり返したとき、成功回数がどのような確率で現れるかを表す分布   # 一言（地図・実験室の入口に出す。渡辺さん 2026-11-02）
  # 概念のページの概要の最初の画面（R1c・#188 02）：問い → つまり → 図 → 定義
  question: 同じ条件で n 回くり返すと、成功は何回くらいになる？
  gist: 成功確率が毎回同じで、前の結果に左右されない試行を n 回行い、成功回数を数える。何回成功するかの起こりやすさを並べたのが二項分布。
  chart: {kind: binom, n: 10, p: 0.3, note: いちばん起こりやすいのは 3 回。平均 np＝3 回の近くに山ができる。}   # 数は engine が描く（画像にしない。#188 01b）
  definition: 成功確率 p の独立な試行を n 回くり返したときの、成功した回数の分布 B(n, p)。
  version: 1
  workspace: {formula: 0, vary: [n, p], over: k, mean: 1, linear: 3}   # 式の作業台（#110）。linear：変換の欄の式（#156）
  figures: [FIG-U14-concept, FIG-LAB-binom-def-tour-1, FIG-LAB-binom-def-tour-2, FIG-LAB-binom-def-tour-3]
  labs:
  - {id: LAB-binom, preset: def-tour, purpose: 1回の試行から、並び1つの確率×並びの数で式を組み立てる}
  - {id: LAB-binom, preset: s1-path, purpose: 並び方の数×1つの並びの確率を、予測してから確かめる}
  principle: 「どの k 回が成功か」の組合せ ₙCₖ と、その1通りの確率 pᵏ(1−p)ⁿ⁻ᵏ の積。成功回数は n 個の「成功1・失敗0」の和なので、期待値と分散が和から求まる。
  formulas:
  - id: F-binom-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: k
      meaning: 成功の回数
      range: 0以上 n 以下の整数
      key: k
      kind: value
      domain: {min: 0, max: n, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    - symbol: ₙCₖ
      meaning: n 回から成功の k 回を選ぶ組合せの数
      key: comb
      concept: TERM-comb
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "n"}, {"sym": "k"}], "name": "comb"}, {"op": "pow", "args": [{"sym": "p"}, {"sym": "k"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"sym": "n"}, {"sym": "k"}]}]}]}]}
    parts:   # 意味のかたまり（作業台で押せる部分式。#110）
    - path: [1, 0]
      name: 並び方の数
      meaning: n 回のうち、どの k 回が成功かの選び方の数。成功が k 回ある並びはどれも確率が同じなので、この数だけ足し合わせる
    - path: [1, 1]
      name: 選んだ k 回が全部成功する確率
      meaning: 成功の回と決めた k 回が全部成功する確率。1回の成功確率 p を k 回掛け合わせる（各回は独立）。n 回全体でちょうど k 回成功する確率とは別
    - path: [1, 2]
      name: 残りの回が全部失敗する確率
      meaning: 残りの n−k 回が全部失敗する確率。1回の失敗確率 1−p を n−k 回掛け合わせる
    why:   # なぜこの式で確率が求まるか（作業台の読み方「構造」で順に出す。parts は上の部品の番号。#188）
      steps:
      - title: 事象は「結果の集まり」
        text: 「ちょうど k 回成功」は1つの結果ではなく、成功が k 個ある並びを全部集めたもの。並びどうしは同時に起きないので、事象の確率は、そこに入る結果の確率を全部足したものになる（確率の加法）。
      - title: 1つの結果の確率は掛け算
        text: 1つの並びは「1回目が成功で、2回目が失敗で、…」が全部いっしょに起きること。各回は独立なので、各回の確率を掛ける。毎回同じ p とすると、成功の回は p、失敗の回は 1−p だから、[[1]][[2]] になる。
        parts: [1, 2]
      - title: 成功回数が同じ並びは、同じ確率
        text: 毎回の成功確率は同じ p なので、成功が k 回ある並びなら、成功の場所がどこでも、掛ける数の組 [[1]][[2]] は同じになる（成功回数が違う並びとは、ふつうは確率が違う。だから並びは成功回数ごとにまとめる）。だから「全部足す」は「同じ値 × 並びの個数」になる。
        parts: [1, 2]
      - title: 個数は場所の選び方
        text: 成功が k 個ある並びの数は、n 回のうちどの k 回を成功にするかの選び方の数 [[0]]。これで「並びの個数 [[0]] × 1つの並びの確率 [[1]][[2]]」の形になる。
        parts: [0, 1, 2]
      note: 前提が崩れると段が崩れる。各回が独立でないと 2 段目の掛け算が成り立たず、回ごとに成功確率が違うと 3 段目の「同じ確率」が成り立たない。
  - id: F-binom-mean
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "mul", "args": [{"sym": "n"}, {"sym": "p"}]}]}
  - id: F-binom-var
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
      key: n
      kind: param
      domain: {min: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "mul", "args": [{"sym": "n"}, {"sym": "p"}, {"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}]}]}
  - {ref: F-expect-linear}   # 変換の欄（作業台の型 #156）。E(aX＋b)＝aE(X)＋b
  basis_formula: F-binom-pmf
  conditions:
    math:
    - text: n は1以上の整数（教材では n＝0 を扱わない）・0≦p≦1
      kind: 要件
      outside: 母数が範囲の外なら、この定義の二項分布として扱えない
    - text: 回数 n が決まっている
      kind: 仮定
      claim: 成功回数 X が B(n, p) に従う
      outside: 成功回数に二項分布を使えるとは保証できない（偶然に一致することはある）
    - text: 結果が成功・失敗の2つ
      kind: 仮定
      claim: 成功回数 X が B(n, p) に従う
      outside: 成功回数に二項分布を使えるとは保証できない（偶然に一致することはある）
    - text: 各回の成功確率 p が同じ
      kind: 仮定
      claim: 成功回数 X が B(n, p) に従う
      outside: 成功回数に二項分布を使えるとは保証できない（偶然に一致することはある）
    - text: 各回が独立
      kind: 仮定
      claim: 成功回数 X が B(n, p) に従う
      outside: 成功回数に二項分布を使えるとは保証できない（偶然に一致することはある）
      terms:
      - TERM-indep
    data:
    - 客ごとの購入のように、互いに影響しない（口コミや連れ立ちがない）か、p が客や時間でほぼ同じかを確かめる
  example: 来店客10人がそれぞれ確率 0.3 で買う（互いに独立）なら、買う人数は B(10, 0.3)。期待値は3人、分散は2.1。
  counterexample: 箱から戻さずに取り出すと、前に何が出たかで次の当たりの確率が変わる（独立でない）ので二項分布ではない（超幾何分布）。前の結果を知らなければ、どの回も当たりの確率は同じ。
  misconceptions:
  - misconception: ちょうど期待値 np 回になる確率が高い
    correction: np が整数でなければ、ちょうど np 回は起きない。整数なら np はいちばん起きやすい値だが、その確率自体は小さいことが多い（n が大きいほど小さい）
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  - source: NIST統計ハンドブック   # 公式テキストの代わりに照らした（定義・式・平均・分散・最頻値。食い違いなし。#188 01c）
    locator: 1.3.6.6.18 Binomial Distribution
  checks:
  - abs(10*0.3-3)<1e-12 and abs(10*0.3*0.7-2.1)<1e-12
  - 3 <= (10+1)*0.3 < 4 and abs(10*0.3-3)<1e-12   # 図の一言：いちばん起こりやすいのは 3 回・平均 np＝3（chart の n・p）
- id: TERM-poisson
  name: ポアソン分布
  en: Poisson distribution
  category: 確率分布
