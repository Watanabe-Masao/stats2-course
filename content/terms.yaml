      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    - symbol: x
      meaning: 待ち時間
      range: 0以上
      key: x
      kind: value
    - symbol: e
      meaning: 自然対数の底（約2.718）
      key: e
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}, {"op": "mul", "args": [{"sym": "lambda"}, {"op": "pow", "args": [{"sym": "e"}, {"op": "neg", "args": [{"op": "mul", "args": [{"sym": "lambda"}, {"sym": "x"}]}]}]}]}]}
  - id: F-expo-surv
    label: 待ち時間が x を超える確率
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 単位時間あたりに起きる平均の回数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    - symbol: x
      meaning: 待ち時間
      range: 0以上
      key: x
      kind: value
    - symbol: e
      meaning: 自然対数の底（約2.718）
      key: e
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "fn", "args": [{"sym": "X"}, {"sym": "x"}], "name": "gt"}], "name": "P"}, {"op": "pow", "args": [{"sym": "e"}, {"op": "neg", "args": [{"op": "mul", "args": [{"sym": "lambda"}, {"sym": "x"}]}]}]}]}
  - id: F-expo-mean
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 単位時間あたりに起きる平均の回数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "div", "args": [{"num": 1}, {"sym": "lambda"}]}]}
  - id: F-expo-var
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 単位時間あたりに起きる平均の回数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"num": 1}, {"op": "pow", "args": [{"sym": "lambda"}, {"num": 2}]}]}]}
  conditions:
    math:
    - λ＞0
    - 出来事が一定の割合で独立に起きる
    data:
    - 時間帯で起きる割合が変わる（昼と夕方で客の来方が違う）と当てはまらない。時間帯を分けて見る
  example: 1時間に平均4人来る（λ＝4/時）とき、次の客までの平均の待ち時間は 1/4 時間＝15分。
  counterexample: 10分待っても、そこから先の待ち時間の分布は待ち始めと同じ。「そろそろ来るはず」は成り立たない。
  misconceptions:
  - misconception: 平均15分なら、15分あたりで来ることが多い
    correction: 密度は0分がいちばん高く、待つほど下がる。平均より早く来る確率は 1−e^(−1)≒63%
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(60,4)==15
  - math.isclose(math.exp(-4*(15/60))/math.exp(-4*(10/60)), math.exp(-4*(5/60)))
  - abs(1-math.exp(-1)-0.632)<0.0005
- id: TERM-pdf
  name: 確率密度関数
  en: probability density function
  category: 確率分布
  definition: 連続な確率変数で、区間に入る確率を、その区間の下の面積で表す関数。
  version: 1
  labs:
  - {id: LAB-cont, preset: s1-dens, purpose: 密度の高さは1を超えても、面積は1のままなのを見る}
  principle: 連続では1点の確率は0で、確率は面積（積分）で決まる。高さ f(x) は「その付近の出やすさの密度」。
  formulas:
  - id: F-pdf-interval
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: f(x)
      meaning: 確率密度（高さ）
      range: 0以上（1を超えてもよい）
      key: f
    - symbol: x
      meaning: 積分で動かす値
      key: x
      kind: index
    - symbol: a
      meaning: 区間の左端
      key: a
      kind: value
    - symbol: b
      meaning: 区間の右端
      key: b
      kind: value
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "fn", "args": [{"sym": "a"}, {"sym": "X"}, {"sym": "b"}], "name": "between"}], "name": "P"}, {"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x", "lower": {"sym": "a"}, "upper": {"sym": "b"}}]}
  - id: F-pdf-total
    label: 全体の面積は1
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ）
      key: f
    - symbol: x
      meaning: 積分で動かす値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - f(x) が0以上
    - 全体の面積が1
    data:
    - ヒストグラムを「相対度数÷階級の幅」で描くと、密度の推定になる
  example: 0〜10分に一様に来るバスで、3〜5分の間に来る確率は 2÷10＝0.2。
  counterexample: 0〜0.5 の一様分布の密度の高さは 2 で、1を超える。密度は確率ではないので1を超えてよい。
  misconceptions:
  - misconception: f(x) は X が x になる確率
    correction: 連続では1点の確率は0。f(x) は面積を作る高さで、確率は区間の面積
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(2,10)==Fraction(1,5)
  - 1/0.5==2
- id: TERM-uniform
  name: 一様分布
  en: uniform distribution
  category: 確率分布
  definition: 区間 [a, b] のどこにも同じ密度で値をとる連続分布。
  version: 1
  labs:
  - {id: LAB-cont, preset: s3-free, purpose: 「一様分布」のモードで、確率が区間の長さに比例するのを見る}
  principle: 密度は 1/(b−a) で一定なので、確率は区間の長さに比例する。
  formulas:
  - id: F-uniform-pdf
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ。面積が確率）
      key: f
      concept: TERM-pdf
    - symbol: x
      meaning: 値
      key: x
      kind: value
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}, {"op": "div", "args": [{"num": 1}, {"op": "sub", "args": [{"sym": "b"}, {"sym": "a"}]}]}]}
  - id: F-uniform-mean
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "div", "args": [{"op": "add", "args": [{"sym": "a"}, {"sym": "b"}]}, {"num": 2}]}]}
  - id: F-uniform-var
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "b"}, {"sym": "a"}]}, {"num": 2}]}, {"num": 12}]}]}
  conditions:
    math:
    - a＜b
    - 区間の外の密度は0
    data:
    - 「どこも同じ出やすさ」は仮定。ヒストグラムが平らかで確かめる
  example: 0〜10分の一様分布の期待値は5分、分散は 100/12≒8.33。
  counterexample: 平均±1σ に入る割合は 1/√3≒57.7% で、正規分布の約68.3%と違う。標準偏差が同じでも、形が違えば割合は違う。
  misconceptions:
  - misconception: 一様分布なら、どの値も同じ確率で出る
    correction: 連続なので1点の確率は0。同じなのは「同じ長さの区間に入る確率」
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(0+10,2)==5
  - abs(100/12-8.33)<0.005
  - abs(1/math.sqrt(3)-0.577)<0.0005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
- id: TERM-sampdist
  name: 標本分布
  en: sampling distribution
  category: 標本分布・極限
  short: 同じ大きさの標本を何度も取ったときに、統計量がとる値の分布
- id: TERM-se
  name: 標準誤差
  en: standard error
  category: 標本分布・極限
  short: 推定量の標本分布の標準偏差で、推定値がくり返しでどれだけぶれるかの大きさ
- id: TERM-lln
  name: 大数の法則
  en: law of large numbers
  category: 標本分布・極限
  short: 標本の大きさを大きくすると、標本平均が母平均に近づくという法則
- id: TERM-clt
  name: 中心極限定理
  en: central limit theorem
  category: 標本分布・極限
  short: 独立に同じ分布から取った標本平均の分布は、n が大きいと正規分布に近づくという定理
- id: TERM-cc
  name: 連続修正
  en: continuity correction
  category: 標本分布・極限
  short: 離散分布を連続分布で近似するとき、区間の端を0.5ずらして近似をよくする工夫
- id: TERM-t
  name: t 分布
  en: t distribution
  category: 標本分布・極限
  short: 母分散を不偏分散で置き換えて標準化した標本平均が従う分布で、自由度が大きいと標準正規分布に近づく
- id: TERM-chi2
  name: カイ二乗分布
  en: chi-squared distribution
  category: 標本分布・極限
  short: 独立な標準正規分布の確率変数を2乗して足した値が従う分布
- id: TERM-f
  name: F 分布
  en: F distribution
  category: 標本分布・極限
  short: 独立な2つのカイ二乗分布の確率変数を、それぞれ自由度で割った比が従う分布
- id: TERM-df
  name: 自由度
  en: degrees of freedom
  category: 標本分布・極限
  short: 統計量を計算するときに自由に動ける値の個数で、t・カイ二乗・F 分布の形を決める
- id: TERM-estimator
  name: 推定量
  en: estimator
  category: 推定
  short: 母数を推定するために使う統計量（標本から値が決まる式）
- id: TERM-point-est
  name: 点推定
  en: point estimation
  category: 推定
  short: 母数の値を、推定量から求めた1つの値で推定すること
- id: TERM-consistency
  name: 一致性
  en: consistency
  category: 推定
  short: 標本の大きさを大きくすると、推定量が母数に近づいていく性質
- id: TERM-efficiency
  name: 有効性
  en: efficiency
  category: 推定
  short: 不偏な推定量のうち、分散が小さい（ぶれが小さい）ものほどよいとする性質
- id: TERM-mse
  name: 平均二乗誤差（MSE）
  en: mean squared error
  category: 推定
  short: 推定量と母数のずれの2乗の期待値で、推定量の分散と偏りの2乗の和になる
- id: TERM-ci
  name: 信頼区間
  en: confidence interval
  category: 推定
  short: 区間推定で求める区間で、同じ方法をくり返すと決めた割合で母数を含む
- id: TERM-conf-level
  name: 信頼係数
  en: confidence level
  category: 推定
  short: 信頼区間を作る方法が、くり返したときに母数を含む割合（95%など）
- id: TERM-paired-t
  name: 対応のある t 検定
  en: paired t-test
  category: 検定
  short: 同じ対象の2つの測定値の差をとり、差の平均が0かどうかを t 分布で調べる方法
- id: TERM-welch
  name: ウェルチの t 検定
  en: Welch's t-test
  category: 検定
  short: 2群の分散が等しいと仮定せずに、2群の平均の差を t 分布で調べる方法
- id: TERM-h0
  name: 帰無仮説
  en: null hypothesis
  category: 検定
  short: 検定で「差がない・効果がない」などとして立て、データで退けられるかを調べる仮説
- id: TERM-h1
  name: 対立仮説
  en: alternative hypothesis
  category: 検定
  short: 帰無仮説を退けたときに採る仮説で、調べたい差や効果があるとするもの
- id: TERM-test-stat
  name: 検定統計量
  en: test statistic
  category: 検定
  short: 帰無仮説のもとでの分布が分かるように作った統計量で、データのずれの大きさを1つの数にしたもの
- id: TERM-pvalue
  name: p値
  en: p-value
  category: 検定
  short: 帰無仮説が正しいとしたとき、観測した値か、それより極端な値が出る確率
- id: TERM-alpha
  name: 有意水準
  en: significance level
  category: 検定
  short: 帰無仮説を退ける基準の確率で、正しい帰無仮説を誤って退ける確率の上限（5%など）
- id: TERM-reject
  name: 棄却域
  en: rejection region
  category: 検定
  short: 検定統計量がその範囲に入ったら帰無仮説を退けると、前もって決めた範囲
- id: TERM-sides
  name: 片側検定・両側検定
  en: one-sided and two-sided tests
  category: 検定
  short: 対立仮説の向きによって、棄却域を分布の片方の端だけに置くか、両端に置くかの違い
- id: TERM-type1
  name: 第1種の過誤
  en: type I error
  category: 検定
  short: 帰無仮説が正しいのに、誤って退けてしまう誤り
- id: TERM-type2
  name: 第2種の過誤
  en: type II error
  category: 検定
  short: 帰無仮説が誤っているのに、退けられない誤り
- id: TERM-power
  name: 検出力
  en: power
  category: 検定
  short: 帰無仮説が誤っているときに、正しく退けられる確率（1−第2種の過誤の確率）
- id: TERM-pool
  name: プールした比率
  en: pooled proportion
  category: 検定
  short: 2群の割合の差を検定するとき、帰無仮説（割合が等しい）のもとで2群を合わせて求めた割合
- id: TERM-expected
  name: 期待度数
  en: expected frequency
  category: 検定
  short: 帰無仮説（独立・決めた割合どおり）が正しいとしたとき、各欄に入ると見込まれる度数
- id: TERM-indep-test
  name: 独立性検定
  en: test of independence
  category: 検定
  short: クロス集計表の2つの変数が独立かどうかを、期待度数とのずれからカイ二乗分布で調べる検定
- id: TERM-gof
  name: 適合度検定
  en: goodness-of-fit test
  category: 検定
  short: 観測した度数が、決めた理論の割合に合っているかを、カイ二乗分布で調べる検定
- id: TERM-crosstab
  name: クロス集計表
  en: cross tabulation
  category: 図表
  short: 2つの質的変数の組合せごとに度数を数えて並べた表
- id: TERM-scatter
  name: 散布図
  en: scatter plot
  category: 図表
  short: 2つの量的変数の値の組を、横軸と縦軸の座標の点で表した図
- id: TERM-partial-corr
  name: 偏相関係数
  en: partial correlation coefficient
  category: 相関・回帰
  short: 第3の変数の影響を取り除いたあとの、2つの変数の相関係数
- id: TERM-spurious
  name: 擬相関
  en: spurious correlation
  category: 相関・回帰
  short: 2つの変数に直接の関係がないのに、共通の第3の変数などのために見かけ上あらわれる相関
- id: TERM-ols
  name: 最小二乗法
  en: least squares method
  category: 相関・回帰
  short: 残差の2乗の和が最小になるように、回帰式の係数を決める方法
- id: TERM-regcoef
  name: 回帰係数
  en: regression coefficient
  category: 相関・回帰
  short: 回帰式で、説明変数が1増えたときに目的変数がどれだけ変わると見込むかを表す係数
- id: TERM-resid
  name: 残差
  en: residual
  category: 相関・回帰
  short: 観測した値から、回帰式で予測した値を引いた値
- id: TERM-r2
  name: 決定係数
  en: coefficient of determination
  category: 相関・回帰
  short: 目的変数のばらつきのうち、回帰式で説明できる割合（0〜1）
- id: TERM-extrap
  name: 外挿
  en: extrapolation
  category: 相関・回帰
  short: 回帰式を、データのある範囲の外の説明変数の値に当てはめて予測すること
- id: TERM-mreg
  name: 重回帰分析
  en: multiple regression analysis
  category: 相関・回帰
  short: 2つ以上の説明変数で目的変数を表す式を求める分析
- id: TERM-dummy
  name: ダミー変数
  en: dummy variable
  category: 相関・回帰
  short: 質的変数を回帰分析で使うため、当てはまれば1・当てはまらなければ0とした変数
- id: TERM-adjr2
  name: 自由度調整済み決定係数
  en: adjusted coefficient of determination
  category: 相関・回帰
  short: 説明変数を増やすだけでは大きくならないように、自由度で補正した決定係数
- id: TERM-ms
  name: 平均平方
  en: mean square
  category: 検定
  short: 平方和をその自由度で割った値で、分散分析や回帰でばらつきの大きさを比べるのに使う
- id: TERM-multicol
  name: 多重共線性
  en: multicollinearity
  category: 相関・回帰
  short: 重回帰分析で、説明変数どうしの相関が強く、回帰係数の推定が不安定になること
- id: TERM-strat-sampling
  name: 層化抽出
  en: stratified sampling
  category: 調査・実験
  short: 母集団をいくつかの層に分け、各層から無作為に標本を選ぶ方法
- id: TERM-cluster-sampling
  name: 集落抽出
  en: cluster sampling
  category: 調査・実験
  short: 母集団を集落（学校・地区など）に分け、無作為に選んだ集落の全員を調べる方法
- id: TERM-systematic-sampling
  name: 系統抽出
  en: systematic sampling
  category: 調査・実験
  short: 名簿の最初の1人を無作為に選び、そこから一定の間隔で選んでいく方法
- id: TERM-multistage-sampling
  name: 多段抽出
  en: multistage sampling
  category: 調査・実験
  short: 大きな単位から順に、何段階かに分けて無作為に選んでいく方法
- id: TERM-sampling-error
  name: 標本誤差
  en: sampling error
  category: 調査・実験
  short: 母集団の一部（標本）だけを調べることで生じる、結果と真の値のずれ
- id: TERM-nonsampling-error
  name: 非標本誤差
  en: non-sampling error
  category: 調査・実験
  short: 回答の誤り・無回答・抽出枠の不備など、標本を選ぶこと以外で生じるずれ
- id: TERM-randomize
  name: 無作為化
  en: randomization
  category: 調査・実験
  short: 実験で、対象をくじ引きのように処理の群へ割り当てること
- id: TERM-confound
  name: 交絡
  en: confounding
  category: 調査・実験
  short: 調べたい要因と結果の両方に関係する別の要因があり、その効果を区別できなくなること
- id: TERM-anova
  name: 分散分析
  en: analysis of variance
  category: 検定
  short: 3つ以上の群の平均に差があるかを、群の間と群の中のばらつきの比（F 分布）で調べる方法
- id: TERM-multcomp
  name: 多重比較
  en: multiple comparisons
  category: 検定
  short: 多くの群の組を検定するとき、全体として誤る確率が大きくならないように調整して比べる方法
- id: TERM-posterior
  name: 事後確率
  en: posterior probability
  category: 確率
  short: データ（結果）を見たあとで、ベイズの定理で更新した原因や仮説の確率
- id: TERM-mean
  name: 平均（算術平均）
  en: arithmetic mean
  category: 要約（代表値・散らばり）
  short: データの値をすべて足し、データの個数で割った値
- id: TERM-prob
  name: 確率（確率の公理）
  en: probability (axioms)
  category: 確率
  short: 事象の起こりやすさを0〜1の数で表したもので、全体は1、排反な事象では確率を足せる
- id: TERM-addition
  name: 加法定理
  en: addition rule
  category: 確率
  short: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から両方が起こる確率を引いたもの
- id: TERM-multiplication
  name: 乗法定理
  en: multiplication rule
  category: 確率
  short: 2つの事象が両方起こる確率は、一方の確率と、それが起きたときの他方の条件付き確率の積
- id: TERM-total-prob
  name: 全確率の公式
  en: law of total probability
  category: 確率
  short: 起こり方を排反な場合に分け、場合ごとの確率×条件付き確率を足して全体の確率を求める式
- id: TERM-bernoulli
  name: ベルヌーイ分布
  en: Bernoulli distribution
  category: 確率分布
  short: 1回の試行で、成功（1）を確率 p、失敗（0）を確率 1−p でとる分布
- id: TERM-sample-mean
  name: 標本平均
  en: sample mean
  category: 標本分布・極限
  short: 標本のデータの値を足し、データの個数で割った値
- id: TERM-sample-prop
  name: 標本比率
  en: sample proportion
  category: 標本分布・極限
  short: 標本の中で、ある性質をもつものの割合
- id: TERM-interval-est
  name: 区間推定
  en: interval estimation
  category: 推定
  short: 母数の値を、幅をもった区間で推定すること
- id: TERM-test
  name: 仮説検定
  en: hypothesis testing
  category: 検定
  short: 母集団についての仮説を立て、その仮説のもとでデータが起こりにくいかどうかで、仮説を退けるかを決める方法
- id: TERM-quantile
  name: 分位点
  en: quantile
  category: 要約（代表値・散らばり）
  short: データを小さい順に並べ、決めた割合の位置にくる値（下から10%の位置など）
- id: TERM-range
  name: 範囲
  en: range
  category: 要約（代表値・散らばり）
  short: データの最大値から最小値を引いた値
- id: TERM-slr
  name: 単回帰
  en: simple linear regression
  category: 相関・回帰
  short: 1つの説明変数で目的変数を表す直線の式（回帰直線）を求める分析
