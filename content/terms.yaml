- id: TERM-dist
  name: 確率分布
  en: probability distribution
  category: 確率分布
  group: GRP-dist-base
  forms: [distribution]
  basis:
    text: 確率変数がとる値（連続なら値の範囲）のそれぞれに、その確率を対応させたもの
    terms: [TERM-rv, TERM-prob]
  definition: 確率変数が、どの値やどの区間をどれだけの確率でとるかの対応。
  version: 2
  figures: [FIG-U13-concept]
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 値と確率の一覧を変えると、期待値（重心）がどう動くかを見る}
  principle: 起こりうる値を全部挙げ、確率を割り振ったもの。確率は0以上で、合計（連続なら面積）が1。期待値や分散は、分布を1つの数に要約したもの。
  formulas:
  - id: F-dist-sum
    label: 確率の合計は1
    symbols:
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
      key: p
    - symbol: x
      meaning: X がとる値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "sum", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "p"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - text: どの値の確率も0以上
      kind: 要件
      outside: この定義の確率分布として扱えない
    - text: 全部の値の確率の合計が1（連続なら密度の面積が1）
      kind: 要件
      outside: この定義の確率分布として扱えない
    data:
    - データの相対度数の一覧は、分布の推定値。データが少ないと形が大きく変わる
  example: 1人が買う個数が 0個 0.2・1個 0.5・2個 0.3 なら、合計が1なので確率分布になっている。
  counterexample: 0個 0.2・1個 0.5・2個 0.4 は合計が 1.1 になるので、確率分布ではない。
  misconceptions:
  - misconception: 確率分布はグラフの形のこと
    correction: 中身は「値と確率の一覧」。棒グラフでも表でも、一覧が同じなら同じ分布
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(2,10)+Fraction(5,10)+Fraction(3,10)==1
  - Fraction(2,10)+Fraction(5,10)+Fraction(4,10)==Fraction(11,10)
- id: TERM-cov
  name: 共分散
  en: covariance
  category: 確率分布
  group: GRP-dist-base
  forms: [operation, number]
  definition: 2つの確率変数が、それぞれの期待値から同じ向きにずれるか逆向きにずれるかを、ずれの積の期待値で表した量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s5-free, purpose: 0/1 の2つの量の同時分布を変え、共分散が0になるのは独立のときだけであることを確かめる（0/1 でない量では、共分散0でも独立とは限らない）}
  principle: (X−μ_X)(Y−μ_Y) の期待値。同じ向きのずれが多いと正、逆向きが多いと負。和の分散に 2Cov として効く。
  formulas:
  - id: F-cov-def
    symbols:
    - symbol: Cov(X, Y)
      meaning: X と Y の共分散
      key: Cov
    - symbol: E( )
