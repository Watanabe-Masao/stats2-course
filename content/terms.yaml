    - text: 区間の外の密度は0
      kind: 要件
      outside: この定義の一様分布として扱えない（区間の外にも値をとる）
    data:
    - 「どこも同じ出やすさ」は仮定。ヒストグラムが平らかで確かめる
  example: 0〜10分の一様分布の期待値は5分、分散は 100/12≒8.33。
  counterexample: 平均±1σ に入る割合は 1/√3≒57.7% で、正規分布の約68.3%と違う。標準偏差が同じでも、形が違えば割合は違う。
  misconceptions:
  - misconception: 一様分布なら、どの値も同じ確率で出る
    correction: 連続なので1点の確率は0。同じなのは「同じ長さの区間に入る確率」
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(0+10,2)==5
  - abs(100/12-8.33)<0.005
  - abs(1/math.sqrt(3)-0.577)<0.0005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
- id: TERM-sampdist
  name: 標本分布
  en: sampling distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: 母集団から大きさ n の標本を取ることをくり返すとき、標本から計算する統計量を確率変数とみたときの確率分布
    terms: [TERM-statistic, TERM-dist]
  short: 同じ大きさの標本を何度も取ったときに、統計量がとる値の分布
  definition: 同じ大きさ n の標本を同じ取り方でくり返し取るとき、標本から計算する統計量がとる値の確率分布。
  version: 1
  principle: 手元の標本は1つでも、同じ取り方をしたら出ていた標本は他にもたくさんある。その全部について統計量（標本平均など）を計算して並べたものが標本分布で、1つの推定値がどれだけ当てにできるか（中心が母数とずれていないか・どれだけ散らばるか）は、この分布で決まる。標本分布の標準偏差が標準誤差。
  conditions:
    math:
    - text: 統計量と、標本の取り方（どの標本がどの確率で選ばれるか）が決まっている
      kind: 要件
      outside: 標本分布が1つに決まらない（同じ統計量でも、取り方が変われば分布が変わる）
    data:
    - 実際の調査では標本は1つだけなので、標本分布は見えない。取り方（無作為か・戻すか・n はいくつか）から、理論かくり返しのシミュレーションで考える
    - 選ばれ方の確率が分からない取り方（応募・声をかけやすい人）では、標本分布はあっても求められない
  example: 5店の廃棄数 3・5・7・9・11 個から2店を単純無作為抽出すると、標本平均は10通りの選び方ごとに 4・5・6・6・7・7・8・8・9・10 のどれかで、選び方1つずつが確率 1/10（6・7・8 は2通りずつなので 2/10）。この分布が標本平均の標本分布で、平均は母集団の平均と同じ7。
  counterexample: 同じ5店から2店を選ぶ「標本平均の標本分布」と言っても、戻して選ぶか戻さずに選ぶかを決めないと分布が決まらない。戻さずに選べば x̄ の標準偏差は √3≒1.73、戻して選べば √8÷√2＝2 で、散らばりが違う。
  misconceptions:
  - misconception: 標本分布は、手元の標本のデータのヒストグラム
    correction: 手元のデータの分布は標本の分布。標本分布は、標本をくり返し取ったときの統計量（標本平均など）の分布で、1つの標本からは直接は見えない
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（母集団と標本）
  checks:
  - sorted((a + b) / 2 for a in [3, 5, 7, 9, 11] for b in [3, 5, 7, 9, 11] if a < b) == [4, 5, 6, 6, 7, 7, 8, 8, 9, 10]
  - sum([4, 5, 6, 6, 7, 7, 8, 8, 9, 10]) / 10 == 7
  - math.isclose(sum((v - 7) ** 2 for v in [4, 5, 6, 6, 7, 7, 8, 8, 9, 10]) / 10, 3) and math.isclose(math.sqrt(8) / math.sqrt(2), 2)
- id: TERM-se
  name: 標準誤差
  en: standard error
  category: 標本分布・極限
  forms: [number]
  basis:
    text: 推定量 θ̂ の標本分布の標準偏差 √V(θ̂)（例：独立に同じ分布に従う標本で、標本平均の標準誤差は σ/√n）
    terms: [TERM-estimator, TERM-sampdist, TERM-sd]
  short: 推定量の標本分布の標準偏差で、推定値がくり返しでどれだけばらつくかの大きさ
  definition: 推定量（標本平均など）の標本分布の標準偏差。推定値を取り直したら、どれくらいばらつくかの大きさ。独立に同じ分布から取るとき、標本平均なら σ÷√n。
  version: 1
  formulas:
  - id: F-se-mean
    label: 標本平均の標準誤差
    symbols:
    - symbol: SE( )
      meaning: 標準誤差（推定量の標本分布の標準偏差）
      key: SE
      concept: TERM-se
    - symbol: X̄
      meaning: 標本平均
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: σ
      meaning: 母標準偏差（1個の値 Xᵢ のばらつき）
      key: sigma
      concept: TERM-sd
      kind: param
      domain:
        min: 0
    - symbol: n
      meaning: 平均をとる個数（標本の大きさ）
      key: n
      kind: value
      domain:
        min: 1
        integer: true
    tree:
      op: eq
      args:
      - op: fn
        name: SE
        args:
        - sym: Xbar
      - op: div
        args:
        - sym: sigma
        - op: sqrt
          args:
          - sym: n
    parts:
    - path:
      - 1
      - 0
      name: 1個のばらつき
      meaning: 母標準偏差 σ。n を増やしても変わらない
    - path:
      - 1
      - 1
      name: √n
      meaning: 精度は √n で効く。標準誤差を半分にするには n を4倍にする
  principle: 標準偏差は1個1個の値のばらつき、標準誤差は推定値（平均や比率）のばらつき。推定量に偏りがなければ、手元の推定値と母数のずれは、たいてい標準誤差の数倍の中に収まるので、標準誤差は「1つの推定値をどれだけ当てにできるか」の物差しになる（偏りがあれば、ずれにその分が加わり、標準誤差には入らない）。標本平均の標準誤差は √V(X̄)＝σ÷√n で、σ が分からないときは不偏分散の平方根 s で置き換えた s÷√n（推定した標準誤差。これも標準誤差と呼ぶ）を使う。
  conditions:
    math:
    - text: 推定量の分散が有限
      kind: 要件
      outside: 標準誤差が定まらない
    - text: X₁, …, Xₙ は独立に同じ分布に従い、分散 σ² が有限
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（σ÷√n は標本平均の標準誤差とは限らない。値どうしに正の相関があると、本当の標準誤差はこれより大きい）
    data:
    - 「標準誤差」と書いた数が、σ（分かっている）で計算したか、標本の標準偏差で置き換えたかを確かめる。グラフのひげが標準偏差か標準誤差かを確かめる
  example: 購入額の標準偏差が 2000 円の客から独立に 16 人を選ぶと、平均購入額の標準誤差は 2000÷√16＝500 円。64 人なら 250 円で半分。
  counterexample: 多くの日を通した店の客単価（母平均）を、ある1日の客 400 人の平均で推し量る。同じ日の来店客は天気やセールで購入額がそろって動くので、400 人は独立でない。1200÷√400＝60 円を標準誤差にすると、日ごとの共通の動きの分が入らず、本当の標準誤差より小さく見積もる。
  misconceptions:
  - misconception: 標準誤差は、データ1個1個の誤差（測り間違い）の大きさ
    correction: 標準誤差は、平均や比率などの推定値が、標本を取り直したらどれだけ変わるかの大きさ。測り間違いがなくても、選び方の偶然で生じる
  - misconception: 有限の母集団から非復元で取っても、標準誤差は σ÷√n のまま
    correction: 母集団の大きさ N に対して n が無視できないときは、σ÷√n に有限母集団修正 √((N−n)÷(N−1)) を掛けて小さくなる。全部を調べれば（n＝N）0
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - 2000 / math.sqrt(16) == 500 and 2000 / math.sqrt(64) == 250 and 1200 / math.sqrt(400) == 60
- id: TERM-lln
  name: 大数の法則
  en: law of large numbers
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-20b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が有限のとき、どの ε＞0 でも n→∞ で P(|X̄−μ|≧ε)→0（標本平均 X̄ は μ に確率収束する。④-20b）
    terms: [TERM-sample-mean]
  short: 標本の大きさを大きくすると、標本平均が母平均に近づくという法則
  definition: 同じ分布から独立に取った値の平均（標本平均）は、取る数を大きくすると、母平均の近くに入る確率が1に近づく、という定理。
  version: 1   # 2026-11-15 に説明を書いた（期待値の実験室 B-01 の主。#119）。①③④ の監査役の独立なレビューで直した
  principle: X₁, …, Xₙ が独立に同じ分布（平均 μ・分散 σ²）に従うとき、標本平均 X̄ の期待値は μ、分散は σ²/n。n を大きくすると X̄ の散らばりが小さくなり、どんな幅 ε を決めても、X̄ が μ から ε 以上離れる確率は 0 に近づく（チェビシェフの不等式で P(|X̄−μ|≧ε)≦σ²/(nε²)。1つの確率変数なら、どんな分布でも平均から kσ 以上離れる確率は P(|X−μ|≧kσ)≦1/k²）。「必ずぴったり近づく」ではなく「離れる確率が小さくなる」という主張。
  conditions:
    math:   # 主張 CLM-20b（④-20b）の成立条件の写し。区分・文・外れたときは主張の側が正本（食い違わせない）
      - text: X₁, …, Xₙ が独立に同じ分布に従う
        kind: 仮定
        claim: 標本平均 X̄ が μ に確率収束する
        terms: [TERM-indep]
        outside: 標本平均が μ に近づくとは保証できない
      - text: 分散 σ² が有限
        kind: 仮定
        claim: 標本平均 X̄ が μ に確率収束する
        terms: [TERM-var]
        outside: この根拠（チェビシェフの不等式）による保証は使えない（平均が有限なら成り立つことが知られている：ヒンチンの大数の法則。教材の範囲外・未照合）
    data:
      - データで使うときは、取り方が独立で同じ（同じ条件の繰り返し・無作為抽出）と言えるかを確かめる
      - 分散がとても大きい（まれでも極端な値がある）と、平均が母平均の近くに入るのに要る数がとても大きくなる。ずれの目安 ±2σ/√n（中心極限定理による目安）で、要る数の大きさを見積もる
  example: さいころを n 回投げた目の平均は、n を大きくすると 3.5 の近くに入る確率が1に近づく。1 回の目の分散は 35/12 なので、n＝1000 なら平均のずれの目安（±2×標準誤差。中心極限定理による目安）は約 ±0.11。
  counterexample: 表が出るまでコインを投げ、k 回目に初めて表が出たら（確率 1/2ᵏ）2ᵏ 円もらうくじ（倍々のくじ。打ち切りなし）は、値×確率の項が 2ᵏ×(1/2)ᵏ＝1 でどれも 1 なので、期待値（項の和）が有限にならない。平均が有限という前提が満たされないので、この法則は使えない。引く回数を増やしても、平均は大きくなり続け、一つの値に落ち着かない（④ の範囲外・未照合）。
  misconceptions:
    - misconception: はずれが続いたら、平均を戻すために次は当たりやすくなる
      correction: 独立なら、次の1回の確率は前の結果で変わらない。平均が母平均に近づくのは、あとに続く多くの回が前のずれを薄めるからで、前のずれを打ち消す回が来るからではない
  sources:
    - source: 公式2級範囲表
      locator: 標本分布（大数の法則・中心極限定理）
  checks:
    - round(2*(35/12/1000)**0.5, 2) == 0.11
    - all(2**k*Fraction(1,2**k)==1 for k in range(1,30))
    - Fraction(1, 2**2) == Fraction(1,4)
- id: TERM-clt
  name: 中心極限定理
  en: central limit theorem
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-6b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が 0＜σ²＜∞ のとき、n→∞ で √n(X̄−μ)/σ の分布は N(0, 1) に近づく（④-6b）
    terms: [TERM-sample-mean, TERM-std-normal]
  short: 独立に同じ分布から取った標本平均の分布は、n が大きいと正規分布に近づくという定理
  definition: 独立に同じ分布から取った値の標本平均は、分散が有限で0より大きければ、n を大きくすると、元の分布の形によらず、その分布を正規分布 N(μ, σ²/n) で近似できるようになる、という定理。
  version: 1
  principle: 標本平均のずれ X̄−μ そのものは0に縮む（大数の法則）。縮む幅 σ÷√n で割って見直した √n(X̄−μ)/σ の分布が、元の分布によらず標準正規分布に近づく、というのが中心極限定理。だから n が十分大きければ、X̄ を N(μ, σ²/n) とみなして確率を見積もる近似として使う（どれだけ大きければよいかを、定理は言わない）。近づく速さは主に元の分布の歪みで左右され（歪度が有限なら、X̄ の歪度は母集団の歪度÷√n）、歪んだ分布ほど大きな n が要る。
  conditions:
    math:
    - text: X₁, …, Xₙ が独立に同じ分布に従う
      kind: 仮定
      claim: CLM-6b
      terms: [TERM-indep]
      outside: ④-6b は保証されない（標準化した標本平均が標準正規分布に近づくとは限らない。同じ日・同じ時間帯の値がそろって動くと、X̄ の散らばりは σ÷√n より大きく、N(μ, σ²/n) では幅を狭く見積もる。有限の母集団から戻さずに取ると、散らばりは小さい）
    - text: 分散 σ² が 0＜σ²＜∞
      kind: 仮定
      claim: CLM-6b
      terms: [TERM-var]
      outside: ④-6b は保証されない（裾の重い分布では、n を増やしても正規分布に近づかない例がある）
    data:
    - 有限の n で X̄ を正規分布で近似してよいかは、主に元の分布の歪みで左右される（X̄ の歪度は母集団の歪度÷√n）。右に長い裾の分布で n が小さいと、X̄ の分布も右に歪み、正規分布では右側の確率を小さく、左側の確率を大きく見積もる
    - 元のデータのヒストグラムで、歪み・外れ値の大きさを見る。0か1の値なら、np と n(1−p) がどちらも十分大きいかを確かめる
    - 値を独立に取ったか（同じ日・同じ人の値がまとまっていないか）を確かめる
  example: 待ち時間（平均 5分・標準偏差 5分の指数分布。右に長い裾）でも、20人分の平均の分布は正規分布 N(5, 1.12²) とかなり重なる。歪度は 1人分の 2 から 2÷√20≒0.45 まで小さくなる。ただ裾ではまだずれ、7分を超える確率は正確には約 0.048、正規分布では約 0.037（右側を小さく見積もる）。
  counterexample: 同じ時刻に並んだ n 人の待ち時間を平均する。混んだ時刻なら全員長く、空いた時刻なら全員短いので、値どうしがそろって動き、独立でない。n を増やしても X̄ は「その時刻の混み具合」で決まる値に近づくだけで、X̄ の分布は混み具合の分布の形を残し、正規分布に近づくとは限らない。
  misconceptions:
  - misconception: n を大きくすると、データ1個1個の分布が正規分布に近づく
    correction: 正規分布に近づくのは、平均 X̄ の分布。待ち時間1人分の分布は、何人調べても右に長い裾のまま
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（大数の法則・中心極限定理）
  checks:
  - abs(5/math.sqrt(20) - 1.12) < 0.005 and abs(2/math.sqrt(20) - 0.45) < 0.005
- id: TERM-cc
  name: 連続修正
  en: continuity correction
  category: 標本分布・極限
  forms: [operation]
  basis:
    text: 整数値をとる確率変数 X の確率を、確率密度で表される分布に従う Y の確率で近似するとき、P(X≦k) を P(Y≦k＋0.5)、P(X≧k) を P(Y≧k−0.5) で近似する（境目を 0.5 ずらす）操作
    terms: [TERM-pdf]
  short: 離散分布を連続分布で近似するとき、区間の端を0.5ずらして近似をよくする工夫
  definition: 整数の値をとる確率変数の確率を、正規分布のような連続の分布で近似するとき、区間の端を 0.5 ずらす操作。P(X≦k) は k＋0.5 まで、P(X≧k) は k−0.5 から面積をとる。
  version: 1
  principle: 整数 k の確率は、連続の分布では k−0.5 から k＋0.5 までの幅1の面積に当たる（棒の幅を1とみる）。「k 以下」は k の棒の右端 k＋0.5 まで、「k 以上」は k の棒の左端 k−0.5 から面積をとると、端の棒を半分だけ落とすことがない。
  conditions:
    math:
    - text: 近似する確率変数 X は整数の値だけをとる（値の間隔が1）
      kind: 要件
      outside: 0.5 ずらす根拠がない（ずらす幅は値の間隔の半分）
    data:
    - 「以下・未満・以上・より大きい」を整数の範囲に直してから、ずらす向きを決める（X＜55 は X≦54 なので 54.5 まで）
  example: 当選率 0.5 で 100人が応募するとき、当選者 X が 58人以上の確率を正規分布で近似する。平均 50・標準偏差 5 で、57.5 からとると z＝1.5、1−Φ(1.5)≒0.0668。正確な二項分布の値 0.0666 とほとんど同じ。ずらさない z＝1.6 だと 0.0548 と小さく出る。
  counterexample: 0.5 点刻みの点数（0, 0.5, 1, …）の「3点以下」を近似するとき 0.5 ずらして 3.5 までとると、3.5 点の棒（3.25〜3.75）の半分を含んでしまう。値の間隔が1でないので、0.5 ずらす根拠がない（ずらすなら値の間隔の半分）。
  misconceptions:
  - misconception: 連続修正は、いつも 0.5 を足す
    correction: 向きは確率の向きで決まる。「k 以下」は k＋0.5、「k 以上」は k−0.5。「k 未満」は「k−1 以下」なので k−0.5
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（大数の法則・中心極限定理）
  checks:
  - (57.5-50)/5 == 1.5 and abs(1-0.5*(1+math.erf(1.5/math.sqrt(2))) - 0.0668) < 0.00005 and abs(sum(comb(100,k) for k in range(58,101))/2**100 - 0.0666) < 0.00005 and abs(1-0.5*(1+math.erf(1.6/math.sqrt(2))) - 0.0548) < 0.00005
- id: TERM-t
  name: t 分布
  en: t distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z が N(0, 1) に従い、V が χ²(k) に従い、Z と V が独立なとき、T＝Z/√(V/k) の分布を自由度 k の t 分布 t(k) とする（k は1以上の整数）
    terms: [TERM-chi2]
  short: 母分散を不偏分散で置き換えて標準化した標本平均が従う分布で、自由度が大きいと標準正規分布に近づく
  definition: 標準正規分布に従う Z と、それと独立に χ²(k) に従う V から作る T＝Z÷√(V÷k) が従う分布 t(k)。正規母集団で σ を不偏分散の平方根 s で置き換えて標準化した標本平均 (X̄−μ)÷(s÷√n) は t(n−1) に従う。
  version: 1
  principle: σ を s で置き換えると、分母も標本ごとにばらつくので、標準化した値は正規分布より外まで出やすい（裾が厚い）。だから同じ両側5%でも、t の点は 1.96 より外になる（t(4) で 2.776）。自由度が大きいと s がほぼ σ になり、t 分布は標準正規分布に近づく。
  conditions:
    math:
    - text: Z と V は独立
      kind: 要件
      outside: Z÷√(V÷k) は t(k) に従うとは限らない
    - text: k は1以上の整数
      kind: 要件
      outside: この作り方では t(k) を作れない（密度の式は正の実数の k でも使え、ウェルチの検定は整数でない自由度を使う）
    - text: 正規母集団からの無作為標本（n≧2・σ＞0）
      kind: 仮定
      claim: CLM-28a
      outside: ④-28a は保証されない（(X̄−μ)÷(s÷√n) は t(n−1) に従うとは限らない。n が大きければ中心極限定理で近くなるが、n が小さく歪んだ母集団ではずれる。似た値が続く〔正の相関〕と、s÷√n が X̄ のばらつきを小さく見積もり、|t| が大きく出やすい）
    data:
    - n が小さいときは、データに外れ値や強い歪みがないかを確かめる。n が小さいとき、t の点が当てになるのは、母集団が正規分布に近いとき
  example: 両側5%の点は、t(4) で 2.776、t(15) で 2.131、t(120) で 1.980。自由度が大きいほど標準正規の 1.96 に近づく。
  counterexample: V を Z から作る（k＝1 で V＝Z²）と、Z と V は独立でない。T＝Z÷|Z| は +1 か −1 しかとらず、t(1) に従わない。
  misconceptions:
  - misconception: データが少ないときは t、多いときは z を使う
    correction: t と z を分けるのは、σ が分かっているか（s で置き換えたか）。正規母集団で σ を s で置き換えた統計量は、n の大小によらず t 分布に従う。n が大きいときに z の点を使うのは近似
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - abs(sum((math.gamma(2.5)/(math.sqrt(4*math.pi)*math.gamma(2)))*(1+((i+.5)*2.776/20000)**2/4)**(-2.5) for i in range(20000))*2.776/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(8.0)/(math.sqrt(15*math.pi)*math.gamma(7.5))*(1+((i+.5)*2.131/20000)**2/15)**(-8.0) for i in range(20000))*2.131/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(60.5)/(math.sqrt(120*math.pi)*math.gamma(60.0))*(1+((i+.5)*1.98/20000)**2/120)**(-60.5) for i in range(20000))*1.98/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(3.0)/(math.sqrt(5*math.pi)*math.gamma(2.5))*(1+((i+.5)*2.571/20000)**2/5)**(-3.0) for i in range(20000))*2.571/20000 - 0.475) < 0.0005
  - abs(sum(math.gamma(5.0)/(math.sqrt(9*math.pi)*math.gamma(4.5))*(1+((i+.5)*2.262/20000)**2/9)**(-5.0) for i in range(20000))*2.262/20000 - 0.475) < 0.0005
- id: TERM-chi2
  name: カイ二乗分布
  en: chi-squared distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z₁, …, Z_k が独立に N(0, 1) に従うとき、Z₁²＋…＋Z_k² の分布を自由度 k のカイ二乗分布 χ²(k) とする（k は1以上の整数。独立は定義の要件）
    terms: [TERM-std-normal, TERM-df]
  short: 独立な標準正規分布の確率変数を2乗して足した値が従う分布
  definition: 独立に標準正規分布に従う k 個の確率変数を2乗して足した値が従う分布 χ²(k)。k を自由度と呼ぶ。正規母集団の不偏分散 s² を使った (n−1)s²÷σ² が χ²(n−1) に従うので、分散の推測に使う。
  version: 1
  principle: 2乗の和なので値は0以上で、右に長い裾をもつ。1つの Z² の期待値は1・分散は2なので、χ²(k) の期待値は k、分散は 2k。自由度が大きいと、和なので中心極限定理で正規分布に近づく。
  conditions:
    math:
    - text: Z₁, …, Z_k は独立で、どれも標準正規分布に従う
      kind: 要件
      outside: 2乗の和は χ²(k) に従うとは限らない（独立でない、またはどれかが N(0, 1) でない〔例：N(0, 4)〕と、裾の確率が変わる）
    - text: k は1以上の整数
      kind: 要件
      outside: この作り方（k 個の Z² の和）では χ²(k) を作れない
    - text: 正規母集団からの独立な標本（n≧2・σ＞0）
      kind: 仮定
      claim: CLM-10
      outside: ④-10 は保証されない（(n−1)s²÷σ² は χ²(n−1) に従うとは限らない。裾の重い母集団では、分散の推測が大きくずれる。似た値が続く〔正の相関〕と、s² は σ² を小さく見積もりやすい）
    data:
    - 分散の推測に使うときは、母集団が正規分布に近いか（外れ値・裾の重さ）を確かめる。平均の推測より、正規分布からのずれに弱い
  example: χ²(4) の期待値は 4、分散は 8。上側5%の点は約 9.49 で、4つの Z² の和が 9.49 を超えるのは 5%。
  counterexample: Z₂ を Z₁ と同じ値にする（Z₂＝Z₁）と、Z₁²＋Z₂²＝2Z₁² で、独立でない。2Z₁² が χ²(2) の上側5%の点 5.99 を超える確率は約 0.083 で、5% にならない。
  misconceptions:
  - misconception: カイ二乗分布の下側の点は、平均をはさんで上側の点と同じだけ離れている
    correction: 右に長い裾があり、左右対称ではない。χ²(9) の下側2.5%点は 2.700、上側2.5%点は 19.023 で、平均9からの距離は 6.3 と約10。下側と上側の点は別々に引く
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - abs(sum(0.25*((i+.5)*(9.49/20000))*math.exp(-((i+.5)*9.49/20000)/2) for i in range(20000))*9.49/20000 - 0.95) < 0.0005
  - abs(2*(1-0.5*(1+math.erf(math.sqrt(5.991/2)/math.sqrt(2)))) - 0.083) < 0.0005
  - abs(sum(((i+.5)*2.7/20000)**3.5*math.exp(-((i+.5)*2.7/20000)/2)/(2**4.5*math.gamma(4.5)) for i in range(20000))*2.7/20000 - 0.025) < 0.0005 and abs(19.023 - 9 - 10) < 0.05 and abs(9 - 2.7 - 6.3) < 1e-9
- id: TERM-f
  name: F 分布
  en: F distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: U が χ²(m)、V が χ²(n) に従い、U と V が独立なとき、(U/m)/(V/n) の分布を自由度 (m, n) の F 分布 F(m, n) とする（m・n は1以上の整数）
    terms: [TERM-chi2]
  short: 独立な2つのカイ二乗分布の確率変数を、それぞれ自由度で割った比が従う分布
  definition: 独立な χ²(m)・χ²(n) の確率変数を、それぞれ自由度で割った比が従う分布 F(m, n)。2つの正規母集団の分散が等しく、2つの標本が独立なら、2つの不偏分散の比 s₁²÷s₂² は F(n₁−1, n₂−1) に従うので、分散の比べに使う。
  version: 1
  principle: 比なので値は0以上で、右に長い裾をもつ。分子と分母を入れ替えると F(n, m) に従うので、F(m, n) の下側の点は F(n, m) の上側の点の逆数になる。t(k) に従う量の2乗は F(1, k) に従う（④-9）。
  conditions:
    math:
    - text: 分子と分母のカイ二乗の確率変数は独立
      kind: 要件
      outside: 比は F(m, n) に従うとは限らない
    - text: m・n は1以上の整数
      kind: 要件
      outside: この作り方では F(m, n) を作れない
    - text: 2つの標本は互いに独立で、それぞれ正規母集団からの無作為標本、母分散が等しい
      kind: 仮定
      claim: CLM-42
      outside: ④-42 は保証されない（裾の重い母集団では F の点が当てにならない。同じ店の前後のような対のデータで独立でないと、比の分布が変わる）
    data:
    - 分散の比を比べるときは、2つの母集団が正規分布に近いかを確かめる。外れ値が1つあると不偏分散が大きく動き、比も大きく動く
  example: 2店の売上の不偏分散が s₁²＝4（11日）、s₂²＝2（11日）なら F＝2。s₁² のほうが大きいかを片側で調べるなら、F(10, 10) の上側5%の点は約 2.98 なので、この比は基準の内側。
  counterexample: 分子と分母に同じカイ二乗の確率変数を使う（U＝V、m＝n）と、独立でなく、比はいつも1になる。F(m, m) に従わない。
  misconceptions:
  - misconception: F(m, n) と F(n, m) は同じ分布
    correction: 自由度の順番は分子・分母の順で、入れ替えると別の分布。F(m, n) の点の逆数が F(n, m) の反対側の点になる
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - 4/2 == 2 and abs(sum(math.gamma(10)/math.gamma(5)**2*((i+.5)*2.98/20000)**4/(1+(i+.5)*2.98/20000)**10 for i in range(20000))*2.98/20000 - 0.95) < 0.0005
- id: TERM-df
  name: 自由度
  en: degrees of freedom
  category: 標本分布・極限
  forms: [number]
  basis:
    text: n 個の値に k 個の互いに独立な1次の制約（例：偏差の和が0）があるとき、自由に動ける値の個数 n−k。t・カイ二乗・F 分布では、族を区別する正の整数の母数を同じ名前で呼ぶ
    terms: []
  short: 統計量を計算するときに自由に動ける値の個数で、t・カイ二乗・F 分布の形を決める
  definition: 統計量を計算するときに、自由に動ける値の個数。n 個の偏差は和が0になるので、自由に動けるのは n−1 個。t・カイ二乗・F 分布では、分布の形を決める母数も同じ名前で呼ぶ。
  version: 1
  principle: 標本平均 x̄ を計算に使うと「偏差の和が0」という制約が1つ入り、n−1 個の偏差が決まれば残りの1個は決まる。制約が増えるほど自由度は減る。自由度が小さいほど、s のばらつきが大きく、t 分布の裾は厚い。
  conditions:
    math:
    - text: 数える制約は1次の制約で、互いに独立（ほかの制約から導けない）
      kind: 要件
      outside: 自由度は n−（制約の数）にならない（同じ制約を2回数えると、自由度を小さく見積もる）
    data:
    - 何を推定に使ったかを書き出して数える（1群の平均は n−1、2群の平均は n₁＋n₂−2、回帰の直線は n−2）
  example: 5店の値 3・5・7・9・11（平均7）の偏差は −4・−2・0・2・4 で、和は0。4つの偏差が決まれば最後の1つは決まるので、自由度は4。
  counterexample: 平均 x̄ と合計 Σx の両方を計算に使ったので制約は2つ、と数えて5個の値の自由度を3とするのは誤り。合計は n×平均で、平均から導けるので、制約は1つで、自由度は4。
  misconceptions:
  - misconception: 自由度はいつも n−1
    correction: 推定に使った量の数で決まる。2群の平均を使えば n₁＋n₂−2、回帰の直線（切片と傾き）を使えば n−2
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（t 分布・カイ二乗分布・F 分布）
  checks:
  - '[x-7 for x in [3,5,7,9,11]] == [-4,-2,0,2,4] and sum(x-7 for x in [3,5,7,9,11]) == 0'
- id: TERM-estimator
  name: 推定量
  en: estimator
  category: 推定
  forms: [rv]
  basis:
    text: 母数 θ を推定する目的で使う統計量 θ̂（標本 X₁, …, Xₙ の関数で、分からない母数を含まないもの。観測したあとの値は推定値と呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 母数を推定するために使う統計量（標本から値が決まる式）
  definition: 母数（母平均など）を推し量るために使う統計量 θ̂。標本の値だけから計算し、取り直すたびに値が変わりうる。観測したあとの1つの値を推定値と呼ぶ。
  version: 1
  principle: 同じ母数にも、推定量はいくつも作れる（標本平均・中央値・最初の1個）。どれがよいかは、1回の推定値が当たったかではなく、取り直したときの推定量の分布（偏り・ばらつき・平均二乗誤差）で比べる。
  conditions:
    math:
    - text: 値が標本の値と分かっている定数だけで決まる（分からない母数を含まない）
      kind: 要件
      outside: 推定量ではない（手元の標本から計算できない）
    data:
    - 推定値を報告するときは、どの推定量（式）で出したかを書く（平均か中央値か、n で割ったか n−1 で割ったか）
  example: 母平均 μ を推し量るのに、5個の値 48・52・47・55・50 から、標本平均 50.4・中央値 50・最初の1個 48 のどれも推定値として出せる。式が違えば推定量が違う。
  counterexample: 標本平均と母平均の中間 (X̄＋μ)÷2 は、μ を含むので手元の標本から計算できず、μ の推定量ではない。
  misconceptions:
  - misconception: 推定量と推定値は同じもの
    correction: 推定量は計算の式（取り直すと値が変わる確率変数）、推定値はその式に1回分の標本を入れて得た1つの値
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - sum([48,52,47,55,50])/5 == 50.4 and sorted([48,52,47,55,50])[2] == 50
- id: TERM-pop-mean
  name: 母平均
  en: population mean
  category: 推定
  forms: [number]
  # 文脈の見出し（製本 ① の 2。#302）：自分の定義を持たず、期待値の意味を共有する。定義・式・成立条件は期待値に書く
  heading_of:
    concept: TERM-expect
    correspondence: 母集団の分布の期待値（μ＝E(X)。X は母集団から無作為に〔どの要素も同じ確率で〕1つ取り出した要素の値で、その分布が母集団の分布）
    object_diff: 期待値は確率分布（確率変数）について言う。母平均は母集団について言う
    context_diff: 母平均は推測統計の中で、標本から知りたい、決まっているが分からない数として出る。期待値は確率の計算の中で、分布から決まる数として出る
  version: 1
- id: TERM-pop-var
  name: 母分散
  en: population variance
  category: 推定
  forms: [number]
  # 文脈の見出し（製本 ① の 2・6 の 2 の決まったこと。#310・#302）：確率変数の分散の意味を共有する
  heading_of:
    concept: TERM-var
    correspondence: 母集団の分布の分散（σ²＝V(X)。X は母集団から無作為に1つ取り出した要素の値。有限母集団なら全 N 個の値の、N で割ったデータの分散と同じ値）
    object_diff: 分散（確率変数の分散）は確率分布について言う。母分散は母集団について言う
    context_diff: 母分散は推測統計の中で、標本から知りたい、決まっているが分からない数として出る。確率変数の分散は確率の計算の中で、分布から決まる数として出る
  version: 1
- id: TERM-point-est
  name: 点推定
  en: point estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 標本の値を推定量 θ̂ に入れて得た1つの値（推定値）を、母数 θ の値の推定とする手続き
    terms: [TERM-estimator]
  short: 母数の値を、推定量から求めた1つの値で推定すること
  definition: 母数を1つの値（推定値）で推し量る手続き。決めておいた推定量に、標本の値を入れて得る。
  version: 1
  principle: 1つの値で言うので分かりやすいが、その値がどれだけ外れうるかは、推定値だけからは分からない。だから点推定には標準誤差を添えるか、区間推定で幅を示す。
  conditions:
    math:
    - text: 使う推定量（どの式で計算するか。データを見て選ぶ規則も含めて）が、標本を見る前に決まっている
      kind: 要件
      outside: 標本ごとに式が変わり、推定量として定まらない（点推定の手続きにならない）
    data:
    - 推定値と一緒に、標本の大きさと標準誤差を書く
  example: 25日の売上の平均 12万円を、1日の売上の母平均の点推定値とする。データの標準偏差 5万円から標準誤差 5÷√25＝1万円を添える。
  counterexample: 外れ値を除くか除かないかを、データを見て都合のよいほうに決めると、使った推定量が標本ごとに変わる。推定量が決まっていないので、推定値がどれだけ偏り、どれだけばらつくかを言えない。
  misconceptions:
  - misconception: 点推定値は、母数そのもの
    correction: 点推定値は、取り直すと変わる値の1つ。母数とはふつうずれていて、そのずれの大きさの目安が標準誤差
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 5/math.sqrt(25) == 1
- id: TERM-consistency
  name: 一致性
  en: consistency
  category: 推定
  forms: [property]
  basis:
    text: 標本の大きさ n ごとの母数 θ の推定量 θ̂ₙ が、モデルのすべての母数の値で（θ 以外の母数を含む）、どの ε＞0 についても n→∞ で P(|θ̂ₙ−θ|≧ε)→0 となること（θ̂ₙ は θ に確率収束する）
    terms: [TERM-estimator, TERM-prob]
  short: 標本の大きさを大きくすると、推定量が母数に近づいていく性質
  definition: 標本の大きさ n を大きくすると、推定量が母数のどれだけ近くにも入る確率が1に近づくこと。母数のどの値でも成り立つことを言う。
  version: 1
  principle: 一致は n を増やしたときの性質で、決まった n での偏りは問わない。偏りと分散がともに n とともに0に近づく推定量は一致する（平均二乗誤差が0に近づき、チェビシェフの不等式から）。正規母集団なら、n で割る標本分散 v は偏り −σ²÷n をもつが、偏りも分散も0に近づくので一致する。偏りが0に近づくだけでは一致とは限らない（ばらつきも縮むことが要る）。
  conditions:
    math:
    - text: 母数のどの値でも、どの ε＞0 についても n→∞ で P(|θ̂ₙ−θ|≧ε)→0
      kind: 要件
      outside: 一致とは言えない
    data:
    - 一致は n を限りなく大きくしたときの話で、手元の n で当てになるかは別に、偏りと標準誤差で確かめる
    - 取り方の偏りは、n を増やしても消えない。偏った取り方の推定量は一致しない
  example: 独立に同じ分布から取り、分散が有限なら、標本平均は母平均に一致する（④-20b）。σ＝10 で n を 5 から 50 にすると、標準誤差は 4.47 から 1.41 に縮む。
  counterexample: n 個取っても最初の1個 X₁ だけを使う推定量は、n をいくら増やしても標準誤差が σ のままで、母数の近くに入る確率は1に近づかない。一致しない（不偏ではある）。
  misconceptions:
  - misconception: 一致推定量なら、手元の n で偏りがない
    correction: 一致は n を増やしたときの性質。n で割る標本分散 v は一致するが、n＝5 では平均して σ² の 4/5 に小さく出る
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - abs(10/math.sqrt(5) - 4.47) < 0.005 and abs(10/math.sqrt(50) - 1.41) < 0.005 and (5-1)/5 == 0.8
- id: TERM-efficiency
  name: 有効性
  en: efficiency
  category: 推定
  forms: [property]
  basis:
    text: 同じ母数 θ の2つの不偏推定量 θ̂₁・θ̂₂ について、モデルのすべての母数の値で（θ 以外の母数を含む） V(θ̂₁)≦V(θ̂₂) のとき、θ̂₁ は θ̂₂ より有効という（分散の小さい不偏推定量ほどよいとする比べ方）
    terms: [TERM-unbiased, TERM-var]
  short: 不偏な推定量のうち、分散が小さい（ばらつきが小さい）ものほどよいとする性質
  definition: 同じ母数の2つの不偏推定量のうち、分散の小さいほうを「より有効」とする比べ方。
  version: 1
  principle: 不偏な推定量どうしなら、ばらつきの小さいほうが1回の推定値を当てにできる。正規母集団の母平均では、標本平均は中央値より有効で、n が大きいとき中央値の分散は標本平均の約 π/2≒1.57倍。
  conditions:
    math:
    - text: 比べる2つは、同じ母数の不偏推定量
      kind: 要件
      outside: 分散だけでは比べられない（偏りがあれば平均二乗誤差で比べる）
    - text: 母数のどの値でも分散の大小が同じ向き
      kind: 要件
      outside: どちらが有効とは言えない（母数の値によって入れ替わる）
    data:
    - 外れ値が混ざる裾の重いデータでは、中央値のほうが分散が小さいこともある。正規分布を前提にした「標本平均が有効」をそのまま当てはめない
  example: 正規母集団（σ＝10）から25個取ると、標本平均の標準誤差は 2、中央値の標準誤差はおよそ 2×√(π/2)≒2.51。標本平均のほうが有効。
  counterexample: 標本平均に 2 を足した X̄＋2 は、分散が標本平均と同じだが、偏りが 2 で不偏ではないので、有効の比べには入らない（分散が同じでも、偏りがあれば同じだけ良いとは言えない）。
  misconceptions:
  - misconception: 分散が小さい推定量ほど良い
    correction: 不偏な推定量どうしの比べでだけ、そう言える。偏りがあるものも含めて比べるなら、偏りの2乗も足した平均二乗誤差で比べる
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 10/math.sqrt(25) == 2 and abs(2*math.sqrt(math.pi/2) - 2.51) < 0.005 and abs(math.pi/2 - 1.57) < 0.005
- id: TERM-mse
  name: 平均二乗誤差（MSE）
  en: mean squared error
  category: 推定
  forms: [number]
  basis:
    text: 母数 θ の推定量 θ̂ について、E[(θ̂−θ)²]（推定量と母数のずれの2乗の期待値。母数の値ごとに決まる）
    terms: [TERM-estimator, TERM-expect]
  short: 推定量と母数のずれの2乗の期待値で、推定量の分散と偏りの2乗の和になる
  definition: 推定量と母数のずれの2乗の期待値 E[(θ̂−θ)²]。分散と偏りの2乗の和になり、偏りとばらつきを1つの物差しで比べられる。
  version: 1
  principle: 平均二乗誤差は 0 以上の値で、推定量の分散が無限なら無限大にもなる。偏りが少しあっても、分散がずっと小さければ平均二乗誤差は小さくなる。正規母集団の分散の推定で n＝5 なら、n で割る v は偏り −σ²÷5 をもつが、平均二乗誤差は不偏な s² より小さい。どちらを使うかは、偏りを許すかどうかの考え方で決まる。
  formulas:
  - id: F-mse-decomp
    label: 平均二乗誤差の分け方
    symbols:
    - symbol: MSE( )
      meaning: 平均二乗誤差（ずれの2乗の期待値）
      key: MSE
      concept: TERM-mse
    - symbol: θ̂
      meaning: 推定量
      key: thetahat
      concept: TERM-estimator
      kind: rv
    - symbol: V( )
      meaning: 分散（推定量のばらつき）
      key: V
      concept: TERM-var
    - symbol: b
      meaning: 推定量の偏り E(θ̂)−θ
      key: b
      concept: TERM-bias
      kind: value
    tree:
      op: eq
      args:
      - op: fn
        name: MSE
        args:
        - sym: thetahat
      - op: add
        args:
        - op: fn
          name: V
          args:
          - sym: thetahat
        - op: pow
          args:
          - sym: b
          - num: 2
    parts:
    - path:
      - 1
      - 0
      name: ばらつき
      meaning: 推定量が自分の平均のまわりでどれだけ散らばるか
    - path:
      - 1
      - 1
      name: 偏りの2乗
      meaning: 推定量の平均が母数からどれだけずれているか
  conditions:
    math:
    - text: 推定量の分散が有限
      kind: 仮定
      claim: CLM-43
      outside: ④-43 は保証されない（分散と偏りの2乗に分けられない）
    data:
    - 平均二乗誤差は母数の値ごとに決まる。2つの推定量は同じ母数の値で比べる（母数の値によって大小が入れ替わることがある）
    - 平均二乗誤差は母数の2乗の単位（分散の推定なら σ⁴ の単位）。母数の値が違う場面どうしの数を並べて比べない
  example: 正規母集団の分散 σ²＝4 を n＝5 で推し量ると、s² の平均二乗誤差は 2×16÷4＝8。v は分散 2×4×16÷25＝5.12 に偏り −0.8 の2乗 0.64 を足して 5.76 で、s² より小さい。
  counterexample: 「v の平均二乗誤差は 5.76」とだけ書いて、σ² の値を書かない。平均二乗誤差は σ⁴ に比例して母数の値ごとに違う（σ²＝1 なら 0.36）ので、母数の値なしの1つの数は、別の場面の推定量の平均二乗誤差と並べて比べられない（同じ σ² のもとでなら比べられる）。
  misconceptions:
  - misconception: 平均二乗誤差が小さい推定量は、偏りもばらつきも小さい
    correction: 平均二乗誤差は2つの和なので、偏りが大きくてもばらつきが小さければ小さくなりうる。偏りを許してよいかは、平均二乗誤差とは別に決める
  - misconception: 推定量の平均二乗誤差と、回帰の残差の平均平方は同じもの
    correction: 推定量の MSE は、推定値と真の値のずれの2乗の期待値（分散＋偏り²）。回帰の残差の平均平方（残差の2乗の和÷自由度）は、誤差の分散を推し量る別の量
  sources:
  - source: 公式2級範囲表
    locator: 推定（点推定・推定量の性質）
  checks:
  - 2*16/4 == 8 and math.isclose(2*4*16/25, 5.12) and math.isclose(5.12 + 0.8**2, 5.76) and math.isclose(5.76/16, 0.36)
- id: TERM-ci
  name: 信頼区間
  en: confidence interval
  category: 推定
  forms: [random_set]
  basis:
    text: 母数 θ を区間で推定するために、標本から作る2つの統計量 L≦U でつくる区間 [L, U]（観測したあとの区間も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 標本から作る、母数を推定するための区間で、作り方ごとに母数を含む確率の下限（信頼係数）が決まる
  definition: 標本から計算で決まる2つの値 L≦U で作る区間 [L, U] で、分からない母数を含むように作ったもの。標本を取り直すと、区間の方が動く。
  version: 1
  principle: 区間の両端は標本から計算する統計量なので確率変数で、母数 θ は動かない。標本平均が正規分布に従い σ が分かるとき、X̄±1.96σ÷√n が μ を含む確率は 0.95 で、この下限が信頼係数。観測したあとの1本の区間は、μ を含むか含まないかのどちらかで、その1本に 0.95 の確率がつくのではない。
  conditions:
    math:
    - text: 両端 L≦U は標本だけから計算でき、分からない母数の値を使わない（統計量）
      kind: 要件
      outside: 分からない母数を使わないと計算できない区間は、標本から作る信頼区間にならない
    - text: σ が分かっている平均の区間 X̄±z×σ÷√n は、X₁, …, Xₙ が独立に正規分布に従う
      kind: 仮定
      claim: CLM-6a
      outside: 母平均を含む確率が 1−α 以上とは限らない（正規でなくても n が大きければ近い）
    - text: σ が分からない平均の区間 X̄±t(n−1)×S÷√n は、X₁, …, Xₙ が独立に正規分布に従い、n≧2
      kind: 仮定
      claim: CLM-28a
      outside: 母平均を含む確率が 1−α 以上とは限らない
    data:
    - 外れ値や強い歪みがあって n が小さいと、母数を含む割合は名目とずれうる。ヒストグラムで形を確かめる
  example: σ＝10 が分かっていて、100人の平均が x̄＝50 なら、母平均の95%信頼区間は 50±1.96×10÷√100、つまり 48.04〜51.96。
  counterexample: σ が分からないのに、x̄±1.96σ÷√n と σ のまま書いた区間は、分からない σ を使うので標本から計算できず、信頼区間にならない。s で置き換えるなら、s のばらつきも入れた t の点を使う（n＝16 なら 2.131）。
  misconceptions:
  - misconception: 区間が狭いほど、μ に近い
    correction: 幅は偶然の揺れ（標準誤差）だけを表し、取り方の偏りは入らない。偏った取り方なら、狭い区間がまるごと μ から外れていることがある
  - misconception: 95%信頼区間は、個々の客の95%が入る範囲
    correction: 信頼区間は母数（母平均）についての幅。n を増やすと √n に反比例して狭くなる。個々の値の範囲は n を増やしても狭くならない
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定）
  checks:
  - abs(50-1.96*10/math.sqrt(100) - 48.04) < 1e-9 and abs(50+1.96*10/math.sqrt(100) - 51.96) < 1e-9
- id: TERM-conf-level
  name: 信頼係数
  en: confidence level
  category: 推定
  forms: [number]
  basis:
    text: 信頼区間 [L, U] を作る方法について、モデルのすべての母数の値で（θ 以外の母数を含む）とった、区間が θ を含む確率 P(L≦θ≦U) の下限（これが 1−α のとき、信頼係数 1−α の信頼区間という。95% など）
    terms: [TERM-ci, TERM-prob]
  short: 信頼区間の作り方が、母数のどの値でも母数を含む確率の下限（95%など）
  definition: 信頼区間の作り方について、母数がどの値でも、区間が母数を含む確率がこれ以上になるという下限。95%・99% など。
  version: 1
  principle: 信頼係数 1−α は、標本を取る前の作り方の性質で、母数のどの値でも区間が母数を含む確率が 1−α 以上のとき、信頼係数 1−α の区間という。同じ作り方で取り直すと、長い目で見て 1−α 以上の割合の区間が母数を含む。平均の区間で信頼係数を95%から99%に上げると、確率点が 1.96 から 2.576 になり、区間は約1.3倍に広がる。含む確率を上げる代わりに、区間は広く（ぼんやり）なる。
  conditions:
    math:
    - text: 区間の作り方（統計量 L≦U）と、母数が動く範囲（モデル）が決まっている
      kind: 要件
      outside: 下限をどの範囲でとるかが決まらず、信頼係数が定まらない
    data:
    - 近似で作った区間（割合の p̂±z×√(p̂(1−p̂)÷n)）では、p を1つに固定すれば、含む確率は n→∞ で 1−α に近づく。けれども、どの n でも p を0に近づけると含む確率は 1−(1−p)ⁿ 以下まで下がるので、この作り方の信頼係数は0（④-19）。「95%」は名目の値
    - くり返しで確かめるときは、同じ作り方で区間を多数作り、母数を含む割合を数える
  example: σ が分かっている正規母集団から n＝25 を取り、x̄±1.96σ÷√n を1000回作ると、約950回が μ を含む。
  counterexample: σ が分からないのに、s と z の点 1.96 で n＝5 の区間 X̄±1.96S÷√5 を作ると、μ を含む確率は約88%で、95%に届かない。s が σ より小さく出る標本で区間が狭くなりすぎるため。t(4) の点 2.776 を使えば95%になる。
  misconceptions:
  - misconception: 信頼係数95%は、手元の1本の区間が母数を含む確率
    correction: 信頼係数は作り方の性質。手元の1本は母数を含むか含まないかのどちらかで、どちらかは分からない
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定・信頼係数）
  checks:
  - abs(2.576/1.96 - 1.31) < 0.005 and 1000*0.95 == 950
  - 'abs(2*(lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(1.96,4)-1 - 0.88) < 0.005 and abs((lambda x,k: 0.5+sum(math.exp(math.lgamma((k+1)/2)-math.lgamma(k/2)-0.5*math.log(k*math.pi)-(k+1)/2*math.log(1+(x*(i+0.5)/4000)**2/k)) for i in range(4000))*x/4000)(2.776,4) - 0.975) < 5e-4'
- id: TERM-paired-t
  name: 対応のある t 検定
  en: paired t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 同じ対象の2つの測定値の対 (Xᵢ, Yᵢ)（i＝1, …, n）の差 Dᵢ＝Xᵢ−Yᵢ について、H₀：差の母平均が 0 を、t＝D̄/(s_D/√n)（D̄・s_D² は差の標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 同じ対象の2つの測定値の差をとり、差の平均が0かどうかを t 分布で調べる方法
  definition: 同じ対象から取った2つの測定値の差をとり、差の平均が0かどうかを、差の平均÷(差の標準偏差÷√n) で作る t で調べる検定。差を1つの標本とみた1標本の t 検定と同じ形。
  version: 1
  principle: 対の差をとると、対に共通する対象ごとの違い（店の規模・人の体質）が引き算で消える。対の2つの値に正の相関があると、差のばらつきは2群のばらつきより小さくなり（V(X−Y)＝V(X)＋V(Y)−2Cov(X, Y)）、別々の2群として比べるより標準誤差が小さく、差を見分けやすい。同じ形で、差の母平均の信頼区間 D̄±t(n−1)×s_D÷√n も作れる。
  conditions:
    math:
    - text: 2つの測定値が同じ対象から取った組 (Xᵢ, Yᵢ) で、組ごとに差 Dᵢ＝Xᵢ−Yᵢ を作れ、組の数 n≧2
      kind: 要件
      outside: 対応のある t 検定として定まらない（組に意味のない別々の2群なら、2群の t 検定を使う）
    - text: 差 D₁, …, Dₙ が独立に同じ正規分布に従う
      kind: 仮定
      claim: CLM-35
      outside: 帰無仮説のもとで t が t(n−1) に従うとは限らない（棄却する割合が有意水準どおりとは限らない）
    data:
    - もとの X・Y ではなく、差 D のヒストグラムで外れ値と歪みを確かめる
    - 施策の前後の比べでは、時期の変化（季節・天気）も差に入る。施策をしない店という比べる相手がないと、施策の効果と時期の効果を分けられない
  example: 同じ9店で施策の前後の売上の差をとると、差の平均 2.5万円・差の標準偏差 2万円。t＝2.5÷(2÷√9)＝3.75、自由度8 で、両側5%の点 2.306 を超える。
  counterexample: 施策をした10店と、しなかった別の10店の売上を、表の上から順に組にして差をとる。組に意味がないので、組み方を変えると差の平均・標準偏差が変わり、t も変わる。同じ対象の組という要件を外していて、対応のある t 検定にならない。
  misconceptions:
  - misconception: 対応のある t 検定は、2群の t 検定より、いつも差を見分けやすい
    correction: 有利なのは、対の2つの値に正の相関があるとき。相関が0に近いか負のときは差のばらつきが減らず、自由度が n−1 に減る分、かえって見分けにくいことがある
  sources:
  - source: 公式2級範囲表
    locator: 推定・検定（対応のある2標本）
  checks:
  - 2.5/(2/math.sqrt(9)) == 3.75 and 9-1 == 8 and 3.75 > 2.306
- id: TERM-welch
  name: ウェルチの t 検定
  en: Welch's t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 独立な2群の標本について、H₀：2つの母平均が等しい を、2群の母分散が等しいと仮定せずに、t＝(X̄₁−X̄₂)/√(s₁²/n₁＋s₂²/n₂)（X̄ⱼ・sⱼ² は群ごとの標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 2群の分散が等しいと仮定せずに、2群の平均の差を t 分布で調べる方法
  definition: 独立な2群の平均の差が0かどうかを、2群の母分散が等しいと仮定せずに、(X̄₁−X̄₂)÷√(s₁²/n₁＋s₂²/n₂) で作る t で調べる検定。自由度は近似の式で決める。
  version: 1
  principle: 群ごとに自分の分散で標準誤差を作るので、分散も人数も違う2群でも、等分散を仮定した方法のように、人数の多い群のばらつきに引っぱられない。自由度は a＝s₁²/n₁、b＝s₂²/n₂ として (a＋b)²÷{a²/(n₁−1)＋b²/(n₂−1)} で決め、ふつう整数にならない。帰無仮説のもとでも t 分布には近似でしか従わない。
  conditions:
    math:
    - text: 2群が互いに独立に取られている（同じ対象の組になっていない）
      kind: 要件
      outside: ウェルチの t 検定として定まらない（同じ対象の組なら、対応のある t 検定を使う）
    - text: 各群の観測が独立に同じ分布に従い、分散が 0＜σ²＜∞
      kind: 仮定
      claim: CLM-44
      terms:
      - TERM-indep
      outside: 帰無仮説のもとで、各群の大きさを増やしても t が標準正規分布に近づくとは保証されず、棄却する割合が有意水準に近いとは言えない
    data:
    - 各群が正規分布に近いか、外れ値がないかを群ごとに確かめる。自由度は近似なので、n が小さく分散が大きく違うと、棄却する割合が有意水準からずれうる
    - 2群の分散が等しそうでも使える。2群の人数が同じなら、t の値は等分散を仮定した方法と同じで、自由度だけが小さくなる（分散が等しければほぼ同じ、大きく違えば n−1 に近づく）
    - 各群の中の観測が独立に正規分布に従うことを前提にしても、帰無仮説のもとの分布は t の近似（自由度を近似で決める）。n が小さく分散の比が大きいと、棄却する割合が有意水準どおりとは限らない（有限の n での t の分布は σ₁²/σ₂² によって変わり、一般には t 分布ではない。人数が同じで分散も等しいときなどは、ちょうど t(n₁＋n₂−2)。n が大きいときは各群の大きさによらず標準正規分布に近づく：④-44。#431）
  example: 店A（12日、平均40・s＝3）と店B（8日、平均36・s＝6）の差は4。a＝9÷12＝0.75、b＝36÷8＝4.5 で、SE＝√5.25≒2.29、t≒1.75。自由度は 5.25²÷(0.75²÷11＋4.5²÷7)≒9.4 で、人数の合計から2を引いた18よりずっと小さい。
  counterexample: 同じ10店の施策の前と後を、別々の2群としてウェルチの t 検定で比べる。前と後は同じ店の組で独立ではないので、要件を外している。前と後は店ごとに連動する（正の相関）ので、店ごとの違いが2群の分散に入ったまま残り、標準誤差が大きすぎる。
  misconceptions:
  - misconception: ウェルチの t 検定は、2群の分散が違うときだけ使う
    correction: 分散が等しくても使える。人数が同じなら t は等分散の方法と同じで、自由度が小さくなるだけ（分散が等しければほとんど変わらない）。分散が等しいかを先に検定して方法を選ぶと、全体として棄却する割合が有意水準からずれる
  sources:
  - source: 公式2級範囲表
    locator: 推定・検定（2標本の平均の差）
  checks:
  - 40-36 == 4 and 9/12 == 0.75 and 36/8 == 4.5 and abs(math.sqrt(5.25) - 2.29) < 0.005 and abs(4/math.sqrt(5.25) - 1.75) < 0.005 and abs(5.25**2/(0.75**2/11+4.5**2/7) - 9.4) < 0.05 and 12+8-2 == 18
- id: TERM-h0
  name: 帰無仮説
  en: null hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 母集団の分布（その母数）について置く仮説（真か偽かが決まる命題）で、データがそれと食い違うかを調べる対象にするもの。分布をただ1つに決める形（単純仮説。μ＝μ₀ など）か、決めた集まりに置く形（複合仮説）で立てる
    terms: [TERM-dist]
  short: 検定で「差がない・効果がない」などとして立て、データで棄却されるかを調べる仮説
  definition: 検定で、母集団の分布（母数）について「差がない」「効果がない」などと立てる仮説。データがこれと食い違うかを調べる。
  version: 1
  principle: 帰無仮説は「正しいと仮定して計算する出発点」で、正しいと示す対象ではない。μ＝μ₀ のように分布を1つに決めると、そのもとで検定統計量の分布が分かり、データの珍しさを確率で測れる。棄却されなくても、帰無仮説が正しいとは言えない。
  conditions:
    math:
    - text: 母集団の分布（母数）についての命題で、真か偽かが決まる
      kind: 要件
      outside: 帰無仮説にならない（標本についての文は、計算すれば分かるので調べる対象にならない）
    data:
    - データを見る前に立てる。データを見てから、差が出た所に合わせて立てると、誤って棄却する割合が有意水準どおりとは限らない
  example: 従来の1日の来店客数の平均100人に対し、新しい陳列のあとの母平均 μ について、H₀：μ＝100 と立てる。
  counterexample: 「36日の平均は103人である」は標本についての文で、計算すれば確かめられるので、帰無仮説にならない。
  misconceptions:
  - misconception: 帰無仮説が棄却されなければ、帰無仮説は正しいと言える
    correction: 棄却されないのは「データと食い違うとは言えない」だけ。n が小さく検出力が低ければ、差があっても棄却されにくい
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  no_checks: 数は仮説に置く値（100）と例の日数で、計算した数ではない
- id: TERM-h1
  name: 対立仮説
  en: alternative hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 帰無仮説 H₀ が偽のときに母集団の分布がとりうるもの（の全部か一部）についての仮説で、H₀ を棄却したときに採るもの。ずれの向きを決める形（μ＞μ₀）と決めない形（μ≠μ₀）がある
    terms: [TERM-h0]
  short: 帰無仮説を棄却したときに採る仮説で、調べたい差や効果があるとするもの
  definition: 帰無仮説が成り立たないときに母集団の分布がとりうる範囲についての仮説で、帰無仮説を棄却したときに採るもの。
  version: 1
  principle: 対立仮説は棄却域の置き方を決める。μ≠μ₀（向きを決めない）なら両側に、μ＞μ₀（向きを決める）なら上側に棄却域を置く。向きはデータを見る前に、知りたいことから決める。
  conditions:
    math:
    - text: 帰無仮説と重ならない（帰無仮説が真なら、対立仮説は偽）
      kind: 要件
      outside: 棄却したときに採る仮説として定まらない
    data:
    - 片側にするなら、逆の向きのずれは知らなくてよい理由を、データを見る前に書く
  example: 新しい陳列で来店客数が増えたかを知りたいなら H₁：μ＞100、変わったかを知りたいなら H₁：μ≠100。
  counterexample: H₀：μ＝100 に対して H₁：μ≧100 とすると、μ＝100 が両方に入り、棄却したときに何を採ったのかが定まらない。
  misconceptions:
  - misconception: 帰無仮説を棄却すれば、対立仮説が正しいと証明された
    correction: 棄却は「帰無仮説のもとでは珍しいデータ」ということ。帰無仮説が正しくても α 以下の確率で棄却するので、誤りの可能性は残る
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  no_checks: 数は仮説に置く値（100）で、計算した数ではない
- id: TERM-test-stat
  name: 検定統計量
  en: test statistic
  category: 検定
  forms: [rv]
  basis:
    text: 帰無仮説 H₀ を棄却するかを決めるために使う統計量 T（H₀ のもとでの T の分布が分かるか、近似できるように作る。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-h0]
  short: 帰無仮説のもとでの分布が分かるように作った統計量で、データのずれの大きさを1つの数にしたもの
  definition: 帰無仮説を棄却するかを決めるために、データから計算する1つの数。帰無仮説のもとでの分布が分かる（または近似できる）ように作る。
  version: 1
  principle: データのずれを「帰無仮説のもとでの揺れの何倍か」に直す。平均の検定では Z＝(X̄−μ₀)÷(σ÷√n) で、帰無仮説のもとで分布が分かるから、観測値 z の珍しさを確率（p 値）で言える。
  conditions:
    math:
    - text: 標本だけから計算でき、分からない母数を含まない（μ₀ は帰無仮説で決めた値）
      kind: 要件
      outside: 標本から計算できず、検定統計量にならない
    - text: H₀：μ＝μ₀ のもとで X₁, …, Xₙ が独立に同じ正規分布 N(μ₀, σ²) に従うとき、Z＝(X̄−μ₀)÷(σ÷√n) は N(0, 1) に従う
      kind: 仮定
      claim: CLM-6a
      outside: 正規でなければ N(0, 1) に従うとは限らない（分散が有限で n が大きければ近い。④-6b）。独立でなければ X̄ の分散が σ²÷n とは限らない
    data:
    - 分布の前提（独立・正規・σ が分かるか）を、データの取り方と形で確かめる
  example: μ₀＝100、σ＝12、n＝36、x̄＝103 なら、z＝(103−100)÷(12÷√36)＝3÷2＝1.5。
  counterexample: σ が分からないのに z＝(x̄−μ₀)÷(σ÷√n) と書くと、分からない σ を含むので標本から計算できない。s に替えて t にする（{{unit:U25}}）。
  misconceptions:
  - misconception: z が大きいほど、差が大きい
    correction: z は差÷標準誤差で、同じ差でも n が大きいほど大きくなる。z は珍しさを表し、差の大きさは表さない
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - (103-100)/(12/math.sqrt(36)) == 1.5
- id: TERM-pvalue
  name: p値
  en: p-value
  category: 検定
  forms: [rv, number]
  basis:
    text: 検定統計量 T の観測値について、H₀ が正しいとしたとき T が観測値と同じかそれより極端な値（極端さの向きは前もって決める）をとる確率。H₀ が複合仮説なら H₀ の中での上限（T の関数とみると確率変数、観測したあとの値も p 値と呼ぶ）
    terms: [TERM-test-stat, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいとしたとき、観測した値か、それより極端な値が出る確率
  definition: 帰無仮説が正しいとしたとき、検定統計量が今回の値か、それより極端な値をとる確率。
  version: 1
  principle: 小さいほど「帰無仮説のもとでは珍しいデータ」。p 値が α 以下なら棄却すると決めることは、棄却域に入ったら棄却することと同じ判定になる（④-22）。p 値は、帰無仮説が正しい確率ではない。
  conditions:
    math:
    - text: 極端さの向き（両側か片側か）を、データを見る前に決める
      kind: 要件
      outside: p 値が定まらない（向きを後から選ぶと、同じデータに2通りの p 値が出る）
    - text: 「p 値≦α」と「棄却域に入る」が同じ判定になるのは、帰無仮説が1つの分布に決まり（複合なら確率を帰無仮説の中での上限に替える）、検定統計量が連続分布（または上から集まらない離散分布）のとき
      kind: 仮定
      claim: CLM-22
      outside: 2つの判定が同じとは限らない
    data:
    - p 値は効果の大きさを表さない。n が大きいと小さな差でも p 値は小さくなる。差の大きさは区間（{{unit:U22}}）で添える
  example: z＝1.5 の両側の p 値は 2×(1−Φ(1.5))≒0.134 で、0.05 より大きい。
  counterexample: z がプラスに出たのを見てから、上側の片側の p 値（約0.067）を使う。向きをデータを見てから決めていて、要件を外している。
  misconceptions:
  - misconception: p＝0.03 なら、帰無仮説が正しい確率は3%
    correction: p 値は、帰無仮説が正しいと仮定したときのデータの珍しさ。帰無仮説が正しい確率は、検定の手順からは出てこない
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 'abs(2*(1-(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(1.5)) - 0.134) < 0.0005 and abs(1-(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(1.5) - 0.067) < 0.0005'
- id: TERM-alpha
  name: 有意水準
  en: significance level
  category: 検定
  forms: [number]
  basis:
    text: 第1種の過誤の確率に、データを見る前に置く上限 α（5%・1% など）
    terms: [TERM-type1]
  short: 帰無仮説を棄却する基準の確率で、正しい帰無仮説を誤って棄却する確率の上限（5%など）
  definition: 正しい帰無仮説を誤って棄却する確率に、データを見る前に置く上限（5%・1% など）。
  version: 1
  principle: α は判断の厳しさを決める。同じ n で α を小さくすると、棄却域が狭まって第1種の過誤は減るが、第2種の過誤は増える。5% は慣習で、誤りの損の大きさで決めてよい。
  conditions:
    math:
    - text: データを見る前に決める
      kind: 要件
      outside: 誤って棄却する確率の上限にならない（p 値を見てから α を選ぶと、上限の意味がなくなる）
    data:
    - 何度も検定すると、どれかで誤って棄却する確率は α より大きくなりうる。帰無仮説が正しい独立な検定を k 回行えば、最大で 1−(1−α)ᵏ（各検定の確率がちょうど α なら等しい）
  example: α＝0.05 の両側の z 検定では、|z|≧1.96 で棄却する。z＝1.5 なら棄却しない。
  counterexample: p＝0.08 が出たのを見てから「今回は α＝0.1 にする」と決める。α をデータを見て決めていて、要件を外している。
  misconceptions:
  - misconception: α＝5% なら、棄却した結論の5%が誤り
    correction: α は「帰無仮説が正しいときに棄却する確率」。棄却した結論のうち誤りがどれだけかは、もともと帰無仮説が正しい場合の多さと検出力で変わる
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 1.5 < 1.96 and abs(1-0.95**20 - 0.64) < 0.005
- id: TERM-reject
  name: 棄却域
  en: rejection region
  category: 検定
  forms: [event]
  basis:
    text: 検定統計量 T のとる値の集合 R で、T の観測値が R に入れば帰無仮説を棄却すると、データを見る前に決めたもの
    terms: [TERM-test-stat]
  short: 検定統計量がその範囲に入ったら帰無仮説を棄却すると、前もって決めた範囲
  definition: 検定統計量がその範囲に入ったら帰無仮説を棄却すると、データを見る前に決めておく値の範囲。
  version: 1
  principle: 帰無仮説のもとで検定統計量が入る確率が α 以下になるように、対立仮説の向きの端に置く。z 検定では、両側5%なら |z|≧1.96、上側5%なら z≧1.645、上側1%なら z≧2.326。
  conditions:
    math:
    - text: データを見る前に決める
      kind: 要件
      outside: 帰無仮説のもとで入る確率が α 以下とは限らない
    data:
    - 境目の値（1.96 など）は、検定統計量の分布の前提（正規・σ が分かる）に頼る。前提が崩れると、入る確率は α からずれうる
  example: 両側5% の z 検定の棄却域は z≦−1.96 と z≧1.96。z＝1.5 は入らない。
  counterexample: z の観測値1.5 を見てから、それがちょうど入るように境目を1.4 にした範囲。データを見て決めていて、棄却域にならない。
  misconceptions:
  - misconception: p値で判断するのと棄却域で判断するのとで、結論が変わることがある
    correction: 同じ有意水準 α なら、「p値≦α」と「検定統計量が棄却域に入る」は同じことで、結論は変わらない
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 1.5 < 1.96 and 1.5 > 1.4
  - 'abs(0.5*(1+math.erf(2.326/math.sqrt(2))) - 0.99) < 1e-4 and abs(0.5*(1+math.erf(1.645/math.sqrt(2))) - 0.95) < 1e-4'
- id: TERM-sides
  name: 片側検定・両側検定
  en: one-sided and two-sided tests
  category: 検定
  forms: [procedure]
  basis:
    text: 仮説検定のうち、対立仮説 H₁ が母数のずれの向きを1つに決めるもの（片側検定）と、向きを決めないもの（両側検定）。棄却域はそれに合わせて置く（片側なら検定統計量の分布のその向きの端、両側ならふつう両端。ずれの向きによらず大きい値が出る統計量では、両側でも上側だけ）
    terms: [TERM-test, TERM-h1, TERM-reject]
  short: 対立仮説が母数のずれの向きを1つに決めるか（片側）、決めないか（両側）の違いで、棄却域の置き方はそれで決まる
  definition: 対立仮説がずれの向きを決めない（両側）か、1つの向きに決める（片側）かの違い。棄却域は、両側ならふつう両端、片側ならその向きの端に置く。
  version: 1
  principle: 同じ α でも、片側は α を1つの端に全部置くので、境目が近い（5%なら1.645。両側は1.96）。向きが合えば棄却しやすいが、逆の向きのずれは見つけられない。
  conditions:
    math:
    - text: 片側にするなら、向きをデータを見る前に決める
      kind: 要件
      outside: 有意水準を保てるとは限らない（向きを後から選ぶと、誤って棄却する確率は2倍になりうる）
    data:
    - 「逆の向きならどうなっても構わない」と言える理由があるときだけ片側にする
  example: z＝1.8 なら、両側5%（1.96）では棄却しないが、上側5%（1.645）では棄却する。
  counterexample: z＝−1.8 が出たのを見てから、下側の片側検定に切り替える。両側5%では棄却しない値が、片側に変えたことで棄却になる。向きをデータを見て選んでいて、要件を外している。
  misconceptions:
  - misconception: 片側の方が棄却しやすいので、いつも片側を使えばよい
    correction: 逆の向きのずれは見つけられない。向きをデータを見てから選ぶと、誤って棄却する確率が有意水準を超える
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 1.645 < 1.8 < 1.96
- id: TERM-type1
  name: 第1種の過誤
  en: type I error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が正しいときに、検定統計量が棄却域に入る（H₀ を棄却する）という判定の誤り（事象）。その確率も同じ名前で呼ぶ（その確率は H₀ の中のどの分布かで変わり、有意水準はその上限）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいのに、誤って棄却してしまう誤り
  definition: 帰無仮説が正しいのに、棄却してしまう誤り。その確率も同じ名前で呼ぶ。
  version: 1
  principle: 第1種の過誤の確率は、棄却域の決め方で有意水準 α 以下に抑えられる。帰無仮説が正しい独立な検定を何度も行うと、どれか1つで第1種の過誤が起きる確率は増えていく（α＝0.05 なら、独立な20回で約0.64）。
  conditions:
    math:
    - text: 帰無仮説が正しいとき（帰無仮説の中の1つの分布のもと）の判定の誤りとして言う
      kind: 要件
      outside: 第1種の過誤ではない（帰無仮説が誤っているときに棄却するのは正しい判定）
    data:
    - 確率が α 以下になるのは、棄却域をデータを見る前に決め、検定統計量の分布の前提が成り立つとき。境目をデータで動かしたり、外れ値や歪みがあったりすると、α を超えうる
  example: α＝0.05 の z 検定は、帰無仮説が正しくても、20回に1回ほどは棄却する。
  counterexample: 帰無仮説が誤っている（母平均が本当に変わった）ときに棄却したのは、正しい判定で、第1種の過誤ではない。同じ「棄却した」でも、帰無仮説が正しいかどうかで誤りかどうかが決まる。
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 1/20 == 0.05 and abs(1-0.95**20 - 0.64) < 0.005
- id: TERM-type2
  name: 第2種の過誤
  en: type II error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が誤っているとき（分布が H₀ の外にあるとき）に、検定統計量が棄却域に入らない（H₀ を棄却しない）という判定の誤り（事象）。その確率 β も同じ名前で呼ぶ（β は H₀ の外のどの分布かで変わる）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が誤っているのに、棄却されない誤り
  definition: 帰無仮説が誤っているのに、棄却しない誤り。その確率 β も同じ名前で呼ぶ。
  version: 1
  principle: β は、母数の値が帰無仮説からどれだけ離れているか・n・σ・α・向きで決まる。対立仮説の向きに離れているほど、n が大きいほど、β は小さい（片側検定で逆の向きに離れた値では、β はかえって大きい）。
  conditions:
    math:
    - text: 帰無仮説の外の、決めた1つの分布（母数の値）について言う
      kind: 要件
      outside: β が定まらない（母数の値によって変わる）
    data:
    - 「どれくらいの差なら見つけたいか」を先に決め、その値で β を見積もる
  example: μ₀＝100、σ＝12、n＝36、両側5% の z 検定で、母平均が103 なら、β≒0.68（検出力は約0.32）。
  counterexample: 母平均がいくつの場合かを決めずに「この検定の β は0.3」と言う。どの値の β かが分からず、要件を外している。
  misconceptions:
  - misconception: 棄却しなかったのだから、第2種の過誤は起きていない
    correction: 帰無仮説が誤っていれば、棄却しないことそのものが第2種の過誤。棄却しなかった結果から、誤りがなかったとは言えない
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 'abs((lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(1.5-1.96)+(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(-1.5-1.96) - 0.323) < 0.0005 and abs(1-((lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(1.5-1.96)+(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(-1.5-1.96)) - 0.68) < 0.005'
- id: TERM-power
  name: 検出力
  en: power
  category: 検定
  forms: [number]
  basis:
    text: 帰無仮説 H₀ が誤っているときに H₀ を棄却する確率 1−β（β は第2種の過誤の確率。H₀ の外のどの分布かで値が変わる）
    terms: [TERM-type2]
  short: 帰無仮説が誤っているときに、正しく棄却される確率（1−第2種の過誤の確率）
  definition: 帰無仮説が誤っているときに、正しく棄却する確率。1−β。
  version: 1
  principle: α と向きを決めると、検出力は、差（母数の値と帰無仮説のずれ）÷標準誤差で決まる。n を4倍にすると標準誤差が半分になり、対立仮説の向きの同じ差なら検出力が上がる。検定を計画するときに、見つけたい差と必要な n を決める道具になる。
  conditions:
    math:
    - text: 帰無仮説の外の、決めた1つの分布（母数の値）について言う
      kind: 要件
      outside: 検出力が定まらない（母数の値によって変わる）
    data:
    - σ の見込みが外れると、見積もった検出力も外れる。過去のデータで σ を確かめる
  example: μ₀＝100、σ＝12、両側5% の z 検定で、母平均が103 なら、n＝36 で検出力は約0.32、n を4倍の144 にすると約0.85。
  counterexample: 母平均がいくつの場合かを決めずに「この調査の検出力は0.8」と言う。どの値についての検出力かが分からず、要件を外している。
  misconceptions:
  - misconception: 検出力は、検定ごとに1つの値に決まる
    correction: 検出力は、母数の値（見つけたい差）ごとに違う。「この調査の検出力」と言うときは、どの差についての値かを一緒に言う
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - 'abs((lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(1.5-1.96)+(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(-1.5-1.96) - 0.32) < 0.005 and abs((lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(3-1.96)+(lambda x: 0.5*(1+math.erf(x/math.sqrt(2))))(-3-1.96) - 0.85) < 0.005 and 12/math.sqrt(144) == 1'
- id: TERM-pool
  name: プールした比率
  en: pooled proportion
  category: 検定
  forms: [rv]
  basis:
    text: 2群の標本の大きさ n₁・n₂ と標本比率 p̂₁・p̂₂ から作る (n₁p̂₁＋n₂p̂₂)/(n₁＋n₂)（2群を合わせた標本の中で性質をもつものの割合。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-sample-prop]
  short: 2群の割合の差を検定するとき、帰無仮説（割合が等しい）のもとで2群を合わせて求めた割合
  definition: 2群の標本を1つに合わせたときの、性質をもつものの割合 p̄＝(x₁＋x₂)÷(n₁＋n₂)。各群の標本比率を、標本の大きさで重みを付けて平均した値と同じ。
  version: 1
  principle: 2群の比率が等しい（H₀：p₁＝p₂）と仮定すると、2群は同じ比率 p をもつ1つの集まりとみなせるので、p を推定するのに2群を合わせて使える。差の検定では、標準誤差を √(p̄(1−p̄)(1÷n₁＋1÷n₂)) と、H₀ のもとの共通の比率で作る。差の区間推定では H₀ を置かないので、各群の p̂ で作る。
  conditions:
    math:
    - text: 2群の標本の大きさ n₁, n₂ は1以上の整数で、各個体の値は 0 か 1（x₁, x₂ は性質をもつ個数）
      kind: 要件
      outside: プールした比率が定義されない（0 と 1 以外の値を合わせても割合ではない）
    data:
    - 2群で「性質をもつ」の数え方（分母と、何を1と数えるか）がそろっているかを確かめる。数え方の違う2群を合わせても、共通の比率の推定にならない
    - 2群の比率が明らかに違うときは、p̄ はどちらの群の比率でもない。差の大きさを示すとき（区間）は、各群の p̂ を使う
  example: A店は100人中20人、B店は100人中30人が購入。p̄＝(20＋30)÷(100＋100)＝0.25。差の検定の標準誤差は √(0.25×0.75×(1÷100＋1÷100))≒0.0612、z＝(0.2−0.3)÷0.0612≒−1.63。
  counterexample: A店は100人中20人（p̂₁＝0.2）、B店は400人中200人（p̂₂＝0.5）。2つの比率を単純に平均した (0.2＋0.5)÷2＝0.35 は、プールした比率ではない。合わせた標本の割合は (20＋200)÷(100＋400)＝0.44 で、人数の多い B店の比率に近い。
  misconceptions:
  - misconception: 差の区間推定の標準誤差にも、プールした比率を使う
    correction: 区間推定は「差がない」と仮定しないので、各群の p̂ で √(p̂₁(1−p̂₁)÷n₁＋p̂₂(1−p̂₂)÷n₂) を作る。プールした比率は、差がないと仮定する検定でだけ使う
  sources:
  - source: 公式2級範囲表
    locator: 検定（2標本の比率の差）
  checks:
  - (20+30)/(100+100) == 0.25 and abs(math.sqrt(0.25*0.75*(1/100+1/100)) - 0.0612) < 0.00005 and abs(-0.1/math.sqrt(0.25*0.75*0.02) + 1.63) < 0.005
  - (0.2+0.5)/2 == 0.35 and (20+200)/(100+400) == 0.44
- id: TERM-expected
  name: 期待度数
  en: expected frequency
  category: 検定
  forms: [number, rv]
  basis:
    text: 帰無仮説 H₀ のもとでの各欄（区分）の度数 Oᵢ の期待値 n·pᵢ（n は総数、pᵢ は H₀ のもとでその欄に入る確率）。H₀ が確率を1つに決めないとき（独立性検定、母数を推定する適合度検定）は、pᵢ の代わりに度数から推定した p̂ᵢ を使った n·p̂ᵢ（その期待値の推定値）（独立性検定では 行の合計×列の合計÷総数）
    terms: [TERM-h0, TERM-expect]
  short: 帰無仮説（独立・決めた割合どおり）が正しいとしたとき、各欄に入ると見込まれる度数
  definition: 帰無仮説が正しいとしたときに、各欄（区分・クロス集計表のセル）に入ると見込まれる度数。決めた割合で調べるなら 総数×その割合、独立性を調べるなら 行の合計×列の合計÷総数。
  version: 1
  principle: 観測度数 O と比べる「仮説どおりならこうなるはず」の基準。総数 n の観測が独立に各欄に確率 pᵢ で入るなら、欄 i の度数は B(n, pᵢ) に従い、その期待値が n·pᵢ。独立性の仮説では、行に入る確率と列に入る確率の積がセルの確率なので、それぞれを行・列の合計の割合で推定して 行計×列計÷総数 になる。期待度数は整数でなくてよく、全部の欄を足すと総数になる。
  conditions:
    math:
    - text: 帰無仮説が各欄の確率 pᵢ を決める（または度数から推定する方法を決める）
      kind: 要件
      outside: 期待度数が定まらない（比べる基準がない）
    data:
    - 期待度数が小さい欄（目安は5未満）があると、Σ(O−E)²÷E をカイ二乗分布で近似するのが粗くなる。欄をまとめるか、正確な方法を考える
    - 期待度数は「割合」ではなく「度数」。割合のまま Σ(O−E)²÷E に入れると、統計量の大きさが総数とずれる
  example: 来店客120人の曜日（月〜土の6区分）が均等かを調べるなら、各曜日の期待度数は 120×(1÷6)＝20人。
  counterexample: 曜日ごとの来店客数について、H₀ を「土曜がいちばん多いということはない」とすると、各曜日の確率が1つに決まらないので、期待度数を作れない。H₀ は「各曜日の割合が1/6」のように、各欄の確率を決める形にする。
  misconceptions:
  - misconception: 期待度数は、観測度数の平均
    correction: 帰無仮説のもとでの度数の期待値。仮説が違えば、同じ表でも期待度数は変わる
  sources:
  - source: 公式2級範囲表
    locator: 検定（適合度検定・独立性の検定）
  checks:
  - 120*(1/6) == 20
- id: TERM-indep-test
  name: クロス集計表のカイ二乗検定
  en: chi-squared test for contingency tables
  category: 検定
  forms: [procedure]
  basis:
    text: クロス集計表の度数について、H₀ を、統計量 Σ(O−E)²/E（O は観測度数、E は期待度数）で検定する仮説検定（H₀ は行と列の分かれ方についての仮説で、何を H₀ にし、統計量が近づく根拠が何かは取り方で決まる）
    terms: [TERM-test, TERM-crosstab, TERM-expected]
  short: クロス集計表の観測度数と期待度数のずれをまとめ、カイ二乗分布で調べる検定（独立性検定・同質性の検定に共通の手続き）
  definition: クロス集計表の各セルの観測度数と期待度数（行計×列計÷総数）のずれを Σ(O−E)²÷E にまとめ、自由度 (行の数−1)(列の数−1) のカイ二乗分布の上側の点と比べて調べる検定。何を H₀ にし、なぜカイ二乗分布に近づくかは取り方で決まる：総数を1つの集団から取れば独立性検定（H₀：2つの変数は独立）、行ごとに標本数を先に決めて取れば同質性の検定（H₀：どの行でも列の割合が等しい）。統計検定2級の出題範囲が挙げる名前は「独立性の検定」だけで、この教材の U27 でも、どちらの取り方の表も「独立か」と問う。
  version: 2
  principle: H₀ のもとで、独立性検定ならセルの確率は行の確率×列の確率、同質性の検定ならどの行でも列の確率が同じ。独立性検定では行と列の割合を、同質性の検定では列の割合を合計から推定し、どちらでも期待度数は 行計×列計÷総数 になる。ずれが偶然の範囲より大きければ H₀ を棄却する。自由度は、行・列の合計を決めたとき自由に決められるセルの数で、(r−1)(c−1)。2×2 の表の χ² は、2つの比率の差の z（合わせた比率で SE を作る）の2乗と同じ値になる。
  conditions:
    math:
    - text: 各個体がちょうど1つのセルに入る（同じ個体を2回数えない）
      kind: 要件
      outside: この検定として定まらない（同じ人の前後のように1人を2回数えた表は、対応のある比べ方にする）
    - text: どのセルも期待度数が5以上
      kind: 目安
      outside: この目安ではカイ二乗分布での近似を勧められない。カテゴリをまとめるか、正確な方法を考える
      target: Σ(O−E)²÷E のカイ二乗分布による近似
      source:
        source: NIST統計ハンドブック
        locator: 1.3.5.15 Chi-Square Goodness-of-Fit Test（期待度数を5以上にする目安。独立性検定には、同じ Σ(O−E)²÷E の近似なので、この適合度の目安を当てた）
    data:
    - 取り方を確かめる：総数だけを決めて1つの集団から取ったか（独立性検定）、行ごとの人数を先に決めて取ったか（同質性の検定。各店100人ずつに聞くなど）。計算は同じだが、H₀ の読み方と近づく根拠（④-28b・④-28c）が違う。それぞれの仮定は文脈の見出しに書く
    - 棄却しても「関連がある」まで。どちらが原因か、ほかの変数（店・曜日）が両方に効いているかは、この検定では分からない
    - χ² は総数が大きいと、小さな関連でも大きくなる。関連の強さは、行ごとの割合（帯グラフ）で見る
  example: チラシA・Bを各100人に配り、A は60人、B は40人が買った。期待度数はどのセルも 100×100÷200＝50、χ²＝4×(10²÷50)＝8、自由度1 で、上側5%の点3.841 を超えるので、「どちらのチラシでも買う割合が等しい」という仮説（同質性の検定の H₀。各100人に配ったので行の合計を先に決めた取り方）を棄却する。
  counterexample: 同じ200人に試食の前と後で「買いたいか」を聞き、「前」「後」を行に、「買いたい・買いたくない」を列にした2×2の表（合計 2×200＝400件）を作って独立性検定をする。1人を2回数えているので、個体が1つのセルにだけ入るという要件を外している。
  misconceptions:
  - misconception: 独立性検定で棄却されれば、一方が他方の原因
    correction: 言えるのは「関連がある」まで。ほかの変数が両方に効いていても関連は出る
  sources:
  - source: 公式2級範囲表
    locator: 検定（独立性の検定）
  checks:
  - 100*100/200 == 50 and 4*(10**2/50) == 8 and 8 > 3.841 and 2*200 == 400
- id: TERM-indep-ctx
  name: 独立性検定
  en: test of independence
  category: 検定
  forms: [procedure]
  # 文脈の見出し（① の 2・6 の 20 の決まったこと。#475）：クロス集計表のカイ二乗検定の、1つの集団から総数を取る文脈
  heading_of:
    concept: TERM-indep-test
    correspondence: クロス集計表のカイ二乗検定を、総数 n だけを決めて1つの集団から取った表に当てる場合
    object_diff: 1つの集団の個体を、2つの質的変数で分けた表。行の合計も列の合計も偶然で決まる
    context_diff: 「2つの変数に関連があるか」を問う。H₀ は「2つの変数は独立」
    context:
      sampling: 総数 n だけを先に決め、1つの集団から個体を独立に取って、2つの変数で分ける（行・列の合計は偶然で決まる）
      null_hypothesis:
        text: 2つの変数は独立（どのセルの確率も、その行の確率×その列の確率）
        terms: [TERM-indep]
      conditions:
      - text: 総数 n を1つの集団から取り、個体どうしが独立に、同じ確率でセルに入る
        kind: 仮定
        claim: CLM-28b
        outside: Σ(O−E)²÷E が自由度 (r−1)(c−1) のカイ二乗分布に近づくとは保証されない（同じ家族・同じ日にまとまって答える客を数えると、度数のばらつきが大きくなる）
      - text: 行・列のカテゴリ（区分のまとめ方）はデータを見る前に決め、行・列のどの区分の確率も正
        kind: 仮定
        claim: CLM-28b
        outside: 近づくとは保証されない（まとめ方をデータを見て選ぶと、ずれが大きく見える切り方を選べ、棄却する割合が有意水準より大きくなる）
      - text: H₀（2つの変数は独立）が正しく、セルの確率は行・列の合計の割合から推定する（推定する母数は (r−1)＋(c−1) 個）
        kind: 仮定
        claim: CLM-28b
        outside: 0 を中心とした（ずれのない）カイ二乗分布に近づくとは言えない（関連があれば、総数とともに χ² は大きくなる）
  version: 1
- id: TERM-homog-ctx
  name: 同質性の検定
  en: test of homogeneity
  category: 検定
  forms: [procedure]
  # 文脈の見出し（① の 2・6 の 20 の決まったこと。#475）：クロス集計表のカイ二乗検定の、行ごとに標本数を先に決めて取る文脈
  heading_of:
    concept: TERM-indep-test
    correspondence: クロス集計表のカイ二乗検定を、行（集団）ごとの標本数を先に決めて取った表に当てる場合
    object_diff: いくつかの集団（行）それぞれから取った標本を、1つの質的変数（列）で分けた表。行の合計は取る前に決めた数
    context_diff: 「どの集団でも、列の割合が同じか」を問う。統計検定2級の出題範囲が挙げる名前は「独立性の検定」だけで、この教材の U27 でも、この取り方の表を「独立か」と問う
    context:
      sampling: 行ごとの標本数 n₁, …, nᵣ を先に決め、各集団から個体を独立に取って、列の区分に分ける（行の合計は決めた数で、列の合計は偶然で決まる）
      null_hypothesis:
        text: どの行でも、列の区分の確率が等しい（p₁ⱼ＝…＝pᵣⱼ。j＝1, …, c）
      conditions:
      - text: 行ごとの標本数をデータを取る前に決め、各行の中の個体が独立に、同じ確率で列の区分に入り、行どうしも独立
        kind: 仮定
        claim: CLM-28c
        outside: Σ(O−E)²÷E が自由度 (r−1)(c−1) のカイ二乗分布に近づくとは保証されない（同じ日にまとまって来た客を数えると、度数のばらつきが多項分布より大きくなる。結果を見て人数を足すと、行の合計を先に決めた前提が崩れ、棄却する割合が有意水準からずれる）
      - text: 列のカテゴリ（区分のまとめ方）はデータを見る前に決め、どの区分の確率も正
        kind: 仮定
        claim: CLM-28c
        outside: 近づくとは保証されない（まとめ方をデータを見て選ぶと、ずれが大きく見える切り方を選べ、棄却する割合が有意水準より大きくなる）
      - text: H₀（どの行でも列の割合が等しい）が正しく、共通の確率を列の合計の割合で推定する（推定する母数は c−1 個）
        kind: 仮定
        claim: CLM-28c
        outside: 0 を中心とした（ずれのない）カイ二乗分布に近づくとは言えない（行ごとに割合が違えば、標本数とともに χ² は大きくなる）
  version: 1
- id: TERM-gof
  name: 適合度検定
  en: goodness-of-fit test
  category: 検定
  forms: [procedure]
  basis:
    text: k 個の区分に入った観測度数 O₁, …, O_k について、H₀：各区分の確率が決めた値（または決めた分布の族から出る値）である を、統計量 Σ(Oᵢ−Eᵢ)²/Eᵢ（Eᵢ は期待度数）で検定する仮説検定
    terms: [TERM-test, TERM-expected]
  short: 観測した度数が、決めた理論の割合に合っているかを、カイ二乗分布で調べる検定
  definition: k 個の区分に入った観測度数が、決めた割合（または分布）に合っているかを、各区分の観測度数と期待度数（総数×割合）のずれを Σ(O−E)²÷E にまとめ、自由度 k−1（データから推定した母数があればさらにその数を引く）のカイ二乗分布の上側の点と比べて調べる検定。
  version: 1
  principle: 割合を決めれば、各区分の期待度数は 総数×割合 で決まる。区分の度数の合計は総数に決まっているので、自由に動けるのは k−1 個の区分で、自由度は k−1。割合を決める母数を区分の度数から推定すると（区分の度数から最尤法で）、期待度数がデータに近づくぶん χ² が小さめに出るので、推定した母数の数 m を引いて k−1−m にする。
  conditions:
    math:
    - text: 各観測がちょうど1つの区分に入る
      kind: 要件
      outside: 適合度検定として定まらない（1つの観測を2つの区分に数えると、度数の合計が総数と合わない）
    - text: 観測どうしが独立
      kind: 仮定
      claim: CLM-28b
      outside: Σ(O−E)²÷E が自由度 k−1−m のカイ二乗分布に近づくとは保証されない
    - text: 区分の境目はデータを見る前に決め、どの区分の確率も正
      kind: 仮定
      claim: CLM-28b
      outside: 近づくとは保証されない（境目をデータを見て作ると、ずれが大きく見える区分を選べる）
    - text: H₀（各区分の割合が決めた値）が正しく、割合を決める母数を推定するなら区分の度数から推定する
      kind: 仮定
      claim: CLM-28b
      outside: 自由度 k−1−m のカイ二乗分布に近づくとは保証されない（母数を区分する前の生のデータから推定すると、極限は k−1−m と k−1 の間になる。2級では k−1−m を使う。H₀ が誤りなら χ² は総数とともに大きくなる）
    - text: どの区分も期待度数が5以上
      kind: 目安
      outside: この目安ではカイ二乗分布での近似を勧められない。区分をまとめる
      target: Σ(O−E)²÷E のカイ二乗分布による近似
      source:
        source: NIST統計ハンドブック
        locator: 1.3.5.15 Chi-Square Goodness-of-Fit Test（期待度数を5以上にする目安）
    data:
    - 棄却しないことは「決めた割合どおり」を示さない。総数が小さいと、ずれがあっても棄却されにくい
  example: 来店客120人の曜日（月〜土）が均等かを調べる。期待度数は各20人。観測が 14・18・20・22・24・22 人なら、χ²＝(36＋4＋0＋4＋16＋4)÷20＝3.2、自由度5 の上側5%の点11.07 より小さく、均等の仮説を棄却しない。
  counterexample: 120人の曜日を見てから、多い土曜と少ない月曜だけを区分にして（ほかはまとめて）適合度検定をする。区分をデータを見てから作っているので、仮定を外していて、棄却する割合は有意水準より大きくなりうる。
  misconceptions:
  - misconception: 適合度検定の自由度は、いつも区分の数−1
    correction: 割合を決める母数を区分の度数から推定したら、その母数の数も引く（ポアソン分布の平均を推定すれば k−2）
  sources:
  - source: 公式2級範囲表
    locator: 検定（適合度検定）
  checks:
  - 120/6 == 20 and 14+18+20+22+24+22 == 120 and (36+4+0+4+16+4)/20 == 3.2 and 3.2 < 11.07
- id: TERM-crosstab
  name: クロス集計表
  en: cross tabulation
  category: 図表
  forms: [function]   # カテゴリの組 → 度数。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 値が分類（カテゴリ）である2つの変数 A・B（値がカテゴリであることは定義の要件。量的変数は階級に分ければ使える）について、A のカテゴリ a₁, …, a_r と B のカテゴリ b₁, …, b_c の組 (a_i, b_j) ごとに、その組の値をもつ個体の個数（度数）O_ij を数え、r 行 c 列に並べた表（行・列の合計と総数 n を添える。O_ij の総和は n）
  short: 2つの質的変数の組合せごとに度数を数えて並べた表
  definition: 2つの質的変数のカテゴリの組ごとに、その組をもつ個体の数（度数）を数え、行と列に並べた表。行・列の合計と総数を添える。
  version: 1
  principle: 1つずつの変数の度数分布表を、2つの変数の組へ広げたもの。行ごとに割合（行の合計で割る）にすると、行のカテゴリごとに列の分かれ方を比べられる。どの行でも割合がそろっていれば、2つの変数は関連がないように見え、ずれていれば関連がありそうに見える。
  conditions:
    math:
    - text: 2つの変数の値がカテゴリで、各個体はちょうど1つのセルに入る
      kind: 要件
      outside: クロス集計表にならない（量的変数は階級に分けてから使う。1人が2つのセルに入ると、合計が総数と合わない）
    data:
    - 度数だけでなく行ごと（または列ごと）の割合を並べる。どちらの合計で割るかで、答える問いが変わる
    - 3つ目の変数（店・曜日）で分けると、関連の向きが変わることがある（シンプソンのパラドックス）
  example: チラシA（100人）は60人が買い、B（100人）は40人が買った。行をチラシ、列を「買った・買わない」にした2×2の表で、行ごとの購入率は60%と40%。
  counterexample: 1人の客が「よく買う商品の種類」を3つまで選べるアンケートで、選んだ数をそのまま年代×種類の表にする。1人が最大3つのセルに入るので、セルの合計は回答者数にならず、1人1セルという要件を外している。
  misconceptions:
  - misconception: 度数の大きいセルが、関連の強いセル
    correction: 行や列の合計が大きいと度数も大きくなる。関連は、行ごとの割合のそろい方で見る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（クロス集計表）
  checks:
  - 60/100 == 0.6 and 40/100 == 0.4
- id: TERM-scatter
  name: 散布図
  en: scatter plot
  category: 図表
  forms: [function]   # 個体 i → 点 (xᵢ, yᵢ)。同じ点の重なりも数えるので集合にしない。記述の道具はデータを固定して見る（① の 3。#342）
  basis:
    text: 対になったデータ (x₁, y₁), …, (xₙ, yₙ)（同じ個体の2つの量的変数の値の組。x・y の値が数であることは定義の要件）を、横軸に x、縦軸に y をとった座標平面の n 個の点 (xᵢ, yᵢ) で表した図
  short: 2つの量的変数の値の組を、横軸と縦軸の座標の点で表した図
  definition: 同じ個体（同じ日・同じ店）で測った2つの量的変数の値の組を、横軸と縦軸の座標の点として打った図。点の並び方から、2つの変数の関係の向き・強さ・形（直線か曲線か）・外れた点・まとまりを読む。
  version: 1
  principle: 1つの点が1つの個体の2つの値の組なので、組を崩さずに全部を並べられる。ヒストグラムや箱ひげ図は1つの変数ずつ描くので、どの値とどの値が組かが消える。x と y の平均に線を引いて十字で4つに分けると、右上と左下に点が多く平均から遠いほど一緒に増える関係で、これを1つの数にしたものが共分散・相関係数。相関係数は直線のまわりのまとまりしか測らないので、数を出す前に散布図で関係の形を見る。
  conditions:
    math:
    - text: 2つの値が、同じ個体の組になっている
      kind: 要件
      outside: この定義の散布図としては扱えない（別々に測った値を並べ方で組にすると、組み方しだいで点の並びが変わる）
    - text: 横軸・縦軸のどちらの値も、値の差にどこでも同じ意味がある
      kind: 要件
      outside: この定義の散布図としては扱えない（店番や部門のような分類を軸に置くと、番号の付け方で点の並びが変わる）
    data:
    - 軸の目盛りの範囲を変えると、点の並びの傾きが急にも緩やかにも見える。関係の強さは、見た目の傾きではなく、直線のまわりのまとまりで読む
    - 性質の違う群（店の大きさ・季節）が混ざっていそうなら、群ごとに色や印を変えて打つ
    - 同じ値の点は重なって1つに見える。個数が分かるように、少しずらすか数を添える
  example: 5週間の広告回数と来店者数（百人）の組 (1,3)(2,5)(3,4)(4,6)(5,7) を打ち、平均の十字（3, 5）を引くと、右上に (4,6)(5,7)、左下に (1,3) が来て、(2,5)(3,4) は十字の線の上。左上・右下には点がなく、右上がりの関係が読める。
  counterexample: 3日の気温 20, 25, 30℃ と売上 40, 30, 35 万円を、同じ日どうしで組にして打つと (20,40)(25,30)(30,35) で、点は右上がりにも右下がりにも並ばない。ところが、気温と売上をそれぞれ小さい順に並べ替えてから組にすると (20,30)(25,35)(30,40) で、点は右上がりの1本の直線に乗る。同じ日の組という要件を外すと、点の並びはデータではなく並べ方を表す。
  misconceptions:
  - misconception: 横軸と縦軸を入れ替えると、2つの変数の関係も変わる
    correction: 入れ替えると図は対角線で折り返した形になるが、点の組は同じで、相関係数も変わらない。変わるのは、どちらからどちらを見込むか（回帰の直線は、どちらを横軸にするかで別の直線になる）
  sources:
  - source: 公式2級範囲表
    locator: データの記述（散布図・相関）
  checks:
  - sum((a-25)*(b-35) for a, b in zip([20,25,30],[40,30,35])) == -25 and sum((a-25)**2 for a in [20,25,30]) == 50 and sum((b-35)**2 for b in [40,30,35]) == 50 and Fraction(-25, 50) == Fraction(-1, 2)
  - sum((a-25)*(b-35) for a, b in zip([20,25,30],[30,35,40])) == 50
- id: TERM-partial-corr
  name: 偏相関係数
  en: partial correlation coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 3つの量的変数 x・y・z のデータについて、2つずつの相関係数 r_xy・r_xz・r_yz から求める r_xy・z＝(r_xy−r_xz r_yz)/√{(1−r_xz²)(1−r_yz²)}（r_xz²＜1 かつ r_yz²＜1 は定義の要件）
    terms: [TERM-corr]
  short: 第3の変数の影響を取り除いたあとの、2つの変数の相関係数
  definition: 3つの量的変数 x・y・z で、z と直線的に一緒に動く分を x と y の両方から取り除いたあとの、x と y の相関係数。2つずつの相関係数から r_xy・z＝(r_xy−r_xz r_yz)÷√((1−r_xz²)(1−r_yz²)) で求める。
  version: 1
  principle: x を z の直線で見込んだ残り（残差）と、y を z の直線で見込んだ残りの相関係数と同じ値になる。z が x とも y とも一緒に動くと、それだけで x と y の相関係数が0から離れる。z と直線的に一緒に動く分を、分子と分母の両方から除くので、残るのは z の直線で見込めない部分どうしのそろい方。z と x・y が無相関（r_xz＝r_yz＝0）なら、もとの相関係数と同じになる。その残りを「見かけでない関係」と読むかは、z が x と y の共通の原因か、間に入る量かの見立てで決まる。
  conditions:
    math:
    - text: z の相関係数 r_xz・r_yz が ±1 でない
      kind: 要件
      outside: 分母が0になり、偏相関係数は定まらない（z の直線で x か y が完全に決まり、取り除いた残りがない）
    - text: x と y の平均が、z の値で直線的に変わる
      kind: 仮定
      claim: 偏相関係数は、z の直線で見込めない部分どうしの直線的な関係の強さを表す
      outside: z の分を取り除いたとは保証されない（z と曲がった形で一緒に動く分が残る）
    data:
    - 先に、x と z、y と z の散布図で、z と直線的に一緒に動いているかを見る
    - 偏相関係数が0に近くても、x と y の間に関係がないとは限らない（直線でない関係・群の混ざりは残る）。散布図で残差どうしの並びを見る
  example: 夏の日のアイスの販売数 x と飲み物の販売数 y の相関係数が 0.8、気温 z との相関係数がどちらも 0.9 なら、偏相関係数は (0.8−0.9×0.9)÷(1−0.81)＝−0.01÷0.19≒−0.05。アイスと飲み物の相関 0.8 は、ほとんどが気温と直線的に一緒に動く分で説明できる。気温が両方の売上を動かすと見立てれば、気温を通した関係と読む。
  counterexample: x をアイスの売上金額（円）にし、z に同じ売上金額を千円で書き直した値（z＝x÷1000）を使うと、r_xz＝1 で分母が0になり、偏相関係数は定まらない。z の直線で x が完全に決まるので、x から z の分を取り除くと何も残らない。
  misconceptions:
  - misconception: 偏相関係数を出せば、共通の原因の影響はすべて取り除ける
    correction: 取り除けるのは、式に入れた z の直線で見込める分だけ。測っていない変数や、曲がった影響は残る
  sources:
  - source: 公式2級範囲表
    locator: データの記述（相関係数）
  checks:
  - abs((0.8 - 0.9*0.9)/((1-0.81)*(1-0.81))**0.5 - (-0.0526)) < 0.0005
- id: TERM-spurious
  name: 擬相関
  en: spurious correlation
  category: 相関・回帰
  forms: [property]
  basis:
    text: 2つの変数の間に直接の因果の関係がないのに、両方に関係する第3の変数などのために、2つの変数の相関係数が0から離れて見えること
    terms: [TERM-corr]
  short: 2つの変数に直接の関係がないのに、共通の第3の変数などのために見かけ上あらわれる相関
  definition: 2つの変数の間に直接の因果の関係がないのに、両方に関係する第3の変数（共通の原因）や、性質の違う群の混ざりのために、相関係数が0から離れて見えること。
  version: 1
  principle: 気温が上がる日には、アイスの売上も水の事故も増える。気温を通して両方が一緒に動くので、アイスと事故の間に相関が出る。見かけの相関かどうかは相関係数の値からは分からず、データがどう生まれたか（何が何に効くか）の見立てと、第3の変数をそろえた比べ方（層別・偏相関係数）で確かめる。群の中では関係がないのに、群の中心がずれて並ぶだけでも、合わせた相関係数は0から大きく離れうる。
  conditions:
    math:
    - text: 2つの変数の間に直接の因果がない（何が何に効くかは、データの外の見立てで決める）
      kind: 要件
      outside: この定義の擬相関としては扱えない（直接の因果があれば、相関はその関係を映している）
    data:
    - 第3の変数（気温・店の大きさ・季節）で層に分け、層の中でも相関が残るかを見る
    - 直接の因果がないかは、相関係数の値からは決まらない。何が何に効くかの見立てを、データの外（仕組み・現場の知識）で書いておく
  example: 気温の低い4日（アイス 10, 12, 12, 14 個、事故 2, 1, 3, 2 件）と高い4日（アイス 20, 22, 22, 24 個、事故 5, 4, 6, 5 件）では、どちらの群の中でも相関係数は0 なのに、8日を合わせると約0.87 になる。合わせた相関は気温の群の違いで説明でき、アイスは事故に直接効かないという見立てと合わせて、擬相関と読む。
  counterexample: 気温とアイスの売上も、相関係数が高いのは同じ。ただし気温が売上に直接効くと見立てられるので、擬相関とは呼ばない。相関係数の値は同じでも、擬相関かどうかは、データの外の見立てで決まる。
  misconceptions:
  - misconception: 相関係数が 0.9 のように大きければ、擬相関ではない
    correction: 共通の原因が両方に強く効くほど、見かけの相関も大きくなる。値の大きさでは見分けられない。層別や偏相関係数で第3の変数の分を見たうえで、何が何に効くかの見立てと合わせて判断する
  - misconception: x と y に相関があれば、x が y の原因
    correction: 共通の原因（交絡）のほか、y が x の原因（逆の因果）や偶然でも相関は出る。どれかはデータの取り方と見立てで確かめる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（相関係数）
  checks:
  - sum((a-12)*(b-2) for a, b in zip([10,12,12,14],[2,1,3,2])) == 0 and sum((a-22)*(b-5) for a, b in zip([20,22,22,24],[5,4,6,5])) == 0
  - abs(sum((a-17)*(b-3.5) for a, b in zip([10,12,12,14,20,22,22,24],[2,1,3,2,5,4,6,5]))/(sum((a-17)**2 for a in [10,12,12,14,20,22,22,24])*sum((b-3.5)**2 for b in [2,1,3,2,5,4,6,5]))**0.5 - 0.87) < 0.005
- id: TERM-ols
  name: 最小二乗法
  en: least squares method
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式の係数を、データの残差の2乗の和 Σeᵢ² が最小になるように決める方法（最小にする係数が1つに決まることは、切片の列（すべて1）と説明変数の値の列が1次独立であること（単回帰では x が全部同じでないこと）で保たれる）
    terms: [TERM-resid]
  short: 残差の2乗の和が最小になるように、回帰式の係数を決める方法
  definition: 回帰式の係数を、残差（観測値−予測値）の2乗の和がいちばん小さくなるように決める方法。単回帰では、傾き b＝Σ(x−x̄)(y−ȳ)÷Σ(x−x̄)²、切片 a＝ȳ−b x̄ になる。
  version: 1
  principle: 残差は正にも負にもなるので、そのまま足すと打ち消し合う。2乗して足すと、どの点のずれも正で効き、大きなずれほど強く効く。説明変数の値が全部同じでなければ、2乗の和は係数の2次式で谷の底がちょうど1組に決まり、その係数で、直線は平均の点 (x̄, ȳ) を通る。
  conditions:
    math:
    - text: 説明変数の値が全部同じではない（重回帰では、切片の列と説明変数の値の列が1次独立）
      kind: 要件
      outside: 2乗の和を最小にする係数が1組に決まらない（平均の点を通るどの傾きの直線でも、2乗の和が同じになる）
    data:
    - 2乗するので、外れた1点に直線が強く引っ張られる。その点を除いて引き直し、係数がどれだけ動くかを確かめる
  example: 5週間の広告回数 x と来店者数 y（百人）(1,3)(2,5)(3,4)(4,6)(5,7)では、偏差の積の和9、x の偏差平方和10 で、b＝9÷10＝0.9、a＝5−0.9×3＝2.3、ŷ＝2.3＋0.9x。残差の2乗の和は1.9。ほかの直線、たとえば ŷ＝2＋x では残差 0, 1, −1, 0, 0 で2乗の和は2 と、1.9 より大きい。
  counterexample: 3日の値 (3,2)(3,4)(3,6) のように x が全部同じだと、平均の点 (3, 4) を通る直線は、傾きがいくつでも各点の縦のずれが同じ（−2, 0, 2）で、2乗の和はどれも8。最小にする直線が1本に決まらない。
  misconceptions:
  - misconception: 最小二乗法の直線は、点から直線までの距離（直線に垂直な距離）の和を最小にする
    correction: 小さくするのは、縦（y の向き）のずれの2乗の和。y を x から見込むための直線なので、x の向きのずれは数えない
  - misconception: x で y を予測する直線と、y で x を予測する直線は同じ
    correction: 最小二乗法は y の方向（縦）の残差の2乗の和を小さくするので、x と y を入れ替えると別の直線になる。2本が重なるのは相関係数が ±1 のときだけ
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（最小二乗法）
  checks:
  - sum((x-3)*(y-5) for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) == 9 and sum((x-3)**2 for x in [1,2,3,4,5]) == 10 and 5 - Fraction(9,10)*3 == Fraction(23, 10) and abs(sum((y-(2.3+0.9*x))**2 for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) - 1.9) < 1e-9 and sum((y-(2+x))**2 for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) == 2
  - all(sum((y-(4+c*(x-3)))**2 for x, y in [(3,2),(3,4),(3,6)]) == 8 for c in [-1, 0, 1, 2])
  formulas:
  - id: F-ols-intercept
    label: 単回帰の切片
    symbols:
    - symbol: a
      meaning: 単回帰の切片（x＝0 のときの見込みの値。直線を (x̄, ȳ) に通す位置合わせ）
      key: a
      kind: value
    - symbol: ȳ
      meaning: 目的変数 y の平均
      key: ybar
      kind: value
      concept: TERM-mean
    - symbol: b
      meaning: 単回帰の傾き
      key: b
      kind: value
      concept: TERM-regcoef
    - symbol: x̄
      meaning: 説明変数 x の平均
      key: xbar
      kind: value
      concept: TERM-mean
    tree: {"op": "eq", "args": [{"sym": "a"}, {"op": "sub", "args": [{"sym": "ybar"}, {"op": "mul", "args": [{"sym": "b"}, {"sym": "xbar"}]}]}]}
- id: TERM-regcoef
  name: 回帰係数
  en: regression coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 目的変数 y を説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を最小二乗法で求めたときの、説明変数 x_j に掛かる係数 b_j（切片の列（すべて1）と説明変数の値の列が1次独立であることは定義の要件。そうでないと係数が1つに決まらない。単回帰では x が全部同じでないこと）
    terms: [TERM-ols]
  short: 説明変数の値が1大きい個体どうしで、目的変数がどれだけ違うと見込むかを表す回帰式の係数（重回帰では、ほかの説明変数も含めた式での係数）
  definition: 回帰式で、説明変数に掛かる係数。単回帰の傾き b は、x が1大きいところでは y が平均して b 大きいと見込むことを表す。単位は y の単位÷x の単位。
  version: 1
  principle: 単回帰の傾きは b＝Σ(x−x̄)(y−ȳ)÷Σ(x−x̄)² で、y の値が全部同じでなければ、相関係数 r に標準偏差の比 s_y÷s_x を掛けたものに等しい。r と s_x が同じなら、y が大きく散らばるデータほど |b| は大きい。傾きはデータの中での x と y の見込みの関係で、x を動かしたら y が動くかは、データの取り方（実験か観察か）と見立てで決まる。重回帰の係数は、その説明変数から、ほかの説明変数と直線的に一緒に動く分を除いたあとの傾きで、同じ x の単回帰の傾きとは違う値になりうる（「ほかの変数を固定したときの効き目」と読むのは、式の形が正しいという見立てを置いたとき）。
  conditions:
    math:
    - text: 最小二乗法で係数が1組に決まっている（最小二乗法の要件）
      kind: 要件
      outside: 係数が1つに決まらない
    data:
    - 単位を変えると傾きも変わる（x を回から十回にすると10倍）。2つの傾きを比べるときは単位をそろえる
    - 傾きが言うのは、観測した x の範囲の中の見込み。範囲の外に延ばすのは外挿で、データからは保証されない
  example: 店P の5週 (1,1)(2,5)(3,3)(4,7)(5,9) では、偏差の積の和18、x の偏差平方和10 で、b＝1.8（百人／回）。相関係数は0.9、標準偏差の比は √40÷√10＝2 で、0.9×2＝1.8 と同じ。例題Aの5週（r も0.9）の傾き0.9 の2倍。
  counterexample: 5日の広告回数がどの日も3回で、来店者数が 2, 4, 6, 4, 4（百人）なら、x の偏差平方和が0 で b の式の分母が0 になり、傾きは決まらない。広告回数を変えていないデータからは、広告回数の係数は出せない。
  misconceptions:
  - misconception: 回帰係数が1.8 なら、広告を1回増やすと来店者数が180人増える
    correction: 係数が言うのは、データの中で「広告が1回多い週は、来店者数が平均して180人多い」という見込みまで。広告を増やしたら来店が増えるかは、季節などほかの要因が一緒に動いていないか（データの取り方）で決まる
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（回帰係数）
  checks:
  - sum((x-3)*(y-5) for x, y in [(1,1),(2,5),(3,3),(4,7),(5,9)]) == 18 and Fraction(18, 10) == Fraction(9, 5) and sum((y-5)**2 for y in [1,5,3,7,9]) == 40 and abs(0.9*(40/10)**0.5 - 1.8) < 1e-9
  - sum((x-3)**2 for x in [3,3,3,3,3]) == 0
  formulas:
  - id: F-ols-slope
    label: 単回帰の傾き
    symbols:
    - symbol: b
      meaning: 単回帰の傾き（説明変数 x の回帰係数）
      key: b
      kind: value
    - symbol: S_xy
      meaning: x と y の偏差の積の和 Σ(xᵢ−x̄)(yᵢ−ȳ)
      key: Sxy
      kind: value
    - symbol: S_xx
      meaning: x の偏差の2乗の和 Σ(xᵢ−x̄)²
      range: 0より大きい（x が全部同じではない）
      key: Sxx
      kind: value
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"sym": "b"}, {"op": "div", "args": [{"sym": "Sxy"}, {"sym": "Sxx"}]}]}
- id: TERM-resid
  name: 残差
  en: residual
  category: 相関・回帰
  forms: [number]
  basis:
    text: データに当てはめた回帰式について、i 番目の観測値 yᵢ から、その説明変数の値での回帰式の予測値 ŷᵢ を引いた値 eᵢ＝yᵢ−ŷᵢ
  short: 観測した値から、回帰式で予測した値を引いた値
  definition: 観測した値から、回帰式の予測値を引いた値 e＝y−ŷ。散布図では、点と回帰直線の縦のずれ。
  version: 1
  principle: 直線で見込めた分を取り除いた残りなので、残差に並び（曲がり・時間の順の波）が残っていれば、直線では表しきれない形がある。残差の2乗の和が、決定係数や残差の標準偏差のもとになる。
  conditions:
    math:
    - text: 切片を含む回帰式を、最小二乗法で当てはめた
      kind: 仮定
      claim: 残差の合計が0 になり、残差と x の積の和も0 になる
      outside: 残差の合計が0 になるとは保証されない（原点を通る直線を当てはめたときなど）
    data:
    - 残差を x（または予測値・時間の順）に対して打ち、曲がりや波が残っていないかを見る
    - 残差の大きい点は、記録の誤りか、ほかの要因が効いた点かを確かめる
  example: 5週間の広告回数 x と来店者数 y（百人）(1,3)(2,5)(3,4)(4,6)(5,7)に ŷ＝2.3＋0.9x を当てはめると、予測値は 3.2, 4.1, 5.0, 5.9, 6.8、残差は −0.2, 0.9, −1.0, 0.1, 0.2 で、合計は0。
  counterexample: 同じ5週に、原点を通る直線 ŷ＝bx を最小二乗で当てはめると、b＝84÷55≒1.53 で、残差は約 1.47, 1.95, −0.58, −0.11, −0.64、合計は約2.09 で0 にならない。切片を含めない当てはめでは、残差の合計が0 になるとは限らない。
  misconceptions:
  - misconception: 残差は測り間違い（測定の誤差）の大きさ
    correction: 残差は直線で表しきれなかった分の全部で、測り間違いのほか、x 以外の要因の効き目や、直線でない形も含む
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（残差）
  checks:
  - '[round(y-(2.3+0.9*x), 10) for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]] == [-0.2, 0.9, -1.0, 0.1, 0.2] and abs(sum(y-(2.3+0.9*x) for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)])) < 1e-9'
  - Fraction(1*3+2*5+3*4+4*6+5*7, 1+4+9+16+25) == Fraction(84, 55) and abs(sum(y-84/55*x for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) - 2.09) < 0.005
- id: TERM-r2
  name: 決定係数
  en: coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: 回帰式を当てはめたデータで、残差の2乗の和を目的変数の偏差の2乗の和で割り、1から引いた値 R²＝1−Σeᵢ²/Σ(yᵢ−ȳ)²（Σ(yᵢ−ȳ)²＞0 は定義の要件）
    terms: [TERM-resid, TERM-dev]
  short: 目的変数のばらつきのうち、回帰式で説明できる割合（切片を含む最小二乗では0〜1）
  definition: 回帰式を当てはめたデータで、1から「残差の2乗の和÷目的変数の偏差の2乗の和」を引いた値 R²＝1−SSE÷SST。切片を含む式を最小二乗法で当てはめたときは、y のばらつきのうち回帰式で説明できた分の割合と読める。
  version: 1
  principle: 切片を含む式を最小二乗法で当てはめると、偏差の2乗の和 SST が、予測値の偏差の2乗の和 SSR＝Σ(ŷ−ȳ)² と残差の2乗の和 SSE にちょうど分かれる。だから R²＝SSR÷SST で、0〜1 に収まる。単回帰では相関係数の2乗に等しい。説明変数を足すと SSE は増えないので、R² は下がらない。
  conditions:
    math:
    - text: 目的変数の値が全部同じではない（SST＞0）
      kind: 要件
      outside: 割る数が0 になり、決定係数は定まらない
    - text: 切片を含む回帰式を、最小二乗法で当てはめた
      kind: 仮定
      claim: SSR＝Σ(ŷᵢ−ȳ)² とすると SST＝SSR＋SSE が成り立ち、0≦R²≦1
      outside: SST＝SSR＋SSE とは保証されず、0〜1 に収まるとも保証されない
    data:
    - R² の大小は、x をどれだけ広い範囲で観測したかでも変わる。予測の外れの大きさは、R² ではなく残差の標準偏差（y の単位）で見る
  example: 5週間の広告回数 x と来店者数 y（百人）(1,3)(2,5)(3,4)(4,6)(5,7)に ŷ＝2.3＋0.9x を当てはめると、SSE＝1.9、SST＝10 で、R²＝1−1.9÷10＝0.81。相関係数0.9 の2乗と同じ。
  counterexample: 同じ5週に、原点を通る直線を最小二乗で当てはめると（b＝84÷55）、SSE≒6.71、SSR≒24.2 で、SSR＋SSE≒30.9 は SST＝10 と合わない。5日の値 7, 6, 5, 4, 3 に原点を通る直線を当てはめると、R²≒−4.82 と負になる。仮定を外すと、分解も0〜1 も保証されない。
  misconceptions:
  - misconception: R²＝0.81 は、予測が81% の確率で当たるという意味
    correction: R² は、y のばらつき（偏差の2乗の和）のうち、直線で説明できた分の割合。1つずつの予測がどれだけ当たるかは、残差の大きさ（残差の標準偏差）で見る
  - misconception: R² が高ければ、新しいデータでもよく当たる
    correction: R² は当てはめたデータの上での説明の割合。同じデータに説明変数を足して最小二乗で当て直すと、役に立たない変数でも下がらないので、高さだけで予測の良さは決められない。新しいデータでの当たり方は、別のデータで確かめる
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（決定係数）
  checks:
  - abs(1 - 1.9/10 - 0.81) < 1e-9 and abs(0.9**2 - 0.81) < 1e-9
  - abs(sum((y-84/55*x)**2 for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]) - 6.71) < 0.005 and abs(sum((84/55*x-5)**2 for x in [1,2,3,4,5]) - 24.2) < 0.005 and abs(1 - sum((y-65/55*x)**2 for x, y in zip([1,2,3,4,5],[7,6,5,4,3]))/10 + 4.82) < 0.005
  formulas:
  - id: F-r2-def
    label: 決定係数
    symbols:
    - symbol: R²
      meaning: 決定係数
      range: 1以下（切片を含む最小二乗では0以上1以下）
      key: R2
      kind: value
      concept: TERM-r2
      domain: {max: 1}
    - symbol: SSE
      meaning: 残差の2乗の和 Σeᵢ²
      range: 0以上
      key: SSE
      kind: value
      concept: TERM-resid
      domain: {min: 0}
    - symbol: SST
      meaning: 目的変数の偏差の2乗の和 Σ(yᵢ−ȳ)²
      range: 0より大きい（y が全部同じではない）
      key: SST
      kind: value
      concept: TERM-dev
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"sym": "R2"}, {"op": "sub", "args": [{"num": 1}, {"op": "div", "args": [{"sym": "SSE"}, {"sym": "SST"}]}]}]}
- id: TERM-extrap
  name: 外挿
  en: extrapolation
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式を、当てはめに使ったデータの説明変数の値の範囲の外の値に当てはめて、目的変数を予測すること
  short: 回帰式を、データのある範囲の外の説明変数の値に当てはめて予測すること
  definition: 回帰式を、当てはめに使ったデータの説明変数の範囲の外の値に当てはめて、目的変数を予測すること。
  version: 1
  principle: データが見せるのは、観測した x の範囲の中の関係だけ。範囲の外でも同じ直線が続くかは、データからは確かめられない。範囲から遠くに出るほど、傾きのわずかな違いが予測の大きな違いになり、関係の形が変わっていれば外れ方も大きい。
  conditions:
    math:
    - text: 予測する x が、当てはめに使った説明変数の値の範囲の外にある
      kind: 要件
      outside: 外挿ではなく、範囲の中の予測（内挿）
    data:
    - 範囲の外でも同じ直線が続くかは、データからは保証されない。別のデータや、仕組みの知識（飽和・上限）で確かめる
    - 予測を伝えるときは、当てはめに使った x の範囲を書き添える
  example: 5週間の広告回数 x と来店者数 y（百人）(1,3)(2,5)(3,4)(4,6)(5,7)の回帰直線 ŷ＝2.3＋0.9x で、広告20回の来店者数を見込むと 2.3＋18＝20.3（約2030人）。観測した広告回数は1〜5回なので、これは外挿。
  counterexample: 売場の照明の数 x が1〜5 のとき、来店者数 y（百人）が 3, 5, 7, 9, 11 なら、回帰直線は ŷ＝1＋2x で、残差は全部0。範囲の中では直線にぴったり乗る。ところが本当の関係が「12 で頭打ち」なら、x＝9 では 19 と見込むのに、本当の値は 12。範囲の中でどれだけ合っていても、範囲の外の形はデータに入っていない。
  misconceptions:
  - misconception: 決定係数が高ければ、範囲の外の予測も当たる
    correction: 決定係数が言うのは、観測した範囲の中で直線がどれだけ合うかまで。範囲の外で同じ直線が続くかは言わない
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（予測）
  checks:
  - abs(2.3 + 0.9*20 - 20.3) < 1e-9
  - '[min(2*x+1, 12) for x in [1,2,3,4,5]] == [3,5,7,9,11] and 1+2*9 == 19 and min(2*9+1, 12) == 12'
- id: TERM-mreg
  name: 重回帰分析
  en: multiple regression analysis
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 目的変数 y を k 個（k≧1）の説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を、最小二乗法で求める分析（名前の「重」は k≧2 の場合を指して使う）
    terms: [TERM-ols]
  short: 1つ以上（ふつうは2つ以上）の説明変数の1次式で目的変数を見込む回帰式を、最小二乗法で求める分析
  definition: 目的変数 y を、1つ以上（ふつうは2つ以上）の説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で見込む回帰式を、最小二乗法で求める分析。説明変数が1つなら単回帰。
  version: 1
  principle: 説明変数を足すたびに、y のばらつきのうち式で見込める分が増え（残差の2乗の和は増えない）、係数の意味も「どの変数と一緒に動く分を除いたか」が変わる（係数の読み方は回帰係数）。何を式に入れるかで、同じ x_j の係数が別の数になるので、式に入れた変数の組と一緒に係数を読む。
  conditions:
    math:
    - text: データの中で、説明変数の値の組ごとの y の平均が、説明変数の1次式に乗る（説明変数どうしの掛け算や曲がりがない）
      kind: 仮定
      claim: b_j は、ほかの説明変数が同じ値の個体どうしで比べた、x_j が1大きいときの y の平均の差に等しい
      outside: b_j を、ほかの説明変数が同じ値どうしで比べた差とは読めない（差が x の値で変わると、b_j はそれらをならした値になる）
    data:
    - 観察データの係数は、式に入れていない要因と一緒に動く分も含みうる。式に何を入れたかを書き添える
  example: 8店の売価 x₁・客数 x₂・販売数 y で重回帰すると ŷ＝40−x₁＋3x₂。売価の係数は −1 で、売価だけの単回帰の傾き＋1.38 と符号が逆になる。売価の高い店ほど客数も多い（相関0.90）ので、単回帰の傾きには客数と一緒に動く分が入っている。
  counterexample: 平日5日（客数1〜5）は ŷ＝4＋x、週末5日（客数3〜7）は ŷ＝1＋3x にぴったり並ぶ10日（週末ダミー D）に、交互作用を入れない式を当てはめると ŷ＝1＋2x＋5D。客数の係数2 は、平日の1 とも週末の3 とも違い、どちらの曜日の「客数が1多い日との差」でもない。1次で足し算という仮定を外すと、係数は差をならした値になる。
  misconceptions:
  - misconception: 重回帰の係数と単回帰の傾きが違ったら、どちらかが計算の誤り
    correction: そろえている条件が違う。単回帰の傾きは、ほかの変数と一緒に動く分も含んだ傾き、重回帰の係数は、式に入れたほかの変数と一緒に動く分を除いた傾き
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（重回帰）
  checks:
  - 40 - 10 + 3*4 == 42 and 44 - 42 == 2
  - abs(sum((a-10.625)*(c-45.125) for a, c in [(8,39),(9,43),(10,44),(10,49),(11,45),(12,45),(12,49),(13,47)])/sum((a-10.625)**2 for a in [8,9,10,10,11,12,12,13]) - 1.38) < 0.005
  - sum((y-(1+2*x+5*d))*v for (x, d, y) in [(1,0,5),(2,0,6),(3,0,7),(4,0,8),(5,0,9),(3,1,10),(4,1,13),(5,1,16),(6,1,19),(7,1,22)] for v in [1, x, d]) == 0
- id: TERM-dummy
  name: ダミー変数
  en: dummy variable
  category: 相関・回帰
  forms: [function]
  basis:
    text: 質的変数の1つのカテゴリについて、そのカテゴリに当てはまる個体で1、当てはまらない個体で0をとる変数
    terms: [TERM-qual]
  short: 質的変数を回帰分析で使うため、当てはまれば1・当てはまらなければ0とした変数
  definition: 質的変数の1つのカテゴリについて、そのカテゴリに当てはまる個体で1、当てはまらない個体で0 をとる変数。回帰式に入れると、基準のカテゴリとの違いを係数で表せる。
  version: 1
  principle: 週末なら D＝1、平日なら0 として ŷ＝b₀＋b₁x＋b₂D に入れると、平日は ŷ＝b₀＋b₁x、週末は ŷ＝(b₀＋b₂)＋b₁x の、傾きが同じで高さだけ違う2本の直線になる。b₂ は、同じ x での週末と平日の見込みの差。カテゴリが m 個あれば、基準の1つを除いた m−1 個を入れる（m 個全部を切片のある式に入れると、ダミーの和がいつも1 で切片の列と同じになり、最小二乗法の要件の1次独立が崩れる）。
  conditions:
    math:
    - text: 個体ごとに、そのカテゴリに当てはまるか当てはまらないかが1つに決まる
      kind: 要件
      outside: 0 か1 かが決まらず、この定義のダミー変数としては扱えない（「繁忙日」のように境目のあいまいな区分）
    data:
    - 係数は「基準のカテゴリとの差」なので、どれを基準にしたかを書き添える
    - カテゴリによって傾きも違いそうなら、ダミーと x の積（交互作用）を足す
  example: 平日5日・週末5日の客数 x と販売数 y に ŷ＝10＋2x＋6D を当てはめる。週末の販売数の平均は平日より10 多いが、週末は客数も2 多く、その分（2×2＝4）を除いた同じ客数での週末の差が D の係数6。
  counterexample: 平日・土曜・日曜を、1つの変数に 0・1・2 と番号を付けて回帰式に入れると、「平日→土曜」と「土曜→日曜」の差がいつも同じ係数になってしまう。カテゴリごとに当てはまれば1・当てはまらなければ0 の変数（土曜ダミー・日曜ダミー）にしないと、カテゴリの違いを1つずつ表せない。
  misconceptions:
  - misconception: ダミー変数の係数は、週末と平日の平均の差
    correction: ほかの説明変数（客数）を式に入れていれば、係数は同じ客数での差。週末に客数も多いなら、平均の差10 とダミーの係数6 は違う
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（ダミー変数）
  checks:
  - 2*2 == 4 and 10 - 4 == 6
- id: TERM-adjr2
  name: 自由度調整済み決定係数
  en: adjusted coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: k 個の説明変数の回帰式を n 個のデータに当てはめたとき（n−k−1≧1 は定義の要件）、決定係数 R² を全体の自由度 n−1 と残差の自由度 n−k−1 で補正した 1−(1−R²)(n−1)/(n−k−1)
    terms: [TERM-r2, TERM-df]
  short: 説明変数を足せば必ず上がる、ということがないように、自由度で補正した決定係数
  definition: 決定係数 R² を、全体の自由度 n−1 と残差の自由度 n−k−1 で補正した値 1−(1−R²)×(n−1)÷(n−k−1)。説明変数の数が違う式どうしの当てはまりを比べるときに使う。
  version: 1
  principle: 1−R²＝SSE÷SST を、それぞれの自由度で割った比 (SSE÷(n−k−1))÷(SST÷(n−1)) に置き換えたもの。説明変数を1つ足すと SSE は減るが、残差の自由度も1つ減る。減った SSE の割合が、自由度の減り方より小さければ、補正した値は下がる。だから、役に立たない変数を足すと下がりうる。R² 以下で、負になることもある。
  conditions:
    math:
    - text: 残差の自由度 n−k−1 が1以上（データの数が、説明変数の数＋1 より多い）
      kind: 要件
      outside: 割る数が0 以下になり、定まらない
    data:
    - 値の大小は、当てはまりと変数の数の釣り合いを見るだけ。変数を選ぶときは、仕組みの知識（その変数が効くと考えられるか）も合わせる
  example: 8店の売価と客数の重回帰（n＝8、k＝2）で SSE＝12、SST＝76.875 なら、1−(12÷5)÷(76.875÷7)≒0.781（R² は約0.844）。
  counterexample: 3店のデータで説明変数を2つ使う（n＝3、k＝2）と、残差の自由度は 3−2−1＝0 で、式の割る数が0 になる。式は3点をちょうど通り（R²＝1）、補正した値は定まらない。
  misconceptions:
  - misconception: 自由度調整済み決定係数がいちばん大きい式が、正しい式
    correction: 変数の数のわりに当てはまりがよい式を選ぶ目安にすぎない。因果の向きや、入れていない要因は分からない
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（決定係数）
  checks:
  - abs(1 - (12/5)/(76.875/7) - 0.781) < 0.0005 and abs(1 - 12/76.875 - 0.844) < 0.0005 and 3 - 2 - 1 == 0
- id: TERM-ms
  name: 平均平方
  en: mean square
  category: 検定
  forms: [rv]
  basis:
    text: 平方和をその自由度で割った値（群間・群内・回帰・残差などの平方和ごとに作る）
    terms: [TERM-df]
  short: 平方和をその自由度で割った値で、分散分析や回帰でばらつきの大きさを比べるのに使う
  definition: 平方和を、その自由度で割った値。回帰なら回帰の平均平方 SSR÷k と残差の平均平方 SSE÷(n−k−1)、分散分析なら群間と群内の平均平方を作り、その比 F で比べる。
  version: 1
  principle: 平方和は、項の数が多いほど大きくなる。自由度で割ると、1自由度あたりのばらつきになり、別の平方和どうしを比べられる。残差の平均平方の平方根が、残差の標準偏差。
  conditions:
    math:
    - text: 割る自由度が1以上
      kind: 要件
      outside: 割る数が0 になり、平均平方は定まらない
    - text: 回帰式の形が正しく、誤差が互いに独立で、分散 σ² がそろっている
      kind: 仮定
      claim: 残差の平均平方の期待値は σ² に等しい（E(SSE÷(n−k−1))＝σ²）
      outside: 残差の平均平方が誤差の分散の推定になるとは保証されない
    data:
    - 比べるときは、どの平方和をどの自由度で割ったかを表にそろえて書く（回帰の分散分析表）
  example: 20店（n＝20）で説明変数2つ（k＝2）の回帰で、SST＝300 が SSR＝180 と SSE＝120 に分かれたとき、回帰の平均平方は 180÷2＝90、残差の平均平方は 120÷17≒7.06、F＝90÷7.06≒12.75。
  counterexample: 2店のデータで単回帰をすると、直線は2点をちょうど通り、残差の自由度は 2−1−1＝0。SSE＝0 を0 で割ることになり、残差の平均平方は定まらない。2点からは、直線のまわりのばらつきは推し量れない。
  misconceptions:
  - misconception: 平方和の大きい方が、ばらつきが大きい
    correction: 平方和は項の数（自由度）が多いほど大きくなる。ばらつきの大きさを比べるのは、自由度で割った平均平方
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析・分散分析（平均平方）
  checks:
  - 180/2 == 90 and abs(120/17 - 7.06) < 0.005 and abs(90/(120/17) - 12.75) < 0.005 and 2 - 1 - 1 == 0
- id: TERM-multicol
  name: 多重共線性
  en: multicollinearity
  category: 相関・回帰
  forms: [property]
  basis:
    text: 重回帰分析で、説明変数どうしの間に強い1次の関係がある（ある説明変数が、ほかの説明変数の1次式でほぼ表せる）こと
    terms: [TERM-mreg]
  short: 重回帰分析で、ある説明変数がほかの説明変数の1次式でほぼ表せ、回帰係数の推定が不安定になること
  definition: 重回帰分析で、説明変数どうしの間に強い1次の関係がある（ある説明変数が、ほかの説明変数の1次式でほぼ表せる）こと。係数の1つずつの推定が不安定になる。
  version: 1
  principle: 2つの説明変数がほぼ一緒に動くと、y の動きをどちらの係数に割り振るかがデータから決めにくい。標本を取り直すたびに、b₁ が大きく b₂ が小さい組や、その逆の組が出て、係数の標準誤差が大きくなり、符号が逆になることもある。x の散らばりと誤差の分散が同じなら、2つの説明変数の相関が r のとき、標準誤差は相関0 のときのおよそ 1÷√(1−r²) 倍（r＝0.9 で約2.3倍。その2乗が VIF）。2つの相関が正なら、合わせた効き目 b₁＋b₂ はばらつきが小さい（負なら b₁−b₂ の方）。
  conditions:
    math:
    - text: 説明変数が2つ以上ある
      kind: 要件
      outside: この定義の多重共線性としては扱えない（単回帰には、説明変数どうしの関係がない）
    data:
    - 説明変数どうしの相関（3つ以上なら VIF）を先に見る
    - 強いときは、一緒に動く変数のどちらかを外すか、合わせた1つの変数にする。外した変数の分は、残した変数の係数に入る
  example: x₁ と x₂ の相関が0.9 のとき、相関が0 のときと比べて、係数の標準誤差はおよそ 1÷√(1−0.81)≒2.29 倍（VIF≒5.26）。同じ仕組みから標本を取り直すと、b₁ と b₂ は大きくばらつき、符号が逆になる回もあるが、b₁＋b₂ のばらつきは小さい。
  counterexample: 説明変数が客数1つだけの単回帰では、説明変数どうしの関係がそもそもないので、多重共線性は起きない。客数の係数の標準誤差が大きくても、それは y のばらつきやデータの少なさから来ていて、多重共線性ではない。
  misconceptions:
  - misconception: 説明変数を2つずつ見た相関がどれも小さければ、多重共線性は起きない
    correction: 3つ以上のときは、2つずつの相関が弱くても、ある変数がほかの2つ以上の1次式でほぼ表せることがある（x₃≒x₁＋x₂）。VIF で見る
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（多重共線性）
  checks:
  - abs(1/(1-0.81)**0.5 - 2.29) < 0.005 and abs(1/(1-0.81) - 5.26) < 0.005
- id: TERM-strat-sampling
  name: 層化抽出
  en: stratified sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠（母集団）を重ならない層に分け、すべての層のそれぞれから、層ごとに先に決めた大きさの標本を無作為抽出で選ぶ手続き（母集団の平均は、層の推定値を母集団で層が占める割合 N_h/N で重み付けて足して推定する。合計なら層の大きさ N_h で重み付ける）
    terms: [TERM-random-sampling]
  short: 母集団をいくつかの層に分け、各層から無作為に標本を選ぶ方法
  definition: 抽出枠（母集団）を、重ならない層（店の規模・地域など）に分け、すべての層のそれぞれから、層ごとに決めた数の標本を無作為に選ぶ方法。全体の値は、層ごとの推定値を、母集団で層が占める割合で重み付けて足して推定する。
  version: 1
  principle: どの層からも必ず選ぶので、層の間の違い（大規模店と小規模店の差）は推定値のばらつきに入らず、層の中のばらつきだけが効く。層の大きさに比例して選ぶ（比例配分）とき、層の間の差が大きく層の中が似ているほど、同じ数を調べた単純無作為抽出より推定値のばらつきが小さくなる（配分が極端だと、単純無作為抽出より悪くなることもある）。層ごとに選ぶ数を層の大きさと変えたときは、集計で母集団の割合の重みを付け直さないと、選びすぎた層に推定が引っ張られる。
  conditions:
    math:
    - text: すべての層から、1つ以上を無作為に選ぶ
      kind: 要件
      outside: この定義の層化抽出としては扱えない（選ばなかった層の要素は選ばれる確率が0 になり、全体の推定ができない）
    data:
    - 層は、抽出の前に分かっている情報（規模・地域）で分け、調べたい値と関係の強いものを選ぶ
  example: 全100店（大規模20店・小規模80店）から各層10店ずつ調べ、平均売上が大規模200万円・小規模50万円なら、全店の平均の推定は 0.2×200＋0.8×50＝80万円。
  counterexample: 同じ100店で、小規模店の層からだけ10店を選ぶと、大規模店の層の値は推定に入らず、全店の平均を50万円と見積もってしまう。すべての層から選ぶという要件を外すと、層化抽出の推定はできない。
  misconceptions:
  - misconception: 各層から同じ数ずつ選んだら、調べた店をそのまま平均してよい
    correction: 選んだ数の比が母集団の比と違うので、そのまま平均すると (200＋50)÷2＝125万円と、数の少ない大規模店を重く見すぎる。層の割合（0.2・0.8）で重みを付け直す
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（層化抽出）
  checks:
  - 0.2*200 + 0.8*50 == 80 and (200+50)/2 == 125
- id: TERM-cluster-sampling
  name: 集落抽出
  en: cluster sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠（母集団）を集落（学校・地区・店など、要素の集まり）に分け、集落を単位にして無作為抽出で選び、選んだ集落の要素を全部調べる手続き
    terms: [TERM-random-sampling]
  short: 母集団を集落（学校・地区など）に分け、無作為に選んだ集落の全員を調べる方法
  definition: 抽出枠（母集団）を、学校・地区・店のような要素の集まり（集落）に分け、集落を単位にして無作為に選び、選んだ集落の要素を全部調べる方法。
  version: 1
  principle: 選ぶ単位が集落なので、調べる場所が少なくてすみ、手間と費用が減る。その代わり、推定値のばらつきは「どの集落を引いたか」で決まる。集落の中が似ていて集落どうしが違うほど、1つの集落を全部調べても集めた情報は少なく、同じ数の要素を単純無作為に選ぶより推定値がばらつく。集落の中にいろいろな要素が混ざっていれば、1つの集落でも全体の縮図に近くなる。
  conditions:
    math:
    - text: 選んだ集落の中は、要素を全部調べる
      kind: 要件
      outside: この定義の集落抽出ではない（選んだ集落の中からさらに無作為に選ぶなら、多段抽出）
    data:
    - 集落の中が似ていないか（同じ地区の店は売上が似る）を、前の調査や地区ごとの平均で確かめる
    - 集落の数が少ないと、推定値は引いた集落しだいで大きく動く。集落を増やせないかを先に考える
  example: 10地域×10店の100店で、地域を1つくじで選び、その地域の10店を全部調べる。ラボのモデルで地域の差を1・2 と大きくすると、標準誤差は10店を単純無作為に選ぶときの約3.0倍・約3.2倍になる。地域の差が0 で、どの地域にも大小の店がでたらめに混ざっていれば、ほぼ1倍。
  counterexample: 地域を2つ選び、その中でさらに3店ずつくじで選ぶと、選んだ地域の中を全部は調べていない。これは集落抽出ではなく、地域→店の2段の多段抽出で、推定値のばらつきには2段目の選び方の分も入る。
  misconceptions:
  - misconception: 調べた店の数が同じなら、集落抽出でも単純無作為抽出と同じ精度
    correction: 同じ集落の店が似ていると、10店を調べても情報は1店分に近い。精度は、集落の中がどれだけ似ているかで大きく変わる
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（集落抽出）
  checks:
  - 'abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(1,0,1)[2] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(1,0,1)[0] - 2.99) < 0.01 and abs((lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[2] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(2,0,1)[0] - 3.22) < 0.01 and 0.9 < (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(0,0,1)[2] / (lambda d,p,s: (lambda Y: (lambda M,am,mk: (math.sqrt(0.9*sum((v-M)**2 for r in Y for v in r)/99/10), math.sqrt(sum(0.009*sum((v-sum(r)/10)**2 for v in r)/9 for r in Y)), math.sqrt(0.9*sum((a-M)**2 for a in am)/9), math.sqrt(sum((m-M)**2 for m in mk)/10)))(sum(v for r in Y for v in r)/100, [sum(r)/10 for r in Y], [sum(Y[j][k] for j in range(10))/10 for k in range(10)]))([[50+d*[3,-7,9,-1,-9,5,1,-5,7,-3][j]+p*(k-4.5)+s*(((3*j*j+4*k*k+7*j*k+2*j+4*k)%11)-5) for k in range(10)] for j in range(10)]))(0,0,1)[0] < 1.1'
- id: TERM-systematic-sampling
  name: 系統抽出
  en: systematic sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 抽出枠の名簿の並びで、抽出間隔 k を決め、最初の1つを1〜k 番目から等しい確率で選び、そこから k おきに選ぶ手続き
    terms: [TERM-random-sampling]
  short: 名簿の最初の1人を無作為に選び、そこから一定の間隔で選んでいく方法
  definition: 抽出枠の名簿の並びで、抽出間隔 k を決め、最初の1つを1〜k 番目からくじで選び、そこから k おきに選ぶ方法。
  version: 1
  principle: くじは最初の1回だけなので、手間が少なく、名簿の端から端まで均等に選べる。名簿が売上の順のように並んでいれば、どの範囲からも選ぶので層化に近い効き方をする。最初の1つを等しい確率で選べば、どの要素も同じ確率で選ばれる。ところが、名簿の並びに周期があり、その周期が抽出間隔と合うと、1回の標本は周期の同じ位置の要素ばかりになり、どの開始点を引いたかで推定値が大きく揺れる（偏るのではなく、ばらつきが大きくなる）。
  conditions:
    math:
    - text: 最初の1つを、1〜k 番目から等しい確率で選ぶ
      kind: 要件
      outside: この定義の系統抽出としては扱えない（最初を決め打ちすると、どの要素が選ばれるかが前もって決まり、選ばれる確率が等しくならない）
    data:
    - 名簿の並び方（曜日順・規模の順・番号の付け方）に、抽出間隔と合う周期がないかを確かめる
  example: 100店の名簿から10店を選ぶなら k＝10（100 が10 で割り切れる）。くじで最初が3番になれば、3, 13, 23, …, 93 番の10店を調べる。どの店も選ばれる確率は 1/10。
  counterexample: くじを引かずに毎回1番から始めると、選ばれるのはいつも 1, 11, 21, …, 91 番の10店で、2番の店が選ばれる確率は0。最初の1つを等しい確率で選ぶという要件を外すと、無作為に選んだことにならない。
  misconceptions:
  - misconception: 等しい間隔で選べば、単純無作為抽出と同じ精度になる
    correction: 名簿に間隔と合う周期があると、1つの集落を引くのと同じになり、推定値は開始点しだいで大きくばらつく。たとえば日付の名簿から7日おきに選ぶと、1回の標本は1つの曜日だけになる
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（系統抽出）
  checks:
  - 100 // 10 == 10 and [3 + 10*i for i in range(10)][-1] == 93 and all(sum(1 for st in range(1, 11) if u in [st + 10*i for i in range(10)]) == 1 for u in range(1, 101))
- id: TERM-multistage-sampling
  name: 多段抽出
  en: multistage sampling
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 母集団を大きさの違う単位の段（地域→店→客など）に分け、大きな単位から順に、各段で前の段で選んだ単位の中から無作為抽出で選ぶ手続き（各要素の選ばれる確率は、各段の、前の段で選ばれたという条件の下の確率の積。どの段の一覧も抽出枠になる）
    terms: [TERM-random-sampling]
  short: 大きな単位から順に、何段階かに分けて無作為に選んでいく方法
  definition: 母集団を、大きさの違う単位の段（地域→店→客など）に分け、大きな単位から順に、各段で前の段で選んだ単位の中から無作為に選ぶ方法。
  version: 1
  principle: 全部の客の名簿がなくても、地域の一覧、選んだ地域の店の一覧、選んだ店の客の一覧と、段ごとの一覧があれば選べる。1人の客が選ばれる確率は、各段の選ばれる確率の掛け算で、集計ではその逆数を重みにする。段を重ねるほど手間は減るが、上の段で引いた単位しだいで推定値がばらつく分が加わる。
  conditions:
    math:
    - text: 各段で、前の段で選んだ単位の中から、選ばれる確率が分かる無作為な方法で選ぶ
      kind: 要件
      outside: この定義の多段抽出としては扱えない（ある段を担当者が選ぶと、その段の確率が分からず、選ばれる確率も重みも決まらない）
    data:
    - 段ごとの一覧（抽出枠）に漏れがないかを確かめる。どの段の漏れも、その下の要素を選べなくする
  example: 10地域から2地域、選んだ地域の10店から3店、選んだ店の客100人から20人を選ぶと、1人の客が選ばれる確率は (2/10)×(3/10)×(20/100)＝0.012、重みはその逆数の約83.3。
  counterexample: 1段目の地域はくじで選んだが、2段目の店を地域の担当者が「協力してくれそうな店」から選ぶと、店が選ばれる確率が分からない。客が選ばれる確率も、重みも決まらず、推定に偏りがあっても見積もれない。
  misconceptions:
  - misconception: どの段も無作為に選べば、どの客も同じ確率で選ばれる
    correction: 地域ごとに店の数や客の数が違うのに、どの地域からも同じ数を選ぶと、店や客の少ない地域の客ほど選ばれやすい。確率は各段の確率の掛け算で、要素ごとに違いうる
  - misconception: 多段抽出でも、単純無作為抽出と同じ式で標準誤差を求めてよい
    correction: 同じ地域・同じ店の中のデータは似やすいので、単純無作為抽出の式では標準誤差を小さく見積もる
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（多段抽出）
  checks:
  - abs((2/10)*(3/10)*(20/100) - 0.012) < 1e-12 and abs(1/0.012 - 83.3) < 0.05
- id: TERM-sampling-error
  name: 標本誤差
  en: sampling error
  category: 調査・実験
  forms: [rv]
  basis:
    text: 選ばれた個体の集まり S が決まったあと、S の要素を誤りなく測ったときの推定量の値 θ̂*(S) と、抽出枠の上の母数 θ_F（抽出枠の全部を誤りなく調べたときの値）の差 θ̂*(S)−θ_F（どの標本が選ばれたかで値が決まる）
    terms: [TERM-estimator, TERM-frame]
  short: 母集団の一部（標本）だけを調べることで生じる、結果と真の値のずれ
  definition: 母集団（抽出枠）の一部だけを選んで調べたことで生じる、推定値と、抽出枠の全部を誤りなく調べたときの値とのずれ。どの標本が選ばれたかで値が決まり、選び直すと変わる。
  version: 1
  principle: 単純無作為抽出の標本平均なら、標本誤差は選び直しの平均で0 になり、その大きさ（標準誤差）は標本の数を増やすと小さくなる（およそ 1÷√n で）。同じ数を調べても、層化・集落・系統のどれで選ぶかで大きさが変わり、集落抽出で同じ集落の中の要素を足しても小さくならないことがある。
  conditions:
    math:
    - text: 抽出枠がはっきり決まっていて、その全部を誤りなく調べたときの値 θ_F が考えられる
      kind: 要件
      outside: この定義の標本誤差は定まらない（どこまでが選び方のずれかが決まらない）
    - text: 抽出枠（要素 N 個、枠の上の分散 S²）から大きさ n を非復元の単純無作為抽出で選び、標本平均で推定する
      kind: 仮定
      claim: 標本平均の標本誤差は期待値0・分散 (1−n/N)S²/n で、この分散は n が大きいほど小さい
      outside: 標本誤差が平均して0 になるとも、標本を増やせば小さくなるとも保証されない（集落抽出で同じ集落の中の要素を足しても、小さくならないことがある）
    data:
    - 標準誤差は、標本誤差の大きさの目安。区間推定の幅に入るのはこの分だけで、非標本誤差は入らない
  example: 賛成の割合が0.6 の十分大きい母集団から n 人を単純無作為に選ぶと、標本の割合の標準誤差は √(0.6×0.4÷n) で、n＝100 なら約0.049、n＝1000 なら約0.015、n＝10000 なら約0.005 と小さくなる。
  counterexample: 店の担当者が「話を聞いてくれそうな客」を選んで声をかけると、選ばれる確率が分からない。聞く客を1000人に増やしても、標本の割合が抽出枠の割合のまわりに平均0 でばらつくとは言えない。単純無作為抽出の仮定を外すと、標本誤差の見積もり（標準誤差）は使えない。
  misconceptions:
  - misconception: 標本誤差は、調べ方の失敗（測り間違い）から生じる
    correction: 標本誤差は、誤りなく測っても、一部だけを選んだことで生じるずれ。測り間違い・無回答は非標本誤差の側
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（標本誤差）
  checks:
  - abs((0.6*0.4/100)**0.5 - 0.049) < 0.0005 and abs((0.6*0.4/1000)**0.5 - 0.015) < 0.0005 and abs((0.6*0.4/10000)**0.5 - 0.005) < 0.0005
- id: TERM-nonsampling-error
  name: 非標本誤差
  en: non-sampling error
  category: 調査・実験
  forms: [rv]
  basis:
    text: 実際に得たデータで求めた推定量の値 θ̂ と、母数 θ の差 θ̂−θ から、選んだ標本を誤りなく測ったときのずれを除いた部分 (θ̂−θ̂*(S))＋(θ_F−θ)（θ̂*(S) は選ばれた個体の集まり S の要素を誤りなく測ったときの推定量の値、θ_F は抽出枠の全部を誤りなく調べたときの値）。前の項は無回答・回答や記入の誤りなど測り方から、後ろの項は抽出枠と母集団のずれ（名簿の漏れなど）から来る。標本誤差 θ̂*(S)−θ_F と足すと θ̂−θ になる
    terms: [TERM-estimator, TERM-frame]
  short: 回答の誤り・無回答・抽出枠の不備など、標本を選ぶこと以外で生じるずれ
  definition: 推定値と母集団の本当の値のずれのうち、標本を選んだこと以外から生じる部分。無回答・回答や記入の誤り・質問の仕方など測り方から来るずれと、抽出枠と母集団のずれ（名簿の漏れなど）から来るずれを合わせたもの。
  version: 1
  principle: 測り方や名簿の漏れから来るずれは、多くの場合いつも同じ向きに出るので、その部分は標本を増やしても減らない。向きのそろわない記入の誤りは、数を増やすと打ち消し合って小さくなる。選んだ（声をかけた）人が答えないことによるずれも、こちら（測り方）の側に入る。一定の向きのずれを減らすには、回答を集める仕方・質問の書き方・名簿を直す。
  conditions:
    math:
    - text: 抽出枠がはっきり決まっていて、その全部を誤りなく調べたときの値 θ_F が考えられる
      kind: 要件
      outside: この定義の分け方（標本誤差と非標本誤差）はできない（枠を決めずに集めた街頭の声などでは、どこまでが選び方のずれかが決まらない）
    data:
    - 回答率を、回答の内容によって違わないかの手掛かりとともに記録する（賛成の人ほど答えやすい、など）
    - 抽出枠に入っていない人（名簿の漏れ）が、どんな人かを書き出す
  example: 客の名簿が会員だけで、会員（客の6割）の満足の割合が0.7、会員でない客（4割）が0.4 なら、客全体の満足は 0.6×0.7＋0.4×0.4＝0.58。名簿から選んで全員が正しく答えても、満足の割合は0.7 のまわりに集まり、0.12 ずれる（θ_F−θ の項）。選ぶ人を100人から10000人に増やしても、このずれは0.12 のまま残る。
  counterexample: 駅前で通りかかった人に声をかけて集めた意見には、抽出枠（声をかけうる人の一覧）がない。どこまでが選び方のずれで、どこからが測り方のずれかを分けられないので、この定義の非標本誤差としては扱えない。
  misconceptions:
  - misconception: 無作為に選んでいれば、非標本誤差は起きない
    correction: 無作為抽出が防ぐのは選び方のずれだけ。選んだ人が答えない・答えを誤る・名簿から漏れた人がいると、無作為に選んでもずれが起きる
  - misconception: 全数調査なら誤差はない
    correction: 非標本誤差は名簿の漏れ・無回答・記入の誤りなどから来るので、n を増やしても、全数調査でも起こる
  sources:
  - source: 公式2級範囲表
    locator: 標本調査（非標本誤差）
  checks:
  - abs(0.6*0.7 + 0.4*0.4 - 0.58) < 1e-12 and abs(0.7 - 0.58 - 0.12) < 1e-12
- id: TERM-randomize
  name: 無作為化
  en: randomization
  category: 調査・実験
  forms: [procedure]
  basis:
    text: 実験で、各対象をどの処理の群に入れるかを、対象の性質や実験者の判断でなく、前もって決めた確率に従うくじ（乱数）で決める手続き。完全無作為化は、群の大きさを先に決め、その大きさの割り当てを全部同じ確率で選ぶ形
    terms: [TERM-prob]
  short: 実験で、対象をくじ引きのように処理の群へ割り当てること
  definition: 実験で、各対象をどの処理の群に入れるかを、対象の性質や実験者の判断ではなく、前もって決めた確率に従うくじ（乱数）で決める手続き。
  version: 1
  principle: 割り当てがくじで決まり、各対象が処理の群に入る確率が全部等しい（完全無作為化など）なら、割り当ての前に決まっている対象の性質（店の規模・立地など、測っていないものも含む）は、どの群に入るかと独立になる。群の大きさを先に決めた完全無作為化なら、そうした性質の群の平均の差は、くじを引き直した平均で0 になる（④-29）。だから群の差に、性質の差が一方に偏って混ざらない。1回のくじでは偶然の差が残るが、その大きさは確率で言えるので、検定や区間で扱える。
  conditions:
    math:
    - text: 割り当ての確率が割り当ての前に決まっていて、対象の性質や結果を見て変えない
      kind: 要件
      outside: 無作為化ではない（性質を見て割り当てや入れ替えをすると、その性質と群が独立にならない）
    - text: 完全無作為化（群の大きさを先に決め、その大きさの割り当てを全部同じ確率で選ぶ）で割り当てる
      kind: 仮定
      claim: CLM-29
      outside: ④-29 は保証されない（各対象が処理の群に入る確率が等しいとは限らない。確率が等しくても、各店を独立に0.5 で振るなど群の大きさが偶然で決まる割り当てには使えない）
    data:
    - くじ・乱数を使ったか、割り当てのあとで入れ替えていないか（協力的な店を施策に回すなど）を確かめる
    - 割り当てたあとで、群ごとに規模などの平均を並べて見る
  example: 20店をくじで10店ずつに分け、片方で新しい陳列を試す。20店から10店を選ぶ 20C10＝184756 通りのどれも同じ確率で選ぶので、どの店も陳列の群に入る確率は 10÷20＝0.5。
  counterexample: 同じ20店でくじを引いたあと、陳列の群に入った小さな店を、本部が「効果が出にくい」と言って大きな店と入れ替える。入れ替えたあとの割り当ては規模を見て決めたので、規模と群が独立でなくなり、陳列の群に大きな店が偏る。割り当てを性質を見て変えないという要件を外すと、無作為化ではない。
  misconceptions:
  - misconception: くじで割り当てれば、群の性質は必ずそろう
    correction: 1回のくじでは偶然の差が残る。そろうのは、くじを引き直した平均。差が心配な性質は、局所管理（規模の近い店を組にしてから、組の中でくじを引く）で抑える
  sources:
  - source: 公式2級範囲表
    locator: 実験計画（フィッシャーの3原則）
  checks:
  - comb(20, 10) == 184756 and comb(19, 9) / comb(20, 10) == 10 / 20 == 0.5
- id: TERM-confound
  name: 交絡
  en: confounding
  category: 調査・実験
  forms: [property]
  basis:
    text: 処理（調べたい要因）T の群どうしで結果 Y を比べるとき、T と関係し（無作為に選んだ1個体の T と Z が独立でない）、Y にも影響する別の要因 Z があるために、比べた差に T の効果と Z の効果が混ざって分けられないこと（Z は処理の前に値が決まっている要因で、処理の結果として変わる量は含めない。独立でないかは、割り当て・抽出の偶然まで含めた確率で見る。1回の割り当てで偶然に生じた群の差は含めない。Y への影響・効果は因果の見立てで、統計の外の判断を含む）
    terms: [TERM-indep]
  short: 調べたい要因と結果の両方に関係する別の要因があり、その効果を区別できなくなること
  definition: 処理（調べたい要因）の群どうしで結果を比べるとき、処理の前から決まっていて、処理と関係し結果にも影響する別の要因があるために、比べた差に処理の効果と別の要因の効果が混ざって分けられないこと。
  version: 1
  principle: 効果が足し算で表せるなら、群の差は「処理の効果」と「別の要因の、群の間の違いから来る分」の和になり、データの差だけからは2つに分けられない。処理と別の要因が独立なら（完全無作為化。④-29）、後ろの分は割り当てを引き直した平均で0 になる。別の要因を測っていれば、層別ならその値が同じものどうしで比べて、重回帰ならその要因と直線的に一緒に動く分を除いて、分けられる範囲がある。測っていない要因は残る。
  conditions:
    math:
    - text: 処理 T と別の要因 Z が独立でない（割り当て・抽出の偶然まで含めた確率で見る）
      kind: 要件
      outside: 交絡ではない（T と Z が独立なら、Z の効果は群の差に一方に偏って混ざらない。1回の割り当てで偶然に出た Z の差は、ばらつきとして扱う）
    - text: Z が結果 Y に影響する（因果の見立てで、統計の外の判断を含む）
      kind: 要件
      outside: 交絡ではない（Z が Y に影響しなければ、T と独立でなくても、群の差に Z の効果は混ざらない）
    - text: Z は処理の前に値が決まっている（処理の結果として変わる量ではない）
      kind: 要件
      outside: 交絡ではない（処理で変わった量は処理の効果の通り道で、その分も処理の効果に入る）
    data:
    - 群ごとに、処理の前に決まっている要因（規模・季節・曜日）の平均を並べ、群で違わないかを見る
    - 処理をどう決めたか（誰が・何を見て）を聞き、処理と一緒に変わった要因を書き出す
  example: 20店のうち大きい10店に新しい陳列を、小さい10店にふつうの陳列を行う。陳列の効果が店によらず3 で、大きい店はもともと売上が20 多いなら（効果が足し算で表せるとみて）、2つの群の売上の差は 3＋20＝23 になる。差23 だけからは、陳列の効果と規模の差を分けられない。
  counterexample: 同じ20店で、新しい陳列の10店をくじで選ぶ。規模と陳列は独立になり、1回のくじで陳列の群に大きい店が少し多く入っても、その差は偶然のばらつきで、くじを引き直した平均では0 になる。T と Z が独立でないという要件を外すと、交絡ではない。
  misconceptions:
  - misconception: 結果に関係しそうな要因は、全部そろえて比べるほど処理の効果がはっきりする
    correction: 処理の結果として変わる要因（キャンペーンで増えた客数など）は交絡ではなく、効果の通り道。それをそろえると、処理の効果の一部まで除いてしまう。そろえるのは処理の前から決まっている要因（U30 重回帰）
  sources:
  - source: 公式2級範囲表
    locator: 実験計画（交絡）
  checks:
  - 3 + 20 == 23
- id: TERM-anova
  name: 分散分析
  en: analysis of variance
  category: 検定
  forms: [procedure]
  basis:
    text: g 個の群の母平均がすべて等しいという H₀ を、F＝群間の平均平方÷群内の平均平方 で検定する仮説検定（教材の範囲は一元配置。g≧2 で定義でき、2級では主に g≧3 で使う）
    terms: [TERM-test, TERM-ms]
  short: 2つ以上（主に3つ以上）の群の平均に差があるかを、群の間と群の中のばらつきの比（F 分布）で調べる方法
  definition: g 個の群の母平均がすべて等しいかを、全体の平方和を群間の平方和と群内の平方和に分け、それぞれを自由度で割った平均平方の比 F＝群間の平均平方÷群内の平均平方 で検定する方法（一元配置）。
  version: 1
  principle: 全体の平方和は、群の平均が全体の平均からどれだけ離れるか（群間）と、各値が自分の群の平均からどれだけ離れるか（群内）にちょうど分かれる。群内の平均平方は群の平均の差によらない偶然のばらつきの物差しで、群間の平均平方は、どの群も分散が同じで母平均がすべて等しければ同じ大きさの見積もりになり、母平均がずれるほど大きくなる。だから F が1 より十分大きいと、平均の差が偶然の範囲を超えると判断する。
  conditions:
    math:
    - text: 群の数 g≧2 で、どの群にも1つ以上の値があり、全体の数 n が g より大きく、群内の平方和が0 より大きい
      kind: 要件
      outside: F が定まらない（群内の自由度 n−g が0、または群内の平均平方が0 になる）
    - text: 観測が互いに独立で、各群が同じ分散 σ²（σ＞0）の正規分布に従う
      kind: 仮定
      claim: CLM-36
      outside: ④-36 は保証されない（F が F(g−1, n−g) に従うとは限らず、F 分布の点で判定した有意水準 α が、本当の第1種の過誤の確率と合うとは限らない）
    data:
    - 群ごとに点を並べ、群の中のばらつきが群で大きく違わないか、外れ値がないかを見る
    - 同じ店を何日も数えた値を、別々の店として数えていないかを確かめる（独立）
  example: 3つの陳列を各3店に割り当て、売上の増加が A 2,3,4・B 5,6,7・C 5,6,7。群の平均3・6・6、全体の平均5。群間の平方和 3×(4＋1＋1)＝18（自由度2）、群内の平方和 2×3＝6（自由度6）、F＝(18÷2)÷(6÷6)＝9。F(2, 6) の上側5%点5.14 より大きいので、母平均がすべて等しいとは言えない。
  counterexample: 3つの陳列を各1店にくじで割り当て、各店の続いた3日の値を、3店の値として数えて9個で分散分析する。同じ店の続いた日どうしは客も天気も似るので、同じ群の中の値どうしが似て（独立でなく）、群内のばらつきが小さく出て、群内の自由度も多く数えすぎ、F が大きくなりやすい。割り当てはくじのままで、観測が独立という仮定だけを外すと、F 分布の点で判定した有意水準は保証されない。
  misconceptions:
  - misconception: 分散分析は、群のばらつき（分散）に差があるかを調べる
    correction: 調べるのは平均の差。ばらつきは、平均の差が偶然の範囲を超えるかを測る物差しに使う
  - misconception: 棄却したら、すべての群の平均が互いに違う
    correction: 言えるのは「少なくとも1組の母平均が違う」まで。どの組かは、多重比較で比べた組の数を考えて調べる
  sources:
  - source: 公式2級範囲表
    locator: 分散分析（一元配置）
  checks:
  - (2+3+4)/3 == 3 and (5+6+7)/3 == 6 and (2+3+4+5+6+7+5+6+7)/9 == 5 and 3*((3-5)**2+(6-5)**2+(6-5)**2) == 18 and 3*((-1)**2+0+1**2) == 6 and (18/2)/(6/6) == 9 and 9-3 == 6
  - 'abs((lambda x,a,b: sum(math.exp(0.5*(a*math.log(a*x*(i+0.5)/4000)+b*math.log(b)-(a+b)*math.log(a*x*(i+0.5)/4000+b))-math.log(x*(i+0.5)/4000)-math.lgamma(a/2)-math.lgamma(b/2)+math.lgamma((a+b)/2)) for i in range(4000))*x/4000)(5.14,2,6) - 0.95) < 0.0005 and 9 > 5.14'
- id: TERM-multcomp
  name: 多重比較
  en: multiple comparisons
  category: 検定
  forms: [procedure]
  basis:
    text: 複数の帰無仮説（群の組ごとなど）をそれぞれ仮説検定するとき、正しい帰無仮説のうちどれか1つでも第1種の過誤を起こす確率（ファミリーワイズの誤り率）が決めた有意水準 α 以下になるように、各検定の基準を調整して判定する手続き（ボンフェローニの方法など）
    terms: [TERM-test, TERM-type1, TERM-alpha]
  short: 多くの群の組を検定するとき、全体として誤る確率が大きくならないように調整して比べる方法
  definition: 群の組ごとなど、複数の帰無仮説をそれぞれ検定するとき、正しい帰無仮説のどれか1つでも誤って棄却する確率（ファミリーワイズの誤り率）が決めた有意水準 α 以下になるように、各検定の基準を調整して判定する手続き（ボンフェローニの方法など）。
  version: 1
  principle: 1つずつ水準 α で検定すると、正しい帰無仮説が m 個あるとき、どれか1つでも誤って棄却する確率は最大で mα まで大きくなる（どれか1つが起きる確率は、それぞれの確率の和を超えない）。ボンフェローニの方法は、各検定を α÷m で行い、全体を α 以下に抑える。その代わり、1つずつの検定は厳しくなり、本当の差を見逃しやすくなる。
  conditions:
    math:
    - text: 比べる候補の帰無仮説の全部（ファミリー）を決め、選ぶ候補になりえたものを全部 m に数える
      kind: 要件
      outside: この手続き（ボンフェローニの方法）として定まらない（m が決まらず、各検定の基準 α÷m を決められない）
    - text: 各検定は、その帰無仮説が正しいとき、棄却する確率が決めた水準以下になる
      kind: 仮定
      claim: 各検定を水準 α÷m で行うと、m 個の帰無仮説のうち正しいもののどれか1つでも棄却する確率は α 以下になる
      outside: ボンフェローニの方法で全体の誤り率を α 以下に抑えられるとは保証されない
    data:
    - 報告に、比べた組の数と調整の方法を書く
    - 差の大きい組だけを報告していないか、比べた組を全部並べているかを確かめる
  example: 4つの売場の平均を組ごとに比べると、組は 4C2＝6 組。ボンフェローニの方法では、各組を 0.05÷6≒0.0083 の水準で検定する。調整せずに各5% で検定すると、どれか1つでも誤って有意になる確率の上限は 6×0.05＝0.3（実際はそれより小さいが、5% よりは大きい）。
  counterexample: 4つの売場の平均を眺めて差のいちばん大きい1組を選び、「比べたのは1組」として m＝1 とし、その p 値0.03 を 0.05÷1 と比べて「有意」とする。選ぶ候補は6組あったので、m は6 で、基準は 0.05÷6≒0.0083。選ぶ候補になりえたものを全部 m に数えるという要件を外すと、ボンフェローニの方法にならない。
  misconceptions:
  - misconception: 組ごとの t 検定をくり返しても、それぞれを5% で判定していれば、全体の誤り率も5%
    correction: どれか1つでも誤る確率は、組が増えるほど大きくなる（6つの検定が独立なら約 1−0.95⁶≒0.26。組の比較は同じ群を共有するので実際は独立でないが、5% より大きくなることは変わらない）
  sources:
  - source: 公式2級範囲表
    locator: 分散分析（多重比較）
  checks:
  - comb(4, 2) == 6 and abs(0.05/6 - 0.0083) < 0.00005 and abs(1 - 0.95**6 - 0.26) < 0.005 and abs(6*0.05 - 0.3) < 1e-12
- id: TERM-posterior
  name: 事後確率
  en: posterior probability
  category: 確率
  forms: [number]
  basis:
    text: 結果 D を見たあとの、原因・仮説 H の条件付き確率 P(H|D)
    terms: [TERM-cond]
  short: データ（結果）を見たあとで、ベイズの定理で更新した原因や仮説の確率
  definition: 結果（データ）D を見たあとの、原因や仮説 H の確率 P(H|D)。ベイズの定理で、事前確率を結果で更新して求める。
  version: 1
  principle: 事後確率は「事前確率×尤度」に比例する。新しい結果が、原因を決めたもとで前の結果と独立なら、今の事後確率を次の事前確率にして、もう一度更新できる。
  conditions:
    math:
      - text: 条件にするのは、観測した結果の全体 D（一部の結果だけを選んで条件にしない）
        kind: 要件
        outside: 事後確率にならない（観測したほかの結果を使わない、偏った更新になる）
    data:
      - 2回目の結果で更新するときは、1回目と2回目の結果が（原因を決めたもとで）独立かを確かめる。同じ人を同じ検査で測り直すと、誤りが繰り返されやすい
  example: 有病率 1%・感度 0.9・偽陽性 0.05 の検査で1回陽性なら、事後確率は 0.01×0.9÷0.0585≒0.154。
  counterexample: 同じ人に独立な検査を2回して陽性と陰性が1回ずつ出たのに、陽性だけで更新して約 0.154 とするのは事後確率ではない。両方の結果で更新すると約 0.019 になる。
  misconceptions:
    - misconception: 事後確率は、計算したら確定した値
      correction: 次の結果を見るたびに更新される。1回陽性で 0.154 でも、病気かどうかを決めたもとで独立なもう1回の検査でも陽性なら、約 0.766 になる
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.1538*0.9/(0.1538*0.9 + 0.8462*0.05) - 0.766) < 0.001 and abs(0.1538*0.1/(0.1538*0.1 + 0.8462*0.95) - 0.019) < 0.001
- id: TERM-mean
  name: 平均（算術平均）
  en: arithmetic mean
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 足すことに意味のある値（量的変数）のデータ x₁, …, xₙ（n≧1。量的変数であることは定義の要件）の値をすべて足し、個数 n で割った値 x̄＝(x₁＋…＋xₙ)/n
    terms: []
  short: データの値をすべて足し、データの個数で割った値
  definition: 量的なデータの値をすべて足し、個数で割った値 x̄＝(x₁＋…＋xₙ)÷n。
  version: 1
  principle: どの値も同じ重さで効くので、平均に個数を掛けると合計に戻る（売上の見込み・1人あたりの量）。平均からの差（偏差）を全部足すと必ず0になり、平均は値の重心の位置にくる。その代わり、1つの大きな値もそのまま効くので、右に裾の長いデータでは、多くの値より大きい側に寄ることが多い（いつもではない）。
  conditions:
    math:
    - text: 値が量的（足すことに意味がある）
      kind: 要件
      outside: 店番や、満足度の段階に付けた点の平均は、番号や点の付け方しだいで値が変わる。その付け方を離れて、データについて何かを言える保証はない
    data:
    - 平均を「典型的な1つの値」と読む前に、裾の長さや外れ値を見る（購入額・所得のように大きい側に裾が長いと、平均より少ない人が多くなることが多い）
    - グループごとの平均をまとめるときは、平均どうしを平均せず、各グループの合計を足して全体の個数で割る
  example: 5日の売上（万円）が 20, 22, 25, 28, 30 なら、合計125÷5＝25。偏差は −5, −3, 0, 3, 5 で、足すと0。平均25万円に5日を掛けると、合計の125万円に戻る。
  counterexample: 3人の客の郵便番号が 780-0001, 780-0051, 780-8011 のとき、数字として足して3で割ることはできるが、その「平均の郵便番号」はどの地区とも関係がない。郵便番号は地区を区別するラベルで、足すことに意味のある量ではないので、この定義の平均の外にある。
  misconceptions:
  - misconception: グループごとの平均を平均すれば、全体の平均になる
    correction: 客100人で平均2千円の A店と、客10人で平均8千円の B店を合わせた平均は、(2×100＋8×10)÷110≒2.55千円。平均どうしの平均（5千円）にはならない。一致するのは、グループの個数が同じか、グループの平均が全部等しいときだけ
  - misconception: 平均は、データの中のふつうの値
    correction: 6人の購入額（千円）が 1, 1, 1, 9, 9, 9 なら、平均は5千円だが、5千円前後を買った客は1人もいない。平均は合計を均した値で、データの中にある値とも、多くの人の値とも限らない
  sources:
  - source: 公式2級範囲表
    locator: データの記述（代表値）
  checks:
  - Fraction(20+22+25+28+30, 5) == 25 and -5-3+0+3+5 == 0 and 25*5 == 125
  - Fraction(1+1+1+9+9+9, 6) == 5 and abs((2*100+8*10)/110 - 2.55) < 0.005 and Fraction(2+8, 2) == 5
- id: TERM-prob
  name: 確率（確率の公理）
  en: probability (axioms)
  category: 確率
  forms: [function, number]
  basis:
    text: 標本空間の事象 A のそれぞれに数 P(A) を対応させる関数で、どの A でも P(A)≧0、P(Ω)＝1、互いに排反な事象 A₁, A₂, … では P(A₁∪A₂∪…)＝P(A₁)＋P(A₂)＋…（確率の公理）を満たすもの。その値 P(A) も確率と呼ぶ
    terms: [TERM-event, TERM-sample-space, TERM-exclusive]
  short: 事象の起こりやすさを0〜1の数で表したもので、全体は1、排反な事象では確率を足せる
  definition: 事象の起こりやすさを0から1の数で表したもの。事象 A の確率を P(A) と書く。どの事象でも0以上、全体（標本空間）は1、互いに排反な事象の和の確率はそれぞれの確率の和（確率の公理）。
  version: 1
  principle: 確率は、公理の3つ（0以上・全体が1・排反なら足せる）を満たす割り当てなら何でもよい。どの割り当てを使うかは、仮定（同様に確からしい・過去の割合・モデル）で決める。公理から、余事象の確率 1−P(A)、加法定理、空事象の確率0 などが導ける。
  formulas:
    - id: F-complement
      label: 余事象の確率
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: Aᶜ, meaning: A が起こらない事象（余事象。高校では Ā と書く）, key: Ac, kind: value, concept: TERM-complement}
        - {symbol: A, meaning: 事象, key: A, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: Ac}]}
          - op: sub
            args:
              - {num: 1}
              - {op: fn, name: P, args: [{sym: A}]}
  conditions:
    math:
      - text: 確率は同じ標本空間 Ω の事象に割り当てる
        kind: 要件
        outside: 確率を比べたり足したりできない（別々に決めた2つの Ω の事象の確率は、同じ公理の上にない。1つの Ω にまとめれば比べられる）
    data:
      - 結果が有限個で、どれも同じ確率で起きる（同様に確からしい）と言えるときだけ、P(A)＝（A の結果の数）÷（Ω の結果の数）で求められる。2個のさいころの「1と6の組（順序を区別しない）」のように、同じ確率でない結果を1つと数えると誤る
      - 確率の割り当て方（同様に確からしい・過去の割合・モデル）を書き、その仮定が場面に合うかを確かめる。過去の割合を使うときは、条件が変わっていないか
  example: ゆがみのないさいころで偶数の目が出る確率は、6通りのうち 3通りで 3/6＝1/2。
  counterexample: 明日の天気を Ω＝{晴れ, 雨, 曇り} とし、晴れ 0.6・雨 0.5・曇り 0 と割り当てると、合計が 1.1 で「全体は1」を満たさないので確率ではない。
  misconceptions:
    - misconception: 晴れか雨のどちらかなので、晴れの確率は 1/2
      correction: 結果が2つでも、同じ確率で起きるとは限らない。数の比で確率を出せるのは「同様に確からしい」と言えるときだけ
    - misconception: 確率 1/6 なら、6回投げると必ず1回出る
      correction: 確率は1回ごとの起こりやすさ。6回で1回も出ないことも (5/6)⁶≒0.33 の確率で起きる。回数を増やすと割合が 1/6 に近づく（大数の法則）
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - Fraction(3,6) == Fraction(1,2) and round((5/6)**6, 2) == 0.33 and 0.6+0.5+0 > 1
- id: TERM-addition
  name: 加法定理
  en: addition rule
  category: 確率
  forms: [proposition]
  claims: [CLM-32]
  basis:
    text: どの2つの事象 A・B についても P(A∪B)＝P(A)＋P(B)−P(A∩B)（④-32）
    terms: [TERM-prob, TERM-event]
  short: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から両方が起こる確率を引いたもの
  definition: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から、両方が起こる確率を引いたもの。P(A∪B)＝P(A)＋P(B)−P(A∩B)。
  version: 1
  principle: P(A)＋P(B) は、A と B の両方に入る結果（A∩B）を二重に数えている。その分を1回引くと、A∪B の確率になる。A と B が排反なら A∩B は空なので、ただ足すだけになる。
  formulas:
    - id: F-addition
      label: 和の確率
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: A∪B, meaning: A か B の少なくとも一方が起きる, key: AuB, kind: value}
        - {symbol: A, meaning: 事象, key: A, kind: value}
        - {symbol: B, meaning: 事象, key: B, kind: value}
        - {symbol: A∩B, meaning: A と B が両方起きる, key: AB, kind: value}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: AuB}]}
          - op: sub
            args:
              - op: add
                args:
                  - {op: fn, name: P, args: [{sym: A}]}
                  - {op: fn, name: P, args: [{sym: B}]}
              - {op: fn, name: P, args: [{sym: AB}]}
      parts:
        - {path: [1, 0], name: 和, meaning: 2つの確率を足す。両方に入る結果を二重に数えている}
        - {path: [1, 1], name: 重なり, meaning: 二重に数えた両方の確率を1回引く}
  conditions:
    math:
      - text: A・B は同じ標本空間の上の、同じ確率 P の事象
        kind: 仮定
        claim: CLM-32
        outside: ④-32 は保証されない（この式で足し引きできない）
    data:
      - 重なり（両方に当てはまる人・品）を数えているかを確かめる。アンケートの「どちらかに当てはまる」を、2つの割合の和で出すと重なりの分だけ多くなる
  example: さいころで A＝{2, 4, 6}（偶数）、B＝{1, 2, 3}（3以下）なら、P(A∪B)＝3/6＋3/6−1/6＝5/6（A∩B＝{2}）。
  counterexample: 3つの事象 A・B・C のどれかが起こる確率を P(A)＋P(B)＋P(C)−P(A∩B)−P(B∩C)−P(A∩C) とすると、3つとも起こる部分を一度も数えない。2つの事象の式をそのまま3つに広げることはできない（3つの重なり P(A∩B∩C) を足し戻す）。
  misconceptions:
    - misconception: 「または」の確率はいつも足し算
      correction: 足すだけでよいのは排反のときだけ。重なりがあるときは、重なりの確率を引く
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - Fraction(3,6)+Fraction(3,6)-Fraction(1,6) == Fraction(5,6) and len({2,4,6}|{1,2,3}) == 5
- id: TERM-multiplication
  name: 乗法定理
  en: multiplication rule
  category: 確率
  forms: [proposition]
  claims: [CLM-33]
  basis:
    text: P(A)＞0 の事象 A とどの事象 B についても P(A∩B)＝P(A)P(B|A)（④-33）
    terms: [TERM-prob, TERM-cond, TERM-event]
  short: 2つの事象が両方起こる確率は、一方の確率と、それが起きたときの他方の条件付き確率の積
  definition: 2つの事象が両方起こる確率は、一方の確率と、それが起きたもとでの他方の条件付き確率の積。P(A∩B)＝P(A)P(B|A)。
  version: 1
  principle: 条件付き確率の定義 P(B|A)＝P(A∩B)÷P(A) の両辺に P(A) を掛けた形。「A の確率」に「A のうちで B も起きる割合」を掛ける。どちらを条件にしてもよく、P(A∩B)＝P(B)P(A|B) も成り立つ。A と B が独立なら（P(A)＞0 のとき）P(B|A)＝P(B) なので、P(A∩B)＝P(A)P(B) になる。
  formulas:
    - id: F-multiplication
      label: 両方の確率を順に掛ける
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: A∩B, meaning: A と B が両方起きる, key: AB, kind: value}
        - {symbol: A, meaning: 条件にする事象, key: A, kind: value}
        - {symbol: B|A, meaning: A を条件にした B（P( | ) の中だけの書き方）, key: BgA, kind: value, concept: TERM-cond}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: AB}]}
          - op: mul
            args:
              - {op: fn, name: P, args: [{sym: A}]}
              - {op: fn, name: P, args: [{sym: BgA}]}
      parts:
        - {path: [1, 0], name: 条件の確率, meaning: A が起きる確率}
        - {path: [1, 1], name: 条件付きの確率, meaning: A のうちで B も起きる割合}
  conditions:
    math:
      - text: A・B は同じ標本空間の上の、同じ確率 P の事象（P(A)＞0 は条件付き確率の要件）
        kind: 仮定
        claim: CLM-33
        outside: ④-33 は保証されない（違う確率の掛け算は、両方の確率にならない）
    data:
      - 2回目の確率が1回目の結果で変わるか（戻す・戻さない、売れたら棚から減る）を確かめる
  example: 赤玉 3 個・白玉 2 個の袋から戻さずに2回引き、2回とも赤の確率は 3/5×2/4＝3/10。
  counterexample: 会員の割合 0.4 は店 X、会員が買う割合 0.8 は店 Y の数を使うと、0.4×0.8＝0.32 で、店 X の「会員で買った人」の割合 0.2 と合わない。2つの確率が同じ P（同じ店の客）でないと、掛けても両方の確率にならない。
  misconceptions:
    - misconception: 戻さずに引くときも、2回とも赤は 3/5×3/5
      correction: 1回目に赤を引くと、袋は赤 2 個・白 2 個になる。2回目の赤は 2/4 で、3/5×2/4＝3/10（戻すときの 9/25 とは違う）。戻さずに引いた数の分布は超幾何分布になる
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - 'Fraction(3,5)*Fraction(2,4) == Fraction(3,10) and Fraction(3,5)**2 == Fraction(9,25) and abs(0.4*0.8 - 0.32) < 1e-12'
- id: TERM-total-prob
  name: 全確率の公式
  en: law of total probability
  category: 確率
  forms: [proposition]
  claims: [CLM-34]
  basis:
    text: 事象 A₁, …, A_k が互いに排反で合わせると Ω になり、どれも P(Aᵢ)＞0 のとき、どの事象 B についても P(B)＝Σ P(Aᵢ)P(B|Aᵢ)（④-34）
    terms: [TERM-prob, TERM-cond, TERM-event, TERM-exclusive]
  short: 起こり方を排反な場合に分け、場合ごとの確率×条件付き確率を足して全体の確率を求める式
  definition: 起こり方を、重なりも漏れもない場合に分け、場合ごとの「その場合の確率×その場合の条件付き確率」を足すと、全体の確率になる。2つの場合なら P(B)＝P(A)P(B|A)＋P(Aᶜ)P(B|Aᶜ)。
  version: 1
  principle: B が起きる結果は、場合分けの A₁, …, A_k のどれか1つにだけ入る。だから B を場合ごとの B∩Aᵢ に重なりなく分けて足せる（加法）。それぞれの P(B∩Aᵢ) は乗法定理で P(Aᵢ)P(B|Aᵢ)。場合ごとの条件付き確率を、その場合の起こりやすさで重みを付けて平均した形になる。
  formulas:
    - id: F-total-prob
      label: 2つの場合に分けて足す
      symbols:
        - {symbol: P( ), meaning: 確率, key: P, concept: TERM-prob}
        - {symbol: B, meaning: 確率を求める事象, key: B, kind: value}
        - {symbol: A, meaning: 場合分けの一方, key: A, kind: value}
        - {symbol: Aᶜ, meaning: 場合分けのもう一方（A の余事象）, key: Ac, kind: value, concept: TERM-complement}
        - {symbol: B|A, meaning: A を条件にした B, key: BgA, kind: value, concept: TERM-cond}
        - {symbol: B|Aᶜ, meaning: Aᶜ を条件にした B, key: BgAc, kind: value, concept: TERM-cond}
      tree:
        op: eq
        args:
          - {op: fn, name: P, args: [{sym: B}]}
          - op: add
            args:
              - op: mul
                args:
                  - {op: fn, name: P, args: [{sym: A}]}
                  - {op: fn, name: P, args: [{sym: BgA}]}
              - op: mul
                args:
                  - {op: fn, name: P, args: [{sym: Ac}]}
                  - {op: fn, name: P, args: [{sym: BgAc}]}
      parts:
        - {path: [1, 0], name: A の場合, meaning: A の確率×A のもとで B の確率}
        - {path: [1, 1], name: Aᶜ の場合, meaning: Aᶜ の確率×Aᶜ のもとで B の確率}
  conditions:
    math:
      - text: 場合分けの A₁, …, A_k は互いに排反で、合わせると Ω 全体になる（重なりも漏れもない。P(Aᵢ)＞0 は条件付き確率の要件。2つの場合の式は A と Aᶜ なので、いつも満たす）
        kind: 仮定
        claim: CLM-34
        outside: ④-34 は保証されない（重なりを2回数えたり、漏れた場合を数えなかったりして、足しても P(B) にならない）
    data:
      - 場合分けが「どの客もちょうど1つに入る」かを確かめる（会員・クーポン利用者のように重なる分け方は使えない）
  example: 検査で、病気の人（1%）が陽性になる確率 0.9、病気でない人（99%）が陽性になる確率 0.05 なら、陽性になる確率は 0.01×0.9＋0.99×0.05＝0.0585。
  counterexample: 客 100 人を「会員 40 人（20 人が買う）」と「クーポン利用者 30 人（18 人が買う）」に分けて 0.4×0.5＋0.3×0.6＝0.38 とすると、両方に入る 10 人（8 人が買う）を2回数え、どちらでもない 40 人（10 人が買う）を数えない。実際の購入率は (20＋18−8＋10)÷100＝0.40。
  misconceptions:
    - misconception: 場合ごとの条件付き確率を、そのまま平均すればよい（(0.9＋0.05)÷2）
      correction: 場合の起こりやすさで重みを付ける。病気の人は 1% しかいないので、0.475 ではなく 0.01×0.9＋0.99×0.05＝0.0585
  sources:
    - source: 公式2級範囲表
      locator: 確率モデルの導入（確率変数・確率分布）
  checks:
    - abs(0.01*0.9 + 0.99*0.05 - 0.0585) < 1e-12 and 20+18-8+10 == 40 and abs(0.4*0.5 + 0.3*0.6 - 0.38) < 1e-12 and abs((0.9+0.05)/2 - 0.475) < 1e-12
- id: TERM-bernoulli
  name: ベルヌーイ分布
  en: Bernoulli distribution
  category: 確率分布
  group: GRP-dist-count
  forms: [distribution]
  short: 1回の試行で、成功（1）を確率 p、失敗（0）を確率 1−p でとる分布
  definition: 値 1 を確率 p、値 0 を確率 1−p でとる確率変数の分布。成功を1、失敗を0と数えた1回の試行の結果の分布。
  version: 1
  principle: とる値が 0 と 1 の2つだけなので、確率 p 1つで分布が決まる。平均は 1×p＋0×(1−p)＝p、分散は p(1−p)。1回の成功の回数（0回か1回）とみると、n 回分を足したものが二項分布になる。
  formulas:
  - id: F-bernoulli-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: k
      meaning: X がとる値（成功なら1、失敗なら0）
      range: 0 か 1
      key: k
      kind: value
      domain: {min: 0, max: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "pow", "args": [{"sym": "p"}, {"sym": "k"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"num": 1}, {"sym": "k"}]}]}]}]}
  basis_formula: F-bernoulli-pmf
  conditions:
    math:
    - text: 0≦p≦1
      kind: 要件
      outside: 母数が範囲の外なら、この定義のベルヌーイ分布として扱えない
  example: 表が出る確率 0.5 の硬貨を1回投げ、表を1、裏を0とすると、X はベルヌーイ分布に従う。P(X＝1)＝0.5、P(X＝0)＝0.5。
  counterexample: さいころを1回投げた目そのもの（1〜6）は、値が2つでないのでベルヌーイ分布ではない。「6が出たら1、それ以外は0」と数え直せば、p＝1/6 のベルヌーイ分布になる。
  sources:
  - source: 公式2級範囲表
  checks:
  - 0.5**1*(1-0.5)**0 == 0.5 and 0.5**0*(1-0.5)**1 == 0.5
  - Fraction(1,6)**1*(1-Fraction(1,6))**0 == Fraction(1,6)
  - 'Fraction(1,6)*1 + Fraction(5,6)*0 == Fraction(1,6) and Fraction(1,6)*(1-Fraction(1,6))**2 + Fraction(5,6)*(0-Fraction(1,6))**2 == Fraction(1,6)*Fraction(5,6)'
- id: TERM-sample-mean
  name: 標本平均
  en: sample mean
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ（n は1以上）から作る統計量 X̄＝(X₁＋…＋Xₙ)/n（観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic]
  short: 標本のデータの値を足し、データの個数で割った値
  definition: 標本の値 X₁, …, Xₙ を足して n で割った統計量 X̄。取り直すたびに値が変わりうり、その期待値は母平均 μ、分散は σ²÷n になる（独立に同じ分布から取るとき）。
  version: 1
  formulas:
  - id: F-xbar-expect
    label: 標本平均の期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（取り直したときの平均）
      key: E
      concept: TERM-expect
    - symbol: X̄
      meaning: 標本平均（n 個の値の平均）
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: μ
      meaning: 母平均（1個の値 Xᵢ の期待値）
      key: mu
      concept: TERM-expect
      kind: param
    tree:
      op: eq
      args:
      - op: fn
        name: E
        args:
        - sym: Xbar
      - sym: mu
  - id: F-xbar-var
    label: 標本平均の分散
    symbols:
    - symbol: V( )
      meaning: 分散（取り直したときのばらつき）
      key: V
      concept: TERM-var
    - symbol: X̄
      meaning: 標本平均（n 個の値の平均）
      key: Xbar
      concept: TERM-sample-mean
      kind: rv
    - symbol: σ
      meaning: 母標準偏差（1個の値 Xᵢ のばらつき）
      key: sigma
      concept: TERM-sd
      kind: param
      domain:
        min: 0
    - symbol: n
      meaning: 平均をとる個数（標本の大きさ）
      key: n
      kind: value
      domain:
        min: 1
        integer: true
    tree:
      op: eq
      args:
      - op: fn
        name: V
        args:
        - sym: Xbar
      - op: div
        args:
        - op: pow
          args:
          - sym: sigma
          - num: 2
        - sym: n
    parts:
    - path:
      - 1
      - 0
      name: 1個の分散
      meaning: 1個の値のばらつき σ²。n を増やしても変わらない
    - path:
      - 1
      - 1
      name: 個数
      meaning: n 個を平均すると、大きい値と小さい値が打ち消し合い、分散は n 分の1になる
  principle: 平均すると、大きい値と小さい値が打ち消し合う。独立に取るなら、n 個の合計の分散は nσ² で、平均は合計を n で割るので分散は n² で割って σ²÷n。中心（期待値）は μ のまま動かず、幅だけが細くなる。n を4倍にしても幅（標準偏差）は半分にしかならない。
  conditions:
    math:
    - text: n は1以上の整数
      kind: 要件
      outside: 標本平均が定義されない（0 で割る）
    - text: X₁, …, Xₙ は、どれも期待値が μ
      kind: 仮定
      claim: CLM-20a
      outside: ④-20a は保証されない（E(X̄) は各 Xᵢ の期待値の平均で、μ とは限らない）
    - text: X₁, …, Xₙ は独立に同じ分布に従い、分散 σ² が有限
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（値どうしに相関があると、X̄ の分散は σ²÷n からずれる。正の相関なら大きく、有限の母集団から戻さずに取ると小さい）
    data:
    - 同じ日・同じ客・同じ機械の値のように、似た値どうしがまとまって入っていないかを確かめる（正の相関があると、X̄ の標準偏差は σ÷√n より大きい）
    - 有限の母集団から戻さずに取るなら、母集団の数 N が n より十分大きいかを確かめる（抽出率が大きいと、X̄ の標準偏差は σ÷√n より小さい。{{unit:U17}}）
    - 選ばれ方に偏りがあると、各 Xᵢ の期待値が母平均とずれる（偏り）。どう選んだかを確かめる
  example: 商品1個の重さが平均 50g・標準偏差 12g なら、独立な 36 個の平均重量は期待値 50g、分散 144÷36＝4、標準偏差 2g。
  counterexample: 1人の客を選び、その客の 10 回の購入額を「10個の値」として平均する。同じ客の値どうしは似ていて独立でない。どの客を選んでも、その客の 10 回の額がいつも同じになる極端な場合、X̄＝X₁ なので X̄ の分散は σ² のままで、σ²÷10 にならない。
  misconceptions:
  - misconception: n を増やすと、1個1個のばらつき（標準偏差）も小さくなる
    correction: 小さくなるのは平均 X̄ のばらつきだけ。1個の重さのばらつき 12g は、何個集めても 12g のまま
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - 144 / 36 == 4 and math.sqrt(4) == 2 and 12 ** 2 == 144
- id: TERM-sample-prop
  name: 標本比率
  en: sample proportion
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 各個体が性質をもてば1、もたなければ0とした標本 X₁, …, Xₙ の標本平均 p̂＝(X₁＋…＋Xₙ)/n（性質をもつ個数÷n）
    terms: [TERM-sample-mean]
  short: 標本の中で、ある性質をもつものの割合
  definition: 標本の中で、ある性質をもつもの（買った・不良など）の割合 p̂。性質をもてば1、もたなければ0とした値の標本平均で、取り直すたびに値が変わりうる。
  version: 1
  principle: 比率は 0 と 1 の値の平均なので、標本平均の決まりがそのまま使える。1人の値の期待値は p、分散は p(1−p) なので、独立に n 人を選ぶと p̂ の期待値は p、分散は p(1−p)÷n、標準誤差は √(p(1−p)÷n)。p が 0.5 のとき p(1−p) が最大の 0.25 になるので、p が分からないときは 0.5 で見積もると、必要な人数を少なく見積もらずに済む。
  conditions:
    math:
    - text: n は1以上の整数で、各 Xᵢ は 0 か 1
      kind: 要件
      outside: 標本比率が定義されない（0 と 1 以外の値の平均は割合ではない）
    - text: X₁, …, Xₙ は独立に同じ分布（性質をもつ確率 p）に従う
      kind: 仮定
      claim: CLM-41
      outside: ④-41 は保証されない（p̂ の分散は p(1−p)÷n とは限らない。同じ家族・同じ店の人をまとめて聞くと、似た答えが重なり、分散はこれより大きい。有限の母集団から戻さずに取ると小さい）
    data:
    - 「割合」の分母が何か（聞いた人数か、答えた人数か）を確かめる。分母が違えば別の p̂
  example: 来店客の購入率が p＝0.2 のとき、100人を調べた購入率 p̂ の分散は 0.2×0.8÷100＝0.0016、標準誤差は 0.04。
  counterexample: 5段階の満足度（1〜5点）の平均 3.6 を、5で割った 0.72 を「満足の比率」として √(p(1−p)÷n) に入れることはできない。値が 0 か 1 でないので、平均を5で割っても割合ではなく、0.72×0.28 は1人の値の分散にならない（3.6 をそのまま入れると 3.6×(1−3.6) は負になる）。
  misconceptions:
  - misconception: 比率の標準誤差は、p がいくつでも同じ人数なら同じ
    correction: p(1−p) は p＝0.5 で最大、0 や 1 に近いほど小さい。同じ 400 人でも、p＝0.5 なら標準誤差 0.025、p＝0.1 なら 0.015
  sources:
  - source: 公式2級範囲表
    locator: 標本分布（統計量と標本分布）
  checks:
  - math.isclose(0.2*0.8/100, 0.0016) and math.isclose(math.sqrt(0.0016), 0.04)
  - math.isclose(math.sqrt(0.25/400), 0.025) and math.isclose(math.sqrt(0.09/400), 0.015)
- id: TERM-interval-est
  name: 区間推定
  en: interval estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 信頼係数 1−α（名目）を決め、それに合わせて作った信頼区間を標本から求めて、母数 θ の値の範囲として示す手続き（作り方ごとの保証は、その手続きの成立条件で言う。近似の作り方では、1−α に近づくのは各母数の値ごと：④-19）
    terms: [TERM-conf-level, TERM-ci, TERM-parameter]
  short: 母数の値を、幅をもった区間で推定すること
  definition: 母数の値を、標本から作る区間で推定すること。信頼係数と区間の作り方を決め、標本から区間を求めて示す。
  version: 1
  principle: 点推定に、推定のばらつき（標準誤差）を幅で添える。2級で扱う平均・割合の基本の作り方は「推定値 ± 確率点 × 標準誤差」の形で、信頼係数を上げると確率点が大きくなって広がり、n を増やすと標準誤差が √n に反比例して狭まる。誤差幅を d 以下にしたいときは、n≧(zσ÷d)² を満たす最小の整数が必要な n。
  conditions:
    math:
    - text: 名目の信頼係数 1−α を決め、それに合わせた作り方で標本から区間を作る（正確な作り方なら、母数のどの値でも含む確率が 1−α 以上。近似の作り方なら、母数の値を1つに固定したときの含む確率が n→∞ で 1−α に近づくだけ：④-19）
      kind: 要件
      outside: 名目の「95%」を添えても、母数を含む確率がそれ以上とは限らない
    data:
    - 作り方が前提にする条件（平均の区間なら独立に正規分布、割合の区間なら成功と失敗の数が十分）を、データの取り方と形で確かめる
    - 取り方の偏りは区間の幅に入らない。n を増やして区間を狭くしても、偏りは残る
    - 日の売上のように共通の要因で値どうしが動くと、標準誤差を s÷√n で出した区間は狭すぎうる
  example: 400人中80人が購入したなら、p̂＝0.2、SE＝√(0.2×0.8÷400)＝0.02 で、購入率の（近似の）95%信頼区間は 0.2±1.96×0.02、約 0.161〜0.239。σ＝10 で誤差幅を1にしたいなら、n＝(1.96×10÷1)²≒384.2 で、385人が要る。
  counterexample: 満足の人の6割、不満の人の2割しか答えないアンケートでは、客全体の満足率が0.5でも、回答者の満足率は0.75に近づく。2000人の回答で区間を作ると約 0.731〜0.769 と狭いが、0.5 を含まない。n を増やして狭くしても、取り方の偏りは消えない。
  sources:
  - source: 公式2級範囲表
    locator: 推定（区間推定）
  checks:
  - abs(math.sqrt(0.2*0.8/400) - 0.02) < 1e-12 and abs(0.2-1.96*0.02 - 0.161) < 0.0005 and abs(0.2+1.96*0.02 - 0.239) < 0.0005 and abs((1.96*10/1)**2 - 384.2) < 0.05 and math.ceil((1.96*10/1)**2) == 385
  - abs(0.5*0.6/(0.5*0.6+0.5*0.2) - 0.75) < 1e-12 and abs(0.75-1.96*math.sqrt(0.75*0.25/2000) - 0.731) < 0.0005 and abs(0.75+1.96*math.sqrt(0.75*0.25/2000) - 0.769) < 0.0005
- id: TERM-test
  name: 仮説検定
  en: hypothesis testing
  category: 検定
  forms: [procedure]
  basis:
    text: 母集団の分布についての帰無仮説 H₀ と対立仮説 H₁ を立て、有意水準 α を前もって決め、H₀ が正しいときに検定統計量 T が入る確率が α 以下になる棄却域 R を（H₁ の向きに合わせて）選び、T の観測値が R に入れば H₀ を棄却し、入らなければ棄却しない手続き
    terms: [TERM-h0, TERM-h1, TERM-alpha, TERM-test-stat, TERM-reject]
  short: 母集団についての仮説を立て、その仮説のもとでデータが起こりにくいかどうかで、仮説を棄却するかを決める方法
  definition: 帰無仮説と対立仮説を立て、有意水準を前もって決め、検定統計量が棄却域に入れば帰無仮説を棄却し、入らなければ棄却しない手続き。
  version: 1
  principle: 「差がないと仮定したら、今回のデータはどれくらい珍しいか」で判断する。結論は「棄却する」か「棄却しない」の2つで、棄却しないときも「帰無仮説が正しい」とは言わない。
  conditions:
    math:
    - text: 仮説・有意水準・棄却域を、データを見る前に決める
      kind: 要件
      outside: 誤って棄却する確率が有意水準以下とは限らない
    data:
    - 検定統計量の分布の前提（独立・正規・σ）を、データの取り方と形で確かめる
    - 何度も検定するときは、どれかで誤って棄却する確率が有意水準より大きくなることを考える
  example: H₀：μ＝100、H₁：μ≠100、α＝0.05。σ＝12、n＝36、x̄＝103 なら z＝1.5 で、1.96 より小さいので棄却しない。
  counterexample: 10の売場のデータを見て、差の大きかった売場だけを選んでそこで検定する。何を検定するかをデータを見てから決めていて、要件を外している。
  sources:
  - source: 公式2級範囲表
    locator: 検定（仮説検定の考え方）
  checks:
  - (103-100)/(12/math.sqrt(36)) == 1.5 and 1.5 < 1.96
- id: TERM-quantile
  name: 分位点
  en: quantile
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 量的なデータ（n≧1）を小さい順に並べた x₍₁₎≦…≦x₍ₙ₎ と割合 p（0≦p≦1）について、1＋p(n−1) 番目の位置の値（位置が整数でないときは、前後の2つの値を比例で埋める。線形補間の決め方）
    terms: []
  short: データを小さい順に並べ、決めた割合の位置にくる値（下から10%の位置など）
  definition: 量的なデータを小さい順に並べ、割合 p の位置にくる値。1＋p(n−1) 番目の値とし、位置が整数でないときは、前後の2つの値を比例で埋める（線形補間の決め方）。
  version: 1
  principle: 「下から p の割合の位置の値」を言うので、「90%の客を3分以内に」のような目標の言い方と直接つながる。p＝0.5 の分位点は中央値と一致する。並べた位置で決まるので外れ値に動きにくいが、個数が少ないと、0 や 1 に近い p の分位点は、端の1つ2つの値で決まる。
  conditions:
    math:
    - text: 値が量的
      kind: 要件
      outside: 位置が整数でないとき、前後の2つの値の間を比例で埋められない（順序だけのデータ）。この決め方の分位点としては扱えない
    - text: 割合 p は 0 以上 1 以下
      kind: 要件
      outside: 位置 1＋p(n−1) が1番目より前か n 番目より後になり、分位点は決まらない
    data:
    - 表計算ソフトや本によって、位置の決め方が違う（この教材の四分位数は、中央値で半分に分けて決める）。2つの分位点を比べるときは、決め方をそろえる
    - データが少ないとき、99% のような端の分位点は最大値の近くで決まり、当てにならない
  example: 10人の待ち時間（分）1, 2, 2, 3, 4, 5, 6, 8, 10, 15 の 90% の分位点は、位置が 1＋0.9×9＝9.1 番目。9番目の10と10番目の15の間を 0.1 だけ進んで、10＋0.1×(15−10)＝10.5分。
  counterexample: 4人の満足度が 不満・普通・満足・とても満足 のとき、50% の分位点は位置 1＋0.5×3＝2.5 番目で、「普通」と「満足」のちょうど間になる。順序だけのデータでは、2つの段階の間を比例で埋める値がないので、この決め方の分位点は決まらない。
  misconceptions:
  - misconception: 90% の分位点より大きい値は、いつもちょうど全体の10%
    correction: ちょうど10% になるのは、個数と位置がうまく合うときだけ。10人の待ち時間では 10.5分より長いのは1人で10%だが、9人のデータなら、90% の位置は 1＋0.9×8＝8.2 番目で、それより上は9番目の1人。1÷9≒11% で、ちょうど10% にはならない
  sources:
  - source: 公式2級範囲表
    locator: データの記述（代表値）
  checks:
  - abs(1 + 0.9*9 - 9.1) < 1e-9 and abs(10 + 0.1*(15-10) - 10.5) < 1e-9 and 1 + 0.5*3 == 2.5 and abs(1 + 0.9*8 - 8.2) < 1e-9 and abs(1/9 - 0.11) < 0.005
- id: TERM-range
  name: 範囲
  en: range
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データの最大値から最小値を引いた値
    terms: []
  short: データの最大値から最小値を引いた値
  definition: データの最大値から最小値を引いた値。全部のデータが入る幅。
  version: 1
  principle: 2つの値だけで決まるので、すぐに出せて、全部の値が入る幅（棚の幅・在庫の上下）を直接言える。その代わり、端の1つの値で大きく変わり、間の値がどう並んでいるかは表さない。データが増えると、新しい値が今の幅の外に出ることはあっても、幅が縮むことはないので、日数が多いほど広がりやすい。
  conditions:
    math:
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義の範囲としては扱えない（段階に付けた点では、点の付け方しだいで値が変わる）
    data:
    - 日数（個数）の違うデータの範囲どうしを比べない。日数の多い方が広がりやすい
    - 外れ値1つで決まるので、四分位範囲や標準偏差も並べる
  example: 5日の販売数が 9, 10, 10, 11, 30 なら、範囲は 30−9＝21。棚に全部の日の分を並べられる幅を言うにはそのまま使えるが、21 のうちほとんどは、30個売れた1日で決まっている。
  counterexample: 8, 9, 10, 11, 12 と 8, 10, 10, 10, 12 は、どちらも範囲が4。けれども、標準偏差（n で割る）は約1.41 と約1.26 で、2つ目の方が真ん中にまとまっている。範囲は両端の2つの値しか見ないので、間の並び方の違いを表さない。
  misconceptions:
  - misconception: 日数を増やせば、範囲は落ち着いた値になる
    correction: 日数が増えると、それまでより大きい値・小さい値が出るたびに範囲は広がり、縮むことはない。日数の違う範囲は、そのままでは比べにくい
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - 30 - 9 == 21 and 12 - 8 == 4 and abs(statistics.pstdev([8,9,10,11,12]) - 1.41) < 0.005 and abs(statistics.pstdev([8,10,10,10,12]) - 1.26) < 0.005
- id: TERM-slr
  name: 単回帰
  en: simple linear regression
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 1つの説明変数 x で目的変数 y を表す直線の式 ŷ＝a＋bx（回帰直線）を、最小二乗法で求める分析
    terms: [TERM-ols]
  short: 1つの説明変数で目的変数を表す直線の式（回帰直線）を求める分析
  definition: 1つの説明変数 x で目的変数 y を見込む直線 ŷ＝a＋bx（回帰直線）を、最小二乗法で求める分析。
  version: 1
  principle: 傾きは b＝Σ(x−x̄)(y−ȳ)÷Σ(x−x̄)²（y の値が全部同じでなければ r×s_y÷s_x）、切片は a＝ȳ−b x̄ で、直線は平均の点 (x̄, ȳ) を通る。y を x から見込む向きがあり、|r|＜1 なら、x を y から見込む直線とは別の直線になる。決定係数は相関係数の2乗に等しく、説明変数を増やした形が重回帰分析。
  conditions:
    math:
    - text: x の値ごとの y の平均が、x の1本の直線に乗る
      kind: 仮定
      claim: 最小二乗の回帰直線は、その直線と一致する（回帰直線が x ごとの y の平均を通る）
      outside: 回帰直線が x ごとの y の平均を通るとは保証されない（曲がりがあると、範囲の場所ごとに一方へずれる）
    data:
    - 当てはめたあと、残差を x に対して打ち、曲がりが残っていないかを見る
  example: 5週間の広告回数 x と来店者数 y（百人）(1,3)(2,5)(3,4)(4,6)(5,7)では、ŷ＝2.3＋0.9x。広告が1回多い週は、来店者数が平均して90人多いと見込む。決定係数は0.81。
  counterexample: 値下げ幅 1〜5 と販売数 9, 16, 21, 24, 25 に直線を当てはめると ŷ＝7＋4x で、残差は −2, 1, 2, 1, −2 と、真ん中で正・両端で負に並ぶ。x ごとの y の平均が直線に乗るという仮定が崩れていて、直線は端の見込みを高すぎに、真ん中を低すぎにする。
  misconceptions:
  - misconception: y を x で回帰した直線と、x を y で回帰した直線は同じ直線
    correction: '|r|＜1 なら別の直線。例題Aでは、y を x で見込む直線は ŷ＝2.3＋0.9x、x を y で見込む直線は x̂＝−1.5＋0.9y（y について解くと傾きは約1.11）。どちらも縦か横の一方のずれだけを小さくするから'
  sources:
  - source: 公式2級範囲表
    locator: 回帰分析（単回帰）
  checks:
  - Fraction(sum((x-3)*(y-5) for x, y in [(1,3),(2,5),(3,4),(4,6),(5,7)]), sum((y-5)**2 for y in [3,5,4,6,7])) == Fraction(9, 10) and 3 - Fraction(9,10)*5 == Fraction(-3, 2) and abs(1/0.9 - 1.11) < 0.005
  - '[y-(7+4*x) for x, y in zip([1,2,3,4,5],[9,16,21,24,25])] == [-2,1,2,1,-2]'
- id: TERM-eqtransform
  name: 式の変形
  en: transforming equations
  category: 数学の道具
  forms: [procedure]
  basis:
    text: 等式の両辺に同じ数・式を足す・引く、0 でない同じ数を掛ける・割ることで、解を変えずに別の等式に書き換えること。文字の動く範囲は、元の等式の両辺が定まる値（分母が0にならない値など）とし、書き換えた等式もその範囲で解く。文字を含む式 g で両辺を掛ける・割るときは、その範囲で g が0になる値を別に確かめる（その範囲で解くと、g で掛けた等式の解は「元の解と、g＝0 になる値」、g で割った等式の解は「元の解から、g＝0 になる値を除いたもの」になる）
  short: 等式の両辺に同じ操作をして、知りたい文字について解くこと
  definition: 等式の両辺に同じ操作（同じ数・式を足す・引く、0 でない同じ数を掛ける・割る）をして、解を変えずに知りたい文字だけを片側に残すこと（等式の性質を使う）。文字を含む式で掛け・割りするときは、その式が0になる値を別に確かめる。
  version: 1
  principle: 等式は天びんのつり合いと同じで、両側に同じことをすればつり合いは崩れない（等式の性質）。足す・引く、0 でない数を掛ける・割るは、どれも逆の操作で元に戻せるので、書き換えた等式と元の等式は同じ解をもつ。文字を含む式で掛け・割りすると、その式が0になる値のところで逆に戻せないので、解が増えたり消えたりすることがある。分母を払ったり約分したりすると、文字の動く範囲が黙って広がり、元の等式では使えない値（分母が0になる値）が解に紛れ込むことがあるので、最後に元の範囲の外の値を除く。知りたい文字にかかっている操作を、外側から順に逆の操作で外していく（＋6 は −6 で、×3 は ÷3 で）。統計では、標準化の式 z＝(x−μ)÷σ を x について解いて x＝μ＋zσ とする、割合の式から基準量を求める（基準量＝部分÷割合）、などに使う。
  conditions:
    math:
    - text: 両辺に掛ける数・両辺を割る数は 0 でない
      kind: 要件
      outside: 0 で割る変形は定まらない。0 を掛けると両辺がどちらも 0 になり（0＝0）、元の等式の解が絞れなくなる
    - text: 書き換えた等式も、元の等式の両辺が定まる値の範囲で解き、足す・引く・掛ける・割る式は、その範囲で定まる
      kind: 要件
      outside: 解が変わる。範囲を広げると、元の等式では使えない値が解に加わる（(x²−1)÷(x−1)＝2 は x≠1 の範囲で解がないが、x−1 を掛けて約分した x²−1＝2(x−1) は x＝1 を解にもつ）。分母を払う・約分したあとは、元の範囲の外の値を除く
    - text: 文字を含む式 g で両辺を掛けるときは、文字の動く範囲で g＝0 になる値が、どれも元の等式の解である（g がその範囲で0にならなければ満たす）
      kind: 要件
      outside: 解が増える。g で掛けた等式の解は「元の解と、g＝0 になる値」なので、元の解でない g＝0 の値が加わる（x＝2 の両辺に (x−3) を掛けた x(x−3)＝2(x−3) は x＝3 も満たす）。掛けたあとは、g＝0 の値を元の等式に入れて確かめる
    - text: 文字を含む式 g で両辺を割るときは、元の等式の解のどれでも g が0にならない（g がその範囲で0にならなければ満たす）
      kind: 要件
      outside: 解が消えることがある。g≠0 の範囲で考えた割った等式の解は「元の解から、g＝0 になる値を除いたもの」なので、g＝0 になる解がなくなる（反例の x(x−3)＝2x を x で割ると x＝0 が消える）。割る前に、g＝0 の値を元の等式に入れて、解かどうかを確かめる
    data:
    - 文字で割るとき（σ・n など）は、その文字が 0 でないことを場面から確かめる（標準偏差 0 のデータでは z が決まらない）
  example: 3x＋6＝21 は、両辺から 6 を引いて 3x＝15、両辺を 3 で割って x＝5。z＝(x−60)÷10 で z＝2 なら、両辺に 10 を掛けて 20＝x−60、両辺に 60 を足して x＝80。
  counterexample: x(x−3)＝2x の両辺を式 x で割ると x−3＝2 で x＝5 だけになるが、x＝0 も元の等式を満たす（0×(−3)＝0＝2×0）。元の解 x＝0 で割る式 x が 0 になるので、「元の解のどれでも割る式が0にならない」という要件が崩れ、解が1つ消えた。
  misconceptions:
  - misconception: 移項は、項を反対側へ動かすだけで、符号はそのまま
    correction: 移項は「両辺から同じ数を引く（足す）」こと。3x＋6＝21 の 6 を右へ移すと 21−6 で、符号が変わる
  - misconception: 両辺を 3 で割るとき、一部の項だけ割ればよい（3x＋6＝21 → x＋6＝7）
    correction: 両辺の全体を割る。左辺は (3x＋6)÷3＝x＋2 で、x＋2＝7 から x＝5
  checks:
  - 21 - 6 == 15 and Fraction(15, 3) == 5 and 3*5 + 6 == 21
  - 2*10 == 20 and 20 + 60 == 80 and Fraction(80 - 60, 10) == 2
  - '[x for x in range(-10, 11) if x*(x-3) == 2*x] == [0, 5] and [x for x in range(-10, 11) if x - 3 == 2] == [5]'
  - '[x for x in range(-10, 11) if x*(x-3) == 2*(x-3)] == [x for x in range(-10, 11) if x == 2 or x - 3 == 0] == [2, 3]'
  - '[x for x in range(-10, 11) if x*(x-2) == 2*(x-2)] == [x for x in range(-10, 11) if x == 2] == [2]'
  - '[x for x in range(-10, 11) if x != 1 and Fraction(x*x - 1, x - 1) == 2] == [] and [x for x in range(-10, 11) if x*x - 1 == 2*(x - 1)] == [1]'
  - '[x for x in range(-10, 11) if x*(x-3) == 2*x and x != 0] == [x for x in range(-10, 11) if x != 0 and x - 3 == 2] == [5]'
  - Fraction(21, 3) - 6 == 1 and Fraction(3*5 + 6, 3) == 5 + 2 and 7 - 2 == 5
- id: TERM-function
  name: 関数
  en: function
  category: 数学の道具
  forms: [function]
  basis:
    text: 入れてよい値の集まり（定義域）D の値 x の1つ1つに、出てくる値をちょうど1つ対応させる約束 f。x に対応する値を f(x) と書く
  short: 入れた値の1つ1つに、出てくる値をちょうど1つ決める約束
  definition: 入れる値 x の1つ1つに、出てくる値をちょうど1つ対応させる約束。x に対応する値を f(x) と書き、「f に x を入れた結果」と読む。
  version: 1
  principle: 同じ値を入れれば、いつも同じ値が出てくる。f(3) は「x のところに 3 を入れて計算した結果」で、f と 3 の掛け算ではない。f(x)＝ax＋b の形なら、x が 1 増えるごとに f(x) は a ずつ増える（傾き）。統計では、確率変数（結果の1つ1つに数を対応させる）・確率関数・確率密度関数・回帰直線の ŷ＝a＋bx が、どれも関数の形をしている。
  conditions:
    math:
    - text: 入れてよい値の範囲（定義域）が決まっている
      kind: 要件
      outside: どの値を入れてよいかが決まらず、関数として定まらない（f(x)＝1÷x は x＝0 を入れられないので、定義域から 0 を除く）
    data:
    - 表で与えられた対応（重さごとの送料など）は、同じ入力に違う出力が書かれていないかを確かめてから関数として扱う
  example: 送料 f(x)＝2x＋5（百円、x は重さ kg）なら、f(4)＝2×4＋5＝13（1,300円）。x が 1 増えると f(x) は 2（200円）増える。
  counterexample: 「2乗すると x になる y」を x から決めようとすると、x＝4 には y＝2 と y＝−2 の2つが対応し、x＝−1 には（実数の）y がない。値がちょうど1つ決まるという定義を満たさないので、この対応は x から y への関数ではない（逆の向きの y から x＝y² は関数）。
  misconceptions:
  - misconception: f(3) は f×3 のこと
    correction: f(3) は「f に 3 を入れた結果」。f(x)＝2x＋1 なら f(3)＝2×3＋1＝7
  checks:
  - 2*4 + 5 == 13 and (2*5 + 5) - (2*4 + 5) == 2 and 2*3 + 1 == 7
  - '[y for y in range(-5, 6) if y*y == 4] == [-2, 2] and [y for y in range(-5, 6) if y*y == -1] == []'
- id: TERM-data-std
  name: データの標準化
  en: standardization of data
  category: 要約（代表値・ばらつき）
  forms: [operation]
  basis:
    text: 量的変数のデータ x₁, …, xₙ の各値から平均 x̄ を引き、データの標準偏差 √v（v は n で割ったデータの分散。0 でない）で割って、zᵢ＝(xᵢ−x̄)÷√v（z得点）に直すこと（n−1 で割った不偏分散の平方根で割るものも同じ名前で呼ぶ。そのとき z の、n−1 で割って求めた標準偏差が1）
    terms: [TERM-data-sd]
  short: データの各値から平均を引き、標準偏差で割って、平均0・標準偏差1 の物差しに直すこと
  definition: データの各値から平均を引き、データの標準偏差で割って、平均0・標準偏差1 のデータ（z得点）に直すこと。
  version: 1
  labs:
  - {id: LAB-z, preset: s1-z, purpose: 単位やばらつきの違うものを z得点でそろえて比べる}
  principle: z得点は「平均から標準偏差いくつ分離れているか」。単位の違うデータや、平均・ばらつきの違う集団の値を、同じ物差しで比べられる。直した z のデータは平均0、標準偏差1（割った標準偏差と同じ割り方で求めたとき。n−1 で割った標準偏差で割れば、n−1 で割った標準偏差が1）。平均を引いて割るだけなので、ヒストグラムの形は変わらない。偏差値は 50＋10×z で、z の目盛りをもう一度替えたもの。確率変数の側の同じ操作は標準化（期待値と標準偏差で行う）。
  conditions:
    math:
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義のデータの標準化としては扱えない（段階に付けた点では、点の付け方しだいで z が変わる）
    - text: データの標準偏差が0でない
      kind: 要件
      outside: 全部の値が同じ（標準偏差0）なので、0で割ることになり z得点が定まらない
    data:
    - 比べたい集団の平均・標準偏差で割っているか（模試の偏差値のように、自分の入っていない基準集団の平均・標準偏差を使うと、手元のデータの z は平均0・標準偏差1 にならない）
    - 標準偏差を n で割ったか n−1 で割ったかをそろえる（比べる2つの z で割り方が違うと、同じ物差しにならない）
  example: 平均60点・標準偏差10点のテストで80点は、z＝(80−60)÷10＝2（偏差値は 50＋10×2＝70）。平均70点・標準偏差5点のテストの80点も z＝2 で、2つの80点は集団の中で同じ位置。
  counterexample: 3日の販売数が 5, 5, 5 個なら、データの標準偏差は0で、z＝(5−5)÷0 は定まらない。標準偏差が0でないという要件が崩れると、z得点で比べることができない（ばらつきがないので、どの日も平均と同じ位置としか言えない）。
  misconceptions:
  - misconception: 偏差値50は、順位がちょうど真ん中の人
    correction: 偏差値50は平均の位置（z＝0）。右に裾の長いデータでは平均が中央値より大きいことが多く、そのときは偏差値50未満の人が半分以上になる
  - misconception: 標準化すると、データの分布は正規分布になる
    correction: 平均を引いて標準偏差で割るだけなので、ヒストグラムの形は元のまま（右に裾が長ければ、z も右に裾が長い）
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - Fraction(80 - 60, 10) == 2 and 50 + 10*2 == 70 and Fraction(80 - 70, 5) == 2
  - statistics.pstdev([5, 5, 5]) == 0
  - '(lambda d: abs(statistics.mean([(x - statistics.mean(d))/statistics.pstdev(d) for x in d])) < 1e-12 and abs(statistics.pstdev([(x - statistics.mean(d))/statistics.pstdev(d) for x in d]) - 1) < 1e-12)([2, 4, 6, 9])'
- id: TERM-std-normal
  name: 標準正規分布
  en: standard normal distribution
  category: 確率分布
  group: GRP-dist-cont
  forms: [distribution]
  basis:
    text: 正規分布 N(μ, σ²) で μ＝0・σ＝1 としたもの N(0, 1)。確率密度は φ(z)＝e^(−z²/2)÷√(2π)（z は実数全体）
    terms: [TERM-normal]
  short: 平均0・標準偏差1の正規分布 N(0, 1) で、正規分布に従う量を標準化するとこの分布に従う
  definition: 平均0・標準偏差1の正規分布 N(0, 1)。正規分布に従う確率変数を標準化した Z はこの分布に従うので、1つの表でどの正規分布の確率も読める。
  version: 1
  figures: [FIG-U16-stdnormal]
  principle: 0を中心に左右対称な釣鐘の形で、−1〜1 に約68.3%、−1.96〜1.96 に95%が入る。P(Z≦z) を1つの表（標準正規分布表）にしておけば、標準化 (X−μ)÷σ を通して、どの N(μ, σ²) の確率もこの表で読める。二項分布の正規近似・中心極限定理・自由度を大きくした t 分布が近づく先もこの分布で、カイ二乗分布・t 分布はこの分布から作る。
  conditions:
    math: []   # 要件の行はない。仮定（元が正規分布）は主張 ④-2 の条件（#532）
    data:
    - 標準正規分布表で確率を読むのは、標準化した量がこの分布に従う（元が正規分布）か、近づく（中心極限定理・正規近似の目安を満たす）と言えるときだけ
  example: X が N(60, 10²) に従うとき、P(X≧80)＝P(Z≧(80−60)÷10)＝P(Z≧2)≒0.0228。上側5%の点は 1.645、両側5%の点は ±1.96。
  counterexample: 平均1・標準偏差1の指数分布に従う X を標準化した Z＝(X−1)÷1＝X−1 は、平均0・標準偏差1だが標準正規分布ではない。P(Z≦−1)＝P(X≦0)＝0（標準正規分布なら約0.159）、P(Z＞2)＝P(X＞3)＝e⁻³≒0.0498（標準正規分布なら約0.0228）。
  misconceptions:
  - misconception: N(60, 100) に従う X を標準化するときは、(X−60)÷100 とする
    correction: N(μ, σ²) の2つ目は分散 σ²。割るのは標準偏差 σ＝√100＝10 で、Z＝(X−60)÷10。100 で割ると、Z の標準偏差は 0.1 になり、標準正規分布表で読めない
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005 and abs(2*statistics.NormalDist().cdf(1.96)-1-0.95)<0.0005
  - round(1-statistics.NormalDist(60, 10).cdf(80), 4) == 0.0228 and round(1-statistics.NormalDist().cdf(2), 4) == 0.0228
  - abs(statistics.NormalDist().inv_cdf(0.95)-1.645)<0.0005
  - abs(statistics.NormalDist().cdf(-1)-0.159)<0.0005 and abs(math.exp(-3)-0.0498)<0.00005
  - math.sqrt(100) == 10 and abs(10/100 - 0.1) < 1e-12
- id: TERM-uncorr
  name: 無相関
  en: uncorrelated
  category: 確率分布
  group: GRP-dist-base
  forms: [property]
  basis:
    text: 分散が有限の2つの確率変数 X・Y で、共分散 Cov(X, Y)＝0 であること
    terms: [TERM-cov]
  short: 2つの確率変数の共分散が0で、直線的に一緒に増える・減る傾向がないこと
  definition: 2つの確率変数の共分散が0であること。
  version: 1
  principle: 共分散は、期待値から同じ向きにずれるか逆向きにずれるかの、直線的な傾向だけを測る。だから無相関は「直線的に一緒に動く傾向がない」ことで、関係がないことではない。独立なら無相関（④-13）だが、逆は一般には成り立たない。無相関なら和の分散の共分散の項が消え、V(X＋Y)＝V(X)＋V(Y)。
  conditions:
    math:
    - text: X・Y の分散が有限
      kind: 要件
      terms: [TERM-var]
      outside: この教材の共分散（分散が有限を前提にした定義）が定まらないので、この定義の無相関として扱えない
    data:
    - データの相関係数が0に近いことは、直線的な傾向が弱い手掛かりで、関係がないことの証拠ではない。散布図で、曲がった関係や群の混ざりがないかを見る
  example: 2枚の硬貨を別々に投げ、表なら1・裏なら0とする X・Y は、4通りの (X, Y) が 1/4 ずつ。E(XY)＝P(X＝1, Y＝1)＝1/4、E(X)E(Y)＝1/2×1/2＝1/4 なので、Cov(X, Y)＝0 で無相関。
  counterexample: X が −2・−1・1・2 を確率 1/4 ずつとり Y＝X² のとき、値が0について対称なので E(X)＝0・E(X³)＝0 で、Cov(X, Y)＝E(X³)−E(X)E(X²)＝0。無相関だが、Y は X で決まる。P(X＝1, Y＝4)＝0 なのに P(X＝1)P(Y＝4)＝1/4×1/2＝1/8 で、独立ではない。それでも V(X)＝5/2・V(Y)＝9/4・V(X＋Y)＝19/4 で、和の分散は分散の和になる。
  misconceptions:
  - misconception: 和の分散が分散の和 V(X)＋V(Y) になるには、独立が要る
    correction: V(X＋Y)＝V(X)＋V(Y)＋2Cov(X, Y) なので、要るのは無相関（共分散0）だけ。独立はその十分条件の1つ
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - sum(Fraction(1,4)*x*y for x in (0,1) for y in (0,1)) == Fraction(1,4) and sum(Fraction(1,4)*x for x in (0,1) for y in (0,1))*sum(Fraction(1,4)*y for x in (0,1) for y in (0,1)) == Fraction(1,4)
  - sum(Fraction(1,4)*x*x*x for x in [-2,-1,1,2]) == 0 and sum(Fraction(1,4)*x for x in [-2,-1,1,2]) == 0 and sum(Fraction(1,4)*x*(x*x) for x in [-2,-1,1,2]) - sum(Fraction(1,4)*x for x in [-2,-1,1,2])*sum(Fraction(1,4)*x*x for x in [-2,-1,1,2]) == 0
  - sum(Fraction(1,4) for x in [-2,-1,1,2] if x == 1 and x*x == 4) == 0 and sum(Fraction(1,4) for x in [-2,-1,1,2] if x == 1)*sum(Fraction(1,4) for x in [-2,-1,1,2] if x*x == 4) == Fraction(1,8)
  - '(lambda v: v([x for x in [-2,-1,1,2]]) == Fraction(5,2) and v([x*x for x in [-2,-1,1,2]]) == Fraction(9,4) and v([x+x*x for x in [-2,-1,1,2]]) == Fraction(19,4))(lambda zs: sum(Fraction(1,4)*z*z for z in zs) - sum(Fraction(1,4)*z for z in zs)**2)'
- id: TERM-data-var
  name: データの分散
  en: variance of data
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 量的変数のデータ x₁, …, xₙ（n≧1）の偏差の2乗の平均 {(x₁−x̄)²＋…＋(xₙ−x̄)²}/n
    terms: [TERM-dev]
  short: データの各値の偏差を2乗して平均した値で、データのばらつきの大きさを表す
  definition: 量的なデータの偏差の2乗の平均。偏差平方和を個数 n で割った値で、手元のデータそのもののばらつきを表す。
  version: 1
  principle: 偏差はそのまま足すと必ず0になるので、2乗して符号を消してから平均する。2乗するので平均から遠い値ほど大きく効き、単位は元の単位の2乗（個²）になる。全部の値に同じ数を足しても変わらず、全部を b 倍すると b² 倍になる。n で割るこの分散は手元のデータの記述に使い、母集団の分散を標本から推し量るときは、n−1 で割る不偏分散を使う。
  conditions:
    math:
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義の分散としては扱えない（段階に付けた点〔満足度の1〜5点〕では、点の付け方しだいで値が変わる）
    data:
    - 単位が2乗になるので、ばらつきの大きさを言葉で伝えるときは、平方根の標準偏差を使う
    - 手元のデータを記述するのか、母集団を推し量るのかで、n で割るか n−1 で割るかを決める
  example: 売場Aの5日の販売数 8, 9, 10, 11, 12 は、平均10、偏差 −2, −1, 0, 1, 2、偏差平方和 4＋1＋0＋1＋4＝10 で、分散は 10÷5＝2（個²）。
  counterexample: ある店の満足度（とても不満20人・不満10人・普通0人・満足10人・とても満足60人）に 1〜5点を付けると、分散は約2.76。「とても満足」だけを4.1点に付け直すと、約1.66 に変わる。回答は同じなのに、点の付け方で分散が変わる。差に同じ意味があるという要件の外では、分散の値は点の付け方を表しているにすぎない。
  misconceptions:
  - misconception: 分散は、平均からどれだけずれているかの平均
    correction: 分散はずれの「2乗」の平均で、単位も2乗（個²）になる。ずれの大きさを元の単位で言うなら、平方根をとった標準偏差を使う
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - sum((x-10)**2 for x in [8,9,10,11,12]) == 10 and Fraction(10, 5) == 2
  - abs(0.2*2.8**2 + 0.1*1.8**2 + 0.1*0.2**2 + 0.6*1.2**2 - 2.76) < 1e-9 and abs(0.2*1 + 0.1*2 + 0.1*4 + 0.6*4.1 - 3.26) < 1e-9 and abs(0.2*(1-3.26)**2 + 0.1*(2-3.26)**2 + 0.1*(4-3.26)**2 + 0.6*(4.1-3.26)**2 - 1.66) < 0.005
- id: TERM-data-sd
  name: データの標準偏差
  en: standard deviation of data
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データの分散の正の平方根（データの値と同じ単位のばらつき）
    terms: [TERM-data-var]
  short: データの分散の正の平方根で、データのばらつきを元の単位で表す
  definition: データの分散の正の平方根。手元のデータのばらつきを、元の単位で表す。
  labs:
  - {id: LAB-z, preset: s1-sigma, purpose: 標準偏差が広がると、同じ値の z得点がどう変わるかを見る}
  version: 1
  principle: 分散の単位（個²）を平方根で元に戻すので、「平均からおよそこのくらい離れる」を同じ単位で言える。全部の値を b 倍すると |b| 倍になり、同じ数を足しても変わらない。2乗してから平均するので、平均から遠い値ほど大きく効く。
  conditions:
    math:
    - text: 値の差に、どこでも同じ意味がある
      kind: 要件
      outside: この定義の標準偏差としては扱えない（段階に付けた点では、点の付け方しだいで値が変わる）
    data:
    - n で割った分散の平方根か、n−1 で割った不偏分散の平方根かを、値に添える
    - 外れ値1つで大きく変わるので、外れ値があるときは四分位範囲も並べる
  example: 売場Aの5日の販売数 8, 9, 10, 11, 12 は、分散が2（個²）なので、標準偏差は √2≒1.41個。
  counterexample: 8, 9, 10, 11, 12 の標準偏差は約1.41個だが、最後の12が32だと、平均14・偏差平方和410・分散82 で、標準偏差は約9.06個になる。5日のうち4日は8〜11個にまとまっているのに、1日の値で「ふつうのばらつき」が6倍以上に見える。標準偏差は、外れ値があるとき、多くの日のばらつきを表さない。
  misconceptions:
  - misconception: 標準偏差は、平均からのずれの大きさの平均
    correction: 標準偏差は、ずれの2乗の平均の平方根。8, 9, 10, 11, 12 では、ずれの大きさの平均は (2＋1＋0＋1＋2)÷5＝1.2個だが、標準偏差は約1.41個で、同じではない
  sources:
  - source: 公式2級範囲表
    locator: データの記述（ばらつき）
  checks:
  - abs(2**0.5 - 1.41) < 0.005 and sum((x-14)**2 for x in [8,9,10,11,32]) == 410 and Fraction(410, 5) == 82 and abs(82**0.5 - 9.06) < 0.005 and Fraction(2+1+0+1+2, 5) == Fraction(6, 5)
- id: TERM-data-cov
  name: データの共分散
  en: covariance of data
  category: 相関・回帰
  forms: [number]
  basis:
    text: 量的な2変数のデータ (x₁, y₁), …, (xₙ, yₙ)（n≧1）の、x と y の偏差の積の平均 {(x₁−x̄)(y₁−ȳ)＋…＋(xₙ−x̄)(yₙ−ȳ)}/n
    terms: [TERM-dev]
  short: 2つの量的変数のデータで、偏差の積を平均した値で、2つが同じ向きにずれるか逆向きにずれるかを表す
  definition: 2つの量的変数のデータで、x と y の偏差の積を平均した値。正なら同じ向きにずれる組が、負なら逆向きにずれる組が多く効いている。
  version: 1
  principle: 散布図を平均の十字で4つに分けると、右上と左下の点は偏差の積が正、左上と右下の点は負になる。積を平均すると、どちらの側の点が多く、平均から遠いかで符号と大きさが決まる。単位は x と y の単位の積で、x の単位を千円から円に替えると1000倍になるので、値の大きさで関係の強さは比べられない（強さは相関係数で比べる）。2つの量の和のばらつきは、それぞれの分散の和に共分散の2倍を足したものになる。n で割るこの形は手元のデータの記述に使い、n−1 で割る形もある（相関係数はどちらで求めても同じ）。
  conditions:
    math:
    - text: 2つの値が、同じ個体の組になっている
      kind: 要件
      outside: この定義の共分散としては扱えない（同じ値でも組み方で正にも負にもなり、組み方を表すだけになる）
    - text: どちらの変数も、値の差にどこでも同じ意味がある
      kind: 要件
      outside: この定義の共分散としては扱えない（段階に付けた点〔満足度の1〜5点〕では、点の付け方しだいで値も符号も変わりうる）
    data:
    - 偏差の大きい点ほど積が大きく効くので、外れた1点で値も符号も大きく動く。先に散布図で外れた点を見る
  example: 売場A（8〜12個）と売場C（18〜22個）の5日が同じ向きに動いた組 (8,18)(9,19)(10,20)(11,21)(12,22) では、偏差の積は 4, 1, 0, 1, 4 で、データの共分散は 10÷5＝2（個²）。
  counterexample: 同じ値のまま、売場C の値を逆の順に組み直すと (8,22)(9,21)(10,20)(11,19)(12,18) で、偏差の積は −4, −1, 0, −1, −4、共分散は −2 になる。値の集まりは同じでも、組み方で符号まで変わる。同じ日の組という要件を外すと、共分散はデータではなく組み方を表す。
  misconceptions:
  - misconception: 共分散が大きいほど、2つの変数の関係が強い
    correction: 共分散は単位とそれぞれの散らばりの大きさで変わる（x を千円から円にすると1000倍）。関係の強さは、それぞれの標準偏差で割った相関係数で比べる
  sources:
  - source: 公式2級範囲表
    locator: データの記述（共分散）
  checks:
  - sum((a-10)*(b-20) for a, b in zip([8,9,10,11,12],[18,19,20,21,22])) == 10 and Fraction(10, 5) == 2
  - sum((a-10)*(b-20) for a, b in zip([8,9,10,11,12],[22,21,20,19,18])) == -10 and Fraction(-10, 5) == -2
