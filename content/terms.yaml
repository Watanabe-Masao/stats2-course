# 用語＝概念。id は変えない（ネットワークでは stats2:TERM-…）。説明（definition など）がある用語は概念として検査し、ネットワーク用に書き出す。まだ説明のない用語の本文は旧版の用語辞典にある（publish/legacy.yaml）。
- id: TERM-perm
  name: 順列
  en: permutation
  category: 数学の道具
  short: 異なるものから順番を区別して並べる並べ方と、その数
- id: TERM-comb
  name: 組合せ
  en: combination
  category: 数学の道具
  forms: [number]
  definition: n 個の中から、順番を区別せずに k 個を選ぶ選び方の数。ₙCₖ と書く。
  version: 1
  principle: n 個を1列に並べる n! 通りのうち、選んだ k 個の中の並び（k! 通り）と、残した n−k 個の中の並び（(n−k)! 通り）は区別しないので、その分で割る。
  formulas:
  - id: F-comb-def
    label: 階乗で表す
    symbols:
    - symbol: ₙCₖ
      meaning: n 個から k 個を選ぶ選び方の数
      key: comb
      concept: TERM-comb
    - symbol: n
      meaning: 全体の個数
      key: n
      kind: value
      domain: {min: 0, integer: true}
    - symbol: k
      meaning: 選ぶ個数
      key: k
      kind: value
      domain: {min: 0, max: n, integer: true}
    - symbol: n!
      meaning: 階乗（1からその数までを掛けた数）
      key: fact
      concept: TERM-fact
    tree: {"op": "eq", "args": [{"op": "fn", "name": "comb", "args": [{"sym": "n"}, {"sym": "k"}]}, {"op": "div", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "n"}]}, {"op": "mul", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "k"}]}, {"op": "fn", "name": "fact", "args": [{"op": "sub", "args": [{"sym": "n"}, {"sym": "k"}]}]}]}]}]}
    parts:
    - path: [1, 0]
      name: 全部の並べ方
      meaning: n 個を1列に並べる並べ方の数
    - path: [1, 1, 0]
      name: 選んだ中の並べ方
      meaning: 選んだ k 個は順番を区別しないので、その並べ方の数で割る
    - path: [1, 1, 1]
      name: 残した中の並べ方
      meaning: 残した n−k 個も順番を区別しないので、その並べ方の数で割る
  conditions:
    math:
    - n と k は整数で、0 ≦ k ≦ n
    data:
    - 「順番を区別しない」選び方かを確かめる。役（委員長・副委員長）や順位があるなら順列で数える
  example: 5人から2人の係を選ぶ選び方は ₅C₂＝5!÷(2!×3!)＝120÷12＝10 通り。
  counterexample: 5人から委員長と副委員長を1人ずつ選ぶときは役が違うので順番を区別する。10 通りではなく 5×4＝20 通り（順列）。
  misconceptions:
  - misconception: ₁₀C₃ と ₁₀C₇ は別の数
    correction: 選ぶ3人を決めることは、残す7人を決めることと同じ。ₙCₖ＝ₙCₙ₋ₖ で、どちらも120
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - math.comb(5,2)==10 and math.factorial(5)==120 and math.factorial(2)*math.factorial(3)==12 and 120//12==10
  - math.perm(5,2)==20 and 5*4==20
  - math.comb(10,3)==math.comb(10,7)==120
- id: TERM-sigma
  name: 総和記号（Σ）
  en: summation
  category: 数学の道具
  short: 添え字を1つずつ変えながら、項をすべて足し合わせることを表す記号
- id: TERM-fact
  name: 階乗
  en: factorial
  category: 数学の道具
  forms: [number]
  definition: 1 から n までの整数をすべて掛けた数。n! と書く。0! は 1 と決める。
  version: 1
  principle: n 個のものを1列に並べる並べ方の数。先頭は n 通り、次は n−1 通り……と1つずつ減るので、それを全部掛け合わせる。
  formulas:
  - id: F-fact-def
    label: 1 から n までの積
    symbols:
    - symbol: n!
      meaning: n の階乗
      key: fact
      concept: TERM-fact
    - symbol: n
      meaning: 並べるものの個数
      key: n
      kind: value
      domain: {min: 0, integer: true}
    - symbol: i
      meaning: 掛ける数（1 から n まで動く）
      key: i
      kind: index
    tree: {"op": "eq", "args": [{"op": "fn", "name": "fact", "args": [{"sym": "n"}]}, {"op": "prod", "var": "i", "lower": {"num": 1}, "upper": {"sym": "n"}, "args": [{"sym": "i"}]}]}
  conditions:
    math:
    - n は0以上の整数（0! は 1 と決める。何も並べない並べ方は1通り）
    data:
    - n が大きいとすぐに大きくなる（10! は 3628800）。計算では約分してから掛けると楽になる
  example: 3人を1列に並べる並べ方は 3!＝3×2×1＝6 通り。
  counterexample: 赤玉2個と白玉1個のように同じものを含む並べ方は 3!＝6 通りではない。赤どうしを区別しないので 6÷2!＝3 通り。
  misconceptions:
  - misconception: 0! は 0
    correction: 0! は 1。何も並べない並べ方は1通りで、ₙCₙ＝n!÷(n!×0!)＝1 とも合う
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - math.factorial(3)==6==3*2*1 and math.factorial(10)==3628800
  - math.factorial(3)//math.factorial(2)==3 and math.factorial(0)==1 and math.comb(4,4)==1
- id: TERM-population
  name: 母集団
  en: population
  category: データと変数
  short: 調べたい対象の全体（知りたい性質をもつ人・物のすべて）
- id: TERM-sample
  name: 標本
  en: sample
  category: データと変数
  short: 母集団から、調べるために取り出した一部
- id: TERM-parameter
  name: 母数
  en: parameter
  category: データと変数
  forms: [number]
  short: 母集団の性質を表す値（母平均・母分散など）で、ふつうは分からないので標本から推定する
- id: TERM-statistic
  name: 統計量
  en: statistic
  category: データと変数
  forms: [rv]
  short: 標本のデータから計算して求める値（標本平均・標本分散など）
- id: TERM-sample-space
  name: 標本空間
  en: sample space
  category: 確率
  forms: [event]
  basis:
    text: 1回の試行で起こりうる結果を、重なりなく漏れなく全部集めた集合 Ω
    terms: []
  short: 1回の試行で起こりうる結果を、すべて集めた集合
- id: TERM-event
  name: 事象
  en: event
  category: 確率
  forms: [event]
  basis:
    text: 標本空間 Ω の部分集合（起こりうる結果のうち、注目するものの集まり）
    terms: [TERM-sample-space]
  short: 標本空間の中で、注目する結果を集めた部分集合
- id: TERM-frame
  name: 抽出枠
  en: sampling frame
  category: データと変数
  short: 標本を選ぶときに使う、母集団の名簿や一覧
- id: TERM-random-sampling
  name: 無作為抽出
  en: random sampling
  category: 調査・実験
  short: 母集団のどの要素も決まった確率で選ばれるように、くじ引きのように標本を選ぶこと
- id: TERM-bias
  name: バイアス（偏り）
  en: bias
  category: 調査・実験
  short: 調査や推定の結果が、真の値から一定の向きにずれること
- id: TERM-qual
  name: 質的変数
  en: qualitative variable
  category: データと変数
  forms: [rv]
  short: 値が分類（性別・血液型など）を表し、そのままでは足したり平均したりできない変数
- id: TERM-quant
  name: 量的変数
  en: quantitative variable
  category: データと変数
  short: 値が数量（長さ・金額など）を表し、足したり平均したりできる変数
- id: TERM-scale
  name: 尺度
  en: level of measurement
  category: データと変数
  short: データの値がもつ情報の段階で、名義・順序・間隔・比例の4つがある
- id: TERM-mode
  name: 最頻値
  en: mode
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データに現れる値のうち、現れる回数（度数）がいちばん多い値（いちばん多い値が2つ以上あれば、それぞれが最頻値）
    terms: []
  short: データの中でいちばん多く現れる値（度数分布では度数が最大の階級の値）
- id: TERM-median
  name: 中央値
  en: median
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 値に順序があるデータ x₁, …, xₙ（n≧1。順序があることは定義の要件）を小さい順に並べたとき、真ん中の位置の値（n が奇数なら (n＋1)/2 番目、偶数なら n/2 番目と n/2＋1 番目の2つの値の和の半分。偶数のときは値が量的であることも要件で、順序だけのデータではこの定義では定まらない）
    terms: []
  short: データを小さい順に並べたとき、真ん中にくる値
- id: TERM-freqtable
  name: 度数分布表
  en: frequency table
  category: 図表
  short: データを階級に分け、各階級に入るデータの個数（度数）を並べた表
- id: TERM-hist
  name: ヒストグラム
  en: histogram
  category: 図表
  short: 度数分布表の各階級の度数を、隙間のない柱の面積で表した図
- id: TERM-boxplot
  name: 箱ひげ図
  en: box plot
  category: 図表
  short: 最小値・第1四分位数・中央値・第3四分位数・最大値で、分布の位置と広がりを表した図
- id: TERM-quartile
  name: 四分位数
  en: quartile
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データを小さい順に並べ、中央値を第2四分位数 Q₂、中央値より下の半分の中央値を第1四分位数 Q₁、上の半分の中央値を第3四分位数 Q₃ とする（n が奇数のときは、真ん中の値を両方の半分から除く。n≧2 で、値が量的であることは定義の要件）
    terms: [TERM-median]
  short: データを小さい順に並べて4等分する位置の値（第1・第2・第3四分位数）
- id: TERM-iqr
  name: 四分位範囲
  en: interquartile range
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 第3四分位数から第1四分位数を引いた値 Q₃−Q₁（真ん中の半分のデータの広がり）
    terms: [TERM-quartile]
  short: 第3四分位数から第1四分位数を引いた値で、真ん中の半分のデータの広がり
- id: TERM-outlier
  name: 外れ値
  en: outlier
  category: 要約（代表値・ばらつき）
  forms: [property]
  basis:
    text: データの値のうち、決めた基準でほかの値から大きく離れているとみなすもの。この教材の基準は箱ひげ図の柵で、Q₁−1.5×(Q₃−Q₁) より小さいか、Q₃＋1.5×(Q₃−Q₁) より大きい値（z の大きさなどほかの判定は、外れ値の候補を見つける別の目安で、この定義の外）
    terms: [TERM-iqr]
  short: ほかのデータから大きく離れた値（箱ひげ図では、箱から四分位範囲の1.5倍より外の値など）
- id: TERM-ratio
  name: 割合
  en: ratio
  category: データと変数
  short: 全体に対する部分の大きさを、全体を1（または100%）として表した値
- id: TERM-point
  name: パーセントポイント
  en: percentage point
  category: データと変数
  short: 2つの割合（%）の差を、%どうしの引き算で表した単位
- id: TERM-dev
  name: 偏差
  en: deviation
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ の各値 xᵢ から平均 x̄ を引いた値 xᵢ−x̄（平均からのずれ）
    terms: [TERM-mean]
  short: 1つのデータの値から平均を引いた値（平均からのずれ）
- id: TERM-var
  name: 分散
  en: variance
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-var-def
  definition: 確率変数が期待値からどれだけばらつくかを、ずれの2乗の期待値で表した量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s1-var, purpose: ずれの2乗の期待値として分散を組み立てる}
  principle: (X−μ)² の期待値。2乗するので向きが消え、大きなずれほど重く効く。単位は元の単位の2乗になる。
  formulas:
  - id: F-var-def
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: μ
      meaning: X の期待値 E(X)
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "fn", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "mu"}]}, {"num": 2}]}], "name": "E"}, {"op": "sub", "args": [{"op": "fn", "args": [{"op": "pow", "args": [{"sym": "X"}, {"num": 2}]}], "name": "E"}, {"op": "pow", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"num": 2}]}]}]}
  - id: F-var-linear
    label: 1次式の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 掛ける定数（2乗で効く）
      key: a
      kind: const
    - symbol: b
      meaning: 足す定数（ばらつきは変えない）
      key: b
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"sym": "X"}]}, {"sym": "b"}]}], "name": "V"}, {"op": "mul", "args": [{"op": "pow", "args": [{"sym": "a"}, {"num": 2}]}, {"op": "fn", "args": [{"sym": "X"}], "name": "V"}]}]}
  conditions:
    math:
    - text: 2乗の期待値 E(X²) が有限（このとき E(X) も有限になり、E((X−μ)²) が有限の値に定まる）
      kind: 要件
      outside: この定義の分散（有限の値）としては扱えない（∞ になるか定まらない）
    data:
    - 外れ値が1つあると大きく変わる（2乗で効く）ので、分布の形も一緒に見る
  example: さいころの目の分散は 91÷6−3.5²＝35/12≒2.92。
  counterexample: X＋Y の分散は、独立（または共分散が0）でなければ V(X)＋V(Y) にならない。
  misconceptions:
  - misconception: 分散は「平均からのずれの平均」
    correction: ずれをそのまま平均すると0になる。2乗してから平均する
  - misconception: 分散と標準偏差は同じ単位
    correction: 分散は元の単位の2乗。元の単位で言うなら平方根の標準偏差
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(sum(i*i for i in range(1,7)),6)-Fraction(7,2)**2==Fraction(35,12)
  - abs(35/12-2.92)<0.005
  - sum(i*i for i in range(1,7))==91
- id: TERM-unbvar
  name: 不偏分散
  en: unbiased variance
  category: 要約（代表値・ばらつき）
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ（n≧2。n≧2 は定義の要件）から作る統計量 s²＝{(X₁−X̄)²＋…＋(Xₙ−X̄)²}/(n−1)（X̄ は標本平均。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-sample-mean]
  short: 偏差の2乗の和を n−1 で割った分散で、その期待値が母分散に一致する
- id: TERM-sd
  name: 標準偏差
  en: standard deviation
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-sd-def
  definition: 分散の正の平方根。ばらつきを元の単位で表す。
  version: 1
  labs:
  - {id: LAB-z, preset: s1-sigma, purpose: 標準偏差が広がると、同じ値の z得点がどう変わるかを見る}
  principle: 分散は単位が2乗になるので、平方根をとって元の単位に戻す。期待値（平均）からの典型的なずれの大きさの目安。
  formulas:
  - id: F-sd-def
    symbols:
    - symbol: σ
      meaning: 標準偏差
      range: 0以上
      key: sigma
      kind: param
      of: X
      domain: {min: 0}   # σ＝√V(X) は0になりうる（0で割る式の側〔F-std-def〕が σ＞0 を持つ）
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    tree: {"op": "eq", "args": [{"sym": "sigma"}, {"op": "sqrt", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}]}]}
  conditions:
    math:
    - text: 分散が有限
      kind: 要件
      outside: √V(X) が有限の値に定まらないので、この定義の標準偏差として扱えない
    data:
    - 外れ値に強く引っ張られる（2乗が効く）。山が2つあるときや裾が長いときは、分布の形と一緒に見る
  example: さいころの目の標準偏差は √(35/12)≒1.71。
  counterexample: 標準偏差が同じでも、分布の形が違えば平均±1σ に入る割合は違う（正規分布で約68.3%、一様分布で約57.7%）。
  misconceptions:
  - misconception: 標準偏差は「平均からのずれの平均」
    correction: ずれの2乗の平均の平方根。ずれの大きさ（絶対値）の平均と同じか、それより大きくなる
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(math.sqrt(35/12)-1.71)<0.005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
  - abs(1/math.sqrt(3)-0.577)<0.0005
- id: TERM-cv
  name: 変動係数
  en: coefficient of variation
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 平均 x̄ が正の量的なデータ x₁, …, xₙ（n≧2）について、不偏分散の平方根 s＝√{Σ(xᵢ−x̄)²/(n−1)} を平均で割った値 s/x̄（x̄＞0・n≧2 は定義の要件）
    terms: [TERM-unbvar, TERM-mean]
  short: 標準偏差を平均で割った値で、平均の大きさが違うデータどうしのばらつきを比べるのに使う
- id: TERM-unbiased
  name: 不偏性
  en: unbiasedness
  category: 推定
  forms: [property]
  basis:
    text: 母数 θ の推定量 θ̂ について、モデルのすべての母数の値で（θ 以外の母数を含む） E(θ̂)＝θ が成り立つこと
    terms: [TERM-estimator, TERM-expect]
  short: 推定量の期待値が、推定したい母数と一致する性質
- id: TERM-std
  name: 標準化
  en: standardization
  category: 要約（代表値・ばらつき）
  forms: [operation]
  basis_formula: F-std-def
  definition: 値から平均を引き、標準偏差で割って、平均0・標準偏差1 の尺度に直すこと。
  version: 1
  labs:
  - {id: LAB-z, preset: s1-z, purpose: 単位やばらつきの違うものを z得点でそろえて比べる}
  principle: 1次の変換なので分布の形は変わらない。単位や大きさの違う値を「平均から標準偏差いくつ分か」で比べられる。正規分布なら標準正規分布 N(0, 1) になり、1つの表で確率が読める。
  formulas:
  - id: F-std-def
    symbols:
    - symbol: Z
      meaning: 標準化した値（平均から標準偏差いくつ分か）
      key: Z
      kind: rv
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: μ
      meaning: X の期待値 E(X)
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    - symbol: σ
      meaning: X の標準偏差
      range: 0より大きい
      key: sigma
      concept: TERM-sd
      kind: param
      of: X
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"sym": "Z"}, {"op": "div", "args": [{"op": "sub", "args": [{"sym": "X"}, {"sym": "mu"}]}, {"sym": "sigma"}]}]}
  - id: F-std-mean
    label: 標準化した値の期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: Z
      meaning: 標準化した値（平均から標準偏差いくつ分か）
      key: Z
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "Z"}], "name": "E"}, {"num": 0}]}
  - id: F-std-var
    label: 標準化した値の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: Z
      meaning: 標準化した値（平均から標準偏差いくつ分か）
      key: Z
      kind: rv
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "Z"}], "name": "V"}, {"num": 1}]}
  conditions:
    math:
    - text: 分散が有限で、標準偏差が0でない
      kind: 要件
      outside: σ で割れない（σ＝0）か σ が定まらないので、標準化した値が定まらない
    data:
    - 平均と標準偏差を、比べたい集団から出しているか（別の集団の値で割らない。偏差値のように基準集団の値を使うと、平均0・標準偏差1 にはならない）
  example: 平均60点・標準偏差10点のテストで、80点は z＝2。
  counterexample: 標準化しても分布の形は変わらない。右に裾の長いデータを標準化しても、正規分布にはならない。
  misconceptions:
  - misconception: 標準化すると正規分布になる
    correction: 位置と広がりをそろえるだけで、形は元のまま
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - (80-60)/10==2
- id: TERM-skew
  name: 歪度
  en: skewness
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ（データの標準偏差 √v＞0 は定義の要件。v はデータの分散）について、(xᵢ−x̄)/√v の3乗の平均 (1/n)Σ{(xᵢ−x̄)/√v}³
    terms: [TERM-data-sd]
  short: 分布の左右の非対称さを表す値で、右に裾が長いと正になる
- id: TERM-kurt
  name: 尖度
  en: kurtosis
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データ x₁, …, xₙ（データの標準偏差 √v＞0 は定義の要件。v はデータの分散）について、(xᵢ−x̄)/√v の4乗の平均 (1/n)Σ{(xᵢ−x̄)/√v}⁴（3を引かない決め方。母集団が正規分布のとき、その母集団の値が3になる）
    terms: [TERM-data-sd]
  short: 分布の山のとがり具合と、裾の重さを表す値
- id: TERM-normal
  name: 正規分布
  en: normal distribution
  category: 確率分布
  group: GRP-dist-cont
  forms: [distribution]
  basis_excludes:
  - concept: TERM-expect
    kind: 1つの概念の中の式・性質
    text: 密度の μ が期待値に等しいことは、密度から導く正規分布の性質で、定義の構成要素ではない
  - concept: TERM-sd
    kind: 1つの概念の中の式・性質
    text: 密度の σ が標準偏差に等しいことは、密度から導く正規分布の性質で、定義の構成要素ではない
  definition: 確率密度が f(x) の式で表される連続分布 N(μ, σ²)。平均 μ を中心に左右対称な釣鐘の形になる。
  version: 2
  figures: [FIG-U16-concept]
  labs:
  - {id: LAB-cont, preset: s1-norm, purpose: 平均と標準偏差から、区間の確率を面積で読む}
  principle: 小さな独立の要因がたくさん足し合わさると、この形に近づく（中心極限定理）。μ と σ の2つで形が決まり、μ±σ に約68%、μ±2σ に約95% が入る。
  formulas:
  - id: F-normal-pdf
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ。面積が確率）
      key: f
      concept: TERM-pdf
    - symbol: x
      meaning: 値
      key: x
      kind: value
    - symbol: X
      meaning: この密度に従う確率変数（μ・σ は X の期待値・標準偏差）
      key: X
      kind: rv
    - symbol: μ
      meaning: 平均（山の中心）
      key: mu
      concept: TERM-expect
      kind: param
      of: X
    - symbol: σ
      meaning: 標準偏差（山の広がり）
      range: 0より大きい
      key: sigma
      concept: TERM-sd
      kind: param
      of: X
      domain: {min: 0, minOpen: true}
    - symbol: π
      meaning: 円周率
      key: pi
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}, {"op": "mul", "args": [{"op": "div", "args": [{"num": 1}, {"op": "mul", "args": [{"op": "sqrt", "args": [{"op": "mul", "args": [{"num": 2}, {"sym": "pi"}]}]}, {"sym": "sigma"}]}]}, {"op": "fn", "args": [{"op": "neg", "args": [{"op": "div", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "x"}, {"sym": "mu"}]}, {"num": 2}]}, {"op": "mul", "args": [{"num": 2}, {"op": "pow", "args": [{"sym": "sigma"}, {"num": 2}]}]}]}]}], "name": "exp"}]}]}
  basis_formula: F-normal-pdf
  conditions:
    math:
    - text: σ＞0（μ は実数）
      kind: 要件
      outside: 母数が範囲の外なら、この定義の正規分布として扱えない（σ＝0 では密度の式が定まらない）
    data:
    - ヒストグラムが左右対称で山が1つなのは手掛かりにすぎず、それだけでは正規分布と言えない（裾の重さなども見る）
    - 正規分布を前提にする方法は、データの分布が正規分布から外れると、結論を信頼しにくくなる
  example: 二項分布 B(100, 0.5) は、平均50・標準偏差5 の正規分布で近似できる。
  counterexample: 売上や所得のように右に裾が長いデータでは、平均±2σ の中の割合は95%前後でも（対数正規分布で約96.3%）、外に出る分はほぼ右側だけ（左 0%・右 約3.7%）。平均±1σ の中は約91%で、正規分布の約68.3%と大きく違う。
  misconceptions:
  - misconception: 左右対称で山が1つなら正規分布
    correction: 左右対称な山1つの分布はほかにもある（裾の重い分布など）。形の手掛かりと、正規分布であることは別
  - misconception: データはふつう正規分布になる
    correction: 正規分布に近づくのは、独立な要因が足し合わさるときなど。売上・所得など右に裾の長いデータは多い
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(math.erf(1/math.sqrt(2))-0.68)<0.005
  - abs(math.erf(2/math.sqrt(2))-0.95)<0.005
  - 100*0.5==50 and math.sqrt(100*0.5*0.5)==5
  - abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+2*math.sqrt((math.e-1)*math.e)))-0.963)<0.0005
  - math.exp(0.5)-2*math.sqrt((math.e-1)*math.e) < 0
  - abs(1-statistics.NormalDist().cdf(math.log(math.exp(0.5)+2*math.sqrt((math.e-1)*math.e)))-0.037)<0.0005
  - math.exp(0.5)-math.sqrt((math.e-1)*math.e) < 0 and abs(statistics.NormalDist().cdf(math.log(math.exp(0.5)+math.sqrt((math.e-1)*math.e)))-0.91)<0.005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
- id: TERM-expect
  name: 期待値
  en: expected value
  category: 要約（代表値・ばらつき）
  forms: [operation, number]
  basis_formula: F-expect-def
  definition: 確率変数がとる値を、その確率で重み付けした平均。
  version: 1
  table_workspace:
    formula: 0
    linear: 2
    tables:   # 表は実験室のテーマを指す（値・重みを2か所に書かない。build が写す。#119）
    - {experiment: EXP-expect-table, theme: dice, use: start}
    - {experiment: EXP-expect-table, theme: dice, use: compare}
    - {experiment: EXP-expect-table, theme: basket, use: start}
    - {experiment: EXP-expect-table, theme: lottery, use: start}
  figures: [FIG-U13-concept]
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 期待値が分布の重心になることを、予測してから確かめる}
  principle: 値×確率の和。同じ試行を何度もくり返したときの平均の行き着く先になる（大数の法則）。和の期待値は期待値の和（線形性）。
  formulas:
  - id: F-expect-def
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: x
      meaning: X がとりうる値
      key: x
      kind: index
    - symbol: p(x)
      meaning: X が x になる確率（重み）
      range: 0以上1以下・合計1
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "sum", "args": [{"op": "mul", "args": [{"sym": "x"}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}], "var": "x"}]}
  - id: F-expect-mu
    label: 記号 μ
    symbols:
    - symbol: μ
      meaning: X の期待値 E(X) を短く書く記号
      key: mu
      kind: param
      of: X
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    tree: {"op": "eq", "args": [{"sym": "mu"}, {"op": "fn", "args": [{"sym": "X"}], "name": "E"}]}
  - id: F-expect-linear
    label: 線形性
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 掛ける定数（単位の換算）
      key: a
      kind: const
    - symbol: b
      meaning: 足す定数（一律の上乗せ）
      key: b
      kind: const
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"sym": "X"}]}, {"sym": "b"}]}], "name": "E"}, {"op": "add", "args": [{"op": "mul", "args": [{"sym": "a"}, {"op": "fn", "args": [{"sym": "X"}], "name": "E"}]}, {"sym": "b"}]}]}
  conditions:
    math:
    - text: 値の大きさ×確率の和（連続なら積分）が有限の値になる（絶対収束：足す順序で値が変わらない）
      kind: 要件
      outside: 期待値が定まらない（足す順序で値が変わるか、∞ になる）ので、この定義の期待値としては扱えない
    data:
    - くり返しの平均として読むには、同じ条件の試行がくり返せること
  example: さいころの目の期待値は (1＋2＋…＋6)÷6＝3.5。
  counterexample: 期待値 3.5 の目は実際には出ない。期待値は「よく出る値」（最頻値）でも「真ん中の値」（中央値）でもない。
  misconceptions:
  - misconception: 期待値は実際に出る値
    correction: 何度もくり返したときの平均の行き着く先で、1回の結果としては出ないこともある
  - misconception: 期待値がいちばん出やすい値
    correction: いちばん出やすい値は最頻値。右に裾が長い分布では、期待値は最頻値より大きくなる
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - sum(range(1,7))/6==3.5
- id: TERM-geomean
  name: 幾何平均
  en: geometric mean
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: n 個の正の値 x₁, …, xₙ（正であることは定義の要件）を掛け合わせた積の n 乗根 (x₁x₂⋯xₙ)^(1/n)（伸び率なら、倍率 1＋伸び率 に当てはめる）
    terms: []
  short: n 個の正の値を掛け合わせて n 乗根をとった値で、倍率（1＋伸び率）の平均に使う
- id: TERM-ma
  name: 移動平均
  en: moving average
  category: 時系列
  short: 時系列で、一定期間の値の平均を1期ずつずらして求め、細かい変動をならしたもの
- id: TERM-acf
  name: 自己相関
  en: autocorrelation
  category: 時系列
  short: 時系列で、ある時点の値と、その一定期間前の値との相関
- id: TERM-corr
  name: 相関係数
  en: correlation coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 量的な2変数のデータ (x₁, y₁), …, (xₙ, yₙ)（n≧2。x と y のデータの標準偏差がどちらも0でないことは定義の要件）について、データの共分散を x と y のデータの標準偏差の積で割った値 r＝s_xy/(s_x·s_y)（割る数は分子と分母で消えるので、r＝Σ(xᵢ−x̄)(yᵢ−ȳ)/√{Σ(xᵢ−x̄)²·Σ(yᵢ−ȳ)²} と同じ値）
    terms: [TERM-data-cov, TERM-data-sd]
  short: 2つの量的変数の直線的な関係の強さと向きを、−1から1の数で表した値
- id: TERM-complement
  name: 余事象
  en: complement
  category: 確率
  forms: [event]
  basis:
    text: 事象 A に対して、標本空間 Ω のうち A に入らない結果を全部集めた事象 Aᶜ＝Ω∖A
    terms: [TERM-event, TERM-sample-space]
  short: ある事象が起こらないという事象で、標本空間からその事象を除いた残り
- id: TERM-exclusive
  name: 排反
  en: mutually exclusive
  category: 確率
  forms: [property]
  basis:
    text: 2つの事象 A・B が共通の結果を持たない（A∩B＝∅）こと
    terms: [TERM-event]
  short: 2つの事象が同時には起こらないこと（共通部分がない）
- id: TERM-indep
  name: 独立
  en: independence
  category: 確率
  forms: [property]
  basis_formula: F-indep-def
  definition: 一方が起きたかどうかで、もう一方の起こりやすさが変わらないこと。
  version: 1
  labs:
  - {id: LAB-expect, preset: s5-free, purpose: 'P(X＝x, Y＝y)＝P(X＝x)P(Y＝y) のとき、共分散が0になることを確かめる'}
  principle: P(A∩B)＝P(A)P(B)。確率変数なら同時の確率が積に分かれる。独立なら共分散は0になり、和の分散は分散の和になる。
  formulas:
  - id: F-indep-def
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-prob
    - symbol: A
      meaning: 事象
      key: A
      kind: value
    - symbol: B
      meaning: 事象
      key: B
      kind: value
    - symbol: A∩B
      meaning: A と B が両方起きる
      key: AB
      kind: value
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "AB"}], "name": "P"}, {"op": "mul", "args": [{"op": "fn", "args": [{"sym": "A"}], "name": "P"}, {"op": "fn", "args": [{"sym": "B"}], "name": "P"}]}]}
  conditions:
    math:
    - text: A・B は、同じ標本空間の上の同じ確率 P で確率が決まった2つの事象（確率変数 X・Y の独立は、値の事象 {X∈A}・{Y∈B} のどの組も独立なこと）
      kind: 要件
      outside: この定義の独立として扱えない
    data:
    - データで「独立」と言うには、仕組み（別々のさいころ・別々の客）から言えるか、検定などで確かめる。相関が0でも独立とは限らない
  example: さいころを2回投げると、1回目と2回目の目は独立。両方6になる確率は 1/6×1/6＝1/36。
  counterexample: どちらの確率も0でない2つの事象は、排反（同時に起きない）なら独立ではない。P(A∩B)＝0 だが P(A)P(B)＞0 になるからである。
  misconceptions:
  - misconception: 排反なら独立
    correction: 排反は「同時に起きない」。一方が起きたらもう一方は起きないので、むしろ強く関係している
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - Fraction(1,6)*Fraction(1,6)==Fraction(1,36)
- id: TERM-cond
  name: 条件付き確率
  en: conditional probability
  category: 確率
  forms: [number]
  basis:
    text: P(A)＞0 の事象 A と事象 B について、A が起きたもとでの B の確率 P(B|A)＝P(A∩B)/P(A)
    terms: [TERM-prob, TERM-event]
  short: ある事象が起きたと分かったうえで、別の事象が起こる確率
- id: TERM-bayes
  name: ベイズの定理
  en: Bayes' theorem
  category: 確率
  forms: [proposition]
  claims: [CLM-23]
  basis:
    text: P(H)＞0・P(D)＞0 の事象 H・D について、P(H|D)＝P(D|H)P(H)/P(D)（④-23）
    terms: [TERM-cond, TERM-prob, TERM-event]
  short: 結果が分かったときに、その原因の確率を、条件付き確率を逆向きにして求める式
- id: TERM-prior
  name: 事前確率
  en: prior probability
  category: 確率
