- id: TERM-binom
  name: 二項分布
  en: binomial distribution
  definition: 成功確率 p の独立な試行を n 回くり返したときの、成功した回数の分布 B(n, p)。
  version: 1
  principle: 「どの k 回が成功か」の組合せ ₙCₖ と、その1通りの確率 pᵏ(1−p)ⁿ⁻ᵏ の積。成功回数は n 個の「成功1・失敗0」の和なので、期待値と分散が和から求まる。
  formulas:
  - tex: P(X=k)={}_nC_k\,p^k(1-p)^{n-k}
    symbols:
    - symbol: n
      meaning: 試行の回数
      range: 1以上の整数
    - symbol: k
      meaning: 成功した回数
      range: 0以上 n 以下の整数
    - symbol: p
      meaning: 1回あたりの成功確率
      range: 0以上1以下
    - symbol: ₙCₖ
      meaning: n 回のうちどの k 回が成功かの選び方の数
  - tex: E(X)=np,\quad V(X)=np(1-p)
    label: 期待値と分散
    symbols:
    - symbol: np
      meaning: 成功回数の期待値
    - symbol: np(1−p)
      meaning: 成功回数の分散
  conditions:
    math:
    - 回数 n が決まっている
    - 結果が成功・失敗の2つ
    - 各回の成功確率 p が同じ
    - 各回が独立
    data:
    - 客ごとの購入のように、互いに影響しない（口コミや連れ立ちがない）か、p が客や時間でほぼ同じかを確かめる
  example: 来店客10人がそれぞれ確率 0.3 で買う（互いに独立）なら、買う人数は B(10, 0.3)。期待値は3人、分散は2.1。
  counterexample: 箱から戻さずに取り出すと、各回の確率が変わり独立でもないので二項分布ではない（超幾何分布）。
  misconceptions:
  - misconception: ちょうど期待値 np 回になる確率が高い
    correction: np 回はいちばん起きやすい付近だが、その確率自体は小さいことが多い（n が大きいほど小さい）
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(10*0.3-3)<1e-12 and abs(10*0.3*0.7-2.1)<1e-12
- id: TERM-poisson
  name: ポアソン分布
  en: Poisson distribution
  definition: 一定の時間や範囲で、まれな出来事が平均 λ 回起きるときの、起きた回数の分布。
  version: 1
  principle: 二項分布で n を大きく、p を小さくし、np＝λ を保ったときに行き着く形。期待値と分散がどちらも λ になる。
  formulas:
  - tex: P(X=k)=\dfrac{e^{-\lambda}\lambda^k}{k!}
    symbols:
    - symbol: λ
      meaning: 決めた時間・範囲で起きる平均の回数
      range: 0より大きい
    - symbol: k
      meaning: 起きた回数
      range: 0以上の整数（上限なし）
  - tex: E(X)=V(X)=\lambda
    label: 期待値と分散
  conditions:
    math:
    - 出来事が互いに独立に起きる
    - 同時に2つは起きない
    - 起きる平均の割合が一定
    data:
    - 時間帯や曜日で割合が変わらないか、分散が平均とほぼ同じかを確かめる（分散が大きければ当てはまっていない）
  example: 1時間に平均2件の問い合わせがあるとき、ある1時間に1件もない確率は e⁻²≒0.135。
  counterexample: 昼に集中する来店のように時間帯で割合が変わるなら、1日をまとめて1つのポアソン分布にしてはいけない。
  misconceptions:
  - misconception: まれな出来事なら何でもポアソン分布
    correction: 起きる割合が一定で、互いに独立に起きることが要る。連鎖して起きる出来事（クレームが続くなど）は当てはまらない
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
  - abs(math.exp(-2)-0.135)<0.0005
