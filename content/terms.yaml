- id: TERM-normal
  name: 正規分布
  en: normal distribution
  definition: 平均 μ を中心に左右対称な、釣鐘の形をした連続分布 N(μ, σ²)。
  principle: 小さな独立の要因がたくさん足し合わさると、この形に近づく（中心極限定理）。μ と σ の2つで形が決まり、μ±σ に約68%、μ±2σ に約95% が入る。
  formula: f(x)=\dfrac{1}{\sqrt{2\pi}\,\sigma}\exp\!\Big(-\dfrac{(x-\mu)^2}{2\sigma^2}\Big)
  conditions:
  - 値が連続で、左右対称な山が1つ（データに当てはめるときは、形を確かめてから使う）
  example: 二項分布 B(100, 0.5) は、平均50・標準偏差5 の正規分布で近似できる。
  counterexample: 売上や所得のように右に裾が長いデータでは、平均±2σ に95%が入るとは限らない。
  checks:
  - abs(math.erf(1/math.sqrt(2))-0.68)<0.005
  - abs(math.erf(2/math.sqrt(2))-0.95)<0.005
  - 100*0.5==50 and math.sqrt(100*0.5*0.5)==5
- id: TERM-expect
  name: 期待値
  en: expected value
  definition: 確率変数がとる値を、その確率で重み付けした平均。
  principle: 値×確率の和。同じ試行を何度もくり返したときの平均の行き着く先になる（大数の法則）。和の期待値は期待値の和（線形性）。
  formula: E(X)=\sum_x x\,p(x),\quad E(aX+b)=aE(X)+b
  conditions:
  - 和（連続なら積分）が有限の値になる
  example: さいころの目の期待値は (1＋2＋…＋6)÷6＝3.5。
  counterexample: 期待値 3.5 の目は実際には出ない。期待値は「よく出る値」（最頻値）でも「真ん中の値」（中央値）でもない。
  checks:
  - sum(range(1,7))/6==3.5
