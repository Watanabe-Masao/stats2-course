  principle: 起こりうる値と、その確率の組（確率分布）で性質が決まる。1つの記録された値ではなく、記録する前の「値の出方」を扱う。
  formulas:
  - id: F-rv-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: x
      meaning: X がとる値
      key: x
      kind: value
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "x"}]}], "name": "P"}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}
  - {ref: F-dist-sum}   # 同じ式 Σp(x)=1 の元は確率分布（TERM-dist）。build が元の式を写し、defined_in を付ける（#118 D2）
  conditions:
    math:
    - 起こりうる値の範囲が決まっている
    - 各値の確率が0以上で、合計が1
    data:
    - 「記録する前の値の出方」として扱えるか（同じ仕組みでくり返し起きるか）を確かめる
  example: さいころの目 X は、1〜6 の値をそれぞれ確率 1/6 でとる。
  counterexample: 「今日の売上 120万円」という1つの記録は確率変数ではなく、実現した1つの値。
  misconceptions:
  - misconception: 確率変数は「でたらめな数」のこと
