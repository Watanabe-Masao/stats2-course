      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: λ
      meaning: 単位時間あたりに起きる平均の回数
      range: 0より大きい
      key: lambda
      kind: param
      domain: {min: 0, minOpen: true}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"num": 1}, {"op": "pow", "args": [{"sym": "lambda"}, {"num": 2}]}]}]}
  basis_formula: F-expo-pdf
  conditions:
    math:
    - text: λ＞0
      kind: 要件
      outside: 母数が範囲の外なら、この定義の指数分布として扱えない
    - text: 出来事が一定の割合で独立に起きる
      kind: 仮定
      claim: 次に起きるまでの待ち時間 X が指数分布に従う
      outside: 待ち時間に指数分布を使えるとは保証できない（偶然に一致することはある）
      terms:
      - TERM-indep
    data:
    - 時間帯で起きる割合が変わる（昼と夕方で客の来方が違う）と当てはまらない。時間帯を分けて見る
  example: 1時間に平均4人来る（λ＝4/時）とき、次の客までの平均の待ち時間は 1/4 時間＝15分。
  counterexample: 10分待っても、そこから先の待ち時間の分布は待ち始めと同じ。「そろそろ来るはず」は成り立たない。
  misconceptions:
  - misconception: 平均15分なら、15分あたりで来ることが多い
    correction: 密度は0分がいちばん高く、待つほど下がる。平均より早く来る確率は 1−e^(−1)≒63%
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(60,4)==15
  - math.isclose(math.exp(-4*(15/60))/math.exp(-4*(10/60)), math.exp(-4*(5/60)))
  - abs(1-math.exp(-1)-0.632)<0.0005
- id: TERM-pdf
  name: 確率密度関数
  en: probability density function
  category: 確率分布
  group: GRP-dist-base
  forms: [function]
  basis_formula: F-pdf-interval
  definition: 確率分布のうち、確率変数が区間に入る確率を積分で表せるものについて、その積分に使う関数。
  version: 2
  labs:
  - {id: LAB-cont, preset: s1-dens, purpose: 密度の高さは1を超えても、面積は1のままなのを見る}
  principle: 連続では1点の確率は0で、確率は面積（積分）で決まる。高さ f(x) は「その付近の出やすさの密度」。
  formulas:
  - id: F-pdf-interval
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: f(x)
      meaning: 確率密度（高さ）
      range: 0以上（1を超えてもよい）
      key: f
    - symbol: x
      meaning: 積分で動かす値
      key: x
      kind: index
    - symbol: a
      meaning: 区間の左端
      key: a
      kind: value
    - symbol: b
      meaning: 区間の右端
      key: b
      kind: value
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "fn", "args": [{"sym": "a"}, {"sym": "X"}, {"sym": "b"}], "name": "between"}], "name": "P"}, {"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x", "lower": {"sym": "a"}, "upper": {"sym": "b"}}]}
  - id: F-pdf-total
    label: 全体の面積は1
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ）
      key: f
    - symbol: x
      meaning: 積分で動かす値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "int", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - text: f(x) が0以上
      kind: 要件
      outside: 確率密度関数として扱えない
    - text: 全体の面積が1
      kind: 要件
      outside: 確率密度関数として扱えない
    data:
    - ヒストグラムを「相対度数÷階級の幅」で描くと、密度の推定になる
  example: 0〜10分に一様に来るバスで、3〜5分の間に来る確率は 2÷10＝0.2。
  counterexample: 0〜0.5 の一様分布の密度の高さは 2 で、1を超える。密度は確率ではないので1を超えてよい。
  misconceptions:
  - misconception: f(x) は X が x になる確率
    correction: 連続では1点の確率は0。f(x) は面積を作る高さで、確率は区間の面積
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(2,10)==Fraction(1,5)
  - 1/0.5==2
- id: TERM-uniform
  name: 一様分布
  en: uniform distribution
  category: 確率分布
  group: GRP-dist-cont
  forms: [distribution]
  definition: 区間 [a, b] のどこにも同じ密度で値をとる連続分布。
  version: 1
  labs:
  - {id: LAB-cont, preset: s3-free, purpose: 「一様分布」のモードで、確率が区間の長さに比例するのを見る}
  principle: 密度は 1/(b−a) で一定なので、確率は区間の長さに比例する。
  formulas:
  - id: F-uniform-pdf
    symbols:
    - symbol: f(x)
      meaning: 確率密度（高さ。面積が確率）
      key: f
      concept: TERM-pdf
    - symbol: x
      meaning: 値
      key: x
      kind: value
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "f"}, {"op": "div", "args": [{"num": 1}, {"op": "sub", "args": [{"sym": "b"}, {"sym": "a"}]}]}]}
  - id: F-uniform-mean
    label: 期待値
    symbols:
    - symbol: E( )
      meaning: 期待値（値×確率を足す。連続なら密度で重み付けして積分）
      key: E
      concept: TERM-expect
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "E"}, {"op": "div", "args": [{"op": "add", "args": [{"sym": "a"}, {"sym": "b"}]}, {"num": 2}]}]}
  - id: F-uniform-var
    label: 分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: a
      meaning: 値のとりうる範囲の左端
      key: a
      kind: param
    - symbol: b
      meaning: 値のとりうる範囲の右端
      range: a より大きい
      key: b
      domain: {min: a, minOpen: true}
      kind: param
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"sym": "X"}], "name": "V"}, {"op": "div", "args": [{"op": "pow", "args": [{"op": "sub", "args": [{"sym": "b"}, {"sym": "a"}]}, {"num": 2}]}, {"num": 12}]}]}
  basis_formula: F-uniform-pdf
  conditions:
    math:
    - text: a＜b
      kind: 要件
      outside: 母数が範囲の外なら、この定義の一様分布として扱えない
    - text: 区間の外の密度は0
      kind: 要件
      outside: この定義の一様分布として扱えない（区間の外にも値をとる）
    data:
    - 「どこも同じ出やすさ」は仮定。ヒストグラムが平らかで確かめる
  example: 0〜10分の一様分布の期待値は5分、分散は 100/12≒8.33。
  counterexample: 平均±1σ に入る割合は 1/√3≒57.7% で、正規分布の約68.3%と違う。標準偏差が同じでも、形が違えば割合は違う。
  misconceptions:
  - misconception: 一様分布なら、どの値も同じ確率で出る
    correction: 連続なので1点の確率は0。同じなのは「同じ長さの区間に入る確率」
  sources:
  - source: 公式2級範囲表
  checks:
  - Fraction(0+10,2)==5
  - abs(100/12-8.33)<0.005
  - abs(1/math.sqrt(3)-0.577)<0.0005
  - abs(2*statistics.NormalDist().cdf(1)-1-0.683)<0.0005
- id: TERM-sampdist
  name: 標本分布
  en: sampling distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: 母集団から大きさ n の標本を取ることをくり返すとき、標本から計算する統計量を確率変数とみたときの確率分布
    terms: [TERM-statistic, TERM-dist]
  short: 同じ大きさの標本を何度も取ったときに、統計量がとる値の分布
- id: TERM-se
  name: 標準誤差
  en: standard error
  category: 標本分布・極限
  forms: [number]
  basis:
    text: 推定量 θ̂ の標本分布の標準偏差 √V(θ̂)（例：独立に同じ分布に従う標本で、標本平均の標準誤差は σ/√n）
    terms: [TERM-estimator, TERM-sampdist, TERM-sd]
  short: 推定量の標本分布の標準偏差で、推定値がくり返しでどれだけばらつくかの大きさ
- id: TERM-lln
  name: 大数の法則
  en: law of large numbers
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-20b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が有限のとき、どの ε＞0 でも n→∞ で P(|X̄−μ|≧ε)→0（標本平均 X̄ は μ に確率収束する。④-20b）
    terms: [TERM-sample-mean]
  short: 標本の大きさを大きくすると、標本平均が母平均に近づくという法則
- id: TERM-clt
  name: 中心極限定理
  en: central limit theorem
  category: 標本分布・極限
  forms: [proposition]
  claims: [CLM-6b]
  basis:
    text: X₁, …, Xₙ が独立に同じ分布に従い、平均が μ、分散 σ² が 0＜σ²＜∞ のとき、n→∞ で √n(X̄−μ)/σ の分布は N(0, 1) に近づく（④-6b）
    terms: [TERM-sample-mean, TERM-std-normal]
  short: 独立に同じ分布から取った標本平均の分布は、n が大きいと正規分布に近づくという定理
- id: TERM-cc
  name: 連続修正
  en: continuity correction
  category: 標本分布・極限
  forms: [operation]
  basis:
    text: 整数値をとる確率変数 X の確率を、確率密度で表される分布に従う Y の確率で近似するとき、P(X≦k) を P(Y≦k＋0.5)、P(X≧k) を P(Y≧k−0.5) で近似する（境目を 0.5 ずらす）操作
    terms: [TERM-pdf]
  short: 離散分布を連続分布で近似するとき、区間の端を0.5ずらして近似をよくする工夫
- id: TERM-t
  name: t 分布
  en: t distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z が N(0, 1) に従い、V が χ²(k) に従い、Z と V が独立なとき、T＝Z/√(V/k) の分布を自由度 k の t 分布 t(k) とする（k は1以上の整数）
    terms: [TERM-chi2]
  short: 母分散を不偏分散で置き換えて標準化した標本平均が従う分布で、自由度が大きいと標準正規分布に近づく
- id: TERM-chi2
  name: カイ二乗分布
  en: chi-squared distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: Z₁, …, Z_k が独立に N(0, 1) に従うとき、Z₁²＋…＋Z_k² の分布を自由度 k のカイ二乗分布 χ²(k) とする（k は1以上の整数。独立は定義の要件）
    terms: [TERM-std-normal, TERM-df]
  short: 独立な標準正規分布の確率変数を2乗して足した値が従う分布
- id: TERM-f
  name: F 分布
  en: F distribution
  category: 標本分布・極限
  forms: [distribution]
  basis:
    text: U が χ²(m)、V が χ²(n) に従い、U と V が独立なとき、(U/m)/(V/n) の分布を自由度 (m, n) の F 分布 F(m, n) とする（m・n は1以上の整数）
    terms: [TERM-chi2]
  short: 独立な2つのカイ二乗分布の確率変数を、それぞれ自由度で割った比が従う分布
- id: TERM-df
  name: 自由度
  en: degrees of freedom
  category: 標本分布・極限
  forms: [number]
  basis:
    text: n 個の値に k 個の互いに独立な1次の制約（例：偏差の和が0）があるとき、自由に動ける値の個数 n−k。t・カイ二乗・F 分布では、族を区別する正の整数の母数を同じ名前で呼ぶ
    terms: []
  short: 統計量を計算するときに自由に動ける値の個数で、t・カイ二乗・F 分布の形を決める
- id: TERM-estimator
  name: 推定量
  en: estimator
  category: 推定
  forms: [rv]
  basis:
    text: 母数 θ を推定する目的で使う統計量 θ̂（標本 X₁, …, Xₙ の関数で、分からない母数を含まないもの。観測したあとの値は推定値と呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 母数を推定するために使う統計量（標本から値が決まる式）
- id: TERM-point-est
  name: 点推定
  en: point estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 標本の値を推定量 θ̂ に入れて得た1つの値（推定値）を、母数 θ の値の推定とする手続き
    terms: [TERM-estimator]
  short: 母数の値を、推定量から求めた1つの値で推定すること
- id: TERM-consistency
  name: 一致性
  en: consistency
  category: 推定
  forms: [property]
  basis:
    text: 標本の大きさ n ごとの母数 θ の推定量 θ̂ₙ が、モデルのすべての母数の値で（θ 以外の母数を含む）、どの ε＞0 についても n→∞ で P(|θ̂ₙ−θ|≧ε)→0 となること（θ̂ₙ は θ に確率収束する）
    terms: [TERM-estimator, TERM-prob]
  short: 標本の大きさを大きくすると、推定量が母数に近づいていく性質
- id: TERM-efficiency
  name: 有効性
  en: efficiency
  category: 推定
  forms: [property]
  basis:
    text: 同じ母数 θ の2つの不偏推定量 θ̂₁・θ̂₂ について、モデルのすべての母数の値で（θ 以外の母数を含む） V(θ̂₁)≦V(θ̂₂) のとき、θ̂₁ は θ̂₂ より有効という（分散の小さい不偏推定量ほどよいとする比べ方）
    terms: [TERM-unbiased, TERM-var]
  short: 不偏な推定量のうち、分散が小さい（ばらつきが小さい）ものほどよいとする性質
- id: TERM-mse
  name: 平均二乗誤差（MSE）
  en: mean squared error
  category: 推定
  forms: [number]
  basis:
    text: 母数 θ の推定量 θ̂ について、E[(θ̂−θ)²]（推定量と母数のずれの2乗の期待値。母数の値ごとに決まる）
    terms: [TERM-estimator, TERM-expect]
  short: 推定量と母数のずれの2乗の期待値で、推定量の分散と偏りの2乗の和になる
- id: TERM-ci
  name: 信頼区間
  en: confidence interval
  category: 推定
  forms: [random_set]
  basis:
    text: 母数 θ を区間で推定するために、標本から作る2つの統計量 L≦U でつくる区間 [L, U]（観測したあとの区間も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-parameter]
  short: 標本から作る、母数を推定するための区間で、作り方ごとに母数を含む確率の下限（信頼係数）が決まる
- id: TERM-conf-level
  name: 信頼係数
  en: confidence level
  category: 推定
  forms: [number]
  basis:
    text: 信頼区間 [L, U] を作る方法について、モデルのすべての母数の値で（θ 以外の母数を含む）とった、区間が θ を含む確率 P(L≦θ≦U) の下限（これが 1−α のとき、信頼係数 1−α の信頼区間という。95% など）
    terms: [TERM-ci, TERM-prob]
  short: 信頼区間の作り方が、母数のどの値でも母数を含む確率の下限（95%など）
- id: TERM-paired-t
  name: 対応のある t 検定
  en: paired t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 同じ対象の2つの測定値の対 (Xᵢ, Yᵢ)（i＝1, …, n）の差 Dᵢ＝Xᵢ−Yᵢ について、H₀：差の母平均が 0 を、t＝D̄/(s_D/√n)（D̄・s_D² は差の標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 同じ対象の2つの測定値の差をとり、差の平均が0かどうかを t 分布で調べる方法
- id: TERM-welch
  name: ウェルチの t 検定
  en: Welch's t-test
  category: 検定
  forms: [procedure]
  basis:
    text: 独立な2群の標本について、H₀：2つの母平均が等しい を、2群の母分散が等しいと仮定せずに、t＝(X̄₁−X̄₂)/√(s₁²/n₁＋s₂²/n₂)（X̄ⱼ・sⱼ² は群ごとの標本平均・不偏分散）で検定する仮説検定
    terms: [TERM-test, TERM-sample-mean, TERM-unbvar]
  short: 2群の分散が等しいと仮定せずに、2群の平均の差を t 分布で調べる方法
- id: TERM-h0
  name: 帰無仮説
  en: null hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 母集団の分布（その母数）について置く仮説（真か偽かが決まる命題）で、データがそれと食い違うかを調べる対象にするもの。分布をただ1つに決める形（単純仮説。μ＝μ₀ など）か、決めた集まりに置く形（複合仮説）で立てる
    terms: [TERM-dist]
  short: 検定で「差がない・効果がない」などとして立て、データで棄却されるかを調べる仮説
- id: TERM-h1
  name: 対立仮説
  en: alternative hypothesis
  category: 検定
  forms: [proposition]
  basis:
    text: 帰無仮説 H₀ が偽のときに母集団の分布がとりうるもの（の全部か一部）についての仮説で、H₀ を棄却したときに採るもの。ずれの向きを決める形（μ＞μ₀）と決めない形（μ≠μ₀）がある
    terms: [TERM-h0]
  short: 帰無仮説を棄却したときに採る仮説で、調べたい差や効果があるとするもの
- id: TERM-test-stat
  name: 検定統計量
  en: test statistic
  category: 検定
  forms: [rv]
  basis:
    text: 帰無仮説 H₀ を棄却するかを決めるために使う統計量 T（H₀ のもとでの T の分布が分かるか、近似できるように作る。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic, TERM-h0]
  short: 帰無仮説のもとでの分布が分かるように作った統計量で、データのずれの大きさを1つの数にしたもの
- id: TERM-pvalue
  name: p値
  en: p-value
  category: 検定
  forms: [rv, number]
  basis:
    text: 検定統計量 T の観測値について、H₀ が正しいとしたとき T が観測値と同じかそれより極端な値（極端さの向きは前もって決める）をとる確率。H₀ が複合仮説なら H₀ の中での上限（T の関数とみると確率変数、観測したあとの値も p 値と呼ぶ）
    terms: [TERM-test-stat, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいとしたとき、観測した値か、それより極端な値が出る確率
- id: TERM-alpha
  name: 有意水準
  en: significance level
  category: 検定
  forms: [number]
  basis:
    text: 第1種の過誤の確率に、データを見る前に置く上限 α（5%・1% など）
    terms: [TERM-type1]
  short: 帰無仮説を棄却する基準の確率で、正しい帰無仮説を誤って棄却する確率の上限（5%など）
- id: TERM-reject
  name: 棄却域
  en: rejection region
  category: 検定
  forms: [event]
  basis:
    text: 検定統計量 T のとる値の集合 R で、T の観測値が R に入れば帰無仮説を棄却すると、データを見る前に決めたもの
    terms: [TERM-test-stat]
  short: 検定統計量がその範囲に入ったら帰無仮説を棄却すると、前もって決めた範囲
- id: TERM-sides
  name: 片側検定・両側検定
  en: one-sided and two-sided tests
  category: 検定
  forms: [procedure]
  basis:
    text: 仮説検定のうち、対立仮説 H₁ が母数のずれの向きを1つに決めるもの（片側検定）と、向きを決めないもの（両側検定）。棄却域はそれに合わせて置く（片側なら検定統計量の分布のその向きの端、両側ならふつう両端。ずれの向きによらず大きい値が出る統計量では、両側でも上側だけ）
    terms: [TERM-test, TERM-h1, TERM-reject]
  short: 対立仮説が母数のずれの向きを1つに決めるか（片側）、決めないか（両側）の違いで、棄却域の置き方はそれで決まる
- id: TERM-type1
  name: 第1種の過誤
  en: type I error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が正しいときに、検定統計量が棄却域に入る（H₀ を棄却する）という判定の誤り（事象）。その確率も同じ名前で呼ぶ（その確率は H₀ の中のどの分布かで変わり、有意水準はその上限）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が正しいのに、誤って棄却してしまう誤り
- id: TERM-type2
  name: 第2種の過誤
  en: type II error
  category: 検定
  forms: [event, number]
  basis:
    text: 帰無仮説 H₀ が誤っているとき（分布が H₀ の外にあるとき）に、検定統計量が棄却域に入らない（H₀ を棄却しない）という判定の誤り（事象）。その確率 β も同じ名前で呼ぶ（β は H₀ の外のどの分布かで変わる）
    terms: [TERM-reject, TERM-h0, TERM-prob]
  short: 帰無仮説が誤っているのに、棄却されない誤り
- id: TERM-power
  name: 検出力
  en: power
  category: 検定
  forms: [number]
  basis:
    text: 帰無仮説 H₀ が誤っているときに H₀ を棄却する確率 1−β（β は第2種の過誤の確率。H₀ の外のどの分布かで値が変わる）
    terms: [TERM-type2]
  short: 帰無仮説が誤っているときに、正しく棄却される確率（1−第2種の過誤の確率）
- id: TERM-pool
  name: プールした比率
  en: pooled proportion
  category: 検定
  forms: [rv]
  basis:
    text: 2群の標本の大きさ n₁・n₂ と標本比率 p̂₁・p̂₂ から作る (n₁p̂₁＋n₂p̂₂)/(n₁＋n₂)（2群を合わせた標本の中で性質をもつものの割合。観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-sample-prop]
  short: 2群の割合の差を検定するとき、帰無仮説（割合が等しい）のもとで2群を合わせて求めた割合
- id: TERM-expected
  name: 期待度数
  en: expected frequency
  category: 検定
  forms: [number, rv]
  basis:
    text: 帰無仮説 H₀ のもとでの各欄（区分）の度数 Oᵢ の期待値 n·pᵢ（n は総数、pᵢ は H₀ のもとでその欄に入る確率）。H₀ が確率を1つに決めないとき（独立性検定、母数を推定する適合度検定）は、pᵢ の代わりに度数から推定した p̂ᵢ を使った n·p̂ᵢ（その期待値の推定値）（独立性検定では 行の合計×列の合計÷総数）
    terms: [TERM-h0, TERM-expect]
  short: 帰無仮説（独立・決めた割合どおり）が正しいとしたとき、各欄に入ると見込まれる度数
- id: TERM-indep-test
  name: 独立性検定
  en: test of independence
  category: 検定
  forms: [procedure]
  basis:
    text: クロス集計表の2つの質的変数について、H₀：2つの変数は独立 を、統計量 Σ(O−E)²/E（O は観測度数、E は期待度数）で検定する仮説検定
    terms: [TERM-test, TERM-crosstab, TERM-indep, TERM-expected]
  short: クロス集計表の2つの変数が独立かどうかを、期待度数とのずれからカイ二乗分布で調べる検定
- id: TERM-gof
  name: 適合度検定
  en: goodness-of-fit test
  category: 検定
  forms: [procedure]
  basis:
    text: k 個の区分に入った観測度数 O₁, …, O_k について、H₀：各区分の確率が決めた値（または決めた分布の族から出る値）である を、統計量 Σ(Oᵢ−Eᵢ)²/Eᵢ（Eᵢ は期待度数）で検定する仮説検定
    terms: [TERM-test, TERM-expected]
  short: 観測した度数が、決めた理論の割合に合っているかを、カイ二乗分布で調べる検定
- id: TERM-crosstab
  name: クロス集計表
  en: cross tabulation
  category: 図表
  forms: [random_set]
  short: 2つの質的変数の組合せごとに度数を数えて並べた表
- id: TERM-scatter
  name: 散布図
  en: scatter plot
  category: 図表
  short: 2つの量的変数の値の組を、横軸と縦軸の座標の点で表した図
- id: TERM-partial-corr
  name: 偏相関係数
  en: partial correlation coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 3つの量的変数 x・y・z のデータについて、2つずつの相関係数 r_xy・r_xz・r_yz から求める r_xy・z＝(r_xy−r_xz r_yz)/√{(1−r_xz²)(1−r_yz²)}（r_xz²＜1 かつ r_yz²＜1 は定義の要件）
    terms: [TERM-corr]
  short: 第3の変数の影響を取り除いたあとの、2つの変数の相関係数
- id: TERM-spurious
  name: 擬相関
  en: spurious correlation
  category: 相関・回帰
  forms: [property]
  basis:
    text: 2つの変数の間に直接の因果の関係がないのに、両方に関係する第3の変数などのために、2つの変数の相関係数が0から離れて見えること
    terms: [TERM-corr]
  short: 2つの変数に直接の関係がないのに、共通の第3の変数などのために見かけ上あらわれる相関
- id: TERM-ols
  name: 最小二乗法
  en: least squares method
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式の係数を、データの残差の2乗の和 Σeᵢ² が最小になるように決める方法（最小にする係数が1つに決まることは、説明変数の値が1次従属でないこと（単回帰では x が全部同じでないこと）で保たれる）
    terms: [TERM-resid]
  short: 残差の2乗の和が最小になるように、回帰式の係数を決める方法
- id: TERM-regcoef
  name: 回帰係数
  en: regression coefficient
  category: 相関・回帰
  forms: [number]
  basis:
    text: 目的変数 y を説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を最小二乗法で求めたときの、説明変数 x_j に掛かる係数 b_j（説明変数の値が1次従属でないことは定義の要件。そうでないと係数が1つに決まらない）
    terms: [TERM-ols]
  short: 回帰式で、説明変数が1増えたときに目的変数がどれだけ変わると見込むかを表す係数
- id: TERM-resid
  name: 残差
  en: residual
  category: 相関・回帰
  forms: [number]
  basis:
    text: データに当てはめた回帰式について、i 番目の観測値 yᵢ から、その説明変数の値での回帰式の予測値 ŷᵢ を引いた値 eᵢ＝yᵢ−ŷᵢ
  short: 観測した値から、回帰式で予測した値を引いた値
- id: TERM-r2
  name: 決定係数
  en: coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: 回帰式を当てはめたデータで、残差の2乗の和を目的変数の偏差の2乗の和で割り、1から引いた値 R²＝1−Σeᵢ²/Σ(yᵢ−ȳ)²（Σ(yᵢ−ȳ)²＞0 は定義の要件）
    terms: [TERM-resid, TERM-dev]
  short: 目的変数のばらつきのうち、回帰式で説明できる割合（0〜1）
- id: TERM-extrap
  name: 外挿
  en: extrapolation
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 回帰式を、当てはめに使ったデータの説明変数の値の範囲の外の値に当てはめて、目的変数を予測すること
  short: 回帰式を、データのある範囲の外の説明変数の値に当てはめて予測すること
- id: TERM-mreg
  name: 重回帰分析
  en: multiple regression analysis
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 目的変数 y を k 個（k≧1）の説明変数 x₁, …, x_k の1次式 ŷ＝b₀＋b₁x₁＋…＋b_kx_k で表す回帰式を、最小二乗法で求める分析（名前の「重」は k≧2 の場合を指して使う）
    terms: [TERM-ols]
  short: 2つ以上の説明変数で目的変数を表す式を求める分析
- id: TERM-dummy
  name: ダミー変数
  en: dummy variable
  category: 相関・回帰
  forms: [rv]
  basis:
    text: 質的変数の1つのカテゴリについて、そのカテゴリに当てはまる個体で1、当てはまらない個体で0をとる変数
    terms: [TERM-qual]
  short: 質的変数を回帰分析で使うため、当てはまれば1・当てはまらなければ0とした変数
- id: TERM-adjr2
  name: 自由度調整済み決定係数
  en: adjusted coefficient of determination
  category: 相関・回帰
  forms: [number]
  basis:
    text: k 個の説明変数の回帰式を n 個のデータに当てはめたとき（n−k−1≧1 は定義の要件）、決定係数 R² を全体の自由度 n−1 と残差の自由度 n−k−1 で補正した 1−(1−R²)(n−1)/(n−k−1)
    terms: [TERM-r2, TERM-df]
  short: 説明変数を増やすだけでは大きくならないように、自由度で補正した決定係数
- id: TERM-ms
  name: 平均平方
  en: mean square
  category: 検定
  forms: [rv]
  basis:
    text: 平方和をその自由度で割った値（群間・群内・回帰・残差などの平方和ごとに作る）
    terms: [TERM-df]
  short: 平方和をその自由度で割った値で、分散分析や回帰でばらつきの大きさを比べるのに使う
- id: TERM-multicol
  name: 多重共線性
  en: multicollinearity
  category: 相関・回帰
  forms: [property]
  basis:
    text: 重回帰分析で、説明変数どうしの間に強い1次の関係がある（ある説明変数が、ほかの説明変数の1次式でほぼ表せる）こと
    terms: [TERM-mreg]
  short: 重回帰分析で、説明変数どうしの相関が強く、回帰係数の推定が不安定になること
- id: TERM-strat-sampling
  name: 層化抽出
  en: stratified sampling
  category: 調査・実験
  short: 母集団をいくつかの層に分け、各層から無作為に標本を選ぶ方法
- id: TERM-cluster-sampling
  name: 集落抽出
  en: cluster sampling
  category: 調査・実験
  short: 母集団を集落（学校・地区など）に分け、無作為に選んだ集落の全員を調べる方法
- id: TERM-systematic-sampling
  name: 系統抽出
  en: systematic sampling
  category: 調査・実験
  short: 名簿の最初の1人を無作為に選び、そこから一定の間隔で選んでいく方法
- id: TERM-multistage-sampling
  name: 多段抽出
  en: multistage sampling
  category: 調査・実験
  short: 大きな単位から順に、何段階かに分けて無作為に選んでいく方法
- id: TERM-sampling-error
  name: 標本誤差
  en: sampling error
  category: 調査・実験
  short: 母集団の一部（標本）だけを調べることで生じる、結果と真の値のずれ
- id: TERM-nonsampling-error
  name: 非標本誤差
  en: non-sampling error
  category: 調査・実験
  short: 回答の誤り・無回答・抽出枠の不備など、標本を選ぶこと以外で生じるずれ
- id: TERM-randomize
  name: 無作為化
  en: randomization
  category: 調査・実験
  short: 実験で、対象をくじ引きのように処理の群へ割り当てること
- id: TERM-confound
  name: 交絡
  en: confounding
  category: 調査・実験
  short: 調べたい要因と結果の両方に関係する別の要因があり、その効果を区別できなくなること
- id: TERM-anova
  name: 分散分析
  en: analysis of variance
  category: 検定
  forms: [procedure]
  basis:
    text: g 個の群の母平均がすべて等しいという H₀ を、F＝群間の平均平方÷群内の平均平方 で検定する仮説検定（教材の範囲は一元配置。g≧2 で定義でき、2級では主に g≧3 で使う）
    terms: [TERM-test, TERM-ms]
  short: 3つ以上の群の平均に差があるかを、群の間と群の中のばらつきの比（F 分布）で調べる方法
- id: TERM-multcomp
  name: 多重比較
  en: multiple comparisons
  category: 検定
  forms: [procedure]
  basis:
    text: 複数の帰無仮説（群の組ごとなど）をそれぞれ仮説検定するとき、正しい帰無仮説のうちどれか1つでも第1種の過誤を起こす確率（ファミリーワイズの誤り率）が決めた有意水準 α 以下になるように、各検定の基準を調整して判定する手続き（ボンフェローニの方法など）
    terms: [TERM-test, TERM-type1, TERM-alpha]
  short: 多くの群の組を検定するとき、全体として誤る確率が大きくならないように調整して比べる方法
- id: TERM-posterior
  name: 事後確率
  en: posterior probability
  category: 確率
  forms: [number]
  basis:
    text: 結果 D を見たあとの、原因・仮説 H の条件付き確率 P(H|D)
    terms: [TERM-cond]
  short: データ（結果）を見たあとで、ベイズの定理で更新した原因や仮説の確率
- id: TERM-mean
  name: 平均（算術平均）
  en: arithmetic mean
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 足すことに意味のある値（量的変数）のデータ x₁, …, xₙ（n≧1。量的変数であることは定義の要件）の値をすべて足し、個数 n で割った値 x̄＝(x₁＋…＋xₙ)/n
    terms: []
  short: データの値をすべて足し、データの個数で割った値
- id: TERM-prob
  name: 確率（確率の公理）
  en: probability (axioms)
  category: 確率
  forms: [function, number]
  basis:
    text: 標本空間の事象 A のそれぞれに数 P(A) を対応させる関数で、どの A でも P(A)≧0、P(Ω)＝1、互いに排反な事象 A₁, A₂, … では P(A₁∪A₂∪…)＝P(A₁)＋P(A₂)＋…（確率の公理）を満たすもの。その値 P(A) も確率と呼ぶ
    terms: [TERM-event, TERM-sample-space, TERM-exclusive]
  short: 事象の起こりやすさを0〜1の数で表したもので、全体は1、排反な事象では確率を足せる
- id: TERM-addition
  name: 加法定理
  en: addition rule
  category: 確率
  forms: [proposition]
  claims: [CLM-32]
  basis:
    text: どの2つの事象 A・B についても P(A∪B)＝P(A)＋P(B)−P(A∩B)（④-32）
    terms: [TERM-prob, TERM-event]
  short: 2つの事象のどちらかが起こる確率は、それぞれの確率の和から両方が起こる確率を引いたもの
- id: TERM-multiplication
  name: 乗法定理
  en: multiplication rule
  category: 確率
  forms: [proposition]
  claims: [CLM-33]
  basis:
    text: P(A)＞0 の事象 A とどの事象 B についても P(A∩B)＝P(A)P(B|A)（④-33）
    terms: [TERM-prob, TERM-cond, TERM-event]
  short: 2つの事象が両方起こる確率は、一方の確率と、それが起きたときの他方の条件付き確率の積
- id: TERM-total-prob
  name: 全確率の公式
  en: law of total probability
  category: 確率
  forms: [proposition]
  claims: [CLM-34]
  basis:
    text: 事象 A₁, …, A_k が互いに排反で合わせると Ω になり、どれも P(Aᵢ)＞0 のとき、どの事象 B についても P(B)＝Σ P(Aᵢ)P(B|Aᵢ)（④-34）
    terms: [TERM-prob, TERM-cond, TERM-event, TERM-exclusive]
  short: 起こり方を排反な場合に分け、場合ごとの確率×条件付き確率を足して全体の確率を求める式
- id: TERM-bernoulli
  name: ベルヌーイ分布
  en: Bernoulli distribution
  category: 確率分布
  group: GRP-dist-count
  forms: [distribution]
  short: 1回の試行で、成功（1）を確率 p、失敗（0）を確率 1−p でとる分布
  definition: 値 1 を確率 p、値 0 を確率 1−p でとる確率変数の分布。成功を1、失敗を0と数えた1回の試行の結果の分布。
  version: 1
  principle: とる値が 0 と 1 の2つだけなので、確率 p 1つで分布が決まる。1回の成功の回数（0回か1回）とみると、n 回分を足したものが二項分布になる。
  formulas:
  - id: F-bernoulli-pmf
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: k
      meaning: X がとる値（成功なら1、失敗なら0）
      range: 0 か 1
      key: k
      kind: value
      domain: {min: 0, max: 1, integer: true}
    - symbol: p
      meaning: 1回の成功確率
      range: 0以上1以下
      key: p
      kind: param
      domain: {min: 0, max: 1}
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "k"}]}], "name": "P"}, {"op": "mul", "args": [{"op": "pow", "args": [{"sym": "p"}, {"sym": "k"}]}, {"op": "pow", "args": [{"op": "sub", "args": [{"num": 1}, {"sym": "p"}]}, {"op": "sub", "args": [{"num": 1}, {"sym": "k"}]}]}]}]}
  basis_formula: F-bernoulli-pmf
  conditions:
    math:
    - text: 0≦p≦1
      kind: 要件
      outside: 母数が範囲の外なら、この定義のベルヌーイ分布として扱えない
  example: 表が出る確率 0.5 の硬貨を1回投げ、表を1、裏を0とすると、X はベルヌーイ分布に従う。P(X＝1)＝0.5、P(X＝0)＝0.5。
  counterexample: さいころを1回投げた目そのもの（1〜6）は、値が2つでないのでベルヌーイ分布ではない。「6が出たら1、それ以外は0」と数え直せば、p＝1/6 のベルヌーイ分布になる。
  sources:
  - source: 公式2級範囲表
  checks:
  - 0.5**1*(1-0.5)**0 == 0.5 and 0.5**0*(1-0.5)**1 == 0.5
  - Fraction(1,6)**1*(1-Fraction(1,6))**0 == Fraction(1,6)
- id: TERM-sample-mean
  name: 標本平均
  en: sample mean
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 標本 X₁, …, Xₙ（n は1以上）から作る統計量 X̄＝(X₁＋…＋Xₙ)/n（観測したあとの値も同じ名前で呼ぶ）
    terms: [TERM-statistic]
  short: 標本のデータの値を足し、データの個数で割った値
- id: TERM-sample-prop
  name: 標本比率
  en: sample proportion
  category: 標本分布・極限
  forms: [rv]
  basis:
    text: 各個体が性質をもてば1、もたなければ0とした標本 X₁, …, Xₙ の標本平均 p̂＝(X₁＋…＋Xₙ)/n（性質をもつ個数÷n）
    terms: [TERM-sample-mean]
  short: 標本の中で、ある性質をもつものの割合
- id: TERM-interval-est
  name: 区間推定
  en: interval estimation
  category: 推定
  forms: [procedure]
  basis:
    text: 信頼係数 1−α（名目）を決め、それに合わせて作った信頼区間を標本から求めて、母数 θ の値の範囲として示す手続き（作り方ごとの保証は、その手続きの成立条件で言う。近似の作り方では、1−α に近づくのは各母数の値ごと：④-19）
    terms: [TERM-conf-level, TERM-ci, TERM-parameter]
  short: 母数の値を、幅をもった区間で推定すること
- id: TERM-test
  name: 仮説検定
  en: hypothesis testing
  category: 検定
  forms: [procedure]
  basis:
    text: 母集団の分布についての帰無仮説 H₀ と対立仮説 H₁ を立て、有意水準 α を前もって決め、H₀ が正しいときに検定統計量 T が入る確率が α 以下になる棄却域 R を（H₁ の向きに合わせて）選び、T の観測値が R に入れば H₀ を棄却し、入らなければ棄却しない手続き
    terms: [TERM-h0, TERM-h1, TERM-alpha, TERM-test-stat, TERM-reject]
  short: 母集団についての仮説を立て、その仮説のもとでデータが起こりにくいかどうかで、仮説を棄却するかを決める方法
- id: TERM-quantile
  name: 分位点
  en: quantile
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 量的なデータ（n≧1）を小さい順に並べた x₍₁₎≦…≦x₍ₙ₎ と割合 p（0≦p≦1）について、1＋p(n−1) 番目の位置の値（位置が整数でないときは、前後の2つの値を比例で埋める。線形補間の決め方）
    terms: []
  short: データを小さい順に並べ、決めた割合の位置にくる値（下から10%の位置など）
- id: TERM-range
  name: 範囲
  en: range
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データの最大値から最小値を引いた値
    terms: []
  short: データの最大値から最小値を引いた値
- id: TERM-slr
  name: 単回帰
  en: simple linear regression
  category: 相関・回帰
  forms: [procedure]
  basis:
    text: 1つの説明変数 x で目的変数 y を表す直線の式 ŷ＝a＋bx（回帰直線）を、最小二乗法で求める分析
    terms: [TERM-ols]
  short: 1つの説明変数で目的変数を表す直線の式（回帰直線）を求める分析
- id: TERM-std-normal
  name: 標準正規分布
  en: standard normal distribution
  category: 確率分布
  group: GRP-dist-cont
  forms: [distribution]
  short: 平均0・標準偏差1の正規分布 N(0, 1) で、正規分布に従う量を標準化するとこの分布に従う
- id: TERM-uncorr
  name: 無相関
  en: uncorrelated
  category: 確率分布
  group: GRP-dist-base
  forms: [property]
  short: 2つの確率変数の共分散が0で、直線的に一緒に増える・減る傾向がないこと
- id: TERM-data-var
  name: データの分散
  en: variance of data
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: 量的変数のデータ x₁, …, xₙ（n≧1）の偏差の2乗の平均 {(x₁−x̄)²＋…＋(xₙ−x̄)²}/n
    terms: [TERM-dev]
  short: データの各値の偏差を2乗して平均した値で、データのばらつきの大きさを表す
- id: TERM-data-sd
  name: データの標準偏差
  en: standard deviation of data
  category: 要約（代表値・ばらつき）
  forms: [number]
  basis:
    text: データの分散の正の平方根（データの値と同じ単位のばらつき）
    terms: [TERM-data-var]
  short: データの分散の正の平方根で、データのばらつきを元の単位で表す
- id: TERM-data-cov
  name: データの共分散
  en: covariance of data
  category: 相関・回帰
  forms: [number]
  basis:
    text: 量的な2変数のデータ (x₁, y₁), …, (xₙ, yₙ)（n≧1）の、x と y の偏差の積の平均 {(x₁−x̄)(y₁−ȳ)＋…＋(xₙ−x̄)(yₙ−ȳ)}/n
    terms: [TERM-dev]
  short: 2つの量的変数のデータで、偏差の積を平均した値で、2つが同じ向きにずれるか逆向きにずれるかを表す
