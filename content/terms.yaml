    - symbol: x
      meaning: X がとる値
      key: x
      kind: value
    - symbol: p(x)
      meaning: X が x になる確率
      range: 0以上1以下
      key: p
      concept: TERM-dist
    tree: {"op": "eq", "args": [{"op": "fn", "args": [{"op": "eq", "args": [{"sym": "X"}, {"sym": "x"}]}], "name": "P"}, {"op": "fn", "args": [{"sym": "x"}], "name": "p"}]}
  - tex: '\sum_x p(x)=1'
    label: 確率の合計
    symbols:
    - symbol: p(x)
      meaning: X が x になる確率
      key: p
      concept: TERM-dist
    - symbol: x
      meaning: X がとる値
      key: x
      kind: index
    tree: {"op": "eq", "args": [{"op": "sum", "args": [{"op": "fn", "args": [{"sym": "x"}], "name": "p"}], "var": "x"}, {"num": 1}]}
  conditions:
    math:
    - 起こりうる値の範囲が決まっている
    - 各値の確率が0以上で、合計が1
    data:
    - 「記録する前の値の出方」として扱えるか（同じ仕組みでくり返し起きるか）を確かめる
  example: さいころの目 X は、1〜6 の値をそれぞれ確率 1/6 でとる。
  counterexample: 「今日の売上 120万円」という1つの記録は確率変数ではなく、実現した1つの値。
  misconceptions:
  - misconception: 確率変数は「でたらめな数」のこと
    correction: 値の出方に決まった確率（分布）がある量。でたらめさの中に規則がある
  sources:
  - source: 公式2級範囲表
    locator: 確率モデルの導入（確率変数・確率分布）
  checks:
