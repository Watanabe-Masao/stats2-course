      kind: 要件
      outside: 母数が範囲の外なら、この定義の負の二項分布として扱えない
    - text: 各回が独立
      kind: 仮定
      claim: r 回目の成功までの試行回数 X が負の二項分布に従う
      outside: 試行回数に負の二項分布を使えるとは保証できない（偶然に一致することはある）
      terms:
      - TERM-indep
    - text: 成功確率 p が毎回同じ
      kind: 仮定
      claim: r 回目の成功までの試行回数 X が負の二項分布に従う
      outside: 試行回数に負の二項分布を使えるとは保証できない（偶然に一致することはある）
    data:
    - 「r 回成功するまで」を数える場面（3件成約するまでの訪問回数など）。回数を決めて成功の数を数えるなら二項分布
  example: 成功率0.5で、2回目の成功がちょうど3回目の試行で起きる確率は ₂C₁×0.5²×0.5＝0.25。
  counterexample: 回数 n を先に決めて成功の数を数えるなら二項分布。何を固定し、何を数えるかが逆になる。
