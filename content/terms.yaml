  - id: F-cov-varsum
    label: 和の分散
    symbols:
    - symbol: V( )
      meaning: 分散（ずれの2乗の期待値）
      key: V
      concept: TERM-var
    - symbol: Cov( )
      meaning: 共分散（ずれの積の期待値）
      key: Cov
      concept: TERM-cov
    - symbol: X
      meaning: 確率変数
      key: X
      kind: rv
    - symbol: Y
      meaning: 確率変数
      key: Y
