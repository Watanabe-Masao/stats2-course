- id: TERM-rv
  name: 確率変数
  en: random variable
  definition: 試行の結果に応じて値が決まり、どの値が出るかが確率で表される量。
  version: 1
  labs:
  - {id: LAB-expect, preset: s1-dist, purpose: 値と確率の一覧を動かして、確率変数が「値の出方の規則」を持つことを見る}
  principle: 起こりうる値と、その確率の組（確率分布）で性質が決まる。1つの記録された値ではなく、記録する前の「値の出方」を扱う。
  formulas:
  - tex: 'P(X=x)=p(x)'
    symbols:
    - symbol: P( )
      meaning: 確率
      key: P
      concept: TERM-dist
    - symbol: X
