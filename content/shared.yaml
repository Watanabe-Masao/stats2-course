# 全単元で共通の文言。本文では {{shared:キー}} で呼び出す。
# 教材の名前（知識ネットワークでの ID の頭。stats2:TERM-… の stats2）。変えない。
course: {id: stats2, title: 統計検定2級}
explain_pattern: "「**〈条件〉**のとき、**〈対象〉**は**〈結論〉**になる。なぜなら**〈根拠〉**。ただし**〈成り立たない場合〉**は別。」 成り立たない場合は統計の弱点ではなく、統計で決めることと決めないことの境目。そのとき何で判断するか（データの取り方を変える・現場の知識・費用や価値判断）まで考える。"
exam_scope_note: 統計検定2級の合格に必要なのは初学〜応用（2級の範囲の問題は、難しくても応用に置く）。転用は理解を確かにする段階。発展・創造は試験の枠を外し、統計を理解し、統計の外と切り分ける段階で、得点には入れない。
lab_protocol: 予測→操作→観察→説明→ラボなしで解く
complex_pattern: "① **何が複雑にしているか**（混ざり・要因の絡み合い・前提の崩れ・偏り・偶然の幅）→ ② **なぜ1つの数では言えないか**（要約で消えるもの）→ ③ **どう分けて考えるか**（層別する・条件をそろえる・範囲を区切る・やり直して幅を見る）→ ④ **数字とどう向き合うか**（統計で答えられることと、統計の外で決めることを切り分ける。報告の書き方、次に調べること）"
content_note: 数値例は全て架空。発展・創造は試験の枠の外で、得点には算入しない。
personal_note: 自分の答えや到達の記録は、個人用の学習記録に書く（教材には書き込まない）。

# 単元の領域（ナビの表示に使う）
domains:
  D0: {name: 前提補強, icon: "🔧", tone: yellow}
  D1: {name: ① データの記述, icon: "📊", tone: blue}
  D2: {name: ② 確率, icon: "🎲", tone: purple}
  D3: {name: ③ 確率分布, icon: "📈", tone: orange}
  D4: {name: ④ 標本分布, icon: "🔬", tone: green}
  D5: {name: ⑤ 推定, icon: "📏", tone: pink}
  D6: {name: ⑥ 検定, icon: "⚖️", tone: red}
