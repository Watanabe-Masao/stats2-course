# 全単元で共通の文言。本文では {{shared:キー}} で呼び出す。
# 教材の名前（知識ネットワークでの ID の頭。stats2:TERM-… の stats2）。変えない。
course: {id: stats2, title: 統計検定2級}
explain_pattern: "「**〈条件〉**のとき、**〈対象〉**は**〈結論〉**になる。なぜなら**〈根拠〉**。ただし**〈成り立たない場合〉**は別。」 成り立たない場合は統計の弱点ではなく、統計で決めることと決めないことの境目。そのとき何で判断するか（データの取り方を変える・現場の知識・費用や価値判断）まで考える。"
exam_scope_note: 統計検定2級の合格に必要なのは初学〜応用（2級の範囲の問題は、難しくても応用に置く）。転用は理解を確かにする段階。発展・創造は試験の枠を外し、統計を理解し、統計の外と切り分ける段階で、得点には入れない。
lab_protocol: 予測→操作→観察→説明→ラボなしで解く
exam_choice_note: "統計検定の本番と同じ5択。選んだ理由と、ほかの選択肢がなぜ違うかまで言えるかを確かめる。"   # 応用の「本番形式で解く」の1文（#51）
complex_pattern: "① **何が複雑にしているか**（混ざり・要因の絡み合い・前提の崩れ・偏り・偶然の幅）→ ② **なぜ1つの数では言えないか**（要約で消えるもの）→ ③ **どう分けて考えるか**（層別する・条件をそろえる・範囲を区切る・やり直して幅を見る）→ ④ **数字とどう向き合うか**（統計で答えられることと、統計の外で決めることを切り分ける。報告の書き方、次に調べること）"
content_note: 数値例は全て架空。発展・創造は試験の枠の外で、得点には算入しない。
personal_note: 自分の答えや到達の記録は、個人用の学習記録に書く（教材には書き込まない）。

# 単元の領域（ナビの表示に使う）
domains:
  D0: {name: 前提補強, icon: "🔧", tone: yellow}
  D1: {name: ① データの記述, icon: "📊", tone: blue}
  D2: {name: ② 確率, icon: "🎲", tone: purple}
  D3: {name: ③ 確率分布, icon: "📈", tone: orange}
  D4: {name: ④ 標本分布, icon: "🔬", tone: green}
  D5: {name: ⑤ 推定, icon: "📏", tone: pink}
  D6: {name: ⑥ 検定, icon: "⚖️", tone: red}
  D7: {name: ⑦ 相関・回帰, icon: "🔗", tone: brown}
  D8: {name: ⑧ 調査・実験, icon: "📋", tone: gray}

total_units: 32

# 概念の分類（骨格の段。#105・P1）。terms.yaml の category はこの中から選ぶ。地図のまとまりにも使う
concept_categories: [数学の道具, データと変数, 要約（代表値・ばらつき）, 図表, 時系列, 確率, 確率分布, 標本分布・極限, 推定, 検定, 相関・回帰, 調査・実験]
# 柱（分類の大きなまとまり。上から学ぶ順）：入口のライブラリと島の地図に使う。どの分類もちょうど1つの柱に入れる（build が止める）。色は画面が順に当てる（#220）
concept_pillars:
  - {id: describe, name: データを記述する, categories: [データと変数, 図表, 要約（代表値・ばらつき）, 相関・回帰, 時系列]}
  - {id: prob, name: 確率で考える, categories: [数学の道具, 確率, 確率分布, 標本分布・極限]}
  - {id: infer, name: 推測する, categories: [調査・実験, 推定, 検定]}
# 関係図（docs/relation-map.md・#233）：分類の中のまとまり（並べた順が学ぶ順。語は terms.yaml の group で1つに属する）と、
# 関係図の決まりで書き終えた分類（build はこの分類にだけ、まとまりのない語・前提 mathematical・axis のない対比を止める）
concept_groups:
  # 確率分布（関係図の見本。docs/relation-map-design.md 4。渡辺さん 2026-11-06 D4）
  - {id: GRP-dist-base, category: 確率分布, name: 分布のしくみ, summary: 確率変数と、その値の出方を表す分布・密度、2つの変数のずれ方}
  - {id: GRP-dist-count, category: 確率分布, name: くり返して数える, summary: 取り出し・試行をくり返して、当たりや成功の数を数える}
  - {id: GRP-dist-wait, category: 確率分布, name: 待つ・まれに起こる, summary: 成功までの回数を待つ、まれな出来事の回数を数える}
  - {id: GRP-dist-cont, category: 確率分布, name: 連続の分布, summary: 値が連続にとれ、確率を密度の面積で表す分布}
  # ほかの11分類（関係図への一本化。#587・#588。2026-11-23。学ぶ順に並べる）
  - {id: GRP-math-expr, category: 数学の道具, name: 式を読む・動かす, summary: 足し合わせる記号、入れた値に出る値を決める約束、等式を解く操作}
  - {id: GRP-math-count, category: 数学の道具, name: 並べ方・選び方を数える, summary: 区別できるものを並べる数・選ぶ数と、それを作る掛け算}
  - {id: GRP-data-whole, category: データと変数, name: 全体と一部, summary: 調べたい全体と取り出した一部、それぞれの性質を表す値}
  - {id: GRP-data-var, category: データと変数, name: 変数の種類, summary: 値がもつ情報の段階で、変数を分類と数量に分ける}
  - {id: GRP-data-ratio, category: データと変数, name: 割合の言い方, summary: 全体に対する部分の大きさと、2つの割合の差の言い方}
  - {id: GRP-chart-one, category: 図表, name: 1つの変数の分布を見る, summary: 1つの量的変数の値が、どこにどれだけあるかを表や図にする}
  - {id: GRP-chart-two, category: 図表, name: 2つの変数の組を見る, summary: 2つの変数の値の組を、表や点で並べて関係を見る}
  - {id: GRP-sum-center, category: 要約（代表値・ばらつき）, name: 真ん中を1つの数にする, summary: データの中心を、平均・真ん中の値・多い値・倍率の平均で表す}
  - {id: GRP-sum-pos, category: 要約（代表値・ばらつき）, name: 並べた位置で区切る, summary: 小さい順に並べた位置の値と、その間の広がり・外れた値}
  - {id: GRP-sum-spread, category: 要約（代表値・ばらつき）, name: 平均からのずれで測る, summary: 平均からのずれを2乗して平均し、ばらつきを1つの数や物差しにする}
  - {id: GRP-sum-shape, category: 要約（代表値・ばらつき）, name: 分布の形, summary: 左右の非対称さと裾の重さを数にする}
  - {id: GRP-sum-rv, category: 要約（代表値・ばらつき）, name: 確率変数の平均とばらつき, summary: データの平均とばらつきを、確率で重み付けした形で確率変数に移す}
  - {id: GRP-prob-event, category: 確率, name: 出来事を集合で表す, summary: 起こりうる結果の全体と、注目する結果の集まり、その関係}
  - {id: GRP-prob-calc, category: 確率, name: 確率を計算する, summary: 和・積・条件付きの確率の決まりと、場合に分けて足す計算}
  - {id: GRP-prob-bayes, category: 確率, name: 結果から原因をさかのぼる, summary: 見る前の確率を、結果の起こりやすさで見たあとの確率に更新する}
  - {id: GRP-survey-way, category: 調査・実験, name: 標本の選び方, summary: 母集団から標本を無作為に選ぶ方法と、その工夫}
  - {id: GRP-survey-error, category: 調査・実験, name: ずれの出どころ, summary: 一部だけを調べるずれと、それ以外の理由で一定の向きに生じるずれ}
  - {id: GRP-survey-exp, category: 調査・実験, name: 実験で比べる, summary: ほかの要因の混ざりを、くじ引きの割り当てで切り離す}
  - {id: GRP-sd-stat, category: 標本分布・極限, name: 統計量のばらつき, summary: 標本を取り直すたびに変わる統計量の分布と、そのばらつきの大きさ}
  - {id: GRP-sd-limit, category: 標本分布・極限, name: 標本を大きくすると, summary: n を大きくしたときに標本平均とその分布が近づく先}
  - {id: GRP-sd-dist, category: 標本分布・極限, name: 推定・検定で使う分布, summary: 正規分布から作られ、自由度で形が決まる分布}
  - {id: GRP-est-point, category: 推定, name: 1つの値で推定する, summary: 母数を、標本から決まる式の値1つで見込む}
  - {id: GRP-est-good, category: 推定, name: 推定量のよさ, summary: 推定量が母数にどれだけ近いかを、偏り・ばらつき・n を増やしたときで比べる}
  - {id: GRP-est-interval, category: 推定, name: 幅で推定する, summary: 母数を含む確率の下限が決まった作り方で、区間を作る}
  - {id: GRP-test-frame, category: 検定, name: 仮説を立てて判定する, summary: 仮説と、ずれを1つの数にした統計量、棄却するかを決める基準}
  - {id: GRP-test-error, category: 検定, name: 判定の誤り, summary: 正しい仮説を棄却する誤りと、誤った仮説を見逃す誤り}
  - {id: GRP-test-mean, category: 検定, name: 平均を比べる検定, summary: 2群・多群の平均の差を、t 分布や F 分布で調べる}
  - {id: GRP-test-count, category: 検定, name: 度数・割合を比べる検定, summary: 観測した度数や割合が、仮説のもとの見込みとずれるかを調べる}
  - {id: GRP-ts, category: 時系列, name: 時間の並びを読む, summary: 時間順の値の細かい変動をならし、前の時点との似かたを数にする}
  - {id: GRP-corr, category: 相関・回帰, name: 2つの変数の関係の強さ, summary: 2つの量的変数が同じ向きにずれる度合いと、見かけの関係}
  - {id: GRP-reg-fit, category: 相関・回帰, name: 回帰式を求める, summary: 説明変数から目的変数を見込む1次式を、残差を小さくして決める}
  - {id: GRP-reg-eval, category: 相関・回帰, name: 回帰式の当てはまりと注意, summary: 回帰式がどれだけ説明するかと、使うときに崩れる所}
relation_map_ready: [確率分布, 数学の道具, データと変数, 図表, 要約（代表値・ばらつき）, 確率, 調査・実験, 標本分布・極限, 推定, 検定, 時系列, 相関・回帰]   # 全分類（#588。2026-11-23）
# 型 v2 で書き終えた分類（製本への移行。docs/schema-v2-design.md 8・#264）。relation_map_ready（v1 の関係図の決まり）とは別。
# 空のあいだ、build は全部の関係を legacy_type（v1 の種類の名前）で書き出す。分類を足すのは M5（#265）
v2_ready: [確率分布, 確率, 標本分布・極限, 推定, 検定, 要約（代表値・ばらつき）, 相関・回帰, 調査・実験, データと変数, 図表, 時系列, 数学の道具]   # 2026-11-09（確率分布 #289・確率 #295・標本分布・極限 #298・推定 #301・検定 #304・要約 #310）・2026-11-10（相関・回帰 #317・調査・実験 #321・データと変数 #323・図表 #326・時系列 #329・数学の道具 #332）
# まとまりの間の関係（関係図の全体の見え方の矢印。#240。渡辺さん 2026-11-07）。矢印は「どう移るか」だけで、1本に1つの意味。
# 種類は書かない（指した関係から決まる）。label は矢印の言葉、note は矢印を開いた直後に最初に出す1文（分布の組・操作・成り立つ条件）
group_relations:
  - from: GRP-dist-count
    to: GRP-dist-cont
    label: 確率を保って回数を増やす
    relations: [REL-binom-normal]
    note: 二項分布 → 標準正規分布（極限）。1回の成功確率 p を保ったまま試行回数 n を増やすと、標準化した成功回数の分布は標準正規分布に近づく。成功の期待回数 np と失敗の期待回数 n(1−p) がともに十分大きいとき、二項分布の確率を正規分布で近似できる。二項分布が連続の分布に変わるのではない。
  - from: GRP-dist-count
    to: GRP-dist-wait
    label: 平均を保って回数を増やす
    relations: [REL-binom-poisson]
    note: 二項分布 → ポアソン分布（極限）。成功回数の平均 np を一定に保ちながら試行回数 n を増やす（そのぶん1回の成功確率 p を小さくする）と、ポアソン分布に近づく。
  - from: GRP-dist-wait
    to: GRP-dist-cont
    label: 問いを入れ替える
    claims: [CLM-25]
    note: ポアソン過程の2つの見方。重ならない時間の件数が独立で、長さ t の件数がどこでも Po(λt) になる出来事（ポアソン過程）で、「一定時間に何件起きるか」から「次の1件まで何分待つか」へ問いを替えると、待ち時間は指数分布になる。件数がポアソン分布というだけでは言えない。
# 骨格の完了の条件を build で止めるか（129語の骨格がそろったので true：定義1文・分類がない語や孤立した語が出たら build が止める）
  # 相関・回帰（関係図への一本化。#588 の A5。2026-11-24）：分類の中のまとまりをまたぐ「移る」は、この2本だけ（ほかは定める・一種・比べるで、矢印にしない）
  - from: GRP-corr
    to: GRP-reg-fit
    label: ばらつきの比を掛ける
    relations: [REL-corr-regcoef]
    note: 相関係数 → 回帰係数（厳密）。切片を含む単回帰を最小二乗で当てはめると、傾きは相関係数に y と x の標準偏差の比 s_y/s_x を掛けたものに等しい。相関係数は単位のない「そろい方」で、傾きは x が1増えたときの y の見込みの増え方。
  - from: GRP-corr
    to: GRP-reg-eval
    label: 2乗する
    relations: [REL-corr-r2]
    note: 相関係数 → 決定係数（厳密）。切片を含む単回帰を最小二乗で当てはめると、決定係数は相関係数の2乗に等しい。r＝0.9 なら 81%。
skeleton_required: true

