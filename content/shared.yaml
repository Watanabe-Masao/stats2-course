total_units: 32

# 概念の分類（骨格の段。#105・P1）。terms.yaml の category はこの中から選ぶ。地図のまとまりにも使う
concept_categories: [数学の道具, データと変数, 要約（代表値・ばらつき）, 図表, 時系列, 確率, 確率分布, 標本分布・極限, 推定, 検定, 相関・回帰, 調査・実験]
# 柱（分類の大きなまとまり。上から学ぶ順）：入口のライブラリと島の地図に使う。どの分類もちょうど1つの柱に入れる（build が止める）。色は画面が順に当てる（#220）
concept_pillars:
  - {id: describe, name: データを記述する, categories: [データと変数, 図表, 要約（代表値・ばらつき）, 相関・回帰, 時系列]}
  - {id: prob, name: 確率で考える, categories: [数学の道具, 確率, 確率分布, 標本分布・極限]}
  - {id: infer, name: 推測する, categories: [調査・実験, 推定, 検定]}
# 関係図（docs/relation-map.md・#233）：分類の中のまとまり（並べた順が学ぶ順。語は terms.yaml の group で1つに属する）と、
# 関係図の決まりで書き終えた分類（build はこの分類にだけ、まとまりのない語・前提 mathematical・axis のない対比を止める）
concept_groups:
  # 確率分布（関係図の見本。docs/relation-map-design.md 4。渡辺さん 2026-11-06 D4）
  - {id: GRP-dist-base, category: 確率分布, name: 分布のしくみ, summary: 確率変数と、その値の出方を表す分布・密度、2つの変数のずれ方}
  - {id: GRP-dist-count, category: 確率分布, name: くり返して数える, summary: 取り出し・試行をくり返して、当たりや成功の数を数える}
  - {id: GRP-dist-wait, category: 確率分布, name: 待つ・まれに起こる, summary: 成功までの回数を待つ、まれな出来事の回数を数える}
  - {id: GRP-dist-cont, category: 確率分布, name: 連続の分布, summary: 値が連続にとれ、確率を密度の面積で表す分布}
relation_map_ready: [確率分布]
# 型 v2 で書き終えた分類（製本への移行。docs/schema-v2-design.md 8・#264）。relation_map_ready（v1 の関係図の決まり）とは別。
# 空のあいだ、build は全部の関係を legacy_type（v1 の種類の名前）で書き出す。分類を足すのは M5（#265）
v2_ready: []
# まとまりの間の関係（関係図の全体の見え方の矢印。#240。渡辺さん 2026-11-07）。矢印は「どう移るか」だけで、1本に1つの意味。
# 種類は書かない（指した関係から決まる）。label は矢印の言葉、note は矢印を開いた直後に最初に出す1文（分布の組・操作・成り立つ条件）
group_relations:
  - from: GRP-dist-count
    to: GRP-dist-cont
    label: 確率を保って回数を増やす
    relations: [REL-binom-normal]
    note: 二項分布 → 正規分布（近似）。1回の成功確率 p を保ったまま試行回数 n を増やすと、成功の期待回数 np と失敗の期待回数 n(1−p) がともに十分大きいとき、二項分布の確率を正規分布で近似できる。二項分布が連続の分布に変わるのではない。
  - from: GRP-dist-count
    to: GRP-dist-wait
    label: 平均を保って回数を増やす
    relations: [REL-binom-poisson]
    note: 二項分布 → ポアソン分布（極限）。成功回数の平均 np を一定に保ちながら試行回数 n を増やす（そのぶん1回の成功確率 p を小さくする）と、ポアソン分布に近づく。
  - from: GRP-dist-wait
    to: GRP-dist-cont
    label: 問いを入れ替える
    relations: [REL-poisson-expo]
    note: ポアソン分布 → 指数分布（導出）。一定の割合で独立に起きる出来事（ポアソン過程）で、「一定時間に何件起きるか」から「次の1件まで何分待つか」へ問いを替えると、待ち時間は指数分布になる。件数がポアソン分布というだけでは言えない。
# 骨格の完了の条件を build で止めるか（129語の骨格がそろったので true：定義1文・分類がない語や孤立した語が出たら build が止める）
skeleton_required: true

# 原本の外にある参照先（表示名）。リンク先は公開先ごとに publish/*.yaml の refs で決める。
# 旧版の確認問題・本番形式問題は、問題を原本へ取り込んだら refs から外す。
refs:
  REF-PQ-DB: 本番形式問題（5択）
  REF-CONFUSION: 混同しやすい点を図で比べる

sources:
