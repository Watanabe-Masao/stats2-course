explain_pattern: "「**〈条件〉**のとき、**〈対象〉**は**〈結論〉**になる。なぜなら**〈根拠〉**。ただし**〈成り立たない場合〉**は別。」"
exam_scope_note: 統計検定2級の合格に必要なのは初学〜応用。転用は理解を確かにする段階。発展・創造は試験範囲外も含み、得点には入れない。
lab_protocol: 予想→操作→観察→説明→ラボなしで解く
content_note: 数値例は全て架空。発展・創造は試験範囲外を含み、得点には算入しない。
personal_note: 自分の答えや到達の記録は、個人用の学習記録に書く（教材には書き込まない）。

