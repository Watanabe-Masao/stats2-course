<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" font-family="sans-serif"><rect width="480" height="270" fill="#fcfcfb"/><text x="16" y="26" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">母集団・抽出枠・標本：枠から漏れた所は選ばれない</text><rect x="20" y="44" width="440" height="190" rx="10" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="32" y="64" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="bold">母集団：対象の全店舗（105店）</text><rect x="40" y="76" width="300" height="146" rx="8" fill="#f4f3ef" stroke="#52514e" stroke-width="1.5"/><text x="52" y="96" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">抽出枠：店舗台帳（100店）</text><rect x="150" y="118" width="150" height="84" rx="8" fill="#fdf1ea" stroke="#eb6834" stroke-width="1.5"/><text x="225" y="152" font-size="14" fill="#eb6834" text-anchor="middle" font-weight="bold">標本</text><text x="225" y="172" font-size="12" fill="#52514e" text-anchor="middle">無作為に10店</text><text x="100" y="150" font-size="11" fill="#52514e" text-anchor="middle">各店の</text><text x="100" y="166" font-size="11" fill="#52514e" text-anchor="middle">確率 10/100</text><text x="100" y="182" font-size="11" fill="#52514e" text-anchor="middle">＝0.1</text><circle cx="370" cy="130" r="8" fill="#e34948" fill-opacity="0.85"/><circle cx="396" cy="130" r="8" fill="#e34948" fill-opacity="0.85"/><circle cx="422" cy="130" r="8" fill="#e34948" fill-opacity="0.85"/><circle cx="370" cy="160" r="8" fill="#e34948" fill-opacity="0.85"/><circle cx="396" cy="160" r="8" fill="#e34948" fill-opacity="0.85"/><text x="396" y="196" font-size="12" fill="#e34948" text-anchor="middle" font-weight="bold">新店5店</text><text x="396" y="212" font-size="11" fill="#e34948" text-anchor="middle">台帳に無い→確率0</text><text x="16" y="260" font-size="12" fill="#52514e" text-anchor="start">無作為化しても、枠の漏れ（カバー誤差）は直らない</text></svg>