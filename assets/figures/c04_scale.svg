<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="sans-serif"><rect width="480" height="300" fill="#fcfcfb"/><text x="16" y="26" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">尺度の階段：上がるほど、意味のある計算が増える</text><rect x="18" y="214" width="105" height="48" rx="6" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/><text x="70.5" y="234" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">名義</text><text x="70.5" y="252" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="bold">＝ ≠</text><text x="70.5" y="206" font-size="10" fill="#52514e" text-anchor="middle">店番・血液型</text><rect x="129" y="166" width="105" height="96" rx="6" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/><text x="181.5" y="186" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">順序</text><text x="181.5" y="204" font-size="13" fill="#eb6834" text-anchor="middle" font-weight="bold">＋（＜ ＞）</text><text x="181.5" y="224" font-size="11" fill="#52514e" text-anchor="middle">順番まで</text><text x="181.5" y="242" font-size="10" fill="#52514e" text-anchor="middle">満足度・順位</text><rect x="240" y="118" width="105" height="144" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="292.5" y="138" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">間隔</text><text x="292.5" y="156" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="bold">＋（＋ −）</text><text x="292.5" y="176" font-size="11" fill="#52514e" text-anchor="middle">差まで</text><text x="292.5" y="194" font-size="10" fill="#52514e" text-anchor="middle">気温℃・西暦</text><text x="292.5" y="222" font-size="10" fill="#52514e" text-anchor="middle">0℃でも温度はある</text><text x="292.5" y="236" font-size="10" fill="#52514e" text-anchor="middle">→ 何倍は言えない</text><rect x="351" y="70" width="105" height="192" rx="6" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/><text x="403.5" y="90" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">比例</text><text x="403.5" y="108" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="bold">＋（× ÷）</text><text x="403.5" y="128" font-size="11" fill="#52514e" text-anchor="middle">比（何倍）まで</text><text x="403.5" y="146" font-size="10" fill="#52514e" text-anchor="middle">個数・重さ・売上</text><text x="403.5" y="174" font-size="10" fill="#52514e" text-anchor="middle">0個＝何も無い</text><text x="403.5" y="188" font-size="10" fill="#52514e" text-anchor="middle">→ 何倍が言える</text><line x1="18" y1="270" x2="234" y2="270" stroke="#eb6834" stroke-width="2"/><text x="126" y="286" font-size="11" fill="#eb6834" text-anchor="middle">質的変数（数えて割合で見る）</text><line x1="240" y1="270" x2="456" y2="270" stroke="#2a78d6" stroke-width="2"/><text x="348" y="286" font-size="11" fill="#2a78d6" text-anchor="middle">量的変数（平均・分散が使える）</text></svg>