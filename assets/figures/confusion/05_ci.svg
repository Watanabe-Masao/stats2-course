<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif"><rect width="640" height="300" fill="#ffffff"/><text x="320" y="24" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="700">同じ方法で区間を20回つくると…</text><line x1="320" y1="40" x2="320" y2="262" stroke="#1f1f1d" stroke-width="2" stroke-dasharray="5 3"/><text x="320" y="280" font-size="12" fill="#1f1f1d" text-anchor="middle" font-weight="700">真の μ（固定・動かない）</text><line x1="148" y1="48" x2="360" y2="48" stroke="#2a78d6" stroke-width="2.6"/><circle cx="254" cy="48" r="2.6" fill="#2a78d6"/><line x1="235" y1="59" x2="446" y2="59" stroke="#2a78d6" stroke-width="2.6"/><circle cx="340" cy="59" r="2.6" fill="#2a78d6"/><line x1="268" y1="69" x2="480" y2="69" stroke="#2a78d6" stroke-width="2.6"/><circle cx="374" cy="69" r="2.6" fill="#2a78d6"/><line x1="186" y1="80" x2="398" y2="80" stroke="#2a78d6" stroke-width="2.6"/><circle cx="292" cy="80" r="2.6" fill="#2a78d6"/><line x1="142" y1="90" x2="354" y2="90" stroke="#2a78d6" stroke-width="2.6"/><circle cx="248" cy="90" r="2.6" fill="#2a78d6"/><line x1="211" y1="101" x2="422" y2="101" stroke="#2a78d6" stroke-width="2.6"/><circle cx="316" cy="101" r="2.6" fill="#2a78d6"/><line x1="240" y1="112" x2="452" y2="112" stroke="#2a78d6" stroke-width="2.6"/><circle cx="346" cy="112" r="2.6" fill="#2a78d6"/><line x1="273" y1="122" x2="485" y2="122" stroke="#2a78d6" stroke-width="2.6"/><circle cx="379" cy="122" r="2.6" fill="#2a78d6"/><line x1="149" y1="133" x2="360" y2="133" stroke="#2a78d6" stroke-width="2.6"/><circle cx="254" cy="133" r="2.6" fill="#2a78d6"/><line x1="144" y1="143" x2="356" y2="143" stroke="#2a78d6" stroke-width="2.6"/><circle cx="250" cy="143" r="2.6" fill="#2a78d6"/><line x1="252" y1="154" x2="464" y2="154" stroke="#2a78d6" stroke-width="2.6"/><circle cx="358" cy="154" r="2.6" fill="#2a78d6"/><line x1="240" y1="165" x2="451" y2="165" stroke="#2a78d6" stroke-width="2.6"