<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Hiragino Sans,Noto Sans JP,Yu Gothic,sans-serif"><rect width="640" height="280" fill="#ffffff"/><text x="160" y="24" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="700">排反：同時に起きない</text><text x="480" y="24" font-size="14" fill="#eb6834" text-anchor="middle" font-weight="700">独立：Aが起きてもBの確率は同じ</text><line x1="320" y1="40" x2="320" y2="262" stroke="#e4e3df" stroke-width="1.5"/><rect x="30" y="50" width="260" height="170" rx="6" fill="#f4f3ef" stroke="#e4e3df" stroke-width="1.5"/><circle cx="110" cy="135" r="55" fill="#2a78d6" fill-opacity=".35" stroke="#2a78d6" stroke-width="1.5"/><circle cx="210" cy="135" r="55" fill="#eb6834" fill-opacity=".35" stroke="#eb6834" stroke-width="1.5"/><text x="110" y="140" font-size="18" fill="#2a78d6" text-anchor="middle" font-weight="700">A</text><text x="210" y="140" font-size="18" fill="#eb6834" text-anchor="middle" font-weight="700">B</text><text x="160" y="240" font-size="12.5" fill="#1f1f1d" text-anchor="middle" font-weight="700">P(A∩B)＝0（重なりが無い）</text><text x="160" y="258" font-size="11.5" fill="#e34948" text-anchor="middle">→ Aが起きたらBは必ず起きない＝強く依存</text><rect x="370" y="50" width="220" height="170" rx="4" fill="#f4f3ef" stroke="#e4e3df" stroke-width="1.5"/><rect x="370" y="50" width="88" height="170" fill="#2a78d6" fill-opacity=".3"/><rect x="370" y="50" width="220" height="85" fill="#eb6834" fill-opacity=".3"/><rect x="370" y="50" width="88" height="85" fill="#6250d6" fill-opacity=".25" stroke="#6250d6" stroke-width="1.5"/><text x="414" y="182" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="700">A＝0.4</text><text x="524" y="98" font-size="12" fill="#eb6834" text-anchor="middle" font-weight="700">B＝0.5</text><text x="414" y="98" font-size="13" fill="#6250d6" text-anchor="middle" font-weight="700">0.2</text><text x="480" y="240" font-size="12.5" fill="#1f1f1d" text-anchor="middle" font-weight="700">P(A∩B)＝0.4×0.5＝0.2</text><text x="480" y="258" font-size="11.5" fill="#5c5b57" text-anchor="middle">Aの中でもBの割合は 0.2/0.4＝0.5（変わらない）</text></svg>